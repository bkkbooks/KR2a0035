body:
  text: 金史卷六十九列傳第七太祖諸子宗雋本名訛魯觀宗傑本名沒里野宗強本名阿魯爽本名阿鄰可喜阿瑣宗敏本名阿魯補元太祖聖穆皇后生景宣帝豐王烏烈趙王宗傑光懿皇后生遼王宗幹欽憲皇后生宋王宗望陳王宗雋瀋王訛魯宣獻皇后生睿宗豳王訛魯𩽆元妃烏古論氏生梁王宗弼衛王宗強蜀王宗敏崇妃蕭氏生紀王習泥烈息王寧吉莒王燕孫娘子獨奴可生鄴王斡忽宗幹宗望宗弼自有傳宗雋本名訛魯觀天會十四年為東京留守天眷元年入朝與左副元帥撻懶建議以河南陝西地與宋俄為尚書左丞相加開府儀同三司兼侍中封陳王二年拜太保領三省事進封兗國王既而以謀反誅宗傑本名沒里野天會五年薨天會十三年諡孝悼天眷元年追封越王以其長子奭為會寧牧封鄧王後為上京留守再改燕京西京皇統三年薨子阿楞撻楞海陵為相將謀弒立搆而殺之海陵篡立並殺宗傑妻大定間贈宗傑太師進封趙王宗強本名阿魯天眷元年封紀王三年代宗固為燕京留守封衛王太師皇統二年十月薨輟朝七日喪至上京上親臨哭之慟仍親視喪事子阿鄰可喜阿瑣爽本名阿鄰天德三年授世襲猛安正隆二年除橫海軍節度使改安武軍留京師奉朝請海陵將伐宋嚴酒禁爽坐與其弟阿瑣及從父兄京徒單貞會飲被杖下遷歸化州刺史奪猛安未幾復除安武軍節度使海陵渡淮分遣使者翦滅宗室爽憂懼不知所出會世宗即位東京宗室璋推爽弟阿瑣行中都留守遣人報爽爽棄妻子來奔與弟欣州刺史可喜俱至中都東迎車駕至梁魚務入見世宗大悅即除殿前馬步軍都指揮使封溫王改祕書監母憂尋起復遷太子太保進封壽王頃之世宗第五女蜀國公主下嫁唐括鼎賜宴神龍殿謂爽曰朕與卿兄弟在正隆時朝夕常懼不保豈意今日賴爾兄弟之福可以享安樂矣爽泣下頓首謝未幾判大宗正事太子太保如故爽有疾詔除其子符寶祗候思列為忠順軍節度副使爽入謝上曰朕以卿疾使卿子遷官冀卿因喜而愈也思列年少未間政事卿訓以義方使有善可稱別加升擢爽疾少間將從上如涼陘賜錢千萬進封英王轉太子太傅復世襲猛安進封榮王改太子太師顯宗長女鄴國公主下嫁烏古論誼賜宴慶和殿爽坐西向迎夕照面發赤似醉上問曰卿醉邪對曰未也臣面迎日色非酒紅也上悅顧羣臣曰此弟出言未嘗不實自小如此因謂顯宗兄弟曰汝等可以為法以爽資用有闕特賜錢一萬貫二十三年爽疾久不愈敕有司曰榮王告滿百日當給以王俸既薨上悼痛輟朝遣官致祭賻銀千兩重綵四十端絹四百匹陪葬山陵親王百官送葬他日謂大臣曰榮王之葬朕以不果親送為恨其見友愛如此可喜以宗室子纍官唐括部族節度使降欣州刺史海陵遣使殺之可喜聞世宗即位即棄州來歸與其兄歸化州刺史阿鄰會于中都是時弟阿瑣權中都留守事可喜謂阿鄰曰阿瑣愚戇恐不能撫治欲少留以助之阿鄰乃行可喜留中都聞世宗發東京乃迎見于麻吉鋪除兵部尚書佩金牌將兵往南京行至中都聞南京已定遂止可喜材武過人狠戾好亂自以太祖孫頗有異志世宗初至中都倥偬多事扈從諸軍未暇行賞或有怨言昭武大將軍斡論正隆末被詔佩金牌取河南兵四百人監完顏彀英軍于歸化次彰德會獨吉和尚持大定赦文至和尚使人招之斡論不聽率兵來迎和尚亦以所將蒲輦兵列陳待之斡論兵皆不肯戰遂請降和尚邀之入相州收其甲兵置酒相勞斡論託腹疾不肯飲至夜已張燈時時出門與其心腹密謀欲就執和尚稍具弓矢和尚覺之佯為不知使其從者迫而伺之斡論不得發上至中都近郊斡論上謁上亦撫慰之斡論自慊初無降志及河南統軍司令史斡里𩽆為人狡險喜圖事斡論取兵于河南統軍使滿訛里也斡里𩽆與俱來俱不自安同知延安尹李惟忠與熙宗弒逆構殺韓王亨世宗疏斥之同知中都留守璋初自領其職因而授之完顏布輝為副統以罪解職居京師於是可喜斡論李惟忠斡里𩽆璋布輝謀欲因扈從軍士怨望作亂斡論曰押軍猛安沃窟剌必不違我惟忠曰惟忠嘗為神翼軍總管有兩銀牌尚在可以矯發內藏賞士萬戶高松與我舊必見聽衆曰若得此軍舉事無難矣斡論往約沃窟剌沃窟剌從之惟忠往說高松高松不聽語在松傳大定二年正月甲戌上謁山陵可喜中道稱疾而歸乙亥夜召斡論惟忠斡里𩽆璋布輝會其家沃窟剌以兵赴之璋曰今不得高松軍事不可成矣可喜璋布輝乃擒斡論惟忠斡里𩽆沃窟剌詣有司自首既下詔獄可喜不肯自言其始謀及與斡論面質然後款伏上念兄弟少太祖孫惟數人在惻然傷之詔罪止可喜一身其兄弟子孫皆不緣坐遂誅斡論惟忠斡里𩽆沃窟剌等其沃窟剌下謀克士卒皆釋之除璋彰化軍節度使布輝濬州防禦使辛巳詔天下是日賜扈從萬戶銀百兩猛安五十兩謀克絹十匹甲士絹五匹錢六貫阿里喜以下賜各有差阿瑣宗強之幼子也長身多力天德二年以宗室子授奉國上將軍纍加金吾衛上將軍居於中都海陵伐宋以左衛將軍蒲察沙離只同知中都留守事佩金牌守管籥世宗即位東京阿瑣與璋率守城軍官烏林答石家奴等入留守府殺沙離只府判抹撚撒離喝衆以阿瑣行留守事璋自署同知留守事即遣謀克石家奴烏林答願蒲察蒲查大興少尹李天吉子磐等奉表東京大定二年授橫海軍節度使賜以名鷹詔曰卿方年少宜自戒慎留心政事改武定軍以母憂去官起復興平軍節度使賜以襲衣馬遷廣寧尹坐贓一萬四千餘貫詔杖八十削兩階解職入見于常武殿上曰朕謂汝有才力使之臨民今汝在法當死朕以親親之故曲為全貸當思自今戒懼勿復使惡聲達于朕聽改平涼濟南尹卒官年三十七上命有司致祭賻銀千兩重綵四十端絹四百匹宗敏本名阿魯補天眷元年封邢王皇統三年為東京留守拜左副元帥兼會寧牧進拜都元帥兼判大宗正事再進太保領三省事兼左副元帥領行臺尚書省事封曹國王海陵謀弒立畏宗敏屬尊且材勇欲構誣以除之時熙宗屢殺大臣宗敏憂之謂海陵曰主上喜殘殺而國家事重奈何宗敏言時適左右無人海陵將以此為指斥構害之自念無證不可發乃止及弒熙宗使葛王召宗敏葛王者世宗初封也宗敏聞海陵召疑懼不敢往葛王曰叔父今不即往至明日如何與之相見宗敏入宮海陵欲殺之尚猶豫以問左右烏帶曰彼太祖子也不殺之衆人必有異議不如除之乃使僕散忽土殺之忽土刃擊宗敏宗敏左右走避膚髮血肉狼藉遍地葛王見殺宗敏問於衆曰國王何罪而死烏帶曰天許大事尚已行之此蟣蝨耳何足道者天德三年海陵追封宗敏為太師進封爵妃蒲察氏進國號封子撒合輦舒國公賜名褒進封王阿里罕封密國公正隆六年契丹撒八反海陵遣使殺諸宗室阿里罕遂見殺大定間詔復官爵胙王元景宣皇帝宗峻子也本名常勝為北京留守弟查剌為安武軍節度使皇統七年四月戊午左副點檢蒲察阿虎特子尚主進禮物賜宴便殿熙宗被酒酌酒賜元元不能飲上怒仗劍逼之元逃去命左丞宗憲召元宗憲與元俱去上益怒是時戶部尚書宗禮在側使之跪手殺之海陵與唐括辨謀廢立海陵曰若舉大事誰當立者海陵意謂己乃太祖長房之孫當立而辨與秉德初意不在海陵常勝乃熙宗之弟辨答曰無胙王常勝乎海陵復問其次辨曰鄧王子阿楞海陵曰阿楞屬疏由是海陵謂胙王有人望不除之將不得立故心忌常勝並阿楞是時阿楞方為奉國上將軍河南軍士孫進自稱皇弟按察大王熙宗疑皇弟二字或在常勝也使特思鞫之無狀特思乃嘗疑海陵與唐括辨時時竊議告之悼后者海陵知熙宗有疑常勝心因此可以除之謂熙宗曰孫進反有端不稱他人乃稱皇弟大王陛下弟止有常勝查剌特思鞫不以實故出之矣熙宗以為然使唐括辨蕭肄按問特思特思自誣服故出常勝罪於是乃殺常勝及其弟查剌並殺特思海陵乘此並擠阿楞殺之阿楞弟撻楞熙宗本無意殺之海陵曰其兄既已伏誅其弟安得獨存又殺之熙宗以海陵為忠愈益任之而不知其詐也海陵篡立追封常勝查剌阿楞官爵親臨葬所致祭大定十三年六月丁巳世宗召皇太子諸王侍食于清輝殿曰或稱海陵多能何也海陵譎詐睢盱殺人空虛天下三分之二太祖諸孫中惟胙王元天性賢者也元子育本名合住大定二十七年自南京副留守遷大宗正丞兼勸農副使上問宰臣曰合住為人如何平章政事襄參政宗浩對曰為人清廉幹治上曰乃父亦然又曰蒲陽溫胙王元外若愚訥臨事明敏過人朕於兄弟間於元尤款密贊曰太祖躬擐甲胄以定國家舉無遺策而諸子勇略材識足以遂父之志傳及太宗而諸孫享其成矣
