body:
  text: 金史卷四本紀第四熙宗熙宗弘基纘武莊靖孝成皇帝諱亶本諱合剌太祖孫景宣皇帝子母蒲察氏天輔三年己亥歲生天會八年諳班勃極烈杲薨太宗意久未決十年左副元帥宗翰右副元帥宗輔左監軍完顏希尹入朝與宗幹議曰諳班勃極烈虛位已久今不早定恐授非其人合剌先帝嫡孫當立相與請於太宗者再三乃從之四月庚午詔曰爾為太祖之嫡孫故命爾為諳班勃極烈其無自謂沖幼狎于童戲惟敬厥德諳班勃極烈者太宗嘗居是官及登大位以命弟杲杲薨帝定議為儲嗣故以是命焉十三年正月己巳太宗崩庚午即皇帝位甲戌詔中外詔公私禁酒癸酉遣使告哀于齊高麗夏及報即位仍詔齊自今稱臣勿稱子二月乙巳追諡太祖后唐括氏曰聖穆皇后裴滿氏曰光懿皇后追册太祖妃僕散氏曰德妃烏古論氏曰賢妃辛酉改葬太祖于和陵三月己卯齊高麗使來弔祭庚辰諡大行皇帝曰文烈廟號太宗乙酉葬太宗于和陵甲午以國論右勃極烈都元帥宗翰為太保領三省事封晉國王戊戌詔諸國使賜宴不舉樂四月戊午齊高麗遣使賀即位丙寅昏德公趙佶薨遣使致祭及賻贈是月甘露降于熊嶽縣五月甲申左副元帥宗輔薨九月壬申追尊皇考豐王為景宣皇帝廟號徽宗皇妣蒲察氏為惠昭皇后戊寅尊太祖后紇石烈氏太宗后唐括氏皆為太皇太后詔中外乙酉改葬徽宗及惠昭后于興陵十一月以尚書令宋國王宗磐為太師乙亥初頒曆己卯以元帥左監軍完顏希尹為尚書左丞相兼侍中太子少保高慶裔為左丞平陽尹蕭慶為右丞己丑建天開殿于爻剌十二月癸亥始定齊高麗夏朝賀賜宴朝辭儀以京西鹿囿賜農民十四年正月己巳朔上朝太皇太后于兩宮齊高麗夏遣使來賀癸酉頒曆于高麗丁丑太皇太后紇石烈氏崩乙酉萬壽節齊高麗夏遣使來賀上本七月七日生以同皇考忌日改用正月十七日二月癸卯上尊諡曰欽憲皇后葬睿陵三月壬午以太保宗翰太師宗磐太傅宗幹並領三省事丁酉高麗遣使來弔八月丙辰追尊九代祖以下曰皇帝皇后定始祖景祖世祖太祖太宗廟皆不祧癸亥詔齊國與本朝軍民訴訟相關者文移署年止用天會十月甲寅以吳激為高麗王生日使蕭仲恭為齊劉豫回謝並生日正旦使十五年正月癸亥朔上朝太皇太后于明德宮齊高麗夏遣使來賀初用大明曆己卯萬壽節齊高麗夏遣使來賀六月庚戌尚書左丞高慶裔轉運使劉思有罪伏誅七月辛巳太保領三省事晉國王宗翰薨丙戌夜京師地震封皇叔宗雋宗固叔祖暈皆為王丁亥汰兵興濫爵十月乙卯以元帥左監軍撻懶為左副元帥封魯國王宗弼右副元帥封瀋王知樞密院事兼侍中時立愛致仕十一月丙午廢齊國降封劉豫為蜀王詔中外置行臺尚書省于汴十二月戊辰劉豫上表謝封爵癸未詔改明年為天眷元年大赦命韓昉耶律紹文等編修國史以勗為尚書左丞同中書門下平章事徙蜀王劉豫臨潢府天眷元年正月戊子朔上朝明德宮高麗夏遣使來賀頒女直小字封大司空昱為王甲辰萬壽節高麗夏遣使來賀二月壬戌上如爻剌春水乙丑幸天開殿己巳詔罷來流水混同江護邏地與民耕牧三月庚寅以禁苑隙地分給百姓戊申以韓昉為翰林學士四月丁卯命少府監盧彥倫營建宮室止從儉素壬午朝享于天元殿立裴滿氏為貴妃五月己亥詔以經義詞賦兩科取士六月戊午上至自天開殿秋七月辛卯左副元帥撻懶東京留守宗雋來朝丁酉按出滸河溢壞廬舍民多溺死壬寅左丞相希尹罷八月甲寅朔頒行官制癸亥回鶻遣使朝貢己卯以河南地與宋以右司侍郎張通古等使江南以京師為上京府曰會寧舊上京為北京九月甲申朔以奭為會寧牧封鄧王乙未詔百官誥命女直契丹漢人各用本字渤海同漢人丁酉改燕京樞密院為行臺尚書省戊戌上朝明德宮甲辰以奕為平章政事己酉省燕中西三京平州東西等路州縣辛亥權行臺左丞相張孝純致仕十月甲寅朔以御前管勾契丹文字李德固為參知政事丙寅封叔宗強為紀王宗敏邢王太宗子斛魯補等十三人為王己巳始禁親王以下佩刀入宮辛未定封國制癸酉以東京留守宗雋為尚書左丞相兼侍中封陳王十一月丙辰以康宗以上畫像工畢奠獻于乾元殿十二月癸亥新宮成甲戌高麗遣使入貢丁丑立貴妃裴滿氏為皇后二年正月壬午朔高麗夏遣使來賀戊戌萬壽節高麗夏遣使來賀以左丞相宗雋為太保領三省事進封兗國王興中尹完顏希尹復為尚書左丞相兼侍中二月乙未上如天開殿三月丙辰命百官詳定儀制四月甲戌百官朝參初用朝服己卯宋遣使謝河南地五月戊子太白晝見乙巳上至自天開殿六月己酉朔初御冠服辛亥吳十謀反伏誅己未上從容謂侍臣曰朕每閲貞觀政要見其君臣議論大可規法翰林學士韓昉對曰皆由太宗溫顏訪問房杜輩竭忠盡誠其書雖簡足以為法上曰太宗固一代賢君明皇何如昉曰唐自太宗以來惟明皇憲宗可數明皇所謂有始而無終者初以艱危得位用姚崇宋璟惟正是行故能成開元之治末年怠于萬機委政李林甫姦諛是用以致天寶之亂苟能慎終如始則貞觀之風不難追矣上稱善又曰周成王何如主昉對曰古之賢君上曰成王雖賢亦周公輔佐之力後世疑周公殺其兄以朕觀之為社稷大計亦不當非也七月辛巳宋國王宗磐兗國王宗雋謀反伏誅丙戌以右副元帥宗弼為都元帥進封越國王丁亥以誅宗磐等詔中外己丑以左副元帥撻懶為行臺左丞相杜充為行臺右丞相蕭寶耶律暉行臺平章政事甲午咸州詳穩沂王暈坐與宗磐謀反伏誅辛丑以太傅領三省事宗幹為太師領三省如故進封梁宋國王八月辛亥行臺左丞相撻懶翼王鶻懶及活離胡土撻懶子斡帶烏達補謀反伏誅丁丑太白晝見九月戊寅朔降封太宗諸子大司空昱罷丙申初居新宮立太祖原廟于慶元宮壬寅宋遣王倫等乞歸父喪及母韋氏等拘倫不遣以溫都思忠諸路廉問十月癸酉夏國使來告喪十二月豫國公昱薨三年正月丁丑朔高麗夏遣使來賀癸巳萬壽節高麗夏遣使來賀以都元帥宗弼領行臺尚書省事四月乙巳朔溫都思忠廉問諸路得廉吏杜遵晦以下百二十四人各進一階貪吏張軫以下二十一人皆罷之癸丑蜀國公完顏銀术哥薨丁卯上如燕京五月丙子詔元帥府復取河南陝西地己卯詔册李仁孝為夏國王命都元帥宗弼以兵自黎陽趨汴右監軍撒離合出河中趨陝西是月河南平六月陝西平上次涼陘大旱使蕭彥讓田瑴決西京囚秋七月癸卯朔日有食之乙卯宗弼遣使奏河南陝西捷丁卯詔文武官五品以上致仕給俸祿之半職三品者仍給傔人八月辛巳招撫諭陝西五路壬午初定公主郡縣主及駙馬官品九月壬寅朔宗弼來朝戊申上至燕京己酉親饗太祖廟庚申宗弼還軍中夏國遣使謝賻贈癸亥殺左丞相完顏希尹右丞蕭慶及希尹子昭武大將軍把搭符寶郎漫帶戊辰夏國遣使謝封册十一月癸丑以孔子四十九代孫璠襲封衍聖公癸亥以都點檢蕭仲恭為尚書右丞前西京留守昂為平章政事甲子行臺尚書右丞相杜充薨十二月乙亥都元帥宗弼上言宋將嶽飛張俊韓世忠率衆渡江詔命擊之丁丑地震己亥以元帥左監軍阿離補為左副元帥右監軍撒離合為右副元帥皇統元年正月辛丑朔高麗夏遣使來賀庚戌羣臣上尊號曰崇天體道欽明文武聖德皇帝初御袞冕癸丑謝太廟大赦改元丁巳萬壽節高麗夏遣使來賀己未初定命婦封號夏國請置榷場許之己巳封平章政事昂為漆水郡王二月戊寅詔諸致仕官職俱至三品者俸祿人力各給其半宗弼克廬州乙酉改封海濱王耶律延禧為豫王昏德公趙佶為天水郡王重昏侯趙桓為天水郡公戊子上親祭孔子廟北面再拜退謂侍臣曰朕幼年遊佚不知志學歲月逾邁深以為悔孔子雖無位其道可尊使萬世景仰大凡為善不可不勉自是頗讀尚書論語及五代遼史諸書或以夜繼焉三月己未上宴羣臣于瑤池殿適宗弼遣使奏捷侍臣多進詩稱賀帝覽之曰太平之世當尚文物自古致治皆由是也四月丙子以濟南尹韓昉參知政事辛巳宗弼請伐江南從之五月己酉太師領三省事梁宋國王宗幹薨庚戌上親臨日官奏戌亥不宜哭泣上曰君臣之義骨肉之親豈可避之遂哭之慟命輟朝七日六月甲戌詔都元帥宗弼與宰執同入奏事庚寅行臺平章政事耶律暉致仕壬辰有司請舉樂上以宗幹新喪不允甲午衛王宗強薨上親臨輟朝如宗幹喪七月癸卯以景宣皇帝忌辰命尚食徹肉丙午以宗弼為尚書左丞相兼侍中都元帥領行臺如故己酉宗弼還軍中辛亥參知政事耶律讓罷九月戊申上至自燕京朝太皇太后于明德宮詔賜魚衆寡孤獨不能自存者人絹二匹絮三斤是秋蝗都元帥宗弼伐宋渡淮以書讓宋宋復書乞罷兵宗弼以便宜畫淮為界十一月己酉高麗國賀受尊號稽古殿火十二月癸巳夏國賀受尊號天水郡公趙桓乞本品俸詔賙濟之左丞勗進先朝實録三卷上焚香立受之二年正月乙未朔高麗夏遣使來賀己亥上獵于來流河乙巳命封高麗丁未上至自來流河辛亥萬壽節高麗夏遣使來賀壬子衍聖公孔璠薨子拯襲二月丁卯上如天開殿甲戌賑熙河路戊子皇子濟安生辛卯宋使曹勛來許歲幣銀絹二十五萬兩匹畫淮為界世世子孫永守誓言改封蜀王劉豫為曹王壬辰以皇子生赦中外三月辛丑還自天開殿大雪丙午以宗弼為太傅丙辰遣左宣徽使劉筈以袞冕圭册册宋康王為帝歸宋帝母韋氏及故妻邢氏天水郡王並妻鄭氏喪于江南戊午立子濟安為皇太子四月丙寅以臣宋告中外庚午五雲樓重明等殿成五月癸巳朔不視朝上自去年荒于酒與近臣飲或繼以夜宰相入諫輒飲以酒曰知卿等意今既飲矣明日當戒因復飲乙卯賜宋誓詔辛酉宴羣臣於五雲樓皆盡醉而罷七月甲午回鶻遣使來貢北京廣寧府蝗丁酉賜宗弼金券八月丁卯詔歸朱辨張邵洪皓于宋辛未復太宗子胡盧為王賑陝西九月壬辰詔給天水郡王子姪壻天水郡公子俸給十一月甲寅平章政事漆水郡王昂薨追封鄆王十二月乙丑高麗王遣使謝封册庚午宋遣使謝歸三喪及母韋氏壬申上獵于核耶呆米路癸未還宮甲申皇太子濟安薨三年正月己丑朔以皇太子喪不御正殿羣臣詣便殿稱賀宋高麗夏使詣皇極殿遙賀乙巳萬壽節如正旦儀三月辛卯以尚書左氶勗為平章政事殿前都點檢宗憲為尚書左丞丁酉太皇太后唐括氏崩己酉封子道濟為魏王五月丁巳朔京兆進瑞麥癸亥上致祭太皇太后甲申初立太廟社稷六月己酉初置驍毅軍七月丙寅上致祭太皇太后庚辰太原路進獬豸並瑞麥八月辛卯詔給天水郡王孫及天水郡公壻俸祿丙申老人星見乙巳諡太皇太后曰欽仁皇后戊申葬恭陵十二月癸未朔日有食之四年正月癸丑朔宋高麗夏遣使來賀甲寅詔以去年宋幣賜始祖以下宗室己未以宋使王倫為平州轉運使既受命復辭罪其反覆誅之乙丑陝西進嘉禾十有二莖莖皆七穗己巳萬壽節宋高麗夏遣使來賀乙亥上祭欽仁皇后哭盡哀二月癸未上如東京丙申次百泊河春水丁酉回鶻遣使來賀以粘合韓奴報之五月辛亥朔次薰風殿六月辛巳朔日有食之七月庚午建原廟于東京八月癸未殺魏王道濟九月乙酉上如東京壬子畋于沙河射虎獲之乙卯遣使祭遼主陵辛酉詔薰風殿二十里內及巡幸所過五里內並復一歲癸酉行臺左丞相張孝純薨十月壬辰立借貸飢民酬賞格甲辰以河朔諸郡地震詔復百姓一年其壓死無人收葬者官為斂藏之陝西蒲解汝蔡等處因歲飢流民典雇為奴婢者官給絹贖為良放還其鄉十一月己酉上獵于海島十二月甲午至東京五年正月丁未朔宋高麗夏遣使來賀癸亥萬壽節宋高麗夏遣使來賀二月乙未次濟州春水三月戊辰次天開殿五月戊午初用御製小字壬申以平章政事勗諫上為止酒仍布告廷臣六月乙亥朔日有食之八月戊戌發天開殿九月庚申至自東京十月辛卯增諡太祖閏月戊寅大名府進牛生麟壬辰懷州進嘉禾十二月戊申增諡始祖以下十帝及太宗徽宗丁巳赦六年正月辛未朔宋高麗夏遣使來賀壬申封太祖諸孫為王乙亥畋于謀勒甲申還京師丁亥萬壽節宋高麗夏遣使來賀庚寅以邊地賜夏國壬辰如春水帝從禽導騎誤入大澤中帝馬陷因步出亦不罪導者乙未封偎喝為王二月丙寅右丞相韓企先薨三月壬申以阿離補為行臺右丞相四月庚子朔上至自春水以同判大宗正事宗固為太保右丞相兼中書令戊午行臺右丞相阿離補薨五月壬申高麗王楷薨辛卯以左宣徽使劉筈為行臺右丞相六月乙巳殺宇文虛中及高士談乙丑遣使弔祭高麗並起復嗣王晛九月戊辰朔以許王破汴睿宗平陝西鄭王克遼及婁室銀术可皆有大功並為立碑戊寅曹王劉豫薨是歲遣粘割韓奴招耶律大石被害七年正月乙丑朔宋高麗夏遣使來賀辛巳萬壽節宋高麗夏遣使來賀癸未以西京鹿囿為民田丁亥太白經天三月戊寅高麗遣使謝弔祭起復四月戊午宴便殿上醉酒殺戶部尚書宗禮六月丁酉殺橫海軍節度使田瑴左司郎中奚毅翰林待制邢具瞻及王植高鳳廷王效趙益興龔夷鑒等七月己巳太白經天曲赦畿內九月太保右丞相宗固薨以都元帥宗弼為太師領三省事都元帥行臺尚書省事如故平章政事勗為左丞相兼侍中都點檢宗賢為右丞相兼中書令行臺右丞相劉筈右丞蕭仲恭為平章政事李德固為尚書右丞祕書監蕭肄為參知政事十月壬子平章行臺尚書省事奚寶薨十一月癸酉以工部侍郎僕散太彎為御史大夫乙亥兵部尚書秉德進三角羊己卯詔減常膳羊豕五之二癸未以尚書左丞宗憲為行臺平章政事同判大宗正事亮為尚書左丞十二月戊午參知政事韓昉罷兵部尚書秉德為參知政事八年正月庚申朔宋高麗夏遣使來賀丙子萬壽節宋高麗夏遣使來賀二月壬子以哥魯葛波古等為橫賜高麗夏國使甲寅以大理卿宗安等為高麗王晛封册使乙卯上如天開殿四月戊子朔日有食之辛丑遣參知政事秉德等廉察官吏庚戌至自天開殿甲寅遼史成六月乙卯平章政事蕭仲恭為行臺左丞相左丞亮為平章政事都點檢唐括辨為尚書左丞高麗王遣使謝封册七月乙亥御史大夫僕散太彎罷以侍衛親軍都指揮使阿魯帶為御史大夫戊寅以尚書左丞唐括辨奉職不謹杖之八月戊戌宗弼進太祖實録上焚香立受之庚子以尚書左丞相勗領行臺尚書省事右丞相宗賢為太保尚書左丞相丙午以行臺左丞相蕭仲恭為尚書右丞相閏月庚申宰臣以西林多鹿請上獵上恐害稼不允丙寅太廟成九月丙申尚書左丞唐括辨罷以左宣徽使稟為尚書左丞十月辛酉太師領三省事都元帥越國王宗弼薨十一月壬辰太白經天乙未左丞相宗賢左丞稟等言州郡長吏當並用本國人上曰四海之內皆朕臣子若分別待之豈能致一諺不云乎疑人勿使使人勿疑自今本國及諸色人量才通用之辛丑以尚書左丞相宗賢為左副元帥平章政事亮為尚書左丞相兼侍中參知政事秉德為平章政事庚戌左副元帥宗賢復為太保左丞相左副元帥如故十二月乙卯以右丞相蕭仲恭為太傅領三省事左丞相亮為尚書右丞相乙亥以左丞相宗賢為太師領三省事兼都元帥九年正月甲申朔宋高麗夏遣使來賀戊戌太師領三省事都元帥宗賢罷領行臺尚書省事勗為太師領三省事同判大宗正事充為尚書左丞相右丞相亮兼都元帥庚子萬壽節宋高麗夏遣使來賀壬寅左丞相充薨丙午以右丞相亮為左丞相判大宗正事宗本為尚書右丞相左副元帥宗敏為都元帥南京留守宗賢為左副元帥兼西京留守己酉宗賢復為太保領三省事二月甲寅會寧牧唐括辨復為尚書左丞尚書左丞稟為行臺平章政事三月癸未朔日有食之辛丑以司空宗本為尚書右丞相兼中書令左丞相亮為太保領三省事四月壬申夜大風雨雷電震壞寢殿鴟尾有火入上寢燒幃幔帝趨別殿避之丁丑有龍鬬於利州榆林河水上大風壞民居官舍瓦木人畜皆飄揚十數里死傷者數百人五月戊子以四月壬申丁丑天變肆赦命翰林學士張鈞草詔參知政事蕭肄擲其語以為誹謗上怒殺鈞是日曲赦上京囚庚寅出太保領三省事亮領行臺尚書省事戊申武庫署令耶律八斤妄稱上言宿直將軍蕭榮與胙王元為黨誅之六月己未以都元帥宗敏為太保領三省事兼左副元帥左丞相宗賢兼都元帥八月庚申以劉筈為司空行臺右丞相如故宰臣議徙遼陽勃海之民於燕南從之侍從高壽星等當遷訴於后后以白上上怒議者杖平章政事秉德殺左司郎中三合九月丙申以領行臺尚書省事亮復為平章政事戊戌以右丞相宗本為太保領三省事左副元帥宗敏領行臺尚書省事平章政事秉德為尚書左丞相兼中書令司空劉筈為平章政事庚子以御史大夫宗甫為參知政事十月乙丑殺北京留守胙王元及弟安武軍節度使查剌左衛將軍特思大赦癸酉以翰林學士京為御史大夫十一月癸未殺皇后裴滿氏召胙王妃撒卯入宮戊子殺故鄧王子阿懶達懶癸巳上獵于忽剌渾土溫遣使殺德妃烏古論氏及夾谷氏張氏十二月己酉朔上至自獵所丙辰殺妃裴滿氏於寢殿而平章政事亮因羣臣震恐與所親駙馬唐括辨寢殿小底大興國護衛十人長忽土阿里出虎等謀為亂丁巳以忽土阿里出虎當內直命省令史李老僧語興國夜二鼓興國竊符矯詔開宮門召辨等亮懷刀與其妹夫特厮隨辨入至宮門守者以辨駙馬不疑內之及殿門衛士覺抽刃劫之莫敢動忽土阿里出虎至帝前帝求榻上常所置佩刀不知已為興國易置其處忽土阿里出虎遂進弒帝亮復前手刃之血濺滿其面與衣帝崩時年三十一左丞相秉德等遂奉亮坐羅拜呼萬歲立以為帝降帝為東昏王葬于皇后裴滿氏墓中貞元三年改葬于大房山蓼香甸諸王同兆域大定初追諡武靈皇帝廟號閔宗陵曰思陵別立廟十九年升祔于太廟增諡弘基纘武莊靖孝成皇帝二十七年改廟號熙宗二十八年以思陵陝小改葬于峨眉谷仍號思陵詔中外贊曰熙宗之時四方無事敬禮宗室大臣委以國政其繼體守文之治有足觀者末年酗酒妄殺人懷危懼所謂前有讒而不見後有賊而不知馴致其道非一朝一夕故也
