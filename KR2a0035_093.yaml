body:
  text: 金史卷九十三列傳第三十一顯宗諸子琮瓌從彝從憲玠章宗諸子洪裕洪靖洪熙洪衍洪輝忒隣衞紹王子從恪宣宗三子莊獻太子玄齡守純獨吉思忠承裕僕散揆抹撚史扢搭宗浩顯宗孝懿皇后生章宗昭聖皇后生宣宗諸姬田氏生鄆王琮瀛王瓌霍王從彝劉氏生瀛王從憲王氏生溫王玠鄆王琮本名承慶母田氏其後封裕陵充華琮儀觀豐偉機警清辯性寬厚好學世宗選進士之有名行者納坦謀嘉教之女直小字及漢字皆通習及長輕財好施無慍色善吟詠不喜聞人過至于騎射繪塑之藝皆造精妙大定十八年封道國公二十六年加崇進章宗即位遷開府儀同三司封鄆王明昌元年授婆速路獲火羅合打世襲猛安留京師五年薨上輟朝親臨奠于殯所諡曰莊靖改莊惠瀛王瓌本名桓篤鄆王琮之同母弟也重厚寡言內行修飭工詩精于騎射書藝女直大小字大定二十二年封崇國公二十六年加崇進章宗即位遷開府儀同三司封瀛王明昌三年薨勅葬事所須皆從官給命工部侍郎胥持國等典喪事比葬帝三臨奠哭之慟諡曰文敬其後帝謂輔臣曰王性忠孝兄弟中最為善人故朕嘗令在左右溫王雖幼亦佳不二旬俱逝良可哀悼霍王從彝本名阿憐母田氏早卒溫妃石抹氏養為己子大定二十五年封宿國公加崇進二十六年賜名瓚章宗即位封沂王明昌元年諭旨有司曰豐鄆瀛沂四王府各賜奴婢七百人四年詔追封故魯王孰輦為趙王以從彝為趙王後承安元年為兵部尚書改封蔡四年除祕書監泰和五年賜今名八年封霍貞祐二年薨瀛王從憲本名吾里不母劉氏後封裕陵茂儀大定二十六年賜名琦章宗即位加開府儀同三司封壽王承安元年以郊祀恩進封英四年改封瀛泰和五年更賜今名六年授祕書監八年薨從憲風儀秀峙性寬厚善騎射待府僚以禮秩滿去者皆有贐帝尤愛重初以病聞即臨問之賜錢五百萬還宮詔府僚上其疾增損狀仍勅門司夜一鼓即奏比五更重言之及薨上哭之慟為輟朝臨奠者再諭旨判大睦親府事宛王永升曰瀛王家事叔宜規畫聞其二姬方孕若生子即以付之以右宣徽使移剌都護其喪葬歛以內庫之服其餘所須亦從官給諡曰敦懿溫王玠本名謀良虎母王氏後封裕陵婉儀玠幼穎秀性溫厚好學大定二十九年章宗即位加開府儀同三司封溫王明昌三年薨年十一訃聞上為輟朝親臨奠哭之諡曰悼敏章宗欽懷皇后生絳王洪裕資明夫人林氏生荊王洪靖諸姬生榮王洪熙英王洪衍壽王洪輝元妃李氏生葛王忒隣洪裕大定二十六年生是時顯宗薨逾年世宗深感及聞皇曾孫生喜甚滿三月宴于慶和殿賜曾孫金鼎金香合重綵二十端骨覩犀吐鶻玉山子兔兒垂頭一副名馬二匹章宗進玉雙駝鎮紙玉琵琶撥玉鳳鈎骨覩犀具佩刀衣服一襲世宗御酒歌歡乙夜方罷二十八年十月丙寅薨明昌三年追封絳王賜名洪靖本名阿虎懶明昌三年生生而警秀上所鍾愛四年薨承安四年追封荊王賜名加開府儀同三司洪熙本名訛魯不明昌三年生未彌月薨承安四年追封榮王賜名加開府儀同三司洪衍本名撒改明昌四年生未幾薨承安四年追封英王賜名加開府儀同三司洪輝本名訛論承安二年五月生彌月封壽王閏六月壬午病急風募能醫者加宣武將軍賜錢五百萬甲申疾愈印無量壽經一萬卷報謝衍慶宮作普天大醮七日無奏刑名仍禁屠宰十月丁亥薨備禮葬忒隣泰和二年八月生上久無皇嗣祈禱于郊廟衍慶宮亳州太清宮至是喜甚彌月將加封三等國號無愜上意者念世宗在位最久年最高初封葛王遂封為葛王十二月癸酉生滿百日放僧道度牒三千道設醮玄真觀宴于慶和殿百官用天壽節禮儀進酒稱賀三品以上進禮物泰和三年薨衞紹王六子大定二十六年賜名猛安曰琚按出曰瑄按辰曰璪泰和七年詔按辰出繼鄭王永蹈後詔曰朕追惟鄭邸誤蹈非彝藁窆原野多歷歲年怛然軫懷有不能已乃詔追復王爵備禮改葬今稽式古典命汝為鄭王後守其祭祀大安元年封子六人為王從恪胙王有任王鞏王餘弗傳是歲從恪為左丞相二年八月立從恪為皇太子至寧末胡沙虎殺衞王從恪兄弟皆廢居中都貞祐二年徙鄭州四年徙居南京天興元年崔立以從恪為梁王汴京破死焉贊曰章宗晚年繼嗣不立遂屬意衞紹王衞紹歷年不永諸子凡禁錮二十餘年鎬厲王諸子禁錮四十餘年長女魚眾男皆不得婚嫁天興初方弛其禁金亡祚後可知矣莊獻太子名守忠宣宗長子也其母未詳說在王后傳胡沙虎既廢衞王時上未至即迎守忠入居東宮貞祐元年閏九月甲申立為皇太子詔曰朕以眇躬嗣服景命念祖宗之遺統方夙夜以靡遑將上以承九廟之靈而下以係多方之望皇太子守忠性秉溫良地居長嫡以次第言之則宜升儲嗣以典禮質之則足愜羣情其立為皇太子十月己未以鎮國上將軍太子少保阿魯罕為太子少師庚申上遣諭曰朕宮中每事裁減汝亦宜知時難斟酌撙節也又謂曰時方多艱每事當從貶損吾已放宮人百餘矣東宮無用者亦宜出之汝讀書人必能知此也二年四月宣宗遷汴留守中京七月召至汴三年正月薨上臨奠殯所凡四次四月葬迎朔門外五里諡莊獻五月立其子鏗為皇太孫始二歲十二月薨四年正月賜諡冲懷太孫玄齡或曰莊獻太子母弟早卒未封爵或曰麗妃史氏所生荊王守純本名盤都宣宗第二子也母曰真妃龐氏貞祐元年封濮王二年為殿前都點檢兼侍衞親軍都指揮使權都元帥上諭帥府曰濮王年幼公事殊未諳卿等毋以朕子故不相規戒凡見將校令謙和接遇可也三年為樞密使四年拜平章政事興定元年授世襲東平府路三屯猛安三年以知管差除令史梁瓛誤書轉運副使張正倫宣命奏乞治罪上曰令史有犯宰臣自當治之何必關朕耶是年三月進封英王時監察御史程震言其不法宣宗切責杖司馬及大奴尤不法者數人四年九月守純欲發丞相高琪罪密召知案蒲鮮石魯剌令史蒲察胡魯員外郎王阿里謀之且屬令勿泄而石魯剌胡魯輒以告都事僕散奴失不奴失不白高琪及高琪伏誅守純劾三人者泄密事奴失不免死除名石魯剌胡魯各杖七十勒停元光二年三月壬子上戒諭守純曰始吾以汝為相者庶幾相輔不至為人譏病耳汝乃惟飲酒耽樂公事漫不加省何耶吾常聞人言己過雖自省無之亦未敢容易去懷也又曰吾所以責汝者但以崇飲不事事之故汝勿過慮遂至奪權今諸相皆老臣每事與之商略使無貽物議足矣是年十二月庚寅宣宗病喉痺危篤將夕守純趣入侍哀宗後至東華門已閉聞守純在宮分遣樞密院官及東宮親衞軍總領移剌蒲阿集軍三萬餘屯東華門外部署定扣門求見都點檢駙馬都尉徒單合住奏中宮得旨領符鑰開門哀宗入宰相把胡魯已遣人止丞相高汝礪不聽入宮以護衞四人監守純於近侍局是夕宣宗崩明日哀宗即位正大元年正月進封荊王罷平章政事判睦親府封真妃龐氏為荊國太妃三月或告守純謀不軌下獄推問慈聖宮皇太后有言於帝由是獲免語在皇后傳守純三子長曰訛可封肅國公天興元年三月進封曹王出質於軍前次曰某封戴王次曰孛德封鞏王天興初守純府第產肉芝一株高五寸許色紅鮮可愛既而枝葉津流濡地成血臭不可聞剷去復生者再夜則房榻間羣狐號鳴秉燭逐捕則失所在未幾訛可出質哀宗遷歸德明年正月崔立亂四月癸巳守純及諸宗室皆死青城贊曰詩云天難忱斯不易維王天位殷適使不挾四方信哉守忠立為太子未幾而薨其子鏗立又薨哀宗復乏嗣豈非天乎正大間國勢日蹙本支殆盡哀宗尚且踈忌骨肉非明惠之賢荊王幾不能免豈宗子維城之道哉獨吉思忠本名千家奴明昌六年為行省都事累遷同簽樞密院事承安三年除興平軍節度使改西北路招討使初大定間修築西北屯戍西自坦舌東至胡烈么幾六百里中間堡障工役促迫雖有牆隍無女牆副堤思忠增繕用工七十五萬止用屯戍軍卒役不及民上嘉其勞賜詔奬諭曰直乾之維搤邊之要正資守備以靖翰藩垣壘弗完營屯未固卿督茲事役唯用戍兵民不知勞時非淹久已臻休畢仍底工堅賴爾忠勤辦茲心畫有嘉乃力式副予懷賜銀五百兩重幣十端入為簽樞密院事轉吏部尚書拜參知政事泰和五年宋渝盟有端平章政事僕散揆宣撫河南揆奏宋人懦弱韓侂冑用事請遣使詰問上召大臣議左丞相宗浩曰宋久敗之國必不敢動思忠曰宋雖覊栖江表未嘗一日忘中國但力不足耳其後果如思忠策六年四月上召大臣議伐宋事大臣猶言無足慮者或曰鼠竊狗盜非用兵也思忠執前議曰不早為之所彼將誤也上深然之七年正月元帥左監軍紇石烈執中圍楚州久不能下宰臣奏請命大臣節制其軍及益兵攻之思忠請行上曰以執政將兵攻一小州克之亦不武乃用唐宰相宣慰諸軍故事以思忠充淮南宣慰使持空名宣勅賞立功者詔大臣宿于祕書監各具奏帖以聞明日詔百官集議于廣仁殿問對者久之既而宋人來請和議遂寢頃之進拜尚書右丞大安初拜平章政事三年與參知政事承裕將兵屯邊方繕完烏沙堡思忠等不設備大元前兵奄至取烏月營思忠不能守乃退兵思忠坐解職衞紹王命參知政事承裕行省既而敗績于會河堡云承裕本名胡沙頗讀孫吳書以宗室子充符寶祗候除中都左警巡副使通括戶籍百姓稱其平遷殿中侍御史改右警巡使彰德軍節度副使刑部員外郎轉本部郎中歷會州惠州刺史遷同知臨潢府事改東北路招討副使以病免起為西南招討副使泰和六年伐宋遷陝西路統軍副使俄改通遠軍節度使陝西兵馬都統副使與秦州防禦使完顏璘屯成紀界宋吳曦兵五萬由保岔姑蘇等谷襲秦州承裕璘以騎兵千餘人擊走之追奔四十里凡六戰宋兵大敗斬首四千餘級詔承裕曰昔乃祖乃父戮力戎旅汝年尚少善於其職故命汝與完顏璘同行出界昔汝自言得兵三萬足以辦事今以石抹仲溫术虎高琪及青宜可與汝軍相合計可六萬斯亦足以辦矣仲溫高琪兵道險阻汝兵道甚易也自秦州至仙人關纔四百里耳從長計畫以副朕意詔完顏璘曰汝向在北邊以幹勇見稱頃以過失逮問有司近知與宋人奮戰故特赦免仍充副統如能佐承裕立功業朕於官賞豈復吝惜聞汝臨事頗黠若復自速罪且不赦汝矣宋吳曦使其將馮興楊雄李珪以步騎八千入赤谷承裕璘及河州防禦使蒲察秉鉉逆擊破之宋步兵保西山騎兵走赤谷承裕遣部將唐括按荅海率騎二百馳擊宋步兵甲士蒙括挺身先入乘之宋步兵大潰追奔至皂郊城斬二千餘級猛安把添奴追宋騎兵殺千餘人斬楊雄李珪于陣馮興僅以身免承裕進兵克成州八年罷兵遷河南東路統軍使兼知歸德府事俄改知臨潢府事賜金帶重幣十端銀百五十兩大安初召為御史中丞三年拜參知政事與平章政事獨吉思忠行省戍邊烏沙堡之役不為備失利朝廷獨坐思忠詔承裕主兵事八月大元大兵至野狐嶺承裕喪氣不敢拒戰退至宣平縣中土豪請以土兵為前鋒以行省兵為聲援承裕畏怯不敢用但問此去宣德間道而已土豪嗤之曰溪澗曲折我輩諳知之行省不知用地利力戰但謀走耳今敗矣其夜承裕率兵南行大元兵踵擊之明日至會河川承裕兵大潰承裕僅脫身走入宣德大元游兵入居庸關中都戒嚴識者謂金之亡決於是役衞紹王猶薄其罪除名而已崇慶元年起為陝西安撫使至寧元年遷元帥右監軍兼咸平府路兵馬都總管與契丹留可戰敗績改同判大睦親府事遼東宣撫使貞祐初改臨海軍節度使卒贊曰曹劌有言一鼓作氣再而衰三而竭夫兵以氣為主會河堡之役獨吉思忠承裕沮喪不可復振金之亡國兆於此焉僕散揆本名臨喜其先上京人左丞相兼都元帥沂國武莊公忠義之子也少以世冑選為近侍奉御大定十五年尚韓國大長公主擢器物局副使特授臨潢府路赫沙阿世襲猛安歷近侍局副使尚衣局使拱衞直副都指揮使為殿前左衞將軍罷職世宗諭之曰以汝宣獻皇后之親故令尚主置之宿衞謂當以忠孝自勵日者乃與外人竊議汝腹中事朕不能測其罷歸田里尋起為灤州刺史改蠡州入為兵部侍郎大理卿刑部尚書章宗即位出為泰定軍節度使改知臨洮府事以政蹟聞升河南路統軍使陝西提刑司舉揆剛直明斷獄無寃滯禁戢家人百姓莫識其面積石洮二州舊寇皆遁商旅得通於是進官一階仍詔褒諭明昌四年鄭王永蹈謀逆事覺揆坐嘗私品藻諸王獨稱永蹈性善靜不好事乃免死除名未幾復五品階起為同知崇義軍節度使事以戰功遷西北路副招討進官七階賜金馬盂一銀二百兩重綵一十端復以戰功升西南路招討使兼天德軍節度使賜金五十兩重綵一十端復出禦邊嘗轉戰出塞七百里至赤胡覩地而還優詔褒諭遷一官仍許其子安貞尚邢國長公主且許揆入謝禮成歸鎮會韓國大長公主薨揆來赴上諭之曰北邊之事非卿不能辦乃賜戰馬二即日遣還揆沿徼築壘穿塹連亙九百里營柵相望烽候相應人得恣田牧北邊遂寧復以手詔褒諭且欲大用以知興中府事紇石烈子仁代之勅盡以方略授子仁既入拜參知政事改授中都路胡土愛割蠻世襲猛安進拜尚書右丞尋出經略邊事還拜平章政事封濟國公泰和五年宋人渝盟以揆為宣撫河南軍民使上諭之曰朕即位以來任宰相未有如卿之久者若非君臣道合一體同心何以及此先丞相亦嘗總師南邊効力先朝今復委卿諒無過舉朕非好大喜功務要寧靜內外宋人屈服無復可議若恬不改可整兵渡淮掃蕩江左以繼爾先公之功即以尚竹罒戊名馬玉束帶內府重綵及御藥賜之揆至汴蒐練將士軍聲大振會天壽節特遣其子安貞賜宴且命持白玉杯以飲揆及上秋獵所親獲鹿尾舌為賜宋人服罪即罷宣撫使召揆還六年春宋人復數路來侵取泗州取靈璧圍壽春命揆為左副元帥以討之揆至軍前集諸將校告以朝廷弔伐之意分遣將士禦敵復取臨淮蘄縣而符離壽春之圍亦解去敵屢敗衂悉遁出境上即遣提點近侍局烏古論慶壽持手詔勞問征討事宜仍賜玉具劍一玉荷蓮盞一金器一百兩重綵一十端尋復以詔褒諭賜玉鞍勒馬二及玉具佩刀內府重綵御藥以旌其功宋人既敗退上欲進討乃召揆赴闕戒以師期宴于慶和殿親諭之曰朕以趙擴背盟侵我疆埸命卿措畫曾未期月諸處累報大捷振我國威挫彼賊鋒皆卿之力朕不能忘是日寵錫甚厚特收其次子寧壽為奉御乃密授以成算俾還軍十月揆總大軍南伐分兵為九路進揆以行省兵三萬出潁壽至淮宋人旅拒于水南揆密遣人測淮水惟八疊灘可涉即遣奧屯驤揚兵下蔡聲言欲渡宋帥何汝礪姚公佐悉銳師屯花靨以備揆乃遣右翼都統完顏賽不先鋒都統納蘭邦烈潛渡八疊駐南岸揆麾大軍直壓其陣敵不虞我卒至皆潰走自相蹂踐死于水者不可勝計進奪潁口下安豐軍遂攻合肥取滁州盡獲其軍實上遣使諭之曰前得卿奏先鋒已奪潁口偏師又下安豐斬馘之數各以萬計近又西帥奏捷棗陽光化既為我有樊城鄧城亦自潰散又聞隨州闔城歸順山東之衆久圍楚州隴右之師剋期出界卿提大兵攻合肥趙擴聞之料已破膽失其神守度彼之計乞和為上昔嘗畫三事付卿以今事勢計之徑渡長江亦其時矣淮南既為我有際江為界理所宜然如使趙擴奉表稱臣歲增貢幣縛送賊魁還所俘掠一如所諭亦可罷兵卿宜廣為渡江之勢使彼有必死之憂從其所請而縱之僅得餘息偷生豈敢復萌他慮卿於此時經營江北勞徠安集除其虐政橫賦以良吏撫字疲民以精兵分守要害雖未係趙擴之頸而朕前所畫三事上功已成矣前入見時已嘗議定今復諄諄者欲決卿成功爾機會難遇卿其勉之既而宋帥丘䥩果奉書乞和揆以前五事諭而遣之復進軍圍和州敵以騎萬五千駐六合揆偵知之即以右翼掩擊斬首八千級進屯于瓦梁河以控真揚諸路之衝乃整列軍騎畢張旗幟沿江上下皆金兵焉於是江表震恐宋真州兵數萬保河橋復遣統軍紇石烈子仁往攻之分軍涉淺潛出敵後敵見之大驚不戰而潰斬首二萬餘級生擒其帥劉侹常思敬蕭從德莫子容皆宋驍將也遂下真州宋復遣陳璧來告和揆以乞辭未誠徒欲緩師卻之宋人既喪敗不獲請成乃決巨勝成公雷塘渚積水以為阻盡焚其廬舍儲積過江遁去揆以方春地濕不可久留且欲休養士馬遂振旅而還次下蔡遇疾詔遣宣徽使李仁惠及其子寧壽引太醫診視仍遣中使撫問泰和七年二月薨訃聞上哀悼之輟朝遣使迎喪殯于都城之北百官會弔車駕臨奠哭之賻銀一千五百兩重幣五十端絹五百疋其葬祭物皆從官給諡曰武肅揆體剛內和與物無忤臨民有惠政其為將也軍門鎮靜賞罰必行初渡淮即命徹去浮梁所至皆因糧于敵無餽運之勞未嘗輕用士卒而與之同甘苦人亦樂為之用故南征北伐為一名將云抹撚史扢搭臨潢路人也其先以功授世襲謀克史扢搭幼襲爵守邊有勞泰和六年南鄙用兵授同知蔡州防禦使事五月宋將李爽圍壽州田俊邁陷蘄縣平章政事僕散揆謂諸將曰符離彭城齊魯之蔽符離不守是無彭城彭城陷則齊魯危矣乃遣安國軍節度副使納蘭邦烈與史扢搭以精騎三千戍宿州俊邁果率步騎二萬來襲邦烈史扢搭逆擊大破之邦烈中流矢宋郭倬李汝翼以衆五萬繼至遂圍城攻之甚力城中叢射敵不能逼會淫雨潦溢敵露處勞倦邦烈遣騎二百潛出敵後突擊之敵亂史扢搭率騎蹂之殺傷數千人敵復聞援軍將至遂夜遁邦烈史扢搭躡其後黎明合擊大破之獲田俊邁十月揆以行省兵三萬出潁壽史扢搭為驍騎將中軍副統克安豐軍戰霍丘花靨功居多十二月從攻和州中流矢卒史扢搭形不過中人而拳勇善鬬所用槍長二丈軍中號為長槍副統又工用手箭箭長不盈握每用百數散置鎧中遇敵抽箭以鞭揮之或以指鉗取飛擲數矢齊發無不中敵以為神其箭皆以智創雖子弟亦不能傳其法在北部守厭山營敵尤畏之不敢近及死將士皆惋惜之內族宗浩字師孟本名老昭祖四世孫太保兼都元帥漢國公昂之子也貞元中為海陵庶人入殿小底世宗即位遼陽昂遣宗浩馳賀世宗見之喜命充符寶祗候大定二年冬昂以都元帥置幕山東宗浩領萬戶從行仍授山東東路兵馬都總管判官丁父憂起復承襲因閔斡魯渾猛安授河南府判官以母喪解服闋授同知陝州防禦使事察廉能第一等進官一階陞同知彰化軍節度使事累遷同簽樞密院事改曷蘇舘節度使世宗謂宰臣曰宗浩有才幹可及者無幾二十三年徵為大理卿踰年授山東路統軍使兼知益都府事陛辭世宗諭之曰卿年尚少以卿近屬有治迹故以此授卿宜體朕意因賜金帶遣之二十六年為賜宋主趙生日使還授刑部尚書俄拜參知政事章宗即位出為北京留守三轉同判大睦親府事北方有警命宗浩佩金虎符駐泰州便宜從事朝廷發上京等路軍萬人以戍宗浩以糧儲未備且度敵未敢動遂分其軍就食隆肇間是冬果無警北部廣吉剌者尤桀驁屢脅諸部入塞宗浩請乘其春暮馬弱擊之時阻亦叛內族襄行省事于北京詔議其事襄以謂若攻破廣吉剌則阻無東顧憂不若留之以牽其勢宗浩奏國家以堂堂之勢不能掃滅小部顧欲藉彼為捍乎臣請先破廣吉剌然後提兵北滅阻章再上從之詔諭宗浩曰將征北部固卿之誠更宜加意毋致後悔宗浩覘知合底忻與婆速火等相結廣吉剌之勢必分彼既畏我見討而復掣肘仇敵則理必求降可呼致也因遣主簿撒領軍二百為先鋒戒之曰若廣吉剌降可就徵其兵以圖合底忻仍偵餘部所在速使來報大軍當進與汝擊破之必矣合底忻者與山只昆皆北方別部恃強中立無所覊屬往來阻廣吉剌間連歲擾邊皆二部為之也撒入敵境廣吉剌果降遂徵其兵萬四千騎馳報以待宗浩北進命人齎三十日糧報撒會于移米河共擊敵而所遣人誤入婆速火部由是東軍失期宗浩前軍至忒里葛山遇山只昆所統石魯渾灘兩部擊走之斬首千二百級俘生口車畜甚衆進至呼歇水敵勢大蹙於是合底忻部長白古帶山只昆部長胡必剌及婆速火所遣和火者皆乞降宗浩承詔諭而釋之胡必剌因言所部迪列土近在移米河不肯偕降乞討之乃移軍趨移米與迪列土遇擊之斬首三百級赴水死者十四五獲牛羊萬二千車帳稱是合底忻等恐大軍至西渡移米棄輜重遁去撒與廣吉剌部長忒里虎追躡及之於窊里不水縱擊大破之婆速火九部斬首溺水死者四千五百餘人獲駝馬牛羊不可勝計軍還婆速火乞內屬幷請置吏上優詔褒諭遷光祿大夫以所獲馬六千置牧以處之明年宴賜東北部尋拜樞密使封榮國公初朝廷置東北路招討司泰州去境三百里每敵入比出兵追襲敵已遁去至是宗浩奏徙之金山以據要害設副招討二員分置左右由是敵不敢犯會中都山東河北屯駐軍人地土不贍官田多為民所冒占命宗浩行省事詣諸道括籍凡得地三十餘萬頃還坐以倡女自隨為憲司所糾出知真定府事徙西京留守復為樞密使進拜尚書右丞相超授崇進時懲北邊不寧議築壕壘以備守戍廷臣多異同平章政事張萬公力言其不可宗浩獨謂便乃命宗浩行省事以督其役功畢上賜詔褒賚甚厚撒里部長括里入塞宗浩以兵追躡與僕散揆軍合擊之殺獲甚衆敵遁去詔徵還入見優詔奬諭躐遷儀同三司賜玉束帶一金器百兩重幣二十端進拜左丞相宋人畔盟王師南伐會平章政事揆病乃命宗浩兼都元帥往督進討宗浩馳至汴大張兵勢親赴襄陽巡師而還宋人大懼乃命知樞密院事張巖以書乞和宗浩以辭旨未順却之仍諭以稱臣割地縛送元謀姦臣等事巖復遣方信孺齎其主趙擴誓䤝來且言擴倂發三使將賀天壽節及通謝仍報其祖母謝氏殂致書于都元帥宗浩曰方信孺還遠貽報翰及所承鈞旨仰見以生靈休息為重曲示包容矜軫之意聞命踊躍私竊自喜即具奏聞備述大金皇帝天覆地載之仁與都元帥海涵春育之德旋奉上旨亟遣信使通謝宸庭仍先令信孺再詣行省以請定議區區之愚實恃高明必蒙洞照重布本末幸垂聽焉兵端之開雖本朝失于輕信然痛罪姦臣之蔽欺亦不為不早自去歲五月編竄鄧友龍六月又誅蘇師旦等是時大國尚未嘗一出兵也本朝即捐已得之泗州諸軍屯于境外者盡令徹戍而南悔艾之誠于茲可見惟是名分之諭今昔事殊本朝皇帝本無佳兵之意況關繫至重又豈臣子之所敢言江外之地恃為屏蔽儻如來諭何以為國大朝所當念察至于首事人鄧友龍等誤國之罪固無所逃若使執縛以送是本朝不得自致其罰于臣下所有歲幣前書已增大定所減之數此在上國初何足以為重輕特欲藉手以見謝過之實儻上國諒此至情物之多寡必不深計矧惟兵興以來連歲創殘賦入屢蠲若又重取于民豈基元元無窮之困竊計大朝亦必有所不忍也於通謝禮幣之外別致微誠庶幾以此易彼其歸投之人皆雀鼠偷生一時竄匿往往不知存亡本朝既無所用豈以去來為意當隆興時固有大朝名族貴將南來者洎和議之定亦嘗約各不取索況茲瑣瑣誠何足云儻大朝必欲追求尚容拘刷至如泗州等處驅掠人悉當護送歸業夫締新好者不念舊惡成大功者不較小利欲望力賜開陳捐棄前過闊略他事玉帛交馳歡好如初海內寧謐長無軍兵之事功烈昭宣德澤洋溢鼎彝所紀方冊所載垂之萬世豈有既乎重惟大金皇帝誕節將臨禮當修賀兼之本國多故又言合遣人使接續津發已具公移企望取接伏冀鑒其至再至三有加無已之誠亟踐請盟之諾即底于成感戴恩德永永無極誓書副本慮往復遷延就以錄呈初信孺之來自以和議遂成輒自稱通謝使所參議官大定中宋人乞和以王抃為通問使所參議官信孺援以為例宗浩怒其輕妄囚之以聞朝廷亦以其為行人而不能孚兩國之情將留之遣使問宗浩宗浩曰今信孺事既未集自知還必得罪拘之適使他日有以藉口不若數其恌易而釋遣之使歸自窮無辭以白其國人則擴侂冑必擇謹厚者來矣於是遣之而復張巖書曰方信孺重以書來詳味其辭於請和之意雖若婉遜而所畫之事猶未悉從惟言當還泗州等驅掠而已至於責貢幣則欲以舊數為增追叛亡則欲以橫恩為例而稱臣割地縛送姦臣三事則並飾虛說弗肯如約豈以為朝廷過求有不可從將度德量力足以背城借一與我軍角一日勝負者哉既不能強又不能弱不深思熟慮以計將來之利害徒以不情之語形于尺牘而勤郵傳何也兵者凶器佳之不祥然聖人不得已而用之故三皇五帝所不能免夫豈不以生靈為念蓋犯順負義有不可恕者乃者彼國犯盟侵我疆埸帥府奉命征討雖未及出師姑以逐處戍兵隨宜捍禦所向摧破莫之敢當執俘折馘不可勝計餘衆震懾靡然奔潰是以所侵疆土旋即底平爰及泗州亦不勞而復今乃自謂捐其已得歛軍徹戍以為悔過之効是豈誠實之言據陝西宣撫司申報今夏宋人犯邊者十餘次並為我軍擊退梟斬捕獲蓋以億計夫以悔艾罪咎移書往來丐和之間乃暗遣賊徒突我守圉冀乘其不虞以徼倖毫末然則所為來請和者理安在哉其言名分之諭今昔事殊者蓋與大定之事固殊矣本朝之於宋國恩深德厚莫可殫述皇統謝章可概見也至于世宗皇帝俯就和好三十年間恩澤之渥夫豈可忘江表舊臣于我大定之初以失在正隆致南服不定故特施大惠易為姪國以鎮撫之今以小犯大曲在於彼既以絕大定之好則復舊稱臣於理為宜若為非臣子所敢言在皇統時何故敢言而今獨不敢是又誠然乎哉又謂江外之地將為屏蔽割之則無以為國夫藩籬之固當守信義如不務此雖長江之險亦不可恃區區兩淮之地何足屏蔽而為國哉昔江左六朝之時淮南屢嘗屬中國矣至後周顯德間南唐李景獻廬舒蘄黃畫江為界是亦皆能為國既有如此故實則割地之事亦奚不可自我師出疆所下州軍縣鎮已為我有未下者即當割而獻之今方信孺齎到誓書乃云疆界並依大國皇統彼之隆興年已畫為定若是則既不言割彼之地又翻欲得我之已有者豈理也哉又來書云通謝禮幣之外別備錢一百萬貫折金銀各三萬兩專以塞再增幣之責又云歲幣添五萬兩疋其言無可准況和議未定輒前具載約擬為誓書又直報通謝等三番人使其自專如是豈協禮體此方信孺以求成自任臆度上國謂如此徑往則事必可集輕瀆誑紿理不可容尋具奏聞欽奉聖訓昔宣靖之際棄信背盟我師問罪嘗割三鎮以乞和今既無故興兵蔑棄信誓雖盡獻江淮之地猶不足以自贖況彼國嘗自言叔父姪子與君臣父子略不相遠如能依應稱臣即許以江淮之間取中為界如欲世為子國即當盡割淮南直以大江為界陝西邊面並以大軍已占為定據元謀姦臣必使縛送緣彼懇欲自致其罰可令函首以獻外歲幣雖添五萬兩疋止是復皇統舊額而已安得為增可令更添五萬兩疋以表悔謝之實向汴陽乞和時嘗進賞軍之物金五百萬兩銀五千萬表段𩹉絹各一百萬牛馬騾各一萬駝一千書五監今即江表一隅之地與昔不同特加矜憫止令量輸銀一千萬兩以充犒軍之用方信孺言語反覆不足取信如李大性朱致知李璧吳琯輩似乎忠實可遣詣軍前禀議據方信孺詭詐之罪過於胡昉然自古兵交使人容在其間姑放令回報伏遇主上聖德寬裕光大天覆地容包荒宥罪其可不欽承以仰副仁恩之厚儻猶有所稽違則和好之事勿復冀也夫宋國之安危存亡將繫于此更期審慮無貽後悔泰和七年九月薨于汴其後宋人竟請以叔為伯增歲幣備犒軍銀函姦臣韓侂冑蘇師旦首以獻而乞盟焉訃聞上震悼輟朝命其子宿直將軍天下奴奔赴喪所仍命葬畢持繪像至都將親臨奠以南京副留守張巖叟為勅祭兼發引使莒州刺史女奚列孛葛速為勅葬使仍摘軍前武士及旗鼓笛角各五十人外隨行親屬官員親軍送至葬所賻贈甚厚諡曰通敏贊曰金自宗弼渡江而還既而畫淮為界厥後海陵咈衆舉兵國用虛耗上下離心內難先作故世宗之初章宗之末有事于南皆非得已而詳問之使每先發焉侂冑狂謀誤國動非其時取敗宜也揆宗浩雖師出輒捷而行成之使不拒其來儀幣書辭抑揚增損之際有可藉口即許其平矣函首之事宋人亦欲因是以自除其禍耳雖然揆宗浩常勝之家史扢搭驍勇之將三人相繼而死和議亦成天意蓋已休息南北之人歟
