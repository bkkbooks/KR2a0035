body:
  text: 金史卷一百三十列傳第六十八列女阿鄰妻李寶信妻韓慶民妻雷婦師氏康住住李文妻李英妻相琪妻阿魯真撒合輦妻許古妻馮妙真蒲察氏烏古論氏素蘭妻忙哥妻尹氏白氏聶孝女仲德妻寶符李氏張鳳奴附漢成帝時劉向始述三代賢妃淑女及淫泆奢僭興亡盛衰之所由彙分類別號列女傳因以諷諫范曄始載之漢史古者女子生十年有女師漸長有麻枲絲繭之事有祭祀助奠之事既嫁職在中饋而已故以無非無儀為賢若乃嫠居寡處患難顛沛是皆婦人之不幸也一遇不幸卓然能自樹立有烈丈夫之風是以君子異之阿鄰妻沙里質者金源郡王銀术可之妹天輔六年黃龍府叛卒攻鈔旁近部族是時阿鄰從軍沙里質糾集附近居民得男女五百人樹營柵為保守計賊千餘來攻沙里質以為甲以裳為旗男夫授甲婦女鼓譟沙里質仗劍督戰凡三日賊去皇統二年論功封金源郡夫人大定間以其孫藥師為謀克李寶信妻王氏寶信為義豐縣令張覺以平州叛王氏陷賊中賊欲逼室之王氏罵賊賊怒遂支解之大定十二年贈貞烈縣君韓慶民妻者不知何許人亦不知其姓氏慶民事遼為宜州節度使天會中攻破宜州慶民不屈而死以其妻配將士其妻誓死不從遂自殺世宗讀太宗實録見慶民夫婦事嘆曰如此節操可謂難矣雷婦師氏夫亡孝養舅姑姑病刲臂肉飼之姑即愈舅姑既歿兄師逵與夫姪規其財産乃偽立媒證致之官欲必嫁之縣官不能辨曲直師氏畏逼乃投縣署井中死詔有司祭其墓賜諡曰節康住住鄜州人夫早亡服闋父取之歸家許嚴沂為妻康氏誓死弗聽欲還夫家不可得乃投崖而死詔有司致祭其墓李文妻史氏同州白水人夫亡服闋誓死弗嫁父強取之歸許邑人姚乙為妻史氏不聽姚訴之官被逮遂自縊死詔有司致祭其墓李英妻張氏英初為監察御史在中都張居濰州貞祐元年冬大元兵取濰州入其家張氏盡以所有財物與之既而令張氏上馬張曰我盡以物與汝猶不見贖邪答曰汝品官妻當復為夫人張曰我死則為李氏鬼頓坐不起遂見殺追封隴西郡夫人諡莊潔英仕至御史中丞有傳相琪妻欒氏有姿色琪為萊州掖縣司吏貞祐三年八月紅襖賊陷掖縣琪與欒氏及子俱為所得賊見欒悅之殺琪及其子而誘欒欒奮起以頭觸賊而仆罵曰我豈為犬彘所汙者哉賊怒殺之追封西河縣君諡莊潔阿魯真宗室承充之女胡里改猛安夾谷胡山之妻夫亡寡居有衆千餘興定元年承充為上京元帥上京行省太平執承充應蒲鮮萬奴阿魯真治廢壘修器械積芻糧以自守萬奴遣人招之不從乃射承充書入城阿魯真得而碎之曰此詐也萬奴兵急攻之阿魯真衣男子服與其子蒲帶督衆力戰殺數百人生擒十餘人萬奴兵乃解去後復遣將擊萬奴兵獲其將一人詔封郡公夫人子蒲帶視功遷賞承充已被執乘間謂其二子女胡蒲速乃曰吾起身宿衛致位一品死無恨矣若輩亦皆通顯未嘗一日報國家當思自處以為後圖二子乃冒險自拔南走是年四月至南京獨吉氏平章政事千家奴之女護衛銀术可妹也自幼動有禮法及適內族撒合輦閨門肅如撒合輦為中京留守大兵圍之撒合輦疽發背不能軍獨吉氏度城必破謂撒合輦曰公本無功能徒以宗室故嘗在禁近以至提點近侍局同判睦親府今又為留守外路第一等官受國家恩最厚今大兵臨城公不幸病不能戰禦設若城破公當率精鋭奪門而出攜一子走京師不能則獨赴京師又不能戰而死猶可報國幸無以我為慮撒合輦出巡城獨吉氏乃取平日衣服葬具玩好布之臥榻資貨悉散之家人艷葬盛服過於平日且戒女使曰我死則扶置榻上以衾覆面四圍舉火焚之無使兵見吾面言訖閉門自經而死家人如言臥尸榻上以衾覆之撒合輦從外至家人告以夫人之死撒合輦拊榻曰夫人不辱我我肯辱朝廷乎因命焚之年三十有六少頃城破撒合輦率死士欲奪門出不果投壕水死有傳許古妻劉氏定海軍節度使仲洙之女也貞祐初古挈家僑居蒲城後留劉氏母子于蒲仕于朝既而兵圍蒲劉謂二女曰汝父在朝而兵勢如此事不可保若城破被驅一為所汙奈何不若俱死以自全已而攻城益急於是劉氏與二女相繼自盡有司以聞于朝四年五月追封劉氏為郡君諡曰貞潔其長女諡曰定薑次肅薑以其事付史館馮妙真刑部尚書延登之女也生十有八年適進士張慥興定五年慥為洛川主簿大元兵破葭州綏德遂入鄜延鄜人震恐具守備守臣以西路輸芻粟不時至檄慥詣平涼督之時延登為平涼行省員外郎慥欲偕妙真以往妙真辭曰舅姑老矣雖有叔姒妾能安乎子行妾留奉養十一月洛川破妙真從舅姑匿窟室兵索得之妙真泣與舅姑訣曰婦生不辰不得終執箕帚義不從辱即攜三子赴井死縣人從而死者數十人明年春慥發井得尸殯于縣之東郭外死時年二十四蒲察氏字明秀鄜州帥訥申之女完顏長樂之妻也哀宗遷歸德以長樂為總領將兵扈從將行屬蒲察氏曰無他言夫人慎毋辱此身明秀曰君第致身事上無以妾為念妾必不辱長樂一子在幼出妻柴氏所生也明秀撫育如己出崔立之變驅從官妻子于省中人自閲之蒲察氏聞以幼子付婢僕且與之金幣親具衣棺祭物與家人訣曰崔立不道強人妻女兵在城下吾何所逃惟一死不負吾夫耳汝等惟善養幼子遂自縊而死欣然若不以死為難者時年二十七烏古論氏伯祥之妹臨洮總管陀滿胡土門之妻也伯祥朝貴中聲譽藉甚胡土門死王事崔立之變衣冠家婦女多為所汙烏古論氏謂家人曰吾夫不辱朝廷我敢辱吾兄及吾夫乎即自縊一婢從死參政完顏素蘭妻亡其姓氏當崔立之變謂所親曰吾夫有天下重名吾豈肯隨衆陷身以辱吾夫乎今日一死固當但不可無名而死亦不可離吾家而死即自縊于室溫特罕氏夫完顏忙哥五𩽆山宣差提控回里不之子也系出蕭王忙哥叔父益都節度秦州為大元兵所攻適病不能軍忙哥為提控獨當一面兵退而益都死忙哥以城守功世襲謀克收充奉御及崔立之變忙哥義不受辱與其妻訣妻曰君能為國家死我不能為君死乎一婢曰主死婢將安歸是日夫婦以一繩同縊婢從之尹氏完顏豬兒之妻也豬兒系出蕭王天興二年正月從哀宗為南面元帥戰死黃陵岡其妻金源郡夫人聞豬兒死聚家資焚之遂自縊年三十一豬兒贈官弟長住即日詔補護衛白氏蘇嗣之之母許州人宋尚書右丞子由五世孫婦也初東坡潁濱叔黨俱葬郟城之小峨嵋山故五世皆居許昌白氏年二十餘即寡居服除外家迎歸兄嫂竊議改醮白氏微聞之牽車徑歸曰我為蘇學士家婦又有子乃欲使我失身乎自是外家非有大故不往也嘗於宅東北為祭室畫兩先生像圖黃州龍川故事壁間香火嚴潔躬自灑掃士大夫求瞻拜者往往過其家奠之天興元年正月庚戌許州被兵嗣之為汴京廂官白拜辭兩先生前曰兒子往京師老婦死無恨矣敢以告即自縊於室側家人並屋焚之年七十餘嗣之本名宗之避諱改焉聶孝女字舜英尚書左右司員外郎天驥之長女也年二十三適進士張伯豪伯豪卒歸父母家及哀宗遷歸德天驥留汴崔立劫殺宰相天驥被創甚日夜悲泣恨不即死舜英謁醫救療百方至刲其股雜他肉以進而天驥竟死時京城圍久食盡閭巷間有嫁妻易一飽者重以崔立之變剽奪暴凌無復人理舜英頗讀書知義理自以年尚少艾夫既亡父又死非命比為兵所汙何若從吾父于地下乎葬其父之明日絶脰而死一時士女賢之有為泣下者其家以舜英合葬張伯豪之墓完顏仲德妻不知其族氏崔立之變妻自毀其容服攜妾及二子紿以采蔬自汴走蔡蔡被圍丁男皆乘城拒守謂仲德曰事勢若此丈夫能為國出力婦人獨不能耶率諸命婦自作一軍親運矢石於城下城中婦女爭出繼之城破自盡哀宗寶符李氏國亡從后妃北遷至宣德州居摩訶院日夕寢處佛殿中作幡斾會當赴龍庭將發即於佛像前自縊死且自書門紙曰寶符御侍此處身故後人至其處見其遺迹憐而哀之天興元年北兵攻城矢石之際忽見一女子呼於城下曰我倡女張鳳奴也許州破被俘至此彼軍不日去矣諸君努力為國堅守無為所欺也言竟投濠而死朝廷遣使馳祭于西門正大天興之際婦人節義可知者特數人耳鳳奴之事別史録之蓋亦有所激云
