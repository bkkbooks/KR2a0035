body:
  text: 金史卷七十九列傳第十七酈瓊李成孔彥舟徐文施宜生張中孚張中彥宇文虛中王倫酈瓊字國寶相州臨漳人補州學生宋宣和間盜賊起瓊乃更學擊刺挽強試弓馬隸宗澤軍駐于磁州未幾告歸括集義軍七百人復從澤澤署瓊為七百人長澤死調戍滑州時宗望伐宋將渡河戍軍亂殺其統制趙世彥而推瓊為主瓊因誘衆號為勤王行且收兵比渡淮有衆萬餘康王以為楚州安撫使淮南東路兵馬鈐轄纍遷武泰軍承宣使未幾率所領步騎十餘萬附于齊授靜難軍節度使知拱州齊國廢以為博州防禦使用廉遷驃騎上將軍宗弼復河南以瓊為山東路弩手千戶知亳州事丁母憂去官宗弼再伐江南以瓊素知南方山川險易召至軍與計事從容語同列曰瓊嘗從大軍南伐每見元帥國王親臨陳督戰矢石交集而王免胄指麾三軍意氣自若用兵制勝皆與孫吳合可謂命世雄材矣至於親冒鋒鏑進不避難將士視之孰敢愛死乎宜其所向無前日闢國千里也江南諸帥才能不及中人每當出兵必身居數百里外謂之持重或督召軍旅易置將校僅以一介之士持虛文諭之謂之調發制敵決勝委之偏裨是以智者解體愚者喪師幸一小捷則露布飛馳增加俘級以為己功斂怨將士縱或親臨亦必先遁而又國政不綱才有微功已加厚賞或有大罪乃置而不誅不即覆亡已為天幸何能振起耶衆以為確論元帥謂宗弼也及宗弼問瓊以江南成敗誰敢相拒者瓊曰江南軍勢怯弱皆敗亡之餘又無良帥何以禦我頗聞秦檜當國用事檜老儒所謂亡國之大夫兢兢自守惟顛覆是懼吾以大軍臨之彼之君臣方且心破膽裂將哀鳴不暇蓋傷弓之鳥可以虛弦下也既而江南果稱臣宗弼喜瓊為知言初瓊去亳未幾宋兵陷之而不守復棄去乃以州人宋超守之及大軍至超復以州事委其鈐轄衛經而遁去帥府使人招經經不下及城潰百姓惶懼待命瓊請於元帥曰城所不下者凶竪草疏之也民何罪願慰安之元帥以瓊先嘗守亳因止戮經而釋其州人復命瓊守亳凡六年亳人德之遷武寧軍節度使八年為泰寧軍節度使九年遷歸德尹貞元元年加金紫光祿大夫卒于官年五十李成字伯友雄州歸信人勇力絶倫能挽弓三百斤宋宣和初試弓手挽強異等纍官淮南招捉使成乃聚衆為盜鈔掠江南宋遣兵破之成遂歸齊纍除知開德府從大軍伐宋齊廢再除安武軍節度使成在降附諸將中最勇鷙號令甚嚴衆莫敢犯臨陳身先諸將士卒未食不先食有病者親視之不持雨具雖沾濕自如也有告成反者宗弼察其誣使成自治成杖而釋之其不校如此以此士樂為用所至克捷宗弼再取河南宋李興據河南府成引軍入孟津興率衆薄城鼓譟請戰成不應日下昃興士卒倦且飢成開門急擊大破之興走漢南成遂取洛陽嵩汝等河南平宗弼奏成為河南尹都管押本路兵馬嘗取官羡粟充公費坐奪兩官解職正隆間起為真定尹封郡王例封濟國公卒年六十九孔彥舟字巨濟相州林慮人亡賴不事生産避罪之汴占籍軍中坐事繫獄説守者解其縛乘夜踰城遁去已而殺人亡命為盜宋靖康初應募纍官京東西路兵馬鈐轄聞大軍將至山東遂率所部草疏殺居民燒廬舍掠財物渡河南去宋人復招之以為沿江招捉使彥舟暴橫不奉約束宋人將以兵執之彥舟走之齊從劉麟伐宋為行軍都統改行營左總管齊國廢纍知淄州從宗弼取河南克鄭州擒其守劉政破孟邦傑於於登封授鄭州防禦使討平太行車轅嶺賊從征江南渡淮破孫暉兵萬餘人下安豐霍丘及攻濠州以彥舟為先鋒順流薄城擒其水軍統制邵青遂克濠州師還纍官工兵部尚書河南尹封廣平郡王正隆例降金紫光祿大夫改西京留守彥舟荒于色有禽獸行妾生女姿麗彥舟苦虐其母使自陳非己女遂納為妾其官屬負官錢私其妻與折券惟破濠州時諸軍凡係獲皆殺之彥舟號令毋輒殺免者數千人人頗以此稱之然自幼至老常在行伍習兵事知利鈍海陵欲以為征南將佐正隆五年除南京留守彥舟有疾朝臣有傳彥舟死者而彥舟尚無恙海陵盡杖妄傳彥舟死者以激勵之無何竟死於汴年五十五遺表言伐宋當先取淮南云徐文字彥武萊州掖縣人徙膠水少時販鹽為業往來瀕海數州剛勇尚氣儕輩皆憚之宋季盜起募戰士為密州板橋左十將勇力過人揮巨刀重五十斤所向無前人呼為徐大刀後隸王龍圖麾下與夏人戰生擒一將補進武校尉東還破羣賊楊進等轉承信郎宋康王渡江召文為樞密院準備將擒苗傅及韓世績以功遷淮東浙西沿海水軍都統制諸將忌其材勇是時李成孔彥舟皆歸齊宋人亦疑文有北歸志大將閻臯與文有隙因而譖之宋使統制朱師敏來襲文文乃率戰艦數十艘泛海歸于齊齊以文為海密二州滄海都招捉使兼水軍統制遷海道副都統兼海道總管賜金帶文以策干劉豫欲自海道襲臨安豫不能用齊國廢元帥府承制以文為南京步軍都虞候權馬步軍都指揮使天眷元年破太行賊梁小哥以本職兼水軍統制朝廷以河南與宋除文山東路兵馬鈐轄宗弼復取河南文破宋將李寶於濮陽孟邦傑於登封宋蔣知軍據河陽文遲明至其城下使別將攻城東北自將精鋭潛師襲南門城中悉衆救東北文乃自南門斬關入城宋軍潰去追擊敗之破郭清郭遠於汝州鄭州叛復取之擊走宋將戚方河南既平宗弼勞賞將士賞文銀幣鞍馬充行軍萬戶從宗弼取廬濠等州超換武義將軍知濟州在職七年移知泰安軍海陵即位録舊功纍遷中都兵馬都指揮使賜金帶改濬州防禦使未幾海陵謀伐宋改行都水監監造戰船於通州東海縣人徐元張旺作亂縣人房真等三人走海州及走總管府上變州府皆遣使效隨真等詣東海觀賊形勢皆為賊所害州府合兵攻之纍月不下海陵且欲伐宋惡聞其事詔文與步軍指揮使張弘信同知大興尹李惟忠宿直將軍蕭阿窊率舟師九百浮海討之謂文等曰朕意不在一邑將以試舟師耳文等至東海與賊戰敗之斬首五千餘級獲徐元張旺餘衆請降是役也張弘信行至萊州稱疾留止日與妓樂飲酒海陵聞之師還杖弘信二百文遷定海軍節度使房真三人官賞有差死賊者皆贈官三級以銀百兩絹百匹賜其家大定二年詣闕自陳年老目昏懇求致仕許之以覃恩遷龍虎衛上將軍卒于家施宜生字明望邵武人也博聞強記未冠由鄉貢入太學宋政和四年擢上舍第試學官授潁州教授及王師入汴宜生走江南復以罪北走齊上書陳取宋之策齊以為大總管府議事官失意於劉麟左遷彰信軍節度判官齊國廢擢為太常博士遷殿中侍御史轉尚書吏部員外郎為本部郎中尋改禮部出為隰州刺史天德二年用參知政事張浩薦宜生可備顧問海陵召為翰林直學士撰太師梁王宗弼墓銘進官兩階正隆元年出知深州召為尚書禮部侍郎遷翰林侍講學士四年冬為宋國正旦使宜生自以得罪北走恥見宋人力辭不許宋命張燾館之都亭因間以首丘風之宜生顧其介不在旁為廋語曰今日北風甚徑又取几間筆扣之曰筆來筆來於是宋始警其副使耶律闢離剌使還以聞坐是烹死初宜生困于場屋遇僧善風鑒謂之曰子面有權骨可公可卿而視子身之毛皆逆上且覆腕必有以合乎此而後可貴也宜生聞其言大喜竟從范汝為於建劍已而汝為敗變服為傭泰之吳翁家三年翁異之一日屏人詰其姓名宜生曰我服傭事惟謹主人乃亦置疑邪翁固詰之則請其故翁曰日者燕客執事咸餕而汝獨孫諸儕且撤器有歎聲是以識汝非真傭也宜生遂告之故翁贐之金夜濟淮以歸試一日獲熊三十六賦擢第一其後竟如僧言張中孚字信甫其先自安定徙居張義堡父達仕宋至太師封慶國公中孚以父任補承節郎宗翰圍太原其父戰歿中孚泣涕請迹父尸乃獨率部曲十餘人入大軍中竟得其尸以還纍官知鎮戎軍兼安撫使屢從吳玠張浚以兵拒大軍浚走巴蜀中孚權帥事天會八年睿宗以左副元帥次涇州中孚率其將吏來降睿宗以為鎮洮軍節度使知渭州兼涇原路經略安撫使齊國建以什一法括民田籍丁壯為鄉軍中孚以為涇原地瘠無良田且保甲之法行之已習今遽紛更人必逃徙秪見其害未見其利也竟執不行時齊政甚急莫敢違人為中孚懼而中孚不之顧未幾齊國廢一路獨免掊克之患天眷初為陝西諸路節制使知京兆府朝廷賜地江南中孚遂入宋宗弼再定河南陝西移文宋人使歸中孚至汴就除行臺兵部尚書遷除參知行臺尚書省事明年拜參知政事貞元元年遷尚書左丞封南陽郡王三年以疾告老乃為濟南尹加開府儀同三司封宿王移南京留守又進封崇王卒年五十九加贈鄧王中孚天性孝友剛毅與弟中彥居未嘗有間言喜讀書頗能書翰其御士卒嚴而有恩西人尤畏愛之葬之日老稚扶柩流涕蓋數萬人至為罷市其得西人之望如此正隆例封崇進原國公張中彥字才甫中孚弟少以父任仕宋為涇原副將知德順軍事睿宗經略陝西中彥降除招撫使從下熙河階成州授彰武軍承宣使為本路兵馬鈐轄遷都總管宋將關師古圍鞏州與秦鳳李彥琦會兵攻之王師下饒風關得金洋諸州以中彥領興元尹撫輯新附師還代彥琦為秦鳳經略使秦州當要衝而城不可守中彥徙治北山因險為壘今秦州是也築臘家諸城以扼蜀道帥秦凡十年改涇原路經略使知平涼府朝廷以河南陝西賜宋中孚以官守隨例當留關中熙河經略使慕洧謀入夏將窺關陝中彥與環慶趙彬會兩路兵討之洧敗入于夏中彥與兄中孚俱至臨安被留以為龍神衛四廂都指揮使清遠軍承宣使提舉佑神觀靖海軍節度使皇統初恢復河南詔徵中彥兄弟北歸為靜難軍節度使歷彰化軍鳳翔尹改尹慶陽兼慶原路兵馬都總管寧州刺史宗室宗淵毆死僚佐梁郁郁遠人家貧無能赴告者中彥力為正其罪竟置于法改彰德軍節度使均賦調法姦豪無所蔽匿人服其明正隆營汴京新宮中彥採運關中材木青峰山巨木最多而高深阻絶唐宋以來不能致中彥使構崖駕壑起長橋十數里以車運木若行平地開六盤山水洛之路遂通汴梁明年作河上浮梁復領其役舟之始製匠者未得其法中彥手製小舟才數寸許不假膠漆而首尾自相鉤帶謂之鼓子卯諸匠無不駭服其智巧如此浮梁巨艦畢功將發旁郡民曳之就水中彥召役夫數十人治地勢順下傾瀉于河取新秫秸密布於地復以大木限其旁凌晨督衆乘霜滑曳之殊不勞力而致諸水俄遷平陽海陵將伐宋驛召赴闕授西蜀道行營副都統制賜細鎧使先取散關俟後命世宗即位赦書至鳳翔諸將惶惑不能決去就中彥曉譬之諸將感悟受詔上召中彥入朝以軍付統軍合喜及見上賜以所御通犀帶封宗國公尋為吏部尚書上疏曰古者關市譏而不征今使掌關市者征而不譏苛留行旅至披剔囊笥甚於剽掠有傷國體乞禁止從之踰年除南京留守時淮楚用兵土民與戍兵雜居訟牒紛紜所司皆依違不決中彥得戍兵為盜者悉論如法帥府怒其專決劾奏之朝廷置而不問秩滿轉真定尹兼河北西路兵馬都總管未幾致仕西歸京兆明年起為臨洮尹兼熙秦路兵馬都總管鞏州劉海構亂既敗籍民之從亂者數千人中彥惟論為首者戮之西羌吹折密臧隴逋厖拜四族恃險不服使侍御史沙醇之就中彥論方略中彥曰此羌服叛不常若非中彥自行勢必不可即至積石達南寺酋長四人來與之約降事遂定賞而遣之還奏上大悅遣張汝玉馳驛勞力賜以毬文金帶用郊恩加儀同三司以疾卒官年七十五百姓哀號輟市立像祀之贊曰自古健將武夫其不才者遭世變遷賣降恐後此其常態君子之所不責也酈瓊徐文是已施宜生反覆壬人李成盜賊之靡孔彥舟漁色親出自絶人類又何責也張中孚中彥雖有小惠足稱然以宋大臣之子父戰沒於金若金若齊義皆不共戴天之讎金以地與齊則甘心臣齊以地歸宋則忍恥臣宋金取其地則又比肩臣金若趨市然唯利所在於斯時也豈復知所謂綱常也哉吁宇文虛中字叔通蜀人初仕宋纍官資政殿大學士天會四年宋少帝已結盟宗望班師至孟陽宋姚平仲乘夜來襲明日復進兵圍汴少帝使虛中詣宗望軍告以襲兵皆將帥自為之復請和議如初且視康王安否頃之臺諫以和議歸罪虛中罷為青州復下遷祠職建炎元年貶韶州二年康王求可為奉使者虛中自貶中應詔復資政殿大學士為祈請使是時興兵伐宋已留王倫朱辨不遣虛中亦被留實天會六年也朝廷方議禮制度頗愛虛中有才藝加以官爵虛中即受之與韓昉輩俱掌詞命明年洪皓至上京見虛中甚鄙之天會十三年熙宗即位宗翰為太保領三省事封晉國王乞致仕批答不允其詞虛中作也天眷間纍官翰林學士知制誥兼太常卿封河內郡開國公書太祖睿德神功碑進階金紫光祿大夫皇統二年宋人請和其誓表曰自來流移在南之人經官陳説願自歸者更不禁止上國之於弊邑亦乞並用此約於是詔尚書省移文宋國理索張中孚張中彥鄭億年杜充張孝純宇文虛中王進家屬發遣李正民畢良史還宋惟孟庾去留聽其所欲時虛中子師瑗仕宋至轉運判官家北來四年轉承旨加特進遷禮部尚書承旨如故虛中恃才輕肆好譏訕凡見女直人輒以礦鹵目之貴人達官往往積不能平虛中嘗撰宮殿榜署本皆嘉美之名惡虛中者擲其字以為謗訕朝廷由是媒糵以成其罪矣六年二月唐括酬斡家奴杜天佛留告虛中謀反詔有司鞫治無狀乃羅織虛中家圖書為反具虛中曰死自吾分至於圖籍南來士大夫家家有之高士談圖書尤多於我家豈亦反耶有司承順風旨並殺士談至今寃之士談字季默高瓊之後宣和末為欣州戶曹參軍入朝官至翰林直學士虛中士談俱有文集行于世王倫字正道故宋宰相王旦弟王勉玄孫俠邪無賴年四十餘尚與市井惡少羣遊汴中天會五年宋人以倫為假刑部侍郎與閣門舍人朱辨充通問使是時方議伐宋凡宋使者如倫及宇文虛中魏行可顧縱張邵等皆留之不遣居數年倫久困乃唱為和議求歸元帥府使人謂之曰此非江南情實特汝自為此言耳倫曰使事有指不然何為來哉惟元帥察之天會十年劉豫連歲出師皆無功撻懶為元帥左監軍經略南邊密主和議乃遣倫歸先此宋已遣使乞和朝廷未之許也倫見康王言和議事康王大喜遷倫官並官其子弟宋方與齊用兵未可和天會十五年康王聞天水郡王已薨以倫假直學士來請其喪使倫請撻懶曰河南之地上國既不自有與其封劉豫曷若歸之趙氏是歲劉豫受封已八年不能自立其國尚勤屯戍朝廷厭其無能為也乃廢劉豫撻懶以左副元帥守汴京於是倫適至撻懶太祖從父兄弟於熙宗為祖行太宗長子宗磐以太師領三省事位在宗幹上宗翰薨已久宗幹不能與宗磐獨抗明年天眷元年撻懶與東京留守宗雋俱入朝熙宗以宗雋為左丞相宗雋太祖子也撻懶宗磐宗雋三人皆跋扈嗜利陰有異圖遂合議以齊地與宋自宗幹以下爭之不能得以侍郎張通古為詔諭江南使遣倫先歸明年宋以倫為端明殿學士簽書樞密院事進金器千兩銀器萬兩復來請天水郡王喪柩及請母韋氏兄弟宗族等保信軍節度使藍公佐副之是歲宗磐宗雋撻懶皆以謀反屬吏熙宗誅宗磐宗雋以撻懶屬尊赦其死以為行臺尚書省事左丞相奪其兵權右副元帥宗弼奏曰撻懶宗磐陰與宋人交通遂以河南陝西地與宋人會撻懶復謀反捕而殺之於祁州倫至上京有司詳讀康王表文不書年閲進奉狀稱禮物不言職貢上使宰相責問倫曰汝但知有元帥豈知有上國耶遂留不遣遣其副藍公佐歸三年五月宗弼復取河南陝西地遂伐江南已渡淮皇統元年宋人請和二年二月宋端明殿學士何鑄容州觀察使曹勛進誓表三月遣左副點檢賽里山東西路都轉運使劉祹送天水郡王喪柩及宋帝母韋氏還江南五月李正民畢良史南歸七月朱辨張邵洪皓南歸四年以倫為平州路轉運使倫已受命復辭遜上曰此反覆之人也遂殺之於上京年六十一贊曰孔子云行己有恥使於四方不辱君命可謂士矣宇文虛中朝至上京夕受官爵王倫紈袴之子市井為徒此豈行己有恥之士可以專使者耶二子之死雖寃其自取亦多矣
