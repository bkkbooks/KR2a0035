body:
  text: 金史卷六十三列傳第一后妃上始祖明懿皇后德帝思皇后安帝節皇后獻祖恭靖皇后昭祖威順皇后景祖昭肅皇后世祖翼簡皇后肅宗靖宣皇后穆宗貞惠皇后康宗敬僖皇后太祖聖穆皇后太祖光懿皇后太祖欽憲皇后太祖宣獻皇后太祖崇蕭氏太宗欽仁皇后熙宗悼平皇后海陵嫡母徒單氏海陵母大氏海陵后徒單氏海陵諸嬖附古者天子娶后三國來媵皆有娣姪凡十二女諸侯一娶九女所以正嫡妾廣繼嗣息妬忌防淫慝塞禍亂也后亡則媵為繼室各以其無三媵則娣姪繼室亦各以其繼室者治其內政不敢正其位號禮廟無兩祔不並尊也魯成風始兩祔宋國三媵齊管氏三歸春秋皆譏之周禮內宰其屬則內小臣閽人寺人次之九嬪世婦女御女祝女史典婦功典絲典枲內司服又次之昏義稱后立六宮三夫人九嬪二十七世婦八十一御妻不與春秋周禮合後世因仍其説後宮遂至數千金代后不娶庶族甥舅之家有周姬齊薑之義國初諸妃皆無位號熙宗始有貴妃賢妃德妃之號海陵淫嬖後宮寖多元妃姝妃惠妃貴妃賢妃宸妃麗妃淑妃德妃昭妃溫妃柔妃凡十二位大定後宮簡少明昌以後大備內官制度諸妃視正一品比三夫人昭儀昭容昭媛修儀修容修媛充儀充容充媛視正二品比九嬪婕妤九人視正三品美人九人視正四品才人九人視正五品比二十七世婦寶林二十七人視正六品御女二十七人視正七品采女二十七人視正八品比八十一御妻又有尚宮尚儀尚服尚食尚寢尚功皆內官也太祖嫡后聖穆生景宣光懿生宗幹有定策功欽憲有保佑之功故自熙宗時聖穆光懿欽憲皆祔宣獻生睿宗大定祔焉故太祖廟祔四后睿世顯宣皆祔兩后惟太宗景宣熙宗章宗室祔一后貞慈光獻昭聖雖庶姓皆以子貴宣宗册溫敦氏乃賜姓變古甚矣故自初起至于國亡列其世次著其族里可考鑒焉其無與於世道者置不録始祖明懿皇后完顏部人年六十餘嫁始祖天會十五年追諡德帝思皇后不知何部人天會十五年追諡安帝節皇后不知何部人天會十五年追諡獻祖恭靖皇后不知何部人天會十五年追諡昭祖威順皇后徒單氏諱烏古論都葛活剌渾水敵魯鄉徒單部人其父拔炭都魯海后性剛毅人莫敢以為室獻祖將為昭祖娶婦曰此子勇斷異常柔弱之女不可以為配乃為昭祖娶焉天會十五年追諡景祖昭肅皇后唐括氏帥水隈鴉村唐括部人諱多保真父石批德撒骨只巫者也后有識度在父母家好待賓客父母出則多置酒饌享鄰里逮于行旅景祖飲食過人時人名之活羅解在景祖紀昭祖曰儉嗇之女吝惜酒食不可以配烏古乃聞后性度如是乃娶焉遼使同幹來伐五國蒲聶部景祖使后與劾孫為質於拔乙門而與同幹襲取之遼主以景祖為節度使后雖喜賓客而自不飲酒景祖與客飲后專聽之翌日枚數其人所為無一不中其綮肯有醉而喧呶者輒自歌以釋其忿爭軍中有被笞罰者每以酒食慰諭之景祖行部輒與偕行政事獄訟皆與決焉景祖沒後世祖兄弟凡用兵皆稟於后而後行勝負皆有懲勸農月親課耕耘刈穫遠則乘馬近則策杖勤於事者勉之晏出早休者訓勵之后往邑屯村世祖肅宗皆從會桓散達偕來是時已有隙被酒語相侵不能平遂舉刃相向后起兩執其手謂桓散達曰汝等皆吾夫時舊人奈何一旦遽忘吾夫之恩與小兒子輩忿爭乎因自作歌桓散達怒乃解其後桓兄弟起兵來攻當是時肅宗先已再失利矣世祖已退烏春兵與桓戰于北隘甸部人失束寬逃歸袒甲而至告后曰軍敗矣后方憂悶會康宗來報捷后乃喜既而桓散達皆降后不妬忌闊略女工能輯睦宗族當時以為有丈夫之度云天會十五年追諡世祖翼簡皇后拏懶氏大安元年癸酉歲卒天會十五年追諡肅宗靖宣皇后蒲察氏太祖將舉兵入告于后后曰汝邦家之長見可則行吾老矣無貽我憂汝亦必不至是太祖奉觴為壽即奉后出門酹酒禱天后命太祖正坐號令諸將自是太祖每出師還輒率諸將上謁獻所俘獲天會十五年追諡穆宗貞惠皇后烏古論氏天會十五年追諡康宗敬僖皇后唐括氏天會十五年追諡太祖聖穆皇后唐括氏天會十三年追諡仍贈后父留速太尉榮國公祖迭胡本司徒英國公曾祖劾乃司空溫國公太祖光懿皇后裴滿氏天會十三年追諡太祖欽憲皇后紇石烈氏天會十三年尊為太皇太后宮號慶元十四年正月己巳朔熙宗朝于慶元宮然後御乾元殿受羣臣賀是月丁丑崩于慶元宮二月癸卯祔葬睿陵太祖宣獻皇后僕散氏睿宗母也天會十三年追册曰德妃大定元年追諡崇妃蕭氏熙宗時封貴妃天德二年正月封元妃是月尊封太妃海陵母大氏事蕭氏甚謹海陵篡立尊大氏為皇太后居永寧宮每有宴集太妃坐上坐大氏執婦禮海陵積不能平及殺宗義等誣太妃以隱惡殺之併殺所生子任王隈喝大定十九年詔改葬大宗正丞宗安監護葬事遣使致祭上欲復太妃舊號下禮官議前代稱太妃者皆以子貴古者入廟稱后繫夫在朝稱太繫子與今蕭妃事不同恐不得稱太止當追封妃號詔從之乃封崇妃云太宗欽仁皇后唐括氏熙宗即位與太祖欽憲皇后俱尊為太皇太后號明德宮贈后父阿魯束太尉宋國公祖實匹司徒英國公曾祖阿魯瑣司空溫國公十四年正月己巳朔上朝兩宮太后然後御乾元殿受賀自後歲以為常皇統元年上自燕京還京師朝謁于明德宮明年上如天開殿皇子生使使馳報太后太后至天開殿上與皇后親迎之三年崩于明德宮諡曰欽仁皇后祔葬恭陵熙宗悼平皇后裴滿氏熙宗即位封貴妃天眷元年立為皇后父忽達拜太尉贈曾祖斜也司空祖鶻沙司徒皇統元年熙宗受尊號册為慈明恭孝順德皇后二年太子濟安生是歲熙宗年二十四喜甚乃肆赦告天地宗廟彌月册為皇太子未一歲薨熙宗在位宗翰宗幹宗弼相繼秉政帝臨朝端默雖初年國家多事而廟算制勝齊國就廢宋人請臣吏清政簡百姓樂業宗弼既沒舊臣亦多物故后干預政事無所忌憚朝官往往因之以取宰相濟安薨後數年繼嗣不立后頗掣制熙宗熙宗內不能平因無聊縱酒酗怒手刃殺人左丞相亮生日上遣大興國以司馬光畫像玉吐鶻馬賜之后亦附賜生日禮物熙宗聞之怒遂杖興國而奪回所賜海陵本懷覬覦因之疑畏愈甚蕭牆之變從此萌矣近侍高壽星隨例遷屯燕南入訴於后后激怒熙宗殺左司郎中三合杖平章政事秉德而壽星竟得不遷秉德唐括辨之姦謀起焉海陵乘之以成逆亂之計久之熙宗積怒遂殺后而納胙王常勝妃撒卯入宮繼之又殺德妃烏古論氏妃夾谷氏張氏裴滿氏明日熙宗遇弒海陵已弒熙宗欲收人心以后死無罪降熙宗為東昏王追諡后為悼皇后封后父忽達為王大定間復熙宗帝號加諡后為悼平皇后祔葬思陵海陵嫡母徒單氏宗幹之正室也徒單無子次室李氏生長子鄭王充次室大氏生三子長即海陵庶人也徒單氏賢遇下有恩意大氏事之甚謹相得歡甚徒單雖養充為己子充與海陵俱為熙宗宰相充嗜酒徒單常責怒之尤愛海陵海陵自以其母大氏與徒單嫡妾之分心常不安及弒熙宗徒單與太祖妃蕭氏聞之相顧愕然曰帝雖失道人臣豈可至此徒單入宮見海陵不曾賀海陵銜之天德二年正月徒單與大氏俱尊為皇太后徒單居東宮號永壽宮大氏居西宮號永寧宮天德二年太后父蒲帶與大氏父俱贈太尉封王徒單太后生日酒酣大氏起為壽徒單方與坐客語大氏𢔛者久之海陵怒而出明日召諸公主宗婦與太后語者皆杖之大氏以為不可海陵曰今日之事豈能尚如前日邪自是嫌隙愈深天德四年海陵遷中都獨留徒單於上京徒單常憂懼每中使至必易衣以俟命大氏在中都常思念徒單太后謂海陵曰永壽宮待吾母子甚厚慎毋相忘也十二月十四日徒單氏生日海陵使祕書監納合椿年往上京為太后上壽貞元元年大氏病篤恨不得一見臨終謂海陵曰汝以我之故不令永壽宮偕來中都我死必迎致之事永壽宮當如事我三年右丞相僕散師恭大宗正丞胡拔魯往上京奉遷山陵海陵因命永壽宮太后與俱來繼使平章政事蕭玉迎祭祖宗梓宮於廣寧海陵謂玉曰醫巫閭山多佳致祭奠禮畢可奏太后於山水佳處遊覽及至沙流河海陵迎謁梓宮遂謁見太后海陵命左右約杖二束自隨跪於太后前謝罪曰亮不孝久闕溫凊願太后痛笞之不然且不安太后親扶起之叱約杖者使去太后曰今庶民有克家子立百金之産尚且愛之不忍笞我有子如此寧忍笞乎十月太后至中都海陵帥百官郊迎入居壽康宮是日海陵及後宮宰臣以下奉觴上壽極歡而罷海陵侍太后于宮中外極恭順太后坐起自扶腋之常從輿輦徒行太后所御物或自執之見者以為至孝太后亦以為誠然及謀伐宋太后諫止之海陵心中益不悅每謁太后還必忿怒人不知其所以及至汴京太后居寧德宮太后使侍婢高福娘問海陵起居海陵幸之因使伺太后動靜凡太后動止事無大小福娘夫特末哥教福娘增飾其言以告海陵及樞密使僕散師恭征契丹撒八辭謁太后太后與師恭語久之大概言國家世居上京既徙中都又自中都至汴今又興兵涉江淮伐宋疲弊中國我嘗諫止之不見聽契丹事復如此奈何福娘以告海陵海陵意謂太后以充為子充四子皆成立恐師恭將兵在外太后或有異圖乃召點檢大懷忠翰林待制斡論尚衣局使虎特末武庫直長習失使殺太后于寧德宮命護衛高福辭勒蒲速斡以兵士四十人從且戒之曰汝等見太后但言有詔令太后跪受即擊殺之勿令艱苦太后同乳妹安特多口必妄言當令速死及指名太后左右數人皆令殺之太后方樗蒲大懷忠等至令太后跪受詔太后愕然方下跪虎特末從後擊之仆而復起者再高福等縊殺之年五十三並殺安特及郡君白散阿魯瓦叉察乳母南撒侍女阿斯斡里保寧德宮護衛溫迪罕查剌直長王家奴撒八小底忽沙等海陵命焚太后于宮中棄其骨於水並殺充之子檀奴阿里白元奴耶補兒逃匿歸于世宗自軍中召師恭還殺之及殺阿斯子孫撒八二字忽沙二子封高福娘為鄖國夫人以特末哥為澤州刺史海陵許福娘征南回以為妃賜銀二千兩敕戒特末哥無酗酒毆福娘毆福娘必殺汝大定間諡徒單氏曰哀皇后自澤州械特末哥福娘至中都誅之其後貶海陵為庶人宗幹去帝號復封遼王徒單氏降封遼王妃云海陵母大氏天德二年正月與徒單氏俱尊為皇太后大氏居永寧宮曾祖堅嗣贈司空祖臣寶贈司徒父昊天贈太尉國公兄興國奴贈開府儀同三司衛國公十一月昊天進封為王三年正月十六日海陵生日宴宗室百官於武德殿大氏歡甚飲盡醉明日海陵使中使奏曰太后春秋高常日飲酒不過數杯昨見飲酒沉醉兒為天子固可樂若聖體不和則子心不安其樂安在至樂在心不在酒也及遷中都永壽宮獨留上京大氏常以為言貞元元年四月大氏有疾詔以錢十萬貫求方藥及病篤遺言海陵當善事永壽宮戊寅崩詔尚書省應隨朝官至五月一日方治事中都自四月十九日為始禁樂一月外路自詔書到日後官司三日不治事禁樂一月聲鐘七晝夜貞元三年大祥海陵率後宮奠哭于菆宮海陵將遷山陵于大房山故大氏猶在菆宮也九月太祖太宗德宗梓宮至中都尊諡曰慈憲皇后海陵親行册禮與德宗合葬于大房山升祔太廟大定七年降封海陵太妃削去皇后諡號及宗幹降帝號封遼王詔以徒單氏為妃而大氏與順妃李氏寧妃蕭氏文妃徒單氏並追降為遼王夫人廢帝海陵后徒單氏太師斜也之女初為岐國妃天德二年封為惠妃九月立為皇后三年十一月二十一日后生日百僚稱賀於武德殿久之海陵後宮寖多后寵頗衰希得進見沈璋妻張氏嘗為光英保母耶律徹在北京與海陵遊從海陵使璋妻及徹妻侯氏入宮侍后徹本名神涅負官錢二千六百餘萬海陵皆免之正隆六年海陵幸南京六月癸亥左丞相張浩率百官迎謁海陵備法駕乘玉輅與后及太子光英共載而入海陵伐宋后與光英居守海陵遇害陀滿訛里也殺光英于汴后至中都居于海陵母大氏故宮頃之世宗憐其無依詔歸父母家于上京歲賜錢二千貫奴婢皆給官廩大定十年卒海陵為人善飾詐初為宰相妾媵不過三數人及踐大位逞欲無厭後宮諸妃十二位又有昭儀至充媛九位婕妤美人才人三位殿直最下其他不可舉數初即位封岐國妃徒單氏為惠妃後為皇后第二娘子大氏封貴妃第三娘子蕭氏封昭容耶律氏封修容其後貴妃大氏進封惠妃貞元元年進封姝妃正隆二年進封元妃昭容蕭氏天德二年特封淑妃貞元二年進封宸妃修容耶律氏天德四年進昭媛貞元元年進昭儀三年進封麗妃即位之初後宮止此三人尊卑之等威之辨若有可觀者及其侈心既萌淫肆蠱惑不可復振矣昭妃阿里虎姓蒲察氏駙馬都尉沒里野女初嫁宗盤子阿虎迭阿虎迭誅再嫁宗室南家南家死是時南家父突葛速為元帥都監在南京海陵亦從梁王宗弼在南京欲取阿里虎突葛速不從遂止及篡位方三日詔遣阿里虎歸父母家閲兩月以婚禮納之數月特封賢妃再封昭妃阿里虎嗜酒海陵責讓之不聽由是寵衰昭妃初嫁阿虎迭生女重節海陵與重節亂阿里虎怒重節批其頰頗有詆訾之言海陵聞之愈不悅阿里虎以衣服遺前夫之子海陵將殺之徒單后率諸妃嬪求哀乃得免凡諸妃位皆以侍女服男子衣冠號假厮兒有勝哥者阿里虎與之同臥起如夫婦婢三娘以告海陵海陵不以為過惟戒阿里虎勿笞箠三娘阿里虎榜殺之海陵聞昭妃閣有死者意度是三娘曰若果爾吾必殺阿里虎問之果然是月光英生月海陵私忌不行戮阿里虎聞海陵將殺之也即不食日焚香禱祝冀脫死逾月阿里虎已委頓不知所為海陵使人縊殺之併殺侍婢擊三娘者貴妃定哥姓唐括氏有容色崇義節度使烏帶之妻海陵舊嘗有私侍婢貴哥與知之烏帶在鎮每遇元會生辰使家奴葛魯葛溫詣闕上壽定哥亦使貴哥候問海陵及兩宮太后起居海陵因貴哥傳語定哥曰自古天子亦有兩后者能殺汝夫以從我乎貴哥歸具以海陵言告定哥定哥曰少時醜惡事已可恥今兒女已成立豈可為此海陵聞之使謂定哥汝不忍殺汝夫我將族滅汝家定哥大恐乃以子烏答補為辭曰彼常侍其父不得便海陵即召烏答補為符寶祗候定哥曰事不可止矣因烏帶醉酒令葛溫葛魯縊殺烏帶天德四年七月也海陵聞烏帶死詐為哀傷已葬烏帶即納定哥宮中為娘子貞元元年封為貴妃大愛幸許以為后每同輦遊瑤池諸妃步從之海陵嬖寵愈多定哥希得見一日獨居樓上海陵與他妃同輦從樓下過定哥望見號呼求去詛罵海陵海陵陽為不聞而去定哥自其夫時與家奴閻乞兒通嘗以衣服遺乞兒及為貴妃乞兒以妃家舊人給事本位定哥既怨海陵疏己欲復與乞兒通有比丘尼三人出入宮中定哥使比丘尼向乞兒索所遺衣服以調之乞兒識其意笑曰妃今日富貴忘我耶定哥欲以計納乞兒宮中恐閽者索之乃令侍兒以大篋盛褻衣其中遣人載之入宮閽者索之見篋中皆褻衣固已悔懼定哥使人詰責閽者曰我天子妃親體之衣爾故玩視何也我且奏之閽者惶恐曰死罪請後不敢定哥乃使人以篋盛乞兒載入宮中閽者果不敢復索乞兒入宮十餘日使衣婦人衣雜諸宮婢抵暮遣出貴哥以告海陵定哥縊死乞兒及比丘尼三人皆伏誅封貴哥莘國夫人初海陵既使定哥殺其夫烏帶使小底藥師奴傳旨定哥告以納之之意藥師奴知定哥與閻乞兒有姦定哥以奴婢十八口賂藥師奴使無言與乞兒私事定哥敗杖藥師奴百五十先是藥師奴嘗盜玉帶當死海陵釋其罪逐去及遷中都復召為小底及藥師奴既以匿定哥姦事被杖後與祕書監文俱與靈壽縣主有姦文杖二百除名藥師奴當斬海陵欲杖之謂近臣曰藥師奴於朕有功再杖之即死矣丞相李睹等執奏藥師奴於法不可恕遂伏誅海陵以葛溫葛魯為護衛葛溫纍官常安縣令葛魯纍官襄城縣令大定初皆除名麗妃石哥者定哥之妹祕書監文之妻也海陵私之欲納宮中乃使文庶母按都瓜主文家海陵謂按都瓜曰必出而婦不然我將別有所行按都瓜以語文文難之按都瓜曰上謂別有所行是欲殺汝也豈以一妻殺其身乎文不得已與石哥相持慟哭而訣是時海陵遷都至中京遣石哥至中都俱納之海陵召文至便殿使石哥穢談戲文以為笑定哥死遣石哥出宮不數日復召入封為修容貞元三年進昭儀正隆元年進封柔妃二年進麗妃柔妃彌勒姓耶律氏天德二年使禮部侍郎蕭拱取之于汴過燕京拱父仲恭為燕京留守見彌勒身形非若處女者嘆曰上必以疑殺拱矣及入宮果非處女明日遣出宮海陵心疑蕭拱竟致之死彌勒出宮數月復召入封為充媛封其母張氏莘國夫人伯母蘭陵郡君蕭氏為鞏國夫人蕭拱妻擇特懶彌勒女兄也海陵既奪文妻石哥却以擇特懶妻文既而詭以彌勒之召召擇特懶入宮亂之其後彌勒進封柔妃云昭妃阿懶海陵叔曹國王宗敏妻也海陵殺宗敏而納阿懶宮中貞元元年封為昭妃大臣奏宗敏屬近尊行不可乃令出宮修儀高氏秉德弟辭里妻也海陵殺諸宗室釋其婦女宗本子莎魯剌妻宗固子胡里剌妻胡失來妻及辭里妻皆欲納之宮中諷宰相奏請行之使徒單貞諷蕭裕曰朕嗣續未廣此黨人婦女有朕中外親納之宮中何如裕曰近殺宗室中外異議紛紜奈何復為此邪海陵曰吾固知裕不肯從乃使貞自以己意諷裕必欲裕等請其事貞謂裕曰上意已有所屬公固止之將成疾矣裕曰必不肯已唯上擇焉貞曰必欲公等白之裕不得已乃具奏遂納之未幾封高氏為修儀加其父高耶魯瓦輔國上將軍母完顏氏封密國夫人高氏以家事訴於海陵海陵自熙宗時見悼后干政心惡之故自即位不使母后得預政事於是遣高氏還父母家詔尚書省凡后妃有請于宰相者收其使以聞昭媛察八姓耶律氏嘗許嫁奚人蕭堂古帶海陵納之封為昭媛堂古帶為護衛察八使侍女習撚以軟金鵪鶉袋數枚遺之事覺是時堂古帶謁告在河間驛召問之堂古帶以實對海陵釋其罪海陵登寶昌門樓以察八徇諸后妃手刃擊之墮門下死並誅侍女習撚壽寧縣主什古宋王宗望女也靜樂縣主蒲剌及習撚梁王宗弼女也師姑兒宗雋女也皆從姊妹混同郡君莎里古真及其妹餘都太傅宗本女也再從姊妹郕國夫人重節宗磐女孫再從兄之女及母大氏表兄張定安妻奈剌忽麗妃妹蒲魯胡只皆有夫唯什古喪夫海陵無所忌恥使高師姑內哥阿古等傳達言語皆與之私凡妃主宗婦嘗私之者皆分屬諸妃出入位下奈剌忽出入元妃位蒲魯胡只出入麗妃位莎里古真餘都出入貴妃位什古重節出入昭妃位蒲剌師姑兒出入淑妃位海陵使內哥召什古先於暖位小殿置琴阮其中然後召之什古已色衰常譏其衰老以為笑唯習撚莎里古真最寵恃勢笞決其夫海陵使習撚夫稍喝押護衛直宿莎里古真夫撒速近侍局直宿謂撒速曰爾妻年少遇爾直宿不可令宿於家常令宿於妃位每召入必親伺候廊下立久則坐於高師姑膝上高師姑曰天子何勞苦如此海陵曰我固以天子為易得耳此等期會難得乃可貴也每於臥內遍設地衣倮逐以為戲莎里古真在外為淫泆海陵聞之大怒謂莎里古真曰爾愛貴官有貴如天子者乎爾愛人才有才兼文武似我者乎爾愛娛樂有豐富偉岸過於我者乎怒甚氣咽不能言少頃乃撫慰之曰無謂我聞知便爾慚恧遇燕會當行立自如無為衆所測度也恐致非笑後亦屢召入焉餘都牌印鬆古剌妻也海陵嘗曰餘都貌雖不揚而肌膚潔白可愛蒲剌進封壽康公主什古進封昭寧公主莎里古真進封壽陽縣主重節進封蓬萊縣主重節即昭妃蒲察氏所生蒲察怒重節與海陵淫批其頰海陵怒蒲察氏終殺之者也凡宮人在外有夫者皆分番出入海陵欲率意幸之盡遣其夫往上京婦人皆不聽出外常令教坊番直禁中每幸婦人必使奏樂撤其幃帳或使人説淫穢語於其前嘗幸室女不得遂使元妃以手左右之或妃嬪列坐輒率意淫亂使共觀或令人效其形狀以為笑凡坐中有嬪御海陵必自擲一物於地使近侍環視之他視者殺誡宮中給使男子於妃嬪位舉首者刓者目出入不得獨行便旋須四人偕往所司執刀監護不由路者斬之日入後下階砌行者死告者賞錢二百萬男女倉猝誤相觸先聲言者賞三品官後言者死齊言者皆釋之女使闢懶有夫在外海陵封以縣君欲幸之惡其有娠飲以麝香水躬自揉拉其腹欲墮其胎闢懶哀欲全性命苟得乳免當不舉海陵不顧竟墮其胎蒲察阿虎迭女叉察海陵姊慶宜公主所生嫁秉德之弟特里秉德誅當連坐太后使梧桐請于海陵由是得免海陵白太后欲納叉察太后曰是兒始生先帝親抱至吾家養之至于成人帝雖舅猶父也不可其後嫁宗室安達海之子乙剌補海陵數使人諷乙剌補出之因而納之叉察與完顏守誠有姦守誠本名遏里來事覺海陵殺守誠太后為叉察求哀乃釋之叉察家奴告叉察語涉不道海陵自臨問責叉察曰汝以守誠死詈我邪遂殺之同判大宗正阿虎里妻蒲速碗元妃之妹因入見元妃海陵逼淫之蒲速碗自是不復入宮世宗為濟南尹海陵召夫人烏林答氏夫人謂世宗曰我不行上必殺王我當自勉不以相纍也夫人行至良鄉自殺是以世宗在位二十九年不復立后焉
