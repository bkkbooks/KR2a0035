body:
  text: 金史卷十本紀第十章宗二四年春正月己巳朔以皇太后喪不受朝辛未以平章政事夾谷清臣為尚書右丞相監修國史丁丑遣戶部侍郎李獻可等分路勸農事癸未尚書省奏大興府推官蘇德秀為禮部主事上曰朕既嘗語卿百官當使久於其職彼方任理官復改戶曹尋又除禮部人才豈能兼之若久於其職但中材勝於新人事既經練亦必有濟後不可輕易改除上又言凡稱政有異迹者謂其斷事有軼才也若止清廉此乃本分以貪汙者多故顯其異耳宰臣又言近言事者謂方今孝弟廉恥道缺乞正風俗此蓋官吏不能奉宣教化使然今之察舉官吏者多責近效以幹辦為上其有秉心寬厚欲行德化者輒謂之迂闊故人人皆以教化為餘事此孝弟所以廢也若諭所司官吏有能務行德化者擢而用之則教化可行孝弟可興矣今之所察舉皆先才而後德巧猾之徒雖有贓樜一旦見用猶為能吏此廉恥所以喪也若諭所司察舉官吏必審真偽使有才無行者不能覬覦非道求進者加之糾劾則奔競之俗息而廉恥可興矣辛卯賑河北諸路被水災者癸巳諭點檢司行宮外地及圍獵之處悉與民耕雖禁地聽民持農器出入丙申東京路副使三勝進鷹遣諭之曰汝職非輕民間利害官吏邪正略不具聞而乃以鷹進此豈汝所職也後毋復爾二月戊戌朔如春水始以春秋二仲月上戊日祭社稷癸丑獵于姚村淀癸亥至自春水丙寅參知政事張萬公罷三月戊辰朔諸路提刑司入見各問以職事仍誡諭曰朕特設提刑司本欲安民于今五年效猶未著蓋多不識本職之體而徒事細碎以致州縣例皆畏縮而不敢行事乃者山東民艱于食嘗遣使賑濟蓋卿等不職故至於此既往之失其思悛改庚午上將幸景明宮御史中丞董師中等上書切諫不報壬申章再上補闕許安仁拾遺路鐸皆諫乃止制定民習角抵槍棒罪以工部尚書胥持國為參知政事丙子特賜有司孔端甫及第授小學教授尋以年老命食主簿半俸致仕甲申幸香山永安寺及玉泉山甲午定配享功臣敕自今御史臺奏事修起居注並令回避夏四月丁酉朔幸興陵崇妃第是日始舉樂自己亥至癸卯百官三表請上尊號上曰祖宗古先有受尊號者蓋有其德故有其名比年五穀不登百姓流離正當戒懼修身之日豈得虛受榮名耶不許仍斷來章戊申親禘于太廟庚戌如萬寧宮辛亥右丞相清臣率百官及耆艾等復請上尊號學官劉璣亦率六學諸生趙楷等七百九十五人詣紫宸門請上尊號如唐元和故事不許丁巳賑河州飢敕女直進士及第後仍試以騎射中選者升擢之乙丑減尚食穀馬五月丙寅朔曹王永升及諸王請上尊號不許以尚局使石抹貞為橫賜夏國使己巳上以羣臣纍上尊號不受詔諭中外徒罪以下遞降一等杖以下原之甲戌觀稼于近郊辛巳諭左司遍諭諸路令月具雨澤田禾分數以聞癸未以久雨禜六月癸丑賜有司所舉德行才能之士安州崔秉仁兗州翟駒錦州齊文乙大名孫可久陳信仁應州董戣並同進士出身丙辰以晴致祭嶽鎮海瀆壬戌尚書右丞相夾谷清臣進封戴國公西京留守完顏守貞為平章政事封蕭國公尚書右丞劉瑋薨秋七月辛巳南京路提刑司自許州遷治南京己丑制三品以上官有故者若親賢勳舊尚書省即與聞奏議加追贈命以銀改鑄禮信之寶仍塗以金以同判大睦親府事襄為樞密使以御史中丞董師中等為賀宋生日使八月己亥樞密使襄帥百僚再請上尊號不許是日歲星太白晝見庚子大赦甲辰至自萬寧宮丁未釋奠孔子廟北面再拜辛亥國史院進世宗實録上服袍帶御仁政殿降座立受之九月甲子朔天壽節御大安殿受親王百官及宋高麗夏使朝賀戊辰以參知政事夾谷衡為尚書右丞戶部尚書馬琪為參知政事敕尚書省大定二十九年以後士庶言事或係國家或邊關大利害已嘗施行者可特補一官有益於官民量給以賞以西上閣門使大為夏國生日使庚午如山陵次奉先縣辛未拜天于縣西壬申致奠諸陵癸酉如秋山十一月庚午右丞相清臣參知政事持國上表丐間優詔不許戊寅以翰林直學士完顏匡等為賀宋正旦使命匡權易名弼以避宋諱壬午木冰丙戌詔諸職官以贓污不職被罪以廉能獲升者令隨路京府州縣列其姓名揭之公署以示勸懲庚寅夏國嗣子李純佑遣使來訃告十二月甲午朔夏國李純佑遣使奉故王仁孝遺表以進諭大興府於暖湯院日給米五石以贍貧者戊戌定武軍節度使鄭王永蹈以謀反伏誅己亥諭有司以鄭王財産分賜諸王澤國公主財物分賜諸公主甲辰諸王府增置司馬一人以紇石烈珵為高麗生日使西上閣門使大等為夏國敕祭慰問使庚戌尚書省以科目近多得人乞是舉增取進士上然之詔有司會試毋限人數甲寅册長白山之神為開天弘聖帝丙辰獵于近郊是歲大有年邢洺深冀及河北西路十六謀克之地野蠶成繭五年春正月癸亥朔宋高麗夏遣使來賀乙丑昭容李氏進位淑妃己巳初用唐宋典禮皇后忌辰皆廢務尚書省進區田法詔相其地宜務從民便又言遣官劭農之擾命提刑司禁止之乙亥以葉魯谷神始製女直字詔加封贈依倉頡立廟厔例祠於上京納里渾莊歲時致祭令其子孫拜奠本路官一人及本千戶春秋二祭辛巳前中都路都轉運使王寂薦三舉終場人蔡州文商經明行修足備顧問前河北西路轉運使李揚言慶陽府進士李奬純德博學鄉曲譽之絳州李天祺應州康晉侯屢赴廷試皆有才德上曰文商可令召之李奬給主簿半俸終身餘賜同進士出身遣國子祭酒劉璣册李純佑為夏國王丁亥幸城南別宮二月丁酉初定長吏勸課能否賞罰格尚書省奏禮官言孝懿皇后祥除已久宜易隆慶宮為東宮慈訓殿為承華殿從之詔購求崇文總目內所闕書籍戊戌祭社稷以宣獻皇后忌辰用熙寧祀儀樂縣而不作甲辰鄆王琮薨己酉宰臣請罷北邊屯駐軍馬不允癸丑以齊河縣民張涓濟陽縣王琛河州李錡急義好施詔復之終身仍著于令命宣徽使移剌敏戶部主事赤盞實理哥相視北邊營屯經畫長久之計三月壬申初定限錢禁庚辰初定日月風雨雷師常祀戊子置弘文院譯寫經書夏四月壬辰朔幸北苑庚子詔各路所舉德行才能之士涿州時琦雲中劉摯鄭州李升恩州傅礪濟南趙摯興中田扈方六人並特賜同進士出身以文商為國子教授特遷登仕郎己酉詔自今筐櫝床榻之飾毋以金玉壬子特賜翰林待制溫迪罕迪翰林學士承旨中奉大夫乙卯幸景明宮董師中賈守謙路鐸先後凡兩上封事切諫不報五月庚午次烏十撒八戊子桓撫二州旱遣使禱于縉山六月壬辰如氷井己亥出獵登胡土白山酹酒再拜曹王永升以下進酒丙午拜天曲赦西北路己未如查沙秋山是月宋前主殂七月戊辰獵于豁赤火一發貫雙鹿是日獲鹿二百二十二賜扈從官有差辛巳次魯溫合失不是日上親射獲黃羊四百七十一乙酉次氷井丙戌以天壽節宴樞光殿凡從官及承應人遇覃恩遷秩者並受宣敕於殿前時久雨初霽有龍曳尾于殿前雲間戊子御膳羹中有髮上舉視而棄之戒左右毋宣言八月辛亥至自景明宮壬子河決陽武故堤灌封丘而東丁巳賜從幸山後親軍銀絹有差九月戊午朔天壽節宋高麗夏遣使來賀壬戌命增定捕盜官被殺賻錢及官賞格甲子都水監官王汝嘉等坐河決各削官兩階杖七十罷之乙丑上御睿思殿諸路提刑使入見戊辰初令民買撲隨處金銀銅冶命參知政事馬琪往視河決仍許便宜從事壬申宋主遣使來告哀戊寅以知大興府事尼厖古鑑等為宋國弔祭使敕尚書省集百官議備邊事壬午特推恩東宮舊人司經王伯溫等八人官有差甲申命上京等九路並諸抹及辭等處選軍三萬俟來春調發仍命諸路並北阻以六年夏會兵臨潢冬十月庚寅右丞相夾谷清臣等表請上尊號不允宋遣使獻遺留物壬寅右丞相清臣復請上尊號國子祭酒劉璣亦率六學諸生上表陳請不允遣戶部員外郎何格賑河決被災人戶庚戌張汝弼妻高陀斡以謀逆伏誅壬子尚書省奏升提刑司所察廉官南皮縣令史肅以下十有二人而大興主簿蒙括蠻都亦在選中上知其人曰蠻都澆浮人也升之可乎與其任澆浮孰若用淳厚況蠻都常才才智過人猶不當用恐敗風俗況常才耶其再察之閏月戊午朔宋主遣使來報即位甲子親王百官各奉表請上尊號不允丙寅以代國公歡都等五人配享世祖廟廷甲戌以河東南北提刑使王啓等為賀宋主即位使乙亥獵于近郊戊寅上問輔臣孔子廟諸處何如平章政事守貞曰諸縣見議建立上因曰僧徒修飾宇像甚嚴道流次之惟儒者於孔子廟最為滅裂守貞曰儒者不能長居學校非若僧道久處寺觀上曰僧道以佛老營利故務在莊嚴閎侈起人施利自多所以為觀美也庚辰參知政事馬琪自行省回具奏河防利害語載琪傳中丙戌以翰林待制奧屯忠孝權戶部侍郎太府少監溫昉權工部侍郎行戶工部事修治河防以引進使完顏衷為夏國生日使十一月癸巳詔罷紫荊嶺所護圍場庚子以右宣徽使移剌敏等為賀宋正旦使癸丑太白晝見十二月辛酉平章政事完顏守貞罷以知大興府事尼厖古鑑為參知政事以戶部郎中李敬義為賜高麗生日使丁卯免被黃河水災今年秋稅辛巳敕減修內司備營造軍千人都城所五百人癸未敕尚書省自今獻靈芝嘉禾者賞六年春正月丁亥朔受宋高麗夏使朝賀庚寅太白晝見辛卯敕有司給天水郡公家屬田宅壬辰如春水庚戌罷陝西括地辛亥諭胥持國河上役夫聚居恐生疾疫可釰醫護視之乙卯次御林二月丁巳朔敕有司行宮側及獵所有農者勿禁己未始祭高禖庚午至自春水丁丑京師地震大雨雹晝晦震應天門右鴟尾癸未宋遣使來報謝三月丙戌朔日有食之甲午以翰林直學士孛术魯子元兼右司諫監察御史田仲禮為左拾遺翰林修撰僕散訛可兼右拾遺諭之曰國家設置諫官非取虛名蓋責實效庶幾有所裨益卿等皆朝廷選擢置之諫職如國家利害官吏邪正極言無隱近路鐸左遷本以他罪卿等勿以被責遂畏縮不言其悉心戮力毋得緘默丙申如萬寧宮戊戌以北邊糧運括羣牧所三招討司猛安謀克隨辭及迭剌唐古部諸抹西京太原官民駝五千充之惟民以駝載為業者勿括以銀五十萬兩錢二十三萬六千九百貫以備支給銀五萬兩金盂二千八百兩金牌百兩銀盂八千兩絹五萬匹雜綵千端衣四百四十六襲以備賞勞庚子以郡舉才行之士翟介然以下三人特賜進士及第李貞固以下十五人同進士出身夏四月癸亥敕有司以增修曲阜宣聖廟工畢賜衍聖公以下三獻法服及登歌樂一部仍遣太常舊工往教孔氏子弟以備祭禮甲子以尚書左丞烏林答願為平章政事右丞夾谷衡為尚書左丞丙子幸玉泉山戊寅以修河防工畢參知政事胥持國進官二階翰林待制奧屯忠孝以下三十六人各一階獲嘉令王維翰以下五十六人各賜銀幣有差庚辰以尚書右丞相夾谷清臣為左丞相監修國史封密國公樞密使襄為尚書右丞相封任國公參知政事胥持國為尚書右丞壬午賜宰臣手詔以風俗不淳官吏苟且責之五月丙戌命減萬寧宮陳設九十四所辛卯以出師遣禮部尚書張暐告于廟社乙未判平陽府事鎬王永中以罪賜死並及二子丁酉詔中外乙巳詔諸路猛安謀克農隙講武本路提刑司察其惰者罰之庚戌命左丞相夾谷清臣行省于臨潢府六月丙辰右諫議大夫賈守謙右拾遺僕散訛可坐鎬王永中事奏對不實削官二階罷之御史中丞孫即康右補闕蒙括胡剌右拾遺田仲禮各罰金二十斤丙寅以樞密副使唐括貢為樞密使以久雨禜庚辰太白經天辛巳左丞相清臣遣使來獻捷七月丙申幸曹王永升第甲辰始定文武官六貫石以上承應人並及廕者若在籍儒生章服制八月己未命兗州長官以曲阜新修廟告成于宣聖癸亥至自萬寧宮己巳以溫敦伯英言命禮部令學官講經辛未以吏部尚書吳鼎樞等為賀宋生日使壬申行省都事獨吉永中來報捷乙亥敕宮中承應人出職後三年內犯贓罪者元舉官連坐不在去官之限著為令辛巳木波進馬九月壬午朔天壽節宋高麗夏遣使來賀甲申册靜寧山神為鎮安公忽土白山神為瑞聖公丙戌知河間府事移剌仲方為御史大夫辛卯如秋山以尚書左司郎中粘割胡上為夏國生日使冬十月丙辰至自秋山丁巳以歲幸春水秋山五日一進起居表自今可十日一進乙亥命尚書左丞夾谷衡行省于撫州命選親軍武衛軍各五百人以從仍給錢五千萬十一月戊子左丞相夾谷清臣罷右丞相襄代領行省事丙申以刑部尚書紇石烈貞等為賀宋正旦使壬寅初定猛安謀克鎮邊後放免者授官格禁射糧軍應役但成隊伍不得持兵器及凡可以傷人者甲辰報敗敵於望雲乙巳以樞密使唐括貢御史大夫移剌仲方禮部尚書張暐等二十三人充計議官凡軍事則議之戊申初定縣官增水田升除制十二月乙卯詔招撫北邊軍民以知登聞檢院賈益為高麗生日使戶部員外郎納蘭昉為橫賜使戊午禮部尚書張暐等進大金儀禮丁卯應奉翰林文字趙秉文上書論姦欺乙亥詔加五鎮四瀆王爵庚辰上幸後園閲軍器是月右丞相襄率駙馬都尉僕散揆等進軍大鹽濼分兵攻取諸承安元年春正月辛巳朔受宋高麗夏使朝賀甲申大鹽濼羣牧使移剌覩等為廣吉剌部兵所敗死之丁亥國子學齋長張守愚上平邊議三篇特授本學教授仍以其議付史館二月甲子命有司祀高禖如新儀丁卯右丞相襄左丞衡至自軍前己巳復命還軍幸都南行宮春水甲戌至自行宮是月初造虎符發兵三月丁酉如萬寧宮不雨遣官望祭嶽鎮海瀆于北郊癸卯敕尚書省刑獄雖已奏行其間恐有疑枉其再議以聞人命至重不可不慎也甲辰遣參知政事尼厖古鑑祈雨于社稷丁未復遣使就祈于東嶽夏四月辛亥命尚書右丞胥持國祈雨于太廟壬子遣使審決寃獄京城禁傘扇戊午初行區種法民十五以上六十以下有土田者丁種一畝乙丑命御史大夫移剌仲方祈雨于社稷壬申命參知政事馬琪祈雨于太廟甲戌尚書省以趙承元言請追上孝懿皇太后册寶然後行諡册禮禮官執奏尊皇太后已詔示中外無追册禮從之戊寅上以久不雨命禮部尚書張暐祈于北嶽己卯遣官望祭嶽鎮海瀆于北郊五月庚辰朔觀稼于近郊因閲區田乙酉以久旱徙市庚寅詔復市如常壬辰以尚藥局副使粘割忠為橫賜夏國使乙未參知政事尼厖古鑑薨庚子雨足六月甲寅上以百姓艱食詔出倉粟十萬石減價以糶之乙丑平晉縣民利通家蠶自成綿段長七尺一寸五分闊四尺九寸詔賜絹十匹丁卯敕自今長老大師大德不限年甲長老大師許度弟子三人大德二人戒僧年四十以上者度一人其大定十五年附籍沙彌年六十以上並令受戒仍不許度弟子尼道士女冠亦如之御史大夫移剌仲方罷庚午幸環秀亭觀稼癸酉詔應禁軍器路分步弓手擬於射糧軍內選之馬弓手擬於猛安謀克軍戶餘丁內選之其有為百姓害從本州縣斷遣無猛安戶於二百里內屯駐軍餘丁內取之依步弓手月給二貫石七月庚辰御紫宸殿受諸王百官賀賜諸王宰執酒敕有司以酒萬尊置通衢賜民縱飲乙酉敕今後高麗夏使入見敷奏令新設各國通事具公服與閣門使上殿監聽命有司收瘞西北路陳亡骸骨八月己酉獵于近郊癸丑幸玉泉山甲子以郊祀日期詔中外戊辰至自萬寧宮以陝西西路轉運使董師中為御史大夫癸酉左丞衡丁父憂九月丁丑朔天壽節宋高麗夏遣使來賀幸天長觀辛巳以右丞相襄為左丞相監修國史封常山郡王壬午賜襄酒百尊太白晝見癸未都人進酒三千一百瓶詔以賜北邊軍吏以吏部尚書張嗣等為賀宋生日使癸巳左丞衡起復丁酉知大興府卞同知郭鑄以擅逮問宰臣各笞四十辛丑西南路招討使僕散揆至自軍乙巳以國子監丞烏古論達吉不為夏國生日使冬十月丙午朔詔選親軍八百人戍撫州庚戌命左丞相襄行省于北京簽書樞密院事完顏匡行院於撫州丙辰祫享于太廟十一月戊子參知政事馬琪罷庚寅特滿羣牧契丹鎖德壽反泰州軍擊敗之御史大夫董師中北京留守裔並為參知政事甲午以陝西路統軍使崇道等為賀宋正旦使丁酉朝享于太廟戊戌有事于南郊大赦改元己亥曹王永升率親王百官賀癸卯命有司祈雪仍遣官祈于東嶽十二月丙午樞密使唐括貢率百官請上尊號不允己酉遣提點太醫近侍局使李仁惠勞賜北邊將士授官者萬一千人授賞者幾二萬人凡用銀二十萬兩絹五萬匹錢三十二萬貫庚戌以同知登聞檢院阿不罕德剛為高麗國生日使壬子樞密使唐括貢復率百官請上尊號不允二年春正月乙亥朔宋高麗夏遣使來賀乙酉敕職官犯贓私不得訴于同官丁亥如安州春水丁酉至自春水辛丑宋主以母后喪遣使告哀二月丁巳敕自今職官犯贓每削一官殿一年是日太白晝見經天是月特命襲封衍聖公孔元措世襲兼曲阜令三月己卯親王百官復請上尊號不允壬午命尚書戶部侍郎溫昉佩金符行六部尚書於撫州庚寅幸西園閲軍器辛卯始定保舉德行才能格癸巳平章政事烏林答願罷丁酉樞密使唐括貢率百官請上尊號不允以參知政事裔代左丞相襄行省于北京夏四月甲寅如萬寧宮丙辰命有司祈雨望祭嶽鎮海瀆于北郊甲子祈雨于社稷尚書省奏比歲北邊調度頗多請降僧道空名度牒紫褐師德號以助軍儲從之癸酉親王宣敕始用女直字五月甲戌朔諭宰臣曰比以軍須隨路賦調司縣不度緩急促期徵斂使民費及數倍胥吏又乘之以侵暴其令提刑司究察之丙子集官吏于尚書省詔諭之曰今紀綱不立官吏薥慢遷延苟簡習以成弊職官多以吉善求名計得自安國家何賴焉至於徇情賣法省部令史尤甚尚書省其戒均丁丑北京行省參知政事裔移駐臨潢府庚辰升撫州為鎮寧軍以雨足報祭于社稷甲申望祭嶽鎮海瀆于北郊丁亥左丞相襄詣臨潢府己丑皇子生庚寅詔中外降死罪釋徒以下六月乙巳命禮部尚書張暐報祀高禖丙午雨雹戊申以澄州刺史王遵古為翰林直學士仍敕無與撰述入直則奏聞或霖雨免入直以遵古年老且嘗侍講讀也庚戌詔罷瑤光殿工作甲寅置全州盤安軍節度使治安豐縣乙卯封皇子為壽王閏月甲午出西橫門觀稼秋七月壬寅朔幸天長觀建普天大醮禁屠宰七日無奏刑百司權停決罰己未命西上閣門使劉頍賜參知政事裔宴于行省戊辰天壽節御紫宸殿受朝八月庚辰敕計議官所進奏帖可直言利害勿用浮辭辛巳以邊事未寧詔集六品以上官於尚書省問攻守之計應中外臣僚不以職位高下或有方略材武或長於調度各舉三五人以備選用無有顧望不盡所懷期五日封章以進議者凡八十四人言攻者五守者四十六且攻且守者三十三召對睿思殿論難久之癸未至自萬寧宮丙戌以左丞相襄為左副元帥參知政事董師中尚書左氶左宣徽使尚書右丞戶部尚書楊伯通參知政事尚書左丞夾谷衡罷右丞胥持國致仕庚寅參知政事裔罷樞密使唐括貢致仕壬辰以左副元帥襄為樞密使兼平章政事九月辛丑朔天壽節宋高麗夏遣使來賀壬寅遣官分詣上京東京北京咸平臨潢西京等路招募漢軍不足則簽補之乙巳以夏使朝辭詔答許復保安蘭州榷場丁未以知歸德府事完顏愈為賀宋生日使癸丑以上京留守粘割斡特剌為平章政事辛酉以樞密使兼平章政事襄知大興府事胥持國為樞密副使權參知政事行省于北京乙丑始置軍器監掌治戎器班少府監下設甲坊利器二署隸焉丁卯分遣官於東西北京河北等路中都二節鎮買牛五萬頭冬十月庚午朔初設講議所官十員共議錢穀以中都路轉運使孫鐸戶部侍郎高汝礪等為之庚辰尚書省奏高麗國牒報其王以老疾令母弟權國事壬午尚書省行推排丁亥皇子壽王薨壬辰詔奬諭西南路招討使僕散揆等有功將士甲午大雪以米千石賜普濟院令為粥以食貧民丙申以禮部員外郎蒙括仁本為夏國生日使十一月甲辰冬至有事于南郊乙巳以薪貴敕圍場地內無禁樵採壬子諭尚書省猛安謀克既不隸提刑司宜令監察御史察其臧否庚申北京留守裔以行省失職杖一百除名右諫議大夫納蘭昉杖九十削官二階罷之甲子諭宰臣曰朕居九重民間難以遍知宰相不見賓客何以得知民間利害十二月己巳朔敕御史臺糾察諂佞趨走有實迹者己卯始鑄承安寶貨癸未遣戶部侍郎上官瑜體究西京逃亡勸率沿邊軍民耕種戶部郎中李敬義規措臨潢等路農務乙酉諭宰臣今後水潦旱蝗盜賊竊發命提刑司預為規畫戊子諭西南路將士庚寅豫王永成進馬八十匹賜詔奬諭稱皇叔豫王而不名
