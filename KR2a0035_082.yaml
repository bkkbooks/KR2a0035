body:
  text: 金史卷八十二列傳第二十郭藥師子安國耶律塗山鳥延胡里改烏延吾里補蕭恭完顏習不主紇石烈胡剌耶律恕郭企忠烏孫訛論顏盞門都僕散渾坦鄭建充烏古論三合移剌溫蕭仲恭子拱蕭仲宣高松海陵諸子光英矧思阿補廣陽郭藥師渤海鐵州人也遼國募遼東人為兵使報怨于女直號曰怨軍藥師為其渠帥斡魯古攻顯州敗藥師于城下遼帝亡保天德耶律捏里自立改怨軍為常勝軍擢藥師諸衛上將軍捏里死其妻蕭妃稱制藥師以涿易二州歸于宋藥師以宋兵六千人奄至燕京甄五臣以五千人奪迎春門皆入城蕭妃令閉城門與宋兵巷戰藥師大敗失馬步走踰城以免宋人猶厚賞之太祖割燕山六州與宋人宋使藥師副王安中守燕山及安中不能庇張覺而殺之函其首以與宗望藥師深尤宋人而無自固之志矣宗望軍至三河藥師等拒戰于白河兵敗藥師乃降宗望遂取燕山太宗以藥師為燕京留守給以金牌賜姓完顏氏從宗望伐宋凡宋事虛實藥師盡知之宗望能以懸軍深入駐兵汴城下約質納幣割地全勝以歸者藥師能測宋人之情中其肯綮故也及兩鎮不受約束命諸將討之藥師破順安軍營殺三千餘人海陵即位詔賜諸姓者皆復本姓故藥師子安國仍姓郭氏郭安國藥師子也纍遷奉國上將軍南京副留守貞元三年南京大內火海陵使右司郎中梁銶同知安武軍節度事王全按問失火狀留守馮長寧都轉運使左瀛各杖一百除名安國及留守判官大良順各杖八十削三官火起處勾當官南京兵馬都指揮使吳濬杖一百五十除名失火位押宿兵吏十三人並斬諭之曰朕非以宮闕壯麗也自即位以來欲巡省河南汝等不知防慎致外方姦細燒延殆盡本欲處爾等死罪特以舊人寬貸之押宿人兵法當處死疑此輩容隱姦細故皆斬也安國性輕躁本無方略海陵將伐宋以安國將家子擢拜兵部尚書改刑部尚書軍興領武捷軍都總管與武勝武平軍為前鋒海陵授諸將方略安國前奏曰趙構聞王師至其勢必逃竄臣等不以遠近追之獲而後已但置之何地海陵大喜曰卿言是也得構即置之寺觀嚴兵守之及聞世宗即位海陵謀北還更置浙西道兵馬都統制府以完顏元宜為都統制安國副之及海陵遇弒衆惡安國所為與李通輩皆殺之贊曰郭藥師者遼之餘孽宋之厲階金之功臣也以一臣之身而為三國之禍福如是其不侔也魏公叔痤勸其君殺衛鞅豈無所見歟耶律塗山系出遙輦氏在遼世為顯族塗山仕至金吾衛大將軍遙里相溫遼帝奔天德塗山以所部降宗翰承制授尚書為西北路招討使宗翰伐宋塗山率本部為先鋒至汾州遇宋將折家軍請濟師並力破之從攻太原隆德府從入汴克洛陽及從婁室平陝右天會七年授太子少保十年遷尚書左僕射致仕卒年九十一正隆例贈特進郜國公烏延胡里改曷懶路星顯水人也後授愛也窟謀克因家焉從闍母圍平州有功及伐宋圍汴五謀克與宋兵萬人遇于城南胡里改先馳擊敗之元帥府遂賞良馬一匹天會五年攻宗城縣敵棄城走恩州胡里改追殺千餘人獲車四百兩帥府賞牛三十頭馬一匹七年討泰山羣盜平之毀其營柵兗州羣寇三千餘保據山險胡里改復破之賞牛二十二頭馬四匹八年攻廬州至柘臯鎮胡里改領甲士三十為前鋒執宋所遣持書與劉四廂錡者七人復以先鋒軍攻和州比至含山縣五里獲甲士二人乃知宋三將將兵且至胡里改伏其軍遂獲姚觀察帥府賞馬二匹九年定陝右胡里改以所部遇敵千人敗之生擒甲士一人盡得敵之虛實又從蒲魯渾徇地熙秦敗敵兵二千於秦州賞馬一匹宋人屯襄陽府監軍按補遣胡里改領四猛安往攻之宋兵三千已渡江方營壁壘乘其未就突戰破之梁王宗弼復河南將攻陳州遣胡里改以甲士三十捕偵候人至蔡州西遇兵八十餘戰敗之獲南頓縣令及攻陳州夜將四更忽聞敵開門潰走胡里改亟領二謀克軍追及之而猛安突葛速亦領軍繼至大敗之皇統二年遷定遠大將軍八年授臨洮少尹兼熙秦路兵馬副都總管九年改同知京兆尹兼本路兵馬都總管天德改同知平陽尹兼河東南路兵馬都總管貞元三年改同知曷懶路總管大定四年授胡里改節度使七年改歸德軍節度使十年移鎮顯德卒官年六十九十九年詔授其子五十六武功將軍世襲本路婆𩽆火河謀克烏延吾里補曷懶路禪嶺人也徙大名路天會中從其父達吉補隸元帥右監軍麾下撻懶以事赴闕以達吉補自隨吾里補領其父謀克從大軍攻滄州方夷濠隍城中兵來拒吾里補以本部擊却之王師下青州力戰有功獲馬百匹以獻降獲賊黨甚衆青州戍將覿吉補以萊州兵衆請濟於帥府吾里補將十二謀克兵往救之遂降其四營拔其一營得戶四千又敗賊兵五萬于恩州攻破其營降戶五萬獲牛畜萬餘將至臨清縣遇敵兵三千又敗之俘獲甚衆生擒賊首以獻帥府嘉其功以奴婢百牛三十賞之時覿吉補敗于恩州之境吾里補復以兵四千往救之破敵萬餘宋兵十萬在單父間總管宗室移剌屋選步卒一萬騎兵四千往討之吾里補領其親管謀克以從遇敵先登力戰有功大軍經略密州吾里補將兵二千為前鋒遇敵萬人于高密遂敗其衆追至城下殺戮殆盡獲馬牛三千餘吾里補與孛太欲敗賊王義軍十餘萬于州南是夜賊兵數千來襲營吾里補以兵橫擊走之後從大軍攻楚揚通泰等州天眷二年襲其父世襲猛安授寧遠大將軍皇統七年益以親管謀克天德三年除同知歸德尹正隆初為唐古部族節度使大定二年為保大軍節度使是歲改鎮通遠是時宋軍十萬餘入河隴據險要攻郡邑元帥左都監合喜奏益兵詔益兵七千遣吾里補與彰化軍節度使宗室璋等七人偕往以備任使進階龍虎衛上將軍卒于軍中蕭恭字敬之乃烈奚王之後也父翊天輔間歸朝從攻興中遂以為興中尹師還以恭為質子宗望伐宋翊當領建興成川懿五州兵為萬戶軍帥以恭材勇使代其父行時年二十三至中山宋兵出戰恭先以所部擊敗之經山東及渡淮襲康王皆在軍中師還帥府承制授德州防禦使奚人之屯濱棣間者皆隸焉改棣州防禦使皇統間改同知橫海軍節度使丁父憂起復為太原少尹用廉遷同知中京留守事纍遷兵部侍郎授世襲謀克坐問禁中起居狀決杖奪一官貞元二年為同知大興尹歲餘遷兵部尚書為宋國生日使以母憂去官起復為侍衛親軍馬步軍都指揮使正隆四年遷光祿大夫復為兵部尚書是歲經畫夏國邊界還過臨潼失所佩金牌至太原憂恚成疾時已具其事驛聞於朝海陵復命給之仍遣諭恭曰汝失信牌亦猶不謹朕方俟汝欲有委使乃稱疾耶必以去日身佩信牌歸則無以為辭欲朕先知耳使至恭已疾篤稽顙受命俄頃而卒海陵方遣使與其子護衛九哥馳視乃戒府官使善護之至保州已聞訃矣海陵深悼惜之命九哥護喪以還所過州府設奠喪至都命百官致祭親臨奠賻贈甚厚並賜馬一謂九哥曰爾父銜命卒於道途甚可悼惜朕乘此馬十年今賜汝父可常控至柩前既葬汝則乘之完顏習不主年十六從伐宋攻下懷仁縣功居最從睿宗經略陝西以兵七百人入丹州諸山遇盜三千擊敗之又破賊四千生擒其將帥出隴州以兵四百敗敵數千宋兵七千來取鞏州復擊走之又以五千兵敗吳玠之衆三萬白塔口遇敵五千復敗之別降定遠等寨皇統二年授同知臨洮尹以憂去官未期以舊職起復改孟州防禦使遷臨洮尹復以罪罷正隆三年起為京兆尹改河南尹卒年五十八紇石烈胡剌晦發川唵敦河人徙西北路識契丹字為帥府小吏梁王宗弼復陝西久不通問睿宗在燕京遣胡剌往候之是時宗弼自鳳翔攻和尚原使胡剌視彼中地形修道築城天會十二年往濱州密訪南邊事體及觀劉豫治齊狀盡得其虛實睿宗甚嘉之皇統初從宗弼渡淮及下廬和二州大破張浚韓世忠等軍遣胡剌馳奏賞以金盂重綵五端絹五匹七年授同知景州軍州事以廉加忠武校尉天德初以監察御史分司行臺歷同知濟州防禦使事入為監察御史秩滿再任大定二年遷刑部員外郎與御史大夫白彥敬往西北部族市馬纍轉泗州防禦使三遷蒲與路節度使移寧昌軍卒耶律恕字忠厚本名耨里遼橫帳秦王之族也為人謹願有志喜讀書通契丹大小字與耶律高八來歸婁室問高八曰與爾同來者誰可任用治軍旅事高八對曰耨里可婁室與宗翰伐宋恕隸前鋒取和尚原攻仙人關特為睿宗所知再除太原真定少尹撒離喝辟署陝西參謀委以軍務遷行臺兵部侍郎再遷尚書左司郎中海陵為平章政事謂恕曰君亦有黨乎恕正色曰窮則獨善其身達則兼善天下不以其道得之非恕之志也何朋黨之有海陵徐曰前言戲之耳久之為沁南軍節度使遷行臺工部尚書行臺罷改安國軍節度使為參知政事以疾求解為興中尹入為太子少保正隆元年致仕封廣平郡王薨年六十九二年例贈銀青光祿大夫郭企忠字元弼唐汾陽王子儀之後郭氏自子儀至承勳皆節鎮北方唐季承勳入于遼子孫繼為天德軍節度使至昌金降為副使企忠幼孤事母孝謹年十三居母喪哀毀如成人服除襲父官加左散騎常侍天輔中大軍至雲中遣耶律坦招撫諸部企忠來降軍帥命同勾當天德軍節度使事徙所部居于韓州及見太祖問知其家世禮遇優厚以白鷹賜之天會三年伐宋領西南諸部番漢軍兵為猛安從破雁門屯兵加桂州管內觀察留後鎮代州明年賊楊麻胡等聚衆數千于五臺企忠與同知州事迪里討平之遷知汾州事是時汾州初下居民多為軍士掠去城邑蕭然企忠詣帥府力請願聽其親舊贖還帥府從之未幾完實如故石州賊閻先生衆數萬至城下僚屬慮有內變請為備企忠曰吾於汾人有德保無他乃率吏民城守會援至合擊破之六年改靜江軍節度留後遷天德軍節度使汴京步軍都指揮使纍遷金吾衛上將軍秩滿權沁州刺史到官歲餘卒年六十八烏孫訛論善騎射襲父撒改謀克從蒙刮攻東京及廣寧擊北京山賊皆有功蕭霸哲來攻恩州訛論以六十騎偵之逮夜遇敵數百騎掩擊之生獲三人知霸哲衆九萬且至故蒙刮得以為備遂破霸哲宗望伐宋已至汴訛論破尉氏中牟援兵取其城久之以兵百五十人破敵一千於滄州西明年再伐宋蒙刮戍開州訛論以騎四百守河復敗千餘人斬首七百餘宗弼渡淮阿里先具舟于江上聞王善兵扼其前宗弼使訛論濟師敗王善于和州北李成以兵七萬據烏江訛論帥二千人直前敗之宗弼遂渡江至江寧十五年沂州竇防禦叛訛論敗之獲竇防禦録前後功授猛安加昭武大將軍宗弼再取河南訛論以五十騎敗楊家賊五百於徐州東以功受賞不可勝計天德二年除唐州刺史移淄州遷石壘部族節度使行至北京病卒顏盞門都隆州帕里干山人也身長美鬚髯天會間從其兄羊艾在軍中方取汴京其兄戰歿遂擐甲代其兄充軍睿宗定陝右以門都為蒲輦隸監軍杲親管萬戶攻饒風關至坊州杲欲與總管蒲魯虎會於鳳翔遣門都領六十騎先往期會及還備得地形險厄賞銀五十兩其後梁王宗弼駐軍山東遣人詣陝西特召門都至令齎廢齊及安撫百姓詔書往諭監軍宗室杲門都既還宗弼賞以良馬銀絹事畢復遣從杲天眷初叛將定國軍節度使李世輔僞邀杲至私署以獻甲為名遂以兵劫執而去門都突出以告押軍猛安完顏撻懶同率兵追及首出與戰杲由此得脫以功遷明威將軍復從杲招復陝西進至鳳翔齊國初廢諸路多反覆不一杲授門都牌劄令往撫定門都所至多張甲兵從者安之違者討之帖然無復叛者杲甚嘉之皇統初遷廣威將軍四年授同知通遠軍節度使事改知保安軍事天德三年為丹州刺史兼知軍事正隆初為寧州刺史大定初宋將吳璘等以軍數十萬人據秦隴元帥府承制以門都為勇烈軍都總管領軍討之宋人保據德順都監合喜遣武威軍副都總管夾谷查剌會宗室璋議征討之策璋與門都曰須都監親至敵必退矣合喜領軍四萬來赴遂復德順州明年秦隴平以功遷金吾衛上將軍授通遠軍節度使五年改慶陽尹兼本路兵馬都總管卒于官十九年録功以子六哥世襲本路曷懶兀主猛安敵骨論窟申謀克授武功將軍門都性忠厚謹賣心安置營壁尤能慎密有敵忽來雖矢石至前泰然自若乃號令士卒如平時由是人益安附而功易成焉僕散渾坦蒲與路挾悶人也身長七尺勇健有力善騎射年十六從其父胡沒速征伐初授修武校尉為宗弼扎也天眷二年與宋嶽飛相拒渾坦領六十騎深入覘伺至鄢陵敗宋護糧餉軍七百餘人多所俘獲皇統九年除慈州刺史再遷利涉軍節度使授世襲濟州和术海鸞猛安涉里斡設謀克貞元初以憂去官起復舊職歷泰寧永定軍改咸平尹海陵殺渾坦弟樞密使忽土召渾坦至南京既見沈思久之謂之曰汝有功舊不因忽土得官以此致罪甚可矜憫遂釋之改興平軍節度使世宗即位以為廣寧尹窩斡反為行軍都統與曷懶路總管徒單克寧俱在左翼敗窩斡於長濼改臨潢尹賊平賜金帛改曷懶路兵馬都總管徙顯德軍慶陽尹致仕大定十二年上思舊功起為利涉軍節度使復以金紫光祿大夫致仕卒年七十二渾坦歷一十七官未嘗為佐二性沈厚有識雖未嘗學問明於聽斷所至有治聲云鄭建充字仲實其先京兆人占籍鄜州仕宋纍官知延安府事天會七年來降仍知延安府屯兵三千宋劉光烈兵八萬來攻建充相距四十餘日攻益急建充遣人會斜喝軍夾擊破之俘其裨將賀貴遷節制司統制軍馬改京兆府路兵馬都監敗宋曲端於彭原高昌宗據延安為宋守建充擊之盡復城邑復知延安軍府事齊國建纍遷博州團練使知寧州齊國廢朝廷以地賜宋為宋環慶路經略安撫副使仍知寧州天眷復取陝西仍以為經略安撫使知慶陽從破甘谷城改平涼尹是時營建南京宮室大發河東陝西材木浮河而下經砥柱之險筏工多沉溺有司不敢以聞乃誣以逃亡錮其家建充白其事請至砥柱解筏順流散下令善游者下流接出之而錮者得釋正隆軍興括筋角造軍器百姓往往椎牛取之或生拔取其角牛有泣下者建充白其事於朝建充性剛暴常畜猘犬十數奴僕有罪既笞已復嗾犬嚙之骨肉都盡雖謙遜下士於敵已上一無所屈省部文移有不應法度輒置之坐下或即毀裂由是在位者銜之軍胥李換竊用公帑自度不得免乃誣建充藏甲欲反更再鞫皆無狀方奏上攝事者素與建充有隙恐其得釋使吏持文書紿建充曰朝省有命奈何建充曰惟汝所為是夜死于獄中長子訴亦死焉烏古論三合曷懶路愛也窟河人後徙真定睿宗為右副元帥聞三合勇略選充扎也後從宗弼征伐補麥曲院都監未幾從伐宋與宋兵遇於潁州三合先登破之皇統元年領漢軍千戶帥府再以軍四千隸焉除同知鄭州防禦使事再遷太子少詹事大定六年改洺州防禦使上曰卿昔事睿宗積勞苦逮事朕輔佐太子宣力多矣今典名郡所以勞卿也遷永定軍節度使歷臨潢鳳翔尹陝西路統軍使東平尹節制州郡躬行儉約政先寬簡邊庭久寧人民獲安召為簽書樞密院事卒十八年世宗追録三合舊勞授其子大興河北西路愛也窟河世襲猛安阿里門河謀克階武功將軍移剌溫本名阿撒遼橫帳人工契丹小字睿宗為左副元帥伐宋溫從大渡江辟江寧府都巡檢江寧太平初下宋遣諜人扇構百姓應者數萬人溫擒其諜者遂不敢竊發宗弼嘉之賜銀千兩重綵百端絹二百匹宗弼每出征伐未嘗不在行間除同知河北西路轉運使事會宗弼巡邊溫從軍不之官宗弼入朝熙宗宴羣臣宗弼欲有奏請已被酒失次溫掖而出宮明日熙宗謂宗弼曰阿撒事叔甚謹不可去左右由是宗弼益親信之嘗謂女壻紇石烈志寧曰汝可效阿撒之為人也可以幾古人矣未幾除同知中京路都轉運使事纍遷左諫議大夫兼修起居注正隆伐宋以本官為濟州路行軍萬戶從至揚州軍還除同知宣徽院事世宗御饌不適口召溫嘗之奏曰味非不美也蓋南北邊事未息聖慮有所在耳上意遂釋歷永定震武崇義節度使移臨海軍州治近水秋雨水潦暴至城下城頗決百姓惶駭不知所為溫躬督役夫繕完之雖臨不測無所避僚屬或止溫溫曰為政疵癘水泛溢為災守臣之罪當以此身為百姓謝雖死不恨移鎮武定歲旱且蝗溫割指以血瀝酒中禱而酹之既而雨霑足有羣鴉啄蝗且盡由是歲熟人以為至誠之感云以老致仕卒贊曰軍旅之事鋒鏑在前不計其死耳屬金鼓目屬旌旗心屬號令此行列之任也自收國用兵至于大定和宋以前用命之士雖細必録所以明功也蕭仲恭本名术里者祖撻不也仕遼為樞密使守司徒封蘭陵郡王父特末為中書令守司空尚主仲恭性恭謹動有禮節能被甲超槖駝遼故事宗戚子弟別為一班號孩兒班仲恭嘗為班使歷宮使本班詳穩遼帝西奔天德仲恭為護衛太保兼領軍事至霍里底泊大軍奄至倉卒走仲恭母馬乏不能進謂仲恭兄弟曰汝等盡節國家無以我為也仲恭母遼道宗季女也遼主傷之命弟仲宣留侍其母仲恭從而西時大雪寒甚遼主乏食仲恭進衣並進乾糒遼主困仲恭伏冰雪中遼主藉之以憩凡六日乃至天德始得食後與遼主俱獲太宗以仲恭忠於其主特加禮待天會四年仲恭使宋且還宋人意仲恭耶律余睹皆有亡國之戚而余睹為監軍有兵權可誘而用之乃以蠟丸書令仲恭致之余睹使為內應仲恭素忠信無反覆志但恐宋人留不遣遂陽許還見宗望即以蠟丸書獻之宗望察仲恭無他薄罰之於是再舉伐宋執二帝以歸纍遷右宣徽使改都點檢宗磐與宗幹爭辨於熙宗前宗磐拔刀向宗幹仲恭呵之乃止既而宗磐以反罪誅仲恭衛禁有備以功加銀青光祿大夫遷尚書右丞皇統初封蘭陵郡王授世襲猛安進拜平章政事同監修國史封濟王詔葬遼豫王於廣寧仲恭請往會葬熙宗義而許之改行臺左丞相居無何入為尚書右丞相拜太傅領三省事封曹王天德二年封越國王除燕京留守海陵親為書以玉山子賜之是歲薨年六十一諡貞簡正隆例降王爵改儀同三司鄭國公子拱拱本名迪輦阿不初為蘭子山猛安海陵為宰相徼取人譽薦大臣子以為達官遂以拱為禮部侍郎耶律彌勒拱妻女弟也海陵將納為妃使拱自汴取之還過燕是時仲恭為燕京留守見彌勒身形不類處子竊憂之曰上多猜嫌拱其及禍矣拱去不數日仲恭卒拱至上京聞訃以本官起復佩信牌往燕京治葬事未行彌勒入宮果如仲恭所相度即遣出宮夜半召拱至禁中詰問無狀海陵終疑之乃罷拱禮部侍郎奪其信牌拱待命踰年不報歸蘭子山治猛安事是時蕭恭張九坐語禁中事得罪拱至蘭子山與客會語及之有阿納與拱有隙乃誣拱言張九無罪被誅語涉怨謗海陵遣使鞫之戒使者曰此子狂妄宜有此語不然彼中安得知此事使者不復問拱但榜掠其左驗使如告語證之拱遂見殺仲宣本名野里補仲恭母弟聰敏好學沉厚少言五歲遙授郡刺史纍加太子少師為本班詳穩從天祚西為護衛太保左右班詳穩至石輦鐸遼主留仲宣侍母遂與其母皆見獲太宗嘉之且謂仲宣能知遼國故事命權宣徽使從睿宗伐康王師還家居者久之皇統二年特授鎮國上將軍歷順義永定昭義武寧四鎮節度使為政平易小吏不敢為姦賄賂禁絶奴婢入郡人莫識其面朔潞百姓皆為立祠刻石頌之正隆二年卒年六十四高松本名檀𩽆澄州析木人年十九從軍為蒲輦有力善戰宗弼聞其名召置左右從破汴京及和尚原纍官咸平總管府判官世宗即位充管押東京路渤海萬戶兵部尚書可喜謀反前同知延安尹李老僧曰我與萬戶高松謀之必從我矣衆曰若得此軍舉事易矣老僧往見松說松曰君有功舊人至今不得大官何也松曰我一縣令也每念聖恩纍世不能報尚敢有望乎老僧遂不敢言可喜布輝阿瑣知事不可成遂上變共捕斡論赴有司松從征窩斡以功遷咸平少尹四遷崇義軍節度使卒年七十四贊曰忠信行己豈不大哉蕭仲恭盡心故主而富貴福澤嚮之與宗室舊臣等矣仲恭廷叱宗磐而朝廷尊高松誼遏李老僧而社稷安皆有古烈丈夫之風焉海陵后徒單氏生太子光英元妃大氏生崇王元壽柔妃唐括氏生宿王矧思阿補才人南氏生滕王廣陽光英本名阿魯補徒單后所生是時燕京轉運使趙襲慶多男故又名曰趙六養于同判大宗正方之家故崇德大夫沈璋妻張氏嘗為光英保母於是贈璋銀青光祿大夫賜宗正方錢千萬天德四年二月立光英為皇太子是月安置太祖畫像于武德殿盡召國初嘗從太祖破寧江州有功者得百七十六人並加宣武將軍賜酒帛其中有忽里罕者解其衣進光英曰臣今年百歲矣有子十人願太子壽考多男子與小臣等海陵使光英受其衣海陵即以所服並佩刀賜忽里罕答其厚意後以英字與鷹隼字聲相近改鷹坊為馴鷙坊國號有英國又有應國遂改英國為壽國應國為嵵國宋亦改光州為蔣州光山縣為期思縣光化軍為通化軍云太醫院保全郎李中保和大夫薛遵義俱以醫藥侍光英李中超換宣武將軍太子左衛副率薛遵義丁憂起復宣武將軍太子右衛副率光英襁褓時養于宗正方家其後養于永寧宮及徒單斜也家貞元元年詔朝官京官五品以下奉引自通天門入居于東宮正隆元年三月二十七日光英生日宴百官于神龍殿賜京師大酺一日四年八月光英射鴉獲之海陵大喜命薦原廟賜光英馬一匹黃金三斤班賜從者有差正隆六年海陵行幸南京次安肅州光英獲二兔遣使薦于山陵居數日復獲麞兔從官皆稱賀賜光英名馬弓矢復遣使薦于山陵六月海陵至南京羣臣迎謁海陵與徒單后光英共載而入海陵嘗言俟太子年十八以天下付之朕當日遊宴於宮掖苑囿中以自娛樂光英頗警悟海陵謂侍臣曰上智不學而能中性未有不由學而成者太子宜擇碩德宿學之士使輔導之庶知古今防過失詩文小技何必作耶至於騎射之事亦不可不習恐其懦柔也及將親征后與光英挽衣號慟海陵亦泣下曰吾行歸矣後誦孝經一日忽謂人曰經言三千之罪莫大於不孝何為不孝對者曰今民家子博奕飲酒不養父母皆不孝也光英默然良久曰此豈足為不孝耶蓋指言海陵弒母事及伐宋光英居守以滿訛里也為太子少師兼河南路統軍使以衛護之完顏元宜軍變海陵遇害都督府移文訛里也殺光英于汴京死時年十二後與海陵俱葬於大房山諸王墓次訛里也咸平路窟吐忽河人襲其父忽土猛安除邳州刺史三遷昌武軍節度使歸德尹南京留守河南路統軍使太子少師大定二年遷元帥右都監宋人陷陳蔡訛里也師久無功已而兵敗于宋解職俄起為京兆尹世宗謂之曰卿為河南統軍門多私謁百姓惡之其後經略陳蔡不惟無功且復致敗以汝舊勞故復用汝京兆地近南邊宜善理之大定三年卒元壽天德元年封崇王三年薨矧思阿補正隆元年四月生小底東勝家保養之賜東勝錢千萬仍為起第五月己酉彌月封其母唐括氏為柔妃賜京師貧者五千人錢人錢二百二年矧思阿補生日海陵與永壽太后及皇后太子光英幸東勝家三年正月五日矧思阿補薨海陵殺太醫副使謝友正醫者安宗義及其乳母杖東勝一百除名明日追封矧思阿補為宿王葬大房山諫議大夫楊伯雄入直禁中因與同直者相語伯雄曰宿王之死蓋養于宮外供護雖謹不若父母膝下豈國家風俗素尚如此或以此言告海陵海陵大怒謂伯雄曰爾臣子也君父所為豈得言風俗宮禁中事豈爾當言朕或體中不佳間不視朝秪是少得人幾拜耳而庶事皆奏決便殿縱有死刑不即論決蓋使囚者得緩其死至於除授宣敕雖復稽緩有何利害朕每當閒暇頗閲教坊聲樂聊以自娛書云內作色荒外作禽荒酣酒嗜音峻宇雕牆有一於此未或不亡此戒人君不恤國事溺於此者耳如我雖使聲樂喧動天地宰相敢有濫與人官而吏敢有受賕者乎外間敢有竊議者乎爾諫官也有可言之事當公言之言而不從朕之非也而乃私議可乎伯雄對曰陛下至德明聖固無竊議者愚臣失言罪當萬死惟陛下哀憐海陵曰本欲殺汝今祗杖汝二百既決杖至四十使近臣傳詔諭伯雄曰以爾藩邸有舊今特釋之滕王廣陽母南氏本大家婢隨元妃大氏入宮海陵幸之及有娠即命為殿直正隆二年九月二十六日生廣陽十月滿月海陵分施在京貧民凡用錢千貫三年二月封南氏為才人七月封廣陽為滕王九月薨贊曰海陵伐宋光英居守使滿訛里也以宮師兼統軍之任計至悉也豈料死其手乎荀首有言不以人子吾子其可得耶海陵睨人之子不翅魚肉而獨己子之謀安不可得矣
