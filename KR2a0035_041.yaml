body:
  text: 金史卷四十一志第二十二儀衛上常朝儀衛內外立仗常行儀衛行仗法駕黃麾仗金制天子之儀衛一曰立仗二曰行仗其衛士曰護衛曰親軍曰弩手曰控鶴曰傘子曰長行立仗則有殿庭內仗殿庭外仗凡大禮大朝會則用之其朔望常朝弩手百人分立兩階而已行仗則有法駕大駕黃麾仗凡行幸及郊廟祀享則用之其非大禮遠出則有常行儀衛宮中導從焉大抵模倣宋制錯綜增損而用之其宿衛則見兵志云初國制凡朔望常朝日殿下列衛士簾下置甲兵正隆元年海陵去甲兵惟存錦衣弩手百人分立兩階其儀都副點檢公服偏帶常朝則展紫左右衛將軍宿直將軍展紫金束帶各執玉水晶及金飾骨𩽆左右親衛盤裹紫襖塗金束帶骨𩽆佩兵械供御弩手傘子百人並金花交腳幞頭塗金銅鈒襯花束帶骨𩽆左右班執儀物內侍二十人展紫塗金束帶朝參日弩手傘子直於殿門外分兩面排立司辰報時畢皇帝御殿坐鳴鞭閣門報班齊執擎儀物內侍分降殿階南向立點檢司起居弩手傘子於殿門外北面山呼聲喏訖即於殿門外東西相向排立都點檢以次三員升殿都點檢在東近南左副又少南右副在西東向對立左右衛將軍在殿下東西對立省臣隨班起居畢左右司侍郎從宰執奏事殿中侍御史隨班起居畢東西對立於左右衛將軍之北少前修起居注分殿陛東西對立於殿欄外副階下以俟奏事畢皇帝還閣侍衛者乃退凡遇大禮大朝會則有內外立仗熙宗皇統元年正月上冊寶立仗一千一百八十人自是以後至海陵時俱用三千人世宗大定七年上冊寶頗損其數且以天德貞元不設車輅遂並去之是後或减至二千或一千或八百或六百人天德二年海陵立后發冊勤政殿設黃麾細仗用前六部攝官七十一擎執六百七十八人受冊泰和殿用後六部攝官三十六擎執三百二十二人大定八年正月冊皇太子於大安殿用黃麾半仗二千二百六十五人奉表于仁政殿用黃麾細仗一千四百二人二十七年冊皇太孫亦如之大定八年黃麾半仗攝官一百七十五人擎執二千八十一人編排職掌九人殿庭內仗以中心東西相向一重並面北旗幟為中道左行自北西向排列黃麾幡一首執者三人碧襴官一大雉扇二碧襴官一中雉扇六碧襴官一小雉扇六碧襴官一朱團扇六碧襴官一睥睨四碧襴官一紅大傘一碧襴官一紫方傘二碧襴官一華蓋一右行東向列者並同面北第一行牙門旗八共二十四人分左右留中道第二行監門校尉十二分左右第三行長壽幢一押旗大將軍一居中次東五方龍旗十五次西五方鳳旗十五第四行自內而東青龍旗五紅龍旗二十自內而西青龍旗五紅龍旗二十第五行同上又君王萬歲旗一五人居中日旗一五人在左月旗一五人在右第六行自內而東天下太平旗苣紋旗日月合璧旗苣紋旗青龍旗赤龍旗河瀆旗江瀆旗各一旗五人排仗通直官一排仗大將一未午巳辰卯寅旗各一青天王旗白天王旗各一自內而西祥雲旗五星連珠旗祥雲旗黃龍旗白龍旗黑龍旗淮瀆旗濟瀆旗各一旗五人通直官一大將一申酉戌亥子丑旗各一緋天王旗皂天王旗各一第七行自內而東孔雀旗一五人蒼烏旗兕旗犛牛旗月人丁旗赤熊旗白狼旗金鸚鵡旗馴犀旗角端旗夋鳥旗騶牙旗野馬旗瑞麥旗甘露旗各一旗五人自內而西者同外仗在門外左邊西向自北排列第一部第一行侍御史大將軍折衝都尉各一主帥三第二行絳引幡五首十五人龍頭竿四弓矢五揭鼓二龍頭竿四儀鍠斧五龍頭竿四朱刀盾五龍頭竿四緑刀盾五龍頭竿四小戟五第三行與第一行同第四行與第二行同第二部第三部第四部第五部以次而南各為前後四行其名數與第一部同惟無絳引幡右五部東向排列色數皆同左第五行從北每大旗一均用小紅龍旗二間之角宿旗一三人均用二亢宿旗一三人均用二氐宿旗一三人均用二房宿旗一三人均用二心宿旗一三人均用二尾宿旗一三人均用二箕宿旗一三人均用二斗宿旗一三人均用二牛宿旗一三人均用二女宿旗一三人龍旗並黃排襴旗各一虛宿旗一三人紅黃排襴旗二危宿旗一三人紅紫排襴旗二室宿旗一三人黃紫排襴旗二壁宿旗一三人紅黃排襴旗二重輪旗一三人紅紫排襴旗二左攝提旗一三人黃紫排襴旗二青龍旗一三人紅黃排襴旗二木星旗一三人紅紫排襴旗二火星旗一三人黃紫排襴旗二土星旗一三人紅黃排襴旗二金星旗一三人紅紫排襴旗二水星旗一三人吏兵並紫排襴旗各一北嶽旗一三人吏兵並龍君旗各一東嶽旗一三人龍君並黃熊旗各一中嶽旗一三人黃熊並赤豹旗各一西嶽旗一三人赤豹並力士旗各一南嶽旗一三人力士並虎君旗各一朱雀旗一三人虎君並天馬旗各一右第五行從北奎旗一三人婁旗一三人胃旗一三人昴旗一三人畢旗一三人觜旗一三人參旗一三人井旗一三人鬼旗一三人皆均用二旗如前柳宿旗一三人紅龍並黃排襴旗各一星宿旗一三人紅黃排襴旗二張宿旗一三人紅紫排襴旗二翼宿旗一三人紫黃排襴旗二軫宿旗一三人紅黃排襴旗二重輪旗一三人紅紫排襴旗二右攝提旗一三人紫黃排襴旗二白虎旗一三人紅黃排襴旗二東方神旗一三人紅紫排襴旗二南方神旗一三人黃紫排襴旗二中央神旗一三人紅龍排襴旗二西方神旗一三人紅紫排襴旗二北方神旗一三人力士並紫排襴旗各一風伯旗一三人力士並虎君旗各一雨師旗一三人虎君並黃熊旗二雷公旗一三人黃熊並赤豹旗二電母旗一三人赤豹並吏兵旗二北斗旗一三人吏兵並龍君旗二玄武旗一三人龍君並天馬旗二三人執一旗者重立二人各執小旗者亦重立殿門外仗亦從北留中道飛麟旗駃騠旗鸞旗麟