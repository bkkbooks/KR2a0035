body:
  text: 金史卷十七本紀第十七哀宗上哀宗諱守緒初諱守禮又諱寧甲速宣宗第三子母曰明惠皇后王氏賜姓溫敦氏仁聖皇后之女兄也承安三年八月二十三日生於翼邸仁聖無子養為己子泰和中授金紫光祿大夫宣宗登極進封遂王授祕書監改樞密使貞祐初莊獻太子守忠薨立皇孫鏗為皇太孫尋又薨四年正月己卯立守禮為皇太子仍控制樞密院事詔略曰子以母貴遂王守禮地鄰冢嫡慶集元妃立為皇太子其典禮有司條具以聞四月甲午用太子少保張行信言更賜名守緒元光二年十二月庚寅宣宗崩辛卯奉遺詔即皇帝位于柩前壬辰詔大赦略曰朕述先帝之遺意有便於時欲行而未及者悉奉而行之國家已有定制有司往往以情破法使人罔遭刑憲今後有本條而不遵者以故入人罪罪之草澤士庶許令直言軍國利害雖涉譏諷無可采取者並不坐罪正大元年春正月戊戌朔詔改元正大庚子上居廬百官始奏事祕書監權吏部侍郎蒲察合住改州刺史左司員外郎泥厖古華山同知楨州軍州事逐二姦臣大夫士相賀邠州節度使移剌术納阿卜貢白兔詔曰得賢臣輔佐年穀豐登此上瑞也焉事此為令有司給道里費縱之本土禮部其徧諭四方使知朕意丁巳詔朝臣議修復河中府禮部尚書趙秉文太常卿楊雲翼等言陝西民方疲敝未堪力役遂止戊午上始視朝大司農守汝州防禦使李蹊為太常卿權參知政事平章政事荊王守純罷判睦親府參知政事僕散五斤罷充大行山陵使尊皇后溫敦氏元妃溫敦氏皆為皇太后號其宮一曰仁聖一曰慈聖百官入賀于隆德殿是日大風飄端門瓦赤盞合喜權樞密副使有男子服麻衣望承天門且笑且哭詰之則曰吾笑笑將相無人吾哭哭金國將亡羣臣請置重典上持不可曰近詔草澤諸人直言雖涉譏訕不坐法司唯以君門非笑哭之所重杖而遣之南陽民布陳謀反伏誅三月熒惑犯左執法戊申奉安宣宗御容于孝嚴寺辛亥丞相高汝礪薨癸丑葬宣宗于德陵甲寅起復邠州節度使致仕張行信為尚書左丞以延安帥臣完顏合達戰禦有功授金虎符權參知政事行尚書省事于京兆兼統河東兩路夏四月癸酉宣宗祔廟大赦中外熒惑犯右執法五月戊戌平章政事把胡魯薨癸卯樞密副使完顏賽不為平章政事權參知政事石盞尉忻為尚書右丞太常卿李蹊為翰林承旨仍權參政甲辰賜策論進士孛术論長河以下十餘人及第經義進士張介以下五人及第戊申賜詞賦進士王鶚以下五十人及第詔刑部登聞檢鼓院毋鎖閉防護聽有寃者陳訴六月甲戌宰執請擊鞠上以心喪不許辛卯立妃徒單氏為皇后遣樞密判官移剌蒲阿率兵至光州榜諭宋界軍民更不南伐秋七月己亥詔諭百官各勤乃職癸卯補修大樂九月樞密判官移剌蒲阿復澤潞獲馬千疋冬十月戊午夏國遣使來修好十二月乙巳州刺史蒲察合住有罪伏誅甲寅宣宗小祥燒飯于德陵改定辟舉縣令法以六事課縣令京東西南陝西設大司農司兼採訪公事京師大司農總之左丞張行信言先帝詔國內刑不上大夫治以廉恥丞相高琪所定職官犯罪的決百餘條乞改依舊制上不欲彰先帝之過略施行之二年春正月甲申有黃黑之祲夏四月辛卯朔山公武仙自真定府來奔起復平章政事致仕莘國公胥鼎為平章政事行省事于衞州進封英國公甲午以京畿旱遣使慮囚鈞許州大雨雹丁酉宿鄭州雨傷麥五月丁丑以旱甚責己避正殿減常膳赦罪蘇椿自大名來奔詔置椿許州秋七月都水蒲察毛花輦殺人免死除名八月鞏州元帥田瑞反行省軍圍之其母弟十哥殺瑞出降赦其罪以為涇州節度使世襲猛安九月夏國和議定以兄事金各用本國年號遣使來聘奉國書稱弟冬十月以夏國修好詔中外新軍政改總領為都尉己酉以誅田瑞詔中外癸亥遣禮部尚書奧敦良弼大理卿裴滿欽甫侍御史烏古孫弘毅為夏國報成使國書稱兄乙亥面諭臺諫完顏素蘭陳規曰宋人輕犯邊界我以輕騎襲之冀其懲創通好以息吾民耳夏人從來臣屬我朝今稱弟以和我尚不以為辱果得和好以安吾民尚欲用兵乎卿等宜悉朕意移剌蒲阿及宋人戰于光州獲馬數千殺人千餘而還內族王家奴故殺鮮于主簿權貴多救之者上曰英王朕兄敢妄撻一人乎朕為人主敢以無罪害一人乎國家衰弱之際生靈有幾何而族子恃勢殺一主簿吾民無主矣特命斬之詔有司為死節士十有三人立褒忠廟禁宿泗青口巡邊官兵毋復擅殺過淮紅衲軍詔趙秉文楊雲翼作龜鏡萬年錄三年春正月丁巳朔夏國遣使來賀三月陝西旱平章政事胥鼎復請致仕不許詔尚書省議省減用度夏四月辛卯親享于太廟郕國夫人車經御路過廟前馭者乘馬二婢坐車中俱不下詔繫獄杖之辛丑以旱遣官禱于濟瀆癸卯祈于太廟禁傘扇河南大雨雹己酉遣使慮囚遣使捕蝗五月己未大雨宋兵掠壽州境癸亥永州桃園軍失利死者四百人乙丑大雨壬申詔諭隩州趙甫等能以土地來歸當任使之六月辛卯京東大雨雹蝗盡死壬子詔諭高麗及遼東行省葛不靄討反賊萬奴赦脅從者秋七月庚午平章政事英國公胥鼎薨八月移剌蒲阿復曲沃及晉安辛卯詔設益政院于內廷以禮部尚書楊雲翼等為益政院說書官日二人直備顧問冬十月丁酉夏使來報哀十一月庚申議與宋修好戊辰又議之己巳宋忠義軍夏全自楚州來歸楚州王義深張惠范成進以城降封四人為郡王辛未改楚州為平淮府以夏全等來降赦諸路從宋及淮楚官吏軍民幷其家屬甲戌遣使夏國賀正旦丙子夏以兵事方殷來報各停使聘大元兵征西夏平中興府召陝西行省及陝州總帥完顏訛可靈寶總帥紇石烈牙吾塔赴汴議兵事詔諭陝西兩省凡戎事三品以下官聽以功過賞罰之銀二十五萬兩從其給賞遣中奉大夫完顏履信等為弔祭夏國使四年春正月辛亥朔壬戌增築中京城浚汴城外濠二月蒲阿牙吾塔復平陽執知府李七斤獲馬八千三月簽勞效官充軍有怨言不果用以銀贖平陽虜獲男女分賜官軍者聽自便大元兵平德順府節度使愛申攝府判馬肩龍死之大元兵復下平陽己巳徵夏稅二倍夏五月丁丑議乞和于大元大元兵平臨洮府總管滿胡土門死之陝西行省進三策上策自將出戰中策幸陝州下策棄秦保潼關不從六月戊申朔遣前御史大夫完顏合周為議和使丙辰地震太白入井賜詞賦經義盧亞以下進士第秋七月大元兵自鳳翔徇京兆關中大震工部尚書師安石為尚書右丞壬辰以中丞烏古孫卜吉祭酒裴滿阿虎帶兼司農卿簽民軍勸率富民入保城聚兼督秋稅令百姓知避遷之計丁酉赦陝西東西兩路賜民今年租八月庚戌詔有司罷遣防備丁壯修城民夫軍須差發應不急者權停己巳萬年節同知集賢院史公奕進大定遺訓待制呂造進尚書要略是日大風落左掖門鴟尾壞丹鳳門扉隕霜禾盡損李全自益都復入楚州據之遣總帥完顏訛可元帥慶山奴守盱眙與全戰于龜山敗績冬十月辛酉右拾遺李大節右司諫陳規劾同判睦親府事撒合輦姦贓不報壬戌外臺監察御史諫獵上怒以邀名賣直責之詔贈德順府死事愛申馬肩龍等官以淮南王爵招李全十一月乙未未時日上有二白虹貫之丁酉獵于近郊十二月真授李蹊參知政事大元兵下商州壬子遣使安撫陝西以牛千頭賜貧民五年春正月丁丑親祭三廟庚辰遣知開封府事完顏麻斤出如大元弔慰丙戌議擊盱眙辛卯以龜山之敗降元帥慶山奴為定國軍節度使二月乙巳朔大寒雷雨雪木之華者盡死癸丑詔有司以臨洮總管滿胡土門塑像入褒忠廟書死節子孫于御屏量材官使之三月甲戌朔羣臣請依祖宗故事樞密院聽尚書省節制不從乙酉監察御史烏古論不魯剌劾近侍張文壽張仁壽李麟之受饋遺曲赦其罪而出之夏四月甲辰朔以御史言三姦不已凡四日不視朝八日議放還西夏人口丙寅右丞師安石薨親衞軍王咬兒酗酒殺其孫大理寺當以徒刑特命斬之五月癸巳定國軍節度使慶山奴以受賂奪一官六月壬戌以旱赦雜犯死罪已下秋七月戊子同判睦親府事撒合輦出為中京留守行樞密院事八月乙卯以旱遣使禱于上清宮甲子參知政事白撒為尚書右丞太常卿顏盞世魯權參知政事增築歸德行樞密院擬工役數百萬詔遣權樞密院判官白華喻以農夫勞苦減其工三之二以節制不一併衞州帥府於山公府命白華往經畫之九月庚寅雨足始種麥冬十一月辛巳進宣宗實錄十二月庚子朔日有食之完顏麻斤出以奉使不職免死除名壬子完顏奴申改侍講學士充國信使以陝西大寒賜軍士柴炭銀有差京兆鳳翔府司竹監退竹令分給之六年春二月丙辰樞密院判官移剌蒲阿權樞密副使耀州刺史李興有戰功詔賜玉兔鶻帶金器以丞相完顏賽不行尚書省事于關中召平章政事完顏合達還朝移剌蒲阿率忠孝軍總領完顏陳和尚忠孝軍一千騎駐邠州遣白華馳諭蒲阿以用兵之意詔樞密更給忠孝軍馬疋以漸調發都尉司步卒及忠孝馬軍屯京西以白華專備軍須三月乙亥忠孝軍總領陳和尚有戰功授定遠大將軍平涼府判官世襲謀克夏五月隴州防禦使石抹冬兒進黃鸚鵡詔曰外方獻珍禽異獸違物性損人力令勿復進秋七月罷陝西行省軍中浮費八月移剌蒲阿再復澤潞九月洮河蘭會元帥顏盞蝦進西馬二疋詔曰卿武藝超絕此馬可充戰用朕乘此豈能盡其力既入進即尚竹罒戊物也今以賜卿其悉朕意冬十月移剌蒲阿東還令陳和尚率陝西歸順馬軍屯鈞許大元兵駐慶陽界詔陝西行省遣使奉羊酒幣帛乞緩師請和十一月遣使鈞許選試陝西歸順人得軍二千以藝優者充忠孝軍次充合里合軍十二月詔副樞蒲阿總帥紇石烈牙吾塔權簽樞密院事完顏訛可救慶陽罷附京獵地百里聽民耕稼七年春正月副樞蒲阿總帥牙吾塔權簽院事訛可解慶陽之圍以訛可屯邠州蒲阿牙吾塔還京兆夏五月詔釋清口宋敗軍三千人願留者五百人以屯許州餘悉縱遣之賜經義詞賦李瑭以下進士第秋七月以平章政事合達權樞密副使八月賜陝西死事之孤鹽引及絹仍量材任使大元兵圍武仙于舊衞州冬十月平章合達副樞蒲阿引兵救衞州衞州圍解上登承天門犒軍合達蒲阿並世襲謀克移剌蒲阿權參知政事同合達行省事于閺鄉以備潼關八年春正月大元兵圍鳳翔府遣樞密院判官白華右司郎中夾谷八里門諭閺鄉行省進兵合達蒲阿以未見機會不行復遣白華諭合達蒲阿將兵出關以解鳳翔之圍又不行夏四月丁巳朔赦全免京西路軍需錢一年旱災州縣差稅從實減貸大元兵平鳳翔府兩行省棄京兆遷居民於河南留慶山奴守之五月李全妻楊妙真以全陷沒于宋構浮梁楚州北欲復宋讎遣合達蒲阿屯桃源界滶河口以備侵軼宋八里莊人拒其主將納合達蒲阿詔改八里莊為鎮淮府秋七月宋將焚浮梁九月丙申慈聖宮皇太后溫敦氏崩遺誥園陵制度務從儉約大元兵駐河中府慶山奴棄京兆東還召合達蒲阿赴汴議引兵趨河中府懼不敢行還陝州出師至冷水谷而歸大元兵攻河中府合達蒲阿遣元帥王敢率兵萬人救之冬十月右丞相賽不致仕十一月丁未大元進兵嶢峯關由金州而東省院議以逸待勞未可與戰上諭之曰南渡二十年所在之民破田宅鬻妻子竭肝腦以養軍今兵至不能逆戰止以自護京城縱存何以為國天下其謂我何朕思之熟矣存與亡有天命惟不負吾民可也乃詔諸將屯軍襄鄧十二月己未葬明惠皇后河中府破權簽樞密院事草火訛可死之元帥板子訛可提敗卒三千走閺鄉詔赦將佐以下杖訛可二百以死合達蒲阿率諸軍入鄧州楊沃衍陳和尚武仙皆引兵來會出屯順陽戊辰大元兵渡漢江而北丙子畢渡合達蒲阿將兵禦于禹山之前大元兵分道趨汴京京師戒嚴是夜二鼓合達蒲阿引軍還鄧州大元兵躡其後盡獲其輜重天興元年是年本正大九年正月改元開興四月又改元天興春正月壬午朔日有兩珥大元兵道唐州元帥完顏兩婁室與戰襄城之汝墳敗績兩婁室走汴京遣完顏麻斤出等部民丁萬人決河水衞京城癸未置尚書省樞密院于宮中以便召問起前元帥古里甲石倫權昌武軍節度使行元帥府事合達蒲阿引軍自鄧州赴汴京乙酉以點檢夾谷撒合為總帥將步騎三萬巡河渡權近侍局使徒單長樂監其軍起近京諸色軍家屬五十萬口入京丙戌大元兵既定河中由河清縣白坡渡河丁亥長樂撒合引兵至封丘而還戊子左司郎中斜卯愛實上書請斬長樂撒合以肅軍政不從都尉烏林荅胡土一軍自潼關入援至偃師聞大元兵渡河遂走登封少室山壬辰衞州節度使完顏斜捻阿不棄城走汴甲午修京城樓櫓及守禦備大元兵薄鄭州與白坡兵合屯軍元帥馬伯堅以城降防禦使烏林荅咬住死之乙未大元游騎至汴城丁酉大雪大元兵及兩省軍戰鈞州之三峯山兩省軍大潰合達陳和尚楊沃衍走鈞州城破皆死之樞密副使蒲阿就執尋亦死武仙走密縣自是兵不復振己亥徐州行省完顏慶山奴引兵入援義勝軍校侯進杜正張興率所部北降慶山奴入睢州庚子御端門肆赦改元開興辛丑潼關守將李平以關降大元壬寅扶溝民錢大亨李鈞叛殺縣令王浩及其簿尉庚戌許州軍變殺元帥古里甲石倫粘合仝周蘇椿等以城降大元二月壬子朔慶山奴謀走歸德至陽驛店遇大元兵徐帥完顏兀里力戰而死慶山奴被擒使招京城不從睢州刺史張文壽棄城從慶山奴皆死之甲寅大元兵徇臨渙攝縣令張若愚死之戊午次盧氏關陝行省總帥兩軍及秦藍帥府軍棄潼關而東與之遇天又大雪未戰而潰行省徒單兀典總帥納合合閏敗死完顏重喜降斬于馬前都尉鄭倜殺都尉苗英亦降秦藍總帥府經歷商衡死之大元兵下睢州庚申翰林待制馮延登使北來歸乙丑大元兵攻歸德庚午起復右丞相致仕賽不為左丞相括京師民軍二十萬分隸諸帥人月給粟一石有五斗三月丁亥大元軍平中京留守撒合輦投水死甲午命平章政事白撒宿上清宮樞密副使合喜宿大佛寺以備緩急大元遣使自鄭州來諭降使者立出國書以授譯史譯史以授宰相宰相跪進上起立受之以付有司書索翰林學士趙秉文衍聖公孔元措等二十七家及歸順人家屬蒲阿妻子繡女弓匠鷹人又數十人庚子封荊王子訛可為曹王議以為質密國公璹以曹王幼請代行上慰遣之不聽其代壬寅尚書左丞李蹊送曹王出質諫議大夫裴滿阿虎帶太府監國世榮為講和使戶部侍郎楊慥權參知政事分軍防守四城大元兵攻汴城上出承天門撫西面將士千戶劉壽語不遜詔釋勿問癸卯上復出撫東面將士親傅戰傷者藥于南薰門下仍賜卮酒出內府金帛器皿以賞戰士乙巳鳳翔府砲軍萬戶王阿驢樊喬來歸己酉造革車三千兩已而不用置局養無家俘民夏四月癸丑兵士李新有功擢四方舘使元帥劉益叱其子戰死丁巳遣戶部侍郎楊居仁奉金帛詣大元兵乞和戊午又以珍異往謝許和癸亥明惠皇后陵被發失柩所在遣中官往視之至是始得以兵護宮女十人出迎朔門奉柩至城下御幄安置是夜復葬之戮鄭倜妻子甲子御端門肆赦改元天興詔內外官民能完復州郡者功賞有差出金帛酒炙犒飫軍士減御膳罷冗員放宮女上書不得稱聖改聖旨為制旨釋鎬厲王衞紹王二族禁錮聽自便乙丑百官初起居于隆德殿前丙寅以尚書省兼樞密院事丁卯放宮女聽以衣裝自隨金珠留犒士卒汴京解嚴步軍始出封丘門采薪蔬己巳建威都尉完顏兀論同大元使沒忒入城庚午見使臣於隆德殿放宮女如前辛未開鄭門聽百姓男子出入甲戌御承天門大饗將士聞有聲屈者乃還宮乙亥有詔止奏事許州進櫻桃五月辛巳遷民告出城者以萬數賽不白撒不聽乙酉以南陽郡王子思烈行尚書省于鄧州召援兵丙戌拜天於大慶殿詔白撒致仕放京城四面軍李辛不奉詔丁亥鑿洧川漕渠尋罷之馮延登以奉使有勞授禮部侍郎戊子裕州鎮防軍將領賀都喜率西軍二千人入援放遷民出京辛卯大寒如冬密國公璹薨汴京大疫凡五十日諸門出死者九十餘萬人貧不能葬者不在是數癸巳楊春入據亳州觀察判官劉均死之辛丑上御香閤面責宰相乙巳將相受保城爵賞六月庚戌朔詔百官舉大將衆舉劉益不能用癸丑飛虎軍二百人奪封丘門出奔甲寅以出師錮門禁乙卯白撒開渠於私第東丙辰閱官馬擇瘠者殺以食丁巳封仙據徐州徒單益都走宿州推張興行省事庚申塞京城四門以便守禦壬戌國安用入徐州殺張興推封仙為元帥以主州事己巳詔贈禦侮中郎將完顏陳和尚鎮南軍節度使立褒忠廟碑權參知政事楊慥罷辛未復修汴城以疫後園戶僧道醫師鬻棺者擅厚利命有司倍征之以助其用甲戌宿州鎮防千戶高臘哥李宣殺節度使紇石烈阿虎父子請行省徒單益都主帥事益都不從率其將吏西走至穀熟遇大元軍死之乙亥左丞李蹊送曹王與其子仝俱還丁丑山公武仙殺士人李汾七月庚辰朔兵刃有火辛巳軍士撾登聞鼓乞將劉益癸未尚書右丞顏盞世魯罷吏部尚書完顏奴申為參知政事甲申飛虎軍士申福蔡元擅殺北使唐慶等三十餘人于舘詔貰其罪和議遂絕乙酉都人揚言欲殺白撒密詔遣衞士護其家丙戌軍士毀白撒別墅斜捻阿不妄殺市人之過其門者以靖亂丁亥拜天于承天門下出內府及兩宮物賜軍士戊子下令招軍辛卯簽民為兵鞏昌民百二十人赴援乙未宿州帥衆僧奴稱國安用降遣近侍直長因世等持詔封安用為兗王行京東等路尚書省事賜姓完顏改名用安新軍有撾登聞鼓者杖殺之乙巳金木火太陰會于軫翼丙午參知政事完顏思烈山公武仙鞏昌總帥完顏忽斜虎率諸將兵自汝州入援以合喜為樞密使將兵一萬應之命左丞李蹊勸諭出師乃行八月己酉朔合喜屯杏花營又益兵五千人始進屯中牟故城庚戌發丁壯五千人運糧餉合喜軍辛亥完顏思烈遇大元兵于京水遂潰武仙退保留山思烈走御寨中京元帥左監軍任守貞死之合喜棄輜重奔至鄭門聚兵乃入甲寅免合喜為庶人籍其家以賜軍士降監軍長樂為符寶郎丁巳釋奠孔子戊午括民間粟己未籍徒單兀典完顏重喜納合合閏家貲前儀封令魏璠上言鞏昌帥完顏仲德沉毅有遠謀臣請奉命往召不報戊辰免府試起復前大司農侯摯為平章政事進封蕭國公行京東路尚書省事己巳摯帥兵行至封丘將士將潰摯止之乃與衆還汴壬申聽無軍家口戍京甲戌金木星交乙亥賣官及許買進士第丙子詔罷括粟復以進獻取之丁丑京城民楊興入貲授延州刺史戊寅劉仲溫入貲授許州刺史
