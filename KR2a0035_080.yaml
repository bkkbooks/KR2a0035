body:
  text: 金史卷八十列傳第十八熙宗二子濟安道濟斜卯阿里突合速烏延蒲盧渾赤盞暉大本名撻不野磐本名蒲速越阿離補子方熙宗諸子悼平皇后生太子濟安賢妃生魏王道濟濟安皇統二年二月戊子生於天開殿上年二十四始有皇子喜甚遣使馳報明德宮太皇太后五日命名大赦天下三月甲寅告天地宗廟丁巳翦鬌奏告天地宗廟戊午冊為皇太子封皇后父太尉胡塔為王賜人口馬牛五百駝五十羊五千隨朝職官並遷一資皆有賜己未詔天下十二月濟安病劇上與皇后幸佛寺焚香流涕哀禱曲赦五百里內罪囚是夜薨諡英悼太子葬興陵之側上送至烏只黑水而還命工塑其像于儲慶寺上與皇后幸寺安置之海陵毀上京宮室寺亦隨毀道濟皇統三年命為中京留守以直學士阿懶為都提點張玄素為同提點左右輔導之俄封魏王封其母為賢妃初居外至是養之宮中未幾熙宗怒殺之贊曰國初制度未立太宗熙宗皆自諳班勃極烈即帝位諳班勃極烈者漢語云最尊官也熙宗立濟安為皇太子始正名位定制度焉斜卯阿里父渾坦穆宗時內附數有戰功阿里年十七從其伯父胡麻谷討詐都獲其弟沙里只高麗築九城於曷懶甸渾坦攻之遇敵於木里門甸力戰久之阿里挺槍馳刺其將於陳中敵遂潰渾坦與石適歡合兵於徒門水阿里首敗敵兵取其二城高麗入寇以我兵屯守要害不得進乃還阿里追及于曷懶水高麗人爭走冰上阿里乘之殺略幾盡遂合兵于石適歡道遇敵兵五萬擊走之又與石適歡遇敵七萬阿里先登奮擊大敗之石適歡曰汝一日之間三破重敵功豈可忘乃厚賜之斡塞烏睹本攻駝吉城阿里鑿墉為門日已暮不可入以兵守之旦日遂取其城烏睹本以被甲並乘馬賜之從攻下寧江州授猛安又從攻信州賓州皆克之遼人來攻孛堇忽沙里城阿里率百餘騎救之遼兵數萬阿里兵少乃令軍士裂衣多為旗幟出山谷間遼兵望見遁去蘇復州叛衆至十萬旁近女直皆保於太尉胡沙家築壘為固敵圍之數重守者糧芻俱盡牛馬相食其鬃尾人易子而食夜縋二人出告急於阿里阿里赴之內外合擊之破其衆於闢離密罕水上勦殺幾盡水為之不流蒲離古胡什吉水馬韓島凡十餘戰破數十萬衆契丹奚人聚舟千艘將入于海阿里以二十七舟邀之中流矢臥舟中中夜始蘇敵船已入王家島即夜取海路追及之敵走險以拒阿里以騎兵邀擊再中流矢力戰不退竟破之盡獲其舟於是蘇復州婆速路皆平攻顯州下靈山縣取梁魚務敗余睹兵功皆最後與散睹魯屯高州契丹昭古牙九斤合興中兵數萬攻胡里特寨阿里以八謀克兵救之胡里特先往敗於城下阿里指陳前緋衣者二十餘人曰此必賊酋也麾兵奮擊皆殺之餘衆大潰來州隰州兵圍胡里特城聞阿里來救即解圍去闍母討張覺有兵出樓峯口山谷間阿里散篤魯忽盧補三猛安擊敗之宗望代闍母討張覺阿里再敗平州兵及伐宋阿里別擊宋兵敗之孟陽之役阿里扼橋渡力戰明年再伐宋至保州中山纍破之進圍真定阿里與婁室豁魯乘風縱火焚其樓櫓諸軍畢登克其城師至河上粘割胡撒擊走宋人扼河津兵數千遂渡河諸將分出大名境阿里破敵四百盡殪遂圍汴汴中夜出兵來焚攻具阿里與謀克常孫陽阿禦之其衆大潰還攻趙州降之天會六年伐宋主取陽穀莘縣敗海州兵八萬人海州降破賊船萬餘於梁山泊招降滕陽東平泰山羣盜盜攻范縣擊走之獲船七百艘宗弼攻下睢陽與烏延蒲盧渾先以二千人往招壽春具舟淮水上時康民聚賈船四百與壽春相近术列速以騎四百破康民斬馘數千與當海大破賊十萬於淮南比至江連破宋兵獲舟二百艘宗弼至江寧阿里蒲盧渾別降廣德軍先趣杭州去杭十餘里遇宋伏兵二千取我前驅甲士三十人阿里使諸軍去馬搏戰伏兵敗皆逼死於水宗弼至餘杭而宋主走明州阿里與蒲盧渾以精騎四千襲之破東關兵濟曹娥江敗宋兵於高橋鎮至明州頗失利宋主已入于海乃退軍餘姚宗弼使當海濟師遂下明州執宋守臣趙伯諤進至昌國縣宋主自昌國走溫州由海路追三百餘里弗及遂隳明州與宗弼俱北歸睿宗經略陝西駐涇州阿里先取渭州睿宗趨熙河阿里斜喝韓常三猛安為前軍十二年與高彪監護水運宋以舟師阻亳州河路擊敗之追殺六十餘里獲其將蕭通破漣水水寨賊盡得其大船遂取漣水軍招徠安輯之天眷間盜據石州阿里討之粘割胡撒與所部先登遂克其城石州平宗弼再伐宋阿里已老督造戰船宋稱臣詔賜阿里錢千萬自結髮從軍大小數十戰尤習舟楫江淮用兵無役不從時人以水星目之為迭里部節度使歷順義泰寧軍歸德濟南尹天德初致仕加特進封王正隆例封韓國公召赴闕命造戰船以疾薨年七十八諡智敏阿里性忠直多智略兄弟相友愛家故饒財以己猛安及財物盡與弟愛拔里愛拔里不肯受逃避歲餘阿里終與之突合速宗室子拏罕塞人初隸萬戶石家奴麾下嘗領偏師破雲中諸山寇盜宗望攻平州遣突合速討應州賊平之撫安其民而還及伐宋在宗翰軍以八謀克破石嶺關屯兵數萬殺戮幾盡師至太原祁縣降而復叛突合速攻下之進取文水縣後從諸帥列屯汾州之境宋河東軍帥郝仲連張思正陝西軍帥張關索及其統制馬忠合兵數萬來援皆敗之宗翰南伐至潞還太原猶未下即留完顏銀术可總督諸軍經略其地於是宋援兵大至突合速從馬五沃魯破宋兵四千于文水聞宋將黃迪等以兵三十萬柵于縣之西山復與耿守忠合兵九千擊之殺八萬餘人獲馬及資糧甚衆宋制置使姚古率兵至隆州谷突合速與拔離速以步騎萬餘禦之种師中兵十萬據榆次銀术可乃召突合速使中分其兵而還與活女等合兵八千擊敗之斬師中于殺熊嶺宋將張灝以兵十萬營于文水近郊復與拔離速擊破之潞州復叛宋兵號十七萬骨突合速拔離速皆被圍突合速麾軍士下馬力戰遂潰圍而出及再舉伐宋宗翰命婁室率軍先趨汴婁室至澤州突合速沃魯以五百騎為前驅往招河陽先據黃河津宋兵萬餘背水陳進擊敗之皆擠于水遂降河陽汴京平諸將西趣陝津略定河東郡縣突合速取憲州遇其援軍擊敗之生擒其將孛堇濃瑰术魯等攻保德未下突合速進兵助擊梯衝並進遂克其城孛堇烏谷攻石州屢敗亡其三將軍士歿者數百人突合速謂烏谷曰敵皆步兵吾不可以騎戰烏谷曰聞賊挾妖術畫馬以繫其足疾甚奔馬步戰豈可及之突合速笑曰豈有是耶乃令諸軍去馬戰盡殪之六年宗輔駐師鄧州突合速馬五拔離速西取均房遂下其城攻唐蔡陳州及潁昌府皆克之天眷初除彰德軍節度使三年為元帥左監軍皇統八年改濟南尹天德間封定國公授世襲千戶卒年七十二正隆二年贈應國公初突合速以次室受封次室子因得襲其猛安及分財異居次室子取奴婢千二百口正室子得八百口久之正室子爭襲連年不決家資費且盡正室子奴婢存者二百口次室子奴婢存者才五六十口世宗聞突合速諸子貧窘以問近臣具以爭襲之故為對世宗曰次室子豈當受封邪遂以嫡妻長子襲烏延蒲盧渾曷懶路烏古敵昏山人父孛古剌龍虎衛上將軍蒲盧渾膂力絶人能挽冖出蟲射二百七十步與兄鶻沙虎俱以勇健隸闍母軍居帳下攻黃龍府力戰有功闍母敗于兔耳山張覺復整兵來諸將皆不敢戰蒲盧渾登山望之乃紿諸將曰敵軍少急擊可破也若入城不可復制遂合戰破之郭藥師蔡靖以燕京降蒲盧渾率九十騎先伺察城中居民去就遂將漢兵千隸完顏蒙適攻真定進攻贊皇取之獲人畜甲仗萬餘汴城破日已暮宋人猶力戰槍刺中蒲盧渾手戰益力遂敗宋軍賜金五十兩睿宗為右副元帥已定關陝議取劍外諸州遂拔和尚原元帥府承制以蒲盧渾為河北西路兵馬都總管及宋主在揚州蒲盧渾與蒙適將萬騎襲之宋主已渡江破其餘兵後與斜卯阿里俱從宗弼自淮西渡江取江寧宗弼入杭州宋主走明州再走溫州由海道追三百餘里隳明州而歸語在阿里傳天眷二年授鎮國上將軍除安國軍以疾去官皇統六年授世襲謀克起為延安尹賜尚衣一襲尋致仕海陵遷中都起為歸德尹就其家授之賜銀牌襲衣玉吐鶻馳驛之官蒲盧渾留數十日已違程復聽致仕召赴京師至薊州見海陵于獵所明日從獵獲一狐海陵曰卿年老尚能馳逐擊獸健捷如此賜以御服封豳國公除太子少師進太子太保改真定尹入判大宗正事頃之伐宋以本官行右領軍副都督事師次西采石海陵欲渡江蒲盧渾曰宋軍船高大我船庳小恐不可遽渡海陵怒曰汝昔從梁王追趙構於海島皆大舟耶今乃沮吾兵事設不能遽渡江不過有少損耳爾年已七十縱自愛豈有不死理耶明日當與奔睹先濟既而復止之乃遣別將先渡江舟小不可戰遂失利兩猛安及兵士二百餘人皆陷沒海陵遇害軍還大定二年至中都上謁除東京留守世宗召問年幾何對曰臣今年七十三矣上曰卿宿將久練兵事年雖老精神不衰因命到官每旬月一視事賜衣一襲進階開府儀同三司仍封豳國公是歲卒十八年孫扎虎遷廣威將軍襲烏古敵昏山世襲猛安並親管謀克赤盞暉字仲明其先附於遼居張皇堡故嘗以張為氏後家來州暉體貌雄偉慷慨有志略少遊鄉校遼季以破賊功授禮賓副使領來隰遷潤四州屯兵天輔六年降仍命領其衆從闍母定興中府義錦等州及破張覺皆與有功以粟萬五千石助軍授洺州刺史宗望初伐宋孟陽之戰敵之中軍徑薄宗望營暉與諸將擊敗之追殺至城下訖師還數立戰功明年再舉伐宋攻下保州真定暉皆與焉進圍汴宋人夜出兵二萬焚我攻具暉以二謀克兵擊走之凡城中出兵拒戰暉之所當無不勝捷既克宋還從攻河間敵將李成以雄莫之兵來援暉與所部迎擊馬傷而墮暉輒奮起步鬬竟敗成兵是日凡七戰皆勝敵人多逼死濠隍間暉兩臂亦數中流矢賊將劉先生以兵二萬夜襲營暉力戰達旦賊始敗走皆溺死于水暉復傅城力戰如是連月諸軍四面合攻遂克之加桂州管內觀察使因留撫河間時居民皆為軍士所掠老幼存者亡幾暉下令軍中聽贖還之未幾皆按堵如故從睿宗經略山東既攻下青州復從闍母攻濰州暉督其裨校先登而城中積芻茭乘風縱火發機石暉率將士衝冒而下力戰敗之軍還復以三十騎破敵于范橋帥府承制加靜江軍節度使進攻城中炮出幾中暉拂其甲裳裂之暉益奮攻卒破其城又從攻泗州克之還屯汶陽破賊衆于梁山濼獲舟千餘移軍攻濟州既敗敵兵因傅城諭以禍福乃舉城降暉約束軍士無秋毫犯自是曹單等州皆聞風而下從攻壽春歸德及渡淮為先鋒遇重敵于秀州蘇州皆擊敗之遂至餘杭通糧餉治橋道暉之力為多乃還載資治通鑑版以歸大軍過江寧徙其官民北渡時暑多疾疫老弱轉死道路其知府陳邦光者訴于宗弼怒將殺之暉曰此義士也力營救之竟得免富平之戰暉在右翼遇濘而敗睿宗念其前功杖而釋之師至熙河暉別降諸寨將鈐轄及吐蕃酋長等並民戶萬五千餘蘭州叛與訛魯補等攻下之獲河州安撫使白常熙河路副都總管劉維輔以獻還攻慶陽兩敗重敵殺其將戴巢師還遷歸德軍節度使宋州舊無學暉為營建學舍勸督生徒肄業者復其身人勸趨之屬縣民家奴王夔者嘗業進士暉以錢五十萬贖之使卒其業夔後至顯官密州吏龐乙卒於官其孤貧不克葬暉為營治葬事且資給其家十三年復從大軍渡淮還鎮丁母憂尋以舊職起復既廢齊為安化軍節度使天眷三年復河南宋人乘間陷海州帥府以登萊沂密四州委暉經畫敵無敢窺其境者為定海軍節度使尋改濟南尹纍遷光祿大夫俄以罪罷久之起為昌武軍節度使天德二年遷南京留守尋改河南路統軍使授世襲猛安拜尚書右丞封河內郡王歲餘拜平章政事封戴王正隆初出為興平軍節度使正隆降王爵為樞密副使封景國公未幾復為左丞封濟國公尋除大興尹封榮國公薨年六十五大定間諡曰武康子師直登進士第大本名撻不野其先遼陽人世仕遼有顯者太祖伐遼遼人徵兵遼陽時年二十餘在選中遼兵敗脫身走寧江寧江破越城而逃為軍士所獲太祖問其家世因收養之收國二年為東京奚民謀克是時初破高永昌東京旁郡邑未盡服屬使伺察反側有聞必達太祖以為忠實授猛安兼同知東京留守事取中西兩京隸闍母軍遼軍二十萬來戰吳王使以本部守營堅請出戰不許或謂曰戰危事獨苦請何也曰丈夫不得一決勝負尚何為苟臨戰不捷雖死猶生也吳王聞而壯之乃遣出戰既合戰闍母軍少却遼兵後躡之麾本部兵橫擊殺數百人由是顯名軍中天會三年宗望伐宋信德府居燕汴之中可駐軍以濟緩急欲遂攻之恐不能亟下議未決獨率本部兵選善射者射其城樓別以輕鋭潛升於樓角之間遂克其城明年軍至濬州宋人已燒河橋宗望下令軍中有能先濟者功為上捕得十餘舟使勇悍者徑渡擊其守者而奪其戍柵由是大軍俱濟八月再伐宋授萬戶賜金牌既破汴京為河間路都統已克河間闍母怒其不早降因縱軍大掠諫止之已掠者官為贖還除河間尹從攻襲慶府先一日命軍士預備畚鍤及薪既傅城諸將方經營攻具未鳴鼓軍有素備遂先登軍帥以未鳴鼓輒戰不如軍令請罪朝廷釋弗問仍例賞之宗弼伐江南濟淮宋將時康民率兵十七萬來拒率本部從擊敗之復以騎二千與當海擊敗淮南賊十萬殺萬餘人王善來降將渡江軍先渡舟行去岸尚遠宋列兵江口視其水可涉則麾兵捨舟趨岸疾擊之宋兵走大軍相繼而濟俄遇杜充兵六萬於江寧之西與鶻盧補擊走之師還留為揚州都統經略淮海高郵之間再為河間尹兼總河北東路兵馬十一年入見太宗賜坐慰勞甚久特遷太子太保賜衣一襲馬二匹及鞍轡鎧甲改元帥右都監齊國廢守汴京熙宗念久勞降御書寵異之天眷三年罷漢渤海千戶謀克以舊臣獨命依舊世襲千戶是歲拜元帥右監軍宗弼再伐宋宋人稱臣乞和遂班師獨留汴行元帥府事皇統三年加開府儀同三司八年進左監軍天德二年改右副元帥兼行臺左丞遷平章行臺省事進行臺右丞相右副元帥如故海陵疑左副元帥撒離喝以為行臺左丞相使伺察之詔軍事不令撒離喝與聞撒離喝不知海陵意旨每與爭軍事不能得遂與有隙海陵竟殺撒離喝召入朝拜尚書右丞相封神麓郡王四年請老為東京留守貞元三年拜太傅領三省事纍封漢國王十二月有疾海陵幸其第問之是歲薨年六十八海陵親臨哭之詔有司廢務三日禁樂三日其三日當賜三國使館燕以不賜教坊樂命左宣徽使敬嗣暉宣諭之贈太師晉國王諡傑忠遣使護喪歸葬正隆奪王爵贈太傅梁國公子磐磐本名蒲速越以大臣子纍官登州刺史襲猛安大定三年除嵩州刺史從僕散忠義伐宋有功五年召為符寶郎遷拱衛直都指揮使初磐以伐宋功進官一階磐心少之頗形于言上聞之下吏按問杖一百五十改左衛將軍詔求良弓磐多自取及護衛入直者輒以己意更代護衛婁室告其事詔點檢司詰問磐有妹在宮中為寶林磐屬內侍僧兒員思忠使言于寶林曰我無罪問事者迫我使自誣服寶林訴于上上怒杖僧兒一百磐責隴州防禦使上戒之曰汝在近密執迷自用朕以卿父之功不忍廢棄姑令補外其思勉之改亳州防禦使遷武寧軍節度使坐事除名起為韓州刺史改祁州刺史復坐事削四官解職久之尚書省奏大磐以年當上曰剛暴之人屢冒刑章不可復用太傅大別無嫡嗣其世襲猛安謀克不可易也阿離補宗室子系出景祖屢從征伐滅遼舉宋皆有功天會九年睿宗經略陝西阿離補為左翼都統與右翼都統宗弼撫定鞏洮河西寧蘭廓等州軍來賓定遠和政甘峪寧洮安隴等城寨及鎮堡蕃漢營部四十餘處漢官軍民蕃部酋長甚衆於是涇原熙河兩路皆平詔以兄猛安沙離質親管謀克之餘戶以阿離補為世襲謀克天會十二年為元帥右都監十五年遷左監軍天眷三年從宗弼復河南遷左副元帥皇統三年封談國公六年為行臺左丞相元帥如故是歲薨大定間大褒功臣圖像衍慶宮歡都死康宗時不及與馳騖遼宋之郊然而異姓之臣莫先焉故定衍慶亞次功臣代國公歡都金源郡王石土門徐國公渾黜鄭國公謾都訶濮國公石古乃濟國公蒲查韓國公斜卯阿里元帥左監軍拔離速魯國公蒲察石家奴銀青光祿大夫蒙適隨國公活女特進突合速齊國公婆盧火開府儀同三司烏延蒲盧渾儀同三司阿魯補鎮國上將軍烏林答泰欲太師領三省事勗太傅大大興尹赤盞暉金吾衛上將軍耶律馬五驃騎衛上將軍韓常並阿離補咸著勳焉子言方言別有傳方以宗室子纍官京兆少尹遷陝西路統軍都監方專事財賄不恤軍旅詔戒之曰卿宗室舊人乃縱肆敗法惟利是營朕甚惡之自今至於後日萬一為之必罰無赦大定三年遷元帥右都監轉元帥左監軍改順天軍節度使上曰卿本無功歷顯仕不能接僚友往往交惡在京兆貪鄙彰聞至無謂也朕念卿已過中年必能悛改慎勿復爾除西南路招討使朝廷以兵部郎中高通為招討都監以佐之詔通曰卿到天德毋以其官長曲從之也簡閲沿邊士卒毋用孱弱之人毋以僕隸代役女直舊風凡酒食會聚以騎射為樂今則奕雙陸宜悉禁止令習騎射從其居處之便亦不可召集擾之久之方坐強買部人馬二匹削一階解職降耀州刺史通亦坐贓除名方後遷橫海軍節度使入為同簽大宗正事簽書樞密院事初阿魯補當授謀克未封而薨烏帶受之烏帶死兀答補襲之兀答補死烏也阿補當襲是時已降海陵為庶人世宗以烏帶在熙宗逆黨中其子孫不合受封停封者久之而阿離補功亦不可廢絶特詔方襲之云贊曰斜卯阿里突合速烏延蒲盧渾赤盞暉大阿離補等六人皆收國以來所謂熊羆之士不二心之臣也其功有可録者焉
