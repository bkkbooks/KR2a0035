body:
  text: 金史卷八十三列傳第二十一張通古張浩張汝霖張玄素張汝弼耶律安禮納合椿年祁宰張通古字樂之易州易縣人讀書過目不忘該綜經史善屬文遼天慶二年進士第補樞密院令史丁父憂起復懇辭不獲因遁去屏居興平太祖定燕京割以與宋宋人欲收人望召通古通古辭謝隱居易州太寧山下宗望復燕京侍中劉彥宗與通古素善知其才召為樞密院主奏改兵刑房承旨天會四年初建尚書省除工部侍郎兼六部事高慶裔設磨勘法仕宦者多奪官通古亦免去遼王宗幹素知通古名惜其才遣人諭之使自理通古不肯曰多士皆去而己何心獨求用哉宗幹為論理之除中京副留守為詔諭江南使宋主欲南面使通古北面通古曰大國之卿當小國之君天子以河南陝西賜之宋宋約奉表稱臣使者不可以北面若欲貶損使者使者不敢傳詔遂索馬欲北歸宋主遽命設東西位使者東面宋主西面受詔拜起皆如儀使還聞宋已置戍河南謂送伴韓肖胄曰天子裂壤地益南國南國當思圖報大恩今輒置守戍自取嫌疑若興師問罪將何以為辭江左且不可保況齊乎肖胄惶恐曰敬聞命矣即馳白宋主宋主遽命罷戍通古至上京具以白宗幹且曰及其部置未定當議收復宗幹喜曰是吾志也即除參知行臺尚書省事未幾詔宗弼復取河南通古請先行至汴諭之比至汴宋人已去矣或謂通古曰宋人先退詐也今聞將自許宿來襲我通古曰南人宣言來者正所以走耳乃使人覘之宋人果潰去宗弼撫髀笑曰誰謂書生不能曉兵事哉河南卒孫進詐稱皇弟按察大王謀作亂是時海陵為相內懷覬覦欲先除熙宗弟胙王常勝因孫進稱皇弟大王遂指名為胙王以誣構之熙宗自太子濟安薨後繼嗣未定深以為念裴滿后多專制不得肆意後宮頗鬱鬱因縱酒往往迷惑妄怒手刃殺人及海陵中傷胙王熙宗以為信然不疑遣護衛特思就汴京鞫治行臺知熙宗意在胙王導引孫進連屬之通古執其咎極力辨止及孫進引服蓋假託名稱將以惑衆規取財物耳實無其人也特思奏狀海陵譖之曰特思且將徼福於胙王熙宗益以海陵為信遂殺胙王並特思殺之行臺諸人乃責通古曰為君所誤今坐死矣通古曰以正獲罪死賢於生海陵既殺胙王不復緣害他人由是坐止特思行臺不坐天德初遷行臺左丞進拜平章政事封談王改封鄆王以疾求解機務不許拜司徒封瀋王海陵御下嚴厲收威柄親王大臣未嘗少假以顏色惟見通古必以禮貌會磁州僧法寶欲去張浩張暉欲留之不可得朝官又有欲留之者海陵聞其事詔三品以上官上殿責之曰聞卿等每到寺僧法寶正坐卿等皆坐其側朕甚不取佛者本一小國王子能輕舍富貴自苦修行由是成佛今人崇敬以希福利皆妄也況僧者往往不第秀才市井游食生計不足乃去為僧較其貴賤未可與簿尉抗禮閭閻老婦迫於死期多歸信之卿等位為宰輔乃復效此失大臣體張司徒老成舊人三教該通足為儀表何不師之召法寶謂之曰汝既為僧去住在己何乃使人知之法寶戰懼不知所為海陵曰汝為長老當有定力今乃畏死耶遂於朝堂杖之二百張浩張暉杖二十正隆元年以司徒致仕進封曹王是年薨年六十九通古天資樂易不為表襮雖居宰相自奉如寒素焉子沉天德三年賜楊建中榜及第張浩字浩然遼陽渤海人本姓高東明王之後曾祖霸仕遼而為張氏天輔中遼東平浩以策干太祖太祖以浩為承應御前文字天會八年賜進士及第授祕書郎太宗將幸東京浩提點繕修大內超遷衛尉卿權簽宣徽院事管勾御前文字初定朝儀求養親去職起為趙州刺史官制行以中大夫為大理卿天眷二年詳定內外儀式歷戶工禮三部侍郎遷禮部尚書田瑴黨事起臺省一空以浩行六部事簿書叢委決遣無留人服其才以疾求外補除彰德軍節度使遷燕京路都轉運使俄改平陽尹平陽多盜臨汾男子夜掠人婦浩捕得榜殺之盜遂衰息近郊有淫祠郡人頗事之廟祝田主爭香火之利纍年不決浩撤其祠屋投其像水中強宗黠吏屏迹莫敢犯者郡中大治乃繕葺堯帝祠作擊壤遺風亭海陵召為戶部尚書拜參知政事天德二年丁母憂起復參知政事進拜尚書右丞天德三年廣燕京城營建宮室浩與燕京留守劉筈大名尹盧彥倫監護工作命浩就擬差除既而暑月工役多疾疫詔發燕京五百里內醫者使治療官給藥物全活多者與官其次給賞下者轉運司舉察以聞貞元元年海陵定都燕京改燕京為中都改析津府為大興府浩進拜平章政事賜金帶玉帶各一賜宴于魚藻池浩請凡四方之民欲居中都者給復十年以實京城從之拜尚書右丞相兼侍中封潞王賜其子汝霖進士及第未幾改封蜀王進拜左丞相正隆二年改封魯國公表乞致仕海陵曰人君不明諫不行言不聽則宰相求去宰相老病不能任事則求去卿於二者何居浩對曰臣羸病不堪任事宰相非養病之地也是以求去不許海陵欲伐宋將幸汴而汴京大內失火於是使浩與敬嗣暉營建南京宮室浩從容奏曰往歲營治中都天下樂然趨之今民力未復而重勞之恐不似前時之易成也不聽浩朝辭海陵問用兵利害浩不敢正諫乃婉詞以對欲以微止海陵用兵奏曰臣觀天意欲絶趙氏久矣海陵愕然曰何以知之對曰趙構無子樹立踈屬其勢必生變可不煩用兵而服之海陵雖喜其言而不能從也浩至汴海陵時時使宦者梁珫來視工役凡一殿之成費纍巨萬珫指曰某處不如法式輒撤之浩不能抗而與之均禮汴宮成海陵自燕來遷居之浩拜太傅尚書令進封秦國公海陵至汴纍月不視朝日治兵南伐部署諸將浩欲奏事不得見會海陵遣周福兒至浩家浩附奏曰諸將皆新進少年恐誤國事宜求舊人練習兵者以為千戶謀克而海陵部署已定惡聞其言乃杖之海陵自將發汴京皇后太子居守浩留治尚書省事世宗即位于遼陽揚州軍變海陵遇害都督府使使殺太子光英于南京浩遣戶部員外郎完顏謀衍上賀表明年二月浩朝京師入見世宗謂曰朕思天位惟艱夙夜惕懼不遑寧處卿國之元老當戮力贊治宜令後世稱揚德政毋失委注之意也俄拜太師尚書令封南陽郡王世宗曰卿在正隆時為首相不能匡救惡得無罪營建兩宮殫竭民力汝亦嘗諫故天下不以咎汝惟怨正隆而卿在省十餘年練達政務故復用卿為相當自勉毋負朕意浩頓首謝居數日世宗謂浩曰卿為尚書令凡人材有可用者當舉用之浩舉紇石烈志寧等其後皆為名臣浩有疾在告者久之遣左司郎中高衎及浩姪汝弼宣諭浩力疾入對既詔入朝毋拜許設座殿陛之東若有咨謀然後進對或體中不佳不必日至省中大政可就第裁決浩雖受詔然每以退為請三年夏復申前請乃除判東京留守疾不能赴任因請致仕初近侍有欲罷科舉者上曰吾見太師議之浩入見上曰自古帝王有不用文學者乎浩對曰有曰誰歟浩曰秦始皇上顧左右曰豈可使我為始皇乎事遂寢是歲薨上輟朝一日詔左宣徽使趙興祥率百官致奠賻銀千兩重綵五十端絹五百匹諡曰文康明昌五年配享世宗廟廷泰和元年圖像衍慶宮子汝為汝霖汝能汝方汝猷汝霖字仲澤少聰慧好學浩嘗稱之曰吾家千里駒也貞元二年賜呂忠翰榜下進士第特授左補闕擢大興縣令再遷禮部員外郎翰林待制大定八年除刑部郎中召見於香閣諭之曰卿以待制除郎中勿以為降朕以刑部闕漢官故以授卿且卿入仕未久姑試其能耳如職事修舉當有升擢爾父太師以戶部尚書升諸相位由崇德大夫躐遷金紫卿所自見也當既厥心無忝乃父明年授太子左諭德兼禮部郎中先是知登聞檢院王震改禮部郎中世宗諭宰臣曰此除未允人望禮官當選有學術士如張汝霖者可也於是命汝霖兼之而除震別職擢刑部侍郎以憂解起復為太子詹事遷太子少師兼御史中丞世宗召謂曰卿嘗言監察御史所察州縣官多因沽買以得名譽良吏奉法不為表襮必無所稱朕意亦然卿今為臺官可革其弊尋改中都路都轉運使太子少師兼禮部尚書俄轉吏部為御史大夫時將陵主簿高德溫大收稅戶米逮御史獄汝霖具二法上世宗責之曰朕以卿為公正故登用之德溫有人在宮掖故朕頗詳其事朕肯以宮掖之私撓法耶不謂卿等顧徇如是汝霖跪謝久之上顧左諫議大夫楊伯仁曰臺官不正如此伯仁奏曰罪疑惟輕故具二法上請在陛下裁斷耳且人材難得與其材智而邪不若用愚而正者上作色曰卿輩皆愚而不正者也未幾復坐失出大興推官高公美罪謫授棣州防禦使頃之復為太子少師兼禮部尚書拜參知政事太子少師如故是日汝霖兄汝弼亦進拜尚書左丞時人榮之後因朝奏日論事上前世宗謂曰朕觀唐史見太宗行事初甚厲精晚年與羣臣議多飾辭朕不如是也又曰唐太宗明天子也晚年亦有過舉朕雖不能比迹聖帝明王然常思始終如一今雖年高敬慎之心無時或怠汝霖對曰古人有言靡不有初鮮克有終有始有卒者其惟聖人乎魏徵所言守成難者正謂此也上以為然二十五年章宗以原王判大興府事上命汝霖但涓視事日且加輔導尋坐擅支東宮諸皇孫食料奪官一階久之遷尚書右丞是時世宗在位久熟悉天下事思得賢材與圖致治而大臣皆依違苟且無所薦達一日世宗召宰臣謂曰卿等職居輔相曾無薦舉何也且卿等老矣殊無可以自代者乎惟朕嘗言某人可用然後從而言之卿等既無所言必待朕知而後進用將復有幾因顧汝霖曰若右丞者亦因右丞相言而知也汝霖對曰臣等苟有所知豈敢不薦但無人耳上曰春秋諸國分裂土地褊小皆稱有賢今天下之大豈無人才但卿等不舉而已今朕自勉庶幾致治他日子孫誰與共治乎汝霖等皆有慚色二十八年進拜平章政事兼修國史封芮國公世宗不豫與太尉徒單克寧右丞相襄同受顧命章宗即位加銀青榮祿大夫進封莘先是右丞相襄言熙宗聖節蓋七月七日為係景宣忌辰更用正月受外國賀今天壽節在七月雨水淫暴外方人使赴闕有礙行李乞移他月為便汝霖言帝王之道當示信於天下昔宋主構生日亦係五月是時都在會寧上國遣使賜禮不聞有霖潦礙阻之說今與宋構好日久遽以暑雨為辭示以不實萬一雨水踰常愆期到闕猶愈更用別日參知政事劉瑋御史大夫唐括貢中丞李晏刑部尚書兼右諫議大夫完顏守貞修起居注完顏烏者同知登聞檢院事孫鐸亦皆言其不可帝初從之既而竟用襄議時帝在諒陰初出獵諫院聯章言心喪中未宜其後冬獵汝霖諫之詔答曰卿能每事如此朕復何憂然時異事殊難同古昔如能斟酌得中斯為當矣一日帝謂宰臣曰今之用人太拘資歷如此何能得人汝霖奏曰不拘資格所以待非常之材帝曰崔祐甫為相未踰年薦八百人豈皆非常材耶時有司言民間收藏制文恐因而滋訟乞禁之汝霖謂王者之法譬猶江河欲使易避而難犯本朝法制坦然明白今已著為不刊之典天下之人無不聞誦若令私家收之則人皆曉然不敢為非亦助治之一端也不禁為便詔從之明昌元年三月表乞致仕不許十二月卒時帝獵饒陽訃聞敕百官送葬賻禮加厚諡曰文襄汝霖通敏習事凡進言必揣上微意及朋附多人為說故言不忤而似忠也初章宗新即位有司言改造殿庭諸陳設物日用繡工一千二百人二年畢事帝以多費意輟造汝霖曰此非上服用未為過侈將來外國朝會殿宇壯觀亦國體也其後奢用浸廣蓋汝霖有以導之云張玄素字子真與浩同曾祖祖祐父匡仕遼至節度使玄素初以廕得官高永昌據遼陽玄素在其中斡魯軍至乃開門出降特授世襲銅州猛安天會間歷西上閣門使客省使東宮計司天眷元年以靜江軍節度使知涿州察廉最進官一階皇子魏王道濟遙領中京以玄素為魏王府同提點尋改鎮西軍節度使遷東京路都轉運使改興平軍節度使正隆末年天下盜起玄素發民夫增築城郭同僚諫止之不聽未幾寇掠鄰郡皆無備而興平獨安世宗即位玄素來見于東京玄素在東京希海陵旨言世宗嘗取在官黃糧及托其數事至是來見世宗一切不問玄素與李石力言宜早幸燕京上深然之遷戶部尚書出鎮定武遂致仕年八十四卒玄素厚而剛毅人畏憚之往往以片紙署字其上治瘧疾輒愈人皆異之汝弼字仲佐父玄徵彰信軍節度使玄素之兄也汝弼初以父蔭補官正隆二年中進士第調瀋州樂郊縣主簿玄徵妻高氏與世宗母貞懿皇后有屬世宗納玄徵女為次室是為元妃張氏生趙王允中世宗即位于遼陽汝弼與叔玄素俱往歸之擢應奉翰林文字世宗御翠巒閣召左司郎中高衎及汝弼問曰近日除授外議何如宜以實奏毋少隱也有不可用者當改之衎汝弼皆無以對自皇統以來內藏諸物費用無度吏夤緣為姦多亡失汝弼與宮籍直長高公穆入殿小底王添兒閲實之以類為籍作四庫以貯之於是內藏庫使王可道等皆杖一百汝弼等各進階頃之兼修起居注轉右司員外郎母憂去官起復吏部郎中纍遷吏部尚書拜參知政事詔徙女直猛安謀克于中都給以近郊官地皆塉薄其腴田皆豪民久佃遂專為己有上出獵猛安謀克人前訴所給地不可種藝詔拘官田在民久佃者與之因命汝弼議其事請條約立限令百姓自陳過限許人首告實者與賞上可其奏仍遣同知中都轉運使張九思拘籍之上問高麗夏皆稱臣使者至高麗與王抗禮夏王立受使者拜何也左丞襄對曰故遼與夏為甥舅夏王以公主故受使者拜本朝與夏約和用遼故禮所以然耳汝弼曰誓書稱一遵遼國舊儀今行之已四十年不可改也上曰卿等言是也上聞尚書省除授小官多不稱職召汝弼至香閣謂之曰他宰相年老卿等宜盡心汝弼對曰材薄不足以副聖意耳進拜尚書右丞於是戶部糶官倉粟汝弼請使暖湯院得糴之上讓曰汝欲積陰德邪何區區如此左丞相徒單克寧得解政務為樞密使是日汝弼亦懷表乞致仕上使人止之曰卿年未老未可退也進左丞與族弟參知政事汝霖同日拜族里以為榮有年未六十而乞致仕者上不許汝弼曰聖旨嘗許六十致仕上責之曰朕嘗許至六十者致仕不許未六十者且朕言六十致仕是則可行否則當言卿等不言皆此類也久之坐擅增諸皇孫食料與丞相守道右丞粘割斡特剌參政張汝霖各削官一階上曰准法當解職但示薄責耳汝弼在病告上謂宰相曰汝弼久居執政練習制度頗能斟酌人材而用心不正乃罷為廣寧尹賜通犀帶汝弼為相不能正諫上所欲為則順而導之所不欲為則微言以觀其意上責之則婉辭以引過終不忤之也而上亦知之且黷貨以計取諸家名園甲第珍玩奇好士論薄之二十七年薨汝弼既與永中甥舅陰相為黨章宗即位汝弼妻高氏每以邪言怵永中覬非望畫永中母像侍奉祈祝使術者推算永中有司鞫治高氏伏誅事連汝弼上以事覺在汝弼死後得免削奪耶律安禮本名納合系出遙輦氏幼孤事母以孝聞遼季間關避難未嘗一日怠溫凊入朝當路者重其行義使主帥府文字授左班殿直天眷初從元帥於山西母喪不克歸葬主帥憐之賻禮甚厚安禮冒大暑挽柩行千餘里哀毀骨立行路嗟嘆服除由行臺吏禮部主事纍遷工部侍郎改左司郎中天德間罷行臺尚書省入為工部侍郎纍遷本部尚書明年冬為宋國歲元使被詔鞫治韓王亨獄于廣寧亨無反狀安禮還奏海陵怒疑安禮梁王宗弼故吏乃責安禮曰孛迭有三罪其論阿里出虎有誓券不當死既引伏其謂不足進馬及密遣刺客二者安得無之汝等來奏欲測我喜怒以為輕重耳乃遣安禮再往與李老僧同鞫之老僧由是殺亨于獄海陵猶謂安禮輒殺亨以絶滅事迹親戚得以不坐安禮之不附上刻下乃如此改吏部尚書護大房山諸陵工作拜樞密副使封談國公遷尚書右丞進封郕國公轉左丞議降纍朝功臣封爵密諫伐江南忤海陵意罷為南京留守封溫國公安禮長於吏事廉謹自將從帥府再伐宋寶貨人口一無所取貴為執政奴婢止數人皆有契券時議賢之薨年五十六納合椿年本名烏野初置女直字立學官於西京椿年與諸部兒童俱入學最號警悟久之選諸學生送京師俾上京教授耶魯教之椿年在選中補尚書省令史纍官殿中侍御史改監察御史海陵為相薦為右司員外郎編定新制海陵篡立以為諫議大夫椿年有酒失海陵使之戒酒遂終身不復飲改祕書監修起居注授世襲猛安為翰林學士兼御史中丞貞元初起上京諸猛安於中都山東等路安置以勞賜玉帶間馬奉遷山陵還為都點檢賜今名拜參知政事海陵謂椿年曰如卿吏材甚難得復有如卿者乎椿年薦大理丞紇石烈婁室海陵以婁室為右司員外郎未旬日海陵謂椿年曰吾試用婁室果如卿言惟賢知賢信矣婁室後賜名良弼有宰相才世宗時至左丞相號賢相焉正隆二年椿年薨海陵親臨哭之追封特進談國公諡忠辨賻銀二千兩綵百端絹千匹錢千萬以長子參謀合為定遠大將軍襲猛安次子合答為忠武校尉及歸葬再賜錢百萬仍給道路費椿年有宰相才好推挽士類然頗營産業為子孫慮冒占西南路官田八百餘頃大定中括撿田土百姓陳言官豪占據官地貧民不得耕種溫都思忠子長壽椿年子猛安參謀合等三十餘家凡冒占三千餘頃詔諸家除牛頭稅地各再給十頃其餘盡賦貧民種佃世頗以此譏椿年云祁宰字彥輔江淮人宋季以醫術補官王師破汴得之後隸太醫纍遷中奉大夫太醫使數被賞賚常感激欲自效海陵將伐宋宰欲諫不得見會元妃有疾召宰診視既入見即上疏諫其略言國朝之初祖宗以有道伐無道曾不十年蕩遼戡宋當此之時上有武元文烈英武之君下有宗翰宗雄謀勇之臣然猶不能混一區宇舉江淮巴蜀之地以遺宋人況今謀臣猛將異於曩時且宋人無罪師出無名加以大起徭役營中都建南京繕治甲兵調發軍旅賦役煩重民人怨嗟此人事之不修也間者晝星見於牛斗熒惑伏於翼軫巳歲自刑害氣在揚州太白未出進兵者敗此天時不順也舟師水涸舳艫不繼而江湖島渚之間騎士馳射不可驅逐此地利不便也言甚激切海陵怒命戮於市籍其家産天下哀之綦戩宰壻也海陵疑奏疏戩為之辭曰實不知也海陵猶杖戩召禁中諸司局官至咸德門諭以殺宰事明年世宗即位於遼東四年詔贈資政大夫復其田宅章宗即位詔訪其子忠勇校尉平定州酒監公史擢尚藥局都監泰和初詔定功臣諡尚書省掾李秉鈞上言事有宜緩而急若輕而重者名教是也伏見故贈資政大夫祁宰以忠言被誅慕義之士衋傷厥心世宗即位贈之以官陛下録用其子甚大惠也雖武王封比干之墓孔子譽夷齊之仁何以異此而有司拘文以職非三品不在議諡之例臣竊疑之若職至三品方得請諡當時居高官食厚祿者不為無人皆畏罪淟涊曾不敢申一喙畫一策以為社稷計卒使立名死節之士顧出於醫卜之流亦可以少愧矣臣以謂非常之人當以非常之禮待之乞詔有司特賜諡以旌其忠斯亦助名教之一端也制曰可下太常諡曰忠毅贊曰䌇哉海陵之為君也舞智御下而不恤焉君子仕於朝動必以禮然後免於恥張通古耶律安禮位不及張浩進退始終其賢遠矣浩無事不為無役不從為相最久用之厚遇之薄豈亦自取之邪海陵伐宋浩安禮位皆大臣一以婉辭一以密諫賢於不諫而已祁宰一醫流獨能極諫其後皆如所言海陵戕之足以成其百世之名耳納合椿年援引善類有君子風其死適在宋兵未舉之前然觀其好營産殖亦未必忘身徇國之士也祁宰卓乎不可及也夫
