body:
  text: 金史卷三十九志第二十樂上雅樂散樂鼓吹樂本朝樂曲郊祀樂歌傳曰王者功成作樂治定制禮豈二帝三王之彌文哉蓋有天下者將一軌度正民俗合人神和上下舍禮樂何以焉金初得宋始有金石之樂然而未盡其美也及乎大定明昌之際日修月葺粲然大備其隸太常者即郊廟祀享大宴大朝會宮縣二舞是也隸教坊者則有鐃歌鼓吹天子行幸鹵簿導引之樂也有散樂有渤海樂有本國舊音世宗嘗寫其意度為雅曲史録其一其俚者弗載云雅樂凡大祀中祀天子受冊寶御樓肆赦受外國使賀則用之初太宗取汴得宋之儀章鐘磬樂簴挈之以歸皇統元年熙宗加尊號始就用宋樂有司以鐘磬刻晟字者犯太宗諱皆以黃紙封之大定十四年太常始議歷代之樂各自為名今郊廟社稷所用宋樂器犯廟諱宜皆刮去更為製名於是命禮部學士院太常寺撰名乃取大樂與天地同和之義名之曰太和文武二舞皇統年間定文舞曰仁豐道洽之舞武舞曰功成治定之舞貞元儀又改文舞曰保大定功之舞武舞曰萬國來同之舞大定十一年又有四海會同之舞於是一代之制始備明昌五年詔用唐宋故事置所講議禮樂有司謂雅樂自周漢以來止存大法魏晉而後更造律度訖無定論至後周保定中得古玉斗于地中以造尺律其後牛弘以為不可止用蘇綽鐵尺至隋亦用之唐興因隋樂不改及黃巢之亂樂縣散失太常博士殷盈孫以周法鑄鎛鐘編鐘處士蕭承訓等校石磬合而奏之至周顯德以黍定律議者謂比唐樂高五律宋初亦用王朴所制樂時和峴以周顯德律音近哀思乃依西京銅望臬石尺重造十二管取聲下王朴一律景祐初李照取黍纍尺成律以其聲猶高更用太府布帛尺遂下太常樂三律皇祐中阮逸胡瑗改造止下一律或謂其聲弇鬱不和依舊用王朴樂元豐間楊傑參用李照鐘磬加四清聲下王朴樂二律以為新樂元祐間范鎮又造新律下李照樂一律而未用至崇寧間魏漢津以范鎮知舊樂之高無法以下之乃以時君指節為尺其所造鐘磬即今所用樂是也然以王朴所制聲高屢命改作李照以太府尺制律人習舊聽疑於太重其後范鎮等論樂復用李照所用太府尺即周隋所用鐵尺牛弘等以謂近古合宜者也今取見有樂以唐初開元錢校其分寸亦同則漢津所用指尺殆與周隋唐所用之尺同矣漢津用李照范鎮之說而恥同之故用時君指節為尺使衆人不敢輕議其尺雖為詭說其制乃與古同而清濁高下皆適中非出於法數之外私意妄為者也蓋今之鐘磬雖崇寧之所製亦周隋唐之樂也閲今所用樂律聲調和平無太高太下之失可以久用唯辰鐘辰磬自昔數缺宜補鑄辰鐘十五辰磬二十一通舊各為二十四簴上曰嘗觀宋人論樂以為律主於人聲不當泥於其器要之在聲和而已於是命禮部符下南京取宋舊工更鑄辰鐘十有二又以舊鐘姑洗夷則皆高五律無射高二律別鑄以補之乃協又琢辰磬各十有二以其半少劣擇其諧者而用之初正隆間海陵營太廟于汴貞祐南遷宣宗修之以祔諸帝神主其地故宋景靈宮之址也掘其下得編鐘十三編磬八皆刻大晟字時朝廷多故禮器散亡竟亦不能備也大定十一年太常議按唐會要舊制南北郊宮縣用二十架周漢魏晉宋齊六朝及唐開元宋開寶禮其數皆同宋會要用三十六架五禮新儀用四十八架其數多似乎太侈今擬太常因革禮天子宮縣之樂三十六簴宗廟與殿庭同郊丘則二十簴宜用宮縣二十架登歌編鐘編磬各一簴又按周禮大司樂凡樂圜鐘為宮黃鐘為角太蔟為徵姑洗為羽雷鼓雷鼗孤竹之管雲和之琴瑟雲門之舞冬日至於地上之圜丘奏之若樂六變則天神皆降可得而禮矣六變謂六成也唐宋因之蓋圜鐘夾鐘也用為宮者以上應房心有天帝明堂之象也宮聲三奏角徵羽各一奏合陽之奇數欲神聽之也凡樂起於陽至少陰而止圜鐘自卯至申其數有六故六變而樂止則天神皆降可得而禮也樂曲之名唐以和宋以安本朝定樂曲以寧為名今止有太廟祫享樂曲而郊祀樂曲未備皇統九年拜天用乾寧之曲今圜丘降神固可就用今太廟祫享皇帝升降行止奏昌寧之曲迎俎奏豐寧之曲酌獻舞出入奏肅寧之曲飲福奏福寧之曲宋開寶禮亦可就用餘有郊祀曲名皇帝入中壝奠玉幣迎俎酌獻舞出入樂曲宜皆以寧字製名遂命學士院撰焉皇帝入中壝奏昌寧之曲降神送神奏乾寧之曲昊天上帝奏洪寧之曲皇地祇奏坤寧之曲配位奏永寧之曲飲福奏福寧之曲升降望燎出入大小次並與入中壝同餘載儀注及樂章又命太常議文武二舞所當先後太常議按唐宋郊廟之禮並先文後武本朝自行禘祫之禮亦然惟唐韋萬石建議謂先儒相傳以揖讓得天下則先奏文以征伐得天下則先奏武當時雖從尋復改之其以開元禮先文後武為定方丘如圜丘之儀社稷則用登歌宗廟皇帝入門宮縣以無射宮升殿登歌以夾鐘皆奏昌寧之曲迎神送神奏來寧之曲九成天德二年晨祼畢還小次方奏迎神曲大定十一年朝享奏依開元開寶禮至版位即奏黃鐘宮三大呂角二太蔟徵二應鐘羽二曲詞皆同進俎奏豐寧之曲酌獻宮縣奏無射大元之曲諸室之曲德帝曰大熙安帝曰大安獻祖曰大昭昭祖曰大成景祖曰大昌祖曰大武肅宗曰大明穆宗曰大章康宗曰大康太祖曰大定太宗曰大惠熙宗曰大同睿宗曰大和昭德皇后廟曰儀坤世宗曰大鈞顯宗曰大寧章宗曰大隆宣宗曰大慶皇帝還板位及亞終獻皆奏無射宮肅寧之曲飲福登歌奏夾鐘宮福寧之曲徹豆奏豐寧之曲皆用無射宮大定十二年制祫禘時享有司攝事初獻盥洗奏無射宮肅寧之曲升階登歌奏夾鐘宮嘉寧之曲餘並與親享同其別廟昭德皇后宣孝太子所用並載儀注樂章舊制太廟皇考廟樂工各三十九人大定二十九年升祔顯宗有司以為宋之太廟別廟堂上樂各四十八人今之樂工少十八人擬令皇考廟舊樂工皆充兩廟堂上樂以應前代九十六人之數尚書省議古樂工無定數遂奏太廟別廟通以百人為定明昌六年創設宮縣樂工一百五十六人承安三年敕祭廟用教坊奏古樂非禮也其自今召百姓材美者給以食直教閲以待用泰和元年命宮縣樂工月給錢粟二貫石遇正樂工闕驗色收補四年尚書省奏宮縣樂工總用二百五十六人而舊所設止百人時或用之即以貼部教坊閲習自明昌間以渤海教坊兼習而又創設九十二人且宮縣之樂須行大禮乃始用之若其數復闕但前期遣漢人教坊及大興府樂人習之亦可備用遂詔罷創設者宣宗南遷祔諸帝主於汴京太廟禮官言祔享禮畢車駕還宮至承天門外百官奉迎宮縣奏采茨以樂簴未備遂止用教坊樂哀宗遷蔡天興二年七月丁巳太祖太宗及后妃御容至自汴京奉安於乾元寺左宣徽使溫敦七十五奏當用樂上曰樂須太常奈何七十五曰市有優樂可假用之權左右司員外郎王鶚奏曰世俗之樂豈可施于帝王之前遂止樂舞名數太廟登歌鐘一簴磬一簴歌工四籥二塤二箎二笛二巢笙二和笙二簫二七星匏一九耀匏一閏餘匏一搏拊二柷一敔一麾一一弦琴三弦琴五弦琴七弦琴九弦琴各二瑟四別廟登歌並同親祠則用金鐘玉磬攝祭則用編鐘編磬宮縣樂三十六簴編鐘十二簴編磬十二簴大鐘鎛鐘特磬各四簴建鼓應鼓鞞鼓各四路鼓二路鼗二晉鼓一巢笙竽笙各十簫十籥十箎十笛十塤八一絃琴三三絃五絃七絃九絃琴各六瑟十二柷一敔一麾一文舞所執籥翟各六十四武舞所執朱干玉戚各六十四引舞所執旌二纛二牙杖二單鼗二單鐸二雙鐸二金鐃二金錞二金鉦二相鼓二雅鼓二有司攝祭宮縣二十簴編鐘四編磬四辰鐘十二建鼓四路鼓四路鼗二晉鼓一巢笙竽笙簫塤箎笛各八一絃琴三三絃五絃七絃九絃琴各六瑟八柷敔各一麾一登歌及二舞引舞所執與親祠同皇帝受冊寶前期大樂令與協律郎設樂縣於殿廷又設舉麾位二一於殿西階一於樂縣西北又設登歌樂架於殿上至日侍中奏外辦宮縣樂作皇帝乃出即坐樂止奉寶入門樂作置褥位上樂止初引時宮縣樂作至位立定樂止寶初行樂作至御前置訖樂止皇帝受寶訖樂作侍中奏稱賀樂止皇太子升殿登歌樂作復位樂止侍中奏禮畢宮縣樂作皇帝還幕次樂止御樓宣赦前期大樂署設宮縣於樓下又設鼓一於宮縣之左至日金雞初立大樂署擊鼓立訖鼓止侍中奏外辦大樂令撞黃鐘之鐘右五鐘皆應昌寧之樂作皇帝乃出宣讀訖百官舞蹈禮畢大樂令撞蕤賓之鐘左五鐘皆應昌寧之樂作皇帝降座樂止凡皇帝出入升降及分班合班皆樂作坐立定乃止其冊命中宮皇太子太孫受外國使賀宴外國使皆用宮縣散樂元日聖誕稱賀曲宴外國使則教坊奏之其樂器名曲不傳皇統二年宰臣奏自古並無伶人赴朝參之例所有教坊人員只宜聽候宣喚不合同百寮赴起居從之章宗明昌二年十一月甲寅禁伶人不得以歷代帝王為戲及稱萬歲者以不應為事重法科泰和初有司又奏太常工人數少即以渤海漢人教坊及大興府樂人兼習以備用鼓吹樂馬上樂也天子鼓吹橫吹各有前後部部又各分二節金初用遼故物其後雜用宋儀海陵遷燕及大定十一年鹵簿皆分鼓吹為四節其他行幸惟用兩部而已前部第一鼓吹令二人掆鼓十二金鉦十二大鼓百二十長鳴百二十鐃鼓一十二歌二十四拱辰管二十四簫二十四笳二十四大橫吹一百二十前部第二節鼓二笛二十四簫二十四篳篥二十四笳二十四桃皮篳篥二十四掆鼓十二金鉦十二小鼓百二十中鳴百二十羽葆鼓十二歌二十四拱辰管二十四簫二十四後部第一鼓吹丞二人掆鼓三金鉦三羽葆鼓十二歌二十四拱辰管二十四簫二十四笳二十四節鼓二鐃鼓十二歌十六簫二十四笳二十四小橫吹百二十後部第二笛二十四簫二十四篳篥二十四笳二十四桃皮篳篥二十四本朝樂曲世宗大定九年十一月庚申皇太子生日上宴于東宮命奏新聲謂大臣曰朕製此曲名君臣樂今天下無事與卿等共之不亦樂乎辭律不傳十三年四月乙亥上御睿思殿命歌者歌女直詞顧謂皇太子曰朕思先朝所行之事未嘗暫忘故時聽此詞亦欲令汝輩知女直醇質之風至於文字語言或不通曉是忘本也二十五年四月幸上京宴宗室于皇武殿飲酒樂上諭之曰今日甚欲成醉此樂不易得也昔漢高祖過故鄉與父老歡飲擊筑而歌令諸兒和之彼起布衣尚且如是況我祖宗世有此土今天下一統朕巡幸至此何不樂飲于時宗室婦女起舞進酒畢羣臣故老起舞上曰吾來故鄉數月矣今回期已近未嘗有一人歌本曲者汝曹來前吾為汝歌乃命宗室子坐殿下者皆上殿面聽上歌曲道祖宗創業艱難及所以繼述之意上既自歌至慨想祖宗音容如覩之語悲感不復能成聲歌畢泣下數行右丞相元忠暨羣臣宗戚捧觴上壽皆稱萬歲於是諸老人更歌本曲如私家相會暢然歡洽上復續調歌曲留坐一更極歡而罷其辭曰猗歟我祖聖矣武元誕膺明命功光于天拯溺救焚深根固蒂克開我後傳福萬世無何海陵淫昏多罪反易天道荼毒海內自昔肇基至于繼體積纍之業淪胥且墜望戴所歸不謀同意宗廟至重人心難拒勉副樂推肆豫嗣緒二十四年兢業萬幾億兆庶姓懷保安綏國家間暇廓然無事乃眷上都興帝之第屬茲來游惻然豫思風物減耗殆非昔時于鄉于里皆非初始雖非初始朕自樂此雖非昔時朕無異視瞻戀慨想祖宗舊宇屬屬音容宛然如睹童嬉孺慕歷歷其處壯歲經行恍然如故舊年從游依俙如昨歡誠契闊旦暮之若于嗟闊別兮云胡不樂郊祀樂歌皇帝入中壝宮縣黃鐘宮昌寧之曲凡步武同衮服穆穆臨于中壝瞻言圜壇皇皇后帝禋祀肇稱馨香維德爰暨百神於昭受職降神宮縣乾寧之曲仁豐道洽之舞圜鐘為宮黃鐘為角太蔟為徵姑洗為羽圜鐘三奏黃鐘太蔟姑洗皆一奏詞並同我金之興皇天錫羡惟神之休爰茲郊見有玉其禮有牲其薦將受厥明來寧來燕皇帝盥洗宮縣黃鐘宮昌寧之曲因天事天惇宗將禮爰飭攸司奉時罍洗挹彼注茲乃升壇陛先事而虔神勞豈弟皇帝升壇登歌大呂宮昌寧之曲相在國南崇崇其趾蒸哉皇王維時涖止至誠通神克禋克祀於萬斯年昊天其子昊天上帝奠玉幣登歌大呂宮洪寧之曲穆穆君王有嚴有翼珮環鏘然圜壇是陟嘉德升聞馨非黍稷高明降監百神受職皇地祇坤寧之曲肅敬明祇躬行奠贄其贄維何黃琮制幣從祀羣靈咸秩厥位惟皇能饗允集熙事配位太祖皇帝永寧之曲肇舉明禋皇天后土皇祖武元爰作神主功昭耆定歌以大呂綏我思成有秩斯祜司徒迎俎宮縣黃鐘宮豐寧之曲穆穆皇皇天子躬祀羣臣相之罔不敬止俎豆畢陳物其嘉矣馨香始升明神燕喜昊天上帝酌獻登歌大呂宮嘉寧之曲郊禋展敬昭事上靈太尊在席有醑斯馨酌言獻之靈其醉止福祿來宜以答明祀皇地祇泰寧之曲衮服穆穆臨彼泰折於昭神宮埋幣瘞血爰稱匏爵斟言薦潔方輿常安扶我帝業配位太祖皇帝燕寧之曲蒸哉高后肇迪丕基功與天合配天以推薦時清旨孔肅其儀來寧來燕福祿綏之文舞退武舞進宮縣黃鐘宮咸寧之曲奉祀郊丘雲門變舞進秉朱干停揮翟羽於昭睿文復肖聖武無疆維烈天子受祜亞終獻宮縣黃鐘宮咸寧之曲功成治定之舞掃地南郊天神以俟於皇君王克禋克祀交於神明玄酒陶器誠心靖純非貴食味皇帝飲福登歌大呂宮福寧之曲所以承天無過乎質天其祐之惟精惟一泰尊爰挹馨香薦德惠我無疆子孫千億徹豆登歌大呂宮豐寧之曲大禮爰陳為豆孔碩肅肅其容於顯百辟皇靈降監馨聞在德明禋斯成孚休罔極送神宮縣圜鐘宮乾寧之曲赫赫上帝臨監禋祀居然來歆昭答祖配圜壇四成神安其位升歌贊送天人悅喜方丘樂歌迎神鎮寧之曲林鐘宮再奏太蔟角再奏姑洗徵再奏南呂羽再奏詞同至哉坤儀萬彙資生稱物平施流謙變盈禮修泰折祭極精誠皇皇靈眷永奠寰瀛初獻盥洗太蔟宮肅寧之曲禮有五經無先祭禮即時伸虔惟時盥洗品物吉蠲威儀濟濟錫之純嘏來歆愷悌初獻升壇應鐘宮肅寧之曲無疆之德至哉坤元沉潛剛克資生實蕃方丘之儀惟敬無文神其來思時歆薦殷初獻奠玉幣太蔟宮億寧之曲禮行方澤文物備舉惟皇地祇昭假來下奠瘞玉帛純誠內著神保是享陟降斯祜司徒捧俎太蔟宮豐寧之曲四階秩儀壇於方澤昭事皇祇即陰以咵潔肆於祊孔嘉且碩神其福之如幾如式正位酌獻太蔟宮溥寧之曲蕩蕩坤德物無不載柔順利貞含洪光大籩豆既陳金石斯在四海永寧福祿攸介配位酌獻配太宗也太蔟宮保寧之曲詞闕亞終獻升壇太蔟宮咸寧之曲卓彼嘉壇奠玉方澤百辟祗肅八音純繹祀事孔明柔祇感格徹豆應鐘宮豐寧之曲修理方丘吉蠲是宜籩豆靜嘉登於有司芬芬馨香來享來儀郊儀將終聲歌徹之送神林鐘宮鎮寧之曲因地方丘濟濟多儀樂成八變靈祇格思薦餘徹豆神貺昭垂億萬斯年永祐丕基詣望燎位太蔟宮肅寧之曲詞同升壇
