body:
  text: 金史卷六十七列傳第五石顯桓弟散達烏春溫敦蒲剌附臘醅弟麻産鈍恩留可阿疏奚王回離保石顯孩懶水烏林答部人昭祖以條教約束諸部石顯陸梁不可制及昭祖沒于逼剌紀村部人以柩歸至孩懶水石顯與完顏部窩忽窩出邀於路攻而奪之柩揚言曰汝輩以石魯為能而推尊之吾今得之矣昭祖之徒告于蒲馬太彎與馬紀嶺劾保村完顏部蒙葛巴土等募軍追及之與戰復得柩衆推景祖為諸部長白山耶悔統門耶懶土骨論五國皆從服及遼使曷魯林牙來索逋人石顯皆拒阻不聽命景祖攻之不能克景祖自度不可以力取遂以詭計取之乃以石顯阻絶海東路請於遼遼帝使人讓之曰汝何敢阻絶鷹路審無他意遣其酋長來石顯使其長子婆諸刊入朝曰不敢違大國之命遼人厚賜遣還謂婆諸刊曰汝父信無他宜身自入朝石顯信之明年入見於春搜婆諸刊從遼主謂石顯曰罪惟在汝不在汝子乃命婆諸刊還而流石顯於邊地蓋景祖以計除石顯而欲撫有其子與部人也婆諸刊蓄怨未發會活剌渾水紇石烈部臘醅麻産起兵婆諸刊往從之及敗於暮稜水麻産先遁去婆諸刊與臘醅就擒及其黨與皆獻之遼主久之世祖復使人言曰婆諸刊不還則其部人自知罪重因此恐懼不肯歸服遼主以為然遂遣婆諸刊及前後所獻罪人皆還之桓散達兄弟者國相雅達之子也居完顏部邑屯村雅達稱國相不知其所從來景祖嘗以幣與馬求國相於雅達雅達許之景祖得之以命肅宗其後撒改亦居是官焉桓兄弟嘗事景祖世祖初季父跋黑有異志陰誘桓欲與為亂昭肅皇后往邑屯村世祖肅宗皆從行遇桓散達各被酒言語紛爭遂相毆擊舉刃相向昭肅皇后親解之乃止自是謀益甚是時烏春窩謀罕亦與跋黑相結詭以烏不屯賣甲為兵端世祖不得已而與之和間數年烏春以其衆涉活論來流二水世祖親往拒之桓散達遂起兵肅宗以偏師拒桓散達世祖畏其合勢也戒之曰可和則和否則戰至斡魯紺出水既陳成列肅宗使盆德勃堇議和桓亦恃烏春之在北也無和意盆德報肅宗曰敵欲戰或曰戰地迫近村墟雖勝不能盡敵宜退軍誘之寬地肅宗惑之乃令軍少却未能成列桓散達乘之肅宗敗焉桓乘勝大肆鈔略是役也烏春以久雨不能前乃罷兵世祖聞肅宗敗乃自將經舍很貼割兩水取桓散達之家桓散達不知也世祖焚其所居殺略百許人而還未至軍肅宗之軍又敗世祖至責讓肅宗失利之狀使歡都冶訶以本部七謀克助之復遣人議和桓散達欲得盈歌之大赤馬辭不失之紫騮馬世祖不許遂與不术魯部卜灰蒲察部撒骨出及混同江左右匹古敦水北諸部兵皆會厚集為陳鳴鼓作氣馳騁桓恃其衆有必勝之心下令曰今天門開矣悉以爾車自隨凡烏古乃夫婦寶貨財産恣爾取之有不從者俘略之而去於是婆多吐水裴滿部斡不勃堇附於世祖桓等縱火焚之斡不死世祖厚撫其家既定桓以舊地還之桓軍復來蒲察部沙秪勃堇胡補答勃堇使阿喜間道來告且問曰寇將至吾屬何以待之世祖復命曰事至此不及謀矣以衆從之自救可也惟以旗幟自別耳每有兵至則輒遣阿喜穿林潛來令與畢察往還大道即故潛往來林中路也桓至北隘甸世祖將出兵聞跋黑食于滿村死矣乃沿安术虎水行且欲並取海故术烈速勃堇之衆而後戰覘者來報曰敵至矣世祖戒辭不失整軍速進使待於脫豁改原當是時桓兵衆世祖兵少衆寡不敵比世祖至軍士氣衄甚世祖心知之而不敢言但令解甲少憩以水洗面飲水頃之士氣稍蘇息是時肅宗求救於遼不在軍中將戰世祖屏人獨與穆宗私語兵敗則就與肅宗乞師以報讎仍令穆宗勿預戰事介馬以觀勝負先圖去就乃袒袖韔弓服矢以縕袍下幅護前後心三揚旗三撾鼓棄旗提劍身為軍鋒盡鋭搏戰桓步軍以干盾進世祖之衆以長槍擊之步軍大敗辭不失從後奮擊之桓之騎兵亦敗世祖乘勝逐北破多退水水為之赤世祖止軍勿追盡獲所棄車甲馬牛軍實以戰勝告于天地頒所獲於將士各以功為差未幾桓散達俱以其屬來降卜灰猶保撒阿辣村招之不出撒骨出據阿魯紺出村世祖遣人與之議和撒骨出謾言為戲答之曰我本欲和壯士巴的悶不肯和泣而謂我曰若果與和則美衣肥羊不可復得是以不敢從命遂縱兵俘略鄰近村墅有人從道傍射之中口死卜灰之屬曰石魯石魯之母嫁于滿部達魯罕勃堇而為之妾達魯罕與族兄弟抹腮引勃堇俱事世祖世祖欲間石魯於卜灰謂達魯罕曰汝之事我不如抹腮引之堅固也蓋謂石魯母子一彼焉一此焉以此撼石魯石魯聞之遂殺卜灰而降石魯通於卜灰之妾常懼得罪及聞世祖言惑之使告于達魯罕曰將殺卜灰而來汝待我于江伺卜灰睡熟剚刃於胸而殺之追者急白日露鼻匿水中逮夜至江方遊以濟達魯罕使人待之乃得免久之醉酒而與達魯罕狠爭達魯罕殺之烏春阿跋斯水溫都部人以鍛鐵為業因歲歉策杖負簷與其族屬來歸景祖與之處以本業自給既而知其果敢善斷命為本部長仍遣族人盆德送歸舊部盆德烏春之甥也世祖初嗣節度使叔父跋黑陰懷覬覦間誘桓散達兄弟及烏春窩謀罕等烏春以跋黑居肘腋為變信之由是頗二於世祖而虐用其部人部人訴於世祖世祖使人讓之曰吾父信任汝以汝為部長今人告汝有實狀殺無罪人聽訟不平自今不得復爾為也烏春曰吾與汝父等輩舊人汝為長能幾日干汝何事世祖內畏跋黑恐羣朋為變故曲意懷撫而欲以婚姻結其歡心使與約婚烏春不欲笑曰狗彘之子同處豈能生育胡里改與女直豈可為親也烏春欲發兵而世祖待之如初無以為端加古部烏不屯亦鐵工也以被甲九十來售烏春聞之使人來讓曰甲吾甲也來流水以南匹古敦水以北皆吾土也何故輒取吾甲其亟以歸我世祖曰彼以甲來市吾與直而售之烏春曰汝不肯與我甲而為和解則使汝叔之子斜葛及厮勒來斜葛蓋跋黑之子也世祖度其意非真肯議和者將以有為也不欲遣衆固請曰不遣則必用兵不得已遣之謂厮勒曰斜葛無害彼且執汝矣半途辭疾勿往既行厮勒曰我疾作將止不往斜葛曰吾亦不能獨往矣同行者強之使行既見烏春烏春與斜葛厚為禮而果執厮勒曰得甲則生否則殺汝世祖與其甲厮勒乃得歸烏春自此益無所憚後數年烏春舉兵來戰道斜寸嶺涉活論來流水舍於术虎部阿里矮村滓布乃勃堇家是時十月中大雨纍晝夜不止冰澌覆地烏春不能進乃引去於是桓散達亦舉兵世祖自拒烏春而使肅宗拒桓已而烏春遇雨歸叔父跋黑亦死故世祖得併力於桓散達一戰而遂敗之斡勒部人杯乃舊事景祖至是亦有他志徙于南畢懇忒村遂以縱火誣歡都欲因此除去之語在歡都傳中世祖獲杯乃釋其罪杯乃終不自安徙居吐窟村與烏春窩謀罕結約烏春舉兵度嶺世祖駐軍屋闢村以待之進至蘇素海甸兩軍皆陳將戰世祖不親戰命肅宗以左軍戰斜列辭不失助之徵異夢也肅宗束縕縱火大風從後起火熾烈時八月野草尚青火盡燎煙焰張天烏春軍在下風肅宗自上風擊之烏春大敗復獲杯乃獻于遼而城蘇素海甸以據之紇石烈臘醅麻産與世祖戰於野鵲水世祖中四創軍敗臘醅使舊賊禿罕等過青嶺見烏春賂諸部與之交結臘醅麻産求助於烏春烏春以姑里甸兵百十七人助之世祖擒臘醅獻于遼主並言烏春助兵之狀仍以不修鷹道罪之遼主使人至烏春問狀烏春懼乃為讕言以告曰未嘗與臘醅為助也德鄰石之北姑里甸之民所管不及此臘醅既敗世祖盡得烏春姑里甸助兵一百十七人而使其卒長斡善斡脫往招其衆繼遣斜鉢勃堇撫定之斜鉢不能訓齊其人蒲察部故石跋石等誘三百餘人入城盡陷之世祖治鷹道還斜列來告世祖使歡都為都統破烏春窩謀罕於斜堆故石跋石皆就擒世祖自將過烏紀嶺至窩謀海村胡論加古部勝昆勃堇居烏延部富者郭請分一軍由所部伐烏春蓋以所部與烏春近欲以自蔽故也乃使斜列躍盤以支軍道其所居世祖自將大軍與歡都合至阿不塞水嶺東諸部皆會石土門亦以所部兵來是時烏春前死窩謀罕聞知世祖來伐訴於遼人乞與和解使者已至其家世祖軍至窩謀罕請緩師盡以前所納亡人歸之世祖使烏林答故德黑勃堇往受所遣亡者窩謀罕以三百騎乘懈來攻世祖敗之遼使惡其無信不復為主和乃進軍圍之太祖衣短甲行圍號令諸軍窩謀罕使太峪潛出城攻之太峪馳馬援槍將及太祖活臘胡擊斷其槍太祖乃得免斜列至斜寸水用郭計取先在烏春軍者二十二人烏春軍覺之殺二人餘二十人皆得之益以土軍來助窩謀罕自知不敵乃遁去遂克其城盡以資産分賚軍中以功為次諸部皆安輯焉穆宗常嘉郭功後以斜列之女守寧妻其子胡里罕烏春之後為溫敦氏裔孫曰蒲剌溫敦蒲剌始居長白山阿不辛河徙隆州移里閔河蒲剌初從希尹征伐攝猛安謀克事遇賊突出力擊敗之手殺二十餘人用是擢修武校尉天德初充護衛遷宿直將軍與衆護衛射遠皆莫能及海陵以玉鞍銜賞之往曷懶路選可充護衛者使還稱旨遷耶盧碗羣牧使改遼州刺史正隆伐宋召為武翼軍副都總管將兵二千至汝州南遇宋兵二萬餘邀擊敗之手殺將士十餘人是時嵩汝兩州百姓多逃去蒲剌招集使之復其業改莫州刺史徵為太子左衛率府率再遷隴州防禦使歷鎮西胡里改顯德軍節度使致仕卒臘醅麻産兄弟者活剌渾水訶鄰鄉紇石烈部人兄弟七人素有名聲人推服之及烏春窩謀罕等為難故臘醅兄弟乘此際結陶溫水之民浸不可制其同里中有避之者徙於苾罕村野居女直中臘醅怒將攻之乃約烏古論部騷臘勃堇富者撻懶胡什滿勃堇海羅勃堇斡茁火勃堇海羅斡茁火間使人告野居女直野居女直有備臘醅等敗歸臘醅乃由南路復襲野居女直勝之俘略甚衆海羅斡茁火胡什滿畏臘醅求援于世祖斜列以輕兵邀擊臘醅等于屯睦吐村敗之盡得所俘臘醅麻産驅掠來流水牧馬世祖至混同江與穆宗分軍世祖自妬骨魯津倍道兼行馬多乏皆留之路傍從五六十騎遇臘醅于野鵲水日已曛臘醅兵衆世祖兵少歡都鏖戰出入數四馬中創死者十數世祖突陳力戰中四創不能軍穆宗自庵吐渾津度江遇敵于蒲蘆買水敵問為誰應之曰歡都問者射穆宗矢著于弓箙是歲臘醅麻産使其徒舊賊禿罕及𩽆剽取戶魯不濼牧馬四百及富者粘罕之馬合七百餘匹過青嶺東與烏春窩謀罕交結世祖自將伐之臘醅等偽降還軍臘醅復求助於烏春窩謀罕窩謀罕以姑里甸兵百有十七人助之臘醅據暮稜水保固險阻石顯子婆諸刊亦往從之世祖率兵圍之克其軍麻産遁去遂擒臘醅及婆諸刊皆獻之遼盡獲其兵使其卒長斡善斡脫招撫其衆使斜鉢撫定之復使阿離合悶察暮稜水人情並募兵與斜鉢合語在烏春傳世祖既沒肅宗襲節度使麻産據直屋鎧水繕完營堡招納亡命杜絶往來者恃陶溫水民為之助招之不聽使康宗伐之是歲白山混同江大溢水與岸齊康宗自阿鄰岡乘舟至於帥水舍舟沿帥水而進使太祖從東路取麻産家屬盡獲之康宗圍麻産急太祖來會軍於是麻産先亡在外其人乘夜突圍遁去太祖曰麻産之家蕩盡矣走將安歸追之麻産不知太祖急求己也與三騎來伺軍其一人墜馬下太祖識之問狀其人曰我隨麻産來伺軍彼走者二人麻産在焉麻産與其人分道走太祖命劾魯古追東走者而自追西走者至直屋鎧水失麻産不見急追之得遺甲於路迹而往前至大澤濘淖麻産棄馬入萑葦太祖亦棄馬追及之與之挑戰烏古論壯士活臘胡乘馬來問曰此何人也太祖初不識麻産佯應曰麻産也活臘胡曰今亦追及此人邪遂下馬援槍進戰麻産連射活臘胡活臘胡中二矢不能戰有頃軍至圍之歡都射中麻産首遂擒之無有識之者活臘胡乃前扶其首而視之見其齒豁曰真麻産也麻産張目曰公等事定矣遂殺之太祖獻馘於遼鈍恩阿里民忒石水紇石烈部人祖曰劾魯古父納根涅世為其部勃堇斡準部人冶剌勃堇海葛安勃堇暴其族人斡達罕勃堇及諸弟屋里黑屋徒門抄略其家及抄略阿活里勃堇家侵及納根涅所部穆宗使納根涅以本部兵往治冶剌等行至蘇濱水輒募人為兵主者拒之輒抄略其人遂攻烏古論部敵庫德入米里迷石罕城及斡賽冶訶來問狀止蘇濱水西納木汗村納根涅止蘇濱水東屋邁村納根涅雖款伏而不肯徵償時甲戌歲十月也明年八月納根涅遁去斡賽追而殺之執其母及其妻子以歸而使鈍恩復其所留可統門渾蠢水合流之地烏古論部人忽沙渾勃堇之子詐都渾蠢水安春之子也間誘奧純塢塔兩部之民作亂敵庫德鈍恩皆叛而與留可詐都合兩黨揚言曰徒單部之黨十四部為一烏古論部之黨十四部為一蒲察部之黨七部為一凡三十五部完顏部十二而已以三十五部戰十二部三人戰一人也勝之必矣世祖降附諸部亦皆有離心當是時惟烏延部斜勒勃堇及統門水溫迪痕部阿里保勃堇撒葛周勃堇等皆使人來告難斜勒達紀保之子也先使其兄保骨臘來既而以其甲來歸阿里保等曰吾等必不從亂但乞兵為援耳穆宗使撒改伐留可使謾都訶伐敵庫德既而太祖以七十甲詣撒改軍中道以四十甲與謾都訶石土門之軍與謾都訶會于米里迷石罕城下而鈍恩將援留可聞謾都訶之兵寡以為無備而未知石土門之來會也欲先攻謾都訶謾都訶石土門迎擊大破鈍恩米里迷石罕城遂降獲鈍恩敵庫德皆釋弗誅太祖至撒改軍明日遂攻破留可城城中渠帥皆誅之取其孥纍資産而還塢塔城亦撤守備而降留可先在遼塢塔已脫身在外由是皆未獲詐都亦詣蒲家奴降太祖釋之於是諸部皆安業如故久之留可塢塔皆來降阿疏星顯水紇石烈部人父阿海勃堇事景祖世祖世祖破烏春還阿海率官屬士民迎謁于雙宜大濼獻黃金五斗世祖喻之曰烏春本微賤吾父撫育之使為部長而忘大恩乃結怨於我遂成大亂自取滅亡吾與汝等三十部之人自今可以保安休息吾大數亦將終我死汝等當念我竭力以輔我子弟若亂心一生則滅亡如烏春矣阿海與衆跪而泣曰太師若有不諱衆人賴誰以生勿為此言未幾世祖沒阿海亦死阿疏繼之阿疏自其父時常以事來昭肅皇后甚憐愛之每至必留月餘乃遣歸阿疏既為勃堇嘗與徒單部詐都勃堇爭長肅宗治之乃長阿疏穆宗嗣節度聞阿疏有異志乃召阿疏賜以鞍馬深加撫諭陰察其意趣阿疏歸謀益甚乃斥其事復召之阿疏不來遂與同部毛睹祿勃堇等起兵穆宗自馬紀嶺出兵攻之撒改自胡論嶺往略定潺春星顯兩路攻下鈍恩城穆宗略阿茶檜水益募軍至阿疏城是日辰巳間忽暴雨晦曀雷電下阿疏所居既又有大光聲如雷墜阿疏城中識者以謂破亡之徵阿疏聞穆宗來與其弟狄故保往訴于遼遼人來止勿攻穆宗不得已留劾者勃堇守阿疏城而歸金初亦有兩劾者其一撒改父贈韓國公其一守阿疏城者後贈特進云劾者以兵守阿疏城者二年矣阿疏在遼不敢歸毛睹祿乃降遼使復為阿疏來穆宗聞之使烏林答石魯濟師且戒劾者令易衣服旗幟與阿疏城中同色使遼使不可辨遼使至乃使蒲察部胡魯勃堇邈遜勃堇與俱至劾者軍而軍中已易衣服旗幟與阿疏城中如一遼使果不能辨劾者詭曰吾等自相攻干汝何事誰識汝之太師乃刺殺胡魯邈遜所乘馬遼使驚怖走去遂破其城狄故保先歸殺之阿疏聞穆宗以計却遼使破其城殺狄故保復訴於遼遼使奚節度使乙烈來問狀且使備償阿疏穆宗復使主隈禿答水人偽阻絶鷹路者而使鱉故德部節度使言於遼平鷹路非己不可遼人不察也信之穆宗畋於土溫水謂遼人曰吾平鷹路也遼人以為功使使來賞之穆宗盡以其物與主隈禿答之人而不復備償阿疏遼人亦不復問阿疏在遼無所歸後二年使其徒達紀至生女直界上曷懶甸人畏穆宗執而送之阿疏遂終于遼及太祖伐遼底遼之罪告于天地而以阿疏亡命遼人不與為言凡與遼往復書命必及之天輔六年闍母婁室略定天德雲內寧邊東勝等州獲阿疏軍士問之曰爾為誰曰我破遼鬼也贊曰金之興也有自來矣世祖擒臘醅婆諸刊既獻之遼以為功則又曰若不遣還其部人疑懼且為亂階遼人不察盡以前後所獻罪人歸之景祖止曷魯林牙止同幹穆宗止遼使阿疏城始終以鷹路誤之而遼人不悟景祖有黃馬服乘如意景祖沒遼貴人爭欲得之世祖弗與曰難未息也馬不可以與人遂割其兩耳謂之禿耳馬遼貴人乃弗取其削平諸部則借遼以為己重既獻而求之則市以為己重戰陳一良馬終弗與遼人而遼人終不悟豈興亡有數蓋天奪其魄歟奚與契丹俱起在元魏時號庫莫奚歷宇文周隋唐皆號兵強其後契丹破走奚奚西保冷陘其留者臣服于契丹號東西奚厥後遼太祖稱帝諸部皆內屬矣鐵勒者古部族之號奚有其地號稱鐵勒州又書作鐵驪州奚有五王族世與遼人為昏因附姓述律氏中事具遼史今不載奚有十三部二十八落一百一帳三百六十二族甲午歲太祖破耶律謝十諸將連戰皆捷奚鐵驪王回離保以所部降未幾遁歸于遼及遼主使使請和太祖曰歸我叛人阿疏降人回離保迪里等餘事徐議之久之遼主至鴛鴦濼都統杲襲之亡走天德回離保與遼大臣立秦晉國王耶律捏里于燕京捏里死蕭妃權國事太祖入居庸關蕭妃自古北口出奔回離保至盧龍嶺遂留不行會諸奚吏民于越里部僭稱帝改元天復改置官屬籍渤海奚漢丁壯為軍太祖詔回離保曰聞汝脅誘吏民僭竊位號遼主越在草莽大福不再汝之先世臣服于遼今來臣屬與昔何異汝與余睹有隙故難其來余睹設有睚眥朕豈從之儻能速降盡釋汝罪仍俾主六部族總山前奚衆還其官屬財産若尚執迷遣兵致討必不汝赦回離保不聽天輔七年五月回離保南寇燕地敗於景薊間其衆奔潰耶律奧古哲及甥八斤家奴白底哥等殺之其妻阿古聞之自剄而死先是速古部人據劾山奚路都統撻懶招之不服往討之鐵泥部衆扼險拒戰殺之殆盡至是速古啜里鐵泥三部所據十三巖皆討平之達魯古部節度使乙列已降復叛奚馬和尚討達魯古並五院司等諸部諸部皆降遂執乙列杖之一百其父及其家人先被獲者皆還之初太祖破遼兵于達魯古城九百奚營來降至是回離保死奚人以次附屬亦各置猛安謀克領之贊曰庫莫奚契丹起於漢末盛於隋唐之間俱強為鄰國合並為君臣歷八百餘年相為終始奚有五大定間類族著姓有遙里氏伯德氏奧里氏梅知氏揣氏
