body:
  text: 金史卷一百七列傳第四十五高汝礪張行信高汝礪字巖夫應州金城人登大定十九年進士第蒞官有能聲明昌五年九月章宗詔宰執舉奏中外可為刺史者上親閲闕點注蓋取兩員同舉者升用之於是汝礪自同知絳陽軍節度事起為石州刺史承安元年七月入為左司郎中一日奏事紫宸殿時侍臣皆回避上所御涼扇忽墮案下汝礪以非職不敢取以進奏事畢上謂宰臣曰高汝礪不進扇可謂知體矣未幾擢為左諫議大夫以賦調軍須郡縣有司或不得人追胥走卒利其事急規取貨賂深為民害建言自今若因兵調發有犯者乞權依推排受財法治之庶使小人有所畏懼二年六月定制因軍前差發受財者一貫以下徒二年以上徒三年十貫處死從汝礪之言也時遇奏事臺臣亦令回避汝礪乃上言國家置諫臣以備侍從蓋欲周知時政以參得失非徒使排行就列而已故唐制凡中書門下及三品以上入閣必遣諫官隨之俾預聞政事冀其有所開說今省臺以下遇朝奏事則一切回避與諸侍衛之臣旅進旅退殿廷論事初莫得聞及其已行又不詳其始末遂事而諫斯亦難矣顧諫職為何如哉若曰非材擇人可也豈可置之言責而疏遠若此乞自今以往有司奏事諫官得以預聞庶望少補且修注之職掌記言動俱當一體上從之又言年前十月嘗舉行推排之法尋以踰時而止誠知聖上愛民之深也切聞周制以歲時定民之衆寡辨物之多少入其數于小司徒以施政教以行徵令三年則天下大比按為定法伏自大定四年通檢前後迄今三十餘年其間雖兩經推排其浮財物力惟憑一時小民之語以為增減有司惟務速定不復推究其實由是豪強有力者符同而幸免貧弱寡援者抑屈而無訴況近年以來邊方屢有調發貧戶益多如止循例推排緣去歲條理已行人所通知恐新強之家預為請囑狡獪之人冀望至時同辭推唱或虛作貧乏故以産業低價質典及將財物徙置他所權止營運如此姦弊百端欲望物力均一難矣欲革斯弊莫若據實通檢預令有司照勘大定四年條理嚴立罪賞截日立限關防禁約其間有可以輕重者斟酌行之去煩碎而就簡易戒搔擾而事鎮靜使富者不得以苟避困者有望於少息則賦稅易辦人免不均之患矣詔尚書省俟邊事息行之是歲十月上諭尚書省遣官詣各路通檢民力命戶部尚書賈執剛與汝礪先推排在都兩警巡院令諸路所差官視以為法焉尋為同知大興府事四年十二月為陝西東路轉運使泰和元年七月改西京路轉運使二年正月為北京臨潢府路按察使四年二月遷河北西路轉運使十一月進中都路都轉運使六年六月拜戶部尚書時鈔法不能流轉汝礪隨事上言多所更定民甚便之語在食貨志上嘉其議敕尚書省曰內外百官所司不同比應詔言事者不啻千數俱不達各司利害汗漫陳說莫能詳盡近惟戶部尚書高汝礪論本部數事並切事情皆已行之其諭內外百司各究利害舉明若可舉而不即申聞以致上司舉行者量制其罰貞祐二年六月宣宗南遷次邯鄲拜汝礪為參知政事次湯陰上聞汴京穀價騰踴慮扈從人至則愈貴問宰臣何以處之皆請命留守司約束汝礪獨曰物價低昂朝夕或異然糴多糶少則貴蓋諸路之人輻湊河南糴者既多安得不貴若禁止之有物之家皆將閉而不出商旅轉販亦不復入城則糴者益急而貴益甚矣事有難易不可不知今少而難得者穀也多而易致者鈔也自當先其所難後其所易多方開誘務使出粟更鈔則穀價自平矣上從之三年五月朝廷議徙河北軍戶家屬於河南留其軍守衛郡縣汝礪言此事果行但便於豪強家耳貧戶豈能徙且安土重遷人之情也今使盡赴河南彼一旦去其田園扶攜老幼驅馳道路流離失所豈不可憐且所過百姓見軍戶盡遷必將驚疑謂國家分別彼此其心安得不搖況軍人已去其家而令護衛他人以情度之其不肯盡心必矣民至愚而神者也雖告以衛護之意亦將不信徒令交亂俱不得安此其利害所繫至重乞先令諸道元帥府宣撫司總管府熟論可否如無可疑然後施行不報軍戶既遷將括地分授之未有定論上敕尚書省曰北兵將及河南由是盡起諸路軍戶共圖保守今既至矣糧食所當必與然未有以處之可分遣官聚耆老問之其將益賦或與之田二者孰便又以諭汝礪既而所遣官言農民並稱比年以來租賦已重若更益之力實不足不敢復佃官田願以給軍於是汝礪奏遷徙軍戶一時之事也民佃官田久遠之計也河南民地官田計數相半又多全佃官田之家墳塋莊井俱在其中率皆貧民一旦奪之何以自活夫小民易動難安一時避賦遂有此言及其與人即前日之主今還為客能勿悔乎悔則忿心生矣如山東撥地時腴田沃壤盡入勢家瘠惡者乃付貧戶無益於軍而民則有損至於互相憎疾今猶未已前事不遠足為明戒惟當倍益官租以給軍糧之半復以係官荒田牧馬草地量數付之令其自耕則百姓免失業之艱而官司不必為厲民之事矣且河南之田最宜麥今雨澤霑足正播種之時誠恐民疑以誤歲計宜早決之上從其請尋遷尚書右丞時上以軍戶地當撥付使得及時耕墾而汝礪復上奏曰在官荒田及牧馬地民多私耕者今正藝麥之時彼知將以與人必皆棄去軍戶雖得亦已逾時徒成曠廢若候畢功而後撥量收所得以補軍儲則公私俱便乞盡九月然後遣官十月汝礪言今河北軍戶徙河南者幾百萬口人日給米一升歲率三百六十萬石半給其直猶支粟三百萬石河南租地計二十四萬頃歲徵粟才一百五十六萬有奇更乞於經費之外倍徵以給仍以係官間田及牧馬地可耕者畀之奏可乃遣右司諫馮開等分詣諸郡就給之人三十畝以汝礪總之既而括地官還皆曰頃畝之數甚少且瘠惡不可耕計其可耕者均以與之人得無幾又僻遠處不免徙就之軍人皆以為不便汝礪遂言於上詔有司罷之但給軍糧之半而半折以實直焉四年正月拜尚書左丞連上表乞致仕皆優詔不許會朝廷議發兵河北護民芟麥而民間流言謂官將盡取之上聞以問宰職曰為之奈何高琪等奏若令樞密院遣兵居其衝要鎮遏土寇仍許收逃戶之田則軍民兩便或有警急軍士亦必盡心汝礪曰甚非計也蓋河朔之民所恃以食者惟此麥耳今已有流言而復以兵往是益使之疑懼也不若聽其自便令宣撫司禁戢無賴不致侵擾足矣逃戶田令有司收之以充軍儲可也乃詔遣戶部員外郎裴滿蒲剌都閲視田數及訪民願發兵以否還奏臣西由懷孟東抵曹單麥苗苦亦無多訊諸農民往往自為義軍臣即宣布朝廷欲發兵之意皆感戴而不願也於是罷之汝礪以數乞致仕不從乃上言曰立非常之功必待非常之人今大兵既退正完葺關隘簡練兵士之時須得通敏經綸之才預為籌畫俾濟中興伏見尚書左丞兼行樞密副使胥鼎才擅衆長身兼數器乞召還朝省不從時高琪欲從言事者歲閲民田徵租朝廷將從之汝礪言臣聞治大國者若烹小鮮最為政之善喻也國朝自大定通檢後十年一推物力惟其貴簡靜而重勞民耳今言者請如河北歲括實種之田計數徵斂即是常時通檢無乃駭人視聽使之不安乎且河南河北事體不同河北纍經劫掠戶口亡匿田疇荒廢差調難依元額故為此權宜之法蓋軍儲不加多且地少而易見也河南自車駕巡幸以來百姓湊集凡有間田及逃戶所棄耕墾殆遍各承元戶輸租其所徵斂皆準通推之額雖軍馬益多未嘗闕誤詎宜一概動擾若恐豪右蔽匿而逋征賦則有司檢括亦豈盡實但嚴立賞罰許其自首及聽人告捕犯者以盜軍儲坐之地付告者自足使人知懼而賦悉入官何必為是紛紛也抑又有大不可者三如每歲檢括則夏田春量秋田夏量中間雜種亦且隨時量之一歲中略無休息民將厭避耕種失時或止耕膏腴而棄其餘則所收仍舊而所輸益少一不可也檢括之時縣官不能家至戶到里胥得以暗通貨賂上下其手虛為文具轉失其真二不可也民田與軍田犬牙相錯彼或陰結軍人以相冒亂而朝廷止憑有司之籍儻使臨時少於元額則資儲闕誤必矣三不可也夫朝廷舉事務在必行既行而復中止焉是豈善計哉議遂寢興定元年十月上疏曰言者請姑與宋人議和以息邊民切以為非計宋人多詐無實雖與文移往來而邊備未敢遽撤備既不撤則議和與否蓋無以異或復蔓以浮辭禮例之外別有求索言涉不遜將若之何或曰大定間亦嘗先遣使今何不可切謂時殊事異難以例言昔海陵師出無名曲在於我是以世宗即位首遣高忠建等報諭宋主罷淮甸所侵以修舊好彼隨遣使來書辭慢易不復奉表稱臣願還故疆為兄弟國雖其樞密院與我帥府時通書問而侵軼未嘗已也既而征西元帥合喜敗宋將吳璘姚良輔於德順原州右丞相僕散忠義右副元帥紇石烈志寧敗李世輔于宿州斬首五萬兵威大振世宗謂宰臣曰昔宋人言遣使請和乘吾無備遂攻宿州今為我軍大敗殺戮過當故不敢復通問朕哀南北生靈久困于兵本欲息民何較細故其令帥府移書宋人以議和好宋果遣使告和以當時堂堂之勢又無邊患竟免其奉表稱臣之禮今宋棄信背盟侵我邊鄙是曲在彼也彼若請和於理為順豈當先發此議而自示弱耶恐非徒無益反招謗侮而已十一月汝礪言臣聞國以民為基民以財為本是以王者必先愛養基本國家調發河南為重所徵稅租率常三倍于舊今省部計歲收通寶不敷所支乃于民間科斂桑皮故紙錢七千萬貫以補之近以通寶稍滯又加兩倍河南人戶農民居三之二今稅租猶多未足而此令復出彼不糶所當輸租則必減其食以應之夫事有難易勢有緩急今急用而難得者芻糧也出於民力其來有限可緩圖而易為者鈔法也行于國家其變無窮向者大鈔滯更為小鈔小鈔弊改為寶券寶券不行易為通寶從權制變皆由于上尚何以煩民為哉彼悉力以奉軍儲已患不足而又添徵通寶苟不能給則有逃亡民逃亡則農事廢兵食何自而得有司不究遠圖而貪近效不固本原而較末節誠恐軍儲鈔法兩有所妨臣非於鈔法不為意也非與省部故相違也但以鈔法稍滯物價稍增之害輕民生不安軍儲不給之害重耳惟陛下外度事勢俯察臣言特命有司減免則羣心和悅而未足之租有所望矣時朝廷以賈同苗道潤等相攻不和將分畀州縣別署名號以處之汝礪上書曰甚非計也蓋河北諸帥多本土義軍一時權為隊長亦有先嘗叛亡者非若素宦於朝知禮義識名分之人也貪暴不法蓋無足怪朝廷以時方多故姑牢籠用之庶使遺民少得安息彼互相攻劫則勢寖弱勢力既弱則朝廷易制今若分地而與之州縣官吏得輒署置民戶稅賦得擅徵收則地廣者日益冖出蟲狹者日益弱久之弱者皆並於冖出蟲冖出蟲者之地不可復奪是朝廷愈難制也昔唐分河朔地授諸叛將史臣謂其護養孽萌以成其禍此可為今日大戒也不若姑令行省羈縻和輯多方牽制使之不得逞異時邊事稍息氣力漸完若輩又何足患哉議遂寢上嘗謂汝礪曰朕每見卿侍朝恐不任其勞許坐殿下而卿終不從何哉夫君臣相遇貴在誠實小謹區區朕固不較也汝礪以君臣之分甚嚴不敢奉命三年河南頗豐稔民間多積粟汝礪乃奏曰國家之務莫重於食今所在屯兵益衆而修築新城其費亦廣若不及此豐年多方營辦防秋之際或乏軍興乞於河南州府驗其物價低昂權宜立式凡內外四品以下雜正班散官及承廕人免當儤使監官功酬或僧道官師德號度牒寺觀院額等並聽買之司縣官有能勸誘輸粟至三千石者將來注授升本榜首五千石以上遷官一階萬石以上升職一等並注見闕庶幾人知勸慕多所收獲上從之同提舉榷貨司王三錫建議榷油高琪以用度方急勸上行之汝礪上言曰古無榷法自漢以來始置鹽鐵酒榷均輸官以佐經費末流至有算舟車稅間架其征利之術固已盡矣然亦未聞榷油也蓋油者世所共用利歸於公則害及於民故古今皆置不論亦厭苛細而重煩擾也國家自軍興河南一路歲入稅租不啻加倍又有額徵諸錢橫泛雜役無非出於民者而更議榷油歲收銀數十萬兩夫國以民為本當此之際民可以重困乎若從三錫議是以舉世通行之貨為榷貨私家常用之物為禁物自古不行之法為良法切為聖朝不取也若果行之其害有五臣請言之河南州縣當立務九百餘所設官千八百餘員而胥隸工作之徒不與焉費既不資而又創搆屋宇奪買作具公私俱擾殆不勝言至於提點官司有升降決罰之法其課一虧必生抑配之弊小民受病益不能堪其害一也夫油之貴賤所在不齊惟其商旅轉販有無相易所以其價常平人易得之今既設官各有分地輒相侵犯者有罪是使貴處常貴而賤處常賤其害二也民家日用不能躬自沽之而轉鬻者增取利息則價不得不貴而用不得不難其害三也鹽鐵酒醋公私所造不同易於分別惟油不然莫可辨記今私造者有刑捕告者有賞則無賴輩因之得以誣搆良民枉陷於罪其害四也油戶所置屋宇作具用錢已多有司按業推定物力以給差賦今奪其具廢其業而差賦如前何以自活其害五也惟罷之便上是之然重違高琪意乃詔集百官議于尚書省戶部尚書高夔工部侍郎粘割荊山知開封府事溫迪罕二十等二十六人議同高琪禮部尚書楊雲翼翰林侍讀學士趙秉文南京路轉運使趙瑄吏部侍郎趙伯成刑部郎中姬世英右司諫郭著提舉倉場使時戩皆以為不可上曰古所不行者而今行之是又生一事也其罷之十月賜金鼎一重幣三四年三月拜平章政事俄而進拜尚書右丞相監修國史封壽國公五年二月上表乞致政不許九月上諭汝礪曰昨日視朝至午方罷卿老矣不任久立奏事畢用寶之際可先退坐恐以勞致疾反妨議政也是月復乞致仕上諭之曰丞相之禮盡矣然今廷臣誰如丞相者而必欲求去乎姑留輔朕可也十月躐遷榮祿大夫仍諭曰丞相數求去朕以社稷事重故堅留之丞相老矣而官猶未至二品故特升兩階十二月上復諭曰向朕以卿年老視朝之日侍立為勞令用寶時退坐廊下而卿違之復侍立終朝豈有司不為設榻耶卿其勉從朕意元光元年四月汝礪跪奏事上命起曰卿大臣也所言皆社稷計朕之責卿惟在盡誠何事小謹自今勿復爾也七月上謂宰臣曰昔有言世宗太儉者或曰不爾則安得廣畜積章宗時用度甚多而得不闕乏者蓋先朝有以遺之也汝礪因進言曰儉乃帝王大德陛下言及此天下福也九月上又謂宰臣曰有功者雖有微過亦當貸之無功者豈可貸耶然有功者人喜謗議凡有以功過言於朕者朕必深求其實雖近侍為言不敢輕信亦未嘗徇一己之愛憎也汝礪因對曰公生明偏生暗凡人多徇愛憎不合公議陛下聖明故能如是耳二年正月復乞致政上面諭曰今若從卿始終之道俱盡於卿甚安在朕亦為美事但時方多故而朕復不德正賴舊人輔佐故未能遂卿高志耳汝礪固辭竟不許因謂曰朕每聞人有所毀譽必求其實汝礪對曰昔齊威王封即墨大夫烹阿大夫及左右之嘗毀譽者由是羣臣恐懼莫敢飾非齊國大治陛下言及此治安可期也二月上以汝礪年高免朝拜侍立久則憩于殿下仍敕有司設榻焉三月又乞致仕復優詔不許上謂羣臣曰人有才堪任事而處心不正者終不足貴汝礪對曰其心不正而濟之以才所謂虎而翼者也雖古聖人亦未易知上以為然他日復謂宰臣曰凡人處心善良而行事忠實斯為難得若言巧心僞亦復何用然善良者人又多目為平常汝礪對曰人材少全亦隨其所長取之耳上然之五月上問宰執以修完京城樓櫓事汝礪奏所用皆大木顧今難得方今計置上曰朕宮中別殿有可用者即用之汝礪對以不宜毀上曰所居之外毀亦何害不愈於勞民遠致乎哀宗初即位諫官言汝礪欺君固位天下所共嫉宜黜之以厲百官哀宗曰昔惠帝言我不如高帝當守先帝法耳汝礪乃先帝立以為相者又可黜歟又有投匿名書云高某不退當殺之汝礪因是告老優詔不許正大元年三月薨年七十一配享宣宗廟為人慎密廉潔能結人主知然規守格法循默避事故為相十餘年未嘗有譴訶貪戀不去當時士論頗以為譏云張行信字信甫先名行忠避莊獻太子諱改焉行簡弟也登大定二十八年進士第纍官銅山令明昌元年以廉擢授監察御史泰和三年同知山東西路轉運使俄簽河東路按察司事四年四月召見于泰和殿行信因言二事一依舊移轉吏目以除民害一徐邳地下宜麥稅粟許納麥以便民上是其言令尚書省議行之崇慶二年為左諫議大夫時胡沙虎已除名為民賂遺權貴將復進用舉朝無敢言者行信乃上章曰胡沙虎殘忍凶悖跋扈冖出蟲梁媚結近習以圖稱譽自其廢黜士庶莫不欣悅今若復用惟恐為害更甚前日況利害之機更有大於此者書再上不報及胡沙虎弒逆人甚危之行信坦然不顧也是歲九月宣宗即位改元貞祐行信以皇嗣未立無以係天下之望上疏曰自古人君即位必立太子以為儲副必下詔以告中外竊見皇長子每遇趨朝用東宮儀衛及至丹墀還列諸王班況已除侍臣而今未定其禮可謂名不正言不順矣昔漢文帝元年首立子啓為太子者所以尊祖廟重社稷也願與大臣詳議酌前代故事早下明詔以定其位慎選宮僚輔成德器則天下幸甚上嘉納之胡沙虎誅上封事言正刑賞辭載胡沙虎傳又言自兵興以來將帥甚難其人願陛下令重臣各舉所知才果可用即賜召見褒顯奬諭令其自效必有奮命報國者昔李牧為趙將軍功爵賞皆得自專出攻入守不從中覆遂能北破大敵西抑冖出蟲秦今命將若不以文法拘繩中旨牽制委任責成使得盡其智能則克復之功可望矣上善其言時方擢任王守信賈耐兒者為將皆鄙俗不材不曉兵律行信懼其誤國上疏曰易稱開國承家小人勿用聖人所以垂戒後世者其嚴如此今大兵縱橫人情恟懼應敵興理非賢智莫能狂子庸流猥蒙拔擢參預機務甚無謂也於是上皆罷之權元帥右都監內族訛可率兵五千護糧通州遇兵輒潰行信上章曰御兵之道無過賞罰使其臨敵有所慕而樂於進有所畏而不敢退然後將士用命而功可成若訛可敗衄宜明正其罪朝廷寬容一切不問臣恐禦兵之道未盡也詔報曰卿意具悉訛可等已下獄矣時中都受兵方遣使請和握兵者畏縮不敢戰曰恐壞和事行信上言和與戰二事本不相干奉使者自專議和將兵者惟當主戰豈得以和事為辭自崇慶來皆以和誤若我軍時肯進戰稍挫其鋒則和事成也久矣頃北使既來然猶破東京略河東今我使方行將帥輒按兵不動於和議卒無益也事勢益急芻糧益艱和之成否蓋未可知豈當閉門坐守以待弊哉宜及士馬尚壯擇猛將鋭兵防衛轉輸往來拒戰使之少沮則附近蓄積皆可入京師和議亦不日可成矣上心知其善而不能行二年三月以朝廷括糧恐失民心上書言近日朝廷令知大興府胥鼎便宜計畫軍食鼎因奏許人納粟買官既又遣參知政事奧屯忠孝括官民糧戶存兩月餘悉令輸官酬以爵級銀鈔時有粟者或先具數于鼎未及入官忠孝復欲多得以明己功凡鼎所籍者不除其數民甚苦之今米價踴貴無所從糴民糧止兩月又奪之將不獨歸咎有司亦怨朝廷不察也大兵在邇人方危懼若復無聊或生他變則所得不償所損矣上深善其言即命與近臣往審處焉仍諭忠孝曰極知卿盡心于公然國家本欲得糧今既得矣姑從人便可也四月遷山東東路按察使兼轉運使仍權本路宣撫副使將行求入見上御便殿見之奏曰臣伏見奧屯忠孝飾詐不忠臨事慘刻與胡沙虎為黨歷數其罪且曰無事時猶不容一相非才況今多故可使斯人與政乎願即罷之上曰朕始即位進退大臣自當以禮卿語其親知諷令求去可也行信以告右司郎中把胡魯白忠孝忠孝不恤也三年二月改安武軍節度使兼冀州管內觀察使始至即上書言四事其一曰楊安兒賊黨旦暮成擒蓋不足慮今日之急惟在收人心而已向者官軍討賊不分善惡一概誅夷劫其資産掠其婦女重使居民疑畏逃聚山林今宜明敕有司嚴為約束毋令劫掠平民如此則百姓無不安之心姦人誑脅之計不行其勢漸消矣其二曰自兵亂之後郡縣官豪多能糾集義徒摧擊土寇朝廷雖授以本處職任未幾遣人代之夫舊者人所素服新者未必皆才緩急之間啓釁敗事自今郡縣闕員乞令尚書省選人擬注其舊官民便安者宜就加任使如資級未及令攝其職待有功則正授庶幾人盡其才事易以立其三曰掌軍官敢進戰者十無一二其或有之即當責以立功不宜更授他職其四曰山東軍儲皆鬻爵所獲及或持敕牒求仕選曹以等級有不當鬻者往往駁退夫鬻所不當有司罪也彼何責焉況海岱重地羣寇未平田野無所收倉廪無所積一旦軍餉不給復欲鬻爵其誰信之朝廷多用其議八月召為吏部尚書九月改戶部尚書十二月轉禮部尚書兼同修國史四年二月為太子少保兼前職時尚書省奏遼東宣撫副使完顏海奴言參議官王澮嘗言本朝紹高辛黃帝之後也昔漢祖陶唐唐祖老子皆為立廟我朝迄今百年不為黃帝立廟無乃愧於漢唐乎又云本朝初興旗幟尚赤其為火德明矣主德之祀闕而不講亦非禮經重祭祀之意臣聞於澮者如此乞朝廷議其事詔問有司行信奏曰按始祖實録止稱自高麗而來未聞出於高辛今所據欲立黃帝廟黃帝高辛之祖借曰紹之當為木德今乃言火德亦何謂也況國初太祖有訓因完顏部多尚白又取金之不變乃以大金為國號未嘗議及德運近章宗朝始集百僚議之而以繼亡宋火行之絶定為土德以告宗廟而詔天下焉顧澮所言特狂妄者耳上是之八月上將祔享太廟詔依世宗十六拜之禮行信與禮官參定儀注上言宜從四十四拜之禮上嘉納焉語在禮志祭畢賜行信寶券二萬貫重幣十端諭之曰太廟拜禮朕初欲依世宗所行卿進奏章備述隨室讀祝殊為中理向非卿言朕幾失之故特以是旌賞自今每事更宜盡心是年十二月行信以父暐卒去官興定元年三月起復舊職權參知政事六月真拜參知政事時高琪為相專權用事惡不附己者衣冠之士動遭窘辱惟行信屢引舊制力抵其非會宋兵侵境朝廷議遣使詳問高琪等以為失體行信獨上疏曰今以遣使為不當臣切惑之議者不過曰遣使則為先示弱其或不報報而不遜則愈失國體臣獨以為不然彼幸吾釁隙數肆侵掠邊臣以兵却之復來我大國不責以辭而敵以兵茲非示弱乎至於問而不報報而不遜曲自在彼何損於我昔大定之初彼嘗犯順世宗雖遣丞相烏者行省于汴實令元帥撒合輦先為辭詰之彼遂伏罪其後宋主奪取國書朝廷復欲加兵丞相婁室獨以為不可及刑部尚書梁肅銜命以往尋亦屈焉在章宗時猖狂最甚猶先理問而後用兵然則遣使詳問正國家故事何失體之有且國步多艱戍兵滋久不思所以休息之如民力何臣書生無甚高論然事當機會不敢不罄其愚惟陛下察之上復令尚書省議高琪等奏行信所言固遵舊制然今日之事與昔不同詔姑待之已而高汝礪亦上言先遣使不便議遂寢語在汝礪傳時監察御史多被的決行信乃上言曰大定間監察坐罪大抵收贖或至奪俸重則外降而已間有的決者皆有為而然當時執政程輝已嘗面論其非是又有敕旨監察職主彈劾而或看循者非謂凡失察皆然也近日無問事之大小情之輕重一概的決以為大定故實先朝明訓過矣於是詔尚書省更定監察罪名制史館修章宗實録尚書省奏舊制凡修史宰相執政皆預焉然女直漢人各一員崇慶中既以參知政事梁𤨠兼之復命翰林承旨張行簡同事蓋行簡家學相傳多所考據今修章宗實録左丞汝礪已充兼修宜令參知政事行信同修如行簡例制可二年二月出為彰化軍節度使兼涇州管內觀察使諭之曰初朕以朝臣多稱卿才乃令參決機務而廷議之際每不據正妄為異同甚非為相之道復聞邇來殊不以幹當為意豈欲求散地故耶今授此職卿宜悉之初內族合周避敵不擊且詭言密奉朝旨下獄當誅諸皇族多抗表乞從末減高琪以為自古犯法無告免者行信獨曰事無古今但合周平昔忠孝或可以免又以行信族弟行貞居山東受紅襖賊僞命樞密院得宋人書有干涉行信事故出之其子莒時為尚書省令史亦命別加注授焉初行信言今法職官論罪多從的決伏見大定間世宗敕旨職官犯故違聖旨徒年杖數並的決然其後三十餘年有司論罪未嘗引用蓋非經久為例之事也乞詳定之行信既出上以其章付尚書省至是宰臣奏自今違奏條之所指揮及諸條格當坐違制旨者其徒年杖數論贖可也特奉詔旨違者依大定例制可行信去未久上嘗諭宰臣曰自張行信降黜卿等遂緘默此殊非是行信事卿等具知豈以言之故耶自今宜各盡言毋復畏忌行信始至涇即上書曰馬者甲兵之本方軍旅未息馬政不可緩也臣自到涇聞陝右豪民多市於河州轉入內地利蓋百倍及見省差買馬官平涼府判官烏古論桓端市于洮州以銀百鋌幾得馬千匹云生羌木波諸部蕃族人戶畜牧甚廣蓋前所遣官或抑其直或以勢陵奪遂失其和且常患銀少所以不能多得也又聞蕃地今秋薄收鬻馬得銀輒以易粟冬春之交必艱食馬價甚低乞令所司輦銀粟于洮河等州選委知蕃情達時變如桓端者貿易之若捐銀萬兩可得良馬千匹機會不可失惟朝廷亟圖之又曰比者沿邊戰士有功朝廷遣使宣諭賜以官賞莫不感戴聖恩願出死力此誠得激勸之方也然贈遺使者或馬或金習以為常臣所未諭也大定間嘗立送宣禮自五品以上各有定數後竟停罷況今時務與昔不同而六品以下及止遷散官者亦不免饋獻或莫能辦則斂所部以應之至有因而獲罪者彼軍士效死立功僅蒙恩賞而反以饋獻為苦是豈朝廷之意哉乞令有司依大定例參以時務明立等夷使取豫有限無傷大體則上下兩得矣又曰近聞保舉縣令特增其俸此朝廷為民之善意也然自關以西尚未有到任者遠方之民不能無望豈舉者猶寡而有所不敷耶乞詔內外職事官益廣選舉以補其闕使天下均受其賜且丞簿尉亦皆親民而獨不增俸彼既不足以自給安能禁其侵牟乎或謂國用方闕不宜虛費是大不然夫重吏祿者固使之不擾民也民安則國定豈為虛費誠能裁減冗食不養無用之人亦何患乎不足今一軍充役舉家廪給軍既物故給其子弟感悅士心為國盡力耳至於無男丁而其妻女猶給之此何謂耶自大駕南巡存贍者已數年張頤待哺以困農民國家糧儲常患不及顧乃久養此老幼數千萬口冗食虛費正在是耳如即罷之恐其失所宜限以歲月使自為計至期而罷復將何辭上多採納焉元光元年正月遷保大軍節度使兼鄜州管內觀察使二月改靜難軍節度使兼邠州管內觀察使未幾致仕哀宗即位徵用舊人起為尚書左丞言事稍不及前人望頗減尋復致仕家居惟以抄書教子孫為事葺園池汴城東築亭號靜隱時時與侯摯輩游詠其間正大八年二月乙丑薨于嵩山崇福宮年六十有九初遊嵩山嘗曰吾意欲主此山果終于此為人純正真率不事修飾雖兩登相位殆若無官然遇事輒發無所畏避每奏事上前旁人為動色行信處之坦如也及薨之日雖平昔甚媢忌者亦曰正人亡矣初至汴父暐以御史大夫致仕猶康健兄行簡為翰林學士承旨行信為禮部尚書諸子姪多中第居官當世未之有也贊曰高汝礪禔身清慎練達事宜久居相位雖為大夫士所鄙而人主寵遇不衰張行信礪志謇諤言無避忌然一簉政塗便多坎壈及其再用論事稍不及前豈以汝礪為真可法耶宣宗伐宋本非萬全之策行信諫汝礪不諫又沮和議胡沙虎之惡未著行信兩疏擊之汝礪與高琪共事人疑其黨附優劣可概見於斯矣
