body:
  text: 金史卷六本紀第六世宗上世宗光天興運文德武功聖明仁孝皇帝諱雍本諱烏祿太祖孫睿宗子也母曰貞懿皇后李氏天輔七年癸卯歲生于上京體貌奇偉美鬚髯長過其腹胸間有七子如北斗形性仁孝沉靜明達善騎射國人推為第一每出獵耆老皆隨而觀之皇統間以宗室子例授光祿大夫封葛王為兵部尚書天德初判會寧牧明年判大宗正事改中京留守俄改燕京未幾為濟南尹貞元初為西京留守三年改東京進封趙王正隆二年例降封鄭國公進封衛國三年再任留守徙封曹國六年五月居貞懿皇后喪一日方寢有紅光照室及黃龍見寢室上又嘗夜有大星流入留守第中是歲東梁水漲溢暴至城下水與城等決女牆石罅中流入城湍激如涌城中人惶駭上親登城舉酒酹之水退海陵南伐天下騷動是時籍契丹部人丁壯為兵部人不願行以告使者使者燥合畏海陵不以告部人遂反至是咸平府謀克括里攻陷韓州據咸平將犯東京八月起復東京留守婆速路兵四百來會討括里復得城中子弟願為兵者數百人帝舅興中少尹李石以病免家居遼陽戊午發東京以石主留務賊覘者聞鼙鼓聲震天見旌旗蔽野傳言國公兵十萬且至賊衆至瀋州遁去會烏延查剌等敗賊兵還至常安縣海陵使婆速路總管完顏謀衍來討賊以兵屬之九月至東京副留守高存福其女在海陵後宮海陵使存福伺起居適以造兵器餘材造甲數十存福宣言留守何為造甲密使人以白海陵遂與推官李彥隆託為擊毬謀不利存福家人以其謀來告平定知軍李蒲速越亦言其事海陵嘗聞上有疾即使近習來觀動靜至是又使謀良虎圖淮北諸王上知之心常隱憂及討括里還至清河遇故吏六斤乘傳自南來具言海陵殺其母殺兄子檀奴阿里白及樞密使僕散忽土等又曰且遣人來害宗室兄弟矣上聞之益懼及聞存福圖己事且有迹李石勸上早圖之於是以議備賊事召官屬會清安寺彥隆先到存福纍召始來並於座上執之是月復有雲來自西黃龍見雲中十月辛丑南征萬戶完顏福壽高忠建盧萬家奴等自山東率所領兵二萬完顏謀衍自常安率兵五千皆來附謀衍即以臣禮上謁乙巳諸軍入城共擊殺存福等是夜諸軍被甲環衛皇城丙午慶雲見官屬諸軍勸進固讓良久於是親告于太祖廟還御宣政殿即皇帝位以完顏謀衍為右副元帥高忠建元帥左監軍完顏福壽右監軍盧萬家奴顯德軍節度使丁未大赦改元大定下詔暴揚海陵罪惡數十事己酉饗將士賜官賞各有差仍給復三年會寧胡里改速頻等路南伐諸軍會尚書省奏請以從軍來者補諸局司承應人及官吏闕員上曰舊人南征者即還何以處之必不可闕者量用新人可也辛亥以利涉軍節度使獨吉義為參知政事中都留守西北面行營都統完顏彀英將兵三萬駐歸化以為左副元帥丁巳出內府金銀器物贍軍吏民出財物佐官用者甚衆壬戌以前臨潢尹晏為左丞相癸亥詔諭南京太傅尚書令張浩甲子興平軍節度使張玄素上謁尚書省奏正隆軍興之餘進錢粟者宜量授以官從之詔遣移剌札八招契丹諸部為亂者以前肇州防禦使神土悶為元帥右都監十一月己巳朔以左丞相晏兼都元帥辛未以戶部尚書李石為參知政事己卯詔調民間馬充軍用事畢還主死者給價阿瑣璋殺同知中都留守事沙離只阿瑣自稱中都留守璋自稱同知留守事使石家奴等來上表賀辛巳以如中都期日詔羣臣壬午詔中都都轉運使左淵曰凡宮殿張設毋得增置無役一夫以擾百姓但謹圍禁嚴出入而已以尚書右司員外郎完顏兀古出為詔諭高麗使癸未遣權元帥左都監吾札忽右都監神土悶廣寧尹僕散渾坦討契丹諸部甲申追尊皇考豳王為皇帝諡簡肅廟號睿宗皇妣蒲察氏曰欽慈皇后李氏曰貞懿皇后羣臣上尊號曰仁明聖孝皇帝乙酉追復東昏王帝號諡武靈廟號閔宗詔中外封子實魯剌為許王胡土瓦為楚王戊子辭謁太祖廟及貞懿皇后園陵己丑如中都次小遼口使中都留守宗憲先往壬辰次梁魚務樞密副使北面行營都統白彥敬南京留守北面行營副統紇石烈志寧以所統軍數來上安武軍節度使爽來歸乙未完顏元宜等弒海陵於揚州丙申次義州丁酉宋人破陝州防禦使折可直降同知防禦使事李柔立死之十二月乙卯次三河縣左副元帥完顏彀英來朝丙辰次通州延安尹唐括德溫來朝丁巳至中都戊午謁太祖廟己未御貞元殿受羣臣朝庚申以元帥左監軍高忠建等為報諭宋國使壬戌詔軍士自東京扈從至京師者復三年同知河間尹高昌福上書陳便宜上覽之再三詔內外大小職官陳便宜丙寅詔左副元帥完顏彀英規措南邊及陝西等路事二年正月戊辰朔日有食之伐鼓用幣上徹樂減膳不視朝庚午上謂宰相曰進賢退不肖宰相之職也有才能高於己者或懼其分權往往不肯引置同列朕甚不取卿等毋以此為心以前翰林學士承旨致仕翟永固為尚書左丞濟南尹僕散忠義為右丞都統斜哥副統完顏布輝坐擅易置中都官吏斜哥除名布輝削兩階罷之辛未御太和殿宴百官宗戚命婦賜賚有差壬申敕御史臺檢察六部文移稽而不行行而失當皆舉劾之甲戌除迎賽神佛禁令乙亥如大房山丙子獻享山陵禮畢欲獵而還左丞相晏等諫曰邊事未寧不宜遊幸戊寅還宮因諭晏等曰朕常慕古之帝王虛心受諫卿等有言即言毋緘默以自便辛巳以兵部尚書可喜等謀反伏誅詔中外是日賜扈從猛安謀克甲士下至阿里喜有差遣左副點檢蒲察阿孛罕等賞賚河南將士以前勸農使移剌元宜為御史大夫詔前工部尚書蘇保衡太子少保高思廉振賜山東百姓粟帛無妻者具姓名以聞庚寅行納粟補官法遣右副元帥完顏謀衍率師討蕭窩斡壬辰上謂宰執曰朕即位未半年可行之事甚多近日全無敷奏朕深居九重正賴卿等贊襄各思所長以聞朕豈有倦怠癸巳太白晝見甲午上謂宰執曰卿等當參民間利害及時事之可否以時敷奏不可公餘輒從自便優遊而已命河北山東陝西等路征南步軍並放還家咸平濟州軍二萬入屯京師丙申以西南路招討使完顏思敬兵部尚書阿鄰督北邊將士二月己亥前翰林待制大穎以言盜賊忤海陵杖而除名起為祕書丞補闕馬欽以諂事海陵得幸除名庚子詔前戶部尚書梁銶戶部郎中耶律道安撫山東百姓招諭盜賊或避賊及避徭役在他所者並令歸業及時農種無問罪名輕重並與原免壬寅太傅尚書令張浩來見癸卯以上初即位遣遼陽主簿石抹移迭東京麴院都監移剌葛補招契丹叛人為白彥敬紇石烈志寧所害並贈鎮國上將軍令其家各食五品俸仍收録其子甲辰以張浩為太師尚書令如故御史大夫移剌元宜為平章政事辛亥定世襲猛安謀克遷授格壬子以太保左領軍大都督奔睹為都元帥太保如故癸丑詔降蕭玉敬嗣暉許霖等官放歸田里甲寅復用進士為尚書省令史丙辰嵩州刺史石抹术突剌等敗宋兵於壽安縣丁巳鄭州防禦使蒲察世傑取陝州甲子詔都元帥奔睹開府山東經略邊事澤州刺史特末哥及其妻高福娘伏誅閏月甲戌上謂宰臣曰比聞外議言奏事甚難朕於可行者未嘗不從自今敷奏勿有所隱朕固樂聞之戊子上謂宰臣曰臣民上書者多敕尚書省詳閲而不即具奏天下將謂朕徒受其言而不行也其亟條具以聞庚寅詔平章政事移剌元宜泰州路規措邊事辛卯太和厚德殿火乙未尚書兵部侍郎溫敦术突剌等與窩斡戰敗于勝州三月癸卯參知政事獨吉義罷元帥左都監徒單合喜敗宋將吳璘于德順州甲辰追削李通官職乙巳免南京正隆丁夫貸役錢辛亥以廉平誡諭中外官吏癸亥詔河南陝西山東昨因捕賊良民被虜為賊者釐正之四月己巳右副元帥完顏謀衍等敗窩斡于長濼辛未降廢帝亮為海陵郡王乙亥詔減御膳及宮中食物之半夏國遣使來賀即位及進方物及賀萬春節右副元帥完顏謀衍復敗窩斡於霿河辛巳宴夏使貞元殿故事外國使三節人從皆坐廡下賜食上察其食不精腆曰何以服遠人之心掌食官皆杖六十癸未夏使朝辭乞互市從之己丑以左丞相晏為太尉壬辰詔征契丹部將士曰應契丹與大軍未戰而降者不得殺傷仍安撫之後招誘來降者除奴婢以已虜為定其親屬使各還其家仍官為贖之五月丁酉朔以曷速館節度使白彥敬為御史大夫戊戌遣元帥左監軍高忠建會北征將帥討契丹己亥以臨海軍節度使紇石烈志寧為元帥右監軍右副元帥完顏謀衍元帥右監軍完顏福壽坐逗遛召還京師皆罷之壬寅立楚王允迪為皇太子詔中外丁巳押軍萬戶裴滿按剌猛安移剌沙里剌敗宋兵于華州六月戊辰命御史大夫白彥敬西北路市馬庚午以尚書右丞僕散忠義為平章政事兼右副元帥經略契丹詔出內府金銀給征契丹軍用戊寅詔居庸關古北口譏察契丹姦細捕獲者加官賞己卯詔守禦古北口及石門關庚辰宋遣使賀即位壬午右副元帥僕散忠義與窩斡戰于花道戊子以南京留守紇石烈良弼為尚書右丞庚寅右副元帥僕散忠義大敗窩斡于裊嶺西陷泉獲其弟裊壬辰以西南路招討使完顏思敬為元帥右都監七月丁酉復取原州丙午宋主傳位于子甲寅詔諭契丹丁巳速頻軍士术里古等誣完顏謀衍子斜哥寄書其父謀反並以其書上之上覽書曰此誣也止訊告者訊之果誣也术里古伏誅庚申太尉尚書左丞相晏致仕壬戌詔發濟州會寧府軍在京師者以五千人赴北京都統府陝西都統璋敗宋將吳璘于張義堡八月乙丑朔奚抹白謀克徐列等降左監軍高忠建破奚于栲栳山及招降旁近奚六營有不降者攻破之盡殺其男子以其婦女童孺分給諸軍丁卯永興縣進嘉禾壬申萬戶溫迪罕阿魯帶與奚戰于古北口敗焉詔同判大宗正事完顏謀衍等禦之癸酉上謂宰臣曰百姓上書陳時政其言猶有所補卿等位居機要略無獻替可乎夫聽斷獄訟簿書期會何人不能唐虞之聖猶務兼覽博照乃能成治正隆專任獨見故取敗亡朕早夜孜孜冀聞讜論卿等宜體朕意詔百司官吏凡上書言事或為有司所抑許進表以聞朕將親覽以觀人材優劣夏國遣使賀尊號丁丑免齊國妃韓王亨樞密忽土留守賾等家親屬在宮籍者詔元帥右都監完顏思敬以所部軍與大軍會討窩斡乙酉詔左諫議大夫石琚監察御史馮仲尹廉察河北東路丁亥詔御史臺曰卿等所劾惟諸局行移稽緩及緩於赴局者耳此細事也自三公以下官僚善惡邪正當審察之若止理細務而略其大者將治卿等罪矣契丹老和尚降辛卯罷諸關征稅九月甲午朔完顏謀衍擒奚猛安合住元帥左都監徒單合喜大敗宋將吳璘于德順州乙未詔尚書右丞紇石烈良弼以便宜招撫奚契丹之叛者庚子元帥右都監完顏思敬獲契丹窩斡餘衆悉平以尚書左司員外郎完顏正臣為夏國生日使壬寅獵近郊乙巳以移剌窩斡平詔中外庚戌改葬睿宗皇帝壬子以元帥右都監完顏思敬為右副元帥戊午詔思敬經略南邊辛酉奉遷睿宗皇帝梓宮于磐寧宮癸亥元帥左監軍徒單合喜等敗宋兵于德順州河南統軍使宗尹復取汝州十月丁卯以左副元帥完顏彀英為平章政事戊辰如山陵謁睿宗皇帝梓宮哭盡哀平章政事右副元帥僕散忠義等還自軍上謁丙戌以僕散忠義為尚書右丞相元帥左監軍紇石烈志寧為左副元帥戊子葬睿宗皇帝于景陵大赦己丑詔左副元帥紇石烈志寧經略南邊壬辰華州防禦使蒲察世傑丹州刺史赤盞胡速魯改敗宋兵于德順州十一月癸巳朔詔右丞相僕散忠義伐宋丁酉第職官廉能樜濫不職各為三等而黜陟之十二月乙酉遣尚書刑部侍郎劉仲淵等廉察宣諭東京北京等路三年正月壬辰朔高麗夏遣使來賀庚子太白晝見壬子遣客省使烏居仁賞勞河南軍士癸丑復取德順州二月甲子詔太子少詹事楊伯雄等廉問山西路庚午上謂宰相曰灤州飢民流散逐食甚可矜恤移於山西富民贍濟仍于道路計口給食壬申詔撫諭陝西庚辰太保都元帥奔睹薨丙戌趙景元等以亂言伏誅庚寅高麗夏遣使來賀萬春節高麗遣使賀即位東京僧法通以妖術亂衆都統府討平之三月丙申中都以南八路蝗詔尚書省遣官捕之壬寅詔戶部侍郎魏子平等九人分詣諸路猛安謀克勸農及廉問詔臨潢漢民逐食於會寧府濟信等州庚戌詔免去年租稅四月辛酉朔右副元帥完顏思敬罷丁卯平章政事完顏彀英御史大夫白彥敬罷以參知政事李石為御史大夫丁丑詔吏犯贓罪雖會赦不己卯以引進使韓綱為橫賜高麗使乙酉賑山西路猛安謀克貧民給六十日糧是月取商虢環州宋所侵一十六州至是皆復五月辛卯朔右丞相僕散忠義朝京師乙未以重五幸廣樂園射柳命皇太子親王百官皆射勝者賜物有差上復御常武殿賜宴擊毬自是歲以為常丙申宋人攻破靈璧虹縣己亥罷河南山東陝西統軍司置都統副統以太子詹事完顏守道從皇太子上召諭守道曰卿任執政所責非輕自今毋從行辛丑以右丞相僕散忠義兼都元帥癸卯僕散忠義還軍河南路都統奚撻不也叛入于宋丙午宋人攻破宿州辛亥更定出征軍逃亡法尚書省請籍天德間被誅大臣諸奴隸及從窩斡亂者為軍上以四方甫定民意稍蘇而簽軍非長策不聽癸丑詔諭契丹餘黨蒲速越等如能自新並釋其罪若執蒲速越父子以來者仍官賞之左副元帥紇石烈志寧復取宿州河南副統孛术魯定方死于陳乙卯以北京留守完顏思敬復為右副元帥中都蝗詔參知政事完顏守道按問大興府捕蝗官六月庚申朔日有食之以刑部尚書蘇保衡為參知政事丙子詔曰正隆之末濟州路逃回軍士為中都官軍所邀殺者官為收葬己卯觀稼于近郊甲申太師尚書令張浩罷以宿直將軍阿勒根和衍為橫賜夏國使七月庚戌太白晝見以太子太師宗憲為平章政事以孔總為襲封衍聖公八月丙寅太白經天庚午詔曰祖宗時有勞效未曾遷賞者五品以上聞奏六品以下及無職事者尚書省約量升除甲戌詔參知政事完顏守道招撫契丹餘黨戊寅詔罷契丹猛安謀克其戶分隸女直猛安謀克命諸官員年老者許存馬一二匹餘並括買入官敕殿前都點檢唐括德溫重九出獵國朝舊俗今扈從軍二千能無擾民可嚴為約束仍以錢萬貫分賜之乙酉如大房山丁亥薦享于睿陵戊子還宮九月癸巳以宿直將軍僕散習尼列為夏國生日使丁酉秋獵以重九拜天于北郊丙午詔翰林待制劉仲誨等廉問車駕所經州縣乙卯還宮十月甲子大享于太廟丙寅以許王府長史移剌天佛留為高麗生日使癸酉冬獵十一月庚寅太白晝見經天壬辰還都戊申詔求仕官輒入權要之門追一官仍降除以請求有所饋獻及受之者具狀奏裁庚戌百官請上尊號不允詔中都平州及飢荒地並經契丹剽掠有質賣妻子者官為收贖壬子尚書左丞翟永固罷癸丑罷貢金線段匹甲寅以尚書右丞紇石烈良弼為左丞吏部尚書石琚為參知政事十二月丁丑臘獵于近郊以所獲薦山陵自是歲以為常詔流民未復業增限招誘己卯參知政事蘇保衡至自軍辛巳以為尚書右丞四年正月丁亥朔高麗夏遣使來賀戊子罷路府州元日及萬春節貢獻上謂侍臣曰秦王宗翰有功於國何乃無嗣皆未知所對上曰朕嘗聞宗翰在西京坑殺丐者千人得非其報耶癸巳百官復請上尊號不允丁酉如安州春水壬寅至安州大雪詔扈從人舍民家者人日支錢一百與其主甲辰元帥府言宋遣審議官胡昉致尚書右僕射書來議和好以其言失信拘昉軍中以書答之及以書進上覽之曰宋之失信行人何罪當即遣還邊事令元帥府從宜措畫乙巳尚書省奏徐州民曹圭討賊江志而子弼亦在賊中並殺之法當補二官雜班上以所奏未當進一官正班用之辛亥獲頭鵝遣使薦山陵自是歲以為常二月丁巳免安州今年賦役及保塞縣御城邊吳二村凡扈從人嘗止其家者亦復一年辛酉獵于高陽之北庚午還都庚辰以北京粟價踴貴詔免今年課甲三月丙戌朔萬春節高麗夏遣使來賀詔免北京歲課段匹一年庚子京師地震壬寅百官復請上尊號不允四月丁巳平章政事完顏元宜罷甲戌出宮女二十一人五月旱癸卯敕有司審寃獄禁宮中音樂放毬場役夫乙巳詔禮部尚書王競禱雨于北嶽己酉命參知政事石琚等於北郊望祭禱雨壬子雨窩斡餘黨蒲速越伏誅六月甲寅朔日有食之壬戌尚書左丞紇石烈良弼至自征南元帥府甲子以雨足命有司祭謝嶽鎮海瀆于北郊己巳幸東宮視皇太子疾庚午初定祭五嶽四瀆禮辛未觀稼于近郊庚辰詔諭元帥府曰所請伐宋軍萬五千今以騎三千步四千赴之詔陝西元帥府議入蜀利害以聞七月壬辰故衛王襄妃及其子和尚以妖妄伏誅庚子以尚書左丞紇石烈良弼為平章政事辛丑大風雷雨拔木八月甲寅朔詔征南元帥府曰前所請收復舊疆乞候秋涼進發今已秋涼復俟何時戊午以參知政事完顏守道為尚書左丞大興尹唐括安禮為參知政事壬申上謂宰臣曰卿每奏皆常事凡治國安民及朝政不便於民者未嘗及也如此則宰相之任誰不能之己卯如大房山辛巳致祭于山陵九月癸未朔還都乙酉上謂宰臣曰形勢之家親識訴訟請屬道達官吏往往屈法徇情宜一切禁止己丑上謂宰臣曰北京懿州臨潢等路嘗經契丹寇掠平薊二州近復蝗旱百姓艱食父母兄弟不能相保多冒鬻為奴朕甚閔之可速遣使閲實其數出內庫物贖之乙未幸鷹房主者以鷹隼置內省堂上上怒曰此宰相聽事豈置鷹隼處耶痛責其人俾置他所己亥以宿直將軍烏里雅為夏國生日使辛亥以太子少詹事烏古論三合為高麗生日使十月癸丑朔獵于密雲縣丙寅還都己卯命泰寧軍節度使張弘信等二十四人分路通檢諸路物力十一月乙酉征南都統徒單克寧敗宋兵取楚州己丑封子永功為鄭王辛卯冬獵乙未詔進師伐宋戊戌次河間府辛丑尚書省火甲辰次清州閏月壬子朔還都十二月丁亥尚書省奏都統高景山取商州己丑臘獵于近郊辛卯太白晝見經天是歲大有年斷死罪十有七人五年正月辛亥朔高麗夏遣使來賀乙卯詔泰州臨潢接境設邊堡七十駐兵萬三千己未宋通問使魏嵵等以國書來書不稱大稱姪宋皇帝稱名再拜奉書于叔大金皇帝歲幣二十萬辛未詔中外復命有司旱蝗水溢之處與免租賦癸酉命元帥府諸新舊軍以六萬人留戍餘並放還以宋國歲幣悉賞諸軍二月壬午以左副都點檢完顏仲等為宋報問使壬寅罷納粟補官令戊申萬春節宋高麗夏遣使來賀三月壬申羣臣奉上尊號曰應天興祚仁德聖孝皇帝詔中外四月癸卯西京留守壽王京謀反獄成特免死杖之除名嵐州安置乙巳右副元帥完顏思敬罷丁未右丞相都元帥僕散忠義還自軍五月壬子左副元帥紇石烈志寧以召入見丁巳以僕散忠義為尚書左丞相紇石烈志寧為平章政事還軍乙丑以平章政事宗憲為尚書右丞相癸酉罷山東路都統府以其軍各隸總管府六月甲辰芝産大安殿柱丙午京師地震雨毛七月戊申朔京師地復震罷陝西都統府復置統軍司京兆徙陝西元帥府河中八月己卯前宿州防禦使烏林答剌撒以與宋李世輔交通伏誅癸巳宋夏遣使賀尊號九月丁未朔以吏部尚書高衎等為賀宋生日使戊申秋獵庚戌以宿直將軍术虎蒲查為夏國生日使甲戌還都十月丁丑朔地震辛巳以大宗正丞璋為高麗生日使乙未冬獵辛丑還都十一月丙午朔上謂宰臣曰朕在位日淺未能遍識臣下賢否全賴卿等盡公舉薦今六品以下殊乏人材何以副朕求賢之意癸丑幸東宮戊午以右副都點檢烏古論粘沒曷為賀宋正旦使癸亥立諸路通檢地土等第稅法癸酉大霧晝晦十二月己丑獵于近郊高麗遣使賀尊號六年正月丙午朔宋高麗夏遣使來賀庚午敕有司宮中張設毋以塗金為飾二月丁亥尚書左丞相兼都元帥沂國公僕散忠義薨壬寅萬春節宋高麗夏遣使來賀三月甲寅上如西京庚申次歸化州西京留守唐括德溫上謁戊辰至西京庚午朝謁太祖廟壬申擊毬百姓縱觀四月甲戌朔詔月朔禁屠宰戊戌以尚書右司郎中移剌道為橫賜高麗使宿直將軍斜卯摑剌為橫賜夏國使辛丑太白晝見五月戊申幸華嚴寺觀故遼諸帝銅像詔主僧謹視之壬子詔雲中大同縣及警巡院給復一年壬戌詔將幸銀山諸扈從軍士賜錢五萬貫有敢損苗稼者並償之六月辛巳太白晝見經天丙戌發自西京庚子獵于銀山七月辛酉次三叉口八月辛未朔次涼陘庚辰獵于望雲之南山九月辛丑朔至自西京丁未以戶部尚書魏子平為賀宋生日使辛亥以翰林待制移剌熙載為夏國生日使澤州刺史劉德裕等以盜用官錢伏誅壬子太白晝見癸丑尚書右丞相宗憲薨丙辰太白晝見經天十月己卯以尚書兵部侍郎移剌按答為高麗生日使甲申朝享于太廟詔免雄莫等州今年租壬辰太白晝見經天丁酉如安肅州冬獵十一月丙午還都癸丑以右副都點檢烏古論元忠為賀宋正旦使上謂宰臣曰朝官當慎選其人庶可激勵其餘若不當則啓覬覦之心卿等必知人才優劣舉實才用之庚申太白晝見經天丁卯參知政事石琚以母憂罷十二月甲戌詔有司每月朔望及上七日毋奏刑名戊子太白晝見經天甲午泰州民合住謀反伏誅丙申以平章政事紇石烈良弼為尚書右丞相紇石烈志寧為樞密使七年正月庚子朔宋高麗夏遣使來賀辛亥石琚起復參知政事壬子上服袞冕御大安殿受尊號册寶禮癸丑大赦庚申以元帥左監軍徒單合喜為樞密副使二月庚寅尚書右丞蘇保衡薨丙申以參知政事石琚為尚書右丞三月己亥朔萬春節宋高麗夏遣使來賀四月戊辰朔日有食之壬辰以御史大夫李石為司徒大夫如故五月丙午大興府獄空詔賜錢三百貫為宴樂之用以勞之甲寅以北京留守耨碗溫敦兀帶為參知政事六月癸酉命地衣用龍文者罷之七月戊申禁服用金線其織賣者皆抵罪丙辰幸東宮己未幸東宮視皇太子疾閏月丁卯觀稼于近郊戊辰許王永中進封越王鄭王永功封隨王永成封瀋王甲戌詔遣祕書監移剌子敬經略北邊戊寅幸東宮己卯慶雲環日壬午觀稼于近郊戊子觀稼于北郊八月辛亥慶雲環日癸丑尚書右丞相監修國史紇石烈良弼進太宗實録上立受之己未如大房山壬戌致祭睿陵九月乙丑朔還宮己巳右三部檢法官韓贊以捕蝗受賂除名詔吏人但犯贓罪雖會赦非特旨不以勸農使蒲察莎魯窩等為賀宋生日使辛未參知政事唐括安禮罷乙亥以宿直將軍唐括鶻魯為夏國生日使庚辰地震辛巳以都水監李衛國為高麗生日使乙酉秋獵庚寅次保州詔修起居注王天祺察訪所經過州縣官十月乙未朔上謂侍臣曰近聞朕所幸郡邑曾宴寢堂宇後皆避之此甚無謂可宣諭令仍舊居止戊申還都丁巳上謂宰臣曰海陵不辨人才優劣惟徇己欲多所升擢朕即位以來以此為戒止取實才用之近聞蠡州同知移剌延壽在官樜濫詢其出身乃正隆時鷹房子如鷹房人之類可典城牧民耶自今如此局分不得授以臨民職任以御史中丞孟浩為參知政事是日參知政事耨碗溫敦兀帶薨辛酉敕有司於東宮涼樓前增建殿位孟浩諫曰皇太子雖為儲二宜示以儉德不當與至尊宮室相侔乃罷之十一月乙丑朔上謂宰臣曰聞縣令多非其人其令吏部察其善惡明加黜陟辛未以河間尹徒單克寧等為賀宋正旦使壬申太白晝見丁丑歲星晝見丁亥樞密副使徒單合喜罷十二月戊戌東京留守徒單合喜北京留守完顏謀衍肇州防禦使蒲察通朝辭賜通金帶諭之曰卿雖有才然用心多詐朕左右須忠實人故命卿補外賜卿金帶者答卿服勞之久也又顧謂左宣徽使敬嗣輝曰如卿不可謂無才所欠者純實耳甲辰以北京留守完顏思敬為平章政事是歲斷死囚二十人八年正月甲子朔宋高麗夏遣使來賀乙丑上謂宰臣曰朕治天下方與卿等共之事有不可各當面陳以輔朕之不逮慎毋阿順取容卿等致位公相正行道揚名之時苟或偷安自便雖為今日之幸後世以為何如羣臣皆稱萬歲辛未謂祕書監移剌子敬等曰昔唐虞之時未有華飾漢惟孝文務為純儉朕於宮室惟恐過度其或興修即損宮人歲費以充之今亦不復營建矣如宴飲之事近惟太子生日及歲元嘗飲酒往者亦止上元中秋飲之亦未嘗至醉至於佛法尤所未信梁武帝為同泰寺奴遼道宗以民戶賜寺僧復加以三公之官其惑深矣庚辰行皇太子册禮二月甲午朔制子為改嫁母服喪三年上諭左宣徽使敬嗣輝曰凡為人臣上欲要君之恩下欲干民之譽必虧忠節卿宜戒之三月癸亥朔萬春節宋高麗夏遣使來賀己巳命以職官子補令史丁丑命護衛親軍百戶五十戶非直日不得帶刀入宮己丑太白晝見四月丙午詔曰馬者軍旅所用牛者農耕之資殺牛有禁馬亦何殊其令禁之戊申擊毬常武殿司天馬貴中諫曰陛下為天下主繫社稷之重又春秋高圍獵擊毬危事也宜悉罷之上曰朕以示習武耳五月甲子北望淀大震風雨雹廣十里長六十里詔戶工兩部自今宮中之飾並勿用黃金乙丑上如涼陘丁卯歲星晝見庚寅改旺國崖曰靜寧山曷里滸東川曰金蓮川六月河決李固渡水入曹州七月甲子制盜羣牧馬者死告者給錢三百貫戊辰上謂平章政事完顏思敬等曰朕思得賢士寤寐不忘自今朝臣出外即令體訪外任職官廉能者及草萊之士可以助治者具姓名以聞甲戌秋獵己卯次三叉口上諭點檢司曰沿路禾稼甚佳其扈從人少有蹂踐則當汝罪八月乙卯至自涼陘九月辛酉上諭尚書右丞石琚參政孟浩曰聞蔚州採地菌役夫數百千人朕所用幾何而擾動如此自今差役凡稱御前者皆須稟奏仍令附册癸亥以右宣徽使移剌神獨斡等為賀宋生日使己巳以引進使高希甫為夏國生日使庚午上幸東宮癸酉上諭宰臣曰卿等舉用人材凡己所知識必使他人舉奏朕甚不喜如其果賢何必以親疏為避忌也以戶部尚書魏子平為參知政事辛巳上謂御史大夫李石曰臺憲固在分別邪正然內外百司豈謂無人惟見卿等劾人之罪不聞舉善自今宜令監察御史分路刺舉善惡以聞上嘗命左衛將軍大磐訪求良弓而磐多自取護衛婁室以告上命點檢司鞫磐磐妹為寶林磐屬內侍僧兒言之寶林寶林以聞命杖僧兒百出磐為隴州防禦使十月己丑朔以戒諭官吏貪墨詔中外乙未命涿州刺史兼提點山陵每以朔望致祭朔則用素望則用肉仍以明年正月為首及命圖畫功臣於太祖廟其未立碑者立之以翰林待制靖為高麗生日使上謂宰臣曰海陵時修起居注不任直臣故所書多不實可訪求得實詳而録之參政孟浩進曰良史直筆君舉必書自古帝王不自觀史意正在此辛亥詔罷復州歲貢鹿筋十一月乙丑幸東宮以同簽大宗正事闢合土等為賀宋正旦使十二月戊子朔遣武定軍節度使移剌按等招諭阻九年正月戊午朔宋高麗夏遣使來賀辛酉上與宣徽使敬嗣暉祕書監移剌子敬論古今事因曰亡遼日屠食羊三百亦豈能盡用徒傷生耳朕雖處至尊每當食常思貧民飢餒猶在己也彼身為惡而口祈福何益之有如海陵以張仲軻為諫議大夫何以得聞忠言朕與大臣論議一事非正不言卿等不以正對豈人臣之道也庚午詔諸州縣和糴毋得抑配百姓戊寅契丹外失剌等謀叛伏誅丙戌制漢人渤海兄弟之妻服闋歸宗以禮續婚者聽二月庚寅制妄言邊關兵馬者徒二年丙申詔改葬漢二燕王於城東庚子以中都等路水免稅詔中外又以曹單二州被水尤甚給復一年甲寅詔女直人與諸色人公事相關只就女直理問三月丁巳朔萬春節宋高麗夏遣使來賀丁卯以尚書省定網捕走獸法或至徒上曰以禽獸之故而抵民以徒是重禽獸而輕民命也豈朕意哉自今有犯可杖而釋之詔御史中丞移剌道廉問山東河南辛未禁民間稱言銷金條理內舊有者改作明金字辛巳以大名路諸猛安民戶艱食遣使發倉釰減價出之四月己丑謂宰臣曰朕觀在位之臣初入仕時競求聲譽以取爵位亦既顯達即徇默苟容為自安計朕甚不取宜宣諭百官使知朕意癸巳遣翰林修撰蒲察兀虎監察御史完顏鶻沙分詣河北西路大名河南山東等路勸猛安謀克農五月丙辰朔以符寶郎徒單懷貞為橫賜高麗使宿直將軍完顏賽也為橫賜夏國使戊辰尚書省奏越王永中隋王永功二府有所興造發役夫上曰朕見宮中竹有枯瘁者欲令更植恐勞人而止二王府各有引從人力又奴婢甚多何得更役百姓爾等但以例為請海陵橫役無度可盡為例耶自今在都浮役久為例者仍舊餘並官給傭直重者奏聞六月庚寅冀州張和等反伏誅戊戌以久旱命宮中毋用扇庚子雨七月乙卯朔罷東北路採珠壬申觀稼于近郊八月甲申朔有司奏日食以雨不見伐鼓用幣如常禮九月甲寅朔以刑部尚書高德基等為賀宋生日使宿直將軍僕散守中為夏國生日使提點司天臺馬貴中為高麗生日使罷皇太子月料歲給錢五萬貫上謂臺臣曰比聞朝官內有攬中官物以規貨利者汝何不言皆對曰不知上曰朕尚知之汝有不知者乎朕若舉行汝將安用壬戌秋獵十月丁亥還都辛丑以尚書右丞相紇石烈良弼為左丞相樞密使紇石烈志寧為右丞相詔宗廟之祭以鹿代牛著為令丙午大享于太廟辛亥以平章政事完顏思敬為樞密使十一月己未以尚書左丞完顏守道為平章政事右丞石琚為左丞參知政事孟浩為右丞庚申上幸東宮辛酉以京兆尹毅等為賀宋正旦使壬戌冬獵丙子還都十二月丙戌詔賑臨潢泰州山東東路河北東路諸猛安民以東京留守徒單合喜為平章政事丁酉太白晝見辛丑獵于近郊丙午制職官犯公罪在官已承伏者雖去官猶論十年正月壬子朔宋高麗夏遣使來賀甲子命宮中元宵無得張燈甲戌以司徒御史大夫李石為太尉尚書令二月甲午安化軍節度使徒單子溫副使老君奴以贓罪伏誅戊申上謂近臣曰護衛以後皆是治民之官其令教以讀書三月壬子朔萬春節宋高麗夏遣使來賀丙辰上因命護衛中善射者押賜宋使射弓宴宋使中五十押宴者才中其七謂左右將軍曰護衛十年出為五品職官每三日上直役亦輕矣豈徒令飽食安臥而已弓矢不習將焉用之戊午以河南統軍使宗為參知政事庚午上謂參政宗曰卿昨為河南統軍時言黃河堤掃利害甚合朕意朕每念百姓差調官吏互為姦弊不早計料臨期星火率斂所費倍蓰為害非細卿既參朝政皆當革弊擇利行之又諭左丞石琚曰女直人徑居達要不知閭閻疾苦汝等自丞簿至是民間何事不知凡有利害宜悉敷陳四月丁酉制命婦犯姦不用夫廕以子封者不拘此法五月乙卯如柳河川閏月庚辰夏國任得敬脅其主李仁孝使上表請中分其國上問宰臣李石石等以為事繫彼國不如許之上曰彼劫於權臣耳詔不許並却其貢物七月壬午秋獵戊戌放圍場役夫詔扈從糧食並從官給乙巳敕扈從人縱畜牧蹂踐禾稼者杖之仍償其直八月己未至自柳河川壬申遣參知政事宗北巡九月庚辰尚書左丞相紇石烈良弼丁憂起復如故壬午以簽書樞密院事移剌子敬為賀宋生日使庚寅以戶部郎中夾谷阿里補為夏國生日使十月己酉以大宗正丞辭為高麗生日使甲寅如霸州冬獵乙丑上謂大臣曰比因巡獵聞固安縣令高昌裔不職已令罷之霸州司候成奉先奉職謹恪可進一階除固安令辛未上謂宰臣曰朕凡論事有未能深究其利害者卿等宜悉心論列無為面從而退有後言十一月辛巳制盜太廟物者與盜宮中物論同甲申上幸東宮丁亥以太子詹事蒲察蒲速越等為賀宋正旦使癸巳夏國以誅任得敬遣使來謝詔慰諭之十二月丙寅上謂宰臣曰比體中不佳有妨朝事今觀所奏事皆依條格殊無一利國之事若一朝行一事歲計有餘則其利博矣朕居深宮豈能悉知外事卿等尤當注意十一年正月丙子朔宋夏遣使來賀丁丑封子永升為徐王永蹈為滕王永濟為薛王壬午詔職官年七十以上致仕者不拘官品並給俸祿之半丙申命賑南京屯田猛安被水災者戊戌尚書省奏汾陽軍節度副使牛信昌生日受饋獻法當奪官上曰朝廷行事苟不自正何以正天下尚書省樞密院生日節辰饋獻不少此而不問小官饋獻即加按劾豈正天下之道自今宰執樞密饋獻亦宜罷去上謂宰臣曰往歲清暑山西近路禾稼甚廣殆無畜牧之地因命五里外乃得耕墾今聞民皆去之他所甚可矜憫其令依舊耕種事有類此卿等宜即告朕三月乙亥朔萬春節宋夏遣使來賀辛巳命有司以天水郡公旅櫬依一品禮葬於鞏洛之原四月丁未歸德府民臧安兒謀反伏誅大理卿李昌圖以廉問真定尹徒單貞咸平尹石抹阿沒剌受贓不法既得罪狀不即黜罷杖之四十癸亥參知政事魏子平罷高麗國王晛弟晧廢其主自立詐稱讓國遣使以表來上五月辛卯詔遣吏部侍郎靖使高麗問故癸巳以南京留守移剌成為樞密副使六月己酉詔曰諸路常貢數內同州沙苑羊非急用徒勞民爾自今罷之朕居深宮勞民之事豈能盡知似此當具以聞戊午觀稼于近郊甲子平章政事徒單合喜薨七月甲申參知政事宗薨八月癸卯朔太白晝見詔朝臣曰朕嘗諭汝等國家利便治體遺闕皆可直言外路官民亦嘗言事汝等終無一語凡政事所行豈能皆當自今直言得失毋有所隱乙巳上謂宰臣曰隨朝之官自謂歷一考則當得某職兩考則當得某職第務因循碌碌而已自今以外路官與內除者察其公勤則升用之但苟簡於事不須任滿便以本品出之賞罰不明豈能勸勉庚戌詔曰應因窩斡被掠女直及諸色人未經刷放者官為贖放隱匿者以違制論其年幼不能稱説住貫者從便住坐上謂宰臣曰五品以下闕員甚多而難於得人三品以上朕則知之五品以下不能知也卿等曾無一言見舉者欲畫久安之計興百姓之利而無良輔佐所行皆尋常事耳雖日日視朝何益之有卿等宜勉思之己巳以尚書刑部侍郎烏林答天錫等為賀宋生日使近侍局使劉珫為夏國生日使九月癸未獵于橫山庚寅還都十月壬寅朔以左宣徽使敬嗣暉為參知政事甲寅上謂宰臣曰朕已行之事卿等以為成命不可復更但承順而已一無執奏且卿等凡有奏何嘗不從自今朕旨雖出宜審而行有未便者即奏改之或在下位有言尚書省所行未便亦當從而改之毋拒而不從丙寅尚書左丞相紇石烈良弼進睿宗實録戊辰上謂宰臣曰衍慶宮圖畫功臣已命增為二十人如丞相韓企先自本朝興國以來憲章法度多出其手至於關決大政但與大臣謀議終不使外人知覺漢人宰相前後無比若褒顯之亦足示勸慎無遺之十一月丁丑以西南路招討使宗寧等為賀宋正旦使戊寅幸東宮上謂皇太子曰吾兒在儲二之位朕為汝措天下當無復有經營之事汝惟無忘祖宗純厚之風以勤修道德為孝明信賞罰為治而已昔唐太宗謂其子高宗曰吾伐高麗不克終汝可繼之如此之事朕不以遺汝如遼之海濱王以國人愛其子嫉而殺之此何理也子為衆愛愈為美事所為若此安有不亡唐太宗有道之君而謂其子高宗曰爾於李績無恩今以事出之我死宜即授以僕射彼必致死力矣君人者焉用偽為受恩於父安有忘報於子者乎朕御臣下惟以誠實耳羣臣皆稱萬歲丙戌朝享于太廟丁亥有事于圓丘大赦癸巳羣臣奉上尊號曰應天興祚欽文廣武仁德聖孝皇帝乙未詔中外十二月癸卯冬獵乙卯還宮丙辰參知政事敬嗣暉薨辛酉進封越王永中趙王隨王永功曹王瀋王永成豳王徐王永升虞王滕王永蹈徐王薛王永濟滕王乙丑趙王永中曹王永功俱授猛安仍命永功親治事以習為政
