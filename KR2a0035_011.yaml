body:
  text: 金史卷十一本紀第十一章宗三三年春正月己亥朔日有食之辛丑宋夏遣使來賀癸卯諭有司凡館接伴並奉使者毋以語言相勝務存大體奉使者亦必得其人乃可乙卯詔罷講議所丙辰如城南春水丁巳並上京東京兩路提刑司為一提刑使副兼安撫使副安撫專掌教習武事毋令改其本俗己未以都南行宮名建春甲子至自春水乙丑宋主以祖母喪遣使告哀二月己巳朔幸建春宮辛巳諭宰臣曰自今內外官有闕有才能可任者雖資歷未及亦具以聞雖親故毋有所避以武衛軍都指揮使烏林答天益等為宋弔祭使甲申至自建春宮丙戌斜出內附辛卯平章政事粘割斡特剌薨三月戊戌以禮部尚書張暐為御史大夫壬寅復榷醋甲寅如萬寧宮丁巳敕隨處盜賊毋以強為竊以多為少以有為無嘯聚三十人以上奏聞違者杖百丙寅高麗王王晧以弟權國事遣使奉表來告夏四月戊辰朔諭有司宰相遇雨可循殿廡出入丙申諭御史臺曰隨朝大小官雖有才能率多苟簡朕甚惡之其察舉以聞提刑司所察廉能汙濫官皆當殿奏餘事可轉以聞以侍御史孫俁為宣問高麗王王晧使五月庚子右宣徽使張汝方以漏泄廷議削官兩階壬寅射柳擊毬縱百姓觀戊申以客省使移剌郁為夏國生日使甲子參知政事楊伯通表乞致仕不許秋七月丙午幸香山己酉如萬寧宮甲寅還宮八月辛未獵于近郊癸酉獵于香山戊寅如萬寧宮庚辰以護衛石和尚為押軍萬戶率親軍八百人武衛軍千六百人戍西北路癸未還宮宋遣使來報謝九月丙申朔天壽節宋夏遣使來賀以中都路都轉運使孫鐸等為賀宋生日使乙巳獵于近郊庚戌參知政事楊伯通再表乞致政不許戊午木波進馬冬十月庚午獵于近郊癸未行樞密院言斜出等請開榷場於轄里裊從之丁亥定官民存留見錢之數設回易務更立行用鈔法十一月丁酉樞密使兼平章政事襄至自軍癸卯以為尚書左丞相監修國史丁未以太常卿楊庭筠等為賀宋正旦使戊申詔奬諭樞密副使夾谷衡以下將士辛亥定屬託法定軍前官吏遷賞格以邊事定詔中外減死罪徒已下釋之賜左氶相襄以下將士金幣有差甲寅冬獵十二月甲子朔獵于酸棗林大風寒罷獵凍死者五百餘人己巳還都丙戌尚書右丞罷高麗權國事王遣使奉表來告四年春正月癸巳朔宋夏遣使來賀乙巳尚書左丞董師中致仕辛酉監察御史姬端修以妄言下吏尚書左氶相襄為司空職如故樞密副使夾谷衡為平章政事封英國公前知濟南府事張萬公起復為平章政事封壽國公楊伯通為尚書左丞簽樞密院事完顏匡為尚書右丞二月乙丑如建春宮春水己巳還宮庚午御宣華門觀迎佛辛未如建春宮赦姬端修罪令居家俟命司空襄言西南路招討使僕散揆治邊有功召赴闕以知興中府事紇石烈子仁代之壬申諭有司自三月一日為始每旬三品至五品官各一人轉對六品亦以次對臺諫勿與有應奏事與轉對官相見無面對者上章亦聽乙亥還宮戊寅如建春宮庚辰上諭點檢司曰自蒲河至長河及細河以東朕常所經行官為和買其地令百姓耕之仍免其租稅甲申還宮乙酉以西南路招討使僕散揆為參知政事起姬端修為太學博士如建春宮戊子還宮三月丁酉同判大睦親府事宗浩為樞密使封崇國公己亥如建春宮遣使册王為高麗國王戶部尚書孫鐸郎中李仲略國子祭酒趙忱始轉對香閣丁未敕尚書官員必須改除者議之其月日淺者毋數改易乙卯尚書省奏減親軍武衛軍額及太學女直漢兒生員罷小學官及外路教授詔學校仍舊武衛軍額再議餘報可司空襄右丞匡參知政事揆請罷諸路提點刑獄從之戊午雨雹夏四月癸亥改提刑司為按察使司戊辰如萬寧宮壬申左丞楊伯通致仕御史大夫張暐以奏事不實追一官侍御史路鐸追兩官俱罷之姬端修杖七十贖壬午英王從憲進封瀛王詔同州許州節度使罷兼陝西河南副統軍五月壬辰朔以旱下詔責躬求直言避正殿減膳審理寃獄命奏事於泰和殿戊戌命有司望祭嶽瀆禱雨己亥應奉翰林文字陳載言四事其一邊民苦于寇掠其二農民困于軍須其三審決寃滯一切從寬苟縱有罪其四行省官員例獲厚賞而沿邊司縣曾不霑及此亦干和氣致旱災之所由也上是之壬寅以兵部郎中完顏撒里合為夏國生日使戊申宰臣以京畿雨率百官請御正殿復常膳不從尚書省奏上更定給發虎符制著于令庚戌諭宰臣曰諸路旱或關執政今惟大興宛平兩縣不雨得非其守令之過歟司空襄平章政事萬公參知政事揆上表待罪上以罪己答之令各還職詔頒銅杖式壬子祈雨于太廟乙卯更定軍功賞格戊午司空襄以下再請御正殿復常膳不從庚申平章政事夾谷衡薨以宿直將軍徒單仲華為橫賜夏國使六月丁卯雨司空襄以下復表請御正殿復常膳從之甲戌以雨足命有司報謝于太廟丁丑右補闕楊庭秀言自轉對官外復令隨朝八品以上外路五品以上及出使外路有可言者並許移檢院以聞則時政得失民間利病可周知矣從之己卯以雨足報祭社稷辛巳遣官報祀嶽瀆癸未奉職醜和尚進浮漏水稱影儀簡儀圖命有司依式造之丁亥定宮中親戚非公事傳達語言轉遞諸物及書簡出入者罪七月甲辰更定尚藥儀鸞局學者格辛亥敕宣徽院官天壽節凡致仕宰執悉召與宴丙辰以久雨令大興府祈晴八月己巳獵于近郊壬申獵于香山甲戌以皇嗣未立命有司祈于太廟丁丑獵于近郊庚辰還宮九月庚寅朔天壽節宋高麗夏遣使來賀己亥如薊州秋山己未以知東平府事僕散琦等為賀宋生日使冬十月丙寅至自秋山壬午初定百官休假甲申初置審官院十一月乙未敕京府州縣設普濟院每歲十月至明年四月設粥以食貧民丙申平章政事張萬公表乞致政不許庚戌命有司祈雪甲寅定護衛改充奉御格以知濟南府事范楫等為賀宋正旦使十二月己未除授文字初送審官院辛酉更定考試隨朝檢知法條格右補闕楊庭秀請類集太祖太宗世宗三朝聖訓以時觀覽從之仍詔增熙宗為四朝癸未更定科舉法增設國史院女直漢人同修史各一人定親軍及承應人退間遷賞格是月淑妃李氏進封元妃五年春正月戊子朔宋高麗夏遣使來賀乙未以尚書省言會試取策論詞賦經義不得過六百人合格者不及其數則闕之丙申如春水庚子命左右司五日一轉奏事辛丑諭點檢司車駕所至仍令百姓市易庚戌定猛安謀克軍前怠慢罷世襲制二月辛未至自春水辛巳有司奏應奉翰林文字溫迪罕天興與其兄直學士思齊同僚學士院定撰制誥文字合無回避詔不須避仍為定制閏月癸卯定進納粟補官之家存留弓箭制丁未上與宰臣論置相曰徒單鎰朕志先定賈鉉如何皆曰知延安府事孫即康可平章政事萬公亦曰即康及第先鉉一榜上曰至此安問榜次特以賈才可用耳尚書省奏右補闕楊庭秀言乞令尚書省及第左右官一人應入史事者編次日曆或一月或一季封送史院上是其言仍令送著作局潤色付之三月庚申大睦親府進重修玉牒平章政事張萬公乞致政不許壬戌命有司禱雨癸亥雨戶部尚書孫鐸大理卿完顏撒剌國子司業蒙括仁本召對便殿丙寅如萬寧宮戊辰定妻亡服內婚娶聽離制親王宰執百官再請上尊號不許庚午以知大興府事卞為御史大夫丙子尚書省奏擬同知商州事蒲察西京為濟南府判官上曰宰相豈可止徇人情要當重惜名爵此人不堪朕常記之止與七品足矣庚辰以上京留守徒單鎰為平章政事封濟國公辛巳定本國婚聘禮制改山東東路舊皇城猛安名曰合里哥阿鄰四月丙戌朔文武百官再請上尊號不許丙午尚書省進律義五月乙卯朔定猛安謀克鬬毆殺人遇赦免死罷世襲制以雨足遣使報祭社稷丁巳定策論進士及承廕人試弓箭格戊午敕來日重五拜天服公裳者拜禮仍舊諸便服者並用女直拜己敕諸路按察司糾察親民官以大杖箠人者乙亥親王文武百官六學各上表請上尊號不許庚辰地震詔定進納官有犯決斷法六月乙巳遣有司祈晴望祭嶽瀆七月乙卯朔以晴遣官望祭嶽鎮海瀆癸亥定居祖父母喪婚娶聽離法初置蒲思衍羣牧辛未平章政事萬公特賜告兩月甲戌獵于近郊八月壬辰幸香山乙未至自香山丁未敕審官院奏事其院官皆許升殿戊申更定鎮防軍犯徒配役法九月甲寅朔天壽節宋高麗遣使來賀戊午命樞密使宗浩禮部尚書賈鉉佩金符行省山東等路括地己未尚書省奏西北路招討使獨吉思忠言各路邊堡牆隍西自坦舌東至胡烈公幾六百里向以起築匆遽並無女牆副隄近令修完計工七十五萬止役戍軍未嘗動民今已畢功上賜詔奬諭修玉牒成定皇族收養異姓男為子者徒三年姓同者減二等立嫡違法者徒一年癸亥如薊州秋山冬十月庚寅至自秋山庚子風霾宋遣使來告哀辛丑集百官于尚書省問間者亢旱近則久陰豈政有錯謬而致然歟各以所見對以禮部郎中劉公憲為高麗生日使丁未獵于近郊以宿直將軍完顏觀音奴為夏國生日使十一月癸丑朔日有食之乙卯以國史院編修官呂卿雲為左補闕兼應奉翰林文字審官院以資淺駁奏上諭之曰明昌間卿雲嘗上書言宮掖事辭甚切直皆他人不能言者卿輩蓋不知也臣下言事不令外人知乃是謹密正當顯用卿宜悉之以工部尚書烏古論誼等為宋弔祭使初定品官過闕則下制己巳宋復遣使來告哀辛未以殿前右副點檢紇石烈忠定為賀宋正旦使十二月癸未朔詔改明年為泰和元年以河南路統軍使充等為宋弔祭使乙未定管軍官受所部財物輒放離役及令人代役法辛丑詔宮籍監戶百姓自願以女為婚者聽癸卯定造作不如法三年內有損壞者罪有差泰和元年正月壬子朔宋高麗夏遣使來賀壬戌宋遣使獻先帝遺留物己巳以太府監孫復言方今在仕者三萬七千餘員而門廕補居三之二諸司待闕動至纍年蓋以補廕猥多流品混淆本末相舛至於進納之人既無勞績又非科第而亦廕及子孫無所分別欲流之清必澄其源乃更定廕法而頒行之尚書省奏今杖式輕細民不知畏請用大杖詔不許過五分庚午如長春宮春水辛未上以方春禁殺含胎兔犯者罪之告者賞之甲戌初命文武官官職俱至三品者許贈其祖二月壬辰去造土茶律丁未至自春水三月乙丑夏國遣使來謝壬申幸天長觀癸酉如萬寧宮乙亥宋遣使來報謝丁丑更定鎮防千戶謀克放老入除格辛巳敕官司私文字避始祖以下廟諱小字犯者論如律夏四月甲辰詔諭契丹人戶纍經簽軍立功者官賞恩例與女直人同仍許養馬為吏五月甲寅擊毬于臨武殿令都民縱觀丙辰樞密使宗浩罷壬戌幸玉泉山戊寅削尊長有罪卑幼追捕律以直東上閣門劉頍為橫賜高麗使六月己卯幸香山乙酉平章政事張萬公表乞致仕不許辛卯祈雨于北郊己亥用尚書省言申明舊制猛安謀克戶每田四十畝樹桑一畝毀樹木者有禁鬻地土者有刑其田多汙萊人戶闕乏並坐所臨長吏按察司以時勸督有故慢者量決罰之仍減牛頭稅三之一敕尚書省舉行風俗奢僭之禁乙巳初許諸科徵鋪馬黃河夫軍須等錢折納銀一半願納錢鈔者聽丁未詔有司修蓮花漏七月辛酉禁放良人不得應諸科舉子孫不在禁限甲子諭刑部官凡上書人言及宰相者不得申省乙丑更定右選注縣令丞簿格己巳初禁廟諱同音字八月庚辰初命戶絶者田宅以三分之一付其女及女孫戊子特改授司空襄河間府路算注海世襲猛安乙未至自萬寧宮丙申宋遣使來報謝壬寅制猛安謀克並隸按察司監察御史止按部糾舉有罪則並坐監臨之官詔推排西北京遼東三路人戶物力九月戊申朔天壽節宋高麗夏遣使來賀更定贍學養士法生員給民佃官田人六十畝歲支粟三十石國子生人百八畝歲給以所入官為掌其數以右宣徽使徒單懷忠等為賀宋生日使甲寅如秋山丙子至自秋山冬十月乙酉祫享于太廟戊子平章政事張萬公乞致仕不許壬辰御史臺奏在制按察司官比任終遣官考核然後尚書省命官覆察之今監察御史添設員多宜分路巡行每路女直漢人各一人同往從之仍敕分四路丙申御史大夫卞乞致仕不許戊戌以武衛軍都指揮使司判官納合鉉為高麗生日使壬寅敕有司購遺書宜尚其價以廣搜訪藏書之家有珍惜不願送官者官為謄寫畢復還之仍量給其直之半甲辰以刑部員外郎完顏綱為夏國生日使十一月庚戌司空襄以下文武百官復請上尊號不許辛亥敕尚書省凡役衆勞民之事勿輕行之丁巳諭工部曰比聞懷州有橙結實官吏檢視已嘗擾民今復進柑得無重擾民乎其誡所司遇有則進無則已庚申以殿前右衛將軍紇石烈七斤等為賀宋正旦使十二月辛巳敕改原廟春秋祭祀稱朝獻司空襄以下復請上尊號詔不允仍斷來章丁酉司空襄等進新定律令敕條格式五十二卷辛丑詔頒行之壬寅獵于近郊乙巳初定廉能官升注格二年春正月丁未朔宋高麗夏遣使來賀乙卯始朝獻于衍慶宮庚申幸芳苑觀燈癸酉歸德軍節度副使韓琛以強市民布帛削一官罷之甲戌如建春宮二月戊戌初置內侍寄祿官乙巳還宮三月甲寅初置宮苑司都同監各一人甲子蔡王從彝母充等大師卒詔有司定喪禮葬儀事載從彝傳四月庚辰幸升國長公主第問疾己亥定遷三品官格復撲買河濼法辛丑諭御史臺諸訴事于臺當以實上聞不得輒稱察知癸卯如萬寧宮命有司祈雨五月甲辰朔日有食之戊申如泰和宮辛亥初薦新于太廟壬戌諭有司曰金井捺鉢不過二三日留朕之所止一涼厦足矣若加修治徒費人力其藩籬不急之處用圍幕可也甲子更泰和宮曰慶寧長樂川曰雲龍己巳敕御史臺京師拜廟及巡幸所過州縣止令灑掃不得以黃土覆道違者糾之六月辛卯諭尚書省諸路禾稼及雨多寡令州郡以聞七月辛亥有司奏還宮日請用黃麾仗不許乙卯朝獻于衍慶宮八月丙申鳳凰見于磁州武安縣鼓山石聖臺丁酉還宮皇子生九月壬寅朔天壽節宋高麗夏遣使來賀甲寅以拱衛直都指揮使完顏瑭等為賀宋生日使且戒之曰兩國和好久矣不宜爭細故傷大體癸亥以皇子生親謝南北郊庚午封皇子為葛王冬十月戊寅報謝于太廟及山陵甲申以鳳凰見詔中外丙戌獵近郊壬辰遣尚輦局副使李仲元為高麗國生日使以宿直將軍紇石烈毅為夏國生日使瀛王府司馬獨吉溫為橫賜使十一月甲辰更定德運為土臘用辰以西京留守宗浩為樞密使戊申以更定德運詔中外庚申初命外官三品到任進表稱謝甲子幸玉虛觀遣使報謝于太清宮十二月癸酉以皇子晬日放僧道戒牒三千以武安軍節度使徒單公弼等為賀宋正旦使戊寅冬獵庚辰報謝于高禖丁酉還都閏月庚戌司空襄薨癸丑初命監察御史非特旨不許舉官辛酉遣使報謝于北嶽定人戶物力隨時推收法丁卯遣使報謝于長白山冬無雪三年春正月辛未朔宋高麗夏遣使來賀癸酉遣官祈雪于北嶽丁丑朝獻于衍慶宮己卯以樞密使宗浩為尚書右丞相右丞完顏匡為左丞參知政事僕散揆為右丞御史中丞孫即康刑部尚書賈鉉並為參知政事庚辰如建春宮二月癸丑還宮甲子定諸職官省親拜墓給假例三月壬申二平章政事張萬公致仕庚辰如萬寧宮丁亥定從人銅牌賣毀罪賞制庚寅定職官應遷三品格刺史以上及隨朝資歷在刺史以上身故者每半年一次敷奏甲午如玉泉山丙申以殿前都點檢僕散端為御史大夫四月乙巳禘于太廟敕點檢司致仕官入宮年高艱于步履者並聽策杖仍令舍人護衛扶之丁巳敕有司祈雨仍頒土龍法己未命吏部侍郎李炳國子司業蒙括仁本知登聞檢院喬宇等再詳定儀禮庚申諭省司宮中所用物如民間難得勿強市之癸亥尚書省奏遣官分路覆實御史所察事五月壬申以重五拜天射柳上三發三中四品以上官侍宴魚藻殿以天氣方暑命兵士甲者釋之丙戌以定律令正土德鳳凰來皇嗣建大赦辛卯皇子葛王薨壬辰定擅增減宮門鎖鑰罪丙申作太極宮六月己亥太白晝見壬寅詔選聰明方正之士為修起居注又詰點檢司諸親軍所設教授及授業人若干其為教何法通大義者幾人各具以聞戊申定職官追贈法惟嘗犯贓罪者不在追贈之列壬戌遣官行視中都田禾雨澤分數七月壬申朝獻于衍慶宮乙亥定大臣薨百官奉慰禮庚辰獵于近郊丁亥上諭宰臣凡奏事朕欲徐思或如己者若除授事可俟三五日再奏餘並二十日奏之八月丙辰還宮庚申命編修官左容充宮教賜銀幣九月丙寅朔天壽節宋高麗夏遣使來賀壬申以刑部尚書承暉等為賀宋生日使戊子以萬寧宮提舉司隸工部壬辰詔定千戶謀克受隨處捕盜官公移盜急不即以衆應之者罪有差召右丞相宗浩還朝冬十月戊戌日將暮赤如赭己亥大風甲辰申酉間天大赤夜將旦亦如之壬子右丞僕散揆至自北邊丙辰召至香閣慰勞之以尚食局使師孝為高麗生日使庚申尚書左丞完顏匡等進世宗實録上降座立受之壬戌以薊州刺史完顏太平為夏國生日使奉御完顏阿魯帶以使宋還言宋權臣韓托胄市馬厲兵將謀北侵上怒以為生事笞之五十出為彰德府判官及淮平陷乃擢為安國軍節度副使丁卯諭尚書省士庶陳言皆從所司以聞自今可悉令詣闕量與食直仍給官舍居之其言切直及繫利害重者並三日內奏聞十一月辛未以簽樞密院事獨吉思忠等為賀宋正旦使丁丑冬獵以獲兔薦山陵甲午詔監察等察事可二年一出十二月庚子諭宰臣曰賀正宋使且至可令監察隨之以為常壬寅還都己酉賜天長觀額為太極宮辛亥詔諸親王公主每歲寒食十月朔聽朝謁興裕二陵忌辰亦如之癸丑詔遣監察御史分按諸路所遣者女直人即以漢人朝臣偕所遣者漢人即以女直朝臣偕戊午敕行宮名曰光春其朝殿曰蘭臯寢殿曰輝寧
