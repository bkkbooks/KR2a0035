body:
  text: 金史卷九十九列傳第三十七徒單鎰賈鉉孫鐸孫即康李革徒單鎰本名按出上京路速速保子猛安人父烏輦北京副留守鎰穎悟絶倫甫七歲習女直字大定四年詔以女直字譯書籍五年翰林侍講學士徒單子溫進所譯貞觀政要白氏策林等書六年復進史記西漢書詔頒行之選諸路學生三十餘人令編修官溫迪罕締達教以古書習作詩策鎰在選中最精詣遂通契丹大小字及漢字該習經史久之樞密使完顏思敬請教女直人舉進士下尚書省議奏曰初立女直進士科且免鄉府兩試其禮部試廷試止對策一道限字五百以上成在都設國子學諸路設府學並以新進士充教授士民子弟願學者聽歲久學者當自衆即同漢人進士三年一試從之十三年八月詔策女直進士問以求賢為治之道侍御史完顏蒲涅太常博士李晏應奉翰林文字阿不罕德甫移剌傑中都路都轉運副使奚考試鎰等二十七人及第鎰授兩官餘授一官上三人為中都路教授四名以下除各路教授十五年詔譯諸經著作佐郎溫迪罕締達編修官宗璧尚書省譯史阿魯吏部令史楊克忠譯解翰林修撰移剌傑應奉翰林文字移剌履講究其義鎰自中都路教授選為國子助教左丞相紇石烈良弼嘗到學中與鎰談論深加禮敬丁母憂起復國史院編修官世宗嘗問太尉完顏守道曰徒單鎰何如人也守道對曰有材力可任政事上曰然當以劇任處之又曰鎰容止溫雅其心平易久之兼修起居注纍遷翰林待制兼右司員外郎獻漢光武中興賦世宗大悅曰不設此科安得此人章宗即位遷左諫議大夫兼吏部侍郎明昌元年為御史中丞無何拜參知政事兼修國史鎰言人生有欲不限以制則侈心無極今承平日久當慎行此道以為經久之治章宗鋭意于治平鎰上書其略曰臣竊觀唐虞之書其臣之進言於君曰戒哉懋哉曰吁曰都既陳其戒復導其美君之為治也必曰稽于衆舍己從人既能聽之又能行之又從而興起之君臣上下之間相與如此陛下繼興隆之運撫太平之基誠宜稽古崇德留意於此無因物以好惡喜怒無以好惡喜怒輕忽小善不恤人言夫上下之情有通塞天地之運有否泰唐陸贄嘗陳隔塞之九弊上有其六下有其三陛下能慎其六為臣子者敢不慎其三哉上下之情既通則大綱舉而羣目張矣進尚書右丞修史如故三年罷為橫海軍節度使改定武軍節度使知平陽府事先是鄭王永蹈判定武軍鎬王永中判平陽府相繼得罪連引者衆上疑其有黨或命節度定武繼又知平陽焉改西京留守承安三年改上京留守五年上問宰臣徒單鎰與宗浩孰優平章政事張萬公對曰皆才能之士鎰似優者鎰有執守宗浩多數耳上曰何謂多數萬公曰宗浩微似趨合上曰卿言是也頃之鎰拜平章政事封濟國公淑妃李氏擅寵兄弟恣橫朝臣往往出入其門是時烈風昏曀連日詔問變異之由鎰上疏略曰仁義禮智信謂之五常父義母慈兄友弟敬子孝謂之五德今五常不立五德不興縉紳學古之士棄禮義忘廉恥細民違道畔義迷不知返背毀天常骨肉相殘動傷和氣此非一朝一夕之故也今宜正薄俗順人心父父子子夫夫婦婦各得其道然後和氣普洽福祿薦臻矣因論為政之術其急有二一曰正臣下之心竊見羣下不明禮義趨利者衆何以責小民之從化哉其用人也德器為上才美為下兼之者待以不次才下行美者次之雖有才能行義無取者抑而下之則臣下之趨向正矣其二曰導學者之志教化之行興于學校今學者失其本真經史雅奧委而不習藻飾虛詞釣取祿利乞令取士兼問經史故實使學者皆守經學不惑於近習之靡則善矣又曰凡天下之事叢來者非一端形似者非一體法制不能盡隱於近似乃生異論孔子曰義者天下之制也記曰義為斷之節伏望陛下臨制萬機事有異議少凝聖慮尋繹其端則裁斷有定而疑可辨矣鎰言皆切時弊上雖納其説而不能行上問漢高帝光武優劣平章政事張萬公對曰高祖優甚鎰曰光武再造漢業在位三十年無沈湎冒色之事高祖惑戚姬卒至于亂由是言之光武優上默然鎰蓋以元妃李氏隆寵過盛故微諫云泰和四年罷知咸平府五年改南京留守六年徙知河中府兼陝西安撫使僕散揆行省河南陝西元帥府雖受揆節制實顓方面上思用謀臣制之由是升宣撫使一品鎰改知京兆府事充宣撫使陝西元帥府並受節制詔曰將帥雖武悍久歷行陳而宋人狡獪亦資算勝卿之智略朕所深悉且股肱舊臣故有此寄宜以長策御敵厲兵撫民稱朕意焉鎰言初置急遞鋪本為轉送文牒今一切乘驛非便上深然之始置提控急遞鋪官自中都至真定平陽置者達于京兆京兆至鳳翔置者達于臨洮自真定至彰德置者達于南京自南京分至歸德置者達于泗州壽州分至許州置者達于鄧州自中都至滄州置者達于益都府自此郵達無復滯焉七年吳曦死宋安丙分兵出秦隴間十月詔鎰出兵金房以分掣宋人梁益漢沔兵勢鎰遣行軍都統斡勒葉祿瓦副統把回海完顏摑剌以步騎五千出商州十一月葉祿瓦拔鶻嶺關摑剌別將攻破燕子關新道口回海取小湖關敖倉至營口鎮破宋兵千餘人追至上津縣斬首八百餘級遂取上津縣葉祿瓦破宋兵二千于平溪將趨金州宋王柟以書乞和詔鎰召葉祿瓦軍退守鶻嶺關八年正月宋安丙遣景統領由梅子溪新道口朱砂谷襲鶻嶺關回海摑剌擊走之斬景統領于陳是歲罷兵鎰遷特進賜賚有差改知真定府事大安初加儀同三司封濮國公改東京留守過闕入見衛紹王謂鎰曰卿兩朝舊德欲用卿為相太尉匡卿之門人朕不可屈卿下之遷開府儀同三司佩金符充遼東安撫副使三年改上京留守平章政事獨吉思忠敗績于會河堡中都戒嚴鎰曰事急矣乃選兵二萬遣同知烏古孫兀屯將之入衛中都朝廷嘉之徵拜尚書右丞相監修國史鎰言自用兵以來彼聚而行我散而守以聚攻散其敗必然不若入保大城併力備禦昌桓撫三州素號富實人皆勇健可以內徙益我兵勢人畜貨財不至亡失平章政事移剌參知政事梁𤨠曰如此是自蹙境土也衛紹王以責鎰鎰復奏曰遼東國家根本距中都數千里萬一受兵州府顧望必須報可誤事多矣可遣大臣行省以鎮之衛紹王不悅曰無故置行省徒搖人心耳其後失昌桓撫三州衛紹王乃大悔曰從丞相之言當不至此頃之東京不守衛紹王自訟曰我見丞相恥哉术虎高琪駐兵縉山甚得人心士樂為用至寧元年尚書左丞完顏綱將行省于縉山鎰謂綱曰行省不必自往不若益兵為便綱不聽且行鎰遣人止之曰高琪之功即行省之功也亦不聽綱至縉山遂敗績焉頃之鎰墜馬傷足在告聞胡沙虎難作命駕將入省或告之曰省府相幕皆以軍士守之不可入矣少頃兵士索人于閭巷鎰乃還第胡沙虎意不可測方猶豫不能自定乃詣鎰問疾從人望也鎰從容謂之曰翼王章宗之兄顯宗長子衆望所屬元帥決策立之萬世之功也胡沙虎默然而去乃迎宣宗于彰德胡沙虎既殺徒單南平欲執其弟知真定府事銘鎰説之曰車駕道出真定鎬王家在威州河北人心易搖徒單銘有變朝廷危矣不如與之金牌奉迎車駕銘必感元帥之恩胡沙虎從之至寧貞祐之際轉敗為功惟鎰是賴焉宣宗即位進拜左丞相封廣平郡王授中都路迭魯都世襲猛安蒲魯吉必剌謀克鎰尚有足疾詔侍朝無拜明年鎰建議和親言事者請罷按察司鎰曰今郡縣多殘毀正須按察司撫集不可罷遂止宣宗將幸南京鎰曰鑾輅一動北路皆不守矣今已講和聚兵積粟固守京師策之上也南京四面受兵遼東根本之地依山負海其險足恃備禦一面以為後圖策之次也不從是歲薨詔賻贈從優厚鎰明敏方正學問該貫一時名士皆出其門多至卿相嘗嘆文士委頓雖巧拙不同要以仁義道德為本乃著學之急道之要二篇太學諸生刻之于石有弘道集六卷賈鉉字鼎臣博州博平人性純厚好學問中大定十三年進士調滕州軍事判官單州司候補尚書省令史章宗為右丞相深器重之除陝西東路轉運副使入為刑部主事遷監察御史遷侍御史改右司諫上疏論邊戍利害上嘉納之遷左諫議大夫兼工部侍郎與黨懷英同刊修遼史鉉上書曰親民之官任情立威所用決杖分徑長短不如法式甚者以鐵刃置於杖端因而致死間者陰陽愆戾和氣不通未必不由此也願下州郡申明舊章檢量封記按察官其檢察不如法者具以名聞內庭敕斷亦依已定程式制可復上書論山東採茶事其大概以為茶樹隨山皆有一切護邏已奪民利因而以揀茶樹執誣小民嚇取貨賂宜嚴禁止仍令按察司約束上從之承安四年遷禮部尚書諫議如故是時有詔凡奉敕商量照勘公事皆期日聞奏鉉言若如此恐官吏迫於限期姑務苟簡反害事體況簿書自有常程御史臺治其稽緩如事有應密三月未絶者令具次第以聞下尚書省議如省部可即定奪者須三月擬奏如取會案牘卒難補勘者先具次第奏知更限一月結絶違者準稽緩制書罪之上議置相欲用鉉宰臣薦孫即康張萬公曰即康及第在鉉前上曰用相安問榜次朕意以為賈鉉才可用也然竟用即康焉泰和二年興陵崇妃薨上欲成服苑中行登門送喪之禮以問鉉鉉對曰故宋嘗行此禮古無是也遂已改刑部尚書泰和三年拜參知政事亳州醫者孫士明輒用黃紙大書敕賜神針先生等十二字及於紙尾年月間摹作寶樣朱篆青龍二字以誑惑市人有司捕治款伏值赦大理寺議宜準偽造御寶雖遇赦不應原已奏可矣鉉奏天子有八寶其文各異若偽造不限用泥及黃蠟今用筆描成青龍二字既非八寶文論以偽造御寶非本法意上悟遂以赦原明日上謂大臣曰已行之事賈鉉猶執奏甚可嘉也羣臣亦當如此矣泰和六年御試鉉為監試官上曰丞相宗浩嘗言試題頗易由是進士例不讀書朕今以日合天統為賦題鉉曰題則佳矣恐非所以牢籠天下士也上曰帝王以難題窘舉人固不可欲使自今積致學業而已遂用之久之鉉與審官院掌書大中漏言除授事上謂鉉曰卿罪自知之矣然卿久參機務補益弘多不深罪也乃出為安武軍節度使改知濟南府致仕貞祐元年薨孫鐸字振之其先滕州人徙恩州歷亭縣鐸性敏好學遼陽王遵古一見器之期以公輔登大定十三年進士第調海州軍事判官衛縣丞補尚書省令史章宗為右丞相語人曰治官事如孫鐸必無錯失初即位問鐸安在有司奏為右都管使宋及還除同知登聞檢院事鐸言凡上訴者皆因尚書省斷不得直若上訴者復送省則必不行矣乞自宸衷斷之上以為然詔登聞檢院凡上訴者每朝日奏十事詔刊定舊律鐸先奏名例一篇承安元年遷左諫議大夫改河東南路轉運使召為中都路都轉運使初置講議錢穀官十人鐸為選首承安四年遷戶部尚書鐸因轉對奏曰比年號令或已行而中輟或既改而復行更張太煩百姓不信乞自今凡將下令再三講究如有益于治則必行無恤小民之言國子司業紇石烈善才亦言頒行法令絲綸既出尤當固守上然之泰和二年閏十二月上召鐸戶部侍郎張復亨議交鈔復亨曰三合同鈔可行鐸請廢不用詰難久之復亨議詘上顧謂侍臣曰孫鐸剛正人也雖古魏徵何加焉三年御史中丞孫即康刑部尚書賈鉉皆除參知政事鐸再任戶部尚書鐸心少之對賀客誦古人詩曰唯有庭前老柏樹春風來似不曾來御史大夫卞劾鐸怨望降同知河南府事改彰化軍節度使復為中都轉運使泰和七年拜參知政事蒲陰縣令大中與左司郎中劉昂通州刺史史肅前監察御史王宇吏部主事曹元戶部員外郎李著監察御史劉國樞尚書省都事曹溫雄州都軍馬師周吏部員外郎徒單永康太倉使馬良顯順州刺史唐括直思白坐私議朝政下獄尚書省奏其罪鐸進曰昂等非敢議朝政但如鄭人遊鄉校耳上悟乃薄其罪鐸上言民間鈔多宜收斂院務課程及諸窠名錢須要全收交鈔秋夏稅本色外盡令折鈔不拘貫例農民知之迤漸重鈔比來州縣抑配行市買鈔無益徒擾之耳乞罷諸處鈔局惟省庫仍舊小鈔無限路分可令通行上覽奏即詔有司曰可速行之大安初議誅黃門李新喜鐸曰此先朝用之太過耳衛紹王不察即曰卿今日始言之何耶既而復曰後當盡言勿以此介意頃之遷尚書左丞兼修國史議鈔法忤旨猶以論李新喜降濬州防禦使改安國軍節度使徙絳陽軍宣宗即位召赴闕以兵道阻宣宗遷汴鐸上謁于宜村除太子太師有疾纍遣使候問貞祐三年致仕是歲薨孫即康字安伯其先滄州人石晉之末遼徙河北實燕薊八代祖延應在徙中占籍析津實大興仕至涿州刺史延應玄孫克構遼檢校太傅啓聖軍節度使即康克構曾孫中大定十年進士第章宗為右丞相是時即康為尚書省令史由是識其人章宗即位纍遷戶部員外郎講究鹽法利害語在食貨志除耀州刺史入為吏部左司郎中上謂宰臣曰孫即康向為省掾言語拙訥今才力大進非向時比也宰臣因曰即康年已高幸及早用之上問年幾何矣對曰五十六歲上復問其才何如張萬公平章政事守貞對曰即康才過之上曰視萬公為通耳由是遷御史中丞初張汝弼妻高陀斡不道伏誅汝弼鎬王永中舅也上由是頗疑永中永中府傅尉奏永中第四子阿離合悶語涉不軌詔同簽大睦親府事與即康鞫之第二子神土門嘗撰詞曲頗輕肆遂以語涉不遜就逮家奴德哥首永中嘗與侍妾瑞雲言我得天下以爾為妃子為大王即康還奏詔禮部尚書張暐覆訊永中父子皆死時論寃之頃之遷泰寧軍節度使改知延安府事承安五年上問宰相今漢官誰可用者司空襄舉即康上曰不輕薄否襄曰可再用為中丞觀之上乃復召即康為御史中丞泰和三年除參知政事明年進尚書右丞六年宋渝盟有端大臣猶以為小盜竊發不足恤即康與左丞僕散端參政獨吉思忠以為必當用兵上以為然上問即康參知政事賈鉉曰太宗廟諱同音字有讀作成字者既非同音便不當缺點畫睿宗廟諱改作崇字其下却有本字全體不若將示字依蘭亭帖寫作未字顯宗廟諱允充字合缺點畫如統傍之充似不合缺即康奏曰唐太宗諱世民偏傍犯如葉字作字泯字作泜字乃擬熙宗廟諱從面從且睿宗廟諱上字從未下字從耳卑世宗廟諱從系顯宗廟諱如正犯字形止書斜畫沇字鈗字各從口兌悅之類各從本傳從之自此不勝曲避矣進左丞宋人請和進官一階舊制尚書省令史考滿優調次任回降崔建昌已優調興平軍節度副使未回降即除大理司直詔知除郭邦傑李蹊杖七十勒停左司員外郎高庭玉決四十解職即康待罪有詔勿問章宗崩衛紹王即位即康進拜平章政事封崇國公大安三年致仕是歲薨遣使致祭李革字君美河津人父餘慶三至廷試不遂因棄去革穎悟讀書一再誦輒記不忘大定二十五年進士調真定主簿察廉遷韓城令同知州事納富商賂以歲課軍須配屬縣革獨不聽提刑司以為能遷河北東路轉運都勾判官太原推官丁母憂起復遷大興縣令中都左警巡使南京提刑判官監察御史同知昭義軍節度事丁父憂起復簽南京按察事泰和六年伐宋尚書省奏軍興隨路官差占者別注闕者選補老不任職者替罷及司縣各存留強幹正官一員革與簽陝西高霖簽山東孟子元俱被詔體訪三路官員能否籍存留正官行省行部元帥府差占員數及事故闕員老不任職赴闕奏事改刑部員外郎調觀州刺史兼提舉漕運陝西西路按察副使大興府治中知府徒單南平貴幸用事勢傾中外遣所親以進取誘革革拒之貞祐二年遷戶部侍郎宣宗遷汴行河北西路六部事遷知開封府事河南勸農使戶部吏部尚書陝西行省參議官四年拜參知政事革奏有司各以情見引用斷例牽合附會實啓幸門乞凡斷例敕條特旨奏斷不為永格者不許引用皆以律為正詔從之是歲大元兵破潼關革自以執政失備禦之策上表請罪不許罷為絳陽軍節度使興定元年胥鼎自平陽移鎮陝西革以知平陽府事權參知政事代鼎為河東行省是時興民伐宋革上書曰今之計當休兵息民養鋭待敵宋雖造釁止可自備若不忍小忿以勤遠略恐或乘之不能支也不納太原兵後闕食革移粟七萬石以濟之二年宣差粘割梭失至河東於是晚禾未熟牒行省耕毀清野革奏今歲雨澤及時秋成可待如令耕毀民將不堪詔從革奏十月平陽被圍城中兵不滿六千屢出戰旬日間傷者過半徵兵吉隰霍三州不時至裨將李懷德縋城出降兵自城東南入左右請革上馬突圍出革歎曰吾不能保此城何面目見天子汝輩可去矣乃自殺贈尚書右丞贊曰傳曰君子之言其利博哉徒單鎰拱挹一語而宣宗立厥功懋矣賈鉉孫鐸皆舊臣鉉久致仕鐸忤旨衛王皆不復見用徒單鎰亦外官惟孫即康詭隨乃驟至宰相古所謂斗筲之人即康之謂矣鐸論李新喜其言似漢耿育有旨哉貞祐執政李革可謂君子其進退之際有古人為相之風焉
