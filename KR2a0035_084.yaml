body:
  text: 金史卷八十四列傳第二十二杲本名撒离喝耨盌溫敦思忠子乙迭溫敦兀帶奔睹高楨白彥敬張景仁杲本名撒离喝安帝六代孫泰州婆盧火之族胡魯補山之子雄偉有才略太祖愛之常在軍中及婆盧火為泰州都統宗族皆隨遷泰州撒离喝嘗為世祖養子獨得不遷仍居安出虎水宗翰宗望已再克汴執宋二主北還宗望分遣諸將定河北左都監闍母攻下河間雄州李成棄城走撒离喝邀擊大破之雄州遂降睿宗經略山東留撒离喝于河上而真定境內有賊衆自稱元帥秦王撒离喝擊破其衆執而戮之從平陝西撒离喝徇地自渭以西降德順軍又降涇原路鎮戎軍進平熙河降甘泉等三堡遂取保川城明年同奔睹討平河外降寧洮安隴二寨幷降下河及樂州至西寧盡降其都護官屬於是木波族長等皆迎降攻慶陽敗其拒者遂降其城慕洧以環州來降得城寨十三步騎一萬於是宗弼軍敗于和尚原上褒美撒离喝而戒勵宗弼睿宗已定陝西留兵屯衝要使撒离喝總之居無何請收劍外十三州與宋王彥之軍七千人遇于沙會濼敗之遂克金州連破吳玠諸軍于饒峰關遂取真符縣取洋州入興元府敗吳玠兵于固鎮擒其兩將撒葛柷等破宋兵盡下諸砦及仙人關天會十四年為元帥右監軍天眷三年宗弼復取河南撒离喝自河中出陝西既至鳳翔擊走宋軍是時宋軍在京兆西者甚衆諸將以暑雨欲駐軍且聞宋兵九萬會于涇州都元帥遣河南步卒來會軍撒离喝留諸將屯環慶獨以輕騎取涇州六月敗宋兵于涇州宋兵走渭州拔离速追擊大敗之未幾為右副元帥皇統三年封應國公錫賚甚厚熙宗出獵賜具裝馬二命射于圍中加開府儀同三司將還軍命宰臣餞之海陵升蒲州為河中府撒离喝為河中尹左副元帥如故自陝西入朝因從容言曰唐建成不道太宗以義除之即位之後力行善政後世稱賢陛下以前主失德大義廢絕力行善政則如唐太宗矣海陵聞其言色變撒离喝亦悔其言既而進封國王從行官吏皆官賞之海陵念撒离喝久握兵在外頗得士心忌之以為行臺左丞相兼左副元帥又恐不奉命陽尊以殊禮使係屬籍以玉帶璽書賜之撒离喝至汴詔諭行臺右丞相右副元帥撻不野無使撒离喝預軍事撒离喝不知每事輒爭之撻不野詭曰太師梁王以陝西事屬公以河南事屬撻不野今未嘗別奉詔命陝西之事撻不野固不敢干涉撻不野久在河南將帥畏而附之撒离喝始至勢孤爭之不得白於朝大臣知上旨報曰如梁王教及詔使至汴諭旨於撻不野使還撻不野獨有附奏撒离喝不得與聞人皆知海陵使撻不野圖之矣會海陵欲除遼王斜也子孫及平章政事宗義等元帥府令史遙設希海陵旨誣撒离喝父子謀反幷平章宗義尚書謀里野等遙設學撒离喝手署及印文詐為契丹小字家書與其子宗安從左都監奔睹上變封題作已經開拆者書紙隱約有白字作曾經水浸致字畫分明者稱御史大夫宗安於宮門外遺下此書遙設拾得之其書略曰撻不野自來於我不好凡事常有隄防應是知得上意移剌補丞相於我不好若遲緩分毫猜疑必落他手也又曰阿渾每見此書約定月日教掃胡令史却寫白字書來有司鞫問宗安不服曰使真有此書我剖肌肉藏之猶恐漏泄安得於朝門下遺之有司掠笞楚毒宗安神色不變乃置掃胡爐炭上掃胡不能堪自誣服宗安謂掃胡曰爾苦矣宗義被掠笞不能當亦自誣服曰我輩知不免矣不早決徒自苦宗安曰今雖無以自明九泉之下當有寃對吾終不能引屈竟不服而死使厮魯渾殺撒离喝于汴族其家而無寫書及傳書者主名有折哥者能契丹小字舊嘗從撒离喝特末者陝西舊將嘗以左副元帥事馳驛赴闕兩人者皆族誅撒离喝親屬坐是死者二十餘人魯王斡者孫耶魯候撒离喝于汴厮魯渾執之耶魯曰願付有司若法當同坐雖死不恨厮魯渾亦殺之其家訟于朝海陵不問但賜錢二百萬奔睹遷元帥左監軍加開府儀同三司遙設為同知博州事賜錢三百萬謂之曰爾無自比老人老人親告朕爾以告有司設有撒离喝黨人在其間敗吾事矣老人指蕭玉也蕭玉名老人故云然遙設在博州數歲後與蕭裕謀反伏誅大定初詔復撒离喝官爵三年追封金源郡王諡莊襄以郡王品秩官為營葬十七年配享太宗廟廷耨盌溫敦思忠本名乙剌補阿補斯水人太祖伐遼是時未有文字凡軍事當中覆而應密者諸將皆口授思忠思忠面奏受詔還軍傳致詔辭雖往復數千言無少誤及遼人議和思忠與烏林荅贊謀往來專對其間號閘剌閘剌者漢語云行人也自收國元年正月遼人遣僧家奴來使者三往反議不決使者賽剌至遼遼人殺之遼主自將至駝門大敗歸復遣使議和太祖使胡突衮往書曰若不從此胡突衮但使人送至界上或如賽剌殺之惟所欲者天輔三年六月遼大冊使太傅習泥烈以冊璽至上京一舍先取冊文副錄閱視文不稱兄不稱大金稱東懷國太祖不受使宗翰宗雄宗幹希尹商定冊文義指楊朴潤色胡十荅阿撒高慶裔譯契丹字使贊謀與習泥烈偕行贊謀至遼見遼人再撰冊文復不盡如本國旨意欲見遼主自陳閽者止之贊謀不顧直入閽者相與搏撠折其信牌遼人懼遽遣贊謀歸太祖再遣贊謀如遼遼人前後十三遣使和議終不可成太祖自將遂克臨潢其後伐宋思忠從宗翰軍封劉豫為齊帝思忠為傳宣使俄授謀克從宗弼克和尚原還為同知西京留守事天眷初改蒲州防禦使元帥府在陝西者其官屬往往豪壓貧民為奴起遣工匠千人東來至河上思忠留止其人以聞詔皆還之為行臺尚書左丞是時贊謨為行臺參知政事思忠黷貨無厭贊謨鄙之兩人由是交惡海陵殺左丞相秉德于行臺贊謨妻秉德乳母也思忠因構贊謨殺之是歲思忠入為尚書右丞俄進平章政事封郜國公進拜左丞相兼侍中封沂國公天德三年致仕貞元二年十月海陵率三品以上官幸思忠第使以家禮見謂思忠曰卿神氣康實習先朝舊事舍卿無能知者當為朕起共治國政對曰君之命臣敢不敬從但恨老病疏謬無以塞責耳遂命思忠乘馬從入宮拜太傅領三省事封齊國王尋拜太師兼勸農使已而罷中書門下省不置領三省事置尚書令位丞相上思忠為尚書令特置散從八人聽隨至宮省奏賜坐海陵欲定封爵制度風思忠建白之封王者皆降封異姓或封公或一品二品階惟封思忠廣平郡王賜以玉帶思忠言百官不當封妻海陵從之惟封思忠次室為郡夫人而思忠亦自謂太祖舊臣頗自任雖海陵遂非拒諫而思忠盡言無所避海陵將伐宋問諸大臣皆不敢對思忠曰不可海陵不悅謂思忠曰汝勿論可否但云何時克之思忠曰以十年為期海陵曰何久也期月耳思忠曰太祖伐遼猶且數年今百姓愁怨師出無名江淮間暑熱湫濕不堪久居未能以歲月期也海陵怒顧視左右若欲取兵刃者思忠無所畏恐復曰老臣歷事四朝位至公相苟有補於國家死亦何憾有頃海陵曰自古帝王混一天下然後可為正統爾耄夫固不知此汝子乙迭讀書可往問之思忠曰臣昔見太祖取天下此時豈有文字耶臣年垂七十更事多矣彼乳臭子安足問哉海陵既不用思忠言運四方甲仗于中都思忠曰州郡無兵何以備盜賊海陵盡籍丁壯為兵思忠曰山後契丹諸部恐未可盡起皆不聽其後州郡盜起守令不能制契丹撒八窩斡果反期年乃克之當是時海陵伐宋祁宰諫而死張浩進言被杖思忠見疏孔彥舟畫策先取兩淮他無及者正隆六年思忠薨年七十三海陵深悼惜之親臨奠賻贈加等賜金螭頭車使者監護給道路費大定十二年詔復烏林荅贊謨官爵贈特進上謂宰臣曰贊謨忠實剛毅雖古人無以過與思忠有隙遂勸海陵殺之今思忠子孫皆不肖亦陰報也初思忠已構殺贊謨遂納其妻曹氏盡取其家財產章宗即位贊謨女五十九乞改葬詔賜葬地于懷州幷以思忠元取家貲付之謙本名乙迭累官御史中丞世宗謂之曰省部官受請託有以室家傳達者官刑不肅士風頹弊如此其糾正之初世宗至中都多放宮人還家有稱心等數人在放遣之例所司失於檢照不得出宮心常怏怏大定二年閏二月癸巳夜遂於十六位放火延燒太和神龍殿上命近臣迹火之所發十六位宮人袁六娘等六人告實稱心等為之稱心等伏誅賞賜袁六娘六人放出宮為良謙意宮殿被火將復興工役勞民傷財乃上表乞權紓修建上使張汝弼詔謙曰朕思正隆比年徭役百姓瘡痍未復邊事未息豈遽有營繕也卿可悉之久之襲父思忠濟州猛安利涉軍節度副使烏林荅鈔兀追捕逃軍至猛安中謙畏其擾乃醵民財買銀賂鈔兀事覺鈔兀抵罪謙坐奪猛安遇赦求上曰乙迭無自與贓使復其所耨盌溫敦兀帶太師思忠姪也天會間充女直字學生學問通達觀書史工為詩選為尚書省令史除右司都事轉行臺右司郎中入為左司員外郎累官同知大興尹京師盜賊止息事無留滯再遷刑部尚書改定海軍節度使除兵部尚書改吏部正隆伐宋為武定軍都總管世宗即位遣使召之授咸平尹為北邊行軍都統改會寧尹都統如故是時初定窩斡人心未安兀帶為治寬簡多備禦謹斥候邊郡以寧改北京留守以廉察舉兀帶所在有能名無私過由是入拜參知政事世宗諭之曰凡在卿上者行事或不當理咨禀不從卿以所見奏聞下位有可用之才當推薦之久之屬疾上命左宣徽使敬嗣暉往視遣醫治療薨年四十七上聞悼惜之賻銀千兩重綵四十端絹四百匹勅有司致祭久之上謂侍臣曰故參知政事兀帶刑部尚書彥忠滄州節度使兀不喝侍郎敵斡郎中骨皆為人忠直後進中少有能及之者朕樂得忠直之人有如兀帶輩者乎卿等為朕舉之其見思如此昂本名奔睹景祖弟孛黑之孫斜斡之子幼時侍太祖太祖令數人兩兩角力時昂年十五太祖顧曰汝能此乎對曰有命敢不勉遂連仆六人太祖喜曰汝吾宗弟也自今勿遠左右居數日賜金牌令佩以侍年十七太祖伐遼謂之曰汝可擐甲從軍矣昂遂佩所賜金牌從軍太祖平燕策功賜甲第一區天輔六年宗翰駐北安州聞遼主延禧在鴛鴦濼遣耨盌溫敦思忠請於國論勃極烈杲願以所部軍追之杲不能決乃遣昂與思忠詣宗翰議其事遂定天會二年南京叛軍帥闍母遣昂劉彥宗分兵討之宗望伐宋承制以為河南諸路兵馬都統稱金牌郎君及攻汴州宗弼與昂以兵三千為前鋒比暮昂先以兵千人馳至其北門時軍中遣使入城宋人不納昂諭之以事遂得入宗望至汴令闍母撻懶等屯于城之東北隅慮宋主遁去遣昂等率輕騎環城巡邏昂所領止八謀克遇敵萬人與戰敗之其步軍溺死於汴者過半七年大軍渡江敗宋兵於江上帥府遣昂等以兵追宋主宋主入會稽若為堅守計有兵數千列陣於郭東竹葦間諸將欲擊之昂曰此詐也不若急攻城不然將由他門逸去諸將猶豫未決而宋主果於他門以單舟入海不獲而還宗輔定陝西宗弼經略熙秦遣昂與撒离喝領兵八千攻取河西郡縣昂等遂取寧洮安隴二寨進至河州其通判率士民迎降攻樂州其都護及河州安撫使郭寧偕降復進取三寨至西寧州都護許居簡以城降吐蕃酋長之孫趙鈐轄率其所部木波首領五人來降昂別領軍四千往積石軍降其軍及所部五寨官吏追吐蕃鈐轄等十二人至廓州招之不下攻取之天眷元年授鎮國上將軍除東平尹明年夏宋將岳飛以兵十萬號稱百萬來攻東平東平有兵五千倉卒出禦之時桑柘方茂昂使多張旗幟於林間以為疑兵自以精兵陣于前飛不敢動相持數日而退昂勒兵襲之至清口飛衆泛舟逆水而去時霖雨晝夜不止昂乃附水屯營夜將半忽促衆北行諸將諫曰軍士遠涉泥淖饑憊未食恐難遽行昂怒不應鳴鼓督之下令曰鼓聲絕而敢後者斬遂棄營去幾二十里而止是夜宋人來劫營無所得而去諸將入賀且問其故昂曰沿流而下者走也泝流而上者誘我必追也今大雨泥淖彼舟行安我陸行勞士卒饑乏弓矢敗弱我軍居其下流勢不便利其襲我必矣衆皆稱善岳飛以兵十萬圍邳州甚急城中兵才千餘守將懼遣人求救昂曰為我語守將我嘗至下邳城中西南隅有塹深丈餘可速實之守將如其教填之岳飛果自此穴地以入知有備遂止昂舉兵以為聲援飛乃退在東平七年改益都尹遷東北路招討使改崇義軍節度使遷會寧牧天德初改安武軍節度使遷元帥右都監轉左監軍授上京路移里閔斡魯渾河世襲猛安海陵曰汝有大功一猛安不足酬也益以四謀克昂受親管謀克餘三謀克讓其族兄弟拜樞密副使轉太子少保進樞密使尚書左丞相昂怒族弟妻去衣杖其脊海陵聞之杖昂五十久之拜太尉封瀋國公進太保判大宗正事封楚國公累進封莒衞齊兼樞密使太保如故海陵南伐分諸路軍為三十二總管分隸左右領軍大都督府遂以昂為左領軍大都督海陵築臺于江上召昂及右領軍副大都督蒲盧渾謂之曰舟楫已具可以濟矣蒲盧渾曰舟小不可濟海陵怒詔昂與蒲盧渾明日先濟昂懼欲亡去抵暮海陵遣人止之曰前言一時之怒耳既而至揚州軍變海陵死世宗即位遼陽昂使人殺皇太子光英于南京遣其子寢殿小底宗浩與其壻牌印祗候回海等奉表賀登寶位大軍北還昂恐宋人躡其後即以罷兵移書于宋二年入見世宗深慰勞之進封漢國公拜都元帥太保如故置元帥府於山東經略邊事未幾奉遷睿宗皇帝梓宮於山陵以昂為勅葬使事畢還山東三年召至京師以疾薨年六十四上為輟朝親臨奠賻銀千兩重綵五十端絹五百匹昂在海陵時縱飲沉酣輒數日不醒海陵聞之常面戒不令飲得閒輒飲如故大定初還自揚州妻子為置酒私第未數行輒臥不飲其妻大氏海陵庶人從母姊也怪而問之昂曰吾本非啫酒者但向時不以酒自晦則汝弟殺我久矣今遇遭明時正當自愛是以不飲聞者稱之睦於兄弟尤善施予其親族有貧困者必厚給之至於茵帳衣衾器皿僕馬之屬常預設於家即命駕相就為具歡樂終日盡以遺之即日使富足人或以子孫計為言答曰人各有命但使其能自立爾何至為子孫奴耶君子以為達贊曰撒离喝溫敦思忠奔睹皆有功舊臣當天會皇統之際戰勝攻取可謂壯哉及海陵之世崎嶇嫌忌撒离喝既自以言致疑猶與大辨爭軍事何見幾之不早也烏林荅贊謨廉直自奮思忠擠之於死自謂固結海陵堅若金石豈意執議不合而遽棄耶始之不以道未有能終者也且思忠之最可罪者構害贊謨又納其室而敓其貲此何異於殺越人于貨者乎陰報不在其身在其子孫亦已晚矣正隆之末奔睹位三公居上將內不肯與謀外不肯與戰逼側趑趄苟免自全大臣之道固若是乎高楨遼陽渤海人五世祖牟翰仕遼官至太師楨少好學嘗業進士斡魯討高永昌已下瀋州永昌懼偽送款以緩師是時楨母在瀋州遂來降告以永昌降款非誠斡魯及進攻既破永昌遂以楨同知東京留守事授猛安天會六年遷尚書左僕射判廣寧尹加太子太傅在鎮八年政令清肅吏畏而人安之十五年加太子太師提點河北西路錢帛事天眷初同簽會寧牧及熙宗幸燕兼同知留守封戴國公改同知燕京留守魏王道濟出守中京以楨為同判俄改行臺平章政事為西京留守封任國公是時奚霫軍民皆南徙謀克別术者因之嘯聚為盜海陵患之即以楨為中京留守命乘驛之官責以平賊之期賊平封河內郡王海陵至中京楨警夜嚴肅有近侍馮僧家奴李街喜等皆得幸海陵嘗夜飲干禁楨杖之瀕死由是權貴皆震懾遷太子太保行御史大夫封莒王策拜司空進封代王太子太保行御史大夫如故楨久在臺彈劾無所避每進對必以區別流品進善退惡為言當路者忌之薦張忠輔馬諷為中丞二人皆險詖深刻欲令以事中楨正隆例封冀國公楨因固辭曰臣為眾小所嫉恐不能免尚可受封爵耶海陵知其忠直慰而遣之及疾革書空獨語曰某事未決某事未奏死有餘恨薨年六十九海陵悼惜之遣使致奠賻贈加等楨性方嚴家居無聲伎之奉雖甚暑未嘗解衣緩帶對妻孥危坐終日不一談笑其簡默如此白彥敬本名遙設部羅火部族人初名彥恭避顯宗諱改焉祖屋僕根父阿斯仕遼為率府率彥敬善騎射起家為吏補元帥府令史伐宋為錢帛司都管勾立三省選為尚書省令史除都元帥府知事招諭諸部授以金牌行數千里有功超遷兵部郎中熙宗罷統軍司改招討司遣彥敬分僚屬收牌印諭諸部隸招討司還為本部侍郎遷大理卿出為通州防禦使改刑部侍郎怨家告誣開府慎思與西北路部族謀叛彥敬鞫得其實海陵嘉之遷簽書樞密院事以便宜措置邊防正隆六年調諸路兵伐宋及調民馬使彥敬主會寧蒲與胡里改三路事改吏部尚書充南征萬戶遷樞密副使契丹撒八反樞密使僕散忽土等以無功坐誅以彥敬為北面行營都統與副統紇石烈志寧以便宜往賜御服皮襖行至北京聞南征諸軍逃歸者皆奔東京欲推戴世宗彥敬與志寧謀陰結會寧尹完顏蒲速賚利涉軍節度使獨吉義以圖之世宗已即位使石抹移迭移剌曷補等九人招彥敬志寧彥敬拒之使移迭跪移迭不屈皆殺之及完顏謀衍將兵攻北京彥敬使偏將率兵拒於建州之境而獨吉義先歸世宗蒲速賚稱疾不至世宗密遣人乘夜揭牓於北京市購以官賞彥敬志寧恐為人圖己遂降以為曷速館節度使不數月召為御史大夫窩斡僭帝號諸軍馬瘦弱遣彥敬往西北路招討司市馬得六千餘匹窩斡敗西走山後完顏思敬以新馬三千備追襲彥敬屯于夏國兩界間窩斡平召還為兵部尚書出為鳳翔尹改太原尹兼河北東路兵馬總管尋改河中尹大定九年卒于官張景仁字壽甫遼西人累官翰林待制貞元二年與翟永固俱試禮部進士以尊祖配天為賦題忤海陵旨語在永固傳大定二年僕散忠義伐宋景仁掌其文辭宋人議和朝廷已改奉表為國書稱臣為姪但不肯世稱姪國往復凡七書然後定其書皆景仁為之世宗稱其能嘗曰今之文章如張景仁與宋人往復書指事達意辨而裁真能文之士也五年罷兵入為翰林直學士七年遷侍講八年為詳讀官宋國書中有寶鄰字景仁奏鄰字太涉平易上問累年國書有鄰字否命一一校勘六年書中亦有之上責問六年詳讀官劉仲淵右丞石琚亦請罪曰臣嘗預六年詳讀上曰此有司之過安得一一責宰臣邪詔有司就諭宋臣王瀹使歸告其主後日國書不得復爾仲淵時為禮部侍郎降石州刺史景仁遷翰林學士兼同修國史久之上召景仁讀陳言文字上問事款幾何景仁率易少周密對曰二十餘事復曰其中如某事某事十事可行餘皆無謂也明日上召景仁責之曰卿昨言可行者朕觀之中復有不可行者卿謂無謂者中亦有可行者朕未嘗使卿分別可否卿輒專可否何也自今戒之十年兼太常卿學士同修國史如故轉承旨兼修國史改河南尹二十一年召為御史大夫仍兼承旨修國史世宗謂景仁曰卿博學老儒求如古之御史大夫然後行之斯為稱矣不能如古之人衆人不獨誚卿亦謂朕不能知人卿醉中頗輕脫失言當以酒為戒初朝臣言景仁有文藝而頗率易不可任臺察景仁被詔就臺中治監察罪輒以便服視決罰上聞之責景仁曰朕初用卿為大夫或言卿不可居此官今果不用故事率易如此卿自慎不然黜罰及矣景仁頓首謝未幾詔葬元妃李氏于海王莊平章政事烏古論元忠提控葬事都水監丞高杲壽治道路不如式元忠不奏決之四十景仁劾奏元忠輒斷六品官無人臣禮上曰卿劾奏甚當使左宣徽使蒲察鼎壽傳詔戒勅元忠曰監丞六品有罪聞奏今乃一切趨辦擅決六品官法當如是耶御史在尊朝廷汝當自咎勿復再元忠尚豫國公主怙寵自任倨慢朝士景仁劾之朝廷肅然是歲薨贊曰高楨以舊勞為御史大夫剛明自任繩治無所避幾不免於怨憎之荼毒直己而行自古難之白彥敬不受大定之詔而世宗賢之嚮使久在此位其深謀讜論必有竦動人者張景仁儒者之勇廷論元忠正矣
