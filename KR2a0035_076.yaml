body:
  text: 金史卷七十六列傳第十四太宗諸子宗磐本名蒲魯虎宗固本名胡魯宗本本名阿魯蕭玉附杲本名斜也宗義本名孛吉宗幹本名斡本充本名神土悶子檀奴等永元本名元奴兗本名梧桐襄本名永慶袞本名蒲甲太宗子十四人蒲魯虎胡魯斛魯補阿魯帶阿魯補斛沙虎阿鄰阿魯鶻懶胡里甲神土門斛孛束斡烈鶻沙宗磐本名蒲魯虎天輔五年都統杲取中京宗磐與斡魯宗翰宗幹皆為之副天會十年為國論忽魯勃極烈熙宗即位為尚書令封宋國王未幾拜太師與宗幹宗翰並領三省事熙宗優禮宗室宗翰沒後宗磐日益跋扈嘗與宗幹爭論於上前即上表求退烏野奏曰陛下富於春秋而大臣不協恐非國家之福熙宗因為兩解宗磐愈驕恣其後於熙宗前持刀向宗幹都點檢蕭仲恭呵止之既而左副元帥撻懶東京留守宗雋入朝宗磐陰相黨與而宗雋遂為右丞相用事撻懶屬尊功多先薦劉豫立為齊帝至是唱議以河南陝西與宋使稱臣熙宗命羣臣議宗室大臣言其不可宗磐宗雋助之卒以與宋其後宗磐宗雋撻懶謀作亂宗幹希尹發其事熙宗下詔誅之坐與宴飲者皆貶削決責有差赦其弟斛魯補等九人並赦撻懶出為行臺左丞相皇后生日宰相諸王妃主命婦入賀熙宗命去樂曰宗磐等皆近屬輒搆逆謀情不能樂也以黃金合及兩銀鼎獻明德宮太皇太后並以金合銀鼎賜宗幹希尹焉宗固本名胡魯天會十五年為燕京留守封豳王宗雅本名斛魯補封代王宗偉本名阿魯補封虞王宗英本名斛沙虎封滕王宗懿本名阿鄰封薛王宗本本名阿魯封原王鶻懶封翼王宗美本名胡里甲封豐王神土門封鄆王斛孛束封霍王斡烈封蔡王宗哲本名鶻沙封畢王皆天眷元年受封宗順本名阿魯帶天會二年薨皇統五年贈金紫光祿大夫後封徐王宗磐既誅熙宗使宗固子京往燕京慰諭宗固既而翼王鶻懶復與行臺左丞相撻懶謀反伏誅詔曰燕京留守豳王宗固等或謂當絶屬籍朕所不忍宗固等但不得稱皇叔其母妻封號從而降者審依舊典皇統二年復封宗雅為代王宗固為判大宗正六年為太保右丞相兼中書令是歲薨海陵在熙宗時見太宗諸子勢強而宗磐尤跋扈與鶻懶相繼皆以逆誅心忌之熙宗厚於宗室禮遇不衰海陵嘗與秉德唐括辨私議主上不宜寵遇太宗諸子太甚及篡立謁奠太廟韓王亨素號材武使攝右衛將軍密諭之曰爾勿以此職為輕朕疑太宗諸子太強得卿衛左右可無慮耳遂與祕書監蕭裕謀去宗本兄弟太宗子孫於是焉盡語在宗本傳中宗本本名阿魯皇統九年為右丞相兼中書令進太保領三省事海陵篡立進太傅領三省事初宗幹謀誅宗磐故海陵心忌太宗諸子熙宗時海陵私議宗本等勢強主上不宜優寵太甚及篡立猜忌益深遂與祕書監蕭裕謀殺太宗諸子誣以秉德出領行臺與宗本別因會飲約內外相應使尚書省令史蕭玉告宗本親謂玉言以汝於我故舊必無它意可布腹心事領省臨行言彼在外諭説軍民無以外患為慮若太傅為內應何事不成又云長子鎖里虎當大貴因是不令見主上宗本又言左丞相於我及我妃處稱主上近日見之輒不喜故心常恐懼若太傅一日得大位此心方安唐括辨謂宗本言內侍張彥善相相太傅有天子分宗本答曰宗本有兄東京留守在宗本何能為是時宗美言太傅正是太宗主家子秪太傅便合為北京留守卞臨行與宗本言事不可遲宗本與玉言大計只於日近圍場內豫決宗本因以馬一匹袍一領與玉充表識物玉恐圍場日近身縻於外不能親奏遂以告祕書監蕭裕裕具以聞蕭玉出入宗本家親信如家人海陵既與蕭裕謀殺宗本秉德詔天下恐天下以宗本秉德輩皆懿親大臣本無反狀裕搆成其事而蕭玉與宗本厚人所共知使玉上變庶可示信於是使人召宗本等擊鞠海陵先登樓命左衛將軍徒單特思及蕭裕妹壻近侍局副使耶律闢離剌小底密伺宗本及判大宗正事宗美至即殺之宗美本名胡里甲臨死神色不變宗本已死蕭裕使人召蕭玉是日玉送客出城醉酒露髮披衣以車載至裕弟點檢蕭祚家逮日暮玉酒醒見軍士圍守之意為人所纍得罪故至此以頭觸屋壁號咷曰臣未嘗犯罪老母年七十願哀憐之裕附耳告之曰主上以宗本諸人不可留已誅之矣欲加以反罪令汝主告其事今書汝告款已具上即問汝汝但言宗本輩反如狀勿復異詞恐禍及汝家也裕乃以巾服與玉引見海陵海陵問玉玉言宗本反具如裕所教海陵遣使殺東京留守宗懿北京留守卞及遷益都尹畢王宗哲平陽尹稟左宣徽使京等家屬分置別所止聽各以奴婢五人自隨既而使人要之於路並其子男無少長皆殺之而中京留守宗雅喜事佛世稱善大王海陵知其無能將存之以奉太宗後召至闕不數日竟殺之太宗子孫死者七十餘人太宗後遂絶卞本名可喜稟本名胡離改京宗固子本名胡石賚蕭玉既如蕭裕教對海陵海陵遂以宗本秉德等罪詔天下以玉上變實之海陵使太府監完顏馮六籍宗本諸家戒之曰珠玉金帛入於官什器吾將分賜諸臣馮六以此不復拘籍什器往往為人持去馮六家童亦取其檀木屏風少監劉景前為監丞時太府監失火案牘盡焚毀數月方取諸司簿帳補之監吏坐是稽緩當得罪景為吏倒署年月太倉都監焦子忠與景有舊坐逋負久不得調景為盡力出之久之馮六與景就宮中相忿爭馮六言景倒署年月及出焦子忠事御史劾奏景景黨誘馮六家奴發盜屏事馮六自陳於尚書省海陵使御史大夫趙資福大理少卿許竑雜治資福等奏馮六非自盜又嘗自首海陵素惡馮六與宗室遊從謂宰臣曰馮六嘗用所盜物其自首不及此法盜宮中物者死諸物已籍入官與宮中物何異謂馮六曰太府掌宮中財賄汝當防制姦欺而自用盜物於是馮六棄市資福竑坐鞫獄不盡決杖有差景亦伏受焦子忠賂金海陵曰受金事無左驗景倒署年月以免吏罪是不可恕遂殺之大定二年追封宗固魯王宗雅曹王宗順隋王宗懿鄭王宗美衛王宗哲韓王宗本潞王神土門豳王斛孛束瀋王斡烈鄂王胡里改胡什賚可喜並贈金吾衛上將軍惟宗磐阿魯補斛沙虎鶻懶四人不復加封蕭玉奚人既從蕭裕誣宗本罪海陵喜甚自尚書省令史為禮部尚書加特進賜錢二千萬馬五百匹牛五百頭羊千口數月為參知政事丁母憂以參政起復俄授猛安子尚公主海陵謂玉曰朕始得天下常患太宗諸子方強賴社稷之靈卿發其姦朕無以報此功使朕女為卿男婦代朕事卿也賜第一區分宗本家資賜之頃之代張浩為尚書右丞拜平章政事進拜右丞相封陳國公文思署令閻拱與太子詹事張安妻坐姦事獄具不應訊而訊之海陵怒玉與左丞蔡松年右丞耶律安禮御史中丞馬諷決杖有差玉等入謝罪海陵曰為人臣以己意愛憎妄作威福使人畏之如唐魏徵狄仁傑姚崇宋璟豈肯立威使人畏哉楊國忠之徒乃立威使人畏耳顧謂左司郎中吾帶右司郎中梁銶曰往者德宗為相蕭斛律為左司郎中趙德恭為右司郎中除吏議法多用己意汝等能不以己意愛憎為豫奪輕重不亦善乎朕信任汝等有過則決責之亦非得已古者大臣有罪貶謫數千里外往來疲於奔走有死道路者朕則不然有過則杖之已杖則任之如初如有不可恕或處之死亦未可知汝等自勉正隆三年拜司徒判大宗正事五年玉以司徒兼御史大夫使參知政事李通諭旨曰判宗正之職固重御史大夫尤難其人朕將行幸南京官吏多不法受賕卿宜專糾劾細務非所責也御史大夫與宰執不相遠朕至南京徐當思之繼以司徒判大興尹玉固辭司徒海陵曰朕將南巡京師地重非大臣不能鎮撫留卿居守無為多讓海陵至南京以玉為尚書左丞相進封吳國公海陵將伐宋因賜羣臣宴顧謂玉曰卿嘗讀書否對曰亦嘗觀之中宴海陵起即召玉至內閣因以漢書一册示玉既而擲之曰此非所問也朕欲與卿議事朕今欲伐江南卿以為如何玉對曰不可海陵曰朕視宋國猶掌握間耳何為不可玉曰天以長江限南北舟楫非我所長苻堅百萬伐晉不能以一騎渡以是知其不可海陵怒叱之使出及張浩因周福兒附奏海陵杖張浩並杖玉因謂羣臣曰浩大臣不面奏因人達語輕易如此玉以苻堅比朕朕欲斷其舌釘而磔之以玉有功隱忍至今大臣決責痛及爾體如在朕躬有不能已者汝等悉之及海陵自將發南京玉與張浩留治省事世宗即位降奉國上將軍放歸田里奪所賜家産久之起為孟州防禦使世宗戒之曰昔海陵欲殺太宗子孫借汝為證遂被進用朕思海陵肆虐先殺宗本諸人然後用汝質成其事豈得專罪汝等今復用汝當思改過若謂嘗居要地以今日為不足必罰無赦轉定海軍節度使改太原尹與少尹烏古論掃喝互訟不公事各削一官解職尋卒子德用大定二十四年尚書省奏玉子德用當升除上曰海陵假口于玉以快其毒玉子豈可升除邪贊曰宗磐嘗從斜也取中京不可謂無勞伐者世祿鮮禮自古有之在國家善為保全之道耳熙宗殺宗磐而存恤其母后雖云矯情猶畏物論海陵造謀殺宗本兄弟不遺餘力太宗舉宋而有中原金百世不遷之廟也再傳而無噍類於是太祖之美意無復幾微存者春秋之世宋公舍與夷而立其弟禍延數世害及五國誠足為後世監乎杲本名斜也世祖第五子太祖母弟收國元年太宗為諳班勃極烈杲為國論勃極烈天輔元年杲以兵一萬攻泰州下金山縣女固脾室四部及渤海人皆來降遂克泰州城中積粟轉致烏林野賑先降諸部因徙之內地天輔五年為忽魯勃極烈都統內外諸軍取中京實北京也蒲家奴宗翰宗幹宗磐副之宗峻領合扎猛安皆受金牌耶律余睹為鄉導詔曰遼政不綱人神共棄今欲中外一統故命汝率大軍以行討伐爾其慎重兵事擇用善謀賞罰必行糧餉必繼勿擾降服勿縱俘掠見可而進無淹師期事有從權毋煩奏稟復詔曰若克中京所得禮樂圖書文籍並先次津發赴闕當是時遼人守中京者聞知師期焚芻糧欲徙居民遁去奚王霞末則欲視我兵少則迎戰若不敵則退保山西杲知遼人無鬬志乃委輜重以輕兵擊之六年正月克高恩回紇三城進至中京遼兵皆不戰而潰遂克中京獲馬一千二百牛五百駝一百七十羊四萬七千車三百五十兩乃分兵屯守要害之地駐兵中京使使奏捷獻俘詔曰汝等提兵于外克副所任攻下城邑撫安人民朕甚嘉之分遣將士招降山前諸部計已撫定山後若未可往即營田牧俟秋大舉更當熟議見可則行如欲益兵具數來上無恃一戰之勝輒自弛慢善撫存降附宣諭將士使知朕意完顏歡都遊兵出中京南遇騎兵三十餘紿曰乞明旦來降于此杲信之使溫迪痕阿里出納合鈍恩蒲察婆羅偎諸甲拔剔鄰往迎之奚王霞末兵圍阿里出等遂據坂去馬皆殊死戰敗霞末兵追殺至暮而還是役納合鈍恩功為多宗翰降北安州希尹獲遼護衛習泥烈言遼主在鴛鴦濼畋獵可襲取之宗翰移書于杲請進兵使者再往曰一失機會事難圖矣杲意尚未決宗幹勸杲當從宗翰策杲乃約宗翰會奚王嶺既會始定議杲出青嶺宗翰出瓢嶺期羊城濼會軍時遼主在草濼使宗翰與宗幹率精兵六千襲之遼主西走其都統馬哥趨搗里宗翰遣撻懶以兵一千往擊之撻懶請益兵于都統杲而獲遼樞密使得里底父子西京已降復叛杲使招之不從遂攻之留守蕭察剌踰城降四月復取西京杲率大軍趨白水濼分遣諸將招撫未降州郡及諸部族於是遼秦晉國王耶律捏里自立于燕京山西諸城雖降而人心未固杲遣宗望奏事仍請上臨軍耶律坦招西南招討司及所屬諸部西至夏境皆降耶律佛頂亦降于坦金肅西平二郡漢軍四千叛去坦與阿沙兀野撻不野簡料新降丁壯逮夜襲之詰旦戰于河上大敗其衆皆委仗就擒耶律捏里移書于杲請和杲復書責以不先稟命上國輒稱大號若能自歸當以燕京留守處之捏里復以書來其略曰昨即位時在兩國絶聘交兵之際奚王與文武百官同心推戴何暇請命今諸軍已集儻欲加兵未能束手待斃也昔我先世未嘗殘害大金人民寵以位號日益強大今忘此施欲絶我宗祀於義何如也儻蒙惠顧則感戴恩德何有窮已杲復書曰閣下向為元帥總統諸軍任非不重竟無尺寸之功欲據一城以抗國兵不亦難乎所任用者前既不能死國今誰肯為閣下用者而云主辱臣死欲恃此以成功計亦疏矣幕府奉詔歸者官之逆者討之若執迷不從期于殄滅而後已捏里乃遣使請于太祖賜捏里詔曰汝遼之近屬位居將相不能與國存亡乃竊據孤城僭稱大號若不降附將有後悔六月上發京師詔都統曰汝等欲朕親征已於今月朔旦啓行遼主今定何在何計可以取之其具以聞杲使馬和尚奉迎太祖于撻魯河斡魯婁室敗夏將李良輔杲使完顏希尹等奏捷且請徙西南招討司諸部于內地希尹等見上于大濼西南上嘉賞之上至鴛鴦濼杲上謁上追遼主至回離畛川南伐燕京次奉聖州詔曰自今諸訴訟書付都統杲決遣若有大疑即令聞奏太祖定燕京還次鴛鴦濼以宗翰為都統杲從上還京師太宗即位杲為諳班勃極烈與宗幹俱治國政天會三年伐宋杲領都元帥居京師宗翰宗望分道進兵四年再伐宋獲宋二主以歸天會八年薨皇統三年追封遼越國王天德二年配享太祖廟廷正隆例封遼王大定十五年諡曰智烈子孛吉宗義本名孛吉斜也之第九子天德間為平章政事海陵已殺太宗子孫尤忌斜也諸子盛強欲盡除宗室勳舊大臣是時左副元帥撒離喝在汴京與撻不野有隙撻不野女為海陵妃海陵陰使撻不野圖撒離喝於是都元帥府令史遙設迎合風指詐為撒離喝與其子宗安家書宗安誤遺宮外遙設因拾得之以上變其書契丹小字其封題已開其中白紙一幅有白字隱約狀若經水浸致字畫可讀者上有撒離喝手署及某王印書辭云阿渾汝安樂否早晚到闕下前者走馬來時曾議論我教汝阿渾平章謀里野阿渾等處覷事勢再通往來緩急圖謀知汝已嘗備細言之謀里野阿渾所言是只殺撻不野則南路無憂慮矣詳略互見撒離喝傳中女直謂子阿渾前阿渾謂撒離喝子其子宗安後阿渾平章指宗義宗義本宗室子猶有舊稱以是殺宗義謀里野並殺宗安及太祖妃蕭氏任王隈喝及魏王斡帶孫活里甲遙設詐書無活里甲海陵見其坦率善修飾惡之大臣以無罪為請海陵曰第殺之無復言也殺斜也子孫百餘人謀里野子孫二十餘人謀里野景祖孫謾都訶次子斜也有幼子阿虎里其妻撻不野女海陵妃大氏女兄將殺阿虎里使者不忍見其面以衾覆而縊之當其頤久不死及去被再縊之海陵遣使赦其死遂得免後封為王授世襲千戶大定初追復宗義官爵贈特進弟蒲馬孛論出阿魯隈喝並贈龍虎衛上將軍宗幹本名斡本太祖庶長子太祖伐遼遼人來禦遇于境上使宗幹率衆先往填塹士卒畢渡渤海軍馳突而前左翼七謀克少却遂犯中軍杲輒出戰太祖曰遇大敵不可易也使宗幹止杲宗幹馳出杲前控止導騎哲垤之馬杲乃還達魯古城之戰宗幹以中軍為疑兵太祖既攻下黃龍府即欲取春州遼主聞黃龍不守大懼即自將籍宗戚豪右少年與四方勇士及能言兵者皆隸軍中宗幹勸太祖毋攻春州休息士卒太祖以為然遂班師宗幹得降人言春泰州無守備可取於是斜也取春泰州宗雄宗幹等下金山縣宗雄即以兵三千屬宗幹招集未降諸部宗幹擇土人之材幹者以詔書諭之於是女固脾室四部及渤海人皆降太祖克臨潢府至沃黑河宗幹諫曰地遠時暑士罷馬乏若深入敵境糧餫不繼恐有後艱上從之遂班師從都統杲取中京宗翰自北安州移書于杲是時希尹獲遼人知遼主在鴛鴦濼可襲取之杲不能決宗翰使再至宗幹謂杲曰移賚勃極烈灼見事機再使來請彼必不輕舉且彼已發兵不可中止請從其策再三言之杲乃報宗翰會奚王嶺當時無宗幹杲終無進兵意既會軍于羊城濼杲使宗幹與宗翰以精兵六千襲遼至五院司遼主已遁去與遼將耿守忠戰于西京城東四十里守忠敗走太宗即位宗幹為國論勃極烈與斜也同輔政天會三年獲遼主于應州西余睹谷始議禮制度正官名定服色興庠序設選舉治曆明時皆自宗幹啓之四年官制行詔中外十年熙宗為諳班勃極烈宗幹為國論左勃極烈熙宗即位拜太傅與宗翰等並領三省事天眷二年進太師封梁宋國王入朝不拜策杖上殿仍以杖賜之宗幹有足疾詔設坐奏事無何監修國史皇統元年賜宗幹輦輿上殿制詔不名上幸燕京宗幹從有疾上親臨問自燕京還至野狐嶺宗幹疾亟不行上親臨問語及軍國事上悲泣不已明日上及后同往視后親與宗幹饋食至暮而還因赦罪囚與宗幹禳疾居數日薨上哭之慟輟朝七日大臣死輟朝自宗幹始上致祭是日庚戌太史奏戌亥不宜哭上不聽曰朕幼沖時太師有保傅之力安得不哭哭之慟上生日不舉樂上還上京幸其第視殯事及喪至上京上臨哭之及葬臨視之海陵篡立追諡憲古弘道文昭武烈章孝睿明皇帝廟號德宗以故第為興聖宮大定二年除去廟號改諡明肅皇帝及海陵廢為庶人二十二年皇太子允恭奏略曰追惟熙宗世嫡統緒海陵無道弒帝自立崇正昭穆削其煬王俾齒庶人之列瘞之間曠不封不樹既已申大義而明至公矣海陵追崇其親逆配於廟今海陵既廢為庶人而明肅猶竊帝尊之名列廟祧之數海陵大逆正名定罪明肅亦當緣坐是時明肅已殂不與於亂臣以謂當削去明肅帝號止從舊爵或從太祖諸王有功例加以官封明詔中外俾知大義書奏世宗嘉納下尚書省議於是追削明肅帝號封為皇伯太師遼王諡忠烈妻子諸孫皆從降明昌四年配享太祖廟廷子充亮兗襄袞亮是為海陵庶人充本名神土悶母李氏徒單氏以為己子熙宗初加光祿大夫天眷間為汴京留守皇統間封淄國公為吏部尚書進封代王遷同判大宗正事九年拜左丞相是歲薨追封鄭王大定二十二年追降儀同三司左丞相子檀奴元奴耶補兒阿里白檀奴為歸德軍節度使阿里白定遠大將軍和魯忽土猛安忽鄰河謀克海陵弒徒單氏以充嘗為徒單養子因並殺檀奴及阿里白元奴耶補兒逃歸于世宗檀奴贈榮祿大夫阿里白輔國上將軍詔有司改葬世宗時元奴為宗正丞耶補兒為鎮國上將軍後為同知濟南尹事永元字惇禮本名元奴幼聰敏日誦千言皇統元年試宗室子作詩永元中格善左氏春秋通其大義天德初授百女山世襲謀克海陵伐宋已渡淮軍士多亡歸而契丹叛由是疑宗室益甚已殺永元弟檀奴阿里白永元與弟耶補兒逃匿得免世宗即位于遼陽與耶補兒俱來歸上慰勞甚厚授宗正丞改符寶郎為灤州刺史授世襲猛安乞以謀克與耶補兒詔許之轉棣州防禦使泰寧軍節度使張弘信通檢山東專以多得民間物力為功督責苛急永元面責弘信曰朝廷以差調不均立通檢法今使者所至以殘酷妄加農民田産箠擊百姓有至死者市肆賈販貿易有贏虧田園屋宇利入有多寡故官子孫閉門自守使與商賈同處上役豈立法本意哉弘信無以對於是棣州賦稅得以實自占遷震武軍節度使大定六年丁母憂起復崇義軍節度使徙順義軍朔州西境多盜而猾吏大姓蠹獄訟暋亂賦役永元剔其宿姦百姓安之坐賣馬與驛人取贏利及濬州防禦使斡論坐縱孳畜踐民田俱解職頃之永元起為保大軍節度使歷昭義絳陽震武軍遷濟南尹北京副留守寧國家婢醜底與咸平人化胡有姦醜底於主印處紿取印署空紙與化胡遂寫作永元寧國生日時辰誣告永元寧國謀逆詔有司鞫問乃醜底意望為良使化胡為之上曰化胡與醜底有姦造作惡言誣害宗室化胡斬醜底處死改興中尹為彰德軍節度使卒官年五十一喪過中都遣使致祭賻銀三百兩綵十端絹百匹永元歷典大藩多知民間利害所至稱治相棣順義政迹尤著其民並為立祠兗本名梧桐皇統七年為左副點檢轉都點檢九年為會寧牧改左宣徽使海陵篡立兗使宋還拜司徒兼都元帥領三省事進拜太尉及殺太祖妃蕭氏盡以其財産賜兗罷都元帥府立樞密院兗為樞密使太尉領三省事如故天德四年十二月晦薨明日貞元元年元旦海陵為兗輟朝不受賀宋夏高麗回鶻賀正旦使命有司受其貢獻追進兗王爵大定二十二年追降特進兗妻烏延氏正隆六年坐與奴有姦海陵殺之其弟南京兵馬副都指揮使習泥烈私于族弟屋謀魯之妻屋謀魯之奴謀欲執習泥烈習泥烈乃殺其奴海陵聞之遂殺習泥烈兗子阿合大定中為符寶祗候俄遷同知定武軍節度使上曰汝歲秩未滿朕念乃祖乃父為汝遷官勿為不善當盡心學之襄本名永慶海陵母弟為輔國上將軍卒天德二年追封衛王再贈司徒大定二十二年追降銀青光祿大夫子和尚封應國公賜名樂善左宣徽使許霖之子知彰與和尚鬬爭其母妃命家奴捽入凌辱之使人曳霖至第毆詈之明日霖訴于朝詔大興尹蕭玉左丞良弼權御史大夫張忠輔左司員外郎王全雜治妃杖一百殺其家奴為首者餘決杖有差霖嘗跪于妃前失大臣體及所訴有妄笞二十大定間家奴小僧月一妄言和尚熟寢之次有異徵襄妃僧酷以為信然召日者李端卜之端云當為天子司天張友直亦云當大貴家奴李添壽上變僧酷和尚下吏驗問有狀皆伏誅上曰朕嘗痛海陵翦滅宗族今和尚所為如此欲貸其罪則妖妄誤惑愚民者便以為真不可不滅朕於此子蓋不得已也傷閔者久之袞本名蒲甲亦作蒲家桀驁強悍海陵不喜其為人初為輔國上將軍天德初加特進封王為吏部尚書判大宗正事坐語禁中起居狀兵部侍郎蕭恭首問護衛張九具言之海陵親問恭奪官解職張九對不以實特處死袞與翰林學士承旨宗秀護衛麻吉小底王之章皆決杖有差海陵自是愈忌之未幾授猛安及遷中都道中以蒲家為西京留守西京兵馬完顏謨盧瓦與蒲家有舊同在西京遂相往來蒲家嘗以玉帶遺之蒲家稱謨盧瓦驍勇不減尉遲敬德編修官圓福奴之妻與蒲家姻戚圓福奴嘗戒蒲家曰大王名太彰著宜少謙晦蒲家心知海陵忌之嘗召日者問休咎家奴喝里知海陵疑蒲家乃上變告之言與謨盧瓦等謀反嘗召日者問天命御史大夫高楨刑部侍郎耶律慎須呂就西京鞫之無狀海陵怒使使者往械蒲家等至中都不復究問斬之于市謨盧瓦圓福奴並日者皆凌遲處死贊曰金議禮制度班爵祿正刑法治曆明時行天子之事成一代之典杲宗幹經始之功多矣杲子宗義為海陵所殺宗幹之後又不幸而有海陵故其子孫之昌熾既鮮而亦不免於僇辱焉秦漢而下宗臣世家與國匹休者何其少歟君子於此可以觀世變矣
