body:
  text: 金史卷八十六列傳第二十四李石子獻可完顏福壽獨吉義烏延蒲離黑烏延蒲轄奴烏延查剌李師雄尼厖古鈔兀孛术魯定方夾谷胡剌蒲察斡論夾谷查剌李石字子堅遼陽人貞懿皇后弟也先世仕遼為宰相高祖仙壽嘗脫遼主之舅於難遼帝賜仙壽遼陽及湯池地千頃他物稱是常以李舅目之父雛訛只桂州觀察使高永昌據東京率衆攻之不勝而死石敦厚寡言而器識過人天會二年授世襲謀克為行軍猛安睿宗為右副元帥引置軍中屬之宗弼八年除禮賓副使轉洛苑副使天眷元年置行臺省於汴石為汴京都巡檢使歷大名少尹汴京馬軍副都指揮使纍官景州刺史海陵營建燕京宮室石護役皇城端門海陵遷都燕京石隨例入見海陵指石曰此非葛王之舅乎葛王謂世宗也未幾除興中少尹石知海陵忌宗室頗歉前日之言秩滿託疾還鄉里世宗留守東京禦契丹括里石留東京巡察城中海陵使副留守高存福伺察世宗動靜知軍李蒲速越知存福謀以告世宗石因勸世宗先除存福然後舉事世宗從之大定元年以定策功為戶部尚書無何拜參知政事阿瑣殺同知中都留守蒲察沙離只遣使奉表東京而羣臣多勸世宗幸上京者石奏曰正隆遠在江淮寇盜𧔧起萬姓引領東向宜因此時直赴中都據腹心以號令天下萬世之業也惟陛下無牽於衆惑上意遂決即日啓行世宗納石女後宮生鄭王永蹈衛紹王永濟是為元妃李氏三年戶部尚書梁銶上言大定以前官吏士卒俸粟支帖真偽相雜請一切停罷石買革去舊貼下倉支粟倉司不敢違以新粟與之上聞其事以問梁銶梁銶對不以實上命尚書左丞翟永固鞫之梁銶削官四階降知火山軍石罷為御史大夫久之封道國公六年上幸西京石與少詹事烏古論三合守衛中都宮闕詔曰京師巡禦不可不嚴近都猛安內選士二千人巡警仍給口豢芻粟謂宰臣曰府庫錢幣非徒聚貨也若軍士貧弱百姓困乏所費雖多豈可已哉故事凡行幸留守中都官每十日表問起居上以使傳頻煩命二十日一進表七年拜司徒兼太子太師御史大夫如故賜第一區安化軍節度使徒單子溫平章政事合喜之姪也贓濫不法石即劾奏之方石奏事宰相下殿立俟良久既退宰相或問石奏事何久石正色曰正為天下姦污未盡誅耳聞者悚然一日上謂石曰御史分別庶官邪正卿等惟劾有罪而未嘗舉善也宜令監察分路刺舉善惡以聞石司憲既久年寖高御史臺奏事有在制前斷定乞依新條改斷者上曰若在制前行者豈可改也上御香閣召中丞移剌道謂之曰李石耄矣汝等宜盡心向所奏事甚不當豈涉於私乎他日又謂石曰卿近纍奏皆常事臣下善惡邪正無語及之卿年老矣不能久居此若能舉一二善事亦不負此職也十年進拜太尉尚書令詔曰太后兄弟惟卿一人故命領尚書事軍國大事涉於利害議其可否細事不煩卿也進封平原郡王平章政事完顏守道奏事石神色不懌世宗察之謂石曰守道所奏既非私事卿當共議可否在上位者所見有不可順而從之在下位者所見雖當則遽不從乎豈可以與己相違而蓄怒哉如此則下位者誰敢復言石對曰不敢上曰朕欲於京府節鎮運司長佐三員內任文臣一員尚未得人石奏曰資考未至不敢擬上曰近觀節度轉運副使中才能者有之海陵時省令史不用進士故少尹節度轉運副使中乏人大定以來用進士亦頗有人矣節度轉運副使中有廉能者具以名聞朕將用之朝官不歷外任無以見其才外官不歷隨朝無以進其才中外更試庶可得人他日上復問曰外任五品職事多闕何也石對曰資考少有及者上曰苟有賢能當不次用之對不稱旨上表乞骸骨以太保致仕進封廣平郡王十六年薨上輟朝臨弔哭之慟賻錢萬貫官給葬事少府監張僅言監護親王宰相以下郊送諡襄簡石以勳戚久處腹心之寄內廷獻替外罕得聞觀其劾奏徒單子溫退答宰臣之問氣岸宜有不能堪者時論得失半之亦豈以是耶舊史載其少貧貞懿后周之不受曰國家方急用人正宜自勉何患乎貧后感泣曰汝苟能此吾復何憂及中年以冒粟見斥衆譏貪鄙如出二人史又稱其未貴人有慢之者及為相其人以事見石惶恐石曰吾豈念舊惡者待之彌厚能為長者言如是又與他日氣岸禋殊山東河南軍民交惡爭田不絶有司謂兵為國根本姑宜假借石持不可曰兵民一也孰輕孰重國家所恃以立者紀綱耳紀綱不明故下敢輕冒惟當明其疆理示以法禁使之無爭是為長久之術趣有司按問自是軍民之爭逐息北京民曹貴謀反大理議廷中謂貴等陰謀久不能發在法詞理不能動衆威力不足率人罪止論斬石是之又議從坐久不能決石曰罪疑惟輕入詳奏其狀上從之緣坐皆免死北鄙歲警朝廷欲發民穿深塹以禦之石與丞相紇石烈良弼皆曰不可古築長城備北徒耗民力無益於事北俗無定居出沒不常惟當以德柔之若徒深塹必當置戍而塞北多風沙曾未期年塹已平矣不可疲中國有用之力為此無益議遂寢是皆足稱云世宗在位幾三十年尚書令凡四人張浩以舊官完顏守道以功徒單克寧以顧命石以定策他無及者明昌五年配享世宗廟廷子獻可逵可獻可字仲和大定十年中進士第世宗喜曰太后家有子孫舉進士甚盛事也纍官戶部員外郎坐事降清水令召為大興少尹遷戶部侍郎纍遷山東提刑使卒衛紹王即位以元舅贈特進追封道國公子道安擢符寶郎完顏福壽曷速館人也父合住國初來歸授猛安天眷二年福壽襲父合住職授定遠大將軍纍加金吾衛上將軍海陵省並猛安謀克遂停封正隆末海陵伐宋福壽領婁室臺答藹二猛安由山東道進至泰安既受甲福壽乃誘將校北還而高忠建盧萬家奴等亦各率衆萬餘俱歸東京欲共立世宗至遼口世宗遣徒單思忠府吏張謀魯瓦等來迎察其去就思忠等以數騎馳入軍中見福壽等問曰將軍何為至此福壽等向南指海陵而言曰此人失道不能保天下國公乃太祖皇帝親孫我輩欲推戴為主以此來耳諸軍皆東向拜呼萬歲為書以授思忠於是督諸軍渡遼水徑至東京城下即諭軍士擐甲入衛宮城殺高存福等明日與諸將及東京吏民從婆速路兵馬都總管完顏謀衍勸進世宗即位以福壽為元帥右監軍賜以銀幣御馬初謀衍之至也大會諸軍以福壽之軍居左高忠建軍居右忠建曰何以我軍為右軍謀衍曰樹置在我爾曷敢言福壽曰始建大事左右軍高下何足爭也遂讓忠建為左軍世宗聞而賢之未幾從完顏謀衍討白彥敬紇石烈志寧于北京是冬上聞臨潢尹兼元帥左都監吾扎忽等與窩斡戰不利命福壽將兵進討已敗賊俘獲生口萬計世宗以紇石烈志寧代之召還授興平軍節度使復其世襲猛安尋領濟州路諸軍事大定三年卒獨吉義本名鶻魯補曷速館人也徙居遼陽之阿米吉山祖回海父祕剌收國二年曷速館來附祕剌領戶三百遂為謀克祕剌長子照屋次子忽史與義同母祕剌死忽史欲承謀克義曰長兄雖異母不可奪也忽史乃以謀克歸照屋人咸義之義以質子至上京善女直契丹字為管勾御前文字天會十五年擢右監門衛大將軍除寧化州刺史察廉遷迭剌部族節度使復州防禦使改卓魯部族節度使河南路統軍都監為武勝軍節度使邊郡妄稱寇至統軍司徙居民於汴義獨不聽日與官屬擊毬遊宴統軍司使人責之義曰太師梁王南伐淮南死者未葬者未復彼豈敢先發此城中有榷場若自動彼將謂我無人既而果無事統軍謝之請以沿邊唐州等處諸軍猛安皆隸于義貞元元年改唐古部族節度使為彰化軍改利涉軍節度使是時海陵伐宋諸軍往往逃歸而世宗在東京得衆心都統白彥敬自北京使人陰結義欲與共圖世宗頃之世宗即位義即日來歸具陳所以與彥敬密謀者世宗嘉其不欺以為參知政事上謂義曰正隆率諸道兵伐宋若反北指則計將安出義曰正隆多行無道殺其嫡母阻兵虐衆必將自斃陛下太祖之孫即位此其時也上曰卿何以知之義曰陛下此舉若太早則正隆未渡淮太遲則窩斡必太熾今正隆已渡淮窩斡未至太盛將士在南家屬皆在此惟早幸中都為便上嘉納之次榛子嶺世宗聞海陵死于軍中謂義曰信如卿所料大定二年罷為益都尹兼本路兵馬都總管賜金五十兩銀五百兩三年以疾致仕四年薨于家年七十一子和尚大定初除應奉翰林文字佩金牌陀滿訛里也子撒曷輦充護衛司吏王得兒加保義校尉皆佩銀牌持詔書宣諭中都以南州郡及往南京諭太傅張浩中道聞海陵遇害南京及都督府皆奉表賀乃止和尚為奉使擅廢置州縣官輒行殺戮詔尚書省鞫治之十九年詔以義孫引壽為斜魯答阿世襲謀克義性辨給善談論服玩不尚奢侈食贊曰章宗嘗問羣臣世宗初起東京大臣為誰完顏守貞對曰止有李石一人章宗歎曰苟如此信有天命也完顏謀衍部署諸軍高忠建爭長完顏福壽讓忠建而己下之其功多矣當是時獨吉義最先至諸將尚未肯附由是言之果天也非人力也烏延蒲離黑速頻路哲特猛安人改屬合懶路祖思列預平烏春窩謀之亂及伐遼宋皆有功追授猛安贈銀青光祿大夫父國也襲猛安蒲離黑從太祖伐遼勇聞軍中天眷三年襲猛安授寧遠大將軍纍官武寧軍節度使遷京兆尹海陵伐宋行武威軍都總管軍還為順義軍節度使徒單合喜定秦隴蒲離黑統完顏習尼列顏盞門都兵救德順州改延安平涼尹致仕封任國公大定十九年卒烏延蒲轄奴速頻路星顯河人也後改隸曷懶路父忽撒渾天輔初追授猛安親管謀克蒲轄奴身長有力多智略襲其父猛安謀克階寧遠大將軍天德二年授陳州防禦使貞元元年改昌武軍節度使以善綏撫再任海陵南征改歸德尹為神策軍都總管當屯濟州比至山東盜已據其城蒲轄奴領十餘騎往覘之忽為其衆所圍乃與軍士皆下馬立而射之殺百餘人賊衆敗走迤邐襲之至暮而還明日攻破其城號令士卒毋害居民郡中獲安民感其惠為立祠以祭大定二年為慶陽尹元帥左都監徒單合喜奏宋軍十萬餘據險阻剽掠郡邑請益師詔益兵七千與舊兵合為二萬遣蒲轄奴與延安尹高景山等分領其軍以往卒于軍年六十一子查剌烏延查剌銀青光祿大夫蒲轄奴子也力兼數人勇果無敵正隆六年伐宋諸猛安謀克兵皆行州縣無備契丹括里陷韓州圍信州遠近震駭查剌道出咸平遂率本部亟還信州與戰敗之已而賊復整兵環攻且登其城查剌下巨木壓之殺賊甚衆括里乃解去查剌左右手持兩大鐵簡簡重數十斤人號為鐵簡萬戶追及括里于韓州東八里許賊方就平野為陳查剌身率鋭士以鐵簡左右揮擊之無不僵仆賊不能成列乃易馬督軍復擊之賊衆大敗遂走東京咸平隆州民復帖然世宗即位查剌謁見充護衛為驍騎副都指揮使領萬戶擊窩斡戰于花道大軍未集查剌在左翼領六百騎與賊戰殺賊三千餘人宗亨蒲察世傑七謀克戰不利世傑走查剌軍賊合圍攻之查剌圜拒而戰宗軍來援賊乃引去西過裊嶺追及於陷泉賊先犯右翼查剌迎擊之賊退走窩斡募人刺之偽護衛阿不沙身長有力奮大刀自後斫查剌查剌回顧以簡背擊阿不沙折其右臂與紇石烈志寧軍合擊賊遂大敗窩斡平以為宿直將軍賜銀三百兩重綵二十端丁父憂以本官起復襲其父猛安除蔡州防禦使改宿州遷昌武軍節度使徙鎮邠州為賀宋歲元使射淮上柳樹矢入其樹飲羽宋人素聞其名甚異之改鳳翔尹入為右副點檢出為興中尹改婆速路總管高麗憚其威名凡以事至婆速路者望見而跪之二十五年為興平軍節度使卒官查剌貞賣心寡言平居極和易及臨戰奮勇見者無不辟易雖重圍萬衆出入若無人之境云李師雄字伯威雁門人也有材力喜談兵慕古之英雄故名師雄宋宣和中以騎射登科纍官大名清平尉王師至大名師雄與府僚出降攝本路兵馬都監齊國建以為大總管府先鋒都統制知淄州齊廢為汴京馬軍都虞候歷知寧海軍曹州刺史皇統二年為武勝軍節度使正隆末為河州防禦使宋將吳璘軍攻秦隴會師雄以事就逮臨洮宋兵至城下州人乘城拒守謀欲出降師雄止之宋將權儀鞭馬方上浮橋師雄射之墜于橋下遂擒權儀宋師退後從元帥左監軍徒單合喜以兵攻河州有功未幾以疾歸汴卒尼厖古鈔兀曷速館人初為大扎也補元帥府通事宋將韓世忠率軍數萬圍邳州鈔兀將輕騎數百與偵人數輩間道往救之敗敵兵六千翌日宋兵復圍下邳鈔兀復敗之宋人攻濟州奪戰艦略盡是時鈔兀往宿州分蒲魯虎軍還至大河與敵遇力戰敗之盡復戰艦王師復河南宋別將由胡陵夜襲孛董布輝營士卒盡沒鈔兀從東平總管並力戰却之元帥府賞以銀幣鈔兀勇敢善伺敵虛實以此屢捷帥府承制加忠顯校尉為蕃部禿里賜錢萬貫幣帛三百匹衣一襲馬二匹將之官河間尹大白于元帥請留鈔兀以給邊事許之復賜錢萬貫銀二百五十兩重綵三百端馬三匹録功授慶陽少尹海陵將伐宋而契丹反召入諭之曰汝久在邊陲屢立戰功昨遣樞密使僕散忽土留守石抹懷忠等討契丹師久無功已置諸法今命汝與都統白彥敬副統紇石烈志寧進討因賜具裝馬四匹鈔兀與彥敬等至北京未能進會世宗即位遼陽鈔兀迎謁遷輔國上將軍與都統吾札忽副統渾坦討窩斡鈔兀行至窊歷與窩斡遇左軍小却鈔兀挺槍馳入其陳手殺二十餘人賊乃退元帥僕散忠義自花道追之鈔兀以前鋒追及于陷泉遂大敗之事平遷西北路招討使改東北路鈔兀與完顏思敬有隙思敬為北京留守奉詔至招討司鈔兀不出餞世宗聞之遣使切責之曰卿本大扎也起身細微受國厚恩纍歷重任乃以私憾不餞詔使當內省自訟後勿復爾朕不能再三曲恕汝也既而思敬為平章政事東北路招討使鈔兀以私取諸部進馬事覺被逮將赴京師鈔兀為人尚氣次海濱縣慨然曰吾豈能為思敬辱哉遂縊而死十九年詔以鈔兀舊功授其子和尚世襲布輝猛安徒胡眼謀克孛术魯定方本名阿海內吉河人也材勇絶倫海陵素聞其名天德初召授武義將軍充護衛數月轉十人長遷宿直將軍賜豫甚厚尋為殿前右衛將軍又三月擢殿前右副點檢世襲猛安改左副點檢出為河南尹改彰德軍節度使海陵南伐定方為神勇軍都總管大定二年宋人陷汝州河南統軍使宗尹遣定方將兵四千往取之汝州東南及北面皆山林險阻不可以騎軍戰是時宋兵由餢路出沒定方至襄城得敵虛實遂牒諭汝州屬縣曰我率許州戍兵十二萬徑取汝州爾等可備糧草二十萬使人揚言欲據要路絶宋兵往來既而定方引兵趨餢路宋人聞之果棄城遁去定方至魯山境知宋兵已去遂遣輕騎二百追至布袴叉擊敗之遂復汝州授鳳翔尹宋人阻邊以本職行河南道軍馬副統率步騎六萬將由壽州進軍次亳州宋李世輔陷宿州定方從左副元帥志寧戰於城下時天大暑定方督戰馳突敵陳中出入數四渴甚因出陳下馬取水為人所害年四十四上聞而閔之詔有司致祭賻銀五百兩重綵二十端贈金紫光祿大夫夾谷胡剌上京宋葛屯猛安人初在左副元帥撻懶帳下有戰功授武德將軍襲其父謀克正隆末山東盜起胡剌為行軍猛安討賊遇賊千五百人於徐州南敗之山東路統軍司選諸軍八百人作十謀克胡剌將之與驍騎軍皆隸點檢司行至淮南海陵遣以騎兵三百二十往揚州敗宋兵千五百人於宣化鎮僕散忠義伐宋胡剌領萬戶由泗州進戰遇敵於宿州歿于陳贈鎮國上將軍蒲察斡論上京益速河人徙臨潢祖忽土華父馬孫俱贈金紫光祿大夫斡論剛毅有技能天輔初以功臣子充護衛遷左衛將軍定武軍節度使召為右副都點檢天德初授世襲臨潢府路曷呂斜魯猛安改東平尹賜錢千萬纍除河南尹海陵伐宋以本官為右領軍都監大定二年仍為河南尹兼河南路都統軍使宋以萬人據壽安縣嵩州刺史石抹突剌押軍萬戶徒單賽補以騎兵三百巡邏遇于縣東請師於斡論斡論使猛安完顏鶻沙虎率七百人助之宋兵多突剌使士卒下馬跪而射之宋兵不能當走入縣城突剌進逼之宋人棄城去追及于鐵索口復大敗之遂復壽安改北京留守大定尹卒官夾谷查剌隆州失撒古河人也祖不剌速國初授世襲曷懶兀主猛安曷懶路總管父謝奴官至工部尚書查剌狀貌魁偉善女直契丹書天德初以功臣子充護衛二年授武義將軍未幾擢符寶郎凡再考出為灤州刺史改知平定軍事海陵南征為武威軍副都總管軍還大定二年授景州刺史遷同知京兆尹時彰化軍節度使宗室璋等與宋將吳璘相拒於德順州元帥左都監徒單合喜遣查剌與諸將議破敵策璋等議曰我兵雖屢勝而敵兵不退者知我軍少故也須都監親至方可破敵於是合喜領兵四萬至遂下德順州入為殿前右衛將軍襲父猛安改左衛將軍遷右副點檢有疾丞相良弼視之謂所親曰此人國器也他人有疾吾未嘗往焉九年出為東北路招討使兼德昌軍節度使仍賜金帶到官治有勤績邊境以安其斷獄公平道不拾遺遷臨潢尹兼本路兵馬都總管蕃部畏服改西北路招討使上遣使宣諭曰今諸部初附命汝撫綏當使治聲達於朕聽大定十二年卒查剌性忠實內明敏每論大事超越倫輩太師勗嘗曰查剌不學而知方之古人如此者鮮矣贊曰陷泉之捷震電燁燁符離之克我勢攸赫隴抵螥淮濄鈎鈲成矣故列諸將之功焉
