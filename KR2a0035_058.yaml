body:
  text: 金史卷五十八志第三十九百官四符印鐵券官誥百官俸給符制初穆宗之前諸部長各刻信牌交互馳驛訊事擾人太祖獻議自非穆宗之命擅製牌號者置重法自是號令始一收國二年九月始製金牌後又有銀牌木牌之制蓋金牌以授萬戶銀牌以授猛安木牌則謀克蒲輦所佩者也故國初與空名宣頭付軍帥以為功賞遞牌即國初之信牌也至皇統五年三月更造金銀牌其制皆不傳大定二十九年製綠油紅字者尚書省文字省遞用之朱漆金字者勅遞用之並左右司掌之有合遞文字則牌送各部付馬鋪轉遞日行二百五十里如臺部別奉聖旨文字亦給如上制虎符之制承安元年製以禮官言漢與郡國守相為銅虎符唐以銅魚符起軍旅易守長等用之至是斟酌漢唐典故其符用虎並五左一右左者留御前以侍臣親密者掌之其右付隨路統軍司招討司長官主之闕則次官主之若發兵三百人以上及徵兵召易本司長貳官從尚書省奏請左第一符近侍局以囊封付主奏者尚書備錄聖旨與符以函同封用尚書省印記之皆專使帶牌馳送至彼主符者視其封以右符勘合然後奉行若一有參差者不敢承用主者復用囊封貯左符上用職印具發兵狀與符以本司印封即日還付使者送尚書省以進乃更其封以付內掌之人若復有事左符以次出周而復始仍各置曆注付受日月若盜賊急速不容先陳者雖三百人以上其掌兵官司亦許給付隨即言上詔即施行之貞祐三年更定樞密院用鹿符宣撫司用魚符統軍司用虎符若發銀牌若省付部及點檢司者左右司用匣封印驗封交受若發於他處並封題押以匣貯之印制太子之寶大定二十二年世宗幸上京鑄守國之寶以授皇太子二十八年世宗不豫以皇太孫攝政鑄攝政之寶貞祐三十年十二月以皇太子守緒控制樞密院詔以金鑄撫軍之寶如世宗時制於啟禀之際用之百官之印天會六年始詔給諸司其前所帶印記無問有無新給悉上送官敢匿者國有常憲至正隆元年以內外官印新舊名及階品大小不一有用遼宋舊印及契丹字者遂定制命禮部更鑄焉三師三公親王尚書令並金印方二寸重八十兩駝紐一字王印方一寸七分半金鍍銀重四十兩鍍金三字諸郡王印方一寸六分半金鍍銀重三十五兩鍍金三字國公無印一品印方一寸六分半金鍍銀重三十五兩鍍金三字二品印方一寸六分金鍍銅重二十六兩東宮三師宰執與郡王同三品印方一寸五分半銅重二十四兩四品印方一寸五分銅重二十兩五品印方一寸四分銅重二十兩六品印一寸三分銅重十六兩七品印一寸二分銅重十六兩八品印一寸一分半銅重十四兩九品印一寸一分銅重十四兩凡朱記方一寸銅重十四兩天德二年行尚書省以其印小遂命擬尚書省印小一等改鑄大定二十四年二月鑄行尚書省御史臺并左右三部印以從幸上京泰和元年八月安國軍節度使高有鄰言本州所掌印三曰安國軍節度使之印曰邢州觀察使印吏戶禮案用之曰邢州之印兵刑工案用之以名實不正乞改鑄宰臣奏謂節度使專行之事自當用節度使印觀察使亦如之其六曹提點所軍兵民訟則當用本州印著為定制上從之泰和八年閏四月勅殿前都點檢司依總管府例鑄印以金木水火土五字為號如本司差人則給之鐵券以鐵為之狀如卷瓦刻字畫襴以金填之外以御寶為合半留內府以賞殊功也官誥親王紅遍地雲氣翔鸞錦褾金鸞五色羅十五幅寶裝犀軸一品紅遍地雲鶴錦褾金雲鶴五色羅十四幅犀軸二品三品紅遍地龜蓮錦褾素五色綾十二幅玳瑁軸四品五品紅遍地水藻戲鱗錦褾大白綾十幅銀𩹉間鍍軸元牙軸承安四年改之大安二年復改為金縷角軸六品七品紅遍地草錦褾小白綾八幅角軸大安加銀縷公主王妃與親王同郡主縣主夫人紅遍地瑞蓮鸂錦褾金蓮鸂五色羅十五幅郡王夫人國夫人紅遍地芙蓉花錦褾金花五色綾十二幅玳瑁軸縣君孺人鄉君紅遍地雜花錦褾素五色小綾十幅銀𩹉間鍍軸軸之制如徑二寸餘大錢貫樞之兩端復以犀象為鈿以轄之可圓轉如輪金格一品紅羅畫雲氣盤龍錦褾金龍五色羅十七幅寶裝玉軸二品翔鳳褾金鳳羅十六幅犀軸三品四品盤鳳褾金鳳羅十五幅五品翔鸞錦褾金鸞羅十四幅以上幅皆用五色羅軸皆用犀六品御仙花錦褾金花五色綾十二幅七品八品九品太平花錦褾金花五色小綾十幅軸皆用玳瑁凡褾皆紅幅皆五色夫人以上制授餘勅授皆給本色錦囊百官俸給正一品三師錢粟三百貫石麴米麥各五十稱石春衣羅五十匹秋衣綾五十匹春秋絹各二百匹綿千兩三公錢粟二百五十貫石麴米麥各四十稱石春衣羅四十匹秋衣綾四十匹春秋絹各一百五十匹綿七百兩親王尚書令錢粟二百二十貫石麴米麥各三十五稱石春衣羅三十五匹秋衣綾三十五匹春秋絹各一百二十匹綿六百兩皇統二年定制皇兄弟及子封一字王者為親王給二品俸餘宗室封一字王者以三品俸給之天德二年以三師宰臣以下有以一官而兼數職者及有親王食其祿而復領他事者前此並給以俸今宜從一高其兼職之俸並不重給至大定二十六年詔有一官而兼數職其兼職得罪亦不能免而無廩給可乎遂以職務煩簡定為分數給兼職之俸從一品左右丞相都元帥樞密使郡王開府儀同錢粟二百貫石麴米麥各三十稱石春秋衣羅綾各三十匹絹各一百匹綿五百兩平章政事錢粟一百九十貫石麴米麥各二十八稱石春羅秋綾各二十五匹絹各九十五匹綿四百五十兩大宗正錢粟一百八十貫石麴米麥各二十五稱石羅綾同上絹各九十匹綿四百兩正二品東宮三師副元帥左右丞錢粟一百五十貫石麴米麥各二十二稱石春羅秋綾各二十二匹絹各八十匹綿三百五十兩從二品錢粟一百四十貫石麴米麥各二十稱石春羅秋綾各二十匹絹各七十五匹綿三百兩同判大宗正錢粟一百二十貫石麴米麥各十八稱石春羅秋綾各十八匹絹各七十匹綿二百五十兩正三品錢粟七十貫石麴米麥各十六稱石春羅秋綾各十二匹絹各五十五匹綿二百兩外官錢粟一百貫石麴米麥各十五稱石絹各四十匹綿二百兩公田三十頃統軍使招討使副使錢粟八十貫石麴米麥十三稱石絹各三十五匹綿百六十兩公田二十五頃都運府尹錢粟七十貫石麴米麥十二稱石絹各三十匹錦百四十兩天德二年省奏職官公田歲入有數前此百姓各隨公宇就輸而吏或貪冒多取以傷民宜送之官倉均定其數與月俸隨給從三品錢粟六十貫石麴米麥各十四稱石春秋衣羅綾各十匹絹各五十匹綿百八十兩外官錢粟六十貫石麴米麥各十稱石絹各二十五匹綿一百二十兩公田二十一頃皇統元年二月詔諸官職俱至三品而致仕者俸祿傔人各給其半正四品錢粟四十五貫石麴米麥各十二稱石春秋衣羅綾各八匹絹各四十匹綿一百五十兩外官錢粟四十五貫石副統軍錢粟五十貫石絹各二十二匹綿八十兩職田十七頃餘同下麴米麥各八稱石絹各二十匹綿七十兩公田十五頃許帶酒三十瓶鹽三石從四品錢粟四十貫石麴米麥各十稱石春秋羅綾各六匹絹各三十匹綿一百三十兩外官錢粟四十貫石麴米麥各七稱石絹各十八匹綿六十兩公田十四頃猛安錢粟四十八貫石餘皆無烏魯古使同無職田大定二十年詔猛安謀克俸給令運司折支銀絹省臣議若估粟折支各路運司儲積多寡不均宜令依舊支請牛頭稅粟如遇凶年盡貸與民其俸則於錢多路府支放錢少則支銀絹亦未晚也從之正五品錢粟三十五貫石麴米麥各八稱石春秋衣羅綾各五匹絹各二十五匹綿一百兩外官刺史知軍鹽使錢粟三十五貫石麴米麥各六稱石絹各十七匹綿五十五兩公田十三頃餘官錢粟三十貫石麴米麥同上絹各十六匹綿五十兩職田十頃從五品錢粟三十貫石麴米麥六稱石春秋羅綾各五匹絹各二十匹綿八十兩外官錢粟二十五貫石麴米麥各四稱石絹各十匹綿四十兩公田七頃謀克錢粟二十貫石餘皆無喬家部族都鈐轄無職田正六品錢粟二十五貫石麥五石絹各十七匹綿七十兩外官與從六品皆錢粟二十貫石麴米麥三稱石絹各八匹綿三十兩公田六頃從六品錢粟二十二貫石麥五石春秋絹各十五匹綿六十兩烏魯古副使同無職田正七品錢粟二十二貫石麥四石衣絹各一十二匹綿五十五兩外官諸同知州軍都轉運判諸府推官諸節度判諸觀察判諸京縣令諸劇縣令提舉南京京城規措渠河官諸都巡檢諸酒麴鹽稅副諸正將錢粟一十八貫石麴米麥各二稱石春秋衣絹各七匹綿二十五兩諸司屬令諸府軍都指揮俸同上無職田潼關使錢粟一十八貫石麴米麥各一稱石衣絹各六匹綿三十兩無職田從七品錢粟一十七貫石麥四石衣絹各一十匹綿五十兩外官統軍司知事錢粟一十七貫石麥四石衣絹各一十匹綿五十兩諸鎮軍都指揮使錢粟一十八貫石麴米麥各二稱石衣絹各七匹綿二十五兩諸招討司勘事官諸縣令諸警巡副京兆府竹監管勾五品鹽使司判諸部禿里同提舉上京皇城司同提舉南京京城所黃河都巡河官諸酒稅榷場使錢粟一十七貫石麴米麥各二稱石衣絹各七匹綿二十五兩職田五頃會安關使諸知鎮城堡寨錢粟一十五貫石麴米麥各一稱石衣絹各六匹綿二十兩職田四頃正八品朝官錢粟一十五貫石麥三石衣絹各八匹綿四十五兩外官市令諸錄事諸防禦判赤縣丞諸劇縣丞崇福埽都巡河官諸酒稅使醋使榷場副諸都巡檢錢粟一十五貫石麴米麥各一稱石衣絹各六匹綿二十兩職田四頃烏魯古判官俸同上無職田按察司知事大興府知事招討司知事諸副都巡檢使錢粟一十三貫石麴米麥各一稱石衣絹各六匹綿二十兩職田二頃諸司屬丞俸同上無職田諸節鎮以上司獄諸副將錢粟一十三貫石衣絹各三匹綿一十兩職田二頃南京京城所管勾京府諸司使管勾河橋諸關渡譏察官同樂園管勾南京皇城使通州倉使錢粟一十二貫石衣絹各三匹綿一十兩節鎮諸司使中運司柴炭場使錢粟一十貫石衣絹各二匹綿八兩從八品朝官錢粟一十三貫石麥三石衣絹各七匹綿四十兩外官南京交鈔庫使諸統軍按察司知法錢粟一十三貫石麥三石衣絹各七匹綿四十兩諸州軍判官諸京縣丞諸次劇縣丞諸三品鹽司判官漕運司管勾永豐廣備庫副使左右別貯院木場使錢粟一十三貫石麴米麥各一稱石衣絹各六匹綿二十兩職田三頃諸麼忽諸移里菫錢粟一十三貫石麥二石衣絹各五匹綿一十五兩職田三頃正九品朝官錢粟一十二貫石麥二石衣絹各六匹綿三十五兩外官南京交鈔庫副錢粟一十二貫石麥二石衣絹六匹綿三十五兩諸警巡判官錢粟一十三貫石麴米麥各一稱石衣絹六匹綿一十兩職田三頃諸縣丞諸酒稅副使錢粟一十二貫石麥一石五斗衣絹各五匹綿一十七兩職田三頃市丞諸司候諸主簿諸錄判諸縣尉散巡河官黃河埽物料場官錢粟一十二貫石麥一石衣絹各三匹綿一十兩職田二頃管勾泗州排岸兼巡檢副都巡檢諸巡檢俸例同上並無麥及職田諸鹽場管勾左右別貯院木場副永豐廣備庫判錢粟一十二貫石衣絹各三匹綿一十兩職田二頃諸部將隊將錢粟一十二貫石麥一石衣絹各三匹綿一十兩職田二頃店宅務管勾錢粟一十二貫石綿絹同上京府諸司副南京皇城副通州倉副同管勾河橋諸副譏察錢粟一十一貫石衣絹各二匹綿八兩諸州軍司獄錢粟一十一貫石衣絹各二匹綿