一十三貫石春秋衣絹各四匹小功粟一十貫石春秋衣絹各三匹緦麻袒免錢粟八貫石春秋衣絹二匹諸驛及長行馬職官日給謂奉宣省院臺部委差或許差者下文置所等官同一品三貫文二品二貫文三品一貫五百文四品一貫二百文五品一貫文六品八百文七品六百文八品九品四百文有職事官日給外路官往回口券依上款給一品二貫五百文二品一貫六百文三品一貫二百文四品一貫文五品九百文六品七百文七品六百文八品九品四百文無職事官並驗前職日給無前職者以應仕及待闕職事給之四品一貫三百文五品一貫二百文六品九百文七品七百文八品九品五百文隨朝吏員宣差及省部差委官踏逐者引者亦同及統軍司按察司書吏譯人本局差委及隨逐者日給錢各一百五十文燕賜各部官僚以下日給米糧分例無草地處內親王給馬二十五匹草料親王米一石宰執七王府三府尉二員外郎司馬各一六升監察御史尚書省都事大理司直六部主事各八升檢知法七升省令譯史六升院臺令譯史省通事各五升院臺通事六部令譯史通事省祗候郎君使庫都監各四升誥院令史樞密院移剌各三升王府直府王府及省知印直省御史臺通引王府教讀王傅府尉等下司吏外路通事省醫工調角匠招討司移剌各二升寫誥諸祗候人本破人同大程官院子酒匠柴火各一升萬戶一六升猛安八升謀克四升蒲輦二升正軍阿里喜旗鼓吹笛司吏各一升諸外方進貢及回賜并人使長行馬每匹日給草一稱粟一斗宮中東宮同承應人因公差出皆驗見請錢粟貫石口給食料若係本職者住程不在給限其常破馬草料局分如被差長行馬公幹本支草料即聽驗日剋除若特奉宣差勾當者依本格十八貫石以上九百文十七貫石八百六十文十五貫石以上五百四十文七貫石以上四百六十文六貫石四百二十文五貫石三百八十文四貫石三百三十文三貫石二百八十文二貫石二百三十文諸試護衞親軍聽自起發日為始計程至都比至試補其間各日給口券若揀退還家者亦驗回程給之未起閑住口數不在支限其正收之後再揀退者亦給人三口米糧錢一百文馬二匹草料諸簽軍赴鎮防處及班祗充押遞橫差別路勾當千里以上者沿路各日給米一升馬一匹草料無馬有驢者各支依本格車駕巡幸顧工馬夫三百文步夫二百三十文圍鵝夫隨程幹辦人各二百文傳遞果子夫一百五十文車駕巡幸若於私家內安置行宮者約量給賜段匹太廟神祠祭度勾當人少府監隨色工匠部役官受給官司吏錢粟二貫石春秋衣絹各一匹諸局作匠人請俸綉女都管錢粟五貫石都繡頭錢粟四貫石副繡頭三貫五百石中等細繡人三貫石次等細繡人二貫五百石習學本把正辦人錢支次等之半描繡五人錢粟三貫石司吏二人三貫石修內司作頭五貫石工匠四貫石春秋衣絹各二匹軍夫除錢糧外日支錢五十米一升半百姓夫每日支錢一百米一升半國子監雕字匠人作頭六貫石副作頭四貫石春秋衣絹各二匹長行三貫石射糧軍匠錢粟三貫石春秋衣絹各二匹習學給半初習學匠錢六百米六斗春秋絹各一匹布各一匹民匠日支錢一百八十文諸隨朝五品以下職事官身故因公差出及以理去任未給解由者身故同驗品從去鄉地里支給津遣錢並受職事給之下條承應人准此若外路官員在任依理身故者各依上官品地里減半給之若係五百里內不在給限五百里外五品一百貫六品七品八十貫八品九品六十貫一千里外五品一百二十貫六品七品一百貫八品九品八十貫二千里外五品一百七十貫六品七品一百五十貫八品九品一百貫三千里外五品二百五十貫六品七品二百貫八品九品一百五十貫諸隨朝承應人身故應給津遣錢者護衞東宮護衞同奉御符寶都省樞密院御史臺令譯史同九品官通事宗正府六部令譯史統軍司書史譯書按察司書史同親軍減九品官五分之二通事隨朝書表吏員譯人統軍司通事守當官按察司書吏譯人分治都水監典吏同及諸局分承應人武衞軍同減五分之三天壽節設施老疾貧民錢數在都七百貫宮籍監給諸京二十五貫此以下並係省錢給諸府二十貫文諸節鎮一十五貫文諸防刺州軍一十貫文諸外縣五貫文城寨係保鎮同諸孤老幼疾人各月給米二錢五百文春秋衣絹各一匹五歲以下三分給二身死者給錢一貫埋殯諸因災傷或遭賊驚却饑荒去處良民典顧冒賣為驅遇恩官贖為良分例若元價錢給男子一十五貫文婦人同老幼各減半六歲已下即聽出離不在贖換之限諸士庶陳言利害若有可採行之便於官民者依驗等第給賞上等銀絹三十兩匹中等二十兩匹下等一十兩匹其陳數事止從一支若用大事應補官者從吏部格宣宗貞祐元年十二月以糧儲不足詔隨朝官承應人俸計口給之餘依市直折之諭旨省臣曰聞親軍俸粟每石以麥六斗折之所省能幾而失衆心今給本色二年八月始給京府州縣及轉運司吏人月俸有差舊制惟吏案孔目官有俸餘止給食錢故更定焉三年詔損宮中諸位歲給有差監察御史田迥秀言國家調度行纔數月已後停滯所患在支太多收太少若隨時裁損所支而增其收庶可久也因條五事一曰朝官及令譯史諸司吏員諸局承應人太冗濫宜省併之隨處屯軍皆設寄治官徒費俸給不若令有司兼總之且沿河亭障各駐鄉兵彼皆白徒皆不可用不若以此軍代之以省其出四月以調度不及罷隨朝六品以下官及承應人從己人力輸傭錢減修內司所役軍夫之半經兵處州府司吏減半司縣三分減一其餘除開封府南京轉運司外例減三分之一有祿官吏而不出境者並罷給券出境者給其半興定二年正月詔陝州等處司縣官徵稅不足閣其俸給何以養廉自今不復閣俸彰化軍節度使張行信言送宣之使其視五品而上各有定數後意停罷今軍官以上奉待使者有所饋獻至六品以下亦不免如例而莫能辦則歛所部以與之至有獲罪者保舉縣尹特增其俸然法行至今而關以西尚有未到任者豈所舉少而不敷耶宜廣選舉以補其闕且丞簿亦親民者也而獨不增安能禁其侵牟哉
