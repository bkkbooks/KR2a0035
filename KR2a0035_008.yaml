body:
  text: 金史卷八本紀第八世宗下二十一年正月戊申朔宋高麗夏遣使來賀壬子以夏國請詔復綏德軍榷場仍許就館市易上聞山東大名等路猛安謀克之民驕縱奢侈不事耕稼詔遣閲實計口授地必令自耕地有餘而力不贍者方許招人租佃仍禁農時飲酒丙辰追貶海陵煬王亮為庶人詔中外甲子如春水丙子次永清縣有移剌余里也者契丹人也隸虞王猛安有一妻一妾妻之子六妾之子四妻死其六子廬墓下更宿守之妾之子皆曰是嫡母也我輩獨不當守墳墓乎於是亦更宿焉三歲如一上因獵過而聞之賜錢五百貫仍令縣官積錢於市以示縣民然後給之以為孝子之勸二月戊戌太白晝見庚子還都壬寅以河南尹張景仁為御史大夫乙巳以元妃李氏之喪致祭興德宮過市肆不聞樂聲謂宰臣曰豈以妃故禁之耶細民日作而食若禁之是廢其生計也其勿禁朕前將詣興德宮有司請由薊門朕恐妨市民生業特從他道顧見街衢門肆或有毀撤障以簾箔何必爾也自今勿復毀撤三月丁未朔萬春節宋高麗夏遣使來賀上初聞薊平灤等州民乏食命有司發粟糶之貧不能糴或貸之有司以貸貧民恐不能償止貸有戶籍者上至長春宮聞之更遣人閲實賑貸以監察御史石抹元禮鄭達卿不糾舉各笞四十前所遣官皆論罪甲子太白晝見乙丑詔山後冒占官地十頃以上者皆籍入官均給貧民遼州民朱忠等亂言伏誅上謂宰臣曰近聞宗州節度使阿思悶行事多不法通州刺史完顏守能既與招討職事猶不守廉達官貴要多行非理監察未嘗舉劾斡覩只羣牧副使僕散那也取部人二毬杖至細事也乃便劾奏謂之稱職可乎今監察職事修舉者與遷擢不稱者大則降罰小則決責仍不許去官閏月己卯恩州民鄒明等亂言伏誅辛卯漁陽令夾谷移里罕司候判官劉居漸以被命賑貸止給富戶各削三官通州刺史郭邦傑總其事奪俸三月乙未上謂宰臣曰朕觀自古人君多進用讒諂其間蒙蔽為害非細若漢明帝尚為此輩惑之朕雖不及古之明君然近習讒言未嘗入耳至於宰輔之臣亦未嘗偏用一人私議也癸卯以尚書左丞相完顏守道為太尉尚書令尚書左丞蒲察通為平章政事右丞襄為左丞參知政事張汝弼為右丞彰德軍節度使梁肅為參知政事四月戊申以右丞相徒單克寧為左丞相平章政事唐括安禮為右丞相增築泰州臨潢府等路邊堡及屋宇庚戌奉安昭祖以下三祖三宗御容於衍慶宮行親祀禮上諭宰臣曰朕之言行豈能無過常欲人直諫而無肯言者使其言果善朕從而行之又何難也戊辰以滕王府長史把德固為橫賜夏國使壬申幸壽安宮五月戊子西北路招討使完顏守能以贓罪杖二百除名七月丙戌還都丁酉樞密使趙王永中罷己亥以左丞相徒單克寧為樞密使辛丑以太尉尚書令完顏守道復為左丞相太尉如故八月乙丑以右副都點檢胡什賚等為賀宋生日使吏部郎中奚胡失海為夏國生日使二十二年三月辛未朔萬春節宋高麗夏遣使來賀丁丑命尚書省申敕西北路招討司勒猛安謀克官督部人習武備甲申諭戶部今歲行幸山後所須並不得取之民間雖所用人夫並以官錢和雇違者杖八十罷職癸巳詔頒重修制條以吏部尚書張汝霖為御史大夫四月乙卯行監臨院務官食直法以削明肅尊號詔中外從皇太子請也甲子上如金蓮川五月甲申太白晝見六月庚子朔制立限放良之奴限內娶良人為妻所生男女即為良丁巳右丞相致仕石琚薨七月辛巳宰臣奏事上頗違豫宰臣請退上曰豈以朕之微爽於和而倦臨朝之大政耶使終其奏甲午秋獵八月戊辰太白經天九月戊寅至自金蓮川以左衛將軍禪赤等為賀宋生日使尚輦局使僕散曷速罕為夏國生日使己丑以同知東京留守司事裔在任專恣失上下之分謫授復州刺史乙未壽州刺史訛里也同知查剌軍事判官孫紹先榷場副使韓仲英等以受商賂縱禁物出界皆處死十月辛丑徙河間宗室于平州庚戌祫享于太廟十一月丙子以吏部尚書孛术魯阿魯罕等為賀宋正旦使東京留守徒單貞以與海陵逆謀伏誅妻永平縣主子慎思並賜死甲申以宿直將軍僕散忠佐為高麗生日使玉田縣令移剌查坐贓伏誅戊子冬獵十二月庚子還都癸丑獵近郊辛酉立強取諸部羊馬法二十三年正月丁卯朔宋高麗夏遣使來賀庚午詔有司但獲強盜迹狀既明賞隨給之勿得更待丁丑參知政事梁肅致仕辛巳廣樂園燈山火壬午如春水詔夾道三十里內被役之民與免今年租稅仍給傭直甲午大邦基伏誅二月乙巳還都戊申以尚書右丞張汝弼攝太尉致祭于至聖文宣王廟庚戌以戶部尚書張仲愈為參知政事御史臺進所察州縣官罪上覽之曰卿等所廉皆細碎事又止録其惡而不舉其善審如是其為官者不亦難乎其併察善惡以聞三月丙寅朔萬春節宋高麗夏遣使來賀丙子初製宣命之寶金玉各一尚書右丞相烏古論元忠罷潞州涉縣人陳圓亂言伏誅乙酉雨土丙戌詔戒諭中外百官四月辛丑更定奉使三國人從差遣格祁州刺史大磐坐無罪掠死染工妄認良人二十五口為奴削官四階罷之癸丑地生白毛以大理正紇石烈术列速為橫賜高麗使壬戌幸壽安宮敕有司為民禱雨是夕雨五月庚午縣令大雛訛只等十人以不任職罷歸六十以上者進官兩階六十以下者進官一階並給半俸甲戌命應部除官嘗以罪罷而再者遣使按其治迹如有善狀方許授以縣令無治狀者不以任數多少並不得授丁亥雷雨雹地生白毛六月壬子有司奏右司郎中段圭卒上曰是人甚明正可用者也如知登聞檢院巨構每事但委順而已燕人自古忠直者鮮遼兵至則從遼宋人至則從宋本朝至則從本朝其俗詭隨有自來矣雖屢經遷變而未嘗殘破者凡以此也南人徑挺敢言直諫者多前有一人見殺後復一人諫之甚可尚也又曰昨夕苦暑朕通宵不寐因念小民比屋卑隘何以安處七月乙酉平章政事移剌道參知政事張仲愈皆罷御史大夫張汝霖坐失糾舉降授棣州防禦使八月乙未觀稼于東郊以女直字孝經千部付點檢司分賜護衛親軍癸卯還都乙巳大名府猛安人馬和尚謀叛伏誅括定猛安謀克戶口田土牛具以戶部尚書程輝為參知政事九月己巳以同僉大宗正事方等為賀宋生日使宿直將軍完顏斜里虎為夏國生日使譯經所進所譯易書論語孟子老子揚子文中子劉子及新唐書上謂宰臣曰朕所以令譯五經者正欲女直人知仁義道德所在耳命頒行之辛未秋獵十月癸巳還都庚戌幸東宮賜皇孫吾都補洗兒禮己未慶雲見辛酉太白晝見十一月壬戌朔日有食之丙寅平章政事蒲察通罷丁卯歲星晝見壬申以樞密副使崇尹為平章政事閏月甲午上謂宰臣曰帝王之政固以寬慈為德然如梁武帝專務寬慈以至綱紀大壞朕嘗思之賞罰不濫即是寬政也餘復何為以尚書左丞襄為平章政事右丞張汝弼為左丞參知政事粘割斡特剌為右丞禮部尚書張汝霖為參知政事以西京留守婆盧火等為賀宋正旦使制外任官嘗為宰執者凡吏牘上省部依親王例免書名戊午歲星晝見上謂宰臣曰女直進士可依漢兒進士補省令史夫儒者操行清潔非禮不行以吏出身者自幼為吏習其貪墨至於為官習性不能遷改政道興廢實由於此庚申尚書省左司員外郎徐偉奏事上謂宰臣曰斯人純而幹右司郎中郭邦傑直而頗躁十二月癸酉上謂宰臣曰海陵自以失道恐上京宗室起而圖之故不問疏近並徙之南豈非以漢光武宋康王之疏庶得繼大統故有是心過慮若此何其謬也乙酉高麗以母喪來告丁亥以真定尹烏古論元忠復為尚書右丞相二十四年正月辛卯朔宋夏遣使來賀徐州進芝草十有八莖真定進嘉禾二本六莖異畝同穎戊戌如長春宮春水二月壬申還都癸酉上曰朕將往上京念本朝風俗重端午節比及端午到上京則燕勞鄉間宗室父老甲戌制一品職事官庶孽子承廕更不引見丙戌以東上閣門使完顏進兒等為高麗敕祭使西上閣門使大仲尹為慰問使虞王府長史永明為起復使以器物局使為橫賜夏國使三月庚寅朔萬春節宋夏遣使來賀甲午以上將如上京尚書省奏定皇太子守國諸儀丙申尚書省進皇太子守國寶上召皇太子授之且諭之曰上京祖宗興王之地欲與諸王一到或留三二年以汝守國譬之農家種田商人營財但能不墜父業即為克家子況社稷任重尤宜畏慎常時觀汝甚謹今日能紓朕憂乃見中心孝也皇太子再三辭讓以不諳政務乞備扈從上曰政事無甚難但用心公正毋納讒邪久之自熟皇太子流涕左右皆為之感動皇太子乃受寶丁酉如山陵己亥還都壬寅如上京皇太子允恭守國癸卯宰執以下奉辭于通州上謂宰執曰卿輩皆故老皇太子守國宜悉心輔之以副朕意又謂樞密使徒單克寧曰朕巡省之後脫或有事卿必親之毋忽細微大難圖也又顧六部官曰朕聞省部文字多以小不合而駁之苟求自便致纍歲不能結絶朕甚惡之自今可行則行可罷則罷毋使在下有滯留之歎時諸王皆從以趙王永中留輔太子四月己未朔太白晝見咸平尹移剌道薨庚申次廣寧府丙寅次東京丁卯朝謁孝寧宮給復東京百里內夏秋稅租一年在城隨關年七十者補一官曲赦百里內犯徒二年以下罪乙酉觀漁于混同江五月己丑至上京居于光興宮庚寅朝謁于慶元宮戊戌宴于皇武殿上謂宗戚曰朕思故鄉積有日矣今既至此可極歡飲君臣同之賜諸王妃主宰執百官命婦各有差宗戚皆霑醉起舞竟日乃罷六月辛酉幸按出虎水臨漪亭壬戌閲馬于緑野淀七月乙未上謂宰臣曰天子巡狩當舉善罰惡凡士民之孝弟姻睦者舉而用之其不顧廉恥無行之人則教戒之不悛者則加懲罰丙午獵于勃野淀乙卯上謂宰臣曰今時之人有罪不問既過之後則謂不知有罪必責則謂每事尋罪風俗之薄如此不以文德感化不能復于古也卿等以德輔佐當使復還古風八月癸亥以太府監張大節等為賀宋生日使侍御史遙里特末哥為夏國生日使乙亥詔免上京今年市稅九月甲辰歲星晝見十月丁卯獵于近郊十一月辛卯還宮甲午詔以上京天寒地遠宋正旦生日高麗夏國生日並不須遣使令有司報諭丙午尚書省奏徙速頻胡里改三猛安二十四謀克以實上京十二月丙辰獵于近郊己卯還宮二十五年正月乙酉朔丁亥宴妃嬪親王公主文武從官于光德殿宗室宗婦及五品以上命婦與坐者千七百餘人賞賚有差二月癸酉以東平尹烏古論思列怨望殺之丁丑如春水四月己未至自春水癸亥幸皇武殿擊毬許士民縱觀甲子詔於速頻胡里改兩路猛安下選三十謀克為三猛安移置于率督畔窟之地以實上京壬申曲赦會寧府仍放免今年租稅百姓年七十以上者補一官甲戌以會寧府官一人兼大宗正丞以治宗室之政上謂羣臣曰上京風物朕自樂之每奏還都輒用感愴祖宗舊邦不忍捨去萬歲之後當置朕于太祖之側卿等無忘朕言丁丑宴宗室宗婦于皇武殿大功親賜官三階小功二階緦麻一階年高屬近者加宣武將軍及封宗女賜銀絹各有差曰朕尋常不飲酒今日甚欲成醉此樂亦不易得也宗室婦女及羣臣故老以次起舞進酒上曰來數月未有一人歌本曲者吾為汝等歌之命宗室子弟坐殿下者皆坐殿上聽上自歌其詞道王業之艱難及繼述之不易至慨想祖宗宛然如睹慷慨悲激不能成聲歌畢泣下右丞相元忠率羣臣宗戚奉觴上壽皆稱萬歲於是諸夫人更歌本曲如私家之會既醉上復續調至一鼓乃罷己卯發上京庚辰宗室戚屬奉辭上曰朕久思故鄉甚欲留一二歲京師天下根本不能久於此也太平歲久國無征徭汝等皆奢縱往往貧乏朕甚憐之當務儉約無忘祖先艱難因泣數行下宗室戚屬皆感泣而退五月庚寅平章政事襄奉御平山等射懷孕兔上怒杖平山三十召襄誡飭之遂下詔禁射兔壬寅次天平山好水川癸卯遣使臨潢泰州勸農丙午命尚書省奏事衣窄紫六月甲寅獵近山見田壠不治命笞田者庚申皇太子允恭薨丙寅尚書右丞相烏古論元忠罷庚午遣左宣徽使唐括鼎詣京師致祭皇太子戊寅命皇太子妃及諸皇孫執喪並用漢儀七月戊申發好水川九月辛巳朔次轄沙河賜百歲老嫗帛甲申次遼水召見百二十歲女直老人能道太祖開創事上嘉歎賜食並賜帛己酉至自上京是日上臨奠宣孝皇太子于熙春園十月丙辰尚書省奏親軍數多宜稍減損詔定額為三千宰臣退上謂左右曰宰相年老艱于久立可置小榻廊下使少休息甲子禁上京等路大雪及含胎時採捕上謂宰臣曰護衛年老出職而授臨民手字尚不能畫何以治民人胸中明暗外不能知精神昏耄已見於外是強其所不能也天子以兆民為子不能家家而撫在用人而已知其不能而強授之百姓其謂我何丁丑命學士院諫院祕書監司天臺著作局閣門通進拱衛直武器署等官凡直宮中午前許退十一月庚辰朔詔曰豺未祭獸不許採捕冬月雪尺以上不許用網及速撒海恐盡獸類歲星晝見壬午太白晝見甲午以臨潢尹僕散守中等為賀宋正旦使丙申夏國遣使問起居戊戌以曹王永功為御史大夫壬寅以禮部員外郎移剌履為高麗生日使十二月戊午以皇孫金源郡王麻達葛判大興尹進封原王甲子太白晝見經天丙寅左丞相完顏守道左丞張汝弼右丞粘割斡特剌參知政事張汝霖坐擅增東宮諸皇孫食料各削官一階甲戌制增留守統軍總管招討都轉運府尹轉運節度使月俸上謂宰臣曰太尉守道論事止務從寬犯罪罷職者多欲復用若懲其首惡後來知畏罪而復用何以示戒是日命範銅為禮信之寶凡賜外方禮物給信袋則用之丙子上問宰臣曰原王大興行事如何右丞斡特剌對曰聞都人皆稱之上曰朕令察于民間咸言見事甚明豫奪皆不失當曹豳二王弗能及也又聞有女直人訴事以女直語問之漢人訴事漢語問之大抵習本朝語為善不習則淳風將棄汝弼對曰不忘本者聖人之道也斡特剌曰以西夏小邦崇尚舊俗猶能保國數百年上曰事當任實一事有僞則喪百真故凡事莫如真實也二十六年正月庚辰朔宋高麗夏遣使來賀甲辰如長春宮春水二月癸酉還都乙亥詔曰每季求仕人問以疑難令剖決之其才識可取者仍訪察政迹如其言行相副即加升用三月己卯朔萬春節宋高麗夏遣使來賀丁亥以大理卿闕上問誰可右丞粘割斡特剌言前吏部尚書唐括貢可乃授以是職己丑尚書省擬奏除授上曰卿等在省未嘗薦士止限資級安能得人古有布衣入相者聞宋亦多用山東河南流寓疏遠之人皆不拘於貴近也以本朝境土之大豈無其人朕難遍知卿又不舉自古豈有終身為相者外官三品以上必有可用之人但無故得進耳左丞張汝弼曰下位雖有才能必試之乃見參政程輝曰外官雖有聲一旦入朝却不稱任亦在沙汰而已癸巳香山寺成幸其寺賜名大永安給田二千畝栗七千株錢二萬貫丁酉以親軍完顏乞奴言制猛安謀克皆先讀女直字經史然後承襲因曰但令稍通古今則不肯為非爾一親軍粗人乃能言此審其有益何憚而不從四月壬子尚書省奏定院務監官虧兌陪納法及橫班格因曰朕常日御膳亦從減省嘗有一公主至至無餘膳可與當直官皆目睹之若欲豐腆雖日用五十羊亦不難矣然皆民之脂膏不忍為也監臨官惟知利己不知其利自何而來朕嘗歷外任稔知民間之事想前代之君雖享富貴不知稼穡艱難者甚多其失天下皆由此也遼主聞民間乏食謂何不食乾臘蓋幼失師保之訓及其即位故不知民間疾苦也隋煬帝時楊素專權行事乃不慎委任之過也與正人同處所知必正道所聞必正言不可不慎也今原王府官屬當選純謹秉性正直者充勿用有權術之人戊午尚書左丞張汝弼罷己未幸壽安宮壬戌太尉左丞相完顏守道致仕以客省使李磐為橫賜高麗使尚書省奏北京轉運使以贓除名尚書省奏事上曰比有上書言職官犯除名不可復用朕謂此言極當如軍期急速權可使用今天下無事復用此輩何以戒將來又奏年前以諸路水旱於軍民地土二十一萬餘頃內擬免稅四十九萬餘石從之詔曰今之稅考古行之但遇災傷常加蠲免五月甲申以司徒樞密使徒單克寧為太尉尚書左丞相判大宗正事趙王永中復為樞密使大興尹原王麻達葛為尚書右丞相賜名璟參知政事程輝致仕戊子盧溝決於上陽村湍流成河遂因之庚寅御史大夫曹王永功罷以豳王永成為御史大夫戊戌以尚書右丞粘割斡特剌為左丞參知政事張汝霖為右丞六月癸亥尚書省奏速頻胡里改世襲謀克事上曰其人皆勇悍昔世祖與之鄰苦戰纍年僅能克復其後乍服乍叛至穆康時始服聲教近世亦嘗分徙朕欲稍遷其民上京實國家長久之計己巳上謂宰執曰齊桓中庸主也得一管仲遂成霸業朕夙夜以思惟恐失人朕既不知卿等又不薦必俟全才而後舉蓋亦難矣如舉某人長於某事朕亦量材用之朕與卿等俱老矣天下至大豈得無人薦舉人材當今急務也又言人之有幹能固不易得然不若德行之士最優也上謂右丞相原王曰爾嘗讀太祖實録乎太祖征麻産襲之至泥淖馬不能進太祖捨馬而步歡都射中麻産遂擒之創業之難如此可不思乎甲戌詔曰凡陳言文字詣登聞檢院送學士院聞奏毋經省廷七月壬午詔給內外職事官兼職俸錢丙申御史中丞馬惠迪為參知政事庚子上聞同知中都路都轉運使事趙曦瑞其在職應錢穀利害文字多不題署但思安身降授積石州刺史閏月己未還都八月丁丑上謂宰臣曰親軍雖不識字亦令依例出職若涉贓賄必痛繩之太尉左丞相克寧曰依法則可上曰朕於女直人未嘗不知優恤然涉於贓罪雖朕子弟亦不能恕太尉之意欲姑息女直人耳戊寅尚書省奏河決衛州壞命戶部侍郎王寂都水少監王汝嘉徙衛州胙城縣丁亥尚書省奏遣吏部侍郎李晏等二十六人分路推排諸路物力從之己丑以宿直將軍李達可為夏國生日使辛卯以益都尹宗浩等為賀宋生日使甲午秋獵庚子次薊州辛丑幸仙洞寺壬寅幸香林淨名二寺九月甲辰朔幸盤山上方寺因遍歷中盤天香感化諸寺庚申還都丙寅上謂宰臣曰烏底改叛亡已遣人討之可益以甲士毀其船參知政事馬惠迪曰得其人不可用有其地不可居恐不足勞聖慮上曰朕亦知此類無用所以毀其船欲不使再窺邊境耳十月戊寅定職官犯贓同職相糾察法庚寅上謂宰臣曰西南西北兩路招討司地隘猛安人戶無處圍獵不能間習騎射委各猛安謀克官依時教練其弛慢過期及不親監視並決罰之甲午詔增河防軍數戊戌寧昌軍節度使崇肅行軍都統忠道以討烏底改不待克敵而還崇肅杖七十削官一階忠道杖八十削官三階十一月甲辰朔定閔宗陵廟薦享禮上謂宰臣曰女直人中材傑之士朕少有識者蓋亦難得也新進士如徒單鎰夾古阿里補尼厖古鑑輩皆可用之材也起身刀筆者雖才力可用其廉介之節終不及進士今五品以上闕員甚多必資級相當至老有不能得者況欲至卿相乎古來宰相率不過三五年而退罕有三二十年者卿等特不舉人甚非朕意上顧修起居注崇璧曰斯人孱弱付之以事未必能辦以其謹厚長者故置諸左右欲諸官效其為人也辛亥以刑部尚書移剌子元等為賀宋正旦使戊午以左警巡副使鶻沙通敏善斷擢殿中侍御史兼右三部司正庚申立右丞相原王璟為皇太孫甲子上謂宰臣曰朕聞宋軍自來教習不輟今我軍專務游惰卿等勿謂天下既安而無豫防之心一旦有警軍不可用顧不敗事耶其令以時訓練丙寅上謂侍臣曰唐太子承乾所為多非度太宗縱而弗檢遂至於廢如早為禁止當不至是朕於聖經不能深解至於史傳開卷輒有所益每見善人不忘忠孝檢身廉潔皆出天性至於常人多喜為非有天下者苟無以懲之何由致治孔子為政七日而誅少正卯聖人尚爾況餘人乎戊辰上謂宰臣曰朕雖年老聞善不厭孔子云見善如不及見不善如探湯大哉言乎右丞張汝弼對曰知之非艱行之惟艱以拱衛直副都指揮使韓景懋為高麗生日使以近侍局直長尼厖古鑑純直通敏擢皇太孫侍丞己巳獵近郊庚午上謂宰臣曰朕方前古明君固不可及至於不納近臣讒言不受戚里私謁亦無愧矣朕嘗自思豈能無過所患過而不改過而能改庶幾無咎省朕之過頗喜興土木之工自今不復作矣十二月甲申上退朝御香閣左諫議大夫黃久約言遞送荔支非是上諭之曰朕不知也今令罷之丙戌上謂宰臣曰有司奉上惟沽辦事之名不問利害如何朕嘗欲得新荔支兵部遂於道路特設鋪遞比因諫官黃久約言朕方知之夫為人無識一旦臨事便至顛沛宮中事無大小朕常親覽者以不得人故也如使得人寧復他慮丁亥上謂宰臣曰朕年來惟以省約為務常膳止四五味已厭飫之比初即位十減七八宰臣曰天子自有制不同餘人上曰天子亦人耳枉費安用丙申上謂宰臣曰比聞河水泛溢民罹其害者資産皆空今復遣官於彼推排何耶右丞張汝霖曰今推排皆非被災之處上曰必鄰道也既鄰水而居豈無驚擾遷避者乎計其資産豈有餘哉尚何推排為又曰平時用人宜尚平直至於軍職當用權謀使人不易測可以集事唐太宗自少年能用兵其後雖居帝位猶不能改吮瘡剪鬚皆權謀也二十七年正月癸卯朔宋高麗夏遣使來賀己酉以襄城令趙渢為應奉翰林文字渢入謝上問宰臣曰此党懷英所薦耶對曰諫議黃久約亦嘗薦之上曰學士院比舊殊無人材何也右丞張汝霖曰人材須作養若令久任練習自可得人庚戌如長春宮春水二月乙亥還都己卯改閔宗廟號曰熙宗癸未命曲陽縣置錢監賜名利通乙酉上謂宰執曰朕自即位以來言事者雖有狂妄未嘗罪之卿等未嘗肯盡言何也當言而不言是相疑也君臣無疑則謂之嘉會事有利害可竭誠言之朕見緘默不言之人不欲觀之矣丁亥命沿河京府州縣長二官並帶管勾河防事己丑諭宰執曰近侍局官須選忠直練達之人用之朕雖不聽讒言使佞人在側將恐漸漬聽從之矣上謂宰執曰朕聞寶坻尉蒙括特末也清廉其為政何如左丞斡特剌對曰其部民亦稱譽之然不知所稱何事上曰凡為官但得清廉亦可矣安得全才之人可進官一階升為令又言朕時或體中不佳未嘗不視朝諸王百官但有微疾便不治事自今宜戒之丙申命罪人在禁有疾聽親屬入視三月癸卯朔萬春節宋高麗夏遣使來賀辛亥皇太孫受冊赦乙卯尚書省言孟家山金口閘下視都城百四十餘尺恐暴水為害請閉之從之上謂大臣曰十室之邑必有忠信今天下之廣人民之衆豈得無人唐之顏真卿段秀實皆節義之臣也終不升用亦當時大臣固蔽而不舉也卿等當不私親故而特舉忠正之人朕將用之又言國初風俗淳儉居家惟衣布衣非大會賓客未嘗輒烹羊豕朕嘗念當時節儉之風不欲妄費凡宮中之官與賜之食者皆有常數四月丙戌以刑部尚書宗浩為參知政事丙申上如金蓮川辛丑京師地震五月壬子詔罷曷懶路所進海葱及太府監日進時果曰葱果應用幾何徒勞人耳惟上林諸果三日一進庚午以所進御膳味不調適有旨問之尚食局直長言臣聞老母病劇私心憒亂如喪魂魄以此有失嘗視臣罪萬死上嘉其孝即令還家侍疾俟平愈乃來六月戊寅免中都河北等路嘗被河決水災軍民租稅庚辰太白晝見七月丙午太白晝見經天壬子秋獵八月丙戌次雙山子九月己亥朔還都己酉上謂宰臣曰朕今歲春水所過州縣其小官多幹事蓋朕前嘗有賞擢故皆勉力以此見專任責罰不如用賞之有激勸也以河中尹田彥臯等為賀宋生日使武器署令斜卯阿土為夏國生日使十月乙亥宋前主構殂庚辰祫享于太廟庚寅上謂宰臣曰朕觀唐史惟魏徵善諫所言皆國家大事甚得諫臣之體近時臺諫惟指摘一二細碎事姑以塞責未嘗有及國家大利害者豈知而不言歟無乃亦不知也宰臣無以對十一月庚戌以左副都點檢崇安為賀宋正旦使甲寅詔河水泛溢農夫被災者與免差稅一年衛懷孟鄭四州塞河勞役並免今年差稅庚申平章政事崇尹致仕甲子上謂宰臣曰卿等老矣殊無可以自代者乎必待朕知而後進乎顧右丞張汝霖曰若右丞者亦石丞相所言也平章政事襄及汝霖對曰臣等苟有所知豈敢不言但無人耳上曰春秋諸國分裂土地褊小皆稱有賢卿等不舉而已今朕自勉庶幾致治他日子孫誰與共治者乎宰臣皆有慚色十二月庚午以翰林待制趙可為高麗生日使丁丑獵于近郊壬午宋遣使告哀甲申上諭宰臣曰人皆以奉道崇佛設齊讀經為福朕使百姓無寃天下安樂不勝於彼乎爾等居輔相之任誠能匡益國家使百姓蒙利不惟身享其報亦將施及子孫矣左丞斡特剌曰臣等敢不盡心第才不逮不能稱職耳上曰人亦安能每事盡善但加勉勵可也戊子禁女直人不得改稱漢姓學南人衣裝犯者抵罪二十八年正月丁酉朔宋高麗夏遣使來賀癸卯遣宣徽使蒲察克忠為宋弔祭使甲辰如春水二月乙亥還都己丑宋遣使獻先帝遺留物癸巳宋使朝辭以所獻禮物中玉器五玻璃器二十及弓劍之屬使還遺宋曰此皆爾國前主珍玩之物所宜寶藏以無忘追慕今受之義有不忍歸告爾主使知朕意也三月丁酉朔萬春節宋高麗夏遣使來賀御慶和殿受羣臣朝復宴于神龍殿諸王公主以次捧觴上壽上歡甚以本國音自度曲蓋言臨御久春秋高渺然思國家基緒之重萬世無窮之託以戒皇太孫當修身養德善于持守及命太尉左丞相克寧盡忠輔導之意於是上自歌之皇太孫及克寧和之極歡而罷戊申命隨朝六品外路五品以上職事官舉進士已在仕才可居翰苑者試制詔等文字三道取文理優贍者補充學士院職任應赴部求仕人老病昏昧者勒令致仕止給半俸更不遷官甲寅幸壽安宮四月癸酉命增外任小官及繁難局分承應人俸丁丑以陝西路統軍使孛术魯阿魯罕為參知政事癸未命建女直大學五月丙午制諸教授必以宿儒高才者充給俸與丞簿等戊申宋使來謝弔祭七月辛亥尚書左丞粘割斡特剌罷八月甲子朔日有食之辛未還都庚辰上謂宰臣曰近聞烏底改有不順服之意若遣使責問彼或抵捍不遜則邊境之事有不可已者朕嘗思之招徠遠人於國家殊無所益彼來則聽之不來則勿強其來此前世羈縻之長策也參知政事孛术魯阿魯罕罷壬午以山東路統軍使完顏婆盧火為參知政事甲申上謂宰臣曰用人之道當自其壯年心力精強時用之若拘以資格則往往至於耄老此不思之甚也阿魯罕使其早用朝廷必得補助之力惜其已衰老矣凡有可用之材汝等宜早思之九月甲午朔以鷹坊使崇夔為夏國生日使丙申以安武軍節度使王克溫等為賀宋生日使己亥秋獵乙卯還都十月乙丑京府及節度州增置流泉務凡二十八所禁糠禪瓢禪其停止之家抵罪乙酉尚書省奏擬除授而拘以資格上曰日月資考所以待庸常之人若才行過人豈可拘以常例國家事務皆須得人汝等不能隨才委使所以事多不治朕固不知用人之術汝等但務循資守格不思進用才能豈以才能見用將奪己之祿位乎不然是無知人之明也羣臣皆曰臣等豈敢蔽賢才識不逮耳上顧謂右丞張汝霖曰前世忠言之臣何多今日何少也汝霖對曰世亂則忠言進承平則忠言無所施上曰何代無可言之事但古人知無不言今人不肯言耳汝霖不能對十一月戊戌以改葬熙陵詔中外上謂侍臣曰凡修身者喜怒不可太極怒極則心勞喜極則氣散得中甚難是故節其喜怒以思安身今宮中一歲未嘗責罰人也庚子太白晝見詔南京大名府等處避水逃移不能復業者官與津濟錢仍量地頃畝給以耕牛甲辰以河中尹田彥臯等為賀宋正旦使戊申上謂宰臣曰制條以拘於舊律間有難解之辭夫法律歷代損益而為之彼智慮不及而有乖違本意者若行刪正令衆易曉有何不可宜修之務令明白有司奏重修上京御容殿上謂宰臣曰宮殿制度苟務華飾必不堅固今仁政殿遼時所建全無華飾但見它處歲歲修完惟此殿如舊以此見虛華無實者不能經久也今土木之工滅裂尤甚下則吏與工匠相結為姦侵剋工物上則戶工部官支錢度材惟務苟辦至有工役才畢隨即欹漏者姦弊苟且勞民費財莫甚於此自今體究重抵以罪庚戌上謂宰臣曰朕近讀漢書見光武所為人有所難能者更始既害其兄伯升當亂離之際不思報怨事更始如平日人不見戚容豈非人所難能乎此其度量蓋將大有為者也其他庸主豈可及哉右丞張汝霖曰湖陽公主奴殺人匿主車中洛陽令董宣從車中曳奴下殺之主入奏光武欲殺宣及聞宣言意遂解使宣謝主宣不奉詔主以言激怒光武光武但笑而已更賜宣錢三十萬上曰光武聞直言而怒解可謂賢主矣令宣謝主則非也高祖英雄大度駕馭豪傑起自布衣數年而成帝業非光武所及然及即帝位猶有布衣粗豪之氣光武所不為也癸丑幸太尉克寧第十二月丙寅以大理正移剌彥拱為高麗生日使乙亥上不豫庚辰赦天下乙酉詔皇太孫璟攝政居慶和殿東廡丙戌以太尉左丞相徒單克寧為太尉兼尚書令平章政事襄為尚書右丞相右丞張汝霖為平章政事參知政事完顏婆盧火罷以戶部尚書劉暐為參知政事戊子詔尚書令徒單克寧右丞相襄平章政事張汝霖宿於內殿二十九年正月壬辰朔上大漸不能視朝詔遣宋高麗夏賀正旦使還癸巳上崩于福安殿壽六十七皇太孫即皇帝位己亥殯于大安殿三月辛卯朔上尊諡曰光天興運文德武功聖明仁孝皇帝廟號世宗四月乙酉葬興陵贊曰世宗之立雖由勸進然天命人心之所歸雖古聖賢之君亦不能辭也蓋自太祖以來海內用兵寧歲無幾重以海陵無道賦役繁興盜賊滿野兵甲並起萬姓盻盻國內騷然老無留養之丁幼無顧復之愛顛危愁困待盡朝夕世宗久典外郡明禍亂之故知吏治之得失即位五載而南北講好與民休息於是躬節儉崇孝弟信賞罰重農桑慎守令之選嚴廉察之責却任得敬分國之請拒趙位寵郡縣之獻孳孳為治夜以繼日可謂得為君之道矣當此之時羣臣守職上下相安家給人足倉廩有餘刑部歲斷死罪或十七人或二十人號稱小堯舜此其效驗也然舉賢之急求言之切不絶于訓辭而羣臣偷安苟祿不能將順其美以底大順惜哉
