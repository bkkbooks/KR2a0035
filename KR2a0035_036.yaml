body:
  text: 金史卷三十六志第十七禮九國初即位儀受尊號儀上壽儀朝參常朝儀肆赦儀臣下拜詔儀國初即位儀收國元年春正月壬申朔諸路官民耆老畢會議創新儀奉上即皇帝位阿離合悶宗翰乃陳耕具九祝以闢土養民之意復以良馬九隊隊九匹別為色並介胄弓矢矛劍奉上國號大金建元收國天會元年九月六日皇弟諳板孛極烈即皇帝位己未告祀天地丙寅大赦改元受尊號儀皇統元年正月二日太師宗幹率百僚上表請上皇帝尊號凡三請詔允七日遣上京留守奭告天地社稷析津尹宗強告太廟十日帝服袞冕御元和殿宗幹率百僚恭奉册禮册文云云臣等謹奉玉册玉寶上尊號曰崇天體道欽明文武聖德皇帝是日皇帝改服通天冠宴二品以上官及高麗夏國使十二日恭謝祖廟還御宣和門大赦改元大定七年恭上皇帝尊號前三日遣使奏告天地宗廟社稷前二日諸司停奏刑罰文字百官習儀於大安殿庭兵部帥其屬設黃麾仗於大安殿門之內外宣徽院帥儀鸞司於前一日設受册寶壇於大安殿中間又設御榻於壇上又設册寶幄次於大安殿門外及設皇太子幕次於殿東廊又設羣官次於大安門外大樂令與協律郎前一日設宮縣於殿庭又設登歌樂架於殿上立舞表於殿下符寶郎其日俟文武羣官入奉八寶置於御座左右候上册寶訖復舁寶還所司其日質明奉册太尉奉寶司徒讀册中書令讀寶侍中以次應行事官並集於尚書省俟册寶興乘馬奉迎册寶至應天門下馬由正門步導入至大安殿門外置册寶於幄次舁册寶床弩手人等分立於左右文武羣官並朝服入次攝太常卿與大樂令帥工人入就位協律郎各就舉麾位舁册寶案官由西偏門先入置案於殿東西間褥位置訖各退于西階册寶位後捧册官捧寶官舁册匣官舁寶盝官由西偏門先入至殿西階下册寶褥位之西東向立俟閣門報通事舍人引攝侍中版奏中嚴訖典儀贊者各就位閣門官引文武百僚分左右入於殿階下磚道之東西相向立符寶郎奉八寶由西偏門分入升置殿上東西間相向訖分左右立於寶後通事舍人引攝侍中版奏外辦扇合服袞冕以出曲直華蓋侍衛警蹕如常儀殿上鳴鞭訖殿下亦鳴鞭初索扇協律郎跪俯伏興舉麾工鼓柷奏乾寧之曲出自東房即座儀鸞使副添香爐煙升扇開簾捲協律郎偃麾戞敔樂止太常博士通事舍人自册寶幄次分引册太常卿前導吏部侍郎押册而行奉册太尉讀册中書令舉册官於册後以次從之次太常博士通事舍人二員分引寶禮部侍郎押寶而行奉寶司徒讀寶侍中舉寶官於寶後以次從之由正門入宮縣奏歸美揚功之曲太常卿於册牀前導至第一墀香案南藉册寶褥位上少置太常卿與舉册寶官退於册寶稍西東向立應博士舍人立於其後舁册寶牀弩手傘子官等又於其後皆東向太尉司徒中書令侍中皆於册後面北以次立吏部侍郎禮部侍郎次立於其後立定樂止閣門舍人分引東西兩班羣官合班轉北向立中間少留班路俟立定太常博士通事舍人四員分引太尉司徒中書令侍中吏部禮部侍郎以次各復本班訖博士舍人退以俟初引時樂奏歸美揚功之曲至位立定樂止典儀曰拜贊者承傳太尉以下應在位官皆舞蹈五拜班首出班起居訖又贊再拜如朝會常儀太常博士通事舍人四員再引太尉司徒中書令侍中吏禮部侍郎復進至册寶所稍南立定舁册寶牀弩手傘子官並進前舉册寶牀興太常博士通事舍人二員分引册太常卿前導吏部侍郎押册而行奉册太尉讀册中書令舉册官於册後以次從之册初行樂奏肅寧之曲次通事舍人太常博士又二員分引寶禮部侍郎押寶而行奉寶司徒讀寶侍中舉寶官於寶後以次從之詣西階下至册寶褥位少置册北寶南樂止舁册寶牀弩手傘子官等退於後稍西東向立捧册官與舁册官並進前取册匣升太常博士通事舍人分引册太常卿側身導册先升奉册太尉讀册中書令舉册官捧册官於册後以次從升册初行樂奏肅寧之曲進至殿上博士舍人分左右於前楹立以俟讀册中書令於欄子外前楹稍西立以俟舉册官捧册官立於其後奉册太尉從升至褥位搢笏少前跪置訖執笏俯伏興樂止退於前楹稍西立以俟太常博士立於後太常卿少退東向立舁册官立於其後皆東向捧册官先入舉册官次入讀册中書令又次入捧册官四員皆搢笏雙跪捧舉册官二員亦搢笏兩邊單跪對舉中書令執笏進跪稱中書令臣某讀册讀訖俯伏興中書令俟册興先退通事舍人引降自東階復本班訖太常卿降復寶牀前舁册官並進與捧册官等取册匣興置於殿東間褥位案上西向捧舉册官等降自東階還本班舁册官亦退太常博士引奉册太尉降自西階東向立以俟次捧寶官與舁寶官俟讀册中書令讀訖出並進前取寶盝升太常博士通事舍人分引寶太常卿側身導寶先升奉寶司徒讀寶侍中舉寶官捧寶官於寶後以次從升寶初行樂奏肅寧之曲進至殿上博士舍人俱退不升並於前楹稍西立俟讀寶侍中於欄子外前楹間稍西立以俟舉寶官捧寶官立於其後奉寶司徒從升至褥位搢笏少前跪置訖執笏俯伏興樂止司徒退於前楹西立以俟太常卿少退東向立舁寶官立於其後皆東向捧寶官先入舉寶官次入讀寶侍中又次入捧寶官四員皆搢笏雙跪捧舉寶官二員亦搢笏兩邊單跪對舉侍中執笏進跪稱侍中臣某讀寶讀訖俯伏興侍中俟寶興先退通事舍人引降自西階復本班訖舁寶官進前與捧寶舉寶官等取寶盝興置於殿之西間褥位案上東向捧寶舉寶官等與太常卿俱降自西階及吏部侍郎皆復本班舁寶官亦退太常博士引奉寶司徒次奉册太尉東向立定博士舍人贊引太尉司徒進詣第一墀香案南褥位立定博士舍人稍退典儀曰拜贊者承傳在位官皆再拜訖博士舍人二員引太尉詣東階升宮縣奏純誠享上之曲至階止閣門使二員引太尉進至前立定樂止閣門使揖贊太尉拜跪賀殿下閣門揖百僚躬身太尉稱文武百僚具官臣等言致賀詞云云俯伏興退至階上博士舍人分引太尉降至東階初降宮縣作肅寧之曲復香案南褥位立定樂止博士舍人少退典儀曰拜贊者承傳太尉司徒及在位羣官俱再拜舞蹈三稱萬歲又再拜訖通事舍人引攝侍中升自東階進詣前楹間躬承旨退臨階西向稱有制典儀曰拜贊者承傳太尉司徒及在位羣官俱再拜躬身宣詞云云宣訖通事舍人引侍中還位典儀曰拜贊者承傳階上下應在位羣官俱再拜舞蹈三稱萬歲又再拜訖博士舍人分引太尉司徒就百僚位初引宮縣作肅寧之曲至位立定樂止閣門舍人分引應北面位羣官各分班東西相向立定通事舍人引攝侍中升自東階當前楹間跪奏禮畢俯伏興引降還位扇合簾降協律郎俯伏興舉麾工鼓柷奏乾寧之曲降座入自東房還後閣進膳侍衛警蹕如儀扇開樂止捧册官帥舁册床人捧寶官帥舁寶床人皆升殿取匣盝蓋訖置於床前引進司官前導通事舍人贊引詣東上閣門上進通事舍人分引文武百僚等以次出歸幕次賜食以俟上壽上册寶禮畢有司供辦御床及與宴羣官位並如曲宴儀攝太常卿與大樂令帥工人入並協律郎各就舉麾位俟舍人報通事舍人引三師以下文武百僚親王宗室等分左右入至殿階下稍南東西相向立通事舍人先引攝侍中版奏中嚴少頃又奏外辦扇合鳴鞭協律郎跪俯伏興工鼓柷宮縣奏乾寧之曲服通天冠絳紗袍即座簾捲內侍贊扇開殿上下鳴鞭戞敔樂止儀使副等添香爐煙升通事舍人引班首已下合班樂奏肅寧之曲至北向位重行立定中間少留班路通事舍人引攝侍中詣東階升至殿上少立閣門舍人引禮部尚書出班前北向俯伏跪奏稱禮部尚書臣某言請允羣臣上壽俯伏興躬身通事舍人引攝侍中少退舍人贊禮部尚書再拜訖贊祗候復本班內侍局進御床入次良醞令於殿下橫階南酹酒訖典儀曰拜贊者承傳在位官皆再拜隨拜三稱萬歲訖平立太常博士通事舍人分引攝上公由東階升初升宮縣奏肅寧之曲殿上舍人少退二閣使揖上公進至進酒褥位樂止宣徽使以爵授上公上公搢笏受爵詣榻前跪進受爵訖上公執槃授宣徽使訖二閣使揖上公入欄子內贊拜跪殿下閣門揖百僚皆躬身通事舍人揖攝侍中進詣前楹間躬承旨退臨階西向稱有制典儀曰拜贊者承傳上公及在位羣官皆再拜隨拜三稱萬歲訖躬身宣曰得公等壽酒與公等內外同慶閣門舍人贊宣諭訖上公與百僚皆舞蹈五拜訖閣門舍人引百僚分班東西序北向立博士舍人再引上公自東階升宮縣奏肅寧之曲至進酒褥位樂止上公搢笏宣徽使授上公槃上公詣欄子內褥位跪舉酒宮縣奏景命萬年之曲飲訖樂止上公進受虛爵訖復褥位以爵授宣徽使訖二閣使揖上公退內侍局舁御床出博士舍人並進前分引降自東階宮縣作肅寧之曲閣門舍人分引東西兩班隨上公俱復北向位立定樂止典儀曰拜贊者承傳在位官皆再拜三稱萬歲訖平立殿上通事舍人揖攝侍中進詣前楹間躬承旨退臨階西向閣門官先揖百僚躬身侍中稱有制典儀曰拜贊者承傳在位官皆再拜訖躬身宣曰延王公等升殿典儀曰拜贊者承傳在位官皆再拜訖搢笏舞蹈又再拜訖太常博士通事舍人引王公以下合赴宴羣官分左右升殿不與宴羣官分左右捲班出宮縣奏肅寧之曲百僚至殿上坐後立樂止內侍局進御床入依尋常宴會再進第一爵酒登歌奏聖德昭明之曲飲訖樂止執事者行羣官酒宮縣作肅寧之曲文舞入觴行一周樂止尚食局進食執事者設羣官食宮縣奏保大定功之舞三成止出又進第二爵酒登歌奏天贊堯齡之曲飲訖樂止執事者行羣官酒宮縣作肅寧之曲武舞入觴行一周樂止尚食局進食執事者設羣官食宮縣奏萬國來同之舞三成止出又進第三爵酒登歌奏慶雲之曲飲訖樂止執事者行羣官酒宮縣作肅寧之曲觴行一周樂止尚食局進食執事者設羣官食宮縣奏肅寧之曲食畢樂止閣門官分揖侍宴羣官起立於席後通事舍人引攝侍中詣榻前俯伏興跪奏侍中臣某言禮畢俯伏興閣門舍人分引羣官俱降東西階內侍局舁御床出宮縣作肅寧之曲至北向位立定樂止典儀曰拜贊者承傳在位官皆再拜訖搢笏舞蹈又再拜訖再分班東西序立扇合簾降殿上下鳴鞭協律郎俯伏跪舉麾興工鼓柷奏乾寧之曲降座入自東房還後閣侍衛如來儀內侍贊扇開戞敔樂止通事舍人引攝侍中版奏解嚴所司承旨放仗在位羣官皆再拜以次出元日聖誕上壽儀皇帝升御座鳴鞭報時畢殿前班小起居各復侍立位舍人引皇太子並臣僚使客合班入至丹墀舞蹈五拜平立閣使奏諸道表目皇太子以下皆再拜引皇太子升殿褥位搢笏捧盞盤進酒皇帝受置於案皇太子退復褥位轉盤與執事者出笏二閣使齊揖入欄子內拜跪致詞云元正啓祚品物咸新恭惟皇帝陛下與天同休若聖節則云萬春令節謹上壽卮伏願皇帝陛下萬歲萬歲萬萬歲祝畢拜興復褥位同殿下臣僚皆再拜宣徽使稱有制在位皆再拜宣答曰履新上壽與卿等內外同慶聖節則曰得卿壽酒與卿等內外同慶詞畢舞蹈五拜齊立皇太子搢笏執盤臣僚分班教坊奏樂皇帝舉酒殿上下侍立臣僚皆再拜皇太子受虛盞退立褥位轉盤盞與執事者出笏左下殿樂止合班在位臣僚皆再拜分引與宴官上殿次引宋國人從至丹墀再拜不出班奏聖躬萬褔再拜喝有敕賜酒食又再拜各袛候平立引左廊立次引高麗夏人從如上儀畢分引左右廊立御果床入進酒皇帝飲則坐宴侍立臣皆再拜進酒官接