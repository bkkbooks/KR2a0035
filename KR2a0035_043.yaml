body:
  text: 金史卷四十三志第二十四輿服上天子車輅皇后妃嬪車輦皇太子車制王公以下車制及鞍勒飾古者車輿之制各有名物表識以祀以封以田以戎所以別上下明等威也歷代相承互有損益或因時創始或襲舊致文奇巧日滋浮靡益蕩加以後世便習騎乘車用蓋寡惟於郊廟祀享法駕導引為一代令儀而不敢廢也其於先王經世立法之意寥乎闊哉金初得遼之儀物既而克宋於是乎有車輅之制熙宗幸燕始用法駕逮至世宗制作乃定班班乎古矣考禮文證國史以見一代之制度云大定十一年將有事於南郊命太常寺檢宋南郊禮鹵簿當用玉輅金輅象輅革輅木輅耕根車明遠車指南車記里鼓車崇德車皮軒車進賢車黃鉞車白鷺車鸞旗車豹尾車軺車羊車各一革車五屬車十二除見有車輅外闕象木革輅耕根明遠皮軒進賢白鷺羊車大輦各一革車三屬車四按五禮新儀玉輅以青金輅以緋象輅以銀褐革輅以黃木輅以皂蓋其物有合隨輅之色者有當用別色者如玉輅用青絲繡雲龍絡帶青羅繡寶相花帶青畫輪轅青氂牛尾此隨輅之色者也若象木革輅則當用緋用銀褐用黃及皂若至尊乘御步武所及非若餘物但為美觀其踏床倚背踏道之褥皆用紅錦座褥及行馬褥透壁軟簾三用銀褐黃青羅錦三色又大輦宋陶穀創意為之至祥符中以其太重減七百餘斤可見當時亦無定制各以意從長斟酌造之其制金玉輅闕可見者象輅革輅木輅耕根皮軒進賢明遠白鷺羊車革車大輦凡十有一象輅黃質金塗銅裝以象飾諸末輪衣以銀褐建大赤餘同玉輅革輅黃質鞔之以革金塗銅裝輪衣以黃建大白餘同玉輅木輅黑質漆之輪衣以皂建大麾餘同玉輅耕根車青質蓋三重制如玉輅而無玉飾皮軒車赤質上有漆柱貫五輪相重畫虎紋一轅進賢車赤質如革車緋輪衣絡帶門簾並繡鳳上設朱漆床香案紫綾衣一轅明遠車制如屋鋭頂重簷勾欄頂上有金龍四角垂鐸上層四面垂簾下層周以花板三轅白鷺車赤質周施花板上有漆柱柱杪刻為鷺鷥銜鵝毛筒紅綬帶柱貫五輪相重輪衣皂頂緋裙緋絡帶並繡飛鷺一轅羊車赤質兩壁油畫龜紋金鳳翅幰衣結帶並繡瑞羊二轅大輦赤質正方油畫金塗銀葉龍鳳裝其上四面施行龍雲𩽆火珠方鑑銀絲囊網珠翠結雲龍鈿窠霞子四角龍頭銜香囊頂輪施耀葉中有銀蓮花坐龍紅綾𩹉碧牙壓帖內設圓鑑香囊銀飾勾欄臺坐紫絲絛網錔中施黃褥上置御座曲几香爐錦結綬几衣輪衣絡帶並緋繡雲龍寶相花金線壓長竿四飾以金塗銀龍頭畫梯托叉行馬七寶輦制如大輦飾以玉裙網七寶滴子用真珠宋欽宗為上皇製海陵自汴取而用之皇后之車六一曰重翟車青質金飾金塗銅鈒花葉段裝釘耀葉二十四明金立鳳一紫羅銷金生色寶相帷一青羅青油幰衣各一朱絲絡網紫羅明金生色雲龍絡帶各二兩廂明金五彩間裝翟羽二金塗鍮石長轅鳳頭三橫轅立鸞八香爐香寶子一副宜男錦帶結朱紅漆杌子踏床各一扶板扶魚一副紅羅明金衣褥紅羅襯褥一青羅行道褥四青羅明金生色雲鳳夾幔一紅羅明金緣紅竹簾二金塗銅葉段行馬二朱紅漆金塗銀葉裝釘胡梯一青羅胡梯尋儀褥二踏道褥十青絹裹大麻索二油蒙帕一二曰厭翟車赤質倒仙錦帷一紫羅紫油幰衣各一朱絲絡網宜男錦絡帶各二餘同重翟惟行道褥夾幔尋儀褥羅及裹索等用紅三曰翟車黃質金飾鍮石葉段裝釘宜男錦帷黃羅油幰衣鍮石長轅鳳頭三而無橫轅立鸞餘同厭翟而羅色用黃四曰安車赤質倒仙錦帷紫油幰衣朱絲絡網天下樂錦絡帶鍮石長轅鳳頭三無橫轅立鸞及香爐香寶子餘同翟車而色皆用紅五曰四望車朱質宜男錦帷青油幰衣轅端螭頭二餘並同安車六曰金根車朱質紫羅紫油幰衣朱絲絡網倒仙錦絡帶各二踏床衣褥用紅綾尋儀褥踏道褥並用綾餘並同安車造六車成後復改造圓輅重簷方輅五華亭頭平頭六等之制又增製九龍車一高二丈廣一丈一尺長二丈六尺五鳳車四各高一丈八尺長廣如之圓輅車一方輅車一重簷車一各高一丈七尺長一丈八尺廣八尺皆駕馬四駕士各五十人並平巾幘生色青緋黃三色寶相花衫銀褐抹帶大口袴平頭輦一五華輦一亭頭輦一各高一丈九尺廣丈五寸長三丈舁士各九十六人作兩番代並生色緋寶相花衫餘如前製管押人員三十五人長腳幞頭紫羅窄衫金銅帶束駕馬繁纓涼屜鈴拂包尾皆從車色金銅面插翟尾朱轡朱總龍車合用紅羅傘一傘子二人用本服錦帽幞帶又檢定扇障等制偏扇如仙人羽扇行障六扇各長八尺高六尺用紅羅表朱𩹉畫雲鳳龍首竿銜鞶結每障用宮人四坐障三扇各長七尺高五尺畫雲鳳紅羅表朱𩹉餘同行障錦六柱八扇各闊二尺高三尺冒以錦內給使八人執宮人車制如屬車駕士八人平巾幘緋衫大口袴鞋襪供奉宮人三十人雲腳紗帽紫衫束帶緑靴明昌元年三月定妃嬪車輦同鍍金鳳頭黃結御妻世婦用間金鳳頭梅紅結子皇太子車制大定六年十二月奏皇太子金輅典故制度及上用金輅儀式奉敕詳定輈旗旗首及應用龍者更以麟為飾省去障塵等物上用金輅名件色數依上公以九為節減四分之一上用輅軾前有金龍改為伏鹿軾上坐龍改為鳳旗十二旒減為九駕赤騮六減為四及簾褥用黃羅處改用梅紅餘並具體成造其制赤質金飾諸末重較箱畫虞文鳥獸黃屋軾作赤伏鹿龍輈金鳳一在軾前設障塵朱蓋黃𩹉輪畫朱牙左建九旒右載闟戟旗首銜金龍頭結綬及鈴緌八鸞在衡二鈴在軾駕赤騮四金鍐方釳插翟尾鏤鍚鞶纓九就皇帝輅自頂至地高一丈七尺今閷四分之一為一丈三尺二寸修廣之閷亦如之王公以下車制一品轅用銀螭頭涼棚杆子月板並許以銀裝飾三品以上螭頭不得施銀涼棚杆子月板亦聽用銀為飾五品以上轅獅頭六品以下轅雲頭庶人坐車平頭止用一色黑油親王鞍塗金銀裹仍鈒以開花障泥用紫羅飾以錦轡以塗金銀裝束用絲結皇家小功以上太皇太后皇太后大功以上皇后期親以上並一品官及官職俱至三品以上者障泥許用金花若經賜或御毬場內不在禁限舊制親王宰執任外者與大興尹皆服小帽束帶銀鞍絲鞭大定中世宗以京尹亦外官三品而與親王無別遂命不得御銀鞍絲鞭惟同外三品例幞頭帶展皂視事承安二年制護衛銅裝鞍轡不得借人庶人馬鞍許用黑漆以骨角鐵為飾不得用玉較具及金銀犀象飾鞍轡輿服中天子袞冕視朝之服皇后冠服皇太子冠服宗室外戚及一品命婦服用臣下朝服祭服公服昔者聖人制為玄黃黼黻之服以象天地之德以章貴賤之儀夏商損益至周大備不可以有加矣自秦滅棄禮法先王之制靡敝不存漢初猶服袀玄以從大祀歷代雖漸復古終亦不純而已金制皇帝服通天絳紗袞冕逼舄即前代之遺制也其臣有貂蟬法服即所謂朝服者章宗時禮官請參酌漢唐更製祭服青衣朱裳去貂蟬竪筆以別於朝服惟公朝則又有紫緋緑三等之服與夫窄紫展皂等事悉著于篇云天眷三年有司以車駕將幸燕京合用通天冠絳紗袍據見闕名件依式成造禮服袍裳方心曲領中單蔽膝革帶大帶玉具劍綬佩舄襪乘輿服大綬六采黑黃赤白縹緑小綬三色同大綬間施三玉環大綬五百首小綬半之白玉雙佩革帶玉鈎冕制天板長一尺六寸廣八寸前高八寸五分後高九寸五分身圍一尺八寸三分並納言並用青羅為表紅羅為𩹉周回用金稜天板下有四柱四面珍珠網結子花素墜子前後珠旒共二十四旒各長一尺二寸青碧線織造天河帶一長一丈二尺闊二寸兩頭各有真珠金碧旒三節玉滴子節花紅線組帶二上有真珠金翠旒玉滴子節花下有金鐸子二梅紅線款幔帶一黈纊二真珠垂繫上用金草口咢子二簪窠款幔組帶鈿窠各二內組帶鈿窠四並玉鏤塵碾造玉簪一頂方二寸導長一尺二寸簪頂刻鏤塵雲龍袞用青羅夾製五綵間金繪畫正面日一月一升龍四山十二上下襟華蟲火各六對虎蜼各六對背面星一升龍四山十二華蟲火各十二對虎蜼各六對中單一白羅單製羅領褾襈裳一帶褾襈紅羅八幅夾製繡藻三十二粉十六米十六黼三十二黻三十二蔽膝一帶褾襈並紅羅夾製繡升龍二綬一副大綬以赤黃黑白緑縹六綵織紅羅托𩹉小綬三色同大綬銷金黃羅綬頭上間施三玉環皆刻雲龍大綬五百首小綬半之緋白大帶一銷金黃羅帶頭鈿窠二十四紅羅勒帛一青羅抹帶一玉佩二白玉上中下璜各一半月各二皆刻雲龍玉滴子各二皆以真珠穿製金篦鈎獸面水葉環釘涼帶一紅羅裹縷金上有玉鵝七尾束各一金攀龍口以玳瑁板襯釘腳舄重底紅羅面白綾托𩹉如意頭銷金黃羅緣口玉鼻仁飾以珠襪用緋羅加綿凡大祭祀加尊號受册寶則服袞冕行幸齋戒出宮或御正殿則通天冠絳紗袍鎮圭大圭皇統九年十月二十四日禮部下太常畫鎮圭式樣大禮使據三禮圖以進用之大定十一年太常寺按禮大圭長三尺抒上終葵首天子服之自西魏隋唐以來大圭長尺二寸與鎮圭同蓋鎮圭以鎮天下以四鎮山為飾今其圭已依古制惟無大圭今御府有故宋白玉圭圓無上閷及終葵首自西魏以來所制玉笏皆長尺有二寸方而不折雖非先王之法蓋後世玉難得隨宜故也擬合以御府所藏行禮就用視朝之服初太宗即位始服赭黃自後視百官朝御袍帶章宗即位以世宗之喪有司請御純吉不從乃服淡黃袍烏犀帶常朝則服小帽紅襴偏帶或束帶皇后冠服花株冠用盛子一青羅表青絹襯金紅羅托𩹉用九龍四鳳前面大龍銜穗毬一𩽆前後有花株各十有二及鸂孔雀雲鶴王母仙人隊浮動插瓣等後有納言上有金蟬鑻金兩博鬢以上並用鋪翠滴粉縷金裝珍珠結製下有金圈口上用七寶鈿窠後有金鈿窠二穿紅羅鋪金款幔帶一褘衣深青羅織成翬翟之形素質十二等領褾襈並紅羅織成雲龍中單以素青紗製領織成黼形十二褾袖襈織成雲龍並織紅縠造裳八副深青羅織成翟文六等褾襈織成紅羅雲龍明金帶腰蔽膝深青羅織成翟文三等領緣緅色羅織成雲龍明金帶大綬一長五尺闊一尺黃赤白黑縹緑六彩織成小綬三色同大綬間七寶鈿窠施三玉環上碾雲龍撚金線織成大小綬頭紅羅花襯大帶青羅朱𩹉紕其外上以朱錦下以緑錦紐約用青組撚金線織成帶頭玉佩二𩽆每𩽆上中下璜各一半月墜子各二並玉碾縷金打鈒獸面篦鈎佩子各一水葉子真珠穿綴青衣革帶用縷金青羅裹造上用金打鈒水地龍鵝眼尾龍口攀束子共八事以玳瑁襯金釘腳抹帶二紅羅青羅各一並明金造各長一丈五寸舄以青羅製白綾𩹉如意頭明金黃羅準上用玉鼻仁真珠裝綴繫帶襪青羅表𩹉綴繫帶犀冠減撥花樣縷金裝造上有玉簪一下有玳瑁盤一皇太子冠服冕用白珠九旒紅絲組為纓青纊充耳犀簪導袞青衣朱裳五章在衣山龍華蟲火宗彝四章在裳藻粉米黼黻白紗中單青褾襈裾革帶塗金銀鈎蔽膝隨裳色為火山二章瑜玉雙佩四采織成大綬間施玉環三白襪朱舄舄加金塗銀扣謁廟則服之遠遊冠十八梁金塗銀花飾博山附蟬紅絲組為纓犀簪導朱明服紅裳白紗中單方心曲領絳紗蔽膝白襪黑舄餘同袞冕册寶則服之桓圭長九寸廣三寸厚半寸用白玉若屋之桓楹為二稜太子入朝起居及與宴則朝服紫袍玉帶雙魚袋其視事及見師少賓客則服小帽皂衫玉束帶宗室及外戚並一品命婦衣服聽用明金期親雖別籍女子出嫁並同又五品以上官母妻許披霞帔唯首飾霞帔領袖腰帶許用明金籠金間金之類其衣服止用明銀象金及金條壓繡正班局分承應帶官人雖未出職係班其祖母及母妻子孫之婦同籍兄弟之妻及在室女孫姊妹並同又禁私家用純黃帳幕陳設若曾經宣賜鸞輿服御日月雲肩龍文黃服五箇鞘眼之鞍皆須更改臣下朝服凡導駕及行大禮文武百官皆服之正一品貂蟬籠巾七梁額花冠貂鼠立筆銀立筆犀簪導佩劍緋羅大袖緋羅裙緋羅蔽膝各一緋白羅大帶天下樂暈錦玉環綬一白羅方心曲領白紗中單銀褐勒帛各一玉珠佩二金塗銀革帶烏皮履白綾襪正二品七梁冠銀立筆犀簪導不佩劍緋羅大袖雜花暈錦玉環綬餘並同正四品五梁冠銀立筆犀簪白獅錦銀環綬珠佩銀革帶御史中丞則獬豸冠青荷蓮綬餘並同正五品四梁冠簇四金雕錦銅環綬銀珠佩餘並同正六品至七品三梁冠黃獅錦銅環綬銅珠佩銅束帶餘並同大定二十二年祫享攝官導駕二品冠七梁三品四品冠六梁服有金花五品冠五梁六品冠四梁七品冠三梁監察御史獬豸冠青綬八品九品冠二梁餘製並同祭服皇統七年太常寺言太廟成後奉安神主祫享行禮凡行事執事助祭陪位官準古典當服袞冕九章畫降龍隨品各有等差通典云虞夏殷並十二章日月星辰山龍華蟲作繪於衣宗彝藻火粉米黼黻絺繡於裳周升三辰於旗登龍於山登火於宗彝作九章之服龍山華蟲火宗彝繪於衣藻粉米黼黻繡於裳公之服自袞冕而下如王之服侯伯之服自鷩冕而下如公之服又後魏帝服袞冕與祭者皆朝服又開元禮一品服九章又五禮新儀正一品服九旒冕犀簪青衣畫降龍今汴京舊禮直官言自宣和二年已後一品祭服七旒冕大袖無龍唐雖服九章服當時司禮少常伯孫茂道言諸臣之章雖殊然飾龍名袞尊卑相亂請三公服鷩冕八章為宜臣等竊謂歷代衣服之制不同若從後魏則止服朝服或用宋服則為七章若遵唐九章則有飾龍名袞尊卑相亂之議尚書省乃奏用後魏故事止用燕京大册禮時所服朝服以祭大定三年八月詔遵皇統制攝官則朝服散官則公服以皇太子為亞獻服袞冕十四年用唐制若祭遇雨雪則服常服謂今之公服也泰和元年八月禮官言祭服所以接神朝服所以事君雖歷代損益不同然未嘗不有分別是以袞冕十二旒玄衣纁裳備十二章天子之祭服也通天冠絳紗袍紅羅裳天子之視朝服也臣下之服則用青衣朱裳以祭朱衣朱裳以朝國朝惟天子備袞冕通天冠二等之服今羣臣但有朝服而祭服尚闕每有祀事但以朝服從事實於典禮未當請依漢唐故事祭服冕旒畫章然君臣冕服雖章數各殊而俱飾龍名袞而唐孫茂道已有尊卑相亂之論然三公法服有龍恐涉於僭國初禮官亦嘗駁議乞參酌古今改置祭服其冠則如朝冠而但去其貂蟬竪筆其服用青衣朱裳白襪朱履非攝事者則用朝服庶幾少有差別上曰朝祭之服固宜分也公服大定官制文資五品以上官服紫三師三公親王宰相一品官服大獨科花羅徑不過五寸執政官服小獨科花羅徑不過三寸二品三品服散搭花羅謂無枝葉者徑不過寸半四品五品服小雜花羅謂花頭碎小者徑不過一寸六品七品服緋芝麻羅八品九品服緑無紋羅應武官皆服紫凡散官職事皆從一高上得兼下下不得僭上窄紫亦同服色各依官制品格其諸局分承應人並服無紋素羅十五年制曰袍不加襴非古也遂命文資官公服皆加襴帶制皇太子玉帶佩玉雙魚袋親王玉帶佩玉魚一品玉帶佩金魚二品笏頭毬文金帶佩金魚三品四品荔枝或御仙花金帶並佩金魚五品服紫者紅烏犀帶佩金魚服緋者紅烏犀帶佩銀魚服緑者並皂烏犀帶武官一品二品佩帶同三品四品金帶五品六品七品紅烏犀帶皆不佩魚八品以下並皂烏犀帶司天太醫內侍教坊服皆同文武官惟不佩魚應殿庭承應五品以下官非入內不許金帶又展紫入殿庭者並許服紅不佩魚又二品以上官許兼服通犀帶三品官若治事及見賓客許兼服花犀帶大定二年制百官趨朝赴省並須裹帶五品以上官趨朝則朝服赴省則展皂雨雪沾衣則從便凡朝參主寶主符展紫御仙花或太平花金束帶近侍給使供御筆硯直長符寶吏紫襖子塗金束帶輪直則近侍給使並常服常服則展紫閣門六尚遇朝參侍立則服本品服若宮中當直則服窄紫金帶學士院官修起居注補闕拾遺祕書丞祕書郎朝參侍立則服本品服色帶當直則窄紫金帶東宮左右衛率僕正副僕正典儀贊儀內直郎丞當直亦許服之太子太師出入宮中則展紫至東宮則展皂三少則展紫輿服下衣服通制君子之服以稱德也故德之備者其文備古者王公及士庶人莫不各有一定之制而不敢相逾者蓋風俗之奢儉法令之齊一必於是而觀焉詩曰彼都人士狐裘黃黃其容不改出言有章其三章曰彼都人士充耳琇實彼君子女謂之尹吉此言都邑之盛人物之懿也明昌間章宗謂宰臣曰今風俗侈靡莫若律以制度使貴賤有等其令禮部具典故以聞他日又謂參知政事張萬公曰山東風俗如何萬公對以奢左丞守貞因言衣服之制上曰如卿所言正恐失人心耳守貞曰止是商賈有不悅者萬公曰乞寬與之期三年之內當如制矣於是上以禮部所擬太繁以尚書省所擬而行之嗟乎人君以風俗為言其亦知所務矣金人之常服四帶巾盤領衣烏皮靴其束帶曰吐鶻巾之制以皂羅若紗為之上結方頂折垂于後頂之下際兩角各綴方羅徑二寸許方羅之下各附帶長六七寸當橫額之上或為一縮積貴顯者於方頂循十字縫飾以珠其中必貫以大者謂之頂珠帶旁各絡珠結綬長半帶垂之海陵賜大興國者是也其衣色多白三品以皂窄袖盤領縫腋下為積而不缺袴其胸臆肩袖或飾以金繡其從春水之服則多鶻捕鵝雜花卉之飾其從秋山之服則以熊鹿山林為文其長中骭取便於騎也吐鶻玉為上金次之犀象骨角又次之銙周小者間置於前大者施於後左右有雙尾納方束中其刻琢多如春水秋山之飾左佩牌右佩刀刀貴鑌柄尚雞舌木黃黑相半有黑雙距者為上或三事五事室飾以醬瓣樺口飾以鮫或屑金鍮和漆塗鮫隙而平之醬瓣樺者謂樺皮班文色殷紫如醬中豆瓣也産其國故尚之初女直人不得改為漢姓及學南人裝束違者杖八十編為永制婦人服襜裙多以黑紫上編繡全枝花周身六積上衣謂之團衫用黑紫或皂及紺直領左衽掖縫兩傍復為雙積前拂地後曳地尺餘帶色用紅黃前雙垂至下齊年老者以皂紗籠髻如巾狀散綴玉鈿於上謂之玉逍遙此皆遼服也金亦襲之許嫁之女則服綽子製如婦人服以紅或銀褐明金為之對襟彩領前齊拂地後曳五寸餘明昌六年制文武官六貫石以上承應人並及廕者許用牙領紫圓板皂絛羅帶皂靴上得兼下係籍儒生止服白衫領繫背帶並以紫圓絛羅帶乾皂靴餘人用純紫領不得用緣雜色圓板絛羅帶不得用紫靴用黃及黑油皂蠟等婦人各從便泰和四年以親王品官既分領緣而復有皂靴之禁似涉太煩遂聽親王用銀褐領紫緣品官皆紫領白緣餘從明昌制書袋之制大定十六年世宗以吏員與士民之服無別潛入民間受賕鬻獄有司不能檢察遂定懸書袋之制省樞密院令譯史用紫紵絲為之臺六部宗正統軍司檢察司以黑斜皮為之寺監隨朝諸局並州縣並黃皮為之各長七寸闊二寸厚半寸並於束帶上懸帶公退則懸於便服違者所司糾之大定十三年太常寺擬士人及僧尼道女冠有師號並良間官八品以上許服花紗綾羅絲紬在官承應有出身人帶八品以下官未帶官亦同許服花紗綾羅紵絲絲紬家屬同婦人許用珠為首飾其都孔目與八品良間官同京府州縣司吏皆與庶人同庶人止許服絁紬絹布毛褐花紗無紋素羅絲綿其頭巾繫腰領帕許用芝麻羅絛用絨織成者不得以金玉犀象諸寶瑪瑙玻璃之類為器皿及裝飾刀把鞘並銀裝釘床榻之類婦人首飾不許用珠翠鈿子等物翠毛除許裝飾花環冠子餘外並禁兵卒許服無紋壓羅絁紬絹布毛褐奴婢止許服絁紬絹布毛褐倡優遇迎接公筵承應許暫服繪畫之服其私服與庶人同
