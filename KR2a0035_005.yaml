body:
  text: 金史卷五本紀第五海陵廢帝海陵庶人亮字元功本諱迪古乃遼王宗幹第二子也母大氏天輔六年壬寅歲生天眷三年年十八以宗室子為奉國上將軍赴梁王宗弼軍前任使以為行軍萬戶遷驃騎上將軍皇統四年加龍虎衛上將軍為中京留守遷光祿大夫為人僄急多猜忌殘忍任數初熙宗以太祖嫡孫嗣位亮意以為宗幹太祖長子而己亦太祖孫遂懷覬覦在中京專務立威以厭伏小人猛安蕭裕傾險敢決亮結納之每與論天下事裕揣知其意因勸海陵舉大事語在裕傳七年五月召為同判大宗正事加特進十一月拜尚書左丞務攬持權柄用其腹心為省臺要職引蕭裕為兵部侍郎一日因召對語及太祖創業艱難亮因嗚咽流涕熙宗以為忠八年六月拜平章政事十一月拜右丞相九年正月兼都元帥熙宗使小底大興國賜亮生日悼后亦附賜禮物熙宗不悅杖興國百追其賜物海陵由此不自安三月拜太保領三省事益邀求人譽引用勢望子孫結其歡心四月學士張鈞草詔忤旨死熙宗問誰使為之左丞相宗賢對曰太保實然熙宗不悅遂出為領行臺尚書省事過中京與蕭裕定約而去至良鄉召還海陵莫測所以召還之意大恐既至復為平章政事由是益危迫熙宗嘗以事杖左丞唐括辨及右丞相秉德辨乃與大理卿烏帶謀廢立而烏帶先以此謀告海陵他日海陵與辨語及廢立事曰若舉大事誰可立者辨曰胙王常勝乎問其次曰鄧王子阿懶亮曰阿懶屬踈安得立辨曰公豈有意邪海陵曰果不得已捨我其誰於是旦夕相與密謀護衛將軍特思疑之以告悼后曰辨等公餘每竊竊聚語竊疑之后以告熙宗熙宗怒召辨謂曰爾與亮謀何事將如我何杖之亮因此忌常勝阿懶且惡特思因河南兵士孫進自稱皇弟按察大王而熙宗之弟止有常勝查剌海陵乘此構常勝查剌阿懶達懶熙宗使特思鞫之無狀海陵曰特思鞫不以實遂俱殺之護衛十人長僕散忽土舊受宗幹恩徒單阿里出虎與海陵姻家大興國給事寢殿時時乘夜從主者取符鑰歸家以為常興國嘗以李老僧屬海陵得為尚書省令史故使老僧結興國為內應而興國亦以被杖怨熙宗遂與亮約十二月丁巳忽土阿里出虎內直是夜興國取符鑰啓門納海陵秉德辨烏帶徒單貞李老僧等入至寢殿遂弒熙宗秉德等未有所屬忽土曰始者議立平章今復何疑乃奉海陵坐皆拜稱萬歲詐以熙宗欲議立后召大臣遂殺曹國王宗敏左丞相宗賢是日以秉德為左丞相兼侍中左副元帥辨為右丞相兼中書令烏帶為平章政事忽土為左副點檢阿里出虎為右副點檢貞為左衛將軍興國為廣寧尹於是自太師領三省事勗以下二十人進爵增職各有差己未大赦改皇統九年為天德元年參知政事蕭肄除名鎮南統軍孛極為尚書左丞賜左丞相秉德右丞相辨平章政事烏帶廣寧尹興國點檢忽土阿里出虎左衛將軍貞尚書省令史老僧辨父刑部尚書阿里等錢絹馬牛羊有差甲子誓太祖廟召秉德辨烏帶忽土阿里出虎興國六人賜誓券丙寅以燕京路都轉運使劉麟為參知政事癸酉太傅領三省事蕭仲恭尚書右丞禀罷以行臺尚書左丞溫都思忠為右丞乙亥追諡皇考太師憲古弘道文昭武烈章孝睿明皇帝廟號德宗名其故居曰興聖宮宋高麗夏賀正旦使中道遣還二年正月辛巳以同知中京留守事蕭裕為祕書監癸巳尊嫡母徒單氏及母大氏皆為皇太后名徒單氏宮曰永壽大氏宮曰永寧乙巳以勵官守務農時慎刑罰揚側陋恤窮民節財用審才實七事詔中外遣侍衛親軍步軍都指揮使完顏思恭等以廢立事報諭宋高麗夏國以左丞相兼左副元帥秉德領行臺尚書省事二月戊申朔封子元壽為崇王庚戌降前帝為東昏王給天水郡公孫女二人月俸甲子以兵部尚書完顏元宜等充賀宋生日使戊辰群臣上尊號曰法天膺運睿武宣文大明聖孝皇帝詔中外永壽永寧兩太后父祖贈官有差以右丞相唐括辨為左丞相平章政事烏帶為右丞相三月丙戌宋高麗遣使賀即位以弟兗為司徒兼都元帥詔以天水郡王玉帶歸宋四月戊午殺太傅領三省事宗本尚書左丞相唐括辨判大宗正府事宗美遣使殺領行臺尚書省事秉德東京留守宗懿北京留守卞及太宗子孫七十餘人周宋國王宗翰子孫三十餘人諸宗室五十餘人辛酉以尚書省譯史蕭玉為禮部尚書祕書監蕭裕為尚書左丞司徒兗領三省事封王都元帥如故右丞相烏帶為司空左丞相兼侍中平章政事劉筈為尚書右丞相兼中書令左丞宗義右丞溫都思忠為平章政事參知政事劉麟為尚書右丞殿前左副點檢僕散忽土為殿前都點檢五月戊子以平章行臺尚書省事右副元帥大為行臺尚書右丞相元帥如故壬辰以左副元帥撒離喝為行臺尚書左丞相元帥如故同判大宗正事宗安為御史大夫六月丙午朔高麗遣使賀即位甲子太廟初設四神門及四隅罘罳七月己丑司空左丞相兼侍中烏帶罷以平章政事溫都思忠為左丞相尚書左丞蕭裕為平章政事右丞劉麟為左丞侍衛親軍步軍都指揮使完顏思恭為右丞參知政事張浩丁憂起復如故戊戌夏國遣使賀即位及受尊號八月戊申以司徒兗為太尉領三省事都元帥如故以禮部尚書蕭玉為參知政事九月甲午立惠妃徒單氏為皇后十月癸卯太師領三省事勗致仕辛未殺太皇太妃蕭氏及其子任王偎喝使使殺行臺左丞相左副元帥撒離喝于汴並殺平章政事宗義前工部尚書謀里野御史大夫宗安皆夷其族以魏王斡帶之孫活里甲好修飾亦族之十一月癸未尚書右丞相劉筈罷以會寧牧徒單恭為平章政事尚書左丞劉麟右丞完顏思恭罷以參知政事張浩為尚書右丞乙酉以行臺尚書左丞張通古為尚書左丞丙戌白虹貫日丁亥以太后旨稱令旨戊子以十二事戒約官吏己丑命庶官許求次室二人百姓亦許置妾十二月癸卯朔詔去羣臣所上尊號丙午初定襲封衍聖公俸格命外官去所屬百里外者不許參謁百里內者往還不得過三日癸丑立太祖射碑于紇石烈部中上及皇后致奠于碑下甲寅野人來獻異香却之乙卯有司奏慶雲見上曰朕何德以當此自今瑞應毋得上聞若有妖異當以諭朕使自警焉己未罷行臺尚書省改都元帥府為樞密院詔改定繼絶法以右副元帥大為尚書右丞相兼中書令參知行臺尚書省事張中孚為參知政事都元帥兗為樞密使太尉領三省事如故元帥左監軍昂為樞密副使刑部尚書趙資福為御史大夫三年正月癸酉朔宋夏高麗遣使來賀乙亥參知政事蕭玉丁憂起復如故癸未立春觀擊土牛丁亥初造燈山于宮中戊子生辰宋高麗夏遣使來賀甲午初置國子監謂御史大夫趙資福曰汝等多徇私情未聞有所彈劾朕甚不取自今百官有不法者必當舉劾無憚權貴乙未上出獵宰相以下辭於近郊上駐馬戒之曰朕不惜高爵厚祿以任汝等比聞事多留滯豈汝等苟圖自安不以民事為念耶自今朕將察其勤惰以為賞罰其各勉之丁酉白虹貫日二月丁巳還宮三月庚寅以翰林學士劉長言等為宋生日使壬辰詔廣燕城建宮室己亥謂侍臣曰昨太子生日皇后獻朕一物大是珍異卿試觀之即出諸絳囊中乃田家稼穡圖后意太子生深宮之中不知民間稼穡之艱難故以為獻朕甚賢之四月丙午詔遷都燕京辛酉有司圖上燕城宮室制度營建陰陽五姓所宜海陵曰國家吉凶在德不在地使桀紂居之雖卜善地何益使堯舜居之何用卜為丙寅罷歲貢鷹隼沂州男子吳真犯法當死有司以其母老疾無侍為請命官與養濟著為令閏月辛未朔命尚書右丞張浩調選燕京仍諭浩無私徇丙子命太官常膳惟進魚肉舊貢鵝鴨等悉罷之丁丑罷皇統間苑中所養禽獸歸德軍節度使阿魯補以撤官舍材木構私第賜死戊戌詔朝官稱疾不治事者尚書省令監察御史與太醫同診視無實者坐之五月壬子以戒敕宰相以下官詔中外戊辰宰臣請益嬪御以廣嗣續上命徒單貞語宰臣前所誅黨人諸婦人中多朕中表親欲納之宮中平章政事蕭裕不可上不從遂納宗本子莎魯啜宗固子胡里剌胡失打秉德弟辭里等妻宮中六月丙子殺太府監完顏馮六宋遣使祈請山陵不許九月庚戌賜燕京役夫帛人一匹以東京路兵馬都總管府判官蕭子敏為高麗生日使修起居注蕭彭哥為夏國生日使十月己巳殺蘭子山猛安蕭拱以右副點檢不术魯阿海等為宋正旦使十一月癸亥詔罷世襲萬戶官前後賜姓人各復本姓十二月戊辰杖壽寧縣主徐輦癸酉獵于近郊乙酉還宮是歲子崇王元壽薨四年正月丁酉朔宋高麗夏遣使來賀羣臣請立皇太子從之戊戌初定東宮官屬立捕盜賞格癸卯太白經天壬子生辰宋高麗夏遣使來賀癸亥朝謁世祖太祖太宗德宗陵甲子還宮二月丁卯立子光英為皇太子庚午詔中外甲戌如燕京昭義軍節度使蕭仲宣家奴告其主怨謗上曰仲宣之姪迪輦阿不近以誹謗誅故敢妄訴命殺告者迪輦阿不者蕭拱也戊子次泰州三月丙申朔以刑部尚書田秀頴等為宋生日使四月丙寅朔有司請今歲河南北選人並赴中京銓注從之壬辰上自泰州如涼陘五月丁酉獵于立列只山甲寅賜獵士人一羊乙卯次臨潢府丁巳太白經天六月甲子朔駐綿山戊寅權楚底部猛安那野伏誅七月癸卯命崇義軍節度使烏帶之妻唐括定哥殺其夫而納之八月癸亥朔獵于途你山甲戌以侍御史保魯鞫事不實杖之丙子次于鐸瓦九月甲午次中京丙午尚書右丞相大罷殺太府少監劉景以都水使者完顏麻潑為高麗生日使吏部郎中蕭中立為夏國生日使十月壬戌朔使使奉遷太廟神主御史大夫趙資福罷甲申以太子詹事張用直等為賀宋正旦使殺太祖長公主兀魯杖罷其夫平章政事徒單恭封其侍婢忽撻為國夫人恭之兄定哥初尚兀魯定哥死恭強納焉而不相能又與侍婢忽撻不協忽撻得幸于后遂譖于上故見殺而並罷恭十一月戊戌以咸平尹李德固為平章政事辛丑買珠于烏古迪烈部及蒲與路禁百姓私相貿易仍調兩路民夫採珠一年戊申以前平章政事徒單恭為司徒十二月甲子斬妄人敲仙于中京市辛未以汴京路都轉運使左瀛等為賀宋正旦使庚寅太尉領三省事樞密使兗薨貞元元年正月辛卯朔上不視朝詔有司受宋高麗夏回紇貢獻丙午生辰宋高麗夏遣使來賀以中京留守高楨為御史大夫二月庚申上自中京如燕京三月辛亥上至燕京初備法駕甲寅親選良家子百三十餘人充後宮乙卯以遷都詔中外改元貞元改燕京為中都府曰大興汴京為南京中京為北京丙辰以司徒徒單恭為太保領三省事平章政事蕭裕為右丞相兼中書令右丞張浩左丞張通古為平章政事參知政事張中孚為左丞蕭玉為右丞平章政事李德固為司空左宣徽使劉草口咢為參知政事樞密副使昂為樞密使工部尚書僕散師恭為樞密副使四月辛酉以右宣徽使紇石烈撒合輦等為賀宋生日使辛未特封唐括定哥為貴妃戊寅皇太后大氏崩五月辛卯殺弟西京留守蒲家西京兵馬完顏謨盧瓦編修官圓福奴通進孛迭坐與蒲家善並殺之乙卯以京城隙地賜朝官及衛士六月乙丑以安國軍節度使耶律恕為參知政事七月戊子朔元賜朝官京城隙地徵錢有差八月壬戌司空李德固薨禁中都路捕射麞兔戊寅賜營建宮室工匠及役夫帛九月丁亥朔以翰林待制謀良虎為夏國生日使吏部郎中窊合山為高麗生日使十月丁巳獵于良鄉封料石岡神為靈應王初海陵嘗過此祠持杯珓禱曰使吾有天命當得吉卜投之吉又禱曰果如所卜他日當有報否則毀爾祠宇投之又吉故封之戊午還宮壬戌有司言太后園陵未畢合停冬享及祫祭從之丙子命內外官聞大功以上喪止給當日假若父母喪聽給假三日著為令十一月丙戌朔定州獻嘉禾詔自今不得復進己丑瑤池殿成丙申以戶部尚書蔡松年等為賀宋正旦使戊戌左丞相耨碗溫都思忠致仕庚戌以樞密使昂為左丞相樞密副使僕散師恭為樞密使十二月太白經天戊午特賜貴妃唐括定哥家奴孫梅進士及第壬戌以簽書樞密院事南撒為樞密副使辛未封所納皇叔曹國王宗敏妃阿懶為昭妃丙子貴妃唐括定哥坐與舊奴姦賜死閏月乙酉朔殺護衛特謨葛癸巳定社稷制度太白經天癸卯以太保領三省事徒單恭為太師領三省事如故命西京路統軍撻懶西北路招討蕭懷忠臨潢府總管馬和尚烏古迪烈司招討斜野等北巡二年正月甲寅朔上不豫不視朝賜宋高麗夏使就館燕庚申太白經天尚書右丞相蕭裕與前真定尹蕭馮家奴前御史中丞蕭招折博州同知遙設等謀反伏誅詔中外己巳生辰宋高麗夏遣使來賀二月甲申朔以平章政事張浩為尚書右丞相兼中書令甲午以尚書右丞蕭玉為平章政事前河南路統軍使張暉為尚書右丞西北路招討使蕭好胡為樞密副使三月戊辰夏遣使賀遷都四月丙戌幸大興府及都轉運使司遣薦含桃于衍慶宮五月癸丑朔日有食之避正殿敕百官勿治事己未詔自今每月上七日不奏刑名尚食進饌不進肉丁卯始置交鈔庫設使副員丁丑太原尹徒單阿里出虎伏誅復命其子术斯剌乘傳焚其骨擲水中七月庚申初設鹽鈔香茶文引印造庫使副丙子參知政事耶律恕罷八月丙午以左丞相昂去衣杖其弟婦命杖之戊申以御史大夫高楨為司空御史大夫如故九月己未常武殿擊鞠令百姓縱觀辛酉以吏部尚書蕭賾為參知政事癸亥獵于近郊丁卯次順州太師領三省事徒單恭薨是夜還宮乙亥復獵于近郊十月庚辰朔殺廣寧尹韓王亨庚寅還宮庚子以左丞相致仕溫都思忠起為太傅領三省事以刑部侍郎白彥恭等為賀宋正旦使十一月戊辰上命諸從姊妹皆分屬諸妃出入禁中與為淫亂臥內遍設地衣裸逐為戲是月初置惠民局高麗遣使謝賜生日十二月乙酉以太傅溫都思忠為太師領三省事如故平章政事張通古為司徒平章政事如故三年正月己酉朔宋高麗夏遣使來賀辛酉以判東京留守大為太傅領三省事甲子生辰宋高麗夏遣使來賀二月壬午以左丞相昂為太尉樞密使右丞相張浩為左丞相兼侍中樞密使僕散師恭為右丞相兼中書令尚書左丞張中孚罷右丞張暉為平章政事參知政事劉草口咢為左丞參知政事蕭賾為右丞吏部尚書蔡松年為參知政事三月壬子以左丞相張浩平章政事張暉每見僧法寶必坐其下失大臣體各杖二十僧法寶妄自尊大杖二百乙卯命以大房山雲峯寺為山陵建行宮其麓庚午以左司郎中李通為賀宋生日使夏四月丁丑朔昏霧四塞日無光凡十有七日五月丁未朔日有食之癸丑南京大內火乙卯命判大宗正事京等如上京奉遷太祖太宗梓宮丙寅如大房山營山陵六月丙戌登寶昌門觀角抵百姓縱觀乙未命右丞相僕散師恭大宗正丞胡拔魯如上京奉遷山陵及迎永壽宮皇太后七月癸丑太白晝見辛酉如大房山杖提舉營造官吏部尚書耶律安禮等乙亥還宮八月壬午如大房山甲申啓土賜役夫人絹一匹是日還宮甲午遣平章政事蕭玉迎祭祖宗梓宮於廣寧乙未增置教坊人數庚子杖左宣徽使敬嗣暉同知宣徽事烏居仁及尚食官九月戊申平章政事張暉迎祭梓宮于宗州乙卯上謂宰臣及左司官曰朝廷之事尤在慎密昨授張中孚趙慶襲官除書未到先已知之皆汝等泄之也敢復爾者殺無赦己未如大房山庚申還宮丙寅以殿前都點檢納合椿年為參知政事丁卯上親迎梓宮及皇太后于沙流河命左右持杖二束跽太后前曰某不孝久失溫凊願痛笞之太后掖起之曰凡民有子克家猶愛之況我有子如此叱持杖者退庚午獵親射麞以薦梓宮壬申至自沙流河十月丙子皇太后至中都居壽康宮戊寅權奉安太廟神主于延聖寺致奠梓宮于東郊舉哀己卯梓宮至中都以大安殿為丕承殿安置壬午命省部諸司便服治事不奏死刑一月辛卯告于丕承殿乙未如菆宮冊諡永寧皇太后曰慈憲皇后丁酉大房山行宮成名曰磐寧戊戌還宮己亥以翰林學士承旨耶律歸一等為賀宋正旦使十一月乙巳朔梓宮發丕承殿戊申山陵禮成甲寅詔內外大小職官覃遷一重貞元四年租稅並與放免軍士久於屯戍不經替換者人賜絹三匹銀三兩羣臣稱賀丙辰燕百官於泰和殿丁卯奉安神主于太廟戊辰羣臣稱賀辛未獵于近郊十二月己丑還宮木氷乙未上朝太后于壽康宮己亥太傅領三省事大薨親臨哭之命有司廢務及禁樂三日正隆元年正月癸卯朔宋高麗夏遣使來賀己酉羣臣奉上尊號曰聖文神武皇帝上自九月廢朝常數月不出有急奏召左右司郎中省于臥內庚戌始視朝戊午生辰宋高麗夏遣使來賀乙丑觀角抵戲罷中書門下省以太師領三省事溫都思忠為尚書令太尉樞密使昂為太保右丞相僕散師恭為太尉樞密使左丞劉草口咢右丞蕭賾罷參知政事蔡松年為尚書右丞樞密副使蕭懷忠罷吏部尚書耶律安禮為樞密副使平章政事蕭玉為右丞相平章政事張暉罷不置平章政事官二月癸酉朔改元正隆大赦庚辰御宣華門觀迎佛賜諸寺僧絹五百匹綵五十段銀五百兩辛巳改定內外諸司印記乙未司徒張通古致仕庚子謁山陵辛丑還都三月壬寅朔始定職事官朝參等格仍罷兵衛庚申以左宣徽使敬嗣暉等為賀宋生日使四月太尉樞密使僕散師恭以父憂起復如故五月辛亥修容安氏閣女御為妖所憑舞譟宮中命殺之是月頒行正隆官制六月庚辰天水郡公趙桓薨丙戌以尚書右丞蔡松年為左丞樞密副使耶律安禮為右丞駙馬都尉烏古論當海為樞密副使七月己酉命太保昂如上京奉遷始祖以下梓宮八月丁丑如大房山行視山陵十月乙酉葬始祖以下十帝于大房山丁酉還宮閏月己亥朔山陵禮成羣臣稱賀甲辰回鶻使使寅术烏籠骨來貢庚寅杖右丞相蕭玉左丞蔡松年右丞耶律安禮御史中丞馬諷等十一月己巳朔以右司郎中梁銶等為賀宋正旦使癸巳禁二月八日迎佛二年正月戊辰朔宋高麗夏遣使來賀庚辰太白晝見癸未生辰宋高麗夏遣使來賀庚寅以工部侍郎韓錫同知宣徽院事錫不謝杖百二十奪所授官二月辛丑初定太廟時享牲牢禮儀癸卯改定親王以下封爵等第命置局追取存亡告身存者二品以上死者一品參酌削降公私文書但有王爵字者皆立限毀抹雖墳墓碑志並發而毀之三月丙寅朔高麗遣使賀受尊號四月戊戌追降景宣皇帝為豐王以簽書宣徽院事張哲為橫賜高麗使宿直將軍溫敦斡喝為橫賜夏國使六月乙未參知政事納合椿年薨以禮部尚書耶律守素等為賀宋生日使八月癸卯始置登聞院甲寅罷上京留守司九月乙丑以宿直將軍僕散烏里黑為夏國生日使戊子罷護駕軍置龍翔虎步軍罷尚書省文資令史出為外官是秋中都山東河東蝗十月壬寅命會寧府毀舊宮殿諸大族第宅及儲慶寺仍夷其址而耕種之丁未禁賣古器入他境乙卯初鑄銅錢十一月辛未以侍衛親軍副指揮使高助不古等為賀宋正旦使十二月己亥以侍衛親軍都指揮使紇石烈良弼為參知政事三年正月壬戌朔宋高麗夏遣使來賀丙寅子矧思阿不死殺太醫副使謝友正及其乳母等丁丑生辰宋高麗夏遣使來賀己卯杖右諫議大夫楊伯雄二月壬辰朔都城及京兆初置錢監甲午遣使檢視隨路金銀銅鐵冶三月辛酉朔司天奏日食候之不見命自今遇日食面奏不須頒告辛巳以兵部尚書蕭恭等為賀宋生日使四月丙辰樞密副使烏古論當海罷以北京留守張暉為樞密副使六月壬辰蝗入京師七月庚申封子廣陽為滕王甲申以右丞相蕭玉為司徒尚書左丞蔡松年為右丞相右丞耶律安禮為左丞參知政事紇石烈良弼為右丞左宣徽使敬嗣暉吏部尚書李通為參知政事九月己未太白經天甲子滕王廣陽薨庚午以宿直將軍阿魯保為夏國生日使丁丑以教坊提點高存福為高麗生日使辛巳遷中都屯軍二猛安於南京遣吏部尚書李惇等分地安置十月戊戌詔尚書省凡事理不當者許詣登聞檢院投狀院類奏覽訖付御史臺理問十一月辛酉以工部尚書蘇保衡等為賀宋正旦使癸亥詔有司勤政安民癸未尚書左丞耶律安禮罷參知政事李通以憂制起復如故詔左丞相張浩參知政事敬嗣暉營建南京宮室十二月乙卯以樞密副使張暉為尚書左丞歸德尹致仕高召和式起為樞密副使四年正月丙辰朔宋高麗夏遣使來賀上朝太后于壽康宮丁巳御史大夫高楨薨庚申更定私相越境法並論死辛酉罷鳳翔唐鄧潁蔡鞏洮膠西諸榷場置場泗州辛未生辰宋高麗夏遣使來賀二月己丑以左宣徽使許霖為御史大夫丁未修中都城造戰船于通州詔諭宰臣以伐宋事調諸路猛安謀克軍年二十以上五十以下者皆籍之雖親老丁多亦不許留侍三月丙辰朔遣兵部尚書蕭恭經畫夏國邊界遣使分詣諸道總管府督造兵器四月辛丑命增山東路泉水畢括兩營兵士釰給庚戌詔諸路舊貯軍器並致于中都時方建宮室於南京又中都與四方所造軍器材用皆賦於民箭翎一尺至千錢村落間往往椎牛以供筋革至於烏鵲狗彘無不被害者辛亥尚書左丞張暉御史大夫許霖罷以大興尹徒單貞為樞密副使以祕書監王可道等為賀宋生日使八月詔諸路調馬以戶口為差計五十六萬餘匹富室有至六十匹者仍令戶自養飼以俟己卯尚書右丞相蔡松年薨九月以翰林待制完顏達紀為高麗生日使宿直將軍加古撻懶為夏國生日使十月乙亥獵于近郊觀造船于通州賜尚書右丞紇石烈良弼樞密副使徒單貞佩刀入宮十一月甲辰以翰林侍講學士施宜生等為賀宋正旦使十二月乙卯宋遣使告母韋氏哀甲子太白晝見乙丑以左副點檢大懷忠等為宋弔祭使乙亥太醫使祁宰上疏諫伐宋殺之五年正月庚辰朔宋高麗夏遣使來賀乙未生辰宋高麗夏遣使來賀二月壬子宋遣使獻母后遺留物丁卯太白晝見辛未河東陝西地震鎮戎德順軍大風壞廬舍人多壓死甲戌遣引進使高植刑部郎中海狗分道監視所獲盜賊並凌遲處死或鋸灼去皮截手足仍戒屯戍千戶謀克等後有獲者並處死總管府官亦決罰三月辛巳東海縣民張旺徐元等反遣都水監徐文步軍指揮使張弘信同知大興尹事李惟忠宿直將軍蕭阿窊率舟師九百浮海討之命之曰朕意不在一邑將試舟師耳庚子以司徒判大宗正事蕭玉為御史大夫司徒如故尚書右丞紇石烈良弼為左丞橫海軍節度使致仕劉長言起為右丞四月庚戌昭妃蒲察阿里忽有罪賜死甲寅宿州防禦使耶律翼使宋失體杖二百除名甲戌太白晝見六月徐文等破賊張旺徐元東海平七月辛巳詔東海縣徐元張旺詿誤者並釋之壬午以張弘信被命討賊稱疾逗遛萊州與妓樂飲燕杖之二百癸卯遣使簽諸路漢軍八月丙午朔日有食之辛亥命榷貨務並印造鈔引庫起赴南京己巳樞密副使徒單貞罷以太子少保徒單永年為樞密副使辛未謁山陵見田間穫者問其豐耗以衣賜之九月己卯還宮十月庚午遣護衛完顏普連等二十四人督捕山東河東河北中都盜賊籍諸路水手得三萬人十一月乙酉以濟南尹僕散烏者等為賀宋正旦使尚書右丞劉長言罷命親軍司以所掌付大興府置左右驍騎都副指揮使隸點檢司步軍都副指揮使隸宣徽院十二月癸丑禁中都河北山東河南河東京兆軍民網捕禽獸及畜養雕隼者戊辰禁朝官飲酒犯者死三國人使燕飲者非六年正月甲戌朔宋高麗夏遣使來賀丁丑判大宗正徒單貞益都尹京安武軍節度使爽金吾衛上將軍阿速飲酒以近屬故杖貞七十餘皆杖百壬午上將如南京以司徒御史大夫蕭玉為大興尹司徒如故樞密副使徒單永年罷以都點檢紇石烈志寧為樞密副使己丑生辰宋高麗夏遣使來賀癸巳命參知政事李通諭宋使徐度等曰朕昔從梁王軍樂南京風土常欲巡幸今營繕將畢功期以二月末先往河南帝王巡守自古有之以淮右多隙地欲校獵其間從兵不踰萬人況朕祖宗陵廟在此安能久于彼乎汝等歸告汝主令有司宣諭朕意使淮南之民無懷疑懼庚子詔自中都至河南府所過州縣調從獵騎士二千辛丑殺蒲察阿虎迭女義察義察慶宜公主出幼鞠宮中上屢欲納之太后不可至是以罪殺之二月乙巳杖衛王襄之妃及左宣徽使許霖甲寅以參知政事李通為尚書右丞己未禁扈從縱獵擾民庚申徵諸道水手運戰船癸亥發中都丙寅次安肅州三月己卯改河南北邙山為太平山稱舊名者以違制論丁亥將至獲嘉有男子上書言事斬之所言莫得聞癸巳次河南府因出獵幸汝州溫湯視行宮地自中都至河南所過麥皆為空復禁扈從毋輒離次及游賞飲酒犯者罪皆死而莫有從者詔內地諸猛安赴山後牧馬俟秋並發弟兗之妻烏延氏有罪賜死烏延氏之弟南京兵馬副都指揮使習泥烈亦以罪誅四月丁未詔百官先赴南京治事尚書省樞密院大宗正府勸農司太府少府皆從行吏戶兵刑部四方館都水監大理司官各留一員以簽書樞密院事高景山等為賀宋生日使戊申詔汝州百五十里內州縣量遣商賈赴溫湯置市詔有司移問宋人蔡潁壽諸州對境創置堡戍者庚戌發河南府契丹不補自山馳下伏道左自陳破東海賊有功為李惟忠所抑立命斬之丁卯次溫湯誡扈從毋輒過汝水上獵奔鹿突之墮馬嘔血數日遣使徵諸道兵五月庚辰太師尚書令耨碗溫都思忠薨契丹諸部反遣右衛將軍蕭禿剌等討之六月癸卯命樞密使僕散師恭西京留守蕭懷忠將兵一萬討契丹諸部上自汝州如南京壬戌次南京近郊左丞相張浩率百官迎謁是夜大風壞承天門鴟尾癸亥上備法駕入于南京七月丁亥以左丞相張浩為太傅尚書令司徒大興尹蕭玉為尚書左丞相吏部尚書白彥恭為樞密副使樞密副使紇石烈志寧為開封尹安武軍節度使徒單貞為御史大夫己丑賜從駕從行從軍及千戶謀克錢帛大括天下吂月馬凡馬殺亡遼耶律氏宋趙氏子男凡百三十餘人八月壬寅單州賊杜奎據城叛遣都點檢耶律湛右驍騎副都指揮使大磐討之以樞密副使白彥恭為北面兵馬都統開封尹紇石烈志寧副之中都留守完顏彀英為西北面兵馬都統西北路招討使唐括孛古的副之討契丹癸丑以諫伐宋弒皇太后徒單氏于寧德宮仍命即宮中焚之棄其骨水中並殺其侍婢等十餘人癸亥殺右衛將軍蕭禿剌護衛十人長斡盧保族樞密使僕散師恭北京留守蕭賾西京留守蕭懷忠杖尚書令張浩左丞相蕭玉以太常博士張崇為高麗生日使蕭誼忠為夏國生日使甲子封所幸太后侍婢高福娘為鄖國夫人九月庚午朔以太保判大宗正事昂為樞密使太保如故戊子殺前壽州刺史毛良虎庚寅大名府賊王九據城叛衆至數萬所至盜賊蜂起大者連城邑小者保山澤或以十數騎張旗幟而行官軍莫敢近上又惡聞盜賊事言者輒罪之上自將三十二總管兵伐宋進自壽春以太保樞密使昂為左領軍大都督尚書右丞李通副之尚書左丞紇石烈良弼為右領軍大都督判大宗正烏延蒲盧渾副之御史大夫徒單貞為左監軍同判大宗正事徒單永年為右監軍左宣徽使許霖為左都監河南尹蒲察斡論為右都監皆從工部尚書蘇保衡為浙東道水軍都統制益都尹鄭家副之由海道徑趨臨安太原尹劉草口咢為漢南道行營兵馬都統制濟南尹僕散烏者副之進自蔡州河中尹徒單合喜為西蜀道行營兵馬都統制平陽尹張中彥副之由鳳翔取散關駐軍以俟後命武勝武平武捷三軍為前鋒徒單貞別將兵二萬入淮陰甲午上發南京詔皇后及太子光英居守尚書令張浩左丞相蕭玉參知政事敬嗣暉留治省事丙申太白晝見將士自軍中亡歸者相屬于道曷蘇館猛安福壽東京謀克金住等始授甲于大名即舉部亡歸從者衆至萬餘皆公言於路曰我輩今往東京立新天子矣十月乙巳陰迷失道二鼓始達營所丙午慶雲見東京留守曹國公烏祿即位于遼陽改元大定大赦數海陵過惡弒皇太后徒單氏殺太宗及宗翰宗弼子孫及宗本諸王毀上京宮室殺遼豫王宋天水郡王郡公子孫等數十事丁未大軍渡淮將至廬州獲白鹿以為武王白魚之兆漢南道劉草口咢取通化軍蔣州信陽軍徒單貞敗宋將王權于盱眙進取揚州前鋒軍至段寨宋戍兵皆遁去敗宋兵于蔚子橋敗宋兵于巢縣斬二百級至和州王權夜以兵千餘來襲射却之翼日雨宋人夜焚其積聚遁去詰旦追之宋人逆戰猛安韓棠軍却遂失利溫都奧剌奔北武捷軍副總管阿散率猛安謀克力戰却之王權退保南岸癸亥上次和州阿散等進階賞賚有差西蜀道徒單合喜駐散關宋人攻秦州臘家城德順州克之浙東道蘇保衡與宋人戰于海道敗績副統制鄭家死之十一月庚午左司郎中兀不喝等聞赦入白東京即位改元事上拊髀歎曰我本欲滅宋後改元大定豈非天命乎出其書示之即預志改元事也以勸農使完顏元宜為浙西道兵馬都統制刑部尚書郭安國副之上駐軍江北遣武平總管阿鄰先渡江至南岸失利上還和州遂進兵揚州甲午會舟師于瓜洲渡期以明日渡江乙未浙西兵馬都統制完顏元宜等軍反帝遇弒崩年四十海陵在位十餘年每飾情貌以御臣下却尚食進鵝以示儉及游獵頓次不時需索一鵝一鶉民間或用數萬售之有以一牛易一鶉者或以弊衾覆衣以示近臣或服補綴令記注官見之或取軍士陳米飯與尚食同進先食軍士飯幾盡或見民車陷泥澤令衛士下挽俟車出然後行與近臣燕語輒引古昔賢君以自況顯責大臣使進直言使張仲軻輩為諫官而祁宰竟以直諫死比昵羣小官賞無度左右有曠僚者人或以名呼之即授以顯階常置黃金裀褥間有喜之者令自取之而淫嬖不擇骨肉刑殺不問有罪至營南京宮殿運一木之費至二千萬牽一車之力至五百人宮殿之飾遍傅黃金而後間以五采金屑飛空如落雪一殿之費以億萬計成而復毀務極華麗其南征造戰艦江上毀民廬舍以為材煮死人膏以為油殫民力如馬牛費財用如土苴空國以圖人國遂至於敗都督府以其柩置之南京班荊館大定二年降封為海陵郡王諡曰煬二月世宗使小底婁室與南京官遷其柩於寧德宮四月葬于大房山鹿門谷諸王兆域中二十年熙宗既祔廟有司奏曰煬王之罪未正準晉趙王倫廢惠帝自立惠帝反正誅倫廢為庶人煬帝罪惡過於倫不當有王封亦不當在諸王塋域乃詔降為海陵庶人改葬于山陵西南四十里贊曰海陵智足以拒諫言足以飾非欲為君則弒其君欲伐國則弒其母欲奪人之妻則使之殺其夫三綱絶矣何暇他論至於屠滅宗族翦刈忠良婦姑姊妹盡入嬪御方以三十二總管之兵圖一天下卒之戾氣感召身由惡終使天下後世稱無道主以海陵為首可不戒哉可不戒哉
