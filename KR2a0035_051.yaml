body:
  text: 金史卷五十一志第三十二選舉一進士諸科律科經童科制舉武舉試學士院官司天醫學試科自三代鄉舉里選之法廢秦漢以來各因一代之宜以盡一時之才苟足於用即已故法度之不一其來遠矣在漢之世雖有賢良方正諸科以取士而推擇為吏由是以致公卿公卿子弟入備宿衛因被寵遇以位通顯魏晉而下互有因革至於唐宋進士盛焉當時士君子之進不由是塗則自以為慊此由時君之好尚故人心之趣向然也遼起唐季頗用唐進士法取人然仕於其國者考其致身之所自進士才十之二三耳金承遼後凡事欲軼遼世故進士科目兼採唐宋之法而增損之其及第出身視前代特重而法亦密焉若夫以策論進士取其國人而用女直文字以為程文斯蓋就其所長以收其用又欲行其國字使人通習而不廢耳終金之代科目得人為盛諸宮護衛及省臺部譯史令史通事仕進皆列於正班斯則唐宋以來之所無者豈非因時制宜而以漢法為依據者乎金治純駁議者於是每有別焉宣宗南渡吏習日盛苛刻成風殆亦多故之秋急於事功不免爾歟自時厥後仕進之歧既廣僥幸之俗益熾軍伍勞效雜置令録門廕右職迭居朝著科舉取士亦復泛濫而金治衰矣原其立經陳紀之初所為升轉之格考察之方井井然有條而不紊百有餘年才具不乏豈非其效乎奉詔作金史志其選舉因得而詳論之司天太醫內侍等法歷代所有附著於斯鬻爵進納金季之弊莫甚焉蓋由財用之不足而然也特載食貨志金設科皆因遼宋制有詞賦經義策試律科經童之制海陵天德三年罷策試科世宗大定十一年創設女直進士科初但試策後增試論所謂策論進士也明昌初又設制舉宏詞科以待非常之士故金取士之目有七焉其試詞賦經義策論中選者謂之進士律科經童中選者曰舉人凡養士之地曰國子監始置於天德三年後定制詞賦經義生百人小學生百人以宗室及外戚皇后大功以上親諸功臣及三品以上官兄弟子孫年十五以上者入學不及十五者入小學大定六年始置太學初養士百六十人後定五品以上官兄弟子孫百五十人曾得府薦及終場人二百五十人凡四百人府學亦大定十六年置凡十七處共千人初以嘗與廷試及宗室皇家袒免以上親並得解舉人為之後增州學遂加以五品以上官曾任隨朝六品官之兄弟子孫餘官之兄弟子孫經府薦者同境內舉人試補三之一闕里廟宅子孫年十三以上不限數經府薦及終場免試者不得過二十人凡試補學生太學則禮部主之州府則以提舉學校學官主之曾得府薦及終場舉人皆免試凡經易則用王弼韓康伯注書用孔安國注詩用毛萇注鄭玄箋春秋左氏傳用杜預注禮記用孔穎達疏周禮用鄭玄注賈公彥疏論語用何晏集注邢昺疏孟子用趙岐注孫奭疏孝經用唐玄宗注史記用裴駰注前漢書用顏師古注後漢書用李賢注三國志用裴松之注及唐太宗晉書沈約宋書蕭子顯齊書姚思廉梁書陳書魏收後魏書李百藥北齊書令狐德棻周書魏徵隋書新舊唐書新舊五代史老子用唐玄宗注疏荀子用楊倞注揚子用李軌宋咸柳宗元吳祕注皆自國子監印之授諸學校凡學生會課三日作策論一道又三日作賦及詩各一篇三月一私試以季月初先試賦間一日試策論中選者以上五名申部遇旬休節辰皆有假病則給假省親遠行則給程犯學規者罰不率教者黜遭喪百日後求入學者不得與釋奠禮凡國子學生三年不能充貢欲就諸局承應者學官試能粗通大小各一經者聽章宗大定二十九年上封事者乞興學校推行三舍法及鄉以八行貢春官以設制舉宏詞事下尚書省集百官議戶部尚書鄧儼等謂三舍之法起於宋熙寧間王安石罷詩賦專尚經術太學生初補外舍無定員由外升內舍限二百人由內升上舍限百人各治一經每月考試或特免解或保舉補官其法雖行而多席勢力尚趨走之弊故蘇軾有三舍既興貨賂公行之語是以元祐間罷之後雖復而宣和三年竟廢臣等謂立法貴乎可久彼三舍之法委之學官選試啓僥幸之門不可為法唐文皇養士至八千人亡宋兩學五千人今策論詞賦經義三科取士而太學所養止百六十人外京府或至十人天下僅及千人今若每州設學專除教授月加考試每舉所取數多者賞其學官月試定為三等籍之一歲中頻在上等者優復之不率教行惡者黜之庶幾得人之道也又成周鄉舉里選法卒不可復設科取士各隨其時八行者乃亡宋取周禮之六行孝友睦姻任恤加之中和為八也凡人之行莫大於孝廉今已有舉孝廉之法及民有才能德行者令縣官薦之今制犯十惡姦盜者不得應試亦六德六行之遺意也夫制舉宏詞蓋天子待非常之士若設此科不限進士並選人試之中選擢之臺閣則人自勉矣上從其議遂計州府戶口增養士之數於大定舊制京府十七處千人之外置節鎮防禦州學六十處增養千人各設教授一員選五舉終場或進士年五十以上者為之府學二十有四學生九百五人大興開封平陽真定東平府各六十人太原益都府各五十人大定河間濟南大名京兆府各四十人遼陽彰德府各三十人河中慶陽臨洮河南府各二十五人鳳翔平涼延安咸平廣寧興中府各二十人節鎮學三十九共六百一十五人絳定衛懷滄州各三十人萊密潞汾冀邢兗州各二十五人代同邠州各二十人奉聖州十五人餘二十三節鎮皆十人防禦州學二十一共二百三十五人博德洺棣亳各十五人餘十六州各十人凡千八百人女直學自大定四年以女直大小字譯經書頒行之後擇猛安謀克內良家子弟為學生諸路至三千人九年取其尤俊秀者百人至京師以編修官溫迪罕締達教之十三年以策詩取士始設女直國子學諸路設女直府學以新進士為教授國子學策論生百人小學生百人府州學二十二中都上京胡里改恤頻合懶蒲與婆速咸平泰州臨潢北京冀州開州豐州西京東京蓋州隆州東平益都河南陝西置之凡取國子學生府學生之制皆與詞賦經義生同又定制每謀克取二人若宗室每二十戶內無願學者則取有物力家子弟年十三以上二十以下者充凡會課三日作策論一道季月私試如漢生制大定二十九年敕凡京府鎮州諸學各以女直漢人進士長二官提控其事具入官銜河南陝西女直學承安二年罷之餘如舊凡諸進士舉人由鄉至府由府至省及殿廷凡四試皆中選則官之至廷試五被黜則賜之第謂之恩例又有特命及第者謂之特恩恩例者但考文之高下為第而不復黜落凡詞賦進士試賦詩策論各一道經義進士試所治一經義策論各一道其設也始於太宗天會元年十一月時以急欲得漢士以撫輯新附初無定數亦無定期故二年二月八月凡再行焉五年以河北河東初降職員多闕以遼宋之制不同詔南北各因其素所習之業取士號為南北選熙宗天眷元年五月詔南北選各以經義詞賦兩科取士海陵庶人天德二年始增殿試之制而更定試期三年併南北選為一罷經義策試兩科專以詞賦取士貞元元年定貢舉程試條理格法正隆元年命以五經三史正文內出題始定為三年一闢大定四年敕宰臣進士文優則取勿限人數十八年謂宰臣文士有偶中魁選不問操履而輒授翰苑之職如趙承元朕聞其無士行果敗露自今榜首先訪察其鄉行可取則授以應奉否則從常調十九年謂宰臣曰自來御試賦題皆士人嘗擬作者前朕自選一題出人所不料故中選者多名士而庸才不及焉是知題難則名儒亦擅場題易則庸流易僥幸也平章政事唐括安禮奏曰臣前日言士人不以策論為意者正為此爾宜各場通考選文理俱優者上曰並答時務策觀其議論材自可見卿等其議之二十年謂宰臣曰朕嘗諭進士不當限數則對以所取之外無合格文故中選者少豈非題難致然耶若果多合格而有司妄黜之甚非理也又曰古者鄉舉有行者授以官今其考滿察鄉曲實行出倫者擢之又曰舊不選策今兼選矣然自今府會兩試不須試策已中策後則試以制策試學士院官二十二年謂宰臣曰漢進士魁例授應奉若行不副名不習制誥之文者即與外除二十三年謂宰臣曰漢進士皇統間人材殆不復見今應奉以授狀元蓋循資爾制誥文字各以職事鋪皆有定式故易至撰赦詔則鮮有能者參知政事粘哥斡特剌對曰舊人已登第尚為學不輟今人一及第輒廢而不學故爾上於聽政之隙召參知政事張汝霖翰林直學士李晏讀新進士所對策至縣令闕員取之何道上曰朕夙夜思此未知所出晏對曰臣竊念久矣國朝設科始分南北兩選北選詞賦進士擢第一百五十人經義五十人南選百五十人計三百五十人嗣場北選詞賦進士七十人經義三十人南選百五十人計二百五十人以入仕者多故員不闕其後南北通選止設詞賦科不過取六七十人以入仕者少故縣令員闕也上曰自今文理可採者取之毋限以數二十八年復經義科章宗明昌元年正月言事者謂舉人四試而鄉試似為虛設固當罷去其府會試乞十人取一人可以羣經出題而注示本傳上是其言詔免鄉試府試以五人取一人仍令有司議外路添考試院及羣經出題之制有司言會試所取之數舊止五百人比以世宗敕中格者取乞依此制行之府試舊六處中有地遠者命特添三處上京咸平府路則試於遼陽河東南北路則試於平陽山東東路則試於益都以六經十七史孝經論語孟子及荀揚老子內出題皆命於題下注其本傳又諭有司曰舉人程文所用故事恐考試官或遽不能憶誤失人材可自注出處注字之誤不在塗注乙之數明昌二年敕官或職至五品者直赴御試四年平章政事守貞言國家官人之路惟女直漢人進士得人居多諸司局承應舊無出身自大定後始使至今鮮有可用者近來放進士第數稍多此舉更宜增取若會試止以五百人為限則廷試雖欲多取不可得也上乃詔有司會試毋限人數文合格則取六年言事者謂學者率恃有司全注本傳以示之故不勉讀書乞減子史注本傳之制又經義中選之文多膚淺乞擇學官及本科人充試官省臣謂若不與本傳恐碩學者有偶忘之失可令但知題意而已遂命擇前經義進士為衆所推者才識優長者為學官遇差考試官之際則驗所治經參用詞賦進士題注本傳不得過五十字經義進士御試第二場試論日添試策一道承安四年上諭宰臣曰一場放二狀元非是後場廷試令詞賦經義通試時務策止選一狀元餘雖有明經法律等科止同諸科而已至宋王安石為相作新經始以經義取人且詞賦經義人素所習之本業策論則兼習者也今捨本取兼習恐不副陛下公選之意遂定御試同日各試本業詞賦依舊分立甲次第一名為狀元經義魁次之恩例與詞賦第二人同餘分為兩甲中下人並在詞賦之下五年詔考試詞賦官各作程文一道示為舉人之式試後赴省藏之時宰臣奏自大定二十五年以前詞賦進士不過五百人二十八年以不限人數取至五百八十六人先承聖訓合格則取故承安二年取九百二十五人兼今有四舉終場恩例若會試取人數過多則涉泛濫遂定策論詞賦經義人數雖多不過六百人少則聽其闕時太常丞郭人傑轉對言詞賦舉人不得作別名兼試經義及入學生精加試選無至濫補上敕宰臣曰近已奏定後場詞賦經義同日試之若府會試更不令兼試恐試經義者少是虛設此科也別名之弊則當禁之補試入學生員已有舊條恐行之滅裂爾宜嚴防間張行簡轉對言擬作程文本欲為考試之式今會試考試官御試讀卷官皆居顯職擢第後離筆硯久不復常習今臨試擬作之文稍有不工徒起謗議詔罷之泰和元年平章政事徒單鎰病時文之弊言諸生不窮經史唯事末學以致志行浮薄可令進士試策日自時務策外更以疑難經旨相參為問使發聖賢之微旨古今之事變詔為永制先嘗敕樂人不得舉進士而奴免為良者則許之尚書省奏舊稱工樂謂配隸之色及倡優之家今少府監工匠太常大樂署樂工皆民也而不得與試前代令諸選人身及祖父曾經免為良者雖在官不得居清貫及臨民今反許試誠玷清論詔遂定制放良人不得應諸科舉其子孫則許之上又謂德行才能非進士科所能盡可通行保舉之制省臣奏在周禮大司徒以鄉三物教萬民而賓興之所謂萬民農工商賈皆是也前代立賢無方如版築之士鼓刀之叟垂光簡策者不可勝舉今草澤隱逸才行兼備者令謀克及司縣舉按察司具聞以旌用之既有已降令文矣上命復宣旨以申之宣宗貞祐二年御史臺言明年省試以中都遼東西北京等路道阻宜於中都南京兩處試之三年諭宰臣曰國初設科素號嚴密今聞會試至於雜坐喧譁何以防弊命治考官及監察罪興定二年御史中丞把胡魯言國家數路取人惟進士之選最為崇重不求備數惟務得賢今場會試策論進士不及二人取一人詞賦經義二人取一前雖有聖訓當依大定之制中選即收無問多寡然大定間赴試者或至三千取不過五百泰和中策論進士三人取一詞賦經義四人取一向者貞祐初詔免府試赴會試者幾九千人而取八百有奇則是十之一而已時已有依大定之制亦何嘗二人取一哉今考官泛濫如此非所以為求賢也宜於會試之前奏請所取之數使恩出於上可也詔集文資官議卒從泰和之例又謂宰臣曰從來廷試進士日晡後即遣出宮恐文思遲者不得盡其才令待至暮時特賜經義進士王彪等十三人及第上覽其程文愛其辭藻咨歎久之因怪學者益少謂監試官左丞高汝礪曰養士學糧歲稍豐熟即以本色給之不然此科且廢矣五年省試經義進士考官於常格外多取十餘人上命以特恩賜第又命河北舉人今府試中選而為兵所阻者免後舉府試策論進士選女直人之科也始大定四年世宗命頒行女直大小字所譯經書每謀克選二人習之尋欲興女直字學校猛安謀克內多擇良家子為生諸路至三千人九年選異等者得百人薦於京師廩給之命溫迪罕締達教以古書詩策後復試得徒單鎰以下三十餘人十一年始議行策選之制至十三年始定每場策一道以五百字以上成免鄉試府試止赴會試御試且詔京師設女直國子學諸路設女直府學擬以新進士充教授以教士民子弟之願學者俟行之久學者衆則同漢進士三年一試之制乃就憫忠寺試徒單鎰等其策曰賢生於世世資於賢世未嘗不生賢賢未嘗不輔世蓋世非無賢惟用與否若伊尹之佐成湯傅說之輔高宗呂望之遇文王皆起耕築漁釣之間而其功業卓然後世不能企及者蓋殷周之君能用其人盡其才也本朝以神武定天下聖上以文德綏海內文武並用言小善而必從事小便而不棄蓋取人之道盡矣而尚憂賢能遺於草澤者今欲盡得天下之賢而用之又俾賢者各盡其能以何道而臻此乎憫忠寺舊有雙塔進士入院之夜半聞東塔上有聲如音樂西入宮考試官侍御史完顏蒲涅等曰文路始開而有此得賢之祥也中選者得徒單鎰以下二十七人十六年命皇家兩從以上親及宰相子直赴御試皇家袒免以上親及執政官之子直赴會試至二十年以徒單鎰等教授中外其學大振遂定制今後以策詩試三場策用女直大字詩用小字程試之期皆依漢進士例省臣奏漢人進士來年三月二十日鄉試八月二十日府試次年正月二十日會試三月十二日御試敕以來年八月二十五日於中都上京咸平東平府等路四處府試餘從前例上曰契丹文字年遠觀其所撰詩義理深微當時何不立契丹進士科舉今雖立女直字科慮女直字創製日近義理未如漢字深奧恐為後人議論丞相守道曰漢文字恐初亦未必能如此由歷代聖賢漸加修舉也聖主天姿明哲令譯經教天下行之久亦可同漢人文章矣上曰其同漢人進士例譯作程文俾漢官覽之二十二年三月策試女直進士至四月癸丑上謂宰臣曰女直進士試已久矣何尚未考定參知政事斡特剌對曰以其譯付看故也上命速之二十三年上曰女直進士設科未久若令積習精通則能否自見矣二十八年諭宰臣曰女直進士惟試以策行之既久人能預備今若試以經義可乎宰臣對曰五經中書易春秋已譯之矣俟譯詩禮畢試之可也上曰大經義理深奧不加歲月不能貫通今宜於經內姑試以論題後當徐試經義也章宗大定二十九年詔許諸人試策論進士舉七月省奏如詩策論俱作一日程試恐力有不逮詩策作一日論作一日以詩策合格為中選而以論定其名次上曰論乃新添至第三舉時當通定去留明昌元年猛安謀克願試進士者擬依餘人例不可令直赴御試上曰是止許女直進士毋令試漢進士也又定制餘官第五品散階令直赴會試官職俱至五品令直赴御試承安二年敕策論進士限丁習學遂定制內外官員諸局分承應人武衛軍若猛安謀克女直及諸色人戶止一丁者不許應試兩丁者許一人四丁二人六丁以上止許三人三次終場不在驗丁之限三年定制女直人以年四十五以下試進士舉於府試十日前委佐二官善射者試射其制以六十步立𣛀去射者十五步對立兩竿相去二十步去地二丈以繩橫約之弓不限強弱不計中否以張弓巧便發箭迅正者為熟間射十箭中兩箭出繩下至𣛀者為中選餘路委提刑司在都委監察體究如當赴會試御試者大興府佐二官試驗三舉終場者免之四年禮部尚書賈鉉言策論進士程試弓箭其兩舉終場及年十六以下未成丁者若以弓箭退落有失賢路乞於及第後試之中者別加任使或升遷否者降之省臣謂舊制三舉終場免試今兩舉亦免之未可若以未成丁免試必有妄匿年者如果幼使徐習未晚也至於及第後試驗升降則已有定格矣詔從舊制在泰和格復有以時務策參以故事及疑難經旨為問之制宣宗南遷興定元年制中都西京等路策論進士及武舉人權於南京東平婆速上京四處府試五年上賜進士斡勒業德等二十八人及第上覽程文怪其數少以問宰臣對曰大定制隨處設學諸謀克貢三人或二人為生員贍以錢米至泰和中人例授地六十畝所給既優故學者多今京師雖存府學而月給通寶五十貫而已若於諸路總管府及有軍戶處置學養之庶可加益京師府學已設六十人乞更增四十人中京亳州京兆府並置學官於總府以謀克內不隸軍籍者為學生人畀地四十畝漢學生在京者亦乞同此餘州府仍舊制上從之凡會試之數大定二十五年詞賦進士不得過五百人二十八年以不限人數遂至五百八十六人章宗令合格則取故承安二年至九百二十五人時以復加四舉終場者數太濫遂命取不得過六百人泰和二年上命定會試諸科取人之數司空襄言試詞賦經義者多可五取一策論絶少可四取一恩榜本以優老於場屋者四舉受恩則太優限以年則礙異材可五舉則受恩平章徒單鎰等言大定二十五年至明昌初率三四人取一平章張汝霖亦言五人取一府試百人中才得五耳遂定制策論三人取一詞賦經義五人取一五舉終場年四十五以上四舉終場年五十以上者受恩凡考試官大定間府試六處各差詞賦試官三員策論試官二員明昌初增為九處路各差九員大興府則十一員承安四年又增太原為十處有司請省之遂定策論進士女直經童千人以上差四員五百人以上三員不及五百二員各以職官高者一人為考試官餘為同考試官詞賦進士與律科舉人共及三千以上五員二千四員不及二千三員經義進士及經童舉人千人四員五百以上三員百人以上二員不及百人以詞賦考官兼之後又定制策論試官上京咸平東平各三員北京西京益都各二員律科監試官一員試律官二員隸詞賦考試院經童試官一員隸經義考試院與會試同其彌封並謄録官檢搜懷挾官自餘修治試院監押門官並如會試之制大定二十年上以往歲多以遠地官考試不便遂命差近者凡會試知貢舉官同知貢舉官詞賦則舊十員承安五年為七員經義則六員承安五年省為四員詮讀官二員泰和三年上以彌封官泄語於舉人敕自今女直司則用右選漢人封漢人司則以女直司封宣宗貞祐三年以會試賦題已曾出而有犯格中選者復以考官多取所親上怒其不公命究治之凡御試讀卷官策論詞賦進士各七員經義五員餘職事官各二員制舉宏詞共三員泰和七年禮部尚書張行簡言舊例讀卷官不避親至有親人或有不敢定其去留或力加營護而為同列所疑若讀卷官不用與進士有親者則讀卷之際得平心商確上遂命臨期多擬其有親者汰之凡府試策論進士大定二十年定以中都上京咸平東平四處至明昌元年添北京西京益都為七處兼試女直經童凡上京合懶速頻胡里改蒲與東北招討司等路者則赴會寧府試咸平隆州婆速東京蓋州懿州者則赴咸平府試中都河北東西路者則赴大興府試西京並西南西北二招討司者則赴大同府試北京臨潢宗州興州全州者則赴大定府試山東西大名南京者則赴東平府試山東東路則試於益都凡詞賦經義進士及律科經童府試之處大定間大興大定大同開封東平京兆凡六處明昌初增遼陽平陽益都為九處承安四年復增太原為十中都河北則試於大興府上京東京咸平府等路則試於遼陽府餘各試於其境凡鄉試之期以三月二十日府試之期若策論進士則以八月二十日試策間三日試詩詞賦進士則以二十五日試賦及詩又間三日試策論經義進士又間詞賦後三日試經義又三日試策次律科次經童每場皆間三日試之會試則策論進士以正月二十日試策皆以次間三日同前御試則以三月二十日策論進士試策二十三日試詩論二十五日詞賦進士試賦詩論而經義進士亦以是日試經義二十七日乃試策論若試日遇雨雪則候晴日御試唱名後試策則禀奏宏詞則作二日程試舊制試女直進士在再試漢進士後大定二十九年以復設經義科更定是制凡監檢之制大興府則差武衛軍餘府則於附近猛安內差摘平陽府則差順德軍凡府會試每四舉人則差一人復以官一人彈壓御試策進士則差弩手及隨局承應人漢進士則差親軍人各一名皆用不識字者以護衛十人親軍百人長五十人長各一人巡護泰和元年省臣奏搜檢之際雖當嚴切然至於解髮袒衣索及耳鼻則過甚矣豈待士之禮哉故大定二十九年已嘗依前故事使就沐浴官置衣為之更之既可防濫且不虧禮上從其說命行之恩例明昌元年定制省元直就御試不中者許綴榜末解元但免府試四舉終場依五舉恩例所試文卷惟犯御名廟諱不成文理者則黜之餘並以文之優劣為次仍一日試三題其五舉者止試賦詩女直進士亦同此例承安五年敕進士四舉該恩詞賦經義當以各科為場數不得通數又恩榜人應授官者監試官於試時具數以奏特恩者授之泰和三年以經義會元與策論詞賦進士不同若御試被黜則附榜末為太優若同恩例又與四舉者不同遂定制依曾經府試解元免府試之例會試下第再舉直赴御試律科進士又稱為諸科其法以律令內出題府試十五題每五人取一人大定二十二年定制會試每場十五題三場共通三十六條以上文理優擬斷當用字切者為中選臨時約取之初無定數其制始見於海陵庶人正隆元年至章宗大定二十九年有司言律科止知讀律不知教化之源可使通治論語孟子以涵養其氣度遂令自今舉後復於論語孟子內試小義一道府會試別作一日引試命經義試官出題與本科通考定之經童之制凡士庶子年十三以下能誦二大經三小經又誦論語諸子及五千字以上府試十五題通十三以上會試每場十五題三場共通四十一以上為中選所貴在幼而誦多者若年同則以誦大經多者為最初天會八年時太宗以東平童子劉天驥七歲能誦詩書易禮春秋左氏傳及論語孟子上命教養之然未有選舉之制也熙宗即位之二年詔闢貢舉始備其列取至百二十二人天德間廢之章宗大定二十九年上謂宰臣曰經童豈遽無人其議復置明昌元年益都府申童子劉住兒年十一歲能詩賦誦大小六經所書行草頗有法孝行夙成乞依宋童子李淑賜出身且加以恩詔上召至內殿試鳳凰來儀賦魚在藻詩又令賦旱詩上嘉之賜本科出身給錢粟官舍令肄業太學明昌三年平章政事完顏守貞言經童之科非古也自唐諸道表薦或取五人至十人近代宋仁宗以為無補罷之本朝皇統間取及五十人因以為常天德時復廢聖主復置取以百數恐久積多不勝銓擬乞諭旨約省取之上曰若所誦皆及格何如守貞曰視最幼而誦不訛者精選之則人數亦不至多也復問參知政事胥持國對曰所誦通否易見豈容有濫上曰限以三十或四十人若百人皆通亦可覆取其精者持國曰是科蓋資教之術耳夫幼習其文長玩其義使之蒞政人材出焉如中選者加之修習進士舉業則所記皆得為用臣謂可勿令遽登仕途必習舉業而後官使之可也若能擢進士第自同進士任用如中府薦或會試視其次數優其等級幾舉不得薦者從本出身又可以激勸而後得人矣詔議行之制舉有賢良方正能直言極諫博學宏材達於從政等科試無常期上意欲行即告天下聽內外文武六品以下職官無公私過者從內外五品以上官薦於所屬詔試之若草澤士德行為鄉里所服者則從府州薦之凡試則先投所業策論三十道於學士院視其詞理優者委官以羣經子史內出題一日試論三道如可則庭試策一道不拘常務取其無不通貫者優等遷擢之宏詞科試詔誥章表露布檄書則皆用四六誡諭頌針銘序記則或依古今體或參用四六於每舉賜第後進士及在官六品以下無公私罪者在外官薦之令試策官出題就考通試四題分二等遷擢之二科皆章宗明昌元年所創者也武舉嘗設於皇統時其制則見於泰和式有上中下三等能挽一石力弓以重七錢竹箭百五十步立貼十箭內府試欲中一箭省試中二箭程試中三箭又遠射二百二十步𣛀三箭內一箭至者又百五十步內每五十步設高五寸長八寸臥鹿二能以七斗弓二大鑿頭鐵箭馳射府試則許射四反省試三反程試二反皆能中二箭者又百五十步內每三十步左右錯置高三尺木偶人戴五寸方板者四以槍馳刺府試則許馳三反省試二反程試三反左右各刺落一板者又依廕例問律一條又問孫吳書十條能說五者為上等凡程試若一有不中者皆黜之若射貼弓八斗遠射二百一十步射鹿弓六斗孫吳書十條通四為中等射貼弓七斗遠射二百伍步射鹿弓五斗孫吳書十條通三為下等解律刺板皆欲同前凡不知書者雖上等為中中則為下凡試中中下願再試者聽舊制就試上等不中不許再試中下等泰和元年定制不分舊等但從所願試中則以三等為次二年省奏武舉程式當與進士同時今年八月府試欲隨路設考試所臨期差官恐以創立未見應試人數遂權令各處就考之宣宗貞祐三年同進士例賜敕命章服時以隨處武舉入試者自非見居職任及已用於軍前者令郡縣盡遣詣京師別為一軍以備緩急其被薦而未授官者亦量材任之元光二年東京總帥紇石烈牙吾塔言武舉入仕皆授巡尉軍轄此曹雖善騎射不歷行陳不知軍旅一旦臨敵恐致敗事乞盡括付軍前為長校俟有功則升之宰臣奏國家設此科與進士等而欲盡置軍中非奬進人材之道遂籍丁憂待闕去職者付之試學士院官大定二十八年敕設科取士為學士院官禮部下太常按唐典初入學士院例先試今若於進士已仕者以隨朝六品外路五品職事官薦試制詔誥等文字三道取文理優者充應奉由是翰苑之選為精明昌五年以學士院撰文字人少命尚書省訪有文采者勾取權試凡司天臺學生女直二十六人漢人五十人聽官民家年十五以上三十以下試補又三年一次選草澤人試補其試之制以宣明曆試推步及婚書地理新書試合婚安葬並易筮法六壬課三命五星之術凡醫學十科大興府學生三十人餘京府二十人散府節鎮十六人防禦州十人每月試疑難以所對優劣加懲勸三年一次試諸太醫雖不係學生亦聽試補
