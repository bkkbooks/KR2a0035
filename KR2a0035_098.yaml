body:
  text: 金史卷九十八列傳第三十六完顏匡完顏綱完顏定奴完顏匡本名撒速始祖九世孫事豳王允成為其府教讀大定十九年章宗年十餘歲顯宗命詹事烏林答願擇德行淳謹才學該通者使教章宗兄弟閲月願啓顯宗曰豳王府教讀完顏撒速徐王府教讀僕散訛可二人可使教皇孫兄弟顯宗曰典教幼子須用淳謹者已而召見于承華殿西便殿顯宗問其年對曰臣生之歲海陵自上京遷中都歲在壬申顯宗曰二十八歲爾詹事乃云三十歲何也匡曰臣年止如此詹事謂臣出入宮禁故增其歲言之耳顯宗顧謂近臣曰篤實人也命擇日使皇孫行師弟子禮七月丁亥宣宗章宗皆就學顯宗曰每日先教漢字至申時漢字課畢教女直小字習國朝語因賜酒及綵幣頃之世宗詔匡訛可俱充太子侍讀寢殿小底駝滿九住問匡曰伯夷叔齊何如人匡曰孔子稱夷齊求仁得仁九住曰汝輩學古惟前言是信夷齊輕去其親不食周粟餓死首陽山仁者固如是乎匡曰不然古之賢者行其義也行其道也伯夷思成其父之志以去其國叔齊不苟從父之志亦去其國武王伐紂夷齊叩馬而諫紂死殷為周夷齊不食周粟遂餓而死正君臣之分為天下後世慮至遠也非仁人而能若是乎是時世宗如春水顯宗從二人者馬上相語遂後顯宗遲九住至問曰何以後也九住以對顯宗嘆曰不以女直文字譯經史何以知此主上立女直科舉教以經史乃能得其淵奧如此哉稱善者良久謂九住曰論語知之為知之不知為不知是知也汝不知不達務辨口以難人由是觀之人之學不學豈不相遠哉顯宗嘗謂中侍局都監蒲察查剌曰入殿小底完顏訛出侍讀完顏撒速與我同族汝知之乎對曰不知也顯宗曰撒速始祖九世孫訛出保活里之世也始祖兄弟皆非常人汝何由知此顯宗命匡作睿宗功德歌教章宗歌之其詞曰我祖睿宗厚有陰德國祚有傳儲嗣當立滿朝疑懼獨先啓策徂征三秦震驚來附富平百萬望風奔仆靈恩光被時雨春暘神化周浹春生冬藏蓋取宗翰與睿宗定策立熙宗及平陝西大破張浚于富平也二十三年三月萬春節顯宗命章宗歌此詞侑觴世宗愕然曰汝輩何因知此顯宗奏曰臣伏讀睿宗皇帝實録欲使兒子知創業之艱難命侍讀撒速作歌教之世宗大喜顧謂諸王侍臣曰朕念睿宗皇帝功德恐子孫無由知皇太子能追念作歌以教其子嘉哉盛事朕之樂豈有量哉卿等亦當誦習以不忘祖宗之功命章宗歌數四酒行極歡乙夜乃罷二十五年匡中禮部策論進士是歲世宗在上京顯宗監國三月甲辰御試前一日癸卯讀卷官吏部侍郎李晏棣州防禦使把內剌國史院編修官夾谷衡國子助教尼厖古鑑進稟策題問契敷五教臯陶明五刑是以刑措不用比屋可封今欲興教化措刑罰振紀綱施之萬世何術可致匡已試明日入見顯宗問對策云何匡曰臣熟觀策問敷教措刑兩事不詳振紀綱一句秪作兩事對策必不能中顯宗命匡誦所對策終篇曰是亦當中匡曰編修衡助教鑑長於選校必不能中已而匡果下第顯宗惜之謂侍臣曰我只欲問教化刑罰兩事乃添振紀綱一句命刪去李晏固執不可今果誤人矣謂侍正石敦寺家奴唐括曷答曰侍讀二十一年府試不中我本不欲侍讀再試恐傷其志今乃下第使人意不樂是歲初取止四十五人顯宗命添五人僕散訛可中在四十五人後除書畫直長匡與訛可俱為侍讀匡被眷遇特異顯宗謂匡曰汝無以訛可登第怏怏但善教金源郡王何官不可至哉是歲顯宗薨章宗判大興尹封原王拜右丞相立為皇太孫匡仍為太孫侍讀二十八年匡試詩賦漏寫詩題下注字不取特賜及第除中都路教授侍讀如故章宗即位除近侍局直長歷本局副使局使提點太醫院遷翰林直學士使宋上令權更名弼以避宋祖諱事載本紀遷祕書監仍兼太醫院近侍局事再兼大理少卿遷簽書樞密院事兼職如故承安元年行院于撫州河北西路轉運使溫昉行六部事主軍中餽餉屈意事匡以馬幣為獻及私以官錢佐匡宴會費監察御史姬端修劾之上方委匡以邊事遂寢其奏三年入奏邊事居五日還軍尋入守尚書左丞兼修國史進世宗實録章宗立提刑司專糾察黜陟當時號為外臺匡與司空襄參政揆奏息民不如省官聖朝舊無提刑司皇統大定間每數歲一遣使廉察郡縣稱治自立此官冀達下情今乃是非混淆徒煩聖聽自古無提點刑獄專薦舉之權者若陛下不欲遽更不宜使兼採訪廉能之任歲遣監察體究仍不時選使廉訪上從其議於是監察體訪之使出矣初匡行院于撫州障葛將攻邊境會西南路通事黃摑按出使烏都碗部知其謀奔告行院為之備迎擊障葛敗其兵按出與八品職遷四官匡遷三官匡奏乞以所遷三官讓其兄奉御賽一上嘉其義許之改樞密副使授世襲謀克宋主相韓托胄托胄嘗再為國使頗知朝廷虛實及為相與蘇師旦倡議復讎身執其咎繕器械增屯戍初未敢公言征伐乃使邊將小小寇鈔以嘗試朝廷泰和五年正月入確山界奪民馬三月焚平氏鎮剽民財物掠鄧州白亭巡檢家資持其印去遂平縣獲宋人王俊唐州獲宋諜者李忤俊襄陽軍卒忤建康人俊言宋人於江州鄂嶽屯大兵貯甲仗修戰艦期以五月入寇忤言托胄謂大國西北用兵連年公私困竭可以得志命修建康宮勸宋主都建康節制諸道河南統軍司奏請益兵為之備詔平章政事僕散揆為河南宣撫使籍諸道兵括戰馬臨洮德順秦鞏各置弓手四千人詔揆遺書宋人曰奈何興兵宋人辭曰盜賊也邊臣不謹今黜之矣宋人將啓邊釁太常卿趙之傑知大興府承暉中丞孟鑄皆曰江南敗衄之餘自救不暇恐不敢敗盟匡曰彼置忠義保捷軍取先世開寶天禧紀元豈忘中國者哉大理卿畏也曰宋兵攻圍城邑動輒數千不得為小寇上問參政思忠思忠極言宋人敗盟有狀與匡畏也合上以為然及河南統軍使紇石烈子仁使宋還奏宋主修敬有加無他志上問匡曰於卿何如匡曰子仁言是上愕然曰卿前議云何今乃中變邪匡徐對曰子仁守疆圉不妄生事職也書曰有備無患在陛下宸斷耳於是罷河南宣撫司僕散揆還朝六年二月宋人陷散關取泗州虹縣靈璧四月復詔僕散揆行省事于汴制諸軍頃之以匡為右副元帥揆請匡先取光州還軍懸瓠與大軍合勢南下匡奏僕散揆大軍渡淮宋人聚兵襄沔以窺唐鄧汴京留兵頗少有掣肘之患請出唐鄧從之遣前鋒都統烏古論慶壽以騎八千攻棗陽遣左翼提控完顏江山以騎五千取光化右翼都統烏古孫兀屯取神馬坡皆克之匡軍次白虎粒都統完顏按帶取隨州烏古論慶壽扼赤岸斷襄漢路宋隨州將雷太尉遁去遂克隨州於是宋鄧城樊城戍兵皆潰賜詔奬諭戒諸軍毋虜掠焚壞城邑匡進兵圍德安分遣諸將徇下安陸應城雲夢漢川荊山等縣副統蒲察攻宜城縣取之十二月敗宋兵二萬人于信陽之東詔曰卿總師出疆屢捷殄寇撫降日闢土宇彼恃漢江以為險阻箠馬而渡如涉坦途荊楚削平不為難事雖天佑順亦卿籌畫之效也益宏遠圖以副朕意匡進所獲女口百人詔匡權尚書右丞行省事右副元帥如故吳曦以蜀漢內附詔匡先取襄陽以屏蔽蜀漢完顏福海破宋援襄陽兵於白石遂取穀城縣僕散揆得疾遂班師至蔡疾革詔右丞相宗浩代之七年二月揆薨匡久圍襄陽士卒疲疫會宗浩至汴匡乃放軍朝京師轉左副元帥賜宴于天香殿還軍許州九月宗浩薨匡為平章政事兼左副元帥封定國公代宗浩總諸軍行省于汴京初僕散揆初至汴既定河南諸盜乃購得韓托胄族人元靚使行間於宋元靚渡淮宋督視江淮兵馬事丘䥩奏之宋主是時宋主托胄見兵屢敗以為憂欲乞盟無以為請得䥩奏即命遣人護元靚北歸因請議和䥩使其屬劉祐送元靚申和議于揆揆曰稱臣割地獻首禍之臣然後可宋主因密諭丘䥩使歸罪邊將以請焉及宗浩代揆方信孺至宗浩以方信孺輕佻不可信移書宋人果欲請和當遣朱致知吳琯李大性李璧來托胄得報大喜過望乃召張巖于建康罷為福建觀察使歸罪蘇師旦貶之嶺南是時李璧已為參政不可遣朱致知吳琯已死李大性知福州道遠不能遽至乃遣左司郎中王柟來至濠州匡使人責以稱臣等數事柟以宋主托胄情實為請依靖康二年正月請和故事世為伯姪國增歲幣為三十萬兩匹犒軍錢三百萬貫蘇師旦等俟和議定當函首以獻柟至汴以托胄書上元帥府匡復詰之柟懇請曰此事實出朝旨非行人所專匡察其不妄乃具奏章宗詔匡移書宋人當函托胄首贖淮南地改犒軍錢為銀三百萬兩於是宋吏部侍郎史彌遠定計殺韓托胄彌遠知國政和好自此成矣於是廷議諸軍已取關隘不可與王柟以宋參政錢象祖書來略曰竊惟昔者修好之初蒙大金先皇帝許以畫淮為界今大國遵先皇帝聖意自盱眙至唐鄧畫界仍舊是先皇帝惠之于始今皇帝全之于後也然東南立國吳蜀相依今川陝關隘大國若有之則是撤蜀之門戶不能保蜀何以固吳已增歲幣至三十萬通謝為三百萬貫以連歲師旅之餘重以喪禍豈易辦集但邊隙既開和議區區悔艾之實不得不黽勉遵承又蒙聖畫改輸銀三百萬兩在本朝宜不敢固違然傾國資財竭民膏血恐非大金皇帝棄過圖新兼愛南北之意也主上仁慈寬厚謹守信誓豈有意於用兵止緣托胄啓釁生事迷國罔上以至於斯是以奮發英斷大正國典朋附之輩誅斥靡貸今大國欲使斬送托胄是未知其已死也托胄實本庸愚怙權輕信有誤國事而致托胄誤國者蘇師旦也師旦既貶托胄尚力庇之囑方信孺妄言已死近推究其事師旦已行斬首儻大國終惠川陝關隘所畫銀兩悉力祗備師旦首函亦當傳送以謝大國本朝與大國通好以來譬如一家叔姪本自協和不幸奴婢交鬬其間遂成嫌間一旦猶子翻然改悟斥逐奴隸引咎謝過則前日之嫌便可銷釋奚必較錙銖豪末反傷骨肉之恩乎惟吳蜀相為首尾關隘繫蜀安危望敢備奏始終主盟使南北遂息肩之期四方無兵革之患不勝通國至願是時陝西宣撫司請增新得關隘戍兵萬人王柟狀稟如蒙歸川陝關隘韓托胄首必當函送遵上國之命匡奏曰關隘之事臣初亦惑之今當增戍萬人壁壘之役餽餫之勞費用必廣祖宗所以不取者以關隘僅能自保耳非有益於戰也設能入寇縱之平地以鐵騎蹂之無一得脫彼哀祈不已者以前日負固尚且摧覆今遂失之是無一日之安也必謂兵力得之不可還賜則漢上諸郡皆膏腴耕桑之地棗陽光化歸順之民數萬戶較之陝右輕重可知獨在陛下決之耳詔報曰托胄渠魁既請函首宋之悔服可謂誠矣匡乃遣王柟還復書曰宋國負渝盟之罪自陳悔艾主上德度如天不忍終絶優示訓諭許以更成所以覆護鎮撫之恩至深至厚昨奉聖訓如能斬送韓托胄徐議還淮南地來書言韓托胄已死將以蘇師旦首易之飾辭相紿如此至于犒軍銀兩欲俟歸關隘然後祗備是皆有咈聖訓及王柟狀稟如蒙歸還川陝關隘其韓托胄首必當函送聖訓令斬送托胄首者本欲易淮南地陝西關隘不預焉王柟所陳亦非元畫事理不敢專決具奏奉旨朕以生靈為念已貰宋罪關隘區區豈足深較既能函送韓托胄首陝西關隘可以還賜今恩訓如此其體大國寬仁矜恤曲從之意追修誓書齎遣通謝人使赴闕王柟之歸也匡要以先送叛亡驅掠然後割賜淮南川陝及彼誓書草本有犯廟諱字及文義有不如體製者諭令改之宋人以叛亡驅掠散在州縣一旦拘刷未易聚集今已四月農事已晚邊民連歲流離失所扶道路即望復業過此農時遂失一歲之望歲幣犒軍物多非旬月可辦錢象祖復以書來略曰竊見大金皇帝前日聖旨如能斬送韓托胄首沿淮之地並依皇統大定已畫為定又睹今來聖旨既能送托胄首陝西關隘可併還賜以此仰見聖慈寬大初無必待發遣驅掠官兵然後退兵交界之語誓書草本添改處先次録本齎呈並將托胄首函送及管押納合道僧李全家口一併發還欲望上體大金皇帝畫定聖旨先賜行下沿邊及陝西所屬候托胄首到界上即便抽回軍馬歸還淮南及川陝關隘地界所有驅掠官兵留之何益見已從實刷勘發還其使人禮物歲幣等已起發至真揚間伺候嘉報迤邐前去界首以俟取接匡得錢象祖書即具奏詔報曰朕以生靈之故已從所請稱臣割地尚且闊略區區小節何足深較其托胄師旦首函及諸叛亡至濠州即聽通謝人使入界軍馬即當徹還川陝關隘俟歲幣犒軍銀綱至下蔡畫日割賜匡得詔書即以諭宋人使如詔書從事泰和八年閏四月乙未宋獻韓托胄蘇師旦首函至元帥府匡遣平南撫軍上將軍紇石烈貞以托胄師旦首函露布以聞五月丁未遣戶部尚書高汝礪禮部尚書張行簡奏告天地武衛軍都指揮使徒單鏞奏告太廟御史中丞孟鑄告社稷是日上御應天門立黃麾仗受宋馘尚書省奏露布親王百官起居上表稱賀獻馘廟社以露布頒中外竿托胄師旦首並二人畫像于通衢百姓縱觀然後漆其首藏之軍器庫丙辰匡朝京師進官兩階賜玉帶金一百兩銀一千五百兩重幣三十端罷元帥府仍為樞密院六月癸酉宋通謝使許奕吳衡等入見癸未以宋人請和詔天下十一月丙辰章宗崩匡受遺詔立衛紹王其遺詔略曰皇叔衛王承世宗之遺體鍾厚慶於元妃人望所歸歷數斯在今朕上體太祖皇帝傳授至公之意付畀寶祚即皇帝位於柩前載惟禮經有嫡立嫡無嫡立庶今朕之內人見有娠者兩位已詔皇帝如其中有男當立為儲二如皆是男子擇可立者立之丁巳衛紹王即位戊午章宗內人范氏胎氣有損大安元年四月平章政事僕散端左丞孫即康奏承御賈氏産期已出三月有人告元妃李氏令賈氏詐稱有身詔元妃李氏承御賈氏皆賜死初章宗大漸匡與元妃俱受遺詔立衛王匡欲專定策功遂構殺李氏數日匡拜尚書令封申王大安元年十二月薨匡事顯宗深被恩遇自章宗幼年侍講讀最親幸致位將相怙寵自用官以賄成承安中撥賜家口地土匡乃自占濟南真定代州上腴田百姓舊業輒奪之及限外自取上聞其事不以為罪惟用安州邊吳泊舊放圍場地奉聖州在官間田易之以向自占者悉還百姓宣宗嘗謂侍臣曰撒速往年嘗受人玉吐鶻然後與之官此豈宰相所為哉完顏綱本名元奴字正甫明昌中為奉御纍官左拾遺詔三叉口置捺鉢綱上疏諫疏中有云賊出沒其間詔尚書省詰問所言不實章宗以綱諫官不之罪遷刑部員外郎綱言諸犯死罪除名移推相去二百里並犯徒罪連逮二十人以上者並令就問曾經所屬按察司審讞者移推別路官亦依上就問凡告移推之人皆已經本路按察審訖即當移推別路按察司部分廣闊如上京路移推臨潢路最近亦往復二三千里北京留守司移推西北路招討司最近亦須數月乞依舊制令移推官司追取其人歸問從之故事使夏國者夏人饋贈禮物視書幾道以為多寡泰和元年綱為賜夏主生日使章宗命齎三詔左司員外郎孫椿年奏詔為一道尋自陳首上責宰臣曰椿年忽略卿等奈何不奏也轉工部郎中上言太府監官兼尚食局官乞於少府監依此例注能幹官一員兼儀鸞局官儀鸞局官一員兼少府監官相須檢治從之四年詔綱與喬宇宋元吉編類陳言文字綱等奏凡關涉宮庭及大臣者摘進其餘以省臺六部各為一類凡二十卷遷同簽宣徽院事六年與宋連兵陝西諸將頗相異同以綱為蜀漢路安撫使都大提舉兵馬事與元帥府參決西事調羌兵之未附者於是知鳳翔府事完顏昱同知平涼府事蒲察秉鉉分駐鳳翔諸隘通遠軍節度使承裕秦州防禦使完顏璘屯成紀界知臨洮府事石抹仲溫駐臨洮同知臨洮府事术虎高琪彰化軍節度副使把回海備鞏州諸鎮乾州刺史完顏思忠扼六盤陝西路都統副使斡勒牙剌京兆府推官蒲察秉彝戍虢華扼潼關蒲津陝西都統完顏忠本名裊懶同知京兆府事烏古論兗州守京兆要害以鳳翔臨洮路蕃漢弓箭手及緋翮翅軍散據邊陲緋翮翅軍名也元帥右監軍充右都監蒲察貞分總其事宋吳曦以兵六千攻鹽川鞏州戍將完顏王善隊校僕散六斤猛安龍延常擊走之斬首二百級七月吳曦兵五萬由保坌姑蘇等路寇秦州承裕璘以騎千餘擊之曦兵大敗追奔四十里曦別兵萬人入來遠鎮术虎高琪破之青宜可者吐蕃之種也宋取河湟夏取河西四郡部落散處西鄙其魯黎族帥曰冷京據古疊州有四十三族十四城三十餘萬戶東鄰宕昌北接臨洮積石南行十日至笋竹大山蓋蠻境也西行四十日至河外俗不論道里而以日計之云冷京卒子耳骨延嗣宋不能制縻以官爵傳六世至青宜可尤徑勇得衆以宋政令不常有改事中國之意曹佛留為洮州刺史佛留材武有智策能結諸羌青宜可畏慕佛留以父呼之請舉國內附朝廷以宋有盟不許厚賜金帛以撫之明昌間屬羌已彪殺郡佐反是時綱為奉御奉詔與曹佛留計事因召青宜可會兵擊破已彪曹佛留遷同知臨洮尹兼洮州刺史子普賢為洮州管內巡檢使綱屢以事至洮佛留每謂綱言青宜可願內屬出其至情綱輒奏之上終不納及綱部署陝西上密敕經略西事於是曹佛留已死普賢為懷羌巡檢使綱至洮馳召普賢攝同知洮州事普賢傳箭入羌中青宜可大喜率諸部長籍其境土人民詣綱請內屬綱奏其事上以青宜可為疊州副都總管加廣威將軍詔青宜可曰卿統有部人世為雄長嚮風慕義背偽歸朝願效純誠輸忠力緬懷嘉矚式厚褒旌覽卿進上所受偽牌朝廷之馭諸蕃固無此例欲使卿有以鎮撫部族增重觀望是以特加改命賜金牌一銀牌二到可祗承服我新恩永為藩衛曹普賢真授同知洮州事綱遷拱衛直都指揮使遷三階安撫都大提舉如故以商州刺史烏古論兗州領曹普賢押領青宜可勾當詔曰完顏綱初行時汝未知朝廷有青宜可之事獨言可以招撫必獲其用既而果來效順今汝勿以青宜可兵勢重大卑屈失體亦勿以蕃部而藐視之九月詔安慰陝西略曰京兆鳳翔臨洮三路應被宋兵逼脅背國從偽或沒落外境若能自歸者官吏依舊勾當百姓各令復業元拋地土依數給付及受宋人旗榜結構等或值驚擾因而避役逃亡未發覺者許令所在官司陳首並行釋免更不追究軍前可用之人隨宜任使限外不首復罪如初宋程松遣別將曲昌世襲方山原自率兵數萬分道襲和尚原西山寨龍門等關是日大霧四塞既又暴雨和尚原西山寨龍門關戍兵不知宋兵來松遂據之蒲察貞遣行軍副統裴滿阿里同知隴州事完顏孛論以兵千人伏方山原下萬戶奧屯撒合門美原縣令术虎合沓別將壯士五百取間道潛登出宋兵上自高而下宋兵大駭伏兵合擊遂破之貞乃分遣术虎合沓部將完顏出軍奴率兵千人出黃兒谷取和尚原同知會州事女奚列南家押軍猛安粘割撒改率兵千人出大寧谷取西山寨貞自以兵七百由中路取龍門等關程松已焚閣道貞且修道且進兵至小關松將楊廷據險注射貞不得前令行軍副統裴滿阿里為疑兵潛遣猛安胡信率甲士五十人繞出其後反擊之宋兵大亂遂斬廷于陳宋兵走二里關復敗宋將彭統領宋兵走龍門追擊大破之合沓乘夜潛登和尚原絶頂宋人驚以為神皆散走破其衆二千生獲數十人南家斬木開道以登西山再與宋兵遇皆散之遂盡復故地宋吳曦將馮興楊雄李圭以步騎八千人入赤谷將寇秦州承裕完顏璘河州防禦使蒲察秉鉉逆擊破之宋步兵趨西山騎兵走赤谷承裕分兵躡宋步兵宋步兵據山搏戰部將唐括按答海率二百騎馳擊之甲士蒙葛挺身先入其陳衆乘之宋步兵大潰殺數百人追者至皂郊城斬首二千級猛安把添奴追宋騎兵殺千餘人馮興僅以身免楊雄李圭皆為金軍所殺十月綱以蕃漢步騎一萬出臨潭充以關中兵一萬出陳倉蒲察貞以岐隴兵一萬出成紀石抹仲溫以隴右步騎五千出鹽川完顏璘以本部兵五千出來遠初吳玠吳璘俱為宋大將兄弟父子相繼守西土得梁益間士衆心璘孫曦太尉昭武軍節度使成都潼川府夔利等州路宣撫副使泰和六年出兵興元有窺關隴之志誘募邊民為盜遣諜以利餌鳳翔卒溫昌結三虞候軍為內應昌詣府上變曦遣諸將出秦隴間與綱等諸軍相拒上聞韓托胄忌曦威名可以間誘致之梁益居宋上遊可以得志于宋封曦蜀國王鑄印賜詔詔綱經略之其賜曦詔曰宋自佶桓失守構竄江表僭稱位號偷生吳會時則乃祖武安公玠捍禦兩川洎武順王璘嗣有大勳固宜世胙大帥遂荒西土長為藩輔誓以河山後裔縱有欒黶之汰猶當十世宥之然威略震主者身危功蓋天下者不賞自古如此非止于今卿家專制蜀漢積有歲年猜嫌既萌進退維谷代之而不受召之而不赴君臣之義已同路人譬之破桐之葉不可以復合騎虎之勢不可以中下矣此事流傳稔於朕聽每一思之未嘗不當饋歎息而卿猶偃然自安且卿自視翼贊之功孰與嶽飛飛之威名戰功暴于南北一旦見忌遂被叁夷之誅可不畏哉故智者順時而動明者因機而發與其負高世之勳見疑于人惴惴然常懼不得保其首領曷若順時因機轉禍為福建萬世不朽之業哉今趙擴昏孱受制強臣比年以來頓違誓約增屯軍馬招納叛亡朕以生靈之故未欲遽行討伐姑遣有司移文復因來使宣諭而乃不顧道理愈肆憑陵虔劉我邊陲攻剽我城邑是以忠臣扼腕義士痛心家與為讎人百其勇失道至此雖欲不亡得乎朕已分命虎臣臨江問罪長驅並騖飛渡有期此正豪傑分功之秋也卿以英偉之姿處危疑之地必能深識天命洞見事機若按兵閉境不為異同使我師併力巢穴而無西顧之虞則全蜀之地卿所素有當加封册一依皇統册構故事更能順流東下助為掎角則旌麾所指盡以相付天日在上朕不食言今送金寶一鈕至可領也綱次臨江被詔進至水洛訪得曦族人端署為水洛城巡檢使遣持詔間行諭曦曦得詔意動程松尚在興元未敢發詐稱杖殺端以蔽匿其事松兵既敗曦乃遣掌管機宜文字姚圓與端奉表送款綱遣前京兆府録事張仔會吳曦于興州之置口曦言歸心朝廷無他張仔請以告身為報曦盡出以付之仍獻階州朝廷以曦初附恃中國為援欲先取襄陽以為蜀漢屏蔽乃詔右副元帥匡先攻襄陽詔略曰陝西一面雖下四州吳曦之降朕所經略自大軍出境惟卿所部力戰為多方之前人無所愧謝今南伐之事責成卿等區區俘獲不足羡慕果能為國建功豈止一身榮寵後世子孫亦保富貴匡得詔乃移兵趨襄陽十二月曦遣果州團練使郭澄仙人關使任辛奉表及蜀地圖志吳氏譜牒來上七年正月召綱赴京師以為陝西宣撫副使進三階還軍吳曦遣郭澄進謝恩表誓表賀全蜀歸附三表親王百官稱賀朝廷以詔答之並賜誓詔郭澄朝辭諭澄曰汝主效順以全蜀歸附朕甚嘉之然立國日淺恐宋兵侵軼人心不安凡有當行事務已委宣撫完顏綱移文計議或有緊急即差人就去講究大定間汝主嘗以事入覲今亦多歲朕嘉汝主之義懷想不忘欲得其繪像如見其面今已遣使封册俟回日附進可以此意歸諭汝主詔以同知臨洮府事术虎高琪為封册使翰林直學士喬宇副之詔高琪曰卿以邊面宣力加之讀書蜀人識卿威名勿以財賄動心失大國體檢制隨去奉職勿有違枉生事頃之宋安丙殺吳曦上聞曦死遣使責綱詔曰曦之降自當進據仙人關以制蜀命且為曦重既不據關復撤兵使丙無所憚是宜有今日也於是詔贈曦太師命德順州刺史完顏思忠招魂葬于水洛縣以曦族兄端之子為曦後詔諭陝西軍士略曰汝等爰自去冬出疆用命擐披甲胄冒涉艱險直取山外數州比之他軍實有勤效界外屯駐日久負勞苦恩賞未行有司申奏不明以致如此朕已令增給賞物以酬爾勞惟是餘賊未殄猶須經略眷我師徒久役未解深懷憫念寤寐弗忘汝等益思體國之忠奮敵愾之勇協心畢力建立功勳高爵厚祿朕所不吝宋人復陷階州西和州綱至鳳翔詔徹五州之兵退保要害五州之民願徙內地者厚撫集之以近侍局直長為四川安慰使蒲察貞撤黃牛戍宋安丙乘之連兵來襲遂陷散關鞏州鈐轄兀顏阿失死之詔奪綱官一階降兵部侍郎權宣撫副使遣戶部侍郎尼厖古懷忠按治綱以下將吏懷忠未至陝西綱貞遣兵潛自昆谷西山養馬澗入四面攻之復取散關斬宋將張統領于團練綱遣使奏捷詔書奬諭貞等釋不問八年宋獻韓托胄蘇師旦首詔以陝西關隘還之宋罷兵綱還京師是歲章宗崩衛紹王即位除陝西路按察使纍官尚書左丞至寧元年綱行省事于縉山徒單鎰使人謂綱曰高琪駐兵縉山甚得人心士皆思奮與其行省親往不若益兵為便綱不聽徒單鎰復使人止之曰高琪措畫已定彼之功即行省之功綱不從綱至縉山遂大敗胡沙虎斬關入中都遷衛紹王于衛邸命綱子安和作家書使親信人召綱綱至囚之憫忠寺明日押至市中使張霖卿數以失四川敗縉山之事殺之貞祐四年綱子權復州刺史安和上書訟父寃略曰先臣綱在章宗時招懷西羌青宜可等十八部族取宋五州吳曦以全蜀歸朝胡沙虎無故見殺奪其官爵詔下尚書省議謹按元年詔書云胡沙虎屢害良將正謂綱輩也乃追復尚書左丞弟定奴定奴與兄綱俱知名充護衛除平涼府判官纍官同知真定府從平章政事僕散揆伐宋加平南虎威將軍兵罷遷河南東路副統軍三遷武勝軍節度使入為右副點檢大安二年遷元帥右都監救西京改震武軍節度使元帥奧屯襄敗績定奴坐失期及不以軍敗實奏降河州防禦使遷鎮西軍節度使河東北路按察轉運使宣宗即位改知歸德府貞祐二年改知河南府兼河南副統軍尋遷河南統軍使兼昌武軍節度使請內外五品以上舉能幹之士充河北州縣官改簽樞密院事殿前都點檢兼侍衛親軍都指揮使復為簽樞密院事行院事兼知歸德府事改兼武寧軍節度使行院于徐州召為刑部尚書參知政事興定三年薨贊曰章宗伐宋之役三易主帥兵家所忌也宋不知乘此以為功猶曰有人焉韓托胄心強智疏蘇師旦謀淺任大函首燕薊南北皆曰賊臣何哉完顏匡完顏綱皆泰和終功之臣然匡隳忠于大安綱罔難于至寧富貴之惑人乃如此邪
