body:
  text: 金史卷七十七列傳第十五宗弼本名兀朮亨本名孛迭張邦昌劉豫撻懶宗弼本名斡啜又作兀朮亦作斡出或作晃斡出太祖第四子也希尹獲遼護衛習泥烈問知遼帝獵鴛鴦濼都統杲出青嶺宗望宗弼率百騎與馬和尚逐越盧孛古野里斯等馳擊敗之宗弼矢盡遂奪遼兵士槍獨殺八入生獲五人遂審得遼主在鴛鴦濼畋獵尚未去可襲取者及宗望伐宋宗弼從軍取湯陰縣降其卒三千人至御河宋人已焚橋不得渡合魯索以七十騎涉之殺宋焚橋軍五百人宗望遣吳孝民先入汴諭宋人宗弼以三千騎薄汴城宋上皇出奔選百騎追之弗及獲馬三千而還宗望薨宗輔為右副元帥徇地淄青宗弼敗宋鄭宗孟數萬衆遂克青州復破賊將趙成于臨朐大破黃瓊軍遂取臨朐宗輔軍還遇敵三萬衆于河上宗弼擊敗之殺萬餘人詔伐宋康王宗輔發河北宗弼攻開德府糧乏轉攻濮州前鋒烏林答泰欲破王善二十萬衆遂克濮州降旁近五縣攻開德府宗弼以其軍先登奮擊破之攻大名府宗弼軍復先登破其城河北平宋主自揚州奔于江南宗弼等分道伐之進兵歸德城中有自西門北門出者當海復敗之乃絶隍築道列炮隍上將攻之城中人懼遂降先遣阿里蒲盧渾至壽春宗弼軍繼之宋安撫使馬世元率官屬出降進降廬州再降巢縣王善軍當海等破酈瓊萬餘衆于和州遂自和州渡江將至江寧西二十里宋杜充率步騎六萬來拒戰鶻盧補當海迪虎大合擊破之宋陳邦光以江寧府降留長安奴斡里也守江寧使阿魯補斡里也別將兵徇地下太平州濠州及句容溧陽等縣泝江而西屢敗張永等兵杜充遂降宗弼自江寧取廣德軍路追襲宋主于越州至湖州取之先使阿里蒲盧渾趨杭州具舟于錢塘江宗弼至杭州官守巨室皆逃去遂攻杭州取之宋主聞杭州不守遂自越奔明州宗弼留杭州使阿里蒲盧渾以精兵四千襲之訛魯補朮列速降越州大破宋周汪軍阿里蒲魯渾破宋兵三千遂渡曹娥江去明州二十五里大破宋兵追至其城下城中出兵戰失利宋主走入于海宗弼中分麾下兵會攻明州克之阿里蒲盧渾泛海至昌國縣執宋明州守趙伯諤伯諤言宋主奔溫州將自溫州趨福州矣遂行海追三百餘里不及阿里蒲盧渾乃還宗弼還自杭州遂取秀州赤盞暉敗宋軍于平江遂取平江阿里率兵先趨鎮江宋韓世忠以舟師扼江口宗弼舟小契丹漢軍沒者二百餘人遂自鎮江泝流西上世忠襲之奪世忠大舟十艘於是宗弼循南岸世忠循北岸且戰且行世忠艨艟大艦數倍宗弼軍出宗弼軍前後數里擊柝之聲自夜達旦世忠以輕舟來挑戰一日數接將至黃天蕩宗弼乃因老鸛河故道開三十里通秦淮一日一夜而成宗弼乃得至江寧撻懶使移剌古自天長趨江寧援宗弼烏林答泰欲亦以兵來會連敗宋兵宗弼發江寧將渡江而北宗弼軍渡自東移剌古渡自西與世忠戰于江渡世忠分舟師絶江流上下將左右掩擊之世忠舟皆張五緉宗弼選善射者乘輕舟以火箭射世忠舟上五緉五緉著火箭皆自焚煙焰滿江世忠不能軍追北七十里舟軍殲焉世忠僅能自免宗弼渡江北還遂從宗輔定陝西興張浚戰于富平宗弼陷重圍中韓常流矢中目怒拔去其矢血淋漓以土塞創躍馬奮呼搏戰遂解圍與宗弼俱出既敗張浚軍于富平遂與阿盧補招降熙河涇原兩路及攻吳玠于和尚原抵險不可進乃退軍伏兵起且戰且走行三十里將至平地宋軍陳于出口宗弼大敗將士多戰沒明年復攻和尚原克之天會十五年為右副元帥封瀋王天眷元年撻懶宗磐執議以河南之地割賜宋詔遣張通古等奉使江南明年宋主遣端明殿學士韓肖胄奉表謝遣王倫等乞歸父喪及母韋氏兄弟宗弼自軍中入朝進拜都元帥宗弼察撻懶與宋人交通賂遺遂以河南陝西與宋奏請誅撻懶復舊疆是時宗磐已誅撻懶在行臺復與鶻懶謀反會置行臺於燕京詔宗弼為太保領行臺尚書省都元帥如故往燕京誅撻懶撻懶自燕京南走將亡入于宋追至祁州殺之詔諸州郡軍旅之事決于帥府民訟錢穀行臺尚書省治之宗弼兼總其事遂議南伐太師宗幹以下皆曰構蒙再造之恩不思報德妄自鴟張祈求無厭今若不取後恐難圖上曰彼將謂我不能奄有河南之地且都元帥久在方面深究利害宜即舉兵討之遂命元帥府復河南疆土詔中外宗弼由黎陽趨汴右監軍撒離喝出河中趨陝西宋嶽飛韓世忠分據河南州郡要害復出兵涉河東駐嵐石保德之境以相牽制宗弼遣孔彥舟下汴鄭兩州王伯龍取陳州李成取洛陽自率衆取亳州及順昌府嵩汝等州相次皆下時暑宗弼還軍于汴嶽飛等軍皆退去河南平時天眷三年也上使使勞問宗弼以下將士凡有功軍士三千並加忠勇校尉攻嵐石保德皆克之宗弼入朝是時上幸燕京宗弼見於行在所居再旬宗弼還軍上起立酌酒飲之賜以甲胄弓矢及馬二匹宗弼已啓行四日召還至日希尹誅越五日宗弼還軍進伐淮南克廬州上幸燕京宗弼朝燕京乞取江南上從之制詔都元帥宗弼比還軍與宰臣同入奏事俄為尚書左丞相兼侍中太保都元帥領行臺如故詔以燕京路隸尚書省西京及山後諸部族隸元帥府乃還軍遂伐江南既渡淮以書責讓宋人宋人答書乞加寬宥宗弼令宋主遣信臣來禀議宋主乞先斂兵許弊邑拜表闕下宗弼以便宜約以畫淮水為界上遣護衛將軍撒改往軍中勞之皇統二年二月宗弼朝京師兼監修國史宋主遣端明殿學士何鑄等進誓表其表曰臣構言今來畫疆合以淮水中流為界西有唐鄧州割屬上國自鄧州西四十里並南四十里為界屬鄧州其四十里外並西南盡屬光化軍為弊邑沿邊州城既蒙恩造許備藩方世世子孫謹守臣節每年皇帝生辰並正旦遣使稱賀不絶歲貢銀絹二十五萬兩匹自壬戌年為首每春季差人般送至泗州交納有渝此盟明神是殛墜命亡氏踣其國家臣今既進誓表伏望上國蚤降誓詔庶使弊邑永有憑焉宗弼進拜太傅乃遣左宣徽使劉筈使宋以兗冕圭寶珮璲玉冊冊康王為宋帝其冊文曰皇帝若曰咨爾宋康王趙構不弔天降喪于爾邦亟瀆齊盟自貽顛覆俾爾越在江表用勤我師旅蓋十有八年于茲朕用震悼斯民其何罪今天其悔禍誕誘爾衷封奏狎至願身列于藩輔今遣光祿大夫左宣徽使劉筈等持節冊命爾為帝國號宋世服臣職永為屏翰嗚呼欽哉其恭聽朕命仍詔天下賜宗弼人口牛馬各千駝百羊萬仍每歲宋國進貢內給銀絹二千兩匹宗弼表乞致仕不許優詔答之賜以金券皇統七年為太師領三省事都元帥領行臺尚書省事如故皇統八年薨大定十五年諡忠烈十八年配享太宗廟廷子孛迭亨本名孛迭熙宗時封芮王為猛安加銀青光祿大夫天德初加特進海陵忌太宗諸子將謁太廟以亨為右衛將軍語在太宗諸王傳海陵賜良弓亨性直材勇絶人喜自負辭曰所賜弓弱不可用海陵遂忌之出為真定尹謂亨曰太宗諸子方強多在河朔山東真定據其衝要如其有變欲倚卿為重耳其實忌亨也歷中京東京留守家奴梁遵告亨與衛士符公弼謀反考驗無狀遵坐誅海陵益疑之改廣寧尹再任李老僧使伺察亨動靜且令構其罪狀亨初除廣寧諸公主宗婦往賀其母徒單氏太祖長女兀魯曰孛迭雖稍下遷勿以為嫌國家視京府一也況孛迭年富何患不貴顯乎是時兀魯與徒單斜也為室斜也妾忽撻得幸於徒單后忽撻詣后告兀魯語涉怨望且指斥又言孛迭當大貴海陵使蕭裕鞫之左驗皆不敢言遂殺兀魯而杖斜也免其官以兀魯怨望斜也不先奏聞故也乃封忽撻為莘國夫人久之亨家奴六斤頗黠給使總諸奴老僧謂六斤曰爾渤海大族不幸坐纍為奴寧不念為良乎六斤識其意六斤嘗與亨侍妾私通亨知之怒曰必殺此奴六斤聞之懼密與老僧謀告亨謀逆亨有良馬將因海陵生辰進之以謂生辰進馬者衆不能以良馬自異欲他日入見進之六斤言亨笑海陵不識馬不足進亨之奴有自京師來者具言徒單阿里出虎誅死亨曰彼有貸死誓券安得誅之奴曰必欲殺之誓券安足用哉亨曰然則將及我矣六斤即以為怨望遂誣亨欲因間刺海陵老僧即捕繫亨以聞工部尚書耶律安禮大理正忒里等鞫之亨言嘗論鐵券事實無反心而六斤亦自引伏與妾私通亨嘗言欲殺之狀安禮等還奏海陵怒復遣與老僧同鞫之與其家奴並加榜掠皆不伏老僧夜至亨囚所使人蹴其陰間殺之亨比至死不勝楚痛聲達於外海陵聞亨死佯為泣下遣人諭其母曰爾子所犯法當考掠不意飲水致死亨擊鞠為天下第一常獨當數人馬無良惡皆如意馬方馳輒投杖馬前側身附地取杖而去每畋獵持鐵連鎚擊狐兔一日與海陵同行道中遇羣豕亨曰吾能以鎚殺之即鎚遙擊中其腹穿入之終以勇力見忌焉正隆六夫海陵遣使殺諸宗室於是殺亨妃徒單氏次妃大氏及子羊蹄等三人大定初追復亨官爵封韓王十七年詔有司改葬亨及妻子贊曰宗弼蹙宋主于海島卒定畫淮之約熙宗舉河南陝西以與宋人矯而正之者宗弼也宗翰死宗磐宗雋撻懶湛溺富貴人人有自為之心宗幹獨立不能如之何時無宗弼金之國勢亦曰殆哉世宗嘗有言曰宗翰之後惟宗弼一人非虛言也張邦昌宋史有傳天會四年宗望軍圍汴宋少帝請割三鎮地及輸歲幣納質修好於是邦昌為宋太宰與肅王樞俱為質以來而少帝以書誘耶律余睹宗翰宗望復伐宋執二帝以歸劉彥宗乞復立趙氏太宗不許宋吏部尚書王時雍等請邦昌治國事天會五年三月立邦昌為大楚皇帝初少帝以康王構與邦昌為質既而肅王樞易之康王乃歸及宗望再舉兵少帝復使康王奉玉冊玉寶袞冕增上太宗尊號請和康王至磁州而宗望己自魏縣渡河圍汴矣及二帝出汴州從大軍北來而邦昌至汴康王入于歸德邦昌勸進于歸德康王已即位罪以隱事殺之邦昌死太宗聞之大怒詔元帥府伐宋宋主走揚州事具宗翰等傳其後太宗復立劉豫繼邦昌號大齊劉豫字彥游景州阜城人宋宣和末仕為河北西路提刑徙浙西抵儀真喪妻翟氏繼值父憂康王至揚州樞密使張賣心薦知濟南府是時山東盜賊滿野豫欲得江南一郡宰相不與忿忿而去撻懶攻濟南有關勝者濟南驍將也屢出城拒戰豫遂殺關勝出降遂為京東東西淮南安撫使知東平府兼諸路馬步軍都總管節制河外諸軍以豫子麟知濟南府撻懶屯兵衝要以鎮撫之初康王既殺張邦昌自歸德奔揚州詔左右副元帥合兵討之詔曰俟宋平當援立藩輔以鎮南服如張邦昌者及宋主自明州入海亡去宗弼北還乃議更立其人衆議折可求劉豫皆可立而豫亦有心撻懶為豫求封太宗用封張邦昌故事以九月朔旦授策受策之後以藩王禮見使者臣宗翰臣宗輔議既策為藩輔稱臣奉表朝廷報諭詔命避正位與使人抗禮餘禮並從帝者詔曰今立豫為子皇帝既為鄰國之君又為大朝之子其見大朝使介惟使者始見躬問起居與面辭有奏則立其餘並行皇帝禮天會八年九月戊申備禮冊命立豫為大齊皇帝都大名仍號北京置丞相以下官赦境內復自大名還居東平以東平為東京汴州為汴京降宋南京為歸德府降淮寧永昌順昌興仁府俱為州張孝純等為宰相弟益為北京留守母翟氏為皇太后妾錢氏為皇后錢氏宣和內人也以辛亥年為阜昌元年以其子麟為尚書左丞相諸路兵馬大總管宋人畏之待以敵國禮國書稱大齊皇帝豫宰相張孝純鄭億年李鄴家人皆在宋宋人加意撫之阜昌二年豫遷都于汴睿宗定陝西太宗以其地賜豫從張邦昌所受封略故也元帥府使蕭慶如汴與豫議以伐宋事豫報曰宋主軍帥韓世忠屯潤州劉光世屯江寧今舉大兵欲往采石渡江而劉光世拒守江寧若出宿州抵揚州則世忠必聚海船截瓜洲渡若輕兵直趨采石彼未有備我必徑渡江矣光世海船亦在潤州韓世忠必先取之二將由此必不和以此逼宋主其可以也未幾宋主閣門宣贊舍人徐文將大小船六十隻軍兵七百餘人來奔至密州界中率將佐至汴豫與元帥府書曰徐文一行久在海中盡知江南利害文言宋主在杭州其候潮門外錢塘江內有船二百隻宋主初走入海時於此上船過錢塘江別有河入越州向明州定海口迤邐前去昌國縣其縣在海中宋人聚船積糧之處今大軍可先往昌國縣攻取船糧還趨明州城下奪取宋主御船直抵錢塘江口今自密州上船如風勢順可五日夜到昌國縣或風勢稍慢十日或半月可至初宗弼自江南北還宗翰將入朝再議以伐宋事宗翰堅執以為可伐宗弼曰江南卑濕今士馬困憊糧儲未豐足恐無成功宗翰曰都監務偷安爾及豫以書報而睿宗亦不肯用豫策使撻懶帥師至瓜洲而還天會十四年制詔齊國與本朝軍民相訴關涉文移署年止用天會天會十五年詔廢齊國降封豫為蜀王豫稱大號凡八年於是置行臺尚書省於汴除去豫弊政人情大悅以故齊宰相張孝純權行臺左丞相遂遷豫家屬於臨潢府皇統元年賜豫錢一萬貫田五十頃牛五十頭二年進封曹王六年薨子麟麟字元瑞豫之子也宋宣和間父廕補將仕郎纍加承務郎天會七年豫以濟南降麟因從軍討水賊王江破降之豫節制東平以麟知濟南府事齊國建以濟南為興平軍麟為節度使開府儀同三司梁國公充諸路兵馬大總管判濟南府事明年為齊尚書左丞相明年從豫遷汴罷判濟南依前開府聽置參謀豫請立麟為太子朝廷不許曰若與我伐宋有功則立之於是麟連歲帥兵南伐皆無功而還及朝廷議廢齊報以南伐之期俾豫先遣兵駐淮上撻懶以軍廢豫止刁馬河麟從數百騎出迎撻懶諭麟止從騎南岸獨召麟渡河因執麟豫廢麟遷臨潢頃之授北京路都轉運使歷中京燕京路都轉運使參知政事尚書左丞復為興平軍節度使上京路轉運使開府儀同三司封韓國公薨年六十四正隆間降二品以上官封改贈特進息國公昌本名撻懶穆宗子宗翰襲遼主于鴛鴦濼遼都統馬哥奔搗里撻懶收其羣牧宗翰使撻懶追擊之不及獲遼樞密使得里底及其子磨哥那野以還太祖自將襲遼主于大魚濼留輜重于草濼使撻懶牙卯守之奚路兵官渾黜不能安輯其衆遂以撻懶為奚六路軍帥鎮之習古乃婆盧火護送常勝軍及燕京豪族工匠自松亭關入內地上戒之曰若遇險厄則分兵以往習古乃婆盧火乃合於撻懶久之討劾山速古部奚人奚人據險戰殺且盡速古啜里鐵尼十三巖皆平之詔曰朕以奚路險阻經略為難命汝往任其事而克副所託良用嘉歎今回離保部族來附餘衆奔潰無能為已比命習古乃婆盧火獲送降人若遇險阻即分兵以行餘衆悉與汝合降詔二十招諭未降汝當審度其事從宜處之其後撫定奚部及分南路邊界表請設官鎮守上曰依東京渤海列置千戶謀克遼外戚遙輦昭古牙部族在建州斜野襲走之獲其妻孥及官豪之族撻懶復擊之擒其隊將曷魯燥白撒葛殺之降民戶千餘進降金源縣詔增賜銀牌十又降遙輦二部再破興中兵降建州官屬得山寨二十村堡五百八十阿忽復敗昭古牙降其官民尤多昭古牙勢蹙亦降興中建州皆平詔第將士功賞撫安新民撻懶請以遙輦九營為九猛安上以奪鄰有功使領四猛安昭古牙仍為親管猛安五猛安之都帥命撻懶擇人授之撻懶與劉彥宗舉蕭公翊為興中尹郡府各以契丹漢官攝治上皆從之及宗翰宗望伐宋撻懶為六部路都統宗望已受宋盟軍還撻懶乃歸中京天會四年八月復伐宋閏月宗翰宗望軍皆至汴州撻懶阿里刮破宋兵二萬於嵵覆其三營獲京東路都總管胡直孺及其二子與南路都統制隋師元及其三將遂克拱州降寧陵破睢陽下亳州宋兵來復睢陽又擊走之擒其將石瑱宋二帝已降大軍北還撻懶為元帥左監軍徇地山東取密州迪虎取單州撻懶取巨鹿阿里刮取宗城迪古不取清平臨清蒙刮取趙州阿里刮徇下濬滑恩及高唐分遣諸將趣磁信德皆降之劉豫以濟南府降詔以豫為安撫使治東平撻懶以左監軍鎮撫之大事專決焉後為右副元帥天會十五年為左副元帥封魯國王初宋人既誅張邦昌太宗詔諸將復求如邦昌者立之或舉折可求撻懶力舉劉豫豫立為帝號大齊豫為帝數年無尺寸功遂廢豫為蜀王撻懶與右副元帥宗弼俱在河南宋使王倫求河南陝西地于撻懶明年撻懶朝京師倡議以廢齊舊地與宋熙宗命羣臣議會東京留守宗雋來朝與撻懶合力宗幹等爭之不能得宗雋曰我以地與宋宋必德我宗憲折之曰我俘宋人父兄怨非一日若復資以土地是助讎也何德之有勿與便撻懶弟勗亦以為不可既退撻懶責勗曰他人尚有從我者汝乃異議乎勗曰苟利國家豈敢私邪是時太宗長子宗磐為宰相位在宗幹上撻懶宗雋附之竟執議以河南陝西地與宋張通古為詔諭江南使久之宗磐跋扈尤甚宗雋亦為丞相撻懶持兵柄謀反有狀宗磐宗雋皆伏誅詔以撻懶屬尊有大功因釋不問出為行臺尚書左丞相手詔慰遣撻懶至燕京愈驕肆不法復與翼王鶻懶謀反而朝議漸知其初與宋交通而倡議割河南陝西之地宗弼請復取河南陝西會有上變告撻懶者熙宗乃下詔誅之撻懶自燕京南走追而殺之于祁州並殺翼王及宗人活離胡土撻懶二子斡帶烏達補而赦其黨與宗弼為都元帥再定河南陝西伐宋渡淮宋康王乞和遂稱臣畫淮為界乃罷兵贊曰君臣之位如冠屨定分不可頃刻易也五季亂極綱常斁壞遼之太宗慢褻神器倒置冠屨援立石晉以臣易君宇宙以來之一大變也金人效尤而張邦昌劉豫之事出焉邦昌雖非本心以死辭之孰曰不可豫乘時徼利金人欲倚以為功豈有是理哉撻懶初薦劉豫後以陝西河南歸宋視猶儻來初無固志以處此也積其輕躁終陷逆圖事敗南奔適足以實通宋之事爾哀哉
