body:
  text: 金史卷九十列傳第二十八趙元移剌道本名按高德基馬諷完顏兀不喝劉徽柔賈少冲子益移剌斡里𩽆阿勒根彥忠張九思高衎楊邦基丁暐仁趙元字善長涿州范陽人遼天慶八年登進士第仕至尚書金部員外郎遼亡郭藥師為宋守燕以元掌機宜文字王師取燕藥師降樞密使劉彥宗辟元為本院令史天會間同知薊州事有賊殺人橫道官吏圜視莫知所為路人耕夫聚觀甚衆元指田中釋耒而來者曰此賊也叱左右縛之遂伏僚吏問其故元曰偶得於眉睫間耳其後朝廷立磨勘格凡嘗仕宣和者皆除名籍元在磨勘中齊國廢置行臺省于選名士十餘人備官屬元在選中授行兵部郎中行臺徙大名再徙祁州及宗弼再取河南元皆攝戶部事賦調兵食取辦天眷三年為行臺右司員外郎囚有殺人當死者行臺欲宥之元不從反覆數四勢不可奪乃仰天嘆曰如殺人者可宥死者復何辜何欲徼己福而亂天下法乎行臺竟不能奪改左司員外郎攝吏部事在行臺凡十年吏事明敏宗弼深知之行臺或有事上相府宗弼必問曾經趙元未也其見重如此為同簽汴京留守事改同知大名尹用廉遷河北西路轉運使歷彰德武勝等軍節度使以老致仕卒于家移剌道本名按宗室移剌古為山東東路兵馬都總管辟掌軍府簿書往來元帥府計議邊事右副元帥宗弼愛其才召為元帥府令史補尚書省令史特除監察御史再遷大理丞兼工部員外郎海陵南伐使督運芻糧所在盜起道路梗止𣥖間關僅至淮南上謁承問具言四方盜賊狀海陵惡聞其言杖之七十使督戰艦渡江會海陵死軍還大定二年除工部郎中奉詔招撫諸奚是時抹白猛安下謀克徐列等皆欲降制於猛安合住不敢即降道發兵掩襲合住子婦孫男女甥及謀克留住及蒲輦白撒妻孥是日適窩斡遣白撒發抹白猛安軍白撒聞其家人被獲遂來降改禮部郎中從討窩斡佩金牌與應奉翰林文字訛里也招降叛奚奉使河南勸課農桑密訪吏治得失纍遷御史中丞同修國史廉問職官殿最還奏上曰職官貪汙罪廢其餘因循以苟歲月今廉能即與升除無以慰百姓愛留之意可就遷秩秩滿升除於是廉能官景州刺史耶律補進一階單州刺史石抹靳家奴泰寧軍節度副使尹升卿寧陵縣令監邦彥濬州司候張匡福各進兩階貪汙官同知濬州防禦使事蒲速越真定縣令特謀葛並免死杖一百五十除名同知睢州事烏古孫阿里補杖一百削四階非奉旨不得録用於是道改同知大興尹事詔曰京師士民輻湊犯法者衆罪狀自實毋為文所持斷之以公可也朕嘗諭執政矣必不以小苛譴卿勉副朕意遷刑部尚書尚局使宗夔副使石抹青狗私用官芻事覺尚局隸點檢司刑部當自問點檢烏林答天錫屬刑部使輕其罪刑部以付大興府鞫治於是道及天錫郎中丁暐仁皆坐解職尋起為大理卿兼簽書樞密院事再遷西京留守卒高德基字元履遼陽渤海人皇統二年登進士第六年為尚書省令史海陵為相專愎自用人莫敢拂其意德基每與之詳辨及篡位命左司郎中賈昌祚諭旨曰卿公直果敢今委卿南京行省勾當未行會海陵欲都燕京命德基攝燕京行臺省都事改攝右司員外郎除戶部員外郎改中都路都轉運副使遷戶部郎中正隆三年詔左丞相張浩參知政事敬嗣暉營建南京宮室明年德基與御史中丞李籌刑部侍郎蕭中一俱為營造提點海陵使中使謂德基等曰汝等欲乘傳往邪欲乘己馬往邪銀牌可於南京尚書省取之籌乞先降銀牌復遣中使謂籌曰牌之與否當出朕意爾敢輒言豈以三人中官獨高邪遂杖之三十遣乘己馬往德基中一乘傳往轉同知開封尹大定三年以察廉治狀不善下遷同知北京路都轉運使事是年秋土河泛濫水入京城德基遽命開長樂門疏分使入御溝以殺其勢水不能為害遷刑部侍郎七年改中都路都轉運使九年轉刑部尚書有犯罪當死者宰相欲從末減德基曰法無二門失出猶失入也不從及奏上曰刑部議是也因召諸尚書諭之曰自朕即位以來以政事與宰相爭是非者德基一人而已自今部上省三議不合即具以聞為宋主生日使及還宋人禮物外附進臘茶三千胯不親封署德基曰姪獻叔而不署是無名之物也却之十一年改戶部尚書德基上疏乞免軍須房稅等錢減農稅及鹽酒等課未報隨朝官俸粟折錢增高市價與之多出官錢幾四十萬貫上使人諭之曰卿為尚書取悅宰執近臣濫出官錢卿之官爵一出於朕奈何如此於是決杖八十戶部郎中王佐員外郎盧彥冲同知中都轉運使劉兟副使石抹長壽支度判官韓鎮左警巡使李克勤右警巡使李寶判官強鋭昌姚宗奭尼厖古達吉不皆決杖有差詔自大定十一年十一月郊祀赦後尚書省御史臺戶部轉運司警巡院多支俸粟折錢皆追還之德基降蘭州刺史王佐降大興府推官盧彥冲河北西路戶籍判官劉兟東京警巡使石抹長壽東京留守推官韓鎮河東南路戶籍判官李克勤通遠縣令李寶清水縣令強鋭昌姚宗奭尼厖古達吉不皆除司候大定十二年德基卒年五十四子錫馬諷字良弼大興漷陰人國初以燕與宋諷游學汴梁登宣和六年進士第宗翰克汴京諷歸朝復登進士第調蔚州廣靈丞遷雄州歸信令境有河曰八尺口每秋潦漲溢害民田諷視地高下疏決之其患遂息召為尚書省令史除獻州刺史天德初改寧州民有告謀不軌者株連數十百人諷察其無狀乃究問告者告者具伏其誣衆歡呼感泣再遷南京副留守入為大理少卿是時高楨為御史大夫素貴重繩治無所避權貴憚其威嚴乃以諷及張忠輔為中丞欲有以中傷之者諷忠輔皆文吏巧法不能與楨絲髮相假借楨畏其害己因訴于海陵海陵以楨太祖舊臣每慰安之諷改大理卿歲餘出為順天軍節度使大定二年復為大理卿遷刑部尚書改忠順軍節度使致仕卒完顏兀不喝會寧府海姑寨人年十三選充女直字學生補上京女直吏再習小字兼通契丹文字充尚書省令史天德初除吏部主事鞫問押懶路詐襲謀克事人稱其能擢右拾遺海陵謂之曰始聞汝名試以吏部主事今計其實優於所聞遠矣纍遷右司郎中從海陵伐宋至淮南聞世宗即位于遼陽兀不喝入白其事海陵沈思良久曰卿等始聞之邪我已知之遣人往矣此大事勿泄于外大定二年秩滿當代世宗嘉其善敷奏特詔再任謂宰臣曰兀不喝為人公忠後來有如斯人者卿等宜薦舉之其見知如此窩斡已平詔罷契丹猛安謀克其元管戶口及從窩斡作亂來降者皆隸女直猛安謀克遣兀不喝於猛安謀克人戶少處分置未經罷去猛安謀克合承襲者仍許承襲賑贍其貧乏者仍括買契丹馬匹官員年老之馬不在括限頃之世宗以諸契丹未嘗為亂者與來降者一概隸女直猛安中非是未嘗從亂可且仍舊平章政事完顏元宜奏已遷契丹所棄地可遷女直人與不從亂契丹雜處上以問右丞蘇保衡參政石琚皆不能對上責之曰卿等每事先熟議然後奏有問即對豈容不知此保衡琚頓首謝上曰分隸契丹以本猛安租稅給贍之所棄地與附近女直人及餘戶願居者聽其猛安謀克官選契丹官員不預亂者充之改同知大興尹遷橫海軍節度使初到官讞囚能得其情人以為不寃五年卒官劉徽柔字君美大興安次人天眷二年擢進士第初為真定欒城主簿轉開遠軍節度掌書記遷洪洞令徽柔明敏善聽斷縣人楊遠者投牒于縣以為夜雨屋壞壓其姪死號訴哀切徽柔熟視而笑曰汝利姪財而殺之乃誣雨耶叱付獄其人立伏曰公神明也不敢延死遂置于法秩滿縣人遮戀不得去者彌日為立生祠刻石頌德正隆二年入為大理評事遷司直大定二年同知河東南路轉運使事以廉第一改知平定軍入為大理少卿七年知磁州改同知南京留守事十年遷中都路轉運使卒官賈少冲字若虛通州人勤學日誦數百千言家貧甚嘗道中獲遺金訪其主歸之天會中再伐宋調及民兵少冲甫冠代其叔行雖行伍間未嘗釋卷中天眷二年進士劉筈欲以妹妻之少冲辭不就曰富貴當自致之調營州軍事判官遷定安令蔚州刺史恃貴不法屬吏畏之每事輒曲從其意少冲守正不阿用廉進官一階再遷吏部主事定武軍節度副使河中府判官海陵寖以失道少冲謂所親曰天下且亂不可仕也秩滿乃不求仕大定二年調御史臺典事纍遷刑部郎中往北京決獄奏誅首惡誤牽連其中者皆釋不問全活凡千人以本職攝右司員外郎嘗執奏刑名甚堅既退上謂侍臣曰少冲居下位有守如此除同知河間尹數月入為祕書少監兼起居注左補闕少冲外柔內剛每從容進諫世宗稱美之十四年為宋主生日副使宋國方有祈請上以意諭少冲少冲對曰臣有死無辱宋人別致珍異少冲笑謂其人曰行人受賜自有常數寧敢以賂辱君命乎遂不受使還世宗嘉之遷右諫議大夫祕書起居注如故十七年請老除衛州防禦使遷河東南路轉運使召為太常卿兼祕書少監復請致仕不許改順天軍節度使卒少冲性夷簡不喜言利嘗教諸子曰蔭所以庇身管庫不可為也聞者尚之子益益字損之少穎悟如成人大定十四年父少冲為祕書少監充宋主生日副使益侍行是時宋人常爭起立接受國書之禮少冲問益曰即宋人欲變禮持議不決奈何益曰守死無辱可謂使矣少冲大奇之中大定十九年進士調河津主簿丁父憂去官察廉起復礬山令補尚書省令史丁母憂服闋除定海軍節度副使監察御史治書侍御史轉侍御史知登聞鼓院兼少府少監未幾改禮部郎中兼知登聞鼓院看讀陳言文字遷左司郎中改吏部侍郎兼蔡王傅以病免除鄭州防禦使陝西東路轉運使順天軍節度使大安初召為吏部尚書有疾改安國軍節度使益調民夫修完城郭為戰守備按察司止之不聽曰治城守臣事也按察何預既而兵至以有備解去改橫海定國軍節度使道阻不赴宣宗初為吏部尚書益為侍郎相得歡甚貞祐二年至汴京訪益所在召為太常卿上防秋十三事與戶部尚書李革論遷河北軍民不便不報貞祐三年致仕元光元年卒移剌斡里𩽆一名八斤系出遼五院司通契丹字天會三年伐宋隸軍中遇戰輒先登屢獲偵人有司上其功補尚書省令史十五年籍發諸部兵於山後將與右丞蕭慶會時官軍竄而南者凡數千斡里𩽆以兵邀擊之盡獲其輜重財物悉送有司而去一毫弗取以勞遷修武校尉宗弼復河南斡里𩽆督諸路帥臣進討事定以勞遷宣武將軍時六部未分乃以為兵刑二部主事未幾遷右司都事皇統二年授大理正歷同知昭德軍節度使事以廉升孟州防禦使正隆間轉同知北京留守事會遊古河闌子山等猛安契丹謀亂時方發兵討之別遣斡里𩽆押軍南下至松山縣為賊黨江哥所執且欲推為主盟要以契約斡里𩽆怒曰我受國厚恩豈能從汝反耶寧殺我契約不可得也賊知不可屈乃困辱之使布衣草履逐馬而行且欲害之斡里𩽆說其監奴因得脫還六年九月改北京路轉運使大定初為博州防禦使再遷利涉軍節度使先是有農民避賊入保郡城以錢三十千寄之鄰家賊平索之鄰人諱不與訴于縣縣官以無契驗却之乃訴于州斡里𩽆陽怒械繫之捕其鄰人關以三木詰之曰汝鄰乙坐劫殺人指汝同盜鄰人大懼始自陳有欺錢之隙乃責歸所隱錢而釋之郡人駭服改通遠軍節度使卒阿勒根彥忠本名窊合山曷速館人也好學通吏事天會十四年選充尚書兵部孔目官升尚書省令史除右司都事七年改大理丞為會寧少尹進同知會寧府事入為尚書吏禮部郎中貞元二年進本部侍郎海陵庶人凡有所疑常使彥忠裁決彥忠據法以對間有不合則召讓之彥忠執奏如前終無阿屈同列咸為懼彥忠固執不變海陵壯之明年除御史中丞歷尚書戶部侍郎侍衛親軍副都指揮使海陵南伐除南京路都轉運使大定二年改大名尹兼本路兵馬都總管四年入為刑部尚書詔規措北邊艱食戶口及泰州臨潢接境度宜安置堡戍七十駐兵萬三千芻糧之用就經畫之還朝未及入對以疾卒年五十三彥忠性孝友嘗使宋所得金帛盡分兄弟親友贈榮祿大夫命有司致祭並以銀絹賜其家張九思字全行錦州人皇統初補行臺省女直譯史除同知易州事三遷亳州防禦使歸德尹劉仲延受宋國歲貢於泗州九思副之往歲受歲貢者每以幣物不精責宋使者宋使者私饋銀幣各直數百千以為常九思獨不肯受仲延從之自是私饋遂絶自大理評事再遷大理少卿清池令雙申自陳父虔天眷初知永安軍遇叛寇孟邦傑執而脅之不從遂被害乞正班用廕大理寺議虔子止合雜班敘九思曰虔奮不顧身守節以死其子正班用廕以勸忠孝世宗從九思議改工部郎中大興少尹同知中都都轉運使事轉刑部侍郎改工部九思所守清約然急於進取一切以功利為務率意任情不恤百姓詔檢括官田凡地名疑似者如皇后店太子莊燕樂城之類不問民田契驗一切籍之復有鄰接官地冒占幸免者世宗聞其如是召還戒之曰如遼時支撥地土及國初元帥府拘刷民間指射租田近歲冒為己業此類當拘籍之其餘民田一旦奪之則百姓失業朕意豈如此也轉御史中丞九思言屯田猛安人為盜徵償家貧輒賣所種屯地凡家貧不能徵償者止令事主以其地招佃收其租入估賈與徵償相當即以其地還之臨洮尹完顏讓亦論屯田貧人徵償賣田乞用九思議詔從之遷工部尚書年高愈自用上謂左丞張汝弼曰九思耄矣頗執強自用欲令外補何如於是九思男若拙為尚書省令史冒填詔敕事覺亡命汝弼因奏其事上曰九思豈不知若拙處邪可免其官捕若拙獲日授職九思聞命惶懼因感疾卒高衎字穆仲遼陽渤海人敏而好學自少有能賦聲同舍生欲試其才使一日賦十題戲之衎執筆怡然未暮十賦皆就彬彬然有可觀年二十六登進士第乞歸養逾二年方調漷陰丞召為尚書省令史除右司都事母喪去官起復吏部員外郎攝左司員外郎王彥潛常大榮李慶之皆在吏部選中吏部擬彥潛大榮皆進士第一次當在慶之上彥潛洺州防禦判官大榮臨海軍節度判官慶之瀋州觀察判官左司郎中賈昌祚挾私欲與慶之洺州詭曰洺雖佳郡防禦幕官在節鎮下乃改擬彥潛臨海軍大榮瀋州慶之洺州慶之初赴選昌祚以慶之為會試詮讀官而慶之弟慶雲為尚書省令史多與權貴游海陵心惡之嘗謂左右司昌祚必與慶之善闕大奉國臣者遼陽人永寧太后族人先為東京警巡院使以贓免去欲因太后求見海陵不許衎與奉國臣有鄉里舊擬為貴德縣令海陵大怒於是昌祚衎吏部侍郎馮仲等各杖之有差慶雲決杖一百五十罷去未幾仲昌祚慶雲皆死衎降為清水縣主簿兵部員外郎攝吏部主事楊邦基降宜君縣主簿吏部主事宋同降漷陰縣主簿尚書省知除楊伯傑降閭陽縣主簿居二年為大理司直遷戶部員外郎同知中都都轉運使太常少卿吏部郎中大定初轉左司郎中世宗孜孜求諫羣臣承順旨意無所匡正上曰朕初即位庶政多未諳悉實賴將相大臣同心輔佐百姓且上書言事或有所補夫聽斷獄訟簿書期會何人不能如唐虞之聖猶曰稽于衆舍己從人正隆專任獨見不謀臣下以取敗亂卿等其體朕意使衎傳詔臺省百司曰凡上書言事或為有司沮遏許進表以聞遷吏部尚書每季選人至吏部託以檢閲舊籍謂之檢卷有滯留至後季猶不得去者衎三為吏部知其弊歲餘銓事修理選人便之五年為賀宋國生日使中道得疾去職大定七年卒楊邦基字德懋華陰人父綯宋末為易州州佐宗望伐宋蔡靖以燕山降易州即日來附綯被殺邦基年十餘歲匿僧舍中得免既長好學天眷二年登進士第調灤州軍事判官遷太原交城令太原尹徒單恭貪汙不法託名鑄金佛命屬縣輸金邦基獨不與徒單恭怒召至府將以手持鐵拄杖撞邦基面邦基不動秉德廉察官吏尹與九縣令皆免去邦基以廉為河東第一召為禮部主事以兵部員外郎攝吏部差除坐銓注李慶之大奉國臣與高衎等皆貶官邦基降坊州宜君簿轉高密令大定初尚書省擬邦基刑部郎中世宗曰縣官即除郎中如何太師張浩對曰邦基前為兵部員外郎矣且其人材可用上許之改太府少監知登聞檢院為祕書少監遷翰林直學士再遷祕書監兼左諫議大夫修起居注中都警巡使張子衍與邦基姻家子衍道中遇皇太子衛仗立馬市門不去傘衛士訶之子衍以鞭鞭衛士訶己者御史臺劾奏子衍邦基見臺官為子衍求解及入見顯宗求脫子衍罪詔削子衍官兩階邦基坐削官一階出為同知西京留守事徙山東東路轉運使永定軍節度使致仕大定二十一年卒邦基能屬文善畫山水人物尤以畫名當世云丁暐仁字藏用大興府宛平人曾祖奭祖惟壽父筠以吏補州縣所至有治聲其後致仕杜門不出鄉里有鬬訟者不之官而就筠質焉暐仁沖淡寡欲讀書之外無他好遼季避難雖間關道塗未嘗釋卷皇統二年登進士第調武清縣丞縣經兵革後無學校暐仁召邑中俊秀子弟教之學百姓欣然從之調磁州軍事判官是時詔使廉察官吏暐仁以廉攝守事遷和川令前令罷耎不事事羣小越法干禁無所憚暐仁申明法禁皆屏息或走入他縣以避之有董祐者最強悍畏服暐仁以刀斷指誓終身不復犯法凡租賦與百姓前為期率比他邑先辦歷北京推官再遷大理司直以憂去官尋起復大定三年除定武軍節度副使而節度使同知皆闕暐仁為政無留訟改大理丞吏部員外郎轉戶部郎中於是賈少冲為刑部郎中上謂左丞相紇石烈良弼曰少冲為人柔緩不稱刑部之職其議易之乃以暐仁為刑部郎中坐尚局官私用官芻違格付大興府鞫問解職改祁州刺史祁州為定武支郡士民聞暐仁之官相率歡迎界上相屬不絶改同知西京留守事首興學校以明養士之法遷陝西西路轉運使大定二十一年卒官贊曰吏之興其秦之季邪吏有選試其遼金之際邪其文從一從史守法不二之謂邪守法不二斯真吏矣巧者舞文以亂法窒者執一而弗通此皆吏道之自失者也高衎高德基張九思之徒皆詭法以自失者矣
