body:
  text: 金史卷五十志第三十一食貨五榷場和糴常平倉水田區田入粟鬻度牒榷場與敵國互市之所也皆設場官嚴厲禁廣屋宇以通二國之貨歲之所獲亦大有助於經用焉熙宗皇統二年五月許宋人之請遂各置於兩界九月命壽州鄧州鳳翔府等處皆置海陵正隆四年正月罷鳳翔府唐鄧潁蔡鞏洮等州並膠西縣所置者而專置于泗州尋伐宋亦罷之五年八月命榷場起赴南京國初於西北招討司之燕子城北羊城之間嘗置之以易北方牧畜世宗大定三年市馬於夏國之榷場四年以尚書省奏復置泗壽蔡唐鄧潁密鳳翔秦鞏洮諸場七年禁秦州場不得賣米麵及羊豕之臘並可作軍器之物入外界十七年二月上謂宰臣曰宋人喜生事背盟或與大石交通恐枉害生靈不可不備其陝西沿邊榷場可止留一處餘悉罷之令所司嚴察姦細前此以防姦細罷西界蘭州保安綏德三榷場二十一年正月夏國王李仁孝上表乞復置以保安蘭州無所産而且稅少惟於綏德為要地可復設互市命省臣議之宰臣以陝西鄰西夏邊民私越境盜竊緣有榷場故姦人得往來擬東勝可依舊設陝西者並罷之上曰東勝與陝西道路隔絶貿易不通其令環州置一場尋於綏德州復置一場十二月禁壽州榷場受分例分例者商人贄見場官之錢幣也章宗明昌二年七月尚書省以泗州榷場自前關防不嚴遂奏定從大定五年制官為增修舍屋倍設闌禁委場官及提控所拘榷以提刑司舉察惟東勝淨慶州來遠軍者仍舊餘皆修完之泗州場大定間歲獲五萬三千四百六十七貫承安元年增為十萬七千八百九十三貫六百五十三文所須雜物泗州場歲供進新茶千胯荔支五百斤圓眼五百斤金橘六千斤橄欖五百斤芭焦乾三百箇蘇木千斤溫柑七千箇橘子八千箇沙糖三百斤生薑六百斤梔子九十稱犀象丹砂之類不與焉宋亦歲得課四萬三千貫秦州西子城場大定間歲獲三萬三千六百五十六貫承安元年歲獲十二萬二千九十九貫承安二年復置於保安蘭州三年九月行樞密院奏斜出等告開榷場擬於轄里尼要安置許自今年十一月貿易尋定制隨路榷場若以見錢入外界與外人交易者徒五年三斤以上死宋界諸場以伐宋皆罷泰和八年八月以與宋和宋人請如舊置之遂復置於唐鄧壽泗息州及秦鳳之地宣宗貞祐元年秦州榷場為宋人所焚二年陝西安撫副使烏古論兗州復開設之歲所獲以十數萬計三年七月議欲聽榷場互市用銀而計數稅之上曰如此是公使銀入外界也平章盡忠權參知政事德升曰賞賜之用莫如銀絹而府庫不足以給之互市雖有禁而私易者自如若稅之則斂不及民而用可足平章高琪曰小人敢犯法不行爾況許之乎今軍未息而産銀之地皆在外界不禁則公私指日罄矣上曰當熟計之興定元年集賢咨議官呂鑑言嘗監息州榷場每場獲布數千匹銀數百兩兵興之後皆失之金銀之稅世宗大定五年聽人射買寶山縣銀冶九年御史臺奏河南府以和買金銀抑配百姓且下其直上曰初朕欲泉貨流通故令行豈可反害民乎遂罷之十二年詔金銀坑冶恣民採毋收稅二十七年尚書省奏聽民於農隙採銀承納官課明昌二年天下見在金千二百餘鋌銀五十五萬二千餘鋌三年以提刑司言封諸處銀冶禁民採煉五年以御史臺奏請令民採煉隨處金銀銅冶上命尚書省議之宰臣議謂國家承平日久戶口增息雖嘗禁之而貧人苟求生計聚衆私煉上有禁之之名而無杜絶之實故官無利而民多犯法如令民射買則貧民壯者為夫匠老稚供雜役各得均齊而射買之家亦有餘利如此則可以久行比之官役顧工糜費百端者有間矣遂定制有冶之地委謀克縣令籍數召募射買禁權要官吏弓兵里胥皆不得與如舊場之例令州府長官一員提控提刑司訪察而禁治之上曰此終非長策參知政事胥持國曰今姑聽如此後有利然後設官可也譬之酒酤蓋先為坊場而後官榷也上亦以為然遂從之墳山西銀山之銀窟凡百一十有三和糴熙宗皇統二年十月燕西東京河東河北山東汴京等路秋熟命有司增價和糴世宗大定二年以正隆之後倉廩久匱遣太子少師完顏守道等山東東西路收糴軍糧除戶口歲食外盡令納官給其直三年謂宰臣曰國家經費甚大向令山東和糴止得四十五萬餘石未足為備自古有水旱所以無患者由蓄積多也山東軍屯處須急為二年之儲若遇水旱則用賑濟自餘宿兵之郡亦須糴以足之京師之用甚大所須之儲其敕戶部宜急為計五年責宰臣曰朕謂積貯為國本當修倉廩以廣和糴今聞外路官文具而已卿等不留心甚不稱委任之意六年八月敕有司秋成之後可於諸路廣糴以備水旱九年正月諭宰臣曰朕觀宋人虛誕恐不能久遵誓約其令將臣謹飭邊備以戒不虞去歲河南豐宜令所在廣糴以實倉廩詔州縣和糴毋得抑配百姓十二年十二月詔在都和糴以實倉廩且使錢幣通流又詔凡秋熟之郡廣糴以備水旱十六年五月諭左丞相紇石烈良弼曰西邊自來不備儲蓄其令所在和糴以備緩急十七年春尚書省奏先奉詔賑濟東京等路飢民三路粟數不能給上曰朕嘗諭卿等豐年廣糴以備凶歉卿等皆言天下倉廩盈溢今欲賑濟乃云不給自古帝王皆以蓄積為國長計朕之積粟豈欲獨用即今不給可於鄰道取之自今多備當以為常四月尚書省奏東京三路十二猛安尤闕食者已賑之矣尚有未賑者詔遣官詣復州曷蘇館路檢視富家蓄積有餘增直以糴令近地居民就往受糧十八年四月命泰州所管諸猛安西北路招討司所管奚猛安咸平府慶雲縣霿鬆河等處遇豐年多和糴章宗明昌四年七月諭旨戶部官聞通州米粟甚賤若以平價官糴之何如於是有司奏中都路去歲不熟今其價稍減者以商旅運販繼至故也若即差官爭糴切恐市價騰踴貧民愈病請俟秋收日依常平倉條理收糴詔從之明昌五年五月上曰聞米價騰踴今官運至者有餘可減直以糶之其明告民不須貴價私糴也六年七月敕宰臣曰詔制內飢饉之地令減價糶之而貧民無錢者何以得食其議賑濟省臣以為闕食州縣一年則當賑貸二年然後賑濟如其民實無産者雖應賑貸亦請賑濟上遂命間隔飢荒之地可以辨錢收糴者減價糶之貧乏無依者賑濟宣宗貞祐三年十月命高汝礪糴於河南諸郡令民輸挽入京復命在京諸倉糴民輸之餘粟侍御史黃摑奴申言汝礪所糴足給歲支民既於租賦之外轉挽而來亦已勞矣止將其餘以為歸資而又強取之可乎且糴此有日矣而止得二百餘石此何濟也詔罷之十二月附近郡縣多糴於京師穀價騰踴遂禁其出境四年河北行省侯摯言河北人相食觀滄等州斗米銀十餘兩伏見沿河諸津許販粟北渡然每石官糴其八商人無利誰肯為之且河朔之民皆陛下赤子既罹兵革又坐視其死臣恐弄兵之徒得以藉口而起也願止其糴縱民輸販為便詔從之又制凡軍民客旅粟不於官糴處糶而私販渡河者杖百沿河軍及譏察權豪家犯者徒年杖數並的決從重以物沿官上以河北州府錢多其散失民間頗廣命尚書省措畫之省臣奏已命山東河北榷酤及濱滄鹽司以分數帶納矣今河北艱食販粟北渡者衆宜權立法以遮糴之擬於諸渡口南岸選通練財貨官先以金銀絲絹等博易商販之糧轉之北岸以回易糴本兼收見錢不惟杜姦弊亦使錢入京師從之又上封事者言比年以來屢艱食雖由調度征斂之繁亦兼並之家有以奪之也收則乘賤多糴困急則以貸人私立券質名為無利而實數倍飢民惟恐不得莫敢較者故場功甫畢官租未了而囤已空矣此富者益富而貧者益貧者也國朝立法舉財物者月利不過三分積久至倍則止今或不期月而息三倍願明敕有司舉行舊法豐熟之日增價和糴則在公有益而私無損矣詔宰臣行之是年權河東南路宣撫副使烏古論慶壽言邀糴事見鹽志下興定元年上頗聞百姓以和糴太重棄業者多命宰臣加意焉八月以戶部郎中楊貞權陝西行六部尚書收給潼陝軍馬之用奏糴販糧濟河者之半以寬民從之六月立和糴賞格常平倉世宗大定十四年嘗定制詔中外行之其法尋廢章宗明昌元年八月御史請復設敕省臣詳議以聞省臣言大定舊制豐年則增市價十之二以糴儉歲則減市價十之一以出平歲則已夫所以豐則增價以收者恐物賤傷農儉則減價以出者恐物貴傷民增之損之以平粟價故謂常平非謂使天下之民專仰給於此也今天下生齒至衆如欲計口使餘一年之儲則不惟數多難辦又慮出不以時而致腐敗也況復有司抑配之弊殊非經久之計如計諸郡縣驗戶口例以月支三斗為率每口但儲三月已及千萬數亦足以平物價救荒凶矣若令諸處自官兵三年食外可充三月之食者免糴其不及者俟豐年糴之庶可久行也然立法之始貴在必行其令提刑司各路計司兼領之郡縣吏沮格者糾能推行者加擢用若中都路年穀不熟之所則依常平法減其價三之一以糶詔從之三年八月敕常平倉豐糴儉糶有司奉行勤惰褒罰之制其遍諭諸路其奉行滅裂者提刑司糾察以聞又謂宰臣曰隨處常平倉往往有名無實況遠縣人戶豈肯跋涉直就州府糶糴可各縣置倉命州府縣官兼提控管勾遂定制縣距州六十里內就州倉六十里外則特置舊擬備戶口三月之糧恐數多致損改令戶二萬以上備三萬石一萬以上備二萬石一萬以下五千以上備萬五千石五千戶以下備五千石河南陝西屯軍貯糧之縣不在是數州縣有倉仍舊否則創置郡縣吏受代所糴粟無壞一月內交割給由如無同管勾亦準上交割違限委州府並提刑司差官催督監交本處歲豐而收糴不及一分者本等內降提刑司體察直申尚書省至日斟酌黜陟九月敕置常平倉之地令州府官提舉之縣官兼董其事以所糴多寡約量升降為永制又諭尚書省曰上京路諸縣未有常平倉如亦可置定其當備粟數以聞四年十月尚書省奏今上京蒲與速頻曷懶胡里改等路猛安謀克民戶計一十七萬六千有餘每歲收稅粟二十萬五千餘石所支者六萬六千餘石總其見數二百四十七萬六千餘石臣等以為此地收多支少遇災足以賑濟似不必置遂止五年九月尚書省奏明昌三年始設常平倉定其永制天下常平倉總五百一十九處見積粟三千七百八十六萬三千餘石可備官兵五年之食米八百一十餘萬石可備四年之用而見在錢總三千三百四十三萬貫有奇僅支二年以上見錢既少且比年稍豐而米價猶貴若復預糴恐價騰踴於民未便遂詔權罷中外常平倉和糴俟官錢羡餘日舉行水田明昌五年閏十月言事者謂郡縣有河者可開渠引以溉田詔下州郡既而八路提刑司雖有河者皆言不可溉惟中都路言安肅定興二縣可引河溉田四千餘畝詔命行之六年十月定制縣官任內有能興水利田及百頃以上者升本等首注除謀克所管屯田能創增三十頃以上賞銀絹二十兩匹其租稅止從陸田承安二年敕放白蓮潭東閘水與百姓溉田三年又命勿毀高梁河閘從民灌溉泰和八年七月詔諸路按察司規畫水田部官謂水田之利甚大沿河通作渠如平陽掘井種田俱可灌溉比年邳沂近河布種豆麥無水則鑿井灌之計六百餘頃比之陸田所收數倍以此較之它境無不可行者遂令轉運司因出計點就令審察若諸路按察司因勸農可按問開河或掘井如何為便規畫具申以俟興作貞祐四年八月言事者程淵言碭山諸縣陂湖水至則畦為稻田水退種麥所收倍於陸地宜募人佃之官取三之一歲可得十萬石詔從之興定五年五月南陽令李國瑞創開水田四百餘頃詔升職二等仍録其最狀遍諭諸道十一月議興水田省奏漢召信臣於南陽灌溉三萬頃魏賈逵堰汝水為新陂通運二百餘里人謂之賈侯渠鄧艾修淮陽百尺二渠通淮潁大治諸陂於潁之南穿渠三百餘里溉田二萬頃今河南郡縣多古所開水田之地收穫多於陸地數倍敕令分治戶部按行州郡有可開者誘民赴功其租止依陸田不復添徵仍以官賞激之陝西除三白渠設官外亦宜視例施行元光元年正月遣戶部郎中楊大有等詣京東西南三路開水田區田之法見嵇康養生論自是歷代未有天下通用如趙過一畝三甽之法者章宗明昌三年三月宰執嘗論其法於上前上曰卿等所言甚嘉但恐農民不達此法如其可行當遍諭之四年夏四月上與宰執復言其法久之參知政事胥持國曰今日方之大定間戶口既多費用亦厚若區種之法行良多利益上曰此法自古有之若其可行則何為不行也持國曰所以不行者蓋民未見其利今已令試種於城南之地乃委官往監督之若使民見收成之利當不率而自效矣參知政事夾谷衡以為若有其利古已行矣且用功多而所種少復恐廢壠畝之田功也上曰姑試行之六月上問參知政事胥持國曰區種事如何對曰六七月之交方可見矣河東及代州田種今歲佳否曰比常年頗登是日命近侍二人馳驛巡視京畿禾稼五年正月敕諭農民使區種先是陳言人武陟高翌上區種法且請驗人丁地土多少定數令種上令尚書省議既定遂敕令農田百畝以上如瀕河易得水之地須區種三十餘畝多種者聽無水之地則從民便仍委各千戶謀克縣官依法勸率承安元年四月初行區種法男年十五以上六十以下有土田者丁種一畝丁多者五畝止二年二月九路提刑馬百祿奏聖訓農民有地一頃者區種一畝五畝即止臣以為地肥瘠不同乞不限畝數制可泰和四年九月尚書省奏近奉旨講議區田臣等謂此法本欲利民或以天旱乃始用之倉卒施功未必有益也且五方地肥瘠不同使皆可以區種農民見有利自當勉以效之不然督責雖嚴亦徒勞耳敕遂令所在長官及按察司隨宜勸諭亦竟不能行入粟鬻度牒熙宗皇統三年三月陝西旱飢詔許富民入粟補官世宗大定元年以兵興歲歉下令聽民進納補官又募能濟飢民者視其人數為補官格五年上謂宰臣曰頃以邊事未定財用闕乏自東南兩京外命民進納補官及賣僧道尼女冠度牒紫褐衣師號寺觀名額今邊鄙已寧其悉罷之慶壽寺天長觀歲給度牒每道折錢二十萬以賜之明昌二年敕山東河北闕食之地納粟補官有差承安二年賣度牒師號寺觀額復令人入粟補官三年西京飢詔賣度牒以濟之宣宗貞祐二年從知大興府事胥鼎所請定權宜鬻恩例格進官升職丁憂人許應舉求仕監戶從良之類入粟草各有數三年制無問官民有能勸率諸人納物入官者米百五十石遷官一階正班任使七百石兩階除諸司千石三階除丞簿過此數則請於朝廷議賞推司縣官有能勸二千石遷一階三千石兩階以濟軍儲又定制司縣官能勸率進糧至五千石以上者減一資考萬石以上遷一官減二等考二萬石以上遷一官升一等皆注見闕四年河東行省胥鼎言河東兵多民少倉空歲飢竊見潞州元帥府雖設鬻爵恩例然條目至少未盡勸率之術今擬凡補買正班依格止廕一名若願輸許增廕一名僧道已具師號者許補買本司官職官願納粟或不願給俸及券糧者宜量數遷加三舉終場人年五十以上四舉年四十五以上並許入粟該恩大小官及承應人令譯史吏員雖未係班亦許進納遷官其有品官應注諸司者聽獻物借注丞簿丞簿注縣令差使免一差掌軍官能自備芻糧者依職官例遷官如舊四年耀州僧廣惠言軍儲不足凡京府節鎮以上僧道官乞令納粟百石防刺郡副綱威儀等七十石者乃充三十月滿替諸監寺十石周年一代願復買者聽詔從之興定元年潞州行元帥府事粘割貞言近承奏格凡去歲覃恩之官以品從差等聽其入粟委帥府書空名宣敕授之則人無陳訴之勞而官有儲蓄矣比年屢降覃恩凡羈縻軍職者多未暇授若止許遷新覃則將隔越矣乞令計前後所該輸粟積遷詔從之
