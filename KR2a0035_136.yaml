body:
  text: 金國語解今文尚書辭多奇澀蓋亦當世之方言也金史所載本國之語得諸重譯而可解者何可闕焉若其臣僚之小字或以賤或以疾猶有古人尚質之風不可文也國姓為某漢姓為某後魏孝文以來已有之矣存諸篇終以備考索官稱都勃極烈總治官名猶漢云冢宰諳版勃極烈官之尊且貴者國論勃極烈尊禮優崇得自由者胡魯勃極烈統領官之稱移賚勃極烈位第三曰移賚阿買勃極烈治城邑者乙室勃極烈迎迓之官札失哈勃極烈守官署之稱昃勃極烈陰陽之官迭勃極烈倅二之職猛安千夫長謀克百夫長也諸辭詳穩邊戍之官諸移里堇部落墟寨之首領詳穩移里堇本遼語金人因之而稍異同焉禿里掌部落詞訟察非違者烏魯古牧圉之官斡里𩽆官府治事之所人事孛論出胚胎之名阿胡迭長子骨季也蒲陽溫曰幼子益都次第之通稱第九曰烏也十六曰女魯歡按答海客之通稱山只昆舍人也散亦孛奇男子撒答老人之稱也什古乃瘠人撒合輦黧黑之名保活里侏儒阿里孫貌不揚也阿徒罕採薪之子答不也耘田者阿土古善採捕者阿里喜圍獵也拔里速角抵戲者阿離合悶臂鷹鶻者胡魯剌戶長阿合人奴也兀术曰頭粘罕心也畏可牙又曰吾亦可盤里合將指三合人之靨也牙吾塔瘍瘡蒲剌都目赤而盲也石哥里溲疾謾都歌癡騃之謂謀良虎無賴之名皆不美之稱也與人同受福曰忽都以力助人曰阿息保辭不失酒醒也奴申和睦之義訛出虎寬容之名也賽里安樂迪古乃來也撒八迅速之義烏古出方言曰再休猶言再不復也凡事之先者曰石倫以物與人已然曰阿里白吾里補畜積之名習失猶人云常川也凡市物已得曰兀帶取以名子者猶言貨取如物然也物象兀典明星阿鄰山太神高也山之上鋭者曰哈丹坡陀曰阿懶大而峻曰斜魯忒鄰海也沙忽帶舟也生鐵曰斡論釜曰闍母刃曰斜烈婆盧火者槌也金曰桉春銀术可珠也布囊曰蒲盧渾盆曰阿里虎罐曰活女烏烈草釰也沙剌衣襟也活臘胡色之赤者也胡剌竈突物類桓端松阿虎里松子孰輦蓮也活離罕羔合喜犬子訛古乃犬之有文者斜哥貂鼠蒲阿山雞窩謀罕鳥卵也姓氏完顏漢姓曰王烏古論曰商紇石烈曰高徒單曰杜女奚烈曰郎兀顏曰朱蒲察曰李顏盞曰張溫迪罕曰溫石抹曰蕭奧屯曰曹孛术魯曰魯移剌曰劉斡勒曰石納剌曰康夾谷曰同裴滿曰麻尼忙古曰魚斡準曰趙阿典曰雷阿里侃曰何溫敦曰空吾魯曰惠抹顏曰沙剌衣襟也活臘胡色之赤者也胡剌竈突物類桓端松阿虎里松子孰輦蓮也活離罕羔合喜犬子訛古乃犬之有文者斜哥貂鼠蒲阿山雞窩謀罕鳥卵也姓氏完顏漢姓曰王烏古論曰商紇石烈曰高徒單曰杜女奚烈曰郎兀顏曰朱蒲察曰李顏盞曰張溫迪罕曰溫石抹曰蕭奧屯曰曹孛术魯曰魯移剌曰劉斡勒曰石納剌曰康夾谷曰同裴滿曰麻尼忙古曰魚斡準曰趙阿典曰雷阿里侃曰何溫敦曰空吾魯曰惠抹顏曰孟都烈曰強散答曰駱呵不哈曰田烏林答曰蔡僕散曰林术虎曰董古里甲曰汪其後氏族或因人變易難以遍舉姑載其可知者云金國語解終進金史表開府儀同三司上柱國録軍國重事中書右丞相監修國史領經筵事提調太醫院廣惠司事臣阿魯圖言竊惟漢高帝入關任蕭何而收秦籍唐太宗即祚命魏徵以作隋書蓋曆數歸真主之朝而簡編載前代之事國可滅史不可滅善吾師惡亦吾師矧夫典故之源流章程之沿革不披往牒曷蓄前聞維此金源起於海裔以滿萬之衆橫行天下不十年之久專制域中其用兵也如縱燎而乘風其得國也若置郵而傳令及煟興於禮樂乃煥有乎聲明嘗循初而汔終因考功而論德非武元之英略不足以開九帝之業非大定之仁政不足以固百年之基天會有吞四海之勢而未有一四海之規明昌能成一代之制而亦能壞一代之法海陵無道自取覆敗宣宗輕動曷濟中興逮夫浚郊多壘之秋汝水飛煙之日天人屬望久有在矣君臣守義蓋足取焉我太祖法天啓運聖武皇帝以有名之師而釋奕世之愾以無敵之仁而收兆民之心徑卒搗居庸關北拊其背大軍出紫荊口南扼其吭指顧可成於雋功操縱莫窺於廟算懲彼取遼之暴容其涉河以遷太宗英文皇帝席卷雲朔而徇地並營囊括趙代而傳檄齊魯滅夏國以蹴秦鞏通宋人以逼河淮睿宗仁聖景襄皇帝冒萬險出饒風長驅平陸戰三峯乘大雪遂定中原太陽出而爝火熸正音作而衆樂廢爰及世祖聖德神功文武皇帝恢弘至化勞來遺黎燕地定都撤武靈之舊址遼陽建省撫肅慎之故墟于時張柔歸金史於其先王鶚輯金事於其後是以纂修之命見諸敷遺之謀延祐申舉而未遑天曆推行而弗竟臣阿魯圖誠惶誠懼頓首頓首欽惟皇帝陛下緝熙聖學紹述先猷當邦家間暇之時治經史討論之務念彼泰和以來之事迹涉我聖代初興之歲年太祖受帝號於丙寅先五載而朱鳳應世皇育聖質於乙亥蚤一歲而黃河清若此貞符昭然成命第以變故多而舊史闕耆艾沒而新説訛弗折衷於大朝恐失真於他日於是聖心獨斷盛事力行申命臣阿魯圖以中書右丞相臣別兒怯不花以中書左丞相領三史事臣脫脫以前中書右丞相仍都總裁臣御史大夫帖睦爾達世臣中書平章政事賀惟一臣翰林學士承旨張起巖臣翰林學士歐陽玄臣治書侍御史李好文臣禮部尚書王沂臣崇文太監楊宗瑞為總裁官臣江西湖東道肅政廉訪使沙剌班臣江西湖東道肅政廉訪副使王理臣翰林待制伯顏臣國子博士費著臣祕書監著作郎趙時敏臣太常博士商企翁為史官集衆技以責成書佇奏篇以覽近監臣阿魯圖仰承隆委俯竭微勞紬石室之文誠乏司馬遷之作獻金鏡之録願攄張相國之忠謹撰述本紀十九卷志三十九卷表四卷列傳七十三卷目録二卷裝潢成一百三十七帙隨表以聞上塵天覽無任慚愧戰汗屏營之至臣阿魯圖誠惶誠懼頓首頓首謹言至正四年十一月日開府儀同三司上柱國録軍國重事中書右丞相監修國史領經筵事提調太醫院廣惠司事臣阿魯圖上表修史官員領三史事開府儀同三司上柱國録軍國重事中書右丞相監修國史領經筵事臣阿魯圖開府儀同三司上柱國録軍國重事中書左丞相領經筵事臣別兒怯不花都總裁開府儀同三司上柱國録軍國重事前中書右丞相監修國史領經筵事臣脫脫總裁官銀青榮祿大夫御史大夫知經筵事臣帖睦爾達世光祿大夫中書平章政事知經筵事臣賀惟一翰林學士承旨榮祿大夫知制誥兼修國史臣張起巖翰林學士資善大夫知制誥同修國史臣歐陽玄翰林侍講學士中奉大夫知制誥同修國史同知經筵事臣揭傒斯嘉議大夫治書侍御史臣李好文正議大夫崇文太監檢校書籍事臣楊宗瑞中大夫禮部尚書臣王沂纂修官江西湖東道肅政廉訪使臣沙剌班江西湖東道肅政廉訪副使臣王理翰林待制奉議大夫兼國史院編修官臣伯顏奉訓大夫監察御史臣趙時敏奉訓大夫國子博士臣費著承務郎太常博士臣商企翁提調官榮祿大夫中書平章政事知經筵事臣伯顏榮祿大夫中書右丞知經筵事臣達世帖睦爾資德大夫中書左丞臣董守簡中奉大夫參議中書省事臣鎖南班嘉議大夫參議中書省事臣蠻子亞中大夫參議中書省事臣丁元奉議大夫右司郎中臣老老承德郎右司郎中臣陳思謙中順大夫左司郎中臣蠻子亞中大夫左司郎中臣何執禮奉訓大夫左司員外郎臣倉赤奉訓大夫左司都事臣趙公諒朝請大夫吏部尚書臣拜住通議大夫兵部尚書臣李獻正議大夫戶部尚書臣秦從龍正議大夫工部尚書臣路希賢朝散大夫禮部侍郎臣靳義亞中大夫刑部郎中臣顧恕通議大夫僉太常禮儀院事臣杜秉彝文林郎翰林國史院都事臣趙中金史公文皇帝聖旨𩹉江浙等處行中書省至正五年六月二十六日準中書省咨至正五年四月十三日篤憐帖木兒怯薛第二日沙嶺納鉢斡脫𩹉有時分速古兒赤雅普化云都赤撒迪里迷失殿中撒馬給事中也先不先等有來阿魯禿右丞相帖木兒塔失大夫太平院使伯顏平章達世帖木兒右丞等奏去歲教纂修遼金宋三代史書即目遼金史書纂修了有如今將這史書令江浙江西二省開板就彼有的學校錢內就用疾早教各印造一百部來呵怎生奏呵奉聖旨那般者欽此咨請欽依施行仍令行省委自文資正官首領官各一員欽依提調疾早印造完備起解準此本省咨委參知政事秦中奉左右司都事徐槃承德欽依提調及下江浙儒司委自提舉班惟志奉政校正字畫杭州路委文資正官首領官提調鋟梓印造裝褙至正五年九月日都事承務郎江浙等處行中書省左右司都事臣馬黑麻承德郎江浙等處行中書省左右司都事臣徐槃奉政大夫江浙等處行中書省左右司員外郎臣鄭璠奉訓大夫江浙等處行中書省左右司員外郎臣赫德奉直大夫江浙等處行中書省左右司郎中臣崔敬朝列大夫江浙等處行中書省左右司郎中臣島剌沙中奉大夫江浙等處行中書省參知政事臣秦從德資德大夫江浙等處行中書省參知政事臣沙班資善大夫江浙等處行中書省左丞臣李家奴資政大夫江浙等處行中書省右丞臣忽都不花平章政事榮祿大夫江浙等處行中書省平章政事臣卜只兒金紫光祿大夫江浙等處行中書省左丞相領行宣政院事提調江浙財賦都總管府事臣𩽆兒只原無標題今據底本此頁書口補
