body:
  text: 金史卷七十三列傳第十一阿離合悶晏本名斡論宗尹本名阿里罕宗寧本名阿土古宗道本名八十宗雄本名謀良虎阿鄰按答海希尹本名谷神守貞本名左靨守能本名胡剌阿離合悶景祖第八子也健捷善戰年十八臘醅麻産起兵據暮稜水烏春窩謀罕以姑里甸兵助之世祖擒臘醅暮稜水人尚反側不自安使阿離合悶往撫察之與斜鉢合兵攻窩謀罕烏春已死窩謀罕棄城遁去後從撒改討平留可阿離合悶功居多太祖擒蕭海里使阿離合悶獻馘于遼太祖謀伐遼阿離合悶實贊成之及舉兵阿離合悶在行間屢戰有功及太宗等勸進太祖未之許也阿離合悶昱宗翰等曰今大功已集若不以時建號無以繫天下心太祖曰吾將思之收國元年太祖即位阿離合悶與宗翰以耕具九為獻祝曰使陛下毋忘稼穡之艱難太祖敬而受之頃之為國論乙室勃極烈為人聰敏辨給凡一聞見終身不忘始未有文字祖宗族屬時事並能默記與斜葛同修本朝譜牒見人舊未嘗識聞其父祖名即能道其部族世次所出或積年舊事偶因他及之人或遺忘輒一一辨析言之有質疑者皆釋其意義世祖嘗稱其強記人不可及也天輔三年寢疾宗翰日往問之盡得祖宗舊俗法度疾病上幸其家問疾問以國家事對曰馬者甲兵之用今四方未平而國俗多以良馬殉葬可禁止之乃獻平生所乘戰馬及以馬獻太宗使其子蒲里迭代為奏奏有誤語即哂之宗翰從傍為改定進奏訖薨年四十九上聞阿離合悶臨薨有奏事曰臨終不亂念及國家事真賢臣也哭之慟及葬上親臨熙宗時追封隋國王天德中改贈開府儀同三司隋國公大定間配饗太祖廟廷諡曰剛憲子賽也斡論賽也子宗尹晏本名斡論景祖之孫阿離合悶次子也明敏多謀略通契丹字天會初烏底改叛太宗幸北京以晏有籌策召問稱旨乃命督扈從諸軍往討之至混同江諭將士曰今叛衆依山谷地勢險阻林木深密吾騎卒不得成列未可以歲月破也乃具舟楫艤江令諸軍據高山連木為柵多張旗幟示以持久計聲言俟大軍畢集而發乃潛以舟師浮江而下直搗其營遂大破之據險之衆不戰而潰月餘一境皆定師還授左監門衛上將軍為廣寧尹入為吏禮兩部尚書皇統元年為北京留守改咸平尹徙東京天德初封葛王入拜同判大宗正事進封宋王授世襲猛安海陵遷都晏留守上京授金牌一銀牌二纍封豫王許王又改越王貞元初進封齊時近郊禁圍獵特畀晏三百人從獵在上京凡五年正隆二年例削王爵改西京留守未幾為臨潢尹遂致仕還居會寧海陵南伐世宗為東京留守將士皆自淮南來歸晏之子恧里乃亦自軍前率衆來歸世宗白彥敬等在北京聞恧里乃等逃還使會寧同知高國勝拘晏家族上既即位遣使召晏既又遣晏兄子鶻魯補馳驛促之晏遂率宗室數人入見即拜左丞相封廣平郡王宴勞彌日未幾兼都元帥大定二年正月上如山陵禮畢上將獵有司已夙備晏諫曰邊事未寧畋游非所宜也上嘉納之因謂晏等曰古者帝王虛心受諫朕常慕之卿等盡言毋隱進拜太尉復致仕還鄉里是歲薨詔有司致祭賻贈銀幣甚厚宗尹本名阿里罕以宗室子充護衛改牌印祗候授世襲謀克為右衛將軍歷順天歸德彰化唐古部族橫海軍節度使正隆南伐領神略軍都總管先鋒渡淮取揚州及瓜洲渡大定二年改河南路副都統駐軍許州之境是時宋陷汝州殺刺史烏古孫麻潑及漢軍二千人宗尹遣萬戶孛术魯定方完顏阿喝懶夾谷清臣烏古論三合渠雛訛只將騎四千往攻之遂復取汝州除大名尹副統如故頃之為河南路統軍使遷元帥左都監除南京留守上曰卿年少壯而心力多滯前任點檢京尹勤力不怠而處事迷錯勉修職業以副朕意賜通犀帶馬八年置山東路統軍司宗尹為使遷樞密副使録其父功授世襲蒲與路屯河猛安並親管謀克除太子太保樞密副使如故上問宰臣曰宗尹雖才無大過人者而性行淳厚且國之舊臣昔為達官卿等尚未仕也朕欲以為平章政事何如宰執皆曰宗尹為相甚協衆望即日拜平章政事封代國公兼太子太傅是時民間苦錢幣不通上問宗尹對曰錢者有限之物積於上者滯於下所以不通海陵軍興為一切之賦有菜園房稅養馬錢大定初軍事未息調度不繼故因仍不改今天下無事府庫充積悉宜罷去上曰卿留意百姓朕復何慮太尉守道老矣捨卿而誰於是養馬等錢始罷他日上謂宰臣曰宗尹治家嚴密他人不及也顧謂宗尹曰政事亦當如此矣有頃北方歲饑軍食不足廷議輸粟賑濟或謂比雖不登而舊積有餘秋成在近不必更勞輸挽宗尹曰國家平時積粟本以備凶歲也必待秋成則憊者衆矣人有損瘠其如防戍何上從之宗尹乞令子銀术可襲其猛安會太尉守道亦乞令其子神果奴襲其謀克凡承襲人不識女直字者勒令習學世宗曰此二子吾識其一習漢字未習女直字自今女直契丹漢字曾學其一者即許承襲遂著于令宗尹有疾不能赴朝上問宰臣曰宗尹何為不入朝太尉守道以疾對上曰丞相志寧嘗言若詔遣征伐所不敢辭宰相之職實不敢當宗尹亦豈此意耶二十四年世宗將幸上京上曰臨潢烏古里石壘歲皆不登朕欲自南道往三月過東京謁太后陵寢五月可達上京春月鳥獸孳孕東作方興不必搜田講事卿等以為何如宗尹曰南道歲熟芻粟賤宜如聖旨遂由南道往焉世宗至上京聞同簽大宗正事宗寧不能撫治上京宗室宗室子往往不事生業上謂宗尹曰汝察其事宜懲戒之宗尹奏曰隨仕之子父沒不還本土以此多好游蕩上命召還宴宗室于皇武殿擊毬為樂上曰賞賜宗室亦是小惠又不可一概遷官欲令諸局分收補其間人材孰可者宗尹對曰奉國斡準之子按出虎豫國公昱之曾孫阿魯可任使上曰度可任何職更訪其餘以聞詔以按出虎阿魯為奉御二十七年乞致仕世宗曰此老不事事從其請可也宰臣奏曰舊臣宜在左右上曰宰相總天下事非養老之地若不堪其職朕亦有愧焉如賢者在朝利及百姓四方瞻仰朕亦與其光美宰臣無以對宗尹入謝上曰卿久任外官不聞有過失但恨用卿稍晚今精力似衰矣省事至煩若勉留卿則四方以朕為私卿亦不自安也頃之上問宗尹子汝父致仕將居何所其子曰聚屬既多不能復在京師上遣使問宗尹曰朕欲留卿時相從游卿子之言如此今定何如宗尹曰臣豈不欲在此但餘間之年猶在輦下恐聖主心困耳既哀老臣不忍擯棄時時得瞻望天顏臣豈敢他往鄉里故老無存者雖到彼尚將與誰游乎於是賜甲第一區凡宴集畋獵皆從焉二十八年薨宗寧本名阿土古系出景祖太尉阿離合悶之孫性勤厚有大志起家為海陵征南都統戰瓜洲渡功最歷祁州刺史大定二年為會寧府路押軍萬戶擢歸德軍節度使時方旱蝗宗寧督民捕之得死蝗一斗給粟一斗數日捕絶移鎮寧昌軍改知臨潢府事移天德軍世宗嘗謂宰臣曰宗寧智慮雖淺然所至人皆愛之即命為行軍右翼都統為賀宋正旦使纍遷兵部尚書授隆州路和團猛安烈里沒世襲謀克出知大名府事徙鎮利涉軍俄同簽大睦親府事宗寧多病世宗欲以涼地處之俾知咸平詔以其子符寶郎為韓州刺史以便養無幾入授同判大睦親府事拜平章政事明昌二年薨宗寧居家約儉如寒素臨事明敏其鎮臨潢鄰國有警宗寧聞知乏糧即出倉粟令以牛易之敵知得粟即遁去邊人以窩斡亂後苦無牛宗寧復令民入粟易牛既而民得牛而倉粟倍於舊其經畫如此宗道本名八十上京司屬司人系出景祖太尉訛論之少子也通周易孟子善騎射大定五年充閣門祗候纍除近侍局使右丞相烏古論元忠左衛將軍僕散揆等嘗燕集有所竊議宗道即密以聞世宗嘉之授右衛將軍出為西南路副招討章宗即位改同知平陽府事陝西路副統軍左宣徽使移剌仲方舉以自代除西北路招討使故事諸部賀馬八百餘匹宗道辭不受諸部悅服邊鄙順治提刑司察廉召為殿前右副都點檢尋除陝西路統軍使以鎮靜得軍民心特遷三階兼知京兆府事時夏旱俾長安令取太白湫水步迎於遠郊及城而雨是歲大稔人以為精意所感刊石紀之承安二年為賀宋正旦使尋授河南路統軍使泗州民張偉獲宋人王萬言彼界事情宗道疑其寃乃廉問得實萬楚州賈人偉負萬貨五千餘貫三年不償萬理索為偉所誣乃坐偉而歸萬時人服其明後乞致仕朝廷知非本心改知河中府有惠政民立像於層觀以時祭之移知臨洮以病解泰和四年卒贈龍虎衛上將軍宗雄本名謀良虎康宗長子其始生也世祖見而異之曰此兒風骨非常他日必為國器因解佩刀使常置其側曰俟其成人則使佩之九歲能射逸兔年十一射中奔鹿世祖坐之膝上曰兒幼已然異日出倫輩矣以銀酒器賜之既長風表奇偉善談辨多智略孝敬謙謹人愛敬之康宗沒遼使阿息保來乘馬至靈帷階下擇取賵贈之馬太祖怒欲殺阿息保宗雄諫太祖乃止太祖將舉兵宗雄曰遼主驕侈人不知兵可取也不能擒一蕭海里而我兵擒之太祖善其言攻寧江州渤海兵鋭甚宗雄以所部敗渤海兵以功授世襲千戶謀克太祖敗遼兵于出河店宗雄推鋒力戰功多達魯古城之役宗雄將右軍身先士卒戰遼兵當右軍者已却上命宗雄助左軍擊遼兵宗雄繞遼兵後擊之遼兵遂大潰乘勝逐北日已暮圍之黎明遼兵突圍出追殺至乙呂白石而還上撫其背曰朕有此子何事不濟以御服賜之及遼帝以七十萬衆至門諸將皆曰遼軍勢甚盛不宜速戰宗雄曰不然遼兵雖衆而皆庸將士卒惴惴不足畏也戰則破之掌握間耳上曰善追及遼帝于護步答岡宗雄率衆直前短兵接宗雄令前行持挺擊遼兵馬首後行者射之大敗遼兵上嘉宗雄功執其手勞之以御介胄及御戰馬寶貨奴婢賜之斜也攻春州宗雄與宗幹婁室取金山縣行近白鷹林獲候者七人縱其一人使歸縣人聞大軍至乃潰遂下金山縣與斜也俱取泰州太祖自將取臨潢府遣宗雄先啓行遇遼兵五千宗雄與戰大軍亦至大破之及留守撻不野降上以其女與宗雄賞其啓行破遼援兵之功也既而與蒲家奴按視泰州地土宗雄包其土來奏曰其土如此可種植也上從之由是徙萬餘家屯田泰州以宗雄等言其地可種藝也西京既降復叛時糧餉垂盡議欲罷攻宗雄曰西京都會也若委而去之則降者離心遼之餘黨與夏人得以窺伺矣乃立重賞以激士心既而夜中有火大如斗墜于城中宗雄曰此城破之象也及克西京賜宗雄黃金百兩衣十襲及奴婢等與宗翰等擊耿守忠兵七千于西京之東四十里大破之迎謁太祖于鴛鴦濼從至歸化州疾篤宗幹問所欲言宗雄曰國家大業既成主上壽考萬年肅清四方死且無恨天輔六年薨年四十太祖來問疾不及見哭之慟謂羣臣曰此子謀略過人臨陳勇決少見其比賻贈加等詔合扎千戶駙馬石家奴護喪歸葬於歸化州仍於死所建佛寺宗雄好學嗜書嘗從上獵誤中流矢而神色不變恐上知之而罪及射者既拔去其矢託疾歸家臥兩月因學契丹大小字盡通之凡金國初建立法定制皆與宗幹建白行焉及與遼議和書詔契丹漢字宗雄與宗翰希尹主其事而材武蹻捷挽強射遠幾三百步嘗走馬射三麞已中其二復彎弓馬蹶躍而下控弦如故遂彀滿步射獲之宗雄方逐兔撻懶亦從後射之已發矢撻懶大呼曰矢及矣宗雄反顧以手接其矢就射兔中之其輕健如此天眷中追封太師齊國王天德二年加秦漢國王正隆二年改太傅金源郡王大定二年追封楚王諡威敏配享太祖廟廷十五年詔圖像于衍慶宮子蒲魯虎按答海阿鄰孫常春胡里剌胡剌鶻魯茶扎怕八訛出初宗幹納宗雄妻海陵銜之及篡位使宿直將軍朝霞牌印閭山往河間囚宗雄妻於府署明日與其子婦及常春兄弟茶扎之子七人皆殺而焚之棄其骨於濠水大定十七年詔有司收葬初蒲魯虎襲猛安蒲魯虎卒贈金紫光祿大夫子桓端襲之官至金吾衛上將軍桓端卒子裊頻未襲而死章宗命宗雄孫蒲帶襲之蒲帶大定末纍官同簽大睦親府事章宗即位初置九路提刑司蒲帶為北京臨潢提刑使詔曰朕初即位憂勞萬民每念刑獄未平農桑未勉吏或不循法度以隳吾治朝廷遣使廉問事難周悉惟提刑勸農采訪之官自古有之今分九路專設是職爾其盡心往懋乃事自熙宗時遣使廉問吏治得失世宗即位凡數歲輒一遣黜陟之故大定之間郡縣吏皆奉法百姓滋殖號為小康或謂廉問使者頗以愛憎立殿最以問宰相宰相曰臣等復為陛下察之是以世宗嘗欲立提刑司而未果章宗追述先朝遂於即位之初行之及九路提刑使朝辭于慶和殿上曰建立官制當寬猛得中凡軍民事相涉者均平決遣鈐束家人部曲勿使沮擾郡縣事今以司獄隸提刑司惟冀獄犴無寃耳既退復遣近臣諭之曰卿等皆妙簡才良付以專責盡心舉職別有旌賞否則有罰明年蒲帶乃襲猛安云阿鄰穎悟辨敏通女直契丹大小字及漢字幼時嘗入宮熙宗見而奇之曰是兒他日必能宣力國家年十八授定遠大將軍為順天軍節度使天德二年用廉遷益都尹兼山東東路兵馬都總管歷泰寧定海鎮西安國等軍節度海陵南伐以為神勇武平等軍都總管由壽州道渡淮與勸農使移剌元宜合兵三萬為先鋒是歲十月至廬州與宋將王權軍十餘萬戰于柘臯鎮渭子橋敗之至和州南復與王權軍八萬餘會戰又敗之追殺至江上斬首數千級上即位于遼陽海陵死大軍北還將渡淮而舟楫甚少軍士爭舟不得亟渡阿鄰得生口知可涉處識以柳枝命本部涉濟既至北岸而諸軍之爭渡者果為宋人邀擊之及入見上聞阿鄰淮上戰功又以全軍還遷兵部尚書監督經畫征窩斡諸軍糧餉授以金牌一銀牌四窩斡敗還至懿州以疾卒喪至京師上命致祭于永安寺百官赴吊賻銀五百兩重綵三十端絹百匹按答海又名阿魯綰宗雄次子也性端重不輕發有父之風年十五太祖賜以一品傘二十餘御毬場分朋擊毬連勝三算宗工舊老咸異之進呈所勝禮物按答海為班首太宗喜曰今日之勝此孫之力也賞之獨厚天眷二年襲父猛安除大宗正丞以猛安讓兄子喚端加武定軍節度使奉朝請改侍衛親軍都指揮使封金源郡王進封談王遷同判大宗正事別授世襲猛安海陵將遷中都按答海諫曰棄祖宗興王之地而他徙非義也海陵不悅留之上京久之進封鄆王改封魏王除濟南尹按答海不堪卑濕多在病告海陵聞之改西京留守正隆例奪王爵改廣寧尹世宗即位于東京赦令至廣寧弟燕京勸按答海拒弗受按答海受之會海陵遣使至城下按答海登城告使者曰此府迫近遼陽勢不能抗聊且從命非得已也燕京亦登譙樓與使者語指斥不遜及諸郡皆詣東京按答海兄弟亦上謁有司議既拜赦令復有異言持兩端請併誅之上曰正隆剪刈宗室朕不可效尤按答海為弟所惑耳於是釋按答海乃誅燕京不數日復判大宗正事再遷太子太保封蘭陵郡王改勸農使海陵時自上京徙河間土瘠詔按答海一族二十五家從便遷居近地乃徙平州詔給平州官田三百頃屋三百間宗州官田一百頃進金源郡王致仕大定八年召見上曰宗室耆老如卿者能幾人邪賜錢萬貫甲第一區留京師使預巡幸毬獵宴會十四年薨年六十七臨終戒諸子曰汝輩勿以生富貴中而為暴戾宜自謙退海陵以猜忌剪滅宗室我以純謹得免死耳汝輩惟日為善勿墜吾家完顏希尹本名谷神歡都之子也自太祖舉兵常在行陳或從太祖或從撒改或與諸將征伐比有功金人初無文字國勢日強與鄰國交好乃用契丹字太祖命希尹撰本國字備制度希尹乃依倣漢人楷字因契丹字制度合本國語製女直字天輔三年八月字書成太祖大悅命頒行之賜希尹馬一匹衣一襲其後熙宗亦製女直字與希尹所製字俱行用希尹所撰謂之女直大字熙宗所撰謂之小字遼人迪六和尚雅里斯棄中京走希尹與迪古乃婁室余睹襲之迪六等聞希尹兵復走遂降其旁近人民而還奚人落虎來降希尹使落虎招其父西節度使訛里剌訛里剌以本部降宗翰駐軍北安使希尹經略近地獲遼護衛耶律習泥烈知遼主獵于鴛鴦濼宗翰遂請進兵宗翰將會都統杲于奚王嶺遼兵屯古北口使婆盧火將兵二百擊之渾黜亦將二百人為後援渾黜聞遼兵衆請益兵宗翰欲親往希尹婁室曰此小寇請以千兵為公破之渾黜至古北口遇遼遊兵逐之入谷中遼步騎萬餘迫戰死者數人渾黜據關口希尹等至大破遼兵斬馘甚衆盡獲甲胄輜重復敗其伏兵殺千餘人獲馬百餘匹遂與宗翰至奚王嶺期會於羊城濼宗翰襲遼帝于五院司希尹為前驅所將才八騎與遼主戰一日三敗之明日希尹得降人麻哲言遼主在漠委輜重將奔西京幾及遼主于白水濼南遼主以輕騎遁去盡獲其內庫寶物遂至西京西京降使蒲察守之希尹至乙室部不及遼主而還及宗翰入朝希尹權西南西北兩路都統是時夏人已受盟遼主已獲耶律大石自立而夏國與婁室書責諸帥棄盟軍入其境多掠取者希尹上其書且奏曰聞夏使人約大石取山西諸郡以臣觀之夏盟不可信也上曰夏事酌宜行之軍入其境不知信與否也大石合謀不可不察其嚴備之及大舉伐宋希尹為元帥右監軍再伐宋執二主以歸師還賜希尹鐵券除常赦不原之罪餘釋不問宗翰伐康王希尹追之于揚州康王遁去後與宗翰俱朝京師請立熙宗為儲嗣太宗遂以熙宗為諳班勃極烈熙宗即位希尹為尚書左丞相兼侍中加開府儀同三司希尹為相有大政皆身先執咎天眷元年乞致仕不許罷為興中尹二年復為左丞相兼侍中俄封陳王與宗幹共誅宗磐宗雋三年賜希尹詔曰帥臣密奏姦狀巳萌心在無君言宣不道逮燕居而竊議謂神器以何歸稔於聽聞遂致章敗遂賜死並殺右丞蕭慶並希尹子同修國史把答符寶郎漫帶是時熙宗未有皇子故嫉希尹者以此言譖之皇統三年上知希尹實無他心而死非其罪贈希尹儀同三司邢國公改葬之蕭慶銀青光祿大夫天德三年追封豫王正隆二年例降金源郡王大定十五年諡貞憲孫守道守貞守能守道自有傳守貞本名左靨貞元二年襲祖谷神謀克大定改元收充符寶祗候授通進除彰德軍節度副使遷北京留守移上京坐安置契丹戶民部內娶妻杖一百除名二十五年起為西京警巡使世宗愛其剛直授中都左警巡使遷大興府治中進同知改同知西京留守事御史臺奏守貞治有善狀世宗因謂侍臣曰守貞勳臣子又有材能全勝其兄守道它日可用也章宗即位召為刑部尚書兼右諫議大夫守貞與修起居注張暐奏言唐中書門下入閣諫官隨之欲其預聞政事有所開說又起居郎起居舍人每皇帝視朝左右對立有命則臨階俯聽退而書之以為起居注緣侍從官每遇視朝正合侍立自來左司上殿諫官修起居注不避或侍從官除授及議便遣始令避之比來一例令臣等回避及香閣奏陳言文字亦不令臣等侍立則凡有聖訓及所議政事臣等無緣得知何所記録何所開說似非本設官之義若漏泄政事自有不密罪上從之尋為賀宋生日使還拜參知政事時上新即政頗鋭意於治嘗問漢宣帝綜核名實之道其施行之實果何如守貞誦樞機周密品式詳備以對上曰行之果何始守貞曰在陛下厲精無倦耳久之進尚書左丞授上京世襲謀克明昌三年夏旱天子下詔罪己守貞惶恐表乞解職詔曰天嗇時雨薦歲為災所以警懼不逮方與二三輔弼圖回遺闕宜思有以助朕修政上答天戒消沴召和以康百姓卿達機務朕所親倚而引咎求去其如思助何守貞懇辭乃出知東平府事命參知政事夾谷衡諭之曰卿勳臣之裔早登膴仕才用聲績朕所素知故嗣位之初擢任政府于今數載毗贊實多既久任繁劇宜均適逸安矧內外之職亦當更治今特授卿是命東平素號雄藩兼比年飢歉正賴經畫卿其為朕往綏撫之仍賜金幣馬以寵其行它日上問宰臣守貞治東平如何對曰亦不勞力上曰以彼之才治一路誠有餘矣右丞劉瑋曰方今人材無出守貞者淹留于外誠可惜也上默然尋改西京留守監察御史蒲剌都劾奏守貞前宴賜北部有取受事不報右拾遺路鐸上章辨之四年召拜平章政事封蕭國公上御後閣召守貞曰朕以卿乃太師所舉故特加委用然比者行事多太過門下人少慎擇復與丞相不協以是令卿補外載念我昭祖太祖開創以來乃祖佐命積有勳勞茲故召用卿其勉盡乃心與丞相議事宜相和諧率循舊章無輕改革因賜玉帶併以蒲剌都所彈事與之曰朕度卿必不爾故以示卿舊制監察御史凡八員漢人四員皆進士而女直四員則文資右職參注守貞曰監察乃清要之職流品自異俱宜一體純用進士一日奏事次上問司吏移轉事守貞曰今吏權重而積弊深移轉為便上嘗嘆文士卒無如党懷英者守貞奏進士中若趙渢王庭筠甚有時譽上曰出倫者難得耳守貞曰間世之才自古所難然國家培養久則人材將自出矣守貞因言國家選舉之法惟女直漢人進士得人居多此舉更宜增取其諸司局承應人舊無出身大定後才許使經童之科古不常設唐以諸道表薦或取五人至十人近代以為無補罷之本朝皇統間取及五十人因為常選天德間尋以停罷陛下即位復立是科朝廷寬大放及百數誠恐積久不勝銓擬宜稍裁減以清流品又言節用省費之道並嘉納焉先是鄭王允蹈等伏誅上以其家産均給諸王戶部郎中李敬義言恐因之生事上又以董壽為宮籍監都管勾並下尚書省議守貞奏陛下欲以允蹈等家産分賜懿親恩命已出恐不可改今已減諸王弓矢府尉司其出入臣以為賜之無害如董壽罪人也特恩釋之已為幸矣不宜更加爵賞上是守貞所言自明昌初北邊屢有警或請出兵擊之上曰今方南議塞河而復用兵於北可乎守貞曰彼屢突軼吾圉今一懲之後當不復來明年可以見矣上因論守禦之法守貞曰惟有皇統以前故事捨此無法耳守貞讀書通法律明習國朝故事時金有國七十年禮樂刑政因遼宋舊制雜亂無貫章宗即位乃更定修正為一代法其儀式條約多守貞裁訂故明昌之治號稱清明又喜推轂善類接援後進朝廷正人多出入門下先是上以疑忌誅鄭王允蹈後張汝弼妻高陀斡獄起意又若在鎬王允中時右諫議大夫賈守謙上疏陳時事思有以寬解上意右拾遺路鐸繼之言尤切直帝不悅守貞持其事獄久不決帝疑有黨乃出守貞知濟南府事仍命即辭前舉守貞者董師中路鐸等皆補外上語宰臣曰守貞固有才力至其讀書方之真儒則未也然太邀權譽以彼之才而能平心守正朝廷豈可少離今茲令出蓋思之熟矣俄以在政府日嘗與近侍竊語宮掖事而妄稱奏下上命有司鞫問守貞款伏奪官一階解職遣中使持詔責諭之曰挾姦罔上古有常刑結援養交臣之大戒孰謂豫相乃蹈厥辜爾本出勳門寖登膴仕朕初嗣位亟欲用卿未閲歲時升為宰輔每期納誨共致太平蓋求所長不考其素拔擢不為不峻任用不為不專曾報效之弗思輒私權之自樹交通近侍密問起居窺測上心預圖趨向繇患失之心重故欺君之罪彰指所無之事而妄以肆誣實未始有言而謂之嘗諫義豈知於歸美意專在於要君其飾詐之若然豈為臣之當耳復觀彈奏益見私情求親識之援而列布宮中縱罪廢之餘而出入門下而又凡有官使斂為己恩謂皆涉於回邪不宜任之中外質之清議固所不容揆之乃心烏得無愧姑從輕典庸示薄懲仍以守貞不公事宣諭百官於尚書省承安元年降授河中防禦使五年改部羅火扎石合節度使過闕上賜手詔責諭之令赴職久之遷知都府事時南鄙用兵上以山東重地須大臣安撫乃移知濟南府卒上聞而悼之敕有司致祭賻贈禮物依故平章政事蒲察通例諡曰肅守貞剛直明亮凡朝廷論議及上有所問皆傅經以對上嘗與泛論人材守貞乃迹其心術行事臧否無少隱故為胥持國輩所忌竟以直罷後趙秉文由外官入翰林遽上書言願陛下進君子退小人上問君子小人謂誰秉文對君子故相完顏守貞小人今參知政事胥持國其為天下推重如此守能本名胡剌纍官商州刺史正隆末宋人陷商州守能被執大定五年宋人請和誓書曰俘虜之人盡數發還完顏仲為報問國信使求守能及新息縣令完顏按辰於宋遂與俱歸守能等至京師入見詔給舊官之俸大定十九年為西北路招討使是時詔徙窩斡餘黨于臨潢泰州押剌民列嘗從窩斡其弟閘敵也當徙僞稱身亡以馬賂守能固匿不遣及受賕補賽也蕃部通事事覺是時烏古里石壘部族節度副使奚沙阿補杖殺無罪鎮邊猛安尚書省俱奏其事上曰守能由刺史超擢至此敢恣貪墨向者招討司官多進良馬橐駝鷹鶻等物蓋假此以率斂爾自今並罷之因責其兄守道曰守能自刺史躐遷招討外官之尊無以踰此前招討哲典以貪墨伏誅守能豈不知乃敢如此其意安在爾之親弟何不先訓戒之也上謂宰臣曰監察專任糾彈宗州節度使阿思悶初之官途中侵擾百姓到官舉動皆違法度完顏守能為招討使貪冒狼籍凡達官貴人皆未嘗舉劾斡睹只羣牧副使僕散那也取部人毬杖兩枝即便彈奏自今監察御史職事修舉然後遷除不舉職者大則降罰小則決責仍不得去職尚書省奏守能兩贓俱不至五十貫抵罪奚沙阿補解見居官並解世襲謀克上曰此舊制之誤居官犯除名者與世襲併罷之非犯除名者勿罷遂著于令特詔守能杖二百除名贊曰阿離合悶之善頌宗雄之強識希尹之敏學益之以征伐之功豈不偉哉
