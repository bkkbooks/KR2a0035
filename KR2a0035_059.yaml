body:
  text: 金史卷五十九表第一宗室表古者太史掌邦國之世次辨其姓氏別其昭穆尚矣金人初起完顏十二部其後皆以部為氏史臣記録有稱宗室者有稱完顏者稱完顏者亦有二焉有同姓完顏蓋疏族若石土門迪古乃是也有異姓完顏蓋部人若歡都是也大定以前稱宗室明昌以後避睿宗諱稱內族其實一而已書名不書氏其制如此宣宗詔宗室皆稱完顏不復識別焉大定泰和之間袒免以上親皆有屬籍以授官大功以上薨卒輟朝親親之道行焉貞祐以後譜牒散失大概僅存不可殫悉今掇其可次第者著于篇其上無所係下無所承者不能盡録也右諸宗室可譜者凡十一族雖稱係出某帝而不能世次不譜于各帝之下所以慎也
