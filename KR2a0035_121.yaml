body:
  text: 金史卷一百二十一列傳第五十九忠義一胡沙補特虎僕忽得粘割韓奴曹圭溫迪罕蒲睹訛里也納蘭綽赤魏全鄯陽夾谷守中石抹元毅伯德梅和尚烏古孫兀屯高守約和速嘉安禮王維翰移剌古與涅宋扆烏古論榮祖烏古論仲溫九住李演劉德基王毅王晦齊鷹揚术甲法心高錫欒共子曰民生於三事之如一唯其所在則致死焉公卿大夫居其位食其祿國家有難在朝者死其官守郡邑者死城郭治軍旅者死行陳市井草野之臣發憤而死皆其所也故死得其所則所欲有甚於生者焉金代褒死節之臣既贈官爵仍録用其子孫貞祐以來其禮有加立祠樹碑歲時致祭可謂至矣聖元詔修遼金宋史史臣議凡例凡前代之忠於所事者請書之無諱朝廷從之烏呼仁哉聖元之為政也司馬遷記豫讓對趙襄子之言曰人主不掩人之美而忠臣有成名之義至哉斯言聖元之為政足為萬世訓矣作忠義傳胡沙補完顏部人年三十五從軍頗見任用太祖使僕刮剌往遼國請阿踈實觀其形勢僕刮剌還言遼兵不知其數太祖疑之使胡沙補往還報曰遼方調兵尚未大集及見統軍使其孫被甲立於傍統軍曰人謂汝輩且反故為備耳及行道中遇渤海軍渤海軍向胡沙補且笑且言曰聞女直欲為亂汝輩是邪具以告太祖又曰今舉大事不可後時若俟河凍則遼兵盛集來攻矣乘其未集而早伐之可以得志太祖深然之及破寧江州戰于達魯古城皆有功賜以旗鼓並御器械高永昌請和胡沙補往招之取胡突古以歸高永昌詐降于斡魯斡魯使胡沙補撒八往報會高楨降言永昌非真降者斡魯乃進兵永昌怒遂殺胡沙補撒八皆支解之胡沙補就執神色自若罵永昌曰汝叛君逆天今日殺我明日及汝矣罵不絶口至死年五十九天會中與撒八俱贈遙鎮節度使特虎雅撻瀾水人軀幹雄偉敢戰鬬達魯古城之役活女陷敵特虎救出之攻照散城遼兵三千來拒特虎先登敗之攻盧葛營麻吉墮馬特虎獨殺遼兵數輩掖而出之賞賚逾渥自臨潢班師至遼河余睹來襲婁室已引去特虎獨殿馬憊乃步鬬婁室與數騎來救特虎止之曰我以一死捍敵公勿來俱斃無益遂沒于陳皇統間贈明威將軍僕忽得宗室子初事國相撒改伐蕭海里有功與酬斡俱招降燭偎水部族酬斡為謀克僕忽得領行軍千戶從破黃龍府戰于達魯古城皆有功寧江州渤海乙塞補叛僕忽得追復之天輔五年九月酬斡僕忽得往鱉古河籍軍馬燭偎水部實里古達等七人殺酬斡僕忽得投其尸水中俱年四十三太祖悼惜遣使弔賻加等六年正月斡魯伐實里古達于石里罕河追及於合撻剌山殺四人撫定餘衆詔斡魯求酬斡僕忽得尸以葬天眷中贈酬斡奉國上將軍僕忽得昭義大將軍酬斡亦宗室子也年十五隸軍從太祖伐遼率濤溫路兵招撫三坦石里很跋苦三水鱉古城邑皆降之敗室韋五百于阿良葛城獲其民衆至是死焉粘割韓奴以護衛從宗弼征伐賜鎧甲弓矢戰馬初太祖入居庸關遼林牙耶律大石自古北口亡去以其衆來襲奉聖州壁于龍門東二十五里婁室往取之獲大石並降其衆宗望襲遼主輜重于青冢以大石為鄉導詔曰遼趙王習泥烈林牙大石北王喝里質節度使訛里剌孛堇赤狗兒招討迪六詳穩六斤同知海里及諸官民並釋其罪復詔斡魯曰林牙大石雖非降附其為鄉導有勞可明諭之時天輔六年也既而亡去不知所往天會二年遼詳穩撻不野來降言大石稱王於北方署置南北面官僚有戰馬萬匹畜産甚衆詔曰追襲遼主必酌事宜而行攻討大石須俟報下三年都統完顏希尹言聞夏人與耶律大石約曰大金既獲遼主諸軍皆將歸矣宜合兵以取山西諸部詔答曰夏人或與大石合謀為釁不可不察其嚴備之七年泰州路都統婆盧火奏大石已得北部二營恐後難制且近羣牧宜列屯戍詔答曰以二營之故發兵諸部必擾當謹斥候而已八年遣耶律余睹石家奴拔離速追討大石徵兵諸部諸部不從石家奴至兀納水而還余睹報元帥府曰聞耶律大石在和州之域恐與夏人合當遣使索之夏國報曰小國與和州壤地不相接且不知大石所往也皇統四年回紇遣使入貢言大石與其國相鄰大石已死詔遣韓奴與其使俱往因觀其國風俗加武義將軍奉使大石韓奴去後不復聞問大定中回紇移習覽三人至西南招討司貿易自言本國回紇鄒括番部所居城名骨斯訛魯𩽆俗無兵器以田為業所獲十分之一輸官耆老相傳先時契丹至不能拒因臣之契丹所居屯營乘馬行自旦至日中始周匝近歲契丹使其女壻阿本斯領兵五萬北攻葉不輦等部族不克而還至今相攻未已詔曰此人非隸朝廷番部不須發遣可於咸平府舊有回紇人中安置毋令失所是歲粘拔恩君長撒里雅寅特斯率康里部長孛古及戶三萬餘求內附乞納前大石所降牌印受朝廷牌印詔西南招討司遣人慰問且觀其意禿里余睹通事阿魯帶至其國見撒里雅具言願歸朝廷乞降牌印無他意也因曰往年大國嘗遣粘割韓奴自和州往使大石既入其境大石方適野與韓奴相遇問韓奴何人敢不下馬韓奴曰我上國使也奉天子之命來招汝降汝當下馬聽詔大石曰汝單使來欲事口舌耶使人捽下使韓奴跪韓奴罵曰反賊天子不忍於爾加兵遣招汝爾縱不能面縛請罪闕下亦當盡敬天子之使乃敢反加辱乎大石怒乃殺之此時大石林牙已死子孫相繼西方諸部仍以大石呼之余睹阿魯帶還奏並奏韓奴事世宗嘉韓奴忠節贈昭毅大將軍召其子永和縣商酒都監詳古汝州巡檢婁室諭之曰汝父奉使萬里不辱君命能盡死節朕甚閔之以詳古為尚輦局直長遷武義將軍婁室為武器署直長曹圭徐州人大定四年州人江志作亂圭子弼在賊黨中圭謀誅志並弼殺之尚書省議當補二官雜班詔曰圭赤心為國大義滅親自古罕聞也法雖如是然未足以當其功更進一官正班用之溫迪罕蒲睹為兀者羣牧使西北路契丹撒八等反諸羣牧皆應之蒲睹聞亂作選家奴材勇者數十人給以兵仗陰為之備賊不得發乃紿諸奴曰官閲兵器願借兵仗以應閲諸奴以為實然遂借與之明旦賊至蒲睹無以禦之賊執蒲睹而問之曰今欲反未蒲睹曰吾家世受國厚恩子姪皆仕宦不能從汝反而纍吾族也賊怒臠而殺之子與孫皆與害是時迪斡羣牧使徒單賽里副使赤盞胡失答耶魯瓦羣牧使鶴壽歐里不羣牧使完顏术里骨副使完顏辭不失卜迪不部副使赤盞胡失賴速木典辭詳穩加古買住胡睹辭詳穩完顏速沒葛轄木辭詳穩高彭祖等皆遇害鶴壽鄆王昂子本名吾都不五院部人老和尚率衆來招鶴壽與俱反鶴壽曰吾宗室子受國厚恩寧殺我不能與賊俱反遂與二字皆被殺訛里也契丹人為尚局直長大定初招諭契丹窩斡叱令訛里也跪見訛里也不從謂曰我朝廷使也豈可屈節於汝汝等早降可全性命若大軍至汝輩悔將何及窩斡怒曰汝本契丹人而不我從敢出是言遂害之從行驍騎軍士閏孫史大習馬小底頗答皆被害三年贈訛里也宣武將軍録其子阿不沙為外帳小底閏孫史大皆贈修武校尉頗答贈忠翊校尉納蘭綽赤咸平路伊改河猛安人契丹括里使人招之綽赤不從括里兵且至綽赤遂團結旁近村寨為兵出家馬百餘匹給之教以戰陳擊刺之法相與拒括里于伊改渡口由是賊衆月餘不得進既而括里兵四萬人大至綽赤拒戰賊兵十倍遂見執臠而殺之詔贈官兩階二子皆得用廕魏全壽州人泰和六人宋李爽圍壽州刺史徒單羲盡籍城中兵民及部曲厮役得三千餘人隨機拒守堅甚羲善撫御得衆情雖婦人皆樂為用同知蒲烈古中流矢卒羲益勵不衰募人往斫爽營全在選中為爽兵所執爽謂全曰若為我罵金主免若死全至城下反罵宋主爽乃殺之至死罵不絶口僕散揆遣河南統軍判官乞住及買哥等以騎二千人救壽州去壽州十餘里與爽兵遇乞住分兩翼夾擊爽兵大破之斬首萬餘級追奔至城下拔其三柵焚其浮梁羲出兵應之爽兵大潰赴淮死者甚衆爽與其副田林僅脫身去餘兵脫者十之四詔遷羲防禦使乞住同知昌武軍節度使事買哥河南路統軍判官贈蒲烈古昭勇大將軍官其子圖剌贈全宣武將軍蒙城縣令封其妻為鄉君賜在州官舍三間錢百萬俟其子年至十五歲收充八貫石正班局分承應用所贈官蔭仍以全死節送史館鏤版頒諭天下鄯陽宗室子為符寶祗候完顏石古乃為護衛十人長至寧元年八月紇石烈執中作亂入自通玄門是日變起倉猝中外不知所為鄯陽石古乃往天王寺召大漢軍五百人赴難與執中戰於東華門外執中揚言曰大漢軍反矣殺一人者賞銀一定執中兵衆大漢軍少二人不勝而死須臾執中兵殺五百人殆盡執中死詔削官爵詔曰宣武將軍護衛十人長完顏石古乃修武校尉符寶祗候鄯陽忠孝勇果沒于王事石古乃贈鎮國上將軍順州刺史鄯陽贈宣武將軍順天軍節度副使嘗從拒戰猛安賞錢五百貫謀克三百貫蒲輦散軍二百貫各遷兩階戰沒者贈賞付其家石古乃子尚幼以八貫石俸給之俟年十五以聞夾谷守中咸平人本名阿土古大定二十二年進士歷清池聞喜主簿補尚書省令史除刑部主事監察御史修起居注轉禮部員外郎大名治中歷嵩琢北京臨洮路按察副使以憂去官起復同知曷懶路兵馬都總管府事坐事謫韓州刺史尋復同知平涼府事大安二年為秦州防禦使遷通遠軍節度使至寧末移彰化軍未行夏兵數萬入鞏州守中乘城備守兵少不能支城陷官吏盡降守中獨不屈夏人壯之且誘且脅守中益堅遂載而西至平涼要以招降府人守中佯許至城下即大呼曰外兵矢盡且遁矣慎勿降夏人交刃殺之興定元年監察御史郭著按行秦中得其事以聞詔贈資善大夫東京留守仍收其子兀母為筆硯承奉石抹元毅本名神思咸平府路酌赤烈猛安莎果歌仙謀克人也以廕補吏部令史再調景州寧津令有劇盜白晝恣劫為民害元毅以術防捍賊散去入為大理知法除同知亳州防禦使事被省檄録陝右五路刑獄無寃人復委受宋歲幣故事有私遺物元毅一無所受明昌初驛召為大名等路提刑判官以最遷汾陽軍節度副使時石嵐間賊黨嘯聚肆行剽掠朝廷命元毅捕之賊畏而遁元毅追襲盡殪之二境以安遷同知武勝軍節度使事別郡有殺人者屢鞫不伏元毅訊不數語即具服河東北路田多山坂磽瘠大比時定為上賦民力久困朝廷命相地更賦元毅以三壤法平之民賴其利改彰德府治中尋以邊警授撫州刺史會邊將失守芻糧馬牛焚剽殆盡元毅率吏卒三十餘人出州經畫軍餉卒與敵遇州倅暨從吏堅請還元毅曰我輩責任邊守遇敵而奔其如百姓何縱得自安復何面目見朝廷乎遂執弓矢令衆衆感其忠爭為效死元毅力戰射無不中敵去而復合元毅氣愈厲鏖戰久之衆寡不敵遂遇害時年四十七事聞上深驚悼贈信武將軍召用其子世績侍儀司承應世績後登進士第奏名之日上謂宰臣曰此神思子耶歎賞者久之元毅性沈厚武勇過人每讀書見古人忠義事未嘗不嗟歎賞慕喜動顏色故臨難能死所事云伯德梅和尚泰州人也性鯁直尚氣節正隆五年收充護衛授曷魯碗羣牧副使未幾復召為護衛十人長改尚局副使遷本局使轉右衛將軍拱衛使典尚者十餘年積勞特遷官二階除復州刺史明昌初為西北路副招討改秦州防禦使升武勝軍節度使六年移鎮崇義軍時有事北邊左丞相夾谷清臣行省于臨潢檄為副統會敵入臨潢梅和尚暨護衛闢合土等領軍逆擊之敵積陳以待梅和尚直搗其陳殺傷甚衆敵知孤軍無繼聚兵圍之度不能免乃下馬相背射復殺百餘人矢盡猶以弓提擊為流矢所中死闢合土等皆沒上聞之震悼詔贈龍虎衛上將軍躐遷十階特賜錢二十萬命以禮葬之物皆官給以其子都奴為軍前猛安中奴護喪就差權同知臨潢府事李達可為敕祭使同知德昌軍節度使事石抹和尚為敕葬使承安五年上諭尚書省曰梅和尚死王事其子都奴從軍久有功其議所以酬之乃命為典署丞烏古孫兀屯上京路人大定末襲猛安明昌七年以本兵充萬戶備邊有功除歸德軍節度副使改盤安軍察廉遷同知速頻路節度使事以憂去官起復歸德府治中遷唐州刺史泰和六年四月宋皇甫斌步騎萬人侵唐州兀屯兵甚少遣泌陽尉白撒不巡檢蒲間各以五十人乘城拒守兀屯見宋兵在城東北者可破令軍事判官撒虎帶以精兵百人自西門出繞出東北宋兵營後掩擊之殺數十百人宋兵大亂逮夜乃遁去五月皇甫斌復以兵數萬來攻行省遣泌陽副巡檢納合軍勝救唐州兀屯出兵與軍勝合兵城東北設伏兵以待之乃分騎兵為三一出一入以致宋兵宋兵陷于淖伏兵發中衝宋兵為二遂大潰追奔至湖陽斬首萬餘級獲馬三百匹宋別將以兵三千來襲遇之竹林寺殪之納合軍勝手殺宋將取其金帶印章以獻詔遷兀屯同知河南府事軍勝遷梁縣令各進兩階兀屯賞銀三百五十兩重綵十端為右副元帥完顏匡右翼都統匡取棗陽遣兀屯襲神馬坡宋兵五萬人夾水陳以強弩拒岸兀屯分兵奪其三橋自辰至午連拔十三柵遂取神馬坡從攻襄至漢江兀屯亂流徑度復進一階號平南虎威將軍宋人請和遷河南副統軍大安初遷昌武軍節度使副統軍如故遷西南路招討使兀屯御下嚴酷軍士多亡杖六十除同知上京留守事大安三年將兵二萬入衛中都遷元帥右都監轉左都監兼北京留守有功賜金吐鶻重綵十端遷元帥左監軍留守如故貞祐元年閏月以兵入衛中都詔以兵萬六千人守定興軍敗兀屯戰沒高守約字從簡遼陽人大定二十八年進士纍官觀州刺史大元兵徇地河朔郭邦獻已歸順從至城下呼守約曰從簡當計全家室守約弗顧至再三守約厲聲曰吾不汝識也城破被執使之跪守約不屈遂死詔贈崇義軍節度使諡忠敬和速嘉安禮字子敬本名酌大名路人穎悟博學淹貫經史大定二十八年進士至寧末為泰安州刺史貞祐初山東被兵郡縣望風而遁或勸安禮去之安禮曰我去城誰與守且避難負國家之恩乎乃團練繕完為禦守計已而大元兵至戰旬日不能下謂之曰此孤城耳內無糧儲外無兵援不降無遺類矣安禮不聽城破被執初不識其為誰或妄以酒監對安禮曰我刺史也何以諱為使之跪安禮不屈遂以戈撞其胸而殺之詔贈泰定軍節度使諡堅貞王維翰字之翰利州龍山人父庭遼季率縣人保縣東山後以衆降維翰好學不倦中大定二十八年進士調貴德州軍事判官察廉遷永霸令縣豪欲嘗試維翰設事陳訴維翰窮竟之遂伏其詐杖殺之健訟衰息歷弘政獲嘉令佐胥持國治河決有勞遷一階改北京轉運戶籍判官補尚書省令史除同知保靜軍節度使事檢括戶籍一郡稱平屬縣有奴殺其主人者誣主人弟殺之刑部疑之維翰審讞乃微行物色之得其狀奴遂引服改中都轉運副使攝侍御史奏事殿中章宗曰佳御史就除侍御史改左司員外郎轉右司郎中僕散揆伐宋維翰行省左右司郎中泰和七年河南旱蝗詔維翰體究田禾分數以聞七月雨復詔維翰曰雨雖霑足秋種過時使多種蔬菜猶愈於荒萊也蝗蝻遺子如何可絶舊有蝗處來歲宜菽麥諭百姓使知之八年宋人受盟還為右司郎中進官一階上問宋人請和復能背盟否維翰對曰宋主怠于政事南兵佻弱兩淮兵後千里蕭條其臣懲韓托胄蘇師旦無復敢執其咎者不足憂也唯北方當勞聖慮耳久之遷大理卿兼潞王傅同知審官院事新格教坊樂工階至四品換文武正資服金紫維翰奏伶優賤工衣縉紳之服非所以尊朝廷也從之大安初權右諫議大夫三司欲稅間架維翰諫不聽轉御史中丞無何遷工部尚書兼大理卿改刑部尚書拜參知政事貞祐初罷為定海軍節度使是時道路不通維翰舟行遇盜呼謂之曰爾輩本良民因亂至此財物不惜勿恐吾家盜感其言而去至鎮無兵備鄰郡皆望風奔潰維翰謂吏民曰孤城不可守此州阻山浮海當有生地無俱為魚肉也乃縱百姓避難維翰率吏民願從者奔東北山結營堡自守力窮被執不肯降妻姚氏亦不肯屈與維翰俱死詔贈中奉大夫姚氏芮國夫人諡貞潔移剌古與涅安化軍節度使貞祐初大元兵取密州古與涅率兵力戰流矢連中其頸既拔去復中其頰死焉貞祐三年詔贈安遠大將軍知益都府事宋扆中都宛平人也正隆五年進士歷辰州寧化州軍事判官曹王府記室參軍陝西西路轉運都勾判官補尚書省令史除武定軍節度副使中都右警巡使時固安縣丞劉昭與部民裴原爭買鄰田扆用昭屬抑原使毋爭御史臺劾奏奪一官解職降廣寧府推官改遼東路鹽使丁父憂起復吏部員外郎歷薊曹景州刺史同知中都路轉運使事遷北京臨潢等路按察使改安國軍節度使河東南路轉運使御史劾其前任按察侵民舍不稱職降沂州防禦使移濬州遷山東西路轉運使改定海軍節度使貞祐二年改沁南軍正月大元兵至懷州城破死焉扆天資刻酷所至不容物以是蹭蹬於世云烏古論榮祖本名福興河間人明昌二年進士歷官補尚書省令史除都轉運司都勾判官轉弘文校理升中都總管府判官察廉除震武軍節度副使彰德府司馬纍遷戶部員外郎寧海州刺史貞祐二年城破榮祖猶力戰死之贈安武軍節度使賜諡毅勇烏古論仲溫本名胡剌蓋州按春猛安人大定二十五年進士纍官太學助教應奉翰林文字河東路提刑判官改河北東路轉運副使御史薦前任提刑稱職遷同知順天軍節度使事簽上京東京等路按察司事改提舉肇州漕運兼同知武興軍節度使事東勝州刺史坐前在上京不稱職降鎮寧軍節度副使改滑州刺史河東南路按察副使壽州防禦使貞祐初遷鎮西軍節度使是時中都被圍遂至太原移書安撫使賈益謙約以鄉兵救中都因馳驛如平陽將與益謙會于絳不能進抵平陽而還仲溫嘗治平陽吏民爭留之仲溫曰平陽巨鎮易為守禦於私計得矣如嵐州何遂還鎮已而大元兵大至城破不屈而死贈資德大夫婆速路兵馬都總管諡忠毅歲時致祭九住宗室子為武州刺史唐括孛果速為軍事判官貞祐二年十一月大元兵取九住子姪抵城下謂之曰山東河北今皆降我汝之家屬我亦得已苟不速降且殺之也九住曰當以死報國遑恤家為無何城破力戰而死孛果速亦不屈死焉詔贈九住臨海軍節度使加驃騎衛上將軍孛果速建州刺史加鎮國上將軍仍令樹碑歲時致祭李演字巨川任城人泰和六年進士第一除應奉翰林文字再丁父母憂居鄉里貞祐初任城被兵演墨衰為濟州刺史畫守禦策召集州人為兵搏戰三日衆皆市人不能戰逃散演被執大將見其冠服非常且知其名問之曰汝非李應奉乎演答曰我是也使之跪不肯以好語撫之亦不聽許之官祿演曰我書生也本朝何負於我而利人之官祿哉大將怒擊折其脛遂曳出殺之時年三十餘贈濟州刺史詔有司為立碑云劉德基大興人貞祐元年特賜同進士出身守官邊邑夏兵攻城德基坐廳事積薪其傍謂家人曰城破即焚我及城破其家人不忍縱火遂被執脅使跪降德基不屈同僚故人紿夏人曰此人素病狂故敢如此德基曰為臣子當如此爾吾豈狂耶夏人壯其義乃繫諸獄冀其改圖已而召問德基大罵終不能從曰吾豈苟生者哉遂害之贈朝列大夫同知通遠軍節度使事王毅大興人經義進士纍官東明令貞祐二年東明圍急毅率民兵願戰者數百人拒守城破毅猶率衆抗戰力窮被執與縣人王八等四人同驅之郭外先殺二人王八即前跪將降毅以足踣之厲聲曰忠臣不佐二主汝乃降乎驅毅者以刃斫其脛毅不屈而死贈曹州刺史王晦字子明澤州高平人少負氣自喜常慕張詠之為人友妻與人有私晦手刃殺之中明昌二年進士調長葛主簿有能聲察廉除遼東路轉運司都勾判官提刑司舉其能轉北京轉運戶籍判官遷安陽令纍除簽陝西西路按察司事改平涼治中召為少府少監遷戶部郎中貞祐初中都戒嚴或舉晦有將帥才俾募人自將得死士萬餘統之率所統衛送通州粟入中都有功遷霍王傅以部兵守順州通州圍急晦攻牛欄山以解通州之圍賜賚優渥遷翰林侍讀學士加勸農使九月順州受兵晦有別部在滄景遣人突圍召之衆皆踊躍思奮而主者不肯發王臻晦之故部曲也免胄出見且拜曰事急矣自苦何為苟能相從可不失富貴晦曰朝廷何負汝耶臻曰臻雖負國不忍負公因泣下晦叱曰吾年六十致位三品死則吾分詎從汝耶將射之臻掩泣而去無何將士縋城出降晦被執不肯降遂就死初晦就執謂其愛將牛斗曰若能死乎曰斗蒙公見知安忍獨生併見殺詔贈榮祿大夫樞密副使仍命有司立碑歲時致祭録其子汝霖為筆硯承奉齊鷹揚淄州軍事判官楊敏中屯留縣尉致仕張乞驢淄州民貞祐初大元兵取淄州鷹揚等募兵備禦城破率衆巷戰鷹揚等三人創甚被執欲降之鷹揚伺守者稍怠即奪槊殺數人與敏中乞驢皆不屈以死詔贈鷹揚嘉議大夫淄州刺史仍立廟于州以時致祭敏中贈昭勇大將軍同知橫海軍節度使事乞驢特贈宣武將軍同知淄州軍州事术甲法心薊州猛安人官至北京副留守貞祐二年為提控與同知順州軍州事溫迪罕咬查剌俱守密雲縣法心家屬在薊州大元兵得之以示法心曰若速降當以付汝否則殺之法心曰吾事本朝受厚恩戰則速戰終不能降也豈以家人死生為計耶城破死于陳咬查剌被執亦不屈而死盤安軍節度判官蒲察辭舍與雞澤縣令溫迪罕十方奴同守薊州衆潰而出辭舍十方奴死之詔贈法心開府儀同三司樞密副使封宿國公咬查剌鎮國上將軍順州刺史辭舍金紫光祿大夫薊州刺史十方奴鎮國上將軍薊州刺史仍命樹碑以時致祭高錫字永之德基子以廕補官積勞調淄州酒使課最遷平鄉令察廉遷遼東路轉運支度判官太倉使法物庫使兼尚林署直長提舉都城所歷北京遼東轉運副使同知南京路轉運使事貞祐初纍遷河北東路按察轉運使城破遂自投城下而死
