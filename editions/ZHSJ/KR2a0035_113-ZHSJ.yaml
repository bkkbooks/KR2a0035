body:
  text: 金史卷一百十三列傳第五十一完顏賽不白撒一名承裔赤盞合喜完顏賽不始祖弟保活里之後也狀貌魁偉沉厚有大略初補親衞軍章宗時選充護衞明昌元年八月由宿直將軍為寧化州刺史未幾遷武衞軍副都指揮使泰和二年轉胡里改路節度使四年升武衞軍都指揮使尋為殿前左副都點檢及平章僕散揆伐宋為右翼都統六年六月宋將皇甫斌遣率步騎數萬由確山褒信分路侵蔡聞郭倬李爽之敗阻溱水不敢進於是揆遣賽不及副統尚局使蒲鮮萬奴深州刺史完顏達吉不等以騎七千往擊之會溱水漲宋兵扼橋以拒賽不等謀潛師夜出達吉不以騎涉水出其右萬奴等出其左賽不度其軍畢渡乃率副統阿魯帶以精兵直趨橋宋兵不能遏比明大潰萬奴以兵斷真陽路諸軍追擊至陳澤斬首二萬級獲戰馬雜畜千餘兵還進爵一級賜金幣甚厚貞祐初拜同簽樞密院事三年遷知臨洮府事兼陝西路副統軍上召見諭曰卿向在西京盡心為國及治華州亦嘗宣力今始及三品特升授汝此職者以陝西安撫副使烏古論兗州不遵安撫使達吉不節制多致敗事今已責罰兗州命卿副之宜益務盡心其或不然復當別議行之八月知鳳翔府事兼本路兵馬都總管俄為元帥右都監四年四月調兵拔宋木陡關五月夏人於來羌城界河修折橋以兵守護賽不遣兵焚之八月夏人寇結耶觜川遣兵擊走之尋又破其衆于車兒堡興定元年二月轉簽樞密院事時上以宋歲幣不至且復侵盜詔賽不討之四月與宋人戰於信陽斬首八千生擒統制周光獲馬數千牛羊五百又遇宋人於隴山七里山等處前後六戰斬獲甚眾尋遣兵渡淮略中渡店拔光山羅山定城等縣破光州兩關斬首萬餘獲馬牛及布分給將士詔賜玉兔鶻一內府重幣十端七月上章言京都天下之根本其城池宜極高深今外城雖堅然周六十餘里倉猝有警難於拒守竊見城中有子城故基宜於農隙築而新之為國家久長之利及凡河南陝西州府皆乞量修從之二年正月破宋人於鐵山及上石店唐縣四月進兼西南等路招討使西安軍節度使陝州管內觀察使奉詔攻棗陽宋出兵三萬拒戰稍誘擊之宋兵敗走城薄諸濠殺及溺死者三千餘人遂進兵圍之宋騎兵千步卒萬來援逆戰復大敗之七月遷行山東西路兵馬都總管兼武寧軍節度使三年二月奪宋白石關殺其守者千餘人獲鎧仗千計三月破宋兵於七口倉又奪宋小鶻倉獲糧九千石兵仗三十餘萬是月復敗宋兵三千于石鶻崖四年三月奉詔出兵河北招降晉安權府事皇甫珪正平縣令席永堅率五千餘人來歸得糧萬石時河北所在義軍官民堅守堡寨力戰破敵者眾賽不上章言此類忠赤可嘉若不旌酬無以激人心乞朝廷量加官賞萬一敵兵復來將爭先効用矣上覽奏召樞密官曰朕與卿等亦嘗有此議以不見彼中事勢故一聽帥臣規畫今觀此奏甚稱朕意其令有司遷賞之是年四月遷樞密副使五年五月奉詔引兵救河東戰屢捷復晉安平陽二城監察御史言其不能檢束士衆縱之虜略請正其罪上以有功詔勿問元光二年五月復河中六月詔諭宰臣曰樞密副使賽不本皇族先世偶然脫遺朕重其舊人且久勞王家已命睦親府附于屬籍矣卿等宜知之正大元年五月拜平章政事未幾轉尚書右丞相雅與參知政事李蹊相得及蹊以公罪出尹京洛賽不數薦蹊比唐魏徵以故蹊得復相三年宣宗廟成將禘祭議配享功臣論者紛紜賽不為大禮使因言丞相福興死王事七斤謹守河南以迎大駕功宜配享議遂定四年吏部郎中楊居仁上封事言宰相宜擇人上語大臣曰相府非其人御史諫官當言彼吏曹何與于此尚書左丞顏盞世魯素嫉居仁亦以為僭賽不徐進曰天下有道庶人猶得獻言況在郎官陛下有寬弘之德故不應言者猶言使其言可用則行之不可用不必示臣下也上是之居仁字行之大興人泰和三年進士天興末時北渡舉家投黃河死五年行尚書省于京兆謂都事商衡曰古來宰相必用文人以其知為相之道賽不何所知使居此位吾恐他日史官書之某時以某為相而國乃亡即促衡草表乞致仕平章政事侯摯朴直無蘊藉朝廷鄙之天興元年兵事急自致仕起為大司農未幾復致仕徐州行尚書省無敢行者復拜摯平章政事都堂會議摯以國勢不支因論數事曰只是更無擘劃白撒怒曰平章出此言國家何望耶意在置之不測賽不顧謂白撒曰侯相言甚當白撒遂含憤而罷時大元兵薄汴白撒策後日講和或出質必首相當行力請賽不領省事拜為左丞相尋復致仕是年冬哀宗遷歸德起復為右丞相樞密使兼左副元帥封壽國公扈從以行河北兵潰從至歸德又請致仕二年七月復詔行尚書省事於徐州既至以州乏糧遣郎中王萬慶會徐宿靈璧兵取源州令元帥郭恩統之九月恩至源州城下敗績而還再命卓翼攻豐縣破之初郭恩以敗為恥託疾不行乃密與河北諸叛將郭野驢輩謀歸國用安執元帥商瑀父子元帥左都監紇石烈善住倂殺之又逐都尉斡轉留奴泥厖古桓端蒲察世謀元帥右都監李居仁員外郎常忠自是防城與守門者皆河北義軍出入自恣賽不先病疽久不視事重為賊黨所制束手聽命而已初源徐交攻郭野驢者每辭疾不行賽不遂授野驢徐州節度副使兼防城都總領實覊之也野驢既見徐州空虛乃約源州叛將麻琮內外相應十月甲申詰旦襲破徐州時蔡已被圍徐州將士以朝命阻絕且逼大兵議出降賽不弗從恐被執至是投河求死流三十餘步不沒軍士援出之又五日自縊于州第麻琮乃遣人以州降大元子按春正大中充護衞坐與宗室女姦杖一百收係居許州大兵至許按春開南門以降從攻京師曹王出質朝臣及近衞有從出者按春極口大罵以至指斥是冬復自北中逃廻詔令押入省問事情按春隨近侍登階作揮涕之狀詔問丞相云按春自北中來丞相好與問彼中息耗賽不附奏曰老臣不幸生此賊事至今日恨不手刃之忍與對面語乎十二月車駕東狩留後二相下開封擒捕斬之獄中贊曰賽不臨陣對壘既有將略洎秉鈞衡觀其救解楊居仁侯摯等言殊有相度按春之事尤有古人之風焉晚以老病受制叛臣致修匹夫匹婦之節此猶大厦將傾非一木之所能支也悲夫內族白撒名承裔末帝承麟之兄也系出世祖諸孫自幼為奉御貞祐間累官知臨洮府事兼本路兵馬都總管興定元年為元帥左都監行帥府事於鳳翔是年詔陝西行省伐宋白撒出鞏州鹽川遇宋兵于皂郊堡敗之又遇宋兵于天水軍掩擊宋兵大潰二年四月復敗宋兵至雞公山遂拔西和州毀其諸隘營屯遣合扎都統完顏習涅阿不率軍趨成州宋帥羅參政統制李大亨焚廬舍棄城遁留千餘人城守督兵赴之遂克焉獲糧七萬斛錢數千萬河池縣守將楊九鼎亦焚縣舍走保清野原統制高千據黑谷關甚固遣兵襲之千遁去獲糧二萬斛器械稱是因夷其險而還三年破虎頭關敗宋兵于七盤子雞冠關褒城縣官民自焚城宇遁因取其城興元府提刑兼知府事趙希昔聞兵將至率官民遁於是白撒遂取興元以駐兵焉命提控張秀華馳視洋州官民亦遁又取其城尋聞江之南三十里宋兵二千據山而陣遣提控唐括移失不擊走之行省以捷聞宣宗大悅進白撒官一階時朝議以蘭州當西夏之衝久為敵據將遣白撒復之白撒奏曰臣近入宋境略河池下鳳州破興元抵洋州而還經涉險阻數千里士馬疲弊未得少休而欲重為是舉甚非計也不若息兵養士以備從之未幾權參知政事行省事于平涼四年上言宋境山州宕昌東上拶一帶蕃族昔嘗歸附分處德順鎮戎之間其後有司不能存撫相繼亡去近聞復有歸心然不招之亦無由自至誠得其衆可以助兵寧謐一方臣以同知通遠軍節度使事烏古論長壽及通遠軍節度副使溫敦永昌皆本蕃屬且久鎮邊鄙深得彼心已命遣人招之其所遣及諸來歸者皆當甄奬請預定賞格以待之上是其言是年夏兵三萬由高峰嶺入寇定西州環城為柵白撒遣刺史愛申阿失剌與行軍提控烏古論長壽溫敦永昌出戰大敗之斬首千餘獲馬仗甚眾五年五月白撒言近詔臣遣官諭諸蕃族以討西夏臣即令臨洮路總管女奚烈古里間計約喬家丙令族首領以諭餘族又別遣權左右司都事趙梅委差官遙授合河縣尉劉貞同往撫諭未幾梅貞報溪哥城等處諸族與先降族共願助兵七萬八千餘人本國蕃族願助兵九千若更以官軍繼為聲援勝夏必矣臣已令古里間將鞏州兵三萬宜更擇勇略之臣副之梅貞等既悉事勢當假以軍前之職蕃僧納林心波亦招誘有功乞遷官授職以奬勵之上皆從其請元光元年二月行省上言近與延安元帥完顏合達納合買住議河北郡縣俱已殘毀陝西河南亦經抄掠比者西北二敵倂攻鄜延城邑隨陷惟延安孤墉僅得保全若今秋復至必長驅而深入雖京兆鳳翔慶陽平涼已各益軍而率皆步卒且相去闊遠卒難應援儻關中諸鎮不支則河南亦不安矣今二敵遠去西北少休宜乘此𨻶徑取蜀漢實國家基業萬全之計詔樞密議之先是夏兵數十萬分寇龕谷鄜延大通諸城上召白撒等授以方略命發兵襲其浮橋遂趨西涼別遣將取大通城出溪哥路略夏地白撒徐出鎮戎合達出環州以報三道之役白撒馳至臨洮遣總管女奚烈古里間積石州刺史徒單牙武各攝帥職率兵西入遇夏兵千餘於踏南寺擊走之夏人據大通城因圍之分兵奪其橋與守兵七千人戰大敗之幾殺其半入河死者不可計餘兵焚其橋西遁乃還軍攻大通克之斬首三千因招來諸寺族被脅僧俗人皆按堵如故以河梁既焚塞外地寒少草師遂還十二月行省言近有人自北來者稱國王木華里悉兵沿渭而西謀攻鳳翔鳳翔既下乃圖京兆京兆卒不可得留兵守之至春蹂踐二麥以困我未幾大兵果圍鳳翔帥府遣人告急臣以為二鎮脣齒也鳳翔蹉跌則京兆必危而陝右大震矣然平川廣野實騎兵馳騁之地未可與之爭鋒已遣提控羅桓將兵二千循南山而進伺𨻶攻其柵壘以紓城圍更乞發河南步騎以備潼關詔付尚書省樞密院議之二年冬哀宗即位邊事益急正大五年八月召白撒還朝拜尚書右丞未幾拜平章政事白撒居西垂幾十年當宋夏之交雖頗立微效皆出諸將之力然本恇怯無能徒以儀體為事性愎貪鄙及入為相專愎尤甚嘗惡堂食不適口每以家膳自隨國家顛覆初不恤也九年正月諸軍敗績於三峯山大兵與白坡兵合長驅趨汴令史楊居仁請乘其遠至擊之白撒不從且陰怒之遂遣完顏麻斤出邵公茂等部民萬人開短堤決河水以固京城功未畢而騎兵奄至麻斤出等皆被害丁壯無二三百人得反者壬辰棄衞州運守具入京初大兵破衞州宣宗南遷移州治於宜村渡築新城於河北岸去河不數步惟北面受敵而以石包之歲屯重兵於此大兵屢至不能近至是棄之隨為大兵所據甲午修京城樓櫓初宣宗以京城闊遠難守詔高琪築𩹉城公私力盡僅乃得成至是議所守朝臣有言𩹉城決不可守外城決不可棄大兵先得外城糧盡救絕走一人不出𩹉城或不測可用於是決計守外城時在城諸軍不滿四萬京城周百二十里人守一乳口尚不能徧故議避遷之民充軍又召在京軍官於上清宮平日防城得功者如內族按出虎大和兒劉伯綱等皆隨召而出截長補短假借而用得百餘人又集京東西沿河舊屯兩都尉及衞州已起義軍通建威得四萬人益以丁壯六萬分置四城每面別選一千名飛虎軍以專救應然亦不能軍矣三月京城被攻大臣分守四面白撒主西南受攻最急樓櫓垂就輒摧傳令取竹為護簾所司馳入城大索竟無所得白撒怒欲斬之員外郎張衮附所司耳語曰金多則濟矣胡不即平章府求之所司懷金三百兩徑往賂其家僮果得之已而兵退朝廷議罷白撒白撒不自安乃謂令史元好問曰我妨賢路久矣得退是幸為我撰乞致仕表頃之上已遣使持詔至其第令致仕既廢軍士恨其不戰誤國揚言欲殺之白撒懼一夕數遷上以親軍二百陰為之衞軍士無以泄其憤遂相率毀其別墅而去其黨元帥完顏斜捻阿不領本部軍戍汴聞之徑詣其所斬經其垣下者一人以鎮之是時速不木受等兵散屯河南汴城糧且盡累召援兵復無至者冬十月乃復起白撒為平章政事權樞密使兼右副元帥於是羣臣為上畫出京計以賽不為右丞相樞密使兼左副元帥內族訛出右副元帥兼樞密副使權參知政事李蹊兵部尚書權尚書左丞徒單百家元帥左監軍行總帥府事東面元帥高顯副以果毅都尉粘合咬住兵五千南面元帥完顏猪兒副以建威都尉完顏斡論出兵五千西面元帥劉益上黨公張開副以安平都尉紀綱軍五千北面元帥內族婁室副以振威都尉張閏軍五千中翼都尉賀都喜軍四千隸總帥百家都尉內族久住副都尉王簡總領王福胤神臂軍三千五百左翼元帥內族小婁室親衞軍一千右翼元帥完顏按出虎親衞軍一千總領完顏長樂副帥溫敦昌孫馬軍三百郡王王義深馬軍一百五十郡王范成進總領蘇元孫圭軍三千隸總帥百家飛騎都尉兼合里合總領术虎只魯歡總領夾谷得伯辤軍田眾家奴等百人及諸臣下發京師十二月甲辰車駕至黃陵岡白撒先降大兵兩寨得河朔降將上赦之授以印及金虎符羣臣議以河朔諸將前導鼓行入開州取大名東平豪傑當有響應者破竹之勢成矣溫敦昌孫曰太后中宮皆在南京北行萬一不如意聖主孤身欲何所為若往歸德更五六月不能還京不如先取衞州還京為便白撒奏曰聖體不便鞍馬且不可令大兵知上所在今可駐歸德臣等率降將往東平俟諸軍到可一鼓而下因而經略河朔且空河南之軍上以為然時上已遣官奴將三百騎探漚麻岡未還上將御船賜白撒劍得便宜從事決東平之策官奴還奏衞州有糧可取上召白撒問之白撒曰京師且不能守就得衞州欲何為耶以臣觀之東平之策為便上主官奴之議明年正月朔次黃陵岡是日歸德守臣以糧糗三百餘船來餉遂就其舟以濟南岸未濟者萬人大元將回古乃率四千騎追擊之賀都喜揮一黃旗督戰身中十六七箭軍殊死鬬得卒十餘人大兵少却上遣送酒百壺勞之須臾北風大作舟皆吹著南岸諸兵復擊之溺死者近千人元帥猪兒都尉紇石烈訛論等死之建威都尉完顏訛論出降於大元上於北岸望之震懼率從官為猪兒等設祭哭之皆贈官錄用其子姪斬訛論出二弟以徇遂命白撒攻衞州上駐兵河上留親衞軍三千護從都尉高顯步軍一萬元帥官奴忠孝軍一千郡王范成進王義深上黨公張開元帥劉益等軍總帥百家總之各賫十日糧聽承裔節制發自蒲城上時已遣賽不將馬軍北向矣白撒以三十騎追及謂賽不曰有旨令我將馬軍賽不謂上曰北行議已決不可中變上曰丞相當與平章和同完顏仲德持御馬銜苦諫曰存亡在此一舉衞州決不可攻上麾之曰參政不知白撒遂攻衞州兵至城下御旗黃傘招之不下其夜北騎三千奄至官奴和速嘉兀地不按出虎與之戰北兵却六十里然自發蒲城遷延八日始至衞而猝無攻具縛槍為雲梯州人知不能攻守益嚴凡攻三日不克及聞河南大兵濟自張家渡至衞西南遂班師大兵踵其後戰於白公廟敗績白撒等棄軍遁劉益張開皆為民家所殺車駕還次蒲城東三十里白撒使人密奏劉益一軍叛去點檢抹撚兀典總領溫敦昌孫時侍行帳中請上登舟上曰正當決戰何遽退乎少頃白撒至倉皇言於上曰今軍已潰大兵近在堤外請聖主幸歸德上遂登舟侍衞皆不知巡警如故時夜已四更矣遂狼狽入歸德白撒收潰兵大橋得二萬餘人懼不敢入上聞遣近侍局提點移剌粘古紇石烈阿里合護衞二人以舟往迎之既至不聽入見幷其子下獄諸都尉司軍以白撒不戰而退發憤出怨言上乃暴其罪曰惟汝將士明聽朕言我初提大軍次黃陵岡得捷白撒即奏宜渡河取衞州可得糧十萬石乘勝恢復河北我從其計令率諸軍攻衞去蒲城二百餘里白撒遷延八日方至又不預備攻具以致敗衄白撒棄軍竄還蒲城便言諸軍已潰北兵勢大不可當信從登舟幾死于水若當時知諸軍未嘗潰只河北戰死亦可垂名於後今白撒已下獄不復錄用籍其家產以賜汝眾其盡力國家無效此人囚白撒七日而餓死發其弟承麟子狗兒徐州安置當時議者衞州之舉本自官奴歸之白撒則亦過矣初瀕河居民聞官軍北渡築垣塞戶潛伏洞穴及見官奴一軍號令明肅撫勞周悉所過無絲髮之犯老幼婦子坦然相視無復畏避俄白撒輩縱軍四出剽掠俘虜挑掘焚炙靡所不至哭聲相接屍骸盈野都尉高祿謙苗用秀輩仍掠人食之而白撒誅斬在口所過官吏殘虐不勝一飯之費有數十金不能給者公私皇皇日皆徯大兵至矣白撒目不知書姦黠有餘簿書政事聞之即解善談議多知接人則煦煦然好貨殖能捭闔中人主心遂浸漬以取將相既富貴起第於汴之西城規模擬宮掖婢妾百數皆衣金縷奴隸月廩與列將等猶以為未足也上嘗遣中使責之曰卿汲汲於此將無北歸意耶白撒終不悛以及於禍贊曰白撒本非將才恇怯誤國徒能阿合以取富貴性愎貪鄙當此危亡方謀封殖以自逸此猶大厦將焚而燕雀不悟者歟赤盞合喜性剛愎好自用朝廷以其有才幹任之宣宗時累遷蘭州刺史提控軍馬貞祐四年十一月夏人四萬餘騎圍定西輦致攻具將取其城合喜及楊斡烈等率兵鏖戰走之斬首二千級俘數十人獲馬八百餘匹器械稱是餘悉遁去興定元年正月以屢敗夏人遙授同知臨洮府事兼前職是冬陝西行省奉詔伐宋合喜權行元帥府駐來遠寨以張聲勢既而獲捷二年四月宋兵數千侵臨洮合喜擊走之斬獲甚衆三年四月遷元帥左都監行元帥府事于鞏州四年四月夏人犯邊合喜討之師次鹿兒原遇夏兵千人遣提控烏古論世顯率偏師敗之都統王定亦破其衆一千五百于新泉城九月夏人攻鞏州合喜遣兵擊之一日十餘戰夏人退據南岡遣精兵三萬傅城又擊走之生擒夏將劉打甲玉等訊知夏大將你思丁兀名二人謀以為鞏帥府所在鞏既下則臨洮積石河洮諸城不攻自破故先及鞏且構宋統制程信等將兵四萬來攻合喜聞之飭兵嚴備俄而兵果至合喜督兵搏戰却之殺數千人攻益急將士殊死戰殺傷者以萬計夏人焚其攻具拔柵而去合喜已先伏甲要地邀之復率衆躡其後斬首甚衆十月以功遙授平西軍節度使元光元年大將萌古不花攻鳳翔朝廷以主將完顏仲元孤軍不足守禦命合喜將兵援之二年二月木華黎國王斜里吉不花等及夏人步騎數十萬圍鳳翔東自扶風岐山西連隴數百里間皆其營柵攻城甚急合喜盡力僅能禦之於是合喜以同知臨洮府事顏盞蝦戰尤力遂以便宜升為通遠軍節度使上嘉其功許之是歲升簽樞密院事哀宗即位拜參知政事權樞密副使正大八年十一月鄧州馳報大元兵破嶢峯關由金州東下報至時日已暮省院官入奏上曰事至於此奈何上即位至是八年從在東宮日立十三都尉每尉不下萬人強壯趫捷極為精練步卒負擔器甲糧糗重至六七斗一日夜行二百里忠孝軍萬八千人皆回紇河西及中州人被掠而逃歸者人有從馬以騎射選之乃得補親衛騎兵武衛護衛選外諸軍又二十餘萬故頻年有大昌原倒回谷之捷士氣既振遂有一戰之資至是院官同奏北軍冒萬里之險歷二年之久方入武休其勞苦已極為吾計者以兵屯睢鄭昌武歸德及京畿諸縣以大將守洛陽潼關懷孟等處嚴兵備之京師積糧數百萬斛令河南州郡堅壁清野百姓不能入城者聚保山砦彼深入之師欲攻不能欲戰不得師老食盡不擊自歸矣上太息曰南渡二十年所在之民破田宅鬻妻子以養軍士且諸軍無慮二十餘萬今敵至不能迎戰徒以自保京城雖存何以為國天下其謂我何又曰存亡有天命惟不負民可也乃詔合達蒲阿等屯軍襄鄧九年正月兩省軍潰于三峯山北兵進薄京師三月庚子議曹王出質大兵北行留速不木受攻城攻具已辦既有納質之請即又云我受命攻城但曹王出則退不然不罷也壬寅曹王入辭宴於宮中癸卯北兵立攻具沿壕列木柵以薪草填壕頃刻平十餘步主兵者以議和之故不敢與戰但於城上坐視而已城中喧鬨上聞之從六七騎出端門至舟橋時新雨淖車駕忽出人驚愕失措但跪於道傍亦有望而拜者上自麾之曰勿拜恐泥污汝衣倉皇中市肆米豆狼藉於地上勅衛士令各歸其家老幼遮擁至有悞觸御衣者少頃宰相從官皆至進笠不受曰軍士暴露我何用此為所過慰勞軍士皆踴躍稱萬歲臣等戰死無所恨至有感泣者西南軍士五六十輩聚而若有言者上就問之跪曰大兵芻土填壕功已過半平章傳令勿放一鏃恐壞和事想豈有計耶上顧謂其中長者云朕為生靈稱臣進奉無不從順止有一子養來成長今往作質子矣汝等略忍待曹王出大兵不退汝等死戰未晚復有拜泣者曰事急矣聖主毋望和事乃傳旨城上放箭西水門千戶劉壽控御馬仰視曰聖主無信賊臣賊臣盡大兵退矣衛士欲擊之上止之曰醉矣勿問是日曹王出詣軍前大兵倂力進攻甲辰上復出撫東門將士太學生楊奐等前白事上問何所欲言曰臣等皆太學生令執砲夫之役恐非國家百年以來待士之意勅記姓名即免其役過南薰門值被創者親傅以藥手酌卮酒以賜且出內府金帛以待有功者是日大兵驅漢俘及婦女老幼負薪草填壕塹城上箭鏃四下如雨頃刻壕為之平龍德宮造砲石取宋太湖靈璧假山為之小大各有斤重其圓如燈毬之狀有不如度者杖其工人大兵用砲則不然破大磑或碌碡為二三皆用之攢竹砲有至十三稍者餘砲稱是每城一角置砲百餘枝更遞下上晝夜不息不數日石幾與𩹉城平而城上樓櫓皆故宮及芳華玉谿所拆大木為之合抱之木隨擊而碎以馬糞麥秸布其上網索旃褥固護之其懸風板之外皆以牛皮為障遂謂不可近大兵以火砲擊之隨即延爇不可撲救父老所傳周世宗築京城取虎牢土為之堅密如鐵受砲所擊唯凹而已大兵壕外築城圍百五十里城有乳口樓櫓壕深丈許闊亦如之約三四十步置一鋪鋪置百許人守之初白撒命築門外短牆委曲隘容二三人得過以防大兵奪門及被攻諸將請乘夜斫營軍乃不能猝出比出已為北兵所覺後又夜募死士千人穴城由壕徑渡燒其砲坐城上懸紅紙燈為應約燈起渡壕又為圍者所覺又放紙鳶置文書其上至北營則斷之以誘被俘者識者謂前日紙燈今日紙鳶宰相以此退敵難矣右丞世魯命作江水曲使城上之人靜夜唱之蓋河朔先有此曲以寄謳吟之思其謬計如此合喜先以守鳳翔自誇及令守西北隅其地受攻最急而合喜當之語言失措面無人色軍士特以車駕數出慰勞人自激昂爭為效命耳其守城之具有火砲名震天雷者鐵礶盛藥以火點之砲起火發其聲如雷聞百里外所爇圍半畝之上火點著甲鐵皆透大兵又為牛皮洞直至城下掘城為龕間可容人則城上不可奈何矣人有獻策者以鐵繩懸震天雷者順城而下至掘處火發人與牛皮皆碎迸無迹又飛火槍注藥以火發之輒前燒十餘步人亦不敢近大兵惟畏此二物云四月罷攻至是十六晝夜矣內外死者以百萬計大兵知不可下乃謾為好語云兩國已講和更相攻耶朝廷亦就應之明日遣戶部侍郎楊居仁出宜秋門以酒炙犒師於是營幕稍稍外遷遂退兵壬戌合喜以大兵退議入賀諸相皆不欲獨合喜以守城為己功持論甚力呼令史元好問曰罷攻已三日而不入賀何也速召翰苑官作表好問以白諸相權參政內族思烈曰城下之盟諸侯以為恥況以罷攻為可賀歟合喜怒曰社稷不亡帝后免難汝等不以為喜耶明日近侍局直長張天任至省好問私以賀議告之天任曰人不知恥乃若是耶因謂諸相曰京城受兵上深以為辱聞百官欲入賀誠有此否會學士趙秉文不肯撰表議遂寢是月以尚書省兼樞密院事合喜罷樞密合喜既失兵柄意殊不樂欲銷院印諸相謂院事仍在印有用時不宜毀合喜怒欲笞其掾有投匿名書於御路云副樞合喜總帥撒合參政訛出皆國賊朝廷不殺衆軍亦須殺之為國除害衛士以聞撒合飲藥死訛出稱疾不出惟合喜坦然若無事者上亦無所問由是軍國之事盡決于合喜矣初大兵圍汴司諫陳岢屢上封事言得失切中時病合喜大怒召入省呼其名責之曰子為陳山可耶果如子言能退大敵我當世世與若為奴聞者無不竊笑蓋不識岢字至分為兩耳天興元年七月權參知政事思烈山公武仙合軍自汝州入援詔以合喜為樞密使統京城軍萬五千應之且命賽不為之助八月己酉朔駐於近郊候益兵乃進屯中牟古城凡三日聞思烈軍潰即夜棄輜重馳還黎明至鄭門聚軍乃入言者謂合喜始則抗命不出中則逗遛不進終則棄軍先遁委棄軍資不可勝計不斬之無以謝天下上貸其死免為庶人既而籍其家以賜軍士既廢居汴中常鞅鞅不樂會大將速不木受遣人招之合喜即治裝欲行崔立邀至省酌酒餞送且以白金二百兩為贐明日復詣省別立方對語適一人自歸德持文書至發視之乃行省傳哀宗語以諭合喜者其言曰卿朕老臣中間雖廢出未嘗忘卿今崔立已變卿處舊人尚多若能反正與卿世襲公相立怒叱左右繫之獄是日斬之論曰合喜初年用兵西夏屢著勞效要亦諸將顏盞蝦等功也既當大任遂自矜伐汴城之役舉措煩擾質出兵退即圖稱賀此豈有體國之誠心者乎中牟之潰衆怒所歸幸逭一死猶懷異圖卒殞猜疑天蓋假手於崔立也
