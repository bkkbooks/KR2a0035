body:
  text: 金史卷十九本紀第十九世紀補景宣皇帝諱宗峻本諱繩果太祖第二子母曰聖穆皇后唐括氏太祖元妃宗峻在諸子中最嫡天輔五年忽魯勃極烈杲都統諸軍取中京帝別領合扎猛安受金牌既克中京遂與杲俱襲遼主于鴛鴦濼遼主走陰山耿守忠救西京帝與宗翰等擊走之西京城南有浮圖敵先據之下射士卒多傷帝曰先取是則西京可下既而攻浮圖克之遂下西京太祖崩帝與兄宗幹率宗室羣臣立太宗天會二年薨熙宗即位追上尊諡曰景宣皇帝廟號徽宗改葬興陵海陵弒立降熙宗為東昏王降帝為豐王世宗復尊熙宗廟諡尊帝為景宣皇帝子合剌常勝查剌合剌是為熙宗睿宗立德顯仁啟聖廣運文武簡肅皇帝諱宗堯初諱宗輔本諱訛里宋大定上尊諡追上今諱魁偉尊嚴人望而畏之性寬恕好施惠尚誠實太祖征伐四方諸子皆總戎旅帝常在帷幄天輔六年太祖親征太宗居守黃龍府安福哥誘新降之民以叛帝與烏古廼討平之南路軍帥鶻實荅以贓敗帝往閱實之咸稱平允天會五年宗望薨帝為右副元帥駐兵燕京十一月分遣諸將伐宋帝發自河間徇地淄青六年正月宋馬括兵二十萬至樂安帝率師擊破之聞宋主在揚州時東作方興留大軍夾河屯田而還軍山西二月移剌古破宋臺宗雋宋忠軍五萬于大名明日再破之獲宗雋忠而還冀州人乘夜出兵襲照里營照里擊敗之宋主奉表請和密書以誘契丹漢人詔伐宋帝發自河北降滑州取開德府攻大名府克之河北平初伐宋河北河東諸將議不決或欲先定河北或欲先平陝西太宗兩用其策而宗翰來會于濮既平河北遂取東平及徐州盡得宋人江淮運致金幣在徐州官庫者分給諸軍而劉豫遂以濟南降使拔离速等襲宋主于揚州而宋主聞之比拔离速至揚州前夕已渡江矣宋主乃貶去帝號再以書來請存社稷語在宗翰傳中既而宗弼追宋主宋主渡江入于杭州復遁入海宗弼乃還於是婁室所下陝西城邑輒叛宗翰等曰前討宋故分西師合于東軍而陝西五路兵力雄勁當倂力攻取今撻懶撫定江北宗弼以精兵二萬先往洛陽以八月往陝西或使宗弼遂將以行或宗輔宗幹希尹中以一人往上曰婁室往者所向輒辦今專征陝右豈倦于兵而自愛邪卿等其戮力焉由是詔帝往是時宋張浚兵取陝西帝至洛水治兵張浚騎兵六萬步卒十二萬壁富平帝至富平婁室為左翼宗弼為右翼兩軍並進自日中至于昏暮凡六合戰破之耀州鳳翔府皆來降遂下涇渭二州敗宋經略使劉倪軍于瓦亭原州降撒离喝破德順軍靜邊寨宋涇原路統制張中孚知鎮戎軍李彥琦以城降宋秦鳳路都統制吳玠軍于隴州境上招討都監馬五擊走之降一縣而還帝進兵降甘泉等三堡取保川城破宋熙河路副總管軍三萬獲馬千餘拔安西等二寨熙州降分遣左翼都統阿盧補右翼都統宗弼招撫城邑之未下者遂得鞏洮河樂西寧蘭廓積石等州定遠和政甘峪寧洮安隴等城寨及鎮堡蕃漢營部四十餘於是涇原熙河兩路皆平撒离喝降慶陽府慕洧以環州降既定陝西五路乃選騎兵六千使撒离喝列屯衝要於是班師與宗翰俱朝京師立熙宗為諳版勃極烈帝為左副元帥十三年行次媯州薨年四十陪葬睿陵追封潞王諡襄穆皇統六年進冀國王正隆二年追贈太師上柱國改封許王世宗即位追上尊諡立德顯仁啟聖廣運文武簡肅皇帝廟號睿宗二年改葬于大房山號景陵顯宗體道弘仁英文睿德光孝皇帝諱允恭本諱胡土瓦世宗第二子母曰明德皇后烏林荅氏皇統六年丙寅歲生體貌雄偉孝友謹厚大定元年十一月世宗即位于東京乙酉封楚王置官屬十二月從至中都二年四月己卯賜名允迪五月壬寅立為皇太子世宗謂之曰在禮貴嫡所以立卿卿友于兄弟接百官以禮勿以儲位生驕慢日勉學問非有召命不須侍食帝上表謝專心學問與諸儒臣講議於承華殿燕閑觀書乙夜忘倦翼日輒以疑字付儒臣校證九月庚子詔東宮三師對皇太子稱名少師以降稱臣十一月庚子生辰百官賀于承華殿世宗賜以襲衣良馬賜宴于仁政殿皇族百官皆與自後生辰世宗或幸東宮或宴內殿歲以為常十二月辛卯奏曰東宮賀禮親王及一品皇族皆北面拜伏臣但答揖伏望天慈聽臣答拜庶惇親親友愛之道世宗從之以為定制世宗聞儒者鄭松賢松先為同知博州防禦事致仕起為左諭德詔免朝參令輔太子讀書松以友諭自處帝嘗顧松使取服帶松對曰臣忝諭德不敢奉命帝改容稱善自是益加禮遇每出獵獲鹿輒分賜之四年九月納妃徒單氏行親迎禮故事大駕鹵簿天子乘玉路皇太子鹵簿乘金路六年世宗行自西京還都禮官不知皇太子自有鹵簿金路乃請太子就乘大駕綴路行在天子之前上疑其非禮詳閱舊典禮官始覺其誤於是禮部郎中李邦直員外郎李山削一階太常少卿武之才太常丞張子羽博士張榘削兩階頃之禮官議受冊謁謝太廟服常朝服乘馬世宗曰此與外官禮上後謁諸神廟無異海陵一時率意行之何足為法大冊與三歲祫享當用古禮為是孔子曰禮與其奢也寧儉不當輕易如此又曰右丞蘇保衡雖漢人不通經史參政石琚通經史而不言前日禮官既已削奪猶不懼邪其具前代典禮以聞朕將擇而處之久之將授太子冊寶儀注備儀仗告太廟上曰朕受尊號謁謝乃用故宋真宗故事常朝服乘馬皇太子乃用備禮前後不稱甚無謂也謂右丞相良弼左丞守道曰此卿等不用心所致良弼等謝曰臣愚慮不及此上復曰此文臣因循故也是年十月甲申祫享于太廟行亞獻禮七年帝有疾詔左丞守道侍湯藥徙居瓊林苑臨芳殿調治八年正月甲戌改賜名允恭庚辰受皇太子冊寶帝上表謝九年五月世宗命避暑于草濼隋王惟功從行其應從行者皆給道路費帝奏曰遠去闕廷獨就涼地非臣子所安願罷行世宗曰汝體羸弱山後高涼故命汝往丁丑百官奉辭于都城之北再拜帝答拜是月百官承詔具牋問起居六月百官問起居如前八月乙酉至自草濼百官迎謁于都城之北如送儀丙戌入見世宗曰吾兒相別經夏極甚思憶也九月詔皇太子供膳勿月支歲給五千萬十年八月帝在承華殿經筵太子太保壽王爽啟曰殿下頗未熟本朝語何不屏去左右漢官皆用女直人帝曰諭德贊善及侍從官曷敢輒去爽乃揖而退帝曰宮官四員謂之諭德贊善義可見矣而反欲去之無學故也有使者自山東還帝問民間何所苦使者曰錢難最苦官庫錢滿有露積者而民間無錢以此苦之帝曰貯之空室雖多奚為謂戶部尚書張仲愈曰天子富藏天下何必獨在府庫也因奏曰錢在府庫何異銅鑛在野乞流轉使公私俱利世宗嘉納詔有司議行之十一年十一月丁亥有事於圓丘帝行亞獻禮十二年五月世宗聞德州防禦使胡剌謀叛因曰朕於親親之道未嘗不篤而輒敢如此帝徐奏曰叔胡剌性荒縱耽娛樂而無子嗣忽如此狂謀望更閱實之十月己未祫享于太廟帝攝行祀事十三年十月承詔與趙王惟中曹王惟功獵于保州定州十一月甲午還京師十四年四月乙亥世宗御垂拱殿帝及諸王侍側世宗論及兄弟妻子之際世宗曰婦言是聽而兄弟相違甚哉帝對曰思齊之詩曰刑于寡妻至于兄弟以御于家邦臣等愚昧願相勵而修之因引常棣華艹口咢相承脊令急難之義為文見意以誡兄弟焉十五年世宗詔五品職事官謝見皇太子十七年五月甲辰侍宴于常武殿典食令涅合進粥帝將食有蜘蛛在粥盌中涅合恐懼失措帝從容曰蜘蛛吐絲乘空忽墮此中爾豈汝罪哉十月己卯祫享于太廟攝行祀事十九年四月戊申有事于太廟攝行祀事丁巳詹事烏林荅愿入謝帝命取幞頭腰帶官屬請曰此見宰相師傅之禮也帝曰愿事陛下久以此加敬耳皆曰非臣等所及十一月改葬明德皇后于坤厚陵帝徒行輓靈車遇大風雪左右進雨具帝却之比至頓所衣盡霑濕觀者無不下淚海陵雖貶黜為庶人宗幹尚稱明肅皇帝議者以為未盡帝具表奏論世宗嘉納之於是宗幹削去帝號降封遼王二十四年世宗將幸上京詔帝守國作守國之寶以授之其遣使祭享五品以上官及事利害重者遣使馳奏六品以下官其餘常事並聽裁決每三日一次於集賢殿受尚書省啟事京朝官遇朔望具朝服問候車駕在路每二十日一遣使問起居已達上京每三十日一問起居世宗曰今巡幸或能留一二年以汝守國譬之農家種田商人營利但能不墜父業即為克家子也帝對曰臣在東宮二十餘年過失甚多陛下以明德皇后之故未嘗見責臣誠愚昧不克負荷乞備扈從世宗曰凡人養子皆望投老得力朕留太尉左右丞參政輔汝彼皆國家舊人可與商議且政事無難但用心公正無納讒邪一月之後政事自熟帝流涕堅辭左右為之感動三月世宗如上京帝守國留中都初帝在東宮或攜中侍步于芳苑中侍出入禁中未嘗限阻此輩見帝守國各為得意帝知之謂諸中侍曰我向在東宮不親國政日與汝輩語話今既守國汝等有召命然後得入五月世宗至上京賜勅書曰朕以前月八日到遼陽此月二日達上京翌日祀慶元廟省方觀民古之制也汝守國任重夏暑方熾益當自愛無貽朕憂帝謂徒單克寧曰車駕巡幸以國事見屬刑名最重人之死生繫焉凡有可議當盡至公比主上還都勿有廢事自是凡啟禀刑名帝自披閱召都事委曲折正移晷忘倦或賜之食近侍報瑤池位蓮開當設宴帝曰聖上東巡命我守國何敢宴遊廢事採致數花足矣七月遣子金源郡王麻達葛奉表問起居請世宗還都十一月壬寅帝冬獵辛亥還都二十五年正月乙酉朔免羣臣賀禮帝自守國深懷謙抑宮臣不庭拜啟事時不侍立免朔望禮京朝朔望日當具公服問候並停免至是羣臣當賀亦不肯受甲寅帝如春水二月庚申還都丁卯遣子金源郡王麻達葛奉表賀萬春節四月久不雨帝親禱即日霑足六月甲寅帝不豫庚申崩于承華殿世宗自上京還次天平山好水川訃聞為位臨奠于行宮之南大慟者久之親王百官皇族命婦及侍衞皆會哭世宗號泣還宮比至中都為位奠哭者凡七焉世宗以豳王永成為中都留守來護喪遣滕王府長史再興御院通進阿里剌來保護金源郡王遣左宣徽使唐括鼎來致祭詔妃徒單氏及諸皇孫喪服並如漢制帝在儲位久恩德在人者深每日三時哭臨侍衞軍士皆爭入臨伏哭于承華殿下聲殷如雷中都百姓市門巷端為位慟哭七月壬午朔賜諡宣孝太子九月庚寅殯于南園熙春殿己酉世宗至自上京未入國門先至熙春殿致奠慟哭久之比葬親臨者六帝事世宗凡巡幸西京涼陘及上陵祭廟謁衍慶宮田獵觀稼拜天射柳未嘗去左右上有事于圓丘及親享于太廟則行亞獻禮不親祀則攝行祀事國有大慶則率百官上表賀正旦萬春節則總班上壽冬十月庚戌朔宰相以下朝見于慶和殿太尉完顏守道上壽世宗追悼悽愴者久之十一月甲申靈駕發引世宗路祭于都城之西庚寅葬于大房山世宗欲加帝號以問羣臣翰林修撰趙可對曰唐高宗追諡太子弘為孝敬皇帝左丞張汝弼曰此蓋出于武后遂止乃建廟于衍慶宮後祭用三獻樂用登歌二十六年立子璟為皇太孫二十九年世宗崩太孫即位是為章宗五月甲午追諡體道弘仁英文睿德光孝皇帝廟號顯宗丁酉祔于太廟陵曰裕陵帝天性仁厚不忍刑殺梁檀兒盜金銀葉憐其母老李福興盜段匹值坤厚陵禮成家令本把盜銀器值萬春節皆委曲全活之亡失物者責其償而不加罪聞四方饑饉輒先奏加賑贍因田獵出巡所過問民間疾苦敬禮大臣友愛兄弟葬明德皇后于坤厚陵諸妃皆祔自磐寧宮發引趙王惟中以其母車先發令張黃蓋者前行帝呼執蓋者不應少府監張僅言欲奏其事帝止之嘗作重光座銘及刻座右銘于小玉碑幷刻其碑陰皆深有理致最善射而不殫物嘗奉詔拜陵先獵射一鹿獲之即命罷獵曰足奉祀事焉用多殺好生蓋其天性云贊曰遼王杲取中京宗翰宗望皆從景宣別領合扎猛安合扎猛安者太祖之猛安也宗翰請立熙宗宗幹不敢違太宗不能拒其義正其理直矣舊史稱睿宗寬恕好施惠熙宗不終海陵隕斃自時厥後得大位者皆其子孫有以夫顯宗孝友惇睦在東宮二十五年不聞有過承意開導四方陰受其賜天不假之年惜哉
