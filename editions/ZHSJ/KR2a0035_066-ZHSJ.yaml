body:
  text: 金史卷六十六列傳第四始祖以下諸子勗本名烏野子宗秀隈可宗室胡十門合住子布輝摑保衷本名醜漢齊本名掃合术魯胡石改宗賢本名阿魯撻懶卞本名吾母本名阿里剌弈本名三寶阿喜勗字勉道本名烏野穆宗第五子好學問國人呼為秀才年十六從太祖攻寧江州從宗望襲遼主于石輦鐸太宗嗣位自軍中召還與謀政事宗翰宗望定汴州受宋帝降太宗使勗就軍中往勞之宗翰等問其所欲曰惟好書耳載數車而還女直初無文字及破遼獲契丹漢人始通契丹漢字於是諸子皆學之宗雄能以兩月盡通契丹大小字而完顏希尹乃依倣契丹字製女直字女直既未有文字亦未嘗有記錄故祖宗事皆不載宗翰好訪問女直老人多得祖宗遺事太宗初即位復進士舉而韓昉輩皆在朝廷文學之士稍拔擢用之天會六年詔書求訪祖宗遺事以備國史命勗與耶律迪越掌之勗等採摭遺言舊事自始祖以下十帝綜為三卷凡部族既曰某部復曰某水之某又曰某鄉某村以別識之凡與契丹往來及征伐諸部其間詐謀詭計一無所隱事有詳有略咸得其實自太祖與高麗議和凡女直入高麗者皆索之至十餘年索之不已勗上書諫曰臣聞德莫大於樂天仁莫先於惠下所索戶口皆前世姦宄叛亡烏蠢訛謨罕阿海阿合束之緒裔先世綏懷四境尚未賓服自先君與高麗通聞我將大因謂本自同出稍稍款附高麗既不聽許遂生邊釁因致交兵久方連和蓋三十年當時壯者今皆物故子孫安於土俗婚姻膠固徵索不已彼固不敢稽留骨肉乖離誠非衆願人情怨甚可愍者而必欲求為己有特彼我之蔽非一視同仁之大也國家民物繁夥幅員萬里不知得此果何益耶今索之不還我以強兵勁卒取之無難然兵凶器戰危事不得已而後用高麗稱藩職貢不闕國且臣屬民亦非外聖人行義不責小過理之所在不俟終日臣愚以為宜施惠下之仁弘樂天之德聽免徵索則彼不謂己有如自我得之矣從之十五年為書左丞加鎮東軍節度使同中書門下平章事預平宗磐之難賜與甚多加儀同三司以皇叔祖字冠其銜勗皆力辭不受皇統元年撰定熙宗尊號冊文上召勗飲於便殿以玉帶賜之所撰祖宗實錄成凡三卷進入上焚香立受之賞賚有差制詔左丞勗平章政事弈職俸外別給二品親王俸傔舊制皇兄弟皇子為親王給二品俸宗室封一字王者給三品俸勗等別給親王俸皆異數也宴羣臣于五雲樓勗進酒稱謝帝起立宰臣進曰至尊為臣下屢起於禮未安上曰朕屈己待臣下亦何害是日上及羣臣盡歡俄同監修國史進拜平章政事光懿皇后忌辰熙宗將出獵勗諫而止熙宗獵于海島三日之間親射五虎獲之勗獻東狩射虎賦上悅賜以佩刀玉帶良馬能以契丹字為詩文凡游宴有可言者輒作詩以見意時上日與近臣酣飲或繼以夜莫能諫之勗上疏諫乃為止酒進拜左丞相兼侍中監修如故八年奏上太祖實錄二十卷賜黃金八十兩銀百兩重綵五十端絹百匹通犀玉鈎帶各一出領行臺尚書省事召拜太保領三省領行臺如故封魯國王勗剛正寡言海陵方用事朝臣多附之者一日大臣會議海陵後至勗面責之曰吾年五十餘猶不敢後爾少年強健乃敢如此海陵跪謝九年進拜太師進封漢國王海陵篡立加恩大臣以收人望封秦漢國王領三省監修如故及宗本無罪誅勗髭鬢頓白因上表請老海陵不許賜以玉帶優詔諭之有大事令宰臣就第商議入朝不拜勗遂稱疾篤不言表請愈切海陵不懌從之以本官致仕進封周宋國王正隆元年與宗室俱遷中都二年例降封金源郡王薨年五十九撰定女直郡望姓氏譜及他文甚衆大定二十年詔曰太師勗諫表詩文甚有典則朕自即位所未嘗見其諫表可入實錄其射虎賦詩文等篇什可鏤版行之子宗秀宗秀字實甫本名厮里忽涉獵經史通契丹大小字善騎射與平宗磐宗雋之亂授定遠大將軍以宗磐世襲猛安授之宗弼復取河南宗秀與海陵俱赴軍前任使宋將岳飛軍于亳宿之間宗秀率步騎三千扼其衝要遂與諸軍逆擊敗之師還為太原尹改婆速路統軍使不受高麗遣使以土產獻却之入為刑部尚書改御史中丞授翰林學士天德初轉承旨封宿國公賜玉帶歷平陽尹昭義軍節度使封廣平郡王正隆二年卒官年四十二是歲例降二品以上封爵改贈金紫光祿大夫康宗敬僖皇后生楚王謀良虎次室溫都氏生昭武大將軍同刮茁次室僕散氏坐事早死生龍虎衞上將軍隈可隈可亦作偎喝美髯鬚勇健有材略從太祖伐遼取寧江州戰出河店天眷二年授驃騎上將軍除迭魯苾撒辤詳穩遷忠順軍節度使興平軍節度使天德二年入為大宗正丞四年出為昭德軍節度使以兄謀良虎孫喚端合扎謀克餘戶授偎喝上京路扎里瓜猛安所屬世襲謀克改德昌軍節度使封廣平郡王正隆二年例奪王爵改曷速館節度使再改忠順軍節度使大定元年封宗國公為勸農使卒官年六十五始祖兄弟三人保活里之後為神土懣迪古乃別有傳胡十門者曷蘇館人也父撻不野事遼為太尉胡十門善漢語通契丹大小字勇而善戰高永昌據東京招曷蘇館人衆畏高永昌兵強且欲歸之胡十門不肯從召其族人謀曰吾遠祖兄弟三人同出高麗今大聖皇帝之祖入女直吾祖留高麗自高麗歸于遼吾與皇帝皆三祖之後皇帝受命即大位遼之敗亡有徵吾豈能為永昌之臣哉始祖兄阿古廼留高麗中胡十門自言如此蓋自謂阿古廼之後云於是率其族屬部衆詣撒改烏蠢降營于回山之下永昌攻之胡十門力戰不能敵奔于撒改及攻開州胡十門以糧餉給軍後攻保州遼將以舟師遁胡十門邀擊敗之降其士卒賞賜甚厚以為曷蘇館七部勃菫給銀牌一木牌三天輔二年卒贈監門衞上將軍再贈驃騎衞上將軍子鉤室嘗從攻顯州領四謀克軍破梁魚務功最以其父所管七部為曷蘇館都勃菫有合住者亦稱始祖兄苗裔但不知與胡十門相去幾從耳合住曷速館苾里海水人也仕遼領辰復二州漢人渤海子蒲速越襲父職再遷靜江中正軍節度使佩金牌為曷速館女直部長子余里也與胡十門同時歸朝屢以糧餉助伐高永昌及高麗新羅後從宗望伐宋以功遷真定府路安撫使兼曹州防禦使佩金牌授苾里海水世襲猛安長子布輝識女直契丹漢字善騎射年十八宗弼選為扎也從阿里蒲盧渾追宋康王于明州睿宗聞其才召置麾下從經略山東河北陝西襲其父猛安授昭勇大將軍海陵伐宋以本猛安兵從半道與南征萬戶完顏福壽等俱亡歸謁世宗于遼陽世宗即位除同知曷蘇館節度使事刑部侍郎斜哥為都統布輝副之坐擅署置官吏私用官中財物削兩階解職未浹旬世宗獻享山陵兵部尚書可喜昭毅大將軍斡論中都同知完顏璋等謀反欲因上謁山陵舉事斡論與布輝親舊與之謀議事具可喜傳既知事不可成乃與可喜璋執斡論等上變可喜不肯以始謀盡首遂幷誅之而賞布輝璋除布輝濬州防禦使累遷順天軍節度使致仕卒年六十七昭祖族人摑保者從昭祖耀武于青嶺白山還至姑里甸昭祖得疾寢于村舍洞無門扉乃以車輪當門為蔽摑保臥輪下為扞禦已而賊至刃交於輪輻間摑保洞腹見膏恐昭祖知之乃然薪取膏以為炙問之以他肉對昭祖心知之遂中夜啟行衷本名醜漢中都司屬司人世祖曾孫祖霸合布里封鄆王父悟烈官至特進大定中收充閤門袛候授代州宣銳軍都指揮使歲旱州委禱雨于五臺靈潭步致其水雨隨下人為刻石紀之四遷引進使兼典客署令改尚輦局使扈從北幸賜竹罒戊馬二以旌其勤尋為夏國王李仁孝封冊使歷寧海蠡州刺史入為大睦親府丞除順義軍節度使陛辭賜金幣特寵異之移鎮鎮西泰和六年致仕卒衷孝悌貞謹深悉本朝婚禮皇族婚嫁每令衷相之治復有能稱其在寧海蠡州平賦役無擾民立石頌遺愛大安初追贈輔國上將軍齊本名掃合穆宗曾孫父胡八魯寧州刺史大定中以族次充司屬司將軍授同知復州軍州事累遷刑部員外郎上諭曰本朝以來未嘗有內族為六部郎官者以卿歷職廉能故授之先是復州合厮罕關地方七百餘里因圍獵禁民樵捕齊言其地肥衍令賦民開種則公私有益上然之為弛禁即牧民以居田收甚利因名其地曰合厮罕猛安章宗立改戶部員外郎出為磁州刺史治以寬簡未嘗留獄屬邑武安有道士視觀宇不謹吏民為請鄰郡王師者代主之道士忿奪其利告王私置禁銅器法當徒縣令惡其為人反坐之具獄上齊審其誣又以王有德不忍坐之問同僚無以對齊曰道士同請即同居也當准首俱釋其罪其寬明有體皆此類也磁名郡刺史皆朝廷遴選郡人以前政有聲如劉徽柔程輝高德裕皆不及也河北提刑司以治狀聞明昌三年始議置諸王傅頗難其選乃以齊傅兗王王將至任郡猛安迎接齊峻却之王怪問故曰王國藩輔猛安皆總戎職於王何利焉却之以遠嫌也王悅服王府家奴為不法輒發還本猛安終更無敢犯者明年授山東東西路副統軍兼同知益都府事有惠愛郡人為之立碑轉彰化軍節度使六年移利涉軍召見勞慰有加詔留守上京承安二年致仕卒齊明法識治體所至有聲內族中與丞相承暉並稱云术魯宗室子從鄭王斡賽敗高麗于曷懶取亞魯城克寧江州取黃龍府出河店之役達魯古城之役護步荅岡之役皆力戰有功東京降為本路招安副使敗遼兵破同刮營蘇州漢民叛走术魯追復之以功為謀克天輔四年卒年四十一皇統中贈鎮國上將軍胡石改宗室子也從太祖攻寧江敗遼兵於達魯古城破遼主親兵皆有功遼軍來援濟州胡石改與其兄實古乃以兵迎擊敗之還攻濟州中流矢戰益力克其城軍中稱其勇從攻春泰州降之幷降境內諸部族其不降者皆攻拔之遼主西走胡石改追至中京獲其宮人輜重凡八百兩有思泥古者復以本部叛去胡石改以兵五百追及之獲其親屬部人以還德州復叛胡石改以兵五千克其城從婁室擊敗敵兵二萬於歸化之南幷降歸化從取居庸關幷燕之屬縣及其山谷諸屯移失部既降復叛去胡石改引兵追及戰敗之俘獲甚衆澤州諸部有逃者皆追復之又敗叛人於臨潢誅其酋領而安撫其人民天眷二年遷永定軍節度使改武定軍徙汴京留守天德三年授世襲猛安卒年六十八宗賢本名阿魯太祖伐遼從攻寧江州臨潢府太宗監國選侍左右甚見親信臨潢復叛從宗望復取之為內庫都提點再遷歸德軍節度使政寬簡境內大治秩滿士民數百千人相率詣朝廷請留及改武定軍百姓扶老幼送數十里悲號而去改永定軍秉德廉訪官吏士民持盆水與鏡前拜言曰使君廉明清直類此民實賴之秉德曰吾聞郡僚廉能如一汝等以為如何衆對曰公勤清儉皆法則於使君耳因謂宗賢曰人謂君善治當在甲乙果然賢使君也用是超遷兩階天德初授世襲謀克馳驛召之雄州父老相率張青繩懸明鏡於公署老幼填門三日乃得去封定國公再除忠順軍節度使賜以玉帶捕盜司執數人至府宗賢問曰罪狀明白否對曰獄具矣宗賢閱其案謂僚佐曰吾察此輩必寃不數日賊果得人服其明改曷懶路兵馬都總管歷廣寧尹封廣平郡王改崇義軍節度使兼領北京宗室事正隆例奪王爵加金紫光祿大夫改臨海軍大定初遣使召之宗賢率諸宗室見於遼陽除同簽大宗正事封景國公致仕起為婆速路兵馬都總管復致仕卒特進撻懶宗室子年十六事太祖未嘗去左右出河店之役太祖欲親戰撻懶控其馬而止之曰主君何為輕敵臣請效力即挺槍前手殺七人已而槍折騎士曳而下者九人太祖壯之曰誠得此輩數十雖萬衆不能當也及戰于達魯古城遼兵一千陣于營外太祖遣撻懶往擊之撻懶衝出敵陣大敗其衆攻臨潢府春泰州中西二京皆有功天輔六年授謀克天會四年從伐宋屢以功受賞明年再舉至汴宗望聞宋人會諸路援兵于睢陽遣撻懶與阿里刮將兵二千往拒之敗其前鋒軍三萬于嵵縣又破三寨擒宋京東路都總管胡直孺南路都統制隋師元及其三將幷直孺二子遂取拱州降寧陵復破二萬于睢陽進取亳州聞宋兵十萬且至會宗望益兵四千合擊大敗之其卒二千陣而立馳之不動即麾軍去馬擊之盡殪擒其將石瑱而還帥府嘉其功賞賚優渥睿宗駐兵熙州分遣諸將略地撻懶以軍五百入六盤山十六寨降其官八十餘民戶四千獲馬二千疋皇統中累加銀青光祿大夫天德初加特進授世襲猛安卒年六十五海陵遷諸陵於大房山以撻懶嘗給事太祖命作石像置睿陵前卞本名吾母上京司屬司人大定二年收充護衞積勞授彰化軍節度副使入為都水監丞累遷中都西京路提刑使徙知歸德府河平軍節度使王汝嘉奏卞前在都水監導河有勞除北京留守未幾改知大興府事時有言尚書左丞夾谷衡在軍不法詔刑部問狀事下大興府卞輒令追攝上以為失體杖四十久之乞致仕不許拜御史大夫先是左司諫赤盞高門上言御史大夫久闕憲紀不振宜選剛正疾惡之人肅清庶務上由是用卞前時孫鐸賈鉉俱為尚書鉉拜參知政事而鐸再任對賀客誦唐張在詩有鬱鬱意卞劾奏之鐸坐降黜既而復申前請遂以金吾衞上將軍致仕薨本名阿里剌隸上京司屬司大定十年以皇家近親收充東宮護衞轉十人長授御院通進從世宗幸上京會皇太子守國薨世宗以親密可委特命與滕王府長史馳驛往護喪時章宗為金源郡王亦留中都且命等保護諭之曰郡王遭此家難哀哭當以禮節之飲食尤宜謹視世宗還都遷符寶郎除吏部郎中章宗即位坐與御史大夫唐括貢為壽犯夜禁奪官一階罷明昌元年起為同知棣州防禦使事上書歷詆宰執帝以小臣敢譏訕宰輔杖八十削一官罷之發還本猛安明年降授同知宣德州事召授武衞軍副都指揮使四遷知大興府事轉左右宣徽使承安二年拜尚書右丞出為泰定軍節度使移知濟南府卒弈本名三寶隸梅堅塞吾司屬司大定七年以近親充東宮護衞十人長轉為尚竹罒戊局使章宗即位遷左衞副將軍累遷右副都點檢兼提點尚竹罒戊局使諭旨曰汝非有過人才第以久次遷授當謹乃職勿復有非違事使朕聞之未幾坐竹罒戊馬瘦決三十承安二年改左副都點檢兼職如舊俄授同簽大睦親府事卒弈為人貪鄙數以贓敗帝愛其能治圍場故進而委信之阿喜宗室子好學問襲父北京路筈栢山猛安聽訟明決人信而愛之察廉能除彰國軍節度副使改上京留守判官提刑司奏彰國軍治狀遷同知速頻路節度事改歸德軍歷海邳二州刺史皆兼總押軍馬宋統領劉文謙以兵犯宿遷阿喜逆擊破之復破戚春夏興國舟兵萬餘人斬夏興國于陣遷鎮國上將軍再賜銀幣為元帥左監軍紇石列執中前鋒渡淮破寶應天長二縣師還遷同知歸德府事改泗州防禦使丁母憂起復大安二年改華州防禦使遷鎮南軍節度使貞祐二年改知大名府充馬軍都提控歷橫海安化軍節度使充宣差山東路左翼都提控尋知濟南府事徙沁南軍節度使遷河南統軍使兼昌武軍節度使卒贊曰金諸宗室自始祖至康宗凡八世獻祖徙居海姑水納葛里村再徙安出虎水世祖稱海姑兄弟蓋指其所居也完顏十二部皆以部為氏宣宗詔宗室皆書姓氏然亦有部人以部為氏非宗室同姓者遂不可辨矣
