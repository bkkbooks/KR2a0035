body:
  text: 金史卷一百十二列傳第五十完顏合達移剌蒲阿完顏合達名瞻字景山少長兵閒習弓馬能得人死力貞祐初以親衞軍送岐國公主充護衞三年授臨潢府推官權元帥右監軍時臨潢避遷與全慶兩州之民共壁平州合達隸其經略使烏林荅乞住乞住以便宜授軍中都統累遷提控佩金符未幾會燕南諸帥將兵復中都城行至平州遷安縣臨潢全慶兩軍變殺乞住擁合達還平州推為帥統乞住軍合達以計誅首亂者數人其年六月北兵大將喊得不遣監戰提軍至平州城下以州人黃裳入城招降父老不從合達引兵逆戰知事勢不敵以本軍降於陣監戰以合達北上留半歲令還守平州已而謀自拔歸乃遣奉先縣令紇石烈布里哥北京教授蒲察胡里安右三部檢法蒲察蒲女涉海來報四年十一月合達果率所部及州民並海西南歸國詔進官三階升鎮南軍節度使駐益都與元帥蒙古綱相應接充宣差都提控十二月大元兵徇地博興樂安壽光東涉濰州之境蒙古綱遣合達率兵屢戰於壽光臨淄興定元年正月轉通遠軍節度使兼鞏州管內觀察使七月改平西軍節度使兼河州管內觀察使二年正月知延安府事兼鄜延路兵馬都總管三年正月詔伐宋以合達為元帥右都監三月破宋兵於梅林關擒統領張時又敗宋兵於馬嶺堡獲馬百匹又拔麻城縣獲其令張倜幹辦官郭守紀四月夏人犯通秦寨合達出兵安塞堡抵隆州夏人自城中出步騎二千逆戰進兵擊之斬首數十級俘十人遂攻隆州陷其西南隅會日暮乃還六月行元帥府事於唐鄧上遣諭曰以卿才幹故委卿無使敵人侵軼第固吾圉可也四年正月復為元帥右都監屯延安十月夏人攻綏德州駐兵于拄天山合達將兵擊之別遣先鋒提控樊澤等各率所部分三道以進畢會于山顛見夏人數萬餘傅山而陣即縱兵分擊澤先登摧其左軍諸將繼攻其右敗之五年五月知延安府事兼前職上言諸軍官以屢徙故往往不知所居地形迂直險易緩急之際恐至敗事自今乞勿徙又言河南陝西鎮防軍皆分屯諸路在營惟老稚而已乞選老成人為各路統軍以鎮撫之且督其子弟習騎射將來可用皆從之十一月夏人攻安塞堡其軍先至合達與征行元帥納合買住禦之合達策之曰比北方兵至先破夏人則後易為力於是潛軍裹糧倍道兼進夜襲其營夏人果大潰追殺四十里墜崖谷死者不可勝計上聞之賜金各五十兩重幣十端且詔諭曰卿等克成大功朕聞之良喜經畫如此彼當知畏期之數年卿等可以休息矣仍詔以合達之功徧諭河南帥臣是月與元帥買住又戰延安皆被重創十二月以保延安功賜金帶一玉吐鶻一重幣十端元光元年正月遷元帥左監軍授山東西路吾改必剌世襲謀克權參知政事行省事於京兆未幾真拜是年五月上言頃河中安撫司報北將按察兒率兵入隰吉翼州寖及榮解之境今時已暑猶無回意蓋將蹂吾禾麥儻如此則河東之土非吾有也又河南陝西調度仰給解鹽今正漉鹽之時而敵擾之將失其利乞速濟師臣已擬分兵二萬與平陽上黨晉陽三公府兵同力禦之竊見河中榮解司縣官與軍民多不相諳守禦之閒或失事機乞從舊法凡司縣官使兼軍民庶幾上下相得易以集事又言鹽利今方敵兵迫境不厚以分人孰肯冒險而取之若自輸運者十與其八則人爭赴以濟國用從之葭州提控王公佐言於合達曰去歲十月北兵既破葭州構浮梁河上公佐寓州治北石山子招集餘衆得二千餘人欲復州城以士卒皆自北逃歸者且無鎧仗故嘗請兵於帥府將焚其浮橋以取葭州帥府不聽又請兵援護老幼稍徙內地而帥府亦不應今葭州之民迫於敵境皆有動搖之心若是秋敵騎復來則公佐力屈死於敵手而遺民亦俱屠矣合達乃上言臣願馳至延安與元帥買住議以兵護公佐軍民來屯吳堡伺𨻶而動詔省院議之於是命合達率兵取葭州行至鄜州千戶張子政等殺萬戶陳紋將掠城中合達已勒兵為備子政等乃出城走合達追及之衆復來歸斬首惡數十人軍乃定六月合達上言累獲諜者皆云北方已約夏人將由河中葭州以入陝西防秋在近宜預為計今陝西重兵兩行省分制之然京兆抵平涼六百餘里萬一敵梗其閒使不得通是自孤也宜令平涼行省內族白撒領軍東下與臣協力禦敵以屏潼陝敵退後復議分司為便詔許之二年二月以保鳳翔之功進官賜金幣及通犀帶一是時河中已破合達提兵復取之正大二年七月陝西旱甚合達齋戒請雨雨澍是歲大稔民立石頌德延安既殘毀合達令於西路買牛付主者招集散亡助其耕墾自是延安之民稍復耕稼之利八月鞏州田瑞反合達討之諸軍進攻合達移文諭之曰罪止田瑞一身餘無所問不數日瑞弟濟殺瑞以降合達如約撫定一州民賴以寧三年詔遷平涼行省四年二月徵還拜平章政事芮國公七年七月庚寅朔以平章政事妨職樞密副使初蒲阿面奏合達在軍中久今日多事之際乃在於省用違其長臣等欲與樞密協力軍務擢之相位似亦未晚故有此授十月己未朔詔合達及樞密副蒲阿救衞州初朝廷以山公仙屯衞州公府節制不一欲合而一之至是河朔諸軍圍衞內外不通已連月但見塔上時舉火而已合達等既至先以親衞兵三千嘗之北兵小退翼日圍解上登承天門犒軍皆授世襲謀克賜良馬玉帶全給月俸本色蓋異恩也未幾以蒲阿權參知政事同合達行省事於閺鄉以備潼關先是陝省言備禦策朝官集議上策親征中策幸陝下策棄秦保潼關議者謂止可助陝西軍以決一戰使陝西不守河南亦不可保至是自陝以西亦不守矣八年正月北帥速不木受攻破小關殘盧氏朱陽散漫百餘里間潼關總帥納合買住率夾谷移迪烈都尉高英拒之求救於二省省以陳和尚忠孝軍一千都尉夾谷澤軍一萬往應北軍退追至谷口而還兩省輒稱大捷以聞既而北軍攻鳳翔二省提兵出關二十里與渭北軍交至晚復收兵入關鳳翔遂破二省遂棄京兆與牙古塔起遷居民於河南留慶山奴守之九月北兵入河中時二相防秋還陝量以軍馬出冷水谷以為聲援十一月鄧州報北兵道饒峯關由金州而東於是兩省軍入鄧遣提控劉天山以劄付下襄陽制置司約同禦北兵且索軍食兩省以前月癸卯行留楊沃衍軍守閺鄉沃衍尋被旨取洛南路入商州屯豐陽川備上津與山公仙相掎角合達復留禦侮中郎將完顏陳和尚於閺鄉南十五里乃行陳和尚亦隨而往沃衍軍八千及商州之木瓜平一日夜馳三百里入桃花堡知北兵由豐陽而東亦東還會大軍於鎮平山公仙萬人元駐胡陵關至是亦由荊子口順陽來會十二月朔俱至鄧下屯順陽乃遣天山入宋初宋人於國朝君之伯之叔之納歲幣將百年南渡以後宋以我為不足慮絕不往來故宣宗南伐士馬折耗十不一存雖攻陷淮上數州徒使驕將悍卒恣其殺虜飽其私欲而已又宣徽使奧敦阿虎使北方北中大臣有以輿地圖指示之曰商州到此中軍馬幾何又指興元云我不從商州則取興元路入汝界矣阿虎還奏宣宗甚憂之哀宗即位羣臣建言可因國喪遣使報哀副以遺留物因與之講解盡撤邊備共守武休之險遂下省院議之而當國者有仰而不能俯之疾皆以朝廷先遣人則於國體有虧為辭元年上諭南鄙諸帥遣人往滁州與宋通好宋人每以奏禀為辭和事遂不講然十年之間朝廷屢勅邊將不妄侵掠彼我稍得休息宋人始信之遂有繼好之意及天山以劄付至宋劄付者指揮之別名宋制使陳該怒辱天山且以惡語復之報至識者皆為竊嘆戊辰北兵渡漢江而北諸將以為可乘其半渡擊之蒲阿不從丙子兵畢渡戰於禹山之前北兵小却營於三十里之外二相以大捷驛報百官表賀諸相置酒省中左丞李蹊且喜且泣曰非今日之捷生靈之禍可勝言哉蓋以為實然也先是河南聞北兵出饒峰百姓往往入城壁保險固及聞敵已退至有晏然不動者不二三日游騎至人無所逃悉為捷書所誤九年正月丁酉兩省軍潰於陽翟之三峯山初禹山之戰兩軍相拒北軍散漫而北金軍懼其乘虛襲京城乃謀入援時北兵遣三千騎趨河上已二十餘日泌陽南陽方城襄郟至京諸縣皆破所有積聚焚燬無餘金軍由鄧而東無所仰給乃並山入陽翟既行北兵即襲之且行且戰北兵傷折亦多恆山一軍為突騎三千所衝軍殊死鬬北騎退走追奔之際忽大霧四塞兩省命收軍少之霧散乃前前一大澗長闊數里非此霧則北兵人馬滿中矣明日至三峰山遂潰事載蒲阿傳合達知大事已去欲下馬戰而蒲阿已失所在合達以數百騎走鈞州北兵塹其城外攻之走門不得出匿窟室中城破北兵發而殺之時朝廷不知其死或云已走京兆賜以手詔募人訪之及攻汴乃揚言曰汝家所恃惟黃河與合達耳今合達為我殺黃河為我有不降何待合達熟知敵情習於行陣且重義輕財與下同甘苦有俘獲即分給遇敵則身先之而不避眾亦樂為之用其為人亦可知矣左丞張行信嘗薦之曰完顏合達今之良將也移剌蒲阿本契丹人少從軍以勞自千戶遷都統初哀宗為皇太子控制樞密院選充親衞軍總領佩金符元光二年冬十二月庚寅宣宗疾大漸皇太子異母兄英王守純先入侍疾太子自東宮扣門求見令蒲阿衷甲聚兵屯於艮嶽以備非常哀宗即位嘗謂近臣言向非蒲阿何至於此遂自遙授同知睢州軍州事權樞密院判官自是軍國大計多從決之正大四年十二月河朔軍突入商州殘朱陽盧氏蒲阿逆戰至靈寶東遇游騎十餘獲一人餘即退蒲阿輒以捷聞賞世襲謀克仍厚賜之人共知其罔上而無敢言吏部郎中楊居仁以微言取怒六年二月丙辰以蒲阿權樞密副使自去年夏北軍之在陝西者駸駸至涇州且阻慶陽糧道蒲阿奏陝西設兩行省本以藩衞河南今北軍之來三年於茲行省統軍馬二三十萬未嘗對壘亦未嘗得一折箭何用行省院官亦俱奏將來須用密院軍馬勾當上不語者久之是後以丞相賽不行尚書省事於關中召平章政事合達還朝白撒亦召至闕蒲阿率完顏陳和尚忠孝軍一千駐邠州且令觀北勢八月丙申蒲阿再復潞州十月乙未朔蒲阿東還十二月乙未詔蒲阿與總帥牙吾塔權簽樞密院事訛可救慶陽七年正月戰北兵於大昌原北軍還慶陽圍解詔以訛可屯邠州蒲阿牙吾塔還京兆未幾以權參知政事與合達行省于閺鄉八年正月北軍入陝西鳳翔破兩行省棄京兆而東至洛陽驛被召議河中事語在白華傳十二月北兵濟自漢江兩省軍入鄧州議敵所從出謂由光化截江戰為便放之渡而戰為便張惠以截江為便縱之渡我腹空虛能不為所潰乎蒲阿麾之曰汝但知南事於北事何知我向於裕州得制旨云使彼在沙磧且當往求之況今自來乎汝等更勿似大昌原舊衞州扇車回縱出之定住高樊皆謂蒲阿此言為然合達乃問按得木木以為不然軍中以木北人知其軍情此言為有理然不能奪蒲阿之議順陽留二十日光化探騎至云千騎已北渡兩省是夜進軍比曉至禹山探者續云北騎已盡濟癸酉北軍將近兩省立軍高山各分據地勢步迎於山前騎屯於山後甲戌日未出北兵至大帥以兩小旗前導來觀觀竟不前散如雁翅轉山麓出騎兵之後分三隊而進輜重外餘二萬人合達令諸軍觀今日事勢不當戰且待之俄而北騎突前金兵不得不戰至以短兵相接戰三交北騎少退北兵之在西者望蒲阿親繞甲騎後而突之至於三為蒲察定住力拒而退大帥以旗聚諸將議良久合達知北兵意向時高英軍方北顧而北兵出其背擁之英軍動合達幾斬英英復督軍力戰北兵稍却觀變英軍定復擁樊澤軍合達斬一千夫長軍殊死鬬乃却之北兵回陣南向來路兩省復議彼雖號三萬而輜重三之一焉又相持二三日不得食乘其却退當擁之張惠主此議蒲阿言江路已絕黃河不冰彼入重地將安歸乎何以速為不從乙亥北兵忽不知所在營火寂無一耗兩省及諸將議四日不見軍又不見營鄧州津送及路人不絕而亦無見者豈南渡而歸乎己卯邏騎乃知北軍在光化對岸棗林中晝作食夜不下馬望林中往來不五六十步而不聞音響其有謀可知矣初禹山戰罷有二騎迷入營問之知北兵凡七頭項大將統之復有詐降者十人弊衣羸馬泣訴艱苦兩省信之易以肥馬飲之酒及煖衣食而置之陣後十人者皆鞭馬而去始悟其為覘騎也庚辰兩省議入鄧就糧辰巳間到林後北兵忽來突兩省軍迎擊交綏之際北兵以百騎邀輜重而去金兵幾不成列逮夜乃入城懼軍士迷路鳴鍾招之樊澤屯城西高英屯城東九年正月壬午朔耀兵於鄧城下北兵不與戰大將使來索酒兩省與之二十瓶癸未大軍發鄧州趨京師騎二萬步十三萬騎帥蒲察定住蒲察荅吉卜郎將按忒木忠孝軍總領夾谷愛荅內族達魯歡總領夾谷移特剌提控步軍臨淄郡王張惠殄寇都尉完顏阿排高英樊澤中軍陳和尚與山公武仙楊沃衍軍合是日次五𩽆山下取鴉路北兵以三千騎尾之遂駐營待楊武楊武至知申裕兩州已降七日至夜議北騎明日當復襲我彼止騎三千而我示以弱將為所輕當與之戰乃伏騎五十於鄧州道明日軍行北騎襲之如故金以萬人擁之而東伏發北兵南避是日雨宿竹林中庚寅頓安臯辛卯宿鴉路魯山河西軍已獻申裕擁老幼牛羊取鴉路金軍適值之奪其牛羊餉軍癸巳望鈞州至沙河北騎五千待於河北金軍奪橋以過北軍即西首歛避金軍縱擊北軍不戰復南渡沙河金軍欲盤營北軍復渡河來襲金軍不能得食又不得休息合昏雨作明旦變雪北兵增及萬人且行且戰至黃榆店望鈞州二十五里雨雪不能進盤營三日丙申一近侍入軍中傳旨集諸帥聽處分制旨云兩省軍悉赴京師我御門犒軍換易御馬然後出戰未晚復有密旨云近知張家灣透漏二三百騎已遷衞孟兩州兩省當常切防備領旨訖蒲阿拂袖而起合達欲再議蒲阿言止此而已復何所議蓋已奪魄矣軍即行北軍自北渡者畢集前後以大樹塞其軍路沃衍軍奪路得之合達又議陳和尚先擁山上大勢比再整頓金軍已接竹林去鈞州止十餘里矣金軍遂進北軍果却三峯之東北西南武高前鋒擁其西南楊樊擁其東北北兵俱却止有三峯之東張惠按得木立山上望北兵二三十萬約厚二十里按得木與張惠謀曰此地不戰欲何為耶乃率騎兵萬餘乘上而下擁之北兵却須臾雪大作白霧蔽空人不相覿時雪已三日戰地多麻田往往耕四五過人馬所踐泥淖沒脛軍士被甲冑僵立雪中槍槊結凍如椽軍士有不食至三日者北兵與河北軍合四外圍之熾薪燔牛羊肉更遞休息乘金困憊乃開鈞州路縱之走而以生軍夾擊之金軍遂潰聲如崩山忽天氣開霽日光皎然金軍無一人得逃者武仙率三十騎入竹林中楊樊張三軍爭路北兵圍之數重及高英殘兵共戰於柿林村南沃衍澤英皆死惟張惠步持大槍奮戰而歿蒲阿走京師未至追及擒之七月械至官山召問降否往復數百言但曰我金國大臣惟當金國境內死耳遂見殺贊曰金自南渡用兵克捷之功史不絕書然而地不加闢殺傷相當君子疑之異時伐宋唐州之役喪師七百主將訛論匿之而以捷聞御史納蘭糾之宣宗奬御史而不罪訛論是君臣相率而為虛聲也禹山之捷兩省為欺遂致誤國豈非宣宗前事有以啟之耶至於三峯山之敗不可收拾上下眙而金事已去十九天朝取道襄漢懸軍深入機權若神又獲天助用能犯兵家之所忌以建萬世之儁功合達雖良將何足以當之蒲阿無謀獨以一死無愧猶足取焉爾
