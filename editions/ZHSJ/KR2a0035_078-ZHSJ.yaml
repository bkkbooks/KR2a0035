body:
  text: 金史卷七十八列傳第十六劉彥宗劉萼劉筈劉仲誨劉頍時立愛韓企先子鐸劉彥宗字魯開大興宛平人遠祖怦唐盧龍節度使石晉以幽薊入遼劉氏六世仕遼相繼為宰相父霄至中京留守彥宗擢進士乙科天祚走天德秦晉國王耶律里自立于燕擢彥宗留守判官蕭妃攝政遷簽書樞密院事太祖至居庸關蕭妃自古北口遁去都監高六送款于太祖太祖奄至駐蹕城南彥宗與左企弓等奉表降太祖一見器遇之俾復舊遷左僕射佩金牌張覺為南京留守太祖聞覺有異志使彥宗斜鉢宣慰之太祖至鴛鴦濼不豫還上京留宗翰都統軍事留彥宗佐之及張覺敗奔于宋衆推張敦固為都統殺使者乘城拒守攻之不肯下彥宗同中書門下平章事知樞密院事加侍中佐宗望軍宗望奏方圖攻取凡州縣之事委彥宗裁決之天會二年詔彥宗曰中京等兩路先多拒命故遣使撫諭貰其官民之罪所犯在降附前者勿論卿等選官與使者往諭之使勤于稼穡未幾大舉伐宋彥宗畫十策詔彥宗兼領漢軍都統蔡靖以燕山降詔彥宗凡燕京一品以下官皆承制注授遂進兵伐宋至汴宋少帝割地納質師還宗望分將士屯安肅雄霸廣信之境留闍母彥宗于燕京節制諸軍明年再伐宋已圍汴京彥宗謂宗翰宗望曰蕭何入關秋豪無犯惟收圖籍遼太宗入汴載路車法服石經以歸皆令則也二帥嘉納之執二帝以歸天會六年薨年五十三追封鄆王正隆二年例降封開府儀同三司大定十五年追封兗國公諡英敏子萼筈萼彥宗季子也遼末以蔭補閤門祗候天輔七年授禮賓使累官德州防禦使天德初稍加擢用歷左右宣徽使拜參知政事進尚書左丞為沁南軍節度使歷臨洮太原尹正隆南伐為漢南道行營兵馬都統制大定初除興中尹封任國公歷順天定武軍節度使濟南尹萼淫縱無行所至貪墨狼籍廉使劾之詔遣大理少卿張九思就濟南鞫問既就逮不測所以引刃自殺不死詔削官一階罷歸田里卒子仲詢天德三年賜王彥潛牓及第筈彥宗次子幼時以廕隸閤門不就去從學遼末調兵而筈在選中遼兵敗左右多散亡乃選筈為扈從授左承制遼主西奔蕭妃攝政賜筈進士第授尚書左司員外郎寄班閤門天輔七年太祖取燕筈從其父兄出降遷尚書左司郎中八年授殿中少監太祖崩宋夏遣使弔慰凡館見禮儀皆筈詳定遷衞尉少卿授西上閤門使仍從事元帥府元帥府以便宜從事凡約束廢置及四方號令多從筈之畫焉天會二年遷太常少卿東上閤門使從宗翰伐宋圍太原遷衞尉卿權簽宣徽院事四年授左諫議大夫秋復南征權中書省樞密院事丁父憂明年起復直樞密院事加給事中七年為禮部侍郎十年改彰信軍節度使權簽中書省樞密院事天眷二年改左宣徽使熙宗幸燕法駕儀仗筈討論者為多皇統二年充江南封冊使假中書侍郎既至臨安而宋人牓其居曰行宮筈曰未受命而名行宮非也請去牓而後行禮宋人驚服其有識欲厚賄說之奉金珠三十餘萬而筈不之顧皆嘆曰大國有人焉六年為行臺尚書右丞相兼判左宣徽使事留京師或請釐革河南官吏之濫雜者筈曰廢齊用兵江表求一切近効其所用人不必皆以章程故有不由科目而為大吏不試弓馬而握兵柄者今撫定未久姑收人心奈何為是紛更也遂仍其舊七年帥府議於館陶築三城以為有警即令北軍入居之筈曰今天下一家孰為南北設或有變軍人入城獨能安耶當嚴武備以察姦無示彼此之間也其後竟從筈議初以河外三州賜夏人或言秦之在夏者數千人皆願來歸諸將請約之筈曰三小州不足為輕重恐失朝廷大信且秦人之在蜀者倍多於此何獨捨彼而取此乎遂從筈議陝西邊帥請完沿邊城郭以備南寇筈曰我利車騎而不利城守今城之則勞民而結怨況盟已定豈可妄動遂罷之九年八月拜司空九月拜平章政事封吳國公行臺右丞相如故天德元年封滕王二年拜尚書右丞相兼中書令進封鄭王未幾以疾求解政務授燕京留守進封曹王居數月乞致仕筈自為宣徽使以能得悼后意致位宰相海陵即位意頗鄙之及筈求致仕詔略曰不為暗於臨事不為諂於事君未許告歸姑從解職筈因慚懼而死年五十八子仲誨仲誨字子忠皇統初以宰相子授忠勇校尉九年賜進士第除應奉翰林文字海陵嚴暴臣下應對多失次嘗以時政訪問在朝官仲誨從容敷奏無懼色海陵稱賞之貞元初丁父憂起復翰林修撰大定二年遷待制尋兼修起居注左補闕三年詔仲誨與左司員外郎蒲察蒲速越廉問所過州縣仲誨等還奏狀詔玉田縣令李方進一階順州知法權密雲縣事王宗永擢密雲縣尉順州司候張璘密雲縣尉石抹烏者皆免去丁母憂起復太子右諭德遷翰林直學士改棣州防禦使次縣捕得強盜數十人詣州欲以全獲希賞仲誨疑其有寃緩其獄同僚曰縣境多盜請置之法以懲其餘仲誨乃擇老穉者先釋之未幾乃獲真盜入為禮部侍郎兼左諭德遷太子詹事兼左諫議大夫上曰東宮官屬尤當選用正人如行檢不修及不稱位者具以名聞又曰東宮講書或論議間當以孝儉德行正身之事告之頃之東宮請增牧人及張設什用上謂仲誨曰太子生於富貴每教之恭儉朕服御未嘗妄有增益卿以此意諭之改御史中丞十四年為宋國歲元使宋主欲變親起接書之儀遣館伴王抃來議曲辨強說欲要以必從仲誨曰使臣奉命遠來修好固欲成禮而信約所載非使臣輒敢變更公等宋國腹心毋僥倖一時失大國歡往復再三竟用舊儀親起接書成禮而還復為太子詹事遷吏部尚書轉太子少師兼御史中丞坐失糾舉大長公主事與侍御史李瑜各削一階仲誨前後為東宮官且十五年多進規戒顯宗特加禮敬大定十九年卒仲誨立朝峻整容色莊重世宗嘗曰朕見劉仲誨嘗若將切諫者其以剛嚴見知如此頍字元矩以大臣子孫充閤門祗候調莘縣令召為承奉班都知遷西上閤門副使兼宮苑令累遷西上東上閤門使泰和二年宋盱眙軍報明年賀正旦使魯楊明輝及過界副使乃王處久入見魯殿上不雙跪詔頍就閤詰問先報名銜楊明輝不復報改王處久之故及不雙跪者魯對拜時並雙跪有足疾似單跪者初南苑有唐舊碑書貞元十年御史大夫劉怦葬上見之曰苑中不宜有墓頍家本怦後詔賜頍錢三百貫改葬之三遷右宣徽使貞祐二年轉左宣徽使明年致仕遷一官上曰卿舊人也今朝廷多故豈宜去位朕自東宮薨後思慮不周俟稍寧息即以上郡處卿頃之起為知開封府四年正月元日攝左宣徽使再請老未半歲復起為御史中丞詔安撫河南路捕盜賊坐與保靜軍節度使會飲解職起為太子詹事遷太子少師詹事院欲闢廣東宮周牆頍請於皇太子曰師旅饑饉之際何為興此役遂止尋卒時立愛字昌壽涿州新城人父承謙以財雄鄉里歲飢發倉釰賑貧乏假貸者與之折券遼太康九年中進士第調泰州幕官丁父憂服除調同知春州事未逾年遷雲內縣令再除文德令樞密院選為吏房副都承旨轉都承旨累遷御史中丞剛正敢言忤權貴除燕京副留守丁母憂起復舊職遷遼興軍節度使兼漢軍都統太祖已定燕京訪求得平州人韓詢持詔招諭平州是時奚王回离保在盧龍嶺立愛未敢即朝見先使人來送款曰民情愚執不即順從願降寬恩以慰反側詔曰朕親巡西土底定全燕號令所加城邑皆下爰嘉忠款特示優恩應在彼大小官員可皆充舊職諸囚禁配隸並從釋免於是遼帝尚在天德平州雖降民心未固奚王回离保軍所在保聚薊州已降復叛民間流言謂金人所下城邑始則存撫後則俘掠時立愛雖開諭而不肯信乃上表乞下明詔遣官分行郡邑宣諭德義他日兵臨于宋順則撫之逆則討之兵不勞而天下定矣上覽表嘉之詔答曰卿始率吏民歸附復條利害悉合朕意嘉歎不忘山西部族緣遼主未獲恐陰相連結故遷處于嶺東西京人民既無異望皆按堵如故或有將卒貪悍冒犯紀律輒掠降人者已諭諸部及軍帥約束兵士秋豪有犯必刑無赦今遣斡羅阿里等為卿副貳以撫斯民其告諭所部使知朕意其後以平州為南京用張覺為留守時立愛遂去平州而張覺遂因燕京人東徙其衆怨望覺遂叛入于宋立愛既去平州歸鄉里太祖以燕薊與宋新城入于宋宋累詔立愛立愛見宋政日壞不肯起戒其宗族不得求仕及宗望再取燕山立愛詣幕府上謁拜同中書門下平章事任其子姪數人立愛從宗望軍數年謀畫居多封陳國公表求解機務不從九年為侍中知樞密院事久之加中書令天會十五年致仕加開府儀同三司鄭國公薨于家年八十二賻贈錢布繒帛有差詔同簽書燕京樞密院事趙慶襲護喪事葬用皆官給之韓企先燕京人九世祖知古仕遼為中書令徙居柳城世貴顯乾統間企先中進士第回翔不振都統杲定中京擢樞密副都承旨稍遷轉運使宗翰為都統經略山西表署西京留守天會六年劉彥宗薨企先代之同中書門下平章事知樞密院事七年遷尚書左僕射兼侍中封楚國公初太祖定燕京始用漢官宰相賞左企弓等置中書省樞密院于廣寧府而朝廷宰相自用女直官號太宗初年無所改更及張敦固伏誅移置中書樞密于平州蔡靖以燕山降移置燕京凡漢地選授調發租稅皆承制行之故自時立愛劉彥宗及企先輩官為宰相其職大抵如此斜也宗幹當國勸太宗改女直舊制用漢官制度天會四年始定官制立尚書省以下諸司府寺十二年以企先為尚書右丞相召至上京入見太宗甚驚異曰朕疇昔嘗夢此人今果見之於是方議禮制度損益舊章企先博通經史知前代故事或因或革咸取折衷企先為相每欲為官擇人專以培植奬勵後進為己責任推轂士類甄別人物一時臺省多君子彌繨闕漏密謨顯諫必咨於王宗翰宗幹雅敬重之世稱賢相焉皇統元年封濮王六年薨年六十五正隆二年例降封齊國公大定八年配享太宗廟廷十年司空李德固孫引慶求襲其祖猛安世宗曰德固無功其猛安且闕之漢人宰相惟韓企先最賢他不及也十一年將圖功臣像于衍慶宮上曰丞相企先本朝典章制度多出斯人之手至於關決大政與大臣謀議不使外人知之由是無人能知其功前後漢人宰相無能及者置功臣畫像中亦足以示勸後人十五年諡簡懿韓鐸字振文企先次子也皇統末以大臣子授武義將軍熙宗聞其有儒學賜進士第除宣徽判官再遷刑部員外郎海陵遣中使諭之曰郎官高選也汝勳賢之子行已蒞官能世其家故以命汝苟能夙夜在公當不次擢用雖公相可到鐸感奮獄或有疑據經議讞海陵伐宋改兵部員外郎大定初遷本部郎中累官河州防禦使求養親解去召為左諫議大夫遷中都路都轉運使頃之上謂宰臣曰韓鐸年高不任繁劇且其母老矣可與之便郡於是改順天軍節度使卒贊曰太祖入燕始用遼南北面官僚制度是故劉彥宗時立愛規為施設不見于朝廷之上軍旅之暇治官政庀民事務農積穀內供京師外給轉餉此其功也韓企先入相兩朝幾二十年成功著業世宗稱其賢焉
