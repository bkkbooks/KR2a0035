body:
  text: 金史卷一百列傳第三十八孟鑄宗端脩完顏閭山路鐸完顏伯嘉术虎筠壽張煒高竑李復亨孟鑄大定末補尚書省令史明昌元年御史臺奏薦戶部員外郎李獻可完顏掃合太府丞徒單繹宮籍監丞張庸右警巡使袞禮部主事蒲察振壽戶部主事郭蛻應奉翰林文字移剌益中都鹽鐵判官趙暠尚書省令史劉昂及鑄十一人皆剛正可用詔除獻可右司諫掃合磁州刺史繹祕書丞庸中都右警巡使袞彰國軍節度副使振壽治書侍御史蛻同知定武軍節度使事益翰林修撰暠都水丞昂戶部主事鑄刑部主事累遷中都路按察副使南京副留守河平軍節度使泰和四年入為御史中丞召見於香閤上謂鑄曰朕自知卿非因人薦舉也御史責任甚重往者臺官乃推求細故彈劾小官至於巨室重事則畏徇不言其勤乃職無廢朕命是歲自春至夏諸郡少雨鑄奏今歲愆陽已近五月比至得雨恐失播種之期可依種麻菜法擇地形稍下處撥畦種穀穿土作井隨宜灌溉上從其言區種法自此始無何奏彈知大興府事紇石烈執中過惡其文略曰京師百郡之首四方取則知府執中貪殘專恣不奉法令自奉聖州罪解以後怙罪不悛蒙朝廷恩貸轉生跋扈雄州詐奪人馬平州冒支已俸無故破魏廷碩家發其冢墓拜表以調鷹不赴祈雨聚妓戲嬉毆詈同僚擅令住職失師帥之體乞行黜退以厭人望上以執中東宮舊人頗右之謂鑄曰執中粗人似有跋扈者鑄曰明天子在上豈容有跋扈之臣上悟詔尚書省問之泰和五年唐鄧河南屢有警議者謂宋且敗盟六年正月宋賀正旦使陳克俊等朝辭上使鑄就館諭克俊以國家涵容之意果不詳此旨恐兵未可息也使以上言達宋主章宗本無意用兵故再三諭之鑄論提刑司改按察司差官覆察權削望輕下尚書省議參知政事賈鉉奏乞差監察時即別遣官偕往更不覆察諸疑獄並令按察司從正與決庶幾可慰人望從之永豐庫官不守宿因而被盜上召登聞鼓院官欲有所問皆不在上諭鑄曰此輩慢法如此御史臺所職何事也復諭御史大夫宗肅及鑄曰朕聞唐宰相宿省中卿等所知也臺官六部官其餘司局亦嘗宿直今尚書省左右司官宿直餘亦當準此八年除絳陽軍節度使至寧元年復為御史中丞紇石烈執中作亂召鑄及右諫議大夫張行信俱至大興府問曰汝輩向來彈我者耶鑄等各以正言答之執中乃遣還家曰且須後命既而執中死鑄亦尋卒宗端脩字平叔汝州人章宗避睿宗諱上一字凡太祖諸子皆加山為崇改宗氏為姬氏端脩好學喜名節中大定二十二年進士第明昌間補尚書省令史承安元年監察御史孫椿年武簡職事不修舉詔以端脩及范鐸代之是時元妃李氏兄弟干預朝政端脩上書乞遠小人上遣李喜兒傳詔問端脩小人為誰其以姓名對端脩對曰小人者李仁惠兄弟仁惠喜兒賜名也喜兒不敢隱具奏之上雖責喜兒兄弟而不能去也四年復上書言事宰相惡之坐以不經臺官直進奏帖准上書不以實削一官期年後章宗知端脩不為衆所容釋之改大理司直泰和四年遷大理丞召見于香閤上謂端脩曰汝前為御史以幹能見用汝言多細碎不究其實嘗令問汝亦不汝罪及為大理司直乃能稱職用是擢汝為丞盡乃心力惟法是守勿問上位宰執所見何如汝其志之知大興府紇石烈執中陳言下大理寺議端脩謂執中言事涉私治罪詔以端脩別出情見不當與司直溫敦按帶各削一官解職久之為節度副使卒官端脩終以直道不振於時自守愈篤妻死不復更娶獨居二十年士論高之汝州司候游彥哲將之官問為政端脩曰為政不難治氣養心而已彥哲不達端脩曰心正則不私氣平則不暴為政之術盡於此矣完顏閭山蓋州猛安人明昌二年進士累調觀察判官補尚書省令史知管差除授都轉運都勾判官改河東南路轉運都勾判官南京警巡使丁母憂起復南京按察判官累遷沁南軍節度使入為工部尚書貞祐三年知京兆府事充行省參議官四年知鳳翔府事興定元年冬詔陝西行省伐宋閭山權元帥右都監參議諸軍事宋兵千餘人伏吳寨谷閭山率騎兵掩擊敗之追襲十五里殺三百餘獲牛羊以千計改知平涼府敗宋人于步落堝遷官一階三年召為吏部尚書廷議選戶部官往往舉聚斂苛刻以應詔閭山曰民勞至矣復用此輩將何以堪識者稱之三年朝廷以晉安行元帥府陀胡土門暴刻以閭山代之是歲十月卒路鐸字宣叔伯達子也明昌三年為左三部司正上書言事召見便殿遷右拾遺明年盧溝河決鐸請自玄同口以下丁村以上無修舊堤縱使分流以殺減水勢詔工部尚書胥持國與鐸同檢視章宗將幸景明宮是歲民饑不可行御史中丞董師中上書諫鐸與左補闕許安仁繼之賜對御閤詔尚書省曰朕不禁暑熱欲往山後今臺諫言民間多闕食朕初不盡知既已知之其忍自奉以重困民哉乃罷行尚書左丞完顏守貞每論政事守正不移與同列不合罷知東平府事臺諫因而擠之鐸上書論守貞賢可復用其言太切召對于崇政殿既而章宗以鐸書語大臣於是尚書左丞烏林荅愿參知政事夾谷衡胥持國奏路鐸以梁冀比右丞相所言狂妄不稱諫職右丞相夾谷清臣也上曰周昌以桀紂比漢高祖高祖不以為忤路鐸以梁冀比丞相耳頃之守貞入為平章政事五年復與禮部尚書張暐御史中丞董師中右諫議大夫賈守謙翰林修撰完顏撒剌諫幸景明宮語多激切章宗不能堪遣近侍局直長李仁愿召凡諫北幸者詣尚書省詔曰卿等諫北幸甚善但其間頗失君臣之體耳是歲郝忠愈獄起事密諫官不能察其詳議者頗謂事涉鎬王永中思有以寬解上意右諫議大夫賈守謙上封事鐸繼之尤切直上優容之謂鐸曰汝言諸王皆有覬心游其門者不無橫議是何言也但朕不罪諫官耳頃之尚書省奏擬鐸同知河北西路轉運使事詔再任右拾遺謂宰相曰鐸敢言但識短耳朕嘗詰責而氣不沮鐸因召對論宰相權太重上曰凡事由朕宰相安得權重既而復奏曰乞陛下勿泄此言泄則臣虀粉矣上曰宰相安能虀粉人至是章宗並以此言告宰相雖留再任宰相愈銜之改右補闕自完顏守貞再入相以政事為己任胥持國方幸尤忌守貞幷忌鐸輩鐸輩雖嘗為守貞論辨而不相附鐸論邊防守貞以為掇拾唐人餘論皆不行及守貞持鎬王永中事久不決鐸等亦上言切諫並指以為黨上乃出守貞知濟南府凡曾薦守貞者皆黜降謂宰臣曰董師中謂臺省無守貞不可治路鐸李敬義皆稱舉之者然三人者後俱可用今姑出之上復曰路鐸敢言甚有時名一旦外補人將謂朕不能容直臣可選敢言及才識處鐸右者參知政事馬琪奏曰鐸雖知無不言然亦多不當理上曰諫官非但取敢言亦須間有出朕意表者乃有裨益耳於是吏部尚書董師中出為陝西西路轉運使鐸為南京留守判官戶部郎中李敬義方使高麗還即出為安化軍節度副使詔曰卿等昨來交薦守貞公正可用今坐所舉失實耳承安二年召為翰林修撰同看讀陳言文字上召禮部尚書張暐大理卿麻安上及鐸問趙晏所言十事因問董師中張萬公優劣鐸奏師中附胥持國以進趙樞張復亨張嘉貞皆出持國門下嘉貞復趨走襄之門持國不可復用若再相必亂綱紀上曰朕豈復相此人但遷官二階使致仕何為不可持國黨聞之怒愈甚改監察御史參知政事楊伯通引用鄉人李浩鐸劾奏伯通以公器結私恩左司郎中賈益知除武郁承望風旨不詳檢起復條例涉妄冒大夫張暐抑之不行上命同知大興府事賈鉉詰問張暐伯通待罪于家賈鉉奏近詔書詰問御史大夫張暐暐言路鐸嘗禀會楊伯通私用鄉人李浩暐以為彈絀大臣須有阿曲實迹恐所劾不當臺綱愈壞令再體察賈益言除授皆宰執公議奏禀不見伯通私任形迹於是詔責鐸言事輕率慰諭伯通治事如故頃之遷侍御史主奏事監察御史姬端脩以言事下吏使御史臺令史郭公仲達意于大夫張暐及鐸暐與鐸奏事殿上上問姬端脩彈事嘗申臺官否對曰嘗來面議端脩款伏乃云秪曾與侍御私議大夫不知也既而端脩杖七十收贖公仲杖七十替罷暐鐸坐奏事不實暐追一官鐸兩官皆解職頃之起為泰定軍節度副使上謂宰臣曰凡言事者議及朕躬亦無妨語涉宰相間有憎嫌何以得進詔左司計鐸資考至正五品即除東平府治中未幾景州闕刺史尚書省已奏郭歧為之詔特改鐸為景州刺史仍勿送審官院鐸述十二訓以教民詔曰路鐸十二訓皆勸人為善遍諭州郡使知之遷陝西路按察副使坐以糾彈之官與京兆府治中蒲察張鐵總管判官辛孝儉推官愛剌宴飲奪一官解職泰和六年召為翰林待制兼知登聞鼓院累除孟州防禦使貞祐初城破投沁水死鐸剛正歷官臺諫有直臣之風為文尚奇詩篇溫潤精緻號虛舟居士集云完顏伯嘉字輔之北京路訛魯古必剌猛安人明昌二年進士調中都左警巡判官孝懿皇后妹晉國夫人家奴買漆不酬直伯嘉鈎致晉國用事奴數人繫獄晉國白章宗章宗曰姨酬其價則奴釋矣由是豪右屏迹改寶坻丞補尚書省令史除太學助教監察御史劾奏平章政事僕散揆或曰與宰相有隙奈何伯嘉曰職分如此遷平涼治中累官莒州刺史讞屬縣盜伯嘉曰飢寒為盜得錢二千經月不使一錢云何此必官兵捕他盜不獲誣以準罪耳詰之果然詔與按察官俱推排物力召見于香閤大安中三遷同知西京留守權本路安撫使貞祐初遷順義軍節度使居父母喪卒哭起復震武軍節度使兼宣撫副使提控太和嶺諸隘副統李鵬飛誣殺彰國軍節度使牙改詔伯嘉治之貞祐四年三月伯嘉奏西京副統程琢智勇過人持心忠孝以私財募集壯士二萬復取渾源白登有恢復山西之志已命駐于弘州矣近者靖大中完顏毛吉打以三千人歸國各遷節度副使今山西已不守琢收合餘衆盡忠於國百戰不挫臣恐失機會輒擬琢昭勇大將軍同知西京留守事兼領一路義軍給以空名勅二十道許擇有謀略者充州縣制可仍賜琢姓夾谷氏琢請曰前代皆賜國姓不繫他族如蒙更賜榮莫大焉詔更賜完顏氏是月伯嘉遷元帥左監軍知太原府事河東北路宣撫使以同知太原府斡勒合打為彰國軍節度使宣撫副使六月斡勒合打奏同知西京留守完顏琢恃與宣撫使伯嘉雅善徙居代州肆為侵掠遙授太原治中權堅州刺史完顏斜烈私離邊面臣白伯嘉伯嘉不悅遣臣護送糧運于代州臣請益兵乃以羸卒數百見付半無鎧仗臣復為言伯嘉怒臣榜掠幾死臣立功累年頗有寸効伯嘉挾私陵轢無復宣撫同僚之禮臣欲不言恐他日反為所誣無以自明上問宰臣奏曰太原重鎮防秋在邇請勅諭和解詔曰太原兵衝若以私忿廢國事國家何賴焉卿等同心戮力以分北顧之憂無執前非誤大計也七月伯嘉改知歸德府事合打改武寧軍節度使御史臺奏宣撫副使合打訴元帥伯嘉以私忿加箠楚令本臺廉問既得其事遂不復窮治若合打奏實伯嘉安得無罪伯嘉無罪合打合坐欺罔乞審正是非明示黜陟宣宗曰今正防秋且已初河東行省胥鼎奏完顏伯嘉屢言同知西京留守兼臺州刺史完顏琢可倚之以復山西朝廷遷官賜姓令屯代北太和嶺今聞諸隘悉無琢兵蓋琢挈太原之衆保五臺剽掠耳如尚以伯嘉之言為可信乞遣琢出太原或徙之內地分處其衆以備不測之變宰臣奏已遣官體究琢軍且令太原元帥府烏古論德升召琢使之矣當以此意報鼎無何德升奏琢兵數萬分屯代州諸險拒戰甚力其衆烏合非琢不可制胥鼎復奏宣差提控古里甲石倫言琢方招降人謀復山西盤桓于忻代定襄間恣為侵擾無復行意發掘民粟戕殺無辜雖曰不煩官廩博易為名實則攘劫欺國害民無如琢者石倫之言如此臣已令帥府禁止之矣宰臣奏所遣官自忻代來云不見劫掠之迹惟如德升言便從之伯嘉至歸德上言乞雜犯死罪以下納粟贖免宰臣奏伯嘉前在代州嘗行之蓋一時之權不可為常法遂寢俄改簽樞密院事未閱月改知河南府事是時甫經兵後乏兵食伯嘉令輸棗栗菜根足之皆以為便興定元年知河中府充宣差都提控未幾召為吏部尚書二年改御史中丞初貞祐四年十月詔以兵部尚書簽樞密院事蒲察阿里不孫為右副元帥備禦潼關陝州次澠池土濠村兵不戰而潰阿里不孫逸去亡所佩虎符變易姓名匿柘城縣與其妻妹前韓州刺史合喜男婦紇石烈氏及僕婢三人僦民舍居止合喜母徒單氏聞之捕執紇石烈斷其髮拘之佛寺中阿里不孫復亡去監察御史完顏藥師劾奏乞就詰紇石烈及僕婢當得所在其妻子見在京師亦無容不知請窮治有司方繫其家人特命釋之詔曰阿里不孫若能自出當免極罪阿里不孫乃使其子上書請圖後効尚書省奏阿里不孫幸特赦死當詣闕自陳乃令其子上書猶懷顧望伯嘉劾之曰古之為將者受命之日忘其家臨陣之日忘其身服喪衣鑿凶門而出以示必死進不求名退不避罪惟民是保阿里不孫膺國重寄握兵數萬未陣而潰委棄虎符既不得援枹鼓以死敵又不能負斧鑕而請罪逃命竄伏猥居里巷挾匿婦人為此醜行聖恩寬大曲赦其死自當奔走闕庭皇恐待命安坐要君略無忌憚迹其情罪實不容誅此而不懲朝綱廢矣乞尸諸市以戒為臣之不忠者宣宗曰中丞言是業已赦之矣阿里不孫乃除名五月充宣差河南提控捕蝗許決四品以下宣宗憂旱伯嘉奏曰日者君之象陽之精旱熯乃人君自用亢極之象宰執以為寃獄所致夫爕和陰陽宰相之職而猥歸咎於有司高琪武弁出身固不足論汝礪輩不知所職其罪大矣漢制災異策免三公顧歸之有司邪臣謂今日之旱聖主自用宰相諂諛百司失職實此之由高琪汝礪深怨之禮部郎中抹撚胡魯剌以言事忤旨集五品以上官顯責之明日伯嘉諫曰自古帝王莫不欲法堯舜而為桀紂蓋堯舜納諫桀紂拒諫也故曰納諫者昌拒諫者亡胡魯剌所言是無益於身所言不是無損於國陛下廷辱如此獨不欲為堯舜乎近日言事者語涉謗訕有司當以重典陛下釋之與其釋之以為恩曷若置之而不問宰相請修山寨以避兵伯嘉諫曰建議者必曰據險可以安君父獨不見陳後主之入井乎假令入山寨可以得生能復為國乎人臣有忠國者有媚君者忠國者或拂君意媚君者不為國謀臣竊論之有國可以有君有君未必有國也高琪汝礪聞之怒愈甚十二月以御史中丞權參知政事元帥左監軍行尚書省元帥府于河中控制河東南北路便宜從事興定三年伯嘉至河中奏曰本路衝要不可闕官凡召辟者每以艱險為辭乞凡檄召無故不至者宜令降罰悉心幹當者視所歷升遷詔召不至者決杖一百餘如所請廷議欲棄河東徙其民以實陝西伯嘉上書諫曰中原之有河東如人之有肩背古人云不得河東不雄萬一失之恐未易取也大忤宰執意頃之召還罷為中丞伯嘉入見奏曰如臣駑鈍固宜召還更須速遣大臣鎮撫宣宗深然之伯嘉上疏曰國家兵不強力不足以有為財不富賞不足以周衆獨恃官爵以激勸人心近日以功遷官赴都求調者有司往往駁之冒濫者固十之三既與而復奪之非所以勸功也乞應軍功遷官宣勅無偽者即準用之又曰自兵興以來河北桀黠往往聚衆自保未有定屬乞賜招撫署以職名無為他人所先又曰河東河北有能招集餘民完守城寨者乞無問其門地皆超踰等級授以本處見任之職又曰河中晉安被山帶河保障關陝此必爭之地今雖殘破形勢猶存若使他人據之因鹽池之饒聚兵積糧則河津以南太行以西皆不足恃矣四年秋河南大水充宣慰副使按行京東奏曰亳州災最甚合免三十餘萬石三司止奏除十萬石民將重困惟陛下憐之詔治三司奏災不以實罪伯嘉行至蘄縣聞前有紅襖賊不敢至泗州監察御史烏古孫奴申劾伯嘉違詔不遍按視又曰伯嘉知永城縣主簿蒙古訛里剌不法沈丘令夾谷陶也受賄匿而不發前穀城縣令獨吉鼎术可嘗受業伯嘉伯嘉諷御史辟之詔有司鞫問會赦免五年起為彰化軍節度使改翰林侍講學士伯嘉純直不能與時低昂嘗曰生為男子當益國澤民其他不可學也高汝礪方希寵固位伯嘉論事輒與之忤由是毀之者衆元光元年坐言事過切降遙授同知歸德府事二年三月遙授集慶軍節度使權參知政事行尚書省于河中率陝西精銳與平陽公史詠共復河東頃之伯嘉有疾六月薨伯嘉去太原後完顏琢寓軍平定石仁寨權平定州刺史范鐸以閻德用充本州提控德用桀驁蓄姦謀鐸不能制委曲容庇之興定元年德用率所部掩襲殺琢及官屬程珪等百餘人遂據石仁寨鐸懼挈家奔太原德用遂據平定州二年十月詔誅范鐸术虎筠壽貞祐間為器物局直長遷副使貞祐三年七月工部下開封市白牯取皮治御用鞠仗筠壽以其家所有鞠仗以進因奏曰中都食盡遠棄廟社陛下當坐薪懸膽之日奈何以毬鞠細物動搖民間使屠宰耕牛以供不急之用非所以示百姓也宣宗不懌擲仗籠中明日出筠壽為橋西提控贊曰孟鑄宗端脩路鐸盡言於章宗皆擯斥不遂鑄劾胡沙虎可謂先知雖行其言弗究厥罰厥後胡沙虎逆謀胥持國終至于誤國而不悟也宣宗時完顏素蘭許古皆敢言者亦挫于高琪汝礪之手蕢土不能塞河決有以也夫完顏伯嘉以著功參大政亦不能一朝而安言之難也如是哉术虎筠壽所謂執藝事以諫者邪張煒字子明洺州永年人本名燝避章宗嫌名改焉大定二十五年進士調葭州軍事判官再遷中都左警巡使煒喜言功利寡廉節交通部民閻元翬縉紳薄之累官戶部員外郎承安五年天色久陰晦平章政事張萬公奏此由君子小人邪正不分所致君子宜在內小人宜在外章宗問孰為小人萬公對曰戶部員外郎張煒文繡署丞田櫟都水監丞張嘉貞雖有幹才無德而稱好奔走以取勢利大抵論人當先德後才詔三人皆與外除煒出為同知鎮西軍節度使事轉同知西京轉運使事是時大築界牆被行戶工部牒主役事丁母憂起復桓州刺史奏請以鹽易米事且所言利害甚多恐涉細碎不敢盡上詔尚書省曰張煒通曉人也朕不敢縷詰卿等詳問之毋為虛文充宣差西北路軍儲自言斂不及民可以足用大抵募商賈縱其販易不問所從來姦人往往投牒妄指產業疏隣保姓名煒信之多與之錢已而亡去即逮繫隣保使之代償一路為之疲弊以故舊罽繒絮皮革折給軍士皆棄於道而去歲餘改戶部郎中遷翰林直學士俱兼規措職事左丞相宗浩奏張煒長於恢辦比戶部給錢三十萬已增息十四萬矣請給錢通百萬令從長恢辦乞不隸省部委臣專一提控有應奏者許煒專達歲差幹事官計本息具奏上從其請泰和六年伐宋煒進銀五千兩詔曰汝幹集資儲固其職也毋令軍士有議國家人之短汝朕皆知之惟能興利斯惟汝功自西北路召還勾計諸道倉庫除簽三司事上問誰可代卿規措者煒舉中都轉運戶籍判官王謙謙至西北路盡發煒前後散失錢物以鉅萬計對獄者積年大安三年起為同簽三司事會河堡兵敗軍士猶云張宣差刻我欲倒戈殺之累遷戶部侍郎貞祐初遷河北西路按察轉運使貞祐二年春中都乏糧詔同知都轉運使事邊源以兵萬人護運通州積粟軍敗死焉平章政事高琪舉煒代源行六部事以勞進官一階改河北東路轉運使宣宗遷汴佐尚書右丞胥鼎前路排頓及修南京宮闕無何坐事降孟州防禦使三年遷安國軍節度使致仕宣宗初以煒有才既察其無實遂不復用貞祐四年卒高竑渤海人以蔭補官累調貴德縣尉提刑司舉任繁劇遷奉聖州錄事察廉遷內黃令累官左藏庫副使元妃李氏以皁幣易紅幣竑獨拒不肯易元妃奏之章宗大喜遣人諭之曰所執甚善今姑與之後不得為例轉儀鸞局少府少監改戶部員外郎安州刺史大安中越王永功判中山竑以王傅同知府事改同知河南府充安撫使徙同知大名府兼本路安撫使貞祐二年遷河北西路按察轉運使錄大名功遷三官致仕興定四年卒李復亨字仲修榮州河津人年十八登進士第復中書判優等調臨晉主簿護送官馬入府宿逆旅有盜殺馬復亨曰不利而殺之必有仇者盡索逆旅商人過客同邑人槖中盛佩刀謂之曰刀衊馬血火煆之則刃青其人款服果有仇以提刑薦遷南和令盜割民家牛耳復亨盡召里中人至使牛家牽牛徧過之至一人前牛忽驚躍詰之乃引伏察廉遷臨洮府判官改陝西東路戶籍判官轉河東北路支度判官泰和中伐宋充宣撫司經歷官遷解鹽副使歷保大震武同知節度事丁母憂起復同知震武節度加遙授忻州刺史貞祐間歷左司員外郎郎中遷翰林直學士行三司事興定三年上言近日興師伐宋恐宋人乘虛掩襲南鄙故籍邊郡民為軍今大軍已還乞罷遣歸本業從之復亨舉陳留縣令程震等二十九人農桑有効徵科均一朝廷皆遷擢之是歲七月置京東京西京南三路行三司掌勸農催租軍須科差及鹽鐵酒榷等事戶部侍郎張師魯攝東路治歸德戶部侍郎完顏麻斤出攝南路治許州復亨攝西路治中京實河南府三司使侯摯總之復亨奏民間銷毀農具以供軍器臣竊以為未便汝州魯山寶豐鄧州南陽皆產鐵募工置冶可以獲利且不厲民又奏陽武設賣鹽官以佐軍用乞禁止滄濱鹽勿令過河河南食陽武解鹽河北食滄濱鹽南北俱濟詔尚書省行之九月以勸農有勞遷兵部尚書再閱月轉吏部尚書權參知政事四年三月真拜參知政事兼修國史七月河南雨水害稼復亨為宣慰使御史中丞完顏伯嘉副之循行郡縣凡官吏貪汙不治者得廢罷推治復亨奏乞禁宣慰司官吏不得與州府司縣行總管府及管軍官會飲又奏曰詔書令臣民間差發可免者免之民養驛馬此役最甚使者求索百端皆出養馬之家人多逃竄職此之由可依舊設回馬官使者食料皆官給之歲終會計均賦於民又奏河南閑田多可招河東河北移民耕種被災及沿邊郡縣租稅全免內地半之以救塗炭之民資蓄積之用詔有司議行焉還奏南陽禾麥雖傷土性宜稻今因久雨乃更滋茂田凡五百餘頃畝可收五石都得二十五萬餘石可增直糴稻給唐鄧軍食緣詔書不急科役即令免罷臣不敢輒行如以臣言為然乞付有司計之制可無何被詔提控軍興糧草復亨奏河渡不通陝西鹽價踊貴乞以粟互易足兵食詔戶部從長規措復亨有會計才號能吏當時推服故驟至通顯既執政頗矜持以私自營譽望頓減五年三月廷試進士復亨監試進士盧元謬誤濫放及第讀卷官禮部尚書趙秉文翰林待制崔禧歸德治中時戩應奉翰林文字程嘉善當奪三官降職復亨當奪兩官趙秉文嘗請致仕宣宗憐其老降兩階以禮部尚書致仕復亨罷為定國軍節度使元光元年十一月城破自殺年四十六贈資德大夫知河中府事贊曰大凡兵興則財用不足是故張煒李復亨乘時射利聚斂為功大安軍士欲倒戈殺煒復亨宣慰南陽還奏稻熟可糴所謂聚斂之臣者二子之謂矣高竑之守藏君子頗有取焉
