body:
  text: 金史卷一百三十五列傳第七十三外國下高麗高麗國王王楷其地鴨綠江以東曷懶路以南東南皆至于海自遼時歲時遣使修貢事具遼史唐初靺鞨有粟末黑水兩部皆臣屬于高麗唐滅高麗粟末保東牟山漸彊大號渤海姓大氏有文物禮樂至唐末稍衰自後不復有聞金伐遼渤海來歸蓋其遺裔也黑水靺鞨居古肅慎地有山曰白山蓋長白山金國之所起焉女直雖舊屬高麗不復相通者久矣及金滅遼高麗以事遼舊禮稱臣于金初有醫者善治疾本高麗人不知其始自何而來亦不著其姓名居女直之完顏部穆宗時戚屬有疾此醫者診視之穆宗謂醫者曰汝能使此人病愈則吾遣人送汝歸汝鄉國醫者曰諾其人疾果愈穆宗乃以初約歸之乙離骨嶺僕散部胡石來勃菫居高麗女直之兩間穆宗使族人叟阿招之因使叟阿送醫者歸之高麗境上醫者歸至高麗因謂高麗人女直居黑水部者部族日強兵益精悍年穀屢稔高麗王聞之乃通使于女直既而胡石來來歸遂率乙離骨嶺東諸部皆內附穆宗十年癸未阿踈自遼使其徒達紀來說曷懶甸人曷懶甸人執之穆宗以達紀送高麗謂高麗王曰前此為亂於汝鄙者皆此輩也及破蕭海里使斡魯罕往高麗報捷高麗亦使使來賀未幾復使斜葛與斡魯罕往聘高麗王曰斜葛女直之族弟也其禮有加矣乃以一大銀盤為謝厥後曷懶甸諸部盡欲來附高麗聞之不欲使來附恐近於己而不利也使人邀止之斜葛在高麗及往來曷懶道中具知其事遂使石適歡往納曷懶甸人未行而穆宗沒康宗嗣遣石適歡以星顯統門之兵往至乙離骨嶺益募兵趨活涅水徇地曷懶甸收叛亡七城高麗使人來告曰事有當議者曷懶甸官屬使斜勒詳穩冶剌保詳穩往石適歡亦使盃魯往高麗執冶剌保等而遣盃魯曰無與爾事於是五水之民皆附於高麗團練使陷者十四人二年甲申高麗來攻石適歡大破之殺獲甚衆追入其境焚略其戍守而還四月高麗復來攻石適歡以五百人禦於闢登水復大破之追入闢登水逐其殘衆踰境於是高麗王曰告邊釁者皆官屬祥丹傍都里昔畢罕輩也十四團練六路使人在高麗者皆歸之遣使來請和遂使斜葛經正疆界至乙離骨水曷懶甸活禰水留之兩月斜葛不能聽訟每一事輒至枝蔓民頗苦之康宗召斜葛還而遣石適歡往石適歡立幕府于三潺水其嘗陰與高麗往來為亂階者即正其罪餘無所問康宗以為能四年丙戌高麗使使黑歡方石來賀嗣位康宗使盃魯報聘且尋前約取亡命之民高麗許之曰使使至境上受之康宗以為信然使完顏部阿聒烏林荅部勝昆往境上受之康宗畋于馬紀嶺乙隻村以待之阿聒勝昆至境上高麗遣人殺之而出兵曷懶甸築九城康宗歸衆咸曰不可舉兵也恐遼人將以罪我太祖獨曰若不舉兵豈止失曷懶甸諸部皆非吾有也康宗以為然乃使斡塞將兵伐之大破高麗兵六月高麗率衆來戰斡塞敗之進圍其城七月高麗復請和康宗曰事若酌中則與之和高麗許歸亡入之民罷九城之戍復所侵故地遂與之和收國元年九月太祖已克黃龍府命加古撒喝攻保州保州近高麗遼侵高麗置保州至是命撒喝取之久不下撒喝請濟師且言高麗王將遣使來太祖使納合烏蠢以百騎益之詔撒喝曰汝領偏師屢破重敵多所俘獲及聞胡沙數戰有功朕甚嘉之若保州未下但守邊戍吾已克黃龍府聞遼主且至俟破大敵復益汝兵所言高麗遣使事未知果否至則護送以來邊境之事慎之毋忽十一月係遼女直麻懣太彎等十五人皆降攻開州取之盡降保州諸部女直太祖以撒喝為保州路都統太祖已破走遼主軍撒喝破合主順化二城復請濟師攻保州使斡魯以甲士千人往二年閏月高麗遣使來賀捷且曰保州本吾舊地願以見還太祖謂使者曰爾其自取之詔撒喝烏蠢等曰若高麗來取保州益以胡剌古習顯等軍備之或欲合兵無得輒往但謹守邊戍及撒喝阿實賚等攻保州遼守將遁去而高麗兵已在城中既而高麗國王使蒲馬請保州詔諭高麗王曰保州近爾邊境聽爾自取今乃勤我師徒破敵城下且蒲馬止是口陳俟有表請即當別議天輔二年十二月詔諭高麗國王曰朕始興師伐遼已嘗布告賴皇天助順屢敗敵兵北自上京南至于海其間京府州縣部族人民悉皆撫定今遣孛菫术孛報諭仍賜馬一疋至可領也三年高麗增築長城三尺邊吏發兵止之弗從報曰修補舊城曷懶甸孛菫胡剌古習顯以聞詔曰毋得侵軼生事但慎固營壘廣布耳目而已四年咸州路都統司以兵分屯于保州畢里圍二城請益兵詔曰汝等分列屯戍以固封守甚善高麗累世臣事于遼或有交通可常遣人偵伺使習顯以獲遼國州郡諭高麗其國方誅亂者使謂習顯曰此與先父國王之書習顯就館凡誅戮官僚七十餘人即依舊禮接見而以表來賀幷貢方物復以遼帝亡入夏國報之高隨斜野奉使高麗至境上接待之禮不遜隨等不敢往太宗曰高麗世臣於遼當以事遼之禮事我而我國有新喪遼主未獲勿遽強之命高隨等還天會二年同知南路都統鶻實荅奏高麗納叛亡增邊備必有異圖詔曰凡有通問毋違常式或來侵略則整爾行列與之從事敢先犯彼者雖捷必罰詔闍母以甲士千人戍海島以備之四年國王王楷遣使奉表稱藩優詔答之上使高伯淑烏至忠使高麗凡遣使往來當盡循遼舊仍取保州路及邊地人口在彼界者須盡數發還勅伯淑曰若一一聽從即以保州地賜之高伯淑至高麗王楷附表謝一依事遼舊制八年楷上表乞免索保州亡入邊戶是歲高麗十人捕魚大風飄其船抵海岸曷蘇館人獲之詔還其國既而勗上表請不索保州亡入高麗戶口太宗從之自是保州封域始定皇統二年詔加楷開府儀同三司上柱國六年楷薨子晛嗣立大定四年鴨綠江堡戍頗被侵越焚毀五年正月世宗因正旦使朝辭諭之曰邊境小小不虞爾主使然邪疆吏為之邪若果疆吏為之爾主亦當懲戒之也初高麗使者別有私進禮物以為常是歲萬春節上以使者私進不應典禮詔罷之十年王晛弟翼陽公晧廢晛自立十月賜生日使大宗正丞辤至界上高麗邊吏稱前王已讓位不肯受使者十一年三月王晧以讓國來奏告詔婆速路勿受有司移文詳問高麗告曰前王久病昏耄不治以母弟晧權攝國事上曰讓國大事也何以不先陳請詔有司再詳問高麗乃以王晛讓國表來大略稱先臣楷遺訓傳位於弟又言其子有罪不可立之意上疑之以問宰執丞相良弼奏曰此不可信晛止一子往年生孫嘗有表自陳生孫之喜一也晧嘗作亂晛囚之二也今晛不遣使晧乃遣使三也朝廷賜晛生日使晧不轉達於晛乃稱未敢奉受四也是晧篡兄誣請於天子安可忍也右丞孟浩曰當詢彼國士民果皆推服即當遣使封冊上曰封一國之君詢於民衆此與除拜猛安謀克何異乃却其使者而以詔書詳問王晛吏部侍郎靖為宣問王晛使晧實篡國囚晛於海島靖至高麗晧稱王晛已避位出居他所病加無損不能就位拜命往復險遠非使者所宜往靖竟不得見晛乃以詔授晧轉取晛表附奏其言與前表大概相同靖還上問大臣皆曰晛表如此可遂封之丞相良弼平章政事守道曰待晧祈請未晚也十二月晧遣其禮部侍郎張翼明等請封十二年三月遂賜封冊晧生日在正月十九日是歲十二月將盡未及遣使有司請至來歲舉行焉十五年高麗西京留守趙位寵叛晧遣徐彥等九十六人上表曰前王本非避讓大將軍鄭冲夫郎將李義方實弒之臣位寵請以慈悲嶺以西至鴨綠江四十餘城內屬請兵助援上曰王晧已加封冊位寵輒敢稱兵為亂且欲納土朕懷撫萬邦豈助叛臣為虐詔執徐彥等送高麗頃之王晧定趙位寵之亂遣使奏謝自位寵之亂晧所遣生日回謝橫賜回謝賀正旦進奉萬春節等使皆阻不通至是晧幷奏之詔答其意其合遣人使令節次入朝十七年賀正旦禮物玉帶乃石似玉者有司請移問上曰彼小國無能識者誤以為玉耳不必移問乃止十二月有司奏高麗下節押馬官順成例外將帶甲三過界上以使人所坐罪重但令發還本國而已二十三年晧母任氏薨晧乞免賜生日及賀謝等事詔從之章宗即位詔使至界上頗稽滯詔移問高麗遜謝明昌三年下節金挺回至平州撫寧縣毆死當驛人何添兒有司請凡人使往還乞量設兵衞參知政事張萬公曰可於宿頓之地巡護之上可其奏詔自今接送伴使副失關防者當坐故事賀正旦使十二月二十九日入見明昌六年十二月己卯立春詔於前二日丁丑入見云承安二年晧表自陳衰病以國讓其弟權國事是歲晧廢嗣立泰和四年正月乙丑朔高麗傔人以小佩刀割梨廡下巡廊奉職見而糾之詔館伴官自今前期移文禁止是歲王薨子韺嗣立泰和七年正月是時用兵伐宋夏亦有故獨高麗遣正旦使詔不賜曲宴及天壽節夏高麗使者皆在有司奏大定初宋未請和夏高麗使者賜曲宴今請依大定故事詔從之至寧元年八月王吳薨嗣子未行起復九月宣宗即位邊吏奏高麗牒稱嗣子未起復不可以凶服迎吉詔又不可以草土名銜署表禮官議人臣不以私恩廢公義宜權用吉服迎詔署表用權國事名銜俟高麗告哀使至闕然後遣使致祭慰問及行封冊制可明年宣宗遷汴遼東道路不通興定三年遼東行省奏高麗復有奉表朝貢之意宰臣奏可令行省受其表章其朝貢之禮俟他日徐議宣宗以為然乃遣使撫諭高麗終以道路不通未遑迎迓詔行省且覊縻勿絕其好然自是不復通問矣贊曰金人本出靺鞨之附于高麗者始通好為鄰國既而為君臣貞祐以後道路不通僅一再見而已入聖朝猶子孫相傳自為治故不復備論論其與金事相涉者焉
