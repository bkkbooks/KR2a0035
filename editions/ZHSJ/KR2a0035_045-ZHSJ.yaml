body:
  text: 金史卷四十五志第二十六刑昔者先王因人之知畏而作刑因人之知恥而作法畏也恥也五性之良知七情之大閑也是故刑以治已然法以禁未然畏以處小人恥以遇君子君子知恥小人知畏天下平矣是故先王養其威而用之畏可以教愛慎其法而行之恥可以立廉愛以興仁廉以興義仁義興刑法不幾於措乎金初法制簡易無輕重貴賤之別刑贖並行此可施諸新國非經世久遠之規也天會以來漸從吏議皇統頒制兼用古律厥後正隆又有續降制書大定有權宜條理有重修制條明昌之世律義勅條並修品式寖備既而泰和律義成書宜無遺憾然國脉紓蹙風俗醇醨世道升降君子觀一代之刑法每有以先知焉金法以杖折徒累及二百州縣立威甚者置刃於杖虐於肉刑季年君臣好用筐篋故習由是以深文傅致為能吏以慘酷辦事為長才百司姦贓真犯此可決也而微過亦然風紀之臣失糾皆決考滿校其受決多寡以為殿最原其立法初意欲以同疏戚壹小大使之咸就繩約於律令之中莫不齊手並足以聽公上之所為蓋秦人強主威之意也是以待宗室少恩待大夫士少禮終金之代忍恥以就功名雖一時名士有所不免至於避辱遠引罕聞其人殊不知君子無恥而犯義則小人無畏而犯刑矣是故論者於教愛立廉之道往往致太息之意焉雖然世宗臨御法司奏讞或去律援經或揆義制法近古人君聽斷言幾於道鮮有及之者章宗宣宗嘗親民事當宁裁決寬猛出入雖時或過中迹其矜恕之多猶有祖風焉簡牘所存可為龜鑑者本紀刑志詳略互見云金國舊俗輕罪笞以柳殺人及盜劫者擊其腦殺之沒其家貲以十之四入官其六償主倂以家人為奴婢其親屬欲以馬牛雜物贖者從之或重罪亦聽自贖然恐無辨於齊民則劓刵以為別其獄則掘地深廣數丈為之太宗雖承太祖無變舊風之訓亦稍用遼宋法天會七年詔凡竊盜但得物徒三年十貫以上徒五年刺字充下軍三十貫以上徒終身仍以贓滿盡命刺字於面五十貫以上死徵償如舊制熙宗天眷元年十月禁親王以下佩刀入宮衞禁之法實自此始三年復取河南地乃詔其民約所用刑法皆從律文罷獄卒酷毒刑具以從寬恕至皇統間詔諸臣以本朝舊制兼採隋唐之制參遼宋之法類以成書名曰皇統制頒行中外時制杖罪至百則臀背分決及海陵庶人以脊近心腹遂禁之雖主決奴婢亦論以違制又多變易舊制至正隆間著為續降制書與皇統制並行焉然二君任情用法自有異於是者矣及世宗即位以正隆之亂盜賊公行兵甲未息一時制旨多從時宜遂集為軍前權宜條理大定四年尚書省奏大興民男子李十婦人楊仙哥並以亂言當斬上曰愚民不識典法有司亦未嘗丁寧誥戒豈可遽加極刑以減死論五年命有司復加刪定條理與前制書兼用七年左藏庫夜有盜殺都監郭良臣盜金珠求盜不得命點檢司治之執其可疑者八人鞫之掠三人死五人誣伏上疑之命同知大興府事移剌道雜治既而親軍百夫長阿思鉢鬻金於市事覺伏誅上聞之曰箠楚之下何求不得奈何鞫獄者不以情求之乎賜死者錢人二百貫不死者五十貫於是禁護衞百夫長五十夫長非直日不得帶刀入宮是歲斷死囚二十人八年制品官犯賭博法贓不滿五十貫者其法杖聽贖再犯者杖之且曰杖者所以罰小人也既為職官當先廉恥既無廉恥故以小人之罰罰之九年因御史臺奏獄事上曰近聞法官或各執所見或觀望宰執之意自今制無正條者皆以律文為準復命杖至百者臀背分受如舊法已而上謂宰臣曰朕念罪人杖不分受恐至深重乃令復舊今聞民間有不欲者其令罷之十年尚書省奏河中府張錦自言復父讎法當死上曰彼復父讎又自言之烈士也以減死論十一年詔諭有司曰應司獄廨舍須近獄安置囚禁之事常親提控其獄卒必選年深而信實者輪直十二年尚書省言內丘令蒲察臺補自科部內錢立德政碑復有其餘錢二百餘貫罪當除名今遇赦當仍免徵贓上以貪偽勿且曰乞取之贓若以赦原予者何辜自今可並追還其主惟應入官者免徵尚書省奏盜有發塚者上曰功臣墳墓亦有被發者蓋無告捕之賞故人無所畏自今告得實者量與給賞故咸平尹石抹阿沒剌以贓死於獄上謂其不尸諸市已為厚幸貧窮而為盜賊蓋不得已三品職官以贓至死愚亦甚矣其諸子可皆除名先是詔自今除名人子孫有在仕者並取奏裁十三年詔立春後立秋前及大祭祀月朔望上下弦二十四氣雨未晴夜未明休暇幷禁屠宰日皆不聽決死刑惟強盜則不待秋後十五年詔有司曰朕惟人命至重而在制竊盜贓至五十貫者處死自今可令至八十貫者處死十七年陳言者乞設提刑司以糾諸路刑獄之失尚書省議以謂久恐滋弊上乃命距京師數千里外懷寃上訴者集其事以待選官就問時濟南尹梁肅言犯徒者當免杖朝廷以為今法已輕於古恐滋姦惡不從嘗詔宰臣朝廷每歲再遣審錄官本以為民伸寃滯也而所遣多不盡心但文具而已審錄之官非止理問重刑凡訴訟案牘皆當閱實是非囚徒不應囚繫則當釋放官吏之罪即以狀聞失糾察者嚴加懲斷不以贖論又以監察御史體察東北路官吏輒受訟牒為不稱職笞之五十又謂宰臣曰比聞大理寺斷獄雖無疑者亦經旬月何耶參知政事移剌道對曰在法決死囚不過七日徒刑五日杖罪三日上曰法有程限而輒違之薥慢也罷朝御批送尚書省曰凡法寺斷重輕罪各有期限法官但犯皆的決豈敢有違但以卿等所見不一至於再三批送其議定奏者書奏牘亦不下旬日以致事多滯留自今當勿復爾又曰故廣寧尹高楨為政尚猛雖小過有杖而殺之者即罪至於死而情或可恕猶當念之況其小過者乎人之性命安可輕哉上以正隆續降制書多任己意傷於苛察而與皇統之制並用是非淆亂莫知適從姦吏因得上下其手遂置局命大理卿移剌慥總中外明法者共校正乃以皇統正隆之制及大定軍前權宜條理後續行條理倫其輕重刪繁正失制有闕者以律文足之制律俱闕及疑而不能決者則取旨畫定軍前權宜條理內有可以常行者亦為定法餘未應者亦別為一部存之參以近所定徒杖減半之法凡校定千一百九十條分為十二卷以大定重修制條為名詔行焉二十年上見有蹂踐禾稼者謂宰相曰今後有踐民田者杖六十盜人穀者杖八十並償其直二十一年尚書省奏鞏州民馬俊妻安姐與管卓姦俊以斧擊殺之罪當死上曰可減死一等以戒敗風俗者二十二年上謂宰臣曰凡尚書省送大理寺文字一斷便可聞奏如烏古論公說事近取觀之初送法寺如法裁斷再送司直披詳又送闔寺參詳反覆三次妄生情見不得結絕朕以國政不宜滯留昨雖炙艾六百炷未嘗一日不坐朝欲使卿等知勤政也自今可止一次送寺闔寺披詳苟有情見即具以聞毋使滯留也二十三年尚書省奏益都民范德年七十六為劉祐毆殺祐法當死以祐父母年俱七十餘家無侍丁上請上曰范德與祐父母年相若自當如父母相待至毆殺之難議末減其論如法尚書省奏招討司官及禿里乞取本部財物制上曰遠人止可矜恤若進貢不闕更以兵邀之強取財物與盜何異且或因而生事何可不懲又曰朕所行制條皆臣下所奏行者天下事多人力有限豈能一一盡之必因一事奏聞方知有所窒礙隨即更定今有聖旨條理復有制條是使姦吏得以輕重也大興府民趙無事帶酒亂言父千捕告法當死上曰為父不恤其子而告捕之其正如此人所甚難可特減死一等武器署丞奕直長骨坐受草畔子財奕杖八十骨笞二十監察御史梁襄等坐失糾察罰俸一月上曰監察人君之耳目事由朕發何以監察為上以法寺斷獄以漢字譯女直字會法又復各出情見妄生穿鑿徒致稽緩遂詔罷情見二十五年二月上以婦人在囚輸作不便而杖不分決與殺無異遂命免死輸作者決杖二百而免輸作以臀背分決時后族有犯罪者尚書省引八議奏上曰法者公天下持平之器若親者犯而從減是使之恃此而橫恣也昔漢文誅薄昭有足取者前二十年時后族濟州節度使烏林達鈔兀嘗犯大辟朕未嘗宥今乃宥之是開後世輕重出入之門也宰臣曰古所以議親尊天子別庶人也上曰外家自異於宗室漢外戚權太重至移國祚朕所以不令諸王公主有權也夫有功於國議勳可也至若議賢既曰賢矣肯犯法乎脫或緣坐則固當減請也二十六年遂奏定太子妃大功以上親及與皇家無服者及賢而犯私罪者皆不入議上謂宰臣曰法有倫而不倫者其改定之監察御史陶鈞以妓遊北苑歌飲池島間迫近殿廷提控官石玠聞而發之鈞令其友閻恕屬玠得緩既而事覺法司奏當徒二年半詔以鈞耳目之官妓入禁苑無上下之分杖六十玠恕皆坐之二十八年上以制條拘於舊律間有難解之詞命刪修明白使人皆曉之舊禁民不得收制書恐滋告訐之弊章宗大定二十九年言事者乞許民藏之平章張汝霖曰昔子產鑄刑書叔向譏之者蓋不欲預使民測其輕重也今著不刊之典使民曉然知之猶江河之易避而難犯足以輔治不禁為便以衆議多不欲詔姑令仍舊禁之明昌元年上問宰臣曰今何不專用律文平章政事張汝霖曰前代律與令各有分其有犯令以律決之今國家制律混淆固當分也遂置詳定所命審定律令承安二年制軍前受財法一貫以下徒二年以上徒三年十貫處死符寶典書北京奴盜符寶局金牌伏誅仍除屬籍按虎阿虎帶失覺察各杖七十泰和二年御史臺奏監察御史史肅言大定條理自二十年十一月四日以前奴娶良人女為妻者並準已娶為定若夫亡拘放從其主離夫摘賣者令本主收贖依舊與夫同聚放良從良者即聽贖換如未贖換間與夫所生男女並聽為良而泰和新格復以夫亡服除準良人例離夫摘賣及放夫為良者並聽為良若未出離再配與奴或雜姦所生男女並許為良如此不同皆編格官妄為增減以致隨處訴訟紛擾是涉違枉勅付所司正之初詔凡條格入制文內者分為別卷復詔制與律文輕重不同及律所無者各校定以聞如禁屠宰之類當著于令也慎之勿忽律令一定不可更矣明昌三年七月右司郎中孫鐸先以詳定所校名例篇進既而諸篇皆成復命中都路轉運使王寂大理卿董師中等重校之四年七月上以諸路枷杖多不如法平章政事守貞曰枷杖尺寸有制提刑兩月一巡察必不敢違法也五年正月復令鈎校制律即付詳定所時詳定官言若依重修制文為式則條目增減罪名輕重當異於律既定復與舊同頒則使人惑而易為姦矣臣等謂用今制條參酌時宜準律文修定歷採前代刑書宜於今者以補遺闕取刑統疏文以釋之著為常法名曰明昌律義別編榷貨邊部權宜等事集為勅條宰臣謂先所定令文尚有未完俟皆通定然後頒行若律科舉人則止習舊律遂以知大興府事尼厖古鑑御史中丞董師中翰林待制奧屯忠孝小字牙哥提點司天臺張嗣翰林修撰完顏撒剌刑部員外郎李庭義大理丞麻安上為校定官大理卿閻公貞戶部侍郎李敬義工部郎中賈鉉為覆定官重修新律焉時奏獄而法官有獨出情見者上曰或言法官不當出情見故論者紛紛不已朕謂情見非出於法外但折衷以從法爾平章守貞曰是制自大定二十三年罷之然律有起請諸條是古亦許情見矣上曰科條有限而人情無窮情見亦豈可無也明昌五年尚書省奏在制名例內徒年之律無決杖之文便不用杖緣先謂流刑非今所宜且代流役四年以上俱決杖而徒三年以下難復不用婦人比之男子雖差輕亦當例減遂以徒二年以下者杖六十二年以上杖七十婦人犯者並決五十著于勅條承安三年勅尚書省自今特旨事如律令程式者始可送部自餘創行之事但召部官赴省議之四年四月尚書省請再覆定令文上因勅宰臣曰凡事理明白者轉奏可也文牘多者恐難徧覽其三推情疑以聞五月上以法不適平常行杖樣多不能用遂定分寸鑄銅為杖式頒之天下且曰若以笞杖太輕恐情理有難恕者訊杖可再議之五年五月刑部員外郎馬復言外官尚苛刻者不遵銅杖式輒用大杖多致人死詔令按察司糾劾黜之先嘗令諸死囚及除名罪所委官相去二百里外幷犯徒以下逮及二十人以上者並令其官就讞之刑部員外郎完顏綱言自是制行如上京最近之地往還不下三二千里如北京留守司亦動經數月愈致稽留未便詔復從舊令委官追取鞫之十二月翰林修撰楊庭秀言州縣官往往以權勢自居喜怒自任聽訟之際鮮克加審但使譯人往來傳詞罪之輕重成於其口貨賂公行寃者至有三二十年不能正者上遂命定立條約違者按察司糾之且謂宰臣曰長貳官委幕職及司吏推問獄囚命申御史臺聞奏之制當復舉行也又命編前後條制書之于冊以備將來考驗泰和元年正月尚書省奏以見行銅杖式輕細姦宄不畏遂命有司量所犯用大杖且禁不得過五分十二月所修律成凡十有二篇一曰名例二曰衞禁三曰職制四曰戶婚五曰竹罒戊庫六曰擅興七曰賊盜八曰鬬訟九曰詐偽十曰雜律十一曰捕亡十二曰斷獄實唐律也但加贖銅皆倍之增徒至四年五年為七削不宜於時者四十七條增時用之制百四十九條因而略有所損益者二百八十有二條餘百二十六條皆從其舊又加以分其一為二分其一為四者六條凡五百六十三條為三十卷附注以明其事疏義以釋其疑名曰泰和律義自官品令職員令之下曰祠令四十八條戶令六十六條學令十一條選舉令八十三條封爵令九條封贈令十條宮衞令十條軍防令二十五條儀制令二十三條衣服令十條公式令五十八條祿令十七條倉庫令七條竹罒戊牧令十二條田令十七條賦役令二十三條關市令十三條捕亡令二十條賞令二十五條醫疾令五條假寧令十四條獄官令百有六條雜令四十九條釋道令十條營繕令十三條河防令十一條服制令十一條附以年月之制曰律令二十卷又定制勅九十五條榷貨八十五條蕃部三十九條曰新定勅條三卷六部格式三十卷司空襄以進詔以明年五月頒行之貞祐三年上謂宰臣自今監察官犯罪其事關軍國利害者並笞決之貞祐四年詔凡監察失糾劾者從本法論外使入國私通本國事情宿衞近侍官承應人出入親王公主宰執家災傷乏食有司檢覈不實致傷人命轉運軍儲而有私載考試舉人而防閑不嚴其罰並決在京犯至兩次者臺官減監察一等治罪論贖餘止坐專差任滿日議定若任內曾以漏察被決依格雖為稱職止從平常平常者從降罰興定元年八月上謂宰臣曰律有八議今言者或謂應議之人即當減等何如宰臣對曰凡議者先條所坐及應議之狀以請必議定然後奏裁也上然之曰若不論輕重而輒減之則貴戚皆將恃此以虐民民何以堪
