body:
  text: 金史卷一百三十三列傳第七十一叛臣張覺子僅言耶律余睹窩斡古書畔與叛通畔之為言界也左氏曰政猶農之有畔是也君臣上下之定分猶此疆彼界之截然違此向彼即為叛矣善惡判於跬步禍患極於懷襄吁可畏哉作叛臣傳張覺亦書作瑴平州義豐人也在遼第進士仕至遼興軍節度副使太祖定燕京時立愛以平州降當時宋人以海上之盟求燕京及西京地太祖以燕京涿易檀順景薊與之平州自入契丹別為一軍故弗與而以平州為南京覺為留守既而聞覺有異志上遣使劉彥宗及斜鉢諭之詔曰平山一郡今為南京節度使今為留守恩亦厚矣或言汝等陰有異圖何為當此農時輒相扇動非去危就安之計也其諭朕意太祖每收城邑往往徙其民以實京師民心多不安故時立愛因降表曾言及之及以燕京與宋而遷其人獨以空城與之遷者道出平州故覺因之以作亂天輔七年五月左企弓虞仲文曹勇義康公弼赴廣寧過平州覺使人殺之于栗林下遂據南京叛入于宋宋人納之太祖下詔諭南京官吏詔曰朕初駐蹕燕京嘉爾吏民率先降附故升府治以為南京減徭役薄賦稅恩亦至矣何苦輒為叛逆今欲進兵攻取時方農月不忍以一惡人而害及眾庶且遼國舉為我有孤城自守終欲何為今止坐首惡餘並釋之覺兵五萬屯潤州近郊欲脅遷來潤隰四州闍母自錦州往討之已敗覺兵欲乘勝攻南京時暑雨不可進退屯于海壖無何闍母再敗覺兵復與戰于兔耳山闍母大敗覺報捷于宋宋建平州為泰寧軍以覺為節度使張敦固等皆加徽猶閣待制以銀絹數萬犒軍宗望軍至南京城東覺兵大敗宵遁遂奔宋入于燕京宗望以納叛責宋宣撫司索張覺宣撫王安中匿之於甲仗庫紿曰無之宗望索愈急安中乃斬貌類覺者一人當之金人識之曰非覺也安中不得已引覺出數以罪覺罵宋人不容口遂殺覺函其首以與金人燕京降將及常勝軍皆泣下郭藥師自言曰若來索藥師當奈何自是降將卒皆解體及金人伐宋竟以納平州之叛為執言云子僅言僅言幼名元奴宗望攻下平山僅言在襁褓間里人劉承宣得之養於家其隣韓夫人甚愛之年數歲因隨韓夫人得見貞懿皇后留之藩邸稍長侍世宗讀書遂使僅言主家事繩檢部曲一府憚之世宗留守東京海陵用兵江淮將士往往亡歸詣東京願推戴世宗為天子僅言勸進世宗即位除內藏庫副使權發遣宮籍監事海陵死揚州僅言與禮部尚書烏居仁殿前左衞將軍阿虎帶御院通進劉珫發遣六宮百司圖書府藏在南京者還以本職提控尚食局轉少府監丞仍主內藏僅言能心計世宗倚任之凡宮室營造府庫出納行幸頓舍皆委之世宗嘗曰一經僅言無不愜朕意者六年提舉修內役事役夫掘地得白金匿之事覺法當死僅言責取其物與官釋其罪尋兼祗應司遷少府監提控宮籍監祗應司如故護作太寧宮引宮左流泉溉田歲獲稻萬斛十七年復提點內藏典領昭德皇后山陵遷勸農使領諸職如故僅言雖舊臣出入左右然世宗終不假以權任二十一年尚書省奏宮苑司直長黎倫在職十六年請與遷上曰此朕之家臣質直人也今已老矣如勸農使張僅言亦朕舊臣純實頗解事凡朝廷議論內外除授未嘗得干預朕觀自古人君為讒諂蒙蔽者多矣朕雖不及古人然近習憸言未嘗入耳宰臣曰誠如聖訓此國家之福也世宗欲以為橫海軍節度使而不可去左右遂止僅言始得疾猶扶杖視事疾亟詔太醫診視近侍問訊相屬及卒上深惜之遣官致祭賻銀五百兩重綵十端絹二百匹棺槨衣衾銀汞歛物葬地皆官給贈輔國上將軍耶律余睹遼宗室子也遼主近族父祖仕遼具載遼史初太祖起兵遼人來拒余睹請自效以功累遷金吾衞大將軍為東路都統天輔元年與都統耶律馬哥軍于渾河銀术哥希尹拒之余睹等不敢戰比銀术哥等至馬哥余睹已遁去銀术哥希尹坐稽緩太祖皆罰之所獲生口財畜入于官天輔二年龍化州人張應古等來降而余睹復取之遼以撻不野為節度使未幾應古等逐撻不野自効太祖於國書中以問遼主龍化州已經降附何為問罪而殺其主者遼主託以大盜羣起使余睹收之太祖已取臨潢府賜詔余睹曰汝將兵在東路前後戰未嘗不敗今聞汝收合散亡以拒我師朕已於今月十五日克上京今將往取遼主矣汝若治兵一決勝負可指地期日相報若知不敵當率眾來降無貽後悔及太祖班師闍母等還至遼河方渡余睹來襲完頻背荅烏塔等殿力戰却之獲甲馬五百匹天輔五年余睹送款于咸州路都統以所部來降乞援接于桑林渡都統司以聞詔曰余睹到日使與其官屬偕來餘眾處之便地無何余睹送上所受遼國宣誥及器甲旗幟等與將吏韓福奴阿八謝老太師奴蕭慶醜和尚高佛留蒲荅謝家奴五哥等來降余睹作書具言所以降之意大概以謂遼主沉湎荒于遊畋不恤政事好佞人遠忠直淫刑吝賞政煩賦重民不聊生又言樞密使得里底本無材能但阿諛取容其子磨哥任以軍事又言文妃長子晉王素係人望宜為儲副得里底以元妃諸子己所自出使晉王出繼文妃又言晉王與駙馬乙信謀復其樞密使來告余睹共定大計而所圖不成又言己粗更軍事進策遼主得里底蔽之遼主亦不省察又曰大金疆土日闢余睹灼知天命遂自去年春與耶律慎思等定議約以今夏來降近聞得里底高十捏等欲發倉卒之際不及收合四遠但率傍近部族戶三千車五千兩畜產數萬遼北軍都統以兵追襲遂棄輜重轉戰至此所有官吏職位姓名人戶畜產之數遣韓福奴具錄以聞遂與其將吏來見上撫慰之遂賜坐班同宰相賜宴盡醉而罷上命余睹以舊官領所部且諭之曰若能為國立功別當奬用自余睹降益知遼人虛實矣余睹在軍中屢乞侍妾及子太祖疑之詔咸州路都統司曰余睹家屬善監護之復詔曰余睹降時其民多強率而來者恐在邊生變宜徙之內地都統杲取中京余睹為鄉導與希尹等招撫奚部奉聖州降其官吏皆遁去余睹舉前監酒李師夔為節度使進士沈璋為副使州吏裴賾為觀察判官沉璋招集居民還業者三千餘遷太常少卿久之耶律麻者告余睹吳十鐸剌結黨謀叛及其未發宜先收捕上召余睹等從容謂之曰今聞汝謀叛誠然邪其各無隱若果去必須鞍馬甲冑器械之屬當悉付汝吾不食言若再被擒無祈免死欲留事我則無懷異志吾不汝疑余睹等戰慓不能對乃杖鐸剌七十餘皆不問天會三年大舉伐宋余睹為元帥右都監宋兵四萬救太原余睹屋里海逆擊于汾河北擒其帥郝仲連張關索統制馬忠殺萬餘人宗翰伐宋余睹留西京天會十年余睹謀反雲內節度使耶律奴哥等告之余睹亡去其黨燕京統軍蕭高六伏誅蔚州節度使蕭特謀自殺邊部斬余睹及其諸子函其首以獻耶律奴哥加守太保兼侍中趙公鑑劉儒信劉君輔等並授遙鎮節度使以賞之移剌窩斡西北路契丹部族先從撒八為亂受其偽署後殺撒八遂有其衆撒八者初為招討司譯史正隆五年海陵徵諸道兵伐宋使牌印燥合楊葛盡徵西北路契丹丁壯契丹人曰西北路接近鄰國世世征伐相為讎怨若男丁盡從軍彼以兵來則老弱必盡係累矣幸使者入朝言之燥合畏罪不敢言楊葛深念後西北有事得罪遂以憂死燥合復與牌印耶律娜尚書省令史沒荅涅合督起西北路兵契丹聞男丁當盡起於是撒八孛特補與部衆殺招討使完顏沃側及燥合而執耶律娜沒荅涅合取招討司貯甲三千遂反議立豫王延禧子孫衆推都監老和尚為招討使山後四羣牧山前諸羣牧皆應之迪斡羣牧使徒單賽里耶魯瓦羣牧使鶴壽等皆遇害語在鶴壽傳中五院司部人老和尚那也亦殺節度使术甲兀者以應撒八會寧八猛安牧馬于山後至迪謀魯賊盡奪其馬闢沙河千戶十哥等與前招討使完顏麻潑殺烏古迪列招討使烏林荅蒲盧虎以所部趨西北路室魯部節度使阿厮列追擊敗之十哥與數騎遁去合于撒八咸平府謀克括里與所部自山後逃歸咸平少尹完顏余里野欲收捕括里家屬括里與其黨招誘富家奴隸數日得衆二千遂攻陷韓州及柳河縣遂趨咸平余里野發兵迎擊之兵敗賊遂據咸平於是繕完器甲出府庫財物以募兵賊勢益張權曹家山猛安綽質集兵千餘扼干夜河賊不得東綽質兵敗括里遂犯濟州會宿直將軍孛术魯吳括剌徵兵于速頻路遇括里于信州與猛安烏延查剌兵二千擊敗括里括里收餘衆趨東京是時世宗為東京留守以兵四百人拒之賊至常安縣聞空中擊鼓聲如數千鼓者候見旌旗蔽野傳言留守以十萬兵至矣即引還亦以其衆合于撒八海陵使樞密使僕散忽土西京留守蕭懷忠將兵一萬與右衞將軍蕭禿剌討平之禿剌與之相持數日連與戰皆無功而糧餉不繼禿剌退歸臨潢禿剌雖不能克敵而撒八自度大軍必相繼而至勢不可支謀歸于大石乃率衆沿龍駒河西出及僕散忽土蕭懷忠等兵至與禿剌合兵追至河上不及而還忽土懷忠禿剌坐逗遛不即追賊皆誅死北京留守蕭賾不能制其下殺降人而取其婦女亦坐誅於是白彥恭為北面兵馬都統紇石烈志寧副之完顏彀英為西北面兵馬都統西北路招討使唐括孛姑的副之以討撒八等撒八既西行而舊居山前者皆不欲往偽署六院節度使移剌窩斡兵官陳家殺撒八執老和尚孛特補等至是窩斡始自為都元帥陳家為都監擁衆東還至臨潢府東南新羅寨世宗使移剌扎八前押軍謀克播斡前牌印麻駭利涉軍節度判官馬腦等招之扎八等見窩斡以上意諭之窩斡已約降已而復謂扎八曰若降爾能保我輩無事乎扎八曰我知招降耳其他豈能必哉扎八見窩斡兵衆強車帳滿野意其可以有成因說之曰我之始來以汝輩不能有為今觀兵勢強盛如此汝等欲如羣羊為人所驅去乎將欲待天時乎若果有大志吾亦不復還矣賊將有前孛特本部族節度使逐斡者言昔谷神丞相賢能人也嘗說他日西北部族當有事今日正合此語恐不可降也於是窩斡遂決意不復肯降矣扎八亦留賊中惟麻駭播斡還歸窩斡乃引兵攻臨潢府總管移室懣出城戰兵少被執賊遂圍臨潢衆至五萬正隆六年十二月己亥窩斡遂稱帝改元天正是時北面都統白彥敬副統紇石烈志寧在北京聞世宗即位以兵來歸世宗使元帥左都監吾扎忽同知北京留守事完顏骨只救臨潢晝夜兼行比至臨潢賊已解圍去攻泰州吾扎忽追及于窊歷兩軍已陣將戰押軍猛安契丹忽剌叔以所部兵應賊吾扎忽軍遂敗泰州節度使烏里雅率千餘騎與窩斡遇烏里雅兵復敗僅以數騎脫歸賊勢愈振城中震駭莫敢出戰賊四面登城押軍猛安烏古孫阿里補率軍士數人各持刀以身率先循城擊賊力戰斫刈甚衆賊乃退走城賴以完泰州司吏顏盞蒲查奏捷除忠翊校尉賜銀五十兩重綵十端二年正月右副元帥完顏謀衍率諸軍北征窩斡二月壬戌詔曰應諸人若能於契丹賊中自拔歸者更不問元初首從及被威脅之由奴婢良人罪無輕重並行免放曾有官職及糾率人衆來歸者仍與官賞依本品量材使其同來人各從所願處收係有才能者亦與錄用內外官員郎君羣牧直撒百姓人家驅奴宮籍監人等並放為良亦從所願處收係與免三年差役或能捕殺首領而歸者准上施行仍驗勞績約量遷賞如捕獲窩斡者猛安加三品官授節度使謀克加四品官授防禦使庶人加五品官授刺史詔曰尚書省如節度防禦使捉獲窩斡者與世襲猛安刺史捉獲者與世襲謀克驅奴宮籍監人亦與庶人同復詔宰臣徧諭將士能捕殺窩斡者加特進授真總管於是括里將犯韓州聞元帥兵至不戰遁去將轉趨懿宜州謀衍屯懿州慶雲縣及屯川州武平縣奏請糧運當遣人護送兵仗乞選精良者付之詔以南征逃還軍士就往屯戍如不足量于富家簽調就近地簽步軍給仗護送糧運詔平章政事移剌元宜往泰州規措邊事前安遠大將軍斡里裊猛安七斤庶人阿里葛磨哥等自窩斡中來降斡里裊七斤加昭武大將軍阿里葛武義將軍磨哥忠勇校尉窩斡遂自泰州往攻濟州欲邀糧運元帥完顏謀衍與右監軍完顏福壽左都監吾扎忽合兵甲士萬三千人曷懶路總管徒單克寧廣寧尹僕散渾坦同知廣寧尹完顏巖雅肇州防禦使唐括烏也為左翼臨海節度使紇石烈志寧曷速館節度使神土懣同知北京留守完顏骨只淄州刺史尼厖古鈔兀為右翼至术虎崖盡委輜重士卒齎數日糧輕騎襲之辤椀羣牧人契丹辤者與其弟孛迭挼剌皆棄家自賊中來降辤者謂謀衍曰賊中馬肥健官軍馬疲弱此去賊八十里比遇賊馬已憊賊輜重去此不遠我攻之賊必救其巢穴賊至馬必疲我馬少得息所謂攻其所必救以逸待勞者也謀衍從之乘夜亟發會大風路暗不能辨遲明行三十里許與賊輜重相近整兵少憩窩斡趨濟州知大軍取其輜重乃還救遇于長濼既陣謀衍別設伏于左翼之側賊四百餘騎突出左翼伏兵之間徒單克寧射却之是日別部諸將與賊對者勝負未分相去五里許而立左翼萬戶襄別與賊戰賊陣動襄麾軍乘之突出其後俱與大軍不相及襄以善射者二十騎率衆自賊後擊之賊不能支乘勢麾軍擊其一偏賊遂却襄遂與大軍合而別部諸將皆至整陣力戰忽反風揚砂石賊陣亂官軍馳擊大破之追北十餘里斬獲甚衆詔以辤者為武義將軍孛迭昭信校尉挼剌忠翊校尉辤者除同知建州事未之官卒孛迭取家賊中遂被害上憫之後以挼剌為汝州都巡檢使窩斡率其衆西走謀衍追及之于霿河賊已濟毀其津口紇石烈志寧軍先至不克渡乃對岸為疑兵以夾谷清臣徒單海羅兩萬戶於下流渡河值支港兩岸斗絕且濘淖命軍士束柳填港而過追之數里得平地方食賊衆奄至志寧軍急整陣賊自南岡馳下衝陣者三志寧力戰流矢中左臂戰自若大軍畢至左翼騎兵先與賊接賊據上風縱火乘煙擊官軍官軍步兵亦至倂力合戰凡十餘合軍士苦風煙皆植立如癡會天降雨風止官軍奮擊大敗之徒單克寧追奔十五里賊前阨溪澗不得亟渡多殺傷賊既渡官軍亦渡少憩賊反斾來攻克寧以大軍不令軍士皆下馬射賊賊引却而南克寧亦將引而北士未及騎馬賊復來衝突官軍少却回渡澗北大軍至賊遂引去四月詔元帥府曰應契丹賊人與大軍未戰已前投降者不得殺傷仍加安撫敗走以後招誘來降者除奴婢准已虜為定外親屬分付圓聚仍官為換贖窩斡既敗謀衍不復追討駐軍白濼窩斡攻懿州不克遂殘破川州將遁于山西而北京亦不邀擊之於是發驍騎軍二千曷懶路留屯京師軍三千號稱二萬會寧濟州軍六千亦號二萬元帥左都監高忠建總兵沃州刺史烏古論蒲查為曷懶路押軍萬戶邳州刺史烏林荅剌撒為濟州押軍萬戶右驍騎副都指揮使烏延查剌為驍騎萬戶祁州刺史宗寧為會寧路押軍萬戶右宣徽使宗亨為北京路都統吏部郎中完顏達吉為副統會元帥府討擊之詔使尚局副使蒲察蒲盧渾往懿州戒勅將帥上曰朕委卿等討賊乃聞不就賊趨戰而駐兵閑緩經涉累月雖曾追襲乃不由有水草之地以致馬疲弱不能百里而還後雖破賊而縱諸軍劫掠數日後方追北霿河亦不乘勝輒復引還賊遂入涉近地北京懿州由此受兵朕欲重譴汝等以方任兵事且圖後功當盡心一力毋得似前怠弛上謂蒲盧渾曰卿若聞賊在近即當監督討伐用命力戰者疏記以聞朕將約量遷賞無或承徇上官抑有功濫署無功者善戢士卒勿縱虜掠以紇石烈志寧為元帥右監軍右副元帥完顏謀衍元帥右監軍完顏福壽召還京師咸平路總管完顏兀帶復舊職謀衍男斜哥在軍中多暴橫詔押歸本管窩斡使所親招節度使移里菫窟域窟域執其使送官與窩斡連戰有功遷宣武將軍賜銀五百兩衣二襲起運在中都弓萬五千箭一百五十萬赴懿州平章政事移剌元宜寧昌軍節度使宗入見詔使自中道却還軍中宣諭元宜謀衍注意經略邊事師久無功尚書右丞僕散忠義願効死力除邊患世宗嘉歎六月忠義拜平章政事兼右副元帥宗為兵部尚書各賜弓矢具鞍勒馬出內府金銀十萬兩佐軍用詔曰軍中將士有犯除連職奏聞餘依軍法約量決責有功者依格遷賞以大名尹宗尹為河南路統軍使河南路統軍都監蒲察世傑為西北路副統賜弓矢佩刀馬從忠義征行詔諭諸軍將士曰兵久駐邊陲蠹費財用無成功百姓不得休息今命平章政事僕散忠義兼右副元帥同心戮力以底戡定右副元帥謀衍罷為同判大宗正事詔居庸關古北口譏察契丹姦細捕獲者加官賞萬戶溫罕阿魯帶以兵四千屯古北口薊州石門關等處各以五百人守之海陵末年阿魯帶為猛安移剌娜為牌印祗候起契丹部族兵被執至是挺身來降世宗以阿魯帶為濟州押軍萬戶移剌娜為同知灤州事西南路招討使完顏思敬為都統賜金牌一銀牌二西北路招討使唐括孛古底副之以兵五千往會燕子城舊戍軍視地形衝要或于狗濼屯駐遠斥候賊至即戰不以晝夜為限詔思敬曰契丹賊敗必走山後可選新馬三千加芻秣以備追襲僕散忠義至軍中是時窩斡西走花道衆尚八萬忠義高忠建軍與賊遇萬戶查剌蒲查為左翼宗亨統之宗寧剌撒為右翼宗統之世傑亦在左翼中與賊夾河為陣賊渡河以兵四萬餘先犯左翼軍查剌以六百騎奮擊敗之復以四萬衆與左翼軍戰宗亨世傑七謀克指畫失宜陣亂敗于賊世傑挺身投于查剌軍中賊圍查剌軍查剌力戰宗以右翼軍來救賊乃去詔曰自契丹作逆有為賊詿誤者不問如何從賊但能復業與免本罪如能率衆來附或能殺捕首領而降或執送賊所扇誘作亂之人皆與量加官爵朕念正隆南征猛安亡者招還被戮已命其子孫襲其職爾等勿懲前事故懷遲疑賊軍今既破散山後諸處皆命將士遏其逃路爾等雖欲不降終將安往若猶疑貳俱就焚滅悔無及矣窩斡自花道西走僕散忠義紇石烈志寧以大軍追及于裊嶺西陷泉明日賊軍三萬騎涉水而東大軍先據南岡左翼軍自岡為陣迤邐而北步軍繼之右翼軍繼步軍北引而東作偃月陣步軍居中騎兵據其兩端使賊不見首尾是日大霧晦冥既陣霧開少頃晴霽賊見左翼據南岡不敢擊擊右翼軍烏延查剌力戰賊稍却志寧與夾谷清臣烏林荅剌撒鐸剌合戰賊大敗將涉水去泥濘不得亟渡大軍逐北人馬相蹂踐而死不可勝數陷泉皆平餘衆蹈籍而過或奔潰竄匿林莽間大軍踵擊之俘斬萬計生擒其弟偽六院司大王裊窩斡僅與數騎脫去鈔兀清臣追四十餘里不及斬千餘級獲車帳甚衆其母徐輦舉營自落括岡西走志寧追之盡獲輜重俘五萬餘人雜畜不可勝計偽節度使六及其部族皆降詔北京副統完顏達吉括本部馬規辦芻糧仍使達吉為監戰官錄有功者聞奏詔選中都西京兩路新舊軍萬人備守禦以窩斡敗走恐或衝突也僕散忠義使使奏捷詔略曰平章政事右副元帥忠義使使來奏大捷或被軍俘獲或自能來服或無所歸而投拜或將全屬歸附或分領家族來降或嘗受偽命及自來曾與官軍鬬敵皆釋其罪其散亡人內除窩斡一身不以大小官員是何名色却來歸附者亦准釋放有能誅捕窩斡或於不從招納亡去人內誅捕以來及或能率衆於掌軍官及隨處官司投降者並給官賞各路撫納來者毋得輒加侵損無資給者不以是何路分隨有糧處安置仍官為養濟窩斡收合散卒萬餘人遂入奚部以諸奚自益時時出兵寇速魯古淀古北口興化之間溫迪罕阿魯帶守古北口與戰敗焉詔完顏謀衍蒲察烏里雅蒲察蒲盧渾以兵三千合舊屯兵五千擊之詔完顏思敬以所部兵入奚地會大軍討窩斡賊黨霿河猛安蒲速越遣人至帥府約降詔令擒捕窩斡許以官賞賊將降者甚衆其散走者聞詔書招降亦多降者其餘多疾疫而死無復鬬志窩斡自度勢窮乃謀自羊城道西京奔夏國大軍追之益急其衆復多亡去度不得西乃北走沙陀間詔尚書省凡脅從之家被俘掠遂致離散宜從改正將士往往藏匿其人有司檢括分付監軍志寧獲賊稍合住釋而弗殺縱還賊中使誘其親近捕窩斡以自効許以官賞九月庚子稍合住與神獨斡執窩斡詣右都監完顏思敬降幷獲其母徐輦及其妻子子婦弟姪盡收偽金銀牌印唐括孛古底獲前胡里改節度使什溫及其家屬西北路招討使李家奴獲偽樞密使逐斡等三十餘人復與猛安泥本婆果追偽監軍那也至天成縣那也乃降仍獲偽都元帥醜哥及金牌一銀牌五志寧與清臣宗寧速哥等追餘黨至燕子城盡得其黨前至抹拔里達之地悉獲之逆黨遂平甲辰皇太子率百官上表賀乙巳詔天下辛亥完顏思敬獻俘于京師窩斡梟首于市磔其手足分懸諸京府其母徐輦及妻子皆戮之契丹降人皆拘其器仗貧不能自給者官為養濟括里扎八率衆南走詔左宣徽使宗亨追及之扎八詐稱降宗亨信其言遂不與戰扎八紿之曰括里驚走願追之宗亨縱扎八去益都猛安欲以所部追括里扎八宗亨恐分其功不聽而縱軍士取賊所棄資囊人畜而自有之括里扎八由是得亡去遂奔于宋宗亨降寧州刺史其後宋李世輔用括里扎八遂取宿州頗為邊患神獨斡除同知安化軍節度使稍合住除同知震武軍節度使事大定六年點檢司奏親軍中有逆黨子弟請一切罷去詔曰身預逆黨者罷之餘勿問贊曰金人以燕山與宋遂啟張覺跳梁之心覺豈為宋者哉蓋欲乘時以徼利耳耶律余睹從宗望追天祚曾不遺餘力功成驕溢自取誅滅咈哉正隆佳兵契丹作難傳曰夫兵猶火也弗戢將自焚可不戒哉
