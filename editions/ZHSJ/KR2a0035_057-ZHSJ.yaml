body:
  text: 金史卷五十七志第三十八百官三內命婦宮人女職東宮官屬親王府太后兩宮官屬大興府諸京留守司諸京城宮苑提舉都監等職按察司諸路總管府諸節鎮防禦刺史縣鎮等職諸轉運泉穀等職諸府鎮兵馬等職諸猛安部族及羣牧等職內命婦品元妃貴妃淑妃德妃賢妃正一品昭儀昭容昭媛修儀修容修媛充儀充容充媛曰九嬪正二品婕妤正三品美人正四品才人正五品各九員曰二十七世婦寶林正六品御女正七品采女正八品各二十七員曰八十一御妻按金格貞祐後之制貴妃下有真妃淑妃下有麗妃柔妃而無德妃賢妃九嬪同婕妤下有麗人才人為正三品順儀淑華淑儀為正四品尚宮夫人尚宮左夫人尚宮右夫人宮正夫人寶華夫人尚儀夫人尚服夫人尚寢夫人欽聖夫人資明夫人為正五品尚儀御侍尚服御侍尚寢御侍尚正御侍寶符宸侍奉恩令人奉光令人奉徽令人奉美令人為正六品司正御侍寶符御侍司儀御侍司符御侍司寢御侍司飾御侍司設御侍司衣御侍司膳御侍司藥御侍仙韶使光訓良侍明訓良侍遵訓良侍從訓良侍為正七品典儀御侍典膳御侍典寢御侍典飾御侍典設御侍典衣御侍典藥御侍仙韶副使承和良侍承惠良侍承宜良侍為正八品掌儀御侍掌服御侍掌寢御侍掌飾御侍掌設御侍掌衣御侍掌膳御侍掌藥御侍仙韶掌音祗肅良侍祗敬良侍祗願良侍為正九品宮人女官職員品秩皆同唐制尚宮二人掌導引皇后管司記司言司簿司闈仍總知五尚須物出納等事司記二人典記二人掌記二人掌在內諸文書出入目錄為記審訖付行縣印等事女史六人掌職文簿司言二人典言二人掌言二人女史四人掌宣傳啟奏之事司簿二人典簿二人掌簿二人女史六人掌宮人名簿釰賜之事司闈六人典闈六人掌闈六人女史四人掌宮闈管鑰之事尚儀二人掌禮儀起居管司籍司樂司賓司贊事司籍二人典籍二人掌籍二人女史十人掌經籍教學紙筆几案之事司樂四人典樂四人掌樂四人女史二人掌音樂之事司賓二人典賓二人掌賓二人女史二人掌賓客參見朝會引導之事司贊二人典贊二人掌贊二人女史二人彤史二人掌禮儀班序設板贊拜之事尚服二人掌管司寶司衣司飾司仗之事司寶二人典寶二人掌寶二人女史四人掌珍寶符契圖籍之事司衣二人典衣二人掌衣二人女史四人掌御衣服首飾之事司飾二人典飾二人掌飾二人女史二人掌膏沐巾櫛服玩之事司仗二人典仗二人掌仗二人女史二人掌仗衞兵器之事尚食二人掌知御膳進食先嘗管司膳司醞司藥司饎事司膳四人典膳四人掌膳四人女史四人掌膳羞器皿司醞二人典醞二人掌醞二人女史二人掌酒醴司藥二人典藥二人掌藥二人女史二人掌醫藥司饎二人典饎二人掌饎二人女史二人掌宮人食幷柴炭之事尚寢二人管司設司輿司苑司燈事司設二人典設二人掌設二人女史二人掌帷帳牀褥枕席洒掃鋪設司輿二人典輿二人掌輿二人女史二人掌輿傘扇羽儀司苑二人典苑二人掌苑二人女史二人掌苑囿種植蔬果司燈二人典燈二人掌燈二人女史二人掌燈油火燭尚功二人掌女功管司製司珍司綵司計事司製二人典製二人掌製二人女史二人掌裁縫衣服纂組之事司珍二人典珍二人掌珍二人女史二人掌金珠玉寶財貨之事司綵二人典綵二人掌綵二人女史二人掌錦文緋綵絲帛之事司計二人典計二人掌計二人女史二人掌支度衣服飲食柴炭雜物之事宮正二人掌總知宮內格式糾正推罰之事司正二人同掌典正二人糾察違失女史四人皇后位下女職依隆慶宮所設人數大安元年定司閨一員八品掌宮內諸事幷給散宮人俸給食料秉儀一員八品丞儀一員九品掌左右給事宣傳啟奏經籍紙筆之事直閤一員司陳一員九品掌帳幕牀褥輿傘洒掃鋪陳薪炭燈燭之事秉衣一員奉衣一員九品掌首飾衣服器玩諸寶財貨裁製縑綵之事掌饌一員八品奉饌一員九品掌飲食湯藥酒醴蔬果之事東宮官宮師府太子太師太子太傅太子太保正二品太子少師太子少傅太子少保正三品掌保護東宮導以德義海陵天德四年始定制宮師府三師三少詹事院詹事三寺十率府皆隸焉左右諭德為東宮僚屬詹事院太子詹事從三品少詹事從四品掌總統東宮內外庶務左右衞率府率從五品掌周衞導從儀仗左右監門正六品掌門衞禁鑰僕正正六品副僕正七品僕丞正九品掌車馬竹罒戊牧弓箭鞍轡器物等事掌寶二人從六品掌奉寶謹其出入典儀從六品贊儀從七品司贊禮儀侍正正七品侍丞正八品掌冠帶衣服左右給使之事典食令正八品丞正九品承奉膳羞侍藥正八品奉藥正九品承奉醫藥掌飲令正八品丞正九品承奉賜茶及酒果之事家令正八品家丞正九品掌營繕栽植鋪設及燈燭之事司經正八品副正九品掌經史圖籍筆硯等事司藏從八品副從九品掌庫藏財貨出入之事司倉從八品副從九品掌倉釰出納薪炭等事中侍局都監正九品同監從九品掌東閤內之禁令省察宮人釰賜給納諸物轄侍人等左諭德右諭德正五品左贊善右贊善正六品掌贊諭道德侍從文章內直郎正七品右屬宮師府親王府屬官傅正四品掌師範輔導參議可否若親王在外亦兼本京節鎮同知府尉從四品本府長史從五品明昌三年改掌警嚴侍從兼總統本府之事司馬從六品同檢校門禁總統府事文學二人從七品掌贊導禮義資廣學問記室參軍正八品掌表牋書啟之事大定七年八月始置二十年不專除令文學兼之諸駙馬都尉正四品提舉衞紹王家屬提舉從六品同提舉從七品舊為東海郡侯邑令丞提舉鎬厲王家屬提舉同提舉以上二宅天興元年始聽自便提控鞏國公家屬提控