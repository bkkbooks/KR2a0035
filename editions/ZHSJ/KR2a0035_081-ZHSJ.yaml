body:
  text: 金史卷八十一列傳第十九鶻謀琶迪姑迭阿徒罕夾谷謝奴阿勒根沒都魯黃摑敵古本蒲察胡盞夾谷吾里補王伯龍高彪溫迪罕蒲里特伯德特离補耶律懷義蕭王家奴田顥趙隇鶻謀琶术吉水斜卯部人也性忠直寬厚重節義勇於戰父阿鶻土贈金吾衞上將軍穆宗時鶻謀琶內附先遣子寧吉從間道送款遂使活里疃與鶻謀琶合軍攻降諸部因領其衆與弟胡麻谷渾坦姪阿里等攻下諸城從撒改破塢塔城穆宗屢賞之破高麗戍兵與石適歡討平諸部蒲察部雅里孛菫與其兄弟胡八雙括等欲叛歸遼鶻謀琶執之送于康宗賜賚甚厚破高麗曷懶甸及下魯城有功天輔六年卒年七十二天眷中贈銀青光祿大夫迪姑迭溫迪罕部人祖扎古廼父阿胡迭世為胡論水部長迪姑迭年二十餘代領父謀克攻寧江州敗遼援兵獲甲馬財物攻破奚營回至韓州遇敵二千人擊走之斡魯古與遼人戰于咸州兵已却迪姑迭以本部兵力戰諸軍復振遂大破之護步荅岡之役乙里補孛菫陷敵中迪姑迭援出之攻黃龍府身被數創授猛安天輔七年從上至山西病卒年四十七天眷中贈光祿大夫阿徒罕溫迪罕部人年十七從撒改斡帶等討平諸部皆身先力戰高麗築九城于曷懶甸斡塞禦之阿徒罕為前鋒高麗有屯于海島者阿徒罕率衆三十人夜渡焚其營柵戰艦大破之遂下吉城既而八城皆下功最遼兵自寧江州東門出阿徒罕逆擊盡殪之以功授謀克從攻黃龍府力戰身被數十創竟登其城後與烏論石準援照散城阿徒罕請乘不備急擊之遂夜過益褪水詰朝大敗之斡魯上其功賜幣與馬天輔四年五月疾病賜良馬一匹詔曰汝安則乘之年六十五卒上悼惜之遣使弔祭以馬為贈阿徒罕為人孝弟好施惠健捷善弋獵至角觝擊鞠咸精其能夾谷謝奴隆州納魯悔河人也國初祖阿海率所部來歸獻器用甲仗父不剌速襲本部勃菫從太祖伐遼授世襲猛安親管謀克為曷懶路都統謝奴其長子也長身多髯善騎射通女直契丹大小字及漢字既冠隨其父見太祖命佩金牌總領左翼護衞西京未下謝奴獲城中生口乃知城中潛遣人求救於外都統府得為之備却其救兵西京乃下自燕京還過判泥恩納阿遇敵於隘謝奴身先士卒射殺敵中先鋒二人敵潰走總管蒲魯虎以甲及馬贈之後領其父猛安從攻和尚原出仙人關宋兵據險猛安雛訛只突戰不克謝奴選麾下五十人戰克之與吳玠相拒烏里雅行陣不整吳玠乘之謝奴領兵逆戰遂大破敵計前後功襲其父猛安謀克宗弼復取河南陝西宋人欲潛兵襲取石閏諸營謝奴自渭南大禹鎮掩其伏兵射中其軍帥宋兵敗走多獲旗幟兵仗帥府厚賞之除華州防禦使入為工部侍郎遷本部尚書改平涼尹昭義軍節度使大定初卒阿勒根沒都魯上京納鄰河人也後徙咸平路梅黑河雄偉美鬚髯勇毅善射國初伐遼沒都魯在軍中領謀克猛安每遇敵往來馳突人莫敢當故所戰皆克皇統元年計功擢宣威將軍明年授同知通遠軍節度使改移剌都辤詳穩授世襲本路寧打渾河謀克為滑州刺史改肇州防禦使蒲與路節度使遷驃騎上將軍累官金吾衞上將軍是歲以年老致仕卒年七十三黃摑敵古本世居星顯水從破寧江取咸州平東京路及諸山寨柵皆有功從麻吉破遼將和尚節使兵七千於上京復破那野軍二萬再從麻吉遇敵於阿鄰甸麻吉被創不能戰敵古本率兵擊敗之剿殺殆盡從攻回鶻城破其兵九萬敗木匠直撒兵於山後俘獲甚衆敗昭古牙之兵三千獲其家屬而還攻平州張覺吾春被圍於西山敵古本引兵救之解其圍幷獲糧五千斛招降戶口甚衆從平興中撫安其民人天會間大軍伐宋敵古本從取濬開德大名及取濟南高唐棣密等州皇統間以功襲謀克移屯於壽光縣界為千戶六年授世襲千戶棣州防禦使卒蒲察胡盞案出滸水人年十八從軍其父特厮死襲為謀克天輔間夏以兵三萬出天德路胡盞從婁室迎戰以兵三百敗敵二千天會三年大軍攻太原城中出兵萬餘來戰胡盞以所領千戶軍擊之復敗敵兵三萬餘於榆次境六年從婁室攻京兆以所部兵屢與宋人接戰皆先登有功七年取邠州遇宋人二十餘萬我軍右翼少却時胡盞為左翼千戶摧鋒陷陣敵遂敗去敗張浚富平復有功十三年擊關師古於臨洮衆三萬餘從攻涇州從破德順秦鞏臨洮河蘭等州破吳璘兵胡盞皆有力焉授德順州刺史改隴州防禦使鳳翔尹卒年五十五夾谷吾里補暗土渾河人徙天德父兀屯討烏春窩謀罕有功吾里補隸婁室帳下攻係遼女直招降太彎照三等從婁室救斡魯古于咸州敗遼兵于押魯虎城遼軍營遼水吾里補五謀克軍乘夜擊之遼軍驚潰殺獲幾盡斡魯伐高永昌吾里補以數騎奮擊于遼水之上復以四十騎伏于津要遇其候騎擊之獲生口因盡知永昌虛實太祖嘉之賞奴婢八人永昌駐軍於兒先據津要軍不得渡吾里補與撒八射殺其先鋒二人永昌衆稍却大軍遂渡遼水及攻廣寧軍帥選勇士先登吾里補與赤盞忽沒渾各領所部突入其陣大軍繼之遂拔廣寧太祖攻臨潢吾里補面被重創奮擊自若賞以遼宮女二人遼王杲已取中京吾里補以四十騎覘敵獲遼喉舌人因知遼主所在後從都統斡魯定雲中從宗翰屯應州遼軍在近境吾里補以所部擊敗之宗望伐宋宋安撫使蔡靖詣吾里補降婁室攻陝西諸郡往往復叛吾里補攻敗之敗張浚軍于富平吾里補先登睿宗賞以金器名馬遂以先鋒攻蘭州下其城加昭武大將軍授世襲猛安累官孛特本部族節度使以老致仕封芮國公吾里補多智略膂力過人雖甚老勇健不少衰大定初劇賊嘯聚出特鄙關吾里補率鄉里年少逆擊之賊黨遂潰事聞賞賚甚厚大定二十六年卒一百有五歲王伯龍瀋州雙城人也遼末聚黨為盜天輔二年率衆二萬及其輜重來降授世襲猛安知銀州兼知雙州四年太祖攻臨潢伯龍與韓慶和以兵護糧餉輓夫千五百人皆授甲慶和已將兵行前伯龍從糧居後遇遼兵五千餘邀於路伯龍率輓夫擊敗之獲馬五百匹六年從攻下中京幷克境內諸山寨為靜江軍節度留後天會元年真授節度使從宗望討張覺於平州伯龍先登馳擊手殺數十百人遷右金吾衞將軍白河之戰伯龍當其左軍麾兵疾馳蹂之宋軍亂我師乘勝奮擊敗之宗望伐宋伯龍為先鋒次保州遇敵五萬破之招降新樂軍民十餘萬大軍圍汴宋太尉何畆以軍數萬出酸棗門伯龍以本部遮擊多所斬獲及破汴伯龍以治攻具有功進破孔彥舟酈瓊衆三萬於洺州是年同知保州兵馬安撫司事將兵數千攻北平拔之復取保州河間睿宗經略山東伯龍從攻青州未下城中夜出兵襲伯龍營伯龍不及甲獨被衣挺刃拒營門敵不得入因奮擊殺數十人已而軍士皆甲出殺傷宋兵不可勝計幷獲其一將斬之及下青州第功伯龍第一六年還攻莫州降之加太子少保莫州安撫使破李固寨衆十餘萬於濮州濮城守城中鎔鐵揮我軍攻之不能剋伯龍被重甲首冠大釜挺槍先登殺守陴者二十餘人大軍相繼而上遂剋之進攻徐州伯龍復先登充徐宿邳三路軍馬都統敗高托山之衆十五萬餘於清河進擊韓世忠於邳州走之與大軍會於宿遷追世忠至揚州還攻泗州泗州守將以城降屯軍嵫陽破陳宏賊衆四十餘萬破黃戩於單州進攻歸德軍帥遣伯龍立攻具伯龍從二十餘騎行視地形城中忽出兵千餘欲生得伯龍伯龍縱騎馳之敵兵亂墮隍而死者幾二百人破王善之衆於巢縣取廬州和州伯龍之功多軍渡采石擊敗岳飛劉立路尚等兵獲芻糧數百萬計還過真揚道遇酈瓊韓世忠軍復戰敗之復為莫州安撫改知澤州太行羣賊往往嘯聚伯龍皆平之天眷元年為燕京馬軍都指揮使從元帥府復收河南權武定軍節度使兼本路都統宋兵據許州伯龍擊走之招復其人民是年秋泰安卒徒張貴驅脅良民據險作亂伯龍討平之皇統元年以本部從宗弼南伐攻破濠州而還三年為武定軍節度使改延安尹寧昌軍節度使天德三年改河中尹徙益都尹封廣平郡王卒年六十五正隆間例贈特進定國公高彪本名召和失辰州渤海人祖安國遼興辰開三鎮節度使父六哥左承制官至刺史彪始生其父用術者言為其時日不利於己欲不舉其母為營護居數歲竟逐之彪匿於外家遼人調兵東京時六哥已老當從軍悵然謂所親曰吾兒若在可勝兵矣所親具以實告因代其父行戰於出河店遼兵敗走彪獨力戰軍帥見之曰此勇士也令生致之斡魯攻東京六哥率其鄉人迎降以為榆河州千戶久之告老彪代領其衆都統杲攻中京彪領謀克從斡魯破遼將合魯燥及韓慶民於高惠之境已而駐軍武安合魯燥以勁兵二萬來襲從斡魯出戰與所部皆去馬先登奮擊敗之奚人負險拒命所在屯結彪屢戰有功宗望攻平州彪徇地西北道破敵招降石家山寨再從宗望伐宋為猛安師次真定彪率兵士七十人臨城築甬道城中夜出兵焚攻具彪擊走之大軍圍汴以五十騎屯於東南水門宋人再以重兵出戰彪皆敗之師還屯鎮河朔復破敵於霸州擒其裨將祝昂河間夜出兵二萬襲我營壘彪率三謀克兵擊敗之天會五年授靜江軍節度使壽州刺史明年伐宋從帥府徇地山東攻城克敵數被重賞七年師至睢彪以所部招誘京西人民次柘城縣其官吏出降彪獨與五十餘騎入城繼而城中三千餘人復叛彪率其衆力戰敗之撫安其民而還從梁王宗弼襲康王至杭州師還宋將韓世忠以戰艦數百扼於江北宗弼引而西將至黃天蕩敵舟三十餘來逼南岸其一先至者載兵士二百餘彪度垂及以鈎拽之率勇士數人躍入敵舟所殺甚衆餘皆逼死於水中明年從攻陝西師至寧州彪與宗人昂率兵三千取廓州始至有來降者言城東北隅守兵將謀為內應彪即夜從家奴二人以登左右守者覺之彪與從者皆殊死戰諸軍繼進遂克其城從攻和尚原及仙人關與阿里監護漕糧幷戰艦至亳州宋人以舟五十艘阻河路擊敗之擒其將蕭通擊漣水賊水寨進取漣水軍其官民已遁去悉招降之彪勇健絕人能日行三百里身被重鎧歷險如飛及臨敵身先士卒未嘗反顧大小數十戰率以少擊衆無不勝捷齊國既廢攝滕陽軍以東諸路兵馬都統撫諭徐宿曹單滕陽及其屬邑皆按堵如故為武寧軍節度使頗黷貨嘗坐贓海陵以其勳舊杖而釋之改沂州防禦使歷安化安國武勝軍節度使遷行臺兵部尚書改京兆尹封郜國公以憂去官起復為武定軍節度使歸德尹正隆例授金紫光祿大夫久之致仕復起為樞密副使舒國公賜名彪卒年六十七諡桓壯彪性機巧通音律人無貴賤皆溫顏接之溫迪罕蒲里特隆州移离閔河胡勒出寨人也魁梧美髯有謀略以智勇聞都統杲取中京蒲里特權猛安領軍五千遇契丹賊萬餘與戰敗之出衮古里道敗敵八千餘至臘門華道復以伏兵敗敵萬人太祖定燕自儒州至居庸關執其喉舌人有頃賊三千餘人復寇臘門華道蒲里特整隊先登賊識其旗幟望風而遁遂奮擊之親執賊帥皇統元年從梁王宗弼伐宋留軍唐州敵衆奄至蒲里特擊之大名軍萬四千號二十萬蒲里特率親管猛安身先士卒衝擊敵少却乃張左右翼倂擊之敵衆散走而別遇兵二萬來援復以兵三千擊走之時邳州土賊嘯聚幾二十萬蒲里特軍三千分為數隊急攻之賊潰去南京路遇敵軍二萬蒲里特以軍三千擊敗之是日有兵自城中出者復擊敗之皇統二年遷定遠大將軍同知鳳翔尹六年改京兆尹轉寧州刺史改西北路招討都監遷永定軍節度使海陵南征改武衞軍都總管大定三年授開遠軍節度使改泰寧軍卒十九年以功授其子兀帶武功將軍本猛安奚出痕世襲謀克伯德特离補奚五王族人也遼御院通進天會初與父撻不也歸朝授世襲謀克後以京兆尹致仕特离補招降松山等州未附軍民及招降平州薊州境內督之耕作宗望伐宋特离補為軍馬猛安與諸將留規取保遂安三州攻安肅軍河間雄保等兵十餘萬來救特离補率所部先戰大軍繼之大破其兵遂拔安肅特离補攝通判事降將胡愈陰結衆謀亂特离補勒兵擒愈及其衆五十餘人安肅軍改為州就除同知州事改磁州捕獲太行羣盜元帥府以磁相二州屯兵屬之擒王會孫小十苗清等羣盜遂平遷濱州刺史廉入優等以母憂去官起復本職改涿州刺史入為工部郎中從張浩營繕東京宮室及田瑴黨事起朝省為之一空特离補攝行六部事遷大理卿出為同知東京留守天德三年復為大理卿同知南京留守丁父憂起復洺州防禦使正隆盜起州縣無兵不能禦洺舊有河附于城下特离補乃引水注濠中以為固盜弗能近州賴以安遷崇義軍節度使未幾告老歸田里卒特离補為人孝謹為政簡靜不積財常曰俸祿已足養廉衣食之外何用蓄積凡調官行李止車一乘婢僕數人而已耶律懷義本名孛迭遼宗室子年二十四以戰功累遷同知點檢司事宗翰已取西京遼主謀奔于夏懷義諫止之不見聽乃竊取遼主馬來降太祖自燕還師留宗翰斡魯經略西方懷義領謀克從軍天會初帥府以新降諸部大小遠近不一令懷義易置之承制以為西南路招討使乃擇諸部衝要之地建城市通商賈諸部兵革之餘人多匱乏自是衣食歲滋畜牧蕃息矣從宗翰伐宋降馬邑破雁門屯兵進攻太原以所部別降清源縣徐溝鎮遂與諸將列屯汾州之境時河東陝西路兵來救太原劉光世折可求柵于文水西山懷義捕得生口盡知宋兵屯守要害乃分兵襲敗之明年再伐宋從婁室取汾州及其屬邑遂過平陽出澤潞以趨河陽所至皆降及大軍圍汴懷義屯京西汴城既下宋兵之出奔者邀擊盡之從攻鄭鄧州及討平鄭州叛者攻下濮州及雷澤縣從破大名東平府徐兗等州皆有功七年還鎮十年加尚書左僕射改西北路招討使懷義在西陲幾十年撫御有恩及去老幼遮道攀戀數日不得發天眷初為太原尹治有能聲改中京留守從宗弼過烏納水還中京以老乞致仕不許改大名尹命不赴治所止以俸傔給之每歲春水扈從餘聽自便明年再請老得謝給俸傔之半海陵即位封漆水郡王進封莘王久之進封蕭王正隆例封景國公其子神都斡為西北路招討都監迎侍之官神都斡從海陵南征懷義卒于雲中年八十二蕭王家奴奚人也居庫党河為人魁偉多力未冠仕遼為太子率府率天輔七年都統杲定奚地王家奴率其鄉人來降命為千戶領之奚王回离保既死其親黨金臣阿古者猶保撒葛山王家奴與突撚往討之生擒金臣阿古者降其餘衆時平灤多盜王家奴以所部屢破賊兵斬馘執俘數被賞賚宗望伐宋敗郭藥師於白河亦與有功至河上宋兵扼津要與諸將擊敗之進圍汴破其東門兵明年再伐宋宗望軍至中山諸門分兵出戰焚我攻具祁州河間各以兵來援皆敗之師還屯鎮河朔濱州賊葛進聚衆數萬臨淄孛菫照里以騎兵二千討之王家奴領謀克先登力戰大破其衆明年攻滄州宋兵拒戰復從照里擊走之宋將徐文以舟百艘泊海島即以商船十八進襲斬首七百級獲舟二十天會八年除靜江軍節度使授世襲千戶從梁王宗弼征伐為萬戶還為五院部節度使天德二年改烏古迪烈招討都監卒田顥字默之興中人遼天慶八年進士歷官金部員外郎權歸德節度使太祖定燕顥舉四州版圖歸朝加都官郎中權節度使事四遷知真定府事招降齊博游貴等賊衆五千餘人已而貴復叛去顥遣齊博偽叛從貴因令伺間殺之降其衆賊壘悉平三遷行臺左丞彰德軍節度使是時新定力役顥蠲籍之半而上之故相之繇賦比他州獨輕徙同知河北東路都總管改同簽燕京留守司事民遮留不得出易服夜去改河東南路轉運使尋改絳陽軍節度使居三年以疾請謝事徑解印歸數奏不允移鎮振武軍入為刑部尚書居三月請老卒于家趙隇字德固遼陽人其婦翁以優伶得幸於遼主隇補閤門祗候累遷太子左衞率後居灤州宗望討張覺隇踰城出降授洛苑副使為灤州千戶遷洛苑使檢校工部尚書從伐宋至汴遷棣州刺史侍衞步軍都虞候及再伐宋攻真定與有功改商州刺史檢校尚書右僕射五年同知信德府路統押軍兵兼沿邊安撫司事明年權知濟州事八年從定河南授隴州團練使十年改知石州隇久在兵間不善治民坐謗議謫監平州甜水鹽齊國廢河南皆以宿將守之授隇宿州防禦使統本路軍兵隇重義接儒士嘗以事至汴有故人子負官錢百萬隇以橐金贈之其子悉為私費復代輸之頃之有訟徐帥不法者朝廷使隇鞫治隇委曲營護坐是廢罷寓居於燕海陵出領行臺省至燕隇往見之因訴其事及海陵即位起為保大軍節度使貞元初改內省使未幾為中都路都轉運使明年再徙順義興平入為太子詹事鎮沁南以疾卒年六十六後十餘年隇子孫司徒張通古子孫皆不肖淫蕩破貲產賣田宅世宗聞之詔曰自今官民祖先亡沒子孫不得分割居第止以嫡幼主之毋致鬻賣仍著于令
