body:
  text: 金史卷一百十四列傳第五十二白華斜卯愛實合周附石抹世勣白華字文舉隩州人貞祐三年進士初為應奉翰林文字正大元年累遷為樞密院經歷官二年九月武仙以真定來歸朝廷方經理河北宋將彭義斌乘之遂由山東取邢洺磁等州華上奏曰北兵有事河西故我得少寬今彭義斌招降河朔郡縣駸駸及於真定宜及此大舉以除後患時院官不欲行即遣華相視彰德實擠之也事竟不行三年五月宋人掠壽州永州桃園軍失利死者四百餘人時夏全自楚州來奔十一月庚申集百官議和宋上問全所以來華奏全初在盱眙從宋帥劉卓往楚州州人訛言劉大帥來欲屠城中北人耳衆軍怒殺卓以城來歸全終不自安跳走盱眙盱眙不納城下索妻孥又不從計無所出乃狼狽而北止求自免無他慮也華因是為上所知全至後盱眙楚州王義深張惠范成進相繼以城降詔改楚州為平淮府以全為金源郡王平淮府都總管張惠臨淄郡王義深東平郡王成進膠西郡王和宋議寢四年李全據楚州衆皆謂盱眙不可守上不從乃以淮南王招全全曰王義深范成進皆我部曲而受王封何以處我竟不至是歲慶山奴敗績于龜山五年秋增築歸德城擬工數百萬宰相奏遣華往相役華見行院溫撒辛語以民勞朝廷愛養之意減工三之一溫撒李辛賜姓也六年以華權樞密院判官上召忠孝軍總領蒲察定住經歷王仲澤戶部郎中刁璧及華諭之曰李全據有楚州睥睨山東久必為患今北事稍緩合乘此𨻶令定住權監軍率所統軍一千別遣都尉司步軍萬人以璧仲澤為參謀同往沂海界招之不從則以軍馬從事卿等以為何如華對曰臣以為李全借大兵之勢要宋人供給餽餉特一猾寇耳老狐穴塚待夜而出何足介懷我所慮者北方之強耳今北方有事未暇南圖一旦事定必來攻矣與我爭天下者此也全何預焉若北方事定全將聽命不暇設不自量更有非望天下之人寧不知逆順其肯去順而從逆乎為今計者姑養士馬以備北方使全果有不軌之謀亦當發於北朝息兵之日當此則我易與矣上沉思良久曰卿等且退容我更思明日遣定住還屯尉氏時陝西兵大勢已去留脫或欒駐慶陽以擾河朔且有攻河中之耗而衛州帥府與山公府並立慮一旦有警節制不一欲合二府為一又恐其不和命華往經畫之初華在院屢承面諭云汝為院官不以軍馬責汝汝辭辯特以合喜蒲阿皆武夫一語不相入便為齟齬害事非細今以汝調停之或有乖忤罪及汝矣院中事當一一奏我汝之職也今衛州之委亦前日調停之意國制凡樞密院上下所倚任者名奏事官其目有三一曰承受聖旨二曰奏事三曰省院議事皆以一人主之承受聖旨者凡院官奏事或上處分獨召奏事官付之多至一二百言或直傳上旨辭多者即與近侍局官批寫奏事者謂事有區處當取奏裁者殿奏其奏每嫌辭費必欲言簡而意明退而奉行即立文字謂之檢目省院官殿上議事則默記之議定歸院亦立檢目呈覆有疑則復禀無則付掾史施行其赴省議者議既定留奏事官與省左右司官同立奏草圓覆諸相無異同則右司奏上此三者之外又有難者曰備顧問如軍馬糧草器械軍帥部曲名數與夫屯駐地里阨塞遠近之類凡省院一切事務顧問之際一不能應輒以不用心被譴其職為甚難故以華處之五月以丞相賽不行尚書省事於關中蒲阿率完顏陳和尚忠孝軍一千駐邠州且令審觀北勢如是兩月上謂白華曰汝往邠州六日可往復否華自量日可馳三百應之曰可上令密諭蒲阿纔候春首當事慶陽華如期而還上一日顧謂華言我見汝從來凡語及征進必有難色今此一舉特銳於平時何也華曰向日用兵以南征及討李全之事梗之不能專意北方故以北向為難今日異於平時況事至於此不得不一舉大軍入界已三百餘里若縱之令下秦川則何以救終當一戰摧之與其戰於近𩹉之平川不若戰於近邊之險隘上亦以為然七年正月慶陽圍解大軍還白華上奏凡今之計兵食為急除密院已定忠孝軍及馬軍都尉司步軍足為一戰之資此外應河南府州亦須簽揀防城軍秋聚春放依古務農講武之義各令防本州府城以今見在九十七萬無致他日為資敵之用五月華真授樞密判官上遣近侍局副使七斤傳旨云朕用汝為院官非責汝將兵對壘第欲汝立軍中綱紀發遣文移和睦將帥究察非違至於軍伍之閱習器仗之修整皆汝所職其悉力國家以稱朕意八年大軍自去歲入陝西翱翔京兆同華之間破南山砦柵六十餘所已而攻鳳翔金軍自閺鄉屯至澠池兩行省晏然不動宰相臺諫皆以樞院瞻望逗遛為言京兆士庶橫議蜂起以至諸相力奏上前上曰合達蒲阿必相度機會可進而進耳若督之使戰終出勉強恐無益而反害也因遣白華與右司郎中夾谷八里門道宰相百官所言幷問以目今二月過半有怠歸之形諸軍何故不動且詔華等往復六日華等既到同諭兩行省以上意合達言不見機會見則動耳蒲阿曰彼軍絕無糧餉使欲戰不得欲留不能將自敝矣合達對蒲阿及諸帥則言不可動見士大夫則言可動人謂合達近嘗得罪又畏蒲阿方得君不敢與抗而亦言不可動華等觀二相見北兵勢大皆有懼心遂私問樊澤定住陳和尚以為何如三人者皆曰他人言北兵疲困故可攻此言非也大兵所在豈可輕料是真不敢動華等還以二相及諸將意奏之上曰我故知其怯不敢動矣即復遣華傳旨諭二相云鳳翔圍久恐守者力不能支行省當領軍出關宿華陰界次日及華陰次日及華州略與渭北軍交手計大兵聞之必當奔赴且以少紓鳳翔之急我亦得為掣肘計耳二相廻奏領旨華東還及中牟已有兩行省納奏人追及華取報密院副本讀之言領旨提軍出關二十里至華陰界與渭北軍交是晚收軍入關華為之仰天浩嘆曰事至於此無如之何矣華至京奏章已達知所奏為徒然不二三日鳳翔陷兩行省遂棄京兆與牙古塔起遷居民於河南留慶山奴守之夏五月楊妙真以夫李全死於宋構浮橋於楚州之北就北帥梭魯胡吐乞師復讎朝廷覘知之以謂北軍果能渡淮淮與河南跬步間耳遣合達蒲阿駐軍桃源界滶河口備之兩行省乃約宋帥趙范趙葵為夾攻之計二趙亦遣人報聘俱以議和為名以張聲勢二相屢以軍少為言而省院難之因上奏云向來附關屯駐半年適還舊屯喘不及息又欲以暑月東行實無可圖之事徒自疲而已況兼桃源青口蚊虻湫濕之地不便牧養目今非征進時月決不敢妄動且我之所慮特楚州浮梁耳姑以計圖之已遣提控王銳往視可否奏上上遣白華以此傳諭二相兼領王銳行二相不悅蒲阿遣水軍虹縣所屯王提控者以小船二十四隻令華順河而下必到八里莊城門為期且曰此中望八里莊如在雲間天上省院端坐徒事口吻今樞判親來可以相視可否歸而奏之華力辭不獲遂登舟及淮與河合流處纔及八里莊城門相直城守者以白鷂大船五十泝流而上占其上流以截華歸路華幾不得還昏黑得徑先歸乃悟兩省怒朝省不益軍謂皆華輩主之故擠之險地耳是夜二更後八里莊次將遣人送款云早者主將出城開船截大金歸路某等商議主將還即閉門不納渠已奔去楚州乞發軍馬接應二相即發兵騎開船赴約明旦入城安慰又知楚州大軍已還河朔宋將燒浮橋二相附華納奏上大喜初合達謀取宋淮陰五月渡淮淮陰主者胡路鈐往楚州計事於楊妙真比還提正官郭恩送款于金胡還不納慟哭而去合達遂入淮陰詔改歸州以行省烏古論葉里哥守之郭恩為元帥右都監既而宋人以銀絹五萬兩匹來贖盱眙龜山宋使留舘中郭恩謀劫而取之或報之于盱眙帥府即以軍至恩不果發明日宋將劉虎湯孝信以船三十艘燒浮梁因遣其將夏友諒來攻盱眙未下泗州總領完顏矢哥利舘中銀絹遂反防禦使徒單塔剌聞變扼罘山亭甬路好謂之曰容我拜辭朝廷然後死遂取朝服望闕拜慟良久投亭下水死矢哥遂以州歸楊妙真總帥納合買住亦以盱眙降宋九月陝西行省防秋時大兵在河中睿宗已領兵入界慶山奴報糧盡將棄京兆而東一日白華奏偵候得睿宗所領軍馬四萬行營軍一萬布置如此為今計者與其就漢禦之諸軍比到可行半月不若徑往河中目今沿河屯守一日可渡如此中得利襄漢軍馬必當遲疑不進在北為投機在南為掣肘臣以為如此便上曰此策汝畫之為得之他人華曰臣愚見如此上平日銳於武事聞華言若欣快者然竟不行未幾合達自陝州進奏帖亦為此事上得奏甚喜蒲阿時在洛陽驛召之蓋有意於此矣蒲阿至奏對之間不及此止言大兵前鋒忒木木受統之將出冷水谷口且當先禦此軍上曰朕不問此只欲問河中可擣否蒲阿不獲已始言睿宗所領兵騎雖多計皆冗雜大兵軍少而精無非選鋒金軍北渡大兵必遣輜重屯於平陽之北匿其選鋒百里之外放我師渡然後斷我歸路與我決戰恐不得利上曰朕料汝如此果然更不須再論且還陝州蒲阿曰合達樞密使所言此間一面革撥恐亦未盡乞召至同議可否上曰見得合達亦止此而已往復遲滯轉致誤事華奏合達必見機會召至同議為便副樞赤盞合喜亦奏蒲阿白華之言為是上乃從之召合達至上令先與密院議定然後入見既議華執合達奏帖舉似再三竟無一先發言者移時蒲阿言且勾當冷水谷一軍何如合達曰是矣遂入見上問卿等所議若何合達敷奏其言甚多大概言河中之事與前日上奏時勢不同所奏亦不敢自主議遂寢二相還陝量以軍馬出冷水谷奉行故事而已十二月河中府破九年京城被攻四月兵退改元天興是月十六日倂樞密院歸尚書省以宰相兼院官左右司首領官兼經歷官惟平章白撒副樞合喜院判白華權院判完顏忽魯剌退罷忽魯剌有口辯上愛幸之朝議罪忽魯剌而書生輩妬華得君先嘗以語撼之用是而罷金制樞密院雖主兵而節制在尚書省兵興以來茲制漸改凡在軍事省官不得預院官獨任專見往往敗事言者多以為將相權不當分至是始倂之十二月朔上遣近侍局提點曳剌粘古即白華所居問事勢至於此計將安出華附奏今耕稼已廢糧斛將盡四外援兵皆不可指擬車駕當出就外兵可留皇兄荊王使之監國任其裁處聖主既出遣使告語北朝我出非他處收整軍馬止以軍卒擅誅唐慶和議從此斷絕京師今付之荊王乞我一二州以老耳如此則太后皇族可存正如春秋紀季入齊為附庸之事聖主亦得少寬矣於是起華為右司郎中初親巡之計決諸將皆預其議將退首領官張衮聶天驥奏尚有舊人諳練軍務者乃置而不用今所用者皆不見軍中事體此為未盡上問未用者何人皆曰院判白華上頷之故有是命明日召華諭之曰親巡之計已決但所往羣議未定有言歸德四面皆水可以自保者或言可沿西山入鄧或言設欲入鄧大將速不木受今在汝州不如取陳蔡路轉往鄧下卿以為如何華曰歸德城雖堅久而食盡坐以待斃決不可往欲往鄧下既汝州有速不木受斷不能往以今日事勢博徒所謂孤注者也孤注云者止有背城之戰為今之計當直赴汝州與之一決有楚則無漢有漢則無楚汝州戰不如半塗戰半塗戰又不如出城戰所以然者何我軍食力猶在馬則豆力猶在若出京益遠軍食日減馬食野草事益難矣若我軍便得戰存亡決此一舉外則可以激三軍之氣內則可以慰都人之心或止為避遷之計人心顧戀家業未必毅然從行可詳審之遂召諸相及首領官同議禾速嘉兀地不元帥猪兒高顯王義深俱主歸德之議丞相賽不主鄧議竟不能決明日制旨京城食盡今擬親出聚集軍士於大慶殿諭以此意諭訖諸帥將佐合辭奏曰聖主不可親出止可命將三軍欣然願為國家效死上猶豫欲以官奴為馬軍帥高顯為步軍帥劉益副之蓋採輿議也而三人者亦欲奉命權參政內族訛出大罵云汝輩把鋤不知高下國家大事敢易承邪衆默然惟官奴曰若將相可了何至使我輩事亦中止明日民間鬨傳車駕欲奉皇太后及妃后往歸德軍士家屬留後目今食盡坐視城中俱餓死矣縱能至歸德軍馬所費支吾復得幾許日上聞之召賽不合周訛出烏古孫卜吉完顏正夫議餘人不預移時方出見首領官丞相言前日巡守之議已定止為一白華都改却今往汝州就軍馬索戰去矣遂擇日祭太廟誓師擬以二十五日啟行是月晦車駕至黃陵岡復有北幸之議語在白撒傳天興二年正月朔上次黃陵岡就歸德餫船北渡諸相共奏京師及河南諸州聞上幸河北恐生他變可下詔安撫之是時在所父老僧道獻食及牛酒犒軍者相屬上親為拊慰人人為之感泣乃赦河朔招集兵糧赦文條畫十餘款分道傳送二日或有云昨所發河南詔書儻落大軍中奈泄事機何上怒委近侍局官傳旨謂首領官張衮白華內族訛可當發詔時不為後慮皆量決之是時衛州軍兩日至蒲城而大軍徐躡其後十五日宰相諸帥共議上前郎中完顏胡魯剌秉筆書某軍前鋒某軍殿後餘事皆有條畫書畢惟不言所往華私問胡魯剌託以不知是晚平章及諸帥還蒲城軍中夜半訛可衮就華帳中呼華云上已登舟君不知之耶華遂問其由訛可云我昨日已知上欲與李左丞完顏郎中先下歸德令諸軍並北岸行至鳳池渡河今夜平章及禾速嘉元帥官奴等來言大軍在蒲城曾與金軍接戰勢莫能支遂擁主上登舟軍資一切委棄止令忠孝軍上船馬悉留營中計舟已行數里矣華又問公何不從往云昨日擬定首領官止令胡魯剌登舟餘悉隨軍用是不敢是夜總帥百家領諸軍舟往鳳池大軍覺之兵遂潰上在歸德三月崔立以汴京降右宣徽提點近侍局移剌粘古謀之鄧上不聽時粘古之兄瑗為鄧州節度使兼行樞密院事其子與粘古之子並從駕為衛士適朝廷將召鄧兵入援粘古因與華謀同之鄧且拉其二子以往上覺之獨命華行而粘古改之徐州華既至鄧以事久不濟淹留于舘遂若無意於世者會瑗以鄧入宋華亦從至襄陽宋署為制幹又改均州提督後范用吉殺均之長吏送款于北朝遂因而北歸士大夫以華夙儒貴顯國危不能以義自處為貶云用吉者本姓孛术魯名久住初歸入宋謁制置趙范將以計動其心故更姓名范用吉趙怒其觸諱斥之用吉猶應對如故趙良久方悟且利其事與己符遂擢置左右凡所言動略不加疑遂易其姓曰花使為太尉改鎮均州未幾納款于北後以家人誣以欲叛為同列所害贊曰白華以儒者習吏事以經生知兵其所論建屢中事機然三軍敗衄之餘士氣不作其言果可行乎從瑗歸宋聲名掃地而猶得列於金臣之傳者援蜀譙周等例云斜卯愛實字正之策論進士也正大間累官翰林直學士兼左司郎中天興元年正月聞大兵將至以點檢夾谷撒合為總帥率步騎三萬巡河渡命宿直將軍內族長樂權近侍局使監其軍行至封丘而還入自梁門樞密副使合喜遇之笑語撒合曰吾言信矣當為我作主人蓋世俗酬謝之意也明日大兵遂合朝廷置而不問於是愛實上言曰撒合統兵三萬本欲乘大兵遠至喘息未定而擊之出京纔數十里不逢一人騎已畏縮不敢進設遇大兵其肯用命乎乞斬二人以肅軍政不報蓋合喜輩以京師倚此一軍為命初不敢俾之出戰特以外議鬨然故暫出以應之云衛紹鎬厲二王家屬皆以兵防護且設官提控巡警之嚴過於獄犴至是衛紹宅二十年鎬厲宅四十年正大間朝臣屢有言及者不報愛實乃上言曰二族衰微無異匹庶假欲為不善孰與同惡男女婚嫁人之大欲豈有幽囚終世永無伉儷之望在他人尚且不忍況骨肉乎哀宗感其言始聽自便未幾有青城之難愛實憤時相非其人嘗歷數曰平章白撒固權市恩擊丸外百無一能丞相賽不菽麥不分更謂乏材亦不至此人為相參政兼樞密副使赤盞合喜粗暴一馬軍之材止矣乃令兼將相之權右丞顏盞世魯居相位已七八年碌碌無補備員而已患難之際倚注此類欲冀中興難矣於是世魯罷相賽不乞致仕而白撒合喜不恤也是年四月京城罷攻大兵退既而以害唐慶事和議遂絕於是再簽民兵為守禦備八月括京城粟以轉運使完顏珠顆張俊民曳剌克忠等置局以推舉為名珠顆諭民曰汝等當從實推唱果如一旦糧盡令汝妻子作軍食復能吝否既而罷括粟令復以進獻取之前御史大夫內族合周復冀進用建言京城括粟可得百餘萬石朝廷信之命權參知政事與左丞李蹊總其事先令各家自實壯者存石有三斗幼者半之仍書其數門首敢有匿者以升斗論罪京城三十六坊各選深刻者主之內族完顏久住尤酷暴有寡婦二口實豆六斗內有蓬子約三升久住笑曰吾得之矣執而以令于衆婦泣訴曰妾夫死於兵姑老不能為養故雜蓬粃以自食耳非敢以為軍儲也且三升六斗之餘不從竟死杖下京師聞之股栗盡投其餘于糞溷中或白於李蹊蹊顰蹙曰白之參政其人即白合周周曰人云花又不損蜜又得成予謂花不損何由成蜜且京師危急今欲存社稷耶存百姓耶當時皆莫敢言愛實遂上奏大概言罷括粟則改虐政為仁政散怨氣為和氣不報時所括不能三萬斛而京城益蕭然矣自是之後死者相枕貧富束手待斃而已上聞之命出太倉米作粥以食餓者愛實聞之歎曰與其食之寧如勿奪為奉御把奴所告又近侍干預朝政愛實上章諫曰今近侍權太重將相大臣不敢與之相抗自古僕御之臣不過供給指使而已雖名僕臣亦必選擇正人今不論賢否惟以世冑或吏員為之夫給使令之材使預社稷大計此輩果何所知乎章既上近侍數人泣訴上前曰愛實以臣等為奴隸置至尊何地耶上益怒送有司近侍局副使李大節從容開釋乃赦之出為中京留守後不知所終合周者一名永錫貞祐中為元帥左監軍失援中都宣宗削除官爵杖之八十已而復用四年以御史大夫權尚書右丞總兵陝西合周留澠池數日進及京兆而大兵已至合周竟不出兵遂失潼關有司以敵至不出兵當斬諸皇族百餘人上章救之上曰向合周救中都未至而軍潰使宗廟山陵失守罪當誅朕特寬貸以全其命尋復重職今鎮陝西所犯乃爾國家大法豈敢私耶遂再奪爵免死除名至是為參知政事性好作詩詞語鄙俚人采其語以為戲笑因自草括粟榜文有雀無翅兒不飛蛇無頭兒不行等語以而作兒掾史知之不敢易也京城目之曰雀兒參政哀宗用而不悟竟致敗事石抹世勣字景略幼勤學為文有體裁承安二年以父元毅死王事收充擎執五年登詞賦經義兩科進士第貞祐三年累官為太常丞預講議所事時朝廷徙河北軍戶河南宰職議給以田世勣上言曰荒閑之田及牧馬地其始耕墾費力當倍一歲斷不能熟若奪民素蒔者與之則民將失所且啟不和之端況軍戶率無耕牛雖或有之而廪給未敢遽減彼既南來所捐田宅為人所有一旦北歸能無爭奪切謂宜令軍戶分人歸守本業收其晚禾至春復還為固守計會侍御史劉元規亦言給田不便上大悟乃罷之未幾遷同知金安軍節度使興定二年選為華州元帥府參議官初右都監完顏合達行帥府于楨州嘗以前同知平涼府事卓魯回蒲乃速為參議及移駐華州陝西行省請復用蒲乃速令世勣副之上曰蒲乃速但能承奉人耳餘無所長非如世勣可任以事華為要鎮而輕用其人或致敗事遂獨用世勣焉尋入為尚書省左司郎中元光元年奪一官解職初世勣任華州有薦其深通錢穀者覆察不如所舉未籍行止中後主者舉覺平章英王以世勣避都司之繁私屬治籍吏冀改他職奏下有司故有是責久之起為禮部侍郎轉司農改太常卿正大中為禮部尚書兼翰林侍講學士天興元年冬哀宗將北渡世勣率朝官劉肅田芝等二十人求見仁安殿上問卿等欲何言世勣曰臣等聞陛下欲親出切謂此行不便上曰我不出軍分為二一軍守一軍出戰我出則軍合為一世勣曰陛下出則軍分為三一守一戰一中軍護從不若不出為愈也上曰卿等不知我若得完顏仲德恆山公武仙付之兵事何勞我出我豈不知今日將兵者官奴統馬兵三百止矣劉益將步兵五千止矣欲不自將得乎上又指御榻曰我此行豈復有還期但恨我無罪亡國耳我未嘗奢侈未嘗信任小人世勣應聲曰陛下用小人則亦有之上曰小人謂誰世勣歷數曰移剌粘古溫敦昌孫兀撒惹完顏長樂皆小人也陛下不知為小人所以用之肅與世勣復多有言良久君臣涕泣而別初肅等求見本欲數此四人至是世勣獨言之於是哀宗以世勣從行自蒲城至歸德明年六月走蔡州次新蔡縣之姜寨世勣子嵩時為縣令拜上於馬前兵亂後父子始相見上嘉之授嵩應奉翰林文字以便養親蔡城破父子俱死嵩字企隆興定二年經義進士贊曰愛實言衛鎬家屬禁錮之虐京城括粟之暴近侍干政之橫世勣言河北軍戶給田之不便親出渡河之非計皆藥石之言也然金至斯時病在膏肓間矣倉扁何施焉其為忠讜則不可廢也
