body:
  text: 金史卷四十志第二十一樂下宗廟樂歌殿庭樂歌鼓吹導引曲采茨曲禘祫親饗皇帝入門宮縣無射宮昌寧之曲出入步武同惟時升平禮儀肇興鳴鑾至止穆穆造庭百辟卿士恪謹迎承恭款祖考神宇攸寧皇帝升殿登歌夾鐘宮昌寧之曲升階及將還板位皆同登歌笙鏞既陳罍樽在戶升降有容惟規惟矩恭敬明神上儀交舉永言保之承天之祜皇帝盥洗宮縣無射宮昌寧之曲惟水之功潔淨精微洗爵奠斝于德有輝皇皇穆穆宗廟之威宜其感格福祉交歸皇帝降階宮縣無射宮昌寧之曲於皇神宮象天清明有來肅肅相維公卿禮儀卒度君子攸寧孔時孔惠綏我思成迎神宮縣來寧之曲黃鐘宮三奏大呂角二奏大蔟徵二奏應鐘羽二奏詞同八音克諧百禮具舉明德維清至誠永慕神之格思雲軿風馭來止來臨千祀燕處司徒引俎宮縣無射宮豐寧之曲維牲維犧齊明致祠我將我享吉蠲奉之博碩肥腯神嗜為宜千秋歆此永綏黔黎始祖酌獻宮縣無射宮大元之曲惟酒既清惟殽既馨苾芬孝祀在廟之庭羞於皇祖來燕來寧象功昭德先祖是聽德皇帝大熙之曲萬方欣戴鴻業創基瑤源垂裕綿瓞重熙式崇毖祀爰考成規籩豆有楚益臻皇儀安皇帝大安之曲爰圖造邦載德其昌皇儀允穆誕集嘉祥明誠昭格積厚流光秪嚴清廟鐘石琅琅獻祖大昭之曲惟聖興邦經始之初鳩民化俗還定攸居迪德純儉志規遠圖時哉顯祀精誠有孚昭祖大成之曲天啟璇源貽慶定基率義為勇施德為威耀武拓境功烈巍巍永昌皇祚均福黔黎景祖大昌之曲丕顯鴻烈基緒隆昌聖期誕集邦宇斯張尊嚴廟祏昭格休祥煌煌縟典億載彌光世祖大武之曲桓桓伐功天監其明惟威震疊惟德綏寧神策無遺鴻圖以興曾孫孝祀遹昭厥成肅宗大明之曲於皇神人武烈文謨左右世祖懷柔掃除威震遐邇化漸蟲魚垂光綿永成帝之孚穆宗大章之曲烝哉文祖欽聖弘淵慈愛忠信典策昭然歆此明祀繁祉綿綿時純熙矣流慶萬年康宗大康之曲惟明惟聽曄曄神功儀刑世業昭格上穹持盈孝孫薦芳斯豐錫我祉福皇化益隆太祖大定之曲功超殷周德配唐虞天人協應平統寰區開祥垂裕肇基永圖明明天子敬承典謨太宗大惠之曲巍巍德鴻無為端扆祚承神功究馴俗媺清宮緝熙孝毖時祀欽奠羞誠犧樽嘉旨熙宗大同之曲昭顯令德神基丕承對越在天享用躋升於穆清廟來燕來寧神其醉止惟欽克誠睿宗大和之曲皇祖開基周武殷湯猗歟聖考嗣德彌光啟佑洪緒長發其祥嚴恭廟享萬世烝嘗世宗大鈞之曲神之來思甫登于堂祼圭有瓚秬鬯芬芳巍巍先功啟祐無疆萬年肆祀孝心不忘顯宗大寧之曲於皇神宮有嚴惟清吉蠲孝祀惟神之寧對越在天綏我思誠敷祐億年邦家之慶章宗大隆之曲兩紀踐阼萬方寧康文經天地武服遐荒禮備制定德隆業昌居歆典祀億載無疆宣宗大慶之曲猗歟聖皇三代之英功光先后德被羣生牲粢惟馨鼓鐘其鏗神兮來思歆于克誠文舞退武舞進宮縣無射宮肅寧之曲明明先皇神武維揚開基垂統萬世無疆干戚象功威儀有光神保是饗昭哉降康亞終獻無射宮肅寧之曲涓辰之休昭祀惟恭威儀陟降惟禮是從籩豆靜嘉於論鼓鐘惟皇受祉監斯德容皇帝飲福登歌夾鐘宮福寧之曲犧牲充潔粢盛馨香來格來享精神用彰飲此純禧簡簡穰穰文明天子萬壽無疆徹豆登歌夾鐘宮豐寧之曲孝祀肅睦明德以薦樂奏九成禮終三獻百辟卿士進徹以時小大稽首神保聿歸送神宮縣黃鐘宮來寧之曲潔茲牛羊清茲酒醴三獻攸終神既燕喜神之去兮載錫繁祉萬壽無疆永保禋祀郊祀前朝享太廟樂歌皇帝入門宮縣無射宮昌寧之曲郊將升禋廟當告虔錫鑾戾止孝實奉先祀事斯舉有序無愆祗見祖考神意懽然皇帝升殿登歌夾鐘宮昌寧之曲皇皇天子升自阼階奠見祖禰肅然有懷百禮已洽八音克諧既昌且寧萬福沓來迎神宮縣來寧之曲黃鐘宮三奏大呂角二奏太蔟徵二奏應鐘羽二奏詞同以實應天報本反始潔粢豐盛禮先肆祀風馬雲車神之弔矣來止來宜而燕翼子皇帝盥洗宮縣無射宮昌寧之曲有水于罍有巾于篚帨手拭爵圭衮有煒玄酒大羹德馨維菲萬年昌寧皇皇負扆皇帝陞階宮縣無射宮昌寧之曲降階同巍巍京師有嚴神宮聖主戾止多士雲從來享來獻肅肅其容將昭大報庸示推崇司徒奉俎宮縣無射宮豐寧之曲陳其犧牲惟純與精苾芬孝祀於昭克誠不疾瘯蠡或剝或亨洋洋在上以交神明始祖酌獻宮縣大元之曲猗歟初基兆我王迹其命維新貽謀丕赫緜緜瓜瓞國步日闢堂構之成焜煌今昔獻祖大昭之曲以聖繼興成王之孚民從其化咸奠攸居清廟觀德猗歟偉歟金石備樂以奉神娛昭祖大成之曲東夷不庭皇祖震怒神武削平貽厥聖緒猶室有基垣墉乃樹億萬斯年天保孔固景祖大昌之曲於皇藝祖其智如神修法施令百度惟新疆宇日廣海隅咸賓功高德厚耀耀震世祖大武之曲於皇先王昭假于天長駕遠馭麾斥無前王業猶生孫謀有傳圓壇展禮敢先告虔肅宗大明之曲猗歟前人簡惠昭融相我世祖成茲伐功敷佑來葉帝圖其隆將修熙事先款神宮穆宗大章之曲仁慈忠信惟祖之休功光岐下迹掩商丘言瞻清廟懷想前修神其來格歆茲庶羞康宗大康之曲猗歟前王惠我無疆儀刑典法日靖四方永言孝思於乎不忘昭告大祀祗率舊章太祖大定之曲天生聰明俾乂蒸人惟此二國為我敺民撻彼威武萬邦咸賓明昭大報推而配神太宗大惠之曲維清緝熙於昭明德我其收之駿奔萬國南郊肇修大典增飾清廟吉蠲純禧申錫睿宗大和之曲維時祖功肇開神基昭哉聖考其德增輝上動天監明命攸歸謀貽翼子無疆之辭文舞退武舞進宮縣肅寧之曲先皇開基比迹殷湯功加天下武德彌光容舞象成干戈戚揚於昭報本懷哉不忘亞終獻宮縣肅寧之曲於皇宗祊朝獻維時芬芬酒醴棣棣威儀誠則有餘神之格思神孫千億神其相之皇帝飲福登歌夾鐘宮福寧之曲皇皇穆穆丕承丕基躬親于禋載肅載祗對越在天神歆其誠于以飲酒如川之增徹豆登歌夾鐘宮豐寧之曲物維其時既豐且旨苾苾德馨或將或肆神之居歆洽于百禮於萬斯年穰穰介祉送神宮縣黃鐘宮來寧之曲濟濟多儀皇皇雅奏獻終反爵薦餘徹豆神監昭回有秩斯祐無疆之福申錫厥後昭德皇后別廟郊祀前薦享登歌樂曲初獻盥洗夷則宮肅寧之曲神無常享時歆精誠惟誠惟潔感通神明先事盥滌注茲清冷巾篚既奠尊彝薦馨初獻升降殿中呂宮嘉寧之曲有來肅肅登降以敬粲粲袨服鏘鏘佩聲金石節奏既協且平其儀不忒乃終有慶司徒奉俎奏夷則宮豐寧之曲馨我黍稷潔我牲牷降升有節薦是吉蠲工祝致告威儀肅然神之弔矣元吉其旋酌獻奏夷則宮儀坤之曲俔天之妹坤德利貞圓丘有事先薦以誠我酒既旨我殽既盈神其居饗福祿來成徹豆奏中呂宮豐寧之曲明昭祀事舊典無違樂既云闋神其聿歸禮之克成神保斯饗於萬斯年迓續丕貺祫禘有司攝事初獻盥洗宮縣無射宮肅寧之曲祀事之大齊栗為先潔精以獻沃盥于前既灌以升乃薦豆籩神其感格歆于吉蠲升自西階登歌奏夾鐘宮嘉寧之曲餘並同親祀國有太宮合食以禮躋階肅肅降陛濟濟鏘然純音節乃容止神之格思永綏福履時享攝事登歌樂章初獻盥洗無射宮肅寧之曲酌彼行潦維挹其清潔齊以祀祀事昭明顯允辟公沃盥乃升神之至止歆于克誠初獻升殿夾鐘宮嘉寧之曲餘同親祀惟不用宮縣濟濟在庭祗薦有序雍容令儀旋規折矩爰徂于基鳴珮接武敬恭神明來寧來處昭德皇后時享登歌樂章初獻盥洗無射宮肅寧之曲時祀有章禮備樂舉爰潔其盥亦豐其俎俯仰升降中規中矩神其來格百福是與初獻升殿夾鐘宮嘉寧之曲三獻及司徒降同假哉神宮神宮有侐惟時吉蠲登降翼翼歌鐘鏘煌笙磬翕繹於昭肅恭靈釐來格司徒奉俎無射宮豐寧之曲宮庭枚枚鐘磬喤喤既儀圭鬯既奠膋薌齊莊奉饋籩豆大房靈之右饗流慶無疆酌獻無射宮儀坤之曲於皇坤德作合乾儀塗山懿範京室芳徽容聲如在典祀惟時神其克享薦祉來宜亞終獻無射宮儀坤之曲嘉羞實俎高張在庭申獻合禮終獻改申為三坤德儀刑神其是聽用鬯清明清明既鬯來享來寧徹豆夾鐘宮豐寧之曲禮成於終神心禗禗膋蕭發馨樂闋獻已徒馭孔多靈輿載轙青玄悠悠歸且億矣宣孝太子別廟登歌樂章初獻升殿夾鐘宮承安之曲有腯斯牲有馨斯齊美哉洋洋升降以禮禮容既莊樂亦諧止神之格思式歆明祀酌獻無射宮和寧之曲於惟光靈孝德昭宣高麗有奕來寧來燕於薦惟祫既時既蠲從我烈祖載享億年亞終獻和寧之曲金石和奏豆籩惟豐祠宮奉事齊敬精衷笙吟伊浦鶴駐緱峰是保是饗靈德無窮徹豆夾鐘宮和安之曲寢成奕奕今茲其時明稱肇祀將禮之儀侯安以懌羞嘉且時樂闋獻已神其饗思大定三年十月追上睿宗冊寶應鐘宮顯寧之曲天開休運積仁而昌命茲昭考敢忘顯揚上儀肇舉涓日之良來格來享惠我無疆大定十九年升祔熙宗冊寶樂曲恢大帝業敉寧多方懿德茂烈金書發揚肇舉上儀涓擇吉日鴻名赫赫與天無極上冊寶宮縣靜寧之曲日卜其吉承祀孔肅廣號追崇孝心克篤於乎悠哉來思晬穆寶冊既陳委於宗祝皇帝降殿宮縣鴻寧之曲繼世隆昌臨朝靜默追諡鴻名發輝潛德玉質金章煌煌簡冊涓辰展儀永傳無極殿庭樂歌大定七年正月上冊寶皇帝將升御座宮縣奏太蔟宮泰寧之曲降座同德隆帝位承天而興侯邦來庭民居安寧歸美以報傳之無極鴻名徽稱壽時萬億冊寶入門奏天保報上之曲四方既平功歸聖明定功巍巍丕享鴻名股肱良哉揄揚元首儲精優游南山等壽奉冊寶官將復班位奏歸美揚功之曲聖德高明萬邦咸休錙銖唐虞糠粃商周維時羣臣對敭稽首天子明明令聞不朽冊寶初行奏和寧之曲冊寶將升殿皇太子自侍立位至降階曲並同四方攸同昭哉成功時和年豐諸福來崇英聲昭騰和氣充塞於乎皇王維壽時億皇太子升殿賀奏同心戴聖之曲穆清皇風遐方來同於昭于天物和歲豐丕受鴻名對揚偉蹟純釐穰穰敷錫罔極上壽皇帝將升御座宮縣和寧之曲同前舉酒萬壽無疆之曲四海太平吾皇之功羣臣對揚誕受鴻名霞觴瓊腴君王樂豈皇天垂休萬壽無極皇太子升階降階及與宴官升殿並奏和寧之曲同前進第一爵登歌奏王道昌明之曲對天鴻休于以鋪張巍巍煌煌超冠百王皇圖皇綱時維明昌祉福無疆于民敷揚行羣官酒宮縣和寧之曲文舞入設羣官食奏功成治定之舞三成止聖德高明如天強名多方治平功大有成流于聲音形于蹈舞頒觴羣臣以昭禮遇進第二爵登歌奏天子萬年之曲惟明后馭寰瀛躋升平飛英聲功三王德五帝游巖廊億萬歲行羣官酒宮縣和寧之曲武舞入設羣官食奏四海會同之舞三成止地平天成時和歲豐迓衡弗迷率惟敉功受天之祜四方來荷於萬斯年不遐有佐進第三爵登歌嘉禾之曲景命赫斯歸吾皇仁風洋洋被遠荒琛贄旅庭趨明光氣和薰蒸為嘉祥殊本合穗真異常庾如坻京歲且穰猗歟鴻休超前王播為聲詩傳無疆行羣官酒設羣官食羣官降階宮縣並奏和寧之曲皇帝將降御座奏泰寧之曲並用太蔟宮大定十一年十一月行冊禮皇帝升御座宮縣泰寧之曲皇皇穆穆衮服玉趾如日之升如山仰止九賓在列媚茲天子願言無疆介以繁祉冊寶入門奏天保報上之曲穆穆元聖天迪子保相維臣工以奏丕號揚于路朝玉牒神寶於萬斯年吾君壽考奉冊寶官將復班位奏歸美揚功之曲玉冊玉寶尊聖天子丕揚鴻名昭受帝祉閎休對天其隆孰比臣下同心翼戴歸美皇太子升殿賀奏同心戴聖之曲大矣我后徽冊膺受歡趨彤庭拜手稽首休明御辰無疆萬壽靈貺沓來天地長久舉酒奏萬壽無疆之曲聖德懋昭民歸天祐煌煌金書典冊光受備樂在庭八音諧奏羣公奉觴天子萬壽進第一爵登歌王道昌明之曲明明我皇道光化溥百度惟新禮修樂舉藻飾太平爛然可覩超躋三王暉映千古設羣官食奏和寧之曲功成治定之舞穆穆我君威折羣醜輝光日新仁洽九有容典葳蕤超前絕後端拱深嚴寶冊膺受第二爵登歌奏天子萬年之曲典禮修惟明后揚鴻名燦瓊玖羅華紳為萬壽歌南山堅且久行羣官酒奏和寧之曲四海會同之舞道隆政平天開有德萬國和寧來王來極昭受鴻名俯徇列辟錫飲行觴歡心各得第三爵登歌奏嘉禾之曲衆瑞畢至昭升平爰生嘉禾廼合穗膴膴大田無南東稼茂如雲成豐歲既刈既穫百室盈擊壤歌沸野老聲陶唐之民茲其比帝力何有若自遂大定十八年十二月上受命寶皇帝將升御座宮縣奏泰寧之曲並大呂宮上帝有赫懷此明德畀之神寶庸鎮萬國臨軒是膺登降維則羣臣拜首年卜萬億寶入門奏天保報上之曲受命大寶昭答眷佑珍符明貺人為天授文物具舉韶濩迭奏羣臣上之天子萬壽羣臣合班奏歸美揚功之曲德冒生民明明元后端冕臨軒神寶是受羣工來賀咸拜稽首無疆無期享祚長久皇太子升殿并自侍立位降階宮縣稱觴介壽之曲上儀昭舉膺時瑞玉羣辟在列蹌蹌肅肅衮衣桓圭歸美稽首升降惟時天子萬壽舉酒登歌奏萬壽無疆之曲上帝眷命純休茲至誕膺洪寶光臨大器稱觴對揚嵩嶽萬歲其寧惟永無疆卜世天德二年十月冊立中宮皇帝將升御座宮縣奏乾寧之曲降座同人道大倫王化所基明聖稽古陰教欲施臨軒發冊備舉彝儀麟趾關雎宜播聲詩冊寶入門奏昌寧之曲出門同羽衞充庭淑旂徽章禮儀具舉涓辰以良相我內訓來儀椒房億萬斯年邦家之光將受冊寶以冊寶入門宮縣奏肅寧之曲命婦升降同塗山興夏關雎美周坤儀之尊母臨九州瑤冊褘衣光配凝旒地久天長福祿是遒后出閤奏順寧之曲升降座同天立厥配任姒比隆母儀四海化行六宮日月並明乾坤合德於萬斯年作儷宸極受冊奏坤寧之曲風化之始由于壼闈禮文斯備爰正坤儀維順以慈儷聖同德則百斯男垂統無極天德四年二月冊皇太子皇帝將升御座宮縣奏乾寧之曲皆用夾鐘宮大君有為先圖本固涓辰之吉禮成儲副文物備陳聲樂皆具人心載寧克昌福祚冊使入門昌寧之曲在天成象煥乎前星惟聖時憲典禮以行一人有慶萬邦以貞社稷之福寖昌寖明皇太子入門奏元寧之曲出門同皇矣上帝純佐明聖篤生元良日躋德性冊命主器萬邦以正龍樓問寢億年之慶大定八年正月冊皇太子皇帝將升御座宮縣洪寧之曲並用太蔟宮會朝清明臨軒備禮天威皇皇臣工濟濟於昭元良膺茲典冊對揚閎休卜年萬億皇太子入門奏肅寧之曲光昭前星惟天垂象稽古而行主器以長曲禮告成邇遐屬望國本既隆繁釐永享羣臣合班奏嘉寧之曲於皇臨軒禮崇上嗣維眷之祺傃方正位言觀其儀翔翔濟濟美歸吾君太平萬歲皇太子復受冊位奏和寧之曲祖功艱難經營締構基牢根深枝繁葉茂於昭貽謀駢休集佑元良斯貞吾皇萬壽大定二十七年三月冊皇太孫皇帝將升御座宮縣泰寧之曲並姑洗宮上天叢休申錫祚胤孫謀有詒臨軒體正煌煌上儀欣欣衆聽隆我邦本無疆惟慶皇太孫入門奏慶寧之曲出門同寶源流光流光惟遠孫謀有貽慶序昭衍於樂衆望於皇備典動容周旋承茲嘉羨羣臣合班奏順寧之曲冕旒當宁徽章備舉綵仗充庭金石列簴濟濟多士翼翼就序海潤山暉傾聽樂府皇太孫復受冊位奏保寧之曲禮之攸聞丕建世嫡衆論協從天心不易名崇震宮辭著瑞冊社稷宗廟無疆夷懌鼓吹導引曲天眷三年九月駕幸燕京導引曲無射宮五年一狩仙仗到人間問稼穡艱難蒼生洗眼秋光𩹉今日見天顏金戈玉斧臨香火馳道六龍閑歌謠到處皆相似天子壽南山天德二年三月祫享廻鑾導引曲禮成廟享御衞拱飛龍諸道起祥風太平天子多受福孝德與天通鳳簫龍管韶音奏聲在五雲中粲然文物昭治世萬億禩無窮貞元元年三月駕幸中都導引曲並姑洗宮鑾輿順動嘉氣滿神京輦路宿塵清鈎陳萬旅隨天仗縹緲轉霓旌都人望幸傾堯日鼇抃溢歡聲臨觀八極辰居正寰宇慶昇平采茨曲新都春色滿華蓋定全燕時運千齡協星辰五緯連六龍承曉日丹鳳倚中天王氣盤山海皇居億萬年貞元三年十一月祫享廻鑾采茨曲並用慶成廻大駕仙仗紫雲深龍衮輝千騎嵩呼間八音太平興縟禮萬國得懽心孝格迎遐福穰穰永降臨正隆六年六月駕幸南京導引曲並林鐘宮神宮壯麗宮殿壓蓬萊向曉九門開聖明天子初巡幸遙駕六龍來五雲影𩹉排仙仗清蹕絕纖埃都人齊唱昇平曲更進萬年盃采茨曲雙闕層雲表澄景開清曉六龍天上來馳道平如掃虞巡五載合夏諺一遊同都人欣豫意寫入頌聲中大定三年十月祫享廻鑾采茨導引曲皆應鐘宮自後親祀二曲並用太宮崇烈考大禮慶初成綵仗廻雲步天階嚴蹕聲舜宮合至孝周頌詠維清介福應穰簡歡交萬國情導引曲禮行清廟華黍薦年豐聖孝與天通六龍廻馭千官衞玉振珮環風黃麾金輅嚴天仗非霧鬱葱葱工歌疊奏升平曲福祿自來崇大定二十七年三月皇太孫受冊謝廟導引曲璿源濬發衍慶自靈長聖運日隆昌震闈顯冊遵彝典基緒煥重光練時廟見嚴昭報禮樂粲成章精誠潛格神明助福祿永無疆
