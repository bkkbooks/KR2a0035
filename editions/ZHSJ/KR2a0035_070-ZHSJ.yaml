body:
  text: 金史卷七十列傳第八撒改宗憲本名阿懶習不失宗亨本名撻不也宗賢本名賽里石土門忠本名迪古乃習室思敬本名撒改撒改者景祖孫韓國公劾者之長子世祖之兄子也劾者於次最長景祖方計定諸部愛世祖膽勇材略及諸子長國俗當異宮居而命劾者與世祖同邸劾者專治家務世祖主外事世祖襲節度使越劾孫而傳肅宗穆宗皆景祖志也穆宗初襲位念劾者長兄不得立遂命撒改為國相穆宗履藉父兄趾業鋤除強梗不服己者使撒改取馬紀嶺道攻阿疎穆宗自將期阿疎城下會軍撒改行次阿不塞水烏延部斜勒勃菫來謁謂撒改曰聞國相將與太師會軍阿疎城下此為深入必取之策宜先撫定潺蠢星顯之路落其黨附奪其民人然後合軍未晚也撒改從之攻鈍恩城請濟師穆宗與之撒改遂攻下鈍恩城而與穆宗來會阿疎城下鈍恩在南阿疎在北穆宗初遣撒改分道即會攻阿疎聞其用斜勒計先取鈍恩城與初議不合頗不然之及遼使來止勿攻阿疎然後深以先取鈍恩城為功也及以國相都統討留可詐都塢塔等軍而阿疎亡入于遼終不敢歸留可詐都塢塔鈍恩皆降康宗沒太祖稱都勃極烈與撒改分治諸部匹脫水以北太祖統之來流水人民撒改統之明年甲午嗣節度命方至遼主荒于遊畋政事怠廢太祖知遼可伐遂起兵九月與遼人戰于界上獲謝十太祖使告克于撒改賜以所獲謝十乘馬撒改及將士皆歡呼曰義兵始至遼界一戰而勝滅遼必自此始矣遣子宗翰及完顏希尹來賀捷因勸進太祖未之從也十月師克寧江州破遼師十萬于鴨子河師還十二月太宗及撒改辭不失率諸將復勸進收國元年正月朔太祖即位撒改行國相如故伐遼之計決於迪古廼贊成大計實自撒改啟之撒改自以宗室近屬且長房繼肅宗為國相既貴且重故身任大計贊成如此諸人莫之或先也太祖即位後羣臣奏事撒改等前跪上起泣止之曰今日成功皆諸君協輔之力吾雖處大位未易改舊俗也撒改等感激再拜謝凡臣下宴集太祖嘗赴之主人拜上亦答拜天輔後始正君臣之禮焉七月太宗為諳版勃極烈撒改國論勃極烈辭不失阿買勃極烈杲國論勃極烈勃極烈女直之尊官也太祖自正位號凡半歲未聞有封拜太宗介弟優禮絕等杲母弟之最幼者撒改辭不失以宗室同封拜九月加國論胡魯勃極烈天輔五年薨太祖往弔乘白馬剺額哭之慟及葬復親臨之賵以所御馬撒改為人敦厚多智長于用人家居純儉好稼穡自始為國相能馴服諸部訟獄得其情當時有言不見國相事何從決及舉兵伐遼撒改每以宗臣為內外倚重不以戰多為其功也天會十五年追封燕國王正隆降封陳國公大定三年改贈金源郡王配饗太祖廟廷諡忠毅十五年詔圖像于衍慶宮子宗翰宗憲宗翰別有傳宗憲本名阿懶頒行女直字書年十六選入學太宗幸學宗憲與諸生俱謁宗憲進止恂雅太宗召至前令誦所習語音清亮善應對侍臣奏曰此左副元帥宗翰弟也上嗟賞久之兼通契丹漢字未冠從宗翰伐宋汴京破衆人爭趨府庫取財物宗憲獨載圖書以歸朝廷議制度禮樂往往因仍遼舊宗憲曰方今奄有遼宋當遠引前古因時制宜成一代之法何乃近取遼人制度哉希尹曰而意甚與我合由是器重之撻懶宗雋唱議以齊地與宋宗憲廷爭折之當時不用其言其後宗弼復取河南陝西地如宗憲策以捕宗磐宗雋功授昭武大將軍修國史累官尚書左丞熙宗從容謂之曰嚮以河南陝西地與宋人卿以為不當與今復取之是猶用卿言也卿識慮深遠自今以往其盡言無隱宗憲拜謝遂攝門下侍郎初熙宗以疑似殺左丞相希尹久之察其無罪深閔惜之謂宗憲曰希尹有大功于國無罪而死朕將錄用其孫如之何宗憲對曰階下深念希尹錄用其孫幸甚若不先明死者無罪生者何由得仕上曰卿言是也即日復希尹官爵用其孫守道為應奉翰林文字皇統五年將肆赦議覃恩止及女直人宗憲奏曰莫非王臣慶幸豈可有間邪遂改其文使均被焉轉行臺平章政事天德初為中京留守安武軍節度使封河內郡王改太原尹進封鉅鹿郡王正隆例奪王爵再遷震武武定軍節度使世宗即位遣使召之詔曰叔若能來宜速至此若為紇石烈志寧白彥敬所遏亦不煩叔憂宗憲聞世宗即位先已棄官來歸與使者遇於中都遂見上于小遼口除中都留守即遣赴任詔與元帥完顏彀英同議軍事明年改西京留守八月改南京僕散忠義自行臺朝京師宗憲攝行臺尚書省事召為太子太師上謂宗憲曰卿年老舊人更事多矣皇太子年尚少謹訓導之俄拜平章政事太子太師如故詔以太祖實錄賜宗憲及平章政事完顏元宜左丞紇石烈良弼判秘書監溫王爽各一本移剌高山奴前為寧州刺史以貪污免世宗以功臣子孫宗族中無顯仕者以為祕書少監是時母喪未除有司奏其事宗憲曰高山奴傲狠貪墨不可致之左右世宗曰朕以其父祖有功耳既為人如此豈可玷職位哉追還制命因顧右丞蘇保衡參政石琚曰此朕之過舉不可不改卿等當盡心以輔朕也有司言諸路猛安謀克怙其世襲多擾民請同流官以三十月為考詔下尚書省議宗憲乃上議曰昔太祖皇帝撫定天下誓封功臣襲猛安謀克今若改為遷調非太祖約臣謂凡猛安謀克當明核善惡進賢退不肖有不職者其弟姪中更擇賢者代之上從其議進拜右丞相大定六年薨年五十九上輟朝悼惜者久之命百官致奠賻銀一千五百兩重綵五十端絹五百匹習不失本作辭不失後定為習不失昭祖之孫烏骨出之次子也初昭祖久無繼嗣與威順皇后徒單氏禱於巫而生景祖及烏骨出烏骨出長而酗酒屢悖其母昭祖沒徒單氏與景祖謀而殺之部人怒欲害景祖徒單氏自以為事而景祖乃得免習不失健捷能左右射世祖襲節度肅宗與拒桓散達戰於斡魯紺出水已再失利世祖至軍吏士無人色世祖使習不失先陣於脫豁改原而身出搏戰敗其步軍習不失自陣後奮擊之敗其騎軍所乘馬中九矢不能馳遂步趨而出方戰其外兄烏葛名善射居敵騎中將射習不失熟視識之呼曰此小兒是汝一人之事乎何為推鋒居前如此以弓弰擊馬首而去是役也習不失之功居多桓散達既敗習不失馬棄陣中者亦自歸世祖嘗疑术甲孛里篤或與烏春等為變遣習不失單騎往觀孛里篤與忽魯置酒樓上以飲之習不失聞其私語昵昵若將執己者一躍下樓傍出藩籬之外棄馬而歸其勇趫如此盃乃約烏春舉兵世祖至蘇素海甸與烏春遇肅宗前戰斜列習不失佐之束縕縱火煙焰蔽天大敗烏春執盃乃以歸太祖獲麻產獻馘于遼遼人賞功穆宗太祖歡都習不失皆為詳穩焉後與阿里合懣斡帶俱佐撒改攻留可城下之太祖伐遼使領兵千人夾侍左右出河店之役惟習不失之策與太祖合卒破十萬之師挫其軍鋒遂與太宗撒改等勸進收國元年七月與太宗撒改杲俱為勃極烈習不失為阿買勃極烈云天輔七年太宗與習不失居守鄆王昂違紀律失衆法當死於是遼人以燕京降宋人約歲幣三月世宗生習不失謂太宗曰兄弟骨肉以恩掩義寧屈法以全之今國家迭有大慶可減昂以無死若主上有責言以我為說太宗然之遂杖昂以聞太祖每伐遼輒命習不失與太宗居守雖無方面功而倚任與撒改比侔矣是歲七月薨會太祖班師道病太宗奉迎謁見恐太祖感動而疾轉甚不敢以薨告太祖輒問曰阿買勃極烈安在太宗紿對曰今即至矣正隆二年贈開府儀同三司追封曹國公大定三年進封金源郡王配饗太祖廟廷諡曰忠毅子鶻沙虎國初有功天會間為真定留守子撻不也宗亨本名撻不也性忠謹天眷初以宗室子充護衞擒宗磐宗雋有功加忠勇校尉遷昭信校尉尚局直長三年陞本局副使丁父憂時宗正官屬例以材選宗亨在選中遂起復為淑溫特宗室將軍改會寧府少尹歷登州刺史改獻州刺史為特滿羣牧使同知北京路轉運使改澤州定國軍節度使海陵庶人南伐以本職領武揚軍都總管過淮世宗即位以手詔賜宗亨宗亨得詔即入朝大定二年授右宣徽使未幾為北京路兵馬都統以討契丹賊右副元帥僕散忠義與窩斡遇于花道宗亨與左翼萬戶蒲察世傑等以七謀克軍與之戰失利及窩斡敗其黨括里扎八率衆南奔宗亨追及之扎八詐降宗亨信之扎八詭曰括里遁願往邀宗亨聽其去大縱軍士取賊所棄囊槖人畜多自有之括里扎八亡入于宋坐是降為寧州刺史宗賢本名賽里習不失之孫也從都統杲取中京襲遼帝于鴛鴦濼宗翰使撻懶襲耶律馬哥都統使蒲家奴及賽里等以兵助之蒲家奴使賽里斜野裴滿胡撻達魯古厮列耶律吳十等各率兵分行招諭獲遼留守迪越家人輜重幷降羣牧官木盧瓦得馬甚多使逐水草牧之賽里等趨業迭遂以偏師深入敵邀擊之撒合戰沒蒲家奴至旺國崖西賽里兵會之累官至左副點檢天眷二年方捕宗雋賽里坐會飲其家奪官爵未幾復官皇統四年授世襲謀克轉都點檢封豳國公拜平章政事進拜右丞相兼中書令進拜太保左丞相監修國史罷為左副元帥無何復為太保左丞相左副元帥如故進太師領三省事兼都元帥監修國史出為南京留守領行臺尚書省事復為左副元帥兼西京留守再為太保領三省事復為左丞相兼都元帥賽里自護衞未十年位兼將相常感激思自効以報朝廷雖於悼后為母黨后專政大臣或因之以取進用賽里未嘗附之皇太子濟安薨魏王道濟死熙宗未有嗣子賽里勸熙宗選後宮以廣繼嗣不少顧忌於后后以此怨之與海陵同在相位未嘗少肯假借海陵雖專而心憚賽里外以屬尊加禮敬而內常忌之海陵知悼后怨賽里因與后共力排出之賽里亦不以是少變胙王常勝死熙宗納其妻宮中頃之殺悼后及妃數人將以常勝妻為后未果也及海陵弒熙宗詭以熙宗將議立后召諸王大臣賽里聞召以為信然將入宮謂人曰上必欲立常勝妻為后我當力爭之及被執猶以為熙宗將立常勝妻而先殺之也曰誰能為我言者我死固不足惜獨念主上左右無助耳遂遇害石土門漢字一作神徒門耶懶路完顏部人世為其部長父直离海始祖弟保活里四世孫雖同宗屬不相通問久矣景祖時直离海使部人邈孫來請復通宗系景祖留邈孫歲餘厚其餼釰飲食善遇之及還以幣帛數篚為贈結其厚意久之耶懶歲饑景祖與之馬牛為助糴費使世祖往致之會世祖有疾石土門日夕不離左右世祖疾愈辭歸與握手為別約它日無相忘石土門體貌魁偉勇敢善戰質直孝友強記辯捷臨事果斷世祖襲位交好益深鄰部不悅遂合兵攻之石土門使弟阿斯懣率二百人南下拒敵敵兵千人已出其東據高阜石土門將五千人迎擊之敵將斡里本者勇士也出挑戰石土門射中其馬斡里本反射射中石土門腹石土門拔箭戰愈力阿斯懣與勇士七人步戰殺斡里本諸部兵遂敗石土門因招諭諸部使附於世祖世祖嘉之後伐烏春窩謀罕及鈍恩狄庫德等皆以所部從戰有功弟阿斯懣尋卒及終喪大會其族太祖率官屬往焉就以伐遼之議訪之方會祭有飛烏自東而西太祖射之矢貫左翼而墜石土門持至上前稱慶曰烏鳶人所甚惡今射獲之此吉兆也即以金版獻之後以本部兵從擊高麗及伐遼功尤多王師攻下西京賜以金牌其子蟬蠢從行上語之曰吾妃之妹白散者在遼俟其獲當以為汝婦竟如其言上之西征諸將皆從石土門乃率善射者三百人來衞京師時太宗居守喜其至親出迎勞繼聞黃龍府叛與睿宗討平之睿宗賜以奴婢五百人師還賞賚良渥至是卒年六十一正隆二年封金源郡王子習失思敬完顏忠本名迪古乃字阿思魁石土門之弟太祖器重之將舉兵伐遼而未決也欲與迪古乃計事於是宗翰宗幹完顏希尹皆從居數日少間太祖與迪古乃馮肩而語曰我此來豈徒然也有謀於汝汝為我決之遼名為大國其實空虛主驕而士怯戰陣無勇可取也吾欲舉兵杖義而西君以為如何迪古乃曰以主公英武士衆樂為用遼帝荒于畋獵政令無常易與也太祖然之明年太祖伐遼使婆盧火來徵兵迪古乃以兵會師收國元年十二月上禦遼主兵次爻剌迪古乃與銀术哥守達魯古路二年與斡魯蒲察會斡魯古討高永昌破其兵東京降遂與斡魯古等禦耶律捏里敗之于蒺藜山拔顯州乾惠等州降天輔二年與婁室俱入見上曰遼主近在中京而敢輒來各杖之三十太祖駐軍草濼迪古乃取奉聖州破其兵五千于鷄鳴山奉聖州降太祖入燕京迪古乃出德勝口以代石土門為耶懶路都勃菫天會二年以耶懶地薄斥鹵遷其部於蘇濱水仍以术實勒之田益之熙宗即位加太子太師十四年加保大軍節度使同中書門下平章事薨天德二年迪古乃配饗太祖廟廷大定二年追封金源郡王習室康宗時高麗築九城于曷懶甸習室從斡賽軍太祖攻寧江州習室推鋒力戰授猛安後從斜也克中京襲遼主于鴛鴦濼略定山敗夏將李良輔兵與婁室俱獲遼帝于余睹谷宗翰伐宋與銀术可圍守太原明年攻襄垣下潞城降西京至汴元帥府以懷孟北阻太行南瀕河控制險要使習室統十二猛安軍鎮撫之於是殄平寇盜招集流亡四境以安天會五年薨熙宗時贈特進大定間諡威敏世宗思太祖太宗創業艱難求當時羣臣勳業最著者圖像于衍慶宮遼王斜也金源郡王撒改遼王宗幹秦王宗翰宋王宗望梁王宗弼金源郡王習不失金源郡王斡魯金源郡王希尹金源郡王婁室楚王宗雄魯王闍母金源郡王銀术可隋國公阿离合懣金源郡王完顏忠豫國公蒲家奴金源郡王撒离喝兗國公劉彥宗特進斡魯古齊國公韓企先幷習室凡二十一人初海陵罷諸路萬戶置蘇濱路節度使世宗時近臣奏請改蘇濱為耶懶節度使不忘舊功上曰蘇濱耶懶二水相距千里節度使治蘇濱不必改石土門親管猛安子孫襲封者可改為耶懶猛安以示不忘其初思敬本名撒改押懶河人金源郡王神土懣之子習失弟也初名思恭避顯宗諱改焉體貌雄偉美鬚髯純直有材幹年十一從其父謁見太祖太祖在納鄰淀方獵因詔從獵射黃羊獲之太祖賜以從馬宗翰自太原伐宋從其兄習室攻太原宗翰取河南思敬從完顏活女涉渡河下洛陽圍汴皆有功師還隸遼王宗幹麾下太宗幸東京溫湯思敬權護衞押衞卒百人從行領謀克從征术虎麟有功遂充護衞天眷二年以捕宗磐宗雋功遷顯武將軍熙宗捕魚混同江網索絕曹國王宗敏乘醉鞭馬入江手引繫網大繩沉於水中熙宗呼左右救之倉卒莫有應者思敬躍入水引宗敏出熙宗稱嘆賞賚甚厚擢右衞將軍襲押懶路萬戶授世襲謀克七年召見賜以襲衣馬錢萬貫及歸復遣使賜弓劍是年入為工部尚書改殿前都點檢無何為吏部尚書天德初為報諭宋國使宋人以舊例請觀錢塘江潮思敬不觀曰我國東有巨海而江水有大於錢塘者竟不往使還拜尚書右丞罷為真定尹用廉封河內郡王徙封鉅鹿丁母憂起復本官改益都尹正隆二年例奪王爵改慶陽尹大定二年授西南路招討使封濟國公兼天德軍節度使俄為北路都統佩金牌及銀牌二西北路招討使唐括孛古底副之將本路兵二千會孛古底視地形衝要或于狗濼屯駐伺契丹賊出沒之地置守禦遠斥候賊至則戰不以晝夜為限詔孛古底曰爾兵少思敬未至不得先戰僕散忠義敗窩斡於陷泉詔思敬選新馬三千備追襲窩斡入于奚中思敬為元帥右都監以舊領軍入奚地張哥宅會大軍討之敗偽節度特末也獲二百餘人賊降將稍合住與其黨神獨斡執窩斡幷其母徐輦妻子弟姪家屬及金銀牌印詣思敬降思敬獻俘于京師賜金百兩銀千兩重綵四十端玉帶馬名鷹拜右副元帥經略南邊駐山東罷為北京留守復拜右副元帥仍經略山東初猛安謀克屯田山東各隨所受地土散處州縣世宗不欲猛安謀克與民戶雜處欲使相聚居之遣戶部郎中完顏讓往元帥府議之思敬與山東路總管徒單克寧議曰大軍方進伐宋宜以家屬權寓州縣量留軍衆以為備禦俟邊事寧息猛安謀克各使聚居則軍民俱便還奏上從之其後遂以猛安謀克自為保聚其田土與民田犬牙相入者互易之三年四月召還京師以為北京留守賜金鞍勒馬七年召為平章政事先是省併猛安謀克及海陵時無功授猛克者皆罷之失職者甚衆思敬請量才用之上從其請思敬前為真定尹其子取部民女為妾至是其兄乞離異其妾畏思敬在相位不敢去詔還其家九年拜樞密使上疏論五事其一女直人可依漢人以文理選試其二契丹人可分隸女直猛安其三鹽濼官可罷去其四與猛安同勾當副千戶官亦可罷其五親王府官屬以文資官擬注教以女直語言文字上皆從之其後女直人試進士夾谷衡尼厖古鑑徒單鎰完顏匡輩皆由此致宰相實思敬啟之也久之上謂思敬曰朕欲修熙宗實錄卿嘗為侍從必能記其事跡對曰熙宗時內外皆得人風雨時年穀豐盜賊息百姓安此其大概也何必餘事上大悅世宗喜立事故其微諫如此大定十三年薨上輟朝親臨喪哭之慟曰舊臣也賻贈加厚葬禮悉從官給孫吾侃术特大定二十四年除明威將軍授速濱路寶鄰山猛安贊曰劾者讓國世祖以開帝業撒改治國家定社稷尊立太祖深謀遠略為一代宗臣賢矣哉習不失蓋前人之愆著勳五世易曰有子考無咎其此之謂乎始祖與季弟異部而處子孫俱為強宗而取遼之策卒定于迪古乃豈天道陰有以相之邪
