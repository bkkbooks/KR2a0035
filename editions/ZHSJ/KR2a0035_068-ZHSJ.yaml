body:
  text: 金史卷六十八列傳第六歡都子謀演冶訶子阿魯補骨訛古乃蒲查歡都完顏部人祖石魯與昭祖同時同部同名交相得誓曰生則同川居死則同谷葬土人呼昭祖為勇石魯呼石魯為賢石魯初烏薩扎部有美女名罷敵悔青嶺東混同江蜀束水人掠而去生二女長曰達回幼曰滓賽昭祖與石魯謀取之遂偕至嶺右炷火於箭端而射蜀束水人怪之皆走險阻久之無所復見却還所居昭祖及石魯以衆至攻取其貲產虜二女子以歸昭祖納其一賢石魯納其一皆以為妾是時諸部不肯用條教昭祖耀武于青嶺白山入于蘇濱耶懶之地賢石魯佐之也其後別去至景祖時石魯之子劾孫舉部來歸居於安出虎水源胡凱山南胡凱山者所謂和陵之地是也歡都劾孫子世祖初襲節度使而跋黑以屬尊蓄異謀不可制諸部不肯受約束相繼為變歡都入與謀議出臨戰陣未嘗去左右斡勒部人盃乃自景祖時與其兄弟俱居安出虎水之北及烏春作難盃乃將與烏春合間誘斡魯紺出水居人與之相結欲先除去歡都會其家被火陰約隸人不歌束詭稱放火乃歡都胡土二人使注都來謂世祖曰不歌束來告曰前日之火歡都等縱之若不棄舊好其執縱火之人以來世祖疑之石盧斡勒勃菫曰盃乃兄弟也豈以一二人之故而與兄弟構怨乎彼自取之又將尤誰不如與之便歡都被甲執戟而起曰彼為亂之人也若取太師兄弟則亦與之乎今取我輩我輩決不可往若必用戰當盡力致死穆宗曰壯哉歡都以我所見正如此爾贈歡都以馬曰戰則乘此衆皆稱善世祖乃往見盃乃隔鼈剌水而與之言曰不歌束既告縱火由歡都等謹當如約當先遣不歌束來不歌束至世祖於馬前殺之使盃乃見之既而聞之放火者盃乃家人阿出胡山也盃乃欲開此釁故以誣歡都云臘醅麻產與世祖遇于野鵲水日已曛惟從五六十騎歡都入敵陣鏖擊之左右出入者數四世祖中創乃止烏春窩謀罕據活剌渾水世祖既許之降遂還軍於是騷臘勃菫富者撻懶勝負不助軍而騷臘撻懶先曾與臘醅麻產合世祖欲因軍還而遂滅之馳馬前進撻懶者貞惠皇后之弟也歡都下馬執轡而諫曰獨不念愛弟蒲陽溫與弟婦乎世祖感其言遂止蒲陽溫者漢語云幼弟也世祖母弟中穆宗最少故云然穆宗德歡都言後以撻懶女曷羅哂妻其子谷神太祖追麻產歡都射中其首遂獲之遼人命穆宗太祖辭不失歡都俱為詳穩斡善斡脫以姑里甸兵來歸使斜鉢勃菫撫定之蒲察部故石拔石等誘其衆入城陷三百餘人歡都為都統往治斜鉢失軍之狀盡解斜鉢所將軍大破烏春窩謀罕於斜堆擒故石拔石初耶悔水納喝部撒八之弟曰阿注阿與人爭部族官不得直來歸穆宗阿注阿之甥曰三濱曰撒達辭不失破烏春窩謀罕城獲三濱撒達幷獲其母以為次室撫其二子撒達告阿注阿必為變不信而殺之撒達臨刑歎曰後必知之至是阿注阿果為變因穆宗晨出獵糾率七八人操兵入宅奪據寢門劫貞惠皇后及家人等歡都入見阿注阿曰汝輩所謀之事奈何閨門眷屬豈足劫質徒使之驚恐耳汝固識我盍以我為質也再三言之阿注阿從之貞惠皇后乃得解而質歡都而撒改辭不失使人告急于獵所穆宗亦心動罷獵中途逢告者日午至阿注阿謂穆宗曰可使係案女直知名官僚相結送我兄弟親屬由咸州路入遼國庫金馬與我勿惜歡都亦當送我至遼境然後還而要穆宗盟穆宗皆從之遂執歡都及阿魯太彎阿魯不太彎等七人以衣裾相結與阿注阿俱行至遼境乃釋歡都歡都至濟州實黃龍府使人馳驛要遮阿注阿黨屬惟縱其親人使去遂殺三濱幷其母具報於遼乞還阿注阿遼人流之曷董城其後阿注阿懷思鄉土亡歸附于係案女直因亂其官僚之室捕之不伏乃見殺穆宗襲位之初諸父之子習烈斜鉢及諸兄有異言曰君相之位皆渠輩為之奈何歡都曰汝輩若紛爭則吾必不默默但已衆聞之遂帖然自是不復有異言者歡都事四君出入四十年征伐之際遇敵則先戰廣廷大議多用其謀世祖嘗曰吾有歡都則何事不成肅宗時委任冠於近僚穆宗嗣位凡圖遼事皆專委之康宗以為父叔舊人尤加敬禮多所補益康宗十一年癸巳二月得疾避疾於米里每水薨年六十三喪歸康宗親迓於路送至其家親視葬事天會十五年追贈儀同三司代國公明昌五年贈開府儀同三司諡曰忠敏子谷神謀演谷神別有傳謀演當阿注阿之難從歡都代為質後與宗峻俱侍太祖宗峻坐謀演上上怒命坐其下孛菫老孛論拔合汝轄拔速三人爭千戶上曰汝輩能如歡都父子有勞於國者乎乃命謀演為千戶三人者皆隸焉其眷顧如此天輔五年十二月卒天會十五年贈太子少傳冶訶系出景祖居神隱水完顏部為其部勃菫與同部人把里勃菫斡泯水蒲察部胡都化勃菫厮都勃菫泰神忒保水完顏部安團勃菫統門水溫迪痕部活里蓋勃菫俱來歸金之為國自此益大肅宗拒桓已再失利世祖命歡都冶訶以本部謀克之兵助之冶訶與歡都常在世祖左右居則與謀議出則涖行陣未嘗不在其間天會十五年贈銀青光祿大夫明昌五年贈特進諡忠濟與代國公歡都特進劾者開府儀同三司盆納儀同三司拔達俱配享世祖廟廷冶訶子阿魯補骨訛古乃散荅散荅子蒲查阿魯補冶訶之子為人魁偉多智略勇於戰未冠從軍下咸州東京遼人來取海州從勃菫麻吉往援道遇重敵力戰斬首千級從斡魯古攻豪懿州以十餘騎破敵七百進襲遼主阿魯補徇北地招降營帳二十四民戶數千時已下西京闍母攻應州未下退營於州北十餘里夜遣阿魯補率兵四百伺敵城中果出兵三千來襲阿魯補道與之遇斬首百餘獲馬六十後遼兵三萬出馬邑之境以千兵擊之斬其將於陣天會初宋王宗望討張覺於平州聞應州有兵萬餘來援遣阿魯補與阿里帶迎擊之斬馘數千而還復從其兄虞劃率兵三千攻乾州虞劃道病卒代領其衆至乾州降其軍及營帳三十獲印四十與僕虺攻下義州宗望伐宋與郭藥師戰于白河宗望命阿魯補以二謀克先登奮戰賞賚特異至汴破淮南援兵斬其二將大軍退次孟陽姚平仲夜以重兵來襲阿魯補適當其中力戰敗之既還聞大名開德合兵十餘萬來爭河至河上知去敵尚遠乃以輕兵夜發詰旦至衞縣遇敵斬首數千級餘皆潰去師次邢州滹沱橋已焚阿魯補先以偏師營於水上比軍至而橋成宗望嘉其功出真定庫物賞之為長勝軍千戶及再伐宋從宗望破敵於井陘遂下欒城師自大名濟河阿魯補屯於洺州之境時康王留相州大名府以兵來攻我營阿魯補乘夜以騎二百潛出其後反擊敗之居數日敵復來蘇統制以兵二萬先至阿魯補乘其未集以三百騎出戰大敗其衆生擒蘇統制殺之大軍既克汴京攻洺州敗大名救兵遂下洺州從撻懶攻恩州還洺人復叛阿魯補先至城下城中出兵來戰敗之執其守佐遂與蒲魯懽取信德軍梁王宗弼取開德阿魯補以步兵五千赴之大名境內多盜命阿魯補留屯其地賊犯莘縣聞阿魯補至即潰去追襲一晝夜至館陶及之皆俘以歸從宗弼襲康王既渡淮阿魯補以兵四千留和州總督江淮間戍將以討未附郡縣遂攻下太平州隳其城廬州叛以偏師討之敗其騎六千擒三校明日復破敵二萬於慎縣斬首五百張永合步騎數萬來戰阿魯補兵止二千敵圍之阿魯補潰圍力戰竟敗之追殺四十里獲馬三百而還再攻廬州與迪古不敗敵萬衆於拓臯至廬州騎兵五百出戰敗之斬其二校師遇宗弼趨陝西道聞大名復叛遣阿魯補經略之獨與譯者至城下招之大名果降翌日下令民間兵器悉上送官於是吏民按堵如故為大名開德路都統齊國建阿魯補屯兵於汴城外天會十五年詔廢齊國已執劉麟阿魯補先入汴京備變明年除歸德尹割河南地與宋入為燕京內省使宗弼復河南阿魯補先濟河撫定諸郡再為歸德尹河南路都統宋兵來取河南地宗弼召阿魯補與許州韓常潁州大陳州赤盞暉皆會於汴阿魯補以敵在近獨不赴而宋將岳飛劉光世等果乘間襲取許潁陳三州旁郡皆響應其兵犯歸德者阿魯補連擊敗之復取亳宿等州河南平阿魯補功最皇統五年為行臺參知政事授世襲猛安兼合扎謀克改元帥右監軍婆速路統軍歸德軍節度使累階儀同三司其在汴時嘗取官舍材木構私第於恩州至是事覺法當議勳議親海陵嘗在軍中惡阿魯補詔曰若論勳勞更有過於此者況官至一品足以酬之國家立法貴賤一也豈以親貴而有異也遂論死年五十五阿魯補以將家子從征伐屢立功歷官有惠愛得民心及死人皆惜之大定三年贈儀同三司詔以其子為右衞將軍襲猛安及親管謀克賜銀五百兩重綵二十端絹三百匹骨冶訶子善騎射有材幹從討桓散達烏春窩謀罕留可之叛皆有功從太祖伐遼骨從軍戰寧江州出河店破遼主親軍皆以力戰受賞襲其父謀克領秦王宗翰千戶攻下中西兩京宗翰伐宋圍太原未下宗翰還西京骨以右翼軍佐銀术可守太原是時汾州團柏榆次嵐憲潞皆有兵來援骨凡四戰皆破之大軍圍汴骨引萬戶軍屢敗其援兵憲潞等州復叛骨引兵復取之幷收撫保德火山而還後領軍鎮夏邊在職十二年天會八年授世襲猛安天眷初為天德軍節度使致仕累遷開府儀同三司卒年八十五子喜哥襲猛安加宣武將軍訛古乃冶訶子姿質魁偉年十四隸秦王宗翰軍中常領兵行前為偵候及大軍襲遼主訛古乃以甲騎六十追遼招討徒山獲之又以七騎追獲遼公主牙不里以獻有軍來為遼援方臨陣中有躍馬而出者軍帥謂之曰爾能為我取此乎訛古乃曰諾果生擒而還問其名曰同瓜蓋北部中之勇者也訛古乃善馳驛日能千里及伐宋屢遣將命以行天會八年從秦王在燕聞余睹反於西北秦王令訛古乃馳驛以往訛古乃黎明走天德及至日未曛也皇統元年以功授寧遠大將軍迭剌唐古部節度使五年授千戶六年遷西北路招討使九年再遷天德尹西南路招討使天德二年召見四年遷臨洮尹加金紫光祿大夫卒官年五十三蒲查自上京梅堅河徙屯天德初為元帥府扎也使於四方稱職按事能得其實領猛安皇統間除同知開遠軍節度使斥候嚴整邊境無事正隆初為中都路兵馬判官是時京畿多盜蒲查捕得大盜四十餘人百姓稍安改安化軍節度副使大定二年領行軍萬戶充邳州刺史知軍事領本州萬戶管所屯九猛安軍昌武軍節度使山東副都統撒改南征元帥府以蒲查行副統事入為太子少詹事再遷開遠軍節度使襲伯父骨猛安歷婆速路兵馬都總管西北路招討使卒蒲查性廉潔忠直臨事能斷凡被任使無不稱云贊曰賢石魯與昭祖為友歡都事景祖世祖為之臣蓋金自景祖始大諸部君臣之分始定故傳異姓之臣以歡都為首冶訶雖宗室與歡都同功故列焉
