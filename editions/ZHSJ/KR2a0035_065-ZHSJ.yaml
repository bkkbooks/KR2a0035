body:
  text: 金史卷六十五列傳第三始祖以下諸子斡魯輩魯謝庫德孫拔達謝夷保子盆納謝里忽烏古出跋黑崇成本名僕灰劾孫子蒲家奴麻頗子謾都本謾都訶斡帶斡賽子宗永斡者孫璋昂本名吾都補子鄭家始祖明懿皇后生德帝烏魯季曰斡魯女曰注思版皆福壽之語也以六十後生子異之故皆以嘉名名之焉德帝思皇后生安帝季曰輩魯輩魯與獻祖俱徙海姑水置屋宇焉輩魯之孫胡率胡率之子劾者與景祖長子韓國公劾者同名韓國公前死所謂肅宗納劾者之妻加古氏者是也穆宗四年伐阿疎阿疎走遼遼使使來止伐阿疎軍穆宗陽受遼帝約束先歸國留劾者守阿疎城凡三年卒攻破之天會十五年贈特進安帝節皇后生獻祖次曰信德次曰謝庫德次曰謝夷保次曰謝里忽謝庫德之孫拔達謝夷保之子盆納皆佐世祖有功盆納勇毅善射當時有與同名者嘗有貳志目之曰惡盆納天會十五年拔達贈儀同三司盆納贈開府儀同三司在世祖時歡都冶訶及劾者拔達盆納五人者不離左右親若手足元勳之最著者也明昌五年皆配饗世祖廟廷准德束里保者皆加古部人申乃因醜阿皆滿部人富者粘沒罕完顏部人阿庫德白達皆雅達瀾水完顏部勃菫此七人者當攜離之際能一心竭力輔戴者也達紀胡蘇皆术甲部勃菫勝昆主保皆术虎部人阿庫德溫迪痕部人此五人者又其次者也世祖初年跋黑為變烏春盛強使人召阿庫德白達阿庫德曰吾不知其他死生與太師共之太師謂世祖也白達大喜曰我心正如此耳烏春兵來堅壁自守勿與戰可也達紀胡蘇居琵里郭水烏春兵出其間不為變終拒而不從勝昆居胡不干村其兄滓不乃勃菫烏春止其家而以兵圍勝昆烏春解去世祖殺滓不乃勝昆請無孥戮世祖從之世祖破桓散達主保死焉天會十五年准德申乃因阿庫德白達皆贈金紫光祿大夫束里保醜阿富者粘沒罕達紀胡蘇勝昆主保溫迪痕阿庫德皆贈銀青光祿大夫皆天會十五年追贈又有胡論加古部勝昆勃菫蟬春水烏延部富者郭畏烏春強請世祖兵出其間以為重也世祖使斜列躍盤將別軍過之郭教斜列取先在烏春軍中二十二人烏春覺之殺二人得二十人郭又以土人益斜列軍穆宗他日嘉此功不能忘以斜列之女守寧妻郭子胡里罕焉婆多吐水裴滿部斡不勃菫附於世祖桓焚之斡不卒世祖厚撫其家因併錄之以見立國之艱難云謝里忽者昭祖將定法制諸父國人不悅已執昭祖將殺之謝里忽亟往彎弓注矢射於衆中衆乃散去昭祖得免國俗有被殺者必使巫覡以詛祝殺之者廼繫刃于杖端與衆至其家歌而詛之曰取爾一角指天一角指地之牛無名之馬向之則華面背之則白尾橫視之則有左右翼者其聲哀切悽婉若蒿里之音既而以刃畫地劫取畜產財物而還其家一經詛祝家道輒敗及來流水烏薩扎部殺完顏部人昭祖往烏薩扎部以國俗治之大有所獲頒之於諸父昆弟而不及謝里忽謝里忽曰前日免汝於死者吾之力往治烏薩扎部者吾之謀也分不及我何邪昭祖於是早起自齎間金列鞢往餽之時謝里忽猶未起擁寢衣而問曰爾為誰昭祖曰石魯先擇此寶而後頒及他人敢私布之謝里忽既揚言初不自安至是乃大喜列鞢者腰佩也獻祖恭靖皇后生昭祖次曰朴都次曰阿保寒次曰敵酷次曰敵古廼次曰撒里輦次曰撒葛周昭祖威順皇后生景祖次曰烏古出次室達胡末烏薩扎部人生跋黑僕里黑斡里安次室高麗人生胡失答烏古出初昭祖久無子有巫者能道神語甚驗乃往禱焉巫良久曰男子之魂至矣此子厚有福德子孫昌盛可拜而受之若生則名之曰烏古廼是為景祖又良久曰女子之魂至矣可名曰五餢忍又良久曰女子之兆復見可名曰斡都拔又久之復曰男子之兆復見然性不馴良長則殘忍無親親之恩必行非義不可受也昭祖方念後嗣未立乃曰雖不良亦願受之巫者曰當名之曰烏古出既而生二男二女其次第先後皆如巫者之言遂以巫所命名名之景祖初立烏古出酗酒屢悖威順皇后后曰巫言驗矣悖亂之人終不可留遂與景祖謀而殺之部人怒曰此子性如此在國俗當主父母之業奈何殺之欲殺景祖后乃匿景祖出謂衆曰為子而悖其母率是而行將焉用之吾割愛而殺之烏古廼不知也汝輩寧殺我乎衆乃罷去烏古出之子習不失自有傳跋黑及同母弟二人自幼時每爭攘飲食昭祖見而惡之曰吾娶此妾而生子如此後必為子孫之患世祖初立跋黑果有異志誘桓散達烏春窩謀罕離間部屬使貳於世祖世祖患之乃加意事之使為勃菫而不令典兵跋黑既陰與桓烏春謀計國人皆知之而童謠有欲生則附於跋黑欲死則附於劾里鉢頗剌淑之語世祖亦以策探得兄弟部人向背烏春桓相次以兵來攻世祖外禦強兵而內畏跋黑之變將行聞跋黑食於其愛妾之父家肉張咽而死且喜且悲乃迎尸而哭之崇成本名僕灰泰州司屬司人昭祖玄孫也大定十八年收充奉職改東宮入殿小底轉護衞二十五年章宗為原王充本府祗候郎君明年上為皇太孫復為護衞上即位授河間府判官以憂去職起復為宿直將軍累遷武衞軍都指揮使泰和三年卒賻贈有加崇成謹飭有守宿衞二十餘年未嘗有過故久侍密近云景祖昭肅皇后生韓國公劾者次世祖次沂國公劾孫次肅宗次穆宗次室注思灰契丹人生代國公劾真保次室溫迪痕氏名敵本生虞國公麻頗隋國公阿离合懣鄭國公謾都訶劾者阿离合懣別有傳劾孫天會十四年大封宗室劾孫追封王爵正隆例降封鄭國公子蒲家奴又名昱嘗從太祖伐留可塢塔太祖使蒲家奴招詐都詐都即降康宗八年係遼籍女直紇石烈部阿里保太彎阻兵招納亡命邊民多亡歸之蒲家奴以偏師夜行晝止抵石勒水襲擊之盡俘其孥而還邊氓自此無復亡者後與宗雄視泰州地土太祖因徙萬家屯田于其地天輔五年蒲家奴為勃極烈遂為都統使襲遼帝而以雨潦不果行既而忽魯勃極烈杲都統內外諸軍以取中京蒲家奴等皆為之副遼帝西走都統杲使蒲家奴以兵一千助撻懶擊遼都統馬哥與撻懶不相及蒲家奴與賽里斜野降其西北居延之衆而降民稍復逃散毗室部亦叛遂率兵襲之至鐵呂川遇敵八千遂力戰兵敗察剌以兵來會追及敵兵于黃水獲畜產甚衆是役也奧燉按打海被十一創竟敗敵兵而還軍于旺國崖西賽里亦以兵會太祖自草濼追遼帝蒲家奴宗望為前鋒戒之曰彼若深溝高壘未可與戰即偵伺巡邏勿令循去以俟大軍若其無備便可擊也上次胡离畛川吳十馬和尚至小魚濼夜潛入遼主營執新羅奴以還遂知遼帝所在蒲家奴等晝夜兼行追及于石輦鐸我兵四千至者才千人遼兵圍之余睹指遼帝麾蓋騎兵馳之遼帝遁去兵遂潰所殺甚衆宗翰為西北西南兩路都統蒲家奴斡魯為之副烏虎部叛蒲家奴討平之天會間為司空封王天眷二年宗磐等誅辭及蒲家奴詔奪司空是年薨天德初配享太祖廟廷正隆二年例封豫國公麻頗天會十五年封王正隆例封虞國公長子謾都本孝友恭謹多謀而善戰年十五隸軍中從攻窩盧歡及係遼女直胡失荅等為變謾都本自為質遂從胡失荅歸中途以計殺守者而還攻寧江州取黃龍府破高永昌取春泰州皆有功多受賞賚遂為謀克討嶺東未服州郡過土河東山敗賊三千人奚契丹寇土河西與猛安蒙葛麻吉擊之謾都本對敵之中推鋒力戰破其衆九萬人奚衆萬餘保阿隣甸復擊敗之降其旁近居人復以五百騎破遼兵一千生擒其將以歸與闍母攻興中府中流矢卒年三十七天眷中贈金紫光祿大夫諡英毅謾都訶屢從征伐天會二年為阿捨勃極烈參議國政明年薨天會十五年大封宗室追封王正隆例封鄭國公明昌五年諡定濟蠻覩襲父麻頗猛安蠻覩卒子掃合襲掃合卒子撒合輦襲撒合輦卒子惟鎔襲惟鎔本名沒烈字子鑄駢脅多力喜周急人至寧初守楊文關有功兼都統護漕運貞祐二年佩金牌護親軍家屬遷汴遙授同知祁州軍州事充提控貞祐三年破紅襖賊於大沫堌惟鎔入自北門諸軍繼進生獲劉二祖功最遷泰安軍節度副使改遂王府尉都水少監東平府治中坐誤以刃傷同知府事紇石烈牙吾塔當削降殿年仍從軍自効討花帽賊于曹濟間行省蒙古綱奏其功復前職遷邳州經略使卒子從傑襲猛安累功遙授鎮南軍節度副使世祖翼簡皇后生康宗次太祖次魏王斡帶次太宗次遼王斜也次室徒單氏生衞王斡賽次魯王斡者次室僕散氏生漢王烏故乃次室术虎氏生魯王闍母次室术虎氏生沂王查剌次室烏古論氏生鄆王昂斡帶年二十餘撒改伐留可斡帶與習不失阿里合懣等俱為裨將諸將議攻取斡帶主攻城便太祖將至軍斡帶迎之謂太祖曰留可城且下勿惑他議太祖從之至軍中衆議乃決斡帶急起治攻具其夜進兵攻城遲明破之及二涅囊虎路二蠢出路寇盜斡帶盡平之康宗二年甲申蘇濱水諸部不聽命康宗使斡帶等往治其事行次活羅海川撒阿村召諸部諸部皆至惟含國部斡豁勃菫不至斡准部狄庫德勃菫職德部厮故速勃菫亦皆遁去遇塢塔於馬紀嶺塢塔遂執二人以降於是使斡帶將兵伐斡豁募軍于蘇濱水斡豁完聚固守攻而拔之進師北琴海闢登路攻拔泓忒城取畔者以歸太祖於母弟中最愛斡帶斡帶歸自泓忒城太祖以事如寧江州欲與斡帶偕行斡帶曰兵役久勞未及息也遂不果行太祖還晝寐于來流水傍夢斡帶之場圃火禾盡焚不可撲滅覺而深念之以為憂是時斡帶已寢疾太祖至聞之過家門不下馬徑至斡帶所問疾未幾薨年三十四太祖每哭之慟謂人曰予強與之偕行未必死也斡帶剛毅果斷服用整肅臨戰決策有世祖風世祖之世軍旅之事多專任之太祖平遼歎曰恨斡帶之不及見也天會十五年追封儀同三司魏王諡曰定肅斡賽穆宗初斡准部族相鈔略遣納根涅孛菫以其兵往治納根涅擅募蘇濱水人為兵不聽輒攻略之其人來告穆宗使斡賽及冶訶往問狀納根涅雖伏而不肯償所取因遁去冶訶等皆不欲追斡賽督軍而進至把忽嶺西毛密水及之大破其衆納根涅死焉斡賽撫定蘇濱水民部執納根涅之母及其妻子而歸穆宗曰斡賽年尚幼已能集事可嘉也康宗二年甲申斡帶治蘇濱水諸部斡賽斡魯佐之定諸部而還久之高麗殺行人阿聒勝昆而築九城於曷懶甸斡賽將內外兵劾古活你茁蒲察狄古廼佐之高麗兵數萬來拒斡賽分兵為十隊更出迭入遂大破之斡賽母和你隈疾篤召還以斡魯代之未幾斡賽復至軍再破高麗軍進圍其城七月高麗請和盡歸前後亡命及所侵故地退九城之戍遂與之和皇統五年追封衞國王宗永本名挑撻斡賽子長身美髯忠確勇毅天眷初以宗室子預誅宗磐擢寧遠大將軍皇統初充牌印祗候五年出為趙州刺史秩滿再任轉興平軍節度使改大名尹貞元三年復為興平軍節度使歷昭德軍臨洮鳳翔尹大定二年入為工部尚書與蘇保衡完顏余里也遷加伐宋士官賞宗永性滯不習事凡與土賊戰者一概加之世宗久乃知之謂宰相曰若一概追還必生怨望若因循不問則爵賞濫矣其與土賊戰者有能以寡敵衆一人敵三十人以上者依已遷為定改同簽大宗正事震武軍節度使卒斡者天會十五年大封宗室追封魯王正隆例改封公子神土懣驃騎衞上將軍子璋本名胡麻愈多勇略通女直契丹漢字年十八左副元帥撒离喝引在麾下以事如京師見梁王宗弼與語宗弼悅之皇統六年父神土懣卒宗弼奏璋可襲謀克詔從之天德三年充牌印祗候以罪免奪其謀克寓居中都海陵伐宋左衞將軍蒲察沙离只同知中都留守佩金牌掌留府事世宗即位于遼陽璋勸沙离只歸世宗沙离只不從璋與守城軍官烏林荅石家奴烏林荅愿徒單三勝蒲察蒲查等以兵晨入留守府遂殺沙离只及判官漫撚撒离喝推宗強子阿瑣為留守璋行同知留守事遣石家奴佩沙离只金牌與愿蒲查中都轉運使左淵子貽慶大興少尹李天吉子磐奉表如東京賀即位世宗嘉之以愿蒲查為武義將軍充護衞貽慶賜及第授從仕郎磐充閤門祗候就以璋為同知中都事璋以殺沙离只自攝同知留守世宗因而授之心常不自安遂與兵部尚書可喜謀因世宗謁山陵作亂大定二年上謁山陵璋等九人會于可喜家說萬戶高松不從璋知事不成乃與可喜共執斡論詣有司陳上誅可喜李惟忠等以璋為彰化軍節度使宋將吳璘出散關據寶雞以西詔璋赴元帥都監徒單合喜軍前任使於是宋人據原州寧州刺史顏盞門都以兵四千攻之不克宋將姚良輔以兵十萬至原州權副統完顏習尼列以千騎援門都兵而姚良輔兵多諸將皆不敢與戰及璋至軍會平涼涇州潘原長武等戍兵合二萬人璋使押軍猛安石抹許里阿補以兵二千軍於城北習尼列以兵三千軍於城西北十里麥子原皆據高阜為陣璋以本部兵陣於城西姚良輔出自北嶺先遣萬人攻許里阿補自以軍九萬陣麥子原下捍以劍盾行馬外列騎士步卒居其中敢死士鎖足行馬間持大刀為拒分為八陣而別以騎二千襲璋軍璋方出迎戰習尼列來報曰宋之重兵皆在麥子原矣璋遣萬戶特里失烏也以押軍猛安奚慶喜照撒兵二千援許里阿補遣撒屋出崔尹以兵二千益習尼列許里阿補與宋人接戰良久敗之宋兵在麥子原者最堅習尼列與移剌補奧屯撒屋出崔尹僕根撒屈出以兵五千沿壕為伏餘兵皆捨馬步戰擊其前行騎士走之於是行馬以前衝以長槍行馬以後射以勁弓良輔兵稍挫習尼列乘勝麾兵撤其行馬破其七陣良輔復整兵出習尼列少却而璋已破城下宋兵與習尼列會使僕根以伏兵擊良輔習尼列亦整兵與戰奮擊之大破良輔軍斬首萬餘級墜壕死者不可勝數鎖足行馬者盡殪之獲甲二萬餘器仗稱是良輔亦中兩創脫去遂圍原州穴其西城城圮宋人宵遁璋等入原州宋戍軍在寶雞以西聞之皆自散關遁去京兆尹烏延蒲离黑丹州刺史赤盞胡速魯改已去德順州宋吳璘復據之都監合喜以璋權都統與習尼列將兵二萬救德順璋率騎兵前行與璘騎兵二萬戰于張義堡遂沙山下敗之追北四十餘里璘軍遇隘不得前斬首數十級璋至德順璘據城北險要為營璋亦策營與璘相望可三里許兩軍遇於城東凡五接戰璘軍敗走璋追至城下璘軍已據城北岡阜與其城上兵相應以弩夾射璋軍璋軍陽却城中出兵來追璋反斾與戰大敗之合喜遣統軍都監泥河以兵七千來會與璘軍復戰敗之璘遣兵據東山堡欲樹柵璋與習尼列泥河議曰敵若據東山堡此城亦不可拔宜急擊之於是璋先據要地習尼列以兵逼東山堡璘兵恃濠相拒短兵接璘兵退走習尼列追擊之璘城北營兵可六千人登北岡來戰璋之漢軍少却傷者二百人璘遂焚璋軍攻城具璋率移剌補猛安兵踰北岡擊走之璘軍隔小塹射璋軍移剌補少却習尼列望見北原火發乃止攻東山堡亟與將士來赴引善射者先登率劉安漢軍三百人擊敗之璘軍皆走險璘以軍三萬據險作三陣皆環以劍盾行馬璋遣萬戶石抹迭勒由別路自後擊之特里失烏也移剌補以二千人當其前以強弓射之璘兵大敗墮溝壑者甚衆璋軍度澗追之斬數千級而還璘軍雖敗猶恃其衆都監合喜使武威軍副總管夾古查剌來問策諸將皆曰吳璘恃險不善野戰我退軍平涼彼必棄險就平地然後可圖也璋曰不然彼恃其衆非特恃險也昔人有言寧棄千軍不棄寸地故退兵不如濟師我退軍平涼彼軍深入吾地固壘以拒我則如之何查剌還報合喜於是親率四萬人赴之吳璘詰旦乘陰霧晦冥分兵四道來襲戰于城東離而復合者數四漢軍千戶李展率麾下兵先登奮擊之璘軍陣動璋乘勝踵擊璘軍復敗追至北岡璘走險璋急擊之殺略殆盡璘分半軍守秦州合喜駐軍水洛城東自六盤山至石山頭分兵守之斷其餉道璘乃引歸宋經略使荊以步騎三萬自德順西去璋以兵八千習尼列以兵五千追擊之習尼列兵乃出其前還自赤觜遇其前鋒敗之于高赤崖下復與其中軍戰自日昃至暮乃罷荊臯乘夜來襲營為退軍八十里明日習尼列追之璋兵至上八節宋兵據險為陣璋捨馬步戰地險不得接相拒至曙宋兵動璋乘之追至甘谷城習尼列兵亦至宋兵宵遁璋遂班師習尼列追至伏羌城不及而還上使御史中丞達吉視諸軍功狀達吉舊與璋有隙故損其功詔璋將士賞比諸軍半之璋兼陝西路都統進官一階及元帥府上功璋居多詔達吉削官兩階杖八十解職上復賞璋及將士如諸軍以璋為西北路招討使召為元帥左都監兼安化軍節度使賜以弓矢衣帶佩刀改益都尹左都監如故宋人棄海州遁去焚官民廬舍且盡璋至海州得所棄糧三萬六千餘石安集其人復其屯戍五年宋人約和罷三路都統復置陝西路統軍司璋為統軍使上曰監軍合喜年老故授卿此職邊境無事且召卿矣以本官兼京兆尹召為御史大夫璋奏竊觀文武百官有相為朋黨者今在臺自臣外無女直人乞不限資考量材奏擬上曰朋黨為誰即糾治之朕選女直人未得其人豈以資考為限論其人材而已頃之璋奏曰太祖武元皇帝受天明命太宗皇帝奄定宋土自古帝王之興必稱受命當製大金受命之寶以明示萬世上曰卿言正合朕意乃遣使夏國市玉十八年受命寶成奏告天地宗廟社稷上御正殿十三年改大興尹為賀宋正旦使璋受命使宋既行上遣人馳諭璋曰宋人若不遵舊禮慎勿付書如不令卿等入見即持書歸若迫而取之亦勿赴宴其回書及禮物一切勿受璋至臨安宋人請以太子接書不從宋人就館迫取書璋與之且赴宴多受禮物有司以聞上怒欲置之極刑左丞相良弼奏曰璋為將大破宋軍宋人讎之久矣將因此陷之死地未可知也今若殺璋或者墮其計中耳上以為然乃杖璋百五十除名副使客省使高翊杖百沒入其所受禮物後歲餘上念璋有征伐功起為景州刺史遷武定軍節度使授山東西路蒲底山拏兀魯河謀克改臨洮尹十九年卒鄆王昂本名吾都補世祖最幼子也常從太祖征伐天輔六年昂與稍喝以兵四千監護諸部降人處之嶺東就以兵守臨潢府昂不能撫御降人苦之多叛亡者上聞之使出里底戒諭昂已過上京諸部皆叛去惟章愍宮小室韋二部達內地詔諳版勃極烈吳乞買曰比遣昂徙諸部多致怨叛稍喝駐兵不與討襲致使降人復歸遼主違命失衆當置重法若有所疑則禁錮之俟師還定議是時太宗居守辭不失副之辭不失勸太宗因國慶可薄其罰於是杖昂七十拘之泰州而殺稍喝天會六年權元帥左都監十五年為西京留守天眷三年為平章政事皇統元年封漆水郡王二年制詔昂署銜帶皇叔祖字封鄆王是歲薨子鄭家鶴壽鶴壽累官耶魯瓦羣牧使死于契丹撒八之難語在忠義傳鄭家皇統初以宗室子授定遠大將軍除磁州刺史天德間為右諫議大夫累遷會寧尹安化軍節度使改益都尹海陵伐宋為浙東道副統制與工部尚書蘇保衡以舟師自海道趨臨安至松林島阻風泊島間詰旦舟人望見敵舟請為備鄭家問去此幾何舟人曰以水路測之且三百里風迅行即至矣鄭家不曉海路舟楫不之信有頃敵果至見我軍無備即以火砲擲之鄭家顧見左右舟中皆火發度不得脫赴水死時年四十一
