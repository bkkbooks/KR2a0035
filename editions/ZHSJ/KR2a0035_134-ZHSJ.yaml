body:
  text: 金史卷一百三十四列傳第七十二外國上西夏夏國王李乾順其先曰托跋思恭唐僖宗時為夏綏銀宥節度使與李茂貞李克用等破黃巢復京師賜姓李氏唐末天下大亂藩鎮連兵惟夏州未嘗為唐患歷五代至宋傳數世至元昊始稱帝遼人以公主下嫁李氏世修朝貢不絕事具遼史天輔六年金破遼兵遼主走陰山夏將李良輔將兵三萬來救遼次天德境野谷斡魯婁室敗之于宜水追至野谷澗水暴至漂沒者不可勝計宗望至陰山以便宜與夏國議和其書曰奉詔有之夏王遼之自出不渝終始危難相救今茲已舉遼國若能如事遼之日以効職貢當聽其來毋致疑貳若遼主至彼可令執送天會二年始奉誓表以事遼之禮稱藩請受割賜之地宗翰承制割下寨以北陰山以南乙室耶刮部吐祿濼之西以賜之天會二年三月乾順遣把里公亮等來上誓表曰臣乾順言今月十五日西南西北兩路都統遣左諫議大夫王介儒等齎牒奉宣若夏國追悔前非捕送遼主立盟上表仍依遼國舊制及賜誓詔將來或有不虞交相救援者臣與遼國世通姻契名係藩臣輒為援以啟端曾犯威而結釁既速違天之咎果罹敗績之憂蒙降德音以寬前罪仍賜土地用廣藩籬載惟含垢之恩常切戴天之望自今已後凡於歲時朝賀貢進表章使人往復等事一切永依臣事遼國舊例其契丹昏主今不在臣境至如奔竄到此不復存泊即當執獻若大朝知其所在以兵追捕無敢為地及依前援助其或徵兵即當依應至如殊方異域朝覲天闕合經當國道路亦不阻節以上所數事臣誓固此誠傳嗣不變苟或有渝天地鑒察神明殛之禍及子孫不克享國所謂西北西南兩路都統者宗翰也蓋宗望以太祖命與之通書而宗翰以便宜割地議和云太宗使王阿海楊天吉往賜誓詔曰維天會二年歲次甲辰閏三月戊寅朔皇帝賜誓詔於夏國王乾順先皇帝誕膺駿命肇啟鴻圖而卿國據夏臺境連遼右以効力於昏主致結釁於王師先皇帝以謂忠於所事務施恩而釋過迨眇躬之纂紹仰遺訓以遵行卿乃深念前非樂從內附飭使軺而奉貢効臣節以稱藩載錫寵光用彰復好所有割賜地土使聘禮節相為援助等事一切恭依先朝制詔其依應徵兵所請宜允三辰在上朕豈食言苟或變渝亦如卿誓遠垂戒諭毋替厥誠於是宋人與夏人俱受山西地宋人侵取之乾順遣使表謝賜誓詔幷論宋所侵地詔曰省所上表具悉已命西南西北兩路都統府從宜定奪是時宗翰朝京師未還錄夏國奏付權都統斡魯宋人侵略新受疆土及使人王阿海爭儀物事與夏通問以便宜決之初以山西九州與宋人而天德遠在一隅緩急不可及割以與夏後破宋都獲二帝乃畫陝西分界自麟府路洛陽溝東距黃河西岸西歷暖泉堡鄜延路米脂谷至累勝寨環慶路威邊寨過九星原至委布谷口涇原路威川寨略古蕭關至北谷川秦鳳路通懷堡至古會州自此直距黃河依見今流行分熙河路盡西邊以限封域復分陝西北鄙以易天德雲內以河為界及婁室定陝西婆盧火率兵先取威戎城軍至威戎東與敵遇擊走之生致二人問之乃知為夏將李遇取威戎也乃還其人而與李遇通問李遇軍威戎西蒲察軍威戎東而使使議事于婁室婁室報曰元帥府約束若兵近夏境則與夏人相為掎角毋相侵犯李遇使人來曰夏國既以天德雲內歸大國大國許我陝西北鄙之地是以至此蒲察等遂旋軍睿宗既定陝西元帥府不欲以陝西北鄙與夏國詔曰卿等審處所宜從事天眷二年國王乾順薨子仁孝立遣使冊命加開府儀同三司上柱國皇統元年請置榷場許之初王阿海等以太宗誓詔賜夏國乾順以契丹舊儀見使者阿海不肯曰契丹與夏國甥舅也故國王坐受使者以禮進今大金與夏國君臣也見大國使者當如儀爭數日不能決於是始起立受焉厥後不遣賜生日使至是始遣使賜之初慕洧以環州降及割陝西河南與宋人洧奔夏國夏人以為山訛首領及撒离喝再定陝西洧思歸夏人知之遂族洧以表聞詔書責讓之及海陵弒熙宗遣使報諭至境上夏人問曰聖德皇帝何為見廢不肯納朝廷乃使有司以廢立之故移文報之天德二年七月夏使御史中丞雜辣公濟等來賀如舊禮正隆末伐宋宋人入秦隴夏亦乘隙攻取盪羌通峽九羊會川等城寨宋亦侵入夏境世宗即位夏人復以城寨來歸且乞兵復宋侵地詔書嘉奬仍遣吏部郎中完顏達吉體究陝西利害邊吏奏夏人已歸城寨而所侵掠人口財畜尚未還請索之大定四年二月甲申夏遣其武功大夫紐臥文忠等賀萬春節入見附狀奏告略曰衆軍破蕩之時幸而免者十無一二繼以凍餒死亡其存幾何兼夏國與宋兵交人畜之被俘僇亦多連歲勤動士卒暴露勢皆朘削又坐為宋人牽制使忠誠之節無繇自達中外咸知願止約理索聽納臣言不勝下國之幸其後屢以為請詔許之久之其臣任得敬專國政欲分割夏國因賀大定八年正旦遣奏告使殿前太尉芭里昌祖等以仁孝章乞良醫為得敬治疾詔保全郎王師道佩銀牌往焉詔師道曰如病勢不可療則勿治如可治期一月歸得敬疾有瘳遣謝恩使任得聰來得敬亦附表進禮物上曰得敬自有定分附表禮物皆不可受並却之初仁孝嗣位其臣屢作亂任得敬抗禦有功遂相夏國二十餘年陰蓄異志欲圖夏國誣殺宗親大臣其勢漸逼仁孝不能制大定十年乃分西南路及靈州囉龐嶺地與得敬自為國且上表為得敬求封世宗以問宰相尚書令李石等曰事繫彼國我何預焉不如因而許之上曰有國之主豈肯無故分國與人此必權臣逼奪非夏王本意況夏國稱藩歲久一旦迫於賊臣朕為四海主寧容此邪若彼不能自正則當以兵誅之不可許也乃却其貢物賜仁孝詔曰自我國家戡定中原懷柔西土始則畫疆於乃父繼而錫命於爾躬恩厚一方年垂三紀藩臣之禮既務踐修先業所傳亦當固守今茲請命事頗靡常未知措意之由來續當遣使以詢爾所有貢物已令發回得敬密通宋人求助宋以蠟丸書答得敬夏人得之得敬始因求醫附表進禮物欲以嘗試世宗既不可行而求封又不可得仁孝乃謀誅之八月晦仁孝誅得敬及其黨與上表謝幷以所執宋人及蠟丸書來上其謝表曰得敬初受分土之後曾遣使赴大朝代求封建蒙詔書不為俞納此朝廷憐愛之恩夏國不勝感戴夏國妄煩朝廷冒求賊臣封建深虧禮節今既賊臣誅訖大朝不用遣使詢問得敬所分之地與大朝熙秦路接境恐自分地以來別有生事已根勘禁約乞朝廷亦行禁約十二年上謂宰臣曰夏國以珠玉易我絲帛是以無用易我有用也乃減罷保安蘭州榷場仁孝深念世宗恩厚十七年獻本國所造百頭帳上曰夏國貢獻自有方物可却之仁孝再以表上曰所進帳本非珍異使人亦已到邊若不蒙包納則下國深誠無所展效四方鄰國以為夏國不預大朝眷愛之數將何所安乃許與正旦使同來先是尚書奏夏國與陝西邊民私相越境盜竊財畜姦人託名榷場貿易得以往來恐為邊患使人入境與富商相易亦可禁止於是復罷綏德榷場止存東勝環州而已仁孝表請復置蘭州保安綏德榷場如舊幷乞使人入界相易用物詔曰保安蘭州地無絲枲惟綏德建關市以通貨財使副往來聽留都亭貿易章宗即位詔曰夏使舘內貿易且已明昌二年復舊頃之夏人肆牧於鎮戎之境邏卒逐之夏人執邏卒而去邊將阿魯帶率兵詰之夏廂官吳明契信陵都卜祥徐餘立等伏兵三千於澗中阿魯帶口中流矢而死取其弓甲而去詔索殺阿魯帶者夏人處以徒刑詔索之不已夏人乃殺明契等明昌四年仁孝薨子純佑嗣立承安二年復置蘭州保安榷場承安五年純佑母病風求醫詔太醫判官時德元及王利貞往仍賜御藥八月再賜醫藥泰和六年三月仁孝弟仁友子安全廢純佑自立再閱月死于廢所七月使純佑母羅氏為表言純佑不能嗣守與大臣定議立安全為王遣使奏告夏使私問館伴官奏告事詔許否館伴官曰此不當問也夏使曰明日當問諸客省若又不答則升殿奏請上聞之使客省諭以許所祈之意乃賜羅氏詔詢其意夏人復以羅氏表來乃封安全為夏國王大安三年安全薨族子遵頊立遵頊先以狀元及第充大都督府主立在安全薨前一月衞紹王無實錄不知其故然是時金兵敗績于會河堡夏人乘其兵敗侵略邊境而通使如故崇慶元年三月攻葭州至寧元年六月攻保安州貞祐元年十一月攻會州都統徒單醜兒擊走之十二月陷涇州二年八月歸國人喬成齎夏國書大概言金邊吏侵略乞禁戢詔移文答之宰臣言既非公牒今將責問彼必飾詞徒為虛文無益于事乃止未幾夏人攻慶原延安積石州乃詔有司移文責問十一月蘭州譯人程陳僧結夏人以州叛邊將敗其兵三千三年正月夏兵攻武延川宣宗曰此不足慮恐由他道入也既而聞邊吏侵夏境夏人乃攻環州詔治邊吏罪夏兵攻積石州都統姜伯通敗之夏兵入安鄉關都統曹記僧萬戶忽三十却之二月攻環州刺史烏古論延壽敗之于境上三月詔議伐夏陝西宣撫司奏往者夏人侵我環慶河蘭積石以兵應之悉皆遁去遽還巢穴蓋為我備也今蘭州潰兵猶未集軍實多不完沿邊地寒春草始生未可芻牧兩界無煙火者三百餘里不宜輕舉從之四月詔河州提控曹記僧通遠軍節度使完顏狗兒討程陳僧夏人援之九月遂破西關堡夏人復攻第五將城萬戶楊再興擊走之詔陝西宣撫司及沿邊諸將降空名宣勅臨陣立功五品以下並聽遷授十月攻保安及延安都統完顏國家奴破之既而深入臨洮總管陀滿胡土門不能禦陝西宣撫副使完顏胡失來救臨洮大敗于渭源堡城破胡失來被執十一月夏兵敗于克戎寨復敗于熟羊寨宰相入賀宣宗曰此忠賢之力也夏兵進圍臨洮陀滿胡土門破之四年四月夏葩俄族總管汪三郎率衆來降進羊千口詔納之優給其直來遠鎮獲諜人言宋夏相結來攻詔陝西行省備之夏於來羌城界河起折橋元帥右都監完顏賽不焚之斬馘甚衆六月鄜延路奏夏人牒報用彼國光定年號詔封還其牒閏月慶陽總管慶山奴伐夏出環州陝西行省請中分其軍令慶山奴出第三將懷安寨環州刺史完顏胡魯出環州宣宗曰聞夏人移軍備其王城尚恐詐我勿墮其計中也提控完顏狗兒抵蘭州西關堡招得舊部曲九人掩擊夏兵于阿彌灣殺其將士百餘人八月左監軍烏古論慶壽敗夏兵于安塞堡右都監賽不擊走夏兵于結耶觜川復破之于車兒堡十一月提控石盞合喜楊斡烈解定西之圍十二月丙寅宣宗與皇太子議伐夏左監軍陀滿胡土門延安總管古里甲石倫攻鹽宥夏州慶陽總管慶山奴知平涼府移剌荅不也攻威靈安會等州興定元年正月夏兵三萬自寧州還慶山奴以兵邀擊敗之詔河東行省胥鼎選兵三萬五千付陀滿胡土門伐夏鼎馳奏不可遂止語在鼎傳右都監完顏仲元請試兵西夏出其不意必獲全勝兵威既振國力益完詔下尚書省樞密院議夏人福山以俘戶來降除同知澤州軍州事五月夏兵入大北岔都統紇石烈猪狗掩擊敗之宣宗欲與夏議和右都監慶山奴屯延安奏曰夏國決不肯和徒見欺耳既而獲諜者言遵頊聞大金將約和戒諭將士無犯西鄙宰臣奏曰就令如此邊備亦不宜弛宣宗以為然右都監完顏閭山敗夏兵于黃鶴岔夏人圍羊狠寨都統党世昌與戰完顏狗兒遣都統夾谷瑞夜斫夏營遂解其圍猶駐近地左都監白撒發定西銳兵龕谷副統包孝成緋翮翅軍合擊走之八月安定堡馬家平總押李公直敗夏兵三千九月都統羅世暉却夏兵于克戎寨興定二年三月右都監慶山奴奏夏人有乞和意保安綏德葭州得文報乞復互市以尋舊盟以臣觀之此出於遵頊非邊吏所敢專者朝廷不以為然五月夏人入葭州慶山奴破之于馬吉峰七月犯龕谷夾谷瑞趙防敗之追至質孤堡三年閏月夏人破通秦寨提控納合買住擊敗之自葭蘆川遁去華州元帥完顏合達出安寨堡至隆州敗其兵二千進攻隆州克其西南會暮乃還十二月詔有司移文夏國四年二月夏人犯鎮戎金師敗績夏人公移語不遜詔詞臣草牒折之四月夏兵犯邊元帥石盞合喜遇于鹿兒原提控烏古論世顯以偏師敗之都統王定復破其衆于新泉城元帥慶山奴攻宥州圍神堆府穴其城士卒有登者援兵至擊走之斬首二千俘百餘人獲雜畜三千餘八月夏人陷會州刺史烏古論世顯降復犯龕谷夾谷瑞連戰敗之夏人乃去是月詔有司移文議和事竟不克夏人三萬自高峰鎮圍定西刺史愛申阿失剌提控烏古論長壽溫敦永昌擊走之九月夏人圍綏平寨安定堡未幾陷西寧州遂攻定西烏古論長壽擊却之乃襲鞏州石盞合喜逆戰一日十餘戰乃解去五年正月詔樞密院議夏事奏曰夏人聚兵境上欲由會州入已遣行省白撒伏兵險要以待之鄜延元帥府伺便發兵以綴其後足以無慮二月寧遠軍節度使夾谷海壽破夏兵于搜嵬堡三月復取來羌城十月攻龕谷白撒連敗之元光元年正月夏人陷大通城復取之三月提控李師林敗夏兵于永木嶺八月攻寧安寨十月攻神林堡十二月入質孤堡提控唐括昉敗之二年遵頊使其太子德任來伐德任諫曰彼兵勢尚強不若與之約和遵頊笑曰是非爾所知也彼失蘭州竟不能復何強之有德任固諫不從乞避太子位願為僧遵頊怒幽之靈州遣人代將會天旱不果是歲大元兵問罪夏國延安慶原元帥府欲乘夏人之困弊伐之陝西行省白撒合達以為不可乃止隴安軍節度使完顏阿隣日與將士宴飲不治軍事夏人乘之掠民五千餘口牛羊雜畜數萬而去自天會議和八十餘年與夏人未嘗有兵革之事及貞祐之初小有侵掠以至搆難十年不解一勝一負精銳皆盡而兩國俱弊是歲遵頊傳位於子德旺正大元年和議成自稱兄弟之國三年二月遵頊死七月德旺死嗣立者史失其名明年夏國亡先是夏使精方匭匣使王立之來聘未復命國已亡詔於京兆安置充宣差彈壓主管夏國降戶八年五月立之妻子三十餘口至環州詔以歸立之賜以幣帛立之上言先世本申州人乞不仕居申州詔如所請以本官居申州主管唐鄧申裕等處夏國降戶聽唐鄧總帥府節制給上田千畝牛具農作云贊曰夏之立國舊矣其臣羅世昌譜世次稱元魏衰微居松州者因以舊姓為托跋氏按唐書党項八部有托跋部自党項入居銀夏之間者號平夏部托跋思恭以破黃巢功賜姓李氏兄弟相繼為節度使居夏州在河南繼遷再立國元昊始大乃北渡河城興州而都之其地初有夏綏銀宥靈鹽等州其後遂取武威張掖酒泉燉煌郡地南界橫山東距西河土宜三種善水草宜畜牧所謂涼州畜牧甲天下者是也土堅腴水清冽風氣廣莫民俗強梗尚氣重然諾敢戰鬬自漢唐以水利積穀食邊兵興州有漢唐二渠甘涼亦各有灌溉土境雖小能以富強地勢然也五代之際朝興夕替制度禮樂盪為灰燼唐節度使有鼓吹故夏國聲樂清厲頓挫猶有鼓吹之遺音焉然能崇尚儒術尊孔子以帝號其文章辭命有可觀者立國二百餘年抗衡遼金宋三國偭鄉無常視三國之勢強弱以為異同焉故近代學者記西北地理往往皆臆度言之聖神有作天下會于一驛道往來視為東西州矣
