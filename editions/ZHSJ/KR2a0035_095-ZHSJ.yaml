body:
  text: 金史卷九十五列傳第三十三移剌履張萬公蒲察通粘割斡特剌程輝劉瑋董師中王蔚馬惠迪馬琪楊伯通尼厖古鑑移剌履字履道遼東丹王突欲七世孫也父聿魯早亡聿魯之族兄興平軍節度使德元無子以履為後方五歲晚臥廡下見微雲往來天際忽謂乳母曰此所謂臥看青天行白雲者耶德元聞之驚曰是子當以文學名世及長博學多藝善屬文初舉進士惡搜檢煩瑣去之廕補為承奉班祗候國史院書寫世宗方興儒術詔譯經史擢國史院編修官兼筆硯直長一日世宗召問曰朕比讀貞觀政要見魏徵嘉謀忠節良可稱歎近世何故無如徵者履曰忠嘉之士何代無之但上之人用與不用耳世宗曰卿不見劉仲誨張汝霖耶朕超用二人者以嘗居諫職屢有忠言故也安得謂之不用第人材難得耳履曰臣未聞其諫也且海陵杜塞言路天下緘口習以成風願陛下懲艾前事開諫諍之門天下幸甚初議以時務策設女直進士科禮部以所學不同未可概稱進士詔履定其事乃上議曰進士之科起于隋大業中始試以策唐初因之高宗時雜以箴銘賦詩至文宗始專用賦且進士之初本專試策今女直諸生以試策稱進士又何疑焉世宗大悅事遂施行十五年授應奉翰林文字兼前職俄遷修撰二十年詔提控衍慶宮畫功臣像過期降應奉踰年復為修撰轉尚書禮部員外郎章宗為金源郡王喜讀春秋左氏傳聞履博洽召質所疑履曰左氏多權詐駁而不純尚書孟子皆聖賢純全之道願留意焉王嘉納之二十六年進本部郎中兼同修國史翰林修撰表進宋司馬光古文孝經指解曰臣竊觀近世皆以兵刑財賦為急而光獨以此進其君有天下者取其辭施諸宇內則元元受賜俄以疾乞補外世宗曰履多病可與便州遂授薊州刺史無幾召為翰林待制同修國史明年擢尚書禮部侍郎兼翰林直學士世宗崩遺詔移梓宮壽安宮章宗詔百官議皆謂當如遺詔履獨曰非禮也天子七月而葬同軌畢至其可使萬國之臣朝大行於離宮乎上曰朕日夜思之捨正殿而奠於別宮情有所不忍且於禮未安遂殯於大安殿二十九年三月進禮部尚書兼翰林直學士賜大定三年孟崇獻牓下進士及第七月拜參知政事提控刊修遼史明昌元年進尚書右丞初河溢曹州帝問曰春秋二百四十二年不言河決何也履曰春秋止是魯史所以鮮及他國事二年六月薨年六十一是日履所生也諡曰文獻履秀峙通悟精曆算書繪事先是舊大明曆舛誤履上乙未曆以金受命于乙未也世服其善初德元未有子以履為後既而生子震德元歿盡推家貲與之其自禮部兼直學士為執政乃舉前代光院故事以錢五十萬送學士院學者榮之張萬公字良輔東平東阿人也幼聰悟喜讀書父彌學夢至一室牓曰張萬相公讀書堂已而萬公生因以名焉登正隆二年進士第調新鄭簿以憂去服闋除費縣簿大定四年為東京辰淥鹽副使課增遷長山令時土寇未平一旦至城下者幾萬人萬公登陴諭以鄉里親舊意衆感悟相率而去邑人賴之為立生祠久之補尚書省令史擢河北西路轉運司都勾判官改大理評事就陞司直四遷侍御史尚書右司員外郎丞相徒單克寧嘗謂曰後代我者必汝也俄授郎中敷奏明敏世宗嘉之謂侍臣曰張萬公純直人也尋遷刑部侍郎章宗即位初置九路提刑司選為南京路提刑使以治最遷御史中丞會北邊屢有警上命樞密使夾谷清臣發兵擊之萬公言勞民非便詔百官議於尚書省遂罷兵尋為彰國軍節度使明昌二年知大興府事拜參知政事踰年以母老乞就養詔不許賜告省親還上問山東河北粟貴賤今春苗稼萬公具以實對上謂宰臣曰隨處雖得雨尚未霑足奈何萬公進曰自陛下即位以來興利除害凡益國便民之事聖心孜孜無不舉行至於旱災皆由臣等若依漢典故皆當免官上曰卿等何罪殆朕所行有不逮者對曰天道雖遠實與人事相通唯聖人言行可以動天地昔成湯引六事自責周宣遇災而懼側身修行莫不修飭人事方今宜崇節儉不急之務無名之費可俱罷去上曰災異不可專言天道蓋必先盡人事耳故孟子謂王無罪歲左丞完顏守貞曰陛下引咎自責社稷之褔也上由是以萬公所言下詔罪己進士李邦乂者上封事因論世俗侈靡譏涉先朝有司議言者罪上謂宰臣曰昔唐張玄素以桀紂比文皇今若方我為桀紂亦不之罪至於世宗功德豈容譏毀顧問萬公曰卿謂何如萬公曰譏斥先朝固當治罪然舊無此法今宜定立使人知之乃命免邦乂罪惟殿三舉其奏對詳敏多類此四年復申前請授知東平府事諭之曰卿在政府非不稱職以卿母老乞侍養特畀鄉郡以遂孝養朕心所屬不汝忘也萬公謝且捧書言曰臣狂妄有一言欲今日以聞會受除未及耳夫內外之職憂責如一畎畝之臣猶不忘君芻蕘之言明主所擇伏望聖聰省察上嘉納之六年改知河中府時軍興調發叢劇悉為寬假使民力易辦人為繪像於薰風樓又建去思堂移鎮濟南以母憂去職卒哭詔起復拜平章政事躐遷資善大夫封壽國公時李淑妃有寵用事帝意惑之欲立為后大臣多不可御史姬端脩上書論之帝怒御史大夫張暐削一官侍御史路鐸削兩官端脩杖七十以贖論淑妃竟進封元妃又大兵雖罷而邊事方殷連歲旱暵災異數見又多變更制度民以為弗便而又改之紛紛無定萬公素沉厚深謹務安靜少事以為治與同列議多不合然頗嫌畏不敢犯顏強諫須帝有問然後審畫利害而質言之帝雖從而弗行也萬公於是兩上表以衰病匄閒詔諭曰近卿言數事朕未嘗行乃朕之過卿年未老而遽告病今特賜告兩月復起視事初明昌間有司建議自西南西北路沿臨潢達泰州開築壕塹以備大兵役者三萬人連年未就御史臺言所開旋為風沙所平無益於禦侮而徒勞民上因旱災問萬公所由致萬公對以勞民之久恐傷和氣宜從御史臺所言罷之為便後丞相襄師還卒為開築民甚苦之主兵者又言比歲征伐軍多敗衂蓋屯田地寡無以養贍至有不免飢寒者故無鬬志願括民田之冒稅者分給之則戰士氣自倍矣朝臣議已定萬公獨上書言其不可者五大略以為軍旅之後瘡痍未復百姓拊摩之不暇何可重擾一也通檢未久田有定籍括之必不能盡適足以增猾吏之敝長告訐之風二也浮費侈用不可勝計推之以養軍可斂不及民而足無待於奪民之田三也兵士失於選擇強弱不別而使同田共食振厲者無以盡其力疲劣者得以容其姦四也奪民而與軍得軍心而失天下心其禍有不可勝言者五也必不得已乞以冒地之已括者召民蒔之以所入贍軍則軍有坐獲之利而民無被奪之怨矣皆不報一日奏事上謂萬公曰卿昨言天久陰晦亦由人君用人邪正不分君子當在內小人當在外甚有理也然孰謂小人萬公奏張煒田櫟張嘉貞等雖有才幹無德可稱上即命三人補外泰和元年連章請老不許遷榮祿大夫賜其子進士及第明年章再上有旨得非卿有所言朕有不從者乎或同列情見不一而多違卿意邪不然何求去如是之數也萬公謝無他第以病言三年正月章再上不允加銀青光祿大夫三月歷舉朝臣有名者以自代求去甚力上知其不能留諭曰朕初即位擢卿執政繼遷相位以卿先朝舊人練習典故朕甚重之且年雖高而精力未衰故以機務相勞為卿屢求退去故勉從之甚非朕意也加金紫光祿大夫致仕六年南鄙用兵上以山東重地須大臣鎮撫之先任完顏守貞卒於是特起萬公知濟南府山東路安撫使山東連歲旱蝗沂密萊莒濰五州尤甚萬公慮民飢盜起當預備賑濟時兵興國用不給萬公乃上言乞將僧道度牒師德號觀院名額幷鹽引付山東行部於五州給賣納粟易換又言督責有司禁戢盜賊之方上皆從之宋人請和復乞致仕許之加崇進仍給平章政事俸之半泰和七年薨命依宰臣故事燒飯賻葬贈儀同三司諡曰文貞萬公淳厚剛正門無雜賓典章文物多所裁正上嘗與司空襄言秋山之樂意將有事於春蒐也顧視萬公萬公曰動何如靜上改容而止輔政八年其所薦引多廉讓之士焉大安元年配享章宗廟廷蒲察通本名蒲魯渾中都路胡土愛割蠻猛安人也熙宗選護衞見通名以筆識之通以父老懇乞就養衆訝之曰得充侍衞終身榮貴今乃辭過人遠矣朝廷義而從之後因會葬宋王宗望於房山以門閥加昭信校尉授頓舍改御院通進海陵伐宋隆州諸軍尤精銳付通總之兵壓淮令通率騎二百先濟覘敵及弇中敵兵躍出通按兵直前傍有舞槊來刺者回身射之應弦而斃諸軍倂擊敗之海陵召見喜形於色曰兵事定汝勿憂爵賞至揚州通營別屯是夜海陵遇弒有來告者通欲執而殺之續聞其實哀悶仆地衆掖而起徑入營門哭之軍還入見世宗顧謂近臣曰朕素知是人幼嘗從游性溫厚有識慮又精騎射授尚局副使又諭近臣曰常令見朕欲問以事而考其言朕將用之窩斡反命通佩金符詣軍前督戰賊破以功授世襲謀克奚人亂承詔繼往艹泣軍遷本局使以母喪免起為殿前右衞將軍兼領閑尋命其子蒲速烈尚衞國公主出為肇州防禦使賜以金帶仍諭以補外之意因戒勅之語在世宗紀中尋擢蒲與路節度使移鎮歸德軍遷西南路招討入知大興府事除殿前都點檢初大理卿闕世宗欲令通為之問宰臣對曰通點檢器也上曰點檢繁冗無由顯其能通明敏才幹正掌法之官又曰通之機識崇尹不及也大定十七年拜尚書右丞轉左丞詔議推排猛安謀克事大臣皆以為止驗見在產業定貧富依舊科差為便通言必須通括各謀克人戶物力多寡則貧富自分貧富分則版籍定如有緩急驗籍科差富者不得隱貧者不重困與一例科差者大不侔矣上是通言謂宰臣曰議事當如通之盡心也閱三歲進平章政事封任國公世宗將幸上京以通朝廷舊人命為上京留守先往鎮撫之二十五年除知真定府事世宗曰朕復欲相卿惜卿老矣故以此授卿仍賜錢千貫未幾改知平陽府事移鳳翔致仕明昌四年上諭宰臣曰通先朝重臣年雖高而未衰因命知廣寧府事累表請老復以開府儀同三司致仕承安三年薨諭旨於其弟曰舊制致仕宰相無祭葬禮通舊臣懿戚故特命勅祭及葬初通在政府舉太子率府完顏守貞監察御史裔俱可大用其後皆為名臣世多其知人云粘割斡特剌蓋州別里賣猛安奚屈謀克人也貞元初以習女直字試補戶部令史轉尚書省令史大定七年選授吏部主事歷右補闕修起居注九年河南路統軍使宗以宋人欲啟兵釁上言求入見世宗遣斡特剌就問之仍究其實至汴問宗及召凡嘗言邊事者詰之皆無狀還報世宗喜曰朕固知妄也授左司員外郎十年以夏國發兵築祁安城及襲殺喬家族首領結什角又諜者言夏與宋人通謀犯邊詔大理卿李昌圖與斡特剌往按其事夏人報言結什角以兵犯夏境故殺之祁安城本上國所賜舊積石地發兵修築以備他盜耳又察知宋夏無交通狀及喬家族民戶願令結什角姪趙師古為首領具以聞世宗甚悅轉右衞將軍賜衣馬車牛弓矢器仗十二年為夏國生日使還授右司郎中遷右副都點檢久之出為河南路統軍都監賜金帶及具裝馬十七年授昌武軍節度使兼領前職明年入為刑部尚書拜參知政事世宗嘗諭平章政事唐括安禮曰朕思為治之道考擇人材最為難事其餘常務各有程式非此比也如斡特剌所舉者頗稱朕意時右三部檢法蒙括蠻都告斡特剌與招討哲典朋黨乞付刑部詰問世宗曰若哲典免死則可謂朋黨今已伏誅乃誣謗耳又謂宰臣曰朕素知此人極有識慮貌雖柔而心甚剛直所行不率易也二十二年委提控代州阜通監召見諭之曰朕自任卿以來悉卿材幹故擢為執政卿亦體朕待遇之意能勉盡所職凡謀議奏對多副朕心莫倚上有宰相而自嫌外蓋舊人年老新人未苦經練是以委責於卿但有所見悉心以言勿持嫌以為不知也二十三年進尚書右丞兼樞密副使表乞解一職許解樞密世宗以猛安謀克拋留土田責宰臣曰此事皆卿輩所當陳舉乃俟朕言而後行蓋卿輩以為細務非天子所親朕嘗思之獄訟簿書有斡特剌在餘事卿輩略不介意朕亦安能置而不問邪俄坐事削一階令視事如故二十六年轉尚書左丞世宗謂曰朕昨與宰臣議可授執政者卿不在焉今阿魯罕年老斡魯也多病吾欲用宗浩何如斡特剌奏曰彼二人者恐不得力獨宗浩幹能可任遂用宗浩又謂曰朕於天下事無不用心一如草創時斡特剌曰自古人君始勤終怠者多矣有始有終惟聖人能之上曰唐太宗至明之主也然魏徵諫以十事謂其不能有終是則有終始者實為難矣二十八年為上京留守賜通犀帶及射生馬一明昌二年致仕承安初有事北方朝廷欲得舊臣任之乃起為東京留守遣監察御史完顏綱諭旨曰知汝精神尚健故復用也明年改上京留守又諭之曰上京祖先基業之地卿馳驛之任到彼便宜行事邊事稍息即召卿還二年九月還朝拜平章政事封芮國公在位數月薨年六十九訃聞上傷悼久之遣官致祭賻贈銀千二百五十兩重幣四十五端絹四百五十疋錢二千貫諡曰成肅斡特剌性溫厚醞藉嘗為丞相紇石烈良弼所薦後世宗謂宰臣曰良弼善知人如斡特剌輩其才真可用也在相位十餘年甚見寵遇唯奏定五品官子與外路司吏同試部令史及令隨朝吏員得試國史院書寫世宗以為非云程輝字日新蔚州靈仙人也皇統二年擢進士第由尚書省令史升左司都事久之為南京路轉運使以宮殿火降授磁州刺史有吳僧者殺州人張善友而取其妻輝督捕之命張母以長錐刺僧與其妻無完膚以死改陝西東路轉運使再遷戶部尚書大定二十三年拜參知政事世宗諭之曰卿年雖老猶可宣力事有當言毋或隱默卿其勉之一日輝侍朝世宗曰人嘗謂卿言語荒唐今遇事輒言過於王蔚顧謂宰臣曰卿等以為何如皆曰輝議政可否略無隱情輝對曰臣年老耳聵第患聽聞不審或失奏對苟有所聞敢不盡心舊廟祭用牛世宗晚年欲以他牲易之輝奏曰凡祭用牛者以牲之最重故號太牢語曰犁牛之子騂且角雖欲勿用山川其舍諸古禮不可廢也二十四年世宗幸上京尚書省奏來歲正旦外國朝賀事世宗曰上京地遠天寒朕甚憫人使勞苦欲即南京受宋書何如輝對曰外國使來必面見天子今半途受書異時宋人託事效之何以辭為世宗曰朕以誠實彼若相詐朕自有處置耳輝以為不可於是議權免一年會有司市麵不時酬直世宗怒監察不舉劾杖責之以問輝輝對曰監察君之耳目所犯罪輕不贖而杖亦一時之怒也世宗曰職事不舉是故犯也杖之何不可輝對曰往者不可諫來者猶可追二十六年以老致仕次年復起知河南府事輝辭以衰老不任召入香閤諭之曰卿年老而精力尚強雖久歷外未嘗得嘉郡河南地勝事簡故以處卿卿可優游頤養輝曰臣猶老馬也芻豆待養豈可責以筋力向者南京宮殿火非聖恩寬貸臣死久矣今河之徑河南境上下千餘里河防之責視彼尤重此臣所以憂不任也於是特詔不預河事章宗立時輝年七十六復乞致仕詔許之仍給參知政事半俸承安元年卒諡曰忠簡輝性倜儻敢言喜雜學尤好論醫從河間劉守真說率用涼藥神童嘗添壽者方數歲輝召之因書醫非細事四字添壽塗細字改書作相輝頗慚人亦以此為中其病云劉瑋字德玉咸平人也唐盧龍節度使仁敬之裔祖弘遼季鎮懿州王師至弘以州降太祖俾知咸州後以同平章政事致仕父君詔同知宣徽院事瑋幼警悟業進士舉熙宗錄其舊特賜及第調安次丞由遵化縣令補尚書省令史歷戶部主事監察御史累轉尚書省都事宰臣奏擬瑋經畫軍民田土世宗見其名曰劉瑋尚淹此乎遷戶部員外郎時將東巡命瑋同工部郎中宋中往營行宮就陞郎中改同知宣徽院事為使宋國信副使瑋父兄皆以是官使江左當時榮之還授戶部侍郎初世宗器瑋材幹以為無施不可及將幸上京以行在所須皆隸太府欲瑋領其事嫌其稍下故移戶部侍郎張大節於工部而以戶部授瑋上還謂宰臣曰劉瑋極有心力臨事閑暇第用心不正耳若心正當其人才不可得也明年擢戶部尚書時河決于衞自衞抵清滄皆被其害詔兼工部尚書往塞之或以謂天災流行非人力所能禦惟當徙民以避其衝瑋曰不然天生五材遞相休王今河決者土不勝水也俟秋冬之交水勢稍殺以漸興築庶幾可塞明年春瑋齋戒禱于河功役齊舉河乃復故召還增秩以為宋弔祭副使世宗不豫拜參知政事仍領戶部既而為山陵使尋上表請外出知濟南府事移鎮河中明昌二年徙知大名府仍領河防事三年入拜尚書右丞上嘗問考課法今可行否右丞相夾谷清臣曰行之亦可但格法繁則有司難於承用耳瑋曰考課之法本於總核名實今提刑司體察廉能贓濫以行賞罰亦其意也若別議設法恐涉太繁上問唐代何如瑋對以四善二十七最明年六月卒是日上將擊毬於臨武殿聞瑋卒而止諡曰安敏後上謂宰臣曰人為小官或稱才幹及其大用則不然如劉瑋固甚幹然自世宗朝逮輔朕於事多有知而不言者若實愚人則不足論知及之而不肯盡心可乎平章政事完顏守貞曰春秋之法責備賢者上曰夫為宰相而欲收恩避怨使人人皆稱己是賢者固若是乎董師中字紹祖洺州人也少敏贍好學強記擢皇統九年進士第調澤州軍事判官改平遙丞縣有劇賊王乙素凶悍不可制師中捕得杖殺之一境遂安時大軍後野多枯胔縣有遺櫬寓于驛舍者悉為葬之遷綿上令補尚書省令史右相唐括訛魯古尤器重之撫其座曰子議論英發襟度開朗他日必居此座再考擢監察御史遷尚書省都事初師中為監察時漏察大名總管忽剌不公事及忽剌以罪誅世宗怒曰監察出使郡縣職在彈糾忽剌親貴尤當用意乃徇不以聞削官一階降授沁南軍節度副使累遷坊州刺史明昌元年初置九路提刑司師中選為陝西路副使坐修公廨濫支官錢罪以贖論及御史臺言其寬和有體召為大理卿御史中丞吳鼎樞舉以自代尚書省亦奏其才行遂擢中丞時西北路招討使宗肅以平章夾谷清臣薦知大興府事師中上言宗肅近以贓罪鞫于有司獄未竟不宜改除上納其言曰朕知之矣有功不賞有罪不罰雖唐虞不能化天下命復送有司四年上將幸景明宮師中及侍御史賈鉉治書侍御史粘割遵古諫以謂勞人費財蓋其小者變生不虞所繫非輕聖人法天地以順動故萬舉萬全今邊鄙不馴反側無定必里哥孛瓦貪暴強悍深可為慮陛下若問諸左右必有容悅而言者謂堂堂大國何彼之恤夫𧔧蠆有毒患起所忽今都邑壯麗內外苑囿足以優佚皇情近畿山川飛走充牣足以閱習武事何必千車萬騎草居露宿逼介邊陲遠煩偵候以冒不惻之悔哉上不納師中等又上疏曰近年水旱為沴明詔罪己求言罷不急之役省無名之費天下欣幸今方春東作而亟遣有司修建行宮揆之於事似為不急況西北二京臨潢諸路比歲不登加以民有養馬簽軍挑壕之役財力大困流移未復米價甚貴若扈從至彼又必增價日糴升合者口以萬數舊藉北京等路商販給之倘以物貴或不時至則飢餓之徒將復有如曩歲殺太尉馬毀太府瓜果出忿怨言起而為亂者矣書曰民情大可見小人難保況南北兩屬部數十年捍邊者今為必里哥孛瓦誘脅傾族隨去邊境蕩搖如此可虞若忽之而往豈聖人萬舉萬全之道哉廼者太白晝見京師地震又北方有赤色遲明始散天之示象冀有以警悟聖意修德銷變矧夫逸遊古人所戒遠自周秦近逮隋唐與遼皆以是生釁可不慎哉可不畏哉左補闕許安仁右拾遺路鐸亦皆上書論諫是日上御後閤召師中等賜對即從其奏仍遣諭輔臣曰朕欲巡幸山後無他不禁暑熱故也今臺諫官咸言民間缺食處甚多朕初不盡知既已知之暑雖可畏其忍私奉而重民之困哉廼罷北幸尋為宋生日國信使還以所得金帛分遺親舊五年上復如景明宮師中及臺諫官各上疏極諫上怒遣近侍局直長李仁愿詣尚書省召師中等諭之曰卿等所言非無可取然亦有失君臣之體者今命平章諭旨其往聽焉戶部尚書馬琪表舉自代擢吏部尚書初完顏守貞改為西京留守朝京師上欲復用監察御史蒲剌都等糾彈數事師中辨其誣而舉守貞正人可用守貞由是復拜平章政事及守貞以罪斥上曰向薦守貞者應降黜如董師中言臺省無此人不治路鐸李敬義亦嘗推舉可左遷於外然三人者後俱可用今姑出之以正失舉罪除陝西西路轉運使歲餘徵為御史大夫命與禮部尚書張暐看讀陳言文字踰三月拜參知政事進尚書左丞他日奏事上語輔臣曰御史姬端脩言小人在側果誰歟師中曰應謂李喜兒輩上默然師中通古今善敷奏練達典憲處事精敏嘗言曰宰相不當事細務要在知人才振綱紀但一心正兩目明足矣承安四年表乞致仕詔賜宅一區留居京師以寒食乞過家上冢許之且命賦寒食還家上冢詩每節辰朝會召入侍宴其眷禮如此泰和二年薨年七十四上聞之甚悼惜顧謂大臣曰凡正人多執方而不通獨師中正而通詔依見任宰執例葬祭仍賻贈之諡曰文定師中工文性通達疏財尚義平居則樂易真率其臨事則剛決挺然不可奪弟師儉初業進士欲籍其資廕師中保任之密令人代給堂帖使之肄業師儉感其義方力學後遂登第方在政府近侍傳詔將錄用其子師中奏曰臣有姪孤幼若蒙恩錄勝于臣子上義之以其姪為筆硯承奉與胥持國同輔政頗相親附世以此少之王蔚字叔文香河人也登皇統二年進士第調良鄉丞治績優等補尚書省令史知管差除蔚性通敏曉析吏事尋授都事以喪去起復行左司員外郎遷郎中大定二年超授河東北路轉運使諭旨曰汝在海陵時行事多不法然朕素知爾才幹欲授以內除而憲臺有言以是補外如能澡心易行必當升擢否則勿望再用既而察廉為第一授中都路都轉運使改吏部尚書以斷護衞出職事不當奪官一階頃之出知河中府事遷南京留守十五年拜參知政事蔚懇辭不任負荷勅諭之曰卿但履正奉公無或阿順何以辭為十六年出知真定府事累轉知河中府明昌元年召拜尚書右丞致仕卒馬惠迪字吉甫漷陰人也擢天德三年進士第再調昌邑令察廉第一補尚書省令史大定中出為西京留守判官以治最擢同知崇義軍節度事累遷左司郎中先是鄧儼居是職世宗愛其明敏惠迪一日奏事退上謂宰臣曰人之聰明多失於浮衒若惠迪聰明而朴實甚可喜也朕嘗與論事五品以下朝官少有如者未幾超授御史中丞拜參知政事時烏底改叛亡世宗已遣人討之又欲益以甲士毀其船惠迪奏曰得其人不可用有其地不可居恐不足勞聖慮上曰朕固知之所以毀其船正欲不使再窺邊境耳尋以憂去起為昭義軍節度使明昌元年為南京留守致仕卒馬琪字德玉大興寶坻人正隆五年擢進士第調清源主簿三遷永清令永清畿縣號難治前令要介有能聲琪繼以治聞補尚書省令史以永清治最授同知定武軍節度使事興中府治中召為戶部員外郎改侍御史世宗謂宰臣曰比者馬琪主奏高德溫獄其於富戶寄錢事皆略不奏朕以琪明法律而正直所為乃爾稱職之才何其難也古人雖云罪疑惟輕非為全尚寬縱也尋轉左司員外郎扈從東巡遷右司郎中移左司時擇使宋國者世宗欲命琪宰臣言其資淺詔特遣之還授吏部侍郎改戶部章宗即位除中都路都轉運使時戶部闕官上命宰臣選可任者或舉同知大興府事烏古孫仲和上曰仲和雖有智力恐不能主錢穀理財安得如劉晏者官用足而民不困唐以來一人而已或舉琪上然之曰琪不肯欺官亦不肯害民是可用也遂擢為戶部尚書久之削官一階初琪病告近侍傳旨不具服曳履而出有司議當徒二年減外猶追官解任大理少卿閻公貞以為琪本荒遽失措與非病告有違不同宜減徒二年三等論之上從公貞議任職如故明昌四年拜參知政事詔諭之曰戶部遽難得人顧無以代卿者故用卿晚耳一日上謂琪曰卿在省久矣比來事少於往時何也琪曰昔宰職多有異同今情見不同者甚少上曰往多情見為是耶今無者為是耶琪曰事狀明者不假情見便用情見亦要歸之是而已五年河決陽武灌封丘而東琪行尚書省事往治之訖役而還遷中大夫承安元年北邊用兵而連歲旱暵表乞致仕不許明年出鎮安武軍致仕卒子師周閤門祗候當給假以聞上悼之以不奏聞責諭有司後二品官卒皆具以聞自琪始琪性明敏習吏事其治錢穀尤長然性吝好利頗為上所少云楊伯通字吉甫弘州人擢大定三年進士第由尚書省令史為吏部主事順義軍節度副使以憂去吏部侍郎馬琪表薦伯通廉幹尚書省覆察如所舉召為尚書省都事授同知定武軍節度使事明昌元年擢左司員外郎轉郎中累遷吏部尚書尋移戶部承安二年拜參知政事監察御史路鐸劾奏伯通引用鄉人李浩以公器結私恩左司郎中賈益承望風旨不復檢詳言之臺端欲加糾劾大夫張暐輒尼不行上命同知大興府事賈鉉詰之伯通居家待罪鉉奏暐言彈絀大臣須有實跡所劾不當徒壞臺綱益言除授皆宰執公議不言伯通私枉詔責鐸言事輕率而慰諭伯通治事伯通再上表辭不許四年進尚書左丞致仕卒尼厖古鑑本名外留隆州人也識女直小字及漢字登大定十三年進士第調隆安教授改即墨主簿召授國子助教擢近侍局直長世宗器其材謂宰臣曰新進士中如徒單鎰夾谷衡尼厖古鑑皆可用也改太子侍丞踰年遷應奉翰林文字兼右三部司正世宗復謂宰臣曰鑑嘗近侍朕知其正直幹治及為東宮侍丞保護太孫禮節言動猶有國俗純厚舊風朕甚嘉之章宗立累遷尚書戶部侍郎兼翰林直學士俄轉同知大興府用大臣薦改知大興府事明昌五年拜參知政事薨諡曰文肅贊曰移剌履從容進說信孚於君至論經純傳駁以孝行為治本其得古人遺學歟昔臧孫達忠諫於魯君子知其有後信矣張萬公引正守己質言無華開壕括地之議明灼利害如指諸掌閉於羣說而不式致仕而歸理勢然也蒲察通之哭海陵君臣大義死生一之其志烈矣程輝斡特剌之鯁直劉瑋董師中之通敏才皆足以發聞然師中有附胥之譏劉瑋見避事之責其視前人多有愧矣王蔚馬惠迪之徒何足算也
