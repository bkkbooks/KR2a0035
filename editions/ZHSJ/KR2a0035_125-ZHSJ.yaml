body:
  text: 金史卷一百二十五列傳第六十三文藝上韓昉蔡松年子珪吳激馬定國任詢趙可郭長倩蕭永祺胡礪王競楊伯仁鄭子聃党懷英金初未有文字世祖以來漸立條教太祖既興得遼舊人用之使介往復其言已文太宗繼統乃行選舉之法及伐宋取汴經籍圖宋士多歸之熙宗款謁先聖北面如弟子禮世宗章宗之世儒風丕變庠序日盛士繇科第位至宰輔者接踵當時儒者雖無專門名家之學然而朝廷典策鄰國書命粲然有可觀者矣金用武得國無以異於遼而一代制作能自樹立唐宋之間有非遼世所及以文而不以武也傳曰言之不文行之不遠文治有補於人之家國豈一日之效哉作文藝傳韓昉字公美燕京人仕遼累世通顯昉五歲喪父哭泣能盡哀天慶二年中進士第一補右拾遺轉史舘修撰累遷少府少監乾文閣待制加衞尉卿知制誥充高麗國信使高麗雖舊通好天會四年奉表稱藩而不肯進誓表累使要約皆不得要領而昉復至高麗移督再三高麗徵國中讀書知古今者商榷辭旨使酬答專對凡涉旬乃始置對謂昉曰小國事遼宋二百年無誓表未嘗失藩臣禮今事上國當與事遼宋同禮而屢盟長亂聖人所不與必不敢用誓表昉曰貴國必欲用古禮舜五載一巡狩羣后四朝周六年五服一朝又六年王乃時巡諸侯各朝于方岳今天子方事西狩則貴國當從朝會矣高麗人無以對乃曰徐議之昉曰誓表朝會一言決耳於是高麗乃進誓表如約昉乃還宗幹大說曰非卿誰能辦此因謂執事者曰自今出疆之使皆宜擇人明年加昭文舘直學士兼堂後官再加諫議大夫遷翰林侍講學士改禮部尚書遷翰林學士兼太常卿修國史尚書如故昉自天會十二年入禮部在職凡七年當是時朝廷方議禮制度或因或革故昉在禮部兼太常甚久云除濟南尹拜參知政事皇統四年表乞致仕不許六年再表乞致仕乃除汴京留守封鄆國公復請如初以儀同三司致仕天德初加開府儀同三司薨年六十八昉性仁厚待物甚寬有家奴誣告昉以馬資送叛人出境考之無狀有司以奴還昉昉待之如初曰奴誣主人以罪求為良耳何足怪哉人稱其長者昉雖貴讀書未嘗去手善屬文最長於詔冊作太祖睿德神功碑當世稱之自使高麗歸後高麗使者至必問昉安否云蔡松年字伯堅父靖宋宣和末守燕山松年從父來管勾機宜文字宗望軍至白河郭藥師敗靖以燕山府降元帥府辟松年為令史天會中遼宋舊有官者皆換授松年為太子中允除真定府判官自此為真定人嘗從元帥府與齊俱伐宋是時初平真定西山羣盜山中居民為賊汙者千餘家松年力為辨論竟得不坐齊國廢置行臺尚書省於汴松年為行臺刑部郎中都元帥宗弼領行臺事伐宋松年兼總軍中六部事宋稱臣師還宗弼入為左丞相薦松年為刑部員外郎皇統七年尚書省令史許霖告田瑴黨事松年素與瑴不相能是時宗弼當國瑴性剛正好評論人物其黨皆君子韓企先為相愛重之而松年許霖曹望之欲與瑴相結瑴拒之由是構怨故松年許霖構成瑴等罪狀勸宗弼誅之君子之黨熄焉是歲松年遷左司員外郎松年前在宗弼府而海陵以宗室子在宗弼軍中任使用是相厚善天德初擢吏部侍郎俄遷戶部尚書海陵遷中都徙榷貨務以實都城復鈔引法皆自松年啟之海陵謀伐宋以松年家世仕宋故亟擢顯位以聳南人觀聽遂以松年為賀宋正旦使使還改吏部尚書尋拜參知政事是年自崇德大夫進銀青光祿大夫遷尚書右丞未幾為左丞封郜國公初海陵愛宋使人山呼聲使神衞軍習之及孫道夫賀正隆三年正旦入見山呼聲不類往年來者道夫退海陵謂宰臣曰宋人知我使神衞軍習其聲此必蔡松年胡礪泄之松年惶恐對曰臣若懷此心便當族滅久之進拜右丞相加儀同三司封衞國公正隆四年薨年五十三海陵悼惜之奠于其第命作祭文以見意加封吳國公諡文簡起復其子三河主簿珪為翰林修撰璋賜進士第遣翰林待制蕭籲護送其喪歸葬真定四品以下官離都城十里送之道路之費皆從官給松年事繼母以孝聞喜周恤親黨性復豪侈不計家之有無文詞清麗尤工樂府與吳激齊名時號吳蔡體有集行于世子珪珪字正甫中進士第不求調久乃除澄州軍事判官遷三河主簿丁父憂起復翰林修撰同知制誥在職八年改戶部員外郎兼太常丞珪號為辨博凡朝廷制度損益珪為編類詳定檢討刪定官初兩燕王墓舊在中都東城外海陵廣京城圍墓在東城內前嘗有盜發其墓大定九年詔改葬於城外俗傳六國時燕王及太子丹之葬及啟壙其東墓之柩題其和曰燕靈王舊舊古柩字通用乃西漢高祖子劉建葬也其西墓蓋燕康王劉嘉之葬也珪作兩燕王墓辯據葬制名物款刻甚詳安國軍節度判官高元鼎坐監臨姦事求援於太常博士田居實大理司直吳長行吏部主事高震亨大理評事王元忠震亨以屬鞫問官御史臺典事李仲柔仲柔發之珪與刑部員外郎王翛宛平主簿任詢前衞州防禦判官閻恕承事郎高復亨文林郎翟詢敦武校尉王景晞進義校尉任師望坐與居實等轉相傳教或令元鼎逃避居實長行震亨元忠各杖八十翛珪詢恕復亨翟詢各笞四十景晞師望各徒二年官贖外並的決久之除河東北路轉運副使復入為修撰遷禮部郎中封真定縣男珪已得風疾失音不能言乃除濰州刺史同輩已奏謝珪獨不能入見世宗以讓右丞唐括安禮參政王蔚曰卿等閱書史亦有不能言之人可以從政者乎又謂中丞劉仲誨曰蔡珪風疾不能奏謝卿等何不糾之人言卿等相為黨蔽今果然邪珪乃致仕尋卒珪之文有補正水經五篇合沈約蕭子顯魏收宋齊北魏志作南北史志三十卷續金石遺文跋尾十卷晉陽志十二卷文集五十五卷補正水經晉陽志文集今存餘皆亡吳激字彥高建州人父拭宋進士官終朝奉郎知蘇州激米芾之壻也工詩能文字畫俊逸得芾筆意尤精樂府造語清婉哀而不傷將宋命至金以知名留不遣命為翰林待制皇統二年出知深州到官三日卒詔賜其子錢百萬粟三百斛田三頃以周其家有東山集十卷行于世東山其自號也馬定國字子卿茌平人自少志趣不羣宣政末題詩酒家壁坐譏訕得罪亦因以知名阜昌初遊歷下以詩撼齊王豫豫大悅授監察御史仕至翰林學士石鼓自唐以來無定論定國以字畫考之云是宇文周時所造作辯萬餘言出入傳記引據甚明學者以比蔡正甫燕王墓辯初學詩未有入處夢其父與方寸白筆從是文章大進有集傳于世任詢字君謨易州軍市人父貴有才幹善畫喜談兵宣政間游江浙詢生於虔州為人慷慨多大節書為當時第一畫亦入妙品評者謂畫高於書書高於詩詩高於文然王庭筠獨以其才具許之登正隆二年進士第歷益都都勾判官北京鹽使年六十四致仕優游鄉里家藏法書名畫數百軸年七十卒趙可字獻之高平人貞元二年進士仕至翰林直學士博學高才卓犖不天德貞元間有聲場屋後入翰林一時詔誥多出其手流輩服其典雅其歌詩樂府尤工號玉峯散人集郭長倩字曼卿文登人登皇統丙寅經義乙科仕至祕書少監兼禮部郎中修起居注與施朋望王無競劉嵓老劉無黨相友善所撰石決明傳為時輩所稱有崑集行于世蕭永祺字景純本名蒲烈少好學通契丹大小字廣寧尹耶律固奉詔譯書辟置門下因盡傳其業固卒永祺率門弟子服齊衰喪固作遼史未成永祺繼之作紀三十卷志五卷傳四十卷上之加宣武將軍除太常丞海陵為中京留守永祺特見親禮天德初擢左諫議大夫遷翰林侍講學士同修國史再遷翰林學士明年遷承旨尚書左丞耶律安禮出守南京海陵欲以永祺代之召見于內閤諭以旨意永祺辭曰臣材識卑下不足以辱執政海陵曰今天下無事朕方以文治卿為是優矣永祺固辭既出或問曰公遇知人主進取爵位以道佐時何多讓也永祺曰執政繫天下休戚縱欲貪冒榮寵如蒼生何海陵嘗選廷臣十人備諮訪獨永祺議論寬厚時稱長者卒年五十七胡礪字元化磁州武安人少嗜學天會間大軍下河北礪為軍士所掠行至燕亡匿香山寺與傭保雜處韓昉見而異之使賦詩以見志礪操筆立成思致清婉昉喜甚因舘置門下使與其子處同教育之自是學業日進昉嘗謂人曰胡生才器一日千里他日必將名世十年舉進士第一授右拾遺權翰林修撰久之改定州觀察判官定之學校為河朔冠士子聚居者常以百數礪督教不倦經指授者悉為場屋上游稱其程文為元化格皇統初為河北西路轉運都勾判官礪性剛直無所屈行臺平章政事高楨之汴道真定燕于漕司礪欲就坐楨責之礪曰公在政府則禮絕百僚今日之會自有賓主禮楨曰汝他日為省吏當何如礪曰當官而行亦何所避楨壯其言改謝之改同知深州軍州事加朝奉大夫郡守暴戾蔑視僚屬礪常以禮折之守愧服郡事一委于礪州管五縣例置弓手百餘少者猶六七十人歲徵民錢五千餘萬為顧直其人皆市井無賴以迹盜為名所至擾民礪知其弊悉罷去繼而有飛語曰某日賊發將殺通守或請為備礪曰盜所利者財耳吾貧如此何備為是夕令公署撤關竟亦無事再補翰林修撰遷禮部郎中一時典禮多所裁定海陵拜平章政事百官賀於廟堂礪獨不跪海陵問其故礪以令對且曰朝服而跪見君父禮也海陵深器重之天德初再遷侍講學士同修國史以母憂去官起復為宋國歲元副使刑部侍郎白彥恭為使海陵謂礪曰彥恭官在卿下以其舊勞故使卿副之遷翰林學士改刑部尚書扈從至汴得疾海陵數遣使臨問卒深悼惜之年五十五王競字無競彰德人警敏好學年十七以廕補官宋宣和中太學兩試合格調屯留主簿入國朝除大寧令歷寶勝鹽官轉河內令時歲饑盜起競設方略以購賊不數月盡得之夏秋之交沁水泛溢歲發民築隄豪民猾吏因緣為姦競覈實之減費幾半縣民為之諺曰西山至河岸縣官兩人半蓋以前政韓希甫與競相繼治縣皆有幹能絳州正平令張元亦有治績而差不及故云然天眷元年轉固安令皇統初參政韓昉薦之召權應奉翰林文字兼太常博士詔作金源郡王完顏婁室墓碑競以行狀盡其實乃請國史刊正之時人以為法二年試館閣競文居最遂為真遷尚書禮部員外郎時海陵當國政由己出欲令百官避堂諱競言人臣無公諱遂止蕭仲恭以太傅領三省事封王欲援遼故事親王用紫羅傘事下禮部競與郎中翟永固明言其非是事竟不行海陵由是重之天德初轉翰林待制遷翰林直學士改禮部侍郎遷翰林侍講學士改太常卿同修國史擢禮部尚書同修國史如故大定二年春從太傅張浩朝京師詔復為禮部尚書是歲奉遷睿宗山陵儀注不應典禮競削官兩階詔改創五龍車兼翰林學士承旨修國史四年卒官競博學而能文善草隸書工大字兩都宮殿牓題皆競所書士林推為第一云楊伯仁字安道伯雄之弟也天性孝友讀書一過成誦登皇統九年進士第事親不求調天德二年除應奉翰林文字初名伯英避太子光英諱改今名海陵嘗夜召賦詩傳趣甚亟未二鼓奏十詠海陵喜解衣賜之海陵射烏伯仁獻獲烏詩以諷丁父憂起復賜金帶襲衣及賜白金以奉母改左拾遺進士呂忠翰廷試已在第一未唱名海陵以忠翰程文示伯仁問其優劣伯仁對曰當在優等海陵曰此今試狀元也伯仁自以知忠翰姓名在第一遂宿諫省俟唱名乃出海陵嘉其慎密轉翰林修撰孟宗獻發解第一伯仁讀其程文稱之此人當成大名是歲宗獻府試省試廷試皆第一號孟四元時論以為知文故事狀元官從七品階承務郎世宗以宗獻獨異等與從六品階授奉直大夫改著作郎居母喪服除調鎮西節度副使入為起居注兼左拾遺上書論時務六事改大名少尹郡中豪民橫恣甚莫可制民受其害伯仁窮竟渠黨四境帖然讞館陶大辟得其寃狀館陶人為立祠府尹荊王文坐贓削封降德州防禦使同知裴滿子寧及伯仁判官謝奴皆以不能匡正解職伯仁降南京留守判官改同知安化軍節度使到官三日召為太子右諭德兼侍御史改翰林待制復兼右諭德除濱州刺史郡俗有遣奴出亡捕之以規賞者伯仁至責其主而杖殺其奴如是者數輩其弊遂止入為左諫議大夫兼禮部侍郎翰林直學士故事諫官詞臣入直禁中上閔其勞特免入直改吏部侍郎直學士如故鄭子聃卒宰相舉伯仁代之乃遷侍講兼禮部侍郎伯仁久在翰林文詞典麗上曰自韓昉張鈞後則有翟永固近日則張景仁鄭子聃今則伯仁而已其次未見能文者呂忠翰草降海陵庶人詔點竄再四終不能盡朕意狀元雖以詞賦甲天下至於辭命未必皆能凡進士可令補外考其能文者召用之不數月兼左諫議大夫俄兼太常卿大臣舉可修起居注者數人上以伯仁領之從幸上京伯仁多病至臨潢地寒因感疾還中都明年上還幸中都遣使勞問賜以丹劑是歲卒鄭子聃字景純大定府人父宏遼金源令二子子京子聃楊丘行嘗謂人曰金源二子鳳毛也小者尤特達後必名世子聃及冠有能賦聲天德三年丘行為太子左衞率府率廷試明日海陵以子聃程文示丘行對曰可入甲乙及拆卷果中第一甲第三人調翼城丞遷贊皇令召為書畫直長子聃頗以才望自負常慊不得為第一甲第一人正隆二年會試畢海陵以第一人程文問子聃子聃少之海陵問作賦何如對曰甚易因自矜且謂他人莫己若也海陵不悅乃使子聃與翰林修撰綦戩楊伯仁宣徽判官張汝霖應奉翰林文字李希顏同進士雜試七月癸未海陵御寶昌門臨軒觀試以不貴異物民乃足為賦題忠臣猶孝子為詩題憂國如飢渴為論題上謂讀卷官翟永固曰朕出賦題能言之或能行之未可知也詩論題庶戒臣下丁亥御便殿親覽試卷中第者七十三人子聃果第一海陵奇之有頃進官三階除翰林修撰改侍御史京畿旱詔子聃決囚遂澍雨人以比顏真卿遷待制兼吏部郎中改祕書少監遷翰林直學士兼太子左諭德顯宗深器重之以疾求補外遂為沂州防禦使皇太子幣贐甚厚命以安輿之官召還為左諫議大夫兼直學士改吏部侍郎同修國史直學士如故遷侍講兼修國史上曰修海陵實錄知其詳無如子聃者蓋以史事專責之也二十年卒年五十五子聃英俊有直氣其為文亦然平生所著詩文二千餘篇党懷英字世傑故宋太尉進十一代孫馮翊人父純睦泰安軍錄事參軍卒官妻子不能歸因家焉應舉不得意遂脫略世務放浪山水間簞瓢屢空晏如也大定十年中進士第調莒州軍事判官累除汝陰縣令國史院編修官應奉翰林文字翰林待制兼同修國史懷英能屬文工篆籀當時稱為第一學者宗之大定二十九年與鳳翔府治中郝俁充遼史刊修官應奉翰林文字移剌益趙渢等七人為編修官凡民間遼時碑銘墓誌及諸家文集或記憶遼舊事悉上送官是時章宗初即位好尚文辭旁求文學之士以備侍從謂宰臣曰翰林闕人如之何張汝霖奏曰郝俁能屬文宦業亦佳上曰近日制詔惟党懷英最善移剌履進曰進士擢第後止習吏事更不復讀書近日始知為學矣上曰今時進士甚滅裂唐書中事亦多不知朕殊不喜上謂宰臣曰郝俁賦詩頗佳舊時劉迎能之李晏不及也明昌元年懷英再遷國子祭酒二年遷侍講學士明年議開邊防濠塹懷英等十六人請罷其役詔從之遷翰林學士七年有事于南郊攝中書侍郎讀祝冊上曰讀冊至朕名聲微下雖曰尊君然在郊廟禮非所宜當平讀之承安二年乞致仕改泰寧軍節度使明年召為翰林學士承旨泰和元年增修遼史編修官三員詔分紀志列傳刊修官有改除者以書自隨久之致仕大安三年卒年七十八諡文獻懷英致仕後章宗詔直學士陳大任繼成遼史云
