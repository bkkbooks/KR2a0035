body:
  text: 金史卷二元中書右丞相總裁托克托等修本紀第二太祖太祖應乾興運昭德定功仁明莊孝大聖武元皇帝諱旻本諱阿固達世祖第二子也母曰翼簡皇后納喇氏遼道宗時有五色雲氣屢出東方大若二千斛囷倉之狀司天孔致和竊謂人曰其下當生異人建非常之事天以象告非人力所能為也咸雍四年戊申七月一日太祖生幼時與羣兒戲力兼數軰舉止端重世祖尤愛之世祖與拉必瑪察戰於野鵲水世祖被四創疾困坐太祖于膝循其髪而撫之曰此兒長大吾復何憂十歲好弓矢甫成童即善射一日遼使坐府中顧見太祖手持弓矢使射羣鳥連三發皆中遼使矍然曰竒男子也太祖嘗宴赫舍哩部呼爾罕家散歩門外南望髙阜使衆射之皆不能至太祖一發過之度所至踰三百二十歩宗室們圖琿最善射逺其不及者猶百歩也天德三年立射碑以識焉世祖伐布呼太祖因希卜蘇請從行世祖不許而心異之烏春既死烏木罕請和既請和復來攻遂圍其城太祖年二十三被短甲免胄不介馬行圍號令諸軍城中望而識之壮士托雲乘駿馬持槍出城馳刺太祖太祖不及備舅氏和爾和馳出其間擊托雲槍折刺中其馬托雲僅得免嘗與扎呼岱出營殺略不令世祖知之且還敵以重兵追之獨行隘巷中失道追者益急值髙岸與人等馬一躍而過追者乃還世祖寢疾太祖以事如遼統軍司將行世祖戒之曰汝速了此事五月未半而歸我猶及見汝也太祖往見和囉木薩噶統軍既畢事前世祖没一日還至家世祖見太祖來所請事皆如志喜甚執太祖手抱其頸而撫之謂穆宗曰烏雅舒柔善惟此子足了契丹事穆宗亦雅重太祖出入必俱太祖逺出而歸穆宗必親迓之世祖已擒拉必瑪察尚據哲克依水肅宗使太祖先取瑪察家屬康宗至哲克依水圍之太祖㑹軍親獲瑪察獻馘於遼遼命太祖為詳衮仍命穆宗希卜蘇罕都皆為詳衮久之以偏師伐尼瑪哈部伯赫布爾噶等乃以特通額為鄉導沿刷水夜行襲之虜其妻子初溫都部巴圖殺唐古部巴噶穆宗命太祖伐之太祖入辭謂穆宗曰昨夕見赤祥此行必克敵遂行是歲大雪寒甚與烏庫哩部兵沿屯水過摩琳鄉追及巴圖於額斯琿山北濼之間殺之軍還穆宗親迓太祖於阿勒錦村薩哈以都統伐埒克們圖琿合實圖羙伐達薩塔薩哈與将佐議或欲先平邉地部落城堡或欲徑攻埒克城議不能决願得太祖至軍中穆宗使太祖往曰事必有可疑軍之未發者止有甲士七十盡以畀汝們圖琿在穆嚕宻斯罕城下實圖羙未到土人欲執們圖琿以與敵使來告急遇太祖於實都甸太祖曰國兵盡在此矣使敵先得志於們圖琿後雖種誅之何益也乃分甲士四十與之太祖以三千人詣薩哈軍道遇人曰敵已據佛寜嶺南路矣衆欲由沙斑嶺往太祖曰汝等畏敵耶既度佛寕嶺不見敵已而聞敵乃守沙斑嶺以拒我及至薩哈軍夜急攻之遲明破其衆是時埒克烏塔皆在遼既破埒克還攻烏塔城城中人以城降初太祖過佛寜嶺經烏塔城下從騎有後者烏塔城人攻而奪之釡太祖駐馬呼謂之曰毋取我炊食器其人謾言曰公能來此何憂不得食太祖以鞭指之曰吾破埒克即於汝乎取之至是其人持釡而前曰奴軰誰敢毁詳衮之器也遣普嘉努招卓多卓多乃降釋之穆宗将伐蕭哈里募兵得千餘人女直兵未嘗滿千至是太祖勇氣自倍曰有此甲兵何事不可圖也哈里來戰與遼兵合因止遼人自為戰渤海留守以甲贈太祖太祖亦不受穆宗問何為不受曰被彼甲而戰戰勝則是因彼成功也穆宗末年令諸部不得擅置信牌馳驛訊事號令自此始一皆自太祖啟之康宗七年歲不登民多流殍彊者轉而為盗罕都等欲重其法為盗者皆殺之太祖曰以財殺人不可財者人所致也遂減盗賊徴償法為徴三倍民間多逋負賣妻子不能償康宗與官屬㑹議太祖在外庭以帛繫杖端麾其衆令曰今貧者不能自活賣妻子以償債骨肉之愛人心所同自今三年勿徴過三年徐圖之衆皆聼令聞者感泣自是逺近歸心焉歲癸巳十月康宗夢逐狼屢𤼵不能中太祖前射中之旦日以所夢問遼佐衆曰吉兄不能得而弟得之之兆也是歲康宗即世太祖襲位為達貝勒遼使阿息保來讓曰何以不告䘮太祖曰有䘮不能弔而乃以為罪乎他日阿息保復來徑騎至康宗殯所閲賵馬欲取之太祖怒将殺之宗雄諫而止既而遼命乆不至遼主好畋獵淫酗怠于政事四方奏事往往不見省赫舍哩阿蘇既奔遼穆宗取其城及其部衆不能歸遂與族弟尼楚赫薩里罕隂結南江居人歡塔博索欲俱亡入髙麗事覺太祖使𤓰爾佳薩哈捕之而尼楚赫薩里罕先為遼戍所獲歡塔博索已亡去薩哈取其妻子而還二年甲午六月太祖至江西遼使使來致襲節度之命初遼每歲遣使市名鷹海東青于海上道出境内使者貪縱徴索無藝公私厭苦之康宗嘗以不遣阿蘇為言稍拒其使者太祖嗣節度亦遣普嘉努往索阿蘇故常以此二者為言終至于滅遼然後已至是復遣宗室實古納完顔尼楚赫往索阿蘇實古納等還具言遼主驕肆廢弛之状於是召官僚耆舊以伐遼告之使備衝要建城堡修戎器以聼後命遼統軍司聞之使節度使尼格來問状曰汝等有異志乎修戰具飭守備将以誰禦太祖荅之曰設險自守又何問哉遼復遣阿息保來詰之太祖謂之曰我小國也事大國不敢廢禮大國德澤不施而逋逃是主以此字小能無望乎若以阿蘇與我請事朝貢苟不獲已豈能束手受制也阿息保還遼人始為備命統軍蕭托卜嘉調諸軍于寕江州太祖聞之使富卦喇復索阿蘇實觀其形勢富卦喇還言遼兵多不知其數太祖曰彼初調兵豈能遽集如此復遣華沙布徃還言惟四院統軍司與寕江州軍及渤海八百人耳太祖曰果如吾言謂諸將佐曰遼人知我將舉兵集諸路軍備我我必先𤼵制之無為人制衆皆曰善乃入見宣靖皇后告以伐遼事后曰汝嗣父兄立邦家見可則行吾老矣無貽我憂汝必不至是也太祖感泣奉觴為夀即奉后率諸將出門舉觴東向以遼人荒肆不歸阿蘇并已用兵之意禱于皇天后土酹畢后命太祖正坐與僚屬飲號令諸部使博勒和徴伊蘭路都古嚕納兵烏楞古阿嚕撫諭幹琿集賽兩路係遼籍女直薩卜丹往安圗路執遼障鷹官達嚕噶部副使色埒寧江州渤海大嘉努於是達嚕噶部色爾衮來告曰聞舉兵伐遼我部誰從太祖曰吾兵雖少舊國也與汝隣境固當從我若畏遼人自往就之九月太祖進軍寕江州次寥晦城博勒和徴兵後期杖之復遣督軍諸路兵皆㑹于拉林水得二千五百人致遼之罪申告于天地曰世事遼國恪修職貢定烏春烏木罕之亂破蕭哈里之衆有功不省而侵侮是加罪人阿蘇屢請不遣今将問罪於遼天地其鑒佑之遂命諸将傳梃而誓曰汝等同心盡力有功者奴婢部曲為良庶人官之先冇官者敘進輕重眡功苟違誓言身死梃下家屬無赦師次唐古特旺結之地諸軍禳射介而立有光如烈火起於人足及戈矛之上人以為兵祥明日次札扎水光見如初将至遼界先使宗幹督士卒夷塹既渡遇渤海軍攻我左翼七穆昆衆少却敵兵直犯中軍舍音出戰齊達先驅太祖曰戰不可易也遣宗幹止之宗幹馳出舍音前控止齊達馬舍音遂與俱還敵人從之耶律色實墜馬遼人前救太祖射救者斃併射色實中之有騎突前又射之徹扎洞胷色實㧞箭走追射之中其背飲矢之半僨而死獲所乘馬宗幹與數騎䧟遼軍中太祖救之免胄戰或自傍射之矢拂于顙太祖顧見射者一矢而斃謂将士曰盡敵而止衆從之勇氣自倍敵大奔相蹂踐死者十七八薩哈在别路不及㑹戰使人以戰勝告之而以色實馬賜之薩哈使其子宗翰完顔希尹來賀且稱帝因勸進太祖曰一戰而勝遂稱大號何示人淺也進軍寕江州諸軍填塹攻城寕江人自東門出温特赫額圖琿邀擊盡殪之十月朔克其城獲防禦使大藥師努隂縱之使招諭遼人鐵驪部來送欵次拉林城以俘獲賜将士召渤海梁福額特埒使之偽亡去招諭其鄉人曰女直渤海本同一家我興師伐罪不濫及無辜也使完顔羅索招諭係遼籍女直師還謁宣靖皇后以所獲頒宗室耆老以色爾衮貲産給将士初命諸路以三百户為穆昆十穆昆為明安綽哈等撫定成黙水女直拜格酋長和索哩以城降十一月遼都統蕭嘉哩副都統托卜嘉将歩騎十萬㑹于鴨子河北太祖自将擊之未至鴨子河既夜太祖方就枕若有扶其首者三寤而起曰神明警我也即鳴鼓舉燧而行黎明及河遼兵方壊陵道選壮士十輩擊走之大軍繼進遂登岸甲士三千七百至者纔三之一俄與敵遇于珠赫店㑹大風起塵埃蔽天乘風勢擊之遼兵潰逐至沃稜濼殺獲首虜及車馬甲兵珍玩不可勝計徧賜官屬将士燕犒彌日遼人嘗言女直兵滿萬則不可敵至是始滿萬云斡魯敗遼兵斬其節度使托卜嘉布呼等攻賔州㧞之烏舍楚古爾蘇來降遼将實古爾戰于賔州布呼琿楚敗之鐵驪王和勒博以所部降烏達布芬徹復敗實古爾蕭伊蘇軍于祥州東斡琿集賽両路降烏楞古敗遼軍于咸州西斬統軍錫埒于陣完顔羅索克咸州是月烏竒邁薩哈希卜蘇率官屬諸將勸進願以新嵗元日恭上尊號太祖不許阿里罕普嘉努宗翰等進曰今大功已建若不稱號無以繫天下心太祖曰吾将思之收國元年正月壬申朔羣臣奉上尊號是日即皇帝位上曰遼以鑌鐵為號取其堅也鑌鐵雖堅終亦變壊惟金不變不壊金之色白完顔部色尚白於是國號大金改元収國丙子上自将攻黄龍府進臨益州州人走保黄龍取其餘民以歸遼遣都統耶律鄂爾多左副統蕭伊蘇右副統耶律漳努都監蕭色佛哷騎二十萬歩卒七萬戍邉留羅索尼楚赫守黄龍上率兵趨達嚕噶城次寕江州西遼使僧嘉努來議和國書斥上名且使為屬國庚子進師有火光正圓自空而墜上曰此祥徴殆天助也酹白水而拜将士莫不喜躍進逼達嚕噶城上登髙望遼兵若連雲灌水状顧謂左右曰遼兵心貳而情怯法雖多不足畏遂趨髙阜為陳宗雄以右翼先馳遼左軍左軍却左翼出其陣後遼右軍皆力戰羅索尼楚赫衝其中堅凡九䧟陣皆力戰而出宗翰請以中軍助之上使宗幹往為疑兵宗雄已得利擊遼右軍遼兵遂敗乘勢追躡至其營㑹日已暮圍之黎明遼軍潰圍出逐北至阿嚕岡遼歩卒盡殪得其耕具數千以給諸軍是役也遼人本欲屯田且戰且守故併其耕具獲之三月師還三月辛未朔獲于寥晦城四月遼耶律漳努以國書來上以書辭慢侮留其五人獨遣漳努囘報書亦如之五月庚午朔避暑于近郊甲戌拜天射栁故事五月五日七月十五日九月九日拜天射栁歲以為常六月己亥朔遼耶律漳努復以國書來猶斥上名上復書亦斥遼主名以報之且諭其舉國來降七月戊辰以弟烏竒邁為安班貝勒國相薩哈為古倫貝勒希卜蘇為愛滿貝勒弟舍音為古倫貝勒甲戍遼使薩喇以書來留之不遣九百奚營來降八月戊戌上親征黄龍府次混同江無舟上使一人道前乘赭白馬徑渉曰視吾鞭所指而行諸軍随之水及馬腹後使舟人測其渡處深不得其底熙宗天眷二年以黄龍府為濟州軍曰利渉盖以太祖渉濟故也九月克黄龍府遣薩喇還遂班師至江徑渡如前丁丑上至自黄龍府己卯黄龍見于空中癸巳以古倫貝勒薩哈為古倫烏嚇哩貝勒阿里罕為古倫英實貝勒冬十一月遼主聞取黄龍府大懼自将七十萬至圖們駙馬蕭特黙林牙蕭扎拉等将騎五萬歩四十萬至沃稜濼上自将禦之十二月己亥行次約囉㑹諸将議皆曰遼兵號七十萬其鋒未易當吾軍逺來人馬疲乏宜駐于此深溝髙壘以待從之遣都古嚕訥尼楚赫鎮達嚕噶丁未上以騎兵親候遼軍獲督餉者知遼主以漳努叛西還二日矣是日上還至舒吉濼有光見于矛端戊申諸将曰今遼主既還可乘怠追擊之上曰敵來不迎戰去而追之欲以此為勇邪衆皆悚愧願自效上復曰誠欲追敵約齎以往無事餫饋若破敵何求不得衆皆奮躍追及遼主于呼岱巴岡是役也兵止二萬上曰彼衆我寡兵不可分視其中軍最堅遼主必在焉敗其中軍可以得志使右翼先戰兵數交左翼合而攻之遼兵大潰我師馳之横出其中遼師敗績死者相屬百餘里獲輿輦㡩幄兵械軍資他寳物馬牛不可勝計是戰舍音援矛殺數十人阿爾本被圍温特赫德克徳以四穆昆兵出之完顔蒙克身被數創力戰不已功皆論最蕭特黙等焚營遁去遂班師𤓰爾佳薩哈取開州博勒和下德里城薩里罕降二年正月戊子詔曰自破遼兵四方來降者衆宜加優恤自今契丹奚漢渤海係遼籍女直室韋達嚕噶烏舍鐵驪諸部官民已降或為軍所俘獲逃遁而還者勿以為罪其酋長仍官之且使從宜居處閏月髙永昌據東京使托卜嘉來求援髙麗遣使來賀㨗且求保州詔許自取之二月己巳詔曰比以歳凶庶民艱食多依附豪族因為奴𨽻及有犯法徴償莫辦折身為奴者或私約立限于人對贖過期則為奴者並聼以両人贖一為良若元約以一人贖者亦從約四月己丑以斡魯統内外諸軍與分徹都古嚕訥㑹咸州路都統烏楞古討髙永昌華沙布等被害五月斡魯等敗永昌托卜嘉擒永昌以獻戮之于軍東京州縣及南路係遼女直皆降詔除遼法省稅賦置明安穆昆一如本朝之制以斡魯為南路都統德特貝勒額圖琿破遼兵六萬于昭蘇城九月己亥上獵近郊乙巳南路都統斡魯來見于巴密特水始製金牌十二月庚申朔安班貝勒烏竒邁及羣臣上尊號曰大聖皇帝改明年為天輔元年天輔元年正月開州叛𤓰爾佳薩哈等討平之古倫温貝勒舍音以兵一萬取㤗州四月遼秦晋國王耶律聶哷來伐都古嚕訥羅索博勒和将兵二萬㑹咸州路都統烏楞古擊之五月丁巳詔自收寕江州以後同姓為婚者杖而離之七月戊申以完顔鄂倫知東京事八月癸亥髙麗遣使來請保州十二月甲子烏楞古等敗耶律聶哷兵于蒺藜山㧞顯州乾懿豪徽成川惠等州皆降是月宋使登州防禦使馬政以國書來其畧曰日出之分實生聖人竊聞征遼屢破勁敵若克遼之後五代時陷入契丹漢地願畀下邑二年正月庚寅遼雙州節度使張崇降使索多如宋報聘書曰所請之地今當與宋夾攻得者有之二月癸丑朔遼使耶律努格等來議和辛酉貝勒都古嚕訥羅索來見上以遼主近在中京而敢輙來杖之和勒博雙寛等言咸州都統烏楞古知遼主在中京而不進討芻糧豐足而不以實聞攻顯州時所獲生口財畜多自取三月癸未朔命闍格代為都統而鞫治之烏楞古坐降穆昆壬辰遼使耶律努格以國書來庚子以羅索言黄龍府地僻且逺宜重戍守乃命合諸路穆昆以羅索爲萬户鎮之四月辛巳遼使以國書來五月丙申命呼圖克昆如遼六月甲寅詔嚴禁民凌虐典雇良人及倍取贖直者甲戌遼通祺雙遼等州八百餘户來歸命分置諸部擇膏腴之地處之七月癸未詔曰博囉水路完顔珠勒呼渤海大嘉努等六穆昆貧民昔嘗給以官糧置之漁獵之地今歴日已久不知登耗可具其數以聞呼圖克昆還自遼耶律努格復以國書來丙申呼圖克昆如遼遼户二百來歸處之泰州詔遣阿里庫理嘉努徳哷台招諭未降者仍詔達嚕噶部貝勒色埒凡降附新民善為存撫來者令從便安居給以官糧毋輙動擾八月呼圖克昆還自遼耶律努格托廸復以國書來九月戊子詔曰國書詔令宜選善屬文者為之其令所在訪求博學雄才之士敦遣赴闕閏月庚戌朔以降将霍石韓慶和為千户九百奚部蕭寶伊遜北部額哩頁漢人王六児王伯龍契丹特黙高從祐等各率衆來降遼耶律努格以國書來十月癸未以龍化州降者張應古劉仲良為千户乙未咸州都統司言漢人李孝功渤海二哥率衆來降命各以所部為千户十二月甲辰遣貝勒珠卜以定遼地諭髙麗耶律努格以國書來遼懿州節度使劉宏以户三千并執遼候人來降以為千户川州冦二萬已降復叛赫舍哩卓哩擊破之三年正月甲寅東京人為質者永吉等五人結衆叛事覺誅其首惡餘皆杖百没入在行家屬資産之半詔知東京事鄂倫繼有犯者並如之丙辰詔拜格貝勒綽哈曰呼嚕古達巴噶二部來送欵若等先時不無交惡自今毋相侵擾三月耶律努格以國書來四月丙子朔日有食之五月壬戌詔咸州路都統司曰兵興以前哈斯罕輝法里與係遼籍不係遼籍女直户有民犯罪流竄邉境或亡入于遼者本皆吾民逺在異境朕甚憫之今既議和當行理索可明諭諸路千户穆昆徧與詢訪其官稱名氏地里具録以上六月辛夘遼遣太傅實訥埒等奉冊璽來上摘冊文不合者數事復之索多還自宋宋使馬政及其子宏來聘索多受宋團練使上怒杖而奪之宋使還復遣貝勒色埒赫嚕等如宋七月辛亥遼人楊詢卿羅子韋各率衆來降命各以所部為穆昆八月己丑頒女直字九月以遼冊禮使失期詔諸路軍過江屯駐十二月實訥埒等復以國書來海蘭甸長城髙麗増築三尺詔呼嚕古錫馨慎固營壘四年二月色埒赫嚕還自宋宋使趙良嗣王暉來議燕京西京地三月甲辰上謂羣臣曰遼人屢敗遣使求成惟飾虚辭以為緩師之計當議進討其令咸州路都統司治軍旅修噐械具數以聞辛酉詔咸州路都統司曰朕以遼國和議無成将以四月二十五日進師令色克留兵一千鎮守棟摩以餘兵來㑹于渾河遼實訥埒以國書來四月乙未上自將伐遼以遼使實納埒宋使趙良嗣等從行五月甲辰次渾河西使宗雄先趨上京遣降者馬義持詔諭城中壬子至上京詔官民曰遼主失道上下同怨朕興兵以來所過城邑負固不服者即攻拔之降者撫恤之汝等必聞之矣今爾國和好之事反覆見欺朕不欲天下生靈久罹塗炭遂决䇿進討比遣宗雄等相繼招諭尚不聴從今若攻之則城破矣重以弔伐之義不欲殘民故開示明詔諭以禍福其審圖之上京人恃禦備儲蓄為固守計甲寅亟命進攻上謂實訥埒趙良嗣等曰汝可觀我用兵以卜去就上親臨城督将士諸軍鼓譟而進自旦及已棟摩以麾下先登克其外城留守托卜嘉以城降趙良嗣等奉觴為壽皆稱萬歲是日赦上京官民詔諭遼副統伊都壬戌次沃赫河宗幹率羣臣諌曰地逺時暑車馬罷乏若深入敵境糧餽乏絶恐有後艱上從之乃班師命分兵攻慶州伊都襲棟摩於遼河完顔布達烏塔等戰却之完顔特庫死焉七月癸卯上至自伐遼九月矩威水部錫勒哈達等殺貝勒綽哈布古德以叛十月戊辰朔日有食之戊寅命斡魯分呼嚕古烏春之兵以討錫勒哈達十一月東京留守司乞本京官民質子増數番代上不許曰諸質子已各受田廬若復番代則往來動揺可並仍舊十二月宋復使馬政來請西京之地五年春正月斡嚕敗錫勒哈達於哈達拉山誅首惡四人餘悉撫定二月遣昱及宗雄分諸路明安穆昆之民萬户屯泰州以博勒和統之賜耕牛五十四月乙丑朔宗翰請伐遼詔諸路預戒軍事五月遼都統耶律伊都等詣咸州降閏月辛巳古倫烏赫哩貝勒薩哈薨六月癸巳伊都與其将吏來見丙申千户庫爾逹坐擅署部人為富勒琿杖一百并罷其官庚子詔安班貝勒烏竒邁貳國政以温貝勒舍音為烏赫哩貝勒普嘉努為温貝勒宗翰為伊拉齊貝勒秋七月庚辰詔咸州都統司曰自伊都來灼見遼國事宜已决議親征其治軍以俟師期尋以連雨乃罷親征命温貝勒昱為都統伊拉齊貝勒宗翰副之帥師而西十一月辛丑以烏赫哩貝勒杲為内外諸軍都統以昱宗翰宗幹宗望宗盤等副之甲辰詔曰遼政不綱人神共棄今欲中外一統故命汝率大軍以行討伐爾其慎重兵事擇用善謀賞罰必行糧餉必繼勿擾降服勿縱俘掠見可而進無淹師期事有從權毋須申禀戊申詔曰若克中京所得禮樂儀仗圖書文籍並先次津𤼵赴闕六年正月癸酉都統杲克髙恩囬紇三城乙亥取中京遂下澤州二月庚寅朔日有食之己亥宗翰等敗遼奚王錫黙于北安州降奚部西節度使額哩埒以本部降壬寅都統杲遣使來奏㨗并獻所獲貨寶詔曰汝等提兵于外克副所任攻下城邑撫安人民朕甚嘉之所言分遣将士招降山前諸部計悉已撫定續遣來報山後若未可往即營田牧馬俟及秋成乃圖大舉更當熟議見可則行如欲益兵具數來上不可恃一戰之勝輒有弛慢新降附者當善撫存宣諭将士使知朕意宗翰駐北安遣希尹等略地獲遼護衛耶律實訥埒知遼主獵鴛鴦濼以其子晋王賢而有人望惡而殺之衆益離心雖有西北西南両路兵馬皆羸弱遂遣諾延温都等報都統杲進兵襲之三月都統杲出青嶺宗翰出瓢嶺追遼主于鴛鴦濼遼主奔西京宗翰復追至白水濼不及獲其貨寶己巳至西京壬申西京降希尹追遼主于伊蘇部不及乙亥西京復叛是月遼秦晋國王耶律聶埒即位于燕四月辛卯復取西京壬辰遣圖克坦烏濟高慶裔如宋戊戌都統杲自西京趨白水濼温貝勒昱襲皮室部于德里川為敵所敗還㑹扎拉兵追至黄水北大破之耶律坦招徠西南諸部西至夏其招討使耶律佛德降金肅西平二郡漢軍四千餘人叛去耶律坦等襲取之棟摩羅索招降天徳雲内寕邉東勝等州獲阿蘇而還是時山西城邑諸部雖降人心未固遼主保隂山耶律聶呼在燕京都統杲遣宗望入奏請上臨軍五月辛酉宗望來奏㨗百官入賀賜宴歡甚先是獲遼樞密使德哷台節度使和尚伊勒希額哩頁等都統杲使阿林護送赴闕徳哷台道亡阿林坐誅耶律聶哷遣使請罷兵戊寅使楊勉以書諭聶哷使之降瑪克實遣其子濟爾噶濟貢方物六月戊子朔上親征遼𤼵自上京命安班貝勒烏竒邁監國辛亥詔諭上京官民曰朕順天弔伐已定三京但以遼主未獲兵不能已今者親征欲由上京路進恐撫定新民驚疑失業已出自登穆魯其先降後叛逃入險阻者詔後出首悉免其罪若猶拒命孥戮無赦是月耶律聶哷卒斡魯羅索敗夏人于野谷七月甲子詔諸将無得逺迎以廢軍務乙丑上京漢人毛八十率二千餘户降因命領之丙寅以額恃埓招降者衆命領八千户以呼遜副之壬午希尹以阿蘇見杖而釋之八月乙丑次鴛鴦濼都統杲率官屬來見癸已上追遼主于大魚濼昱宗望追及遼主于石輦鐸戰敗之遼主遁己亥次居延北辛丑中京将完顔琿楚敗契丹奚漢六萬于髙州貝勒瑪竒死之達勒達穆爾部降昱宗望追遼主于諤勒哲圖不及九月庚申次草濼棟摩平中京部族之先叛者及招撫㳂海郡縣節度使耶律慎思領諸部入内地乙丑詔六部奚曰汝等既降復叛扇誘衆心罪在不赦尚以歸附日淺恐綏懐之道有所未孚故復令招諭若能速降當釋其罪官皆仍舊歸化州降戊辰次歸化州甲戌宗雄薨丁丑奉聖州降十月丙戌朔次奉聖州詔曰朕屢勅将臣安輯懐附無或侵優然愚民無知尚多逃匿山林即欲加兵深所不忍今其逃㪚人民罪無輕重咸與矜免有能率衆歸附者授之世官或奴婢先其主降並釋為良其布告之使諭朕意蔚州降庚寅伊都等遣蔚州降臣翟昭彦徐興田慶來見命昭彦慶皆為刺史興為圍練使詔曰比以幽薊一方招之不服今欲帥師以往故先安撫山西諸部汝等既已懐服宜加撫存官民未附已前罪無輕重及係官逋負皆與釋免諸官各遷叙之丁酉蔚州翟昭彦田慶殺知州事蕭觀寕等以叛丙午復降十一月詔諭燕京官民王師所至降者赦罪復官十二月上親伐燕京宗望率兵七千以先之都古嚕訥出得勝口尼楚赫出居庸闗羅索為左翼博勒和為右翼取居庸闗丁亥次媯州戊子次居庸闗庚寅遼統軍都監高陸等來送欵上至燕京入自南門使尼楚赫羅索陳于城上乃次于城南遼知樞密院左企弓虞仲文樞密使曹勇義副使張彦忠参知政事康公弼僉書劉彦宗奉表降辛卯遼百官詣軍門叩頭請罪詔一切釋之壬辰上御徳勝殿羣臣稱賀甲午命左企弓等撫定燕京諸州縣詔西京官吏曰乃者師至燕都已皆撫定唯蕭妃與官屬数人遁去已𤼵兵追襲或至彼路可執以來黄龍府叛宗輔討平之七年正月丁巳遼奚王和勒博僭稱帝甲子遼平州節度使時立爱降詔曲赦平州又詔安班貝勒曰比者遣昻徙諸部民人于嶺東而昻悖戾騷動煩優致多怨叛其違命失衆當寘重典若或有疑禁錮以待庚午詔中京都統鄂倫曰聞卿撫定人民各安其業朕甚嘉之而和勒博聚徒逆命汝宜計晝無使滋蔓壬申詔招諭和勒博癸酉以時立爱言招撫諸部己夘宋使來議燕京西京地庚辰宜錦乾顯成川豪懿等州皆降甲申詔曰諸州部族歸附日淺民心未寕今農事将興可遣分諭典兵之官無縱軍士動優人民以廢農業二月乙酉朔命薩巴詔諭興中府降之遼來州節度使田顯隰州刺史杜師回遷州刺史髙永福潤州刺史張成皆降壬辰詔安班貝勒曰郡縣今皆撫定若有逃㪚未降者已釋其罪更宜招諭之前後起遷户民去鄉未乆豈無懐土之心可令所在有司深加存恤毋輒有騷動衣食不足者官賑貸之癸巳詔曰頃因兵事未息諸路関津絶其往來今天下一家若仍禁之非所以便民也自今顯咸東京等路往來聼從其便其問被虜及鬻身者並許自贖為良仍令馳驛布告興中宜州復叛宋使趙良嗣來請加嵗幣以代燕稅及議畫疆與遣使賀正旦生辰置𣙜塲交易并計議西京等事癸卯尼楚赫道拉如宋乙巳詔都統杲曰新附之民有材能者可録用之戊申詔平州官與宋使同分割所與燕京六州之地癸丑大赦是月改平州為南京以張覺為留守三月甲寅朔将誅昻以希卜蘇諌杖之七十仍拘㤗州戊午都統杲等言耶律瑪展伊都烏舍道拉等謀叛宜早圖之上召伊都從容謂之曰朕得天下皆我君臣同心同徳以成大功固非汝等之力今聞汝等謀叛若誠然耶必湏鞍馬甲胄器械之屬當悉付汝朕不食言若再為我擒無望免死欲留事朕無懐異志吾不汝疑也伊都戰慄不能對命杖道拉七十餘並釋之宋使盧益趙良嗣馬宏以國書來四月丁亥遣斡魯宗望襲遼主于隂山壬辰復書于宋師𥘉入燕遼兵復犯奉聖州林牙達實壁龍門東二十五里都統斡魯聞之遣卓哩羅索馬和尚等率兵討之生獲達實悉降其衆癸巳詔曰自今軍事若皆中覆不無留滯應此路事務申都統司餘皆取决樞密院契丹糾堅聚黨興中府作亂擒之糾堅自殺命實古納博勒和監護長勝軍及燕京豪族工匠由松亭闗徙之内地己亥次儒州斡魯宗望等襲遼權六院司喀勒扎于白水濼獲之其宗屬秦王許王等十五人降聞遼主留輜重青塜以兵萬人往應州遣卓哩布達宗望羅索尼楚赫等追襲之宗望追及遼主决戰大敗之獲其于趙王實訥埒及𫝊國璽五月甲寅南京留守張覺據城叛丙寅次野狐嶺己巳次拉林濼斡魯等以趙王實訥埒林牙達實駙馬儒努等來獻并上所獲國璽宗雋以所俘遼主子秦王許王女額頁等來見奚路都統達蘭攻蘇庫卓琳托紐所部十三巖皆平之又遣奚馬和尚攻薩必達嚕噶并五院司諸部執其節度伊里和勒博為其下所殺辛巳詔諭南京官民六月壬午朔次鴛鴦濼是日棟摩敗張覺于營州丙申上不豫将還上京乃命伊拉齊貝勒宗翰為都統溫貝勒昱徳特貝勒斡魯副之駐兵雲中以備邉己酉次諤都山命驛召安班貝勒烏竒邁七月辛酉次牛山宗翰還軍中八月辛巳朔日有食之乙未次渾河北安班貝勒烏竒邁率宗室百官上謁戊申上崩于布圖濼西行宫年五十六九月癸丑梓宫至上京乙卯𦵏于宫城西南之寕神殿丙辰安班貝勒即皇帝位天㑹三年三月上尊諡曰武元皇帝廟號太祖立原廟于西京天㑹十三年二月辛酉改𦵏和陵立開天啟祚睿徳神功之碑于燕京城南嘗所駐蹕之地皇統四年改和陵曰睿陵五年十月增諡應乾興運昭徳定功睿神荘孝仁明大聖武元皇帝真元三年十一月改𦵏于大房山仍號睿陵贊曰太祖英謨叡略豁達大度知人善任人樂為用世祖隂有取遼之志是以兄弟相授𫝊及康宗遂及太祖臨終以太祖屬穆宗其素志葢如是也初定東京即除去遼法減省租稅用本國制度遼主播越宋納嵗幣以幽薊武朔等州與宋而置南京于平州宋人終不能守燕代卒之遼主見獲宋主被執雖功成于天㑹間而規摹運為實自此始金有天下百十有九年太祖数年之間算無遺䇿兵無留行底定大業𫝊之子孫嗚呼雄哉金史卷二
