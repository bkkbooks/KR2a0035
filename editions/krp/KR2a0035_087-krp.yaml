body:
  text: 金史卷八十七元中書右丞相總裁托克托等修列傳第二十五赫舎哩志寧木名薩哈連布薩忠義本名烏哲圖克坦喀齊喀赫舍哩志寜本名薩哈連上京和坦人也自五代祖太尉罕齊以來與國家世為甥舅父薩巴海陵時賜名懐忠為㤗州路顔河世襲穆昆轉明安嘗為東平尹開逺軍節度使志寧沉毅有大畧娶梁王宗弼女永安縣主宗弼於諸壻中最愛之皇統問為䕶衛海陵以為右宣徽使出為汾陽軍節度使入為兵部尚書改左宣徽使都㸃檢遷樞密副使開封尹契丹薩巴反樞密使布薩呼圖北京留守蕭賾西京留守蕭懷忠皆以征討無功坐誅於是志寧為西北靣副統與都統白彦敬以北京臨潢㤗州三路軍討之志寧至北京而海陵伐宋已渡淮彥敬志寧聞世宗有異志乃隂結㑹寧尹完顔富色里利渉軍節度使通吉義將攻之而世宗已即位使舒穆嚕伊徳伊喇格布來招彦敬志寧殺使者九人世宗使完顔黙音來伐衆不肯戰乃與彦敬俱降世宗問曰正隆暴虐人望既絶朕以太祖之孫即大位汝殺我使者又不能為正隆死節恐為人所圖然後來降朕今殺汝等將何辭彦敬未有以對志寧前奏曰臣等受正隆厚恩所以不降罪當萬死上曰汝軰初心亦可謂忠於所事自今事朕宜勉忠節世宗使扎巴招斡罕扎巴乃勸之遂稱帝世宗使右副元帥完顔黙音征之志寧以臨海節度使都統右翼軍斡罕敗於長濼西走志寜追及於霿􅟶河賊已先渡依岸為陣毁橋岸以為阻志寧與賊夾河為疑兵與萬户𤓰爾佳清臣圖克坦和羅於下流渉渡已渡前有支港岸斗絶中泥濘束栁填藉士卒畢濟行數里得平地將士方食賊奄至賊據南岡三馳下志寧陣陣堅力戰流矢中左臂戰自若賊據上風縱火乘煙勢馳擊志寧歩軍繼至轉戰十餘合火益熾風煙突人不可當會雨作風煙乃熄遂奮擊大破之於是元帥黙音右監軍福夀不急擊賊久無功右丞布薩忠義請自討賊而志寧擊賊有功上以忠義代黙音志寧代福夀封定國公使富察通至軍中宣諭之賊畧懿州界陷靈山同昌惠和三縣睥睨北京㑹土河水漲賊不得渡乃西趨三韓縣志寧方追躡之元帥忠義與賊遇於和托軍頗失利賊見志寧踵其後不敢乘勝遂西走是時大軍馬瘦弱不堪追襲諸將欲止軍勿追志寧獲賊候人知賊自選精鋭與老小輜重分道期山後㑹集可擊其輜重忠義然之遂過伊瑪嶺進及諸爾嶺西陷泉賊見左翼據南岡為陣不敢犯右翼萬户烏雅扎拉擊賊少却志寧與𤓰爾佳清臣等擊之賊大敗渉水走斡罕母蘇尼舉營由羅和岡西去志寧追及之盡獲其輜重俘五萬餘人雜畜不可勝計偽節度使六及其部族皆降斡罕走奚中至七渡河志寧復敗之賊過渾嶺入於奚中志寜獲賊將碩和卓釋弗殺許以官賞縱之歸約以捕斡罕自効碩和卓既去見斡罕秘不言見獲事乃反間奚人於斡罕曰陷泉失利奚人有貳志不可不察當是時斡罕屢敗其下亦各有心碩和卓與賊帥錫勒塔干執斡罕詣右都監完顔思敬降志寧與萬户清臣宗寧酥格等追捕餘黨至燕子城盡得所畜善馬因至茂巴勒達之地悉獲之逆黨既平入朝為左副元帥賜以玉帶經略宋事駐軍睢陽都元帥忠義居南京節制諸軍宋將黄觀察據蔡州楊思據潁昌志寜使完顔王祥復取蔡州黄觀察遯去完顔襄攻潁州抜之獲楊思乃移牒宋樞密使張浚使依皇統以來舊式浚復書曰謹遣使者至麾下議之是時宋得斡罕黨人瓜里扎巴用其謀攻靈壁虹縣都統奚托卜嘉叛入於宋遂陷宿州𤓰里等謀曰北人恃騎射戰勝攻取今夏月久雨膠解弓不可用故李世輔與之來攻宿州歸徳尹珠嘉蘇色宿州防禦使烏凌阿薩喇萬户温特赫蘇赫費摩羅索不守約束不肯堅壁俟大軍輒出與戰由是軍敗城陷薩喇嘗遣人入宋界貿易交通李世輔受其賂遺久之事覺伏誅穆昆賽音坐故知不舉除名托卜嘉母鄂囉羅縁坐當死上曰托卜嘉背國棄母殺之何益朕閔其老遂原其死詔蘇色薩喇蘇赫羅索各杖有差蘇色薩喇仍解職世輔自以為得志日與𤓰里扎巴置酒髙㑹志寧以精兵萬人發自睢陽趨宿州中使來督軍志寧附奏曰此役不煩聖慮臣但恐世輔遯去耳世輔聞志寧軍止萬人甚易之曰當令十人執一人也𤓰里等問候人所見上將旗幟知是志寧謂世輔曰此薩哈連監軍也軍至萬人慎毋輕之五月二十日志寧將至宿州仍令從軍盡執旗幟駐州西為疑兵三明安兵駐州南志寧自以大軍駐州東南扼其歸路世輔望見州西兵旌旗蔽野果謂大軍在州西而謂東南兵少不足慮先擊之以步騎數萬皆執盾背城為陣外以行馬捍之使别將將兵三千出自東門欲自陣後攻志寧軍萬户芬徹擊敗之右翼萬户𤓰爾佳清臣為前行毁行馬短兵接戰世輔軍亂諸將乘之追殺至城下是夕世輔盡按敗將將斬之其統制常吉懼而來奔盡得城中虛實明日世輔悉兵出戰騎兵居前乃使𤓰爾佳清臣當之世輔别將以五六千騎為一隊與清臣遇清臣踵擊之宋將不能反斾志寧麾諸軍力戰世輔復大敗走者自相蹈藉僵尸相枕爭城門而入門塡塞人人自阻遂緣城而上我軍自濠外射之往往墮死隍間殺騎士萬五千步卒三萬餘人世輔乗夜脱走明日𤓰爾佳清臣張師忠追及世輔斬首四千餘赴水死者不可勝計獲甲三萬他兵仗甚衆上以御服金線袍玉吐鶻賔鐵佩刀使伊喇道就軍中賜之凡有功將士明安穆昆並如陜西遷賞佛寧進官三階重綵三端絹六匹旗鼓笛手吏人各賜錢十貫詔志寧曰卿雖年少前征契丹戰功居最今復破大敵朕甚嘉之宋人議和不能决都元帥布薩忠義移軍泰和志寧移軍臨渙遂渡淮圖克坦克寧取盱眙濠廬和滁等州宋人懼决意請和使者六七往反議遂定宋世為姪國約嵗幣二十萬兩匹魏杞奉誓書入見復通好志寧還軍睢陽上以御服玉佩刀通犀御帶賜之詔曰靈壁虹縣宿州兵士死者朕實閔焉宜歸葬郷里官為齎送人賻錢三十貫鳯翔尹富珠哩定方以下明安穆昆官為致祭定方賻銀五百兩重綵二十端明安三百貫穆昆二百貫富埒琿一百貫權明安二百貫權穆昆一百五十貫權富埒琿七十貫五年三月忠義朝京師志寧駐軍南京五月志寧召至京師拜平章政事左副元帥如故志寧復還軍賜玉束帶上曰卿壯年能立功如此朕甚嘉之南服雖定日月尚淺須卿一往規畫六年二月志寧還京師拜樞密使七年十一月八日皇太子生日宴羣臣於東宮志寧奉觴上壽上悅顧謂太子曰天下無事吾父子今日相樂皆此人力也使太子取御前玉大杓酌酒上手飲志寜即以玉杓及黄金五百兩賜之以第十四女下嫁志寧子諸神努八年十月進幣宴百官于慶和殿皇女以婦禮謁見志寧夫婦坐而受之歡飲終日夜久乃罷九年拜右丞相十一年代宗叙北征既還遣使者迎勞賜以弓矢玉吐鶻入見上慰勞良久是日封廣平郡王復遣使就第慰勞之皇太子生日宴羣臣於東宮以玉帶賜志寧上曰此梁王宗弼所服者故以賜卿郊祀覃恩從征䕶衞皆有賜進封金源郡王十二年志寧有疾中使看問日三四輩疾亟賜金丹三十粒詔曰此丹未嘗以賜人也使者至志寧已不能言但稽首而已是嵗薨上輟朝臨其喪行哭而入哀動左右將𦵏上致祭見陳甲柩前復慟哭之賻銀千五百兩重綵五十端絹五百匹葬事祠堂皆從官給諡武定十五年圖像衍慶宮志寧妻永安縣主妬甚嘗殺孕妾及志寧薨後諸神努兄弟皆病亡世宗甚惜之遣使諭永安縣主曰丞相有大功三先朝舊臣惟秦宋二王功大餘不及也今養其孽子當如親子視之二十二年上問宰臣布薩忠義赫舎哩志寧孰愈尚書左丞襄奏曰忠義兵權精緻此其所長也上曰不然志寧臨敵身先士卒勇敢之氣自太師梁王未有如此人者也明昌五年配享世宗廟廷布薩忠義本名烏哲上京博勒和河人宣獻皇后姪元妃之兄也高袓斡喇布曾袓璸都祖呼蘭父博羅國初世襲穆昆博索路統軍使致仕忠義魁偉長髯喜談兵有大略年十六領本穆昆兵從宗輔定陜西行間射中宋大將宋兵遂潰由是知名帥府錄其功承制署為穆昆宗弼再取河南表薦忠義為明安攻冀州先登攻大名府以本部兵力戰破其軍十餘萬賞以奴婢馬牛金銀重綵從宗弼渡淮攻壽廬等州宗弼稱之曰此子勇略過人將帥之器也賞馬五匹牛一百五十頭羊五百口領親軍萬戸超寧逺大將軍承其父世襲穆昆皇統四年除博州防禦使公餘學女直字及古算法閱月盡能通之在郡不事田獵燕游以職業為務郡中翕然稱治忽一夕隂晦囚徒謀為反獄倉猝間將校皆惶駭失措忠義從容但使守更吏撾皷鳴角囚徒以為天且曉不敢出自就桎梏及考郡民詣闕願留詔從之八年改同知真定尹兼河北西路兵馬都總管遷西北路招討使入為兵部尚書布薩呼圖嘗與海陵簒立恃勢陵傲同列忠義因㑹飲衆辱之海陵不悦出為震武軍節度使火山賊李鐵槍乗暑來攻忠義單衣從一騎迎擊之射殺數人賊乃退改臨洮尹兼熙秦路兵馬都總管海陵召至京師謂之曰洮河地接吐蕃木波異時剽害良民州縣不能制汝宿將故以命汝賜絛服玉具佩刀閲再考徙平陽尹再徙濟南尹以本官為漢南路行營副統制伐宋克通化軍世宗立海陵死揚州罷兵入朝京師拜尚書右丞伊喇斡罕僣號兵久不決右副元帥完顔黙音既敗之于霿􅟶河乃擁衆貪鹵掠不追討而縱其子色克暴横軍中士卒不用命賊得水草善地官軍踵其遺餘水草乏馬益弱賊軼出山西久無功忠義請曰契丹小冦不時殄滅致煩聖慮臣聞主憂臣辱欲願効死力除之世宗大悦即召還黙音勒歸色克本貫拜忠義平章政事兼右副元帥封榮國公賜以御府貂裘賔鐵吐鶻弓矢大刀具裝對馬及安山鐵甲金牌詔曰軍中將士有犯連職之外並以軍法從事有功者依格遷賞詔諸將士曰兵久駐邊陲蠧費財用百姓不得休息今以右丞忠義為平章政事右副元帥宜同心戮力無或弛慢忠義至軍賊陷靈山同昌惠和等縣陣而西行忠義追之及于和托宗亨為左翼宗叙為右翼與賊夾河而陣賊渡河先攻左翼偏敗右翼救之賊引去斡罕乃以精銳自隨以羸兵䕶其母妻輜重由别道西走期山後㑹集追復及于諾爾嶺西陷泉與賊遇時昏霧四塞跬步莫覩物色忠義禱曰狂宼肆暴殺戮無辜天不助惡當為開霽奠已昏霧廓然及戰忠義左據南岡為偃月陣右迤而北大敗之獲其弟諾爾俘生口三十萬獲雜畜十餘萬車帳金珍以鉅萬計悉分諸軍賊走趨奚地遣將追躡至七渡河又敗之既踰渾嶺復進軍襲之望風奔潰遁入奚中降者相屬於路詔忠義曰卿材能表著果能大破賊衆朕甚嘉之今遣勞卿如朕親往賜卿御衣果勒圖犀具佩刀通犀帶等就以俘獲均散軍士斡罕既敗遂入于奚中高忠建敗奚于栲栳山伊喇道取茂巴爾諸奚之家茂巴爾奚乃降斡罕勢益弱赫舎哩志寧獲賊將碩和卓縱使歸約以捕斡罕自贖許以官賞碩和卓與其黨執斡罕詣完顔思敬降契丹平忠義朝京師拜尚書右丞相改封沂國公以玉帶賜之自海陵遇弑大軍北還而斡罕鴟張命將徂征及斡罕敗其黨瓜里扎巴奔入于宋宋人用其謀侵掠邊鄙攻取泗壽唐海州於是宋主傳位于宗室子眘是為宋孝宗雖嘗遣使來而欲用敵國禮世宗以赫舍哩志寧經略宋事制詔忠義以丞相總戎事居南京節制諸將時大定二年也忠義將行陛辭上諭之曰彼若歸侵疆貢禮如故則可罷兵既至南京簡閱士卒分屯要害戒諸將嚴守備使左副元帥志寧移牒宋樞密使張浚其略曰可還所侵本朝内地各守自來畫定疆界凡事一依皇統以來舊約帥府亦當解嚴如必欲抗衡請㑹兵相見宋宣撫使張浚復書志寧曰疆場之一彼一此兵家之或勝或負何常之有當置勿道謹遣官寮敬造麾下議之是時已復泗壽鄧州請隳其城遷其民于宿亳蔡州上曰三州本吾土也得之則已忠義使將士擇善水草休息且牧馬俟來嵗取淮南初世宗詔諸將由泗壽唐鄧三道進發宋人聞之即自方城葉縣以來田野皆燒夷之使無所芻牧忠義命唐鄧道軍芻牧許汝間三年忠義入奏事遂以丞相兼都元帥無何還軍中忠義與宋相持日久慮夏久雨弓力易减宋或乗時見攻豫選勁弓萬張於别庫及自汴赴闕議事次濬州宋將李世輔果掩取靈壁虹縣遂陷宿州忠義使人還汴發所貯勁弓給志寧軍與宋人戰遂大捷竟復宿州忠義還以書責宋宋同知樞密院事洪遵計議官盧仲賢遣使二輩持與志寧書及手狀歸海泗唐鄧州所侵地約為叔侄國報書期十一月使入境宋又使人來言禮物未備請俟十二月行成忠義以其事馳奏請定書式且言宋書如式則許其入界如其不然勢須遣還本國復禀其主若是往復動經七八十日恐誤軍馬進取世宗以詔諭之曰若宋人歸疆嵗幣如昔可免奉表稱臣許世為侄國忠義乃貽書宋人前後凡七宋人他託未從忠義移大軍壓淮境遣志寧率偏師渡淮取盱眙濠廬和滁等州宋人懼而世宗意天下厭苦兵革思與百姓休息詔忠義度宜以行四年正月忠義使右監軍宗叙入奏將近暑月乞俟秋凉進發詔從之宋使胡昉以右僕射湯思退書來宋稱姪國不肯加世字忠義執昉留軍中答其書使使以聞詔曰行人何罪遣胡昉還國邊事從宜措畫八月詔忠義曰前請俟秋凉進發今已八月復俟何時先是忠義乞增金銀牌上曰太師梁王兼數職未嘗增也至是增都元帥金牌一銀牌二十左右副元帥金牌各一銀牌各十左右監軍金牌各一銀牌各六左右都監金牌各一銀牌各四三路都統府銀牌各二乃定南界官員百姓歸附遷賞格元帥府獲宋諜人符忠忠前嘗至中都大興府官詰問忠執文據及與泗州防禦判官張徳亨知識由是獲免厚謝徳亨徳亨受之忠具欵服奏其事于朝於是大興少尹王全解職徳亨除名和議始于張浚中更洪遵湯思退及圖克坦克寧敗宋魏勝于十八里莊取楚州世宗下詔進師於是宋知樞密院周葵同知樞密院事王之望書一一如約和議始定宋遣試禮部尚書魏杞崇信軍承宣使康湑充通問國信使取到宋主國書式并國書副本宋世為姪國約嵗幣為二十萬兩匹國書仍書名再拜不稱大字大定五年正月魏杞康湑入見其書曰姪宋皇帝眘謹再拜致書于叔大金聖明仁孝皇帝闕下魏杞還復書叔大金皇帝不名不書謹再拜但曰致書于姪宋皇帝不用尊號不稱闕下和好巳定罷兵詔天下以左副都㸃檢完顔仲為報問國信使太子詹事楊伯雄副之忠義奏官軍一十七萬三千三百餘人留馬步軍一十一萬六千二百屯戍上曰今已許宋講好而屯戍尚多可除舊軍外選馬一萬二千伊勒希稱是歩軍虞候司軍共選一萬五千及簽軍一萬與舊軍通留六萬富强丁多者摘留貧難者伊勒希官給富者就用其奴其存留馬歩軍於河北東西太名府率賓呼爾哈㑹寧咸平府濟州東京哈斯罕等處軍内約量揀取其西南西北招討司臨潢府㤗州北京博索海蘭山東東西路並行放還詔近侍局使費摩子寧佩金牌䕶衛綽台符寳祗候圖匹輝罕佩銀牌諭諸路將帥以宋國軍到嵗幣銀絹二十萬兩匹盡數給與見存留及放散軍充賞曾過界者人給絹二匹銀二兩不曾過界者銀二兩絹一匹伊勒希絹一匹穆昆倍軍人明安倍穆昆押軍明安穆昆年老有勞績者量與除授又詔曰其令一路全罷者先發遣之賜忠義玉束帶三月詔曰如大軍己放還丞相忠義宜先還左副元帥志寧右監軍宗叙留駐南京餘官非急用者並勒還任忠義朝京師上勞之曰宋國請和偃兵息民皆卿力也拜左丞相兼都元帥大定初事多權制詔有司刪定上謂宰臣曰凡已奏之事朕嘗再閲卿等毋懷懼朕於大臣豈有不相信者但軍國事不敢輕易恐或有誤也忠義對曰臣等豈敢竊意陛下但智力不及耳陛下留神萬幾天下之福也大定六年正月忠義有疾上遣太醫診視賜以御用藥物中使撫問相繼於道是月薨上親臨哭之慟輟朝奠祭賻銀千五百兩重綵五十端絹五百匹世宗將幸西京復臨奠焉命參知政事唐古安禮䕶喪事凡葬祭從優厚官為給之大宗正丞竟充勑祭使中都轉運副使王震充勑葬使百官送葬具一品儀物建大將旗鼔送至墳域諡武莊忠義動由禮義謙以接下敬儒士與人極和易侃侃如也善御將士能得其死力及為宰輔知無不言自漢唐以來外家多緣恩戚以致富貴又多不克其終未有兼任將相功名始終如忠義者十一年詔曰故左丞相忠義族人及昭徳皇后親族人才可用者左副㸃檢烏庫哩元忠體察以聞二十一年上思忠義功勒銘墓碑㤗和元年圖像衍慶宫配享世宗廟廷子揆别有傳圖克坦喀齊喀上京速蘇海水人父佛寧襲明安喀齊喀魁偉膂力過人經閒見終身不忘天輔間從金源郡王羅索為章京甚愛之天㑹六年以功為穆昆㝷領羅索親管明安元帥府聞其才命權左翼軍事皇統二年為隴州防禦使以兵十五人敗宋兵二百於髙陵以兵五百人敗宋兵二千於秦州以兵八百人敗宋兵三千五百於鳯翔以二穆昆拒饒風闗宋兵二千來奪其闗口奮擊敗之諸軍乃得過險遷平凉尹再徙臨洮延安尹是時闗陜以西初去兵革百姓失業喀齊喀守之以靜民多還歸者天徳二年為元帥左都監陜西統軍使貞元二年以本官兼河中尹正隆六年為西蜀道兵馬都統世宗即位手詔賜喀齊喀曰岐國失道殺其母后横虐兄弟流毒兆庶朕惟太祖創業之艱難勉膺大位卿之子弟皆自軍中來歸卿國家舊臣豈不知天道人事卿軍不多未宜深入當領軍屯境上浹右重地非卿無能措畫者俟兵革既定即當召卿宜自勉之大定二年復為陜西路統軍使未幾改元帥右都監表陳伐宋方略詔許以便宜從事轉左都監破宋兵於華州是時宋呉璘侵古鎮分據散闗和尚原神义口玉女潭大蟲嶺石壁寨寳鷄縣兵十餘萬陷河州鎮戎軍喀齊喀乞濟師詔益河南兵萬人喀齊喀遣丹州刺史持嘉烏蘇埓克以兵四千守徳順呉璘以二十萬人圍之統軍都監舒穆嚕迪里將萬人破宋兵於河州還過徳順駐兵平凉求益兵於喀齊喀以解徳順圍喀齊喀遣萬户完顔實訥埓大良順寧州刺史延扎們都各將本部兵合二萬人以順義軍節度使烏雅富埒赫統之與迪里㑹呉璘聞之使偏將將兵五千人來迎前鋒都爾蘇烏頁奚王和尚擊敗之追至徳順城南小溪邉璘自將大軍蔽岡阜而出烏頁等馳擊之迪里富埒赫繼至併力戰日已暮兩軍不相辨乃解已而璘報云宋主遣使至兩國講和請各罷兵璘遂遁去富埓赫亦引軍還自宋兵圍城至是凡四十餘日乃解初徳順在圍中押軍明安温都富勒哈身先士卒力戰未嘗少挫及救兵至圍解富勒哈之功為多頃之呉璘復來犯陜西州郡兵十餘萬詔以兵七千益喀齊喀兵號二萬慶陽尹烏雅普轄努延安尹髙景山分領之彰化軍節度使璋通逺軍節度使烏雅沃哩布寜州刺史伊喇髙善努京兆少尹宗室聶赫恩州刺史完顔摩囉歡皆備軍前任使宋人驅率商虢及華山南山之民五萬人來圍華州押軍萬户費摩蘇拉欲堅壁守之明安伊喇薩爾拉曰宋兵雖多半是居民不習戰不如擊之於是蘇拉以騎兵千人敗宋前鋒追至其大軍亦敗斬首五十餘級已而璋敗宋姚良輔軍於原州宋戍軍自寶鷄以西至於大蟲嶺皆自散闕遯去頃之璘聞持嘉烏蘇埓克烏雅富埓赫軍已去徳順率兵號二十萬復據徳順陷鞏州臨洮府臨洮少尹赫舍哩薩恰死之詔贈官一階賜錢五百貫喀齊喀以璋權都統實訥埓權副統將兵二萬攻之連戰宋兵雖敗璘恃衆不肯去分其兵之半守秦州喀齊喀自行駐水洛城東自六盤山西抵石山頭分兵守之當徳順秦州之兩間斷其餉道璘乃引去都統璋副統實訥埓邀擊宋經略使荆臯自上八節至甘谷城殺數千人實訥埒擒宋將朱永以下將校十二人宋張安撫守徳順亦棄城遯烏蘇埓克擊之所殺過半擒將校十餘人遂復徳順州宋之守秦州者亦自退髙景山定商虢宗室聶赫取環州於是臨洮鞏秦河隴蘭㑹原洮積石鎮戎徳順商虢環華等州府一十六盡復之陜西平詔書奬諭賜以玉帶詔陜西將士明安階昭毅以下遷兩資昭武以上遷一資穆昆階六品以下遷兩資五品以上遷一資押軍明安階昭武以上者遷一資昭毅以下武義以上遷兩資昭信以下女直人遷宣武餘人遷奉信無官者女直人授敦信餘人授忠武押軍穆昆武功以下忠顯以上遷兩資忠勇以下女直人遷昭信餘人遷忠顯無官者女直人授忠顯餘人授忠翊正軍有官者遷一資無官者授兩資明安賞銀五十兩重綵五端絹十權正同之正軍人給錢三十貫伊勒希十貫戰没軍官軍士長行贈官賜錢有差五年置陜西路統軍使兼京兆尹元帥府移治河中府統軍使璋朝辭上曰喀齊喀年老以陜西軍事委卿鎮防利害可訪問喀齊喀七年入為樞宻副使改東京留守賜以衣帶佩刀詔曰卿年老以此職優佚宜勉之九年入為平章政事奏睿宗收復陜西功數事上嘉納之藏之秘府封定國公十年薨上方擊毬聞訃遂罷有司致祭備禮以葬賻銀一千二百五十兩及重綵幣帛二十一年上念其功遷其孫薩哈武功將軍授世襲本明安海蘭烏克新穆昆㤗和元年配享世宗廟廷贊曰大定之初兵連於江淮難作於契丹黙音挾功斡罕横噬有弗戢之畏焉世宗獨斷召還黙音布薩忠義受任責成矣故曰兵主於將將賢則士勇其此之謂耶赫舍哩志寧有言受詔征伐則不敢辭為宰相則誠不能如知為相之難固所謂賢也秦隴之兵殆哉岌岌乎圗克坦喀齊喀料敵應變若此之審亦難矣哉金史卷八十七
