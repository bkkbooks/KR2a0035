body:
  text: 金史卷八十一元中書右丞相總裁托克托等修列傳第十九赫木頗徳克徳額圖琿𤓰爾佳實訥珠勒根穆都哩洪果達呼布富察和珍𤓰爾佳沃哩布王伯龍髙彪本名昭和碩溫特赫富拉塔伯特徳哩布耶律懐義本名伯特蕭旺嘉努田灝趙隇赫木頗珠卜竒水錫黙部人性忠直寛厚重節義勇於戰父阿古圖贈金吾衛上將軍穆宗時赫木頗内附先遣子寧嘉從間道送欵遂使和勒端與赫木頗合軍攻降諸部因領其衆與弟和摩爾噶歡塔姪阿里攻下諸城從薩哈破烏塔城穆宗屢賞之破髙麗戍兵與碩碩歡討平諸部富察部雅里貝勒與其兄弟和拜松科等欲叛歸遼赫木頗執之送於康宗賜賚甚厚破髙麗海蘭甸及下托囉城有功天輔六年卒年七十二天眷中贈銀青光禄大夫徳克徳温特赫部人祖哲克訥父阿古岱世為和掄水部長徳克徳年二十餘代領父穆昆攻寧江州敗遼援兵獲甲馬財物攻破奚營回至韓州遇敵二千人擊走之烏楞古與遼人戰於咸州兵已却徳克徳以本部兵力戰諸軍復振遂大破之呼岱巴岡之役伊里布貝勒陷敵中徳克徳援出之攻黄龍府身被數創授明安天輔七年從上至山西病卒年四十七天眷中贈光禄大夫額圗琿溫特赫部人年十七從薩哈威㤗等討平諸部皆身先力戰高麗築九城于海蘭甸烏色禦之額圖琿為前鋒高麗有屯于海島者額圗琿率衆三十人夜渡焚其營栅戰艦大破之遂下圖吉城既而八城皆下功最遼兵自寧江州東門出額圖琿逆擊之盡殪以功授穆昆從攻黄龍府力戰身被數十創竟登其城後與鄂蘭沙津援昭蘓城額圖琿請乘不備急擊之遂夜過伊圖水詰朝大敗之斡魯上其功賜幣與馬天輔四年五月疾病賜良馬一匹詔曰汝安則乘之年六十五卒上悼惜之遣使弔祭以馬為贈額圗琿為人孝悌好施惠健捷善弋獵至角觝擊鞠咸精其能𤓰爾佳實訥隆州納爾琿河人也國初祖阿哈率所部來歸獻器用甲仗父布爾噶蘓襲本部貝勒從太祖伐遼授世襲明安親管穆昆為海蘭路都統實訥其長子也長身多髯善騎射通女直契丹大小字及漢字既冠隨其父見太祖命佩金牌總領左翼䕶衛西京未下實訥獲城中生口乃知城中潛遣人求救於外都統府得為之備却其救兵西京乃下自燕京還過盤尼納之地遇敵於隘實訥身先士卒射死敵中先鋒二人敵潰走總管富勒呼以甲及馬贈之後領其父明安從攻和尚原出仙人闗宋兵據險明安綽爾齊突戰不克實訥選麾下五十人戰克之與呉玠相拒烏哩雅行陣不整呉玠乗之實訥領兵逆戰遂大破敵計前後功襲其父明安穆昆宗弼復取河南陜西宋人欲潛兵襲取石閏諸營實訥自渭南大禹鎮掩其伏兵射中其軍帥宋兵敗走多獲旗幟兵仗帥府厚賞之除華州防禦使入為工部侍郎遷本部尚書改平凉尹昭義軍節度使大定初卒珠勒根穆都哩上京納琳河人也後徙咸平路梅赫河雄偉美鬚髯勇毅善射國初伐遼穆都哩在軍中領穆昆明安每遇敵往來馳突人莫敢當故所戰皆克皇統元年計功擢宣威將軍明年授同知通逺軍節度使改伊埒圖乣詳衮授世襲本路音逹琿河穆昆為滑州刺史改肇州防禦使扶餘路節度使遷驃騎上將軍是嵗以年老致仕卒累官金吾衛上將軍年七十三洪果逹呼布世居錫馨水從破寧江取咸州平東京路及諸山寨柵皆有功從瑪竒破遼將和尚節使兵七千於上京復破納延軍二萬再從瑪竒遇敵於阿林甸瑪竒被創不能戰逹呼布率兵擊敗之𠞰殺殆盡從攻回鶻城破其兵九萬敗瑪爾戩直薩兵於山後俘獲甚衆敗扎古雅之兵三千獲其家屬而還攻平州張覺烏春被圍於西山逹呼布引兵救之解其圍并獲糧五千斛招降户口甚衆從平興中撫安其民人天會間大軍伐宋逹呼布從取濬開徳大名及取濟南髙唐棣密等州皇統間以功襲穆昆移屯於夀光縣界為千户六年授世襲千户棣州防禦使卒富察和珍按春水人也年十八從軍其父塔斯死襲為穆昆天輔間夏以兵三萬出天徳路和珍從羅索迎戰以兵三百敗敵二千天㑹三年大軍攻太原城中出兵萬餘來戰和珍以所領千户軍擊之復敗敵兵三萬餘於榆次境六年從羅索攻京兆以所部兵屢與宋人接戰皆先登有功七年取邠州遇宋人二十餘萬我軍右翼少却時和珍為左翼千户摧鋒陷陣敵遂敗去敗張浚富平復有功十二年擊闗師古於臨洮衆三萬餘從攻涇州從破徳順秦鞏臨洮河蘭等州破呉璘兵和珍皆有力焉授徳順州刺史改隴州防禦使鳯翔尹卒年五十五𤓰爾佳沃哩布南圖琿河人徙天徳父温屯討烏春烏木罕有功沃哩布𨽻羅索帳下攻係遼女直招降達哈藩昭蘇等從羅索救烏楞古於咸州敗遼兵於雅勒呼城遼軍營遼水沃哩布五穆昆軍乘夜擊之遼軍潰殺獲幾盡斡魯伐高永昌沃哩布以數騎分擊於遼水上復以四十騎伏於津要遇其候騎擊之獲生口因盡知永昌虛實太祖嘉之賞奴婢八人永昌駐軍於兎兒陁先據津要軍不得渡沃哩布與薩巴射殺其先鋒二人永昌衆稍却大軍遂渡遼水及攻廣寧軍帥選勇士先登沃哩布與持嘉和木歡各領所部突入其陣大軍繼之遂拔廣寧太祖攻臨潢沃哩布面被重創奮擊自若賞以遼宫女二人遼王杲已取中京沃哩布以四十騎覘敵獲遼喉舌人因知遼主所在後從都統斡魯定雲中從宗翰屯應州遼軍在近境沃哩布以所部擊敗之宗望伐宋宋安撫使蔡靖詣沃哩布降羅索攻陜西諸郡往往復叛沃哩布攻敗之敗張浚軍於富平沃哩布先登睿宗賞以金器名馬遂以先鋒攻蘭州下其城加昭武大將軍授世襲明安累官布塔布部族節度使以老致仕封芮國公沃哩布多智畧膂力過人雖甚老勇健不少衰大定初劇賊嘯聚出特布闗沃哩布率鄉里年少逆擊之賊黨遂潰事聞賞賫甚厚大定二十六年卒一百有五嵗王伯龍瀋州雙城人也遼未聚黨為盗天輔二年率衆二萬及其輜重來降授世襲明安知銀州兼知雙州三年太祖攻臨潢伯龍與韓慶和以兵䕶糧餉輓夫千五百人皆授甲慶和已將兵行前伯龍從糧居後遇遼兵五千餘邀於路伯龍率輓夫擊敗之獲馬五十匹四年從攻下中京并克境内諸山寨為静江軍節度留後五年真授節度使從宗望討張覺於平州伯龍先登馳擊手殺數十百人遷右金吾衛將軍白河之戰伯龍當其左軍麾兵疾馳蹂之宋軍亂我師乘勝奮擊敗之宗望伐宋伯龍為先鋒次保州遇敵五萬破之招降新樂軍民十餘萬大軍圍汴宋太尉何㮚以軍數萬出酸棗門伯龍以本部遮擊多所斬獲及破汴伯龍以治攻具有功進破孔彦舟酈瓊衆三萬於洺州是年同知保州兵馬安撫司事將兵數千攻北平拔之復取保州河問睿宗經畧山東伯龍從攻青州未下城中夜出兵襲伯龍營伯龍不及甲獨披衣挺刃拒營門敵不得入因奮擊殺數十人已而軍士皆甲出殺傷宋兵不可勝計并獲其一將斬之及下青州第功伯龍第一六年還攻莫州降之加太子少保莫州安撫使破李固寨衆十餘萬於濮州濮城守城中鎔鐵揮我軍攻之不能剋伯龍被重甲首冠大釡挺槍先登殺守陣者二十餘人大軍相繼而上遂剋之進攻徐州伯龍復先登充徐宿邳三路軍馬都統敗髙托山之衆十五萬餘於清河進擊韓世忠於邳州走之與大軍㑹於宿遷追世忠至揚州還攻泗州泗州守將以城降屯軍嵫陽破陳宏賊衆四十餘萬破黄戩於單州進攻歸徳軍帥遣伯龍立攻具伯龍從二十餘騎行視地形城中忽出兵千餘欲生得伯龍伯龍縱騎馳之敵兵亂墮隍而死者幾二百人破王善之衆於巢縣取廬州和州伯龍之功多軍渡采石擊敗岳飛劉立路尚等兵獲芻糧數百萬計還過真揚道遇酈瓊韓世忠軍復戰敗之復為莫州安撫改知澤州太行羣賊徃徃嘯聚伯龍皆平之天眷元年為燕京馬軍都指揮使從元帥府復收河南權武定軍節度使兼本路都統宋兵據許州伯龍擊走之招復其人民是年秋泰安卒徒張貴驅脅良民據險作亂伯龍討平之皇統元年以本部從宗弼南伐攻破濠州而還三年為武定軍節度使改延安尹寧昌軍節度使天徳三年改河中尹徙益都尹封廣平郡王卒年六十五正隆間例贈特進定國公髙彪本名昭和碩辰州渤海人祖安國遼興辰開三鎮節度使父禄格左承制官至刺史彪始生其父用術者言為其時日不利於已欲不舉其母為營䕶居數嵗竟逐之彪匿於外家遼人調兵東京時禄格已老當從軍悵然謂所親曰吾兒若在可勝兵矣所親具以實告因代其父行戰於珠赫店遼兵敗走彪獨力戰軍帥見之曰此勇士也令生致之斡魯攻東京禄格率其鄉人迎降以為榆河州千户久之告老彪代領其衆都統杲攻中京彪領穆昆從斡魯破遼將克爾叟及韓慶民於髙惠之境已而駐軍武安克爾叟以勁兵二萬來襲從斡魯出戰與所部皆去馬先登奮擊敗之奚人負險拒命所在屯結彪屢戰有功宗望攻平州彪徇地西北道破敵招降石家山寨再從宗望伐宋為明安師次真定彪率兵士七十人臨城築甬道城中夜出兵焚攻具彪撃走之大軍圍汴以五十騎屯於東南水門宋人再以重兵出戰彪皆敗之師還屯鎮河朔復破敵於霸州擒其禆將祝昂河間夜出兵二萬襲我營壘彪率三穆昆兵擊敗之天㑹五年授静江軍節度使夀州刺史明年伐宋從帥府徇地山東攻城克敵數被重賞七年師至睢彪以所部招誘京西人民次柘縣其官吏出降彪獨與五十餘騎入城繼而城中三千餘人復叛彪率其衆力戰敗之撫安其民而還從梁王宗弼襲康王至杭州師還宋將韓世忠以戰艦數百拒於江北宗弼引而西將至黄天蕩敵舟三十餘來逼南岸其一先至者載兵士二百餘彪度垂及以鈎拽之率勇士數十躍入敵舟所殺甚衆餘皆逼死於水中明年從攻陜西師至寧州彪與宗人昂率兵三千取廓州始至有來降者言城東北隅守兵將謀為内應彪即夜從家奴二人以登左右守者覺之彪與從者皆殊死戰諸軍繼進遂克其城從攻和尚原及仙人闗與阿里監䕶漕糧并戰艦至亳州宋人以舟五十艘阻河路擊敗之擒其將蕭通擊漣水賊水寨進取漣水軍其官民已遁去悉招降之彪勇健絶人能日行三百里身被重鎧歴險如飛及臨敵身先士卒未嘗反顧大小數十戰率以少擊衆無不勝捷齊國既廢攝滕陽軍以東諸路兵馬都統撫諭徐宿曹單滕陽及其屬邑皆按堵如故為武寧軍節度使頗黷貨嘗坐贓海陵以其勲舊杖而釋之改忻州防禦使歴安化安國武勝軍節度使遷行臺兵部尚書改京兆尹封郜國公以憂去官起復為武定軍節度使歸徳尹正隆例授金紫光禄大夫久之致仕復起為樞密副使舒國公賜名彪卒年六十七諡桓壯彪性機巧通音律人無貴賤皆溫顔接之溫特赫富拉塔隆州伊蘭明安噶勒珠寨人也魁梧美髯有謀畧以智勇聞都統杲取中京富拉塔權明安領軍五千遇契丹賊萬餘與戰敗之出恭古魯道敗敵八千餘至拉們華道復以伏兵敗敵萬人太祖定燕自儒州至居庸闗執其喉舌人有頃賊三千餘人復冦拉們華道富拉塔整隊先登賊識其旗幟望風而遁遂奮擊之親執賊帥皇統元年從梁王宗弼伐宋留軍唐州敵衆奄至富拉塔擊之大名軍萬四千號二十萬富拉塔率親管明安身先士卒衝擊敵少却乃張左右翼併擊之敵衆散走而别遇兵二萬來援復以兵三千擊走之時邳州土賊嘯聚幾二十萬富拉塔軍三千分為數隊急攻之賊潰去南京路遇敵軍二萬冨拉塔以軍三千擊敗之是日有兵自城中出者復擊敗之皇統二年遷定逺大將軍同知鳯翔尹六年改京兆尹轉寧州刺史改西北路招討都監遷永定軍節度使海陵南征改武衛軍都總管大定三年授開逺軍節度使改㤗寧軍卒十九年以功授其子烏達武功將軍本明安希楚哈世襲穆昆伯特徳哩布奚五王族人也遼御院通進天㑹初與父托卜嘉歸朝授世襲穆昆後以京兆尹致仕徳哩布招降松山等州未附軍民及招降平州薊州境内督之耕作宗望伐宋徳哩布為軍馬明安與諸將留規取保遂安三州攻安肅軍河間雄保等兵十餘萬來救徳哩布率所部先戰大軍繼之大破其兵遂拔安肅徳哩布攝通判事降將胡愈陰結衆謀亂徳哩布勒兵擒愈及其衆五十餘人安肅軍改為州就除同知州事改磁州捕獲太行羣盗元帥府以磁相二州屯兵屬之擒王㑹孫小十苗清等羣盗遂平遷濵州刺史亷入優等以母憂去官起復本州改涿州刺史入為工部郎中從張浩營繕東京宫室及田瑴黨事起朝省為之一空徳哩布攝行六部事遷大理卿出為同知東京留守天徳三年復為大理卿同知南京留守丁父憂起復洺州防禦使正隆盗起州縣無兵不能禦洺舊有河附於城下徳哩布乃引水注濠中以為固盗弗能近州頼以安遷崇義軍節度使未幾告老歸田里卒徳哩布為人孝謹為政簡静不積財常曰俸禄己足養亷衣食之外何用蓄積凡調官行李止車一乗婢僕數人而已耶律懷義本名伯特遼宗室子年二十四以戰功累遷同知㸃檢司事宗翰已取西京遼主謀奔於夏懷義諫止之不見聴乃竊取遼主廐馬來降太祖自燕還師留宗翰斡魯經畧西方懷義領穆昆從軍天㑹初帥府以新降諸部大小逺近不一令懷義易置之承制以為西南路招討使乃擇諸部衝要之地建城市通商賈諸部兵革之餘人多匱乏自是衣食嵗滋畜牧蕃息矣從宗翰伐宋降馬邑破鴈門屯兵進攻太原以所部别降清源縣徐溝鎮遂與諸將别屯汾州之境時河東陜西路兵來救太原劉光世折可求柵於文水西山懷義捕得生口盡知宋兵屯守要害乃分兵襲敗之明年再伐宋從羅索取汾州及其屬邑遂過平陽出澤潞以趨河陽所至皆降及大軍圍汴懷義屯京西汴城既下宋兵之出奔者邀擊盡之從攻鄭鄧州及討平鄭州叛者攻下濮州及雷澤縣從破大名東平府徐兖等州皆有功七年還鎮十年加尚書左傼射改西北路招討使懷義在西陲幾十年撫御有恩及去老幼遮道攀戀數日不得發天眷初為太原尹治有能聲改中京留守從宗弼過烏納水還中京以老乞致仕不許改大名尹命不赴治所止以俸傔給之每嵗春水扈從餘聴自便明年再請老得謝給俸傔之半海陵即位封漆水郡王進封莘王久之進封蕭王正隆例封景國公其子錫勒塔干為西北路招討都監迎侍之官錫勒塔干從海陵南征懷義卒於雲中年八十二蕭旺嘉努奚人也居奎騰河為人魁偉多力未冠仕遼為太子率府率天輔七年都統杲定奚地旺嘉努率其鄉人來降命為千户領之奚王和勒博既死其親黨徹辰阿固齊猶保撒葛山旺嘉努與突撚徃討之生擒徹辰阿固齊降其餘衆時平灤多盗旺嘉努以所部屢破賊兵斬􅀈執俘數被賞賚宗望伐宋敗郭藥師於白河亦與有功至河上宋兵扼津要與諸將擊敗之進圍汴破其東門兵明年再伐宋宗望軍至中山諸門分兵出戰焚我攻具祈州河間各以兵來援皆敗之師還屯鎮河朔濵州賊葛進聚衆數萬臨淄貝勒卓琳以騎兵二千討之旺嘉努領穆昆先登力戰大破其衆明年攻滄州宋兵拒戰復從卓琳擊走之宋將徐文以舟百艘泊海島即以商船十八進襲斬首七百級獲舟二十天㑹八年除静江軍節度使授世襲千户從梁王宗弼征伐為萬户還為五院部節度使天徳二年改烏爾古徳哷勒招討都監卒田灝字黙之興中人遼天慶八年進士歴官金部員外郎權歸徳節度使太祖定燕灝舉四州版圖歸朝加都官郎中權節度使事四遷知真定府事招降齊博游貴等賊衆五千餘人已而貴復叛去灝遣齊博偽叛從貴因令伺間殺之降其衆賊壘悉平三遷行臺左丞彰徳軍節度使是時新定力役灝蠲籍之半而上之故相之繇賦比他州獨輕徙同知河北東路都總管改同簽燕京留守司事民遮留不得出易服夜去改河東南路轉運使尋改絳陽軍節度使居三年以疾請謝事徑解印歸數奏不允移鎮振武軍入為刑部尚書居三月請老卒於家趙隇字徳固遼陽人其婦翁以優伶得幸於遼主隇補閤門祗候累遷太子左衛率後居灤州宗望討張覺隇踰城出降授洛苑副使為灤州千户遷洛苑使檢校工部尚書從伐宋至汴遷棣州刺史侍衛歩軍都虞候及再伐宋攻真定與有功改商州刺史檢校尚書右僕射五年同知信徳府路統押軍兵兼沿邉安撫使事明年權知濟州事八年從定河南授隴州團練使十年改知石州隇久在兵間不善治民坐謗議謫監平州甜水鹽齊國廢河南皆以宿將守之授隇宿州防禦使統本路軍兵隇重義接儒士嘗以事至汴有故人子負官錢百萬隇以橐金贈之其子悉為私費復代輸之頃之有訟徐帥不法者朝廷使隇鞫治隇委曲營䕶坐是廢罷寓居於燕海陵出領行臺省至燕隇徃見之因訴其事及海陵即位起為保大軍節度使貞元初改内省使未幾為中都路都轉運使明年再徙順義興平入為太子詹事鎮心南以疾卒年六十六後十餘年隇子孫司徒張通古子孫皆不肖淫蕩破貲産賣田宅世宗聞之詔曰自今官民祖先亡没子孫不得分割居第止以嫡幼主之毋致鬻賣仍著於令金史卷八十一
