body:
  text: 金史卷十八元中書右丞相總裁托克托等修本紀第十八哀宗下九月戊寅朔詔减親衞軍己丑軍士殺鄭門守者出奔壬辰起上黨公張開及臨淄郡王王義深廣平郡王范成為元帥以前御史大夫完顔哈昭權參知政事乙未以牓召民賣放下年軍需錢上戸田租如之辛丑夜大雷工部尚書富聶遜震死閏月戊申朔遣使以鐵劵一虎符六大信牌十織金龍文御衣一玉魚帶一弓矢二賜兖王完顔用安其父母妻皆贈封之又以世襲宣命十郡王宣命十玉兎鶻帶十付用安其同盟可賜者即賜之辛亥遣張開幹色辛劉益髙顯率歩軍䕶陳留通許糧道罷貧民進獻糧戊午招鄉導己未有箭射入宮中書姦臣姓名兩日再得之辛酉再括京城粟以御史大夫哈昭㸃檢圖克坦伯嘉等主之丙寅括粟使者兵馬都總領完顔玖珠以粟有蓬稗杖殺孝婦于省門十月以前司農卿李煥飛語詔左丞李蹊戸部侍郎楊慥繫獄將以軍儲失計坐罪俄蹊慥並除名而止籍慥家貲煥遂權戸部尚書尋赦殘欠糧其應以糧事繫者皆釋之詔徴諸道軍期以十二月一日入援十一月丁未朔賜貧民粥平章政事侯摯致仕左司郎中錫黙愛實以言事忤近侍送有司尋釋之己酉衛州軍校白晝取豐備倉米壬子京城人相食癸丑詔曹門宋門放士民出就食壬戌召諸將相入議事兖王用安率兵至徐州元帥王德全閉城不納會劉安國與宿帥重僧努引兵入援至臨渙用安使人刼殺之攻徐州乆不能下退保漣水制使因世英以用安不赴援還至宿州西遇大元兵死之丙寅河解元帥權興寶軍節度使趙偉襲據陜州以叛殺行省阿布哈努色爾以下凡二十一人誣布哈努色爾等反狀以聞上知其寃不能直其事就授偉元帥左監軍兼西安軍節度使行總帥府事偉尋亦歸北十二月丙子朔以事𫝑危急遣近侍即白華問計華對以紀季以酅入齊之義遂以為右司郎中甲申詔議親出乙酉再議於大慶殿上欲以官努髙顯劉益為元帥不果是日除拜扈從及留守京城官以右丞相樞密使兼左副元帥薩布平章政事權樞密使兼右副元帥博索右副元帥兼樞密副使權參知政事恩楚兵部尚書權尚書左丞李蹊元帥左監軍行總帥府事圖克坦伯嘉等率軍扈從參知政事兼樞密院副使完顔納紳樞密副使兼知開封府權參知政事薩尼雅布裏城四面都總領戸部尚書完顔珠赫外城東面元帥博斯呼南面元帥珠嘉耀珠西面元帥崔立北面元帥冨珠哩邁努等留守除拜既定以京城付之擢魏璠為翰林脩撰如鄧州招武仙入援丁亥上御端門發府庫及兩府器皿宮人衣服賜將士戊戌官努阿里哈謀立荆王不果朝廷知其謀置不問庚子上發南京與太后皇后諸妃别大慟行次公主苑太后遣中官持米肉徧犒軍士辛丑至開陽門外麾百官退詔諭戍兵曰社稷宗廟在此汝等壯士也毋以不預進發之數便謂無功若保守無虞將來功賞顧豈在戰士下聞者皆灑泣是日鞏昌元帥完顔呼沙呼至自金昌為上言京西三百里之間無井竈不可往東行之議遂决以為尚書右丞從行遂次陳留壬寅次杞縣癸卯次黄城丞相完顔薩布之子安春有罪伏誅甲辰次黄陵岡乙巳諸將請幸河朔從之二年正月丙午朔濟河北風大作後軍不克濟丁未大元兵追擊于南岸元帥完顔珠爾賀德希死之建威都尉完顔額埓春降己酉上哭祭戰死士于北岸皆贈官斬額埓春二弟以殉赦河朔招集兵糧議取衛州元帥富察官努將忠孝軍千人東面元帥髙顯果毅都尉鈕祜禄耀珠領軍萬人為前鋒至蒲城庚戌上次漚麻岡平章政事博索元帥哈薩喇烏逹布繼至辛亥博索引兵攻衛州不克乙卯聞大元兵自河南渡河至衛之西南遂退師丁巳戰于白公廟博索敗績棄軍東遁元帥劉益上黨公張開亦遁並為民家所殺益部曲王全降戊午上進次蒲城復還魏樓村李辛自汴京出奔伏誅己未上以博索謀夜棄六軍渡河與副元帥和爾和六七人走歸德庚申諸軍始知上已往遂潰辛酉司農大卿富察世逹元帥完顔呼圖出歸德西門奉迎上入歸德赦在府囚軍民普覃一官賜進士終場王輔以下十六人出身遣奉御珠嘉塔克實布后弟圖克坦肆喜往汴京奉迎兩宮博索還自蒲城聚兵於大橋不敢入壬戌遣使召博索數其罪下之獄籍其家財以賜將士曰汝輩冝竭忠力毋如斯人誤國人予金一兩七日博索及其子呼圖哩皆死獄中右丞相薩布致仕右丞完顔呼沙呼行省事于徐州官努再請率兵北渡紐勒歡不可遣歸德知府行戸部尚書冨察世逹都轉運使張俊民如陳蔡取糧以元帥李琦王壁䕶之戊辰安平都尉京城西面元帥崔立與其黨韓鐸藥安國等舉兵為亂殺參知政事完顔納新樞密副使完顔薩尼雅布勒兵入見太后傳令立衛王子從恪為梁王監國即自為太師軍馬都元帥尚書令尋自稱左丞相都元帥尚書令鄭王弟倚平章政事侃殿前都㸃檢其黨富珠哩察罕御史中丞韓鐸副元帥兼知開封府折希顔藥安國漳軍努完顔哈逹並元帥師肅左右司郎中賈良兵部郎中兼右司都事又署工部尚書温特赫額實吏部侍郎劉仲周並為參知政事宣徽使鄂屯舜卿為尚書左丞戸部侍郎張正倫為尚書右丞左右司都事張節為左右司郎中尚書省掾元好問為左右司員外郎都轉運知事王天祺懷州同知康瑭並為左右司都事開封官李禹翼棄官去戸部主事鄭著召不起是日右副㸃檢温都阿里左右司員外郎聶天驥御史大夫費摩阿古岱諫議大夫左右司郎中烏克遜納新左副㸃檢完顔阿薩爾奉御莽格講議冨察琦並死之遂送欵大元軍前癸酉大元將蘇布特進兵汴京甲戌立閲隨駕官屬軍民子女於省署及禁民間嫁娶括京城財兩宫值變不果行塔克實布以其父耀珠肆喜以其妻奪門而出至歸德上怒二人皆斬於市乙亥遣右宣徽提點近侍局事伊喇寧古如徐州相地形察倉庫虛實白華如鄧州召兵二月丙子朔魚山張瓛殺元帥完顔呼圖行省呼沙呼自率兵討之會從宜嚴禄誅瓛乃還括城中糧知歸德府事實嘉紐勒歡為樞密副使權參知政事留元帥官努忠孝軍四百五十人都尉馬用軍二百八十餘人發餘軍赴宿徐陳三州就糧三月乙丑實嘉紐勒歡乞盡散衛兵出城就食官努私與國用安謀邀上幸海州不從蔡帥烏庫哩鎬以糧四百餘斛至歸德表請臨幸上遣學士烏庫哩布希以幸蔡之意諭其州人戊辰官努以忠孝軍為亂殺馬用遂殺尚書左丞李蹊參知政事實嘉紐勒歡㸃檢圖克坦長樂從官右丞已下三百餘人上赦官努暴紐勒歡罪狀以官努為樞密副使權參知政事左右司郎中張天綱為戸部侍郎權參知政事己巳官努真授參知政事兼左副元帥官努以上居照碧堂禁諸臣無一人敢奏對者上日悲泣言曰自古無不亡之國不死之主但恨朕不知用人致為此奴所囚耳遂與内局令宋珪等謀誅官努夏四月壬午徐州行省完顔呼沙呼執王德全并其子誅之及其黨王琳楊璝錫黙延夀召經厯商瑀用之魚山從宜嚴禄叛歸漣水庚寅陳州都尉李順兒殺行省鈕祜禄納新及招撫使劉天起送欵于崔立張俊民李琦奔汴京王壁還歸德癸巳崔立以梁王從恪荆王守純及宗室男女五百餘人至青城皆及於難甲午兩宮北遷甲辰鄧州節度使伊喇瑗以其城叛與白華俱亡入宋六月己卯官努及其黨阿里哈博濟皆伏誅上御雙門赦忠孝軍以安反側遂决䇿遷蔡詔蔡息陳潁各以兵來迓中京留守權參政烏淩阿呼圖棄城奔蔡壬午中京破留守兼便宜總帥强伸死之戊子召徐州行省完顔呼沙呼赴行在所以穆延烏登代行省事郭恩為總帥兼節度使辛卯上發歸德留元帥王壁守之壬辰次亳州癸巳以亳州節度使王進同知節度使王賔徵民丁運鐵甲糗糧留權參政張天綱董之就遷有功將士臨淄郡王王義深據靈壁望口寨以叛遣近侍直長鈕祜禄温綽將徐宿兵討之義深敗走漣水入宋丙申亳州鎮防軍崔富格殺守臣王賔等張天綱以便宜授富格節度使罷運鐵甲糗糧州人乃安己亥上入蔡州詔尚書省為書召武仙會兵入援徐州行省穆延烏登赴蔡州起復右丞相致仕薩布代行省事七月癸卯朔曲赦蔡州管内雜犯死罪以下官吏軍民普覃兩官經應辦者更遷一官弛門禁通衆貨蔡人便之乙巳以烏庫哩鎬為御史大夫總帥如故張天綱為御史中丞仍權參政完顔藥師為鎮南軍節度使兼蔡州管内觀察使戊申左右司郎中烏庫哩布希兼息州刺史權元帥右都監行帥府事征行元帥權總帥羅索簽樞密院事己酉選室女備宮中使令已得數人以右丞呼沙呼諫留識文義者一人餘聽自便乙卯遣魏璠徵武仙兵丁巳護衛布希舒嚕負祖宗御容至自汴勑有司奉安于乾元寺前御史大夫富蔡世逹西面元帥博斯呼自汴來歸辛酉武仙刼將士謀取宋金州至淅水衆潰行六部尚書盧芝侍郎石玠謀歸蔡州仙追芝不及遂殺玠丁卯定進馬遷賞格又定括馬罪格以簽樞密院事權參政穆延烏登領其事遣使分詣諸道選兵會于蔡己巳以富察世逹為吏部侍郎權行六部尚書八月癸酉朔以秦州元帥鈕祜禄烏展權參知政事行省事於陜西諭以蠟書期九月徵兵與上會于饒風闗欲出宋不意以取興元甲戌大元使王檝諭宋還宋以軍䕶其行青山招撫盧進得邏吏言以聞上為之懼丁丑上閲兵于見山亭癸未元帥楚㺹復立夀州於䝉城詔遷賞有差州縣官皆真授乙酉大元召宋兵攻唐州元帥右監軍烏庫哩黑漢死于戰主帥富察某為部曲兵所食城破宋人求食人者盡戮之餘無所犯宋人駐兵息州南丙戌詔權參政穆延烏登簽樞密院事羅索行省院于息州丁亥烏庫哩鎬權參知政事烏淩阿呼圖為殿前都㸃檢庚寅初設四隅機察官壬辰息州行省穆延烏登以兵襲宋人于中渡店斬獲甚衆乙未萬年節州郡以表來賀二十餘所辛丑設四隅和糴官及惠民司以太醫數人更直病人官給以藥仍擇年老進士二人為醫藥官九月癸卯朔假蔡州都軍致仕内族阿古岱同簽大睦親府事使宋借糧入辭上諭之曰宋人負朕深矣朕自即位以來戒飭邊將無犯南界邊臣有自請征討者未嘗不切責之向得宋一州隨即付與近淮隂來歸彼多以金幣為贖朕若受財是貨之也付之全城秋毫無犯清口臨陣生𫉬數千人悉以資糧遣之今乘我疲敝據我夀州誘我鄧州又攻我唐州彼為謀亦淺矣大元滅國四十以及西夏夏亡及於我我亡必及於宋唇亡齒寒自然之理若與我連和所以為我者亦為彼也卿其以此曉之至宋宋不許戊申魯山元帥元志率兵入援賜以大信牌升為總帥庚戌以重九拜天于節度使㕔羣臣陪從成禮上面諭之曰國家自開創涵養汝等百有餘年汝等或以先世立功或以勞効起身被堅執鋭積有年矣今當厄運與朕同患可謂忠矣比聞北兵將至正汝等立功報國之秋縱死王事不失為忠孝之鬼往者汝等立功常慮不為朝廷所知今日臨敵朕親見之矣汝等勉之因賜巵酒酒未竟邏騎馳奏敵兵數百突至城下將士踴躍咸請一戰上許之是日分軍防守四面及子城以總帥富珠哩羅索守東面内族承麟副之參知政事烏庫哩鎬守南面總帥元志副之殿前都㸃檢烏淩阿呼圖守西面忠孝軍元帥蔡巴爾副之忠孝軍元帥權殿前右副㸃檢王善爾守北面元帥赫舍哩柏夀副之遥授西安軍節度使兼殿前右衛將軍行元帥府事鈕祜禄温綽守東南元帥左都監𤓰爾佳當格副之殿前右衛將軍權左副都㸃檢内族色埒黙守子城都尉王愛實副之辛亥大元兵築髙壘圍蔡城己未括蔡城粟辛酉禁公私釀酒十月戊寅更造天興寶會辛巳縱飢民老稚羸疾者出城癸未徐州守臣郭恩殺官吏以叛行省薩布死之甲申給飢民船聽採城濠菱芡以食戊子徵諸道兵辛卯上閲射于子城中者賞麥有差丙申殿前左副都㸃檢温都察遜戰殁戊戌賜義軍戰殁被創者麥十一月辛丑朔以右副都㸃檢珠勒根伊實拉為宣差鎮撫都彈壓别設彈壓四員副之四隅機察亦𨽻焉宋遣其將江海孟珙帥兵萬人獻糧三十萬石助大元兵攻蔡十二月甲戌盡籍民丁防守括婦人壯徤者假男子衣冠運大石上親出撫軍丁丑大元兵决練江宋兵决柴潭入汝水己卯大元兵破外城宿州副總帥高拉格戰殁辛巳以總帥富珠哩羅索殿前都㸃檢烏陵阿呼圗皆權參政都尉完顔承麟為東面元帥權總帥己丑大元兵墮西城上謂侍臣曰我為金紫十年太子十年人主十年自知無大過惡死無恨矣所恨者祖宗傳祚百年至我而絶與自古荒淫暴亂之君等為亾國獨此為介介爾又曰古無不亡之國亡國之君往往為人囚縶或為俘獻或辱於階庭閉之空谷朕必不至此卿等觀之朕志决矣都尉王愛實戰歿礟軍總帥王鋭殺元帥𤓰爾佳當格率三十人降大元庚寅以御用器皿賞戰士甲午上微服率兵夜出東城謀遁及柵不果戰而還乙未殺尚厩馬五十匹官馬一百五十匹犒将士三年正月壬寅冊柴潭神為䕶國靈應王甲辰以近侍分守四城戊申夜上集百官傳位于東靣元帥承麟承麟固譲詔曰朕所以付卿者豈得已哉以肌體肥重不便鞍馬馳突卿平日趫㨗有将畧萬一得免祚𦙍不絶此朕志也己酉承麟即皇帝位百官稱賀禮畢亟出捍敵而南靣已立宋幟俄頃四靣呼聲震天地南靣守者棄門大軍入與城中軍巷戰城中軍不能禦帝自縊于幽蘭軒末帝退保子城聞帝崩率羣臣入哭諡曰哀宗哭奠未畢城潰諸禁近舉火焚之奉御經實收哀宗骨瘞之汝水上末帝為亂兵所害金亡贊曰金之初興天下莫彊焉太祖太宗威制中國大槩欲效遼初故事立楚立齊委而去之宋人不競遂失故物熙宗海陵濟以虐政中原觖望金事幾去天厭南北之兵挺生世宗以仁易暴休息斯民是故金祚百有餘年由大定之政有以固結人心乃克爾也章宗志存潤色而秕政日多誅求無藝民力浸竭明昌承安盛極衰始至於衛紹紀綱大壞亡徵已見宣宗南渡棄厥本根外狃餘威連兵宋夏内致困憊自速土崩哀宗之世無足為者皇元功德日盛天人屬心日出爝息理勢必然區區生聚圖存於亡力盡乃斃可哀也矣雖然在禮國君死社稷哀宗無愧焉金史卷十八
