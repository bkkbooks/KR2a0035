body:
  text: 金史卷四十四元中書右丞相總裁托克托等修志第二十五兵兵制之禁軍之制養兵法金興用兵如神戰勝攻取無敵當世曽未十年遂定大業原其成功之速俗本鷙勁人多沉雄兄弟子姪才皆良將部落保伍技皆鋭兵加之地狹産薄無事苦耕可給衣食有事苦戰可致俘獲勞其筋骨以能寒暑徴發調遣事同一家是故將勇而志一兵精而力齊一旦奮起變弱為彊以寡制衆用是道也及其得志中國自顧其宗族國人尚少乃割土地崇位號以假漢人使為之効力而守之明安穆昆雜厠漢地聼與契丹漢人昏因以相固結迨夫國事寖盛則歸土地削位號罷遼東渤海漢人之襲明安穆昆者漸以兵柄歸其内族然樞府簽軍募軍兼采漢制伐宋之役叅用漢軍及諸部族而統以國人非不知制勝長䇿在於以志一之將用力齊之兵也第以土宇既廣豈得盡任其所親哉馴致極盛乃自患其宗族國人之多積其猜疑卒自戕賊遂致強本刋落醇風鍥薄將帥擕離兵士驕惰迄其亡也忠孝等軍搆難于内乣軍雜人召禍於外向之所謂志一而力齊者不見可恃之勢焉豈非自壊其家法而致是歟抑是道也可用於新造之邦不可以保長乆之天下歟金以兵得國奉詔作金史故於金之兵志考其興亡得失之跡特著於斯兵制馬政養兵等法載諸舊史者臚列于篇金之初年諸部之民無它徭役壯者皆兵平居則聼以佃漁射獵習為勞事有警則下令部内及遣使詣諸貝勒徴兵凡歩騎之仗糗皆取備焉其部長曰貝勒行兵則稱曰明安穆昆從其多寡以為號明安者千夫長也穆昆者百夫長也穆昆之副曰富埒琿士卒之副從曰伊勒希部卒之數初無定制至太祖即位之二年既以二千五百破耶律色實始命以三百戸為穆昆穆昆十為明安繼而諸部來降率用明安穆昆之名以授其首領而部伍其人珠赫之戰兵始滿萬而遼莫敵矣及拉林鴨水鐡驪拜格之民皆附東京既平山西繼定内收遼漢之降卒外籍部族之健士嘗用遼人額哩頁以北部百三十戸為一穆昆漢人王六兒以諸州漢人六十五戸為一穆昆王伯龍及髙從祐等竝領所部為一明安至天㑹二年平州既平宗望恐風俗揉雜民情弗便乃罷是制諸部降人但置長吏以下從漢官之號五年伐宋之役調燕山雲中中京上京東京遼東平州遼西長春八路民兵𨽻諸萬戸其間萬戸亦有專統漢軍者熙宗皇統五年又罷遼東漢人渤海明安穆昆承襲之制浸移兵柄於其國人乃分明安穆昆為上中下三等宗室為上餘次之至海寜庶人天徳二年省併中京東京臨潢咸平㤗州等路節鎮及明安穆昆削上中下之名但稱為諸明安穆昆循舊制間年一徴發以補老疾死亡之數貞元遷都遂徙上京路太祖遼王宗幹秦王宗翰之明安併為哈濟明安及右諫議沃哩布明安太師朂宗正宗敏之族處之中都沃稜和尚呼喇三國公太保昻詹事烏哩雅輔國博勒和定逺蘇勒庫梁國公伯特八明安處之山東阿嚕之族處之北京諸逹族屬處之河間二年命兵部尚書蕭仲恭等與舊兵皆分隸諸總管府節度使授田牛使之耕食以蕃衛京國六年南伐立三道都統制府及左右領軍大都督將三十二軍以神䇿神威神㨗神鋭神毅神翼神勇神果神畧神鋒武勝武定武威武安武㨗武平武成武毅武鋭武揚武翼武震威定威信威勝威㨗威烈威毅威震威畧威果威勇為名軍置都總管副總管及廵察使副各一員而沿邊契丹恐妻孥被鄰寇鈔掠不可盡行遂皆背叛而大名續授甲之士還迎立世宗于東京及大定之初幹罕既平乃散契丹隸諸明安穆昆至三年詔河北山東等路所簽軍有父兄俱亡充甲軍子弟又為伊勒希恐其家更無丁男有誤農種與免一丁以驅丁充伊勒希無驅丁者於本明安穆昆内驗富強有驅丁者簽充十二年徙東北等戍邊漢軍於内地十五年十月遣吏部郎中富察烏琿等十人分行天下再定明安穆昆戸每穆昆戸不過三百七穆昆至十穆昆置一明安十七年又以西南西北招討司契丹餘黨心素狼戾復恐生事它時或有邊隙不為我用令遷之於烏庫哩實壘部及上京之地上謂宰臣曰北邊番戍之人歳冐寒暑徃來千里甚為勞若縱有一二馬牛一徃則無還理且奪其農時不得耕種故嘗命卿等議以何術得罷其役使安于田里不知卿議何如也左丞相良弼對曰北邊之地不堪耕種不能長戍故須番戍耳上曰朕一日萬幾安能徧及卿等既為宰相以此急務反以為末事竟無一言甚勞朕慮徃者叅政宗叙屢為朕言若以貧戸永屯邊境使之耕種官給糧廪則貧者得濟富戸免於更代之勞使之得勤農務若宗叙者可謂盡心為國矣朕嘗思之宜以兩路招討司及烏庫哩實壘部族臨潢府㤗州等路分定保戍具數以聞朕親覽焉十八年命部族乣分番守邊二十年以祖宗平定天下以來所建立明安穆昆因循既乆其間有戸口繁簡地里逺近不同又自正隆之後所授無度及大定間亦有功多未酬者遂更定以詔天下復命新授者竝令就封其穆昆人内有六品以下職及諸局承應人皆為遷之三從以上族人願從行者明安不得過十戸穆昆不得過六戸詔戍邊軍士年五十五以上許以其子及同居弟姪承替以奴代者罪之二十一年三月詔遣大興尹完顔托果斯遷河北東路兩明安上曰朕始令移此欲令與女直戸相錯安置乆則自相姻親不生異意此長乆之利也今者伊瑪河明安相錯以居甚符朕意而約羅河明安不如此可再遣兵部尚書張納延按視其地以雜居之二十二年以山東屯田戸鄰於邊鄙命聚之一處俾恊力蠶種右丞相烏庫哩元忠曰彼方之人以所得之地為家雖兄弟不同處故貧者衆參政鈕祜禄額特埒曰舊時兄弟雖析猶相聚種今則不然宜令約束之又以明安穆昆舊籍不明遇簽軍與諸差役及振濟増減不以實命括其口以實籍之二十三年遣刑部尚書伊喇慥遷山東東路八穆昆處之河間其棄地以山東東路特赫河明安下扎哈穆昆額勒敏鄂勒歡明安下錫布穆昆佛門山穆昆九村人戸徙於瑠僧安和二穆昆之舊地其未徙者之地皆薄惡且鄰寇壤遣使詢願徙者相可居之地圖以進上嘗以率賔呼爾哈人驍勇可用海陵嘗欲徙之而未能二十四年以上京刷和倫之地廣而腴遂詔遣刑部尚書烏哩雅出府庫錢以濟行資牛畜遷率賓一明安呼爾哈二明安二十四穆昆以實之蓋欲上京兵多它日可為緩急之備也當是時多易置河北山東所屯之舊括民地而為之業戸頒牛而使之耕畜甲兵而為之備乃犬重其權授諸王以明安之號或新置者特賜之名制其奢靡禁其飲酒習其騎射儲其糧􅖲其備至嚴也是時宗室戸百七十明安二百二穆昆千八百七十八户六十一萬五千六百二十四東北路部族乣軍曰徳哷勒部承安三年改特哩衮扎薩克節度使曰唐古部承安三年間改博勒和扎薩克節度使二部五乣戸五千五百八十五其它若珠嚕部族烏爾古部族實壘部族䝉古部族竒嚕部族布塔布部族數皆稱是西北西南二路乣軍曰蘇穆坦乣曰伊埓圖乣曰古勒敦乣唐古乣哈瑪爾乣穆騰乣䝉古乣茂乣呼敦乣凡九其諸路曰海蘭曰扶餘曰博索曰率賔曰呼爾哈曰伊蘭伊蘭後廢皆在上京之鄙或置總管府或置節度使至章宗明昌間欲國人兼知文武令明安穆昆舉進士試以䇿論及射以定其科甲高下承安四年上謂宰臣曰人有以八陣圖來上者其圖果何如朕嘗觀宋白所集武經具載攻守之法亦多難行右丞相清臣曰兵書一定之法難以應變本朝行兵惟用正竒二軍臨敵制變以正為竒以竒為正故無徃不克上曰自古用兵亦不出竒正二法耳且學古兵法如學奕棋未能自得於心欲用舊陣勢以接敵疎矣敵所應與舊勢異則必不可支然武經所述雖難遵行然知之猶愈不知㤗和間又制武舉其制具在選舉志所謂渤海軍則渤海八明安之兵也所謂奚軍者奚人約尼扎古雅九明安之兵也奚兵初徙于山西後分遷河東其漢軍中都永固軍大定所置者也所謂鎮防軍則諸軍中取以更代戍邊者也在西北邊則有分番屯戍軍及永屯軍驅軍之别驅軍則國初所免遼人之奴婢使屯守于㤗州者也邊鋪軍則河南陜西居守邊界者河東三虞候順徳軍及章宗所置諸路効節軍京府節鎮設二十人防刺設二十人掌同弓手者也諸路所募射糧軍五年一籍三十以下十七以上强壯者皆刺其缺所以兼充雜役者也京師防城軍世宗大定十七年三月改為武衛軍則掌京師廵捕者也其曰牢城軍則嘗為盜竊者以充防築之役曰土兵則以司警捕之事凡漢軍有事則簽取於民事已則或亦放免初天㑹間郭藥師降有曰長勝軍者皆遼水側人也以鄉土歸金皆愁怨思歸宗望乃令罷還正隆間又嘗罷諸路漢軍而所存者猶有威勇威烈威㨗順徳及韓常之軍之號凡邊境置兵之州三十八鳯翔延安鄧鞏熙泗潁蔡隴秦河海壽唐商洮蘭㑹積石鎮戎保安綏徳保徳環葭澳寜邊東勝淨慶來逺桓昌海蘭博索扶餘率賔呼爾哈置於要州者十一南京東京益都京兆太原臨洮臨潢豐㤗撫蓋及宣宗南遷乣軍潰去兵勢益弱遂盡擁明安戸之老稚渡河僑置諸總管府以統之器械既缺糧糒不給朘民膏血而不足乃行括糧之法一人從征舉家待哺又謂無以堅戰士之心乃令其家盡入京師不數年至無以為食乃聼其出而國亦屈矣然初南渡時盡以河朔戰兵三十萬分𨽻河南行樞宻及帥府徃徃蔽匿強壯驅羸弱使戰不能取勝後乃至以二十五人為穆昆四穆昆為明安每穆昆除旗鼓司火頭五人任戰者止十八人不足成隊伍但務存其名而已故混源劉祁謂金之兵制最弊每有征伐及邊釁輙下令簽軍使逺近騷動民家丁男若皆強壯或盡取無遺號泣動乎鄰里嗟怨盈於道路驅此使戰欲其勝敵難矣初貞祐時下令簽軍㑹一時任子為監當者春赴吏部選宰執命取為監軍官皆憤愠哀號交愬臺省至衝宰相鹵薄以告丞相布薩齊錦大怒趣左右取弓矢射去已而上知其不可用命免之元光末備潼闗黄河又簽軍諸使者歴縣邑自見居官外無文武小大職事官皆充軍至許州前侍御史劉元規年幾六十亦選為千戸至陳州以祁父從益以前監察御史亦為千戸餘不可悉紀既立部伍必以軍律相臨物議紛然後亦罷之哀宗正大二年議選諸路精兵直𨽻宻院先設總領六員分路揀閱因相合併每總領司率數萬人軍勢既張乃易總領之名為都尉班在隨朝四品之列曰建威曰虎威曰破虜振威鷹揚虎賁振武折衝盪寇殄寇必以嘗秉帥權者居是職雖帥府行院不敢以貴重臨之天興初元有十五都尉先六人陞授在京建威鄂屯斡里雅布許州折衝瓜爾佳澤本姓樊陳州振武斡色辛本姓李蔡州盪宼富察逹希布申裕安平完顔色埒黙嵩汝振武唐古哈克繖續封金昌府虎威赫舍哩竒爾宣權歸徳果毅完顔珠爾南京殄寇完顔阿巴宣權潼闗都尉三虎賁完顔辰爾鷹揚内族大羅索全節復取河朔諸路歸正人不問馬有無譯語能否悉送密院増月給三倍它軍授官馬得千餘人嵗時犒燕名忠孝軍以舒穆嚕延善努富察鼎珠統之加以正大已後諸路所虜臨陣所獲皆放歸鄉土同忠孝軍給其犒賞使河朔俘係知之故此軍迄于天興至七千千戸以上將帥尚不預焉又以歸正人過多乃係於忠孝籍中别為一軍減忠孝所給之半不能射者令閲習一再月然後試補忠孝軍是所謂和爾和軍也又以親衛馬軍舊時所選未精必加閲試直取武藝如忠孝軍者得五千人餘罷歸為歩軍凡進征忠孝居前馬軍次之自正大改立馬軍隊伍鞍勒兵甲一切更新將相舊人自謂國家全盛之際馬數則有之至於軍士精鋭器仗堅整較之今日有不侔者中興之期為有望矣一日布列曹門内教場忠孝軍七千馬軍五千京師所屯建威都尉軍萬人内族玖珠所統親衛軍三千及阿巴所統四千皆哀宗控制樞宻院時所選教場地約三十頃尚不能容餘都尉十三四軍猶不在是數此外招集義軍名曰忠義要皆燕趙亡命雖獲近用終不可制異時擅殺北使唐慶以速金亡者即此曹也禁軍之制本於哈濟穆昆哈濟者言親軍也以近親所領故以名焉貞元遷都更以太祖遼王宗斡秦王宗翰軍為哈濟明安謂之侍衛親軍故立侍衛親軍司以統之舊常選諸軍之材武者為䕶駕軍海陵又名上京龍翔軍為神勇軍正隆二年將南伐乃罷歸使就僉調後於侍衛親軍四明安舊止曰太祖遼王秦王明安凡三今曰四明安未詳豈太祖兩明安耶内選三十以下千六百人騎兵曰龍翔歩兵曰虎歩以備宿衛五年罷親軍司以所掌付大興府置左右驍騎所謂從駕軍也置都副指揮使𨽻㸃檢司歩軍都副指揮使𨽻宣徽院大定初親軍置四千人二十二年省為三千五百上京亦設守衛軍是年尚書省奏上京既設皇城提舉官亦當設軍守衛上曰可設四百五十馬一百二十分三番更代異時朕至上京即作兩番廵警限以半年交替人日給錢五十米一升半馬給芻粟明安穆昆官可差年四十上下者軍士竝取三十以上者充章宗承安四年増為五千又増至六千又有威㨗軍承安増簽弩手千人凡選弩手之制先以營造尺度杖其長六尺立之謂之等杖取身與杖等能踏弩至三石鋪弦解索登踏閑習射六箭皆上垜内二箭中貼者又選親軍取身長五尺五寸善騎射者明安穆昆以名上兵部移㸃檢司宣徽院試補之又設護衛二百人近侍之執兵杖者也取五品至七品官子孫及宗室併親軍諸局分承應人身長五尺六寸者選試補之又設控鶴二百人皆以備出入者也大將府治之稱號收國元年十二月始置咸州軍帥司以經畧遼地討高永昌置南路都統司且以討張覺天輔五年襲遼主始有内外諸軍都統之名時以奚未平又置奚路都統司後改為六部路都統司以約尼九營為九明安隸焉與上京及㤗州凡六處置每司統五六萬人又以渤海軍為八明安凡明安之上置軍帥軍帥之上置萬戸萬戸之上置都統然時亦稱軍帥為明安而明安則稱親管明安者燕山既下循遼制立樞宻院于廣寜府以總漢軍太宗天㑹元年以襲遼主所立西南都統府為西南西北兩路都統府三年以伐宋更為元帥府置元帥及左右副及左右監軍左右都監金制都元帥必以安班貝勒為之恒居守而不出六年詔還二帥以鎮方面諸路各設兵馬都總管府州鎮置節度使沿邊諸州則置防禦使凡州府所募射糧軍牢城軍毎五百人為一指揮使司設使分為四都都設左右什將及承局押官其軍數若有餘或不足則與近者合置不可合者或三百人或二百人亦設指揮使若百人則止設軍使百人以上立為都不及百人止設什將及承局管押官各一員十年改南京路都統司為東南路都統司治東京以鎮高麗後又置統軍司于大名府及海陵天徳二年八月改諸京兵馬都部署司為本路都總管府九月罷大名統軍司而置統軍司于山西河南陜西三路以元帥府都監監軍為使分統天下兵又改烏爾古徳哷勒路統軍司為招討司博索路統軍司為總管府三年以元帥府為樞宻院罷萬戸之官詔曰太祖開剏因時制宜材堪統衆授之萬戸其次千戸及穆昆當時官賞未定城郭未下設此職許以世襲乃權宜之制非經久之利今子孫相繼專攬威權其戸不下數萬與留守總管無異而世權過之可罷是官若舊無千戸之職者續思増置國初時賜以國姓若為子孫者皆令復舊正隆末復陞陜西統軍司為都統府大定五年復罷府降為統軍司尋又設兩招討司與前凡三以鎮邊陲東北路者初置烏爾古徳哷勒部後置于㤗州㤗和間以去邊尚三百里宗浩乃命分司于金山西北路者置於應州西南路者置於桓州以重臣知兵者為使列城濠戍守為永制樞宻院每行兵則更為元帥府罷則復為院宣宗貞祐三年徴代州戍兵五千從胥鼎言留代以屏平陽興定二年選募河南陜西弩手軍二千人為一軍賜號威勇及南遷河北封九公因其兵假以便宜從事沿河諸城置行樞宻院元帥府大者有便宜之號小者有從宜之名元光間時招義軍以三十人為穆昆五穆昆為一千戸四千戸為一萬戸四萬戸為一副統兩副統為一都統此復國初之名也然又外設一總領提控故時皆稱元帥為總領云金初因遼諸茂而分置羣牧茂之為言無蚊蚋美水草之地也天徳間置迪河鄂爾多阿爾本富僧額永安沃濟五羣牧所皆仍遼舊名各設官以治之又於諸色人内選家富丁多及品官家子明安穆昆佛寜軍與司吏家餘丁及奴使之司牧謂之羣子分牧馬駝牛羊為之立蕃息衰耗之刑賞後稍増其數為九契丹之亂遂亡其五四所之所存者馬千餘牛二百八十餘羊八百六十駝九十而已世宗置所七日特們圖們在撫州阿都齊布沙堪布沙堪本阿都齊地大定七年分其地置之承安三年改為班第音烏哷濟庫額勒本承安三年改烏遜烏哷濟庫烏哷濟庫者言滋息也和囉噶伊囉斡在武平縣臨潢㤗州之境大定二十年三月更定羣牧官詳衮托迪扎布羣牧人滋息損耗賞罰格二十一年勑諸所馬三嵗者付女直人牧之牛或以借民耕或又令民畜羊或以振貧戸時遣使閲實其數缺則杖其官而令牧人償之匿其實者監察舉覺之二十八年蕃息之久馬至四十七萬牛十三萬羊八十七萬駝四千明昌五年散騬馬令中都西京河北東西路驗民物力分畜之又令它路民養馬者死則於前四路所養者給換若欲用則悉以送官此金之馬政也然每有大役必括於民及取羣官之餘騎以供戰士焉宣宗興定元年定民間收潰軍亡馬之法及以馬送官酬直之格上等馬一匹銀五十兩中下遞減十兩不願酬直者上等二匹補一官雜班任使中等三匹下等四匹如之令下十日陳首限外匿及殺竝絞又遣官括市民馬立賞格以示勸五百匹以上鈔千貫千匹以上一官二千匹以上兩官養兵之法熙宗天眷三年正月詔歳給遼東戍卒紬絹有差正隆四年命河南陜西統軍司并虞候司順徳軍官兵竝増廪給六年將南征以絹萬匹于京城易衣襖穿膝一萬以給軍世宗大定三年南征軍士每歳可支一千萬貫官府止有二百萬貫外可取於官民戸此軍須錢之所由起也時言事者以山東河南陜西等路循宋齊舊例州縣司吏弓手於民間驗物力均敷顧錢名曰免役請以是錢贍軍至是省具數以聞詔罷弓手錢其司吏錢仍舊四年六月奏元帥府乞降軍須錢上曰帥府支費無度例皆科取於民甚非朕意仰㑹計軍須支用不盡之數及諸路轉運司見在如實缺用則别具以聞十年四月命徳順州建營屋以處屯軍十七年七月嵗以羊皮三萬賜西北路戍兵承安三年以軍須所費甚大乞驗天下物力均徴擬依黄河夫錢例徴軍湏錢驗各路新籍物力每貫徴錢四貫西京北京遼東路每貫徵錢二貫臨潢全州則免徴周年三限送納恐期逺遂定制作半年三限輸納凡河南陜西山東放老千戸穆昆佛寜正軍伊勒希等給賞之例舊軍千戸十年以上賞銀五十兩絹三十匹不及十年比附十年以上穆昆支穆昆十年以上銀四十兩絹二十五匹不及十年銀三十兩絹二十匹佛寜十年以上銀三十兩絹二十匹不及十年銀二十兩絹一十五匹馬歩正軍伊勒希等勾當不拘年分放老正軍銀十十五兩絹一十匹伊勒希旗鼔吹笛本司火頭人等同銀八兩絹五匹三虞候千戸十年以上銀四十兩絹二十五匹不及十年銀三十兩絹二十匹穆昆二十年以上銀五十兩絹三十匹十年以上銀三十兩絹二十匹不及十年銀一十兩絹一十五匹佛寜十年以上銀二十兩絹一十五匹不及十年銀一十五兩絹一十匹正軍伊勒希勾當不拘年分放老正軍銀一十兩絹七匹伊勒希旗鼓吹笛本司火頭人等同銀五兩絹四匹北邊萬戸千戸穆昆等歴過軍功及年老放罷給賞之例遷官同從吏部格正千戸管押萬戸勾當過一十五年遷兩官與從五品不及一十五年老放罷遷一官與正六品若若十年以下遷一官賞銀絹六十兩匹正穆昆管押萬戸勾當一十五年遷兩官與正六品不及一十五年年老放罷遷一官與正七品若十年以下遷一官賞銀絹五十兩匹正千戸管押千戸勾當過二十年遷一官與正六品不及二十年年老放罷遷一官與正七品若十年以下遷一官賞銀絹四十兩匹正穆昆管押千戸以下依河南陜西體例凡鎮防軍每年試射射若有出衆上等賞銀四兩特異衆者賞十兩銀馬盂簽充武衛軍挈家赴京者人日給六口糧馬四匹芻藁諸招軍月給例物邊鋪軍錢五十貫絹十匹軍匠上中等錢五十貫絹五匹下等錢四十貫絹四匹黄河埽兵錢三十貫絹五匹射糧軍及溝渠等處埽兵水手錢二十貫絹二匹土兵錢十貫絹一匹凡射糧軍指揮使及黄沁埽兵指揮使錢粟七貫石絹六匹軍使錢粟六貫石絹同上什將錢二貫粟三石春衣錢五貫秋衣錢十貫承局押官錢一貫五百文粟二石春衣錢五貫秋衣錢七貫牢城并土兵錢八百文粟二石春衣錢四貫秋衣錢六貫邊鋪軍請給與射糧軍同河南陜西山東路統軍司鎮防甲軍馬軍明安錢八貫米五石二斗絹八匹六馬芻粟穆昆錢六貫米二石八斗絹六匹五馬芻粟佛寜錢四貫米石七斗絹五匹四馬芻粟正軍錢二貫米石五斗絹四匹綿十五兩兩馬芻粟伊勒希錢一貫五百文米七斗絹三匹綿十兩歩軍明安馬二匹穆昆馬一匹芻粟毎馬給芻一束粟五升嵗仲春野有青草馬可牧養則止惟毎明安當差馬七十二匹四時皆給又定制河南山東河東歳給五月陜西六月鎮防軍補買馬錢河南路正軍五百文伊勒希隨色人三百文陜西山東路正軍三百文伊勒希隨色人二百文諸屯田被差及縁邊駐扎捉殺軍明安月給錢六貫米一石八斗五馬芻粟穆昆錢四貫米一石二斗三馬芻粟佛寜錢二貫米六斗二馬芻粟正軍錢一貫五百文米四斗一馬芻粟伊勒希隨色人錢一貫米四斗一馬芻粟徳順軍指揮使錢六貫米二石八斗絹六匹三馬芻粟軍使什將錢四貫米一石七斗絹五匹給兩馬料長行錢二貫米一石五斗絹四匹綿十五兩給一馬料奚軍穆昆錢一貫五百文米一石五斗紬絹春秋各一匹給三馬料佛寜錢一貫米二石七斗紬絹同上給二馬料長行錢一貫米一石八斗紬絹同上飼一馬北邊臨潢等處永屯駐軍千戸錢八貫米五石二斗絹八匹飼馬六匹歩軍飼兩馬地五頃穆昆錢六貫米二石八斗絹六匹飼五馬地四頃佛寜錢四貫米一石七斗絹五匹飼四馬地三頃正軍錢二貫米一石四斗五升絹四匹飼兩馬綿十五兩地二頃伊勒希錢一貫五百文米七斗絹三匹綿十兩地一頃旗鼓司人與伊勒希同交替錢二貫米四斗斗伊勒希錢一貫五百文米四斗上蕃漢軍千戸月給錢三貫糧四石絹八匹飼四馬穆昆錢二貫五百文糧一石絹六匹飼二馬正軍錢二貫米九斗五升絹四匹上京路永屯駐軍所除授千戸月給錢粟十五貫石絹十匹綿二十兩飼三馬穆昆錢六貫米二石八斗絹六匹飼二馬正東月支錢二貫五百文米一石二斗絹四匹綿十五兩飼一馬伊勒希隨色人錢二貫米一石二斗絹四匹綿十五兩諸北邊永駐軍月給補買馬錢四百文隨色人三百文貞祐三年軍前委差及掌軍官規圖糧料冐占職役皆無實員又見職及遥授者已有俸給又與無職事者同支劵糧故時議欲省員減所給之數俟征行則全給之及興定二年彰化軍節度他張行信言一軍充役舉家廩給蓋欲感悦士心使為盡力耳耳至於無軍之家復無丁男而妻女猶受給何謂耶五年京南行三司官舒穆嚕斡魯言京南東西三路見屯軍戸老㓜四十萬口嵗費糧百四十餘萬石皆坐食民租甚非善計語在田制諸屯田軍人如差防送日給錢一百五十文看管孝寜宫人月各給米五斗柴一車春秋衣麤布一匹秋絹二匹綿一十五兩諸黄院子年滿者以元請錢糧三分内給一貫石養老金史卷四十四
