body:
  text: 金史卷四十七元中書右丞相總裁托克托等修志第二十八食貨二田賦稅租賦牛具田制量田以營造尺五尺為歩闊一歩長二百四十歩為畝百畝為頃民田業各從其便賣質於人無禁但令隨地輸租而已凡桑棗民戸以多植為勤少者必植其地十之三明安穆昆戸少者必課種其地十之一除枯補新使之不闕凡官地明安穆昆及貧民請射者寛鄉一丁百畝狹鄉十畝中男半之請射荒地者以最下第五等減半定租八年始徴之作已業者以第七等減半為稅七年始徴之自首冒比鄰地者輸官租三分之二佃黄河退灘者次年納租太宗天㑹九年五月始分遣諸路勸農之使者熈宗天眷十四年罷拉林混同間䕶邏地以子民耕牧海陵正隆元年二月遣刑部尚書赫舍哩羅索等十一人分行大興府山東真定府拘括係官或荒閑牧地及官民占射逃絶戸地戍兵占佃宫籍監外路官本業外増置土田及大興府平州路僧尼道士女冠等地益以授所遷之明安穆昆戸且令民請射而官得其租也世宗大定五年十二月上以京畿兩明安民户不自耕墾及伐桑棗為薪鬻之命大興少尹完顔讓巡察十年四月禁侵耕圍場地十一年謂侍臣曰往嵗清暑山西路傍皆禾稼殆無牧地嘗下令使民五里外乃得耕墾今聞其民以此去之他所甚可矜憫其令依舊耕種毋致失業凡害民之事患在不知知之朕必不為自今事有類此卿等即告無隠十三年勑有司毎歲遣官勸明安穆昆農事恐有煩擾自今止令各管職官勸督弛慢者舉劾以聞十七年六月邢州男子趙迪簡言隨路不附籍官田及河灘地皆為豪強所占而貧民土瘠稅重乞遣官拘籍冒佃者定立租課復量減人戸稅數庻得輕重均平詔付有司將行而止復以近都明安穆昆所給官地率皆薄瘠豪民租佃官田歲乆往往冒為己業令拘籍之又謂省臣曰官地非民誰種然女直人戸自鄉土三四千里移来盡得薄地若不拘刷良田給之乆必貧乏其遣官察之又謂叅知政事張汝弼曰先嘗遣問女直土地皆云良田及朕出獵因問之則謂自起移至此不能種蒔斫蘆為席或斬芻以自給卿等其議之省臣奏官地所以人多蔽匿盗耕者由其罪輕故也乃更條約立限令人自陳過限則人能告者有賞遣同知中都路轉運使張九思往拘籍之十九年二月上如春水見民桑多為牧畜囓毁詔親王公主及勢要家牧畜有犯民桑者許所屬縣官立加懲斷十二月謂宰臣曰亡遼時所撥地與本朝元帥府已曾拘籍矣民或指射為無主地租地及新開荒為已業者可以拘括其間播種歲乆若遽奪之恐民失業因詔括地官張九思戒之復謂宰臣曰朕聞括地事所行極不當如皇后荘太子務之類止以名稱便為官地百姓所執慿騐一切不問其相鄰冒占官地復有幸免者能使軍戸稍給民不失業乃朕之心也二十年四月以行幸道隘扈從人不便詔戸部㳂路頓舍側近官地勿租與民耕種又詔故太保阿里先於山東路撥地百四十頃大定初又於中都路賜田百頃命拘山東之地入官五月諭有司曰白石門至野狐嶺其間淀濼多為民耕植者而官民雜畜往来無牧放之所可差官括元荒地及冒佃之數二十一年正月上謂宰臣曰山東大名等路明安穆昆戸之民往往驕縱不親稼穡不令家人農作盡令漢人佃蒔取租而已富家盡服紈綺酒食遊宴貧者爭慕效之欲望家給人足難矣近已禁賣奴婢約其吉凶之禮更當委官閱實戸數計口授地必令自耕力不贍者方許佃於人仍禁其農時飲酒又曰奚人六明安已徙居咸平臨潢泰州其地肥沃且精勤農務各安其居女直人徙居奚地者菽粟得收穫否左丞守道對曰聞皆自耕嵗用亦足上曰彼地肥美異於他處惟附都民以水害稼者振之三月陳言者言豪強之家多占奪田者上曰前叅政納哈嗒椿年占地八百頃又聞山西田亦多為權要所占有一家一口至三十頃者致小民無田可耕徙居隂山之惡地何以自存其令占官地十頃以上者皆括籍入官將均賜貧民省臣又奏椿年明安薩哈故太師諾延温都思忠孫長壽等親屬計七十餘家所占地三千餘頃上曰至秋除牛頭地外仍各給十頃餘皆拘入官山後招討司所括者亦當同此也又謂宰臣曰山東路所括民間已分給女直屯田人戸復有籍官閑地依元數還民仍免租稅六月上謂省臣曰近者大興府平濼薊通順等州經水災之地免今年租稅不罹水災者姑停夏稅俟稔歲徴之時中都大水而濵棣等州及山後大熟命修治懐来以南道路以來糴者又命都城減價以糶又曰近遣使閱視秋稼聞明安穆昆人惟酒是務往往以田租人而預借三二年租課者或種而不耘聽其荒蕪者自今皆令閲實各戸人力可耨幾頃畝必使自耕耘之其力果不及者方許租賃如惰農飲酒勸農穆昆及本管明安穆昆并都管各以等第科罪收穫數多者則亦以等第遷賞七月上謂宰臣曰前徙宗室戸於河閒撥地處之而不廻納舊地豈有兩地皆占之理自今當以一處賜之山東刷民田已分給女直屯田戸復有餘地當以還民而免是歲之租八月尚書省奏山東所刷地數上謂梁肅曰朕嘗以此問卿卿不以言此雖稱民地然皆無明㨿括為官地有何不可又曰黄河已移故道梁山濼水退地甚廣已嘗遣使安置屯田民昔嘗恣意種之今官已籍其地而民懼徴其租逃者甚衆若徴其租而以冒佃不即出首罪論之固宜然若遽取之恐致失所可免其徴赦其罪别以官地給之御史臺奏大名濟州因刷梁山濼官地或有以民地被刷者上復召宰臣曰雖曾經通檢納税而無明騐者復當刷問有公據者雖付本人仍須體問十月復與張仲愈論冒占田事二十二年以附都明安戸不自種悉租與民有一家百口壠無一苖者上曰勸農官何勸諭為也其令治罪宰臣奏曰不自種而輙與人者合科違例上曰太重愚民安知遂從大興少尹王翛所奏以不種者杖六十穆昆四十受租百姓無罪又命招復梁山濼流民官給以田時人戸有執契據指墳壠為騐者亦拘在官先委恩州刺史奚晦招之復遣安肅州刺史張國基騐實給之如已撥係猛安則償以官田上曰工部尚書張九思執强不通向遣刷官田凡犯秦漢以来名稱如長城燕子城之類者皆以為官田此田百姓為己業不知幾百年矣所見如此何不通之甚也八月以趙王永中等四王府冒占官田罪其各府長吏府掾及安次新城宛平昌平永清懐柔六縣官皆罸贖有差九月遣刑部尚書伊喇慥於山東路明安内摘入穆昆徙民於河北東路綽哈成格勒兩明安舊居之地無牛者官給之河間宗室未徙者令盡徙于平州無力者官津𤼵之土薄者易以良田先嘗令俟豐年則括籍官地至是嵗省臣復以為奏上曰本為新徙四明安貧窮湏刷官田與之若張仲愈等所擬條約太刻但以民初無得地之由自撫定後未嘗輸稅妄通為己業者刷之如此恐民苦之可為酬直且先令明安穆昆人戸隨宜分處計其丁壯牛具合得土田實數給之不足則以前所刷地二萬餘頃補之復不足則續當别議者有婁者與布色等爭懿州地六萬頃以皆無據騐遂沒入官二十七年隨處官豪之家多侵占官地轉與它人種佃規取課利命有司拘刷見數以與貧難無地者每丁授五十畝庻不致失所餘佃不盡者方許豪家騐丁租佃章宗大定二十九年五月擬再立限令貧民請佃官地縁今已過期計已數足其占而有餘者若容告訐恐滋姦弊况續告漏通地勑㫖已革今限外告者宜却之止付元佃兼平陽一路地狭人稠官地當盡數拘籍騐丁以給貧民上曰限外指告多佃官地者却之當矣如無主不願承佃方許諸人告請其平陽路宜計丁限田如一家三丁己業止三十畝則更許存所佃官佃一頃二十畝餘者拘籍給付貧民可也七月諭㫖尚書省曰唐鄧潁蔡宿泗等處水陸膏腴之地若騐等級量立歲租寛其徴納之限募民佃之公私有益今河南沿邊地多為豪民冒占若民或流移至彼就募令耕不惟貧民有贍亦増羡官租其給丁壯者田及耕具而免其租稅八月尚書省奏河東地狹稍凶荒則流亡相繼竊謂河南地廣人稀若令招集他路流民量給閑田則河東飢民減少河南且無曠地矣上從所請九月戊寅又奏在制諸人請佃官閑地者免五年租課今乞免八年則或多懇竝從之十一月尚書省奏民騐丁佃河南荒閑官地者如願作官地則免稅八年則願為己業則免稅三年不許貿易典賣若豪強及公吏輩有冒佃者限兩月陳首免罪而全給之其稅則視其鄰地定之以三分為率減一分限外許諸人告詣給之制可明昌元年二月諭㫖有司曰瀕水民地已種蒔而為水浸者可令以所近官田對給三月勑當軍人所授田止令自種力不足者方許人承佃亦止隨地所産納租其自欲折租輸納者從民所欲不願承佃者毋强六月尚書省奏近制以明安穆昆戸不務裁植桑果已令每十畝湏栽一畝今乞再下各路提刑及所屬州縣勸諭民戸如有不栽及栽之不及十之三者竝以事怠慢輕重罪科之詔可八月勑隨處係官閒地百姓已請佃者仍舊未佃者以付屯田明安穆昆三年六月尚書省奏南京陜西路提刑司言舊牧馬地乆不分撥以致軍民起訟比差官往各路定之凡民戸有慿騐己業及宅井墳園已改正給付而其中復有官地者亦騐數對易之矣兩路牧地南京路六萬三千五百二十餘頃陕西路三萬五千六百八十餘頃五年諭㫖尚書省遼東等路女直漢兒百姓所竝令量力為蠶桑二月陳言人乞以長吏勸農立殿最遂定制能勸農田者每年穆昆賞銀絹一兩匹明安倍之縣官於本等陞五年三年不怠者明安穆昆遷一官縣官陞一等田荒及十之一者笞三十分數加至徒一年三年皆荒者明安穆昆追一官縣官以陞等法降之為永格六年二月詔罷括陕西之地又陕西提刑司言本路戸民安水磨油栿所占歩數在私地有税官田則有租若更輸水利錢銀是重併也乞除之省臣奏水利錢銀以輔本路之用未可除也宜實視占地數除税租命他路視此為法承安二年遣户部郎中上官瑜徃西京并沿邊勸舉軍民耕種又差户部郎中李敬義徃臨潢等路規畫農事舊令軍人所授之地不得租賃與人違者苖付地主泰和四年九月定制所撥地止十里内自種之數每丁四十畝續進丁同此餘者許令便宜租賃及兩和分種違者錢業還主上聞六路括地時其間屯田軍戸多冒名増口以請官地及包取民間而民有空輸賦税虚抱物力者應詔陳言人多論之五年二月尚書省奏若復遣官分往追照案慿訟言紛紛何時已乎遂令虚抱税石已輸送入官者命於稅内毎歲續剋之泰和七年募民種佃清河等處地以其租分為諸春水處餌鷄鴨之食八年八月戸部尚書高汝礪言舊制人戸請佃荒地者以各路最下第五等減半定租仍免八年輸納若作己業竝依第七等税錢減半亦免三年輸納自首冒佃比鄰田定租三分納二其請佃黃河退灘地者次年納租向者小民不為乆計比至納租之時多巧避匿或復告退葢由元限太逺請佃之初無人保識故爾今請佃者可免三年作己業者免一年自首冒佃并請退灘地竝令當年輸租以鄰首保識為長制宣宗貞祐元年七月以既徙河北軍戸於河南議所以處之者宰臣曰當指官田及牧地分界之民已佃者則俟秋穫後仍日給米一升折以分鈔太常丞舒穆魯世勣曰荒田牧地耕闢費力奪民素懇則民失所况軍戸率無牛宜令軍戸分人歸守本業至春復還為固守計上卒從宰臣議將括之侍御史劉元規上書曰伏見朝廷有括地之議聞者無不駭愕向者河北山東已為此舉民之塋墓井竈悉為軍有怨嗟爭訟至今未絶若復行之則將大失衆心荒田不可耕徒有得地之名而無享利之實縱得熟土不能親耕而復令民佃之所得無幾而使紛紛交病哉上大悟罷之八月先以括地事未有定論北方侵及河南由是盡起諸路軍戸南来共圖保守而不能知所以得軍糧之術衆議謂可分遣官聚耆老問之其將益賦或與軍田二者孰便叅政汝礪言河南官民地相半又多全佃官地之家一旦奪之何以自括小民易動難安一時避賦遂有捨田之言及與人能弗悔乎悔則忿心生矣如山東撥地時膄地盡入富家瘠者乃付貧戸無益於軍而民有損惟當倍益官租以給軍食復以係官荒田牧地量數與之令其自耕則民不失業官不厲民矣從之三年十月高汝礪言河北軍戸徙居河南者幾萬口人日給粟一升歲費三百六十萬石半以給直猶支三百萬河南租地計二十四萬頃歲租纔一百五十六萬乞於經費之外倍徴以給之遂命右司諌馮開等五人分諸郡就授以荒官田及牧地可耕者人三十畝十一月又議以括荒田及牧馬地給軍命尚書右丞高汝礪總之汝礪還奏今頃畝之數較之舊籍甚少復瘠惡不可耕均以可耕者與人無幾又僻逺之處必徙居以就之彼皆不能自耕必以與人又當取租於數百里之外况今農田且不能盡闢豈有餘力以農叢薄交固草根紏結之荒地哉軍不可仰此得食也審矣今詢諸軍戸皆曰得半糧猶足自飬得田不能耕復罷其廩將何所頼臣知初籍地之時未嘗按閲其實所以不如其數不得其處也若復考計州縣必各妄承風㫖追呼究詰以應命不足其數則妄以指民田充之則所在騷然矣今民之賦役三倍平時飛輓輪轉日不暇給而復為此舉何以堪之且軍戸蹔遷行有還期何為以此病民哉病民而軍獲利猶不可為况無所利乎惟陛下加察遂詔罷給田但半給糧半給實直焉四年復遣官括河南牧馬地既籍其數上命省院議所以給軍者宰臣曰今軍戸當給糧者四十四萬八千餘口計當口占六畝有竒繼来者不與焉但相去數百里者豈能以六畝之故而逺来哉兼月支口糧不可遽罷臣等竊謂軍戸願佃者卽當計口給之其餘僻逺不願者宜准近制係官荒地許軍民耕闢例令軍民得占蒔之院官曰牧馬地少且乆荒難耕軍戸復乏農器然不給之則彼自支糧外更無從得食非蓄銳待敵之計給之則亦未能遽減其糧若得遲以嵗月俟頗成倫次漸可以省官廩耳今奪其有力者即以授其無力者恐無以耕乞令司縣官勸率民戸借牛破荒至来春然後給之司縣官能率民戸以助耕而無騷動者量加官賞庻幾有所激勸宰臣復曰若如所言則司縣官貪慕官賞必將抑配以至優民今民家之牛量地而畜之况比年以来農功甫畢則併力轉輸猶恐不及豈有暇耕它人之田也惟如臣等前奏為便詔冄議之乃擬民有能開牧馬地及官荒地作熟田者以半給之為永業半給軍戸奏可四年省奏自古用兵且耕且戰是以兵食交足今諸帥分兵不啻百萬一充軍伍咸仰於官至於婦子居家安坐待哺葢不知屯田為經乆之計也願下明詔令諸帥府各以其軍耕耨亦以逸待勞之䇿也詔從之興定三年正月尚書右丞領三司事侯摯言按河南軍民田總一百九十七萬頃有竒見耕種者九十六萬餘頃上田可收一石二斗中田壹石下田八斗十一取之歲得九百六十萬石自可優給歲支且使貧富均大小各得其所臣在東平嘗試行二三年民不疲而軍用足詔有司議行之四年十月伊里布言軍户自徙於河南數歲尚未給田兼以移徙不常莫得安居故貧者甚衆請括諸屯處官田人給三十畝仍不移屯它所如此則軍戸可以得所官糧可以漸省宰臣奏前此亦有言授地者樞宻院以謂俟事緩而行之今河南罹水災流亡者衆所種麥不及五萬頃殆減往年大半歲所入殆不能足若撥之授為永業俟有獲即罷其家糧亦省費之一端也上從之又河南水災逋戸大半田野荒蕪恐賦入少而國用乏遂命唐鄧裕蔡息壽潁亳及歸德府被水田已燥者布種未滲者種稲復業之戸免本租及一切差𤼵能代耕者如之有司擅科者以違制論闕牛及食者率富者就貸五年正月京南行三司舒穆魯斡魯言京南東西三路屯軍老幼四十萬口歲費糧百四十餘萬石皆坐食民租非善計宜括逋戸舊耕田南京一路舊懇田三十九萬八千五百餘頃内官田民耕者九萬九千頃有竒今飢民流離者大半東西南路計亦如之朝廷雖招使復業民恐既復之後生計未定而賦歛隨之往往匿而不出若分給軍戸人三十畝使之自耕或召人佃種可數歲之後畜積漸饒官糧可罷令省臣議之更不能行租賦金制官地輸租私田輸税租之制不𫝊大率分田之等為九而差次之夏税畝取三合秋税畝取五升又納秸一束束十有五斤夏税六月止八月秋税十月止十二月為初中末三限州三百里外紓其期一月屯田戸佃官地者有司移明安穆昆督之泰和五年章宗諭宰臣曰十月民穫未畢遽令納税可乎改秋税限十一月為初中都西京北京上京遼東臨潢陕西地寒稼穡遲熟夏税限以七月為初凡輸送粟麥三百里外石減五升以上每三百里逓減五升粟折秸百稱者百里内減三稱二百里減五稱不及三百里減八稱三百里及輸本色槀草各減十稱計民田園邸舍車乘牧畜種植之資藏鏹之數徴錢有差謂之物力錢遇差科必按版籍先及富者勢均則以丁多寡定甲乙有横科則視物力循大至小均科其或不可分摘者率以次戸濟之凡民之物力所居之宅不預明安穆昆戸監戸官戸所居外自置民田宅則預其數墓田學田租税物力皆免民愬水旱應免者河南山東河東大名京兆鳯翔彰德部内支郡夏田四月秋田七月餘路夏以五月秋以八月水田則通以八月為限遇閏月則展期半月限外愬者不理非時之災則無限損十之八者全免七分免所損之數六分則全徴桑被災不能蠶則免絲綿絹税諸路雨雪及禾稼收穫之數月以㨗歩申戸部凡叙使品官之家竝免雜役騐物力所當輸者止出雇錢進納補官未至廕子孫及凡有出身者謂司吏譯人等出職帶官叙當身者雜班叙使五品以下及正品承應已帯散官未出職者子孫與其同居兄弟下逮終場舉人係籍學生醫學生皆免一身之役三代同居已旌門則免差發三年後免雜役太宗天㑹元年勅有司輕徭賦勸稼穡十年以遼人士庻之族賦役等差不一詔有司命悉均之熈宗天眷五年十二月詔免民戸殘欠租税皇統三年蠲民税之未足者世宗大定二年五月謂宰臣曰凡有徭役均科強戸不得抑配貧民有言以用度不足奏預借河北東西路中都租税上以國用雖乏民力尤難遂不允三年以歳歉詔免二年租税又詔曰朕比以元帥府從宜行事今聞河南陕西山東北京以東及北邊州郡調發甚多而省部又與他州一例征取賦役是重擾也可憑元帥府已取者例蠲除之五年命有司凡罹蝗旱水溢之地蠲其賦税六年以河北山東水免其租八年十月彰德節度使高昌福上書言税租甚重上乃諭翰林學士張景仁曰今租税比近代甚輕而反以為重何也景仁曰今之税歛殊輕非税歛則國用何從而出二年二月尚書省奏天下倉廩貯粟二千七十九萬餘石上曰朕聞國無九年之蓄則國非其國朕是以括天下之田以均其賦歲取九百萬石自經費七百萬石外二百萬石又為水旱之所蠲免及振貸之用餘纔百萬石而已朕廣蓄積備饑饉也小民以為税重小臣沽民譽亦多議之葢不慮國家緩急之備也十二年正月以水旱免中都西京南京河北河東山東陕西去年租税十三年謂宰臣曰民間科差計所免已過半矣慮小民不能詳知吏縁為姦仍舊徴取其令所在揭榜諭之十月勑州縣官不盡力催督税租以致逋懸者可止其俸使之徴足然後給之十六年正月詔免去年被水旱路分租税十七年上問宰臣曰遼東賦税舊六萬餘石通檢後幾二十萬六萬時何以仰給二十萬後所積幾何戸部契勘謂先以官吏數少故能給今官吏兵卒及孤老數多以此費大上曰當察其實母令妄費也十七年三月詔免河北山東陕西河東西京遼東等十路去年被旱蝗租税十八年正月免中都河北河東山東河南陕西等路前年被災租税十九年秋中都西京河北山東河東陕西以水旱傷民田十三萬七千七百餘頃詔蠲其租二十年三月以中都西京河北山東河東陕西等路前歲被災詔免租税以戸部尚書曹望之之言詔減鄜延及河東南路税五十二萬餘石増河北西路税八萬八千石又詔諸税粟非闗邊要之地者除當儲數外聽民從便折納二十一年九月以中都水災免租前時近官路百姓以牛夫充逓運者復以它處未嘗就役之家徴錢償之二十三年宗州民王仲規告乞徴還所役牛夫錢省臣以奏上曰此既就役復徴錢於彼前雖如此行之復恐所給錢未必能到本戸是兩不便也不若止許所役免租税及鋪馬錢為便其預計實數以聞若和雇價值亦湏裁定也有司上其數歲約給六萬四千餘貫計折粟八萬六千餘石上復命自今役牛夫之家以去道三十里内居者充役二十六年軍民地罹水旱之災者二十一萬頃免税凡四十九萬餘石二十七年六月免中都河北等路嘗被河决水災軍民租税十一月詔河水泛溢農田被災者與免差税一年懐衛孟鄭四州塞河勞役并免今年差税章宗大定二十九年赦民租十之一河東南北路則量減之尚書省奏兩路田多峻阪磽瘠者往往再歲一易若不以地等級蠲除則有不均遂勅以赦書特免一分外中田復減一分下田減二分舊制夏秋税納麥粟草三色以各處所需之物不一戸部復令以諸所用物折納上封事者言其不可戸部謂如此則諸路所湏之物要當和市轉優民矣遂命太府監應折納之物為祗承宫禁者治黄河薪芻增直二錢折納如黄河岸所用木石固非土産乃令所屬計置而罷它應折納者四月上封事者乞薄民之租税恐廩粟積乆腐敗省臣奏曰臣等議大定十八年戸部尚書曹望之奏河東及鄜延兩路税頗重遂減五十二萬餘石去年赦十之一而河東瘠地又減之今以歲入度支所餘無幾萬一有水旱之灾既蠲免其所入復出粟以振之非有備不可若復欲減將何以待之如慮腐敗令諸路以時曝晾毋令致壊違者問如律制可十一月尚書省奏河南荒閑官地許人計丁請佃願仍為官者免租八年願為己業者免税三年詔從之昌明二年二月勅自今民有訴水旱災傷者即委官按視其實申所屬州府移報提刑司同所屬檢畢始令翻耕三年六月有司言河州水傷闕食之民猶有未輸租者詔蠲之九月以山東河北三路被災其勸閣之租及借貸之粟令俟歲豐日熟徴上如秋山免圍塲經過人戸今嵗夏秋租税之半四年冬十月上行幸諭㫖尚書省曰海壖石城等縣地瘠民困所種惟黍稗而已及賦於官必以易粟輸之或令止課所産或依河東路減歲至還京當定議以聞五年勅免河决被災之民秋租泰和四年四月以乆旱下詔責躬免所旱州縣今年夏税九月陳言者謂河間滄州逃戸物力錢至數千貫而其差發有司止取辦於見戸民不能堪矣詔令按察司除地土物力命隨其業而權止其浮財物力五年正月詔有司自泰和三年嘗所行幸至三次者被科之民特免半年租税八年五月以宋請和詔天下免河南山東陕西六路今年夏税河東河北大名等五路半之八月詔諸路農民請佃荒田者與免租賦三年作己業者一年自首冒佃及請佃黄河退灘地者不在免例宣宗貞祐三年十月御史田逈秀言方今軍國所需一切責之河南有司不惜民力㣲調太急促其期限痛其棰椘民已罄其所有而不足遂使奔走旁求於它境力竭財殫相踵散亡禁之不能止也乞自今凡科徴必先期告之不急者皆罷庻民力寛而逋者可復詔行之十二月詔免逃戸租税四年三月免陕西逃戸租五月山東行省布薩安貞言泗州被災道殣相望所食者草根木皮而已而邳州戍兵數萬急徴重役悉出三縣官吏酷暴擅括宿藏以應一切之命民皆逋竄又别遣進納閑官以相廹督皆怗勢營私實到官者纔十之一而徒使國家有厚歛之名乞命信臣革此弊以安百姓詔從之興定元年二月免南京嵩汝等逋租十六萬石四年御史中丞完顔伯嘉奏亳州大水計當免租三十萬石而三司官不以實報止免十萬而已詔命治三司官虚妄之罪七月以河南大水下詔免租勸種且命叅知府事李復亨為宣慰使中丞完顔伯嘉副之十月以乆雨令寛民輸税之限十一月上曰聞百姓多逃而逋賦皆抑配見戸人何以堪軍儲既足宜悉除免今又添軍湏錢太多亡者豈肯復業乎遂命行部官閱實免之已代納者給以恩例或除它役仍減桑皮故紙錢四之一三年令逃戸復業者但輸本租餘苦役一免皆免能代耕者免如復戸有司失信擅科者以違制論四年十二月鎭南軍節度使溫特赫思敬上書言今民輸税其法大抵有三上戸輸逺倉中戸次之下戸最近然近者不下百里逺者數百里道路之費倍於所輸而雨雪有稽違之責遇賊有死傷之患不若止輸本郡令有司檢算倉之所積稱屯兵之數使就食之若有不足則増歛於民民計所歛不及道里之費將忻然從之矣五年十月上諭宰臣曰比欲民種多麥故令所在官貸易麥種今聞實不貸與而虚立案簿反收其數以補不足之租其遣使究治元光元年上聞向者有司以徴租税之急民不待熟而刈之以應限今麥将熟矣其諭州縣有犯者以慢軍儲治罪九月權立職官有田不納租罪京南司農卿李蹊言按齊民要術麥晩種則粒而不實故必八月種之今南路計當輸秋税百四十餘萬石草四百五十餘萬束皆以八月為終限若輸逺倉及泥淖往返不下二十日使民不暇趨時是妨來嵗之食也乞寛征斂之限使先盡力于二麥朝廷不從元光二年宰臣奏去嵗正月京師見糧纔六十餘萬石今三倍矣計國用頗足而民間租税徴之不絶恐貧民無所輸而逋亡也遂以中㫖遍諭止之牛頭税即牛具税明安穆昆部女直户所輸之税也其制每耒牛三頭為一具限民口二十五受田四頃四畆有竒嵗輸粟大約不過一石官民占田無過四十具天㑹三年太宗以嵗稔官無儲積無以備饑饉詔令一耒賦粟一石每穆昆别為一廩貯之四年詔内地諸路每牛一具賦粟五斗為定制世宗大定元年詔諸明安不經遷移者徴牛具嵗粟就令穆昆監其倉虧損則坐之十二年尚書省奏唐古部民舊同明安穆昆定税其後改明州縣履畆立税頗以為重遂命從舊制二十年定功授世襲穆昆許以親族從行當給以地者除牛九具以下全給十具以上四十具以下者則于官豪之家量撥地六具與之二十一年世宗謂宰臣曰前時一嵗所收可支三年比聞今嵗山西豐稔所穫可支三年此間地一嵗所穫不能支半嵗而又牛頭税粟每牛一頭止令各輸三斗又多逋懸此皆逓互隠匿所致當令盡實輸之二十三年有司奏其事世宗謂左丞完顔襄曰卿家舊止七具今定為四十具朕始令卿等議此而卿皆不欲盖各頋其私爾是後限民口二十五筭牛一具七月尚書省復奏其事上慮版籍嵗乆貧富不同明安穆昆又皆年少不練時事一旦軍興按籍徴之必有不均之患乃令騐實推排閲其户口畜産之數其以上京二十二路來上八月尚書省奏推排定明安穆昆户口田畆牛具之數明安二百二穆昆千八百七十八户六十一萬五千六百二十四口六百一十五萬八千六百三十六内正口四百八十一萬二千六百六十九奴婢口一百三十四萬五千九百六十七田一百六十九萬三百八十頃有竒牛具三十八萬四千七百七十一在都宗室將軍司户一百七十口二萬八千七百九十内正口九百八十二奴婢口二萬七千八百八田三千六百八十三頃七十五畆有竒牛具三百四徳哷勒唐古二部五乣户五千五百八十五口十三萬七千五百四十四内正口十一萬九千四百六十二奴婢口一萬八千八十一田四萬六千二十四頃一十七畆牛具五千六十六後二十六年尚書省奏併徴牛頭税粟上曰積壓五年一旦併徴民何以堪其令民隨年輸納被災者蠲之貸者俟豐年徴還金史卷四十七
