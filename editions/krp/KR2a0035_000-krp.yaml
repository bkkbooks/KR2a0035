詳於二十五埽百官志之首叙建諸官箴本本元元具有條理食貨志則因物力之微而歎其初法之不慎選舉志則因令史之正班而推言仕進之末弊交聘表則數宋人三失而惜其不知守險不能自强皆切中事機意存殷鑒卓然有良史之風惟列傳中頗多疎舛如楊朴佐太祖開基見於遼史而不為立傳晉王宗翰之上書乞免見北盟㑹編瀋王宗弼之遺令處分見建炎以來繫年要録皆有闗國政而本傳不書皆乖體例至昌本之南走施宜生之泄謀宇文虚中之謗訕傳聞異辭皆未能核定亦由於祗據實録未暇旁考諸書然宋史載兩國兵事多採摭宋人所記不免浮詞如采石之戰其時海陵士卒聞大定改元離心自潰虞允文攘以為功殊非事實此書所載獨得其真泰和以後諸臣𫝊尤能悉其情事葢好問等得諸目睹與傳聞異辭者殊也乾隆四十九年十一月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
