front:
  text: 御製改譯遼金元三史序
  hash: sha256:899f40dd3083f8f04a4991530cb780f67e5159180190584175897df13f155692
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2a0035_WYG_000-1a, image: WYG0290/WYG0290-0001a.png}
body:
  text: 改譯遼金元三史成司事者以序請史無序例也齊梁陳書及後五代乃有序葢出於宋臣修史者剏為之飾例也亦足以觀其政之不綱而事之紛紊也若今三史之請序将比於孰乎曰彼之序皆序其事而此之序乃序其言則不可以齊梁等比之矣序其言亦非為之修辭飾說乃改譯漢文譯其國語之訛誤者至於其國制度之理亂君臣之得失未嘗一字易葢史者信也所以傳萬世垂法戒彼其時之史㦯已不能保其必信數百年之後無庸為之修飾且改譯者不過正其訛誤之語而其舊史之布天下者自在也讀史者執舊簡而証以新書則可知語之異而事之同則此序之不可不作乃所以明吾志也夫春秋一字之褒貶示聖人大公至正之心若遼金元三國之譯漢文則出于秦越人視肥瘠者之手性情各别語言不通而又有謬寓嗤斥之意存焉此豈春秋一字褒貶之為哉向于改譯三史之㫖及同文韻綂熱河志諸序已屢言之兹不復綴夫遼金雖稱帝究屬偏安元雖一綂而主中華者纔八十年其時漢人之為臣僕者心意終未浹洽我國家承天庥命建極垂綂至於今百四十年矣漢人為臣僕者自其髙曽逮将五世性情無所不通語言無所不曉且今之纂修諸臣即有善通清書兼習諸國字之人則兹三史必當及此時而改譯其訛誤者是則吾于遼金元三代實厚有造而慰焉雖然是造非吾造乃天造我國家重熙累洽而後得此則所以祈天永命日慎一日之忱惟益兢兢懼乃勝于慰焉云耳御製讀金史遼金元三史人地名音譯訛舛鄙陋失實者多因命儒臣按同文韻統例概行更錄盖正其字弗易其文以史者所以傳信示公不可以意改也兹閱所進金史見其中文法多有未當者如稱元兵為大兵大軍以元臣修金史理固宜然而扵大兵大軍等句下或接以上或稱朝廷則又皆叙金朝事略無界限分别使淺學者觀之㡬不能辨其為何代語是乃文義不佳之故然此猶小疵非若人地名之謬誤宜改仍其舊可也至若崔立傳贊云其志方且要求劉豫之事我大朝豈肯效尤金人者乎金俘人之主帝人之臣百年之後遂唘崔立之狂謀以成青城之烈禍云云直是痛加詆斥實為非體夫一代之史期於傳信若逞弄筆鋒輕貶勝國則千秋萬世之史皆不足信是則有闗扵世道人心者甚大推之明修元史𩔖此者應亦不少然史書流傳已久難以釐正亦不得不仍其舊若我本朝修明史扵當時賢奸善惡皆據事直書即各篇論賛亦皆覈實立言不輕為軒輊誠以作史乃千秋萬世之定論而非一人一時之私言予向命纂通鑑輯覽扵眀神宗以後仍大書眀代紀年而扵本朝定鼎燕京之初尚存福王年號此實大公至正可以垂示天下後世豈若元托克托等之承修金史妄毁金朝者之狃扵私智小見所可同日語㢤書此以揭重刋金史之首抑亦有慨扵前而所以深誡扵後也欽定四庫全書史部一金史目録正史類本紀十九卷志三十九卷表四卷列傳七十三卷凡一百三十五卷卷一本紀第一世紀卷二本紀第二太祖卷三本紀第三太宗卷四本紀第四熙宗卷五本紀第五海陵卷六本紀第六世宗上卷七本紀第七世宗中卷八本紀第八世宗下卷九本紀第九章宗一卷十本紀第十章宗二卷十一本紀第十一章宗三卷十二本紀第十二章宗四卷十三本紀第十三衛昭王卷十四本紀第十四宣宗上卷十五本紀第十五宣宗中卷十六本紀第十六宣宗下卷十七本紀第十七哀宗上卷十八本紀第十八哀宗下卷十九本紀第十九世紀補卷二十志第一天文卷二十一志第二歴上卷二十二志第三歴下卷二十三志第四五行卷二十四志第五地理上卷二十五志第六地理中卷二十六志第七地理下卷二十七志第八河渠卷二十八志第九禮一卷二十九志第十禮二卷三十志第十一禮三卷三十一志第十二禮四卷三十二志第十三禮五卷三十三志第十四禮六卷三十四志第十五禮七卷三十五志第十六禮八卷三十六志第十七禮九卷三十七志第十八禮十卷三十八志第十九禮十一卷三十九志第二十樂上卷四十志第二十一樂下卷四十一志第二十二儀衛上卷四十二志第二十三儀衛下卷四十三志第二十四輿服卷四十四志第二十五兵卷四十五志第二十六刑卷四十六志第二十七食貨一卷四十七志第二十八食貨二卷四十八志第二十九食貨三卷四十九志第三十食貨四卷五十志第三十一食貨五卷五十一志第三十二選舉一卷五十二志第三十三選舉二卷五十三志第三十四選舉三卷五十四志第三十五選舉四卷五十五志第三十六百官一卷五十六志第三十七百官二卷五十七志第三十八百官三卷五十八志第三十九百官四卷五十九表第一宗室卷六十表第二交聘上卷六十一表第三交聘中卷六十二表第四交聘下卷六十三列傳第一后妃上始祖明懿皇后徳帝思皇后安帝節皇后獻祖恭靖皇后昭祖威順皇后景祖昭肅皇后世祖簡翼皇后肅宗靖宣皇后穆宗貞惠皇后康宗敬僖皇后太祖聖穆皇后太祖光懿皇后太祖欽憲皇后太祖宣獻皇后太祖崇妃蕭氏太祖欽仁皇后熈宗悼平皇后海陵嫡母徒單氏海陵母太氏海陵后徒單氏諸嬖附卷六十四列傳第二后妃下睿宗欽意皇后睿宗貞懿皇后世宗昭徳皇后世宗元妃張氏世宗元妃李氏顯宗孝懿皇后顯宗昭聖皇后章宗欽懷皇后章宗元妃李氏衛紹王后徒單氏宣宗皇后王氏宣宗明惠皇后哀宗徒單皇后卷六十五列傳第三始祖以下諸子始祖子斡魯徳帝子博囉安帝子錫赫特孫巴達錫哩布子博諾錫里庫獻祖六子昭祖子烏肯徹伯赫𤣥孫崇成本名布呼景祖子噶順子普嘉努滿丕子滿都布們都們圗琿世祖子威泰烏色子宗永烏哲孫璋昻本名烏達子正嘉卷六十六列傳第四始祖