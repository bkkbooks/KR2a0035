body:
  text: 金史卷一百二十元中書右丞相總裁托克托等修列傳第五十八世戚實嘉努費摩達本名呼達呼敦圖克坦恭本名舍音烏庫哩富勒呼唐古徳温本名阿里烏庫哩尼瑪哈富察額古徳烏凌阿暉木名摩羅歡富察鼎壽本名和尚圖克坦思忠本名寧慶圖克坦繹本名珠巴克烏凌阿復本名額哩埒烏庫哩元忠子誼唐古貢本名達格烏凌阿琳本名瑠珠圖克坦公弼本名錫林圖克坦銘圖克坦肆喜金昭祖娶圖克坦氏后妃之族自此始見世祖時烏春為難世祖欲求昏以結其驩心烏春曰女直與呼爾哈豈可為昏世宗時賜瓜爾佳清臣族同國人清臣呼爾哈人也然則四十七部之中亦有不通昏姻者矣其故則莫能詰也有國家者昏姻有恒族能使風氣淳固親義不渝而貴賤等威有别焉蓋良法也歟作世戚傳實嘉努富察部人世居按春水祖和勒端世祖外孫和諾克薩塔之亂昭肅皇后父母兄弟皆在敵境和勒端以計迎還之實嘉努自幼時撫義于太祖家及長太祖以女妻之年十五從攻寧江州敗遼主親軍攻臨潢府皆有功襲穆昆其後自山西䕶其國王摩囉歡之䘮歸上京道由興中是時方攻興中未下實嘉努置柩于驛率其所領明安兵助王帥遂破其城從宗望討張覺再從宗翰伐宋宗䎐聞宗望軍已圍汴遣實嘉努計事抵平定軍遇敵兵數萬敗之遂見宗望已還報宗翰聞其平定之戰甚嘉之明年復伐宋實嘉努隸羅索軍羅索討陜西未下實嘉努領所部兵援之既而以本部屯戍西京㑹契丹達實出奔以伊都為元帥實嘉努為副襲諸部族以還未幾疾退居郷里天眷間授侍中駙馬都尉再以都統定邊部熙中賜御書嘉奬之封蘭陵郡王除東京留守以病致仕卒年六十三加贈鄖王正隆例奪王爵封魯國公費摩逹本名呼達博勒和部人為人淳直孝友天輔六年從普嘉努追叛宼於徳里州力戰有功熙宗娶呼達女是為悼平皇后天眷元年授世襲明安明年以皇后父拜太尉封徐國公皇統元年除㑹寧牧居數歲以太尉奉朝請九年悼后死無何海陵殺熙宗欲邀衆譽揚熙宗過惡以悼后死非罪於是封呼達為王天徳三年薨子忽都為燕京留守以罪免居中都海陵命馳驛赴之及𦵏使秘書監納哈塔椿年致祭賻銀五百兩呼敦天眷三年權明安皇海元年為行軍明安歴横海崇義軍節度使以后戚怙勢贓汙不法其在横海拜富人為父及死為之行服而分其資在崇義諷寺僧設齋受其施留守中京益驕恣苟可以得財無不為者選諸明安富人子弟為章京規財物時號閑閑君朝廷以呼敦與圖克坦㳟等汙濫至甚命秉徳黜陟天下官吏呼敦以贓罷海陵以呼敦所至從家奴擾民乃定禁外官任所閑雜人條約天徳三年復起為鄭州防禦使改安國軍節度使卒年三十九圖克坦㳟本名舍音天眷二年為奉國上將軍以告烏舍反超授龍虎衛上將軍為戸部侍郎遂出為濟南尹遷㑹寧牧封譚國公復出為太原尹舍音貪鄙使工繪一佛像自稱嘗見佛其像如此當以金鑄之遂賦屬縣金而未嘗鑄佛盡入其家百姓號為金總管秉徳廉訪官吏舍音以贓免海陵簒立其后圖克坦氏舍音女由是復用為㑹寧牧封王未幾拜平章政事海陵獵於和爾和水舍音編立圍場凡平日不相能者輒杖之海陵謂宰相曰舍音為相朕非私之今聞軍國大事凡舍音所言卿等一無取豈千慮無一得乎他宰相無以對温都思忠舉數事對曰某事本當如此舍音輒以為如彼皆妄生異議不達事宜臣逮事康宗累朝宰相未嘗有如舍音専恣者海陵黙然舍音於都堂脊杖令史馮仲尹御史臺劾之海陵杖之二十舍音明安部人薩克蘇者言舍音强率取部人財物海陵命侍御史博囉鞫之博囉鞫不以實海陵杖博囉而以薩克蘇為符寳祗候改隸哈濟明安舍音兄定格尚太祖長女烏嚕定格死無子以季弟子扎拉為後舍音謀取其兄家財物强納烏嚕為室而不相能烏嚕嘗怨詈舍音舍音妾呼達與烏嚕不叶乃譖烏嚕於海陵圖克坦后曰烏嚕怨上殺其兄宗敏有怨望語㑹韓王亨改廣寧尹諸公主宗婦往賀其母烏嚕以言慰亨母呼達亦以怨望指斥誣烏嚕海陵使蕭裕鞫之呼達得幸于圖克坦后左驗皆不敢言遂殺烏嚕舍音乃盡奪扎拉家財大定間皆追正之海陵以烏嚕有怨望語舍音不奏遂杖舍音免所居官俄復為司徒進拜太保領三省事兼勸農使再進太師封梁晉國王貞元二年九月舍音從海陵獵于順州方獵聞舍音薨即日罷獵臨其䘮親為擇葬地遣使營治及葬腸輼輬車上及后率百官祭之賜諡曰忠正隆間改封趙國公再進齊國公其妻先舍音卒海陵嘗至其葬所致祭起復其子率府率幹里雅布為諌議大夫大定間海陵降為庶人圖克坦氏為庶人妻降舎音特進鞏國公烏庫哩富勒呼父當堪國初有功富勒呼通契丹大小字娶宋王宗望女昭寧公主實庫熙宗初為䕶衛改牌印常侍左右轉通進襲父穆昆再遷臨海軍節度使改衛州防禦使海陵賜食内殿謂之曰衛州風土甚佳勿以防禦為降也對曰頗聞衛州官署不利守者即日改汾陽軍節度使賜衣服佩玉帶劔入為太子詹事卒年四十一海陵親臨哭之后妃皆弔祭賻贈甚厚有司給䘮事贈特進駙馬都尉正隆例贈光禄大夫唐古特溫本名阿里上京刷河人也曾祖實庫從太祖平拉必瑪察領穆昆祖特伯烈領其父穆昆從太祖伐遼攻寧江泰州戰有功父達蘭尚康安女從宋王宗望以軍二萬收平州至城東十里許遇敵兵甚衆戰敗之太祖賞賚甚厚授行軍明安皇統初遷龍虎衛上將軍歴興平臨海等軍節度使徳温善射尚睿宗皇帝女楚國長公主天眷三年授宣武將軍皇統元年從都元師宗弼南征以善突戰遷廣威將軍六年遷定逺大將軍七年授殿前右副都㸃檢天徳初改殿前左副都㸃檢遷兵部尚書出大名尹兼本路兵馬都總管官改横海軍節度使延安尹兼鄜延路兵馬都總管世宗即位封道國公為殿前都㸃檢駙馬都尉大定二年以父祖功授按春明安所管世襲穆昆三年九月九日世宗以故事出獵謂徳温曰扈從軍士二千人飲食芻秣能無擾百姓乎嚴為約束仍以錢一萬貫分給之四年為勸農使出為西京留守賜犀弓玉帶召入為皇太子太𫝊卒上輟朝親臨䘮奠祭賻贈甚厚十八年追録其父達蘭并徳温前後功授其長子駙馬都尉鼎世襲西北路摩哩山明安徙隸泰州烏庫哩尼瑪哈上京和倫屯人也移屯河間祖和勒端太祖伐遼常侍左右追遼主延禧却夏人援兵皆有功授世襲穆昆父罕都官至廣威將軍尼瑪哈尚睿宗女冀國長公主初為䕶衛天徳二年襲穆昆海陵伐宋為押軍明安世宗即位軍還授侍衛親軍步軍都指揮使加駙馬都尉歴左副㸃檢禁直被酒不親視扄鐍杖四十遷右宣徽使勸農使出為興平軍節度使改廣寧尹賜錢三千貫尼瑪哈至廣寧嗜酒不視事上以兵部員外郎宗安為少尹詔宗安戒諭之上謂宗安曰汝能繼修前政朕不忘汝勉之大定中尼瑪哈卒上聞之遣其子駙馬都尉公説馳驛奔䘮賜錢三千貫㳂路祭物並從官給富察額古徳初授信武將軍尚海陵姊遼國長公主都本為駙馬都尉遼國薨繼尚鄧國長公主催格皇統三年為右副㸃檢五年使宋為賀正旦使改左副檢檢禮部工部尚書廣寧咸平臨潢尹武定軍節度使封葛王薨年二十八海陵親臨葬贈譚王正隆例贈特進楚國公烏凌阿暉本名摩囉歡明徳皇后兄也天眷初充䕶衛以捕宗磐宗雋功授忠勇校尉遷明威將軍從宗弼北征遷廣威將軍賞以金幣尚廐擊毬馬久之除殿中侍御史再除布沙堪群牧使謹畜牧不事遊宴孳産蕃息進秩改特們群牧使世宗即位召見行在除中都兵馬都指揮使世宗至中都將遣使於宋以暉為使世宗曰暉嘗私用官錢五百貫廼數其罪而罷之遣髙忠建往因謂宰臣曰朕於賞罰毫髮無所假借果公㢘辦治雖素所不喜必加升擢抵冐公法雖至親亦不少恕遷都㸃檢兼侍衛親軍副都指揮使卒遣官致祭皇太子都王百官㑹䘮賻銀千兩重綵四十端絹四十匹詔以暉第三子天賜世襲納琳河明安親管穆昆富察鼎壽本名和尚上京和碩河人欽懐皇后父也賦性沉厚有明鑒通契丹漢字長於吏事尚熙宗女鄭國公主貞元三年以海陵女弟慶宜公主子加定逺大將軍為尚衣局使累官器物局使大定二年加駙馬都尉職如故歴符寶郎蠡州刺史濬州防禦使有恵政兩州百姓刻石紀之遷泰寧軍節度使歴東平府横海軍入為右宣徽使改左宣徽授中都路温圖琿山明安和碩穆丹世襲穆昆改河間尹號令必行豪左屏跡有宗室居河間侵削居民鼎壽奏徙其族于平州郡内大治卒官上聞之深加悼惜䘮至香山皇太子往奠百官致祭賻銀綵絹明昌三年以皇后父贈太尉越國公鼎壽既世連姻威女為皇后長子希卜蘇凡三尚定國景國道國公主其寵遇如此未嘗以富貴驕人當時以為外威之冠云圖克坦思忠字良弼本名寧慶曽祖薩布尚景祖女從太祖伐遼戰殁臨潢之渾河父賽音尚熈宗妹正隆末為乣椀羣牧使契丹賊斡罕擾北邊賽音與戰死之大定初贈金吾衛上將軍思忠通敏有才頗通經史世宗在潛邸撫養之賦性寛厚十有二嵗從上在濟南一日與姻戚公子出遊近郊有醉人腰弓矢䇿馬突過諸公子怒欲鞭之思忠曰醉人昏昧又何足責遂釋之其人行數十步忽執弓矢思忠恐上人速馳馳至其傍奪其弓弛而還之上聞之嘉有識量由是常使侍側尚皇第二女唐國公主大定初世宗使思忠迎南征萬戸髙忠建完顔福壽于遼口察其去就思忠知其誠意乃與俱至東京世宗即位如中都思忠從行軍國庶事補益𢎞多大定元年十月拜殿前左衛將軍二年加駙馬都尉卒上為輟朝即䘮所臨奠命有司備禮葬之營費從官給十九年上追念思忠輔立功贈驃騎衛上將軍仍授其子鐸武功將軍世襲中都路溫圖琿穆昆圖克坦繹本名珠巴克其先上京阿勒楚喀達人祖薩噶爾瑪克國初有功授隆安府路哈濟穆昆多科阿林明安繹美姿儀通諸國語尚熙宗第七女瀋國公主充符寳祇候遷御院通進授符寳郎歴宣徳泰安淄州刺史有亷名改同知廣寧府事以毋鄂國公主憂不赴世宗特許以憂制中襲父封服闋授同知濟南府事二十六年遷棣州防禦使以政迹聞升臨海軍節度使卒繹家世貴寵自曽祖繹尙公主者凡四世云烏凌阿復本名額哩埒東平人也奉御出身大定七年尙世宗第七女宛國公主授駙馬都尉改引進使兼符寳郎出為蠡州刺史三遷歸徳軍節度使明昌三年轉知興中府事久之為海蘭路兵馬都總管承安四年拜絳陽軍節度使卒烏庫哩元忠本名額哩頁其先上京特卜庫人父額琳尙太祖女畢國公主元忠㓜秀異世宗在潛邸以長女妻之後封魯國大長公主正隆末從海陵南伐世宗即位遼陽時太保昂為海陵左領軍大都督遣元忠朝于行在遂授定逺大將軍擢符寳郎諭之曰朕初即位親密無如汝者侍從宿衛宜戒不虞大定二年加駙馬都尉除近侍局使遷殿前左衛将軍從世宗獵上欲射虎元忠諌止之進殿前右副都㸃檢為賀宋正旦使還轉左副都檢檢坐家奴結㰖民税免官十一年復舊職明年升都㸃檢十五年北邊進獻命元忠往受之及還詔諭日朕每遇卿直宿其寢必安今夏幸景明宮卿去久朕甚思之㑹大興府守臣闕遂以元忠知府事有僧犯法􅕀捕得寘獄皇姑梁國大長公主屬使釋之元忠不聴主奏其事世宗詔謂曰卿不徇情甚可嘉也治京如此朕復何憂秩滿授吏部尚書以其子誼尚顯宗長女薛國公主十八年擢御史夫夫授薩巴山世襲穆昆世宗問左丞相赫舍哩郎弼執可相者良弼以元忠對乃拜平章政事封任國公進尚書右丞相䇿論進士之科設元忠贊成之世宗將幸㑹寧元忠進諌不聴出知真定府尋復詔為右丞相世宗欲甓上京城元忠曰此邦遭正隆軍興百姓凋弊陛下休養二十餘年尚未完復况土性疎惡甓之恐難經久風雨摧壞嵗嵗繕完民將益困矣駕東幸久之未還元忠奏曰鸞輿駐此已閲歳倉儲日少市買漸貴禁衛暨諸局署多逃者有司捕寘諸法恐傷陛下仁愛世宗嘉納之尋出為北京留守責諭之曰汝强悍自用覬權而結近密汝心叵測其速之官後左丞張汝弼奏事世宗惡其阿順謂左右曰卿等毎事依違茍避不肯盡言髙爵厚禄何以勝任如烏庫哩元忠為相剛直敢言義不顧身誠可尚也於是改知真定府事移知河間明昌二年知廣寧府以河間修築毬塲擾民㑹赦下除順義軍節度使乞致仕不許特加開府儀同三司北京留守徙知濟南府過闕令預晏班平章政事之上承安二年移守南京尋改知彰徳府卒訃聞上遣宣徽使白琬燒飯賻物甚厚元忠素貴性麤豪而内深忌世宗嘗責之又所至不能戢奴僕世以此為訾云子誼誼本名雄名大定八年尚海陵女宴宗室及六品以上官命婦預焉上曰此女亦太祖之曽孫猶朕之女乃父廢亡非其女之罪也海陵女卒大定二十一年尚顯宗女廣平郡主誼歴仕宮衛為人麤豪類其父二十六年上謂原王曰元忠物望其可復相也雄名又不及乃父朕嘗宥待殊不知恩汝宜知其為人謂平章政事襄曰雄名可令補外自棭宫已有㫖補外者比及比及廷授即每令入宫於是誼除同知澄州軍州事章宗即位廣平郡主進封鄴國長公主誼改順天軍節度副使加駙馬都尉承安元年累遷秘書監兼吏部侍郎改刑部遷工部尚書泰和元年遇父元忠憂二年以本官起復三年知東平府事改知真定府事六年伐宋遷元帥左都監七年轉左監軍八年拜御史大夫大安中知大名府至寧初以謀逆伏誅唐古貢本名格哥太𫝊阿里之子也尚世宗第四女吳國公主授駙馬都尉充奉御特授拱衛直副都指揮使五遷刑部侍郎坐擅離職削官一階出為徳州防禦使升順天軍節度使移鎮横海召為左宣徽使遷兵部尚書改吏部轉禮部尚書兼大理卿先是大理卿闕世宗命宰臣選可授者左丞張汝弼舉西京副留守楊子益法律詳明上曰子益雖明法而用心不正豈可任之以分别天下是非也大理湏用公正人右丞鈕祜禄額特埓舉貢可任以閑簡部分兼領是職遂以貢為之二十八年拜樞密副使章宗立為御史大夫㑹貢生日右丞相襄參知政事劉瑋吏部郎中膏中都兵馬都指揮使和喜為貢壽遂犯夜禁和喜遣軍人送襄至第監察御史圖克坦徳勝劾奏下刑部逮膏等問狀上以襄瑋大臣釋之而貢等各解職尋知大興府事復為樞密副使乞致仕不許進樞密使封莘國公改封蕭復上表乞退上曰向已嘗告續知意欲外除今之告將復若何遂優詔許之尋起知真定府事泰知二年薨烏凌阿琳本名瑠珠尚郜國公主加駙馬都尉貞祐元年為靜難軍節度使夏人犯邠州琳降知延安府遣通事張福孫至夏國夏人使福孫見琳時已中風公主令人以狀付福孫屬以懇禱朝廷冀早太平得還鄉之意福孫具以聞詔賜以藥物圖克坦公弼本名錫林河北東路算卓和明安人父富均努尚熙宗女加駙馬都尉終武定軍節度使公弼初充奉御大定二十七年尚世宗女息國公主加定逺大將軍駙馬都尉改器物局直長轉副使兼近侍局直長丁父憂起復木局副使章宗秋出射虎虎怒突而前侍衛皆避去公弼不動虎亦隨斃詔責侍衛而尉諭公弼除濵州刺史再遷兵部侍郎累除知大名府事是時伐宋軍興有司督逋租及牛頭税甚急公弼奏軍士從戎民亦疲弊可緩徴以紓民朝廷從之大安初知大興府事讞武清盗疑其有寃已而果獲真盗歲餘拜參知政事進右丞轉左丞至寧初拜平章政事封定國公貞祐初進拜右丞相罷知中山府事是時中都圍急不可行圍解宣宗曰中山新被兵不如河中善乃改知河中府歴定國軍節度使事太孫太師同判大睦親府事興定五年薨宣宗輟朝賻贈諡恪愿圖克坦銘字國本顯宗賜名重泰祖貞有傳父特進涇國公性重黙寡言粗通經史事母盡孝大定末充奉御章宗即位特勅襲中都路歡塔山明安明昌五年授尚醖署直長累遷侍儀司令宿直將軍尚衣局使兵部郎中與大理評事孫人鑑為採訪使覆按提刑司事改右衛將軍轉左衛出為永定軍節度使移河南北路按察使轉運使大安三年改知大名府就陞河北東西大名路安撫使大名荐饑重困銘乞大出交鈔以振之崇慶初移知真定府復充河北東西大名路宣撫使至寧元年九月奉迎宣宗于彰徳府俄拜尚書右丞出為北京留守以路阻不能赴貞祐二年卒贊曰天子娶后王姬下嫁豈不重哉秦漢以來無世世甥舅之家關雎之道缺外戚驕盈何彼穠矣不作王姬肅雝之義幾希矣古者異姓世爵公侯與天子為昏姻他姓不得參焉女為皇后已尚王姬而自貴其貴富厚不加焉寵榮不與焉使漢唐行此道則無吕氏王氏武氏之難公主下嫁各安其分各得其所矣金之圖克坦納喇唐古富察費摩赫舍哩布薩皆貴族也天子娶后必于是公主下嫁必于是與周之齊紀無異此昏禮之最得宜者盛於漢唐矣圖克坦肆喜哀宗皇后之弟也天興二年正月辛酉夜肆喜内侍馬福恵至自歸徳時河朔已失利京城猶未知二人被㫖迎兩宮遂託以報㨗執小黄旗以入至則奏兩宮以奉迎之意是日召二相入議二相及烏克遜納新諌不可行肆喜作色曰我奉制㫖迎兩宫有敢言不行者當以别勅從事矣二相不復敢言行議遂決制㫖所取兩宮柔妃費摩氏及令人張秀蘃都轄承御湯藥皇乳母鞏國夫人等十餘人外皆放遣之又取宫中寳物馬蹄金四百枚大珠如粟黄者七千枚生金山一龍腦板二及信瑞御璽仍許賜忠孝軍以兩宮隨行物之半丙寅太后御仁安殿出錠金及七寳金洗分賜忠孝軍是夜兩宮騎而出至陳留見城外二三處火起疑有兵遲回問納新初不欲行即承太后㫖馳還丁卯入京頓肆喜家少頃還宫復議以是夜再往太后憊於鞍馬不能動遂止明曰崔立變肆喜珠嘉㙮克實布及㙮克實布之父耀珠肆喜妻完顏氏以忠孝卒九十七騎徑奪曹門往歸徳不得出轉陳州門亦為門卒所止門帥裕州防禦何阿布哈綏赫已遁經歴官完顔和卓權帥職麾門卒放㙮克實布等去且曰罪在我非汝等之過明日立以數十騎召和卓和卓自分必死易衣冠而往立左右扼腕欲加刃立遥見問汝是放忠孝軍出門者耶和卓曰然天子使命某實放之罪在某立忽若有所省顧羣卒言此官人我識之前築裏城時與我同事我所部十餘卒盗官木罪當死此官人不之問但笞數十而已此家能殺人能救人因好謂和卓曰業已放出吾不汝罪也肆喜等至歸徳上驚問兩宫何如二人奏京城軍變不及入宫上曰汝父汝妻獨得出耶下之獄皆斬於市贊曰肆喜奉迎兩宮而值崔立之變智者居此與兩宫周旋兵問以俟事變之定而徐圖之萬一不然以一死徇之耳他無䇿也四喜奉其私親以歸而望人主貸其死豈非愚乎金史卷一百二十
