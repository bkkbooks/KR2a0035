body:
  text: 金史卷七十元中書右丞相總裁托克托等修列傳第八薩哈宗憲本名阿蘭希卜蘇宗亨本名托卜嘉宗賢本名色哩實圖美忠本名都古嚕訥實實思敬本名薩哈薩哈者景祖孫韓國公和卓之長子世祖之兄子也和卓於次最長景祖方計定諸部愛世祖膽勇材畧及諸子長國俗當異宮居而命和卓與世祖同邸和卓専治家務世祖主外事世祖襲節度使越噶順而傳肅宗穆宗皆景祖志也穆宗初襲位念和卓長兄不得立遂命薩哈為國相穆宗履藉父兄趾業鋤除彊梗不服己者使薩哈取瑪奇嶺道攻阿蘇穆宗自將期阿蘇城下會軍薩哈行次阿卜薩水烏雅部色埒貝勒來謁謂薩哈曰聞國相將與太師會軍阿蘇城下此為深入必取之策宜先撫定珊沁錫馨之路落其黨附奪其民人然後合軍未晩也薩哈從之攻通恩城請濟師穆宗與之薩哈遂攻下通恩城而與穆宗來會阿蘇城下通恩在南阿蘇在北穆宗初遣薩哈分道即會攻阿蘇聞其用色埒計先取通恩城與初議不合頗不然之及遼使來止勿攻阿蘇然後深以先取通恩城為功也及以國相都統討埒克卓多烏塔等軍而阿蘇亡入于遼終不敢歸埒克卓多烏塔通恩皆降康宗旣沒太祖稱達貝勒與薩哈分治諸部必塔水以北太祖統之拉林水人民薩哈統之明年甲午嗣節度命方至遼主荒于遊畋政事怠廢太祖知遼可伐遂起兵九月與遼人戰于界上獲色實太祖使告克于薩哈賜以所獲色實乘馬薩哈及將士皆驩呼曰義兵始至遼界一戰而勝滅遼必自此始矣遣子宗翰及完顔希尹來賀捷因勸進太祖未之從也十月師克寧江州破遼師十萬于鴨子河師還十二月太宗及薩哈希卜蘇率諸將復勸進收國元年正月朔太祖即位薩哈行國相如故伐遼之舉決於都古嚕訥其大計實自薩哈啓之薩哈自以宗室近屬且長房繼肅宗為國相旣貴且重故身任大計贊成如此諸人莫之或先也太祖即位後羣臣奏事薩哈等前跪上起泣止之曰今日成功皆諸君協輔之力吾雖處大位未易改舊俗也薩哈等感激再拜謝凡臣下宴集太祖嘗赴之主人拜上亦荅拜天輔後始正君臣之禮焉七月太宗為安班貝勒授薩哈古倫貝勒希卜蘇愛滿貝勒杲古倫齋貝勒所謂貝勒者盖女直之尊官也太祖自正位號凡半歲未聞有封拜太宗介弟優禮絶等杲母弟之最幼者薩哈希卜蘇以宗室同封拜九月加古倫烏赫哩貝勒天輔五年薨太祖往弔乘白馬𠢐額哭之慟及葬復親臨之賵以所御馬薩哈為人敦厚多智長于用人家居純儉好稼穡自始為國相能馴服諸部訟獄得其情當時有言不見國相事何從決及舉兵伐遼薩哈毎以宗臣為内外倚重不以戰多為其功也天會十五年追封燕國王正隆降封陳國公大定三年改贈金源郡王配饗太祖廟廷諡忠毅十五年詔圖像于衍慶宮子宗翰宗憲宗翰别有傳宗憲木名阿蘭頒行女直字書年十六選入學太宗幸學宗憲與諸生俱謁宗憲進止恂雅太宗召至前令誦所習語音清亮善應對侍臣奏曰此左副元帥宗翰弟也上嗟賞久之兼通契丹漢字未冠從宗翰伐宋汴京破衆人爭趨府庫取財物宗憲獨載圖書以歸朝廷議制度禮樂往往因仍遼舊宗憲曰方今奄有遼宋當逺引前古因時制宜成一代之法何乃近取遼人制度哉希尹曰而意甚與我合由是器重之達蘭宗雋倡議以齊地與宋宗憲廷爭折之當時不用其言其後宗弼復取河南陜西地如宗憲策以捕宗磐宗雋功授昭武大將軍修國史累官尚書左丞熙宗從容謂之曰嚮以河南陜西地與宋人卿以為不當與今復取之是猶用卿言也卿識慮深逺自今以往其盡言無隱宗憲拜謝遂攝門下侍郎初熙宗以疑似殺左丞相希尹久之察其無罪深閔惜之謂宗憲曰希尹有大功于國無罪而死朕將錄用其孫如之何宗憲對曰陛下深念希尹錄用其孫幸甚若不先明死者無罪生者何由得仕上曰卿言是也即日復希尹官爵用其孫守道為應奉翰林文字皇統五年將肆赦議覃恩止及女直人宗憲奏曰莫非王臣慶幸豈可有間耶遂改其文使均被焉轉行臺平章政事天德初為中京留守武安軍節度使封河内郡王改太原尹進封鉅鹿郡王正隆例奪王爵再遷震武武定軍節度使世宗即位遣使召之詔曰叔若能來宜速至此若為赫舍哩志寧白彦敬所遏亦不煩叔憂宗憲聞世宗即位先已棄官來歸與使者遇於中都遂見上于小遼口除中都留守即遣赴任詔與元帥完顔古雲同議軍事明年改西京留守八月改南京布薩忠義自行臺朝京師宗憲攝行臺尚書省事召為太子太師上謂宗憲曰卿年老舊人更事多矣皇太子年尚少謹訓導之俄拜平章政事太子太師如故詔以太祖實錄賜宗憲及平章政事完顏元宜左丞赫舍哩良弼判祕書監温王爽各一本伊喇髙善努前為寧州刺史以貪汚免世宗以功臣子孫宗族中無顯仕者以為祕書少監是時母喪未除有司奏其事宗憲曰髙善努傲很貪墨不可致之左右世宗曰朕以其父祖有功爾旣為人如此豈可玷職位哉追還制命因顧右丞蘇保衡參政石琚曰此朕之過舉不可不改卿等當盡心以輔朕也有司言諸路明安穆昆怙其世襲多擾民請同流官以三十月為考詔下尚書省議宗憲乃上議曰昔太祖皇帝撫定天下誓封功臣襲明安穆昆今若改為遷調非太祖約臣謂凡明安穆昆當明核善惡進賢退不肖有不職者其弟姪中更擇賢者代之上從其議進拜右丞相大定六年薨年五十九上輟朝悼惜者久之命百官致奠賻銀一千五百兩重綵五十端絹五百匹希卜蘇本作辭不夫後定為希卜蘇昭祖之孫烏肯徹之次子也初昭祖久無嗣與威順皇后圖克坦氏禱於巫而生景祖及烏肯徹烏肯徹長而酗酒屢悖其母昭祖沒圖克坦氏與景祖謀殺之部人怒欲害景祖圖克坦氏自以為事而景祖得免希卜蘇健捷能左右射世祖襲節度肅宗與拒和諾克薩克達戰於烏嚕斯哈珠水再失利世祖至將士無人色世祖使希卜蘇先陣於托果原而身出搏戰敗其步軍希卜蘇自陣後奮擊之敗其騎軍所乘馬中九矢不能馳遂步趨而出方戰其外兄烏格名善射居敵騎中將射希卜蘇熟視識之呼曰此小兒汝一人事乎何為摧鋒居前如此以弓弰繫馬首而去是役也希卜蘇之功居多和諾克薩克達旣敗希卜蘇馬棄陣中者亦自歸世祖嘗疑珠嘉布勒圖或與烏春等為變遣希卜蘇單騎往觀布勒圖與呼嚕置酒樓上以飲之希卜蘇聞其私語昵昵若將執已者一躍下樓傍出藩籬之外棄馬而歸其勇趫如此博諾約烏春舉兵世祖至蘇素海甸與烏春遇肅宗前戰色埒黙希卜蘇佐之束緼縱火煙焰蔽天大敗烏春執博諾以歸太祖獲瑪察獻馘于遼賞功穆宗太祖罕都希卜蘇皆為詳衮後與阿里罕威泰俱佐薩哈攻埒克城下之太祖伐遼使領兵千人夾侍左右珠赫店之役惟希卜蘇之策與太祖合卒破十萬之師挫其軍鋒遂與太宗薩哈等勸進收國元年七月與太宗薩哈杲同日授為貝勒希卜蘇為愛滿貝勒云天輔七年太宗與希卜蘇居守鄆王昻違紀律失衆法當死於是遼人以燕京隆宋人約歲幣三月世宗生希卜蘇謂太宗曰兄弟骨肉以恩掩義寧屈法以全之今國家迭有大慶可減昻以無死若主上有責言以我為説太宗然之遂杖昻以聞太祖每伐遼輒命希卜蘇與太宗居守雖無方面功而倚任與薩哈比侔矣是歲七月薨會太祖班師道病太宗奉迎謁見恐太祖感慟而病轉甚不敢以薨告太祖輒問曰愛滿貝勒今安在太宗紿對曰當即至矣正隆二年贈開府儀同三司追封曹國公大定三年進封金源郡王配饗太祖廟廷諡曰忠毅子呼沙呼國初有功天會中為真定留守子托卜嘉宗亨本名托卜嘉性忠謹天輔初以宗室子充護衞擒宗磐宗雋有功加忠勇校尉遷昭信校尉尚廏局直長三年陞本局副使丁父憂時宗正官屬例以材選宗亨在選中起復為烏克遜達宗室將軍改會寧府少尹歴登州刺史改獻州刺史澤州定為特們羣牧使同知北京路轉運使改澤州定國軍節度使海陵庶人南伐以本職領武陽軍都總管過淮世宗即位以手詔班賜宗亨宗享得詔即入朝大定二年授右宣徽使未幾為西北路兵馬都統以討契丹賊右副元帥布薩忠義與斡罕遇于和托宗亨與左翼萬戸富察世傑等以七穆昆軍與之戰失利及斡罕敗其黨𤓰里札巴率衆南奔宗亨追及之札巴詐稱降宗亨信之札巴詭曰𤓰里走願往邀宗亨不聽乃大縱軍士取賊所棄囊槖人畜多自有之𤓰里札巴亡入于宋坐是降為寧州刺史宗賢本名色哩希卜蘇之孫也從都統杲取中原襲遼帝于鴛鴦濼宗翰使達蘭襲耶律瑪格都統使普嘉努及色哩等以兵助之普嘉努使色哩舍音費摩呼達達嚕噶色埒耶律烏舍等各率兵分行招諭獲遼留守迪延家人輜重并降羣牧官穆隆阿得馬甚多使逐水草牧之色哩等趨伊德遂以偏師深入敵邀擊之薩哈戰没普嘉努至旺國崖西色哩兵會之累官至左副點檢天眷二年方捕宗雋色哩坐會飲其家奪官爵未幾復官皇統四年授世襲穆昆轉都㸃檢封豳國公拜平章政事進拜右丞相兼中書令進拜太保左丞相監修國史罷為左副元帥無何復為太保左丞相左副元帥如故進太師領三省事兼都元帥監修國史出為南京留守領行臺尚書省事復為左副元帥兼西京留守再為太保領三省事復為左丞相兼都元帥色哩自䕶衞未十年位兼將相常感激思自効以報朝廷雖於悼后為母黨后専政大臣或因之以取進用色哩未嘗附之皇太子濟安薨魏王道濟死熙宗未有嗣子色哩勸熙宗選後宮以廣繼嗣不少顧忌於后后以此怨之與海陵同在相位未嘗少肯假借海陵雖尊而心憚色哩外以屬尊加禮敬而内常忌之海陵知悼后怨色哩因與后共力排出之色哩亦不以是少變胙王常勝死熙宗納其妻宮中頃之殺悼后及妃數人將以常勝妻為后未果也及海陵弑熙宗詭以熙宗將議立后召諸王大臣色哩聞召以為信然將入宮謂人曰上必欲立常勝妻為后我當力爭之及被執猶以為熙宗將立常勝妻而先殺之也曰誰能為我言者我死固不足惜獨念主上左右無助爾遂遇害實圖美漢字一作神徒門扎蘭路完顏部人世為其部長父卓巴納始祖弟博和哩四世孫雖同宗屬不相通問久矣景祖時卓巴納使部人密遜來請復通宗系景祖留密遜歲餘厚其餼廩飲食善遇之及還以幣帛數篚為贈結其厚意久之扎蘭歲饑景祖與之馬牛為助糴費使世祖往致之會世祖有疾實圖美日夕不離左右世祖疾愈辭歸與握手為别約它日無相忘實圖美體貌魁偉勇敢善戰質直孝友彊記辯捷臨事果斷世祖襲位交好益深鄰部不悦遂合兵攻之實圖美使弟阿索美率二百人南下拒敵敵兵千人已出其東據高泉實圖美將五千人迎擊之敵將阿爾本者勇士也出挑戰實圖美射中其馬阿爾本反射射中實圖美腹實圖美抜箭戰愈力阿索美與勇士七人步戰殺阿爾本諸部兵遂敗實圖美因招諭諸部使附於世祖世祖嘉之後伐烏春烏木罕及通恩達薩塔等皆以所部從戰有功弟阿索美尋卒及終喪大會其族太祖率官屬往焉就以伐遼之議訪之方會祭有飛烏自東而西太祖射之矢貫左翼而墜實圖美持至上前稱慶曰烏鳶人所甚惡今射獲之此吉兆也即以金版獻之後以本部兵從擊髙麗及伐遼功尤多王師攻下西京賜以金牌其子察遜從行上謂曰吾妃之妹巴克繖者在遼俟其獲當以為汝婦竟如其言上之西征諸將皆從實圖美乃率善射者三百人來衞京師時太宗居守喜其至親出迎勞繼聞黄龍府叛與睿宗討平之睿宗賜以奴婢五百人師還賞賚良渥至是卒年六十一正隆二年封金源郡王子實實思敬完顏忠本名都古嚕訥字鄂斯歡實圖美之弟太祖器重之將伐遼而未決也欲與都古嚕訥計事於是宗翰宗幹完顏希尹皆從居數日少間太祖與都古嚕訥馮肩語曰我此來豈徒然也有謀於汝汝為我決之遼名為大國其實空虚主驕而士怯戰陣無勇可取也吾欲舉兵仗義而西君以為如何都古嚕訥曰以主公英武士衆用命遼帝荒于畋獵政令無常易與也太祖然之明年遂伐遼使博勒和來徵兵都古嚕訥以兵會師收國元年十二月上禦遼主兵次約囉都古嚕訥與尼楚赫守達嚕噶路二年與斡魯芬徹會烏楞古討髙永昌破之東京降遂與烏楞古等禦耶律聶哷敗之于蒺藜山拔顯州乾惠等州降天輔二年與羅索俱入見上曰遼主近在中京而敢輒來各杖之三十太祖駐軍草濼都古嚕訥取奉聖州破其兵五千于鷄鳴山奉聖州降太祖入燕都古嚕訥出徳勝口代實圖美為扎蘭路達貝勒二年以扎蘭地薄斥鹵遷其部於蘇伯水仍以珠蘇爾之田益之熙宗即位加太子太師十四年加保大軍節度使同中書門下平章事薨天德二年配饗太祖廟廷大定二年追封金源郡王實實康宗時高麗築九城于海蘭甸實實從烏色軍太祖攻寧江州實實摧鋒力戰授明安後從舍音克中京襲遼主于鴛鴦濼畧定山敗夏將李良輔兵與羅索俱獲遼帝于伊都谷宗翰伐宋與尼楚赫圍守太原明年攻襄垣下潞城降西京至汴元帥府以懷孟北阻太行南瀕河控制險要使實實統十二明安軍鎮撫之於是殄平寇盜招集流亡四境以安天㑹四年薨熙宗時贈特進大定問諡威敏世宗思太祖太宗創業艱難求當時羣臣勲業最著者圖像于衍慶宮遼王舍音金源郡王薩哈遼王宗幹秦王宗翰宋王宗望梁王宗弼金源郡王希卜蘇金源郡王斡魯金源郡王希尹金源郡王羅索楚王宗雄魯王棟摩金源郡王尼楚赫隋國公阿里罕金源郡王完顏忠豫國公普嘉努金源郡王薩里罕兗國公劉彥宗特進烏楞古齊國公韓企先并實實凡二十一人初海陵罷諸路萬户置蘇伯路節度使世宗時近臣請改蘇伯為扎蘭節度使不忘舊功上曰蘇伯扎蘭二水相距千里節度使治蘇伯不必改實圖美親管明安子孫襲封者可改為扎蘭明安以示不忘其初思敬本名薩哈扎蘭河人金源郡王實圖美之子希卜蘇弟也初名思恭避顯宗諱改焉體貌雄偉美鬚髯純直有材幹年十一從其父謁見太祖太祖在納琳淀方獵因詔從獵射黄羊獲之太祖賜以從馬宗翰自太原伐宋從其兄實實攻太原宗翰取河南思敬從完顏和尼涉渡河下洛陽圍汴皆有功師還隸遼王宗幹麾下太宗幸東京温湯思敬權護衞押衞卒百人從行領穆昆從征珠格麟有功遂充護衞天眷二年以捕宗磐宗雋功遷顯武將軍熙宗捕魚混同江網索絶曹國王宗敏乘醉鞭馬入江手引繫綱大繩沉於水中熙宗呼左右救之倉卒莫有應者思敬躍入水引宗敏出熙宗稱歎賞賚甚厚擢右衞將軍襲扎蘭路萬戸授世襲穆昆七年召見賜以襲衣廏馬錢萬貫及歸復遣使賜弓劒是年入為工部尚書改殿前都點檢無何為吏部尚書天德初為報諭宋國使宋人以舊例請觀錢塘江潮思敬不觀曰我國東有巨海而江水有大於錢塘者竟不往使還拜尚書右丞罷為真定尹用廉封河内郡王徙封鉅鹿丁毋憂起復本官改益都尹正隆二年例奪王爵改慶陽尹大定二年授西南路招討使封濟國公兼天德軍節度使俄為北路都統佩金牌及銀牌二西北路招討使唐古布古岱副之將本路兵二千會布古岱視地形衝要或于狗濼屯駐伺契丹賊出沒之地置守禦逺斥候賊至則戰不以晝夜為限詔布古岱曰爾兵少思敬未至不得先戰布薩忠義敗斡罕於陷泉詔思敬選新馬三千備追襲斡罕入于奚中思敬為元帥右都監以舊領軍入奚地漳格宅會大軍討之敗偽節度特黙獲二百餘人賊降將碩和卓與其黨錫勒塔干執斡罕并其母蘇尼妻子弟姪家屬及金銀牌印詣思敬降思敬獻俘于京師賜金百兩銀千兩重綵四十端玉帶廏馬名鷹拜右副元帥經畧南邊駐山東罷為西京留守復拜右副元帥仍經畧山東初明安穆昆屯田山東各隨所受地主散處州縣世宗不欲明安穆昆與民戸雜處欲使相聚居之遣戸部郎中完顏讓往元帥府議思敬與山東路總管圖克坦克寧議曰大軍方進伐宋宜以家屬權寓州縣量留軍衆以為備禦俟邊事寧息明安穆昆各使聚居則軍民俱便還奏上從之其後遂以明安穆昆自為保聚其田土與民田犬牙相入者互易之三年四月召還京師以為北京留守賜金鞍勒馬七年召為平章政事先是省併明安穆昆及海陵時無功授穆昆者皆罷之失職者甚衆思敬請量才用之上從其請思敬前為真定尹其子取部民女為妾至是其兄乞離異其妾畏思敬在相位不敢去詔還其家九年拜樞密使上疏論五事其一女直人可依漢人以文理選試其二契丹人可分隸女直明安其三鹽濼官可罷去其四與明安同勾當副千戸官亦可罷其五親王府官屬以文資官擬注教以女直語言文字上皆從之其後女直人試進士𤓰爾佳衡尼瑪哈鑑圖克坦鎰完顏匡輩由此致宰相思敬啟之也久之上謂思敬曰朕欲修熙宗實録卿嘗為侍從必能記其事跡對曰熙宗時内外皆得人風雨時年穀豐盜賊息百姓安此其大槪也何必餘事上大悦世宗喜立事故其微諫如此大定十三年薨上輟朝親臨喪哭之慟曰舊臣也賻贈加厚葬禮悉從官給孫烏呼肯扎塔大定二十四年除明威將軍授蘇伯路寶鄰山明安贊曰和卓讓國世祖以開帝業薩哈治國家定社稷尊立太祖深謀逺畧為一代宗臣賢矣哉希卜蘇盖前人之愆著勲五世易曰有子考無咎其此之謂乎始祖與季弟異部而處子孫俱為強宗而取遼之策卒定于都古嚕訥豈天道隂有以相之邪金史卷七十
