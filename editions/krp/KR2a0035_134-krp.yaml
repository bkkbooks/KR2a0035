body:
  text: 金史卷一百三十四元中書右丞相總裁托克托等修列傳第七十二外國上西夏夏國王李乾順其先曰托跋思恭唐僖宗時為夏綏銀宥節度使與李茂貞李克用等破黄巢復京師賜姓李氏唐末天下大亂藩鎮連兵惟夏州未嘗為唐患歴五代至宋傳數世至元昊始稱帝遼人以公主下嫁李氏世修朝貢不絶事具遼史天輔六年金破遼兵遼主走隂山夏將李良輔將兵三萬來救遼次天徳境野谷斡魯羅索敗之于宜水追至野谷澗水暴至漂没者不可勝計宗望至隂山以便宜與夏國議和其書曰奉詔有之夏王遼之自出不渝終始危難相救今兹已舉遼國若能如事遼之日以効職貢當聽其來母致疑貳若遼主至彼可令執送天㑹二年始奉誓表以事遼之禮稱藩請受割賜之地宗翰承制割下寨以北隂山以南伊蘇頁赫部圗嚕濼之西以賜之三月辛未乾順遣巴哩公亮等來上誓表曰臣乾順言今月十五日西南西北兩路都統遣左諫議大夫王介儒等齎牒奉宣若夏國追悔前非捕送遼主立盟上表仍依遼國舊制及賜誓詔將來或有不虞交相救援者臣與遼國世通姻契名係藩臣輙為援以啟端曾犯威而結釁既速違天之咎果罹敗績之憂䝉降徳音以寛前罪仍賜土地用廣藩籬載惟含垢之恩常切戴天之望自今已後凡於嵗時朝賀貢進表章使人往復等事一切永依臣事遼國舊例其契丹昏主今不在臣境至如奔竄到此不復存泊即當執獻若大朝知其所在以兵追捕無敢為地及依前援助其或徴兵即當依應至如殊方異域朝覲天闕合經當國道路亦不阻節以上所叙數事臣誓固此誠傳嗣不變苟或有渝天地鑒察神明殛之禍及子孫不克享國所謂西北西南兩路都統者宗翰也蓋宗望以太祖命與之通書而宗翰以便宜割地議和云太宗使王阿哈楊天吉往賜誓詔曰維天㑹二年嵗次甲辰閠三月戊寅朔皇帝賜誓詔於夏國王乾順先皇帝誕膺駿命肇啟鴻圖而卿國據夏臺境連遼右以効力於昏主致結釁於王師先皇帝以謂忠於所事務施恩而釋過迨𦕈躬之纂紹仰遺訓以遵行卿乃深念前非樂從内附飭使軺而奉貢効臣節以稱藩載錫寵光用彰復好所有割賜地土使聘禮節相為援助等事一切㳟依先朝制詔其依應徴兵所請宜允三辰在上朕豈食言苟或變渝亦如卿誓逺垂戒諭毋替厥誠於是宋人與夏人俱受山西地宋人侵取之乾順遣使表謝賜誓詔并論宋所侵地詔曰省所上表具悉已命西南西北兩路都統府從宜定奪是時宗翰朝京師未還録夏國奏付權都統斡魯宋人侵略新受疆土及使人王阿哈爭儀物事與夏通問以便宜决之初以山西九州與宋人而天徳逺在一隅緩急不可及割以與夏後破宋都獲二帝乃晝陜西界自麟府路洛陽溝東距黄河西岸西厯暖泉堡鄜延路米脂谷至累勝寨環慶路威延寨過九星原至委布谷口涇原路威川寨略古蕭關至北谷川秦鳯路通懐堡至古㑹州自此直距黄河依見今流行分熙河路盡西邊以限封域復分陜西北鄙以易天徳雲内以河為界及羅索定陜西博勒和率兵先取威戎城軍至威戎東與敵遇擊走之生致二人問之乃知為夏將李遇取威戎也乃還其人而與李遇通問李遇軍威戎西芬徹軍威戎東而使使議事于羅索羅索報曰元帥府約束若兵近夏境則與夏人相為掎角毋相侵犯李遇使人來曰夏國既以天徳雲内歸天國大國許我陜西北鄙之地是以至此芬徹等遂旋軍睿宗既定陜西元帥府不欲以陜西北鄙與夏國詔曰卿等審處所宜從事天眷二年國王乾順薨子仁孝立遣使册命加開府儀同三司上柱國皇統元年請置𣙜埸許之初王阿哈等以太宗誓詔賜夏國乾順以契丹舊儀見使者阿哈不肯曰契丹與夏國甥舅也故國王坐受使者以禮進今大金與夏國君臣也見大國使者當如儀爭數日不能决於是始起立受焉厥後不遣賜生日使至是始遣使賜之初慕洧以環州降及割陜西河南與宋人洧奔夏國夏人以為僧格首領及薩里罕再定陜西洧思歸夏人知之遂族洧以表聞詔書責讓之及海陵弑熙宗遣使報諭至境上夏人問曰聖徳皇帝何為見廢不肯納朝廷乃使有司以廢立之故移文報之天徳二年七月夏使御史中丞察喇公濟等來賀如舊禮正隆未伐宋宋人入秦隴夏亦乘隙攻取盪羌通峽九羊㑹川等城寨宋亦侵入夏境世宗即位夏人復以城寨來歸且乞兵復宋侵地詔書嘉奬仍遣吏部郎中完顔逹希布體究陜西利害邊吏奏夏人已歸城寨而所侵掠人口財畜尚未還請索之大定四年二月甲申夏遣其武功大夫錫鄂文忠等賀萬春節入見附狀奏告略曰衆軍破蕩之時幸而免者十無一二繼以凍餒死亡其存幾何兼夏國與宋兵交人畜之被俘僇亦多連嵗勤動士卒暴露勢皆朘削又坐為宋人牽制使忠誠之節無由自逹中外咸知願止約理索聽納臣言不勝下國之幸其後屢以為請詔許之久之其臣任得敬專國政欲分割夏國因賀大定八年正旦遣奏告使殿前太尉巴哩昌祖等以仁孝章乞良醫為得敬治疾詔保全郎王師道佩銀牌往焉詔師道曰如病勢不可療則勿治如可治期一月歸得敬疾有瘳遣謝恩使任得聰來得敬亦附表進禮物上曰得敬自有定分附表禮物皆不可受並却之初仁孝嗣位其臣屢作亂任得敬抗禦有功遂相夏國二十餘年隂蓄異志欲圖夏國誣殺宗親大臣其勢漸逼仁孝不能制大定十年乃分西南路及靈州羅彭嶺地與得敬自為國且上表為得敬求封世宗以問宰相尚書令李石等曰事繫彼國我何預焉不如因而許之上曰有國之主豈肯無故分國與人此必權臣逼奪非夏王本意况夏國稱藩嵗久一旦迫於賊臣朕為四海主寜容此邪若彼不能自正則當以兵誅之不可許也乃却其貢物賜仁孝詔曰自我國家戡定中原懐柔西土始得晝疆於乃父繼而賜命於爾躬恩厚一方年垂三紀藩臣之禮既務踐修先業所傳亦當固守今兹請命事頗靡常未知措意之由來續當遣使以詢爾所有貢物已令發回得敬密通宋人求助宋以蠟丸書荅得敬夏人得之得敬始因求醫附表進禮物欲以嘗試世宗既不可行而求封又不可得仁孝乃謀誅之八月晦仁孝誅得敬及其黨與上表謝并以所執宋人及蠟九書來上其謝表曰得敬初受分土之後曽遣使赴大朝代求封建䝉詔書不為俞納此朝廷憐愛之恩夏國不勝感戴夏國妄煩朝廷冐求賊臣封建深虧禮節今􅀈賊臣誅訖大朝不用遣使詢問得敬所分之地與大朝熙秦路接境恐自分地以來别有生事已根勘禁約乞朝廷亦行禁約十二年上謂宰臣曰夏國以珠玉易我絲帛是以無用易我有用也乃减罷保安蘭州𣙜埸仁孝深念世宗恩厚十七年獻本國所造百頭帳上曰夏國貢獻自有方物可却之仁孝再以表上曰所進帳本非珍異使人亦已到邊若不䝉包納則下國深誠無所展效四方鄰國以為夏國不預大朝眷愛之數將何所安乃許與正旦使同來先是尚書奏夏國與陜西邊民私相越境盗竊財畜姦人託名𣙜場貿易得以往來恐為邊患使人入境與富商相易亦可禁止於是復罷綏徳𣙜場止存東勝環州而已仁孝表請復置蘭州保安綏徳𣙜場如舊并乞使人入界相易用物詔曰保安蘭州地無絲枲惟綏徳建闗市以通貨財使副往來聽留都亭貿易章宗即位詔曰夏使館内貿易且已明昌二年復舊頃之夏人肆牧於鎮戎之境邏卒逐之夏人執邏卒而去邊將阿嚕岱率兵詰之夏廂官呉明契信陵都卜祥徐餘立等伏兵三千於澗中阿嚕岱口中流矢而死取其弓甲而去詔索殺阿嚕岱者夏人處以徒刑詔索之不已夏人乃殺明契等明昌四年仁孝薨子純佑嗣立承安二年復置蘭州保安𣙜場承安五年純佑母病風求醫詔太醫判官時徳元及王利貞往仍賜御藥八月再賜醫藥泰和六年三月仁孝第仁及子安全廢純佑自立再閲月死于廢所七月使純佑母羅氏為表言純佑不能嗣守與大臣定議立安全為王遣使奏告夏使私問館伴官奏告事詔許否館伴官曰此不當問也夏使曰明日當問諸客省若又不答則升殿奏請上聞之使客省諭以許所祈之意乃賜羅氏詔詢其意夏人復以羅氏表來乃封安全為夏國王大安三年安全薨族子遵頊王遵頊先以狀元及第充大都督府主立在安全薨前一月衛紹王無實録不知其故然是時金兵敗績于㑹河堡夏人乘其兵敗侵略邊境而通使如故崇慶元年三月攻葭州至寜元年六月攻保安州貞祐元年十一月攻㑹州都統圖克坦酬爾擊走之十二月陷涇州二年八月歸國人喬成齎夏國書畧言金邊吏侵掠乞禁戢詔移文答之宰臣言既非公牒今將責問彼必飾詞徒為虚文無益於事乃止未幾夏人攻慶原延安積石州乃詔有司移文責問十一月蘭州譯人程陳僧結夏人以州叛邊將敗其兵三千三年正月夏兵攻武延川宣宗曰此不足慮恐由他道入也既而聞邊吏侵夏境夏人乃攻環州詔治邊吏罪夏兵攻積石州都統姜伯通敗之夏兵入安鄉闗都統曹吉遜萬戸和斯實勒却之二月攻環州刺史烏庫哩延壽敗之境上三月詔議伐夏陜西宣撫司奏往者夏人侵我環慶河蘭積石以兵應之悉皆遯去遽還巢穴蓋為我備也今蘭州潰兵猶未集軍實多不完沿邊地寒春草始生未可芻牧兩界無煙火者三百餘里不宜輕舉從之四月詔河州提控曹吉遜通逺軍節度使完顔果勒討程陳僧夏人援之九月遂破西闗堡夏人復攻第五將營萬户楊再興擊走之詔陜西宣撫司及沿邊諸將降空名宣勑臨陣立功五品以下並聽遷授十月攻保安及延安都統完顔果嘉努破之既而深入臨洮總管圖們呼圖克們不能禦陜西宣撫副使完顔和索哩來援大敗于渭源堡城破和索哩被執十一月夏兵敗于克戎寨復敗于熟羊寨宰相入賀宣宗曰此忠賢之力也夏兵進圍臨洮圖們呼圖克們破之四年四月夏巴鄂特族總管汪三郎率衆來降進羊千口詔優給其直來逺鎮獲諜人言宋夏相結來攻詔陜西行省備之夏於來羌城界河起析橋元帥右都監完顔薩布焚之斬馘其衆六月鄜延路奏夏人牒報用彼國光定年號詔封還其牒閏月慶陽總管慶善努伐夏出環州陜西行省請中分其軍令慶善努出第三將懐安寨環州刺史完顔呼遜出環州宣宗曰聞夏人移軍備其王城尚恐詐我勿墮其計中也提控完顔果勒抵蘭州西闗堡招得舊部曲九人掩擊夏兵于阿密灣殺其將士百餘人八月左監軍烏庫哩慶壽敗夏兵于寇安堡右都監薩布擊走于結耶觜川復破之于車兒堡十一月提控實嘉喀齊喀楊沃哩解定西之圍十二月丙寅宣宗與皇太子議伐夏左監軍圖們呼圖克們延安總管瓜爾佳實倫攻鹽宥夏州慶陽總管慶善努知平凉府伊喇托卜嘉攻威靈安㑹等州興定元年正月夏兵三萬自寜州還慶善努以兵邀擊敗之詔河東行省胥鼎選兵三萬五千付圖們呼圖克們伐夏鼎奏不可遂止語在鼎傳右都監完顔仲元請試兵西夏出其不意必獲全勝兵威既振國力益完詔下尚書省樞密院議夏人福山以俘戸來降除同知澤州軍州事五月夏兵入大北岔都統赫舍哩珠赫掩擊敗之宣宗欲與夏議和右都監慶善努屯延安奏曰夏國决不肯和徒見欺耳既而獲諜者言遵頊聞大金將約和戒諭將士無犯西鄙宰臣奏曰就令如此邊備亦不宜弛宣宗以為然右都監完顔閭山敗夏兵于黄鶴岔夏人圍羊狼寨都統党世昌與戰完顔果勒遣都統𤓰爾佳瑞夜斫夏營遂解圍猶駐近地左都監博索發定西鋭兵龕谷副統包孝成緋翮翅軍合擊走之八月安定堡馬家平總押李公直敗夏兵三千九月都統羅世暉却夏兵于克戎寨興定二年三月右都監慶善努奏夏人有乞和意保安綏徳葭州得文報乞互市以尋舊盟以臣觀之此出於遵頊非邊吏所敢專者朝廷不以為然五月夏人入葭州慶善努破之于馬吉峯七月犯龕谷瓜爾佳瑞趙防敗之追至質孤堡三年閏月夏人破通泰寨提控納哈塔邁珠擊之自葭蘆川遯去華州元帥完顔哈逹出安寨堡至隆州敗其兵二千進攻隆州克其西南㑹暮乃還十二月詔有司移文夏國四年二月夏犯鎮戎金師敗績夏人公移語不遜詔詞臣草牒折之四月夏兵犯邊元帥實嘉喀齊喀遇于鹿兒原提控烏庫哩世顯以偏師敗之都統王定復破其衆于新泉城元帥慶善努攻宥州圍神堆府穴其城士卒有登者援兵至擊走之斬首三千俘百餘人獲雜畜三千餘八月夏人陷㑹州刺史烏庫哩世顯降復犯龕谷瓜爾佳瑞連戰敗之乃引去是月詔有司移文議和事竟不克夏人三萬自髙峯鎮圍定西刺史愛新愛實拉提控烏庫哩長壽温都永昌擊走之九月夏人圍綏平寨安定堡未幾陷西寜州遂攻定西烏庫哩長壽擊却之乃襲鞏州實嘉喀齊喀逆戰一日十餘戰乃解去五年正月詔樞密院議夏亊奏夏人聚兵境上欲由㑹州入已遣行省博索伏兵險要以待之鄜延元帥府伺便發兵綴其後足以無慮二月寜逺軍節度使瓜爾佳海夀破夏兵于搜嵬堡三月復取來羌城十月攻龕谷博索連敗之元光元年正月夏人陷大通城復取之三月提控李師林敗夏兵于永木嶺八月攻寜安寨十月攻神林堡十二月入質孤堡提控唐古昉敗之二年遵頊使太子徳任來伐徳任諫曰彼兵勢尚强孰若與約和遵頊笑曰非爾所知也彼失蘭州不能復何强之有徳任固諫不從乞避太子位為僧遵頊怒幽之靈州遣人代將㑹天旱不果是嵗大元兵問罪夏國延安慶原元帥府欲乘夏人之困敝伐之陜西行省博索哈逹以為不可乃止隴安軍節度使完顔阿林日與將士宴飲不治軍事夏人乘之掠民五千餘口牛羊雜畜數萬而去自天㑹議和八十餘年與夏人未嘗有兵革之事及貞祐之初小有侵掠以至搆難十年不解一勝一負精鋭皆盡而兩國俱敝是嵗遵頊傳位於子徳旺正大元年和議成自稱兄弟之國三年二月遵頊死七月徳旺死嗣立者史失其名明年夏國亡先是夏使精方匭匣使王立之來聘未復命國已亡詔於京兆安置充宣差彈壓主管夏國降户八年五月立之妻子三十餘口至環州詔以歸立之賜以幣帛立之上言先世本申州人乞不仕居申州詔如所請以本官居申州主管唐鄧申裕等處夏國降戸聽唐鄧總帥府節制給上田千畝牛具農作云贊曰夏之立國舊矣其臣羅世昌譜叙世次稱元魏衰微居松州者因以舊姓為托跋氏按唐書党項八部有托跋部自党項入居銀夏之間者號平夏部托跋思恭以破黄巢功賜姓李氏兄弟相繼為節度使居夏州在河南繼遷再立國元昊始大乃北渡河城興州而都之其地初有夏綏銀宥靈鹽等州其後遂取武威張掖酒泉燉煌郡地南界横山東距西河土宜三種善水草宜畜牧所謂凉州畜牧甲天下者是也土堅腴水清冽風氣廣莫民俗彊梗尚氣重然諾敢戰鬬自漢唐以水利積榖食邊兵興州有漢唐二渠甘凉亦各有灌溉土境雖小能以富彊地勢然也五代之際朝興夕替制度禮樂盪為灰燼唐節度使有鼔吹故夏國聲樂清厪頓挫猶有鼓吹之遺音焉然能崇尙儒術尊孔子以帝號其文章辭命有可觀者立國二百餘年抗衡遼金宋三國偭鄉無常視三國之勢彊弱以為異同焉故近代學者記西北地理徃徃皆臆度言之聖神有作天下㑹于一驛道徃來視為東西州矣金史卷一百三十四
