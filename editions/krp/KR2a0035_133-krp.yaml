body:
  text: 金史卷一百三十三元中書右丞相總裁托克托等修列傳第七十一叛臣張覺子僅言耶律伊都伊喇斡罕古書畔與叛通畔之為言界也左氏曰政猶農之有畔是也君臣上下之定分猶此疆彼界之截然違此向彼即為叛矣善惡判於跬歩禍患極於懐襄吁可畏哉故作叛臣傳張覺亦書作瑴平州義豐人也在遼第進士仕至遼興軍節度副使太祖定燕京時立愛以平州降當時宋人以海上之盟求燕京及西京地太祖以燕京涿易檀順景薊與之平州自入契丹别為一軍故弗與而以平州為南京覺為留守既而聞覺有異志上遣使劉彦宗及薩布諭之詔曰平山一郡今為南京節度使今為留守恩亦厚矣或言汝等隂有異圗何為當此農時輒相扇動非去危就安之計也其諭朕意太祖每收城邑往往徙其民以實京師民心多不安故時立愛因降表曾言及之及以燕京與宋而遷其人獨以空城與之遷者道出平州故覺因之以作亂天輔七年五月左企弓虞仲文曹勇義康公弼赴廣陵過平州覺使人殺之于栗林下遂據南京叛入于宋宋人納之太祖下詔諭南京官吏詔曰朕初駐蹕燕京嘉爾吏民率先附降故升府治以為南京减徭役薄賦税恩亦至矣何可輒為叛逆今欲進兵攻取時方農月不忍以一惡人而害及衆庶且遼國舉為我有孤城自守終欲何為今止坐首惡餘並釋之覺兵五萬屯潤州近郊欲脅遷來潤隰四州棟摩自錦州往討之已敗覺兵欲乗勝攻南京時暑雨不可進退屯于海壖無何棟摩再敗覺兵復與戰于耳山棟摩大敗覺報捷于宋宋建平州為泰寕軍以覺為節度使張敦固等皆加徽猷閤待制以銀絹數萬犒軍宗望軍至南京城東覺兵大敗宵遯遂奔宋入于燕京宗望以納叛責宋安撫司索張覺宣撫王安中匿之於甲仗庫紿曰無之宗望索愈急安中乃斬貌類覺者一人當之金人識之曰非覺也安中不得已引覺出數以罪覺罵宋人不容口遂殺覺函其首以與金人燕京降將及常勝軍皆泣下郭藥師自言曰若來索藥師當奈何自是降將卒皆解體及金人伐宋竟以納平州之叛為執言云子僅言僅言幼名元努宗望攻下平山僅言在襁褓間里人劉承宣得之養於家其隣韓夫人甚愛之年數歲因隨韓夫人得見貞懿皇后留之藩邸稍長侍世宗讀書遂使僅言主家事繩檢部曲一部惮之世宗留守東京海陵用兵江淮將士往往亡歸詣東京願推戴世宗為天子僅言勸進世宗即位除内藏庫副使權發遣宫籍監事海陵死揚州僅言與禮部尚書烏居仁殿前左衞將軍阿固岱御院通進劉珫發遣六宫百官圗書府藏在南京者還以本職提控尚食局轉少府監丞仍主内藏僅言能心計世宗倚任之凡宫室營造府庫出納行幸頓舍皆委之世宗嘗曰一經僅言無不愜朕意者六年提舉修内役事役丁掘地得白金匿之事覺法當死僅言責取其物與官釋其罪尋兼祗應司遷少府監提控官籍監祗應司如故䕶作太寜宫引宫左流泉溉田嵗獲稻萬斛十七年復提㸃内藏典領昭徳皇后山陵遷勸農使領諸職如故僅言雖舊臣出入左右然世宗終不假以權任二十一年尚書省奏宫苑司直長黎倫在職十六年請與遷敘上曰此朕之家臣質直人也今已老矣如勸農使張僅言亦朕舊臣純實頗觧事凡朝廷議論内外除授未嘗得干預朕觀自古人君為讒諂䝉蔽者多矣朕雖不及古人然近習憸言未嘗入耳宰臣曰誠如聖訓此國家之福也世宗欲以為横海軍節度使而不可去左右遂止僅言始得疾猶扶杖視事疾亟詔太醫診視近侍問訊相屬及卒上深惜之遣官致祭賻銀五百兩重綵十端絹二百匹棺槨衣衾銀汞歛物𦵏地皆官給贈輔國上將軍耶律伊都遼宗室子也遼主近族父祖仕遼具載遼史初太祖起兵遼人來拒伊都請自効以功累遷金吾衞大將軍為東路都統天輔元年與都統耶律瑪格軍於渾河尼楚赫希尹拒之伊都等不敢戰比尼楚赫等至瑪格伊都已遯去尼楚赫希尹坐稽緩太祖皆罰之所獲生口財畜入于官二年龍化州人張應古劉仲良來降而伊都復取之遼以托卜嘉為節度使未幾應古等逐托卜嘉自効太祖於國中以問遼主龍化州已經降附何為問罪而殺其主者遼主託以大盜羣起使伊都收之太祖已取臨潢府賜詔伊都曰汝將兵在東路前後戰未嘗不敗今聞汝收合散亡以拒我師朕已於今月十五日克上京今將往取遼主矣汝若治兵一決勝負可指地期日相報若知不敵當率衆來降無貽後悔及太祖班師棟摩等還至遼河方渡伊都來襲完顔布達烏塔等殿力戰却之獲甲馬五百匹五年伊都等復送欵于咸州路都統以所部來降乞援接于桑林渡都統司以聞詔曰伊都到日使與其官屬偕來餘衆處之便地無何伊都送上所受遼國宣誥及噐甲旗幟等與將吏韓福努阿巴錫喇太師努蕭慶醜和尚髙佛哩布達謝嘉努烏格等來降伊都作書具言所以降之意大槩以謂遼主沈湎荒于遊畋不恤政事好佞人逺忠直淫刑吝賞政煩賦重民不聊生又言樞宻使徳勒岱本無材能但阿䛕取容其子摩格任以軍事又言文妃長子晉王素係人望宜為儲副徳勒岱以元妃諸子已所自出使晉王出繼文妃又言晉王與駙馬伊遜謀復其樞宻使來告伊都共定大計而所圗不成又言已粗更軍事進策遼主徳勒岱蔽之遼主亦不省察又曰大金疆土日闢伊都灼知天命遂自去年春與耶律慎思等定議約以今夏來降近聞徳勒岱髙實訥等欲發倉卒之際不及收拾四逺但率傍近部族戸三千車五千兩畜産數萬遼北軍都統以兵追襲遂棄輜重轉戰至此所有官吏職位姓名人戸畜産之數遣韓福努具錄以聞遂以其將吏來見上撫慰之遂賜坐班同宰相賜宴盡醉而罷上命伊都以舊官領所部且諭之曰若能為國立功别當奨用自伊都降益知遼人虚實矣伊都在軍中屢乞侍妾及子太祖疑之詔咸州路都統司曰伊都家屬善監䕶之復詔曰伊都降時其民多強率而來者恐在邊生變宜徙之内地都統杲取中京伊都為鄉導與希夷等招撫奚部奉聖州降其官吏皆遯去伊都舉前監酒李師夔為節度使進士沈璋為副使州吏裴賾為觀察判官沈璋招集居民還業者三十餘遷太常少卿久之耶律瑪展告伊都烏舍道拉結黨謀叛及其未發宜先收捕上召伊都從容謂之曰今聞汝謀叛誠然邪其各無隠若果去必湏鞍馬甲胄噐械之屬當悉付汝吾不食言若再被擒無祈免死欲留事我則無懐異志吾不汝疑伊都等戰慄不能對乃杖道拉七十餘皆不問天㑹三年大舉伐宋伊都為元帥右都監宋兵四萬救太原伊都沃哩赫逆擊于汾河北擒其帥郝仲連張闗索統制馬忠殺萬餘人宗翰伐宋伊都留西京十年伊都謀反雲内節度使耶律努格等告之伊都亡去其黨燕京統軍蕭髙六伏誅蔚州節度使蕭特黙自殺邊部斬伊都及其諸子函其首以獻耶律努格加守太保兼侍中趙公鑑劉孺信劉君輔等竝授遥鎮節度使以賞之伊喇斡罕西北路契丹部族先從薩巴為亂受其偽署後殺薩巴遂有其衆薩巴者初為招討司譯史正隆五年海陵徴諸道兵伐宋使牌印素赫楊格盡徴西北路契丹丁壯契丹人曰西北路接近鄰國世世征伐相為讐怨若男丁盡從軍彼以兵來則老弱必盡係累矣幸使者入朝言之素赫畏罪不敢言楊格慮後西北有事得罪遂以憂死素赫復與牌印耶律諾爾尚書省令史穆達里哈督起西北路兵契丹聞男子當盡起於是薩巴博多布與部衆殺招討使完顔烏色及素赫執耶律諾爾穆達里哈取招討司貯甲三千遂反議立豫王延禧子孫衆推都監老和尚為招討使山後四羣牧山前諸羣牧皆應之徳斡羣牧使圖克坦色哩伊囉斡羣牧使鶴夀等皆遇害語在鶴夀傳五院司部人老和尚納延亦殺節度使珠嘉烏哲以應薩巴㑹寜八明安牧馬山後至登穆魯賊盡奪其馬布沙河千户實格等與前招討使完顔滿丕殺烏爾古徳哷勒招討使烏凌阿富勒呼以所部趨西北路舒嚕部節度使阿爾薩哩追擊之實格與數騎遯去合于薩巴咸平府穆昆瓜里與所部自山後逃歸咸平少尹完顔額哩頁欲收捕瓜里家屬瓜里與其黨招誘富家奴隸數日得衆二千攻陷韓州及柳河縣遂趨咸平額哩頁發兵迎擊之兵敗賊遂據咸平於是繕完噐甲出府庫財物以募兵賊勢益張據曹家山明安綽竒集兵千餘扼于夜河賊不得東綽奇兵敗𤓰里遂犯濟州㑹宿直將軍富珠哩富卦喇徴兵于率賓路遇𤓰里于信州與明安烏雅扎拉兵二千擊敗𤓰里𤓰里收餘衆趨京是時世宗為東京留守以兵四百人拒之賊至長安縣聞空中擊鼓聲如數千鼔者候見旌旗蔽野傳言留守以十萬兵至矣即引還亦以其衆合于薩巴海陵使樞宻使布薩呼圗西京留守蕭懐忠將兵一萬與右衛将軍蕭圖喇討平之圖喇與之相持數日連與戰皆無功而糧餉不繼圖喇退歸臨潢圖喇雖不能克敵而薩巴自度大軍必相繼而至勢不可支謀歸于達實乃率衆沿龍駒河西出及布薩呼圖蕭懐忠等兵至與圖喇合兵追至河上不及而還呼圗懐忠圗喇坐逗遛不及追賊皆誅死北京留守蕭賾不能制其下殺降人而取其婦女亦坐誅於是白彦恭為北面兵馬都統赫舍哩志寜副之完顔古雲為西北面兵馬都統西北路招討使唐古布古岱副之以討薩巴等薩巴既西行而舊居山前者皆不欲往偽署六院節度使伊喇斡罕兵官辰嘉殺薩巴執老和尚博多布等至是斡罕始自為都元帥辰嘉為都監擁衆東還至臨潢府東南新羅寨世宗使移喇扎巴前押軍穆昆博哈前牌印瑪哈利渉軍節度判官瑪納等招之扎巴等見斡罕以上意諭之斡罕已約降已而復謂扎巴曰若降爾能保我輩無事乎扎巴曰我知招降耳其他豈能必哉扎巴見斡罕兵衆彊車帳滿野意其可以有成因說之曰我之始來以汝軰不能有為今觀兵勢彊盛如此汝等欲如羣羊為人所驅去乎将欲待天時乎若果有大志吾亦不復還矣賊将有前布塔布部族節度使綽哈者言昔古新丞相賢能人也嘗説他日西北部族當有事今日正合此語恐不可降也於是斡罕遂决意不復肯降矣扎巴亦留賊中惟瑪哈博哈還歸斡罕乃引兵攻臨潢府總管伊蘇瑪勒出城戰兵少被執賊遂圍臨潢衆至五萬正隆六年十二月己亥斡罕遂稱帝改元天正是時北面都統白彦敬副統赫舍哩志寜在北京聞世宗即位以兵來歸世宗使元帥左都監烏哲庫同知北京留守事完顔果濟救臨潢晝夜兼行比至臨潢賊已解圍去攻泰州烏哲庫追及于斡里兩軍已陣將戰押軍明安契丹呼魯蘇以所部兵應賊烏哲庫軍遂敗泰州節度使烏哩頁率千餘騎與斡罕遇烏里雅兵復敗僅以數騎脱歸賊勢愈振城中震駭莫敢出戰賊四面登城押軍明安烏克遜阿里布率軍士數人手刄以身率先循城擊賊力戰斫刈甚衆賊乃退城賴以完泰州司吏延扎芬徹奏捷除忠翊校尉賜銀五十兩重綵十端大定二年正月右副元帥完顔黙音率諸軍北征斡罕二月壬戌詔曰應諸人若能於契丹賊中自㧞歸者更不問元初首従及被威脅之由奴婢良人罪無輕重並行免放曾有官職及糾率人象來歸者仍與官賞依本品量材敘使其同來人各從所願處收係有才能者亦與錄用内外官員郎君羣牧直薩百姓人家驅奴宫籍監人等並收放為良亦從所願處收係免三年差役或能捕殺首領而歸者准上施行仍驗勞績約量遷賞如捕獲斡罕者明安加三品官授節度使穆昆加四品官授防禦使庶人加五品官授刺史詔曰尚書省如節度防禦使捉獲斡罕者與世襲明安刺史捉獲者與世襲穆昆驅奴宫籍監人亦與庶人同復詔宰臣徧諭將士能捕殺斡罕者加特進授真定總管於是𤓰里将犯韓州聞元帥兵至不戰遯去将轉趨懿宜州黙音屯懿州慶雲縣及屯川州武平縣奏請糧運當遣人䕶送兵仗乞選精良者付之詔以南征逃還軍士就往屯戍如不足量于富家簽調就近地簽歩軍給仗䕶送糧運詔平章政事伊喇元宜往泰州䂓措邊事前安逺大将軍鄂囉納明安齊錦庶人阿爾噶摩格等自斡罕中來降鄂囉納齊錦加昭武大将軍阿爾噶武義将軍摩格忠勇校尉斡罕遂自泰州往攻濟州欲邀糧運元帥完顔黙音與右監軍完顔福夀左都監烏哲庫合兵甲士萬三千人海蘭路總管圗克坦克寜廣寜尹布薩歡塔同知廣寜尹完顔頁頁肇州防禦使唐古烏延為左翼臨海節度使赫舍哩志寜哈斯罕節度使實圗羙同知北京留守完顔果濟淄州刺史尼瑪哈楚呼為右翼至珠格崖盡委輜重士卒齎數日糧輕騎襲之乣椀羣牧人契丹吉勒扎與弟伯特蘇拉皆棄家自賊中來降吉勒扎謂黙音曰賊中馬健官軍馬弱此去賊八十里比遇賊馬已􅉵賊輜重去此不逺我攻之賊必救其巢穴賊至馬必疲我馬少得息所謂攻其所必救以逸待勞者也黙音從之乗夜亟發㑹大風路暗不能辨遲明行三十里許與賊輜重相近整兵少憩斡罕趨濟州知大軍取其輜重乃還救遇于長濼既陣黙音别設伏于左翼之側賊四百餘騎突出左翼伏兵之間圗克坦克寜射却之是日别部諸將與賊勝負未分相去五里許而立左翼萬户襄别與賊戰賊陣動襄麾軍乗之突出其後俱與大軍不相及襄以善射者二十騎率衆自賊後擊之賊不能攴乗勢麾軍擊其一偏賊遂却襄與大軍合而别部諸將皆至整陣力戰忽反風揚砂賊陣亂官軍馳擊大破之追北十餘里斬獲甚衆詔以吉勒扎為武義將軍伯特昭信校尉蘇拉忠翊校尉吉勒扎除同知建州事未之官率伯特取家賊中被害上憫之後以蘇拉為汝州都巡檢使斡罕率其衆西走黙音追及之于霿􅟶河賊已濟毁其津口赫舍哩志寜軍先至不克渡乃對岸為疑兵以𤓰爾佳清臣圖克坦和羅兩萬戸於下流渡河值支港兩岸斗絶且淖命軍士束柳填港而過追之數里得平地方食賊衆奄至志寜軍急整陣賊自南岡馳下衝陣者三志寜力戰流矢中左臂戰自若大軍畢至左翼騎兵先與賊接賊據上風縱火乗煙擊官軍官軍歩兵亦至併力合戰凡十餘合軍士苦風煙皆植立如癡㑹天雨風止官軍奮擊大敗之圗克坦克寜追奔十五里賊前阨溪澗不得亟渡多殺傷賊既渡官軍亦渡少憩賊反斾來攻克寜以大軍不繼令軍士皆下馬射賊賊引却而南克寜亦將引而北士未及騎馬賊復來衝突官軍少却回渡澗北大軍至賊遂引去四月詔元帥府曰應契丹賊人與大軍未戰已前投降者不得殺傷仍加安撫敗走以後招誘來降者除奴婢准已虜為定外親屬分付圎聚仍官為換贖斡罕既敗黙音不復追討駐軍白濼榦罕攻懿州不克遂殘破川州將遯于山西而北京亦不邀擊之於是發驍騎軍二千海蘭路留屯京師軍三千號稱二萬㑹寜濟州軍六千亦號二萬元帥左都監髙忠建總兵沃州刺史烏庫哩芬徹為海蘭路押軍萬户邳州刺史烏凌阿薩喇為濟州押軍萬户右驍騎副都指揮使為驍騎萬户祁州刺史宗寜為㑹寜路押軍萬户右宣徽使亨為北京路都統吏部郎中完顔徳濟為副統㑹元帥府討擊之詔使尚廐局副使富察富埓琿往懿州戒勅将帥上曰朕委卿等討賊乃聞不就賊趨戰而駐兵閑緩經渉累月雖曾追襲乃不由有水草之地以致馬疲弱不能百里而還後雖破賊而縱諸軍刼掠數日後方追北霿􅟶河亦不乗勝輒復引還賊遂入涉近地北京懿州由此受兵朕欲重譴汝等以方任兵事且圖後功當盡心一力毋得似前怠弛上謂富埒琿曰卿若聞賊在近即當監督討伐用命力戰者疏記以聞朕將約量遷賞無或承徇上官抑有功濫署無功者善戢士卒勿縱虜掠以赫舍哩志寧為元帥右監軍右監軍完顔福夀召還京師咸平路總管完顔烏達復舊職黙音子色克在軍中多暴横詔押歸本管斡罕使所親招節度使額爾竒木奎伊奎伊執其使送官與斡罕連戰有功遷宣武將軍賜銀五百兩衣二襲起運在中都弓萬五千箭一百五十萬赴懿州平章政事伊喇元宜寧昌軍節度使宗叙入見詔使自中道却還軍中宣諭元宜黙音注意經略邊事師久無功尚書右丞布薩忠義願効死力除邊患世宗嘉歎六月忠義拜平章政事兼右副元帥宗叙為兵部尚書各賜弓矢具鞍勒馬出内府金銀十萬兩佐軍用詔曰軍中將士有犯除連職奏聞餘依軍法約量决責有功者依格遷賞以大名尹宗尹為河南路統軍使河南路統軍都監富察世傑為西北路副統賜弓矢佩刀廐馬從忠義征行詔諭諸軍將士曰兵久駐邊陲蠧費財用無成功百姓不得休息今命平章政事布薩忠義兼右副元帥同心戮力以底戡定右副元帥黙音罷為同判大宗正事詔居庸闗古北口譏察契丹姦細捕獲者加官賞萬戸温特赫阿嚕岱以兵四千屯古北口薊州石門闗等處各以五百人守之海陵末年阿嚕岱為明安伊喇諾爾為牌印祇候起契丹部族兵被執至是挺身來降世宗以阿嚕岱為濟州押軍萬戸伊喇諾爾為同知灤州事西南路招討使完顔思敬為都統賜金牌一銀牌二西北路招討使唐古布古岱副之以兵五千往會燕子城舊戍軍視地形衝要或屯駐狗濼逺斥候賊至即戰不以晝夜為限詔思敬曰契丹賊敗必走山後可選新馬三千加芻秣以備追襲布薩忠義至軍中是時斡罕西走和托衆尚八萬忠義高忠建軍與賊遇萬戸扎拉棻徹為左翼宗亨統之宗寧薩喇為右翼宗叙統之世傑亦在左翼中與賊夾河為陣賊渡河以兵四萬餘先犯左翼軍扎拉以六百騎奮擊敗之以四萬衆與右翼軍戰宗亨世傑七穆昆指畫失宜陣亂敗于賊世傑挺身投于扎拉軍中賊圍扎拉軍扎拉力戰宗叙以右翼軍來救賊乃去詔曰自契丹作逆有為賊詿誤者不問如何從賊但能復業與免本罪如能率衆來附或能殺捕首領而降或執送賊所扇誘作亂之人皆與量加官爵朕念正隆南征明安亡者招還被戮已命其子孫襲其職爾等勿懲前事故懐遲疑賊軍今既破散山後諸處皆命將士遏其逃路爾等雖欲不降終將安往若猶疑貳俱就焚滅悔無及矣斡罕自和扎西走布薩忠義赫舎哩志寧以大軍追及于裊嶺西陷泉明日賊軍三萬騎涉水而東大軍先據南岡左翼軍自岡為陣迤邐而北步軍繼之右翼軍繼步軍北引而東作偃月陣步軍居中騎兵據其兩端使賊不見首尾是日大霧晦㝠既陣霧開少頃晴霽賊見左翼據南岡不敢擊擊右翼軍烏雅扎拉力戰賊稍却志寧與瓜爾佳清臣烏凌阿薩喇道拉合戰賊大敗將涉水去泥濘不得亟渡大軍逐北人馬相蹂踐而死不可勝數陷泉皆平餘衆蹈籍而過或奔潰竄匿林莽間大軍踵擊之俘斬萬計生擒其弟偽六院司大王諾爾斡罕僅與數騎脫去楚呼清臣追四十餘里不及斬千餘級獲車帳甚衆其母蘇尼舉營自羅和岡西走志寧追之盡獲輜車俘五萬餘人雜畜不可勝計偽節度使六及其部族皆降詔北京副統完顔徳濟括本部馬規辦芻糧仍使徳濟為監戰官録有功者聞奏詔選中都西京兩路新舊軍萬人備守禦以斡罕敗走恐或衝突也布薩忠義使使奏捷詔畧曰平章政事右副元帥忠義使使來奏大捷或被軍俘獲或自能來服或無所歸而投拜或將全屬歸附或分領家族來降或嘗受偽命及自來曽與官軍鬬敵皆釋其罪其敗亡人内除斡罕一身不以大小官員是何名色却來歸附者亦准釋放有能誅捕斡罕或于不從招納亡去人内誅捕以來獻或能率衆于掌軍官及随處官司投降者並給官賞各路撫納來者毋得輒加侵損無資給者不以是何路分隨有糧處安置仍官為養濟斡罕收合散卒萬餘人遂入奚部以諸奚自益時時出兵寇蘇勒庫淀古北口興化之間温特赫阿嚕岱守古北口與戰敗焉詔完顔黙音富察烏哩頁富察富埒琿以兵三千合舊屯兵五千擊之詔完顔思敬以所部兵入奚地會大軍討斡罕賊黨霿􅟶河明安富色克遣人至帥府約降詔令擒捕斡罕許以官賞賊將降者甚衆其散走者聞詔書招降亦多降者其餘多疾疫而死無復鬬志斡罕自度勢窮乃謀自羊城道西京奔夏國大軍追之益急其衆復多亡去度不得西乃北走沙陀間詔尚書省凡脅從之家被俘掠遂致離散宜從改正將士往往藏匿其人有司檢括分付監軍志寧獲賊朔和卓釋而弗殺縱還賊中使誘其親近捕斡罕以自効許以官賞九月庚子朔和卓與錫勒塔干執斡罕詣右都監完顔思敬并獲其母蘇尼及其妻子子婦弟姪盡收偽金銀牌印唐古布古岱獲前呼爾哈節度使順及其家屬西北路招討使李嘉努獲偽樞密使綽哈等三十餘人復與明安尼敦巴噶追偽監軍納延至天成縣納延乃降仍獲偽都元帥酬格及金牌一銀牌五志寧與清臣宗寧蘇格等追餘黨至燕子城盡得其黨前至茂巴勒達之地悉獲之逆黨遂平甲辰皇太子率百官上表賀乙巳詔天下辛亥完顔思敬獻俘于京師斡罕梟首于市磔其手足分懸諸京府其母蘇尼及妻子皆戮之契丹降人皆拘其器仗貧不能自給者官為養濟瓜里扎巴率衆南走詔左宣徽使宗亨追及之扎巴詐稱降宗亨信其言遂不與戰扎巴紿之曰瓜里驚走願追之宗亨縱扎巴去益都明安欲以所部追瓜里扎巴宗亨恐分其功不聴而縱軍士取賊所棄資囊人畜而自有之瓜里扎巴由是得亡去遂奔于宋宗亨降寧州刺史其後宋李世輔用瓜里扎巴取宿州頗為邊患錫勒塔干除同知安化軍節度使朔和卓除同知震武軍節度使事大定六年㸃檢司奏親軍中有逆黨子弟請一切罷去詔曰身預逆黨者罷之餘勿問贊曰金人以燕山與宋遂啟張覺跳梁之心覺豈為宋者哉不過乘時以徼利耳耶律伊都從宗望追天祚曽不遺餘力功成驕溢自取誅滅咈哉正隆佳兵契丹作難傳曰夫兵猶火也弗戢將自焚可不戒哉金史卷一百三十三
