body:
  text: 金史卷八十九元中書右丞相總裁托克托等修列傳第二十七蘇保衡翟永固魏子平孟浩田㲄附梁肅伊喇慥本名伊德爾伊喇子敬本名鄂克多囉蘇保衡字宗尹雲中天成人父京遼進士為西京留守宗翰兵至西京京出降乆之京病篤以保衡屬宗翰京死宗翰薦之於朝賜進士出身補太子洗馬調解州軍事判官左監軍薩里罕駐軍陜西辟幕府參議軍事累官同知興中尹天德間繕治中都張浩舉保衡分督工役改大興少尹督諸陵工役再遷工部尚書海陵治兵伐宋與徐文等造舟於通州海陵獵近郊因至通州視工作兵興保衡為淛東道水軍都統制率舟師泛海徑趨臨安宋兵來襲敗于海中副統制鄭家死之大定二年百姓困弊詔保衡山撫山東前太子少保髙思廉安撫臨潢發倉粟以賑之無衣者賜以幣帛或官粟有闕則收糴以給之無妻室者具姓名以聞還除刑部尚書與工部尚書宗永兵部尚書完顔額哩頁往河南山東陜西宣問屯田軍人有㑹破大敵及攻城野戰立功者具姓名以聞或以寡敵衆或與敵相當能先登敗敵者正軍及擐甲伊勒希補官一階明安穆昆以功狀上尚書省㑹隨海陵軍至淮上破敵者亦准上遷賞布薩忠義伐宋保衡行戸部於關中兼紏察許以便宜黜守令不法者十餘人邠守傅愼微忤用事者被讒構下獄且死保衡力救之得免入為太常卿遷禮部尚書拜參知政事三年宋人請和詔保衡往南京與布薩忠義斟酌事宜行之入奏進右丞四年宋人請和師還保衡朝京師初宮女稱心縱火十六位延燒諸殿上以方用兵國用不足不復營繕及宋和詔保衡監護役事遣少府監張仲愈取南京宮殿圖本上聞之謂保衡曰追仲愈還民間將謂朕效正隆華侈也六年冬有疾求致仕不許遣敬嗣暉傳詔曰卿以忠直擢居執政齒髪未衰遽以小疾求退善加攝飬以俟疾間視事未幾薨年五十五世宗將放鷹近郊聞之乃還為輟朝賻贈命有司致祭翟永固字仲堅中都良鄉人太祖與宋約攻遼事成以燕歸宋宋人以經義兼策取士永固中第一授開德府儀曹參軍金破宋永固北歸中天㑹六年詞賦科授懷安丞遷望雲令補樞宻院令史辟左副元帥宗翰府掾永固家貧求外補宗翰愛其能不許以錢三千貫周之薦於朝攝左司郎中除定武軍節度副使歴同知清州防禦使入為工部員外郎以毋憂去官起復禮部郎中遷翰林直學士海陵簒立宋國賀正旦使至廣寧海陵使使以廢立事諭宋使遣還之以侍衛親軍都指揮使完顏思恭為報諭宋使永固為副且令永固伺察宋人動静使還改禮部侍郎乆之分䕶燕京宮室役事永固請寫無逸圖於殿壁不納俄遷太常卿考試貞元元年進士出尊祖配天賦題海陵以為猜度已意召永固問曰賦題不稱朕意我祖在位時祭天拜乎對曰拜海陵曰豈有生則致拜死而同體配食者乎對曰古有之載在典禮海陵曰若桀紂㑹行者欲我行之乎於是永固張景仁皆杖二十而進士張汝霖賦第八韻有曰方今將行郊祀海陵詰之曰汝安知我郊祀乎亦杖之三十頃之永固遷禮部尚書賜笏頭毬文金帶改永定軍節度使正隆二年例降二品以上官爵永固階光祿大夫不降以寵異之遷翰林學士承㫖與直學士韓汝嘉俱召至内殿問以將親伐宋事永固對曰宋人事本朝無釁隙伐之無名縱使可伐亦無煩親征遣將帥可也由是大忤海陵意永固即請致仕正隆四年正月丁已海陵朝永壽宮四品以上官賜宴永固至殿門外海陵即以致仕宣命授之永固歸卧於家大定二年起拜尚書左丞請依舊制廉察官吏革正隆守令之汙從之明年表乞致仕詔不許罷為真定尹賜通犀帶尚書省奏永固自執政為真定永其繖蓋當用何制度上曰用執政制度遂著為令五年懇乞致仕許之六年薨魏子平字仲均宏州人登進士第調五臺主簿累除為尚書省令史除大理丞歴左司都事同知中都轉運使事太府監正隆三年為賀宋主生日副使是時海陵謀伐宋子平使還入見海陵問江左事且曰蘇州與大名孰優子平對曰江湖地卑濕夏服蕉葛猶不堪暑安得與大名比也海陵不悅世宗即位除戶部侍郎大定二年丞相布薩忠義伐宋置元帥府於南京子平掌餽運給金牌一銀牌六糧道給辦進戶部尚書六年復為賀宋主生日使上曰使宋無再往者卿昔年供河南軍儲有勞用此優卿耳乆之拜叅知政事上問子平曰古者稅什一而民足今百一而民不足何也子平對曰什一取其公田之入今無公田而稅其私田為法不同古有一易再易之田中田一年荒而不種下田二年荒而不種今乃一切與上田均稅之此民所以困也上又問曰戍卒逋亡物故今按物力髙者補之可乎對曰富家子弟騃懦不可用守戍歲時求索無厭家產隨壞若按物力多寡賦之募材勇騎射之士不足則調兵家子弟補之庶幾官收實用人無失職之患上從之海州捕賊八十餘人賊首海州人其兄今為宋之軍官上聞之謂宰相曰宋之和好恐不能乆其宿泗間漢軍以女直軍代之子平曰誓書稱沿邊州城除自來合設置射糧軍數并廵尉外更不得屯軍守戍上曰此更代之非增戍也上曰前日令内任官六品以上外任五品以上並舉所知未聞有舉之者豈無其才蓋知而不舉也子平曰請令當舉之官毎任須舉一人澤州刺史劉德裕祈州刺史色克滄州同知額哩頁易州同知額哩埒楚邱縣令劉春格以贓汙抵罪上欲詔示中外丞相守道以為不可上以問子平曰卿意何如子平曰臣聞懲一戒百陛下固冝行之上曰然遂降詔焉宋人於襄陽漢江上造舟為浮梁三南京統軍司聞而奏之上問宰臣曰卿等度之以為何如子平曰臣聞襄陽薪芻皆於江北取之殆為此也上曰朕與卿等治天下當治其未然及其有事然後治之則晩矣河南統軍使宗叙求入見奏邉事上使修起居注鈕祜祿額特埒就問狀宗叙言得邉報及宋來歸者言宋國調兵募民運糧餉完城郭造戰船浮橋兵馬移屯江北自和議後即罷制置司今復置矣南虢海州皆有姦人出没此不可不備嘗報樞密院彼視以為文移故欲入見言之額特埒召凡言邉事者詰問皆無實狀行至境上問至襄陽浮橋乃樵采之路如子平䇿還奏詔凡妄說邉闗兵事者徒二年告人得實賞錢五百貫上問宰臣曰祭宗廟用牛羊盡力稼穡有功於人殺之何如子平曰曰惟天地宗廟用之所以異大祀之禮也十一年罷為南京留守未幾致仕十五年起為平陽尹復致仕二十六年薨于家孟浩字浩然灤州人遼末年登進士第天㑹三年為樞密院令史除平州觀察判官天眷初選入元帥府備任使承制除歸德少尹充行臺吏禮部郎中入為戶部員外郎郎中韓企先為相拔擢一時賢能皆置機要浩與田㲄皆在尚書省㲄為吏部侍郎浩為左司員外郎既典選善銓量人物分别賢否所引用皆君子而蔡松年曹望之許霖皆小人求與㲄相結㲄薄其為人拒之松年蔡靖子靖將兵不能守燕山終敗宋國㲄頗以此譏斥松年松年初事宗弼於行臺省以微巧得宗弼意宗弼當國引為刑部員外郎望之為尚書省都事霖為省令史皆怨㲄䓁時時毁短之於宗弼凡與㲄善者皆指以為朋黨韓企先疾病宗弼往問之是日㲄在企先所聞宗弼至知其惡已乃自屏以避宗弼曰丞相年老且疾病誰可繼丞相者企先舉㲄而宗弼先入松年譖言謂企先曰此軰可誅㲄聞流汗浹背企先薨㲄出為横海軍節度使選人龔夷鑒除名值赦赴吏部銓得預覃恩㲄已除横海部吏以夷鑒白㲄㲄乃倒用日月署之許霖在省典覃恩行臺省工部員外郎張子周素與㲄有怨以事至京師微知夷鑒覃恩事嗾許霖發之詆以專擅朝政詔獄鞫之擬㲄與夷毅邢具瞻王植髙鳯庭王俲趙益興龔夷鑒死其妻子及所往來孟浩等三十四人皆徙海上仍不以赦原天下寃之世宗在熙宗時知田㲄黨事皆松年等搆成之而浩等三十二人遇天德赦令還鄉里多物故惟浩與㲄兄穀王𥙷馮煦王中安在大定二年召見復官爵浩為侍御史穀為大理丞補為工部員外郎煦為兵部主事中安知火山軍事而浩㝷復為右司員外郎浩篤實遇事輒言無所隱上嘉其忠毎對大臣稱之有疾求外補除祁州刺史致仕歸七年起為御史中丞而浩已年老世宗以不次用之再閲月拜叅知政事故事無自中丞拜執政者浩辭曰不次之恩非臣所敢當上曰卿自刺史致仕除中丞國家用人豈拘階次卿公正忠勤雖年髙猶可宣力數年朕思之乆矣浩頓首謝世宗勅有司東宫涼樓増建殿位浩諫曰皇太子義兼臣子若所居與至尊宫宫室侔恐制度未宜固宜示以儉德上曰善遂罷其役因謂太子曰朕思漢文純儉心常慕之汝亦可以為則也未幾皇太子生日上宴羣臣於東宮以大玉杓黄金五百兩賜丞相志寜顧謂羣臣曰卿等能立功朕亦褒賞如此又曰叅政孟浩公正敢言自中丞為執政卿等能如是朕亦不次用之世宗嘗曰女直本尚純朴今之風俗日薄一日朕甚憫焉浩對曰臣四十年前在㑹寜當時風俗與今日不同誠如聖訓上曰卿舊人固知之上謂宰臣曰宋前廢帝呼其叔湘東王為豬王食之以牢納之泥中以為戲笑書於史策所以勸善而懲惡也海陵以近習掌記注記注不明當時行事實錄不載衆人共知之者求訪書之浩對曰良史直筆君舉必書帝王不自觀史記注之臣乃得盡其直筆浩復奏曰厯古以來不明賞罰而能治者未之聞也國家賞善罰惡蓋亦多矣而天下莫能知乞自今凡賞功罰罪皆具事狀頒告之使君子知勸以遷善小人知懼以自警從之進尙書右丞兼太子少傳罷為真定尹上曰卿年雖老精神不衰善治軍民毋遽言退以通犀帶賜之十三年薨田㲄自大理丞累官同知中京留守終於利渉軍節度使二十九年章宗詔尚書省曰故吏部侍郎田㲄等皆中正之士小人以朋黨䧟之由是得罪世宗用孟浩為右丞當時在者俱已用之亡者未加追復其議以聞張汝霖奏曰㲄專權樹黨先朝已正罪名莫不稱當今追贈官爵恐無懲勸汝霖先朝大臣嘗與顧命上初即位不肯輙逆其意謂之曰卿既以為不可姑置之蓋張浩與張松年友善故汝霖猶擠之也汝霖死後章宗復詔尙書省曰蓋自田㲄黨事之後有官者以為戒惟務苟且習以成風先帝知㲄等無罪錄用生存之人有擢至宰執者其次有為節度防禦刺史者其死者猶未追復子孫猶在編户朕甚憫焉惟徴賢顯善無間存没宜推先帝所以褒錄忠直之意並加恩䘏以勵風俗據田㲄一起人除已叙用外但未經任用身死並與復舊官爵其子孫當時已有官職以父祖坐黨因而削除者亦與追復應合追復爵位人等子孫不及䕃叙者亦皆量與㤙例梁肅字孟容奉聖州人自㓜勤學夏夜讀書往往逹旦母葛氏常滅燭止之天眷二年擢進士第調平遙縣主簿遷望都絳縣令以亷入為尚書省令史除定海軍節度副使改中都警廵使遷山東西路轉運副使營治汴宮肅分䕶役事攝大名少尹正隆末境内盗起驅百姓平人䧟賊中不能自辨者數千人皆繫大名獄肅到官考騐得其情讞出者十八九大定二年宛平趙植上書曰頃者正隆任用閹寺少府少監兼上林署今胡守忠因緣巧倖規取民利前薊州刺史完顏守道前中都警廵使梁肅勤恪清亷願加進擢於是守忠落少監守道自濱州刺史召為諫議大夫肅中都轉運副使改大興少尹肅上疏言方今用度不足非但邉兵耗費而已吏部以常調除漕司僚佐皆年老資髙者為之類不稱職臣謂凡軍功進士諸科門蔭人知錢穀利害能使國用饒足而不傷民者許上書自言就擇其可用授以職事毎五年委吏部通校有無水旱屯兵視其增耗而黜陟之自漢武帝用桑宏羊始立𣙜酤法民間粟麥歲為酒所耗者十常二三宜禁天下酒麴自京師及州郡官務仍舊不得酤販出城其縣鎮鄉村權行停止不報三年坐捕蝗不如期貶川州刺史削官一階解職上御便殿召左諫議大夫奚籲翰林待制劉仲誨秘書少監伊喇子敬訪問古今事少間籲從容請曰梁肅材可惜解職太重上曰卿言是也乃除河北東路轉運副使是時斡罕亂後兵食不足詔肅措置沿邉兵食移牒肇州北京廣寧鹽塲許民以米易鹽兵民皆得其利四年通檢東平太名兩路戶籍物力稱其平允他使者所至皆以苛刻增益為功百姓訴苦之朝廷勅諸路以東平大名通檢為準於是始定七年父憂去官起復都水監河决李固詔肅視之還奏决河水六分舊河水四分今障塞決河復故道為一再決而南則南京憂再決而北則山東河北皆可憂不若止於李固南築隄使两河分流以殺水勢便上從之改大理卿尚輦局巴哩巴舒穆嚕阿爾噶與釘校匠陳外爾共盜宫中造車銀釘葉肅以阿爾噶監臨當首坐他寺官以陳外爾為首抵死上曰罪疑惟輕各免死徒五年除名時東京乆不治上自擇肅為同知東京留守事遷中都都轉運使轉吏部尚書上疏論臺諫大㫖謂臺官自大夫至監察諫官自大夫至拾遺陛下宜親擇不可委之宰相恐樹私恩塞言路也上嘉納之復請奴婢不得服羅上曰近已禁奴婢服明金矣可漸行之肅舉同安主簿高旭除平陽酒使肅奏曰明君用人必器使之旭儒士優於治民若使坐列肆𣙜酒酤非所能也臣愚以為諸道鹽鐡使依舊文武叅注其酒税使副以右選三差俱最者為之上曰善改刑部尚書宋主屢請免立受國書之儀世宗不從及大興尹璋為十四年正旦使宋主使人就館奪其書而重賂之璋還杖一百五十除名以肅為宋國詳問使其書略曰􅉀書所載止於帝加皇字免奉表稱臣稱名再拜量减歲幣便用舊儀親接國書兹禮一定於今十年今知嵗元國信使到彼不依禮例引見輒令廹取於館姪國禮體當如是耶往問其詳宜以誠報肅至宋宋主一一如約立接國書肅還附書謝其略曰姪宋皇帝謹再拜致書于叔大金應天興祚欽文廣武仁德聖孝皇帝闕下惟十載遵􅉀之乆無一毫成約之違獨顧禮文宜存折衷矧辱函封之貺尚循躬受之儀既俯廹於輿情嘗屡伸于誠請因嵗元之來使遂商𣙜以從權敢勞将命之還先布鄙悰之懇自餘專使肅控請祈肅還至泗州先遣都管趙王府長史圖們富尼瑪入奏世宗大喜欲以肅為執政左丞相良弼曰梁肅可相但使宋還即為之宋人自此輕我矣上乃止乆之為濟南尹上疏曰刑罰世輕世重自漢文除肉刑罪至徒者帶鐐居役歲滿釋之家無兼丁者加杖准徒今取遼季之法徒一年者杖一百是一罪二刑也刑罰之重於斯為甚今太平日乆當用中典有司猶用重法臣實痛之自今徒罪之人止居作更不决杖不報未幾致仕起復彰德軍節度使召拜叅知政事上謂侍臣曰梁肅以治入異等遂至大任廉吏亦可以勸矣肅奏漢之羽林皆通孝經今之親軍即漢之羽林也臣乞每百戸賜孝經一部使之教讀庶知臣子之道其出職也可知政事上曰善人之行莫大於孝亦由教而後能詔與䕶衛俱賜焉復上奏曰方今斗米三百人已困餓以錢難得故也計天下嵗入二千萬貫以上一歲之用餘千萬院務坊塲及百姓合納錢者通减數百萬院務坊塲可折納穀帛折支官兵俸給使錢布散行間稍稍易得上曰縣欠院務許折納可也肅上疏論生財舒用八事一曰罷庶司通事一曰罷酒稅司杓欄人三曰天水郡王本族已無在者其餘皆遠族可罷養濟四曰裁减隨司契丹吏員五曰罷𣙜醋以利與民六曰量减鹽價使私鹽不行民不犯法七曰隨路酒税許折納諸物八曰今歲大稔乞廣糴粟麥使錢貨流出上曰趙氏飬濟一事乃國家美政不可罷其七事宰相詳議以聞上又曰朕在位二十餘年鑒海陵之失屢有改作亦不免有繆戾者卿等悉心奏之肅論正員官被差權攝官有公罪及正員還任皆准去官勿論往往其人苟且不事其事乞于縣令中留十人備差無差正員官上曰自今權攝有公罪正員雖還而本職未替者勿以去官論之肅曰誠如聖㫖肅與宰相奏事既罷肅跪而言曰四時畋獵雖古禮聖人亦以為戒陛下春秋髙屬時嚴寒馳騁於山林之間法官燕處亦足怡神願為宗社自重天下之福也上曰朕諸子方壮使之習武故時一往爾同知震武軍節度使鄧秉鈞陳言四事其一言外多闕官及循資擬注不得人上以問宰相張汝弼曰循資格行已乆仍舊便肅曰不然如亡遼固不足道其用人之法有仕及四十年無敗事即與節度使豈必循資哉上曰仕四十年已衰老察其政蹟善者升之後政再察之善又升之如此可以得人亦無曠事肅曰誠如聖訓肅論盗賊不息請無禁兵器上曰所在有兵噐其利害如何肅曰他路則已中都一路上農夫聽置之似乎無害上曰朕将思之凡使宋者宋人致禮物大使金二百兩銀二千兩副使半之幣帛雜物稱是及推排物力肅自以身為執政昔嘗使宋所得禮物多當為庶民率先乃自增物力交十餘貫論者多之二十三年肅請老上謂宰相曰梁肅知無不言正人也卿䓁知而不言朕實鄙之雖然肅老矣宜從其請遂再致仕詔以其子汝翼為閤門祗侯二十八年薨諡正憲伊喇慥本名伊德爾契丹伊嚕勒部人通契丹漢字髙書省辟契丹令史攝知除擢右司郎事正隆南伐兼契丹漢字兩司都事大定二年除眞定少尹入為侍御史母憂去官起復右司員外郎累官陳州防禦使左丞相赫舍哩良弼致仕上問誰可代卿者對曰陳州防禦使伊喇慥清幹忠正臣不及也遂召為太府監㝷改刑部侍郎十九年以按春等八明安自河南徙置大名東平之境還為大理卿被詔典領更定制條初皇統間參酌隨唐遼宋律令以為皇統制條海陵虐法率意更改或同罪異罰或輕重不倫或共條重出或虚文贅意吏不知適從夤縁舞法慥取皇統舊制及海陵續降通類校定通其窒礙略其繁碎有例該而條不載者用例補之特闕者用律增之凡制律不該及疑不能參决者取㫖畫定凡特㫖處分及權宜條例内有可常行者收為永格其餘未可削去者别為一部大凡一千一百九十餘為十二卷書奏詔頒行之賜銀幣有差頃之摘徙山東明安八穆昆于河北東路置之綽哈成格勒兩明安舊居之地詔無牛耕者買牛給之攝御史大夫數月改御史中丞兼司修國史遷刑部尚書改吏部尚書㝷改大興尹駕幸上京顯宗守國使人諭之曰自大駕東廵京尹所治甚善我將有春水之行當益勤乃事還以所獲鵝鴨賜之有疾在告遣官醫診視復為刑部尚書上還自上京以為西京留守改臨洮尹卒伊喇子敬字同文本名鄂克多囉遼五院人㑹祖巴格同平章事父博囉准備任使官都統杲克中京遼主西走留博囉督輜重已而輜重被掠博囉乃自髠逃于山林子敬讀書好學皇統間特進伊喇因修遼史辟為掾屬遼史成除同知遼州事舊本㕔自有占地歲入數百貫州官嵗取其課地主以為例未嘗請辯子敬曰已有公田何為更取民田竟不取秩滿郡人請留于行臺省不許天德三年入為翰林修譔遷禮部郎中正隆元年諸將廵邉詔子敬監戰軍帥以戰獲分將士亦以遺子敬子敬不受及還入見海陵謂之曰汝家貧而不苟得不受俘獲朕甚嘉之凡同行官僚所取者皆没入於官其後詔子敬宴賜諸部諭之曰凡受進例遣宰臣以汝前能稱職故特命汝使還遷翰林待制大定二年以待制同修國史是時幹罕餘黨散居諸明安穆昆中詔子敬往撫之仍宣諭明安穆昆及州縣漢人無以前時用兵相殺傷挾怨輒害契丹人使還改秘書少監兼修起居注修史如故詔曰以汝博通古今故以命汝常召入講論古今及時政利害或至夜半子敬有良馬平章政事完顏元宜索之子敬以元宜為相不與至是元宜乞致仕罷為東京子敬乃以此馬贈行識者韙之是時布薩忠義伐宋宋請和而書式疆界未定子敬與秘書少監舒穆嚕頣修起居注張汝弼侍便殿上曰宋主求成反覆無信喜為夸大子敬對曰宋人自來浮辭相欺來書言海陵敗于采石大軍北歸按兵不襲俾全師而還海陵未嘗敗于采石其譎詐多此類也回書宜言往者大軍若令渡江宋國境土必為我有上曰彼以譎詐我以誠實當以理折之遷右諫議大夫起居注如故上幸西京州縣官入見明安穆昆不得随􅀈子敬奏軍民一體合令明安穆昆隨入見上嘉納之於是責讓宣徽院及端午朝㑹詔依子敬奏行之子敬言山後禁獵地太廣有妨耕墾上用其言遂以四外獵地與民遷秘書監諫議起居如故子敬舉同知宣徽院事伊喇錫勒塔干兵部侍郎伊喇諳逹太子少詹事烏庫哩薩哈自代上不許子敬與同簽宣徽院事伊喇錫勒塔干侍上曰亡遼不忘舊俗朕以為是海陵習學漢人風俗是忘本也若依國家舊風四境可以無虞此長乆之計也世宗將如涼陘子敬與右𥙷闕鈕祜祿額特埒左拾遺楊伯仁奏曰車駕至和爾和西北招討司囿於行宮之内地矣乞遷於界上以蔽屏環衛上曰善詔尚書省曰招討錫里庫可徙界上治蕃部事都監薩巴仍於燕子城治明安穆昆事上與侍臣論古之人君賢否子敬奏曰陛下凡與宰相謀議不可不令史官知之上曰卿言是也轉簽書樞宻院事同修國史出為河中尹請老河中地熱上恐子敬不耐暑改興中尹子敬女自懿州來興中省謁遇盜途中剽掠其行李且盡既而還之謝曰我軰初不知為府尹家也尹有德於民尚忍侵犯耶徙咸平廣寧尹二十一年致仕卒於家年七十一子敬嘗使宋及受諸部進貢所受禮物皆散之親舊及卒家無餘財其子質宅以營葬事贊曰金制尚書令左右丞相平章政事是謂宰相左右丞叅知政事是謂執政大抵因唐官而稍異焉因革不同無足疑者書曰元首明哉股肱良哉庶事康哉又曰元首叢脞哉股肱惰哉萬事隳哉宰相執政豈異道邪蘇保衡翟永固魏子平孟浩梁肅皆當時之賢執政也伊喇慥子敬有其才適其時而位不及者亦命也夫金史卷八十九
