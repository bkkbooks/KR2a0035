body:
  text: 金史卷一百三十五元中書右丞相總裁托克托等修列傳第七十三外國下髙麗髙麗國王王楷其地鴨緑江以東海蘭路以南東南皆至于海自遼時嵗時遣使修貢事具遼史唐初靺鞨有粟末黑水兩部皆臣屬于髙麗唐滅髙麗粟末保東牟山漸彊大號渤海姓大氏有文物禮樂至唐末稍衰自後不復有聞金伐遼渤海來歸葢其遺裔也黒水靺鞨居古肅慎地有山曰白山葢長白山金國之所起焉女直雖舊屬髙麗不復相通者久矣及金滅遼髙麗以事遼舊禮稱臣于金初有醫者善治疾本髙麗人不知其始自何而來亦不著其姓名居女直之完顔部穆宗時戚屬有疾此醫者診視之穆宗謂醫者曰汝能使此人病愈則吾遣人送汝歸汝鄉國醫者曰諾其人疾果愈穆宗乃以初約歸之伊勒呼嶺布薩部和色哩貝勒居髙麗女直之兩間穆宗使族人桑阿招之因使桑阿送醫者歸之髙麗境上醫者歸至髙麗因謂髙麗人女直居黒水部者部族日彊兵益精悍年穀屢稔髙麗王聞之乃通使于女直既而和色哩來歸遂率伊勒呼嶺東諸部皆内附穆宗十年癸未阿蘇自遼使其徒徳濟來説海蘭甸人海蘭甸人執之穆宗以徳濟送髙麗謂髙麗王曰前此為亂於汝鄙者皆此軰也及破蕭哈里使鄂勒歡往髙麗報㨗髙麗亦使使來賀未幾復使色克與鄂勒歡往聘髙麗王曰色克女直之族弟也其禮有加矣乃以一大銀盤為謝厥後海蘭甸諸部盡欲來附髙麗聞之不欲使來附恐近於已而不利也使人邀止之色克在髙麗及往來海蘭道中具知其事遂使碩碩歡往納海蘭甸人未行而穆宗沒康宗嗣遣碩碩歡以錫馨圖們之兵往至伊勒呼嶺益募兵趨和尼水徇地海蘭甸收叛亡七城髙麗使人來告曰事有當議者海蘭甸官屬使色埒詳衮卓拉布詳衮往碩碩歡亦使博囉往髙麗執卓拉布等而遣博囉曰無與爾事於是五水之民皆附於髙麗團練使陷者十四人二年甲申髙麗來攻碩碩歡大破之殺獲甚衆追入其境焚畧其戍守而還四月髙麗復來攻碩碩歡以五百人禦於布騰水復大破之追入布騰水逐其殘衆踰境於是髙麗王曰吿邊釁者皆官屬錫爾丹巴圖嚕賽必罕軰也十四團練六路使人在髙麗者皆歸之遣使請和遂使色格經正疆界至伊勒呼水海蘭甸和尼水留之兩月色格不能聴訟每一事輒至支蔓民頗苦之康宗召色格還而遣碩碩歡往碩碩歡立幕府于三潺水其嘗隂與髙麗往來為亂階者即正其罪餘無所問康宗以為能四年丙戌髙麗使使黒歡方石來賀嗣位康宗使博囉報聘且尋前約取亡命之民髙麗許之曰使使至境上受之康宗以為信然使完顔部阿古烏凌阿部雙寛往境上受之康宗畋於瑪竒嶺伊智村以待之阿古雙寛至境上髙麗遣人殺之而出兵海蘭甸築九城康宗歸衆咸曰不可舉兵也恐遼人將以罪我太祖獨曰若不舉兵豈止失海蘭甸諸部皆非吾有也康宗以為然乃使烏色將兵伐之大破髙麗兵六月髙麗率兵來戰烏色敗之進圍其城七月髙麗復請和康宗曰事若酌中則與之和髙麗許歸亡入之民罷九城之戍復所侵故地遂與之和收國元年九月太祖已克黄龍府命瓜爾佳薩哈攻保州保州近髙麗遼侵髙麗置保州至是命薩哈取之久不下薩哈請濟師且言髙麗王將遣使來太祖使納哈塔烏珍益以百騎詔薩哈曰汝領偏師屢破重敵多所俘獲及聞和碩數戰有功朕甚嘉之若保州未下但守邊戍吾已克黄龍府聞遼主且至俟破大敵復益汝兵所言髙麗遣使事未知果否至則䕶送以來邊境之事慎之毋忽十一月係遼籍女直瑪穆丹等十五人皆降攻開州取之盡降保州諸部女直太祖以薩哈為保州路都統太祖已破走遼主軍薩哈破和卓順化二城復請濟師攻保州使斡魯以甲士千人往二年閏月髙麗遣使來賀㨗且曰保州本吾舊地願以見還太祖謂使者曰爾其自取之詔薩哈烏春等曰若髙麗來取保州益以呼嚕古錫馨等軍備之或欲合兵無得輙往但謹守邊戍及薩哈愛實拉等攻保州遼守將遯去而髙麗兵已在城中既而髙麗國王使佛們請保州詔諭髙麗王曰保州近爾邊境聴爾自取今乃勤我師徒破敵城下且富尼瑪止是口陳俟有表請即當别議天輔二年十二月詔諭髙麗國王曰朕始興師伐遼已嘗布吿賴皇天助順屢敗敵兵北自上京南至于海其間京府州縣部族人民皆撫定今遣貝勒卓巴克報諭仍賜馬一匹至可領也三年髙麗増築長城三尺邊吏發兵止之弗從報曰修補舊城海蘭甸貝勒呼嚕古錫馨以聞詔曰無得侵軼生事但慎固營壘廣布耳目而已四年咸州路都統司以兵分屯于保州博囉威二城請益兵詔曰汝等分列屯戍以固封守甚善髙麗累世臣事于遼或有交通可常遣人偵伺使錫馨以獲遼國州郡諭髙麗其國方誅亂者使謂錫馨曰此與先父國王之書錫馨就館凡誅官僚七十餘人即以舊禮接見而以表來賀并貢方物復以遼帝亡入夏國報之髙隨舍音奉使髙麗至境上接待之禮不遜隨等不敢往太宗曰髙麗世臣於遼當以事遼之禮事我而我國有新喪遼主未獲勿遽强之命髙隨等還天㑹二年同知南路都統和碩台奏髙麗納叛亡増邊備必有異圖詔曰凡有通問毋違常式或來侵略則整爾行列與之從事敢先犯彼者雖㨗必罰詔棟摩以甲士千人戍海島以偹之四年國王王楷遣使奉表稱藩優詔答之上使髙伯淑烏至忠使髙麗凡遣使往來當盡循遼舊仍取保州路及邊地人口在彼界者須盡數發還勅伯淑曰若一一聼從即以保州地賜之髙伯淑至髙麗王楷附表謝一依事遼舊制八年楷上表乞免索保州亡入邊户是嵗髙麗十人捕魚大風飄其船抵海岸哈斯罕人獲之詔還其國既而朂上表請不索保州亡入髙麗户口太宗從之自是保州封域始定皇統二年詔加楷開府儀同三司上柱國六年楷薨子晛嗣立大定四年詔鴨緑江堡戍頗被侵越焚毁五年正月世宗因正旦使朝辭諭之曰邊境小小不虞爾主使然邪疆吏為之邪若果疆吏為之爾主亦當懲戒之也初髙麗使者别有私進禮物以為常是嵗萬春節上以使者私進不應典禮詔罷之十年王晛弟翼陽公晧廢晛自立十月賜生日使大宗正丞乣至界上髙麗稱前稱前王已讓位不肯受使者十一年三月王晧以讓國來奏吿詔博索路勿受有司移文詳問髙麗吿曰前王久病昏耄不治以母弟晧權攝國事上曰讓國大事也何以不先陳請詔有司再問髙麗乃以王晛讓國表來大畧稱先臣楷遺訓令傳位於弟又言其子有罪不可立之意上疑之以問宰執丞相良弼奏曰此不可信晛止一子往年生孫嘗有表自陳生孫之喜一也晧嘗作亂晛囚之二也今晛不遣使晧乃遣使三也朝廷賜晛生日使晧不轉達於晛乃稱未敢奉受四也是晧篡兄誣情於天子安可忍也右丞孟浩曰當詢彼國士民果皆推服即當遺使封冊上曰封一國之君詢於士民此與除拜明安穆昆何異乃却其使者而以詔書詳問王晛吏部侍郎靖為宣門王晛使晧實簒國囚晛於海島靖至髙麗晧稱王晛已避位出居他所病加無損不能就位拜命往復險逺非使者所宜往靖竟不得見晛乃以詔授晧轉取晛表附奏其言與前表大槩相同靖還上問大臣皆曰晛表如此可遂封之丞相良弼平章政事守道曰待晧祈請未晩也十二月晧遣其禮部侍郎張翼明等請封十二年三月遂賜封冊晧生日在正月十九日是嵗十二月將盡未及遣使有司請至來嵗舉行焉十五年髙麗西京留守趙位寵叛晧遣徐彦寧等九十六人上表曰前王本非避讓大將軍鄭冲夫郎將李義方實弑之臣位寵請以慈悲嶺以西至鴨緑江四十餘城内屬請兵助援上曰王晧已加封冊位寵輙敢稱兵為亂且欲納土朕懐撫萬邦豈助叛臣為虐詔執徐彦寧等送髙麗頃之王晧定趙位寵之亂遣使奏謝自位寵之亂晧所遣生日回謝横賜回謝賀正旦進春萬春節等使皆阻不通至是晧并奏之詔答其意其合遣人使令節次入朝十七年賀正旦禮物玉帯乃石似玉者有司請移問上曰彼小國無能識者誤以為玉耳不必移問乃止十二月有司奏髙麗下節押馬官順成例外將帶甲三過界上以使人所坐罪重但令發還本國而已二十三年晧母任氏薨晧乞免賜生日及賀謝等事詔從之章宗即位詔使至界上頗稽滯詔移問髙麗遜謝明昌三年下節金挺回至平州撫寧縣毆死當驛人何恬爾有司請凡人使往還乞量設兵衞參知政事張萬公曰可於宿頓之地巡䕶之上可其奏詔自今接送伴使副失闗防者當坐故事賀正旦使十二月二十九日入見明昌六年十二月已卯立春詔於前二日丁丑入見云承安三年晧表自陳衰病以國讓其弟晫晫權國事是嵗晧薨晫嗣立泰和四年正月乙丑朔髙麗傔人以小佩刀割梨廡下廵廊奉職見而糾之詔館伴官自今前期移文禁止是嵗王晫薨子韺嗣立泰和七年正月是時用兵伐宋夏亦有故獨髙麗遣正旦使詔不賜曲宴及天夀節夏髙麗使者皆在有司奏大定初宋未請和夏髙麗使者賜曲宴今請依大定故事詔從之至寧元年八月王韺薨嗣子未行起復九月宣宗即位邊吏奏髙麗牒稱嗣子未起復不可以凶服迎吉詔又不可以草土名銜署表禮官議人臣不以私恩廢公義宜權用吉服迎詔署表用權國事名銜俟髙麗吿哀使至闕然後遣使致祭慰問及行封冊制可明年宣宗遷汴遼東道路不通興定三年遼東行省奏髙麗復有奉表朝貢之意宰臣奏可令行省受其表章其朝貢之禮俟他日徐議宣宗以為然乃遣使撫諭髙麗終以道路不通未遑迎迓詔行省且覊縻勿絶其好然自是不復通問矣贊曰金人本出靺鞨之附于髙麗者始通好為鄰國既而為君臣貞祐以後道路不通僅一再見而已入聖朝猶子孫相傳自為治故不復備論論其與金事相涉者焉金史卷一百三十五
