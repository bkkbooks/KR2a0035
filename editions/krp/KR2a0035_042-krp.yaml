body:
  text: 金史卷四十二元中書右丞相總裁托克托等修志二十三儀衛下大駕鹵簿簿皇太子鹵皇太后皇后鹵簿親王傔從諸妃嬪導從百官儀従大駕鹵簿世宗大定三年袷享用黄麾仗三千人分四節第一節無縣令府牧即用黄麾前三部次前部鼓吹次金吾牙門旗次駕頭次引駕龍墀隊次天王十二辰等旗第二節黄麾第四第五部次君王萬歳日月旗次御馬内增控馬司圉挾馬司圉各一十六人次日月合璧五星連珠等旗次八寳内増執黑杖𫝊喝一十八人在香案前次七寳輦第三節黄麾後第一第二部次玉輅次栲栳隊次導駕門仗官第四節黄麾後第三第四第五部次金輅次牙門旗次後部鼔吹大定六年九月西京還都用黄麾仗二千五百四十二人攝官在内騎七百六十二匹分四節第一節攝官五十四人執擎三百二人樂工一百七十人第二節攝官三十二人執擎三百七十六人第三節仗内攝官四十四人導駕官四十二人門仗官一百人玉輅青馬八駕士一百四十人護駕栲栳隊五百人執擎二百四十二人第四節攝官五十人金輅赤馬八駕士九十四人控鶴二十二人樂工八十四人執擎二百九十人是歳上還自西京有司備儀仗皇太子乘金輅上疑其非禮以問禮官無能知者上怒皆責降之明年將冊皇太子宰臣奏當備儀仗告廟上曰前朕受尊號謁謝但令朕用宋真宗故事朝服乘馬於禮甚輕今皇太子乃用備禮何耶丞相良弼謝上徐曰此文臣因循不加意爾先是凡行幸皆役民執仗是後詔以軍士易之大定十一年將有事於南郊朝享太廟右丞石琚奏其禮上曰前朝漢人祭天惟務整肅儀仗此自奉耳非敬天也朕謂祭天在誠不在儀仗之盛也其減半用之於是遂增損黄麾仗為大駕鹵簿凡用七千人攝官在内分八節第一節第一引七十人縣令第二引二百六十四人府牧第三引二百二十九人御史大夫名色與府牧同頗損其數而増行止旗一第二節金吾皁纛旗一十二人朱雀隊三十四人指南記里鼓車皆五十二人鸞旗車一十八人前部鼓吹一百二十九人清游隊七十二人内白澤旗二旗五人緑具裝冠緑皮甲勒皮錦臂鞲横刀引夾加弓矢緑皮馬甲包尾全折衝都尉二人黑平巾幘紫繡辟邪袍革帶銀褐大口袴錦騰蛇横刀弓矢弩六弓矢二十四矟三十竝錦㡌青繡實相花衫革帶銀褐大口袴佽飛隊四十八人内果毅都尉二黒平巾幘紫繡飛麟袍革帶銀褐大口袴錦騰蛇佩横刀弓矢虞候佽飛三十人鐡甲兠牟横刀弓矢黒馬甲全鐡甲佽飛一十六人服執如上前部馬隊第一隊六十四人第二第三隊皆六十人第四第五隊皆五十八人殳义仗五十四人内帥兵官二人黒平巾績緋寶相花衫革帶銀褐大口執儀刀刀殳二十六义二十六五色寶相花衫抺額抺帶行縢鞋韈行止旗一緋繡寳相花衫抺額銀褐抺帶大口袴第三節前部鼓吹第二三百六十九人前歩甲隊第一至第五隊皆四十二人衙門旗二十人黄麾前第一部一百五十人第二部一百二十人殳义仗五十八人行止旗一第四節黄麾幡三人六軍儀仗二百二十人人御馬三十三人黄麾前第三至第五部皆一百二十人青龍白虎隊五十二人殳义仗五十六人行止旗一第五節八寳二百三十二人平頭輦三十人七寳輦四十二人班劒儀刀隊二百人内將軍二人折衝都尉二人平巾幘緋辟邪袍革帶銀褐大口袴錦騰蛇執儀刀班劔儀刀各九十八竝平巾幘緋繡寶相花衫革帶銀褐大口袴錦騰蛇執儀刀驍衛翊衛隊六十人内供奉郎將二員黑平巾幘緋繡瑞馬袍革帶銀褐大口袴執儀刀鳯旗二旗五人服執如前弩弓矢矟皆一十六服如班劒儀刀夾轂隊第一隊九十二人内折衝都尉二人平巾幘緋繡飛麟袍革帶銀褐大口袴執儀刀寳符旗二旗五人朱鍪甲刀盾八十朱甲錦臂鞲行縢鞋襪第二隊八十二人内果毅都尉二人白澤袍飛黄旗二旗五人銀褐鍪甲刀盾七十第三隊八十二人内果毅都尉二人赤豹袍吉利旗二旗五人早鍪甲刀盾七十殳又仗五十六人行止旗一第六節馬歩門旗隊一百人駕頭一十五十廣武官茶酒班執從物者二十三人御龍直四十人紅錦團襖鍍金束帶内人員二卑㡌三十八人真珠頭巾玉輅一百五十一人栲栳隊五百人内金槍隊一百二十六人分左右人員十八竝鐡甲皁㡌紅錦背子執小旗馬甲紅錦包尾長行一百八人鐡甲兠牟紅錦背子錦臂鞲甲馬紅錦包尾執金槍銀槍隊一百二十六人人員十八長行一百八人服竝如上銀槍弓箭直歩隊一百二十四人人員四鐡甲皁㡌紅錦團花戰袍弓矢執銀骨朶馬甲全長行一百二十人鐡笠紅錦團花戰袍鐡甲弓矢骨朶骨朶直歩隊一百二十四人人員四長行一百二十人服甲同上無弓矢金吾牙門旗二十人黄麾後第一部一百五十人第二部一百二十人殳义五十二人行止旗一第七節扇筤二十五人金輅九十四人大安輦一百八十一人内尚輦奉御二人殿中少監二人奉職官二人竝公服令使四人書令史四人七人烏介幘緋四䙆素衫銀褐抺帶大口袴皁靴一人長脚幞頭紫羅公服角帶皁靴掌輦四人武牟黄繡寳相花衫銀褐抺帶大口袴人員十二皁㡌紅錦團襖銅束帶内指揮使一人執銀骨朶舁士一百五十一人服同掌輦御馬三十三人持鈒隊三十九人後部鼓吹一百六十人黄麾後第三至第五部皆一百二十人後歩甲隊第一至第二隊皆四十二人殳人仗五十六人行止旗一第八節後部鼓吹第二一百四十人象輅革車木輅皆五十人進賢車二十六人豹尾車一十八人屬車八十人𤣥武隊六十一人後歩甲隊第三至第五隊皆四十二人金吾牙門旗二十人後部馬隊第一隊七十六人第二隊六十四人第三隊六十人殳义仗六十人行止旗一後分行旗止旗為二以上名數與黄麾同者不重述章宗明昌五年六月尚書省奏大定六年世宗自西京還都採宋省方還京之儀用黄麾仗二千人及金玉輅栲栳隊甲騎五百人導駕官四十二員自後遂不復用今車駕幸景明宫還都之曰宜依用之制可承安元年省臣奏南郊大禮大駕鹵簿當用人二萬一千二百一十八馬八千一百九十八世宗親行郊祀仗用七千人今擬大定制外量添甲卒三百栲栳隊執撾人二百四十八通七千五百四十八人仍分八節從之泰和六年上欲親行祫享命有司計其役費尚書省奏當用仗三千五百人錢一萬餘貫馬八百六十五匹舊例馬皆借取於民親軍班祗皆自備從事今軍旅方興官馬以備緩急不可借用民亦不可重擾宜令有司攝事上詔再議之八年四月禘于太廟依元年例用黄麾仗三千人屯門仗五百人皇太后皇后鹵簿用唐宋制共二千八百四十人清游隊三十人清游旗一執一人引二人夾二人竝平巾幘緋裲襠大口袴佩弓矢横刀執矟弩騎次金吾衛折衝都尉一人平巾幘紫裲襠大口袴錦騰蛇弓矢横刀犦矟二人平巾幘緋衫大口袴夾折衝領四十騎横刀二十人執矟四人弩十六人竝平巾幘緋裲襠大口袴横刀弓矢次虞候佽飛二十八人竝平巾幘緋裲襠大口袴弓矢横刀騎夾道分右右均布至黄麾仗次内僕令一人丞一人依本品服分左右各書令史二人平巾幘緋衫大口袴騎從次黄麾一執一人夾二人武弁朱衣革帶正道騎次左右廂黄麾仗廂各三行行百人從内第一行短㦸五色氅執者竝黄地白花綦襖帽行縢鞋襪次外第二行戈五色氅執人竝赤地黄花綦襖㡌行縢鞋襪次外第三行儀鍠五色幡竝青地赤花綦襖㡌行縢鞋襪次左右領軍衛左右威衛左右武衛左右驍衛左右衛等衛各三行行二十人分前後衛各主師六人唯左右領軍衛各三人竝平巾幘緋裲襠大口袴領軍衛前後獅子文袍㡌餘衛豹文袍㡌各執鍮石裝長刀騎領分前後毎衛各果毅都尉一人檢校被繡袍以上各一名步從左右領軍衛有絳引幡引前掩後各三執者六人竝平巾幘緋衫大口袴次内謁者監四人給事二人内常侍二人内侍少監二人竝騎分左右以上各有内給使一人步從次内給使百二十人皆宫人竝平巾幘緋衫大口袴分左右在車後次偏扇團扇方扇各二十四分左右以宫人執之皆服間綵大䄂裙𥜗綵衣革帶履次香蹬一執擎内給使四人平巾幘緋裲襠大口袴在重翟車前次重翟車馬四駕士二十四人平巾幘青衫大口袴鞋襪次行障二坐障二分左右夾車宫人執之服同執扇次内寺伯二人領寺人六分左右平巾幘緋裲襠大口袴執御刀竝騎夾重翟車次腰輿一轝士八人團雉扇二夾輿次大傘四次大雉扇八分左右横行為二重次錦華葢二單行一正道次小雉扇朱團扇各十二竝横行分左右次錦曲葢二十四横行為二重次錦六柱八扇分左右自腰輿以竝竝内給使執之腰同前次宫人車次絳麾二分左右執各一人武弁朱衣革帶鞋韈次後黄麾一執一人夾一人竝騎武弁朱衣革帶正道次供奉宫人在黄麾後次厭翟車馬四駕士二十四人次翟車安車皆四馬駕士各二十四人次四望車金根車皆駕牛三駕士各十二人服同前次左右廂牙門各二毎門執二人夾四人竝赤綦襖黄袍㡌第一門在前黄麾前第二門在後黄麾後次左右領軍衛每廂各一百五十人執殳竝赤地黄花綦襖㡌行縢鞋韈前與黄麾仗齊後盡鹵簿廂各主帥四人檢校平巾幘緋衫大口袴被黄袍㡌執鍮石長刀騎其服豹文者二在内服獅文者二一引前一護後次左右領軍衛折衝都尉各一人檢校殳仗以上各一人騎從次後殳仗内正道置牙門一毎門監門校尉二人皆平巾幘緋裲襠大口袴執銀裝長刀騎毎廂各巡檢校尉一人往來檢校服仗同前前後部鼓吹金鉦掆鼓大鼓長鳴中鳴鐃吹羽葆鼓吹横吹節鼓御馬竝減大駕之半是歳重翟等六車改用圓方輅輦及行障坐障錦六柱宫人等車其制度人數竝見輿服志天徳二年海陵立后皇后乘龍飾肩輿有司設二歩障於殿之西階設扇左右各十繖一此蓋殿庭導引之儀也又設皇太后導從六十人傘子不在數内竝服簇四盤鵰團花紅錦襖金花幞頭塗金銀束帶永夀永寧宫導駕各三十人傘子各二人此亦常行之儀也皇太子鹵簿受用寳謝廟凡大禮大朝㑹則用之有司奏當用唐宋儀禮詔止用千人中道清游隊二十四人折衝都尉一人白澤旗一五人弩四弓六矟八竝騎清道直盪隊一十八人折衝都尉二人矟四弓矢十二竝騎誕馬四八人正直旗隊三十三人果毅都尉一人重輪旗一馴犀旗二野馬旗一訓象旗二旗各五人竝騎細引隊一十四人果毅都尉二人弓矢六矟六矟與弓矢相間竝騎前部鼓吹九十八人竝騎府史二人金鉦掆鼓各二大鼓十二長鳴八鐃鼓二簫六笳六帥兵官二節鼓二小鼓十二中鳴八桃皮篳篥四歌四拱辰管六篳篥六大横吹十二羽葆鼓二帥兵官二繖扇八梅紅傘二大雉扇四中雉扇二小輿一十八人導引官一十二人中允二人諭徳二人庶子二人詹事二人太師一人太傅一人太保一人少師一人在金輅後竝騎親勲翊衛圍子隊七十四人郎將二人儀刀七十二竝騎金輅七十人三衛隊一十八人執儀刀厭角隊六十二人郎將一人祥雲旗一五人弩三弓矢七矟十五竝騎又郎將一人祥雲旗一五人弩三弓矢七矟十五竝騎朱團扇一十六人司禦率府校尉四人騎朱團扇三紫曲蓋三大角一十八後部鼓吹五十四人竝騎管轄指揮一人金鉦掆鼓各一鐃鼓二簫六歌六蓽篥六節鼓一主帥二人笛六笳四拱辰管六小横吹十主帥二人後拒隊四十六人果毅都尉一人騎三角獸旗一五人弩四弓矢十六矟二十外仗左行二百四人牙門十六人竝騎牙門旗一三人監門校尉三人郎將一人班劒九前第一