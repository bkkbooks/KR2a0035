body:
  text: 金史卷六十六元中書右丞相總裁托克托等修列傳第四始祖以下諸子勗本名烏頁子宗秀威赫宗室呼實黙和卓子布呼果布衷本名綽哈齊本名素赫珠嚕呼實哈宗賢本名阿嚕達蘭卞本名鄂摩􅰇本名額哩埒奕本名三寳愛實勗字勉道本名烏百穆宗第五子好學問國人呼爲秀才年十六從太祖攻寜江州從宗望襲遼主於石輦鐸太宗嗣位自軍中召還與謀政事宗翰宗望定汴州受宋帝降太宗使勗就軍中徃勞之宗翰等問其所欲曰惟好書耳載數車而還女直初無文字及破遼獲契丹漢人始通契丹漢字於是諸子皆學之宗雄能以兩月盡通契丹大小字而完顔希尹乃依倣契丹字製女直字女直既未有文字亦未嘗有記録故祖宗事皆不載宗翰好訪問女直老人多得祖宗遺事太宗初即位復進士舉而韓昉輩皆在朝廷文學之士稍㧞擢用之天㑹六年詔書求訪祖宗遺事以備國史命勗與耶律迪延掌之勗等採摭遺言舊事自始祖以下十帝總為三卷凡部族既曰某部復曰某水之某又曰某鄉某村以别識之凡與契丹徃來及征伐諸部其間詐謀詭計一無所隱事有詳有畧咸得其實自太祖與高麗議和凡女直入高麗者皆索之至十餘年索之不已勗上書諫曰臣聞德莫大於樂天仁莫先於惠下所索戸口皆前世姦宄叛亡烏春烏木罕阿哈阿克蘇木之裔先世綏懐四境尚未賓服自先君與高麗通聞我將大因謂本自同出稍稍款附高麗既不聽許遂生邉釁因致交兵久方連和葢三十年當時壯者今皆物故子孫安於土俗婚姻膠固徵索不已彼固不敢稽留骨肉乖離誠非衆願人情怨甚可愍者而必欲求為已有特彼我之蔽非一視同仁之大也國家民物繁夥幅員萬里不知得此果何益耶今索之不還我以強兵勁卒取之無難然兵凶器戰危事不得已而後用高麗稱藩職貢不闕國且臣屬民亦非外聖人行義不責小過理之所在不俟終日臣愚以為宜施惠下之仁𢎞樂夫之德聽免徵索則彼不謂已有如自我得之矣從之十五年為尚書左丞加鎮東軍節度使同中書門下平章事預平宗磐之難賜與甚多加儀同三司以皇叔祖字冠其銜勗皆力辭不受皇統元年撰定熈宗尊號冊文上召勗飲於便殿以玉帶賜之所撰祖宗實録成凡三卷進入上焚香立受之賞賚有差制詔左丞勗平章政事奕職俸外别給二品親王俸傔舊制皇兄弟皇子為親王給二品俸宗室封一字王者給三品俸勗等别給親王俸皆異數也宴羣臣於五雲樓勗進酒稱謝帝起立宰臣進曰至尊為臣下屢起於禮未安上曰朕屈已待臣下亦何害是日上及羣臣盡歡俄同監修國史進拜平章政事光懿皇后忌辰熙宗將出獵勗諫而止熙宗獵於海島三日之間親射五虎獲之勗獻東狩射虎賦上悅賜以佩刀玉帶良馬能以契丹字為詩文凡游宴有可言者輒作詩以見意時上日與近臣酣飲或繼以夜莫能諫之勗上疏諫乃為止酒進拜左丞相兼侍中監修如故八年奏上太祖實録二十卷賜黄金八十兩銀百兩重綵五十端絹百匹通犀玉鈎帶各一出領行臺尚書省事召拜太保領三省領行臺如故封魯國王勗剛正寡言海陵方用事朝臣多附之者一日大臣㑹議海陵後至朂面責之曰吾年五十餘猶不敢後爾少年強健乃敢如此海陵跪謝九年進拜太師進封漢國王海陵簒立加恩大臣以收人望封秦漢國王領三省監修如故乃宗本無罪誅朂髭鬢頓白因上表請老海陵不許賜以玉帶優詔諭之有大事令宰臣就第商議入朝不拜勗遂稱疾篤不言表請愈切海陵不懌從之以本官致仕進封周宋國王正隆元年與宗室俱遷中都二年例降封金源郡王薨年五十九撰定女直郡望姓氏譜及他文甚衆大定二十年詔曰太師朂諫表詩文甚有典則朕自即位所未嘗見其諫表可入實録其射虎賦詩文等篇什可鏤板行之子宗秀宗秀字實甫本名鍚里庫渉獵經史通契丹大小字善騎射與平宗磐宗雋之亂授定遠大將軍以宗磐世襲明安授之宗弼復取河南宗秀與海陵俱赴軍前任使宋將岳飛軍於亳宿之間宗秀率歩騎三千扼其衝要遂與諸軍迎擊敗之師還為太原尹改博索路統軍使不受高麗遣使以土産獻却之入為刑部尚書改御史中丞授翰林學士天德初轉承㫖封宿國公賜玉帶歴平陽尹昭義軍節度使封廣平郡王正隆二年卒官年四十二是歲例降二品以上封爵改贈金紫光禄大夫康宗敬僖皇后生楚王摩囉歡次室温都氏生昭武大將軍騰格徹次室布薩氏坐事早死生龍虎衛上將軍威赫威赫亦作隈喝羙髯鬚勇健有才畧從太祖伐遼取寧江州戰珠赫店天眷二年授驃騎上將軍除德爾伯森乣詳袞遷忠順軍節度使興平軍節度使天德二年入為大宗正丞四年拜昭德軍節度使以兄摩囉歡子和勒端哈濟穆昆餘戸授威赫上京路哲爾袞明安所屬世襲穆昆改德昌軍節度使封廣平郡王正隆二年例奪王爵改哈斯罕節度使再改忠順軍節度使大定元年封宋國公為勸農使卒官年六十五始祖兄弟三人博和哩之後實圖羙都古嚕訥别有傳呼實黙者哈斯罕人也父托卜嘉事遼為太尉呼實黙善漢語通契丹大小字勇而善戰高永昌據東京招哈斯罕人衆畏高永昌兵彊且欲歸之呼實黙不肯從召其族人謀曰吾遠祖兄弟三人同出高麗今大聖皇帝之祖入女直吾祖留高麗自高麗歸於遼吾與皇帝皆三祖之後皇帝受命即大位遼之敗亡有徵吾豈能為永昌之臣哉始祖兄阿庫納留高麗中呼實黙自言如此葢自謂阿庫納之後云於是率其族屬部衆詣薩哈烏珍降營於托輝山之下永昌攻之呼實黙力戰不能敵奔於薩哈及攻開州呼實黙以糧餉給軍後攻保州遼將以舟師遯呼實黙邀擊敗之降其士卒賞賜甚厚以為哈斯罕七部貝勒給銀牌一木牌三天輔二年卒贈監門衛上將軍再贈驃騎衛上將軍子果實嘗從攻顯州領四穆昆軍破魚梁務功最以其父所管十部為哈斯罕達貝勒有和卓者亦稱始祖兄苖裔但不知與呼實黙相去幾從耳和卓哈斯罕必勒哈水人也仕遼領辰復二州漢人渤海子富色克襲父職再遷静江中正軍節度使佩金牌為哈斯罕女直部長子額哩頁與呼實黙同時歸朝屢以糧餉助伐高永昌及高麗新羅後從宗望伐宋以功遷眞定府路安撫使兼曹州防禦使佩金牌授必勒哈水世襲明安長子布呼識女直契丹漢字善騎射年十八宗弼選為章京從阿里富埒琿追宋康王於明州睿宗聞其才召置麾下從經畧山東河北陜西襲其父明安授昭勇大將軍海陵伐宋以本明安兵從半道與南征萬戸完顔福壽等俱亡歸謁世宗於遼陽世宗即位除同知哈斯罕節度使事刑部侍郎色克為都統布呼副之坐擅署置官吏私用官中財物削兩階解職未浹旬世宗獻享山陵兵部尚書克實昭毅大將軍鄂倫中都同知完顔璋等謀反欲因上謁山陵舉事鄂倫與布呼親舊與之謀議事具克實傳既知事不可成乃與克實璋執鄂倫等上變克實不肯以始謀盡首遂并誅之而賞布呼璋除布呼濬州防禦使累遷順天軍節度使致仕卒年六十七昭祖族人果布者從昭祖耀武於青嶺白山還至古哩甸昭祖得疾寢於村舎洞無門扉乃以車輪當門為蔽果布卧輪下為扞禦已而賊至刃交於輪輻間果布洞腹見膏恐昭祖知之乃然薪取膏以為炙問之以他肉對昭祖心知之遂中夜啟行衷本名綽哈中都司屬司人世祖曾孫祖巴噶布琳封鄆王父烏里官至特進大定中收充閤門祇侯授代州宣銳軍都指揮使歲旱州委禱雨於五臺靈潭歩致其水雨隨下人為刻石紀之四遷引進使兼典客署令改尚輦局使扈從北幸賜廐馬二以旌其勤尋為夏國王李仁孝封冊使歴寧海蠡州刺史入為大睦親府丞除順義軍節度使陛辭賜金幣特寵異之移鎮鎮西泰和六年致仕卒衷孝悌貞謹深悉本朝婚禮皇族婚嫁每令𠂻相之治復有能稱其在寧海蠡州平賦役無擾民立石頌遺愛大安初追贈輔國上將軍齊本名素赫穆宗曾孫父哈布爾寧州刺史大定中以族改充司屬司將軍授同知復州軍州事累遷刑部員外郎上諭曰本朝以來未嘗有内族為六部郎官者以卿歴職亷能故授之先是復州哈斯罕關地方七百餘里因圍獵禁民樵捕齊言其地肥衍令賦民開種則公私有益上然之為弛禁即牧民以居田收甚利因名其地曰哈斯罕明安章宗立改戸部員外郎出為磁州刺史治以寛簡未嘗留獄屬邑武安有道士視觀宇不謹吏民為請鄰郡王師者代主之道士忿奪其利告王私置禁銅器法當徒縣令惡其為人反坐之具獄上齊審其誣又以王有德不忍坐之問同寮無以對齊曰道士同請即同居也當准首俱釋其罪其寛明大體皆此類也磁名郡刺史皆朝廷遴選郡人以前政有聲如劉徽柔程輝高德裕皆不及也河北提刑司以治狀聞明昌三年始議置諸王傅頗難其選乃以齊傅兗王王將至任郡明安迎接齊峻却之王怪問故曰三國藩輔明安皆總戎職於王何利焉却之以遠嫌也王悅服王府家奴為不法輒𤼵還本明安終更無敢犯者明年授山東東西路副統軍兼同知益都府事有惠愛郡人為之立碑轉彰化軍節度使六年移利渉軍召見勞慰有加詔留守上京承安二年致仕卒齊明法識治體所至有聲内族中與丞相承暉並稱云珠嚕宗室子從鄭王烏色敗高麗於海蘭取雅魯城克寧江州收黄龍府珠赫店之役達嚕噶城之役呼岱巴岡之役皆力戰有功東京降為本路招安副使敗遼兵破通古營蘇州漢民叛走珠嚕追復之以功為穆昆天輔四年卒年四十一皇統中贈鎮國上將軍呼實哈宗室子也從太祖攻寕江敗遼兵於達嚕噶城破遼主親兵皆有功遼軍來援濟州呼實哈與其兄實古納以兵迎擊敗之還攻濟州中流矢戰益力克其城軍中稱其勇從攻春泰州降之并降境内諸部族其不降者皆攻㧞之遼主西走呼實哈追至中京獲其宫人輜重凡八百有有薩納噶者復以本部叛去呼實哈以兵五百追及之獲其親屬部人以還德州復叛呼實哈以兵五千克其城從羅索擊敗敵兵二萬於歸化之南并降歸化從取居庸關并燕之屬縣及其山谷諸屯伊實部既降復叛去呼實哈引兵追及戰敗之俘獲甚衆澤州諸部有逃者皆追復之又敗叛人於臨潢誅其酋領而安撫其人民天眷二年遷永定軍節度使改武定軍徙汴京留守天德三年授世襲明安卒年六十八宗賢本名阿嚕太祖伐遼從攻寧江州臨潢府太宗監國選侍左右甚見親信臨潢復叛從宗望復取之為内庫都提㸃再遷歸德軍節度使政寛簡境内大治秩滿士民數百千人相率詣朝廷請留及改武定軍百姓扶老携幼送數十里悲號而去改永定軍秉德亷訪官吏士民持盆水與鏡前拜言曰使君亷明清直類此民實頼之秉德曰吾聞郡僚亷能如一汝等以為何如衆對曰公勤清儉皆法則於使君耳因謂宗賢曰人謂君善治當在甲乙果然賢使君也用是超遷兩階天德初授世襲穆昆馳驛召之雄州父老相率張青繩懸明鏡於公署老幼填門三日乃得去封定國公再除忠順軍節度使賜以玉帶捕盗司執數人至府宗賢問曰罪狀明白否對曰獄具矣宗賢閲其案謂僚佐曰吾察此輩必冤不數日賊果得人服其明改海蘭路兵馬都總管歴廣寧尹封廣平郡王改崇義軍節度使兼領北京宗室事正隆例奪王爵加金紫光禄大夫改臨海軍大定初遣使召之宗賢率諸宗室見於遼陽除同簽大宗正事封景國公致仕起為博索路兵馬都總管復致仕卒特進逹蘭宗室子年十六事太祖未嘗去左右珠赫店之役太祖欲親戰達蘭控其馬而止之曰主君何為輕敵臣請效力即挺槍前手殺七人已而槍折騎士曵而下者九人太祖壯之曰誠得此輩數十雖萬衆不能當也及戰於達嚕噶城遼兵一千陣於營外太祖遣達蘭徃擊之達蘭衝出敵陣大敗其衆攻臨潢府春泰州中西二京皆有功天輔六年授穆昆天㑹四年從伐宋屢以功受賞明年再舉至汴宗望聞宋人㑹諸路援兵於睢陽遣達蘭與阿里庫將兵二千徃拒之敗其前鋒軍三萬於杞縣又破三寨擒宋京東路都總管胡直孺南路都統制隋師元及其三將并直孺二子遂取拱州降寧陵復破二萬於睢陽進取亳州聞宋兵十萬且至㑹宗望益兵四千合擊大敗之其卒二千陣而立馳之不動即麾軍去馬擊之盡殪擒其將石瑱而還帥府嘉其功賞賚優渥睿宗駐兵熈州分遣諸將畧地達蘭以軍五百入六盤山十六寨降其官八十餘民戸四千獲馬二千匹皇統中累加銀青光禄大夫天德初加特進授世襲明安卒年六十五海陵遷諸陵於大房山以達蘭嘗給事太祖命作石像置睿陵前卞本名鄂摩上京司屬司人大定二年收充䕶衞積勞授彰化軍節度副使入為都水監丞累遷中都西京路提刑使徙知歸德府河平軍節度使王汝嘉奏卞前在都水監導河有勞除北京留守俄改知大興府事時有言尚書左丞𤓰爾佳衡在軍不法詔刑部問狀事下大興府卞輒令追攝上以為失禮杖四十久之乞致仕不許拜御史大夫先是左司諫持嘉克們上言御史大夫久闕憲紀不振宜選剛正疾惡之人肅清庻務上由是用卞前時孫鐸賈鉉俱為尚書鉉拜參知政事而鐸再任對賀客誦唐張在詩有鬱鬱意卞劾奏之鐸坐降黜既而復申前請遂以金吾衛上將軍致仕薨􅰇本名額哩埒隸上京司屬司大定十年以皇家近親收充東宫䕶衞轉十人長授御院通進從世宗幸上京㑹皇太子守國薨世宗以􅰇親密可委特命與滕王府長史臺馳驛徃䕶喪時章宗為金源郡王亦留中都且命􅰇等保䕶諭之曰郡王遭此家難哀哭當以禮節之飲食尤當謹視世宗還都遷符寳郎除吏部郎中章宗即位坐與御史大夫唐古貢為壽犯夜禁奪官一階罷明昌元年起為同知棣州防禦使事上書歴詆宰執帝以小臣敢譏訕宰輔杖八十削一官罷之發還本明安明年降授同知宣德州事召授武衞軍副都指揮使四遷知大興府事轉左右宣徽使承安二年拜尚書右丞出為泰定軍節度使移知濟南府卒奕本名三寳隸瑪展賽音司屬司大定七年以近親充東宫䕶衞十人長轉為尚廐局使章宗即位遷左衞副將軍累遷右副都㸃檢兼提㸃尚廐局使諭㫖曰汝非有過人才第以久次遷授當謹乃職勿復有非違事使朕聞之未幾坐廐馬瘦决三十承安二年改左司都㸃檢兼職如舊俄授同簽大睦親府事卒奕為人貪鄙數以贓敗帝愛其能治圍塲故進而委信之愛實宗室子好學問襲父北京路筈栢山明安聽訟明决人信而愛之察亷能除彰國軍節度副使改上京留守判官提刑司奏彰國軍治狀遷同知率賓路節度事改歸徳軍歴海邳二州刺史皆兼總押軍馬宋統領劉文謙以兵攻宿遷愛實迎擊破之復破戚春夏興國舟兵萬餘人斬夏興國于陣遷鎮國上將軍再賜銀幣為元帥左監軍赫舍哩執中前鋒渡淮破寳應天長二縣師還遷同知歸徳府事改泗州防禦使丁母憂起復大安二年改華州防禦使遷鎮南軍節度使貞祐二年改知大名府充馬軍都提控歴横海安化軍節度使充宣差山東路左翼都提控尋知濟南府事徙沁南軍節度使遷河南統軍使兼武昌軍節度使卒贊曰金諸宗室自始祖至康宗凡八世獻祖徙居海古勒水額訥格爾村再徙按春水世祖稱海古勒兄弟盖指其所居也完顔十二部皆以部為氏宣宗詔宗室皆書姓氏然亦有部人以部為氏非宗室同姓者遂不可辨矣金史卷六十六
