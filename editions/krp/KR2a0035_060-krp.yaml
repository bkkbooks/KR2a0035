body:
  text: 金史卷六十元中書右丞相總裁托克托等修表第二交聘表上天下之勢曷有常哉金人日尋干戈撫制諸邦保其疆圉以求逞志於遼也豈一日哉及太祖再乗勝已即帝位遼乃招之使降是猶龍蒸虎變欲誰何而止之厥後使者八九徃反終不能定約束何者取天下者不徇小節成算既定矣終不為卑辭厚禮而輟攻遼人過計宋人亦過計海上之書曰克遼之後五代時䧟入契丹漢地願畀下邑此何計之過也血刃相向百戰而得之卑辭厚幣以求之難得而易與人豈人之情哉宋之失計有三撤三關故塞不能固燕山塞汴京城下之盟竭公私之帑以約質立梁楚而不力戰而江左稱臣金人豈愛宋人而為和哉䇿既失矣名既屈矣假使髙宗立歸徳不得河北可保河南山東不然亦不失為晉元帝其孰能亡之金不能奄有四海而宋人以尊稱與之是誰强之耶金人出于高麗始通好為敵國後稱臣夏國始稱臣末年為兄弟於其國自為帝宋於金初或以臣禮稱表終以姪禮徃復稱書故識其通好與間有兵爭之歲其盛衰大指可觀也已使者或書本階或用借授兩國各因舊史不必强同云金史卷六十
  hash: sha256:c71ca4d97e977aeb77a209e4f9d40e675bb0d2a058dc72597313088bf17e75a6
