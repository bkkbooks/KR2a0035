body:
  text: 金史卷一百三十一元中書右丞相總裁托克托等修列傳第六十九宦者梁珫宋珪本名乞奴潘守恒附古之宦者皆出於刑人刑餘不可列於士庶故掌宫寺之事謂之婦寺焉東漢以來宦者養子以繼世唐世繼者皆為閹人其初進也性多巧慧便辟善固恩寵及其得志黨比糾結不可制東漢以宦者亡唐又甚焉世儒論宦者之害如毒藥猛虎之不可拯也金法置近侍局嘗與政事而宦者少與焉惟海陵時有梁珫章宗時有梁道李新喜干政二君為所誤多矣世傳梁道勸章宗納李妃後宫金史不載梁道始末弗得而論次之惟宋珪潘守恒頗能諷詩宣哀時有裨益蓋傭之佼佼鐵之錚錚者也作宦者傳梁珫本大㚖家奴隨元妃入宫以閹豎事海陵珫性便佞善迎合特見寵信舊制宦者惟掌掖庭宫闈之事天徳三年始以王光道為内藏庫使衛愈梁安仁皆以宦官領内藏海陵謂光道等曰人言宦者不可用朕以為不然後唐莊宗委張承業以軍竟立大功此中豈無人乎卿等宜悉此意帑藏之物皆出民力費十致一當糾察姦弊犯者必罰無赦宦者始與政事而珫委任尤甚累官近侍局使及營建南京宫室海陵數數使珫往視工役是時一殿之費已不可勝計珫或言其未善即盡撤去雖丞相張浩亦曲意事之與之均禮海陵欲伐宋珫因極言宋劉貴妃絶色傾國海陵大喜及南征將行命縣君髙實古爾貯衾褥之新潔者俟得劉貴妃用之議者言珫與宋通謀勸帝伐宋徴天下兵以疲敝中國海陵至和州聞珫與宋人交通有狀謂珫曰聞汝與宋國交通傳泄事情汝本奴隷朕拔擢至此乃敢爾耶若至江南詢得實跡殺汝亦未晩也又謂校書郎田與信曰爾面目亦可疑必與珫同謀者皆命執於軍中海陵遇弑珫與信皆為亂軍所殺宋珪本名乞奴燕人也為内侍殿頭宣宗嘗以元夕欲觀燈戲命乞奴監作乞奴誶語云社稷棄之中都南京作燈戲有何看耶宣宗微聞之杖之二十既而悔之有㫖宣諭哀宗放鷂後苑鷂逸去勑近侍追訪之市中一農民臂此鷂近侍不敢言宫中所逸者百方索之農民不與與之物直僅乃得事聞哀宗欲送其人於有司乞奴從旁諫曰貴畜賤人豈可宣示四方哀宗惡其太訐又杖之尋亦悔賜物慰遣之及哀宗至歸徳馬軍元帥富察官努為變殺左丞李蹊參政實嘉紐勒歡以下從官三百餘人倉皇之際哀宗不得已以官努權參知政事既為所制含恨欲誅之未能也及官努往亳州珪與奉御烏克遜愛實納喇奇塔特䕶衛鈕祜祿温綽范察遜王善爾等謀誅之官努自亳還哀宗御臨漪亭詔參政張天綱及官努議事官努入見珪等即從旁殺之及其黨阿里哈博濟錫馨及蔡城破哀宗自縊於幽蘭軒珪與完顔色埒黙焦春和等皆從死有潘守恒者亦内侍素稱知書南遷後規益甚多及哀宗自蒲城走歸徳道次民家守恒進櫛曰願陛下還宫之日無忘此草廬中更加儉素以濟大業上聞其言悽惋咨嗟久之方伎劉完素張從正李慶嗣紀天錫張元素馬貴中武禎子亢李懋胡徳新太史公序九流述日者龜策扁鵲倉公列傳劉歆校中秘書以術數方伎載之七畧後世史官作方伎傳蓋祖其意焉或曰素問内經言天道消長氣運贏縮假醫術託岐黄以傳其秘奥爾秦人至以周易列之卜筮斯豈易言哉第古之為術以吉凶導人而為善後世術者或以休咎導人為不善古之為醫以活人為功後世醫者或因以為利而誤殺人故為政於天下雖方伎之事亦必慎其所職掌而務旌别其賢否焉金世如武禎武亢之信而不誣劉完素張元素之治療通變學其術者皆師尊之不可不記云劉完素字守真河間人嘗遇異人陳先生以酒飲守真大醉及寤洞達醫術若有授之者乃撰運氣要㫖論精要宣明論慮庸醫或出妄說又著素問𤣥機原病式特舉二百八十八字注二萬餘言然好用涼劑以降心火益腎水為主自號通元處士云張從正字子和睢州考城人精於醫貫穿難素之學其法宗劉守真用藥多寒涼然起疾救死多取效古醫書有汗下吐法亦有不當汗者汗之則死不當下者下之則死不當吐者吐之則死各有經絡脉理世傳黄帝岐伯所為書也從正用之最精號張子和汗下吐法妄庸淺術習其方劑不知察脉原病往往殺人此庸醫所以失其傳之過也其所著有六門二法之目存於世云李慶嗣洛人少舉進士不第棄而學醫讀素問諸書洞曉其義天徳間嵗大疫廣平尤甚貧者往往闔門臥病慶嗣携藥與米分遺之全活者衆慶嗣年八十餘無病而終所著傷寒纂類四卷改證活人書二卷傷寒論三卷針經一卷傳於世紀天錫字齊卿泰安人早棄進士業學醫精於其技遂以醫名世集註難經五卷大定十五年上其書授醫學博士張元素字潔古易州人八嵗試童子舉二十七試經義進士犯廟諱下第乃去學醫無所知名夜夢有人用大斧長鑿鑿心開竅納書數卷於其中自是洞徹其術河間劉完素病傷寒八日頭痛脉𦂳嘔逆不食不知所為元素往候完素面壁不顧元素曰何見待之卑如此哉既為診脉謂之曰脉病云云曰然初服某藥用某味乎曰然元素曰子誤矣某味性寒下降走太陰陽亡汗不能出今脉如此當服某藥則效矣完素大服如其言遂愈元素自此顯名元素治病不用古方其説曰運氣不齊古今異軌古方新病不相能也自為家法云馬貴中天徳中為司天提㸃與校書郎髙守元奏天象災異忤㫖海陵皆杖之黜貴中為大同府判官久之遷司天監正隆三年三月辛酉朔日當食是日候之不食海陵謂貴中曰自今凡遇日食皆靣奏不湏頒示内外海陵伐宋問曰朕欲自将伐宋天道何如貴中對曰去年十月甲戌熒感順入太㣲至屏星留退西出占書熒惑常以十月入太㣲庭受制出伺無道之國十二月太白晝見經天占為兵喪為不臣為更主又主有兵兵罷無兵兵起鎮戎軍地震大風海陵以問貴中對曰伏隂逼陽所以震也又問曰當震大風何也對曰土失其性則地震風為號令人君命令嚴急則有烈風及物之災六年二月甲辰朔日有暈珥戴背海陵問近日天道何如貴中對曰前年八月二十九日太白入太㣲右掖門九月二日至端門九日至左掖門出並厯左右執法太㣲為天子南宫太白兵将之象其占兵入天子之廷海陵曰今将征伐而兵将出入太㣲正其事也貴中又曰當端門而出其占為受制厯左右執法為受事此當有出使者或為兵或為賊海陵曰兵興之際小盗固不能無也及被害于揚州貴中之言皆騐大定八年世宗擊毬於常武殿貴中上疏諫曰陛下為天下主守宗廟社稷之重圍獵擊毬皆危事也前日皇太子墜馬可以為戒臣願一切罷之上曰祖宗以武定天下豈以承平遽忘之耶皇統甞罷此事當時之人皆以為非朕所親見故示天下以習武爾十年十一月皇太子生日世宗宴百官于東宫上飲歡甚貴中被酒前跪欲言事錯亂失次上不之罪但令扶出武禎宿州臨渙人祖官太史靖康後業農後畫界屬金禎深數學貞祐間行樞宻院布薩安貞聞其名召至徐州以上客禮之毎出師必咨焉其占如響正大初徴至汴京待詔東華門其友王鉉問禎曰朝廷若問國祚脩短子何以對禎曰當以實告之但更言周過其厯秦不及期亦在修徳爾時久旱祈禱不應朝廷為憂禎忽謂鉉曰足下今日早歸恐為雨阻鉉曰萬里無雲赤日如此安得有雨禎笑日若是則天不誠也天何甞不誠既而東南有雲氣須㬰蔽天平地雨注二尺衆皆驚嘆尋除司天臺管勾子亢寡言笑不妄交甞與一學生終日相對握籌布畫目炯炯若有所營見者莫測也哀宗至蔡州右丞完顏仲徳薦其術召至屏人與語大説除司天長行賞賚甚厚上書曰比者有星變于周楚之分彗星起于大角西掃軫之左軸蓋除舊布新之象又言鄭楚周三分野當赤地千里兵㓙大起王者不可居也又曰蔡城有兵䘮之兆楚有亡國之徴三軍苦戰於西垣前後有日矣城壁傾頺内無見糧外無應兵君臣數盡之年也聞者悚然奪氣哀宗惟嗟嘆良久不以為罪性頗倨傲朝士以此非之天興二年九月蔡州被圍亢奏曰十二月三日必攻城及期果然哀宗問曰解圍當在何日對曰明年正月十三日城下無一人一騎矣帝不知其由乃喜圍觧有期日但宻計糧草使可給至其日不闕者明年甲午正月十日蔡州破十三日大元兵退是日亢赴水死云李懋不知何許人有異術正大間㳺京兆行省完顔哈達愛其術與俱至汴京薦於哀宗遣近侍宻問國運否泰言無忌避居之繁臺寺朝士日走問之懋能道隐事及吉㓙之變人以為神帝惡其言太洩遣使者殺之使者乃持酒殽入寺懋出迎笑曰是矣使者曰是何謂也懋曰我數當盡今日尚復何言遂索酒痛飲就死胡徳新河北士族也寓居南陽往来宛葉間嗜酒落魄不覊言禍福有奇驗正大七年夏與燕人王鉉邂逅于葉縣村落中與鉉初不相識坐中謬以兵官對胡曰此公在吾法中當登科甲何以謂之兵官衆愕然遂以實告二人相得甚歡即命家人具雞酒以待酒酣舉大白相屬曰君此去事業甚逺不必置問某有所見久不敢對人言今欲告子遂邀至野田宻謂曰某自去年来行宛葉道中見往来者十且八九有死氣今春至陳許間見其人亦有大半當死者若吾目可用則時事可知矣鉉驚問應驗遲速曰不過嵗月間爾某亦不逃此厄請宻誌之明年大元兵由金房入取峭石灘渡漢所過廬舎蕭然胡亦舉家及難其精驗如此金史卷一百三十一
