body:
  text: 金史卷七十六元中書右丞相總裁托克托等修列傳第十四太宗諸子宗磐本名富勒呼宗固本名呼嚕宗本本名阿嚕蕭玉附杲本名舍音宗義本名博濟宗幹本名幹布充本名實圖美子塔納等永元本名元努兖本名梧桐襄本名永慶衮本名富勒堅太宗子十四人富勒呼呼嚕呼拉布阿嚕岱阿里布呼沙呼阿林阿嚕呼蘭和爾察實圖美哈必蘇沃哩和碩宗盤本名富勒呼天輔五年都統杲取中京宗盤與幹魯宗翰宗幹皆爲之副天㑹十年爲古倫烏赫哩貝勒熙宗即位爲尚書令封宋國王未幾拜太師與宗幹宗翰並領三省事熙宗優禮宗室宗翰没後宗盤日益䟦扈嘗與宗幹争論於上前即上表求退烏頁奏曰陛下富於春秋而大臣不協恐非國家之福熙宗因爲兩解宗盤愈驕恣其後於熙宗前持刀向宗幹都㸃檢蕭仲恭呵止之既而左副元帥逹蘭東京留守宗雋入朝宗磐隂相黨與而宗雋遂為右丞相用事逹蘭屬尊功多先薦劉豫立為齊帝至是復倡儀以河南陜西地與宋使稱臣熈宗命羣臣議宗室大臣皆言其不可獨宗磐宗雋助之卒以與宋其後宗磐宗雋逹蘭謀作亂宗幹希尹發其事熈宗下詔誅之坐與宴飲者皆貶削决責有差赦其弟呼拉布等九人并赦逹蘭出為行䑓左丞相皇后生日宰相諸王妃主命婦入賀熈宗命去樂曰宗磐等皆近屬輙搆逆謀情不能樂也以黄金合及兩銀鼎獻明徳宫太皇太后并以金合銀鼎賜宗幹希尹焉宗固本名呼嚕天㑹十五年為燕京留守封豳王宗雅本名呼拉布封代王宗偉本名阿里布封虞王宗英本名呼沙呼封滕王宗懿本名阿林封薛王宗本本名阿嚕封原王呼蘭封翼王宗美本名呼爾察封豐王實圖美封鄆王哈必蘓封霍王沃哩封蔡王宗哲本名和碩封畢王皆天眷元年受封宗順本名阿嚕岱天㑹二年薨皇統五年贈金紫光禄大夫後封徐王宗磐既誅熈宗使宗固子京往燕京慰諭宗固既而翼王呼蘭復與行䑓左丞相逹蘭等謀反伏誅因降封太宗諸子且下詔曰燕京留守豳王宗固等或謂當絶屬籍朕所不忍宗固等但不得稱皇叔其母妻封號從而降者審依舊典皇統二年復封宗雅為代王宗固為判大宗正三年為太保右丞相兼中書令是嵗薨海陵在熈宗時見太宗諸子勢强而宗磐尤䟦扈與呼蘭相繼皆以逆誅心忌之熈宗厚於宗室禮遇不衰海陵嘗與秉徳唐古辯私議主上不冝寵遇太宗諸子太甚及簒立謁奠太廟韓王亨素號材武使攝右將軍密諭之曰爾勿以此職為輕朕疑太宗諸子太强得卿衛左右可無慮耳遂與秘書監蕭裕謀去宗本兄弟太宗子孫於是焉盡語在宗本傳中宗本本名阿嚕皇統九年為右丞相兼中書令進太保領三省事海陵簒立進太傅領三省事初宗幹謀誅宗磐故海陵心忌太宗諸子熈宗時海陵私議宗本等勢强主上不宜優寵太甚及簒立猜忌益深遂與秘書監蕭裕謀殺太宗諸子誣以秉徳出領行䑓與宗本别因㑹飲約内外相應使尚書省令史蕭玉告宗本親謂玉言以汝於我故舊必無他意可布心腹事領省臨行言彼在外諭説軍民無以外患為慮若太傅為内應何事不成又云長子錫里庫當大貴因是不令見主上宗本又言左丞相於我及我妃處稱主上近日見之輙不喜故心常恐懼若太傅一日得大位此心方安唐古辯謂宗本言内侍張彦善相相太傅有天子分宗本答曰宗本有兄東京留守在宗本何能為是時宗美言太傅正是太宗主家子祗太傅便合為北京留守卞臨行與宗本言事不可遲宗本與玉言大計只於日近圍塲内予決宗本因以馬一匹袍一領與玉充表識物玉恐圍塲日近身縻於外不能親奏遂以告秘書監蕭裕裕具以聞蕭玉出入宗本家親信如家人海陵既與蕭裕謀殺宗本秉徳詔天下恐天下以宗本秉徳輩皆懿親大臣本無反狀裕搆成其事而蕭玉與宗本厚人所共知使玉上變庻可示信於是使人召宗本等擊鞠海陵先登樓命左衛將軍圖克坦塔斯蕭裕妺婿近侍局副使耶律必埒哩小底密伺宗本及判大宗正事宗美至即殺之宗美本名和爾察臨死神色不變宗本已死蕭裕使人召蕭玉是日玉送客出城醉酒露髪披衣以車載至裕弟㸃檢蕭祚家逮日暮玉酒醒見軍士圍守之意為人所累得罪故至此以頭觸屋壁號咷曰臣未嘗犯罪老母年七十願哀憐之裕附耳告之曰主上以宗本諸人不可留已誅之矣欲加以反罪令汝主告其事今書汝告款已具上即問汝汝但言宗本輩反如狀勿復異詞恐禍及汝家也裕乃以巾服與玉引見海陵海陵問玉玉言宗本反具如裕所教海陵遣使殺東京留守宗懿北京留守卞及遷益都尹畢王宗哲平陽尹稟左宣徽使京等家屬分置别所止聴各以奴婢五人自隨既而使人要之於路并其子男無少長皆殺之而中京留守宗雅喜事佛世稱善大王海陵知其無能將存之以奉太宗後召至闕不數日竟殺之太宗子孫死者七十餘人太宗後遂絶卞本名克實禀本名呼爾哈京宗固子本名和色哩蕭玉既如蕭裕教對海陵海陵遂以宗本秉徳等罪詔天下以玉上變實之海陵使太府監完顔富魯籍宗本諸家戒之曰珠玉金帛入於官什器吾將分賜諸臣富魯以此不復拘籍什器往往為人持去富魯家童亦取其檀本屏風少監劉景前為監丞時太府監失火案牘盡焚毁數月方取諸司簿帳補之監吏坐是稽緩當得罪景為吏倒署年月太倉都監焦子忠與景有舊坐逋負乆不得調景為盡力出之乆之富魯與景就宫中相忿争富魯言景倒署年月及出焦子忠事御史劾奏景景黨誘富魯家奴發盜屏事富魯自陳於尚書省海陵使御史大夫趙資福大理少卿許竑雜治資福等奏富魯非自盜又嘗自首海陵素惡富魯與宗室游從謂宰臣曰富魯嘗用所盗物其自首不及此法盗宫中物者死諸物已籍入官與宫中物何異謂富魯曰太府掌宫中財賄汝當防製姦欺而自用盗物於是富魯棄市資福竑坐鞫獄不盡泱杖有差景亦伏受焦子忠賂金海陵曰受金事無左驗景倒署年月以免吏罪是不可恕遂殺之大定二年追封宗固魯王宗雅曹王宗順隋王宗懿鄭王宗美衞王宗哲韓王宗本潞王實圖美幽王哈必蘇瀋王沃哩鄂王呼爾哈和色哩克實並贈金吾衞上將軍惟宗磐阿里布呼沙呼呼蘭四人不復加封蕭玉奚人既從蕭裕誣宗本罪海陵喜甚自尚書省令史為禮部尚書加特進賜錢二千萬馬五百匹牛五百頭羊千口數月為參知政事丁母憂以參政起復俄授明安子尚公主海陵謂玉曰朕始得天下常患太宗諸子方强頼社稷之靈卿發其姦朕無以報此功使朕女為卿男婦代朕事卿也賜第一區分宗本家貲賜之頃之代張浩為尚書右丞拜平章政事進拜右丞相封陳國公文思署令閻拱與太子詹事張安妻坐姦事獄具不應訊而訊之海陵怒玉與左丞蔡松年右丞耶律安禮御史中丞馬諷决杖有差玉等入謝罪海陵曰為人臣以已意愛憎妄作威福使人畏之如唐魏徴狄仁傑姚崇宋璟豈肯立威使人畏哉楊國忠之徒乃立威使人畏耳顧謂左司郎中烏達右司郎中梁球曰往者徳宗為相蕭呼哩為左司郎中趙徳恭為右司郎中除吏議法多用已意汝等能不以已意愛憎為予奪輕重不亦善乎朕信任汝等有過則决責之亦非得已古者大臣有罪貶讁數千里外往來疲於奔走有死道路者朕則不然有過則杖之已杖則任之如初如有不可恕或處之死亦未可知汝等自勉正隆三年拜司徒判大宗正事五年玉以司徒兼御史大夫使參知政事李通諭㫖曰判宗正之職固重御史大夫尤難其人朕將行幸南京官吏多不法受賕卿宜専紏劾細務非所責也御史大夫與宰執不相逺朕至南京徐當思之繼以司徒判大興尹玉固辭司徒海陵曰朕將南廵京師地重非大臣不能鎮撫留卿居守無為多讓海陵至南京以玉為尚書左丞相進封呉國公海陵將伐宋因賜羣臣宴顧謂玉曰卿嘗讀書否對曰亦嘗觀之中宴海陵起即召玉至内閣因以漢書一册示玉既而擲之曰此非所問也朕欲與卿議事朕今欲伐江南卿以為如何玉對曰不可海陵曰朕視宋國猶掌握間耳何為不可玉曰天以長江限南北舟楫非我所長苻堅百萬伐晉不能以一騎渡以是知其不可海陵怒叱之使出及張浩因周福兒附奏海陵杖張浩并杖玉因謂羣臣曰浩大臣不面奏因人達語輕易如此玉以苻堅比朕朕欲斷其舌釘而磔之以玉有功隱忍至今大臣决責痛及爾體如在朕躬有不能已者汝等悉之及海陵自將發南京玉與張浩留治省事世宗即位降奉國上將軍放歸田里奪所賜家産久之起為孟州防禦使世宗戒之曰昔海陵欲殺太宗子孫借汝為證遂被進用朕思海陵肆虐先殺宗本諸人然後用汝質成其事豈得專罪汝等今復用汝當思改過若謂嘗居要地以今日為不足必罰無赦轉定海軍節度使改太原尹與少尹烏庫哩素赫互訟不公事各削其官解職尋卒子徳用大定二十四年尚書省奏玉子徳用當升除上曰海陵假口于玉以快其毒玉子豈可升除邪賛曰宗磐嘗從舍音取中京不可謂無勞伐者世禄鮮禮自古有之在國家善為保全之道耳熙宗殺宗磐而存恤其母后雖云矯情猶畏物論海陵造謀殺宗本兄弟不遺餘力太宗舉宋而有中原金百世不遷之廟也再傳而無噍類於是太祖之美意無復㡬微存者春秋之世宋公舍與夷而立其弟禍延數世害及五國誠足為後世監乎杲本名舎音世祖第五子太祖之母弟也收國元年太宗為安班貝勒杲為温貝勒天輔元年杲以兵一萬攻泰州下金山縣孟古皮室四部及渤海人皆來降遂克泰州城中積粟轉致烏哩雅賑先降諸部因徙之内地天輔五年為烏赫哩貝勒都統内外諸軍取中京實北京也普嘉努宗翰宗幹宗磐副之宗峻領哈濟明安皆受金牌耶律伊都為鄉導詔曰遼政不綱人神共棄今欲中外一統故命汝率大軍以行討伐爾其慎重兵事擇用善謀賞罰必行粮餉必繼勿擾降服勿縱俘掠見可而進無淹師期事有從權毋煩奏禀復詔白若克中京所得禮樂圗書文籍並先次津發赴闕當是時遼人守中京者聞知師期焚芻糧欲徙居民遯去奚王錫黙則欲視我兵少則迎戰若不敵則退保山西杲知遼人無鬪志乃委輜重以輕兵擊之六年正月克髙恩囘紇三城進至中京遼兵皆不戰而潰遂克中京獲馬一千二百牛五百駞一百七十羊四萬七千車三百五十兩乃分兵屯守要害之地駐兵中京使使奏捷獻俘詔曰汝等提兵于外克副所任攻下城邑撫安人民朕甚嘉之分遣將士招降山前諸部計已撫定山後若未可往即營田牧俟秋大舉更當熟議見可則行如欲益兵具數來上無恃一戰之勝輒自弛慢善撫存降附宣諭將士使知朕意完顔罕都游兵出中京南遇騎兵三十餘紿曰乞明旦來降于此杲信之使温特赫額埒春納哈塔通恩富察布壘誅嘉拜塔蘭往迎之奚王錫黙兵圍額埓春等遂據坂去馬殊死戰敗錫黙兵追殺至暮而還是役納哈塔通恩功為多宗翰降北安州希尹獲遼䕶衛實訥埒言遼主在鴛鴦濼畋獵可襲取之宗翰移書于杲請進兵使者再往曰一失機㑹事難圗矣杲意尚未决宗幹勸杲當從宗翰䇿杲乃約宗翰㑹奚王嶺既㑹始定議杲出青嶺宗翰出瓢嶺期羊城濼㑹軍時遼主在草濼使宗翰與宗幹率精兵六千襲之遼主西走其都統瑪格趨道蘭宗翰乃遣達蘭以兵一千追撃之達蘭請益兵于都統杲而獲遼樞密使徳勒岱父子西京已降復叛杲使招之不從遂攻之留守蕭察喇踰城降四月復取西京杲率大軍趨白水濼分遣諸將招撫未降州郡及諸部族於是遼秦晉國王耶律聶哷自立于燕京山西諸城雖降而人心未固杲遣宗望奏事仍請上臨軍耶律坦招西南招討司及所屬諸部西至夏境皆降耶律佛徳亦降于坦金肅西平二郡漢軍四千叛去坦與愛新鄂約托卜嘉簡料新降丁壯迨夜襲之詰旦戰于河上大敗其衆皆委仗就擒耶律聶哷移書于杲請和杲復書責以不先禀命上國輒稱大號若能自歸當以燕京留守處之聶哷得以書來其略曰昨即位時在兩國絶聘交兵之際奚王與文武百官同心推戴何暇請命今諸軍已集儻欲加兵未能束手待斃也昔我先世未嘗殘害大金人民寵以位號日益强大今忘此施欲絶我宗祀於義何如也儻䝉惠顧則感戴恩徳何有窮已杲復書曰閣下向為元帥總統諸軍任非不重竟無尺寸之功欲據一城以抗國兵不亦難乎所任用者前既不能死國今誰肯為閣下用者而云主辱臣死欲恃此以成功計亦䟱矣幕府奉詔歸者官之逆者討之若執迷不從期於殄滅而後己聶哷乃遣使請于太祖賜聶哷詔曰汝遼之近屬位居將相不能與國存亡乃竊據孤城僣稱大號若不降附將有後悔六月上發京師詔都統曰汝等欲朕親征已於今月朔旦啓行遼主今定何在何計可以取之其具以聞杲使馬和尚奉迎太祖于塔魯河斡魯羅索敗夏將李良輔杲使完顔希尹等奏㨗且請徙西南招討司諸部于内地希尹等見上于大濼西南上嘉賞之上至鴛鴦濼杲上謁上追遼主至古爾珍川南伐燕京次奉聖州詔曰自今諸訴訟書付都統杲决遣若有大疑即今聞奏太祖定燕京還次鴛鴦濼以宗翰為都統杲從上還京師太宗即位以杲為安班貝勒與宗幹俱治國政天㑹三年伐宋杲領都元師居京師宗翰宗望分道進兵四年再伐宋獲宋二主以歸天㑹八年薨皇統三年追封遼越國王天徳二年配享太祖廟庭正隆例封遼王大定十五年諡曰智烈子博濟宗義本名博濟舍音之第九子天徳間為平章政事海陵已殺太宗子孫尤忌舍音諸子盛强欲盡除宗室勲舊大臣是時左副元帥薩里罕在汴京與托卜嘉有隙托卜嘉女為海陵妃海陵隂使托卜嘉圖薩里罕於是都元帥府令史約索迎合風指詐為薩里軍與其子宗安家書宗安誤遺宫外約索因拾得之以上變其書契丹小字其封題已開其中白紙一幅有白字隱約狀若經水浸致字畫可讀者上有薩里罕手署及某王印書辭云阿格汝安樂否早晩到闕下前者走馬來時曽議論我教汝阿格平章穆里延阿格等處覷事勢再通往來緩急圗謀知汝已嘗備細言之穆里延阿格所言㬠是只殺托卜嘉則南路無憂慮矣詳略互見薩里罕傳中女真謂子阿格前阿格謂薩里罕子其子宗安後阿格平章指宗義宗義本宗室子猶有舊稱以是殺宗義穆里延并殺宗安及太祖妃蕭氏任王威赫及魏王威泰孫和稱察約索詐書無和爾察海陵見其坦率善脩餙惡之大臣以無罪為請海陵曰第殺之無復言也殺舍音子孫百餘人穆里延子孫二十餘人穆里延景祖孫們圖琿次子舍音有㓜子阿古爾其妻托卜嘉女海陵妃大氏女兄將殺阿古爾使者不忍見其面以衾覆而縊之當其頤乆不死及去被再縊之海陵遣使赦其死遂得免後封為王授世襲千户大定初追復宗義官爵贈特進弟富尼瑪博勒準阿嚕威赫並贈龍虎衛上將軍宗幹本名幹布太祖庻長子太祖伐遼遼人來禦遇于境上使宗幹率衆先徃填塹士卒畢渡渤海軍馳突而前左翼七穆昆少却遂犯中軍杲輙出戰太袓曰遇大敵不可易也使宗幹止杲宗幹馳出杲前控止導騎齋逹之馬杲乃還達嚕噶城之戰宗幹以中軍為疑兵太祖既攻下黄龍府即欲取春州遼主聞黄龍不守大懼即自將籍宗戚豪右少年與四方勇士及能言兵者皆𨽻軍中宗幹勸太祖毋攻春州休息士卒太祖以為然遂班師宗幹得降人言春泰州無守備可取於是舍音取春泰州宗雄宗幹等下金山縣宗雄即以兵三千屬宗幹招集未降諸部宗幹擇土人之材幹者以詔書諭之於是孟古皮室四部及渤海人皆降太祖克臨潢府至沃赫河宗幹諫曰地逺時暑士罷馬乏若深入敵境糧餫不繼恐有後艱上從之遂班師從都統杲取中京宗翰自北安州移書于杲是時希尹獲遼人知遼主在鴛鴦濼可襲取之杲不能決宗翰使再至宗幹謂杲曰伊拉齊貝勒灼見事機再使來請彼必不輕舉且彼已發兵不可中止請從其䇿再三言之杲乃報宗翰㑹奚王嶺當時無宗幹杲終無進兵意既㑹軍于羊城濼杲使宗幹與宗翰以精兵六千襲遼至五院司遼主已遯去與遼將耿守忠戰于西京城東四十里守忠敗走太宗即位以宗幹為古倫貝勒與舍音同輔政天㑹三年獲遼主于應州西伊都谷始議禮制度正官名定服色興庠序設選舉治厯明時皆自宗幹啟之四年官制行詔中外十年熙宗為安班貝勒宗幹為古倫左貝勒熙宗即位拜宗幹太傅與宗翰等並領三省事天眷二年進太師封梁宋國王入朝不拜䇿杖上殿仍以杖賜之宗幹有足疾詔設坐奏事無何監修國史皇統元年賜宗幹輦輿上殿制詔不名上幸燕京宗幹從有疾上親臨問自燕京還至野狐嶺宗幹疾亟不行上親臨問語及軍國事上悲泣不已明日上及后同往視后親與宗幹饋食至暮而還因赦罪囚與宗幹禳疾居數日薨上哭之慟輟朝七日大臣死輟朝自宗幹始上致祭是日庚戌太史奏戍亥不宜哭上不聽曰朕㓜沖時太師有保傅之力安得不哭哭之慟上生日不舉樂上還上京幸其第視殯事及喪至上京上臨哭之及葬臨視之海陵簒立追諡憲古𢎞道文昭武烈章孝睿明皇帝廟號徳宗以故第為興聖宫大定二年除去廟號改諡明肅皇帝及海陵廢為庶人二十二年皇太子允恭奏略曰追惟熙宗世嫡統緒海陵無道弑帝自立崇正昭穆削其煬王俾齒庶人之列瘞之閒矌不封不樹既己申大義而明至公矣海陵追崇其親逆配於廟今海陵既廢為庶人而明肅猶竊帝尊之名列廟祧之數海陵大逆正名定罪明肅亦當綠坐是時明肅已殂不與於亂臣以為當削去明肅帝號止從舊爵或從太祖諸王有功例加以官封明詔中外俾知大義書奏世宗嘉納下尚書省議於是追削明肅帝號封為皇伯太師遼王諡忠烈妻子諸孫皆從降明昌四年配享太祖廟庭子充亮兖襄衮亮是為海陵庶人充本名實圖美母李氏圖克坦氏撫為子熙宗初加光祿大夫天眷間為汴京留守皇統間封淄國公為吏部尚書進封代王遷同判大宗正事九年拜右丞相是歲薨追封鄭王大定二十二年追降儀同三司左丞相子塔納元努額布勒阿里布塔納為歸徳軍節度使阿里布定逺大將軍和囉噶圖明安和琳河穆昆海陵弑圖克坦氏以充嘗為圖克坦養子并殺塔納及阿里布元努額布勒逃歸世宗塔納贈榮祿大夫阿里布輔國上將軍詔有司改葬世宗時元努為宗正丞額布勒為鎮國上將軍後為同知濟南尹事永元字惇禮本名元努㓜聰敏日誦千言皇統元年試宗室子作詩永元中格善左氏春秋通其大義天徳初授博諾山世襲穆昆海陵伐宋已渡淮軍士多亡歸而契丹叛由是疑宗室益甚已殺永元弟塔納阿里布永元與弟額布勒逃匿得免世宗即位于遼陽與額布勒俱來歸上慰勞甚厚授宗正丞改符寳郎為灤州刺史授世襲明安乞以穆昆與額布勒詔許之轉棣州防禦使泰寧軍節度使張𢎞信通檢山東專以多得民間物力為功督責苛急永元靣責𢎞信曰朝廷以差調不均立通檢法今使者所至以殘酷妄加農民田産箠擊百姓有至死者市肆賈販貿易有贏虧田園屋宇利入有多寡故官子孫閉門自守使與商賈同處上役豈立法本意哉𢎞信無以對於是棣州賦税得以實自占遷震武軍節度使大定六年丁母憂起復崇義軍節度使徙順義軍朔州西境多盗而猾吏大姓蠧獄訟暋亂賦役永元剔其宿姦百姓安之坐賣馬與驛人取贏利及濬州防禦使鄂倫生縱孶畜踐民田俱解職頃之永元起為保大軍節度使厯昭義絳陽震武軍遷濟南尹北京副留守寧國家婢辰徳與咸平人海呼有姦辰徳於主印處紿取印署空紙與海呼遂寫作永元寧國生日時辰誣告永元寧國謀逆詔有司鞫問乃辰徳意望為良使海呼為之上曰海呼與辰徳有姦造作惡言誣害宗室海呼斬辰徳處死改興中尹為彰徳軍節度使卒官年五十一喪過中都遣使致祭膊銀三百兩綵十端絹百疋永元厯典大藩多知民間利害所至稱治相棣順義政迹尤著其民並為立祠兖本名桐桐皇統七年為左副㸃檢轉都㸃檢九年為㑹寧牧改左宣徽使海陵簒立兖使宋還拜司徒兼都元帥領三省事進拜太尉及殺太祖妃蕭氏盡以其財産賜兖罷都元帥府立樞密院兖為樞密使太尉領三省事如故天徳四年十二月晦薨明日貞元元年元旦海陵為兖輟朝不受賀宋夏高麗囘鶻賀正旦使命有司受其貢獻又進兖王爵大定二十二年追降特進兖妻烏雅氏正隆六年坐與奴為姦海陵殺之其弟南京兵馬副都指揮使實訥埒私于族弟烏瑪喇之妻烏瑪喇之奴謀欲執實訥埒實訥埒乃殺其奴海陵聞之遂殺實訥埒兖子阿哈大定中為符寳祗候俄遷同知定武軍節度使上曰汝歲秩未滿朕念乃祖乃父為汝遷官勿為不善當盡心學之襄本名永慶海陵母弟為輔國上將軍卒天徳二年追封衛王再贈司徒大定二十二年追降銀青光祿大夫子和尚封應國公賜名樂善左宣徽使許霖之子知彰與和尚鬬爭其母妃命家奴捽入淩辱之使人曵霖至第毆詈之明日霖訴于朝詔大興尹蕭玉左丞良弼權御史大夫張忠輔左司員外郎王全雜治妃杖一百殺其家奴為首者餘决杖有差霖嘗跪于妃前失大臣體及所訢有妄笞二十大定間家奴小僧月一妄言和尚熟寢之次有異徵襄妃松科以為信然召日者李端卜之端云當為天子司天張友直亦云當大貴家奴李添夀上變松科和尚下吏驗問有狀皆伏誅上曰朕嘗痛海陵翦滅宗族今和尚所為如此欲貸其罪則妖妄誤惑愚民者便以為真不可不滅朕於此子葢不得已也傷閔者久之衮本名富勒堅性桀驁强悍海陵素不喜其為人初仕為輔國上將軍天徳初加特進封王為吏部尚書判大宗正事坐語禁中起居狀兵部侍郎蕭恭首問䕶衛張九具言之海陵親問恭奪官解職張九對不以實特處死衮與翰林學士承㫖宗秀護衛瑪竒實達爾王之章皆決杖有差海陵遂愈忌之未㡬授明安及遷中都道中以富勒堅為西京留守西京兵馬完顔穆隆阿與富勒堅有舊同在西京遂相往來富勒堅嘗以玉帶遺之又稱穆隆阿驍勇不減尉遲敬徳編修官元福努妻與富勒堅姻戚圓福努嘗戒富勒堅曰大王名太彰著宜少謙晦富勒堅知海陵忌之嘗召日者問休咎家奴哈里知海陵疑富勒堅上變告之言與穆隆阿等謀反召日者問天命御史大夫髙楨刑部侍郎耶律賽音舒嚕往鞫之無狀海陵怒遣使械富勒堅等至中都不復究問斬之于市穆隆阿圓福努并日者皆凌遲處死贊曰金議禮制度班爵禄正刑法治厯明時行天子之事成一代之典杲宗幹經始之功多矣杲子宗義為海陵所殺宗幹之後又不幸而有海陵故其子孫之昌熾既鮮而亦不免於僇辱焉秦漢而下宗臣世家與國匹休者何其少歟君子於此可以觀世變矣金史卷七十六
