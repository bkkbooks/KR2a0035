body:
  text: 金史卷十七元中書右丞相總裁托克托等修本紀第十七哀宗上哀宗諱守緒初諱守禮又諱寧嘉蘓宣宗第三子毋曰明恵皇后王氏賜姓温都氏仁聖皇后之女兄也承安三年八月二十三日生於翼邸仁聖無子養為已子泰和中授金紫光禄大夫宣宗登極進封遂王授秘書監改樞密使貞祐初莊獻太子守忠薨立皇孫鑑為皇太孫尋又薨四年正月己卯立守禮為皇太子仍控制樞密院事詔畧曰子以母貴遂王守禮地鄰冡嫡慶集元妃立為皇太子其典禮有司條具以聞四月甲午用太子少保張行信言更賜名守緒元光二年十二月庚寅宣宗崩辛卯奉遺詔即皇帝位于柩前壬辰詔大赦畧曰朕迷先帝之遺意有便於時欲行而未及者悉奉而行之國家已有定制有司往往以情破法使人罔遭刑憲今後有本條而不遵者以故入人罪罪之草澤士庶許令直言軍國利害雖涉譏諷無可采取者並不坐罪正大元年春正月戊戌朔詔改元正大庚子上居廬百官始奏事秘書監權吏部侍郎富察和卓改桓州刺史左司員外郎尼瑪哈華山改同知楨州軍州事逐二姦臣大夫士相賀邠州節度使伊喇瑪納布貢白兎詔曰得賢臣輔佐年穀豐登此上瑞也焉事此為令有司給道里費縱之本土禮部其徧諭四方使知朕意丁巳詔朝臣議修復河中府禮部尚書趙乗文太帝卿楊雲翼等言陜西民方疲敝未堪力役遂止戊午上始視朝大司農守汝州防禦使李蹊為太常卿權參知政事平車政事荆王守純罷判睦親府參知政事布薩烏錦罷充大行山陵使尊皇后温都氏元妃温都氏皆為皇太后號其宫一曰仁聖一曰慈聖百官入賀于隆徳殿是日大風飄端門瓦特嘉喀齊喀權樞密副使有男子服麻衣望承天門且笑且哭詰之則曰吾笑笑將相無人吾哭哭金國將亡羣臣請寘重典上持不可曰近詔草澤諸人直言雖涉譏訕不坐法司唯君門非笑哭之所重杖而遣之南陽民布陳謀反伏誅三月熒惑犯左執法戊申奉安宣宗御容于孝嚴寺辛亥丞相高汝礪薨癸丑葬宣宗于徳陵甲寅起復邠州節度使致仕張行信為尚書左丞以延安帥臣完顔哈達戰禦有功授金虎符權參知政事行尚書省事于京兆兼統河東兩路夏四月癸酉宣宗祔廟大赦中外熒惑犯右執法五月戊戌平章政事巴古拉薨癸卯樞密副使完顔薩布為平章政事權參知政事實嘉烏新為尚書右丞太常卿李蹊為翰林承旨仍權參政甲辰賜策論進士富珠哩察罕以下十餘人及第經義進士張介以下五人及第戊申賜詞賦進士王鶚以下五十人及第詔刑部登聞檢皷院毋鎻閉防䕶聼冤者陳訴六月甲戌宰執請擊鞠上以新䘮不許辛卯立妃圖克坦氏為皇后遣樞密判官伊喇布哈率兵至光州榜諭宋界軍民更不南伐秋七月己亥詔諭百官各勤乃職癸卯補修大樂九月樞密判官伊喇布哈復澤潞𫉬馬千匹冬十月戊午夏國遣使來修好十二月乙巳桓州刺史富察和卓有罪伏誅甲寅宣宗小祥燒飯于徳陵改定辟舉縣令法以六事課縣令京東西南陜西設大司農司兼採訪公事京師大司農總之左丞張行信言先帝詔國内刑不上大夫治以廉恥丞相高琪所定職官犯罪的决百餘條乞改依舊制上欲彰先帝之羙畧施行之二年春正月甲申冇黄黒之祲夏四月辛卯朔恒山公武仙自真定府來奔起復致仕莘國公胥鼎為平章政事行省事于衛州進封英國公甲午京畿旱遣使慮囚鈞許州大雨雹丁酉宿鄭州雨傷麥五月丁丑以旱甚責已避正殿减膳赦罪蘓椿自大名來奔詔置椿許州秋七月都水富察瑪哈雅納殺人免死除名八月鞏州元帥田瑞反行省軍圍之其毋弟實格殺瑞出降赦其罪以為涇州節度使世襲明安九月夏國和議定以兄事金各用本國年號遣使來聘奉國書稱弟冬十月以夏國修好詔中外新軍政改總領為都尉己酉以誅田瑞詔中外癸亥遣禮部尚書鄂屯良弼大理卿費摩欽甫侍御史烏克遜𢎞毅為夏國報成使國書稱凡乙亥面諭臺諌完顔蘓哷陳䂓曰宋人輕犯邉界我以輕騎襲之冀其懲創通好以息吾民爾夏人從來臣屬我朝今稱弟以和我尚不以為辱果得和好以安吾民尚欲用兵乎卿等宜悉朕意伊喇布哈及宋人戰于光州獲馬數千殺人千餘而還内族王嘉努故殺鮮于主簿權貴多救之者上曰英王朕兄敢妄撻一人乎朕為人主敢以無罪害一人乎國家哀弱之際生靈有幾何而族子恃勢殺一主簿吾民無主矣特命斬之詔有司為死節士十有三人立褒忠廟禁宿泗青口廵邉官兵毋復擅殺過淮紅衲軍詔趙秉文楊雲翼作龜鏡萬年錄三年春正月丁巳朔夏國遣使來賀三月陜西旱平章政事胥鼎復請致仕不許詔尚書省議省减用度夏四月辛卯親享于太廟郕國夫人車經御路過廟前馭者乘馬二婢坐車中俱不下詔繫獄杖之幸丑以旱遣官禱于濟瀆癸卯祈于太廟禁繖扇河南大雨雹己酉遣使慮囚遣使捕蝗五月己未大雨宋兵掠夀州境癸亥永州桃園軍失利死者四百人乙丑大雨壬申詔諭隩州趙甫等能以土地來歸當任使之六月辛卯京東大雨雹螑盡死壬子詔諭高麗及遼東行省格綳額討反賊萬嘉努赦脅從者秋七月庚午平章政事英國公胥鼎薨八月伊喇布哈復曲沃及晋安辛卯詔設益政院于内廷以禮部尚書楊雲翼等為益政院説書官日二人直備顧問冬十月丁酉夏使來報哀十一月庚申議與宋修好戊長又議之己巳宋忠義軍夏全自楚州來歸楚州王義深張惠范成進以城降封四人為郡王辛未改楚州為平淮府以夏全等來降赦諸路從宋及淮楚官吏軍民并其家屬甲戌遣使夏國賀正旦丙子夏以兵事方殷來報各停使聘大元兵征西夏平中興府召陜西行省及陜州總帥完顔額爾克靈寳總帥赫舎哩約赫徳赴汴議兵事諭陜西兩省凡戎事三品以下官聴以功過賞罰之銀二十五萬兩從其給賞遣中大夫完顔履信為弔祭夏國使四年春正月壬戌增築中京城浚汴城外濠二月布哈約赫徳復平陽執知府李齊勤𫉬馬八千三月簽勞效官充軍有怨言遂不果用詔以銀贖平陽虜𫉬男女分賜官軍者聴自便大元兵平徳順府節度使愛新攝府判馬肩龍死之大元兵復下平陽己巳徵夏税二倍夏五月丁丑議乞和于大元大元兵平臨洮府總管圖們呼圖克們死之陜西行省進三策上策自將出戰中䇿幸陜州下䇿棄秦保潼闗不従六月戊申朔遣前御史大夬完顔哈昭為議和使丙辰地震太白入井賜詞賦經義盧亞以下進士第秋七月大元兵自鳳翔徇京兆闗中大震工部尚書師安石為尚書右丞壬辰以中丞烏克遜布希祭酒費摩阿古岱兼司農卿簽民軍勸率富民入保城聚兼督秋税令百姓知避遷之計丁酉赦陜西東西兩路賜民今年租八月庚戌詔有司罷遣防備丁壯修城民夫軍須差𤼵應不急者權停己巳萬年節同知集賢院史公奕進大定遺訓待制呂造進尚書要略是日大風落左掖門䲭尾壊丹鳯門扉隕霜殺禾李全自益都復入楚州㩀之遣總帥完顔額爾克元帥慶善努守盱𣅿與全戰于龜山敗績冬十月辛酉右拾遺李大節右司諌陳䂓劾同判睦親府事薩哈連姦贓不報壬戌外臺監察御史諌獵上怒以邀名賣直責之詔贈徳順府死事愛新馬肩龍等官以淮南王爵招李全十一月乙未未時日上有二白紅貫之丁酉獵于近郊十二月真授李蹊参知政事大元兵下商州王子遣使安撫陜西以牛千頭賜貧民五年春正月丁丑親祭三廟庚辰遣知開封府事完顔莽伊蘓如大元弔慰丙戌議擊盱眙辛卯以龜山之敗降元帥慶善努為定國軍節度使二月乙巳朔大寒雷雨雪木之華者盡死癸丑詔有司塑臨洮總管圖們呼圖充們像入褒忠廟書死節子孫于御屏量材官使之三月甲戌朔羣臣請依祖宗故事樞密院聴尚書省節制不從乙酉監察御史烏庫哩布嚕魯劾近侍張文夀張仁壽李麟之受饋遺曲赦其罪而出之夏四月甲辰朔以御史言三姦不已凡四日不視朝八日議放還西夏人口丙寅右丞師安石薨親衞軍王耀爾酗酒殺其孫大理寺當以徒刑特命斬之五月癸巳定國軍節度使慶善努以受賂奪一官六月壬戌以旱赦雜犯死罪已下秋七月戊子同判睦親府事薩哈連出為中京留守行樞密院事八月乙卯以旱遣使禱于上清宫甲子参知政事慱索為尚書右丞太常卿延扎舒嚕權参知政事増築歸徳行樞密院擬工役數百萬詔遣權樞密院判官白華喻以農夫勞苦减其工三之二以節制不一併衛州帥府於恒山公府命白華往經畫之九月庚寅雨足始種麥冬十一月辛巳進宣宗實錄十二月庚子朔日有食之完顔莽伊蘇以奉使不軄免死除名壬子完顔納新改侍講學士充國信使以陜西大寒賜軍士柴炭銀有差京兆鳳翔府司竹監進竹令分給之六年春二月丙辰樞密院判官伊喇布哈權樞密副使耀州刺史李興有戰功詔賜玉兎鶻帶金器以丞相完顔薩布行尚書省事于闗中召平章政事完顔哈達還朝伊喇布哈率忠孝軍總領完顔陳和尚忠孝軍一千騎駐邠州遣白華馳喻布哈以用兵之意詔樞密更給忠孝軍馬匹以漸調發都尉司步卒及忠孝馬軍屯京西以白華専備軍須三月乙亥忠孝軍總領陳和尚有戰功授定逺大將軍平凉府判官世襲穆昆夏五月隴州防禦使舒穆嚕棟爾進黄鸚鵡詔中外方獻珍竒違物性損人力令勿進秋七月罷陜西行省軍中浮費八月丙申伊喇布哈再復澤潞九月洮河蘭㑹元師延扎哈瑪爾進西馬二匹詔曰卿武藝超絶此馬可充戰用朕乘此豈能盡其力既入進即尚廐物也仍以賜卿冬十月乙未朔伊喇布哈東還令陳和尚率陜西歸順馬軍屯鈞許大元兵駐慶陽界詔陜西行省遣使奉羊酒幣帛乞緩師請和十一月遣使鈞許選試陜西歸順人得軍二千以藝優者充忠孝軍次充和爾和軍十二月乙未詔副樞布哈總帥赫舍哩約赫徳權簽樞宻院事完顔額爾克殺慶陽罷附京獵地百里聽民耕稼七年春正月副樞布哈總帥約赫徳權簽院事額爾克解慶陽之圍以額爾克屯邠州布哈約赫徳還京兆夏五月釋清口宋敗軍三千人願留者五百人以屯許州餘縱遣之賜經義詞賦李瑭以下進士第秋七月以平章政事哈達權樞宻副使八月賜陜西死事之孤鹽引及絹仍量材任使大元兵圍武仙于舊衛州冬十月己未朔平章哈達副樞布哈引兵解衛州圍上登承天門搞軍哈達布哈並世襲穆昆伊喇布哈權叅知政事同哈達行省事于閿鄉以備潼闗八年春正月大元兵圍鳯翔遣樞宻院判官曰華右司郎中𤓰爾佳巴喇瑪諭閿鄉行省進兵哈達布哈以未見機㑹不行復遣白華諭哈達布哈將兵出闗以解鳯翔之圍又不行夏四月丁巳朔赦全免京西路軍需錢一年旱災州縣差税從實減貸大元兵平鳯翔府兩行省棄京兆遷居民於河南留慶善努守之五月李全妻楊妙真以全䧟没于宋構浮梁楚州北欲復宋讎遣哈達布哈屯桃源界滶河口以傋侵軼宋八里莊人拒其主將納哈達布哈詔改八里莊為鎮淮府秋七月宋將焚浮梁九月丙申慈聖宫皇大后温都氏崩遺詰園陵制度務從儉約大元兵駐河中府慶善努棄京兆東還召哈達布哈赴汴議引兵趨河中府懼不敢行還陜州出帥至冷水谷而歸大元兵攻河中府哈達布哈遣元帥王敢率兵萬人救之冬十月右丞相薩布致仕十一月丁未大元進兵饒風闗由金州而東省院議以逸待勞未可與戰上諭之曰南渡二十年所在之民彼田宅鬻妻子竭肝腦以養軍今兵至不能逆戰止以自護京城縱存何以為國天下其謂我何朕思之熟矣存與亡有天命惟不負吾民可也乃詔諸將屯軍襄鄧十二月己未塟明惠皇后河中府破權簽樞宻院事草火額爾克死之元帥板于額爾克提敗卒三千走閿鄉詔赦將佐以下杖額爾克二百以死哈達布哈率諸軍入鄧州楊沃衍陳和尚武仙皆引兵來㑹出屯順陽戊辰大元兵渡漢江而北丙子哈達布哈將兵禦于禹山之前大元兵分趨汴京京師戒嚴是夜二鼔哈達布哈引軍還鄧州大元兵躡其後盡獲其輜重天興元年是年本正大九年正月改元開興四月又改元天興春正月壬午朔日有兩珥大元兵道唐州元帥完顔兩羅索與戰襄城之汝墳敗績兩羅索走汴京遣完顔莽伊蘇等部民丁萬人決河水衛京城癸未置尚書省樞宻院于宫中以便召問起前元帥瓜爾佳實倫權昌武軍節度使行元帥府事哈達布哈引軍自鄧州赴汴京乙酉以點檢瓜爾住薩哈為總帥將兵三萬巡河渡權近侍局使圖克坦長樂監其軍起進京諸邑軍家屬五十萬口入京丙戌大元兵定河中由河清縣白坡渡河丁亥長樂薩哈引兵至封邱而還戊子左司郎中錫黙愛實上書請斬長樂薩哈以肅軍政不從都尉烏淩阿呼圖一軍自潼闗入援至偃師聞大元兵渡河遂走登封少室山壬辰衛州節度使完顔薩尼雅布棄城走汴甲午修京城樓櫓及守禦備大元兵薄鄭州與白坡兵合屯軍元帥馬伯堅以城降防禦使烏浚阿耀珠死之乙未大元游騎至汴城丁酉大雪大元兵及兩省軍戰鈞州之三峯山兩省軍大潰哈逹陳和尚楊沃衍走鈞州城破皆死之樞宻副使布哈就執尋亦死武仙走宻縣自是兵不復振己亥徐州行省完顔慶善努引兵入援義勝軍校侯進杜正張興率所部北降慶善努入睢州庚子御端門肆赦改元開興辛丑潼闗守將李平以關降大元壬寅扶溝民錢大亨李鈞叛殺縣令王浩及簿尉庚戌許州軍變殺元師𤓰爾佳實倫鈕祜禄全周蘇椿等以城䧏大元二月壬子朔慶善努謀走歸徳至陽驛店遇大元兵徐帥完顔烏里力戰而死慶善努被擒使招京城不從睢州刺史張文夀棄城從慶善努皆死之甲寅大元兵徇臨渙攝縣令張若愚死之戊午次盧氏關陜行省總帥兩軍及奈藍帥府軍棄潼關而東與之遇大雪未戰而潰行省圖克坦烏登總帥納哈塔和碩敗死完顔重喜降斬于馬前郡尉鄭倜殺都尉苗英亦䧏秦藍總帥府經厯商衡死之大元兵下睢州庚申翰林待制馮延登使北來歸乙丑大元兵攻歸徳庚午起復右丞相致任薩布為左丞相括京師民軍二十萬分𨽻諸帥人月給粟一石五斗三月丁亥大元軍平中京留守薩哈連投水死甲午命平章攻事博索宿上清宫樞密副使喀齊喀宿大佛寺以備緩急大元遣使自鄭州來諭䧏使者立出國書以授譯火譯史以授宰相跪進上起立受之以付有司書索翰林學士趙秉文衍聖公孔元措等二十七家及歸順人家屬布哈妻子繡女弓匠鷹人又數十人庚子封荆王子額爾克為曹王議以為質密國公璹以曹王㓜請代上慰遣之不聼其代壬寅尚書左丞李蹊送曹王出質諫議大夫費摩阿古岱太府監國世榮為講和使户部侍郎楊慥權參知政事分軍防守四城大元兵攻汴城上出承天門撫西面將士千户劉夀語不遜詔釋勿問癸卯上復出撫東面將士親傅戰傷者藥于南薰門下仍賜巵酒出内府金帛器皿以賞戰士乙巳鳳翔府礟軍萬户王阿嚕樊喬來歸己酉造革車三千兩已而不用置局養無家俘民夏四月癸丑兵士李新有功擢四方館使元帥劉益叱其子戰死丁巳遣戸部侍郎楊仁奉金帛詣大元兵乞和戊午又以珍異往謝許和癸亥明恵皇后陵被發失柩所在遣中官往視之至是始得以兵䕶宫女十人出迎朔門奉柩至城下設御幄安置是夜復葬之戮鄭倜妻子甲子御端門肆赦改元天興詔内外官民能完復州郡者功賞有差出金帛酒炙犒飫軍士减御膳罷冗員放宫女上書不得稱聖改聖旨為制旨釋鎬厲王衛紹王二族禁錮聴自便乙丑百官初起居于隆徳殿前丙寅以尚書省兼樞密院事丁卯放宫女聴以衣装自隨金珠留犒士卒汴京解嚴歩軍始出封邱門采薪蔬己巳建咸都尉完顔鄂倫同大元使摩多入城庚午見使臣於隆徳殿放宫女如前辛未開鄭門聴百姓男子出入甲戌御承天門大饗将士聞有聲屈者乃還宮乙亥有詔止奏事許州進櫻桃五月辛巳遷民告出城者以萬數薩布博索不聴乙酉以南陽郡王子思烈行尚書省于鄧州召援兵丙戌拜天於大慶殿詔博索致仕放京城四面軍李辛不奉詔丁亥鑿洧川漕渠尋罷之馮延登以奉使有勞授禮部侍郎戊子裕州鎮防軍将領賀徳希率西軍二千人入援放遷民出京辛卯大寒如冬密國公璹薨汴京大疫凡五十日諸門出死者九十餘萬人貧不能葬者不在是數癸巳楊春入㩀亳州觀察判官劉均死之卒丑上御香閤面責宰相乙巳将相受保城爵賞六月庚戌朔詔百官舉大将衆舉劉益不能用癸丑飛虎軍二百人奪封邱門出奔甲寅以出師錮門禁乙卯博索開渠於私第東丙辰閔官馬殺瘠者以食丁巳豐紳據徐州圖克坦伊都走宿州推張興行省事庚申塞京城四門以便守禦壬戌國安用入徐州殺張興推豊紳為元帥以主州事己巳詔贈禦侮中郎将完顔陳和尚鎮南軍節度使立褒忠廟碑權参知政事揚慥罷辛未復修汴城以疫後園户僧道醫師粥棺者擅厚利命有司倍征之以助其用甲戌宿州鎮防千户高拉格李宣殺節度使赫舍哩阿古父子請行省圖克坦伊都主帥事伊都不從率将吏西走至榖熟遇大元軍死之乙亥左丞李蹊送曹王與其子仝俱還丁丑恒山公武仙殺士人李汾七月庚辰朔兵刅有火辛巳軍士撾登聞皷乞将劉益癸未尚書右丞延扎舒嚕罷吏部尚書完顔納新為参知政事甲申飛虎軍士申福蔡元擅殺北使唐慶等三十餘人于館詔貰其罪和議遂絶乙酉都人揚言欲殺博索宻詔遣衛士護其家丙戌軍士毁博索别墅薩尼雅布妄殺市人之過其門者以靖亂丁亥拜天于承天門下出内府及兩宫物賜軍士或子下令招軍辛夘簽民為兵鞏昌民百二十人赴援乙未宿州帥重僧努稱國安用降遣近侍直長因世英等持詔封安用為兖王行京東等路尚書省事賜姓完顔改名用安新軍有撾登聞鼓者杖殺之乙巳金木火太陰㑹于軫翼丙午參知政事完顔思烈恒山公武仙鞏昌總帥完顔呼沙呼率諸將兵自汝州入援以喀齊喀為樞宻使將兵一萬應之命左丞李蹊勸諭出師乃行八月己酉朔喀齊喀屯杏花營益兵五千始進屯中年故城庚戌發丁丑五千運糧餉喀齊喀軍辛亥完顔思烈遇大元兵于京水遂潰武仙退保留山思烈走御寨中京元帥左監軍任守貞死之喀齊喀棄輜重奔至鄭門聚兵乃入甲寅免喀齊喀為庶人籍其家以賜軍士降監軍長樂為符寶郎丁巳釋奠孔子戊午括民間粟己未藉圖克坦烏登完顔重喜納哈塔和碩家貲前儀封今魏璠上言鞏昌師完顔仲徳沉毅有逺謀請奉命往召不報戊辰免府試起復前大司農侯摯為平章政事進封蕭國公行京都路尚書省事己巳摯帥兵至封邱將士将潰摯止之乃與衆還汴壬申聽無軍家口出京甲戌金木星交乙亥賣官及許買進士第丙子詔罷括粟復以進獻取之丁丑京城民楊興入貲授延州刺史戊寅劉仲温入貲授許州刺史金史卷十七
