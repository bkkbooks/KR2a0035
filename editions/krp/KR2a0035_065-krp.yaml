body:
  text: 金史卷六十五元中書右丞相總裁托克托等修列傳第三始祖以下諸子幹魯博囉錫赫特孫巴達錫哩布子博諾錫里庫烏肯徹伯赫崇成本名布呼噶順子普嘉努滿丕子滿都布們都們圖琿威泰烏色子宗永烏哲孫璋昻本名烏達子正嘉始祖明懿皇后生徳帝烏噌季幹魯女曰卓克索巴皆福夀之語也以六十後生子異之故皆以嘉名名之焉徳帝思皇后生安帝季曰博囉博囉與獻祖俱徙海古勒水置屋宇焉博囉孫呼實呼實子和卓與景祖長子韓國公和卓同名韓國公前死所謂肅宗納和卓之妻瓜爾佳氏者是也穆宗四年伐阿蘇阿蘇走遼遼使使來止伐阿蘇軍穆宗陽受遼帝約束先歸國留和卓守阿蘇城凡三年卒攻破之天㑹十五年贈特進安帝節皇后生獻祖次曰信徳次曰錫赫特次曰錫哩布次曰錫里庫錫赫特之孫巴達錫哩布之子博諾皆佐世祖有功博諾勇毅善射當時有與同名者嘗有二志目之曰惡博諾天㑹十五年巴達贈儀同三司博諾贈開府儀同三司在世祖時罕都伊克及和卓巴達博諾五人者不離左右親若手足元勲之最著者也明昌五年皆配饗世祖廟廷準塔蘇拉布皆瓜爾佳部人賽音諾延綽哈皆圖們部人富哲尼瑪哈完顔部人阿固岱布達皆音徳爾水完顔部貝勒七人者當携離之際能一心竭力輔戴者也徳濟呼遜皆珠嘉部貝勒雙寛主保皆珠格部人阿固岱温特赫部人此五人者又其次者也世祖初年伯赫為變烏春盛强使人召阿固岱布達阿固岱曰吾不知其他死生與太師共之太師謂世祖也布達大喜曰我心正如此耳烏春兵來堅壁自守勿與戰可也徳濟呼遜居博勒和水烏春兵出其間不為變終拒而不從雙寛居和博克村其兄卓巴納貝勒烏春止其家而以兵圍雙寛烏春辭去世祖殺卓巴納雙寛請無孥戮世祖從之世祖破和諾克薩克達主保死焉天㑹十五年準塔賽音諾延阿固岱布達皆贈金紫光禄大夫蘇拉布綽哈富哲尼瑪哈德濟呼遜雙寛主保温特赫阿固岱皆贈銀青光禄大夫又有和倫瓜爾佳部雙寛貝勒察遜水烏雅部富哲固納畏烏春彊請世祖出兵其間以為重世祖使色埓黙雅爾盤將别軍過之固納教色埓黙取先在烏春軍中二十二人烏春覺之殺二人得二十人固納又以土人益色埓黙軍穆宗他日嘉此功不能忘以色埓黙女守寧妻固納子呼爾罕焉摩多圖水費摩部鄂博貝勒附於世祖和諾克焚之鄂博卒世祖厚撫其家因併録之以見立國之艱難云錫里庫者昭祖將定法制諸父國人不悦已執昭祖將殺之錫里庫亟往彎弓注矢射於衆中衆乃散去昭祖得免國俗有被殺者必使巫覡以詛祝殺之者迺繫刃于杖端與衆至其家歌而詛之曰取爾一角指天一角指地之牛無名之馬向之則華面背之則白尾横視之則有左右翼者其聲哀切悽婉若蒿里之音既而以刃盡地刼取畜産財物而還共家一經詛祝家道輒敗及拉林水烏蘇展部殺完顔部人昭祖往烏蘇展部以國俗治之大有所獲頒之於諸父昆弟而不及錫里庫錫里庫曰前日免汝於死者吾之力往治烏蘇展部者吾之謀也分不及我何邪昭祖於是早起自齎問金列鞢往餽之時錫里庫猶未起撫寢衣而問曰爾為誰昭祖曰舒嚕先擇此寶而後頒及他人敢私布之錫里庫既掦言初不自安至是乃大喜列鞢者腰佩也獻祖恭靖皇后生昭祖次曰巴圖次曰阿布哈次曰圖庫次曰都古嚕訥次曰薩里罕次曰薩克蘇昭祖威順皇后生景祖次曰烏肯徹次室達呼黙烏蘇展部人生伯赫伯勒赫斡里延次室髙麗人生和碩台烏肯徹初昭祖久無子有巫者能道神語甚驗乃往禱焉巫良乆曰男子之䰟至矣此子厚有福徳子孫昌盛可拜而受之若生則名之曰烏古鼐是為景祖又良久曰女子之䰟至矣可名曰烏延又良久曰女子之兆復見矣可名曰烏達布又久之復曰男子之兆復見然性不馴良長則殘忍無親親之思必行非義不可受也昭祖方念後嗣未立乃曰雖不良亦願受之巫者曰當名之曰烏肯徹既而生二男二女其次第先後皆如巫者之言遂以巫所命名名之景祖初立烏肯徹酗酒屢悖威順皇后后曰巫言驗矣悖亂之人終不可留遂與景祖謀而殺之部人怒曰此子性如此在國俗當主父母之業柰何殺之欲殺景祖后乃匿景祖出謂衆曰為子而悖其母率是而行將焉用之吾割愛而殺之烏古鼐不知也汝輩寧殺我乎衆乃罷去烏肯徹之子希卜蘇自有傳伯赫及同母弟二人自幼時每争攘飲食昭祖見而惡之曰吾娶此妾而生子如此後必為子孫之患世祖初立伯赫果有異志誘和諾克薩克達烏春烏木罕離間部屬使貳於世祖世祖加意事之使為貝勒而不令典兵伯赫既隂與和諾克烏春謀計國人皆知之而童謠有欲生則附於伯赫欲死則附於和哩布頗拉淑之語世祖亦以策探得兄弟部人向背烏春和諾克相次以兵來攻世祖外禦强兵内畏伯赫之變將行聞伯赫食於其愛妾之父家肉張咽而死且喜且悲乃迎尸而哭之崇成本名布呼泰州司屬司人昭祖𤣥孫大定十八年收充奉職改東宫入殿實達爾轉護衛二十五年章宗為原王充本府祇候郎君明年上為皇太孫復為䕶衛上即位授河間府判官以憂去職起復為宿直將軍累遷武衛軍都指揮使泰和三年卒賻贈有加崇成謹飭有守宿衛二十餘年未嘗有過故久侍密近云景祖昭肅皇后生韓國公和卓次世祖次鄭國公噶順次肅宗次穆宗次室綽斯和契丹人生代國公赫色本次室温特赫氏名都本生虞國公滿丕隋國公鄂蘭哈瑪爾鄭國公們圖琿和卓鄂蘭哈瑪爾别有傳噶順天㑹十四年大封宗宗噶順追封王爵正隆例降封鄭國公子普嘉努又名昱嘗從太祖伐埓克烏塔太祖使普嘉努招卓多卓多即降康宗八年係遼籍女直赫舍哩部阿勒呼丹阻兵招納亡命邊民多亡歸之普嘉努以偏師夜行畫止抵實埓水襲擊大破之盡俘其孥而還邊氓自此無復亡者後與宗雄視泰州地土太祖因徙萬家屯田于其地天輔五年普嘉努為温貝勒遂為都統使往襲遼帝而以雨潦不果行既而烏赫哩貝勒杲都統内外諸軍以取中京普嘉努等皆為之副遼帝西走都統杲使普嘉努以兵一千助達蘭擊遼都統瑪格與達蘭不相及普嘉努與色哩舍音降其西北居延之衆而降民稍復逃㪚皮室部亦叛遂率兵襲之至徳里川遇敵八千遂力戰兵敗察喇以兵來㑹追及敵兵于黄水獲畜産甚衆是役也鄂屯安塔哈被十一創竟敗敵兵而還軍于旺國崖西色哩亦以兵㑹太祖自草濼追遼帝普嘉努宗望為前鋒戒之曰彼若深溝髙壘未可與戰即偵伺巡邏勿令遯去以俟大軍若其無備便可擊也上次古爾珍川烏舍馬和尚至小魚濼夜潜入遼主營執斯勒年以還遂知遼帝所在普嘉努等晝夜兼行追及于石輦鐸我兵四千至者才千人遼兵圍之伊都指遼帝麾蓋騎兵馳之遼帝遯去兵遂漬所殺甚衆宗翰為西北西南兩路都統普嘉努斡魯為之副烏琿部叛普嘉努討平之天㑹間為司空封王天眷二年宗磐等誅辭及普嘉努詔奪司空是年薨天徳初配享太祖廟廷正隆二年例封豫國公滿丕天㑹十五年封王正隆例封虞國公長子滿都布孝友恭謹多謀而善戰年十五隸軍中從攻鄂勒歡及係遼女直和碩台等為變滿都布自為質遂從和碩台歸中途以計殺守者而還攻寧江州取黄龍府破髙永昌取春泰州皆有功多受賞賚遂為穆昆討嶺東未服州郡過土河東山敗賊三千人奚契丹㓂土河西與明安䝉克瑪竒擊之滿都布對敵之中摧鋒力戰破其衆九萬人奚衆萬餘保阿林甸復擊敗之降其旁近居人復以五百騎破遼兵一千生擒其將以歸與棟摩攻興中府中流矢卒年三十七天眷中贈金紫光禄大夫諡英毅們圖琿屢從征伐天㑹二年為阿斯罕貝勒參議國政明年薨天㑹十五年大封宗室追封王正隆例封鄭國公明昌五年諡定濟們都襲父滿丕明安們都卒子素赫襲素赫卒子薩哈連襲薩哈連卒子惟鎔襲惟鎔本名黙哷字子鑄駢脅多力喜周給人至寧初守楊文闗有功兼都統䕶漕運貞祐二年佩金牌䕶親軍家屬遷汴遙授同知祁州軍州事充提控貞祐三年破紅襖賊於大沬堌惟鎔入自北門諸軍繼進生獲劉二祖功最遷泰安軍節度副使改遂王府尉都水少監東平府治中坐誤以刅傷同知府事赫舍哩約赫徳當削降殿年仍從軍自効討花㡌賊于曹濟間行省䝉古綱奏其功復前職遷邳州經畧使卒子從傑襲明安累功遙授鎮南軍節度副使世祖翼簡皇后生康宗次太祖次魏王威泰次太宗次遼王舍音次室圖克坦氐生衛王烏色次魯王烏哲次室布薩氏生漢王阿庫納次室珠格氏生魯王棟摩次室珠格氏生沂王扎拉次室烏庫哩氏生鄆王昻威泰年二十餘薩哈伐埓克威泰與希卜蘇阿里罕等俱為禆將諸將議攻取威泰獨主攻城便太祖將至軍威泰迎之謂太祖曰埓克城且下勿惑他議太祖從之至軍中衆議乃決威泰急起治攻具其夜進兵攻城遲明破之及二額訥斯琿路二㤙楚路㓂盜威泰盡平之康宗二年甲申蘇伯水諸部不聴命康宗使威泰等往治其事行次呼爾哈川薩哈村召諸部皆至惟鴻觀部沃赫貝勒不至威準部達薩塔貝勒哲爾徳部薩克蘇貝勒亦皆遯去遇烏塔於瑪竒嶺烏塔遂執二人以降於是使威泰將兵代沃赫募軍于蘇伯水沃赫完聚固守攻而抜之進師博齊赫布騰路攻拔歡塔城取畔者以歸太祖於母弟中最愛威泰威泰歸自歡塔城太祖以事如寧江州欲與威泰偕行威泰曰兵役久勞未及息也遂不果行太祖還晝寐干拉林水傍夢威泰之場圃火未盡焚不可撲滅覺而深念之以為憂是時威泰已寢疾太祖至聞之過家門不下馬徑至威泰所問疾未幾薨年三十四太祖毎哭之慟謂人曰予强與之偕行未必死也威泰剛毅果斷服用整肅臨戰決策有世祖風世祖之世軍旅之事多専任之太祖平遼歎曰恨威泰之不及見也天㑹十五年追封儀同三司魏王諡曰定肅烏色穆宗初威準部族相鈔畧遣訥格納貝勒以其兵徃治訥格納擅募蘇伯水人為兵不聽輒攻畧之其人來告穆宗使烏色及伊克往問狀訥格納雖伏而不肯償所取因遯去伊克等皆不欲追烏色督軍而進至巴固嶺西茂密水及之大破其衆訥格納死焉烏色撫定蘇伯水民部執訥格納之母及其妻子而歸穆宗曰烏色年尚幼巴能集事可嘉也康宗二年甲申威泰治蘇伯水諸部烏色幹魯佐之定諸部而還久之髙麗殺行人阿古雙寛而築九城於海蘭甸烏色將内外兵海古勒和尼齊富察都古嚕訥佐之髙麗兵數萬來拒烏色分兵為十隊更出迭入大破之烏色母呼紐疾篤召還以斡魯代之未幾烏色復至軍再破髙麗軍進圍其城七月髙麗請和盡歸前後亡命及所侵故地退九城之戍遂與之和皇統五年追封衛國王宗永本名塔塔烏色子長身美髯忠確勇毅天眷初以宗室子預誅宗磐擢寧逺大將軍皇統初充牌印祇候五年出為趙州刺史秩滿再任轉興平軍節度使改大名尹貞元三年復為興平軍節度使厯昭徳軍臨洮鳯翔尹大定二年入為工部尚書與蘇保衡完顔額哩頁遷加伐宋士官賞宗永性滯不習事凡與土賊戰者一槩加之世宗久乃知之謂宰相曰若一槩追還必生怨望若因循不問則爵賞濫矣其與土賊戰者有能以寡敵衆一人敵三十人以上者依已遷為定改同簽大宗正事震武軍節度使卒烏哲天㑹十五年大封宗室追封魯王正隆例改封公子實圖美驃騎衛上將軍子璋本名呼密多勇畧能通女直契丹漢字年十八左副元帥薩里罕引在麾下以事如京師見梁王宗弼與語宗弼悦之皇統六年父實圖美卒宗弼奏璋可襲穆昆詔從之天徳三年充牌印祇候以罪免奪其穆昆寓居中都海陵伐宋左衛將軍富察薩勒扎同知中都留守佩金牌掌留府事世宗即位于遼陽璋勸薩勒扎歸世宗薩勒扎不從璋與守城軍官烏淩阿實嘉努烏淩阿愿圖克坦三勝富察芬徹等以兵晨入留守府殺薩勒扎及判官瑪延薩里罕推宗强子阿蘇為留守璋行同知留守事遺實嘉努佩薩勒扎金牌與愿芬徹中都轉運使左淵子貽慶大興少尹李天吉子磐奉表如東京賀即位世宗嘉之以愿芬徹為武義將軍充䕶衛貽慶賜及第授從仕郎磐充閤門祇侯就以璋為同知中都事璋以殺薩勒扎自攝同知留守世宗因而授之心常不自安遂與兵部尚書克實謀因世宗謁山陵作亂大定二年上謁山陵璋等九人㑹于克實家説萬戸髙松不從璋知事不成乃與克實共執鄂倫詣有司陳上誅克實李惟忠等以璋為彰化軍節度使宋將呉璘出㪚闗據寶雞以西詔璋赴元帥都監圖克坦喀齊喀軍前任使宋人據原州寧州刺史延扎們都以兵四千攻之不克宋將姚良輔以兵十萬至原州權副統完顔實訥埓以千騎授們都兵而姚良輔兵多諸將皆不敢與戰及璋至軍㑹平涼涇州潘原長武等戍兵合二萬人乃使押軍明安舒穆嚕錫喇布以兵二千軍於城北實訥埓以兵三千軍於城西北十里麥子原皆據髙阜為陣璋以本部兵陣於城西姚良輔出自北嶺先遣萬人攻錫喇布而自以軍九萬陣麥子原下捍以劔盾行馬外列騎士步卒居其中敢死士鎖足行馬間持大力為拒分為八陣而别以騎二千襲璋軍璋方出迎戰實訥埓來報曰宋之重兵皆在麥子原矣璋遣萬户特哩實克烏頁以押軍明安奚慶喜昭蘇兵二千援錫喇布遣薩固察崔尹以兵二千益實訥埓錫喇布與宋人接戰良久敗之時宋兵在麥子原者最堅實訥埓與伊喇補鄂屯薩固察崔尹布格薩竒珠以兵五千沿壕為伏餘兵皆捨馬步戰擊其前行騎士走之於是行馬以前衝以長槍行馬以後射以勁弓良輔兵稍挫實訥埓乗勝麾兵撤其行馬破其七陣良輔復整兵出實訥埓少却而璋已破城下宋兵與實訥埓㑹使布格以伏兵擊良輔實訥埓亦整兵與戰奮擊之大破良輔軍斬首萬餘級墜壕死者不可勝數鎖足行馬者盡殪之獲甲矢萬餘器仗稱是良輔亦中兩創脱去遂圍原州穴其西城城圮宋人宵遯璋等入原州宋戍軍在寶雞以西聞之自散闗遯去京兆尹烏雅富埓赫寧州刺史持嘉烏蘇埓克已去徳順州宋呉璘復據之都監喀齊喀以璋權都統與實訥埓將兵二萬救徳順璋率騎兵前行與璘騎兵二萬戰于張義堡遂沙山下敗之追北四十餘里璘軍過隘不得前斬首數十級璋至徳順璘據城北險要為營璋亦策營與璘相望可三里許兩軍遇於城東凡五接戰璘軍敗走璋追至城下璘軍已據城北岡阜與其城上兵相應以弩夾射璋軍璋軍佯却城中兵來追璋反斾與戰大敗之喀齊喀遣統軍都監聶赫以兵七千來㑹與璘軍復戰敗之璘遣兵據東山堡欲樹柵璋與實訥埓聶赫議曰敵若據東山堡此城亦不可拔宜急擊之於是璋先據要地實訥埓以兵逼東山堡璘兵恃濠相拒短兵接璘兵退走實訥埓進擊之璘城北營兵可六千人登北岡來戰璋之漢軍少却傷者二百人璘遂焚璋軍攻城具璋率伊喇補明安兵踰北岡擊走之璘軍隔小塹射璋軍伊喇補少却實訥埓望見北原火發乃止攻東山堡亟與將士來赴引善射者先登率劉安漢軍三百人擊敗之璘軍皆走險璘以軍三萬據險作三陣皆環以劔盾行馬璋遣萬戶舒穆嚕迪里由别路自後擊之特哩實克烏頁伊喇補以二千人當其前射以强弓璘兵大敗狼藉墮溝壑璋軍度澗追斬數千級而還璘軍雖敗猶恃衆都監喀齊喀使武威軍副總管瓜爾佳扎拉來問策諸將皆曰呉璘恃險不善野戰我退軍平涼彼必棄險就平地然後可圖也璋曰不然彼恃其衆非特恃險也昔人有言寧棄千軍不棄寸地故退兵不如濟師我退軍平涼彼軍深入吾地固壘以拒我則如之何扎拉還報喀齊喀乃親率四萬人赴之呉璘詰旦乗陰霧晦㝠分兵四道來襲戰于城東離而復合者數四漢軍千户李展率麾下兵先登奮擊之璘軍陣動璋乗勝踵擊璘軍復敗追至北岡璘走險急擊之殺畧殆盡璘分半軍守秦州喀齊喀駐軍水洛城東自六盤山至石山頭分兵守之斷其餉道璘乃引歸宋經畧使荆臯以步騎三萬自徳順西去璋以兵八千實訥埓以兵五千追擊之實訥埓兵乃出其前還自赤觜遇其前鋒敗之于髙赤崖下復與其中軍戰自日昃至暮乃罷荆臯乘夜來襲營為退軍八十里明日實訥埓追之璋兵至上八節宋兵據險為陣璋捨馬步戰地險不得接相拒至曙宋兵動璋乘之追至甘谷城實訥埓兵亦至宋兵宵遯璋遂班師實訥埓追至伏羌城不及而還上使御史中丞徳濟視諸軍功狀徳濟舊與璋有隙故損其功詔璋將士賞此諸軍半之璋兼陜西路都統進官一階及元帥府上功璋居多詔徳濟削官兩階杖八十解職上復賞璋及將士如諸軍以璋為西北路招討使召為元帥左都監兼安武軍節度使賜以弓矢衣帶佩刀改益都尹左都監如故宋人棄海州遯去焚官民廬舍且盡璋至海州得所棄糧三萬六千餘石安集其人復其屯戍五年宋人約和罷三路都統復置陜西路統軍司以璋為使上曰監軍喀齊喀年老故授卿此職邊境無事且召卿矣以本官兼京兆尹召為御史大夫璋奏竊觀文武百官有相為朋黨者今在臺自臣外無女直人乞不限資考量材奏擬上曰朋黨為誰即糾治之朕選女直人未得其人豈以資考為限論其人材而已頃之璋奏曰太祖武元皇帝受天明命太宗皇帝奄定宋土自古帝王之興必稱受命當製大金受命之寶以明示萬世上曰卿言正合朕意乃遣使夏圓市玉十八年受命寶成奏告天地宗廟社稷上御正殿改大興尹為賀宋正旦使十三年璋受命使宋既行上遣人馳諭璋曰宋人若不遵舊禮慎勿付書如不令卿等入見即持書歸若迫而取之亦勿赴宴其囘書及禮物一切勿受璋至臨安宋人請以太子接書不從宋人就館迫取書璋與之且赴宴多受禮物有司以聞上怒欲寘之極刑左丞相良弼奏曰璋為將大破宋軍宋人讐之久矣將因此陷之死地未可知也今若殺璋或者墮其計中耳上以為然乃杖璋百五十除名副使客省使髙翊杖百沒入其所受禮物後嵗餘上念璋有征伐功起為景州刺史遷武定軍節度使授山東西路博迪山納古爾河穆昆改臨洮尹十九年卒鄆王昂本名烏達世祖最幼子也常從太祖征伐天輔六年命昻與素赫以兵四千監䕶諸部降人處之嶺東就以兵守臨潢府昻不能撫御降人苦之多叛亡者上聞之使綽里特戒諭昻已過上京諸部皆叛去惟章愍宫小室韋二部達内地詔安班貝勒烏竒邁曰比遣昻監徙諸部多致怨叛素赫駐兵不與討襲致使降人復歸遼主違命失衆當寘重法若有所疑則禁錮之俟師還定議是時太宗居守希卜蘇副之希卜蘇勸太宗因國慶可薄其罰於是杖昻七十拘之泰州而殺素赫天㑹六年權元帥左都監十五年為西京留守天眷三年為平章政事皇統元年封漆水都王二年制詔昻署銜帶皇叔祖字封鄆王是嵗薨子正嘉鶴夀鶴壽累官伊囉斡羣牧使死于契丹薩巴之難語在忠義傳正嘉皇統初以宗室子授定逺大將軍除磁州刺史天徳間為右諫議大夫累遷㑹寧尹安化軍節度使改益都尹海陵伐家為浙東道副統制與工部尚書蘇保衡以舟師自海道趨臨安至松林島阻風泊島間詔旦舟人望見敵舟請為備正嘉問去此幾何舟人曰以水路測之且三百里風迅行即至矣正嘉不曉海路舟楫不之信有頃敵果至見我軍無備即以火砲擲之正嘉顧見左右舟中皆火發度不得脫赴水死時年四十一金史卷六十五
