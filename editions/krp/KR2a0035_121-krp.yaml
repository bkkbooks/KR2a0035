body:
  text: 金史卷一百二十一元中書右丞相總裁托克托等修列傳第五十九忠義一華沙布薩巴附特庫布古德綽哈附鈕祐禄罕努曹珪温特赫布敦鶴壽附額哩頁閏孫史大等附納喇綽竒魏全珊延實古納附𤓰爾佳守中本名阿多古舒穆嚕元毅本名舒蘓伯特梅和尚烏克遜温屯髙守約哈薩喇安禮本名酌王維翰伊喇古尼宋扆烏庫哩榮祖本名福興烏庫哩仲温本名呼喇玖珠布格蘇附李演劉德基王毅王晦牛斗附齊鷹揚楊敏中髙乞驢附珠嘉佛新伊扎爾濟色實芳努附髙錫欒共子曰民生於三事之如一唯其所在則致死焉公卿大夫居其位食其禄國家有難在朝者死其官守郡邑者死城郭治軍旅者死行陣市井草野之臣發憤而死皆其所也故死得其所則所欲有甚於生者焉金代褒死節之臣既贈官爵仍録用其子孫貞祐以來其禮有加立祠樹碑嵗時致祭可謂至矣聖元詔修遼金宋史史臣議凡例凡前代之忠於所事者請書之無諱朝廷從之嗚呼仁哉聖元之為政也司馬遷記豫讓對趙襄子之言曰人主不掩人之美而忠臣有成名之義至哉斯言聖元之為政足為萬世訓矣作忠義傳華沙布完顔部人年三十五從軍頗見任用太袓使富卦喇徃遼國請阿蘇實觀其形勢富卦喇還言遼兵不知其數太祖疑之使華沙布徃還報曰遼方調兵尚未大集及見統軍使其孫被甲立於傍統軍曰人謂汝輩且反故為備耳及行道中遇渤海軍渤海軍向華沙布且笑且言曰聞女直欲為亂汝輩是耶具以告太祖又曰今舉大事不可後時若俟河凍則遼兵盛集來攻矣乗其未集而蚤伐之可以得志太祖深然之及破寧江州戰于逹噌噶城皆有功賜以旗鼓并御器械髙永昌請和華沙布徃招之取呼圖克以歸髙永昌詐降于斡魯斡魯使華沙布撒巴徃報㑹髙禎降言永昌非真降者斡魯乃進兵永昌怒遂殺華沙布薩巴皆支解之華沙布就執神色自若罵永昌曰汝叛君逆天今日殺我明日及汝矣罵不絶口至死年五十九天㑹中與薩巴俱贈遥鎮節度使特庫音徳爾水人軀幹雄偉敢戰鬬逹嚕噶城之役和尼䧟敵特庫救出之攻昭蘇城遼兵三千來拒特庫先登敗之攻魯庫營瑪竒墮馬特庫獨殺遼兵數軰掖而出之賞賚逾渥自臨潢班師至遼河伊都來襲羅索已引去特庫獨殿馬憊乃歩鬬羅索與數騎來救特庫止之曰我以一死捍敵公勿來俱斃無益遂没于陣皇統間贈明威將軍布庫徳宗室子初事國相薩哈伐蕭哈里有功與綽哈俱招降矩威水部族綽哈為穆昆布古徳領行軍千户從破黄龍府戰于逹嚕噶城皆有功寧江州渤海伊色布叛布古徳追復之天輔五年九月綽哈布古徳徃拜格河籍軍馬矩威水部錫勒哈塔等七人殺綽哈布古徳投其尸水中俱年四十三太祖悼惜遣使弔賻加等六年正月斡魯伐錫勒哈塔于希爾根河追及于哈逹拉山殺四人撫定餘衆詔斡魯求綽哈布古徳尸以𦵏天眷中贈綽哈奉國上將軍布古徳昭義大將軍綽哈亦宗室子也年十五𨽻軍從太祖伐遼率屯路兵招撫薩木丹鍚里肯巴噶三水拜格城邑皆降之敗室韋五百于阿爾噶城獲其民衆至是死焉鈕祜祿罕努以䕶衞從宗弼征伐賜鎧甲弓矢戰馬初太祖入居庸關遼林牙耶律達實自古北口亡去以其衆來襲奉聖州壁于龍門東二十五里羅索徃取之獲達實并降其衆宗望襲遼主輜重于青塜以達實為鄉導詔曰遼趙王實訥埓林牙逹實北王喀勒扎節度使額哩埒貝勒徹格爾招討達魯詳衮祿錦同知哈里及諸官民並釋其罪復詔斡魯曰林牙達實雖非降附其為鄉導有勞可明諭之時天輔六年也既而亡去不知所徃天㑹二年遼詳衮托卜嘉來降言達實稱王於北方署置南北面官僚有戰馬百匹畜産甚衆詔曰追襲遼主必酌事宜而行攻討達實須俟報下三年都統完顔希尹言聞夏人與耶律達實約曰大金既獲遼主諸軍皆將歸矣宜合兵以取山西諸部詔荅曰夏人或與達實合謀為釁不可不察其嚴備之七年泰州路都統博勒和奏達實已得北部二營恐後難制且近羣牧宜列屯戍詔答曰以二營之故發兵諸部必擾當謹斥候而已八年遣耶律伊都實嘉努巴爾斯追討達實徴兵諸部諸部不從實嘉努至烏納水而還伊都報元帥府曰聞耶律達實在和州之域恐與夏人合當遣使索之夏國報曰小國與和州壤地不相接且不知達實所徃也皇統四年囘紇遣使入貢言達實與其國相鄰達實已死詔遣罕努與其使俱徃因觀其國風俗加武義將軍奉使達實罕努去後不復聞問大定中回紇伊鍚蘭三人至西南招討司貿易自言本國回紇緅科畨部所居城名特古斯鄂爾多其俗業農無兵器所獲十分之一輸官耆老相傳先時契丹至不能拒因臣之契丹所居屯營乗馬行自旦至日中始周匝近嵗契丹使其女婿阿卜薩領兵五萬北攻頁布年等部族不克而還至今相攻未巳詔曰此人非𨽻朝廷畨部不須發遣可於咸平府舊有囘紇人中安置毋令失所而已是嵗展盤君長薩里罕托色率喀喇部長貝歡及户三萬餘求内附乞納前達實所降牌印受朝廷牌印詔西南招討司遣人慰問且觀其意圖哩伊都通事阿嚕岱至其國見薩里罕具言願歸朝廷乞降牌印無他意也因曰徃年大國嘗遣鈕祜禄罕努自和州徃使達實既入其境達實方適野與罕努相遇問罕努何人敢不下馬罕努曰我上國使也奉天子之命來招汝降汝當下馬聽詔達實曰汝單使來欲事口舌邪使人捽下使罕努跪罕努罵曰反賊天子不忍於爾加兵遣招汝爾縱不能面縛請罪闕下亦當盡敬天子之使乃敢反加辱乎達實怒乃殺之此時達實林牙已死子孫相繼西方諸部仍以達實呼之伊都阿嚕岱還奏并奏罕努事世宗嘉罕努忠節贈昭毅大將軍召其子永和縣商酒都監尚和汝州廵檢羅索諭之曰汝父奉使萬里不辱君命能盡死節朕甚閔之以尚和為尚輦局直長遷武義將軍羅索為武器署直長曹珪徐州人大定四年州人江志作亂珪子弼在賊黨中珪謀誅志并弼殺之尚書省議當補二官雜班叙詔曰珪赤心為國大義滅親自古罕聞也法雖如是然未足以當其功更進一官正班用之温特赫布敦為烏哲羣牧使西北路契丹薩巴等反諸羣牧皆應之布敦聞亂作選家奴材勇者數十人給以兵仗隂為之備賊不得發乃紿諸奴曰官閲兵器願借兵仗以應閲諸奴以為實然遂借與之明旦賊至布敦無以禦之賊執布敦而問之曰今欲反未布敦曰吾家世受國厚恩子姪皆仕宦不能從汝反而累吾族也賊怒臠而殺之子與孫皆與害是時達斡羣牧使圖克坦色副使特嘉和碩台伊囉斡羣牧使鶴壽額勒本羣牧使完顔珠勒呼副使完顔希卜蘇布塔布部副使持嘉和色里蘇穆坦乣詳衮瓜爾佳邁珠呼敦乣詳衮完顔蘇瑪喀鍚黙乣詳衮髙彭祖等皆遇害鶴壽鄲王昻子本名烏達布五院部人老和尚率衆來招鶴壽與俱反鶴壽曰吾宗室子受國厚恩寧殺我不能與賊俱反遂與二子皆被殺額哩頁契丹人為尚廐局直長大定初招諭契丹斡罕叱令額哩頁跪見額哩頁不從謂曰我朝廷使也豈可屈節於汝汝等早降可全性命若大軍至汝軰悔將何及斡罕怒曰汝本契丹人而不我從敢出是言遂害之從行驍騎軍士閏孫史大習馬實逹爾博多皆被害三年贈額爾頁宣武將軍録其子阿卜薩為外帳實逹爾閏孫史大皆贈修武校尉博多贈忠翊校尉納喇綽竒咸平路雅哈河明安人契丹瓜里使人招之綽竒不從𤓰里兵且至綽竒遂團結旁近村寨為兵出家馬百餘匹給之教以戰陣擊刺之法相與拒𤓰里于改渡口由是賊衆月餘不得進既而𤓰里兵四萬人大至綽竒拒戰賊兵十倍遂見執臠而殺之詔贈官兩階二子皆得用廕魏全壽州人泰和六年宋李爽圍壽州刺史圖克坦羲籍城中兵民及部曲厮役得三千餘人隨機拒守堅甚羲善撫御得衆情雖婦人皆樂為用同知布埒庫中流矢卒羲益勵不衰募人徃斫爽營全在選中為爽兵所執爽謂全曰若為我罵金主免若死全至城下反罵宋主爽乃殺之至死罵不絶口布薩揆遣河南統軍判官竒珠及邁格等以騎二千人救壽州去壽州十餘里與爽兵遇竒珠分兩翼夾擊爽兵大破之斬首萬餘級追奔至城下拔其三栅焚其浮梁羲出兵應之爽兵大潰赴淮死者甚衆爽與其副田林僅脱身去餘兵脱者十之四詔遷羲防禦使竒珠同知昌武軍節度使事邁格河南路統軍判官贈布埒庫昭勇大將軍官其子圖喇贈全宣武將軍䝉城縣令封其妻為鄉君賜在州官舍三間錢百萬俟其子年至十五嵗收充八貫石正班局分承應用所贈官䕃仍以全死節送史舘鏤板頒諭天下珊延宗室子為符寳袛侯完顔實古納為䕶衞十人長至寧元年八月赫舍哩執中作亂入自通𤣥門是日變起倉猝中外不知所為珊延實古納徃天王寺召大漢軍五百人赴難與執中戰於東華門外執中揚言曰大漢軍反矣殺一人者賞銀一錠執中兵衆大漢軍少二人不勝而死須㬰執中兵殺五百人殆盡執中死詔削官爵詔曰宣武將軍䕶衞十人長完顔實古納修武校尉符實祗候珊延忠孝勇果没于王事實古納贈鎮國上將軍順州刺史珊延贈宣武將軍順天軍節度副使嘗從拒戰明安賞錢五百貫穆昆三百貫佛寧散軍二百貫各遷兩階戰没者贈賞付其家實古納子尚㓜以八貫石俸給之俟年十五以聞瓜爾佳守中咸平人本名阿多古大定二十二年進士歴清池聞喜主簿補尚書省令史除刑部主事監察御史修起居注轉禮部員外郎大名治中歴嵩涿北京臨洮路按察副使以憂去官起復同知海蘭路兵馬都總管府事坐事謫韓州刺史尋復同知平京府事大安二年為秦州防禦使遷通逺軍節度使至寧末移彰德軍未行夏兵數萬入鞏州守中乗城備守兵少不能支城䧟官吏盡降守中獨不屈夏人壯之且誘且脅守中益堅遂載而西至平凉要以招降府人守中佯許至城下即大呼曰外兵矢盡且遁矣慎勿降夏人交刃殺之興定元年監察御史郭著按行秦中得其事以聞詔贈資善大夫東京留守仍收其子鄂摩為筆硯承奉舒穆魯元毅本名舒蘇咸平府路珠徹埒明安沙琿噶珊穆昆人以廕補吏部令史再調景州寧津令有劇盜白晝恣刼為民害元毅以術防捍賊散去入為大理知法除同知亳州防禦使事使省檄錄陜右五路刑獄無寃人復委受宋嵗幣故事有私遺物元毅一無所受明昌初驛召為大名等路提刑判官以最遷汾陽軍節度副使時石嵐間賊黨嘯聚肆行剽掠朝廷命元毅捕之賊畏而遁元毅追襲盡殪之二境以安遷同知武勝軍節度使事别郡有殺人者屢鞫不伏元毅訊不數語即具服河東北路田多山坂磽瘠大比時定為上賦民力久困朝廷命相地更賦元毅以三壤法平之民頼其利改彰德府治中尋以邉警授撫州刺史㑹邉將失守芻糧馬牛焚剽殆盡元毅率吏卒三十餘人出州經畫軍餉卒與敵遇州倅暨從吏堅請還元毅曰我軰責任邉守遇敵而奔其如百姓何縱得自安復何面目朝廷乎遂執弓矢令衆衆感其忠爭為效死元毅力戰射無不中敵去而復合元毅氣愈厲鏖戰乆之衆寡不敵遂遇害時年四十七事聞上深驚悼贈信武將軍召用其子世勣侍儀司承應世勣後登進士第奏名之日上謂宰臣曰此舒蘇子邪歎賞者乆之元毅性沉厚武勇過人毎讀書見古人忠義事未嘗不嗟歎賞慕喜動顔色故臨難能死所事云伯特梅和尚泰州人也性鯁直尚氣節正隆五年收克䕶衛授赫稜羣牧副使未幾復命召為䕶衞十人長改尚廐局副使轉本局使轉右衞將軍拱衞使典尚廐者十餘年積勞特遷官三階除復州刺史明昌初為西北路副招討使泰州防禦使升武勝軍節度使六年移鎮崇義軍時有事北邉左丞相瓜爾佳清臣行省于臨潢檄為副統㑹敵入臨潢梅和尚暨䕶衞博克托等領軍逆擊之敵積陣以待梅和尚直擣其陣殺傷甚衆敵知孤軍無繼聚兵圍之度不能免乃下馬相背射復殺百餘人矢盡猶以弓提擊為流矢所中死博克托等皆没上聞之震悼詔贈龍虎衞上將軍躐遷十階特賜錢二十萬命以禮𦵏之物皆官給以其子都努為軍前明安中使䕶䘮就差權同知臨潢府事李逹可為勅祭使同知德昌軍節度使事舒穆嚕和尚為勅𦵏使承安五年上諭尚書省曰梅和尚死王事其子都努從軍乆有功其議所以酬之乃命為典署丞烏克遜温屯上京路人大定末襲明安明昌七年以本兵充萬户備邉有功除歸德軍節度明使改盤安軍察亷遷同知率賓路節度使事以憂去官起復歸德府治中遷唐州刺史泰和六年四月宋皇甫斌歩騎萬人侵唐州温屯兵甚少遣泌陽尉博碩布廵檢布希各以五十人乗城拒守兀屯見宋兵在城東北者可破令軍事判官薩克達以精兵百人自西門出繞出東北宋兵營後掩擊之殺數千百人宋兵大亂迨夜乃遁去五月皇甫斌復以兵數萬來攻行省遣泌陽副廵檢納哈塔軍勝救唐州温屯出兵與軍勝合兵城東北設伏兵以待之乃分騎兵為三一出一入以致宋兵宋兵䧟于淖伏兵發中衝宋兵為二遂大潰追奔至湖陽斬首萬餘級獲馬三百匹宋别將以兵三千來襲遇之竹林寺殪之納哈塔軍勝手殺宋將取其金帶印章以獻詔遷温屯同知河南府事軍勝遷梁縣令各進兩階温屯賞銀三百五十兩重綵十端為右副元帥完顔匡右翼都統匡取棗陽遣温屯襲神馬坡宋兵五萬人夾水陣以强弩拒岸温屯分兵奪其三橋自辰至午連拔十三栅遂取神馬坡從攻襄至漢江温屯亂流徑度復進一階號平南虎威將軍宋人請和遷河南副統軍大安初遷昌武軍節度使副統軍如故遷西南路招討使温屯御下嚴酷軍士多亡杖六十除同知上京留守事大安三年將兵三萬入衞中都遷元帥右都監轉左都監兼北京留守有功賜金吐鶻重綵十端遷元帥左監軍留守如故貞祐元年閏月以兵入衛中都詔以兵萬六千人守定興軍敗温屯戰没髙守約字從簡遼陽人大定二十八年進士累官觀州刺史大元兵狥地河朔郭邦獻已歸順從至城下呼守約曰從簡當計全家室守約弗顧至再三守約厲聲曰吾不汝識也城破被執使之跪守約不屈遂死詔贈崇義軍節度使謚忠敬哈薩喇安禮字子敬本名酌大名路人頴悟博學淹貫經史大定二十八年進士至寧末為泰安州刺史貞祐初山東被兵郡縣望風而遁或勸安禮去之安禮曰我去城誰與守且避難負國家之恩乎乃團練繕完為禦守計已而大元兵至戰旬日不能下謂之曰此孤城耳内無糧儲外無兵援不降無遺類矣安禮不聼城破被執初不識某為誰或妄以酒監對安禮曰我刺史也何以諱為使之跪安禮不屈遂以戈撞其胷而殺之詔贈泰定軍節度使謚堅貞王維翰字之翰利州龍山人父庭遼季率縣人保縣東山後以衆降維翰好學不倦中大定二十八年進士調貴德州軍事判官察亷遷永覇令縣豪欲嘗試維翰設事陳訴維翰窮竟之遂伏其詐杖殺之健訟衰息歴𢎞政獲嘉令佐胥持國治河決有勞遷一階改北京轉運户籍判官補尚書省令史除同知保静軍節度使事檢括户籍一郡稱平屬縣有奴殺其主人者誣主人弟殺之刑部疑之維翰審讞乃微行物色之得其狀奴遂引服改中都轉運副使攝侍御史奏事殿中章宗曰佳御史就除侍御史改左司員外郎轉右司郎中布薩揆伐宋維翰行省左右司郎中泰和七年河南旱蝗詔維翰體究田禾分數以聞七月雨復詔維翰曰雨雖霑足秋種過時使多種蔬菜猶愈於荒莱也蝗蝻遺子如何可絶舊有蝗處來嵗宜菽麥諭百姓使知之八年宋人受盟還為右司郎中進官一階上問宋人請和復能背盟否維翰對曰宋主怠于政事南兵佻弱兩淮兵後千里蕭條其臣懲韓侂胄蘇師旦無復敢執其咎者不足憂也唯北方當勞聖慮耳乆之遷大理卿兼潞王𫝊同知審官院事新格教坊樂工階至四品換文武正資服金紫維翰奏伶優賤工衣縉紳之服非所以尊朝廷也從之大安初權右諫議大夫三司欲税間架維翰諫不聼轉御史中丞無何遷工部尚書兼大理卿改刑部尚書拜參知政事貞祐初罷為定海軍節度使是時道路不通維翰舟行遇盗呼謂之曰爾軰本良民因亂至此財物不惜勿恐吾家盗感其言而去至鎮無兵備鄰郡皆望風奔潰維翰謂吏民曰孤城不可守此州阻山浮海當有生地無俱為魚肉也乃縱百姓避難維翰率吏民願從者奔東北山結營堡自守力窮被執不肯降妻姚氏亦不肯屈與維翰俱死詔贈中奉大夫姚氏芮國夫人謚貞潔伊喇古尼安化軍節度使貞祐初大元兵取密州古尼乃率兵力戰流矢連中其頸既拔去復中其頰死焉貞祐三年詔贈安逺大將軍知益州府事宋扆中都宛平人也正隆五年進士歴辰州寧化州軍事判官曹王府記室參軍陜西西路轉運都勾判官補尚書省令史除武定軍節度副使中都右警廵使時固安縣丞劉昭與部民裴原爭買鄰田扆用昭屬抑原使毋爭御史臺劾奏奪一官解職降廣寧府推官改遼東路鹽使丁父憂起復吏部員外郎歴蘇曹景州刺史同知中都路轉運使事遷北京臨潢等路按察使改安國軍節度使河東南路轉運使御史劾其前任按察侵民舍不稱職降沂州防禦使移濬州遷山東西路轉運使改定海軍節度使貞祐二年改沁南軍正月大元兵至懐州城破死焉扆天資刻酷所至不容物以是蹭蹬於世云烏庫哩榮祖本名福興河間人明昌二年進士歴官補尚書省令史除都轉廵司都勾判官轉𢎞文校理升中都總管府判官察亷除震武軍節度副使彰德府司馬累遷户部員外郎寧海州刺史貞祐二年城破榮祖猶力戰死之贈安武軍節度使賜謚毅勇烏庫哩仲温本名呼喇葢州按春明安人大定二十五年進士累官太學助教應奉翰林文字河東路提刑判官改河北東路轉運副使御史薦前仕提刑稱職遷同知順天軍節度使事簽上京東京等路按察使事改提舉肇州漕運兼同知武興軍節度使事東勝州刺史坐前在上京不稱職降鎮寧軍節度副使改滑州刺史河東南路按察副使壽州防禦使貞祐初遷鎮西軍節度使是時中都被圍遂至太原移書安撫使賈益謙約以鄉兵救中都因馳驛如平陽將與益謙㑹于絳不能進抵平陽而還仲温嘗治平陽吏民爭留之仲温曰平陽巨鎮易為守禦於私計得矣如嵐州何遂還鎮已而大元兵大至城破不屈而死贈資徳大夫博索路兵馬都總管謚忠毅嵗時致祭玖珠宗室子為武州刺史唐古布格蘇為軍事判官貞祐二年十一月大元兵取玖珠子姪抵城下謂之曰山東河北今皆降我汝之家屬我亦得已苟不速降且殺之也玖珠曰當以死報國遑恤家為無何城破力戰而死布格蘇亦不屈死焉詔贈玖珠臨海軍節度使加驃騎衞上將軍布格蘇建州刺史加鎮國上將軍仍令樹碑嵗時致祭李演字巨川任城人泰和六年進士第一除應奉翰林文字再丁父母憂居鄉里貞祐初任城被兵演墨衰為濟州刺史畫守禦策召集州人為兵搏戰三日衆皆市人不能戰迯散演被執大將見其冠服非常且知其名問之曰汝非李應奉乎演荅曰我是也使之跪不肯以好語撫之亦不聼許之官禄演曰我書生也本朝何負於我而利人之官禄哉大將怒擊折其脛遂曵出殺之時年三十餘贈濟州刺史詔有司為立碑云劉德基大興人貞祐元年特賜同進士出身守官邊邑夏兵攻城德基坐㕔事積薪其傍謂家人曰城破即焚我及城破其家人不忍縱火遂被執脅使跪降德基不屈同僚故人紿夏人曰此人素病狂故敢如此德基曰為臣子當如此爾吾豈狂邪夏人壯其義乃繫諸獄冀其改圖已而召問德基大罵終不能從曰吾豈苟生者哉遂害之贈朝列大夫同知通逺軍節度使事王毅大興人經義進士累官東明令貞祐二年東明圍急毅率民兵願戰者數百人拒守城破毅猶率衆抗戰力窮被執與縣人王八等四人同驅之郭外先殺二人王八即前跪將降毅以足踣之厲聲曰忠臣不佐二主汝乃降乎驅毅者以刃斫其脛毅不屈而死贈曹州刺史王晦字子明澤州髙平人少負氣自憙常慕張詠之為人友妻與人有私晦手刃殺之中明昌二年進士調長葛主簿有能聲察亷除遼東路轉運司都勾判官提刑司舉其能轉北京轉運户籍判官遷安陽令累除簽陜西西路按察司事改平凉治中召為少府少監遷户部郎中貞祐初中都戒嚴或舉晦有將帥才俾募人自將得死士萬餘統之率所統衞送通州粟入中都有功遷霍王傅以部兵守順州通州圍急晦攻牛欄山以解通州之圍賜賚優渥遷翰林侍讀學士加勸農使九月順州受兵晦有别部在滄景遣人突圍召之衆皆踴躍思奮而主者不肯發王臻晦之故部曲也免胄出見且拜曰事急矣自苦何為苟能相從可不失富貴晦曰朝廷何負汝邪臻曰臻雖負國不忍負公因泣下晦叱曰吾年六十致位三品死則吾分詎從汝邪將射之臻掩泣而去無何將士縋城出降晦被執不肯降遂就死初晦就執謂其愛將牛斗曰若能死乎曰斗䝉公見知安忍獨生併見殺詔贈榮禄大夫樞密副使仍命有司立碑嵗時致祭録其子汝霖為筆硯承奉齊鷹揚淄州軍事判官楊敏中屯留縣尉致仕張乞驢淄州民貞祐初大兵兵取淄州鷹揚等募兵備禦城破率衆巷戰鷹揚等三人創甚被執欲降之鷹揚伺守者稍怠即起奪槊殺數人敏中乞驢皆不屈以死詔贈鷹揚嘉毅大夫淄州刺史仍立廟于州以時致祭敏中贈昭勇大將軍同知横海軍節度使事乞驢特贈宣武將軍同知淄州軍州事珠嘉佛新薊州明安人官至北京副留守貞祐二年為提控與同知順州軍州事温特赫伊扎爾俱守密雲縣佛新家屬在薊州大元兵得之以示佛新曰若速降當以付汝否則殺之佛新曰吾事本朝受厚恩戰則速戰終不能降也豈以家人死生為計耶城破死于陣伊札爾被執亦不屈而死盤安軍節度判官富察濟色與雞澤縣令温特赫實芳努同守薊州衆潰而出濟色實芳努死之詔贈佛新開府儀同三司樞密副使封宿國公伊扎爾鎮國上將軍順州刺史濟色金紫光禄大夫薊州刺史實芳發鎮國上將軍薊州刺史仍命樹碑以時致祭髙錫字永之德基子以廕補官積勞調淄州酒使課最遷萍鄉令察亷遷遼東路轉運度支判官太倉使法物庫使兼尚林署直長提舉都城所歴北京遼東轉運副使同知南京路轉運使事貞祐初累遷河北東路按察轉運使城破遂自投城下而死金史卷一百二十一
