body:
  text: 金史卷七十五元中書右丞相總裁托克托等修列傳第十三盧彦倫子璣孫亨嗣毛子亷本名巴克實李三錫孔敬宗李師夔沈璋左企弓虞仲文曹勇義康公弼附左泌弟淵姪光慶盧彦倫臨潢人遼天慶初蕭貞一留守上京置為吏以材翰稱是時臨潢之境多盗而城中兵無統屬者府以彦倫為材薦之於朝即授殿直勾當兵馬公事遼兵敗於珠赫店還至臨潢散居民家今給飬之而軍士縱恣侵擾無所不至百姓殊厭苦之留守耶律徹格爾不能禁戢乃召軍民諭之曰契丹漢人久為一家今邊方有警國用不足致使兵士久溷父老間有侵擾亦當相容衆皆無敢言者彦倫獨曰兵興以來民間財力困竭今復使之養士以國家多故義固不敢辭而此軰敢為强暴人不能堪且番漢之民皆赤子也奪此與彼謂何初取臨潢軍中有辛額特埓者舊為臨潢驛吏與彦倫善使徃詔諭彦倫殺之遼授彦倫團練使勾當留守司公事天輔四年彦倫從留守托卜嘉出降授夏州觀察使權發遣上京留守事師還托卜嘉以城叛彦倫乃率所部逐托卜嘉盡殺城中契丹遣使來報未幾遼將耶律瑪格以兵取臨潢彦倫拒守者七月㑹援兵至敵解圍去因赴闕天㑹二年知新城事城邑初建彦倫為經畫民居公宇皆有法改静江軍節度留後知咸州烟火事未幾遷静江軍節度使天眷初行少府監兼都水使者充提㸃京城大内所改利涉軍節度使未閲月還復為提㸃大内所彦倫性機巧能迎合悼后意由是頗見寵用嵗餘遷侍衛親軍馬部軍都指揮使為宋國嵗元使改禮部尚書加特進封郇國公天徳二年出為大名尹明年詔彦倫營造燕京宫室以疾卒年六十九子璣璣字正甫以䕃補閤門祗候累遷客省使兼東上閤門使改提㸃太醫教坊司天充大定十五年宋主生日副使遷同知宣徽院事丁母憂起服太府監改開逺軍節度使入為右宣徽使章宗即位轉左宣徽使致仕明昌四年起服左宣徽使改定武軍節度使復為左宣徽使是時璣年已七十詔許朝㕘得坐於廊下復致仕泰和初詔璣天壽節預宴二年元妃李氏生皇子滿三月章宗以璣老而康强命以所策杖為洗兒禮物章宗幸玉泉山詔璣與致仕宰相俱㑹食許策杖給扶後預天壽節上命璣與大臣握槊戯璣獲勝焉從上秋山賜名馬上曰酬卿愽直其眷遇如此秦和六年卒年八十子亨嗣亨嗣字繼祖以廕補閤門祗候内供奉調同監平涼府醋務改同監天山鹽場丁母憂服闋監萊州酒課累調監豐州任丘汲縣東平酒務課最遷白登縣令明昌四年行六部差規措軍前糧料入為典給直長改西京户籍判官厯官西京中都太倉使中都户籍判官尚醖署丞丁父憂大安初復為典給署丞兼太子家令崇慶元年遷同知順天軍節度使事是時兵興徴調煩急亨嗣以辨最遷定遠大將軍入為户部員外郎貞祐二年遷莒州刺史三年山東宣撫司討楊安兒亨嗣行六部兵罷還州興定二年卒年六十一亨嗣與弟亨益盡友愛之道亨嗣初以祖廕得官大定十六年父璣為同知宣徽院事當廕子亨嗣以讓弟亨益亨益早卒子兟兟幼稚亨嗣盡以舊業田宅奴畜財物與之毛子亷本名巴克實臨潢長泰人材勇善射遼季盜起募勇士子亷應募遼主召見賜甲仗率百人㑹所在官兵捕盜以功授東頭供奉官賜良馬天輔四年遣穆昆辛額特垺伊喇庫色勒招諭臨潢子亷率户二千六百來歸就領其衆佩銀牌招未降軍民盧彦倫怒子亷先降殺子亷妻及二子使騎兵二千伺取子亷子亷與庫色勒經險阻騎兵圍之兩騎突出直犯子亷子亷引弓斃其一人其一人挺槍㡬中子亷腋子亷避其槍與搏戰生擒之乃彥倫健將孫延壽也餘衆潰去天會三年除上京副畱守久之兼鹽鐵事天眷中除燕京麴院都監遼王宗幹問宰相曰子亷有功何為下遷宰相以例對宗幹曰盧彥倫何不除此職子亷之功十倍彥倫在臨潢十餘年吏民畏愛如一日誰能及此是時盧彥倫已以少府監除節度使故宗幹引以為比除寧昌軍節度使海陵弑熙宗子亷聞之歎曰曾不念國王定策之功耶乃致仕大定二年卒李三錫字懷邦錦州安昌人以貲得官遼季盜功錦州州人推三錫主兵事設機應變城頼以完録功授左承制遼主走天徳劉彦宗辟三錫將兵保白雲山金兵次來州三錫以其衆降攝臨海軍節度副使叅預元帥府軍事改知嚴州宗望伐宋三錫領行軍明安敗郭藥師軍於白河進官汝州防禦使再克汴京三錫從棟摩護宋二主北歸復知嚴州改歸徳軍節度副使詔廢齊國擇吏二十人與俱行三錫在選中還為慶州刺史三遷武勝軍節度使察亷第一遷三階改安國軍節度使除河北西路轉運使致仕三錫政事强明所至稱治世宗舊聞其名大定初起為北京路都轉運使制下而三錫已卒孔敬宗字仲先其先東垣人石晉末徙遼陽遼季敬宗為寧昌劉宏幕官烏楞古兵至境上敬宗勸劉宏迎降遂以敬宗為鄉導㧞顯州以功補順安令天輔二年詔敬宗與劉宏率懿州民徙内地授世襲明安知安州事將兵千人從宗望伐宋汴京平宗望命敬宗守汴嘗自汴馳驛至河北還至河上會日暮無舟敬宗策馬亂流遂達南岸遷静江軍節度使厯石辰信磁四州刺史階光祿大夫海陵問張浩曰卿識孔敬宗否何階髙職下也浩對曰國初敬宗勸劉宏以懿州効順其後從軍積勞有司不知故一槩常調耳明日除寧昌軍節度使徙歸德軍致仕大定二年卒李師夔字賢佐奉聖州永興人倜儻有大志以廕入仕為本州麴監天輔六年太祖襲遼主於鴛鴦濼郡守委城遁去衆無所屬相與叩門請師夔主郡事師夔許之搜卒治兵都古嚕訥兵至奉聖州師夔與其故人沈璋宻謀出降曰一城之命懸於此舉璋曰君言是矣如軍民不從奈何師夔即率親信十數軰詰旦出城見伊都與之約曰今已服從願無以兵入城及俘掠境内伊都許諾詔以師夔領節度以璋佐之賜師夔駿馬二俾招未附者許以便宜從事明年加左監門衞大將軍劇賊張勝以萬人逼城師夔度衆寡不敵乃偽與之和日致饋給勝信之師夔乘其不備使人刺勝殺之以其首徇曰汝軰皆良民䝱從至此今元惡已誅可棄兵歸復其所賊衆大驚皆散去别賊焦望天尹智穆率兵數千來寇師夔以兵臨之設伏歸路使人反間之智穆果疑望天先引去智穆勢孤亦還遇伏而敗遂執斬之是後賊衆不敢入境以勞遷静江軍節度畱後累遷武平軍節度使改東京路轉運使徏陜西東路轉運使致仕封任國公卒年八十五沈璋字之達奉聖州永興人學進士業都古嚕訥軍至上谷璋與李師夔謀開門迎降明日擇可為守者衆皆推璋璋固稱李師夔於是授師夔武定軍節度使以璋副之授太常少卿遷鴻臚卿丁母憂起復山西路都轉運副使加衞尉卿從伐宋汴京平衆爭趨貲貨璋獨無所取惟載書數千卷而還太行賊䧟潞州殺共守姚璠官軍討平之命璋權知州事璋至招復逋逃賑養困餓收其横屍葬之未幾民頗安輯初賊黨據城潞之軍卒當緣坐者七百人帥府牒璋盡誅之璋不從帥府聞之大怒召璋呵責且欲殺璋左右震恐璋顔色不動從容對曰招亡撫存璋之職也此軰初無叛心葢為賊所䝱有不得已者故招之復來今欲殺之是殺降也苟利於衆璋死何憾少頃怒解因召潞軍曰吾始命戮汝今汝使君活爾矣皆感泣而去朝廷聞而嘉之拜左諫議大夫知潞州事百姓為之立祠移知忻州改同知太原尹加尚書禮部侍郎時介休人張覺聚黨亡命山谷鈔掠邑縣招之不肯降曰前嘗有降者皆殺之今以好言誘我是欲殺我耳獨得侍郎沈公一言我乃無疑於是命璋往招之覺即日降轉尚書吏部侍郎西京副畱守同知平陽尹遷利涉軍節度使為東京路都轉運使改鎮西軍節度使天徳元年以病致仕卒年六十子宜中天徳三年賜楊建中牓及第贊曰危難之際兩軍方爭專城之將國家之輕重繫焉李師夔非有君命為衆所推又能全活其人猶有説也盧彥倫之降雖云城潰初志不確何尤乎毛子亷至如子亷不仕海陵沈璋以片言降張覺一善足稱何可掩也左企弓字君財八世祖皓後唐棣州刺史以行軍司馬戍燕遼取燕使守薊因家焉企弓讀書通左氏春秋中進士再遷來州觀察判官蕭英弼賊昭懷太子窮治黨與多連引企弓辨析其冤免者甚衆自御史知雜事出為中京副畱守按刑遼陽有獄本輕而入之重者已奏待報企弓釋之以聞累遷知三司使事天慶末拜廣陵軍節度使同中書門下平章事知樞宻院事金兵已㧞上京北樞宻院恐忤㫖不以時奏遼故事軍政皆闗決北樞宻院然後奏御企弓以聞遼主曰兵事無乃非卿職邪對曰國勢如此豈敢循例為自容計因陳守備之策拜中書侍郎平章事監修國史時遼主聞金已克中京將西幸以避之企弓諫不聴遼主自鴛鴦濼亡保陰山秦晉國王耶律聶哷自立于燕廢遼主為湘陰王改元徳興企弓守司徒封燕國公虞仲文參知政事領西京畱守同中書門下平章事内外諸軍都統曹勇義中書侍郎平章事樞宻使燕國公康公弼參知政事簽樞密院事賜號忠烈翊聖功臣徳妃攝政企弓加侍中宋兵襲燕奄至城中已而敗走或疑有内應者欲根株之企弓爭之乃止太祖至居庸闗蕭妃自古北口遯去都監髙陸等送欵于太祖太祖徑至城下髙陸等開門待之太祖入城受降企弓等猶不知太祖駐蹕燕京城南企弓等奉表降太祖俾復舊職皆受金牌企弓守太傅中書令仲文樞密使侍中秦國公勇義以舊官守司空公弼同中書門下平章事樞密副使權知院事簽中書省封陳國公遼致仕宰相張琳進上降表詔曰燕京應琳田宅財物並給還之琳年髙不能入見止令其子弟來太祖既定燕從初約以與宋人企弓獻詩畧曰君王莫聴捐燕議一寸山河一寸金太祖不聽是時置樞密院於廣寧府企弓等將赴廣寧張覺在平州有異志太祖欲以兵送之企弓等辭兵曰如此是促之亂也及過平州舍於栗林下張覺使人殺之企弓年七十三諡恭烈天會七年贈守太師遣使致奠正隆二年改贈特進濟國公虞仲文字質夫武州寧逺人也七歲知作詩十歲能屬文日記千言刻苦學問第進士累仕州縣以亷能稱舉賢良方正對策優等擢起居郎史館修撰三遷至太常少卿宰相有左降仲文獨出餞之或指以為黨仲文乃求養親久之召復前職宰相薦文行第一權知制誥除中書舍人討平白霫拜樞密直學士權翰林學士為翰林侍講學士年五十五卒諡文正天會七年贈兼中書令正隆二年改贈特進濮國公曹勇義廣寧人第進士除長春令樞府辟令史上書陳時政累擢館閣遷樞密副都承㫖權燕京三司使加給事中召為樞密副使加太子少保與大公鼎虞仲文龔誼友善與虞仲文同在樞密羣小擠之復出為三司使加宣政殿大學士卒諡文莊天會七年贈守太保正隆二年改贈特進定國公康公弼字伯迪其先應州人曽祖𦙍遼保寧間以戰功授誓劵家於燕之宛平公弼好學年二十三中進士除著作郎武州軍事判官辟樞府令史求外補出為寧逺令縣中隕霜殺禾稼漕司督賦急繫之獄公弼上書朝廷乃釋之因免縣中租賦縣人為立生祠監平州錢帛庫調役糧于川州大盜侯槩䧟川州使䕶送公弼出境曰良吏也權乾州節度使卒諡忠肅天會七年贈侍中正隆二年改贈特進道國公企弓子泌瀛淵泌字長源企弓長子也仕遼官至棣州刺史太祖平燕泌從企弓歸朝既而東遷至平州企弓為張覺所害泌復還燕是時以燕與宋宣撫司遣至汴泌以平州仇人在是乃間道奔還朝廷嘉之擢西上閤門使從宋王宗望南伐破真定有功知祁州厯刺澤隰等州貞元初為濬州防禦使遷陜西路轉運使封戴國公泌性夷澹好讀莊老年六十一即請致仕親友或以為早泌嘆曰予年三十秉旄鉞侵尋仕路又三十年名遂身退可矣時人髙之卒年七十四淵累官燕京副畱守中京路都轉運使厯河北東路中都路都轉運使淵貪鄙三任漕事務以錢榖自營在中都凡八年不求遷與李通許霖交闗賄賂詭納漕司諸物規取財利世宗即位淵使其子貽慶詣東京上表特賜貽慶任忠傑牓第三甲進士授從仕郎貽慶還中都世宗詔淵曰凡殿位張設悉依舊毋增益不得役使一夫以擾百姓謹宫禁出入而已大定二年改泌南軍節度使世宗素知其為人戒之曰卿宰相子練習朝政前為漕司朕甚鄙之毋或刻削百姓若復敢爾勿思再用淵到懷州未幾坐前為中都轉運嘗盜用官材木除名子光慶光慶字君錫幼穎悟沉厚少言淵嘗謂所親曰世吾家者此子也以廕補閤門祗候遷西上閤門副使丁父憂起復東上閤門副使再轉西上東上閤門使兼太廟署令光慶好古讀書識大義喜為詩善篆隸尤工大字世宗行郊禮受尊號及受命寶皆光慶篆凡宫廟牓署經光慶書者人稱其有法典領原廟坤厚陵壽安宫工役不為苛峻使勞逸相均身兼數職勤慎周密未嘗自伐世宗獨察之初御史大夫璋請製大金受命寶有司以秦璽文進上命以大金受命萬世之寶為文徑四寸八分厚一寸四分蟠龍紐髙厚各四寸六分有半禮部尚書張景仁少府監張僅言典領工事詔光慶篆之遷同知宣徽院事改少府監丁母憂起復右宣徽使世宗幸上京光慶往上京治儀仗制度時人以為得宜二十五年卒年五十一上遣使致祭賻銀三百兩重練十端絹百疋平時喜為善言蓄善藥號善善道人晩信浮屠法自作真贊語皆任達云贊曰左企弓虞仲文曹勇義康公弼四子者皆有才識之士其事遼主數有論建及其受爵僣位委質二君隕身逆黨三者胥失之哀哉金史卷七十五
