body:
  text: 金史卷三十六元中書右丞相總裁托克托等修志第十七禮九國初即位儀朝参常朝儀受尊號儀肆赦儀上壽儀詔儀臣下拜國初卽位儀收國元年春正月壬申朔諸路官民耆老畢會議創新儀奉上卽皇帝位阿里罕宗翰乃為陳耕其九祝以闢土養民之意復以良馬九隊隊九疋别為色并介胄弓矢矛劍奉上國號大金建元收國天會元年九月六日皇弟安班貝勒卽皇帝位已未告祀天地丙寅大赦改元受尊號儀皇統元年正月二日太師宗幹率百僚上表請上皇帝尊號凡三請詔允七日遣上京留守奭告天地社稷析津尹宗强告太廟十日帝服衮冕御元和殿宗幹率百僚恭奉冊禮冊文云云臣等謹奉玉冊玉寳上尊號曰崇天體道欽明文武聖徳皇帝是日皇帝改服通天冠宴二品以上官及高麗夏國使十二日恭謝祖廟還御宣和門大赦改元大定七年恭上皇帝尊號前三日遣使奏告天地宗廟社稷前二日諸司停奏刑罰文字百官習儀於大安殿庭兵部帥其屬設黄麾仗放大安殿門之内外宣徽院帥儀鸞司於前一日設受冊寳壇於大安殿中間又設御榻於壇上又設冊寳幄次於大安殿門外及設皇太子幕次於殿東廊又設羣官次于大安門外大樂令與恊律郎前一日設宫縣于殿庭又設登歌樂架于殿上立舞表于殿下符寳郎其日俟文武羣官入奉八寳置于御座左右候上冊寳訖復舁寳還所司其日質明奉冊太尉奉寳司徒讀冊中書令讀寳侍中以次應行事官並集於尙書省俟冊寳興乘馬奉迎冊寳至應天門下馬由正門步導入至大安殿門外置冊寳於幄次舁冊寳床弩手人等分立於左右文武羣官並朝服入次攝太常卿與大樂令帥工人入就位恊律郎各就舉麾位舁冊寳案官由西偏門先入置案於殿東西間褥位置訖各退于西階冊寳位後捧冊官捧寳褥位冊匣官舁寳盝官由西偏門先入至殿西階下冊寳褥位之西東向立俟閤門報通事舎人引攝侍中版奏中嚴訖典儀賛者各就位閤門官引文武百僚分左右入於殿階下磚道之東西相向立符寳郎奉八寳由西偏門分入升置殿上東西間相向訖分左右立於寳後通事舎人引攝侍中版奏外辦扇合服衮冕以出曲直甲蓋侍衞警蹕如常儀殿上鳴鞭訖殿下亦鳴鞭初索扇恊律郎跪俛伏興舉麾工鼓柷奏乾寧之曲出自東房卽座儀使副添香爐煙升扇開簾捲恊律郎偃麾戞敔樂止太常卿士通事舎人自冊寳幄次分引冊太常卿前導吏部侍郎押冊而行奉冊太尉讀冊中書令舉冊官於冊後以次從之次太常博士通事舎人二員分引寳禮部侍郎押寳而行奉寳司徒讀寳侍中舉寳官於寳後以次從之由正門入宫縣奏歸美揚功之曲太常卿於冊床前導至第一墀香案南藉寳冊褥位上少置太常卿與舉冊寳官退於冊寳稍西東向立應博士舎人立於其後舁寳寳床弩手繖子官等又於其後皆東向太尉司徒中書令侍中皆於冊後面北以次立吏部侍郎禮部侍郎次立於其後立定樂止閤門舎人分引東西兩班羣官合班轉北向立中間少留班路俟立定太常博士通事舎人四員分引太尉司徒中書令侍中吏部禮部侍郎以次各復本班訖博士舎人退以俟初引時樂奏歸美揚功之曲至位立定樂止典儀曰拜贊者承傳太尉以下應在位官皆舞蹈五拜班首出班起居訖又贊再拜如朝㑹常儀太常博士通事舎人四員再引太尉司徒中書令侍中吏禮部侍郎復進至冊寳所稍南立定舁冊寳床弩手繖子官並進前舉冊寳床興太常博士通事舎人二員分引冊太常卿前導更部侍郎押冊而行奉冊太尉讀冊中書令舉冊官於冊後以次從之冊初行樂奏肅寜之曲次通事舎人太常博士又二員分引寳禮部侍郎押寳而行奉寳司徒讀寳侍中舉寶官於寶後以次從之詣西階下至冊寳褥位少置冊北寳南樂止舁冊寳床弩手繖子官等退於後稍西東向立捧冊官與舁冊官並進前取冊匣升太常博士通事舎人分引冊太常卿側身導冊先升奉冊太尉讀冊中書令舉冊官捧冊官於冊後以次從升冊初行樂奏肅寧之曲進至殿上博士舎人分左右於前楹立以俟讀冊中書令於欄子外前楹稍西立以俟舉冊官捧冊官立於其後奉冊太尉從升至褥位搢笏少前跪置訖執笏俛伏興樂止退於前楹稍西立以俟太常博士立於後太常卿少退東向立舁冊官立於其後皆東向捧冊官先入舉冊官次入讀冊中書令又次入捧冊官四員皆搢笏䨇跪捧舉冊官二員亦搢笏兩邊單跪對舉中書令執笏進跪稱中書令臣某讀冊讀訖俛伏興中書令俟冊興先退通事舎人引降自東階復本班訖太常卿降復寳床前舁冊官並進與捧冊官等取冊匣興置於殿東間褥位案上西向捧舉冊官等降自東階還本班舁冊官亦退太常博士引奉冊太尉降自西階東向立以俟次捧寶官與舁寶官俟讀冊中書令讀訖出並進前取寶盝升太常博士通事舎人分引寶太常卿側身導寶先升奉寶司徒讀寶侍中舉寶官捧寶官於寶後以次從升寶初行樂奏肅寜之曲進至殿博士士舎人俱退不升並於前楹稍西立俟讀寶侍中於欄子外前楹間稍西立以俟舉寶官捧寶官立於其後奉寶司徒從升至褥位搢笏少前跪置訖執笏俛伏興樂止司徒退於前楹西立以俟太常卿少退東向立舁寶官立於其後皆東向捧寶官先入舉寶次入入讀寶侍中又次入捧寶官四員皆搢笏雙跪捧舉寳官二員亦搢笏兩邊單跪對舉侍中執笏進跪稱侍中臣某讀寳讀訖俛伏興侍中俟寳興先退通事舎人引降自西階復本班訖舁寶官進前與捧寶舉寶官等取寳盝興置於殿之西間褥位案上東向捧寶舉寳官等與太常卿俱降自西階及吏部侍郎皆復本班舁寶官亦退太常博士引奉寶司徒次奉冊太尉東向立定博士舎人贊引太尉司徒進詣第一墀香案南褥位立定博士舎人稍退典儀曰拜贊者承傳在位官皆再拜訖博士舎人二員引太尉詣東階升宫縣奏純誠享上之曲至階止閤門使二員引太尉進至前立定樂止閤門使揖贊太尉拜跪賀殿下閤門揖百僚躬身太尉稱文武百僚具官臣等言致賀詞云云俛伏興退至階上博士舎人分引太尉降至東階初降宫縣作肅寧之曲復香案南褥位立定樂止博士舍人少退典儀曰拜贊者承𫝊太尉司徒及在位羣官俱再拜舞蹈三稱萬歳又再拜訖通事舎人引攝侍中升自東階前楹間躬承㫖退臨階西向稱有制典儀曰拜贊者承𫝊太尉司徒及在位羣官俱再拜躬身宣詞云云宣訖通事舎人引侍中還位典儀曰拜贊者承𫝊階上下應在位羣官俱再拜舞蹈三稱萬嵗又再拜訖博士舎人分引太尉司徒就百僚位初引宫縣作肅寧之曲至位立定樂止閤門舎人分引應北面位羣官各分班東西相向立定通事舎人引攝侍中升自東階當前楹間跪奏禮畢俛伏興引降還位扇合簾降恊律郎俛伏興舉麾工鼓柷奏乾寧之曲降座入自東房還後閤進膳侍衞警蹕如儀扇開樂止捧冊官帥舁冊床人捧寶官帥舁寶床人皆升殿取匣盝蓋訖置於床前引進司官前導通事舎人贊引詣東上閤門上進通事舎人分引文武百僚等以次出歸幕次賜食以俟上壽上冊寶禮畢有司供辦御床及與宴羣官位並如曲宴儀攝太常卿與大樂令帥工人入并恊律郎各就舉麾位俟舎人報通事舎人引三師以下文武百僚親王宗室等分左右入至殿階下稍南東西相向立通事舎人先引攝侍中版奏中嚴少頃又奏外辦扇合鳴鞭恊律郎跪俛伏興工鼓柷宫縣奏乾寧之曲服通天冠絳紗袍卽座簾捲内侍賛扇開殿上下鳴鞭戞敔樂止儀使副等添香爐煙升通事舎人引班首以下合班樂奏肅寧之曲至北向位重行立定中間少留班路通士舎人引攝侍中詣東階升至殿上少立閤門舎人引禮部尙書出班前北向俛伏跪奏稱禮部尙書臣某言請允羣臣上壽俛伏興躬身通事舎人引攝侍中少退舎人賛禮部尙書再拜訖賛祗候復本班内侍局進御床人次良醖令於殿下横階南酹酒訖典儀曰拜賛者承傳在位官皆再拜隨拜三稱萬歳訖平立太常博士通事舎人分引攝上公由東階升初升宫縣奏肅寧之曲殿上舎人少退二閤使揖上公進至進酒褥位樂止宣徽使以爵授上公上公搢笏受爵詣榻前跪進受爵訖上公執槃授宣徽使訖二閤使揖上公入欄子内賛拜跪殿下閤門揖百僚皆躬身通事舎人揖攝侍中進詣前楹間躬承㫖退臨階西向稱有制典儀曰拜賛者承傳上公及在位羣官皆再拜隨拜三稱萬歲訖躬身宣曰得公等壽酒與公等内外同慶閤門舎人賛宣諭訖上公與百僚皆舞蹈五拜訖閤門舎人引百僚分班東西序北向立博士舎人再引上公自東階升宫縣奏肅寧之曲至進酒褥位樂止上公搢笏宣徽使授上公槃上公詣欄子内褥位跪舉酒宫縣奏景命萬年之曲飲訖樂止上公進受虚爵訖復褥位以爵授宣徽使訖二閤使揖上公退内侍局舁御床出博士舎人並進前分引降自東階宫縣奏肅寧之曲閤門舎人分引東西兩班隨上公俱復北向位立定樂止典儀曰拜賛者承傳在位官皆再拜三稱萬歲訖平立殿上通事舎人揖攝侍中進詣前楹間躬承㫖退臨階西向閤門官先揖百僚躬身侍中稱有㫖典儀曰拜賛者承傳在位官皆再拜訖躬身宣曰延王公等升殿典儀曰拜賛者承傳在位官皆再拜訖搢笏舞蹈又再拜訖太常博士通事舎人引王公以下合赴宴羣官分左右升殿不與宴羣官分左右捲班出宫縣奏肅寜之曲百僚至殿上坐後立樂止内侍局進御床入依尋常宴㑹再進第一爵酒登歌奏聖徳昭明之曲飲訖樂止執事者行羣官酒宫縣作肅寧之曲文舞入觴行一周樂止尙食局進食執事者設羣官食宫縣奏保大定功之舞三成止出又進第二爵酒登歌奏天賛堯齡之曲飲訖樂止執事者行羣官酒宫縣作肅寧之曲武舞入觴行一周樂止尙食局進食執事者設羣官食宫縣奏萬國來同之舞三成止出又進第三爵酒登歌奏慶雲之曲飲訖樂止執事者行羣官酒宫縣作肅寧之曲觴行一周樂止尚食局進食執事者設羣官食宫縣奏肅寧之曲食畢樂止閤門官分揖侍宴羣官起立於席後通事舎人引攝侍中詣榻前俛伏興跪奏侍中臣某言禮畢俛伏興閤門舎人分引羣官俱降東西階内侍局舁御床出宫縣作肅寧之曲至北向位立定樂止興儀曰拜賛者承傳在位官皆再拜訖搢笏舞蹈又再拜訖再分班東西序立扇合簾降殿上下鳴鞭恊律郎俛伏跪舉麾興工鼓柷奏乾寧之曲降座入自東房還後閤侍衞如來儀内侍贊扇開戞敔樂止通事舎人引攝侍中版奏解嚴所司承㫖放仗在位羣官皆再拜以次出元日聖誕上壽儀皇帝陞御座鳴鞭報時畢殿前班小起居各復侍立位舎人引皇太子并臣僚使客合班入至丹墀舞蹈五拜平立閤使奏諸道表自皇太子以下皆再拜引皇太子升殿褥位搢笏捧盞盤進酒皇帝受置於案皇太子退復褥位轉盤與執事者出笏二閤使齊揖入欄子内拜跪致詞云元正啓祚品物咸新恭惟皇帝陛下與天同休若聖節則云萬春令節謹上壽巵伏願皇帝陛下萬歲萬歲萬萬歲祝畢拜興復褥位同殿下羣僚皆再拜宣徽使稱有制在位皆再拜宣荅曰履新上壽與卿等内外同慶聖節則曰得卿壽酒與卿等内外同慶詞畢舞蹈五拜齊立皇太子搢笏執盤臣僚分班敎坊奏樂皇帝舉酒殿上下侍立臣僚皆再拜皇太子受虚盞退立褥位轉盤與執事者出笏左下殿樂止合班在位臣僚皆再拜分引與宴官上殿次引宋國人從至丹墀再拜不出班奏聖躬萬福再拜喝有勅賜酒食有再拜各祗候平立引左廊立次引高麗夏人從如上儀畢分引左右廊立御果床入進酒皇帝飲則坐宴侍立