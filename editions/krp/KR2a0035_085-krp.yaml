body:
  text: 金史卷八十五元中書右丞相總裁托克托等修列傳第二十三世宗諸子永中本名薩喇勒永蹈本名尼楚赫永功本名桑阿子璹永徳本名恩楚永成本名哈雅永升本名錫卜察世宗昭徳皇后生顯宗趙王蘓尼越王薩魯元妃張氏生鄗王永中越王永功元妃李氏生鄭王永蹈衛紹王永濟潞王永徳昭儀梁氏生豫王永成才人舒穆嚕氏生夔王永升蘇尼薩魯皆早卒鎬王永中本名薩喇勒又名烏遜大定元年封許王五年判大興尹七年進封越王十一年進封趙王十三年拜樞密使十九年子實古納加光禄大夫是歳改葬明徳皇后于坤厚陵永中母元妃張氏陪葬十一月庚申自磐寧宮𤼵引永中以元妃柩先發使執黄繖者前導俄頃皇后柩出磐寧宫顯宗徒跣少府監張僅言呼執黄繖者不應既葬僅言欲奏其事顯宗解之曰是何足校哉或繖人誤耳僅言乃止二十一年改判大宗正事永中不悦顯宗勸之曰宗正之職自親及疎自近及逺此親賢之任也且皇子之貴豈以官職閑劇為計邪永中乃喜二十四年世宗幸上京顯宗居守并留永中顯宗先遣章宗宣宗奉表問起居于上京既而遣永中子光祿大夫實古納奉表世宗喜謂豫國公主曰皇太子孝徳天成先遣二子繼遣此子兄弟之際相友愛如此也二十五年六月世宗在天平山好水川清暑顯宗薨于中都詔曹王永功視章宗召永中赴行在是歳與章宗及永功等並加開府儀同三司二十六年復為樞密使是歳世宗賜諸孫名實古納曰瑜實圖美曰璋阿索美曰玘阿里罕曰瑑二十七年玘年十五以上加奉國上將軍章宗即位起復判西京留守封漢王與諸弟各賜金五百兩銀五千兩錢二千貫重幣三百端絹二千匹再賜永中修公廨錢三百萬加實古納銀青榮禄大夫阿里罕奉國上將軍明昌二年正月辛酉孝懿皇后崩判真定府事吳王永成判定武軍節度使隋王永升奔䘮後期各罰俸一月杖其長史五十永中適有寒疾不能至上怒頗意諸王有輕慢心遣使責永中曰已近公除亦不須來二月丙戌禫祭永中始至入臨辛卯始克行燒飯禮壬辰永中及諸王朝辭賜遺留物禮遇雖在而嫌忌自此始矣四月進封并王三年判平陽府事進封鎬王初置王傳府尉官名為官屬實檢制之也府尉希望風㫖過為苛細永中自以世宗長子且老矣動有掣制情思不堪殊鬱鬱乃表乞閒居詔不許四年鄭王永蹈以謀逆誅増置諸王司馬一員檢察門戸出入毬獵游宴皆有制限家人出入皆有禁防河東提刑判官伯勒赫私謁永中杖一百解職前近侍局副使費摩克爾森受永中請託為實古納求除官克爾森已改同知西京留守猶坐免故尚書右丞張汝弼永中母舅也汝弼妻髙托噶自大定間畫永中母像奉之甚謹挾左道為永中求福希覬非望明昌五年髙托噶坐詛祝誅上疑事在永中未有以發也㑹鎬王傳尉奏永中第四子阿里罕因防禁嚴密語渉不道詔同簽大睦親府事􅰇御史中丞孫即康鞫問并求得第二子實圖美所撰詞曲語不遜家奴徳格首永中嘗與侍妾瑞雪言我得天下子為大王以爾為妃詔遣官覆按狀同再遣禮部尚書張暐兵部侍郎烏庫哩慶裔覆之上謂宰臣曰鎬王秪以語言得罪與永蹈罪異參知政事馬琪曰永中與永蹈罪狀雖異人臣無將則一也上曰大王何故輙出此言左丞相清臣曰素有妄想之心也詔以永中罪狀宣示百官雜議五品以下附奏四品以上入對便殿皆曰請論如律惟宮籍監丞盧利用乞貸其死詔賜永中死實圖美阿里罕等皆棄市勑有司用國公禮收葬永中平陽府監䕶官給葬具妻子威州安置泰和七年詔復永中王爵賜諡曰厲勑實古納於威州擇地以禮改葬歳時祭奠貞祐二年詔徙永中妻子實古納等鄭州安置貞祐三年太康縣人劉全書為盗亡入衛真界詭稱愛王所謂愛王指實古納實古納實未嘗有王封小人妄以此目之劉全欲為亂因假託以惑衆誘王氏女為妻且言其子方聚兵河北東平人李寧居嵩山有妖術全同縣人時温稱寧可論大事乃使范元書偽號召之寧至推為國師議僣立事覺全温寧皆伏誅貞祐四年潼闗破徙永中子孫于南京興定二年亳州譙縣人孫學究私造妖言云愛王終當奮發今匿跡民間自號劉二衛真百姓王深等皆信以為誠然有劉二者出而當之遣歐榮軰結構逆黨市兵仗大署旌謀僣立事覺誅死者五十二人縁坐者六七十餘人永中子孫禁錮自明昌至于正大末幾四十年天興初詔弛禁錮未幾南京亦不守云鄭王永蹈本名尼楚赫初名實古爾大定十一年封滕王未期月進封徐王二十五年加開府儀同三司二十六年為大興尹章宗即位判彰徳軍節度使進封衛王明昌二年徙封鄭王三年改判定武軍初崔温郭諌馬太初與永蹈家奴畢慶夀私説䜟記災祥畢慶夀以告永蹈郭諌頗能相人永蹈乃召郭諌相已及妻子諌説永蹈曰大王相貎非常王妃及二子皆大貴又曰大王元妃長子不與諸王比也永蹈召崔温馬太初論䜟記天象崔温曰丑年有兵災屬兔命者來年春當收兵得位郭諌曰昨見赤氣犯紫㣲白虹貫月皆主丑後寅前兵戈僣亂事永蹈深信其説乃陰結内侍鄭两兒伺上起居以崔温為謀主郭諌馬太初徃來游説河南統軍使布薩揆尚永蹈妹韓國公主永蹈謀取河南軍以為助與妹澤國公主長樂謀使駙馬都尉富拉塔致書于揆且先請婚以觀其意揆拒不許結婚使者不敢復言不軌事永蹈家奴董夀諌永蹈不聴董夀以語同軰奴遷嘉努上變是時永蹈在京師詔平章政事完顔守貞參知政事胥持國戸部尚書楊伯通知大興府事尼瑪哈鑑鞫問連引甚衆乆不能決上怒召守貞等問狀右丞相𤓰爾佳清臣曰事貴速絶以安人心於是賜永蹈及妃卞玉二子安春愛新公主長樂自盡富拉塔崔温郭諌馬太初等皆伏誅布薩揆雖不聞問猶坐除名董夀免死隸監籍遷嘉努賞錢二千貫特遷五官雜班叙使自是諸王制限防禁密矣泰和七年詔復王封備禮改葬賜謚曰刺以衛王永濟子阿禪為永蹈後奉其祭祀越王永功夲名桑阿又名廣孫貞元二年生沉黙寡言笑勇健絶人涉書史好法書名畫大定四年封鄭王七年進封隋王十一年進封曹王十五年除刑部尚書上曰侍郎張汝霖汝外舅行也可學為政十七年授庫庫圖世襲明安十八年改大興尹世宗幸金蓮川始出中都親軍二蒼頭縱馬食民田詔永功蒼頭各杖一百彈壓百戸二人失覺察勒停上次望京淀永功奏曰親軍人止一蒼頭两彈壓服勤為日乆矣臣昧死違詔量決蒼頭使彈壓待罪可使償其田直惟陛下憐察上皆從之老嫗與男婦憩道傍婦與所私相從亡去或告嫗曰向見年少婦人自水邊小徑去矣嫗告伍長踨跡之有男子私殺牛手持血刃望見伍長意其捕己即走避之嫗與伍長疑是殺其婦也捕送縣不勝楚毒遂誣服問尸安在詭曰棄之水中矣求之水中果獲一尸己半腐縣吏以為是男子真殺若婦矣即具獄上永功疑之曰婦死幾何日而尸遽半腐哉頃之嫗得其婦於所私者永功曰是男子偶以殺人就獄其拷掠足以稱殺牛之科矣遂釋之而去武清黄氏望雲王氏豪猾不逞永功𤼵其罪畿内肅然二十三年判東京留守是月改河間尹閲月改北京留守居無何上謂宰臣曰朕聞永功到北京為政無良雖朕子萬一敗露法可廢乎朕已戒勑永功卿等可諭其長史俾匡正之到北京凡七月改東京留守世宗幸上京過東京永功從明年上還至天平山好水州皇太子薨詔永功䕶䘮事㝷拜御史大夫章宗封原王加開府儀同三司趙王永中乃永功兄弟皆加開府儀同三司明年判大宗正事應州僧與永功有舊將訴事于彰國軍節度使伊喇呼喇求永功手書與呼喇為地呼喇得書奏之上謂宰臣曰永功以書囑事呼喇此雖細微不可不懲也凡人小過不治遂至大咎有犯必懲庶幾能改是亦教也皆曰陛下用法無私臣下敢不敬畏於是永功解職未幾復判大宗正事章宗即位除判平陽府事進封冀王永功之官隨引醫人沈思存過制限當解職上曰朕知此事當痛斷監奴及治府掾長史管轄府事者罪仍著于令家奴王唐犯罪至徒永功曲庇之平陽治中髙徳裔失覺察笞四十於是永功改判濟南府詔永功曰所坐雖細事法令不得不如此今已釋矣後母復然濟南先帝舊治風土甚好可悉此意也改授山東西路巴喇衮世襲明安二年判廣寧府事進封魯王明年判彰徳府事承安元年進封郢王明年判太原府事泰和七年改西京留守八年復判平陽府事大安元年進封譙王判中山府事明年進封越王宣宗即位免常參明年從遷汴京久之詔永功毎月朔一朝興定四年詔永功無朝五年有疾賜御藥疾革賜尚醫診視一日五遣使候問是歳薨上哭之慟諡日忠簡子福孫壽孫尼瑪哈大定二十六年詔賜福孫名璐壽孫名璹尼瑪哈名琳是年璐加奉國上將軍章宗即位加銀青榮禄大夫封蕭國公初為興陵崇妃養子常居京師奉朝請奉和五年卒章宗輟朝百官進名奉慰璹本名壽孫世宗賜名字仲實一字子瑜資質簡重博學有俊才喜為詩工真草書大定二十七年加奉國上將軍明昌初加銀青榮禄大夫衛紹王時加開府儀同三司貞祐中封胙國公正大初進封密國公璹奉朝請四十年日以講誦吟詠為事時時潜與士夫夫唱酬然不敢明白往來永功薨後稍得出游與文士趙秉文楊雲翼雷淵元好問李汾王飛伯軰交善初宣宗南遷諸王宗室顛沛奔走璹乃盡載其家法書名畫一帙不遺居汴中家人口多俸入少客至貧不能具酒肴蔬飯共食焚香煮茗盡出藏書談大定明昌以來故事終日不聴客去樂而不厭也天興初璹已臥疾論及時事嘆曰兵勢如此不能支止可以降全完顔氏一族歸吾國中使女直不滅則善矣餘何言望是時曹王出質璹見哀宗於隆徳殿上問欲何言璹奏曰聞額爾克欲出議和額爾克年幼不苦諳練恐不能辦大事臣請副之或代其行上慰之日南渡後國家比承平時有何奉養然叔父亦未嘗沾溉無事則置之冷地無所顧藉緩急則置于不測叔父盡忠固可天下其謂朕何叔父休矣於是君臣相顧泣下未幾以疾薨年六十一平生詩文甚多自刪其詩存三百首樂府一百首號如菴小藁第五子守禧字慶之風神秀徹璹特鍾愛嘗曰平日所蓄書畫將以付斯子及汴城降守禧病卒年未三十潞王永徳本名恩楚大定二十七年與章宗及諸兄俱加開府儀同三司二十七年封薛王明年除秘書監二十九年進判秘書監進封瀋王明昌元年授山東東路巴喇衮必喇明安三年進封豳王五年遷勸農使承安二年進封潞王承安三年再任勸農使泰和元年有司劾永徳元日進酒後期有詔勿問衛紹王時累遷太子太師宣宗即位改同判大睦親府事興定五年遷判大睦親府事子鄂倫賜名琰豫王永成本名哈雅又曰羅索母昭儀梁氏永成風姿竒偉博學善屬文世宗尤愛重之大定七年始封瀋王以太學博士王彦潜為府文學永成師事之十一年進封豳十五年就外第十六年判秘書監明年授世襲山東東路巴喇衮明安判大睦親府事既而改中都路額特赫格們明安二十年改授翰林學士承㫖二十三年判定武軍節度使事㝷改判廣寧府二十五年世宗幸上京命留守中都判吏部尚書進開府儀同三司為御史大夫章宗即位起復進封呉判真定府事明昌元年改山東西路佛們必喇明安明年進封兗坐率軍民圍獵解職奉表謝罪上賜手詔曰卿親實肺腑夙著忠純侍顯考於春宫曲盡友于之愛洎冲人之繼統愈明忠赤之心艱難之中多所禆益朕心簡在毫楮莫窮用是起之苫塊之中授以維城之任自典藩服歳月荐更蕞爾趙邦知驥足之難展眇哉鎮府固牛刀之莫施方思驛召以赴朝何意遽罹於國憲偶因時獵頗擾部民法所不寛憲臺聞上朕尚含容累月未忍即行雖欲遂於私恩竟莫違於公議解卿前職即乃世封噫祖宗立法非一人之敢私骨肉至親豈千里而能閒以此退閒之小誡欲成終始之鴻恩經云在上不驕髙而不危是以知節慎者修身之本驕矜者敗徳之源朕每自勵今以戒卿昔東平樂善能成不朽之名梁孝奢淫卒致憂疑之悔前人所行可為龜鑑卿兼資文武多藝多才履道而行何施不可如能徳業日新無慮牽復之晩朕素不工詞翰臨文章草直寫所懷冀不以辭害意也未幾授沁南軍節度使三年改判咸平府事未赴移判太原府亊上以永成誕日親為詩以賜有美譽自應輝玉牒忠誠不待啓金縢之語當世榮之七年改判平陽府事承安改元以覃恩進封豫明年冬進馬八十匹以資守禦之備上賜詔奬諭曰卿夙有雋望時惟茂親通逹古今砥礪忠義方分憂於外服來輸駿於上閑欲助邊防以增武備惟盡心於體國乃因物以見誠載念懇勤良深嘉奬五年再任俄召還以疾不能入見上親幸其第臨視泰和四年薨訃聞上為之震悼賻贈甚厚諡曰忠獻永成自幼喜讀書晩年所學益醇每暇日引文士相與切磋接之以禮未嘗見驕色自號曰樂善居士有文集行于世云夔王允升改名永升本名錫卜察一名鶴夀大定十一年封徐王進封虞王二十六年加開府儀同三司明年判吏部尚書授山東西路安巴珠赫必喇明安章宗即位加恩宗室徙封隋王除定武軍節度使明昌二年改封曹王久之改封宛王衛紹王即位徙今封貞祐元年九月宣宗以永升年高素羸疾詔宫中聴扶杖尋薨既殯燒飯上親臨奠贊曰世宗保全宗室無所不至雖矯海陵之失亦由天資仁厚而然也其子永中永蹈皆死章宗之手其理葢有不可詰者章宗無後則厥報不爽矣金史卷八十五
