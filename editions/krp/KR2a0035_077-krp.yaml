body:
  text: 金史卷七十七元中書右丞相總裁托克托等修列傳第十五宗弼木名烏珠亨本名伯特張邦昌劉豫達蘭宗弼本名烏珠太祖第四子也希尹獲遼獲衛實訥埓問知遼天祚帝獵鴛鴦濼因與宗翰等定議分道襲之都統杲出清嶺宗望宗弼率百騎與馬和尚逐伊埓巴噶伊勒希等馳擊敗之宗弼矢盡遂遼奪兵士槍獨殺八人生獲五人遂審得遼主在鴛鴦濼畋獵尚未去可襲取者及宗望伐宋宗弼從軍取湯隂縣䧏其卒三千人至御河宋人已焚橋不得渡克爾叟以七十騎渉之殺宋焚橋軍五百人宗望遣呉孝民先入汴諭宋人宗弼以三千騎薄汴城宋上皇出奔選百騎追之弗及獲馬三千而還宗望薨宗輔為右副元帥徇地淄青宗弼敗宋鄭宗孟數萬衆遂克青州復破賊將趙成于臨朐大破黄瓊軍遂取臨朐宗輔軍還遇敵三萬衆于河上宗弼擊敗之殺萬餘人詔伐宋康王宗輔發河北宗弼攻開德府糧乏轉攻濮州前鋒烏淩阿托雲破王善二十萬衆遂克濮州䧏旁近五縣攻開德府宗弼以其軍先登奮擊破之攻大名府宗弼軍復先登破其城河北平宋主自揚州奔于江南宗弼等分道伐之進兵歸德城中有自西門北門出者當堪復敗之乃絶隍築道列礮隍上將攻之城中人懼遂䧏先遣阿里富埓琿至壽春宗弼軍繼之宋安撫使馬世元率官屬出䧏進䧏廬州再䧏巢縣王善軍當堪等破酈瓊萬餘衆于和州遂自和州渡江將至江寕西二十里宋杜充率步騎六萬來拒戰呼拉布當堪達呼大㚖合擊破之宋陳邦光以江寧府䧏留長安努烏哩雅守江寧使阿里布烏哩雅别將兵徇地下太平州濠州及句容溧陽等縣泝江而西屢敗張永等兵杜充遂䧏宗弼自江寧取廣德軍路追襲宋主于越州至湖州取之先使阿里富埓琿趨杭州具舟于錢塘江宗弼至杭州官守巨室皆逃去遂攻杭州取之宋主聞杭州不守遂自越奔明州宗弼留杭州使阿里富埓琿以精兵四千襲之鄂勒博珠爾蘇䧏越州大㚖破宋周汪軍阿里富埓琿破宋兵三千遂渡曹娥江去明州二十五里大破宋兵追至其城下城中出兵戰失利宋主走入于海宗弼中分麾下兵㑹攻明州克之阿里富埓琿泛海至昌國縣執宋明州守趙伯諤伯諤言宋主奔温州將自温州趨福州矣遂行海追三百餘里不及阿里富埒琿乃還宗弼軍自杭州遂取秀州持嘉暉敗宋軍于平江遂取平江阿里率兵先趨鎭江宋韓世忠以舟師扼江口宗弼舟小契丹漢軍没者二百餘人遂自鎮江泝流西上世忠襲之奪世忠大舟十艘於是宗弼循南岸世忠循北岸且戰且行世忠艨艟大艦數倍宗弼軍出宗弼軍前後數里擊柝之聲自夜達旦世忠以輕舟來挑戰一日數接將至黃天蕩宗弼乃因老鸛河故道開三十里通秦淮一日一夜而成宗弼乃得至江寧達蘭使伊喇古自天長趨江寜援宗弼烏淩阿托雲亦以兵來㑹連敗宋兵宗弼發江寧將渡江而北宗弼軍渡自東伊喇古渡自西與世忠戰于江渡世忠分舟師絶江流上下將左右掩擊之世忠舟皆張五緉宗弼選善射者乘輕舟以火箭射世忠舟上五緉五緉著火箭皆自焚煙熖滿江世忠不能軍追北七十里舟軍殱焉世忠僅能自免宗弼渡江北還遂從宗輔定陜西與張浚戰于富平宗弼䧟重圍中韓常流矢中目怒㧞去其矢血淋漓以土塞創躍馬奮呼搏戰遂解圍與宗弼俱出既敗張浚軍于富平遂與阿里布招䧏熙河涇原兩路及攻吳玠于和尚原抵險不可進乃退軍伏兵起且戰且走行三十里將至平地宋軍陣于山口宗弼大敗將士多戰沒明年復攻和尚原克之天㑹十五年為右副元帥封瀋王天眷元年達蘭宗磐執議以河南之地割賜宋詔遣張通古等奉使江南明年宋主遣端明殿學士韓肖胄奉表謝遣王倫等乞歸父䘮及母韋氏兄弟宗弼自軍中入朝進邦都元帥宗弼察達蘭與宋人交通賂遺遂以河南陜西與宋奏請誅達蘭復舊疆是時宗磐已誅達蘭在行臺復與呼蘭謀反㑹置行臺於燕京詔宗弼為太保領行臺尚書省都元帥如故往燕京誅達蘭達蘭自燕京南走將亡入于宋追至祁州殺之詔諸州郡軍旅之事决于帥府民訟錢糓行臺尚書省治之宗弼兼總其事遂議南伐太師宗幹以下皆曰搆䝉再造之恩不思報德妄自鴟張祈求無厭今若不取後恐難圖上曰彼將謂我不能奄有河南之地且都元帥久在方靣深究利害宜即舉兵誅之遂命元帥府復河南疆土詔中外宗弼由黎陽趨汴右監軍薩里罕出河中趨陜西宋岳飛韓世忠分據河南州郡要害復出兵涉河東駐嵐石保德之境以相牽制宗弼遣孔彦舟下汴鄭兩州王伯龍取陳州李成取洛陽自率衆取亳州及順昌府嵩汝等州相次皆下時暑宗弼還軍于汴岳飛等軍皆退去河南平時天眷三年也上使使勞問宗弼以下將士凡有軍功士三千竝加忠勇校尉攻嵐石保德皆克之宗弼入朝是時上幸燕京宗弼見於行在所居再句宗弼還軍上起立酌酒飲之賜以甲胄弓矢及馬二匹宗弼已啓行四日召還至日希伊誅越五日宗弼還軍進伐淮南克廬州上幸燕京宗弼朝燕京乞取江南上從之制詔都元帥宗弼北還軍與宰相同入奏事俄為尚書左丞相兼侍中太保都元帥領行臺如故詔以燕京路𨽻尚書省西京及山後諸部族𨽻元帥府乃還軍遂伐江南既渡淮以書責讓宋人宋人荅書乞加寛宥宗弼令宋主遣信臣來禀議宋主乞先歛兵許敝邑拜表闕下宗弼以便宜約以畫淮水為界上遣護衛將軍薩哈往軍中勞之三年二月宗弼朝京師兼監修國史宋主遣端明殿學士何鑄等進誓表其表曰臣構言今來畫疆合以淮水中流為界西有唐鄧州割屬上國自鄧州西四十里并南四十里為界屬鄧州其四十里外並西南盡屬光化軍為敝邑㳂邊州城既䝉恩造許備藩方世世子孫謹守臣節每年皇帝生辰并正旦遣使稱賀不絶嵗貢銀絹二十五萬兩匹自壬戌年為首每春季差人般送至泗州交納有渝此盟神明是殛墜命亡氏踣其國家臣今既進誓表伏望上國早䧏誓詔庶使敝邑永有憑焉宗弼進拜太傅廼遣左宣徽使劉筈使宋以衮冕圭寳珮璲玉册册康王為宋帝其册文曰皇帝若曰咨爾宋康王趙構不弔天䧏䘮于爾邦亟瀆齊盟自貽顚覆俾爾越在江表用勤我師旅蓋十有八年于兹朕用震悼斯民其何罪今天其悔禍誕誘爾衷封奏狎至願身列于藩輔今遣光祿大夫左宣徽使劉筈等持節册命爾為帝國號宋世服臣職永為屏翰鳴呼欽哉其恭聽朕命仍詔天下賜宗弼人口牛馬各千駝百羊萬仍每嵗宋國進貢内給銀絹二千兩匹宗弼表乞致仕不許優詔荅之賜以金劵皇統七年為太師領三省事都元帥領行臺尚書省事如故皇統八年薨大定十五年諡忠烈十八年配享太宗廟庭子伯特亨本名伯特熙宗時封苪王為明安加銀青光錄大夫天德初加特進海陵忌太宗諸子將謁太廟以亨為右衛將軍語在太宗諸王傳海陵賜良弓亨性直材勇絶人喜自負辭曰所賜弓弱不可用海陵遂忌之出為真定尹謂亨曰太宗諸子方强多在河朔山東眞定據其衝要如其有變欲倚卿為重耳其實忌亨也歴中京東京留守家奴梁遵告亨與衛士符公弼謀反考驗無狀遵坐誅海陵益疑之改廣陵尹再任李老僧使伺察亨動靜且令搆其罪狀亨初除廣寧諸公主宗婦往賀其母圖克坦氏太祖長女烏嚕曰伯特雖稍下遷勿以為嫌國家視京府一也况伯特年富何患不貴顯烏嚕與圖克坦舎音為室舎音妾呼達得幸於圖克坦后呼達詣后告烏嚕語涉怨望且指斥又言伯特當大貴海陵使蕭裕鞫之左驗皆不敢言遂殺烏嚕而杖舎音免其官以烏嚕怨望舎音不先奏聞故也乃封呼達為莘國夫人久之亨家奴祿錦頗黠給使總諸奴老僧謂祿錦曰爾渤海大族不幸坐累為奴寧不念為良乎祿錦識其意祿錦嘗與亨侍妾私通亨知之怒曰必殺此奴祿錦聞之懼密與老僧謀告亨謀逆亨有良馬將因海陵生辰進之以為生辰進馬者衆不能以良馬自異欲他日入見進之祿錦言亨笑海陵不識馬不足進亨之奴有自京師來者言圖克坦額哷楚克誅死亨曰彼有貸死誓劵安得誅之奴曰必欲殺之誓劵安足用哉亨曰然則將及我矣禄錦即以為怨望遂誣亨欲因問刺海陵老僧即捕繫亨以聞工部尚書耶律安禮大理正圖哩等鞫之亨言嘗論鐵劵事實無反心而錄錦亦自引伏與妾私通亨嘗言欲殺之狀安禮等還奏海陵怒復遣與老僧同鞫之與其家奴竝加搒掠皆不伏老僧夜至亨因所使人蹴其隂間殺之亨比至死不勝楚痛聲達於外海陵聞亨死佯為泣下遣人諭其母曰爾子所犯法當考掠不意飲水致死亨擊鞠為天下第一常獨當數人馬無良惡皆如意馬方馳輒投杖馬前側身附地取杖而去每畋臘持鐵連鎚擊狐兎一日與海陵同行道中遇羣豕亨曰吾能以鎚殺之即奮鎚遥擊中其腹穿入之終以勇力見忌焉正隆六年海陵遣使殺諸宗室於是殺亨妃圖克坦氏次妃大氏子音德等三人大定初追復亨官爵封韓王十七年詔有司改葬亨及妻子贊曰宋弼蹙宋主于海島卒定畫淮之約熙宗舉河南陜西以與宋人矯而正之者宗弼也宗翰死宗磐宗雋達蘭湛溺富貴人人有自為之心宗幹獨立不能如之何時無宗弼金之國勢亦曰殆哉世宗嘗有言曰宗翰之後惟宗弼一人非虚言也張邦昌宋史有傳天會五年宗望軍圍汴宋少帝請割三鎭地及輸嵗幣納質修好於是邦昌為宋太宰與肅王樞俱為質以來而少帝以書誘耶律伊都宗翰宗望復伐宋執二帝以歸劉彦宗乞復立趙氏太宗不許宋吏部尙書王時雍等請邦昌治國事天㑹五年三月立邦昌為大楚皇帝初少帝以康王構與邦昌為質既而肅王樞易之康王乃歸及宗望再舉兵少帝復使康王奉玉冊玉寶衮冕增上太宗尊號請和康王至磁州而宗望已自魏縣渡河圍汴矣及二帝出汴州從大軍北來而邦昌至汴康王入于歸德邦昌勸進于歸德康王已即位罪以隠事殺之邦昌死太宗聞之大怒詔元帥府伐宋宋主走揚州事具宗翰等傳其後太宗復立劉豫繼邦昌號大齊劉豫字彦游景州阜城人宋宣和末仕為河北兩路提刑徙浙西抵儀真喪妻翟氏繼值父憂康王至揚州樞密使張慤薦知濟南府是時山東盜賊滿野豫欲得江南一郡宰相不與忿忿而去達蘭攻濟南有闗勝者濟南驍將也屢出城拒戰豫遂殺闗勝出䧏遂為京東東西淮南安撫使知東平府兼諸路馬歩軍都縂管節制河外諸軍以豫子麟知濟南府達蘭屯兵衝要以鎮撫之初康王既殺張邦昌自歸德奔揚州詔左右副元帥合兵討之詔曰俟宋平當援立藩輔以鎮南服如張邦昌者及宋主自明州入海亡去宗弼北還乃議更立其人衆議折可求劉豫皆可立而豫亦有心達蘭為豫求封太宗用封張邦昌故事以九月朔旦授策受䇿之後以藩王禮見使者臣宗翰臣宗輔議既䇿為藩輔稱臣奉表朝廷報諭詔命避正位與使人抗禮餘禮竝從帝者詔曰今立豫為子皇帝既為鄰國之君又為大朝之子其見大朝使介惟使者始見躬問起居與靣辭有奏則立其餘竝行皇帝禮天㑹八年九月戊申備禮冊命立豫為大齊皇帝都大名仍號北京置丞相以下官赦境内復視大名還居東平以東平為東京汴州為汴京䧏宋南京為歸德府䧏淮寧永昌順昌興仁府俱為州張孝純等為宰相弟益為北京留守母翟氏為皇太后妾錢氏為皇后錢氏宣和内人也以辛亥年為阜昌元年以其子麟為尚書左丞相諸路兵馬大總管宋人畏之待以敵國禮國書稱大齊皇帝豫宰相張孝純鄭億年李鄴家人皆在宋宋人加意撫之阜昌二年豫遷都于汴睿宗定陜西太宗以其地賜豫從張邦昌所受封畧故也元帥府使蕭慶如汴與豫議以伐宋事豫報曰宋主軍帥韓世忠屯潤州劉光世屯江寧今舉大兵欲往采石渡江而劉光世拒守江寧若出宿州抵揚州則世忠必聚海船截𤓰洲渡若輕兵真趨采石彼未有備我必徑渡江矣光世海船亦在潤州韓世忠必先取之二將由此必不和以此逼宋主其可以也未幾宋主閤門宣贊舎人徐文將大小船六十隻軍兵七百餘人來奔至密州界中率將佐至汴豫與元帥府書曰徐文一行乆在海中盡知江南利害文言宋主在杭州其候潮門外錢塘江内有船二百隻宋主初走入海時於此上船過錢塘江别有河入越州向明州定海口迤邐前去昌國縣其縣在海中宋人聚船積糧之處今大軍可先往昌國縣攻取船糧還趨明州城下奪取宋主御船直抵錢塘江口今自密州上船如風勢順可五日亱到昌國縣或風勢稍慢十日或半月可至初宗弼自江南北還宗翰將入朝再議以伐宋事宗翰堅執以為可伐宗弼曰江南卑濕今士馬困憊糧儲未豐足恐無成功宋翰曰都監務偷安爾及豫以書報而睿宗亦不肯用豫䇿使達蘭帥師至𤓰洲而還天㑹十四年制詔齊國與本朝軍民相訴闗渉文移署年止用天㑹天㑹十五年詔廢齊國䧏封豫為蜀王豫稱大號凡八年於是置行臺尚書省於汴除去豫弊政人情大悦以故齊宰相張孝純權行臺左丞相遂遷豫家屬於臨潢府皇統元年賜豫錢一萬貫田五十頃牛五十頭三年進封曹王皇統三年薨子麟麟字元瑞豫之子也宋宣和間父廕補將仕郎累加承務郎天㑹七年豫以濟南䧏麟因從軍討水賊王江破䧏之豫節制東平以麟知濟南府事齊國建以濟南為興平軍麟為節制度使開府儀同三司梁國公充諸路兵馬大總管判濟南府事明年為齊尙書左丞相明年從豫遷汴罷判濟南依前開府聴置參謀豫請立麟為太子朝廷不許曰若與我伐宋有功則立之於是麟連歲帥兵南伐皆無功而還及朝廷議廢齊報以南伐之期俾豫先遣兵駐淮上達蘭以軍廢豫止刁馬河麟從數百騎出迎達蘭諭麟止從騎南岸獨占麟渡河因執麟豫廢麟遷臨潢頃之授北京路都轉運使歴中京燕京路都轉運使參知政事尚書左丞復為興平軍節度使上京路轉運使開府儀同三司封韓國公薨年六十四正隆間䧏二品以上官封改贈特進息國公昌本名達蘭穆宗子宗翰襲遼主于鴛鴦濼遼都統瑪格奔道蘭達蘭收其羣牧宗翰使達蘭追擊之不及獲遼樞密使德勒岱及其子摩格納延以還太祖自將襲遼主于大魚濼留輜重于草濼使達蘭雅穆守之奚路兵官琿楚不能安輔其衆遂以達蘭為奚六路軍帥鎮之實古納博勒和䕶送常勝軍及燕京豪族工匹自松亭闗入内地上戒之曰若遇險阨則分兵以往實古納博勒和廼合於達蘭乆之討噶珊蘓庫部奚人奚人據險戰殺且盡蘇庫卓琳托紐十三巖皆平之詔曰朕以奚路險阻經畧為難命汝往任其事而克副所託良用嘉歎今和勒博部族來附餘衆奔潰無能為已北命實古納博勒和䕶送䧏人若遇險阻即分兵以行餘衆悉與汝合䧏詔二十招諭未降汝當審度其事從宜處之其後撫定奚部及分南路邊界表請設官鎮守上曰依東京渤海例置千戸穆昆遼外戚約尼扎古雅部族在建州舍音襲走之獲其妻孥及官豪之族達蘭復擊之擒其隊將克爾叟博斯呼殺之降民戸千餘進降金源縣詔增賜銀牌十又降約尼二部再破興中兵降建州官屬得山砦二十村堡五百八十阿古復敗扎古雅降其官民尤多扎古雅勢蹙亦䧏興中建州皆平詔第將士功賞撫安新民達蘭請以約尼九營為九明安上以都林有功使領四明安扎古雅仍為親管明安五明安之都帥命達蘭擇人授之達蘭與劉彦宗舉蕭公翊為興中尹郡府各以契丹漢官攝治上皆從之及宗翰宗望伐宋達蘭為六部路都統宋望已受宋盟軍還達蘭乃歸中京八月復伐宋閠月宗翰宗望軍皆至汴州達蘭阿里庫破宋兵二萬於杞覆其三營獲京東路都總管胡直孺及其二子與南路都統制隨師元及其三將遂克拱州降寧陵破睢陽下亳州宋兵來復睢陽又擊走之擒其將石瑱宋二帝已降大軍北還達蘭為元帥左監軍徇地山東取宻州達呼取單州達蘭取鉅鹿阿里庫取宗城達呼布取清平臨清蒙克取趙州阿里庫徇下濬滑恩及髙唐分遣諸將趣磁信徳皆降之劉豫以濟南府降詔以豫為安撫使治東平達蘭以左監軍鎮撫之大事専决焉後為右副元帥天㑹十五年為左副元帥封魯國王初宋人既誅張邦昌太宗詔諸將復來如邦昌者立之或舉折可求達蘭力舉劉豫豫立為帝號大齊豫為帝數年無尺寸功遂降豫為蜀王達蘭與右副元帥宗弼俱在河南宋使王倫求河南陜西地于達蘭明年達蘭朝京師倡議以廢齊舊地與宋熙宗命羣臣議㑹東京留守宗雋來朝與達蘭合力宗幹等争之不能得宗雋曰我以地與宋宋必徳我宗憲折之曰我俘宋人父兄怨非一日若復資以土地是助讐也何徳之有勿與便達蘭弟朂亦以為不可既退達蘭責朂曰他人尚有從我者汝異議乎朂曰苟利國家豈敢私耶是時太宗長子宗磐為宰相位在宗幹上達蘭宗雋附之竟執議以河南陜西地與宋張通古為詔諭江南使乆之宗磐跋扈尤甚宗雋亦為丞相達蘭持兵柄謀反有狀宗磐宗雋皆伏誅詔以達蘭屬尊有大功因釋不問出為行臺尚書左丞相手詔慰遣達蘭至燕京愈驕肆不法復與翼王呼蘭謀反而朝議漸知其初與宋交通而倡議割河南陜西之地宗弼請復取河南陝西㑹有上變告達蘭者熙宗乃下詔誅之達蘭自燕京南走追而殺之于州并殺翼王及宗人呼勒希圖達蘭二子威泰烏達布而赦其黨與宗弼為都元帥再定河南陝西伐宋渡淮宋康王乞和遂稱臣畫淮為界乃罷兵贊曰君臣之位如冠屢定分不可頃刻易也五季亂極綱常斁壊遼之太宗慢䙝神器倒置冠立石晉以臣易君宇宙以來之一大變也金人效尤而張邦昌劉豫之事出焉邦昌雖非本心以死辭之孰曰不可豫乘時徼利金人欲倚以為功豈有是理哉達蘭初薦劉豫後以陜西河南歸宋視猶儻來初無固志以處此也積其輕躁終䧟逆圖事敗南奔適足以實通宋之事爾哀哉金史卷七十七
