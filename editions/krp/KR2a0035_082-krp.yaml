body:
  text: 金史卷八十二元中書右丞相總裁托克托等修列傳第二十郭藥師子安國耶律圖善烏雅呼爾哈烏雅沃哩布蕭恭完顔希卜蘇赫舍哩呼喇耶律恕本名耨埒郭企忠烏蘇額琳延扎們都布薩歡塔鄭建充烏庫哩薩哈伊喇温本名阿薩爾蕭仲恭本名珠嚕凖子拱蕭仲宣本名伊里布髙松本名摶多海陵諸子光英元夀舒蘇鄂博廣陽郭藥師渤海鐵州人也遼國募遼東人為兵使報怨於女直號曰怨軍藥師為其渠帥烏楞古攻顯州敗藥師於城下遼帝亡保天徳耶律聶哷自立改怨軍為常勝軍擢藥師諸衛上將軍聶哷死其妻蕭妃稱制藥師以涿易二州歸於宋藥師以宋兵六千人奄至燕京甄五臣以五千人奪迎春門皆入城蕭妃令閉城門與宋兵巷戰藥師大敗失馬歩走踰城以免宋人猶厚賞之太祖割燕山六州與宋人宋使藥師副王安中守燕山及安中不能庇張覺而殺之函其首以與宗望藥師深尤宋人而無自固之志矣宗望軍至三河藥師等拒戰於白河兵敗藥師乃降宗望遂取燕山太宗以藥師為燕京留守給以金牌賜姓完顔氏從宗望伐宋凡宋事虛實藥師盡知之宗望能以懸軍深入駐兵汴城下約質納帑割地全勝以歸者藥師能測宋人之情中其肯綮故也及兩鎮不受約束命諸將討之藥師破順安軍營殺三千餘人海陵即位詔賜諸姓者皆復本姓故藥師子安國仍姓郭氏郭安國藥師子也累遷奉國上將軍南京副留守貞元三年南京大内火海陵使右司郎中梁球同知安武軍節度使王全按問失火狀留守馮長寧都轉運使左瀛各杖一百除名安國及留守判官大良順各杖八十削三官火起處勾當官南京兵馬都指揮使呉濬杖一百五十除名失火位押宿兵吏十三人並斬諭之曰朕非以宫闕壯麗也自即位以來欲巡省河南汝等不知防慎致方外姦細延燒殆盡本欲處爾等死罪特以舊人寛貸之押宿人兵法當處死疑此輩容隠姦細故皆斬也安國性輕躁本無方畧海陵將伐宋以安國將家子擢拜兵部尚書改刑部尚書軍興領武捷軍都總管與武勝武平軍為前鋒海陵授諸將方畧安國前奏曰趙構聞王師至其勢必逃竄臣等不以逺近追之獲而後已但置之何地海陵大喜曰卿言是也得構即置之寺觀嚴兵守之及聞世宗即位海陵謀北還更置浙西道兵馬都統制府以完顔元宜為都統安國副之及海陵遇弑衆惡安國所為與李通輩皆殺之贊曰郭藥師者遼之餘孽宋之厲階金之功臣也以一臣之身而為三國之禍福如是其不侔也魏公叔痤勸其君殺衛鞅豈無所見歟耶律圖善系出約尼氏在遼世為顯族圖善仕至金吾衛大將軍裕爾詳衮遼帝奔天徳圖善以所部降宗翰承制授尚書為西北路招討使宗翰伐宋圖善率本部為先鋒至汾州遇宋將折家軍請濟師併力破之從攻太原隆徳府從入汴克洛陽及從羅索平陜右天㑹七年授太子少保十年遷尚書左僕射致仕卒年九十一正隆例贈特進郜國公烏雅呼爾哈海蘭路錫馨水人也後授愛呼水穆昆因家焉從棟摩圍平州有功及伐宋圍汴五穆昆與宋兵萬人遇於城南呼爾哈先馳擊敗之元帥府遂賞良馬一匹五年攻宗城縣敵棄城走恩州呼爾哈追殺千餘人獲車四百輛帥府賞牛三十頭馬一匹七年討㤗山羣盗平之毁其營柵兖州羣㓂三千餘保據山險呼爾哈復破之賞牛二十二頭馬四匹八年攻廬州至柘臯鎮呼爾哈領甲士三十為前鋒執宋所遣持書與劉四廂錡者七人復以先鋒軍攻和州比至含山縣五里獲甲士二人乃知宋三將將兵且至呼爾哈伏其軍遂獲姚觀察帥府賞馬二匹九年定陜右呼爾哈以所部遇敵千人敗之生擒甲士一人盡得敵之虚實又從富埓琿徇地熙秦敗敵兵二千於秦州賞馬一匹宋人屯襄陽府監軍阿巴遣呼爾哈領四明安徃攻之宋兵三千已渡江方營壁壘乘其未就突戰破之梁王宗弼復河南將攻陳州遣呼爾哈以甲士三十捕偵候人至蔡州西遇兵八十餘戰敗之獲南頓縣令及攻陳州夜將四更忽聞敵開門潰走呼爾哈亟領二穆昆軍追及之而明安托克索亦領軍至大敗之皇統二年遷定逺大將軍八年授臨洮少尹兼熙秦路兵馬副都總管九年改同知京兆尹兼本路兵馬都總管天徳間改同知平陽尹兼河東南路兵馬都總管貞元三年改同知海蘭路總管大定四年授呼爾哈節度使七年改歸順軍節度使十年移鎮顯徳卒官年六十九十九年詔授其子五十六武功將軍世襲本路博多和河穆昆烏雅沃哩布海蘭路禪嶺人也徙大名路天㑹中從其父達希布𨽻元帥右監軍麾下達蘭以事赴闕以達希布自隨沃哩布領其父穆昆從大軍攻滄州方夷濠隍城中兵來拒沃哩布以本部擊却之王師下青州力戰有功獲馬百匹以獻降賊黨甚衆青州戍將徳克濟布以萊州兵衆請濟於帥府沃哩布將十二穆昆兵徃救之遂降其四營㧞其一營得户四千又敗賊兵五萬於恩州攻破其營降户五萬獲牛畜萬餘將至臨清縣遇敵兵三千又敗之俘獲甚衆生擒賊首以獻帥府嘉其功以奴婢百牛三十賞之時徳克濟布敗於恩州之境沃哩布復以兵四千徃救破敵萬餘宋兵十萬在單父間總管宗室伊楞古選歩卒一萬騎兵四千徃討之沃哩布領其親管穆昆以從遇敵先登力戰有功大軍經畧密州沃哩布將兵二千為前鋒遇敵萬人於髙密遂敗其衆追至城下殺戮殆盡獲馬牛三千餘沃哩布復與伯騰敗賊王義軍十餘萬於州南是夜賊兵數千來襲營沃里布以兵横擊走之後從大軍攻楚揚通㤗等州天眷二年襲其父世襲明安授寧逺大將軍皇統七年益以親管穆昆天徳三年除同知歸徳尹正隆初為唐古部族節度使大定二年為保大軍節度使是嵗改鎮通逺是時宋軍十萬餘入河隴據險要攻郡邑元帥左都監喀齊喀奏益兵詔益兵七千遣沃哩布與彰化軍節度使宗室璋等七人偕徃以備任使進階龍虎衛上將軍卒於軍中蕭恭字敬之納琳奚王之後也父翊天輔間歸朝從攻興中遂以為興中尹師還以恭為質子宗望伐宋翊當領建興成川懿五州兵為萬户軍帥以恭材勇使代其父行時年二十三至中山宋兵出戰恭先以所部擊敗之經山東及渡淮襲康王皆在軍中師還帥府承制授徳州防禦使奚人之屯濵棣間者皆𨽻焉改棣州防禦使皇統間改同知横海軍節度使丁父憂起復為太原少尹用亷遷同知中京留守事累遷兵部侍郎授世襲穆昆坐問禁中起居狀決杖奪一官貞元二年為同知大興尹嵗餘遷兵部尚書為宋國生日使以母憂去官起復為侍衛親軍馬歩軍都指揮使四年遷光禄大夫復為兵部尚書是嵗經畫夏國邊界還過臨潼失所佩金牌至太原憂恚成疾時已具其事驛聞於朝海陵復命給之仍遣諭恭曰汝失信牌亦由不謹朕方俟汝欲有委使乃稱疾耶必以去日身佩信牌歸則無以為辭欲朕先知耳使至恭已疾篤稽顙受命俄頃而卒海陵方遣使與其子䕶衛玖格馳視乃戒府官使善䕶之至保州已聞訃矣海陵深悼惜之命玖格䕶喪以還所過州府設奠喪至都命百官致祭親臨奠賻贈甚厚并賜厩馬一謂玖格曰爾父銜命卒於道途甚可悼惜朕乗此馬十年今賜汝父可常控至柩前既葬汝則乘之完顔希卜蘇年十六從伐宋攻下懷仁縣功居最從睿宗經畧陜西以兵七百人入丹州諸山遇盗三千擊敗之又破賊四千生擒其將帥出隴州以兵四百敗敵數千宋兵七千來取鞏州復擊走之又以五千兵敗呉玠之衆三萬白塔口遇敵五千復敗之别降定逺等寨皇統二年授同知臨洮尹以憂去官未期以舊職起復改孟州防禦使遷臨洮尹復以罪罷正隆三年起為京兆尹改河南尹卒年五十八赫舍哩呼喇輝發川阿敦河人徙西北路識契丹字為帥府小吏梁王宗弼復陜西久不通問睿宗在燕京遣呼喇徃候之是時宗弼自鳯翔攻和尚原使呼喇視彼中地形修道築城十二年徃濵州密訪南邉事體及觀劉豫治齊狀盡得其虛實睿宗甚嘉之皇統初從宗弼渡淮及下廬和二州大破張浚韓世忠等軍遣呼喇馳奏賞以金盂重彩五端絹五匹七年授同知景州軍州事以亷加忠武校尉天徳初以監察御史分司行臺歴同知濟州防禦使事入為監察御史秩滿再任大定二年遷刑部員外郎與御史大夫白彦敬徃西北部族市馬累轉泗州防禦使三遷扶餘路節度使移寧昌軍卒耶律恕字忠厚本名耨埓遼横帳秦王之族也為人謹愿有志喜讀書通契丹大小字與耶律果巴來歸羅索問果巴曰與爾同來者誰可任用治軍旅事果巴對曰耨埒可羅索與宗翰伐宋恕𨽻前鋒取和尚原攻仙人闗特為睿宗所知再除太原真定少尹薩里罕辟署陜西叅謀委以軍務遷行臺兵部侍郎再遷尚書左司郎中海陵為平章政事謂恕曰君亦有黨乎恕正色曰窮則獨善其身達則兼善天下不以其道得之非恕之志也何朋黨之有海陵徐曰前言戲之耳久之為沁南軍節度使遷行臺工部尚書行臺罷改安國軍節度使為叅知政事以疾求解為興中尹入為太子少保正隆元年致仕封廣平郡王薨年六十九二年例贈銀青光禄大夫郭企忠字元弼唐汾陽王子儀之後郭氏自子儀至承勲皆節鎮北方唐季承勲入于遼子孫繼為天徳軍節度使至昌金降為副使企忠幼孤事母孝謹年十三居母喪哀毁如成人服除襲父官加左散騎常侍天輔中大軍至雲中遣耶律坦招撫諸部企忠來降軍帥命同勾當天徳軍節度使事徙所部居於韓州及見太祖問知其家世禮遇優厚以白鷹賜之天㑹三年伐宋領西南諸部番漢軍兵為明安從破鴈門屯兵加桂州管内觀察留後鎮代州明年賊楊麻胡等聚衆數千於五臺企忠與同知州事迪里討平之遷知汾州事是時汾州初下居民多為軍士掠去城邑蕭然企忠詣帥府力請願聴其親舊贖還帥府從之未幾完實如故石州賊閻先生衆數萬至城下僚屬慮有内變請為備企忠曰吾於汾人有徳保無他乃率吏民城守㑹援至合擊破之六年改静江軍節度留後遷天徳軍節度使汴京歩軍都指揮使累遷金吾衛上將軍秩滿權沁州刺史到官嵗餘卒年六十八烏蘇額琳善騎射襲父薩哈穆昆從蒙克攻東京及廣寧擊北京山賊皆有功蕭布展來攻恩州額琳以六十騎偵之逮夜遇賊數百騎掩擊之生獲三人知布展衆九萬且至故蒙克得以為備遂破布展宗望伐宋已至汴額琳破尉氏中牟援兵取其城久之以兵百五十人破敵一千於滄州西明年再伐宋蒙克戍開州額琳以騎四百守河復敗千餘人斬首七百餘宗弼渡淮阿里先具舟於江上聞王善兵扼其前宗弼使額琳濟師敗王善於和州北李成以兵七萬據烏江額琳帥二千人直前敗之宗弼遂渡江至江寧十五年沂州竇防禦叛額琳敗之獲竇防禦録前後功授明安加昭武大將軍宗弼再取河南額琳以五十騎敗楊家賊五百於徐州東以功受賞不可勝計天徳二年除唐州刺史移淄州遷實壘部族節度使行至北京病卒延扎們都隆州巴爾嘉山人也身長美鬚髯天㑹間從其兄揚阿在軍中方取汴京其兄戰殁遂擐甲代其兄充軍睿宗定陜右以們都為佛寧𨽻監軍杲親管萬户攻饒風闗至坊州杲欲與總管富勒呼㑹於鳯翔遣們都領六十騎先徃期㑹及還備得地形險阨賞銀五十兩其後梁王宗弼駐軍山東遣人詣陜西特召們都至令齎廢齊及安撫百姓詔書徃諭監軍宗室杲們都既還宗弼賞以良馬銀絹事畢復遣從杲天眷初叛將定國軍節度使李世輔偽邀杲至私署以獻甲為名遂以兵劫執而去們都突出以告押軍明安完顏達蘭同率兵追及首出與戰杲由此得脱以功遷明威將軍復從杲招復陜西進至鳯翔齊國初廢諸路多反覆不一杲授們都牌劄令徃撫定們都所至多張甲兵從者安之違者討之帖然無復叛者杲甚嘉之皇統初遷廣威將軍四年授同知通逺軍節度使事改知保安軍事天徳三年為丹州刺史兼知軍事正隆初為寧州刺史大定初宋將呉璘等以軍數十萬人據秦隴元帥府承制以們都為勇烈軍都總管領軍討之宋人保據徳順都監喀齊喀遣武威軍副都總管𤓰爾佳扎拉㑹宗室璋議征討之策璋與們都曰須都監親至敵必退矣喀齊喀領軍四萬來赴遂復徳順州明年秦隴平以功遷金吾衛上將軍授通逺軍節度使五年改慶陽尹兼本路兵馬都總管卒於官十九年録功以子禄格世襲本路海蘭烏珠明安都掄赫紳穆昆授武功將軍們都性忠厚謹慤安置營壁尤能慎密有敵忽來雖矢石至前㤗然自若廼號令士卒如平時由是人益安附而功易成焉布薩歡塔扶餘路嘉們人也身長七尺勇健有力善騎射年十六從其父和木索征伐初授修武校尉為宗弼章京天眷二年與宋岳飛相拒歡塔領六十騎深入覘伺至鄢陵敗宋軍糧餉軍七百餘人多所俘獲皇統九年除慈州刺史再遷利渉軍節度使授世襲濟州和卓海蘭明安舍哩斡實穆昆貞元初以憂去官起復舊職歴㤗寧永定軍改咸平尹海陵殺歡塔弟樞密使呼圖召歡塔至南京既見沉思久之謂之曰汝有功舊不因呼圖得官以此致罪甚可憐憫遂釋之改興平軍節度使世宗即位以為廣寜尹斡罕反為行軍都統與海蘭路總管圖克坦克寜將左翼敗斡罕於長濼改臨潢尹賊平賜金帛改海蘭路兵馬都總管徙顯徳軍慶陽尹致仕大定十二年上思舊功起為利渉軍節度使復以金紫光禄大夫致仕卒年七十二歡塔歴一十七官未嘗為佐貳性沉厚有識雖未嘗學問明於聴斷所至有治聲云鄭建充字仲實其先京兆人占籍鄜州仕宋累官知延安府事天㑹七年來降仍知延安府屯兵三千宋劉光烈兵八萬來攻建充相距四十餘日攻益急建充遣人㑹綏赫軍夾擊破之俘其禆將賀貴遷節制司統制軍馬改京兆府路兵馬都監敗宋曲端於彭原髙昌宗據延安為宋守建充擊之盡復城邑復知延安軍府事齊國建累遷博州團練使知寧州齊國廢朝廷以地賜宋為宋環慶路經畧安撫副使仍知寧州天眷復取陜西仍以為經畧安撫使知慶州從破甘谷城改平凉尹是時營建南京宫室大𤼵河東陜西材木浮河而下經砥柱之險筏工多沉溺有司不敢以聞乃誣以逃亡錮其家建充白其事請至砥柱解筏順流散下令善游者下流接出之而錮者得釋正隆軍興括筋角造軍器百姓徃徃椎牛取之或生拔取其角牛有泣下者建充白其事於朝建充性剛暴常畜猘犬十數奴僕有罪既笞已復嗾犬嚙之骨肉都盡雖謙遜下士於敵已上一無所屈省部文移有不應法度輒置之坐下或即毁裂由是在位者銜之軍胥李換竊用公帑自度不得免乃誣建充藏甲欲反更再鞫皆無狀方奏上攝事者素與建充有隙恐其得釋使吏持文書紿建充曰朝省有命奈何建充曰惟汝所為是夜死於獄中長子愬亦死焉烏庫哩薩哈海蘭路愛呼河人也後徙真定睿宗為右副元帥聞薩哈勇畧選充章京後從宗弼征伐補麯院都監未幾從伐宋與宋兵遇於潁州薩哈先登破之皇統元年領漢軍千户帥府再以軍四千𨽻焉除同知鄭州防禦使事再遷太子少詹事大定六年改洺州防禦使上曰卿昔事睿宗積勞苦逮事朕輔佐太子宣力多矣今興名郡所以勞卿也遷永定軍節度使歴臨潢鳯翔尹陜西路統軍使東平尹節制州郡躬行儉約政先寛簡邉庭久寧人民獲安召為簽書樞密院事卒十八年世宗追録薩哈舊勞授其子大興河北西路愛呼河世襲明安阿里瑪河穆昆階武功將軍伊喇溫本名阿薩爾遼横帳人工契丹小字睿宗為左副元帥伐宋溫從大㚖渡江辟江寧府都廵檢江寜太平初下宋遣諜扇構百姓應者數萬人溫擒其諜者遂不敢竊發宗弼嘉之賜銀千兩重綵百端絹二百匹宗弼每出征伐未嘗不在行間除同知河北西路轉運使事㑹宗弼廵邊溫從軍不之官宗弼入朝熙宗宴羣臣宗弼欲有奏請已被酒失次溫掖而出宫明日熙宗謂宗弼曰阿薩爾事叔甚謹不可去左右由是宗弼益親信之嘗謂女壻赫舍哩志寧曰汝效阿薩爾之為人可以幾古人矣未幾除同知中京路都轉運使事累遷左諫議大夫兼修起居注正隆伐宋以本官為濟州路行軍萬户從至揚州軍還除同知宣徽院事世宗御饌不適口召溫嘗之奏曰味非不美也蓋南北邊事未息聖慮有所在耳上意遂釋歴永定震武崇義節度使移臨海軍州治近水秋雨水潦暴至城下城頗決百姓惶駭不知所為溫躬督役夫繕完之雖臨不測無所避僚屬或止溫溫曰為政疵癘水泛溢為灾守臣之罪當以此身為百姓謝雖死不恨移鎮武定嵗旱且蝗溫割指以血瀝酒中禱而酹之既而雨霑足有羣鴉喙蝗且盡由是嵗熟人以為至誠之感云以老致仕卒贊曰軍旅之事鋒鏑在前不計其死耳屬金鼓目屬旌旗心屬號令此行列之任也自收國用兵至於大定和宋以前用命之士雖細必録所以明功也蕭仲恭本名珠嚕凖祖托卜嘉仕遼為樞密使守司徒封蘭陵郡王父特黙為中書令守司空尚主仲恭性恭謹動有禮節能被甲超槖駞遼故事宗戚子弟别為一班號孩兒班仲恭嘗為班使歴宫使本班詳衮遼帝西奔天徳仲恭為䕶衛太保兼領軍事至和羅達巴大軍奄至倉卒走仲恭母馬乏不能進謂仲恭兄弟曰汝等盡節國家無以我為也仲恭母遼道宗季女也遼主傷之命弟仲宣留侍其母仲恭從而西時大雪寒甚遼主乏食仲恭進衣并進乾糒遼主困仲恭伏氷雪中遼主藉之以憇凡六日乃至天徳始得食後與遼主俱獲太宗以仲恭忠於其主特加禮待天㑹四年仲恭使宋且還宋人意仲恭耶律伊都皆有亡國之慼而伊都為監軍有兵權可誘而用之乃以蠟丸書令仲恭致之伊都使為内應仲恭素忠信無反覆志但恐宋人留不遣遂陽許還見宗望即以蠟丸書獻之宗望察仲恭無他薄罰之於是再舉伐宋執二帝以歸累遷右宣徽使改都㸃檢宗磐與宗幹爭辯於熙宗前宗磐拔刀向宗幹仲恭呵之乃止既而宗磐以反罪誅仲恭衛禁有備以功加銀青光禄大夫遷尚書右丞皇統初封蘭陵郡王授世襲明安進拜平章政事同監修國史封濟王詔葬遼豫王於廣寧仲恭請徃㑹葬熙宗義而許之改行臺左丞相居無何入為尚書右丞相拜太傅領三省事封曹王天徳二年封越國王除燕京留守海陵親為書以玉山子賜之是嵗薨年六十一諡貞簡正隆例降王爵改儀同三司鄭國公子拱拱本名達年鄂博初為蘭子山明安海陵為宰相徼取人譽薦大臣子以為達官遂以拱為禮部侍郎耶律密哷拱妻女弟也海陵將納為妃使拱自汴取之還過燕是時仲恭為燕京留守見密哷身形不類處子竊憂之曰上多猜嫌拱其及禍矣拱去不數日仲恭卒拱至上京聞訃以本官起復佩信牌往燕京治葬事未行密哷入宫果如仲恭所相度即遣出宫夜半召拱至禁中詰問無狀海陵終疑之乃罷拱禮部侍郎奪其信牌拱待命踰年不報歸蘭子山治明安事是時蕭恭張九坐語禁中事得罪拱至蘭子山與客語及之有阿納爾與拱有隙乃誣拱言張九無罪被誅語渉怨謗海陵遣使鞫之戒使者曰此子狂妄宜有此語不然彼中安得知此事使者不復問拱但搒掠其左驗使如告語證之拱遂見殺仲宣本名伊里布仲恭母弟聰敏好學沉厚少言五嵗遥授郡刺史累加太子少師為本班詳衮從天祚西為䕶衛太保左右班詳衮至實納圖遼主留仲宣侍母遂與其母皆見獲太宗嘉之且謂仲宣能知遼國故事命權宣徽使從睿宗伐康王師還家居者久之皇統二年特授鎮國上將軍歴順義永定昭義武寧四鎮節度使為政平易小吏不敢為姦賄賂禁絶奴婢入郡人莫識其靣朔潞百姓皆為立祠刻石頌之正隆二年卒年六十四髙松本名摶多澄州析木人年十九從軍為佛寧有力善戰宗弼聞其名召置左右從破汴京及和尚原累官咸平總管府判官世宗即位充管押東京路渤海萬户兵部尚書克實謀反前同知延安尹李老僧曰我與萬户髙松謀之必從我矣衆曰若得此軍舉事易矣老僧徃見松説松曰君有功舊人至今不得大官何也松曰我一縣令也每念聖恩累世不能報尚敢有望乎老僧遂不敢言克實布呼阿蘓知事不可成遂上變共捕鄂倫赴有司松從征斡罕以功遷延平少尹四遷崇義軍節度使卒年七十四贊曰忠信行已豈不大哉蕭仲功盡心故主而富貴福澤嚮之與宗室舊臣等矣仲恭廷叱宗磐而朝廷尊髙松誼遏李老僧而社稷安皆有古烈大夫之風焉海陵后圗克坦氏生太子光英元妃大氏生崇王元夀柔妃唐古氏生宿王舒蘓鄂博才人南氏生滕王廣陽光英本名阿里布圖克坦后所生是時燕京轉運使趙襲慶多男故又名曰趙六養於同判大宗正方之家故崇徳大夫沈璋妻張氏嘗為光英保母於是贈璋銀青光禄大夫賜宗正方錢千萬天徳四年二月立光英為皇太子是月安置太祖畫像於武徳殿盡召國初嘗從太祖破寧江州有功者得百七十六人並加宣武將軍賜酒帛其中有呼爾罕者解其衣進光英曰臣今年百嵗矣有子十人願太子夀考多男子與小臣等海陵使光英受其衣海陵即以所服并佩刀賜呼爾罕答其厚意後以英字與鷹隼字聲相近改鷹坊為馴鷙坊國號有英國又有應國遂改英國為夀國應國為杞國宋亦改光州為蔣州光山縣為期思縣光化軍為通化軍云太醫院保全郎李中保和大夫薛遵義俱以醫藥侍光英李中超换宣武將軍太子左衛副率薛遵義丁憂起復宣武將軍太子右衛副率光英襁褓時養於宗正方家後養於永寧宫及圖克坦舎音家頁元元年詔朝官京官五品以下奉引自通天門入居於東宫正隆元年三月二十七日光英生日宴百官於神龍殿賜京師大酺一日四年八月光英射鴉獲之海陵大喜命薦原廟賜光英馬一匹黄金三斤班賜從者有差正隆六年海陵行幸南京次安肅州光英獲二兎遣使薦於山陵居數日復獲麞兎從官皆稱賀賜光英名馬弓矢復遣使薦山陵六月海陵至南京羣臣迎謁海陵與圖克坦后光英共載而入海陵嘗言俟太子年十八以天下付之朕當日遊宴於宫掖苑囿中以自娯樂光英頗警悟海陵謂侍臣曰上智不學而能中性未有不由學而成者太子宜擇碩徳宿學之士使輔導之庶知古今防過失詩文小技何必作耶至於騎射之事亦不可不習恐其懦柔也及將親征后與光英挽衣號慟海陵亦泣下曰吾行歸矣後誦孝經一曰忽謂人曰經言三千之罪莫大於不孝何為不孝對者曰今民家子博奕飲酒不養父母皆不孝也光英黙然良久曰此豈足為不孝耶蓋指言海陵弑母事及伐宋光英居守以圖們額哩頁為太子少師兼河南路統軍使以衛䕶之完顔元宜軍變海陵遇害都督府移文額哩頁殺光英於汴京死時年十二後與海陵俱葬於大房山諸王墓次額哩頁咸平路庫特呼河人襲其父呼圖明安除邳州刺史三遷昌武軍節度使歸徳尹南京留守河南路統軍使太子少師大定二年遷元帥右都監宋人陷陳蔡額哩頁師久無功已而兵敗於宋解職俄起為京兆尹世宗謂之曰卿為河南統軍門多私謁百姓惡之其後經畧陳蔡不惟無功且復致敗以汝舊勞故復用汝京兆地近南邉宜善理之大定三年卒元夀天徳元年封崇王三年薨舒蘇鄂博正隆元年四月生實逹爾東勝家保養之賜東勝錢千萬仍為起第五月已酉彌月封其母唐古氏為柔妃賜京師貧者五千人錢人錢二百二年舒蘇鄂博生日海陵與永夀太后及皇后太子光英幸東勝家三年正月五日舒蘇鄂博薨海陵殺太醫副使謝友正醫者安宗義及其乳母杖東勝一百除名明日追封舒蘇鄂博為宿王葬大房山諫議大夫楊伯雄入直禁中因與同直者相語伯雄曰宿王之死蓋養於宫外供䕶雖謹不若父母膝下豈國家風俗素尚如此或以此言告海陵海陵大怒謂伯雄曰爾臣子也君父所為豈得言風俗宫禁中事豈爾當言朕或體中不佳間不視朝秪是少得人幾拜耳而庶事皆奏決便殿縱有死刑不即論決蓋使囚者得緩其死至於除授宣勅雖復稽緩有何利害朕每當閒暇頗閲教坊聲樂聊以自娯書云内作色荒外作禽荒甘酒嗜音峻宇雕墻有一於此未或不亡此戒人君不恤國事溺於此者耳如我雖使聲樂喧動天地宰相敢有濫與人官而吏敢有受賕者乎外間敢有竊議者乎爾諌官也有可言之事當公言之言而不從朕之非也而乃私議可乎伯雄對曰陛下至徳明聖固無竊議者愚臣失言罪當萬死惟陛下哀憐海陵曰本欲殺汝今秪杖汝二百既決杖至四十使近臣傳詔諭伯雄曰以爾藩邸有舊今特釋之滕王廣陽母南氏本大臭家婢隨元妃大氏入宫海陵幸之及有娠即命為殿直正隆二年九月二十六日生廣陽十月滿月海陵分施在京貧民几用錢千貫三年二月封南氏為才人七月封廣陽為滕王九月薨贊曰海陵伐宋光英居守使圖們額哩頁以宫師兼統軍之任計至悉也豈料死其手乎荀首有言不以人子吾子其可得耶海陵睨人之子不翅魚肉而獨已子之謀安不可得矣金史卷八十二
