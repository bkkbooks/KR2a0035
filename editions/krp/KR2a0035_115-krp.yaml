body:
  text: 金史卷一百十五元中書右丞相總裁托克托等修列傳第五十三完顏納新崔立聶天驥特嘉烏新完顏納新字正甫蘇哷之弟也登策論進士第仕厯清要正大三年八月由翰林直學士充益政院説書官五年轉吏部侍郎監察御史烏庫哩薩喇勒劾近侍張文壽仁壽李麟之受敵帥饋遺詔納新鞫問得其姦狀上曲赦其罪皆斥去朝論快之九月改侍講學士以御史大夫奉使大元至龍駒河朝見太宗皇帝十二月還明年六月遷吏部尚書復往八年春還朝廷以勞拜參知政事天興元年春大兵駐鄭州海灘寺遣使招哀宗降復以納新往乞和不許攻汴益急汴受圍數月倉庫匱乏召武仙等入援不至哀宗懼以曹王額爾克出質請罷攻冬十月上議親出捍禦以納新參知政事兼樞密副使完顏薩尼雅布樞密副使兼知開封府權參知政事總諸軍留守京師以翰林學士承旨烏克遜布布提控諸王府同判大睦親府事兼都㸃檢内族哈昭管宫掖事左副㸃檢完顏阿薩爾右副㸃檢温都阿里副之户部尚書完顏珠赫兼裏城四面都總領御史大夫費摩阿固岱兼鎮撫軍民都彈壓諫議大夫近侍行省左右司郎中烏克遜納新兼知宫省事又以博斯呼為外城東面元帥珠嘉耀珠南面元帥崔立西面元帥富珠哩邁努北面元帥乙酉除拜定以京城付之又以户部侍郎刁璧為安撫副使總招撫司規運京外糧斛設講議所受陳言文字以大理卿納哈塔徳輝户部尚書仲平中京副留守愛實總其事十二月辛丑上出京服綘紗袍乘馬導從如常儀留守官及京城父老從至城外奉辭有詔撫諭仍以鞭揖之蘇布特聞上已出復㑹兵圍汴初上以東面元帥李辛跋扈出怨言罷為兵部侍郎將出宻諭納新等覊縶之上既行納新等召辛辛懼謀欲出降棄馬踰城而走納新等遣人追及之斬於省門汴民以上親出師日聴㨗報且以二相持重幸以無事俄聞軍敗衛州蒼黄走歸徳民大恐以為不救時汴京内外不通米升䬶二兩百姓糧盡殍者相望縉紳士女多行乞於市至有自食其妻子者至於諸皮器物皆煮食之貴家第宅市樓肆館皆撤以㸑及歸徳遣使迎兩宫人情益不安於是民間有立荆王監國以城歸順之議而二相皆不知也天興二年正月丙寅省令史許安國指講議所言古者有大疑謀及卿士謀及庻人今事勢如此可集百官及僧道士庻問保社稷活生靈之計左司都事元好問以安國之言白納新納新曰此論甚佳可與副樞議之副樞亦以為然好問曰自車駕出京今二十日許又遣使迎兩宫民間洶洶皆謂國家欲棄京城相公何以處之薩尼雅布曰吾二人惟有一死耳好問曰死不難誠安社稷救生靈死方可也如不然徒欲一身飽五十紅納軍亦謂之死耶薩尼雅布欵言曰今日惟吾二人何言不可好問乃曰聞中外人言欲立二王監國以全兩宫與皇族耳薩尼雅布曰我知之矣我知之矣即命召京城百官明日皆聚省中諭以事勢危急當如之何有父老七人陳詞云云二相命好問受其詞白之納新顧曰亦為此事也且問副樞此事謀議㡬日矣薩尼雅布屈指曰七日矣納新曰歸徳使未去慎勿泄或曰是時外圍不解如在陷穽議者欲推立荆王以城出降亦紀季入齊之義况北兵中已有曹王也衆憤二人無策但曰死守而已忽聞召京城士庻計事納新拱立無言獨薩尼雅布反覆申諭國家至此無可奈何凡有可行當共議之且繼以涕泣明日戊辰西面元帥崔立與其黨富珠哩昌格韓鐸藥安國等為變率甲卒二百横刀入省中拔劍指二相曰京城危困已極二公坐視百姓餓死恬不為慮何也二相大駭曰汝輩有事當好議之何遽如是立麾其黨先殺薩尼雅布次殺納新及左司郎中納哈塔徳輝等餘見崔立傳劉祁曰金自南渡後為宰執者無恢復之謀臨事相習低言緩語互相推讓以為養相體毎有四方災異民間疾苦將奏必相謂曰恐聖主心困事至危處輙罷散曰俟再議已而復然或有言當改革者輙以生事抑之故所用必擇愞熟無鋒鋩易制者用之毎北兵壓境則君臣相對泣下或殿上發長吁而已兵退則大張具㑹飲黄閣中矣因循苟且竟至亡國又多取渾厚少文者置之台鼎宣宗嘗責丞相布薩齊錦近來朝廷紀綱安在齊錦不能對退謂郎官曰上問紀綱安在汝等自來何嘗使紀綱見我故正人君子多不見用雖用亦未久而遽退也祁字京叔渾源人贊曰劉京叔歸潛志與元裕之壬辰雜編二書雖微有異同而金末喪亂之事猶有足徴者焉哀宗北禦以孤城弱卒託之納新薩尼雅布二人可謂難矣雖然即墨有安平君玉璧有韋孝寛必有以處此崔立將陵人少貧無行嘗為寺僧負鈸鼓乘兵亂從上黨公開為都統提控積階遥領太原知府正大初求入仕為選曹所駮毎以不至三品為恨圍城中授安平都尉天興元年冬十二月上親出師授西面元帥性淫姣常思亂以快其欲藥安國者管州人年二十餘有勇力嘗為嵐州招撫使以罪繫開封獄既出貧無以為食立將為變潛結納之安國徤啖日飽之以魚遂與之謀先以家置西城上事不勝則挈以逃日與都尉楊善入省中候動靜布置已定召善以早食殺之二年正月遂帥甲卒二百撞省門入内二相聞變趨出立拔劍曰京城危困二公欲如何處之二相曰事當好議之立不顧麾其黨張信之富珠哩昌格出省二相遂遇害馳往東華門道遇㸃檢温都阿里見其衷甲殺之即諭百姓曰吾為二相閉門無謀今殺之為汝一城生靈請命衆皆稱快是日御史大夫費摩阿固岱諌議大夫左右司郎中烏克遜納新左副㸃檢完顏阿薩爾奉御莽格講議富察琦户部尚書完顏珠赫皆死立還省中集百官議所立立曰衛紹王太子從恪其妹公主在北兵中可立之乃遣其黨韓鐸以太后命召從恪須㬰入以太后誥命梁王監國百官拜舞山呼從恪受之遂遣送二相所佩虎符詣蘇布特納欵凡除拜皆以監國為辭立自稱太師軍馬都元帥尚書令鄭王出入御乘輿稱其妻為王妃弟倚為平章政事侃為殿前都㸃檢其黨富珠哩昌格御史中丞韓鐸副元帥兼知開封府事折希顏藥安國張軍努並元帥師肅左右司郎中賈良兵部郎中兼右司都事内府之事皆主之初立假安國之勇以濟事至是復忌之聞安國納一都尉夫人數其違約斬之壬申蘇布特至青城立服御衣儀衞往見之大帥喜飲之酒立以父事之既還悉燒京城樓櫓火起大帥大喜始信其實降也立託以軍前索隨駕官吏家屬聚之省中人自閲之日亂數人猶若不足又禁城中嫁娶有以一女之故殺數人者未㡬遷梁王及宗室近族皆置宫中以腹心守之限其出入以荆王府為私第取内府珍玩實之二月乙酉以天子衮冕后服上進又括在城金銀捜索薰灌訊掠慘酷百苦僃至郕國夫人及内侍髙祐京民李民望之屬皆死杖下温都衛尉親屬八人不任楚毒皆自盡博索夫人右丞李蹊妻子皆被掠死同惡相濟視人如讐期於必報而後己人人竊相謂曰攻城之後七八日之中諸門出葬者開封府計之凡百餘萬人恨不早預其數而值此不幸也立時與其妻入宫兩宫賜之不可勝計立因諷太后作書陳天時人事遣皇乳母招歸徳當時昌進之徒爭援劉齊故事以冀非分者比肩接武三月壬辰立以兩宫梁王荆王及諸宗室皆赴青城甲午北行立妻王氏備仗衞送兩宫至開陽門是日宫車三十七兩太后先中宫次之妃嬪又次之宗族男女凡五百餘口次取三教醫流工匠繡女皆赴北四月北兵入城立時在城外兵先入其家取其妻妾寳玉以出立歸大慟無如之何李琦者山西人為都尉在陳州與鈕祜祿納新同行省事陳州變入京附崔立妹壻折希顏娶𤓰爾佳元之妻年二十餘有姿色立初拘隨駕官家屬妻輿病而往得免琦娶之後有言其美者立欲强之琦毎見立欲奪人妻必差其夫逺出一日差琦出京琦以妻自隨如是者再三立遂欲殺琦琦又數為折希顏所折辱乃首建殺立之謀李伯淵者寳坻人本安平都尉司千户美姿容深沉有謀毎憤立不道欲仗義殺之李齊諾者燕人嘗以軍功遥領京兆府判壬辰冬車駕東狩以都尉權東面元帥立初反以齊諾舊與敵體頗貌敬之數月之後勢已固遂視齊諾如部曲然齊諾積不能平數出怨言至是與琦等合三年六月甲午傳近境有宋軍伯淵等陽與立謀備禦之策翌日晩伯淵等燒外封邱門以警動立是夜立殊不安一夕百卧起比明伯淵等身來約立看火立從苑秀折希顏數騎往諭京城民十五以上七十以下男子皆詣太廟街㸃集既還行及梳行街伯淵欲送立還二王府立辭數四伯淵必欲親送立不疑倉卒中就馬上抱立立顧曰汝欲殺我耶伯淵曰殺汝何傷即出七首横刺之洞而中其手之抱立處再刺之立墜馬死伏兵起元帥洪果薩哈殺苑秀折希顏後至不知見立墜馬謂與人鬬欲前解之隨為軍士所斫被創走梁門外追斬之伯淵繫立屍馬尾至内庭號於衆曰立殺害刼奪烝淫暴虐大逆不道古今無有當殺之不萬口齊應曰寸斬之未稱也乃梟立首望承天門祭哀宗伯淵以下軍民皆慟或剖其心生噉之以三尸挂闕前槐樹上樹忽拔人謂樹有靈亦厭其為所汗已而有告立匿宫中珍玩遂籍其家以其妻王花兒賜丞相鎮海帳下士初立之變也前䕶衞布希舒嚕負祖宗御容五走蔡前御史中丞富察世達西面元帥博斯呼挈其家亦自拔歸蔡七月己巳以世達為尚書吏部侍郎權行六部尚書世達嘗為左司郎中同簽樞宻院事充益政院官皆稱上意及上幸歸徳遣世達督陳糧運陳變世達亦與脅從尋間道之汴至是徒往行在上念其舊錄用之左右司官因奏博斯呼舒嚕亦宜任用上曰世達曲從非出得已然朕猶少降資級以示薄罰彼博斯呼掌軍一面舒嚕宿衞九重崔立之變曾不聞發一矢束手於人今雖來歸待以不死足以示恩又安得與世達等博斯呼老矣量用其子可也舒嚕但當酬其負御容之勞未㡬以博斯呼為北門都尉其子為本軍都統舒嚕復充䕶衞世達字正夫泰和三年進士論曰崔立納欵使其開府庫籍人民以俟大朝之命可也乘時僭竊大肆淫虐徴索横暴輙以供備大軍為辭逞欲由己歛怨歸國其為罪不容誅矣而其志方且要求劉豫之事我大朝豈肯效尤金人者乎金俘人之主帝人之臣百年之後適啟崔立之狂謀以成青城之烈禍曾子曰戒之戒之出乎爾反乎爾者也豈不信哉聶天驥字元吉五臺人至寧元年進士調汝隂簿厯睢州司候封邱令興定初辟為尚書省令史時胥吏擅威士人往往附之獨天驥不少假借彼亦不能害也尋授吏部主事權監察御史夏使賀正旦互市於㑹同館外戚有身貿易於其間者天驥上章曰大官近利失朝廷體且取輕外方遂忤太后上出為同知汝州防禦使事未赴陜西行尚書省驛召特旨遥領金安軍節度副使兼行尚書省都事未㡬入為右司員外郎轉京兆治中尋為衞州行尚書六部事慶陽圍急朝廷遣宿州衞總帥約赫徳救之以天驥充經歴官圍解從别帥守邠帥欲棄州而東天驥力勸止之不從帥坐是被繫逮天驥降京兆治中尋有訟其寃者即召為開封簽事旬月復右司員外郎丁母憂未卒哭奪哀復職哀宗遷歸徳天驥留汴中崔立變天驥被創甚卧十餘日而其女舜英謁醫救療天驥歎曰吾幸得死兒女曹乃為謁醫尚欲我活耶竟鬱鬰以死舜英𦵏其父明日亦自縊有傳天驥沉靜寡言不妄交起於田畝能以雅道自將踐歴臺省若素宦然諸人多自以為不及也持嘉烏新字大用上京人當襲其父穆昆不願就中明昌五年策論進士第後選為尚書省令史吏部主事監察御史言諸王駙馬至京師和買諸物失朝廷體有詔禁止遷鎮南將軍節度使息州刺史耕鞠埸種禾兩禾合穗進於朝特詔襃諭改丹州遷鄭州防禦使權許州統軍使丞相髙汝礪嘗薦其才可任宰相元光二年正月召為户部侍郎未㡬權參知政事二月為户部尚書權職如故三月拜參知政事兼修國史詔諭近臣曰烏新資禀純質事可倚任且其性孝朕今相之國家必有望汝輩當效之也正大元年五月拜尚書右丞哀宗欲修宫室烏新極諫至以臥薪嘗膽為言上悚然從之同判睦親府内族薩哈連交結中外久在禁近哀宗為太子有定策功由是頗惑其言復倚信日深臺諌毎以為言太后嘗戒敕曰上之騎鞠舉樂皆汝教之再犯必杖汝哀宗終不能去烏新諫曰薩哈連姦諛之最日在天子左右非社稷福上悔悟出為中京留守朝論快之五年致仕居汴中崔立之變明日召家人付以後事望睢陽慟哭以弓弦自縊而死時年六十三一子名棟齊没於兵間弟秉甫字正之贊曰聶天驥素履清慎持嘉烏新天資忠諒在治世皆足為良臣不幸仕亂離之朝以得死為願欲哀哉金史卷一百十五
