body:
  text: 金史卷二十八元中書右丞相總裁托克托等修志第九禮一郊金人之入汴也時宋承平日久典章禮樂粲然備具金人既悉收其圖籍載其車輅法物儀仗而北時方事軍旅未遑講也既而即㑹寧建宗社庶事草創皇統間熙宗巡幸析津始乗金輅導儀衛陳鼓吹其觀聴赫然一新而宗社朝㑹之禮亦次第舉行矣繼以海陵狼顧志欲併吞江南乃命官修汴故宫繕宗廟社稷悉載宋故禮器以還外而黷武内而縱欲其猷既失奚敢議禮樂哉世宗既興復収嚮所遷宋故禮器以旋迺命官參校唐宋故典沿革開詳定所以議禮設詳校所以審樂統以宰相通學術者於一事之冝適一物之節文既上聞而始彚次至明昌初書成凡四百餘卷名曰金纂修雜録凡事物名數支分派引珠貫棊布井然有序炳然如丹又圖吉凶二儀鹵簿十三節以備大葬小鹵簿九節以備郊廟而命尚書左右司春官兵曹太常寺各掌一本其意至深逺也是時㝢内阜安民物小康而維持幾百年者實此乎基嗚呼禮之為國也信矣夫而況闗睢麟趾之化其流風遺思被於後世者為何如也宣宗南播彊宇日蹙旭日方升而爝火之燃蔡流弗東而餘燼滅矣圖籍散逸既莫可尋而其宰相韓企先等之所論列禮官張瑋與其子行簡所私著自公紀亦亡其𫝊故書之存僅集禮若干卷其藏史館者又殘缺弗完姑掇其郊社宗廟諸神祀朝覲㑹同等儀而為書若夫凶禮則略焉葢自熙宗海陵衛紹王之繼弑雖曰鹵簿十三節以備大葬其行乎否耶葢莫得而考也故宣孝之喪禮雖存亦不復紀噫告朔餼羊雖孔子所不去而史之缺文則亦慎之作禮志南北郊金之郊祀本於其俗有拜天之禮其後太宗即位乃告祀天地葢設位而祭也天徳以後始有南北郊之制大定明昌其禮寖備南郊壇在豐宜門外當闕之已地圓壇三成成十二陛各按辰位壝墻三匝四面各三門齋宫東北厨庫在南壇壝皆以赤土圬之北郊方丘在通𤣥門外當闕之亥地方壇三成成為子午卯酉四正陛方壝三周四面亦三門朝日壇曰大明在施仁門外之東南當闕之卯地門壝之制皆同方丘夕月壇曰夜明在彰義門外之西北當闕酉地掘地汙之為壇其中常以冬至日合祀昊天上帝皇地祗於圜丘夏至日祭皇地祗於方丘春分朝日於東郊秋分夕月於西郊大定十一年始郊命宰臣議配饗之禮左丞石琚奏曰按禮記萬物本乎天人本乎祖此所以祖配上帝也葢配之者侑神作主也自外至者無主不止故推祖考配天尊之也兩漢魏晉以來皆配以一祖至唐髙宗始以髙祖太宗崇配垂拱初又加以髙宗遂有三祖同配之禮至宋亦嘗以三帝配後禮院上議以為對越天地神無二主由是止以太祖配臣謂冬至親郊宜從古禮上曰唐宋以私親不合古不足為法今止當以太祖配又謂宰臣曰本國拜天之禮甚重今汝等言依古制築壇亦宜我國家絀遼宋主据天下之正郊祀之禮豈可不行乃以八月詔曰國莫大于祀祀莫大于天振古所行舊章咸在仰惟太祖之基命詒我本朝之燕謀奄有萬邦于今五紀因時制作雖增飾于國容推本奉承猶未遑于郊見況天休滋至而年穀屢豐敢不繹敷曠文明昭太報取陽升之至日將親饗于圜壇嘉與臣工共圖熙事以今年十一月十七日有事于南郊咨爾有司各揚乃職相予肆祀罔或不欽乃於前一日遍見祖宗告以郊祀之事其日備法駕鹵簿躬詣郊壇行禮儀注齋戒用唐制大祀散齋四日致齋三日中祀散齋二日致齋一日天子親祀皆前期七日攝太尉誓亞終獻官親王陪祀皇族於宫省皇族十五以上官雖不至七品者亦助祭受誓又誓百官於尚書省攝太尉南向司徒北向監祭御史在西監禮博士居束皆相向太常卿在司徒後重行北向司天監光禄丞太廟令丞大樂令丞太官令丞良醖令廩犧令郊社丞司尊太祝奉禮郎協律郎諸執事官皆重行西上北向禮直官以誓文授攝太尉乃誓曰維某年歳次某甲某月某日某甲皇帝有事於南郊各揚其職其或不㳟國有常刑禮直官贊曰七品以下官皆退餘皆再拜退誓於宫省之儀皆同於是皇帝散齊于别殿前致齋一日尚舍設御坐於大安殿當中南向設東西房於御坐之側設御幄於室内施簾於楹下享前三日陳設小次享前一日設拜褥及皇帝版位皇帝飲福位及黄道氊褥自玉輅下至升輿所及致齋之日通事舍人引文武五品以上官陪位如式諸侍衛之官各服其器服並結珮俱詣閤奉迎上丑二刻侍中板奏外辦皇帝服衮冕結珮乗輿出警蹕侍衛如常儀皇帝即御坐東向坐通事舍人承𫝊殿上下俱拜訖西面贊各祗候一刻頃侍中跪奏臣某言請降就齋俛伏興還侍位皇帝降座入室羣官皆退諸執事官皆宿於正寢治事如故不弔喪問疾不判署刑殺文字不決罰罪人不與穢惡事致齋日惟祀事則行餘悉禁已齋而闕者通攝行事陳設前祀五日儀鸞尚舍陳設齋宫有司設扈從侍衛次於宫東西又設陪祀親王次宫東稍南西向北上宗室子孫位於其後又設司徒亞終獻行事執事官次於壇南外壝門之東西向北上重行異位又設天名房在壇南外壝門之東西向大禮使次於其後皆西向又設席大屋於壇外西北駐車輅以備風雪祀前三日尚舍設大次於東壝外門内道北南向又設小次於璮下卯陛之北南向有司設饌幔於東壝中門之北南向設兵衛各服其器服守衛壝門每門二人郊社令帥其屬埽除壇之上下及壝之内外乃為燎位在南中壝東門之東壇之巳位又為瘞坎在中壝内戍位祀前二日大樂令帥其屬設登歌之樂於壇上稍南北向玉磬在午陛之西金鐘在午陛之東柷一在鐘前稍北敔一在磬前稍北東西相向歌工之次餘工各立於縣後琴瑟在前匏竹在後於壇下第一等上皆重行異位北向又設宫縣樂南壝外門之外八脩二舞表於樂前又設采茨樂於應天門前祀前一日奉禮郎升設皇帝版位於壇上辰巳之間北向又設皇帝飲福位於其左稍却北向又帥禮直官設亞終獻位於卯陛之東北西向北上司徒位於卯陛之東道南西向禮部尚書太常卿光禄卿禮部侍郎位各次之太常丞光禄丞又次之又設大禮使位於小次之左少却西向又設分獻官司天監讀冊中書侍郎位於中壝門道北西向郊社令廪犧令太官令良醖令位於其後又設郊社丞大祝奉禮郎以下諸執事官於其後皆西向重行異位又設從祀文武羣官一品至五品位於中壝門内道南西向皆重行立又設助奠祝史齋郎位於東壝門外道北西向又設陪祀皇族於道南西向六品至九品從祀羣官又於其南皆西向重行異位各依其品又設監祭御史二員一員在午陛之西南一員在子陛之西北皆東向又設監禮博士二員一員在午陛之東南一員在子陛之東北皆西向又設大樂令位於樂簴之間稍東西向協律郎位於樂簴之西東向又設奉禮郎於壇南稍東西向贊者次之司尊位於酌尊所俱北向又設牲牓於外壝東門之外西向饌牓於其北稍西南向牲牓之東牲位太史太祝各位於牲後俱西向又設禮部尚書太常卿光禄卿位於牲牓南稍北西向太常丞光禄丞太官令位於其後監祭御史監禮博士於禮部尚書位之西稍却北向廪犧令位在牲位西南北向又陳禮饌於饌牓之前案上未後三刻陳饌之時又設禮部尚書太常卿光禄卿位於案前稍東北上西向太常丞光禄丞大官令位於其後西向又設監祭御史監禮博士位於案前稍西北上東向又設異寳嘉瑞位於宫縣西北太府少監位於寳後諸州歳貢位於宫縣東北户部郎中位於其後天子八寳位於宫縣西南符寳郎八員各於寳後伐國毁寳位於宫縣東南少府少監位於其後又設大樂令位於宫縣之北稍東協律郎二在大樂令南東西相向司天監未後二刻同郊社令升設昊天上帝皇地祗神座於壇上北方南向地祗位在東稍却席皆以藁秸太祖配位座於東方西向席以蒲越五方帝日月神州地祗天皇大帝北極神座於壇上第一等席皆藁秸内官五十四座五神五官嶽鎮海瀆二十九座於壇第二等中官一百五十八座崑崙山林川澤二十一座於壇上第三等外官一百六十座邱陵墳衍原隰三十座於内壝之内衆星三百六十座在内壝之外席皆以莞神座版各設於座首又設禮神玉俟告潔畢權徹去壇上及第一等神位祀日前五刻重設奉禮郎同司尊及執事者設天地配位各左十有一籩右十有一豆俱為三行豋三在籩豆間簠一簋一於豋前簠在左簋在右各於神座前藉以席又設天地位太尊各二著尊各二犧尊各二山罍各二壇上東南隅配位著尊二犧尊二象尊二在天地位酒尊之東俱北向西上皆有坫加勺羃為酌尊所又天地位象尊各二壺尊各二山罍各四在壇下午陛之南北向西上配位壺尊二山罍四在酉陛之北東向北上皆有坫設而不酌亦左以明水右以𤣥酒又設五方帝日月神州地祗天皇大帝北極第一等皆左八籩右八豆登在籩豆間簠一簋一在豋前爵坫一在神座前第一等内官五十四座五神五官嶽鎮海凟二十九座毎座籩二豆二簠一簋一俎一爵坫一第二等中官一百五十八座崑崙山林川澤二十一座及内壝内外官一百六十座邱陵墳衍原隰三十座内壝外衆星三百六十座毎位籩二豆二簠一簋一俎一爵一又設第一等毎位太尊二著尊二皆有坫加勺第二等毎位山尊二第三等毎位蜃尊二内壝内外毎辰槩尊二皆加勺自第二等已下皆用匏爵先洗拭訖置於尊所其尊所皆在神位之左凡祭器皆藉以席籩豆各加中葢又設天地及配位籩一豆一簠一簋一俎四及毛血豆各一并第一等神位每位俎二在饌幔内又設皇帝洗位於卯陛下道北南向盥洗在東爵洗在西匜在東巾在西篚南肆實玉爵坫又設亞終獻洗位在小次之東南向盥洗在東爵洗在西加勺篚在西南肆加巾又設第一等分獻官盥洗爵洗位及第二等分獻官盥洗位各於其辰陛道之左罍在洗左篚在洗右俱内向執罍篚者位於其後太府監少府監祀前一日未後二刻帥其屬升壇陳玉幣昊天上帝以蒼璧蒼幣皇地祗以黄琮黄幣配位以蒼幣黄帝以黄琮青帝以青珪赤帝以赤璋大明以青珪璧白帝以白琥黑帝以𤣥璜北極以青珪璧天皇大帝以𤣥珪璧神州地祗以𤣥色兩珪有邸皆置於匣五帝之幣各從其方色凡幣皆陳於篚設訖俟告潔訖權徹去祀日重設祀日丑前五刻禮部設祝冊神座之右皆藉以案太常卿明燈燎户部郎中設諸州歲貢於宫縣東北金為前列玉帛次之餘為從列皆籍以席立於歲貢之後北向太府監少府監設異寶嘉瑞於宫縣西北上瑞居前中下次之皆藉以席立於寶後北向少府少監設伐國毁寶於宫縣東南皆籍以席立於寶後北向符寶郎設八寶於宫縣西南各分立於寶南皆北向司天監太府監少府監郊社令奉禮郎升設昊天上帝皇地祗配位及壇上第一等神座又設玉幣各於其位太祝取瘞玉加於幣以禮神之玉各置於神座前乃退光禄卿帥其屬入實祭器昊天上帝皇地祇配位每位籩三行以右為上形鹽在前魚鱐糗餌次之第二行榛實在前乾桃乾䕩乾棗次之第三行乾菱在前乾芡乾栗鹿脯次之豆三行以左為上芹菹在前筍菹葵菹次之第二行薤菹在前菁菹魚醢兎醢次之第二行豚胉在前醓醢酏食鹿臡次之簠黍簋稷豋皆大羮第一等壇上一十位毎位皆實籩三行以右為上形鹽在前魚鱐次之第二行乾䕩在前桃棗次之第三行乾芡在前榛實鹿脯次之豆三行以左為上芹菹在前筍菹次之第二行菁菹在前薤菹魚醢次之第三行豚胉在前醓醢次之鹿臡次之簠黍簋稷豋大羮第二第三等毎位籩二鹿脯乾棗豆二鹿臡菁菹俎羊一段内