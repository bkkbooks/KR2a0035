  text: 金史巻五十七元中書右丞相總裁托克托等修志第三十八百官三内命婦屬官人女職屬皇后位下女職屬東宫官親王府太后兩宫官提大興府舉等職諸京留守司路諸京城宮苑按察司諸總管府諸府轉諸節鎮防禦刺史縣鎮等職等職諸運泉穀等職諸府鎮兵馬諸明安部族及羣牧等職内命婦品元妃貴妃淑妃德妃賢妃正一品昭儀昭容昭媛修儀修容修媛充儀充容充媛曰九嬪正二品媫妤正三品羙人正四品才人正五品各九員曰二十七世婦寳林正六品御女正七品采女正八品各二十七員曰八十一御妻按金格貞祐後之制貴妃下有真妃淑妃下有麗妃柔妃而無德妃賢妃九嬪曰婕妤下有麗人才人為正三品順儀淑華淑儀為正四品尚宫夫人尚宫左夫人尚宫右夫人宫正夫人寳華夫人尚儀夫人尚服夫人尚寝夫人欽聖夫人資明夫人為正五品尚儀御侍尚服御侍尚寝御侍尚正御侍寶符宸侍奉恩令人奉光令人奉徽令人奉羙令人為正六品司正御侍寶符御侍司儀御侍司符御侍司寝御侍司餙御侍司設御侍司衣御侍司膳御侍司藥御侍仙韶使光訓良侍明訓良侍遵訓良侍從訓良侍為正七品典儀御侍典膳御侍典寝御侍典餙御侍典設御侍典衣御侍典藥御侍仙韶副使承和良侍承惠良侍承宜良侍為正八品掌儀御侍掌服御侍掌寝御侍掌餙御侍掌設御侍掌衣御侍掌膳御侍掌藥御侍仙船掌音祗肅良御祗敬良侍祇愿良侍為正九品宫人女官職員品秩皆同唐制尚宫二人掌導引皇后管司記司言司簿司闈仍總知五尚湏物出納等事司記二人典記二人掌記二人掌在内諸文書出入目録為記審訖付行縣印等事女史六人掌職文簿司言二人典言二人掌言二人女史四人掌宣傳啓奏之事司簿二人典簿二人掌簿二人女史六人掌宫人名簿廩賜之事司闈六人典闈六人掌闈六人女史四人掌宫闈管鑰之事尚儀二人掌禮儀起居管司籍司樂司賔司贊事司籍二人典籍二人掌籍二人女史十人掌經籍教學紙筆几案之事司樂四人典樂四人掌樂四人女史二人掌音樂之事司賔二人典賔二人掌賔二人女史二人掌賔客参見朝㑹引導之事司贊二人典贊二人掌贊二人女史二人彤史二人掌禮儀班序設板贊拜之事尚服二人掌司寳司衣司餙司杖之事司寳二人典寳二人掌寳二人女史四人掌珍寳符契圖籍之事司衣二人典衣二人掌衣二人女史四人掌御衣服首餙之事司餙二人典餙二人掌餙二人女史二人掌膏沐巾櫛服玩之事司仗二人典仗二人掌仗二人女史二人掌仗衛兵器之事尚食二人掌知御膳進食先嘗司膳司醖司藥司饎事司膳四人典膳四人掌膳四人女史四人掌膳羞器皿司醖二人典醖二人掌醖二人女史二人掌酒醴司藥二人典藥二人掌藥二人女史二人掌醫藥司饎二人典饎二人掌饎二人女史二人掌宫人食并柴炭之事尚寝二人管司設司輿司苑司燈事司設二人典設二人掌設二人女司二人掌帷帳牀褥枕席洒掃鋪設司輿二人典輿二人掌輿二人女史二人掌輿繖扇羽儀司苑二人典苑二人掌苑二人女史二人掌苑囿種植蔬果司燈二人典燈二人掌燈二人女史二人掌燈油火燭尚功二人掌女功管司製司珍司綵司計司製二人典製二人掌製二人女史二人掌裁縫衣服簒組之事司珍二人典珍二人掌珍二人女史二人掌金珠玉寳財貨之事司綵二人典綵二人掌綵二人女史二人掌錦文緋綵絲帛之事司計二人典計二人掌計二人女史二人掌支度衣服飲食柴炭雜物之事宫正二人掌總知宫内格式糾正推罸之事司正二人同掌典正二人糾察違失女史四人皇后位下女職依隆慶宫所設人數大定元年定司閨一員八品掌宫内諸事并給散宫人俸給食料秉儀一員八品丞儀一員九品掌左右給事宣傳啓奏經籍紙筆之事直閤一員司陳一員九品掌帳幕牀褥輿繖洒掃鋪陳薪炭燈燭之事秉衣一員奉衣一員九品掌首餙衣服器玩諸寳財貨裁製縑綵之事掌饌一員八品奉饌一員九品掌飲食湯藥酒醴蔬果之事東宫官宫師府太子太師太子太傅太子太保正二品太子少師太子少傅太子少保正三品掌保䕶東宫導以德儀海陵天德四年始定制宫師府三師三少詹事院詹事三寺十率府皆𨽻焉左右諭德為東宫僚屬詹事院太子詹事從三品少詹事從四品掌總統東宫内外庻務左右衛率府從五品掌周衛導從儀仗左右監門正六品掌門衛禁鑰僕正正六品副僕正七品僕丞正九品掌車馬廐牧弓箭鞍轡噐物等事掌寳二人從六品掌奉寳謹其出入典儀從六品贊儀從七品司贊禮儀侍正正七品侍丞正八品掌冠帶衣服左右給使之事典食令正八品丞正九品承奉膳羞侍藥正八品奉藥正九品承奉醫藥掌飲令正八品丞正九品承奉賜茶及酒果之事家令正八品家丞正九品掌營繕栽植鋪設及燈燭之事司經正八品副正九品掌經史圖籍筆硯等事司藏從八品副從九品掌庫藏財貨出入之事司倉從八品副從九品掌倉廩出納薪炭等事中侍局都監正九品同監從九品掌東閤内之禁令省察宫人廩賜給納諸物轄侍人等左諭徳右諭德正五品左贊善右贊善正六品掌贊諭道德侍從文章内直郎正七品右屬宫師府親王府屬官傅正四品掌師範輔導恭議可否若親王在外亦兼本京節鎮同知府尉從四品本府長史從五品明昌三年改掌警嚴侍從兼總統本府之事司馬從六品同檢校門禁總統府事文學二人從七品掌贊導禮義資廣學問記室叅軍正八品掌表牋書啓之事大定七年八月始置二十年不專除令文學兼之諸駙馬都尉正四品提舉衛紹王家屬提舉從六品同提舉從七品舊為東海郡侯邑令丞提舉鎬厲王家屬提舉同提舉以上二宅天興元