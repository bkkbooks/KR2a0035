body:
  text: 金史卷二十一元中書右丞相總裁托克托等修志第二厯上步氣朔步晷漏步卦候步日纒昔者聖人因天道以授人時釐百工以熙庶政步推之法其來尚矣自漢太初迄於前宋治厯者奚啻七十餘家大槩或百年或數十年率一易焉葢日月五星盈縮進退與夫天運至不齊也人方製器以求之以俾其齊積寡至多不能無爽故爾金有天下百餘年厯惟一易天㑹五年司天楊級始造大明厯十五年春正月朔始頒行之其法以三億八千三百七十六萬八千六百五十七為厯元五千二百三十為日法然其所本不能詳究或曰因宋紀元厯而増損之也正隆戊寅三月辛酉朔司天言日當食而不食大定癸巳五月壬辰朔日食甲午十一月甲申朔日食加時皆先天丁酉九月丁酉朔食乃後天由是占候漸差乃命司天監趙知㣲重修大明厯十一年厯成時翰林應奉耶律履亦造乙未厯二十一年十一月望太隂虧食遂命尚書省委禮部員外郎任忠傑與司天厯官驗所食時刻分秒比校知㣲履及見行厯之親疎以知㣲厯為親遂用之明昌初司天又改進親厯禮部郎中張行簡言請俟他日月食覆校無差然後用之事遂寢是以終金之世惟用知㣲厯我朝初亦用之後始改授時厯焉今其書存乎太史采而録之以為厯志步氣朔第一演紀上元甲子距今大定庚子八千八百六十三萬九千六百五十六年日法五千二百三十分嵗實一百九十一萬二百二十四分通餘二萬七千四百二十四分朔實一十五萬四千四百四十五分通閏五萬六千八百八十四分嵗䇿三百六十五日餘一千二百七十四分朔䇿二十九日餘二千七百七十五分氣䇿一十五日餘一千一百四十二分六十秒望䇿一十四日餘四千二分四十五秒象䇿七日餘二千二分二十二秒半没限四千八十七分三十秒朔虚分二千四百五十五分旬周三十一萬三千八百分紀法六十秒母九十求天正冬至置上元甲子以來積年嵗實乗之為通積分滿旬周去之不盡以日法約之為日不盈為餘命甲子算外即所求天正冬至日大小餘求次氣置天正冬至大小餘以氣䇿累加之秒盈秒母從分分滿日法從日即得次氣日及餘秒求天正經朔以朔實去通積分不盡為閏餘以減通積為朔積分滿旬周去之不盡如日法而一為日不盈為餘即所求天正經朔大小餘也求弦望及次朔置天正經朔大小餘以象䇿累加之即各得弦望及次朔經日及餘秒也求没日置有没之恒氣小餘如没限已上為有之氣以秒母乗之内其秒用減四十七萬七千五百五十六餘滿六千八百五十六而一所得併恒氣大餘命為没日求滅日置有滅之朔小餘經朔小餘不滿朔虚分者六因之如四百九十一而一所得併經朔大餘命為滅日步卦候第二候䇿五餘三百八十秒八十卦䇿六餘四百五十七秒六貞䇿三餘二百二十八秒四十八秒母九十辰法二千一百一十五半辰法一千三百七半刻法三百一十三秒八十辰刻八一百四分秒六十半辰刻四五十二分秒三十秒母一百求七十二候置中氣大小餘命之為初候以候䇿累加之即次候及末候也求六十四卦置中氣大小餘命之為公卦以卦䇿累加之得辟卦又加之得侯内卦以貞䇿加之得節氣之初為侯外卦又以貞䇿加之得大夫卦又以卦䇿加之為卿卦求土王用事以貞䇿減四季中氣大小餘即土王用事日也求𤼵斂置小餘以六因之如辰法而一為辰如不盡以刻法除之為刻命子正算外即得加時所在辰刻及分如加半辰法即命子刻初二十四氣卦候步日躔第三周天分一百九十一萬二百九十三分五百三十秒嵗差六十九五百三十秒秒母一萬周天三百六十五度二十五分六十八秒象限九十一三十分九秒二十四氣日積度及盈縮恒氣日積度分秒損益率初末率日差盈縮積二十四氣中積及脁朒求每日盈縮朓朒各置其氣損益率求盈縮用盈縮之損益求朓朒用朓朒之損益六因如象限而一為氣中率與後氣中率相減為合差半合差加減其氣中率為初末汎率至後加初減末分後減初加末又置合差六因如象限而一為日差半之加減初末汎率為初末定率至後減初加末分後加初減末以日差累加減其氣初末定率為毎日損益分至後減分後加各以毎日損益分加減氣下盈縮朓朒為毎日盈縮朓朒二分前一氣無後率相減為合差者皆用前氣合差求經朔弦望入氣置天正餘以日法除為日不滿為餘如氣已下以減氣䇿為入大雪氣䇿已上去之餘亦減氣䇿為入小雪氣即得天正經朔入氣日及餘也以象䇿累加之滿氣䇿去之即得弦望入次氣日及餘因加後朔入氣日及餘也求每日損益盈縮朓朒以日差益加減損加減其氣初損益率為毎日損益率馴積損益其氣盈縮朓朒積為毎日盈縮朒積求經朔弦望入氣朓朒定數各以所入恒氣小餘以乗其日損益率乗如日法而以所得損益其下朓朒積為定數赤道宿度斗二十五度牛七度少女十一度少虚九度少秒六十八危十五度半室十七度壁八度太右北方七宿九十四度秒六十八奎十六度半婁十二度胃十五度昴十一度少畢十七度少觜半度參十度半右西方七宿八十三度井三十二度少鬼二度半栁十三度太星六度太張十七度少翼十八度太軫十七度右南方七宿一百九度少角十二度亢九度少氐一十六度房五度太心六度少尾十九度少箕十度半右東方七宿七十九度求冬至赤道日度置通積分以周天分去之餘日法而一為度不滿退除為分秒以百為母命起赤道虚宿七度外去之至不滿宿即所求年天正冬至加日躔赤道宿度及秒求春分夏至秋分赤道日度置天正冬至加時赤道日度累加象限滿赤道宿次去之即各得春分夏至秋分時日在宿及分秒求四正赤道宿積度置四正赤道宿全度以四正赤道日度及分減之餘為距後度以赤道宿度累加之各得四正後赤道宿積度及分求赤道宿積度入初末限視四正後赤道宿積度及分在四十五度六十五分秒五十四半已下為入初限已上者用減象限餘為入末限求二十八宿黄道度以四正後赤道宿入初末限度及分減一百一度餘以初末限度及分乘之進位滿百為分分滿百為度至後以減分後以加赤道宿積度為其宿黄道積度以前宿黄道積度減之其四正之宿先加象限然後前宿減之為其宿黄道度及分其分就近約為太半少黄道宿度斗二十二度牛七度女十一度虚九度少秒六十八危十六度室十八度少壁九度半右北方七宿九十四度六十八秒奎二十七度太婁十二度太胃十五度半昴十一度畢十六度半觜半度參九度太右西方七宿八十二度太二百七十七十五六八井三十度半鬼二十度半栁十三度少星六度太張十七度太翼二十度軫十八度半右南方七宿一百九度少二百八十七角十二度太亢九度太氐十六度少房五度太心六度尾十八度少箕九度半右東方七宿七十八度少三百六十五二十五六十八前黄道宿度依今歴嵗差所在算定如上考往古下驗將來當據嵗差毎移一度依然推變當時宿度然可歩曜知其所在求天正冬至加時黄道日度以冬至加時赤道日度及分秒減一百一度餘以冬至赤道日度及分秒乗之進位滿百為分分滿百為度度命黄赤道差用減冬至加時赤道日度及分秒即所求年天正冬至加時黄道日度及分秒求二十四氣加時黄道日度置所求年冬至日躔黄赤道差以次年黄赤道差減之餘以所求氣數乗之二十四而一所得以加其氣中積及約分又以其氣初日盈縮數盈加縮減之用加冬至加時黄道日度依宿次去之即各得其氣加時黄道日躔宿度及分秒如其年冬至加時赤道加宿度空分秒在嵗差已下者即加前宿全度然求黄赤道差餘以術算求二十四氣每日晨前夜半黄道日度副置其氣小餘以其氣初日損益率乗之盈縮之損益萬約之為分應益者盈加縮減應損者盈減縮加其副日法除之為度不滿退除為分秒以減其氣加時黄道日度即各得其氣初日晨前夜半黄道日度毎日加一度以百約每日損益率盈縮之損益應益者盈加縮減應損者盈減縮加為毎日晨前夜半黄道日度及分秒求毎日午中黄道日度置一萬分以所入氣日盈縮損益率應益者盈加縮減應損者盈減縮加皆加減損益率餘半之滿百為分不滿為秒以加其日晨前夜半黄道日度即其日午中日躔黄道宿度及分秒求每日午中黄道積度以二至加時黄道日度距至所求日午中黄道日度為入二至後黄道積度分秒求每日午中黄道入初末限視二至後黄道積度在四十三度一十二分秒八十七已下為初限已上用減象限餘為入末限其積度滿象限去之為二分後黄道積度在四十八度一十八分秒二十二已下為初限已上用減象限餘為入末限求每日午中赤道日度以所求日午中黄道積度入至後初限分後末限度及分秒進三位加二十萬二千五十少開平方除之所得減去四百四十九半餘在初限者直以二至赤道日度加而命之在末限者以減象限餘以二分赤道日度加而命之即毎日午中赤道日度以所求日午中黄道積度入至後末限分後初限度及分秒進三位用減三十萬三千五十少開平方除之所得以減五百五十半其在初限者以所減之餘直以二分赤道日度加而命之在末限者以減象限餘以二至赤道日度加而命之即毎日午中赤道日度太陽黄道十二次入宫宿度雨水危十三度三十九分五十九秒外入衛分陬訾之次辰在亥春分奎二度三十五分八十五秒外入魯分降婁之次辰在戌穀雨胃四度二十四分三十三秒外入趙分大梁之次辰在酉小滿畢七度九十六分六秒外入晉分實沈之次辰在申夏至井九度四十七分一十秒外入秦分鶉首之次辰在未大暑栁四度九十五分二十六秒外入周分鶉火之次辰在午處暑張十五度五十六分三十五秒外入楚分鶉尾之次辰在已秋分軫十度四十四分五秒外入鄭分夀星之次辰在辰霜降氐一度七十七分七十七秒外入宋分大火之次辰在卯小雪尾三度九十七分九十二秒外入燕分析木之次辰在寅冬至斗四度三十六分六十二秒外入吳越分星紀之次辰在丑大寒女二度九十一分九十一秒外入齊分𤣥枵之次辰在子求入宫時刻各置入宫宿度及分秒以其日晨前夜半日度減之相近一度之間者求之餘以日法乗其分其秒從於下亦通乗之為實以其日太陽行分為法實如法而一所得依發斂加時求之即得其日太陽入宫時刻及分秒步晷漏第四中限一百八十二日六十二分一十八秒冬至初限夏至末限六十二日二十分夏至初限冬至末限一百二十日四十二分冬至地中晷影常數一丈二尺八寸三分夏至地中晷影常數一尺五寸六分周法一千四百二十八内外法一萬八百九十六半法二千六百一十五日法四分之三三千九百二十二半日法四分之一一千三百七半昏明分一百三十分七十五秒昏明刻二刻一百五十六分九十秒刻法三百一十三分八十秒秒母一百求午中入氣中積置所求日大餘及半法以所入之氣大小餘減之為其日午中入氣以加其氣中積為其日午中中積小餘以日法除為約分求二至後午中入初末限置午中中積及分如中限已下為冬至後已上去中限為夏至後其二至後如在初限已下為初限已上覆減中限餘其入末限也求午中晷影定數視冬至後初限夏至後末限百通日内分自相乗副置之以一千四百五十除之所得加五萬三百八十折半限分併之除其副為分分滿十為寸寸滿十為尺用減冬至地中晷影常數為所求晷影定數視夏至後初限冬至後