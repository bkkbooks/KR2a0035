body:
  text: 金史卷八十元中書右丞相總裁托克托等修列傳第十八熙宗二子濟安道濟錫黙阿里托克索烏雅富埒琿持嘉暉大㚖本名托卜嘉磐本名富色克阿里布子方熙宗諸子悼平皇后生太子濟安賢妃生魏王道濟濟安皇統二年二月戊子生於天開殿上年二十四始有皇子喜甚遣使馳報明徳宫太皇太后五日命名大赦天下三月甲寅告天地宗廟丁巳翦鬌奏告天地宗廟戊午冊為皇太子封皇后父太尉和坦為王賜人口馬牛五百駞五十羊五千隨朝職官竝遷一資皆有賜已未詔天下十二月濟安病劇上與皇后幸佛寺焚香流涕哀禱曲赦五百里内罪囚是夜薨謚英悼太子葬興陵之側上送至烏濟赫水而還命工塑其像于儲慶寺上與皇后幸寺安置之海陵毁上京宫室寺亦隨毁道濟皇統三年命為中京留守以直學士阿蘭為都提㸃張𤣥素為同提㸃左右輔導之俄封魏王封其母為賢妃初居外至是養之宫中未幾熙宗怒殺之贊曰國初制度未立太宗熙宗皆自安班貝勒即帝位安班貝勒者漢語云最尊官也熙宗立濟安為皇太子始正名位定制度焉錫黙阿里父歡塔穆宗時内附數有戰功阿里年十七從伯父和摩爾噶討卓多獲其弟薩勒扎髙麗築九城於海蘭甸歡塔攻之遇敵於穆爾茂甸力戰乆之阿里挺槍馳刺其將於陣中敵遂潰歡塔與碩碩歡合兵於圖們水阿里首敗敵兵取其二城髙麗入㓂以我兵屯守要害不得進乃還阿里追及于海蘭水髙麗人爭走水上阿里乘之殺畧幾盡遂合兵于碩碩歡道遇敵兵五萬擊走之又與碩碩歡遇敵七萬阿里先登奮擊大敗之碩碩歡曰汝一日之間三破重敵功豈可忘乃厚賜之哈薩額特布攻圖吉城阿里鑿墉為門日已暮不可入以兵守之旦日遂取其城額特布以被甲并乘馬賜之從攻下寧江州授明安又從攻信州賔州皆克之遼人來攻貝勒和索哩城阿里率百餘騎救之遼兵數萬阿里兵少乃令軍士裂衣多為旗幟出山谷間遼兵望見遯去蘇復州叛衆至十萬旁近女直皆保於太尉和碩家築壘為固敵圍之數重守者糧芻俱盡牛馬相食其鬉尾人易子而食夜縋二人出告急於阿里阿里赴之内外合擊之大破其衆於必爾罕水上勦殺幾盡水為之不流富埓赫哈爾吉水馬韓島凡十餘戰破數十萬衆契丹奚人聚舟千艘將入于海阿里以二十七舟邀之中流矢臥舟中中夜始蘇敵船已入王家島即夜取海路追及之敵走險以拒阿里以騎兵邀擊再中流矢力戰不退竟破之盡獲其舟於是蘇復州博索路皆平攻顯州下靈山縣取梁魚務敗伊都兵功皆最後與蘇都哩屯髙州契丹扎古雅紏堅合興中兵數萬攻和爾台寨阿里以八穆昆兵救之和爾台先往敗於城下阿里指陣前緋衣者二十餘人曰此必賊酋也麾兵奮擊皆殺之餘衆大潰來州隰州兵圍和爾台城聞阿里來救即觧圍去棟摩討張覺有兵出樓峯口山谷間阿里蘇都哩呼拉布三明安擊敗之宗望代棟摩討張覺阿里再敗平州兵及伐宋阿里别擊宋兵敗之孟陽之役阿里扼橋渡力戰明年再伐宋至保州中山累破之進圍真定阿里與羅索赫嚕乘風縱火焚其樓櫓諸軍畢登克其城師至河鈕祜禄呼遜擊走宋人扼河津兵數千遂渡河諸將分出大名境阿里破敵四百盡殪遂圍汴汴中夜出兵來焚攻具阿里與穆昆察遜伊克禦之其衆大潰還攻趙州降之六年伐宋主取陽榖莘縣敗海州兵八萬人海州降破賊船萬餘於梁山泊招降滕陽東平泰山羣盗盗攻范縣擊走之獲船七百艘宗弼攻下睢陽與烏雅富埒琿先以二千人往招壽春具舟淮水上時康民聚賈船四百與壽春相近珠爾蘇以騎四百破康民斬馘數千與當堪大㚖破賊十萬於淮南比至江連破宋兵獲舟二百艘宗弼至江寧阿里富埒琿别降廣徳軍先趣杭州去杭十餘里遇宋伏兵二千取我前驅甲士三十人阿里使諸軍去馬搏戰伏兵敗皆逼死於水宗弼至餘杭而宋主走明州阿里與富埓琿以精騎四千襲之破東闗兵濟曹娥江敗宋兵於髙橋鎮至明州頗失利宋主已入于海乃退軍餘姚宗弼使當堪濟師遂下明州執宋守臣趙伯諤進至昌國縣宋主自昌國走温州由海路追三百餘里弗及遂隳明州與宗弼俱北歸睿宗經畧陜西駐涇州阿里先取渭州睿宗趨熙河阿里綏赫韓常三明安為前軍十二年與髙彪監䕶水運宋以舟師阻亳州河路擊敗之追殺六十餘里獲其將蕭通破漣水水寨賊盡得其大船遂取漣水軍招徠安輯之天眷間盗據石州阿里討之鈕祜禄呼遜與所部先登克其城石州平宗弼再伐宋阿里已老督造戰船宋稱臣詔賜阿里錢千萬自結髪從軍大小數十戰尤習舟楫江淮用兵無役不從人以水星目之為徳哷勒部節度使厯順義泰寧軍歸徳濟南尹天徳初致仕加特進封王正隆例封韓國公召赴闕命造戰船以疾薨年七十八謚智敏阿里性忠直多智畧兄弟相友愛家故饒財以已明安及財物盡與弟阿布哩阿布哩不肯受逃避嵗餘阿里終與之托克索宗室子納罕塞人初𨽻萬户實嘉努麾下嘗領偏師破雲中諸山㓂盗宗望攻平州遣托克索討應州賊平之撫安其民而還及伐宋在宗翰軍以八穆昆破石嶺闗屯兵數萬殺戮幾盡師至太原祁縣降而復叛托克索攻下之進取文水縣後從諸師列屯汾州之境宋河東軍帥郝仲連張思正陜西軍帥張闗索及其統制馬忠合兵數萬來援皆敗之宗翰南伐至潞還太原猶未下即留完顔尼楚赫總督諸軍經畧其地於是宋援兵大至托克索從瑪武烏嚕破宋兵四千于文水聞宋將黄迪等以兵三十萬栅于縣之西山復與耿守忠合兵九千擊之殺八萬餘人獲馬及資糧甚衆宋制置使姚古率兵至隆州谷托克索與巴爾斯以歩騎萬餘禦之种師中兵十萬據榆次尼楚赫乃召托克索使中分其兵而還與和尼等合兵八千擊敗之斬師中于殺熊嶺宋將張灝以兵十萬營于文水近郊復與巴爾斯擊破之潞州復叛宋兵號十七萬固納托克索巴爾斯皆被圍托克索麾軍士下馬力戰遂潰圍而出及再舉伐宋宗翰命羅索率軍先趨汴羅索至澤州托克索烏嚕以五百騎為前驅往招河陽先據黄河津宋兵萬餘背水陣進擊敗之皆擠于水遂降河陽汴京平諸將西趣陜津畧定河東郡縣托克索取憲州遇其援兵擊敗之生擒其將貝勒寧温珠嚕等攻保徳未下托克索進兵助擊梯衝竝進遂克其城貝勒烏爾古攻石州亡其三將軍士殁者數百人托克索謂烏爾古曰敵皆歩兵吾不可騎戰烏爾古曰聞賊挾妖術畫馬以擊其足疾甚奔馬歩戰豈可及之托克索笑曰豈有是耶乃令諸軍去馬戰盡殪之六年宗輔駐師鄧州托克索瑪武巴爾斯西取均房遂下其城攻唐蔡陳州及頴昌府皆克之天眷初除彰徳軍節度使三年為元帥左監軍皇統八年改濟南尹天徳間封定國公授世襲千戸卒年七十二正隆二年贈應國公初托克索以次室受封次室子因得襲其明安及分財異居次室子取奴婢千二百口正室子得八百口乆之正室子爭襲連年不決家貲費且盡正室子奴婢存者二百口次室子奴婢存者纔五六十口世宗聞托克索諸子貧窘以問近臣具以争襲之故為對世宗曰次室子豈當受封邪遂以嫡妻長子襲烏雅富埒琿海蘭路烏克敦山人父巴古拉為龍虎衛上將軍富埓琿膂力絶人能挽强射二百七十歩與兄呼沙呼俱以勇健𨽻棟摩軍居帳下攻黄龍府力戰有功棟摩敗于兔耳山張覺復整兵來諸將皆不敢戰富埒琿登山望之乃紿諸將曰敵軍少急擊可破也若入城不可復制遂合戰破之郭藥師蔡靖以燕京降富埒琿率九十騎先伺察城中居民去就遂將漢兵千𨽻完顔䝉克攻真定進攻贊皇取之獲人畜甲仗萬餘汴城破日已暮宋人猶方戰槍刺中富埓琿手戰益力遂敗宋軍賜金五十兩睿宗為右輔元帥已定闗陝議取劔外諸州遂㧞和尚原元帥府承制以富埓琿為河北西路兵馬都總管及宋主在揚州富埓琿與䝉克將萬騎襲之宋主已渡江破其餘兵後與錫黙阿里俱從宗弼自淮西渡江取江寧宗弼入杭州宋主走明州再走温州由海道追三百餘里隳明州而歸語在阿里傳天眷二年授鎮國上將軍除安國軍以疾去官皇統六年授世襲穆昆起為延安尹賜尚衣一襲尋致仕海陵遷中都起為歸徳尹就其家授之賜銀牌襲衣玉吐鶻馳驛之官富埒琿留數十日已違程復聽致仕召赴京師至薊州見海陵于獵所明日從獵獲一狐海陵曰卿年老尚能馳逐擊獸健捷如此賜以御服封豳國公除太子少師進太子太保改真定尹入判大宗正事頃之伐宋以本官行右領軍副都督事師次西采石海陵欲渡江富埒琿曰宋軍船髙大我船庳小恐不可遽渡海陵怒曰汝昔從梁王追趙構於海島皆大舟耶今乃沮吾兵事設不能遽渡江不過有少損耳爾年已七十縱自愛豈有不死理耶明日當與璸都先濟既而復止之乃遣别將先渡江舟小不可戰遂失利兩明安及兵士二百餘人皆䧟没海陵遇害軍還大定二年至中都上謁除東京留守世宗召問年幾何對曰臣今年七十三矣上曰卿宿將乆練兵事年雖老精神不衰因命到官每旬月一視事賜衣一襲進階開府儀同三司仍封豳國公是嵗卒十八年孫扎昆遷廣威將軍襲烏克敦山世襲明安并親管穆昆持嘉暉字仲明其先附於遼居張皇堡故嘗以張為氏後家來州暉體貌雄偉慷慨有志畧少遊鄉校遼季以破賊功授禮賔副使領來隰遷潤四州屯兵天輔六年降仍命領其衆從棟摩定興中府義錦等州及破張覺皆與有功以粟萬五千石助軍授洺州刺史宗望初伐宋孟陽之戰敵之中軍徑薄宗望營暉與諸將擊敗之追殺至城下訖師還數立戰功明年再舉伐宋攻下保州真定暉皆與焉進圍汴宋人夜出兵二萬焚我攻具暉以二穆昆兵撃走之凡城中出兵拒戰暉之所當無不勝捷既克宋還從攻河間敵將李成以雄莫之兵來援暉與所部迎擊馬傷而墮暉輒奮起歩鬬竟敗成兵是日凡七戰皆勝敵人多逼死濠隍間暉兩臂亦數中流矢賊將劉先生以兵二萬夜襲營暉力戰逹旦賊始敗走皆溺死于水暉復傅城力戰如是連月諸軍四面合攻遂克之加桂州管内觀察使因留撫河間時居民皆為軍士所掠老㓜存者亡幾暉下令軍中聴贖還之未幾皆按堵如故從睿宗經畧山東既攻下青州復從棟摩攻濰州暉督其禆校先登而城中積芻茭乘風縱火𤼵機石暉率將士衝冐而下力戰敗之軍還復以三十騎破敵于范橋帥府承制加静江軍節度使進攻城中砲出幾中暉拂其甲裳裂之暉益奮攻卒破其城又從攻泗州克之還屯汶陽破賊衆于梁山濼獲舟千餘移軍攻濟州既敗敵兵因傅城諭以禍福乃舉城降暉約來軍士無秋豪犯自是曹單等州皆聞風而下從攻壽春歸徳及渡淮為先鋒遇重敵于秀州蘇州皆擊敗之遂至餘杭通糧餉治橋道暉之力為多乃還載資治通鑑版以歸大軍過江寧徙其官民北渡時暑多疾疫老弱轉死道路其知府陳邦光者訴于宗弼怒將殺之暉曰此義士也力營救之竟得免富平之戰暉左右翼遇濘而敗睿宗念其前功杖而釋之師至熙河暉别降諸寨將鈐轄及吐蕃酋長等并民户萬五千餘蘭州叛與鄂勒博等攻下之獲河州安撫使白常熙河路副都總管劉維輔以獻還攻慶陽兩敗重敵殺其將戴巢師還遷歸徳軍節度使宋州舊無學暉為營建學舍勸督生徒肄業者復其身人勸趨之屬縣民家奴王夔者嘗業進士暉以錢五十萬贖之使卒其業夔後至顯官密州吏龎乙卒於官其孤貧不克葬暉為營治葬事且資給其家十三年復從大軍渡淮還鎮丁母憂尋以舊職起復既廢齊為安化軍節度使天眷二年復河南宋人乘間䧟海州帥府以登萊沂密四州委暉經畫敵無敢窺其境者為定海軍節度使尋改濟南尹累遷光禄大夫俄以罪罷乆之起為昌武軍節度使天徳二年遷南京留守尋改河南路統軍使授世襲明安拜尚書右丞封河内郡王嵗餘拜平章政事封戴王正隆初出為興平軍節度使正隆降王爵為樞密副使封景國公未幾復為左丞封濟國公尋除大興尹封榮國公薨年六十五大定間謚曰武康子師直登進士第大㚖本名托卜嘉其先遼陽人世仕遼有顯者太祖伐遼遼人徴兵遼陽時㚖年二十餘在選中遼兵敗㚖脱身走寧江寧江破㚖越城而逃為軍士所獲太祖問其家世因收養之收國二年為東京奚民穆昆是時初破髙永昌東京旁郡邑未盡服屬使㚖伺察反側有聞必逹太祖以為忠實授明安兼同知東京留守事取中西兩京𨽻棟摩軍遼軍二十萬來戰呉王使㚖以本部守營㚖堅請出戰不許或謂㚖曰戰危事獨苦請何也㚖曰丈夫不得一决勝負尚何為苟臨戰不㨗雖死猶生也呉王聞而壯之乃遣出戰既合戰棟摩軍少却遼兵後躡之㚖麾本部兵横擊殺數百人由是顯名軍中天㑹三年宗望伐宋信徳府居燕汴之中可駐軍以濟緩急欲遂攻之恐不能亟下議未決㚖獨率本部兵選善射者射其城樓别以輕鋭潜升於樓角之間遂克其城軍至濬州宋人已燒河橋宗望下令軍中有能先濟者功為上㚖捕得十餘舟使勇悍者徑度擊其守者而奪其戍栅由是大軍俱濟明年再伐宋授萬户賜金牌既破汴京㚖為河間路都統已克河間棟摩怒其不早降因縱軍大掠㚖諌止之已掠者官為贖還除河間尹從攻襲慶府先一日㚖命軍士預備畚鍤及薪既傅城諸將方經營攻具未鳴鼓㚖軍有素備遂先登軍帥以㚖未鳴鼓輒戰不如軍令請罪㚖朝廷釋弗問仍例賞之宗弼伐江南濟淮宋將時康民率兵十七萬來拒㚖率本部從擊敗之復以騎二千與當堪擊敗淮南賊十萬殺萬餘人王善來降將渡江㚖軍先渡舟行去岸尚逺宋列兵江口㚖視其水可渉則麾兵捨舟趨岸疾擊之宋兵走大軍相繼而濟俄遇杜充兵六萬於江寧之西㚖與呼拉布擊走之師還㚖留為揚州都統經畧淮海髙郵之間再為河間尹兼總河北東路兵馬十一年入見太宗賜坐慰勞甚乆特遷太子太保賜衣一襲馬二匹及鞍轡鎧甲改元帥右都監齊國廢㚖守汴京熈宗念㚖乆勞降御書寵異之天眷三年罷漢渤海千户穆昆以㚖舊臣獨命依舊世襲千户是嵗拜元帥右監軍宗弼再伐宋宋人稱臣乞和遂班師㚖獨留汴行元帥府事皇統三年加開府儀同三司八年進左監軍天徳二年改右副元帥兼行臺右丞遷平章行臺省事進行臺右丞相右副元帥如故海陵疑左副元帥薩里罕以為行臺左丞相使㚖伺察之詔軍事不令薩里罕與聞薩里罕不知海陵意㫖每與㚖爭軍事不能得遂與㚖有隙海陵竟殺薩里罕召㚖入朝拜尚書右丞相封神麓郡王四年請老為東京留守貞元三年拜太傅領三省事累封漢國王十二月有疾海陵幸其第問之是嵗薨年六十八海陵親臨哭之詔有司廢務三日禁樂三日其三日當賜三國使館燕以不賜教坊樂命左宣徽使敬嗣暉宣諭之贈太師晉國王謚傑忠遣使䕶䘮歸葬正隆奪王爵贈太傅梁國公子磐磐本名富色克以大臣子累官登州刺史襲明安大定三年除嵩州刺史從布薩忠義伐宋有功五年召為符寳郎遷拱衛直都指揮使初磐以伐宋功進官一階磐心少之頗形于言上聞之下吏按問杖一百五十改左衛將軍詔求良弓磐多自取及䕶衛入直者輒以已意更代䕶衛羅索告其事詔㸃檢司詰問磐有妹在宫中為寳林磐屬内侍僧兒員思忠使言于寳林曰我無罪問事者迫我使自誣服寳林訴于上上怒杖僧兒一百磐責隴州防禦使上戒之曰汝在近密執迷自用朕以卿父之功不忍廢棄姑令補外其思勉之改毫州防禦使遷武寧軍節度使坐事除名起為韓州刺史改祁州刺史復坐事削四官解職乆之尚書省奏大磐以年當叙上曰剛暴之人屢冒刑章不可復用太傅大㚖别無嫡嗣其世襲明安穆昆不可易也阿里布宗室子系出景祖屢從征伐滅遼舉宋皆有功天㑹九年睿宗經畧陜西阿里布為左翼都統與右翼都統宗弼撫定鞏洮河西寧蘭廓等州軍來賔定逺和政甘峪寧洮安隴等城寨及鎮堡蕃漢營部四十餘處漢官軍民蕃部酋長甚衆於是涇原熙河兩路皆平詔以兄明安薩勒扎親管穆昆之餘戸以阿里布為世襲穆昆天㑹十二年為元帥右都監十五年遷左監軍天眷三年從宗弼復河南遷左副元帥皇統三年封譚國公六年為行臺左丞相元帥如故是嵗薨大定間大褒功臣圖像衍慶宫罕都死康宗時不及與馳騖遼宋之郊然而異姓之臣莫先焉故定衍慶亞次功臣代國公罕都金源郡王實圖羙徐國公琿楚鄭國公們圖琿濮國公實古納濟國公芬徹韓國公錫黙阿里元帥左監軍巴爾斯魯國公富察實嘉努銀青光禄大夫䝉克隨國公和尼特進托克索齊國公博勒和開府儀同三司烏雅富埓琿儀同三司阿里布鎮國上將軍烏淩阿托雲太師領三省事朂太傅大㚖大興尹特嘉暉金吾衛上將軍耶律瑪武驃騎衛上將軍韓常并阿里布咸著勲焉子言方言别有傳方以宗室子累官京兆少尹遷陜西路統軍都監方專事財賄不恤軍旅詔戒之曰卿宗室舊人乃縱肆敗法惟利是營朕甚惡之自今至於後日萬一為之必罰無赦大定三年遷元帥右都監轉元帥左監軍改順天軍節度使上曰卿本無功厯顯仕不能接僚友往往交惡在京兆貪鄙彰聞至無謂也朕念卿已過中年必能悛改慎勿復爾除西南路招討使朝廷以兵部郎中髙通為招討都監以佐之詔通曰卿到天徳毋以其官長曲從之也簡閲沿邉士卒毋用孱弱之人毋以僕𨽻代役女直舊風凡酒食㑹聚以騎射為樂今則奕碁雙陸宜悉禁止令習騎射從其居處之便亦不可召集擾之久之方坐强買部人馬二匹削一階觧職降耀州刺史通亦坐贓除名方後遷横海軍節度使入為同簽大宗正事簽書樞密院事初阿嚕當授穆昆未封而薨烏逹受之烏逹死烏達布襲之烏達布死烏雅鄂博當襲是時已降海陵為庶人世宗以烏達在熙宗逆黨中其子孫不合受封停封者久之而阿里布功亦不可廢絶特詔方襲之云贊曰錫黙阿里托克索烏雅富勒琿持嘉暉大㚖阿里布等六人皆收國以來所謂熊羆之士不二心之臣也其功有可録者焉金史卷八十
