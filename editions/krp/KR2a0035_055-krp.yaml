body:
  text: 金史巻五十五元中書右丞相總裁托克托等修志第三十六百官一三師帥府三公樞密尚書省大宗六部都元院正府御史臺司農司宣撫司三司國勸農使司史院翰林學士院審官院太常寺金自景祖始建官屬統諸部以專征伐嶷然自為一國其官長皆稱曰貝勒故太祖以達貝勒嗣位太宗以安班貝勒居守安班尊大之稱也其次曰古倫烏赫哩貝勒古倫言貴烏赫哩猶總帥也又有古倫貝勒或左右置所謂國相也其次諸貝勒之上則有古倫英實烏赫哩伊拉齊愛滿阿斯罕温徳特之號為陞拜宗室功臣之序焉其部長曰貝勒統數部者曰烏赫哩凡此至熙宗定官制皆廢其後惟鎮撫邊民之官曰圖哩烏爾古之下有繅衮圖依達詳衮之下有黙濟格實納昆具於官制而不廢皆踵遼官名也漢官之制自平州人不樂為眀安穆昆之官始置長吏以下天輔七年以左企弓行樞密院于廣寧尚踵遼南院之舊天㑹四年建尚書省遂有三省之制至熙宗頒新官制及換官格除拜内外官始定勲封食邑入銜而後其制定然大率皆循遼宋之舊海陵庶人正隆元年罷中書門下省止置尚書省自省而下官司之别曰院曰臺曰府曰司曰寺曰監曰局曰署曰所各統其屬以修其職職有定位員有常數紀綱眀庶務舉是以終金之世守而不敢變焉大定二十八年在仕官一萬九千七百員四季赴選者千餘嵗數監差者三千眀昌四年奏周嵗官死及事故者六百七十新入仕者五百一十見在官萬一千四百九十九内女直四千七百五員漢人六千七百九十四員至泰和七年在仕官四萬七千餘四季部擬授者千七百監官到部者九千二百九十餘則三倍世宗之時矣若宣宗之招賢所經畧司義宗之益政院雖危亡之政亦必列于其次以著一時之事云三師太師太傅太保各一員皆正一品師範一人儀刑四海三公太尉司徒司空各一員皆正一品論道經邦燮理陰陽尚書省尚書令一員正一品總領紀綱儀刑端揆左丞相右丞相各一員從一品平章政事二員從一品為宰相掌承天子平章萬機左丞相右丞相員正二品參知政事二員從二品為執政官為宰相之貳佐治省事左司郎中一員正五品國初置左右司侍郎天眷三年始更今名舊凡視朝執政官親執奏自天徳二年詔以付左右司官為定制員外郎一員正六品掌本司奏事總察吏户禮三部受事付事兼帶修起居注官迴避其間記述之事毎月朔朝則先集是月秩滿者為簿名曰闕本及行止簿貼黄簿并官制同進呈御覽畢則受而藏之毎有除拜凡尚書省所不敢擬注者則一闕具二三人以聽制授焉都事二員正七品貞元二年左右司官宫中出身并進士令史三色人内通選三年以監察御史相應人取次稟奏不復擬注掌本司受事付事檢勾稽失省署文牘兼知省内宿直檢校架閣等事右司所掌同右司郎中一員正五品員外郎一員正六品掌本司奏事總察兵刑工三部受事付事兼帶修注官迴避其間記述之事都事二員正七品尚書省祇候郎君管勾官從七品掌祇候郎君謹其出入及差遣之事承安二年以前走馬郎君擬注泰和令以左右女直都事兼正大間改用親從人架閣庫大定二十一年六月設仍以都事提控之管勾舊二員正大省一員正八品同管勾舊二員正大省一員從八品總掌察左右司大程官追付文牘并提控小都監給受紙筆餘管勾同女直省令史三十五人左二十人右十五人大定二十四年為三十人進士十人宰執子宗室子十人密院臺部統軍司令史十人漢令史三十五人左二十一人右十四人省譯史十四人左右各七人女直譯史同通事八人左右各四人高麗夏國回紇譯史四人左右各二人諸部通事六人伊喇二十人走馬郎君五十人提㸃嵗賜所左右司郎中員外郎兼之掌提㸃嵗賜出入錢幣之事堂食公使酒庫使一員從八品掌受給嵗賜錢總領庫事副一員正九品掌貳使事直省局局長從八品掌都堂之禮及官員叅謝之儀副局長正九品掌貳局長管勾尚書省樂工從九品行臺之制熙宗天㑹十五年罷劉豫置行臺尚書省于汴天眷元年以河南地與宋遂改燕京樞密為行臺尚書省天眷三年復移置於汴京皇統二年定行臺官品皆下中臺一等六部國初與左右司通署天眷三年始分治吏部尚書一員正三品侍郎一員正四品郎中二員從五品天徳二年増作四員後省員外郎從六品天徳二年増作四員後省掌文武選授勲封考課出給制誥之政以才行勞效比仕者之賢否以行止文册貼黄簿制各闕之機要正七品以上以名上省聽制授從七品以下每至季月則循資格而擬注自八品以上則奏以下則否侍郎以下皆為尚書之貳郎中掌文選流外遷用用官吏差使行止名簿封爵制誥一員掌勲級酬賞承襲用廕循遷致仕考課議諡之事員外郎分判曹務及叅議事所掌與郎中同文官九品階凡四十二二從一品上曰開府儀同三司中曰儀同三司中次曰特進下曰崇進正二品上曰金紫光禄大夫下曰銀青榮禄大夫從二品上曰光禄大夫下曰榮禄大夫正三品上曰資徳大夫中曰資政大夫下曰資善大夫從三品上曰正奉大夫中曰通奉大夫下曰中奉大夫正四品上曰正議大夫中曰通議大夫下曰嘉議大夫從四品上曰大中大夫中曰中大夫下曰少中大夫正五品上曰中議大夫中曰中憲大夫下曰中順大夫從五品上曰朝請大夫中曰朝散大夫下曰朝列大夫舊曰奉徳大夫天徳二年更正六品上曰奉政大夫下曰奉議大夫從六品上曰奉直大夫下曰奉訓大夫正七品上曰承徳郎下曰承直郎從七品上曰承務郎下曰儒林郎正八品上曰文林郎下曰承事郎從八品上曰徴事郎下曰從仕郎正九品上曰登仕郎下曰將仕郎從九品上曰登仕佐郎下曰將仕佐郎此二階大定十四年創増武散官凡仕至從二品以上至從一品者皆用文資自正三品以下階與文資同正三品上曰龍虎衛上將軍中曰金吾衛上將軍下曰驃騎衛上將軍從三品上曰奉國上將軍中曰輔國上將軍下曰鎮國上將軍正四品上曰昭武大將軍中曰昭毅大將軍下曰昭勇大將軍從四品上曰安逺大將軍中曰定逺大將軍下曰懐逺大將軍五五品上曰廣威將軍中曰宣威將軍下曰眀威將軍從五品上曰信武將軍中曰顯武將軍下曰宣武將軍正六品上曰武節將軍下曰武徳將軍從六品上曰武義將軍下曰武略將軍正七品上曰承信校尉下曰昭信校尉從七品上曰忠武校尉下曰忠顯校尉正八品上曰忠勇校尉下曰忠翊校尉從八品上曰修武校尉下曰敦武校尉正九品上曰保義校尉下曰進義校尉從九品上曰保義副尉下曰進義副尉此二階大定十四年創增封爵正從一品曰郡王曰國公正從二品曰郡公正從三品曰郡侯正從四品曰郡伯舊曰縣伯承安二年更正五品曰縣子從五品曰縣男凡勲級正二品曰上柱國從二品曰柱國正三品曰上䕶軍從三品曰䕶軍正四品曰上輕車都尉從四品曰輕車都尉正五品曰上騎都尉從五品曰騎都尉正六品曰驍騎尉從六品曰飛騎尉正七品曰雲騎尉從七品曰武騎尉凡食邑封王者萬户實封一千户郡王五千户實封五百户國公三千户實封三百户郡公二千户實封二百户郡侯一千户實封一百户郡伯七百户縣子五百户縣男三百户皆無實封自天眷定制凡食邑同散官入銜司天翰林官舊制自從七品而下止五階至天眷定制司天自從四品而下立為十五階從四品上曰欽象大夫中曰正儀大夫下曰欽授大夫正五品上曰靈憲大夫中曰明時大夫下曰頒朔大夫從五品上曰雲紀大夫中曰協紀大夫下曰保章大夫正六品上曰紀和大夫下曰司𤣥大夫從六品上曰探賾郎下曰授時郎正七品上曰究㣲郎下曰靈臺郎從七品上曰眀緯郎下曰候儀郎正八品上曰推策郎下曰司正郎從八品上曰校景郎下曰平秩郎正九品上曰正紀郎下曰挈壺郎從九品上曰司厯郎下曰司辰郎太醫官舊自從六品而下止七階天眷制自從四品而下立為十五階從四品上曰保宜大夫中曰保康大夫下曰保平大夫正五品上曰保頤大夫中曰保安大夫下曰保和大夫從五品上曰保善大夫中曰保嘉大夫下曰保順大夫正六品上曰保合大夫下曰保沖大夫從六品上曰保愈郎下曰保全郎正七品上曰成正郎下曰成安郎從七品上曰成順郎下曰成和郎正八品上曰成愈郎下曰成全郎從八品上曰醫全郎下曰醫正郎正九品上曰醫效郎下曰醫候郎從九品上曰醫痊郎下曰醫愈郎内侍天徳創制自從四品以下十五階從四品上曰中散大夫中曰中尹大夫下曰中侍大夫正五品上曰中列大夫中曰中御大夫下曰中儀大夫從五品上曰中常大夫中曰中益大夫下曰中衛大夫正六品上中良大夫天徳作中亮下曰中涓大大夫從六品上曰通禁郎下曰通侍郎正七品上曰通掖郎下曰通御郎從七品上曰禁直郎下曰侍直郎正八品上曰掖直郎下曰内直郎從八品上曰司贊郎下曰司謁郎正九品上曰司閽郎下曰司僕郎從九品上曰司奉郎下曰司引郎教坊舊用武散官大定二十九年以為不稱乃創定二十五階眀昌三年自從四品以下更立為十五階從四品上曰雲韶大夫中曰仙韶大夫下曰成韶大夫正五品上曰章徳大夫中曰長寧大夫下曰徳和大夫從五品上曰景雲大夫中曰雲和大夫下曰協律大夫正六品上曰慶喜大夫下曰嘉成大夫從六品上曰肅和郎下曰純和郎正七品上曰舒和郎下曰調音郎從七品上曰比音郎下曰司樂郎正八品上曰典樂郎下曰協樂郎從八品上曰掌樂郎下曰和樂郎正九品上曰司音郎下曰司律郎從九品上曰和聲郎下曰和節郎凡内外官之政績所厯之資考更代之期去就之故秩滿皆備陳於解由吏部據以定能否又撮解由之要於銓擬時讀之謂之銓頭又㑹厯任銓頭而書于行止簿行止簿者以姓為類而書各人平日所厯之資考功過者也又為簿列百司官名有所更代則以小黄綾書更代之期及所以去就之故而制其銓擬之要領焉凡縣令則省除部除者通書而各疏之泰和四年定考課法准唐令作四善十七最之制四善之一曰徳義有聞二曰清慎眀著三曰公平可稱四曰勤恪匪懈十七最之一曰禮樂興行肅清所部為政教之最二曰賦役均平田野加闢為牧民之最三曰決斷不滯與奪當理為判事之最四曰鈐束吏卒姦盜不滋為嚴眀之最五曰案簿分眀評擬均當為檢校之最以上皆謂縣令丞簿警巡使副録事司候判官也六曰詳斷合宜咨執當理為幕職之最七曰盜賊消弭使人安静為巡捕之最八曰眀於出納物無損失為倉庫之最九曰訓導有方生徒充業為學官之最十曰檢察有方行旅無滯為闗津之最十一曰隄防堅固備禦無虞為河防之最十二曰出納眀敏數無濫失為監督之最十三曰謹察禁囚輕重無怨為獄官之最十四曰物價得實姦濫不行為市司之最謂市令也十五曰戎器完肅扞守有方為邊防之最謂正副部隊將鎮防官也十六曰議獄得情處㫁公平為法官之最十七曰差役均平盜賊止息為軍職之最謂都軍軍轄也凡縣令以下三最以上有四善或三善者為上陞一等三最以上有二善者為中減兩資厯三最以上有一善為下減一資厯節度判官防禦判官軍判以下一最而有四善或三善為上減一資厯一最而有二善為中陞為榜首一最而有一善為下陞本等首又以眀昌四年之制軍民俱稱為亷能者為亷能官參于其間而定其甄擢焉宣宗興定元年行辟舉縣令法考以六事一曰田野闢二曰户口増三曰賦役平四曰盜賊息五曰軍民和六曰詞訟簡六事俱備為上等升