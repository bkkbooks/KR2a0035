body:
  text: 金史卷三元中書右丞相總裁托克托等修本紀第三太宗太宗體元應運世徳昭功哲恵仁聖文烈皇帝諱晟本諱烏竒邁世祖第四子母曰翼簡皇后納喇氏太祖母弟也遼太康元年乙卯嵗生初為穆宗養子収國元年七月為安班貝勒太祖四出征伐常居守天輔五年賜詔曰汝惟朕之母弟義均一體是用汝貳我國政凡軍事違者閲實其罪從宜處之其餘事無大小一依本朝舊制天輔七年六月太祖次鴛鴦濼有疾至諤都山驛召赴行在詔曰今遼主盡喪其師奔于夏國遼官多囉約索等刼其子雅里而立之已留宗翰等措畫朕親巡已久功亦大就所獲州部政須綏撫是用還都八月中旬可至春州汝率内戚迎我若至豹子崖尤善八月乙未㑹于渾河北戊申太祖崩九月乙卯葬太祖于宫城西南古倫貝勒杲鄆王昂宗峻宗幹率宗親百官請正帝位不許固請亦不許宗幹率諸弟以赭袍被體寘璽懐中丙辰即皇帝位己未告祀天地丙寅大赦中外改天輔七年為天㑹元年癸酉𤼵春州粟賑降人之徙于上京者戊寅詔諸明安賦米給戸口在内地匱乏者南路軍帥棟摩敗張覺于樓峯口十月壬辰詔以空名宣頭百道給西南西北兩路都統宗翰曰今寄爾以方靣如當遷授必待奏請恐致稽滯其以便宜從事己亥上京慶元寺僧獻佛骨却之棟摩及張覺戰于兎耳山棟摩敗績十一月壬子命宗望問棟摩罪以其兵討張覺壬戌復以空名宣頭及銀牌給上京路軍帥實右納博勒和等癸亥宗望以棟摩軍發廣寧下瀕海諸郡縣詔諭南京割武朔二州入于宋羅索破朔州西山擒其帥趙公直貝勒斡魯别及博爾蘇破走伊實布達於歸化己巳徙遷潤來隰四州之民于瀋州庚午宗望及張覺戰于南京東大敗之張覺奔宋城中人執其父及二子以獻戮之軍中壬申張忠嗣張敦固以南京降遣使與張敦固入諭城中復殺其使者以叛己卯詔女直人先有附于遼今復虜獲者悉從其所欲居而復之其奴婢部曲昔雖逃背今能復歸者並聼為民十二月辛巳蠲民間貸息詔以咸州以南蘇復州以北年榖不登其應輸南京軍糧免之甲午詔曰比聞民間貧苦乏食至有鬻其子者其聼以丁力相等者贖之是日以古倫貝勒杲為安班貝勒宗幹為古倫貝勒遣貝勒李靖如宋告哀二年春正月庚戌朔以們圖琿為阿斯罕貝勒參議國政壬子命賞宗望及將士克南京之功赦棟摩罪甲寅以空名宣頭五十銀牌十給宗望戊午詔貝勒完顏愛實拉曰先帝以同姓之人有自鬻及典質其身者命官為贖今聞尚有未復者其悉閱贖之癸亥以東京比嵗不登詔減田租市租之半甲戌西南西北兩路都統宗翰宗望請勿割山西郡縣與宋上曰是違先帝之命也其速與之夏國奉表稱藩以下寨以北陰山以南伊蘇伊喇部圖嚕濼西之地與之丙子貽宋書索俘虜叛亡丁丑始自京師至南京每五十里置驛二月詔有盜發遼諸陵者罪死庚寅詔命給宗翰馬七百匹田種千石米七千石以賑新附之民丁酉命徙伊蘭路達貝勒完顔忠于蘇伯水乙巳詔諭南京官僚小大之事必闗白軍帥無得専達朝廷丙午宗翰乞濟師詔有司選精兵五千給之丁未命宗望凡南京留守及諸闕員可選勲賢有人望者就注擬之具姓名官階以聞三月己酉朔命宗望以宋嵗幣銀絹分賜將士之有功者庚戌叛人呼必泰降詔釋之宗望請選良吏招撫遷潤來隰之民保山砦者從之己未宗望以南京反覆凡攻取之計乞與知樞密院事劉彥宗裁決之劉公胄王永福棄家踰城來降以公胄為廣寧尹永福為奉先軍節度使辛未夏國王李乾順遣使上誓表閏月戊寅朔賜夏國誓詔辛巳命置驛上京春泰之間己丑烏庫哩達魯特兩部來降丙午既許割山西諸鎮與宋以宗翰言罷之是月舍音襲約尼扎古雅走之獲其妻孥羣從及豪族貝勒琿楚等破奚七巖而撫其民人四月己酉以宗翰經略西夏及破遼功賜以十馬使自擇其二餘以分諸帥賑上京路西北路降者及新徙嶺東之人戊午以實古納所築上京新城名㑹平州乙亥詔贖上京路新遷寧江州戸口賣身者六百餘人宋遣使來弔喪以高卓佛和等充遺留國信使高興輔劉興嗣等充告即位國信使如宋五月丁丑朔上京軍帥實古納以所獲印綬二十二及銀牌來上癸未詔曰新降之民訴訟者衆今方農時或失田業可俟農隙聼決丁亥博索路明安富勒呼以贓罷以穆昆實訥埒代之乙巳海蘭路軍帥完顔呼嚕古等言往者嵗捕海狗海東青鴉鶻於高麗之境近以二舟往彼乃以戰艦十四要而擊之盡殺二舟之人奪其兵仗上曰以小故起戰爭甚非所冝今後非奉命毋輒往棟摩克南京殺都統張敦固七月壬午皇子宗峻薨丙戌禁外方使介冗從多者壬辰和碩台言高麗納吾叛亡增其邊備必有異圖詔曰納我叛亡而弗歸其曲在彼凡有通問毋違常式或來侵略整爾行列與之從事敢先犯彼者雖捷必罰乙未以烏琿部及諸營叛以齋貝勒昱等討平之八月乙巳朔以貝勒烏哲訥等為賀宋生辰使丁巳薩里罕部明安齊蘓以贓罷以奚金嘉努代之六部都統達蘭擊走扎古雅殺其隊將克爾叟博斯呼等又破降駱駞山金源興中諸軍詔增給銀牌十十月甲辰朔夏國遣使謝誓詔戊午天清節宋夏遣使來賀甲子詔𤼵寧江州粟賑泰州民被秋潦者約尼扎古雅率衆來降興中府降丙寅詔有司運米五萬石于廣寧以給南京潤州戍卒命南路軍帥棟摩以甲士千人益哈斯罕路貝勒完顏愛實拉以備高麗戊辰西南西北兩路權都統斡魯言遼詳衮托卜嘉來奔言耶律達實自稱為王置南北官屬有戰馬萬匹遼主從者不過四千戸有歩騎萬餘欲趨天徳駐伊都谷詔曰追襲遼主必酌事宜其討達實則俟報下十一月癸未棟摩下宜州拔杈枒山殺節度使韓慶民癸卯詔以米五萬石給達蘭實古納十二月戊申以貝勒高居慶等為賀宋正旦使三年正月癸酉朔宋夏遣使來賀戊子同知宣徽院事韓資正加尚書左僕射為諸宫都部署乙未夏遣使奠幣及賀即位宋遣使賀即位二月壬戌羅索獲遼主于伊都谷丁夘以巴噶城地分授所徙烏庫哩徳哷勒二部及契丹民三月乙亥阿斯罕貝勒們圖琿薨丙子賑奚契丹新附之民辛巳建乾元殿斡魯獻傳國寳以瑪克實來附請授印綬是日賜完顔羅索鐵劵四月壬寅朔詔以遼主赴京師丁巳南路軍帥扎拉以罪罷五月己丑蕭巴錦獲遼玉寳來獻六月庚申以獲遼主遣李用和等充告慶使如宋七月壬申禁内外官宗室毋私役百姓己卯南京帥以錦州野蠶成蠒奉其絲綿來獻命賞其長吏詔權勢之家母買貧民為奴其脅買者一人償十五人詐買者一人償二人皆杖一百甲申詔南京括官豪牧馬以等第取之分給諸軍以耶律固等為宋報謝使八月癸卯斡魯以遼主至京師甲辰告于太祖廟丙午遼主延禧入見降封海濵王壬子詔有司㨂閱善射勇徤之士以備宋九月壬午廣寧府獻嘉禾癸巳保州路達貝勒𤓰爾佳薩哈以罪誅以貝勒圖克坦烏里代之十月甲辰詔諸將伐宋以安班貝勒杲兼領都元帥伊拉齊貝勒宗翰兼左副元帥先鋒經略使完顔希尹為元帥右監軍左金吾上將軍耶律伊都為元帥右都監自西京入太原六部路軍帥達蘭為六部路都統舍音副之宗望為南京路都統棟摩副之知樞密院事劉彦宗兼領漢軍都統自南京入燕山詔建太祖廟于西京召頁嚕赴京師敎授女直字戊申有司言權南路軍帥和碩台官吏貪縱詔鞫之壬子天清節宋夏遣使來賀丁巳以棟摩為南京路都統素赫副之宗望為棟摩劉彦宗兩軍監戰壬戌詔曰今大有年無儲蓄則何以備饑饉其令牛一具賦粟一石每穆昆為一廩貯之宋易州戍將韓民毅以軍降處之蔚州十一月庚辰以降封遼主為海濵王詔中外辛卯南路軍帥司諸禁契丹奚漢人挾兵器詔勿禁以張忠嗣權簽南京中書樞密院事十二月庚子宗翰下朔州甲辰宗望諸軍及宋郭藥師張企徽劉舜仁戰于白河大破之布希敗宋兵于古北口丙午郭藥師降燕山州縣悉平戊申宗翰克代州乙卯中山降丙辰宗望破宋兵五千于真定戊午宗翰圍太原耶律伊都破宋河東陜西援兵于汾河北甲子宗望克信徳府四年春正月丁卯朔始朝日降臣郭藥師董才皆賜姓完顔氏戊辰宗弼取湯陰大㚖攻下濬州達呼布取黎陽己巳諸軍渡河庚午取滑州宗望使吳孝民等入汴問宋取首謀平山童貫譚稹詹度及張覺等宋太上皇帝出奔癸酉諸軍圍汴甲戌宋使李梲來謝罪且請修好宗望許宋修好約質割三鎮地増嵗幣載書稱伯姪戊寅宋以康王構少宰張邦昌為質辛巳宋上誓書地圖稱姪大宋皇帝伯大金皇帝癸未諸軍解圍二月丁酉朔夜宋將姚平仲兵四十萬來襲宗望營敗之己亥復進師圍汴宋使宇文虚中以書來改以肅王樞為質遣康王構歸師還壬子以滑濬二州與宋宗翰定威勝軍攻下隆德府丁巳次澤州海濵王家奴誣其主欲亡去詔誅其首惡餘並杖之三月癸未尼楚赫圍太原宗翰還西京四月癸卯宗望使宗弼來奏㨗乙丑耿守忠等大敗宋人于西都谷五月辛未宋种師中以兵出井陘癸酉完顔和尼敗之于殺熊嶺斬師中於陣是日巴爾斯敗宋姚古軍於隆州谷六月丙申朔高麗國王王楷奉表稱藩庚戌宗望獻所獲三象庚申以宗望為右副元帥七月丙寅遣高伯淑等宣諭高麗壬申出金牌命貝勒大㚖以所領渤海軍八明安為萬戸戊子以圖埒部長多囉鑾不從其兄古爾班叛賜馬十一豕百錢五百萬蕭仲恭使宋還以所持宋帝與耶律伊都蠟書自陳八月庚子詔左副元帥宗翰右副元帥宗望伐宋宋張灝率兵出汾州巴爾斯擊走之劉臻以兵出壽陽羅索破之庚戌宗翰伐西京辛亥羅索等破宋張灝軍于文水癸丑宗望發保州是日耶律鐸破宋兵于雄州納延等敗宋兵于中山甲寅新城縣進白烏庚申托紐取新樂九月丙寅宗翰克太原執經略使張孝純呼沙呼取平遙靈石孝義介休諸縣己巳復以南京為平州辛未宗望破宋种師閔軍於井陘取天威軍克真定殺其守李邈十月羅索克汾州石州降芬徹克平定軍遼州降丁未天清節高麗夏遣使來賀中京進嘉禾十一月甲子宗翰自太原趨汴丙寅宗望自真定趨汴戊辰宗翰下威勝軍癸酉薩喇達破天井闗乙亥宗翰克隆徳府和尼渡盟津西京永安軍鄭州皆降庚辰宗翰克澤州宗望諸軍渡河臨河大名二縣徳清軍開徳府皆下丙戌克懐州是日宗望至汴閏月壬辰朔宋出兵拒戰宗望等擊敗之癸巳宗翰至汴丙辰克汴城庚申以高隨充高麗生日使辛酉宋主桓出居青城十二月癸亥宋主桓降是日歸于汴城庚辰詔曰朕惟國家四境雖逺而兵革未息田野雖廣而畎畝未闢百工略備而祿秩未均方貢僅修而賔館未贍是皆出乎民力茍不務本業而抑游手欲上下皆足其可得乎其令所在長吏敦勸農功五年正月辛卯朔高麗夏遣使來賀癸巳宗翰宗望使使以宋主降表來上乙未知樞密院事劉彦宗上表請復立趙氏不聽丁巳回鶻哈喇汗遣使入貢二月丙寅詔降宋二帝為庶人三月丁酉立宋少宰張邦昌為大楚皇帝割地賜夏國四月乙酉克陜府取虢州丙戌以六部路都統達蘭為元帥左監軍南京路都統棟摩為元帥左都監宗翰宗望以宋二帝歸己丑詔曰哈斯罕諸部與新附人民其在降附之後同姓為婚者離之五月庚寅朔宋康王構即位於歸徳宋殺張邦昌羅索降解絳慈隰石河中岢嵐寧化保徳火山諸城達蘭徇地山東下密州達呼下單州廣信軍降六月庚申詔曰自河之北今既分畫重念其民或見城邑有被殘者不無疑懼遂命堅守若即討伐生靈可愍其申諭以理招輯安全之儻執不移自當致討若諸軍敢利於俘掠輒肆蕩毁者底于罰庚辰右副元帥宗望薨漢國王宗傑繼薨七月甲午賜宗翰劵書除反逆外咸貰勿論以石州戍將烏琿棄城喪師杖之削其官八月戊寅以宋捷遣耶律居謹等充宣慶使使高麗丙戌以宗輔為右副元帥詔曰河北河東郡縣職員多闕宜開貢舉取士以安新民其南北進士各以所業試之九月丁未詔曰内地諸路每耕牛一具賦粟五斗以備歉嵗辛亥賜元帥右監軍完顔希尹萬戸尼楚赫劵書除赦所不原餘並勿論棟摩取河間大敗宋兵于莫州雄州降達蘭克祁州永寧軍保州順安軍皆降冬十月丁卯沙州回鶻呼喇繖汗復遣使入貢辛未天清節高麗夏遣使來賀宋二帝自燕徙居于中京十二月丙寅右副元帥宗輔伐宋徇地淄青烏凌阿托雲敗宋將李成于淄州趙州降阿里庫徇地濬州敗敵兵遂取滑州乙亥西南路都統斡魯薨己夘色哩下汝州六年正月丙戌朔高麗夏遣使來賀宗弼破宋鄭宗孟軍于青州尼楚赫取鄧州蘇瑪拉入襄陽巴爾斯入均州馬武取房州癸巳克青州癸夘棟摩克濰州丁未達呼布敗宋將趙子昉兵薩里罕敗宋兵于河上甲寅宋將馬括兵次樂安宗輔擊敗之聞宋主在維揚以農時還師宗弼敗宋兵于河上二月乙卯朔巴爾斯取唐州癸亥取蔡州己巳伊喇古敗宋將臺宗雋等兵于大名庚午再破其軍獲臺宗雋及宋忠甲戌巴爾斯取陳州癸未克頴昌府鄭州叛入于宋復取鄭州遷洛陽襄陽頴昌汝鄭均房唐鄧陳蔡之民于河北宗翰復遣羅索攻下同華京兆鳯翔擒宋經制使𫝊亮阿林破河中斡魯入馮翊三月壬辰命南路軍帥實古納籍節度使完顔慎思所領諸部及未置明安穆昆戸來上己酉達蘭下恩州五月戊戌伊遜特古斯以本部來附六月己未詔求祖宗遺事達蘭遣兵徇下磁州信徳府真定賊自稱元帥秦王薩里罕討平之七月乙巳宋主遣使奉表請和詔進兵伐之以宋二庶人赴上京八月乙卯羅索敗宋兵于華州額特埒破敵于渭水遂取下邽丁丑以宋二庶人素服見太祖廟遂入見于乾元殿封其父昬徳公子重昬侯是日告于太祖廟以州郡職員名稱及俸給因革詔中外九月辛丑勝額等敗宋兵于蒲城甲辰又破敵于同州乙丑取丹州十月丙寅天清節高麗夏遣使來賀癸酉知樞密院事劉彦宗薨丁丑芬徹羅索敗宋兵于臨真戊寅徙昬徳公重昬侯于韓州庚辰宗翰宗輔㑹于濮伐宋十一月庚寅芬徹羅索取延安府壬辰賑伊蘭路乙未取濮州綏徳軍降羅索再攻晉寧軍其守徐徽言固守不能克十二月丙辰宗弼取開徳府丁夘宗輔克大名府呼沙呼敗宋兵于鞏七年正月庚辰朔高麗夏遣使來賀辛巳呉國王棟摩薨甲午以南京留守韓企先同中書門下平章事知樞密院事二月戊辰宋麟府路安撫使折可求以麟府豐三州降己巳羅索色哩呼沙呼等破晉寧軍其守徐徽言據子城拒戰庚午率衆潰圍走擒之使之拜不拜臨之以兵不動命降將折可求諭之降指可求大罵出不遜語遂殺之其統制孫昂及士卒皆不屈盡殺之甲戌詔禁醫巫閭山遼代山陵樵採三月己卯朔日中有黒子壬寅詔軍興以來良人被略為驅者聼其父母夫妻子贖之尚書左僕射高真罷四月芬徹羅索取鄜坊二州五月乙卯巴爾斯等襲宋主于揚州九月丙午朔日有食之庚午宗弼敗宋兵于睢陽辛未降其城是月曹州降十月丙子朔京兆府降丁丑鞏州降庚寅天清節高麗夏遣使來賀丁酉阿里當堪大㚖破敵于壽春已亥安撫使馬世元以城降甲辰廬州降十一月庚戌徙哈斯罕都統司治寧州乙卯高麗遣使來貢丙辰宗弼取和州壬戌宗弼渡江敗宋副元帥杜充軍于江寧丁卯守臣陳邦光以城降十二月丙戌宗弼取湖州丁亥克杭州阿里富埓琿追宋主于明州越州降大㚖敗宋樞密使周望于秀州又敗宋兵于杭州東北戊戌阿里富埓琿敗宋兵于東闗遂濟曹娥江壬寅敗宋兵于高橋宋主入于海八年正月甲辰朔高麗夏遣使來賀丁巳以同中書門下平章事韓企先為尚書左僕射兼侍中己未阿里富埓琿克明州執其守臣趙伯諤庚申詔曰避役之民以㣲直鬻身權貴之家者悉出還本貫阿里布色哩頁下太平順昌及濠州是月宋副元帥杜充以其衆降二月乙亥宗弼還自杭州庚寅取秀州戊戌取平江汴京亂三月丁夘達達哩復取之宗弼及宋韓世忠戰于鎮江不利四月丙申復戰于江寧敗之諸軍渡江是日阿里布戰于拓臯己亥周企戰于壽春辛丑羅索戰于淳化皆勝之醴州降遂克邠州五月癸卯禁私度僧尼及繼父繼母之男女無相嫁娶戊申詔曰河北河東簽軍其家屬流寓河南被俘掠為奴婢者官為贖之俾復其業六月壬申詔遣遼統軍使耶律喀勒扎節度使蕭必埓哩等十人分治新附州鎮癸酉詔以昬徳公六女為宗婦七月辛亥詔給泰州都統博勒和所部諸穆昆甲胄各五十先遣羅索經略陜西所下城邑叛服不常其監戰阿里布請益兵帥府㑹諸將議曰兵威非不足綏懐之道有所未盡誠得位望隆重恩威兼濟者以往可指日而定若以皇子右副元帥宗輔往為宜以聞詔曰羅索往者所向輒克今使専征陜西淹延未定豈倦于兵而自愛耶闗陜重地卿等其戮力焉丁卯上如東京温湯徙昬徳公重昬侯于呼爾哈路九月戊申立劉豫為大齊皇帝世修子禮建都大名府辛酉安班貝勒都元帥杲薨癸亥宗輔等敗宋張浚軍于富平耀州降乙丑鳯翔府降十月乙亥上至自東京齊帝劉豫遣使謝封册甲申天清節齊高麗夏遣使來賀以鐵驪圖嚕拉同中書門下平章事詔遼宋官上本國誥命等第換授十一月甲辰宗輔下涇州丁未渭州降敗宋劉倪軍于瓦亭戊申原州降宋涇原路統制張中孚知鎮戎軍李彥𤦺以衆降馬武等擊宋吳玠軍于隴州庚戌以遙鎮節度使烏克紳等為齊劉豫生日使癸亥宗輔以陜西事狀聞詔奬諭之十二月丁丑完顔羅索薨乙酉宗輔敗宋劉維輔軍壬辰熙州降九年正月己亥朔齊高麗夏遣使來賀戊申命以圖們水以西和博錫馨珊沁三水以北閑田給海蘭路諸穆昆辛亥富察哈布爾完顔圖哩討張萬敵于白馬湖陷于敵癸丑以同中書門下平章事時立愛為侍中知樞密院張忠嗣為宣政殿大學士知三司使事宗弼阿里布撫定鞏洮河樂西寧蘭廓積石等州涇原熙河兩路皆平四月己卯詔新徙戍邊戸匱于衣食有典質其親屬奴婢者官為贖之戸計其口而有二三者以官奴婢益之使戸為四口又乏耕牛者給以官牛别委官勸督田作戍戸及邊軍資糧不繼糴粟于民而與賑䘏其續遷戍戸在中路者姑止之即其地種藝俟畢穫而行及來春農時以至戍所五月丙午分遣使者諸路勸農六月壬辰賜昬徳公重昬侯時服各兩襲八月辛巳回鶻鄂約遣使來貢九月己酉和州回鶻執耶律達實之黨薩巴迪里托多來獻十月戊寅天清節齊高麗夏遣使來賀薩里罕攻下慶陽慕洧以環州降宗弼與宋吳玠戰于和尚原敗績十一月己未遷趙氏疎屬于上京以陜西地賜齊十年正月癸巳朔齊高麗夏遣使來賀己酉齊表謝賜地壬子詔曰昔遼人分士庶之族賦役皆有等差其悉均之二月庚午賑上京路戌邊明安民四月丁卯詔諸良人知情嫁奴者聼如故為妻其不知而嫁者去住悉從所欲伊拉齊貝勒左副元帥宗翰朝京師庚午以太祖孫亶為安班貝勒皇子宗磐為古倫烏赫哩貝勒古倫貝勒宗幹為古倫左貝勒伊拉齊貝勒左副元帥宗翰為古倫右貝勒兼都元帥右副元帥宗輔為左副元帥庚寅聞鴨綠混同江水暴漲命徙戌邊戸在混同江者出粟賑之閏月辛卯詔分遣呼沙呼等十二人閱諸路丁壯調赴軍七月甲午賑泰州路戍邊戸上如中京九月元帥右都監耶律伊都謀反出奔其黨燕京統軍使蕭高陸伏誅蔚州節度使蕭特黙格自殺十月壬寅天清節大赦齊高麗夏遣使來賀上如興中府齊使使來告母喪十一月癸亥以武良謨為齊弔祭使癸未薩里罕請取劒外十三州從之部族節度使特古斯捕斬伊都及其諸子函其首來獻十二月庚子薩里罕克金州上至自興中府十一年正月丁巳朔齊高麗夏遣使來賀丁邜薩里罕敗吳玠于饒風闗戊辰取洋州甲戌入興元府二月己亥元帥府言承詔賑軍士臣恐有司錢幣將不繼請自元帥以下有祿者出錢助給之詔曰官有府庫而取於臣下此何理耶其悉從官給八月甲申黄龍府置錢帛司戊子趙㮙誣告其父昬徳公謀反㮙及其壻劉文彦伏誅戊戌詔曰比以軍旅未定嘗命帥府自擇人授官今並從朝廷選注十月丙申天清節齊高麗夏遣使來賀十一月丙寅賑伊蘭路宗弼克和尚原十二月癸未賑海蘭路十二年正月辛亥朔齊高麗夏遣使來賀甲子初改定制度詔中外丙寅如東京二月丁酉薩里罕敗宋吳玠軍于固鎮四月至自東京六月甲午以阿里布為元帥右都監十月庚寅天清節齊高麗夏遣使來賀十三年春正月丙午朔日有食之己巳上崩于明徳宮年六十一庚午安班貝勒即皇帝位于柩前三月庚辰上尊謚曰文烈皇帝廟號太宗乙酉𦵏和陵皇統四年改號恭陵五年増上尊謚曰體元應運世徳昭功哲恵仁聖文烈皇帝貞元三年十一月戊申改葬于大房山仍號㳟陵贊曰天輔草創未遑禮樂之事太宗以舍音宗幹知國政以宗翰宗望總戎事既滅遼舉宋即議禮制度治歴明時纘以武功逑以文事經國規模至是始定在位十三年宫室苑籞無所増益末聼大臣計傳位熙宗使太祖世嗣不失正緒可謂行其所甚難矣金史卷三
