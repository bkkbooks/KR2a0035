body:
  text: 金史卷四十八元中書右丞相裁托克托等修志第二十九食貨三錢幣錢幣金初用遼宋舊錢天㑹末雖劉豫阜昌元寳阜昌重寳亦用之海陵庶人貞元二年遷都之後戸部尚書蔡松年復鈔引法遂製交鈔與錢並用正隆二年歴四十餘嵗始議鼓鑄冬十月初禁銅越外界懸罪賞格括民間銅鍮器陜西南京者輸京兆他路悉輸中都三年二月中都置錢監二東曰寶源西曰寳豐京兆置監一曰利用三監鑄錢文曰正隆通寳輕重如宋小平錢而肉好字文峻整過之與舊錢通用世宗大定元年用吏部尚書張中彦言命陜西路參用宋舊鐵錢四年寖不行詔陜西行戸部并兩路通檢官詳究其事皆言民間用錢名與鐵錢兼用其實不為凖數公私不便遂罷之八年民有犯銅禁者上曰銷錢作銅舊有禁令然民間猶有鑄鏡者非銷錢而何遂併禁之十年上諭戸部臣曰官錢積而不散則民間錢重貿易必艱宜令市金銀及諸物其諸路酤𣙜之貨亦令以物平折輸之十月上責戸部官曰先以官錢率多恐民間不得流通令諸處貿易金銀絲帛以圖流轉今知乃有以抑配反害百姓者前許院務得折納輕賫之物以便民是皆朕思而後行者也此尚出朕安用若為又隨處時有振濟往往近地無糧取于它處往反既逺人愈難之何為不隨處起倉年豐則多糴以備振贍設有緩急亦豈不易辦乎而徒使錢充府庫將安用之天下之大朕豈能一一徧知凡此數事汝等何為而使至此且戸部與它部不同當從宜為計若但務因循以守其職則戸部官誰不能為十一年二月禁私鑄銅鏡舊有銅器悉送官給其直之半惟神佛像鐘磬鈸鈷腰束帯魚袋之屬則存之十二年正月以錢少命尚書省遣使諸路規措銅貨能指坑冶得實者賞上與宰臣議鼓鑄之術宰臣曰有言所在有金銀坑冶皆可採以鑄錢臣竊謂工費過于所得數倍恐不可行上曰金銀山澤之利當以與民唯錢不當私鑄今國家財用豐盈若流布四方與在官何異所費雖多俱在民間而新錢日増爾其遣能吏經營之左丞石琚進曰臣聞天子之富藏在天下錢貨如泉正欲流通上復問琚曰古亦有民自鑄錢者乎琚對曰民若自鑄則小人圖利錢益薄惡此古所以禁也十三年命非屯兵之州府以錢市易金帛運致京師使錢幣流通以濟民用十五年十一月上謂宰臣曰或言鑄錢無益所得不償所費朕謂不然天下一家何公私之間公家之費私家得之但新幣日増公私俱便也十六年三月遣使分路訪察銅鑛苗脈十八年代州立監鑄錢命震武軍節度使李天吉知保徳軍事高季孫往監之而所鑄斑駁黒澁不可用詔削天吉季孫等官两階觧職仍杖季孫八十更命工部郎中張大節吏部員外郎麻珪監鑄其錢文曰大定通寳字文肉好又勝正隆之制世傳其錢料微用銀云十九年始鑄至萬六千餘貫二十年詔先以五千進呈而後命與舊錢並用初新錢之未行也以宋大觀錢作當五用之二月上聞上京修内所市民物不即與直又用短錢責宰臣曰如此小事朕豈能悉知卿等何為不察也時民間以八十為陌謂之短錢官用足陌謂之長錢大名男子鄂勒巴者上言謂官私所用錢皆當以八十為陌遂為定制二十年十一月名代州監曰阜通設監一員正五品以州節度兼領副監一員正六品以州同知兼領丞一員正七品以觀察判官兼領設勾當官二員從八品給銀牌命副監及丞更馳驛經理二十二年十月以参知政事鈕祜禄額特埒提控代州阜通監二十三年上以阜通鼓鑄嵗乆而錢不加多葢以代州長貳㕔幕兼領而奪于州務不得專意綜理故也遂設副監監丞為正員而以節度領監事二十六年上曰中外皆言錢難朕嘗計之京師積錢五百萬貫亦不為多外路雖有終亦無用諸路官錢非屯兵處可盡運至京師太尉丞相克寜曰民間錢固已艱得若盡歸京師民益艱得矣不若起其半至都餘半變折輕齎則中外皆便十一月上諭宰臣曰國家銅禁久矣尚聞民私造腰帯及鐃託為舊物公然市之宜加禁約二十七年二月曲陽縣鑄錢别為一監以利通為名設副監監丞給驛更出經營銅事二十八年上謂宰臣曰今者外路見錢其數甚多聞有六千餘萬貫皆在僻處積貯既不流散公私無益與無等耳今中都嵗費三百萬貫支用不繼若致之京師不過少有輓運之費縱所費多亦惟散在民爾章宗大定二十九年十二月㕍門五臺民劉完等訴自立監鑄錢以来有銅鑛之地雖曰官運其顧直不足則令民共償乞與本州司縣均為差配遂命甄官署丞丁用楫往審其利病還言所運銅鑛民以物力科差濟之非所願也其顧直既低又有刻剥之弊而相視苖脈工匠妄指人之垣屋及寺觀謂當開採因以取賄又隨冶夫匠日辦净銅四兩多不及數復銷銅器及舊錢送官以足之今阜通利用兩監嵗鑄錢十四萬餘貫而嵗所費乃至八十餘萬貫病民而多費未見其利便也宰臣以聞乃罷代州曲陽二監初貞元間既行鈔引法遂設印造鈔引庫及交鈔庫皆設使副判各一員都監一員而交鈔庫副則專主書押搭印合同之亊印一貫二貫三貫五貫十貫五等謂之大鈔一百二百三百五百七百五等謂之小鈔與鈔並行以七年為限納舊易新猶循宋張詠四川交子之法而紓其期耳葢亦以銅少權制之法也時有欲罷之者至是二監既罷有司言交鈔舊同見錢商旅利于致逺往往以錢買鈔葢公私俱便之亊豈可罷去止因有釐革年限不能無疑乞削七年釐革之法令民得常用若嵗乆字文磨㓕許于所在官庫納舊換新或聴便支錢遂罷七年釐革之限交鈔字昏方換法自此始而収歛無術出多入少民寖輕之厥後其法屢更而不能革弊亦始於此焉交鈔之外制為闌作花紋其上衡書貫例左曰某字料右曰某字號料號外篆書曰偽造交鈔者斬告捕者賞錢三百貫料號衡闌下曰中都交鈔庫准尚書戸部符承都堂劄付戸部覆㸃勘令史姓名押字又曰聖㫖印造逐路交鈔於某處庫納錢換鈔更許于某處庫納鈔換錢官私同見錢流轉其鈔不限年月行用如字文故暗或鈔紙擦磨許于所屬庫司納舊換新若到庫支錢或倒換新鈔毎貫量尅工墨錢若干文庫搯攅司庫副使各押字年月日印造鈔引庫庫子庫司副使各押字上至尚書戸部官亦押字其搭印支錢處合同餘用印依常例初大定間定制民間應許存留銅鍮器物若申賣入官每斤給錢二百文其棄藏應禁器物首納者毎斤給錢百文非器物銅貨一百五十文不及斤者計給之在都官局及外路造賣銅器價令運司佐貳檢校鏡毎斤三百十四文鍍金御仙花腰帯十七貫六百七十一文五子荔支腰帯十七貫九百七十一文擡鈒羅文束帯八貫五百六十文魚袋二貫三百九文鈸鈷鐃磬毎斤一貫九百二文鈴杵坐銅者二貫七百六十九文鍮石者三貫六百四十六文明昌二年十月勅减賣鏡價防私鑄銷錢也舊嘗以夫匠逾天山北界外採銅明昌三年監察御史李炳言頃聞有司奏在官銅數可支十年若復每嵗令夫匠過界逺採不惟多費復恐或生邉釁若支用将盡之日止可于境内採煉上是其言遂不許出界五月勅尚書省曰民間流轉交鈔當限其數毋令多于見錢也四年上諭宰臣曰隨處有無用官物可為計置如鐵錢之類是也或有言鐵錢有破損當令所司以銅價償之者參知政事胥持國不可上曰令儥之尚壞不儥将盡壊矣若果無用曷别為計持國曰如江南用銅錢江北淮南用鐵錢葢以隔閡銅錢不令過界爾如陜西市易亦有用銀布薑麻若舊有鐵錢姑宜収貯以備緩急遂令有司籍鐵錢及諸無用之數貯于庫八月提刑司言所降陜西交鈔多于見錢使民艱于流轉宰臣以聞遂令本路𣙜稅及諸名色錢折交鈔官兵俸許錢絹銀鈔各半之若錢銀數少即全給交鈔五年三月宰臣奏民間錢所以艱得以官豪家多積故也在唐元和間嘗限富家錢過五千者死王公重貶沒入以五之一賞告者上令参酌定制令官民之家以品從物力限見錢多不過三萬貫明安穆昆則以牛具為差不得過萬貫凡有所餘盡令易諸物収貯之有能告數外留錢者奴婢免為良傭者出離以十之一為賞餘皆沒入又諭㫖有司凡出使髙麗國還者所得銅器令盡買之承安二年十月宰臣奏舊立交鈔法凡以舊易新者毎貫取工墨錢十五文至大定二十三年不拘貫例毎張収八文既無益于官亦妨鈔法宜從舊制便若以鈔買鹽引毎貫權作一貫五十文庶得多售上曰工墨錢貫可令収十二文買鹽引者毎貫可權作一貫一百文時交鈔所出數多民間成貫例者艱于流轉詔以西北二京遼東路從宜給小鈔且許干官庫換錢與它路通行十一月尚書省議謂時所給官兵俸及邉戍軍須皆以銀鈔相兼舊例銀毎鋌五十兩其直百貫民間或有截鑿之者其價亦隨低昻遂改鑄銀名承安寳貨一兩至十兩分五等毎兩折錢二貫公私同見錢用仍定銷鑄及接受稽留罪賞格承安三年正月省奏隨處𣙜塲若許見錢越境雖非銷毀即與銷毀無異遂立制以錢與外方人使及與交易者徒五年三斤以上死駔儈同罪捕告人之賞官先為代給錢五百貫其逮及與接引館伴先排通引書表等以次坐罪仍令均償時交鈔稍滯命西京北京臨潢遼東等路一貫以上俱用銀鈔寳貨不許用錢一貫以下聴民便時既行限錢法人多不遵上曰已定條約不為不重其令御史臺及提刑司察之九月以民間鈔滯盡以一貫以下交鈔易錢用之遂復减元限之數更定官民存留錢法三分為率親王公主品官許留一分餘皆半之其贏餘之數期五十日内盡易諸物違者以違制論以錢賞告者於兩行部各置回易務以綿絹物段易銀鈔亦許本務納銀鈔赴𣙜場出鹽引納鈔於山東河北河東等路從便易錢各降補官及徳號空勅三百度牒一千從兩行部指定處限四月進納補換又更造一百例小鈔並許官庫易錢一貫二貫例並支小鈔三貫例則支銀一兩小鈔一貫若五貫十貫例則四分支小鈔六分支銀欲得寳貨者聴有阻滯及輒减價者罪之四年三月又以銀鈔阻滯乃權止山東諸路以銀鈔與綿絹鹽引從便易錢之制令院務諸科名錢除京師河南陜西銀鈔從便餘路並許収銀鈔各半仍于鈔四分之一許納其本路隨路所収交鈔除本路者不復支發餘通行者並循環用之𣙜貨所鬻鹽引収納寳貨與鈔相半銀毎兩止折鈔兩貫省許人依舊詣庫納鈔隨路漕河所収除額外羡餘者亦如之所支官錢亦以銀鈔相兼銀已零截者令交鈔庫不復支若寳貨數少可浸増鑄銀鈔既通則物價自平雖有禁法亦安所施遂除阻滯銀鈔罪制四年以戸部言命在都官錢𣙜貨務鹽引並聽収寳貨附近鹽司貼錢數亦許帯納民間寳貨有所歸自然通行不至銷毁先是設四庫印小鈔以代鈔本令人便賫小鈔赴庫換錢即與支見錢無異今更不須印造俟其換盡可罷四庫但以大鈔騐錢數支易見錢時私鑄承安寳貨者多雜以銅錫寖不能行京師閉肆五年十二月宰臣奏比以軍儲調發支出交鈔數多遂鑄寳貨與錢兼用以代鈔本葢權時之制非經乆之法遂罷承安寳貨泰和元年六月通州刺史盧構言民間鈔固已流行獨銀價未平官之所定毎錠以十萬為凖而市肆纔值八萬葢出多入少故也若令諸税以錢銀鈔三分均納庶革其弊下省議宰臣謂軍興以来全頼交鈔佐用以出多遂滯頃令院務収鈔七分亦漸流通若與銀均納則彼増此减理必偏勝至礙鈔法必欲銀價之平宜令諸名若舖馬軍須等錢許納銀半無者聽便先是嘗行三合同交鈔至泰和二年止行於民間而官不収歛朝廷慮其病民遂令諸税各帯納一分雖止係本路者亦許不限路分通納户部見徴累年舖馬錢亦聽収其半閏十二月上以交鈔事召戸部尚書孫鐸侍郎張復亨議于内殿復亨以三合同鈔可行鐸請廢不用既而復亨言竟詘自是而後國虚民貧經用不足專以交鈔愚百姓而法又不常世宗之業衰焉以至泰和三年其弊彌甚乃謂宰臣曰大定間錢至足今民間錢少而又不在官何耶其集問百官必有能知之者四年七月罷限錢法從户部尚書上官瑜所請也四年欲増鑄錢命百官議所以足銅之術中丞孟鑄謂銷錢作銅及盗用出境者不止宜罪其官及鄰太府監梁􅚻等言鑄錢甚費率費十錢可得一錢識者謂費雖多猶増一錢也乞採銅拘器以鑄宰臣謂鼔鑄未可速行其銅冶聽民煎煉官為買之凡寺觀不及十人不許畜法器民間鍮銅器期以兩月送官給價匿者以私法坐限外人告者以知而不糾坐其官寺觀許童行告者賞俟銅多别具以聞八月定從便易錢法聽人輸納於京師而于山東河北大名河東等路依數支取後鑄大錢一直十篆文曰泰和重寳背文有螭虎二與鈔參行五年上欲罷交鈔工墨錢復以印費命貫止収六文六年四月陜西交鈔不行以見錢十萬貫為鈔本與鈔相易復以小鈔十萬貫参用之十一月復許諸路各行小鈔中都路則于中都及保州南京路則于南京歸徳河南府山東東路則于益都濟南府山東西路則于東平大名府河北東路則于河間府冀州河北西路則於眞定彰徳府河東南路則于平陽河東北路則于太原汾州遼東則于上京咸平西京則于西京撫州北京則于臨潢府官庫易錢令戸部印小鈔五等附各路同見錢用七年正月勅所在官毋得支出大鈔在民者赴庫以多寡制數易小鈔及見錢院務商稅及諸名錢三分須納大鈔一分惟遼東從便時民以貨幣屢變往往怨嗟聚語于市上知之諭㫖于御史臺曰自今都市敢有相聚論鈔法難行者許人捕告賞錢三百貫五月以戸部尚書高汝礪議立鈔法條約添印大小鈔以鈔庫至急切増副使一員汝礪又與中都路轉運使孫鐸言錢幣上命中丞孟鑄禮部侍郎喬宇國子司業劉昻等十人議月餘不决七月上召議于奉和殿且諭汝礪曰今後毋謂鈔多不加重而輒易之重之加于錢可也明日勅民間之交易典質一貫以上並用交鈔毋得用錢須立契者三分之一用諸物六盤山西遼河東以五分之一用鈔東鄙屯田戸以六分之一用鈔不須立契者惟遼東錢鈔從便犯者徒二年告者賞有差監臨犯者杖且觧職縣官能奉行流通者升餘否者降罰集衆沮法者以違制論工墨錢毎張止収二錢商旅賫見錢不得過十貫所司籍辦鈔人以防偽冒品官及民家存留見錢比舊减其數若舊有見錢多者許送官易鈔十貫以上不得出京又定制按察司以鈔法流通為稱職而河北按察使錫卜察巡按所給劵應得鈔一貫以難支用命取見錢御史以沮壞鈔法劾之上曰糾察之官乃先壊法情不可恕杖之七十削官一階觧職戸部尚書高汝礪言鈔法務在必行府州縣鎮宜各籍辦鈔人給以條印聽與人辨騐隨貫量給二錢貫例雖多六錢即止毎朝官出使則令體究通滯以聞民間舊有宋㑹子亦令同見錢用十貫以上不許特行𣙜鹽許用銀絹餘市易及俸並用交鈔其奇數以小鈔足之應支銀絹而不足者亦以鈔給之上遣近侍諭㫖尚書省今既以按察司鈔法通快為稱職否則為不稱職仍干州府司縣官給由内明書所犯之處但犯鈔法者雖監察御史舉其能幹亦不凖用十月楊序言交鈔料號不明年月故暗雖令赴庫易新然外路無設定庫司欲易無所逺者直須赴都上以問汝礪對曰隨處州府庫内各有辦鈔庫子鈔雖弊不偽亦可収納去都逺之城邑既有設置合同換錢客旅經之皆可相易更慮無合同之地難以易者令官庫凡納昏鈔者受而不支于鈔背印記官吏姓名積半嵗赴都易新鈔如此則昏鈔有所歸而無滯矣十一月上諭戸部官曰今鈔法雖行卿等亦宜審察少有壅滯即當以聞勿謂已出而憚改汝礪對曰今諸處置庫多在公廨内小民出入頗難雖有商賈易之然患鈔本不豐比者河北西路轉運司言一富民首其當存留錢外見錢十四萬貫他路脫或有如此者臣等謂宜令州縣委官及庫典于市肆要處置庫支換以出首之鈔為鈔本十萬戸以上州府給三萬貫以次為差易錢者人不得過二貫以所得工墨錢充庫典食直仍令州府佐貳及轉運司官一員提控上是之遂命移庫于市肆之㑹令民以鈔易錢是月勅捕獲偽造交鈔者皆以交鈔為賞時復議更鈔法上從高汝礪言命在官大鈔更不許出聴民以五貫十貫例者赴庫易小鈔欲得錢者五貫内與一緍十貫内與兩緍惟遼東從便河南陕西山東及它行鈔諸路院務諸稅及諸科名錢並以三分為率一分納十貫例者二分五貫例者餘並収見錢八年正月以京師鈔滯定所司賞罰格時新制按察司及州縣官例以鈔通滯為升降遂命監察御史賞罰同外道按察司大興府警巡院官同外路州縣官是月収毁大鈔行小鈔八月從遼東按察司楊雲翼言以咸平東京兩路商旅所集遂從都南例一貫以罰用交鈔不得用錢十月孫鐸又言民間鈔多正宜収歛院務稅諸名錢可盡収鈔秋夏稅納本色外亦令収鈔不拘貫例農民知之則漸重鈔可以流通比来州縣抑配市肆買鈔徒増騷優可罷諸處創設鈔局止令赴省庫換易今小鈔名限路分亦甚未便可令通用上命急行之十二月宰臣奏舊制内外官兵俸皆給鈔其必用錢以足數者可以十分為率軍兵給三分官員承應人給二分多不過十貫凡前所収大鈔俟至通行當復計造其中須當精緻以圖經乆民間舊鈔故暗者乞許于所在庫易新若官吏勢要之家有賤買交鈔而于院務換錢興販者以違制論復遣官分路巡察其限錢過數雖許奴婢以告乃有所屬黙令其主藏匿不以實首者可令按察司察之若舊限已滿當復更展十日許再令變易鈔引諸物是制既行之後章宗尋崩衛紹王繼立大安二年潰河之役至以八十四車為軍賞兵衂國殘不遑救弊交鈔之輕幾于不能市易矣至宣宗貞祐二年二月思有以重之乃更作二十貫至百貫例交鈔又造二百貫至千貫例者然自泰和以来凡更交鈔初雖重不數年則輕而不行至是則愈更而愈滯矣南遷之後國蹙民困軍旅不息供億無度輕又甚焉三年四月河東宣撫使胥鼎上言曰今之物重其弊在于鈔窒有出而無入也雖院務稅増収數倍而所納皆十貫例大鈔此何益哉今十貫例者民間甚多以無所歸故市易多用見錢而鈔毎貫僅直一錢曽不及工墨之費臣愚謂宜權禁見錢且令計司以軍須為名量民力徴歛則泉貨流通而物價平矣自是錢貨不用富家内困藏鏹之限外弊交鈔屢變皆至窘敗謂之坐化商人往往舟運貿易于江淮間錢多入宋矣宋人以為喜而宋人不禁也識者惜其既不能重無用之楮而又棄自古流行之寳焉五月權西安軍節度使烏陵阿與言闗陜軍多供億不足所仰交鈔多取于京師徒成此繁費乞降板就造便又言懷州舊鑄錢鉅萬今既無用願貫為甲以給戰士時有司輕罪議罰率以錢贖而當罪不平遂命贖銅計贜皆以銀價為率六月勅議交鈔利便七月改交鈔名為貞祐寳券仍立沮阻罪九月御史臺言自多故以来全藉交鈔以助軍需然所入不及所出則其價浸减卒無法以禁此自然之理也近用貞祐寳劵以革其弊又慮既多而民輕與舊鈔無異也乃令民間市易悉從時估嚴立罪賞期于必行遂使商旅不行四方之物不敢入夫京師百萬之衆日費不貲物價寧不日貴耶且時估月再定之而民間價旦暮不一今有司强之而市肆盡閉復議捜括隐匿必令如估鬻之則京師之物指日盡而百姓重困矣臣等謂惟官和買計贓之類可用時估餘宜從便制可十二月上聞近京郡縣多糴於京師榖價翔踴令尚書省集戸部講議所開封府轉運司議所以制之者戸部及講議所言以五斗出城者可闌糴其半轉運司謂宜悉禁其出上從開封府議謂寳券初行時民甚重之但以河北陕西諸路所支既多人遂輕之商賈爭收入京以市金銀銀價昻榖亦隨之若令寳券路各殊制則不可復入河南則河南金銀賤而榖自輕若直閉京城粟不出則外亦自守不復入京榖當益貴宜諭郡縣小民毋妄増價官為定制務從其便四年正月監察御史田迥秀言國家調度皆資寳券行才數月又復壅滯非約束不嚴奉行不謹也夫錢幣欲流通必輕重相權散歛有術而後可今之患在出太多入太少耳若隨時裁損所支而増其所収庶乎或可也因條五事一曰省冗官吏二曰損酒使司三曰節兵俸四曰罷寄治官五曰酒稅及納粟補官皆當用寳券詔酒稅從大定之舊餘皆不從尋又更定捕獲偽造寳券官賞三月翰林侍講學士趙秉文言比者寳券滯塞盖朝廷将議更張而已妄傳不用因之抑遏漸至廢絶此乃權歸小民也自遷汴以来廢回易務臣愚謂當復置令職官通市道者掌之給銀鈔粟麥縑帛之類權其低昻而出納之仍自選良監當官營為之若半年無過及券法流通則聽所指任便差遣詔議行之四月河東行省胥鼎言交鈔貴乎流通今諸路所造不充所出不以術収之不無缺誤宜量民力徴歛以禆軍用河中宣撫司亦以寳券多出民不之貴乞騐民貧富徴之雖為陕右若一體徴收則彼中所有日湊于河東與不歛何異又河北寳券以不許行于河南由是愈滯宰臣謂昨以河北寶券商旅賫販繼踵南渡遂致物價翔湧乃權宜限以路分今鼎既以本路用度繁殷欲徴軍須錢宜從所請若陕西可徴與否詔令行省議定而後行五月上以河北州府官錢散失多在民間命尚書省經畫之八月平章高琪奏軍興以来用度不貲惟頼寳券然所入不敷所出是以浸輕今千錢之券僅直數錢隨造隨盡工物日増不有以救之弊将滋甚宜更造新券與舊為子母而兼而用之庶幾工物俱省而用不乏濮王守純以下皆惮改奏曰自古軍旅之費皆取于民向朝廷以小鈔殊輕權更寳券而復禁用錢小民淺慮謂楮幣易壊不若錢可乆於是得錢則珍藏而券則亟用之惟恐破裂而至于廢也今朝廷知支而不知収所以錢日貴而券日輕然則券之輕非民輕之國家致之然也不若量其所支復歛于民出入循環則彼知為必用之物而知愛重矣今徒患輕而即欲更造不惟信令不行且恐新券之輕復同舊券也既而隴州防禦使完顔㝢及陕西行省令史惠吉繼言券法之弊㝢請姑罷印造以見在者流通之若滯塞則騐丁口之多寡物力之高下而徴之吉言劵者所以救弊一時非可流通與見錢比必欲通之不過多歛少支爾然歛多則傷民支少則用不足二者皆不可為今日計莫若更造以貞祐通寶為名自百至三千等之為十聽各路轉運司印造仍不得過五千貫與舊券參用庶乎可也詔集百官議戸部侍郎鄂屯阿古禮部侍郎楊雲翼郎中蘭芝刑部侍郎馮鶚皆主更造戸部侍郎高䕫員外郎張師魯兵部侍郎圖克坦鄂勒博皆請徴歛惟戸部尚書蕭貢謂當如舊而工部尚書李元輔謂二者可並行太子少保張行信亦言不宜更造但嚴立不行之罪足矣侍御史趙伯成曰更造之法隂奪民利其弊甚于徴徴之為法特徴于農民則不可若徴于市肆商賈之家是亦敦本抑末之一端刑部主事王夀寜曰不然今之重錢輕劵者皆農耳其歛必先于民而後可轉運使王擴曰凡論事當究其本今嵗支軍士家口糧四萬餘石如使斯人地着少寛民力然後徴之則行之不難𣙜貨司楊貞亦欲節無名之費罷閑冗之官或有請鑄大錢以當百别造小鈔以省費或謂縣官當擇人者獨吏部尚書温特赫思敬上書言國家立法莫不備具但有司不克奉之而已誠使臣得便宜從事凡外路四品以下官皆許杖决三品以上奏聞仍付監察二人馳驛往来法不必變民不必徴一號令之可使上下無不奉法如其不然請受重刑上以示宰臣曰彼自許如此試委之可乎宰臣未有以處而監察御史陳規完顔蘓哷交諍以為事有難行聖哲猶病之思敬何為者徒害人爾上以衆議紛紛月餘不决厭之乃詔如舊紓其徴歛之期焉未幾竟用惠吉言造貞祐通寳興定元年二月始詔行之凡一貫當千貫増重偽造沮阻罪及捕獲之賞五月以鈔法屡變隨出而隨壊製紙之桑皮故紙皆取於民至是又甚艱得遂令計價但徴寳券通寳名曰桑皮故紙錢謂可以免民輸輓之勞而省工物之費也高汝礪言河南調𤼵繁重所徴租税三倍於舊僅可供億如此其重也而今年五月省部以歲收通寳不充所用乃於民間歛桑皮故紙鈔七千萬貫以補之又太甚矣而近又以通寳稍滯又増兩倍河南人戸農民三之二今年租税徴尚未足而復令出此民若不糴當納之租則賣所食之粟舍此将何得焉今所急而難得者芻糧也出於民而有限可緩而易為者交鈔也出於國而可變以國家之所自行者而強求之民将若之何向者大鈔滯則更為小鈔小鈔弊則改為寳劵寳券不行則易為通寶變制在我尚何煩民哉民既悉力以奉軍而不足又計口計税計物計生殖之業而加徴若是其剥彼不能給則有亾而已矣民逃田穢兵食不給是軍儲鈔法兩廢矣臣非於鈔法不加意非故與省部相違也但以鈔滯物貴之害輕民去軍飢之害重爾時不能用三年十月省臣奏向以物重錢輕犯贓者計錢論罪則太重於是以銀為則毎两為錢二貫有犯通寶之贓者直以通寶論如因軍興調發受通寶及三十貫者已得死刑準以金銀價纔為錢四百有竒則當杖輕重之間懸絶如此遂命准犯時銀價論罪三月叅知政事李復亨言近制犯通寶之贓者並以物價折銀定罪每两為錢二貫而法當贖銅者止納通寶見錢亦乞令依上輸銀既足以懲惡又有補于官詔省臣議遂命犯公錯過悮者止徴通寶見錢贜汚故犯者輸銀四年十二月鎮南軍節度使温特赫思敬上書言錢之為泉也貴流通而不可塞積於官而不散則病民散于民而不歛則闕用必多寡輕重與物相權而後可大定之世民間錢多而鈔少故貴而易行軍興以來在官殊少民亦無幾軍旅調度悉仰于鈔日之所出動以萬計至于填委市肆能無輕乎不若弛限錢之禁許民自採銅鑄錢而官製模範薄惡不如法者令民不得用則錢必日多鈔可少出少出則貴而易行矣今日出益衆民日益輕有司欲重之而不得其法至乃計官吏之俸騐百姓之物力以歛之而卒不能増重曾不知錢少之弊也臣謂宜令民鑄錢當歛鈔者亦聽其輸銀民因以銀鑄錢為數等文曰興定元寶定直以備軍賞亦救弊之一法也朝廷不從五年閏十二月宰臣奏向者寶券既弊乃造貞祐通寶以救之迄今五年其弊又復如寶券之末初通寶四貫為銀一兩今八百餘貫矣宜復更造興定寶泉子母相權與通寳兼行毎貫當通寶四百貫以二貫為銀一両随處置庫許人以通寳易之縣官能使流通者則進官一階陞職一等其或姑息以致壅滯則亦追降的决為差州府官以所属司縣定罪賞命監察御史及諸路行部官察之定撓法失糾舉法失舉則御史降决行部官降罰集衆妄議難行者徒二年告捕者賞錢三百貫元光元年二月始詔行之二年五月更造毎貫當通寶五十又以綾印製元光珍貨同銀鈔及餘鈔行之行之未乆銀價日貴寳泉日賤民但以銀論價至元光二年寶泉㡬於不用乃定法銀一両不得過寳衆三百貫凡物可值銀三両以下者不許用銀以上者三分為率一分用銀二分用寳泉及珍貨重寳京師及州郡置平凖務以寶泉銀相易其私易及違法而能告者罪賞有差是令既下市肆晝閉商旅不行朝廷患之乃除市易用銀及銀寶泉私相易之法然上有限用之名而下無從令之實有司雖知莫能制矣義宗正大間民間但以銀市易天興二年十月印天興寳㑹於蔡州自一錢至四錢四等同見銀流轉不数月國亡金史卷四十八
