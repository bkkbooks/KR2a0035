body:
  text: 金史卷五十四元中書右丞相總裁托克托等修志第三十五選舉四部選薦舉省選虧亷察功酬水凡吏部選授之制自太宗天㑹十二年始法古立官至天眷元年頒新官制及天徳四年始以河南北選人並赴中京吏部各置局銓注又命吏部尚書蕭頤定河南北官通注格以諸司横班大解并大將軍合注差人依年例一就銓注餘求仕人分四季擬授遂為定制貞元二年命擬注時依舊令求仕官眀數謂面授也不許就本鄉若衰病年老者毋授繁劇處世宗大定元年勅從八品以下除授不須奏聞又制求仕官毋入權門違者追一官降除有所餽獻而受之者奏之二年詔隨季選人如無過或有功酬者依格銓注有亷能及汚濫者約量升降呈省七年命有司自今毎季求仕人到部令本部體問政跡出衆者及贓汚者申省核實以聞約量升擢懲㫁年老者勿授縣令又謂宰臣曰隨朝官能否大率可知若外路轉運司幕官以至縣令但驗資考其中縱有忠勤亷潔者無路而進是此人終身不敢望三品矣豈進賢退不肖之道哉自今通三考視其能否以定升降為格又曰今用人之法甚弊其有不求聞達者入仕雖乆不離小官至三四十年不離七品者而新進者結朝貴致顯達此豈示激勸之道卿等當審於用人以革此弊時青州防禦使常徳輝上言吏部格法止敘年勞是以雖有才能拘於法而不得升以致人才多滯下位又刺史縣令親民之職多不得人乞加體察然後公行亷問庶使有懼心且今酒税使尚選能者況承流宣化之官可不擇乎自今宜以能吏當任酒使者授親民之職從之十年上謂宰臣曰守令以下小官能否不能徧知比聞百姓或請留者類皆不聽凡小官得民悦上官多惡之能承事上官者必不得民悦自今民願留者許直赴部告呈省遣使覆實其績果善可超升之如丞簿升縣令之類以示激勸二十六年以闕官勅見行格法合降資厯内三降兩降各免一降一降者勿降省令譯史合得縣令資厯内免録事及下縣令各一任密院令史三考以上者仝前免之臺部宗正府統軍司令譯史合厯縣令任數免下令一任外路右職文資諸科合厯縣令亦免一任當過檢法知法三考得録事者已後兩除一差眀昌三年上曰舊制毎季到部求仕人識字者試以書判不識字者問以疑難二事體察言行相副者其令自今隨季部人並令依條試驗宰執奏曰既體察知與所舉相同又試中書判若不量與升除無以示勸遂定制若隨朝及外路六品以上官則隨長任用外路正七品官擬升六品縣令一等除授任滿合降者免降從七品以下於各等資厯内減兩任擬注以後體察相同即依已升任使若體察不同者本等注授若見任縣令升中上令者并掌錢穀及丁憂去者候解由到部諸局分人亦候將來出職日準上擬注眀安穆昆擬依前提刑司保舉到升任例施行時嘗令隨門户減一資厯眀昌七年勅復令如舊泰和元年上以縣令見守闕近者十四月逺者十六月又以縣令丞簿員闕不相副勅省臣右選官見格散官至眀威者注縣令宣武者注丞簿雖曽犯選格及虧永者亦注是無别也遂定制曽犯選格及虧永者廣威注令眀威注丞簿衛紹王大安元年以縣令闕少令初入上中下令者與其守闕可令再注丞簿一任俟員闕相副則當復舊宣宗貞祐二年以播越流離官職多闕權命河朔諸道宣撫司得擬七品以下尋以所注吏部不知季放之闕多至重複乃奏罷之時李英言兵興以來百務煩冗政在用人舊雖有四善十七最之法而拔擢蔑聞幾為徒設大定間以監察御史及審録官分詣諸路考覈以擬號為得人可依已試之効庶幾使人自勵詔從之三年户部郎中鄂屯阿古言諸色遷官並與女直一體而有司不奉妄生分别以至上下相疑詔以違制禁之初宣宗之南遷也詔吏部以秋冬於南京春夏於中都置選而赴調者憚於北行率皆南來遂併於南京設之三年命汰不勝官者令五品以上官公舉今季赴部人内先擇材幹者量緩急易之興定元年詔有司議減冗員又詔自今吏部毎季銓選差女直漢人監察各一員監視又盡罷前犯罪降除截罷及承應未滿解去而復為隨處官司委使者又定制權依劇縣例俱作正七品令隨朝七品外路六品以上職事官舉正七品以下職事官年未六十無公私罪堪任使者嵗一人仍令兼領樞密院彈壓之職以鎮軍人凡上司不得差占及淩辱決罰到任半年委巡按官體訪具申籍記又半年覆察考滿日分等升用如六事備為上等升職一等四事為中等減二資厯其次下等減一資厯不稱者截罷凡省選之制自熙宗皇統八年以上京僻逺始命詣燕京擬注嵗以為常貞元遷都始罷是制其常調制正七品兩任陞六品六品三任陞從五品從五品兩任陞正五品正五品三任陞刺史凡内外官皆以三十月為考隨朝官以三十月為任陞職一等自非制授尚書選在外官命左司移文勾取承安三年始命置簿勾取大定十五年制凡二品官及宰執樞密使不理任每及三十月則書于貼黄不及則附于闕滿簿内外三品官以五十月為任泰和三年制凡文資右職官應遷三品職事者五十月上厯五十月六品以下及門廕雜流職事至四品以上而散官應至三品者皆厯六十月方許告遷七年自按察使副依舊三十月理考外内外四品以四十月理考通八十月遷三品泰和八年詔以門廕官職事至四品者甚少自今至刺史而散官應至三品者即許告遷三品此省選資考之制也世宗大定元年上謂宰臣曰朕昔厯外任不能悉知人之優劣毎除一官必以不稱職為憂夫薦賢乃相職卿等其各盡乃心勿貽笑天下又曰凡擬注之際當為官擇人勿徒任親舊庶無曠官矣又曰守令之職當擇材能比聞近邉殘破多用年老及罪降者是益害邊民也若資厯高者不當任邊逺可取以下之才能者升授回不復降庶可以完復邊陲也邊陞之制蓋始于此三年詔監當官遷散官至三品尚任縣令者與省除四年勅隨朝六品以繁劇局分官有闕者省不得擬注令具闕及人以聞六年制官至三品除朝廷約量勞績嵗月特恩遷官七年制内外三品官遇擬注其厯過成考以上月日不曽遷加或經革撥可於除目内備書以聞又勅外路四品以上職事官并五品合陞除官皆具闕及人以聞六品以下官命尚書省擬定而復奏上又謂宰臣曰擬注外官往往未當州縣之官良則政舉否則政隳卿宜辨論人材優劣參用則遞相勉勵庶幾成治矣又曰從來頓舍人例為節副今宣徽院同簽尼楚赫以特收頓舍然後授以滄州同知此亦何功但其人有足任使故授以同簽也且如自䕶衛符寳頓舍考滿者與六品五品之職而與元苦辛特收頓舍者例除則是不倫也十年謂宰臣曰凡在官者若不為隨朝職任便不能離常調若以卿等所知任使恐有滯如驗入仕名項或亷等第用之亦可若不稱職即與外除十一年上謂宰臣曰隨朝官多自計所厯一考謂當得某職兩者又當得某職故但務因循而已及被差遣又多稽遲近除大理司直李寳為警巡使而奏謝言臣内歴兩考意謂合得五品而除六品也朕以此人幹事嘗除監察御史及為大理司直未嘗言情見一事由是除長官欲視其為政故授是職自今外路與内除者察其為政公勤則升用若但務苟簡者不必待任滿即當依本等出之不眀賞罰何以示勸勉也十二年上謂宰臣曰朕嘗取尚書省百官行止觀之應任刺史知軍者甚少近獨深州同知希卜蘇為可故用之即今居五品者皆再任當例降之人故不可也䕶衛中有考滿者若令出職慮其年幼不閑政事兼宿衛中如今日人材亦難得也若勒留承應累其資考令止正五品可乎皆曰善十六年勅宰臣選調擬注之際須引外路求仕人引至尚書省堂量材受職二十一年謂宰臣曰海陵時與人本官太濫今復太隘令散官小者奏之二十四年以舊資考太滯命各減一任臨時量人材辛苦資厯年甲以次奏稟章宗大定二十九年定制自正七品而上皆以兩任而後陞眀昌四年以前制有職官已帶三品者不許告遷有司因之不舉以致無由遷敘上慮其滯遂定制已帶三品散官實厯五十月從有司照勘格前進官一階格後為始再筭五年命宰臣擬注之際召赴選人與之語以觀其人六年命隨朝五品之要職及外路三品官皆具人闕進呈以聽制授七年勅隨朝除授必欲至三十月如有急闕則具闕及人奏稟尋復令不須待考滿後當通筭其所厯而已承安四年勅宰臣曰凡除授恐未盡當今無門下省雖有給事中而無封駁司若設之使於擬奏未受時詳審得當然後授之可也乃立審官院凡所送令詳審者以五日内奏或申省承安五年以六品從五品闕少勅命厯三任正七品而後陞六品泰和元年諭㫖宰臣曰凡選急闕與其用資厯未及之人何如止起復丁憂舊人也命内外官通筭合得升等而少十五月者依舊在職補足而後升除或有餘月日以後積筭遇闕而無相應人則以資厯近者奏稟二年命少五月以下者本任補六月至十四月者本任或别除補之是制既行之後至六年以一例遞升復恐太濫命量材續稟衛紹王大安元年定文資本職出身内有至一品職事官應遷一品散官者實厯五十月方許告遷二品三品職事官應告本品循遷者亦厯五十月不得過本品外四品以下職事官如遷三品者亦厯五十月止許告遷三品一資六品以下職事官厯六十月告遷帶至三品更不許告犯選格者皆不許如已至三品以上職事者六十月亦聽凡遷三品官資及致仕并横遷三品者則具行止以聞四品則六十月告遷雜班則否宣宗興定初圖克坦烏遜言兵興以來恩命數出以勞進階者比年尤多賤職下僚散官或至極品名器之輕莫此為甚自今非親王子及職一品餘人雖散官至一品乞皆不許封公若已封者雖不追奪其儀衛亦當降從二品之制從之凡選監察御史尚書省具才能者疏名進呈以聽制授任滿御史臺奏其能否仍視其所察公事具書於解由以送尚書省如所察事皆無謬戻為稱職則有陞擢庸常者臨期取㫖不稱者降除任未滿者不許改除大定二十七年前嘗令六十以上者為之後臺官以年老者多廢事為言乃勅尚書省於六品七品内取六十以下亷幹者備選二十九年令臺官得自辟舉眀昌三年復命尚書省擬注每一闕則具三人或五人之名取㫖授之承安三年勅監察給由必經部而後呈省泰和四年制以給由具所察事之大小多寡定其優劣八年定制事有失糾察者以怠慢治罪貞祐二年定制以所察大事至五小事至十為稱職數不及且無切務者為庸常數内有二事不實者為不稱職四年命臺官辟舉以名申省定其可否亷察之制始見於海陵時故正隆二年六月有亷能官復與差除之令大定三年命亷到亷能官第一等進官一階陞一等其次約量注授汚濫官第一等殿三年降二等次二年又次一年皆降一等詔亷問眀安穆昆亷能者第一等遷兩官其次遷一官汚濫者第一等決杖百罷去擇其兄弟代之第二等杖八十第三等杖七十皆令復職佛寧決則罷去永不補差八年省臣奏御史中丞伊喇道所亷之官上曰職官多貪汚以致罪廢其餘亦有因循以苟嵗月者今所察能實可甄奬若即與升除恐無以慰民愛留之意且可遷加候秩滿日升除十年正月上謂宰臣曰今天下州縣之職多闕員朕欲不限資厯用人何以徧知其能擬欲遣使亷問又慮擾民而未得其真若令行辟舉之法復恐乆則生弊不若選人暗察眀亷如其相同然後陞黜之何如宰臣曰當如聖訓十一年奏所亷善惡官上曰罪重者遣官就治所犯細微者蓋不能禁制妻孥耳其誡勵而釋之凡亷能官四品以下委官覆實同則升擢三品以上以聞朕自處之時陳言者有云毎三年委宰執一員亷問者上以大臣出則郡縣動搖誰復敢行事者今黙察明問之制蓋得其中矣又謂宰臣曰朕以欲遍知天下官吏善惡故每使採訪其被升黜者多矣宜知勸也若常設訪察恐任非其人以之生弊是以姑罷之皆曰是官不設何以知官吏之善惡也左丞相良弼曰自今臣等盡心親察之上曰宜加詳勿使名實淆混十二年以同知山陽軍山和尚等清强上曰此輩暗察眀訪皆著政聲夫賞罰必信則善者勸惡者懼此道乆行庶可得人也其第其政績旌賞之三月詔贓官既已被亷若仍舊在職必復害民其遣驛使遍詣諸道即日罷之大定二十八年制以閤門祇候筆硯承奉奉職妃䕶衛東宫入殿實逹爾宗室郎君王府郎君省郎君始以選試才能用之不須體察内藏巴哩巴不入殿實逹爾與入殿實逹爾及扎布書畫亦不體察三年以所亷察則有清亷之聲而政績則平常者勅命不降注以石仲淵等四人雖清亷為百姓所喜而復有行事邀順人情之語則與公正亷能人不同勅命降注凡治績平常者奪元舉官俸一月眀昌四年上曰凡被舉者或先察者不同其後為人再舉而察者同或先察者同而後察者不同當何以處之其議可乆通行無窒之術以聞省臣奏曰保舉與體察不一者可除不相攝提刑司境内職事再令體察如果同則依格用不同則還本資厯時有議凡當舉人之官嵗限以數減資注受者是日省臣併奏以謂如此恐滋乆長求請僥倖之弊遂擬被舉官如體察相同隨常陞用不如所舉者元舉官約量降除如自囑求舉或因勢要及為人請囑而舉之者各追一官受賄者以枉法論體察官亦同此嵗舉不限數不舉不坐罪但不如所舉則有降罰如此則必不敢濫舉而實材可得上曰是可止作條理施行一二年當别思其法承安四年以按察司不兼採訪遂罷平倒别路除授之制泰和元年定制自第一等闕外第二等闕滿合注縣令者升上令少一任與中令少二任與下令少三任以上者與録事軍防判仍減一資注令少五任以上者注丞簿第三等任滿合注縣令者升中令少一任與下令少二任以上者與録事防判亦減一資注令少四任以上者並注丞簿已入縣令者秩滿日與上令仍依各等資考内通減兩任呈省已任六品七品者減一資注授經保充縣令眀問相同依資考不待滿升除見隨朝者考滿升注既升除後將來覆察公正亷能者不降宣宗南遷嘗以御史巡察興定元年以縣官或非材監察御史一過不能備知遂令每嵗兩遺監察御史巡察仍别選官巡訪以行黜陟之政哀宗正大元年設司農司自卿而下迭出巡察吏治臧否以陞黜之舉薦大定二年詔隨朝六品外路五品以上官各舉亷能官一員三年定制若察得所舉相同者即議旌除若聲跡穢濫所舉官約量降罸九年上曰朕思得忠亷之臣與之共治故嘗命五品以上各舉所知于今數年矣以天下之大豈無其人由在上者知而不舉也參知政事魏子平奏曰可令當舉官者毎任須舉一人視其當否以為旌賞上曰一任舉一人則人材或難恐涉於濫又少有所犯則罪舉者故人益畏而不敢舉宋國被舉之官有犯罪者所舉官雖宰執亦不免降黜若有能名則被遷賞且人情始慕進故多亷慎既得任用或失所守宰執自掌黜陟之權豈可因所舉而置罪耶左丞相赫舍哩良弼曰己申前令命舉之矣十年上曰舉人之法若定三品官當舉幾人是使小官皆諂媚於上也惟任滿詢察前政則得人矣十一年上謂宰臣曰昨觀貼黄五品以上官多闕而難於得人凡三品以上朕則自知五品以下不能盡識卿等曽無一言見舉者國家之務朕豈能獨盡哉蓋嘗思之欲盡乆安之計興百姓之利而無良輔佐雖有所行皆尋常事耳十九年時朝廷既取民所譽望之官而升遷之後上以隨路之民赴都舉請者往往無亷能之實多為所使而來沽名者不須舉行章宗大定二十九年上以選舉十事命奉御赫嚕諭尚書省定擬其一曰舊格進士軍功最高尚且初除丞簿第五任縣令升正七品兩任正七品升六品三任六品升從五品兩任從五品升正五品正五三任後升刺史計四十餘年始得至刺史也其他資格出職者可知矣拘於資格之滯至於如此其令提刑司採訪可用之才減資考而用之庶使可用者不至衰老省臣遂擬凡三任升者減為兩任於此資厯内遇各品闕多則於第二任未滿人内選人材苦辛可以超用者及外路提刑司所採訪者升擢之其二曰舊格隨朝苦辛驗資考陞除者任滿回日而復降之如正七滿回降除從七品從五品回降為六品之類今若其人果才能可回免降尚書吏部遂擬今隨朝考滿遷除外路五品以下職事并應驗考次職滿有才能者以本官任滿已前十五月以上二十月以内察訪保結呈省其三曰隨路提刑所訪亷能之官就令定其堪任職事從宜遷注其四曰從來宰相不得與求仕官相見如此何由知天下人材優劣其許相見以訪才能尚書刑部謂在制求仕官不得於私第謁見達官違者追一官降等奏除若有求請餽遺則以奏聞仍委御史糾察上遂命削此制其五曰舊時臣下雖知親友有可用者皆欲逺嫌而不引薦古者舉賢不避親讎如祁奚舉讎仁傑舉子崔祐甫除吏八百皆親故也其令五品以上官各舉所知幾人違者加以蔽賢之罪吏部議内外五品以上職事官毎嵗保亷能官一人外路五品隨朝六品願舉者聽若不如所舉者各約量降罰今擬賢而不舉者亦當約量降罰其六曰前代官到任之後即舉可自代者其令自今五品以上官舉自代以備交承吏部按唐㑹要建中元年赦文文武常叅官外節度觀察防禦軍使刺史赤令畿令并七品以上清官大理司直評事受命之三日於四方館上表讓一人以自代外官則馳驛奏聞表付中書門下每官闕即以所舉多者量授今擬内外官五品以上到任須舉所知才行官一員以自代太傅丞相平章謂自古人材難得若令舉以自代恐濫而不得實材叅政謂自代非謂即令代其人也止類姓名取所舉多者約量授之爾此蓋舜官相讓周官推賢之遺意上以叅政所言與吏部同從之其七曰隨朝外路長官一任之内足知僚屬之能否毎任可令舉幾人吏部擬今内外五品以上職事官長於僚屬内須舉才能官一人數外舉者聽其八曰人材隨色有之監臨諸物料及草澤隠逸之士不無人材宜薦舉用之吏部擬監臨諸物料内以外路五品隨朝六品以上舉亷能者直言所長移文轉申省差官察訪得實隨材任使草澤隠逸當遍下司縣以提刑司察訪呈省隨色人材令内外五品以上職官薦之其九曰親軍出職内有尤長武藝勇敢過人者其令内外官舉提刑司察如資考高者可叅注沿邊刺史同知縣令吏部擬若依本格資厯恐妨才能若舉察得實者依本格減一資厯擬注尚書省擬依㫖升品擬注其十曰内外官所薦人材即依所舉試之委提刑司採訪虛實若果能稱職再加遷擢如或碌碌即送常調古者進賢受上賞進不肖有罰其立定賞罰條格庶使人不敢徇私也省臣議隨欵各欲舉人則一人内所舉不下五七人自古知人為難人材亦自難得限數多則猥避責罰務苟簡不副聖主求賢之意擬以前頂各款隨色能舉一人即充嵗舉之數如此則不濫而實材得矣毎嵗貢人數尚書省覆察相同則置簿籍之如有闕則當隨材奏擬眀昌元年勅齊民之中有徳行才能者司縣舉之特賜同四舉五舉人下眀昌元年制如所舉碌碌無過人跡者元舉官依例治罪宣宗興定元年令隨朝七品外路六品以上職事官舉正七品以下職事官年未六十不犯贓堪任使者一人三年定辟舉縣令制稱職則元舉官減一資厯中平約量陞除不稱罰俸一月犯免官免所居官及官當私罪解任杖罪贓汚者約量降除汚贓至徒以上及除名者一任不理資考三品以上舉縣令稱職者約量升除不稱奪俸一月若被舉者犯免官等罪奪俸兩月贓汚至徒以上及除名者奪俸三月獄成而㑹赦原者亦原之五年制辟舉縣令考平者元舉者不得復舉他人舉之者聽人舊制保舉縣令秩滿之後以六事論升降三事以下減一資厯四事減兩資厯六事皆備則升職一等既而御史張升卿言進士中下甲及第人及監官至眀威當入縣丞主簿而三事以下減一資厯注下令四事減資中令令皆七品也若復八品矣輕重相戻宜更定之遂定制自今四事以下如前降六事完者進士中下甲及第監官當入縣丞主簿人減三資厯注上令餘出身者亦同此任二十月以上雖未秩滿若以理去官六事之跡已經覆察論升如秩滿例五年以舉官或私其親或徇於請求或謬於鑒裁而妄舉數嵗之間以濫去者九十餘人乃罷辟舉縣令之制至哀宗正大元年乃立法命監察御史司農司官先訪察隨朝七品外路六品以上官清慎眀潔可為舉主者然後移文使舉所知仍以六事課殿最而升黜舉主故舉主既為之盡心而被舉者亦為之盡力是時雖迫危亡而縣令號為得人由作法有足取云功酬虧永之制凡諸提㸃院務官三十月遷一官周嵗為滿止取無虧月日用之大定四年定制一任内虧一分以上降五人二分以上降十人三分以上降十五人若有増羨則依此陞遷其陞降不盡之數於後任充折二十一年以舊制監當官並責決而不顧亷恥之人以謂已決即得赴調不以刑罰為畏擬自今若虧永及一酬以上依格追官殿一年外虧永不及酬者亦殿一年章宗大定二十九年罷年遷之法更定制比永課増及一酬遷一官兩酬遷兩官如虧課則削亦如之各兩官止又罷使司小都監與使副一體論増虧者及罷餘前陞降不盡之數後任充折之制泰和元年制犯選及虧永者右職漢人至宣武將軍從五品女直至廣威將軍正五品方注縣令又吏格曽犯選及虧永者女直至武義從六漢人及諸色人至武畧從六皆注諸司亦兩除一差至明威方注丞簿貞祐三年制曽虧永犯選者遷至宣武注諸司至懐逺從四下方注丞簿至安逺從四上注下令正大元年制曽犯選曽虧永者至廣威與諸司兩除一差至安逺注丞簿三任其至鎮國從三品下方注下令羣牧官三周嵗為滿所牧之畜以十為率駞増二頭馬増二疋牛亦如之羊増四口而大馬百死十五疋者及能徴前官所虧三分為率能盡徴及徴二分半以上為上等陞一品級駞増一馬牛増二羊増三大馬百死二十五徴前官所虧二分以上為中等約量升除駞不増馬牛増一羊増二大馬百死三十徴虧一分以上為下等依本等除餘畜皆依元數而大馬百死四十徴虧不及一分者降一等此眀昌四年制也五年制馬牛羊虧元數十之一騬馬百死四十徴虧不及一分者降一等決四十若駞馬牛羊虧元數一分馬百匹四十徴虧不得者杖八十降同前金史巻五十四
