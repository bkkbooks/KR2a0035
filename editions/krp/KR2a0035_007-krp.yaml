body:
  text: 金史卷七元中書右丞相總裁托克托等修本紀第七世宗中十二年正月庚午朔宋髙麗夏遣使來賀戊午詔有司凡陳言文字皆國政利害自今言有可行以其本封送秘書監當行者録副付所司丙申以水旱免中都西京南京河北河東山西陕西去年租稅二月壬寅上召諸王府長史諭之曰朕選汝等正欲勸導諸王使之為善如諸王所為有所未善當力陳之尚或不從則具某日行某事以奏若阿意不言朕惟汝罪丙午尚書省奏亷察到同知城陽軍事山和尚等清强官上曰此輩暗察明訪皆著政聲可第其政績各進官旌賞其速議升除庚午上如順州春水癸丑還都丙辰詔自今官長不法其僚佐不能紏正又不言上者竝坐之户部尚書髙徳基濫支朝官俸錢四十萬貫杖八十三月己巳朔萬春節宋髙麗夏遣使來賀乙亥詔尚書省贓汙之官已被亷問若仍舊職必復害民其遣使諸道即日罷之丁丑詔遣宿直将軍烏庫哩色埒冊封王哠為髙麗國王庚寅雨土癸巳以前西北路詔來討使伊喇道為參知政事回紇遣使來貢丁酉北京曹貴等謀反伏誅四月旱癸夘尚書右丞孟浩罷丁巳西北路納哈塔齊勤等謀反伏誅癸亥以久旱禱祠山川詔宰臣曰諸府少尹多闕員當選進士雖資叙未至而有政聲者擢用之以宿直将軍唐古阿古爾為横賜夏國使乙丑大名尹荆王文以贓罪奪王爵降授徳州防禦使回紇使使來貢丙寅尚書右丞相赫舍哩志寜薨丁夘宋髙麗遣使賀尊號凖布來貢五月癸酉上如百花川甲戌命賑山東東路和倫明安民飢丁丑次珠卜竒乆旱而雨戌寅觀稼禁扈從蹂踐民田禁百官及承應人不得服純黄油衣癸未諭宰臣曰朕每次舍凡秣馬之具皆假于民間多亡失不還其主此彈壓官不職可擇人代之所過即令詢問亡失民間物竝償其直乙酉詔給西北路人户牛六月甲寅如金蓮川九月丙子至自金蓮川辛巳以右副都㸃檢𤓰爾佳清臣等為賀宋生日使右衛将軍鈕祐禄噶達爾為夏國生日使丁亥太白晝見在日前鄜州李方等謀反伏誅十月髙麗國王王晧遣使謝封冊乙未臨奠故右丞相赫舍哩志寜喪志寜妻永安縣主進鎧甲弓矢鷹鶻重綵壬子詔皇太子及趙王永中上殿上顧謂宰臣曰京嘗圖逆今不除之恐為後患又曰天下大噐歸于有徳海陵失道朕乃得之但務修徳餘何足慮皇太子及永中皆曰誠如聖訓遂釋之丙辰以徳州防禦使文貲産賜其兄之子耀珠且諭其母文之罪汝等皆當連坐念宋王有大功于國故置不問仍以家産賜汝子十一月甲戌上謂宰臣曰宗室中有不任官事者若不加恩澤于親親之道有所未𢎞朕欲授以散官量予廪禄未知前代何如左丞石琚曰陶唐之親九族周家之内睦九族見于詩書皆帝王美事也丙子上以曹國公主家奴犯事宛平令劉彦弼杖之主乃折辱令既深責公主又以臺臣狥𫝑偷安畏忌不敢言奪俸一月以陕西統軍使璋為御史大夫以户部尚書曹望之為賀宋正旦使壬午同州民屈立等謀反伏誅戊子上屏侍臣與宰臣議事記注官亦退上曰史官記人君善惡朕之言動及與卿等所議皆當與知其于記録無或有隠可以朕意諭之十二月乙未朔以濟南尹劉蕚在定武軍貪墨不道命大理少師張九思鞫之丁酉詔遣使及䕶衛二十人分路選年二十以上四十以下有門地才行及善射者充護衛不得過百人冀州王瓊等謀反伏誅徳州防禦使文以謀反伏誅辛丑出宫女二十餘人己酉樞宻副使伊喇成罷辛亥禁審録官以宴飲廢公務詔金銀坑冶聽民開採毋得收稅辛丑獵于近郊以殿前都㸃檢圗克坦克寜為樞宻副使己未詔自今除名人子孫有在仕者竝取奏裁十三年正月己丑朔宋高麗夏遣使來賀癸酉尚書省奏南客車俊等因𣙜場貿易誤犯邉界罪當死上曰本非故意可免罪𤼵還毋令彼國知之恐復治其罪詔有司嚴禁州縣坊里為民害者閏月壬辰詔太子詹事曰東宫官屬尤當選用正人如行檢不修及不稱職者其以名聞辛酉太白晝見洛陽縣賊聚衆攻盧氏縣殺縣令李庭才亡入于宋三月癸巳朔萬春節宋髙麗夏遣使来賀乙夘上謂宰臣曰㑹寜乃國家興王之地自海陵遷都永安女直人寖忘舊風朕時甞見女直風俗迄今不忘今之燕飲音樂皆習漢風葢以備禮也非朕心所好東宫不知女直風俗第以朕故猶尚存之恐異時一變此風非長久之計甚欲以至㑹寜使子孫得見舊俗庶幾習效之太子詹事劉仲誨請増東宫牧人及張設上曰東宫諸司局人自有常數張設已具尚何増益太子生于富貴易入于侈惟當導以淳儉朕自即位以來服御器物徃徃仍舊卿以此意諭之四月己巳定出繼子所繼財産不及本家者以所繼與本家財産通數均分制以有司言特授洺州孝子劉政太子掌飲丞乙亥上御睿思殿命歌者歌女直詞顧謂皇太子及諸王曰朕思九朝所行之事未嘗暫忘故時聴此詞亦欲令汝輩知之汝輩自幼惟習漢人風俗不知女直純實之風至于文字語言或不通曉是忘本也汝輩當體朕意至于子孫亦當遵朕教誡也辛巳更定盜宗廟祭物法五月壬辰朔日有食之戊戌禁女直人毋得譯為漢姓壬寅真定尹孟浩薨甲辰尚書省奏鄧州民范三毆殺人當死而親老無侍上曰在醜不争謂之孝孝然後能養斯人以一朝之忿忘其身而有事親之心乎可論如法其親官與養濟六月樞宻使完顔思敬薨七月庚子復以㑹寜府為上京庚戌罷嵗課雉尾八月丁邜以判大興尹趙王永中為樞宻使詔賜諸明安穆昆亷能三等官賞己夘御史大夫璋罷丙戌以左副都㸃檢襄等為賀宋生日使丁亥秋臘九月辛卯朔以宿直将軍和索哩為夏國生日使辛亥還都大名府僧李智究等謀反伏誅十月乙丑嵗星晝見丙子以前南京留守唐古安禮為尚書右丞十一月以大興尹璋為賀宋正旦使引進使徳敦為高麗生日使上謂宰臣曰外路正五品職事多闕員何也太尉李石對曰資考少有及者上曰苟有賢能當不次用之壬子吏部尚書梁肅請禁奴婢服羅綺上曰近已禁其服明金行之以漸可也且教化之行當自貴近始朕宫中服御常自節約舊服明金者已減大半矣近民間風俗比正隆時聞稍淳儉卿等當更務從儉素使民知所效也十四年正月己丑朔宋高麗夏遣使來賀二月壬戌以大興尹璋使宋有罪杖百五十除名仍以所受禮物入官丙寅以刑部尚書梁肅等為宋詳問使庚午以太尉尚書令李石為太保致仕戊寅詔免去年被水旱百姓租稅三月戊子朔萬春節宋高麗夏遣使來賀甲午上謂大臣曰海陵純尙吏事當時宰執止以案牘為功卿等當思經濟之術不可狃于故常也又詔明安穆昆之民今後不許殺生祈祭若遇節辰及祭天日許得飲㑹自二月一日至八月終並禁絶飲燕亦不許赴㑹他所恐妨農功雖閒月亦不許痛飲犯者抵罪可徧諭之又命應衛士有不閑女直語者竝勒習學仍自後不得漢語辛丑太白嵗星晝見甲辰上更名雍詔中外丙辰太白嵗星晝見經天四月乙丑上諭宰臣曰聞愚民祈福多建佛寺雖已條禁尙未犯者宜申約束無令徒費財用戊辰有事于太廟以皇太子攝行事乙亥以勸農副使完顔佛寜為横賜髙麗使上御垂拱殿顧謂皇太子及親王曰人之行莫大于孝弟孝弟無不䝉天日之祐汝等宜盡孝于父母友于兄弟自古兄弟之際多因妻妾離間以至相違且妻者乃外屬耳可比兄弟之親乎若妻言是聼兄弟相違甚非理也汝等當以朕言常銘于心戊子以樞宻副使圖克坦克寜兼大興尹五月丙戌朔詳問使梁肅等還自宋甲午如金蓮川六月己未太白書見八月丁巳次珠爾蘇日中白龍見御帳東小港中須臾乘雲雷而去癸亥獵于瑪哩布己夘太白晝見九月丁亥還都乙未以兵部尚書完顔讓等為賀宋生日使宿直將軍崇肅為夏國生日使癸夘上退朝謂侍臣曰朕自在潛邸及踐阼以至于今於親屬舊知未嘗欺心有狥近御史臺奏樞密使永中嘗致書河南統軍使完顔仲託以賣馬朕知而不問朕之欺心此一事耳夙夜思之甚如有疾己酉宋遣使報聘十月乙夘朔詔圖晝功臣二十人衍慶宫聖武殿之左右廡十一月甲甲朔日有食之丙申御史中丞劉仲誨等為賀宋正旦使戊戌召尚食局使諭之曰大官之食皆民脂膏日者品味太多不可徧舉徒為虚費自今止進可口者數品而己戊申以儀鸞局使曹士元為髙麗國生日使十二月戊寅以平章政事完顔守道為右丞相樞密副使圖克坦克寜為平章政事十五年正月此下闕七月丙午展盤與其所部喀喇貝歡等内附九月戊子至自金蓮川辛夘髙麗西京留守趙位寵叛其君請以慈悲嶺以西鴨緑江以東四十餘城内附不納丙申幸新宫閏月己酉朔定應禁弓箭鎗刀路分品官家奴客旅等許帶弓箭制上謂左丞相良弼曰今之在官者須職位稱愜所望然後始加勉力其或稍不如意則止以度日為務是豈忠臣之道耶丁巳又謂良弼曰武靈時領省秉徳左丞相言皆有能名然為政不務逺圖止以苛刻為事言及克實等在㑹寜時一月之間杖而殺之者二十人罪皆不至於死於理可乎海陵為人如虎此輩尚欲以術數要之以至賣直取死得為能乎己未以歸徳尹完顔王祥等為賀宋生日使符寳即錫黙和尚為夏國生日使辛酉髙麗國王奏告趙位寵伏誅詔慰答之詔親王百官傔人所服紅紫改為黒紫甲戌詔年老之人母注縣令年老而任從政其佐亦擇壯者參用十月乙未冬獵丁未還都十一月乙夘上幸東宫初唐古部族節度使伊喇摩多之子殺其妻而逃上命捕之至是皇姑梁國公主請赦之上謂宰臣曰公主婦人不識典法罪尚可恕摩多請託至此豈可貸宥不許戊午以右宣徽使靖等為賀宋正旦使甲子太白晝見戊辰以宿直將軍阿克占富勒呼為髙麗生日使十六年正月戊申朔宋髙麗夏遣使來賀甲寅詔免去年被水旱路分租稅甲子詔宗屬未附玉牒者竝與編次丙寅上與親王宰執從官從容論古今興廢事曰經籍之興其來久矣垂教後世無不盡善今之學者既能誦之必須行之然知而不能行者多矣苟不能行誦之何益女直舊風最為純直雖不知書然其祭天地敬親戚尊耆老接賔客信朋友禮意欵曲皆出自然其善與古書所載無異汝輩當習學之舊風不可忘也戊辰宫中火庚午上按鷹髙橋見道側醉人墮驢而卧命左右扶而乗之送至其家辛未皇姑邀上至私第諸妃皆從宴飲甚歡公主每進酒上立飲之二月庚寅皇子瀋王妃圖克坦氏以姦伏誅己亥平章政事圖克坦克寜罷以女故三月丙午朔日有食之是日萬春節改用明日宋髙麗夏遣使來賀戊申雨豆於臨潢戊午上御廣仁殿皇太子親王皆侍膳上從容訓之曰大凡資用當務節省如其有餘可周親戚勿妄費也因舉所御服曰此服已三年未嘗更換尚爾完好汝等宜識之壬申復置烏都温部圖哩四月丙戌詔京府設學養士及定宗室宰相子程試等第戊子制商賈舟車不得用馬以東京留守崇尹為樞密副使壬寅如金蓮川五月戊申南京宫殿火甲寅太白晝見庚申遣使禱雨靜寜山神有頃而雨六月山東兩路蝗七月壬子夏津縣令伊喇算卓坐贓伏誅八月辛巳次霹靂濼九月乙巳至自金蓮川己酉諭左丞相赫舍哩良弼曰西邉自來不備儲蓄其令所在和糴以為緩急之備癸丑以殿前都㸃檢富察通等為賀宋生日使宿直將軍完顔托果斯為夏國生日使諭左丞相良弼曰海陵非理殺戮臣下甚可哀憫其博勒準等遺骸仰逐處訪求官為収葬辛酉以南京宫殿火留守轉運兩司官皆抵罪十月丙申詔諭宰執曰諸王小字未嘗以女直語命之今皆當更易卿等擇名以上十一月壬寅朔參知政事王蔚罷尚書省奏河北東路和倫明安所轄穆昆富珠哩色色以穆昆讓其兄子富色里上賢而從之仍令議加色色恩賞戊午以同知宣徽院事劉珫等為賀宋正旦使庚申以吏部尚書張汝弼為參知政事甲子以鈕祐禄罕努之子尚和為尚輦局直長羅索為武器直長初罕努被㫖招契丹達實後不知所終至是因展盤部長薩里罕托色等來詢之乃知其死節之詳故録其後遣兵部郎中伊喇子元為髙麗國生日使十二月壬申朔詔諸科人出身四十年方注縣令年歲太逺今後仕及三十二年别無負犯贓染追奪便與縣令丙子詔諸流移人老病者官與養濟上諭宰臣曰凡已經奏斷事有未當卿等勿謂己行不為奏聞改正朕以萬幾之繁豈無一失卿等但言之朕當更改必無吝也庚寅定𣙜場香茶罪賞法十七年正月壬寅朔宋髙麗夏遣使來賀髙麗并表謝不納趙位寵丙午有司奏髙麗所進玉帶乃石似玉者上曰小國無能辨識者誤以為玉耳且人不易物惟徳其物若復却之豈禮體耶戊申詔於衍慶宫聖武殿西建世祖神御殿東建太宗睿宗神御殿詔西北路招討司契丹民户其嘗叛亂者已行措置其不與叛亂及放良奴隸可徙烏庫哩實壘部令及春耕作尚書省奏烏都温部齊特庫爾阿勒瑪斯請入獻許之庚戌詔諸大臣家應請功臣號者既不許其子孫自陳吏部考功郎其詳考其勞績當賜號者即以聞壬子上謂宰臣曰宗室中年髙者往往未有官稱其先皆有功於國朕欲稍加以官使有名位可稱如何對曰親親報功先王之令則丁巳詔朝官嫁娶給假三日不須申告壬戌詔宰臣海陵時大臣無辜被戮家屬籍没者竝釋為良遼豫王宋天水郡王被害子孫各葬於廣寜河南舊塋其後復詔天水郡王親屬於都北安葬外咸平所寄骨殖官為葬於本處遼豫王親屬未入本塋者亦遷祔之三月辛丑朔宋髙麗夏遣使來賀辛亥詔免河北山東陕西河東西京遼東等十路去年被旱蝗租稅賑東京博索哈斯罕三路乙丑尚書省奏三路之粟不能周給上曰朕嘗語卿等遇豐年廣糴者以備凶歉卿等皆言天下倉廪盈溢今欲賑濟乃云不給自古帝王皆以蓄積為國家長計朕之積粟豈欲獨用之耶今既不給可於鄰道取之以濟自今預備當以為常四月甲戌制世襲明安穆昆若出仕者雖年未及六十欲令子孫襲者聽戊寅諭宰臣曰郡縣之官雖以罪解一二歳後亦須再用明安穆昆皆太祖創業之際於國勤勞有功之人其世襲官不宜以小罪奪免戊子以滕王府長史圖克坦烏哲為横賜髙麗使五月尚書省奏定皇家袒免以上親燕饗班次竝從唐制癸夘幸姚村淀閱七品以下官及宗室子諸局承應人射栁賞有差六月己夘謂宰臣曰朕年老矣恐因一時喜怒處置有所不當卿等即當執奏母為面從成朕之失乙未以英王爽之子色埓為忠順軍節度副使爽入謝上曰朕以卿疾故特任卿子所冀卿因喜而愈也欲即加峻授恐色埓年幼未閑政事汝當訓之使有善可觀更當升擢七月壬子尚書省奏歲以羊三萬賜西北路戍兵上聞如何運致宰臣不能對上曰朕雖退朝留心政務不遑安寜卿等勿謂細事非帝王所宜問以卿等於國家之事未嘗用心故問之耳是月大雨河決八月己巳觀稼于近郊壬申以監察御史體察東北路官吏輙受訟牒為不稱職笞之五十庚辰上謂宰臣曰今之在官者同僚所見事雖當理亦以為非意謂從之則恐人謂政非己出如此者多朕甚惡之今觀大理寺所斷雖制有正條理不能行者别具情見朕惟取其所長夫為人之理他人之善者從之則可謂善矣壬午上謂宰臣曰今在下僚豈無人材但在上者不為汲引惡其材勝已故耳丙戌上謂御史中丞赫舍哩邈曰臺臣紏察吏治之能否務去其擾民且冀其得賢也今所至輒受訟牒聽其妄告使為政者如何則可九月丁酉朔日有食之辛丑封子永徳為薛王以右副都㸃檢完顔實訥埒等為賀宋生日使癸夘以兵部即中舒穆嚕呼圖為夏國生日使戊申秋獵庚戌嵗星熒惑太白聚於尾甲子還都十月己巳夏國進百頭帳詔却之境上癸酉有司奏衍慶宫所畫功臣二十人惟五人有諡今考檢餘十五人功狀擬定諡號以進詔可詔以羊十萬付烏庫哩實疊部畜牧其滋息以子貧民丁丑制諸明安父任别職子須年二十五以上方許承襲辛巳上謂宰臣曰今在位不聞薦賢何也昔狄仁傑起自下僚力扶唐祚使既危而安延數百年之永仁傑雖賢非婁師徳何以自薦乎癸未更䕶送罪人逃亡制上謂宰臣曰近觀上封章者殊無大利害且古之諫者既忠於國亦以求名今之諫者為利而已如户部尚書曹望之濟南尹梁肅皆上書言事葢覬覦執政耳其於國政竟何所補達官如此况餘人乎昔海陵南伐太醫使祁宰極諌至戮於市此本朝以來一人而已丁亥上命宰臣曰監察御史田忠儒嘗上書言事當升擢以勵其餘十一月戊戌以南京留守圖克坦克寜為平章政事庚戌上謂宰臣曰朕常恐重斂以困吾民自今諸路差科之煩細者亦具以聞有司奏夏國進御帳使因邉臣懇求進入乃許之以尚書左丞石琚為平章政事丙辰以延安尹完顔富拉塔等為賀宋正旦使十二月戊辰以渤海舊俗男女婚娶多不以禮必先攘竊以奔詔禁絶之犯者以姦論以宿直將軍布薩懐忠為髙麗生日使己巳太白晝見壬申以尚書右丞唐古安禮為左丞殿前都㸃檢富察道為右丞上謂宰臣曰朕今年已五十有五若年踰六十雖欲有為而莫之能矣宜及朕之康强其女直人明安穆昆及國家政事之未完與夫法令之未一者宜皆修舉之凡所施行朕不為怠十八年正月丙申朔宋髙麗夏遣使來賀壬寅定殺異居周親奴婢同居卑幼輒殺奴婢及妻無罪而輒毆殺者罪庚戌修起居注伊喇傑上書言每屏人議事雖史官亦不與聞無由紀録上以問平章政事石琚左丞唐古安禮對曰古者天子置史官于左右言動必書所以儆戒人君庶幾有所畏也庚申免中都河北河東山東河南陕西等路前年被災租稅壬戌如春水二月丙寅朔次管荘丙子次華港己丑還宫三月乙未朔萬春節宋高麗夏遣使来賀乙巳命戍邉女直人遇祭祀婚嫁節辰許自造酒丁未上謂宰執曰縣令之職最為親民當得賢材用之邇來犯法者衆殊不聞有能者比在春水見石城玉田兩縣令皆年老苟禄而已畿甸尚爾逺縣可知平章政事石琚對曰良鄉令焦旭慶都令李伯達皆能吏可任上曰審如鄉言可推用之己酉禁民間無得剏興寺觀獻州人殷小二等謀反伏誅四月己巳上謂宰臣曰朕巡幸所至必令體訪官吏臧否向玉田知主薄舒穆嚕杳能吏也可授本縣令己丑以太子左贊善阿布哈徳甫為横賜高麗使五月丙午上如金蓮川六月庚午尚書左丞相赫舍哩良弼薨閏月辛丑命賑西南西北兩招討司民及烏庫哩實壘部轉户饑七月丙子上謂宰臣曰職官始犯贓罪客有錯誤至于再犯是無改過之心自今再犯不以贓數多寡並除名八月乙巳至自金蓮川丙辰以尚書右丞相完顔守道為左丞相平章政事石琚為右丞相九月辛未以大理卿張九思等為賀宋生日使侍御史完顔富勒呼為夏國生日使癸酉以尚書左丞唐古安禮為平章政事乙亥以右丞富察通為左丞參知政事伊喇道為右丞刑部尚書鈕祜禄噶逹爾為參知政事十月庚寅朔陕州防禦使舒穆嚕錦嘉努以罪除名甲午御史中丞劉仲晦侍御史李瑜坐失糾察大長公主事削一階十一月庚申朔尚書省奏擬同知永寜軍節度使事額爾克為刺史上曰額爾克年㓜未練事授佐貳官可也平章政事唐古安禮曰臣等以額爾克宗室故擬是職上曰郡守係千里休戚安可不擇人而私其親邪若以親親恩賜與雖厚無害于政使之治郡而非其才一境何賴焉壬申以静難軍節度使烏雅扎拉等為賀宋正旦使丙子尚書省察崇信縣令石安節買車材于部民三日不償其直當削官一階解職上因言凡在官者但當取其貪汚與清白之尤者數人黜陟之則人自知懲勸矣夫朝廷之政太寛則人不知懼太猛則小玷亦将不免于罪惟當用中典耳戊寅上責宰臣曰近問趙承元何故再任卿等言曹王嘗遣人言其才能幹敏故再任之官爵擬注雖由卿軰予奪之權當出于朕曹王之言尚從之假皇太子有所諭則其從可知矣此事因卿言始知其不知者知復幾何且卿等公受請屬可乎葢承元前為曹王府文學與王邸婢姦杖百五十除名而復用也丙戌以吏部尚書烏庫哩元忠為御史大夫以東上閣門使左光慶為高麗生日使十二月庚戌封孫烏達布温國公瑪達格金源郡王承慶道國公壬子羣臣奉上大金受命萬世之寳十九年正月庚申朔宋高麗夏遣使來賀丁夘如春水二月己酉還宫乙夘免去年被水旱民田租稅三月己未朔萬春節宋高麗夏遣使來賀乙丑尚書省奏虧課院務官顔葵等六十八人各合削官一階上曰以承廕人主𣙜沽此遼法也法弊則當更張唐宋法有可行者則行之己巳上與宰臣論史事且曰朕觀前史多溢美大抵史書載事貴實不必浮辭諂諛也辛未上謂宰臣曰姦邪之臣欲有規求徃徃私其黨與不肯明言託以他事陽不與而陰為之力朕觀古之姦人當國家建儲之時恐其聰明不利于已徃徃風以陰事破壊其議惟擇昏懦者立之冀他日可弄權為功利也如晉武欲立其弟而姦臣沮之竟立惠帝以致喪亂此明驗也丁丑上謂宰臣曰朕觀前代人臣将諌于朝與父母妻子訣示以必死同列目覩其死亦不顧身又為之諌此盡忠于國者人所難能也己夘制糾弹之官知有犯法而不舉者減犯人罪一等科之闗親者許回避上謂宰臣曰人多奉釋老意欲徼福朕蚤年亦頗惑之旋悟其非且上天立君使之治民若盤樂怠忽欲以僥倖祈福難矣果能愛養下民上當天心福必報之四月己丑朔詔賑西南路招討司所部民己酉以升祔閔宗詔中外丁巳嵗星晝見五月戊寅幸太寕宫六月戊子朔詔更定制條七月辛未有司奏擬趙王子實古納人從上不從謂宰相曰兒軰尚㓜若奉承太過使侈心滋大卒難節抑此不可長諸兒每入侍當其語笑娛樂之際朕必淵默涖之以嚴庶其知朕教戒之意使常畏懼而寡過也癸酉宻州民許通等謀反伏誅丙子太白晝見庚辰至自太寜宫八月壬辰尚書右丞相石琚致仕戊戌以宋大觀錢當五用丙午濟南民劉溪忠謀反伏誅九月戊午以左宣徽使富察鼎壽等為賀宋生日使太子左衛率府率費摩呼喇為夏國生日使癸亥秋獵癸未還都十月辛夘西南路招討使扎克丹以贓伏誅辛亥制知情服内成親者雖自首仍依律坐之十一月壬戌改葬昭徳皇后大赦以御史中丞伊喇慥等為賀宋正旦使戊辰以西上閤門使盧拱為高麗生日使壬申上如河間冬獵癸未至自河間二十年正月甲寅朔宋高麗夏遣使來賀戊午定試令史格壬戌命嵗以錢五千貫造隨朝百官節酒及冰蜀藥炭視品秩給之己巳如春水丙子幸石城縣行宫丁丑以玉田縣行宫之地偏林為御林大定濼為長春淀二月丁未還都三月癸丑朔萬春節宋高麗夏遣使來賀己未詔有犯罪被問官雖遇災不得復職乙丑以新定明安穆昆詔免中都西京河北山東河東陜西路去年租稅辛巳以平章政事圖克坦克寜為尚書右丞相御史大夫烏庫哩元忠為平章政事四月丁亥定冐廕罪賞己亥制宗室及外戚并一品命婦衣服聼用明金以西上閤門使郭喜國為横賜高麗使太寜宫火乙巳上謂宰相曰女直官多謂朕食用大儉朕謂不然夫一食多費豈為美事况朕年髙不欲屠宰物命貴為天子能自節約亦不惡也朕服御或舊常使澣濯至于破碎方始更易向時帳幕常用塗金為飾今則不爾但令足用何必事紛華也庚戌如金蓮川五月丙寅京師地震生黒白毛七月旱八月壬午秋獵九月壬戌至自金蓮川以太府監李佾等為賀宋生日使少府少監薩布為夏國生日使丙子布沙堪羣牧羅和謀叛伏誅十月庚辰朔更定銓注縣令丞簿格詔西北路招討司每進馬駞鷹鶻等輒率歛部内自今竝罷之壬午上謂宰臣曰察問細微非人君之體朕亦知之然以卿等殊不用心故時或察問如山後之地皆為親王公主權𫝑之家所占轉租于民皆由卿等之不察卿等當盡心勤事母令朕之煩勞也詔徙約羅河伊瑪河兩明安于大名東平等路安置戊戌上謂宰臣曰凡人在下位欲冀升進勉為公亷賢不肖何以知之及其通顯觀其施為方見本心如招討扎克丹初任定州同知繼為都司未嘗少有私狥所至有清名及為招討不固守人心險于山川誠難知也壬寅上謂宰臣曰近覧資治通鑑編次累代廢興甚有鍳戒司馬光用心如此古之良史無以加也校書即毛麾朕屢問以事善應對真該博老儒可除太常職事以備討論甲辰以殿前都點檢襄為御史大夫十一月丁巳尚書右丞伊喇道罷乙丑以真定尹圖克坦守素等為賀宋正旦使癸酉以御史太夫襄為尚書右丞乙亥上諭宰臣曰郡守選人資考雖未及亷能者則升用之以勵其餘以太常少卿任倜為高麗生日使十二月辛巳上謂宰臣曰岐國用人但一言合意便升用之一言之失便責罰之凡人言辭一得一失賢者不免自右用人咸試以事若止以奏對之間安能知人賢否朕之取人衆所與者用之不以獨見為是也己亥河決衛州辛丑獵于近郊癸夘特授襲封衍聖公孔總兖州曲阜令封爵如故金史卷七
