body:
  text: 金史卷一百三元中書右丞相總裁托克托等修列傳第四十一完顏仲元完顔阿林完顔霆烏庫哩長壽完顔佐舒穆嚕仲溫本名羅哈烏庫哩禮本名禄錦富察阿里鄂屯襄本名添壽完顏富拉塔𤓰爾佳錫爾格珠嘉臣嘉赫舍利和勒端完顔伊爾必斯完顔特爾格納喇呼喇勒完顔仲元本姓郭氏中都人大安中李雄募兵仲元與完顔阿林俱應募數有功貞祐三年與阿林俱累功至節度仲元為永定軍節度使賜姓完顔氏仲元在當時兵最強號花㡌軍人呼為郭大相公以與阿林相别頃之兼本路宣撫使八月遥授知河間府事數月改知濟南府事權山東東路宣撫副使貞祐四年山東乏糧仲元軍三萬欲於黄河之側或陜右分屯上書乞補京官且言恢復河朔之䇿當詣闕面陳詔曰卿兄弟鳩集義旅所在立功忠義之誠皎然可見朕以參政侯摯與卿素厚命於彼中行省應悉朕心卿求入見其意固嘉東平方危正頼卿等相為聲援俟兵勢稍緩即徙軍附河屯駐此時卿來葢未晩也尚思戮力朕不汝忘未幾改河北宣撫副使仲元部將李霆等積功至刺史提控仲元奏賜金牌霆等皆名將功名與仲元相埒仲元屢有功以本職為從以招撫使計約蘇爾坦等軍圖恢復詔以仲元軍猥多差為三等上等備征伐中下給戍守懦弱者皆罷去紅襖賊千餘人據漣水縣仲元遣提控羅索率兵撃破之斬首數百敗祝春擒郭偉餘衆奔潰遂復漣水縣仲元兼單州經畧使羅索遷兩階陞職一等未幾仲元遥授知歸徳府事是歲十月徙軍盧氏改商州經略使權元帥右都監詔曰商虢潼闗實相連屬卿思萬全之計未幾潼闗失守仲元軍趨商虢復至嵩汝皆弗及仲元上書曰去年六月臣嘗請於朝廷乞選名將督諸軍臣得摧鋒身先士卒糧儲不繼竟不果行今將坐甲待敵則師老財殫日就困敝其大槩欲伐西夏以張兵勢又曰陜西一路最為重地潼闗禁坑及商州諸邑俱當預備向者中都居庸最為要害乃由小嶺紫荆遶出我軍腹背受兵卒不能守近日由禁坑出遂失潼關可選精兵分地戍之其後乃置秦藍守禦及用兵西夏矣興定元年復為單州經略使敗宋人二千于龜山復敗步騎千餘于旴貽敗紅襖于白里港獲老幼萬餘人皆縱遣之宋人圍海州仲元軍高橋令提控完顔阿林領騎遶出其後夾撃之宋兵解去賜金帶優詔奬諭紅襖賊䧟曹馬城剽掠徐單之間提控高琬等分兵擊之俘生口二千三年仲元奏州城既固積糧二十萬石集鄉義軍萬餘人竝閖訓練足以守禦乞以所部渡河詔屯宿州與右都監赫舍哩徳同行帥府事仲元有足疾滿百日詔曰卿處置機務撫存將士出兵使李辛可也四年兼保静軍節度使尋為勸農使五年為鎮南節度使元光元年知鳯翔府事鳳翔被圍左監軍實嘉喀齊喀來濟軍仲元讓喀齊喀總兵事喀齊喀曰公素得衆心不必見讓仲元請身先士卒諭諸將士曰凡有竒功者即承制超擢及危急乃輒注四品以下延扎哈瑪爾力戰功最輒授通遠軍節度使圍解奏請擅除拜之罪宣宗嘉其功皆許之遷元帥右監軍授河北東路推必喇明安賜金五十兩重幣十五端通犀帶優詔褒諭正大間為兵部尚書皇太后衞尉卒仲元為將沉毅有謀南渡後最稱名將云完顔阿林本姓郭氏以功勞賜姓完顔大安中李雄募兵阿林與完顔仲元等俱應募數有功宣宗即位遷通州防禦使宣宗遷汴阿林改同知河間府事兼清州防禦使將所部兵駐清滄控扼山東遷横海軍節度使賜以國姓阿林與山東路宣撫副使延扎天澤不相能詔阿林當與天澤共濟國事無執偏見妄分彼此尋改泰定軍節度使山東西路宣撫使是時仲元亦積功勞知濟南府賜姓完顔與阿林俱加從宜招撫使詔書奬諭且令計約涿州刺史蘇爾坦等軍恢復中都於是仲元阿林兵猥多詔以三等差第之上等備征伐中下戍守懦弱者罷去量給地以贍其家阿林所部黄鶴䄂軍駐魚臺者桀驁不法掠平民劫商旅道路不通有司乞徙于滕州詔阿林就處置之頃之破紅襖賊郝定于泗水縣柘溝村生擒郝定送京師斬之近制賜本朝姓者凡以千人敗敵三千者賜及緦麻以上敗二千人以上者賜及大功以上敗千人以上者賜止其家阿林既賜姓以兄守楫及從父兄弟為請宰臣奏阿林功止賜一家宣宗特詔許之至是仲元上奏曰臣頃在軍旅纔立微功遽䝉天恩賜之國姓非臣殺身所能仰報族兄徐州機密副使僧喜前汾州酒同監三喜前解州鹽管勾添章守興平縣監酒添福猶姓郭氏念臣與僧喜等昔同一家今為兩族完顔阿林與臣同功皇恩所加併及本族僧喜等四人乞依此例不許改輝州經略使阿林有衆萬五千詔分五千𨽻東平行省其衆泣訴云我曹以國家多難奮義相從捐田宅離親戚轉戰至此誓同立功同還鄉里今將分配他軍心實艱苦乞以全軍分駐懷衞輝州之間捍蔽大河惟受阿林節制阿林亦不欲分之因以為請宰臣奏若遂聽之非唯東平失備他將倣效皆不可使矣宣宗以為然加遥授知河南府事應援陜西阿林將兵八千西赴至潼關聞京兆已被圍游騎至華州陜西行院欲令阿林駐軍商虢拒東向之路阿林上奏臣本援陜西遇難而止豈人臣之節夫自古用兵步騎相參乃可以得志今乃各有所屬臨難不救互相彼此今臣所統皆步卒願賜馬軍千人則京兆之圍不足解矣宣宗謂皇太子曰阿林赴難不回固善矣而軍勢單弱且駐内地以觀事變併以虢州兵五千付之使乗隙而進卿以此意諭之也興定元年遷元帥右都監出秦州伐宋宋統制吳筠守皁角角又作郊堡城三重據山之巔阿林分兵絶其汲路克其外城再克其次城宋兵縱火而出阿林以騎兵邀之遣步卒襲其後宋兵敗生獲呉筠及將校二百人馬數百匹糧萬石及兵甲衣襖復敗宋兵于裴家莊六谷中斬五百級墜澗死者甚衆又敗之于寒山巔龍門闗大石渡得粟二千餘石復敗之于稍子巔斬首二千餘級生擒百人是時三月宿麥方滋阿林留兵守之已而宋兵大至金兵敗阿林戰沒贈金紫光祿大夫西京留守完顔霆本姓李氏中都寶坻人粗知書善騎射輕財好施得鄉曲之譽貞祐初縣人共推霆為四鄉部頭霆招集離散糾合義兵衆頼以安招撫司奏其事遷兩官霆與弟雲率衆數千廵邏固安永清間遥授寶坻縣丞充義軍都統劉璋説霆使出降霆縳送經略司遷三階攝寶坻令陞都提控遥授同知通州軍州事中都食盡霆遣軍州分䕶清河路召募賈船通餉道遥授同知清州防禦事從河北路宣撫使完顔仲元保清滄遥授通州刺史河北東路行軍提控佩金牌舊制宣撫副使乃佩金牌仲元奏臣軍三萬管軍官三人皆至五品乞各賜金牌廷議霆軰忠勇絶人遂與之改大名路提控復取玉田三河香河三縣徙屯濱棣淄留副將孫江守滄州江以滄州降于王檝而江將兵圍觀州霆乃詐作書與孫江約同取滄州者王檝得其書果疑孫江與霆有謀召江還殺之霆乃定觀州而還進官三階充濱棣行軍都提控未幾遥授同知益都府事知宣差都提控遷棣州防禦使賜姓完顔氏屯海州俄權單州經略使事充宣差總領都提控興定元年泰安滕兗土宼蠭起東平行省侯摯遣霆率兵討之降石花五夏全餘黨二萬人老幼五萬口充權海州經略副使紅襖賊于忙兒宼海州霆擊走之二年宋高太尉兵二萬駐朐山霆軍乏糧采野菜麥苖雜食之宋兵栅朐山下隔湖港霆作港中暗橋遣萬户胡仲珪副統劉贇率死士由暗橋登山霆率兵四千人趨山下約以昬時舉火為期上下夾撃宋兵大敗墜澗溺水死者不可勝計斬高太尉彭元帥于陣餘衆潰去遷安化軍節度使經略副使如故以其子為符寶典書逾月宋兵復至霆逆戰駐兵城外夜半宋人乘虛踰城而入經略使阿布哈努色爾率兵㧖戰都統温特赫伍爾副統富察永成富察珠嚕身先士卒殺二百餘人城頼以完詔伍爾等各遷兩階四年改集慶軍節度使兼同知歸徳府事五年改定國軍節度使兼同知京兆府事擢其子為䕶衞元光元年陜西行省博索奏京兆南山密邇宋境官民遷避其間者無慮百萬人可遣官鎮撫庶幾不生他變宣宗以為然十月霆以本官為安撫使守同知歸徳府惟宏大司農丞郭皓為副使分䕶百姓之遷南山者元光二年卒烏庫哩長壽臨洮府第五將突門族人也本姓包氏襲父永本族都管泰和伐宋充緋翮翅軍千户取􅔋川寨及祐州宕昌新城子以功進官二階貞祐初夏人攻㑹州統軍使署征行萬户陞副統與夏人戰於窄土峽先登䧟陣賞銀五十兩戰東闗堡以功署都統兼充安定定西保川西寧軍馬都彈壓詔録前後功遥授同知隴州防禦事世襲本族都巡檢二年賜今姓攻蘭州程陳僧為先鋒都統夏人圍臨洮扼渭堡内外不通統軍司募人偵候臨洮消息長壽應募馘二人擒一人問得臨洮及夏兵事勢以勞遷宣武將軍遥授通逺軍節度副使招降諸番族及熟羊寨秦州逋亡者復遷懷逺大將軍陞提控興定元年夏人大入隴西長壽拒戰遷平凉府治中兼節度副使充宣差鞏州規措官頃之遥授同知鳳翔府事兼同知通逺軍節度事提控如故興定二年遷同知臨洮府事與提控洮州刺史納喇吉遜分兵伐宋長壽由鹽川鎮進兵宋人守戍者走保馬頭山合諸部族兵來拒長壽撃敗之復破其援兵四千於荔川寨即趨宕昌縣破宋兵二千于八斜谷㧞宕昌縣進攻西和洲先敗其州兵明日木波兵三千與宋兵合依川為陣長壽奮擊宋兵入保城堅壁不復出長壽乃還凡斬馘八千獲馬二百餘牛羊三萬器械軍實甚多納喇吉遜出洮州鐡城堡屢敗宋人完軍而還詔賞鳳翔秦鞏伐宋將士長壽遥授隴安軍節度使同知通逺軍提控如故頃之長壽陞總領都提控改通逺軍節度使夏人攻定西是時弟世顯已降夏人夏人執世顯至定西城下謂長壽曰若不速降即殺汝弟長壽不顧奮戰夏兵退加榮禄大夫賜金二十五兩重幣三端世顯既降二子公政重壽當縁坐宣宗嘉長壽守定西功釋公政兄弟有司廪給之詔長壽曰汝久在戎行盡忠國事世顯之降必不得已汝永念國恩益思自効未幾夏人復攻㑹州行元帥府事實嘉喀齊喀發兵救未至夏人移兵臨洮長壽伏兵五千于定西險要間敗夏兵三萬騎殺千餘人獲馬數百夏人已破西寧乃犯定西長壽擊却之斬首三百級既而三萬騎復至攻城甚急長壽乘城拒戰矢石如雨夏兵死者數千被創者衆乃解去是歲卒完顔佐本姓梁氏初為武清縣巡檢完顔耀珠本姓李氏為栁口鎮巡檢久之以佐為都統耀珠副之戍直沽寨貞祐二年乣軍遣張暉等三人來招佐佐執之翌日劉永昌率衆二十人持文書來署其年曰天賜佐擲之麾衆執永昌及暉等併斬之宣宗嘉其功遷佐奉國上將軍遥授徳州防禦使耀珠鎮國上將軍遥授同知河間府事皆賜姓完顔氏詔曰自今有忠義如是者竝一體遷授贊曰古者天子胙土命氏漢以來乃有賜姓宣宗假以賞一時之功郭仲元郭阿林以功皆賜國姓鈕祜禄資禄烏庫哩長壽皆封疆之臣而賜以他姓貞祐以後賜姓有格夫以名使人用之貴則貴用之賤則賤使人計功而得國姓則以其貴者反賤矣完顔霆完顔佐皆賜國姓者併附于此舒穆嚕仲溫本名老哈懿州呼圖克明安人充䕶衞十人長太子僕正除同知武寧軍節度使事宿直將軍器物局使坐前在武寧造馬鞍虧直章宗原之改左衞將軍遷右副㸃檢坐征契丹逗遛除蔡州防禦使復召為左副㸃檢遷知臨洮府事泰和伐宋青伊克内附進二級賜銀二百五十兩重幣十端詔曰青伊克之來乃汝管内與有勞焉比與青伊克相合其間諸事量宜而行頃之諸道進兵仲温以隴右步騎五千出鹽川八年罷兵改知河中府崇慶初遷陜西統軍使貞祐二年宋人攻秦州仲温率兵敗之尋充本路安撫使改鎮南軍節度使致仕興定三年卒烏庫哩禮本名魯爾錦益都明安人充習騎累擢近侍局直長轉本局副使左衞副將軍坐受沁南軍節度使兗王永成名馬玉帶杖一百削官解職起為布沙堪羣牧副使改武庫署令宿直將軍復為左衞副將軍順州刺史累遷武寧軍節度使和伐宋為山東路兵馬都統副使兼副統軍安化軍節度八年宋人請盟罷兵馬都統官仍以節度兼副統軍大安三年改知歸徳府兼河南副統軍厯知河南府至寧初改知太原府事貞祐二年兼河東北路安撫使三年充本路宣撫使頃之兼左副元帥四年太原被圍未幾圍解進官二階興定三年卒富察阿里興州路人以廕補官充䕶衞十人長武器署令轉宿直將軍遷右衞副將軍宋兵犯分道鋪馳驛赴邊伺其入以伏兵掩之改提㸃器物局泰和伐宋從右副元帥匡為副統攻宜城縣取之八年以功遷武衞軍副都指揮使大安元年同知南京留守事徙壽州防禦使遷興平軍節度使崇慶初遷元帥右都監明年轉左都監時都城被圍道路梗塞阿里由太原至真定率師赴援抵中山不克進貞祐二年移駐大名徴河南鎮防軍圖再舉衆既憚于行而阿里遇之有厚薄軍變遇害衆因逃散宣宗詔元帥左都監完顔弼安集其軍赦首惡以下河南統軍司更加撫諭鄂屯襄本名添壽上京路人大定十年襲明安丞相襄舉通練邊事授崇義軍節度副使改烏庫哩乣詳衮召為都水少監石州刺史未幾為平南盪江將軍以功陞壽州防禦使遷河南路副統軍兼同知歸徳府事昌武軍節度使仍兼副統軍崇慶改元為元帥左都監救西京至墨谷口一軍盡殪襄僅以身免坐是除名明年授上京兵馬使宣宗即位擢遼東路宣撫副使未幾改率賓路節度使兼同知上京留守事二年二月為元帥右都監行元帥府事于北京五月改留守兼前職俄遷宣撫使兼留守十一月詔諭襄及遼東路宣撫使布希萬努宣差富察烏錦曰上京遼東國家重地以卿等累效忠勤故委腹心意其恊力盡公以徇國家之急及詳來奏乃大不然朕將何頼自今毎事同心併力備禦機㑹一失悔之何及且師克在和善鈞從衆尚懲前過以圖後功三年正月襄為北京宣差提控完顔錫林所害未幾錫林復為其下所殺詔曲赦北京完顔富拉塔西南路按春必爾罕明安人充䕶衞除泰定軍節度副使以憂去官起復唐古部族節度副使徙安國軍伊勒敦乣詳衮累官原州刺史坐買部内馬虧直奪官一階降北京兵馬都指揮使寧逺軍刺史厯同知臨洮府西京留守事崇慶元年遷鎮武軍節度備禦有功遷一官初置東西面經略司就充西面經略使上言管内太和嶺諸隘屯兵控制邊要行元帥府輒分臣兵萬二千戍真定餘衆不足守禦近復簡精鋭二千七百人以往今見兵不滿萬老羸者十七八臣死固不足惜顧國家之事不可不慮新設經略移文西京太原河東取軍馬大數竝稱非臣所統詔真定元帥府還其精鋭二千七百人西京太原嵐州有警急約為應援州郡皆不欲屬經略司遂罷經略官入為簽樞密院事改左副㸃檢四年遷兵部尚書興定元年致仕四年卒𤓰爾佳錫爾格上京路明安人明昌五年進士泰州防禦判官補尚書省令史厯臨潢博索路都總管判官累除刑部主事改薊州副提控駐軍大名俄遷翰林待制為宿州提控與山東宣撫完顔弼攻大沬堌賊衆千餘逆戰錫爾格以騎兵擊之盡殪提控黙哷入自北門擒劉二祖以功遷武衞軍副都指揮使坐前在宿州掠良人為生口當死特詔決杖八十徙洺州防禦使山東路副統軍坐不時進兵往宿遷取妻子解職起為東平行軍提控興定元年破宋兵于宿州以功遥授安化軍節度使移定海軍卒珠嘉臣嘉北京路明安人襲父穆昆泰和伐宋𨽻陜西完顔綱麾下厯通州海州同知軍州事貞祐二年除武器署丞救集寧有功遷河南統軍判官拱衞直副都指揮使河南治中遥領綏州刺史兼延安治中就遷同知府事改同知河間府事興定元年行樞密院于壽州由壽泗渡淮伐宋二月破宋兵三千於漸湖灘斬三百級有詔蹂踐宋境上毋深入臣嘉駐霍丘楂岡村縱輕騎鈔掠焚毁積聚獲宋諜者張聰知宋兵二千屯高栁橋老幼甚衆其寨兩城環之以水臣嘉遣張聰持牒招之不從先令水軍徑渡攻之軍士牛青操戈刺門卒皆披靡散去遂登陴大軍繼之夷其寨而還遇宋兵數千於梅景村臣嘉伏兵林間以步卒誘致之伏發宋兵潰追奔十餘里生擒其將阮世安等五人獲器仗甚衆二年賞征南功陞職一等遷元帥右都監充陜西行省參議官四年兼金安軍節度使五年改知延安府事轉左都監駐兵京兆元光元年卒赫舍利和勒端西南路和掄松科明安人襲兄尼楚赫穆昆太和伐宋充行軍萬戸破宋兵二千於蔡州加宣武將軍自壽州渡淮敗宋步騎一萬五千于鷂子嶺克安豐軍軍還除同知懷逺軍節度事權穆騰乣詳衮大安三年西京行省選充哈濟萬户遥授同知清州防禦事改興平軍節度副使遥授顯徳軍節度副使徙東路宣撫司都統敗伊喇瑠格萬五千衆于御河寨奪車數千兩降萬餘人加驃騎衞上將軍遥授同知順天軍節度事貞祐二年為宣差副提控同知博索路兵馬都總管行府事貞祐三年布希萬努取咸平東京瀋澄諸州及明安穆昆人亦多從之三月萬努步騎九千侵博索近境和勒端遣都統温特赫巴哈納擊却之四月復掠上古城遣都統烏雅博恰拒戰萬努遣五千人攻望雲驛都統鄂屯馬和尚擊之都統𤓰爾佳哈逹破其衆數千于三叉里五月都統温特赫福壽攻萬努衆于大寧鎮㧞其壘其衆殱焉九月萬努衆九千人出宜風及易池和勒端率兵與戰衆潰去因招阿濟根托摩爾歡賓格綽台達罕延格布呼和卓安春伯特拉林十一明安復來附擇其丁男補軍攻城邑之未下者貞祐四年和勒端遣王汝弼由海道奏事宣宗嘉其功和勒端遷遼海軍節度使同知行府事宣差提控博索路温綽海世襲明安權同知府事温特赫格綳額遷顯徳軍節度使兼博索府治中權判官前脩起居注費摩諳達遷兩階陞二等王汝弼遷四階陞四等餘將士有功者詔遼東宣撫承制遷賞是歲改邳州刺史充徐州界都提控紅襖賊數萬攻邳州和勒端破之于黄山賊復來和勒端薄其衆走保北山賊敗溺水死者甚衆賊數萬圍沂州同知防禦事布薩薩哈突圍出求救和勒端率兵赴之薩哈還入沂州與和勒端内外夾撃殺萬餘人賊乃去樞密副使布薩安貞上其功奏曰和勒端天資忠實深有計畫曉習軍事薩哈勇而有謀皆得軍民心乞加擢用和勒端進金紫光禄大夫兼同知武寧軍節度事提控如故召為勸農副使充都提控屯陳州興定元年自新息渡淮伐宋破沙度店至定城以少擊衆戰不留行未幾充宣差參議官復渡淮連破宋兵獲其將沈俊遷武衞軍副都指揮使宋人城守不出分兵破其山寨水堡殺獲甚衆興定二年遷鎮南軍節度使權元帥右都監數月改武衞軍都指揮使仍權右都監行元帥府于息州徐州行樞密院實嘉紐勒歡剛愎自用詔和勒端以本官權簽樞密院事往代之四年冬上言竊聞宋人與李權將併力來攻當預防樞密院奏可召和勒端與朝臣面議㝷有疾賜太醫御藥五年正月召至京師疾病不能入見力疾草奏大略以南北皆用兵當豫防其患及防河數䇿無河卒在四十五勅有司給喪事完顔伊爾必斯字彦成海蘭路特克紳必喇明安人明昌五年進士調易州忻州軍事判官安豐縣令補尚書省令史除興平軍節度副使應奉翰林文字轉修撰充元帥左監軍赫舍哩執中經厯官執中圍楚州縱兵大掠坐不諫正杖五十大安初改户部員外郎鈞州刺史執中行樞密院於西京復以為經厯官改威州刺史貞祐初累遷國子祭酒厯越王濮王傅改同知平陽府事兼本路宣撫副使召為兵部侍郎遷翰林侍講學士改陜西路宣撫副使遷元帥左都監改河平軍節度使河北西路宣撫副使改御史中丞遼宣撫副使使再閲月權右副元帥參知政事遼東路行尚書省事賜御衣廐馬安山甲上京行省富察烏錦奏其功賜金百兩縜百匹興定元年真拜參知政事權右副元帥行尚書省元帥府于博索路承制除拜刺史以下不恊是時布希萬努據遼東侵掠博索之境高麗畏其強助糧八萬石上京行省富察烏錦入朝遼東兵勢愈弱烏錦留江山守肇州江山亦頗懷去就及上京宣撫使富察伊埒圖改陜西行省參議官而伯特呼圖遂有異志宣撫使海努不迎制使坐而受詔伊爾必斯械繫之頃之伊爾必斯輒矯制大赦諸道衆乃稍安而請罪于朝初瑠格據廣寧知廣寧府事温特赫成格勒兵𨽻伊爾必斯廣寧與伯特呼圖約為兄弟成格勒兵𨽻伊爾必斯不協富伊埒圖都奏成格勒無𨽻伊爾必斯宣宗乃召成格勒成格勒不受詔伊爾必斯殺之呼圖乃怨伊爾必斯後呼圖率衆伐高麗乃以兵戕殺伊爾必斯權左都監納塔裕與監軍温特赫格綳額遥授東平判官參議軍事郭澍謀誅呼圖未敢發㑹上京留守富察烏錦遣副留守𤓰爾佳諳達左右司員外郎穆延都倫詣裕計事裕以謀告二人二人許諾召呼圖至帳中殺之伊爾必斯已死朝廷始得矯赦奏疏詔有司奬諭未幾聞伊爾必斯死于亂詔贈平章政事芮國公納塔裕真授左都監格綳額進一階諳達都倫郭澍遷官陞職有差伊爾必斯寛厚愛人敏于吏事能治劇要識者以為用之未盡云完顔特爾格性淳直貎雄偉粗通書年二十四襲父率賓路海蘭哈達明安授廣威將軍御下惠愛察亷除臨海軍節度使使改達喇乣詳衮丞相襄行省于北京特爾格為先鋒萬户有功丁母憂起遷同知武勝軍節度使事充右副元帥完顔匡副統號平南盪江將軍攻光化軍王統制以歩騎出東門逆戰特爾格却之㧞鹿角奪門以入遂克之進攻襄陽為前驅獲生口知江渡可涉處陰植標以識之大軍至特爾格導之濟戰皆涉以勞進官兩階匡圍徳安特爾格總領攻城築壘于徳安鳳凰臺竝城作甬道立鵝車對樓攻之擊走張統制兵時暑還屯鄧州兵罷進官兩階遷同知臨潢府事改西南路副招討宿州防禦使貞祐二年樞密使圖克坦都哷以特爾格充都統入衛中都遷東北路招討使兼徳昌軍節度使布希萬努在咸平忌特爾格兵强牒取所部騎兵二千又召泰州軍三千及户口遷咸平特爾格察其有異志不遣宣撫使承充召特爾格赴上京命伐扶餘路既還適萬努代承充為宣撫使摭前不發軍罪下獄被害諡勇毅納喇呼喇勒大名路博爾歡明安人性淳直寡言笑好讀書博通今古承安二年進士第一除應奉翰林文字被詔括牛于臨潢上京等路丞相襄有田在肇州家奴匿牛不以實聞即械繫正其罪而盡括之於是豪民皆懼無敢匿者使還襄稱能居父喪盡禮御史舉其清節服除轉修撰平章政事布薩端舉亷能有文采遷同知順天軍節度使事從伐宋以勞加朝請大夫改禮部員外郎曹州刺史豪民布薩素赫立私渡於定陶間逃兵盗刼皆藉為囊槖累政莫敢問呼喇勒捕治之窮竟其黨闔郡肅然改沃州改南京路按察副使貞祐二年改泗州防禦使召為吏部侍郎遷綘陽軍節度使權河東南路宣撫副史是時兵興呼喇勒完城郭繕器械料才壯為鄉兵延閒耆老招致儒士咨以禦􅊀之䇿鹽米儲偫勸富民出粟郡頼以完賜詔褒諭加資善大夫官其次子烏紳改權經略使被召以疾不能行卒于綘州贊曰泰和貞祐其間相去五年耳故將遺老往往在焉高琪得君宿將皆斥外矣高汝礪任職舊臣皆守藩矣假以重任其實疎之故舒穆嚕仲温以下見當時之將校焉金史卷一百三
