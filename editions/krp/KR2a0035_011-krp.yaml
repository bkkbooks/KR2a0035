body:
  text: 金史卷十一元中書右丞相總裁托克托等修本紀第十章宗三三年春正月己亥朔日有食之辛丑宋夏遣使來賀癸卯諭有司凡館接伴并舉使者毋以語言相勝務存大體奉使者亦必得其人乃可乙卯詔罷講議所丙辰如城南春水丁巳併上京東京兩路提刑司為一提刑使副兼安撫使副安撫専掌教習武事毋令改其本俗己未以都南行宮名建春甲子至自春水乙丑宋主以祖母喪遣使告哀二月己巳朔幸建春宫辛巳諭宰臣曰自今内外官有闕有才能可任者資歴未及亦具以聞雖親故毋有所避以武衛軍都指揮使烏凌阿天益等為宋弔祭使甲申至自建春宫丙戌薩察内附辛卯平章政事鈕祜禄額特埓薨三月戊戌以禮部尚書張暐為御史大夫壬寅始㩁醋甲寅如萬寧宫丁巳勅隨處盜賊毋以强為竊以多為少以有為無嘯聚三十人以上奏聞違者杖百丙寅高麗王王晧以弟晫權國事遣使奉表來告夏四月戊辰朔諭有司宰相遇雨可循殿廡出入丙申諭御史臺曰隨朝大小官雖有才能率多苟簡朕甚惡之其察舉以聞提刑司所察亷能汙濫官皆當殿奏餘事可轉以聞以侍御史孫俁為宣問高麗王王晧使五月庚子右宣徽使張汝方以漏泄廷議削官兩階壬寅射栁擊毬縱百姓觀戊申以客省使伊喇郁為夏國生日使甲子參知政事楊伯通表乞致仕不許秋七月丙午幸香山己酉如萬寧宫甲寅還宫八月辛未獵于近郊癸酉獵于香山戊寅如萬寧宫庚辰以䕶衛石和尚為押軍萬户率親軍八百人武衛軍千六百人戍西北路癸未還宫宋遣使來報謝九月丙申朔天夀節宋夏遣使來賀以中都路都轉運使孫鐸等為賀宋生日使乙巳獵于近郊庚戌參知政事楊伯通再表乞致政不許戊午木波進馬冬十月庚午獵于近郊癸未行樞宻院言薩察等請開㩁場于色勒年從之丁亥定官民存留見錢之數設回易務更立行用鈔法十一月丁酉樞宻使兼平章政事襄至自軍癸卯以為尚書左丞相監修國史丁未以太常卿楊庭筠等為賀宋正旦使戊申詔奬樞宻副使𤓰爾佳衡以下將士辛亥定屬託法定軍前官吏選賞格以邉事定詔中外減死罪徒以下釋之賜左丞相襄以下將士金幣有差甲寅冬獵十二月甲子朔獵于酸棗林大風寒罷獵凍死者五百餘人己巳還都丙戌尚書右丞嘗罷高麗權國事王晫遣使奉表來告四年春正月癸巳朔宋夏遣使來賀乙巳尚書左丞董師中致仕辛酉監察御史姬端修以妄言下吏尚書左丞相襄為司空職如故樞宻副使𤓰爾佳衡為平章政事封英國公前知濟南府事張萬公復為平章政事封夀國公楊伯通為尚書左丞簽樞宻院事完顔匡為尚書右丞二月乙丑如建春宫春水己巳還宫庚午御宣華門觀迎佛辛未如建春宫赦姬端修罪令居家俟命司空襄言西南路招討使布薩揆治邉有功召赴闕以知興中府事赫舍哩子仁代之壬申諭有司自三月一日為始每旬三品至五品官各一人轉對六品亦以次對臺諫勿與有應奏事與轉對官相見無靣對者上章亦聼乙亥還宫戊寅如建春宫庚辰上諭㸃檢司曰自蒲河至長河及細河以東朕常所經行官為和買其地令百姓畊之仍免其租税甲申還宫乙酉以西南路招討使布薩揆為參知政事起姬端修為太學博士如建春宫戊于還宫三月丁酉同判大睦親府事宗浩為樞宻使封崇國公己亥如建春宫遣使册王晫為高麗國王户部尚書孫鐸郎中李仲略國子祭酒趙忱始轉對香閤丁未勅尚書官員必湏改除者議之其月日淺者毋數改易乙卯尚書省奏減親軍武衛軍額及太學女直漢兒生員罷小學官及外路教授詔學校仍舊武衛軍額再議餘報可司空襄右丞匡參知政事揆請罷諸路提㸃刑獄從之戊午雨雹夏四月癸亥改提刑司為按察使司戊辰如萬寧宫壬申左丞楊伯通致仕御史大夫張暐以奏事不實追一官侍御史路鐸追兩官俱罷之姬端修杖七十贖壬午英王從憲進封瀛王詔同州許州節度使罷兼陜西河南副綂軍五月壬辰朔以旱下詔責躬求直言避正殿減膳審理冤獄命奏事于泰和殿戊戌命有司望祭嶽瀆禱雨己亥應奉翰林文字陳載言四事其一邉民苦于宼掠其二農民困于軍須其三審決冤滯一切從寛苟縱有罪其四行省官員例獲厚賞而沿邉司縣曽不霑及此亦干和氣致旱災之所由也上是之壬寅以兵部郎中完顔薩里罕為夏國生日使戊申宰臣以京畿雨率百官請御正殿復常膳不從尚書省奏上更定給發虎符制著于令庚戌諭宰臣曰諸路旱或闗執政今惟大興宛平兩縣不雨得非其守令之過歟司空襄平章政事萬公參知政事揆上表待罪上以罪已答之令各還職詔頒銅杖式壬子祈雨于太廟乙卯更定軍功賞格戊午司空襄以下再請御正殿復常膳不從庚申平章政事𤓰爾佳衡薨以宿直將軍圖克坦仲華為横賜夏國使六月丁卯兩司空襄以下復請御正殿復常膳從之甲戌以雨足命有司報謝太廟丁丑右補闕楊庭秀言自轉對官外復令隨朝八品以上外路五品以上及出使外路有可言者並許移檢院以聞則時政得失民間利病可周知矣從之己卯以雨足報祭社稷辛巳遣官報祀嶽瀆癸未奉職醜和尚進浮漏水稱影儀簡儀圖命有司依式造之丁亥定宫中親戚非公事傳達語言轉遞諸物及書簡出入者罪七月甲辰更定尚藥儀鸞局學者格辛亥勅宣徽院官天夀節凡致仕宰執悉召與宴丙辰以久雨令大興府祈晴八月己巳獵于近郊壬申獵于香山甲戌以皇嗣未立命有司祈于太廟丁丑獵于近郊庚辰還宫九月庚寅朔天夀節宋高麗夏遣使來賀己亥如薊州秋山己未以知東平府事布薩琦等為賀宋生日使冬十月丙寅至自秋山壬午初定百官休假甲申初置審官院乙酉勅京府州縣設普濟院毎嵗十月至明年四月設粥以食貧民十一月丙申平章政事張萬公表乞致政不許庚戌命有司祈雪甲寅定䕶衛改充奉御格以知濟南府事范揖等為賀宋元旦使十二月己未除授文字初送審官院辛酉更定考試隨朝檢知法條格右補闕楊庭秀請類集太袓太宗世宗三朝聖訓以時觀覽從之仍詔增熙宗為四朝癸未更定科舉法増設國史院女直漢人同修史各一人定親軍及承應人退閑遷賞格是月淑妃李氏進封元妃五年春正月戊子朔宋高麗夏遣使來賀乙未以尚書省言㑹試取䇿論詞賦經義不得過六百人合格者不及其數則闕之丙申如春水庚子命左右司五日一轉奏事辛丑諭㸃檢司車駕所至仍令百姓市易庚戌定明安穆昆軍前怠慢罷世襲制二月辛未至自春水辛已有司奏應奉翰林文字温特赫天興與其兄直學士思齊同僚學士院定撰制誥文字合無迴避詔不湏避仍為定制閏月癸卯定進納粟補官之家存留弓箭制丁未與宰臣論置相曰圖克坦鎰朕志先定賈鉉如何皆曰知延安府事孫即康可平章政事萬公亦曰即康及第先鉉一榜上曰安問榜次特以賈才可用耳尚書省奏右補闕楊庭秀言乞令尚書省及第左右官一人應入史事者編次日歴或一月或一季封送史院上是其言仍令送著作局潤色付之三月庚中大睦親府進重修玉牒平章政事張萬公乞致政不許壬戌命有司禱雨癸亥雨户部尚書張鐸大理卿完顔薩喇國子司業蒙古仁本召對便殿丙寅如萬寧宫戊辰定妻亡服内婚娶聼離制親王宰執百官再請上尊號不許庚午以知大興府事卞為御史大夫丙子尚書省奏擬同知商州事富察錫津為濟南府判官上曰宰相豈可止循人情當重惜名爵此人不堪朕常記之止與七品足矣庚辰以上京留守圖克坦鎰為平章政事封濟國公辛巳定本國婚聘禮制改山東東路舊皇城明安名曰赫爾根阿林四月丙戌朔文武百官再請上尊號不許丙午尚書省進律義五月乙卯朔定明安穆昆闘毆殺人遇赦免死罷世襲制以雨足遣使報祭社稷丁巳定䇿論進士及承廕人試弓箭格戊午勅來日重五拜天服公裳者拜禮仍舊諸便服者並用女直拜己未勅諸路按察司糾察親民官以大杖箠人者乙亥親王文武百官六學各上表請上尊號不許庚辰地震詔定進納官有犯決㫁法六月乙巳遣有司祈晴望祭嶽瀆七月乙卯朔以晴遣官望祭嶽鎮海瀆癸亥定居祖父母喪婚娶聼離法初置富森羣牧辛未平章政事萬公特賜告兩月甲戌獵于近郊八月壬辰幸香山乙未至自香山丁未勅審官院奏事院官皆許升殿戌申更定鎮防軍犯徒配役法九月甲寅朔天夀節宋高麗夏遣使來賀戊午命樞宻使宗浩禮部尚書賈鉉佩金符行省山東等路括地己未尚書省奏西北路招討使通吉思忠言各路邉堡墻隍西自塔木色東至呼爾根幾六百里向以起築忽遽無女墻副堤近令修完計工七十五萬止役戌軍未嘗動民今已畢功上賜詔奬諭修玉牒成定皇族收養異姓男為子者徒三年姓同者減二等立嫡違法者徒一年癸亥如薊州秋山冬十月庚寅至自秋山庚子風霾宋遣使來告哀辛丑集百官于尚書省問間者亢旱近則久隂豈政有錯謬而致然歟各以所見對以禮部郎中劉公憲為高麗生日使丁未獵于近郊以宿直將軍完顔觀音努為夏國生日使十一月癸丑朔日有食之乙卯以國史院編修官吕卿雲為左補闕兼應奉翰林文字審官院以資淺駁奏上諭之曰明昌間卿雲嘗上書言宫掖事辭甚切直皆他人不能言者卿軰葢不知也臣下言事不令外人知乃是謹宻正當顯用卿宜悉之以工部尚書烏庫哩誼等為宋弔祭使初定品官過闕則下制己巳宋復遣使來告哀辛未以殿前右副㸃檢赫舍哩忠定為賀宋正旦使十二月癸未朔詔改明年為泰和元年以河南路統軍使充等為宋弔祭使乙未定管軍官受所部財物輒放離役及令人代役法辛丑詔宫籍監户百姓自願以女為婚者聼癸卯定造作不如法三年内有損壊者罪有差泰和元年正月壬子朔宋高麗夏遣使來賀壬戌宋遣使獻先帝遺留物己巳以太府監孫復言方今在仕者三萬七千餘員而闕廕補叙居三之二諸司待闕動至累年葢以補廕猥多流品混淆本末相外至於進納之人既無勞績又非科第而亦廕及子孫無所分别欲流之清必澄其源乃更定廕叙法而頒行之尚書省奏令杖式輕細民不知畏請用大杖詔不許過五分庚午如長春宫春水辛未上以方春禁殺含胎兎犯者罪之告者賞之甲戌初命文武官官職俱至三品者許贈其祖二月壬辰去造土茶律丁未至自春水三月乙丑夏國遣使來謝壬申幸天長觀癸酉如萬寧宫乙亥宋遣使來報謝丁丑更定鎮防千户穆昆放老入除格辛巳勅官司私文字避始祖以下廟諱小字犯者論如律夏四月甲辰詔諭契丹人户累經簽軍立功者官賞恩例與女直人同仍許養馬為吏五月甲寅擊毬于臨武殿令都民縱觀丙辰樞宻使宗浩罷壬戌幸玉泉山戊寅削尊長有罪卑㓜追捕律以直東上閤門劉頗為横賜高麗使六月己卯朔幸香山乙酉平章政事張萬公乞致仕不許辛卯祈雨于北郊己亥用尚書省言申明舊制明安穆昆户每田四十畝樹桑一畝毁樹木者有禁鬻地土者有刑其田多汙萊人户闕乏并坐所臨長吏按察司以時勸督有故慢者量決罰之仍減牛頭税三之一勅尚書省舉行風俗奢僣之禁乙巳初許諸科徵鋪馬黄河夫軍湏等錢折納銀一半願納錢鈔者聼丁未詔有司修蓮花漏七月辛酉禁放良人不得應諸科舉子孫不在禁限甲子諭刑部官凡上書人言及宰相者不得申省乙丑更定右選注縣令丞簿格己巳初禁廟諱同音字八月庚辰初命户絶者田宅以二分之一付其女及女孫戊子特改授司空襄河間府路算卓和世襲明安乙未至自萬寧宮丙申宋遣使來報謝壬寅制明安穆昆並𨽻按察司監察御史止按部糾察有罪則併坐監臨之官詔推排西北京遼東三路人户物力九月戊申朔天夀節宋高麗夏遣使來賀更定贍學養仕法生員給民佃官田人六十畝嵗支粟三十石國子生人百八畝嵗給以所入官掌其數以右宣徽使圖克坦懐忠等為賀宋生日使甲寅如秋山丙子至自秋山冬十月乙酉袷享于太廟戊子平章政事張萬公乞致仕不許壬辰御史臺奏在制按察司官比任終遣官考覈然後尚書省命官覆察之今監察御史添設員多宜分路巡行毎路女直漢人各一人同往從之仍勅分四路丙申御史大夫卞乞致仕不許戊戌以武衛軍都指揮使司判官納哈塔鉉為高麗生日使壬寅勅有司購遺書宜償價以廣捜訪藏書之家有珍惜不願送官者官為謄冩畢復還之仍量給其直之半甲辰以刑部員外郎完顔綱為夏國生日使十一月庚戌司空襄以下文武百官復請上尊號不許辛亥勅尚耆凡役衆勞民之事勿輕行之丁巳諭工部曰比聞懐州有橙結實官吏檢視已嘗擾民今復進柑得無重擾民乎其誡所司遇有則進無則己庚申以殿前右衛將軍赫舍哩齊錦等為賀宋正旦使十二月辛巳朔改原廟春秋祭祀稱朝獻司空襄以下復請上尊號詔不允仍㫁來章丁酉司空襄等進新定律令勅條格式五十二卷辛丑詔頒行之壬寅獵于近郊乙巳初定亷能官升注格二年春正月丁未朔宋高麗夏遺使來賀乙卯始朝獻于衍慶宫庚申幸芳苑觀燈癸酉歸徳軍節度副使韓琛以强市民布帛削一官罷之甲戌如建春宫二月戊戌初置内侍寄禄官乙巳還宫三月甲寅初置宫苑司都同監各一人甲子蔡王從彜母充等太師卒詔有司定喪禮葬儀事載從彜𫝊四月庚辰幸昇國長公主第問疾己亥定遷三品官格復撲買河濼法辛丑諭御史臺諸訴事于臺當以實上聞不得輒稱察知癸卯如萬寧宫命有司祈雨五月甲辰朔日有食之戊申如泰和宫辛亥初薦新于太廟壬戌諭有司曰金井巴納不過二三日留朕之所止一􅋽厦足矣若加修治徒費人力其藩籬不急之處用圍幕可也甲子更泰和宫曰慶寧長樂川曰雲龍己巳勅御史臺京師拜廟及巡幸所過州縣止令灑掃不許以黄土覆道違者糾之六月辛卯諭尚書省諸路禾稼及雨多寡令州郡以聞七月辛亥有司奏還宫日請用黄麾杖不許乙卯朝獻于衍慶宫八月丙申鳯凰見于磁州武安縣鼓山石聖臺丁酉還宫皇子生九月壬寅朔天夀節宋高麗夏遣使來賀甲寅以拱衛直都指揮使完顔瑭等為賀宋生日使且戒之曰兩國和好久矣不宜爭細故傷大體癸亥以皇子生親謝南北郊庚午封皇子為葛王冬十月戊寅報謝于太廟及山陵甲申以鳯凰見詔中外丙戌獵于近郊壬辰遣尚輦局副使李仲元為高麗國生日使以宿直將軍赫舍哩毅為夏國生日使瀛王府司馬通吉温為横賜使十一月甲辰更定徳運為土臘用辰以西京留守宗浩為樞宻院戊申以更定徳運詔中外庚申初命外官三品到任進表稱謝甲子幸王虚觀遣使報謝於太清宫十二月癸酉以皇于晬日放僧道戒牒三千以武安軍節度使圖克坦公弼等為賀宋正旦使戊寅冬臘庚辰報謝于高禖丁酉還都閏月庚戌司空襄薨癸丑命監察御史非特㫖不許舉官辛酉遣使報謝于北嶽定人户物力隨時推收法丁卯遣使報謝于長白山冬無雪三年春正月辛未朔宋高麗夏遣使來賀癸酉遣官祈雪于北嶽丁酉朝獻于衍慶宫己卯以樞宻使宗浩為尚書右丞相右丞完顔匡為左丞參知政事布薩揆為右丞御史中丞孫即康刑部尚書賈鉉並為參知政事庚辰如建春宫二月癸丑還宫甲子定諸職官省親拜墓給假之例三月壬申平章政事張萬公致仕庚辰如萬寧宫丁亥定從人銅牌賣毁罪賞制庚寅定職官應遷三品格刺史以上及朝資歴在刺史以上身故者毎半年一次敷奏甲午如玉泉山丙申以殿前都㸃檢布薩端為御史大夫四月乙巳禘于太廟勅㸃檢司致仕官入宫年高艱于歩履者並聼䇿杖仍令舍人䕶衛扶之丁巳勅有司祈雨仍頒土龍法己未命吏部侍郎李炳國子司業䝉古仁本知登聞檢院喬宇等再詳定儀禮庚申諭省司官中所用物如民間難得勿强市之癸亥尚書省奏遣官分路覆實御史所察事五月壬申以重五拜天射栁上三發三中四品以上官侍晏魚藻殿以天氣方暑命兵士甲者釋之丙戌以定律令正土徳鳯凰來皇嗣建大赦辛卯皇子葛王薨壬辰定擅増減宫門鎖鑰罪丙申作太極宫六月己亥太白晝見壬寅詔選聰明方正之士為修起居注又詰㸃檢司諸親軍所設教授及授業人若干其為教何法通大義者幾人各具以聞戊申定職官追贈法惟嘗犯贓罪者不在追贈之列壬戌遣官行視中都田禾水澤分數七月壬申朝獻于衍慶宫乙亥定大臣薨百官奉慰禮庚辰獵于近郊丁亥上諭宰臣凡奏事朕欲徐思或如己者若除授事可竢三五日再奏餘並二十日奏之八月丙辰還宫庚申命編修官左容充宫教賜銀幣九月丙寅朔天夀節宋高麗夏遣使來賀壬申以刑部尚書承暉等為賀宋生日使戊子以萬寧宫提舉司隸工部壬辰詔定千户穆昆受隨處捕盜官公移盜急不即以衆應之者罪有差召右丞相宗浩還朝冬十月戊戌日將暮赤如赭己亥大風甲辰申酉間天大赤夜將旦亦如之壬子右丞布薩揆至自北邉丙辰召至香閤慰勞之以尚食局使師孝為高麗生日使庚申尚書左丞完顔匡等進世宗實録上降座立受之壬戌以薊州刺史完顔太平為夏國生日使奉御完顔阿嚕岱以使宋還言宋權臣韓侂胄市馬厲兵將謀北侵上怒以為生事笞之五十出為彰徳府判官及淮平䧟乃擢為安國軍節度副使丁卯諭尚書省士庶陳言皆從所司以聞自今可悉令詣闕量與食直仍給官舎居之其言切直及繫利害重者並三日内奏聞十一月辛未以簽樞宻院事通吉思忠等為賀宋正旦使丁丑冬獵以獲兎薦山陵甲午詔監察等察事可二年一出十二月庚子諭宰臣曰賀正宋使且至可令監察隨之以為常壬寅還都己酉賜天長觀額為太極宫辛亥詔諸親王公主毎嵗寒食十月朔聼朝謁興裕二陵忌辰亦如之癸丑詔遣監察御史分按諸路所遣者女直人即以漢人朝臣偕所遣者漢人即以女直朝臣偕戊午勅行宫名曰光春其朝殿曰蘭臯寢殿曰輝寧金史卷十一
