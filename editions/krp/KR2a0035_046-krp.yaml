body:
  text: 金史卷四十六元中書右丞相總裁托克托等修志第二十七食貨一戸口通檢推排國之有食貨猶人之有飲食也人非飲食不生國非食貨不立然燧人庖犧能為飲食之道以教人而不能使人無飲食之疾三王能為食貨之政以遺後世而不能使後世無食貨之弊唯善養生者如不欲食啖而飲食自不闕焉故能飢飽得其宜可以疾少而長壽善裕國者初不事貨殖而貨食自不乏焉故能制豐約之節可以弊少而長治金於食貨其立法也周其取民也審太祖肇造減遼租税䂓模逺矣熙宗海陵之世風氣日開兼務逺畧君臣講求財用之制切切然以是為先務雖以世宗之賢儲積之志曷嘗一日而忘之章宗彌文蝟興邊費亦廣食貨之議不容不急宣宗南遷國土日蹙汙池数罟往往而然攷其立國以来所謂食貨之法犖犖大者曰租税銅錢交鈔三者而已三者之法数變而数窮官田曰租私田曰税租税之外算其田園屋舍車馬牛羊樹藝之數及其藏鏹多寡徴錢曰物力物力之徴上自公卿大夫下逮民庻無苟免者近臣出使外國歸必增物力錢以其受饋遺也明安穆昆戸又有所謂牛頭税者宰臣有納此税庭陛間諮及其增減則州縣徴求於小民蓋可知矣故物力之外又有舖馬軍湏輸庸司吏河夫桑皮故紙等錢名目瑣細不可殚述其為戸有数等有課役戸不課役戸本戸雜戸正戸監戸官戸奴婢戸二税戸有司始以三年一籍後變為通檢又為推排凡戸隸州縣者與隸明安穆昆其輸納高下又各不同法之初行唯恐不宻言事者謂其厲民即命罷之罷之未乆㑹計者告用乏又即舉用其罷也志以便民而民未見德其行也志以足用而用不加饒一時君臣節用之言不絶告誡嘗自計其國用数亦浩瀚若足支歴年者郡縣稍遇嵗祲又遽不足竟莫詰其故焉至於銅錢交鈔之弊葢有甚者初用遼宋舊錢雖劉豫所鑄預廢亦兼用之正隆而降始議鼓鑄民間禁銅甚至銅不給用漸興窑冶凡産銅地脉遣吏境内訪察無遺且及外界而民用銅器不可闕者皆造於官而鬻之旣而官不勝煩民不勝病乃聽民冶銅造器而官為立價以售此銅法之變也若錢法之變則鼓鑄未廣歛税無方已見壅滯初恐官庫多積錢不及民立法廣布繼恐民多匿錢乃設存留之限開告訐之路犯者䋲以重罸卒莫能禁州縣錢艱民間自鑄私錢苦惡特甚乃以官錢五百易其一千其䇿愈下及改鑄大錢所凖加重百計流通卒莫獲效濟以鐵錢鐵不可用權以交鈔錢重鈔輕相去懸絶物價騰踊鈔至不行權以銀貨銀弊又滋求亦無䇿遂罷銅錢專用交鈔銀貨然而二者之弊乃甚於錢在官利於用大鈔而大鈔出多民益見輕在私利于得小鈔而小鈔入多國亦無補於是禁官不得用大鈔已而恐民用銀而不用鈔則又責民以鈔納官以示必用先造二十貫至百貫例後造二百貫至千貫例先後輕重不倫民益眩惑及不得已則限以年数限以地方公私受納限以分数由是民疑日深其其易交鈔為寳券寳券未乆更作通寳凖用銀并通寳未乆復作寳泉寳泉未久織綾印鈔名曰珍貨珍貨未乆復作寳㑹汔無寧嵗而金祚訖矣厯觀自古財聚民散以至亡國若鹿臺鉅橋之類不足論也其國亡財匱比比有之而國用之屈未有若金之甚者金之為政也常有䘏民之志而不能已苛征之令徒有聚歛之名而不能致富國之實及其亡也括粟闌糴一切掊克之政靡不為之加賦数倍豫借數年或欲得鈔則預賣下年差科高琪為相議至㩁油進納濫官輒售空名宣勅或欲與以五品正班僧道入粟始自度牒終至德號綱副威儀寺觀主席亦量其私而鬻之甚而丁憂鬻以求仕監戸鬻以從良進士出身鬻至及第又甚而叛臣劇盗之效順無金帛以備賞動以王爵固結其心迨重爵不蔇則以國姓賜之名寔混淆倫法斁壊皆不暇顧國欲不亂其可得乎迨夫宋絶嵗弊而不許和貪其淮陽之蓄謀以力取致樞府武騎盡於南伐額爾克時全之出初志得糧後尺寸無補三軍僨亡我師壓境兵財俱困極竟無以禦之故志金之食貨者不能不為之掩卷而興嘅也傳曰作法於涼其弊猶貪作法於貪弊将若何金起東海其俗純實可與返古初入中夏兵威所加民多流亡土多曠閒遺黎惴惴何求不獲使於斯時縱不能復井地溝洫之制若用唐之舊業口分以制民産倣其租庸調之法以足國計何至百年之内所謂經畫紛紛然與其國相終始耶其弊在於急一時之利踵乆壊之法及其中葉鄙遼儉朴襲宋繁縟之文懲宋寛柔加遼操切之政是棄二國之所長而併用其所短也繁縟勝必至於傷財操切勝必至於害民訖金之世國用易匱民心易離豈不由是歟作法不慎厥初變法以捄其弊秪益甚焉耳其他鹽䇲酒麴常平和糴茶税征商𣙜場等法大槩多宋舊人之所建明息耗無定變易靡恒視錢鈔何議田制水利區田之目或驟行隨輟或屡試無效或熟議未行咸著于篇以備一代之制云戸口金制男女二嵗以下為黄十五以下為小十六為中十七為丁六十為老無夫為寡妻妾諸篤廢疾不為丁戸主推其長充内有物力者為課役戸無者為不課役戸令民以五家為保泰和六年上以舊定保伍法有司滅裂不行其令結保有匿姦細盗賊者連坐宰臣謂舊以五家為保恐人易為結搆而難覺察遂令從唐制五家為鄰五鄰為保以相檢察京府州縣郭下則置坊正村社則隨戸則衆寡為鄉置里正以按戸口催督賦役勸課農桑村社三百戸以上則設主首四人二百以上三人五十戸以上二人以下一人以佐里正禁察非違置壯丁以佐主首巡警盗賊明安穆昆部村寨五十戸以上設寨使一人掌同主首寺觀則設綱首凡坊正里正以其戸十分内取三分富民均出顧錢募強幹有抵保者充人不得過百貫役不得過一年大定二十九年章宗嘗欲罷坊里復以主首逺入城應代妨農不便乃以有物力謹愿者二年一代凡戸口数計帳三年一籍自正月初州縣以主政主首明安穆昆則以寨使詣編戸家責手實具男女㓜老年與姓名生者增之死者除之二月二十日以寔数報縣二月二十日申州以十日内逹上司無逺近皆以四月二十日到部呈省凡漢人渤海人不得充明安穆昆戸明安穆昆之奴婢免為良者止隸本部為正戸凡沒入官良人隸官籍監為監戸没入官奴婢隸太府監為官戸當收國二年時法制未定兵革未息貧民多依權右為苟安多隐蔽為奴婢者太祖下詔曰比以嵗凶民饑多附豪族因䧟為奴隸及有犯法徴償莫辦折身為奴或私約立限以人對贖過期則以為奴者竝聴以兩人贖一為良元約以一人贖者從便天輔五年以境土既拓而舊部多瘠鹵將移其民于泰州乃遣皇弟昱及族子宗雄按視其地昱等苴其土以進言可種植遂摘諸明安穆昆中民戸萬餘使宗人博勒和統之屯種於㤗州博勒和舊居於按春水至是始遷焉其居寧江州者遣實登札克丹阿爾托歡錫勒塔干等四穆昆挈家属耕具徙于㤗州仍賜博勒和耕牛五十六年既定山西澤潞諸州以上京為内地則移其民實之又命耶律佛德以兵護送諸降人於渾河路以皇弟昻監之命從便以居七年以山西諸部族近西北二邊且遼主未獲恐隂相結誘復命皇弟昻與貝勒索歡等以兵四千䕶送處之䫈東惟西京民安堵如常且命昻鎮守上京路既而上聞昻已過上京而降人復苦其侵優多叛亡者遂命貝勒綽爾台徃戒諭之比至而諸部已叛去又以明安詳衮瑠珠所領歸附之民還東京命有司常撫慰且貸一歳之糧其親屬被虜者皆令聚居及七年取燕京路二月盡徙六州氏族富強工技之民於内地太宗天㑹元年以舊徙潤隰等四州之民於瀋州之境以新遷之戸艱苦不能自存詔曰比聞民乏食至鬻子者聴以丁力等者贖之又詔貝勒爱實拉曰先皇帝以同姓之人昔有自鬻及典質其身者命官為贖今聞尚有未復者其悉閲贖之又命以官粟贖上京路新遷置寧江州戸口貧而買身者六百餘人二年民自鬻為奴者詔以丁力等者交易之三年禁内外官及宗室毋得私役百姓權勢家不得買貧民為奴其脅買者一人償十五人詐買者一人償二人罪皆杖百七年詔兵興以来良人被畧為驅者聴其父母妻子贖之熈宗皇統四年詔陕西蒲觧等汝蔡州歲飢百姓流落典顧為驅者官以絹贖為良丁男三匹婦人㓜小二匹世宗大定二年詔免二税戸為民初遼人佞佛尤甚多以良民賜諸寺分其税一半輸官一半輸寺故謂之二税戸遼亡僧多匿其寔抑為賤有援左證以告者有司各執以聞上素知其事故特免之十七年五月省奏咸平府路千六百餘戸自陳皆長白山錫馨察遜河女直人遼時簽為獵戸移居於此號伊勒敦部遂附契丹籍本朝義兵之興首詣軍降仍居本部今乞釐正詔從之二十年以上京路女直人戸規避物力自賣其奴婢致耕田者少遂以貧乏詔定制禁之又謂宰臣曰明安穆昆人戸兄弟親属若各随所分土與漢人錯居每四五十戸結為保聚農作時令相助濟此亦勸相之道也二十一年六月徙銀山側民於臨潢又命避役之戸舉家逃於他所者元貫及所寓司縣官同罪為定制二十三年定制女直奴婢如有得力本主許令婚聘者湏取問房親及村老給據方許聘於良人是年七月奏明安穆昆戸口懇地牛具之数明安二百二穆昆千八百七十八戸六十一萬五千六百二十四口六百一十五萬八千六百三十六内正口四百八十一萬二千六百六十九奴婢口一百三十四萬五千九百六十七墾田一百六十九萬三百八十頃有竒牛具二十八萬四千七百七十一在都宗室將軍司戸百七十口二萬八千七百九十内正口九百八十二奴婢口二萬七千八百八墾田三千六百八十三頃七十五畝牛具三百四德哷勒唐古二部五乣戸五千五百八十五口十二萬七千五百四十四内正口十萬九千四百六十三奴婢口一萬一千八十一墾田萬六千二十四頃一十七畝牛具五千六十六二十五年命宰臣禁有禄人一子及農民避課役為僧道者大定初天下戸纔三百餘萬至二十七年天下戸六百七十八萬九千四百四十九口四千四百七十萬五千八十六章宗大定二十九年十一月上封事者言乞放二税戸為良省臣欲取公牒可慿者為准叅知政事伊喇履謂憑騐真偽難明凡契丹奴婢今後所生者悉為良見有者則不得典買如此則三十年後奴皆為良而民且不病焉上以履言未當令冄議省奏謂不拘括則訟終不絶遂遣大興府治中烏克遜仲和侍御史范楫分括北路及中都路二税戸凡無慿騐其主自言之者及因通檢而知之者其税半輸官半輸主而有慿騐者悉放為良明昌元年正月上封事者言自古以農桑為本根商賈之外又有佛老與他游食浮費百倍農歲不登流殍相望此末作傷農者多故也上乃下令禁自披剃為僧道者是歲奏天下戸六百九十三萬九千口四千五百四十四萬七千九百而粟止五千二百二十六萬一千餘石除官兵二年之費餘騐口計之口月食五斗可為四十四日之食上曰蓄積不多是力農者少故也其集百官議所以使民務本業廣積儲之道以聞六月省奏北京等路所免二税戸凡一千七百餘戸一萬三千九百餘口此後為良為驅皆從已㫁為定六年二月上謂宰臣曰凡言女直進士不湏稱女直字卿等誤作迴避女直契丹語非也自今如分别戸民則女直言本戸漢戸及契丹餘謂之雜戸十二月省奏天下女直契丹漢戸七百二十二萬三千四百口四千八百四十九萬四百物力錢二百六十萬四千七百四十二貫㤗和七年六月勅中物力戸有役則多逃避有司令以次戸代之事畢則復業以致大損不逃之戸令省臣詳議宰臣奏舊制太輕遂命課役全戸逃者徒二年賞告者錢五萬先逃者以百日内自首免罪如寔銷乏者内從御史臺外從按察司體究免之十二月奏天下戸七百六十八萬四千四百三十八口四千五百八十一萬六千七十九戸增於大定二十七年一百六十二萬三千七百一十五口増八百八十二萬七千六十五此金版籍之極盛也及衛紹王之時軍旅不息宣宗立而南遷死徙之餘所在為虚戾戸口日耗軍費日急賦歛繁重皆仰給於河南民不堪命率棄廬田相繼亡去乃屡降詔招復業者免其歲之租然以國用乏竭逃者之租皆令居者代出以故多不敢還興定元年十二月宣宗欲懸賞募人捕亡已而復慮騷動遂命依己降詔書已免債逋更招一月違而不来者然後捕獲治罪而以所遺地賜人四年省臣奏河南以歲饑而賦役不息所亡戸令有司招之至明年三月不復業者論如律時河壖為疆烽鞞屡警故集慶軍節度使温特赫逹言亳州戸舊六萬自南遷以来不勝調發相繼逃去所存者曾無十一碭山下邑野無居民矣通檢推排通檢即周禮大司徒三年一大比各登其鄉之衆寡六畜車輦辨物行徴之制也金自國初占籍之後至大定四年承正隆師旅之餘民之貧富變更賦役不均世宗乃下詔曰粤自國初有司常行大比于今四十年矣正隆時兵役竝興調發無度富者今貧不能自存版籍所無者今為富室而猶幸免是用遣信臣㤗寧軍節度使張宏信等十三人分路通檢天下物力而差定之以革前弊俾元元無不均之弊以稱朕意凡規措條理命尚書省畫一以行又命凡監戸事産除官所撥賜之外餘凡置到百姓有税田宅皆在通檢之數時諸使往往以苛酷多得物力為功宏信檢山東州縣尤為酷暴棣州防禦使完顔永元靣責之曰朝廷以正隆後差調不均故命使者均之今乃殘暴妄加民産業数倍一有来申訴者則血肉淋離甚者即殞杖下此何理宏信不能對故惟棣州稍平五年有司奏諸路通檢不均詔冄以戸口之多寡富貴輕重適中定之既而又定通檢地土等第税法十五年九月上以天下物力自通檢以来十餘年貧富變易賦調輕重不均遣濟南尹梁肅等二十六人分路排推二十年四月上謂宰臣曰明安穆昆戸富貧差發不均皆自穆昆内科之暗者惟胥吏之言是從輕重不一自幹罕叛後貧富反復今當籍其夹戸推其家貲儻有軍役庻可均出詔集百官議右丞相克寕平章政事安禮樞宻副使宗尹言女直人除明安穆昆僕從差使餘無差役今不推奴婢孶畜地土数目止騐産業科差為便左丞相守道等言止騐財産多寡分為四等置籍以科差庻得均也左丞通右丞道都㸃檢襄言括其奴婢之数則貧富自見緩急有事差科與一例差科者不同請俟農隙拘括地土牛具之数各以所見上聞上曰一穆昆戸之貧富穆昆豈不知一明安所領八穆昆一例差科設如一穆昆内有奴婢二三百口者有奴婢一二人者科差與同豈得平均正隆興兵時朕之奴婢萬数孳畜数千而不差一人一馬豈可謂平朕於庻事未嘗専行與卿謀之往年散置契丹戸安禮極言恐擾動朕决行之果得安業安禮雖盡忠未審長䇿其從左丞通等所見拘括推排之十二月上謂宰臣曰明安穆昆多新强舊弱差役不均其令推排當日中都路始至二十二年八月始詔令集耆老推貧富騐土地牛具奴婢之数分為上中下三等以同知大興府事完顔烏哩雅先推中都路續遣戸部主事諳逹等十四人與外官同分路推排九月詔毋令富者匿隐畜産貧戸或有不敢養馬者昔海陵時拘括馬畜絶無等級富者倖免貧者盡拘入官大為不均今竝覈寔貧富造籍有急即按籍取之庻幾無不均之弊張汝弼梁肅奏天下民戸通檢既定設有産物移易自應隨業輸納至於浮財湏有増耗貧者自貧富者自富似不必屡排推也上曰宰執家多有新富者故皆不願也肅對曰如臣者能推排中都物力臣以嘗為南使先自添物力錢至六十餘貫視其他奉使無如臣多者但小民無知法出姦生数動揺則易駭如唐宋及遼時或三二十年不測通比則有之頻嵗推排似為難耳二十六年復以李晏等分路推排二十七年奏晏等所定物力之数上曰朕以元推天下物力錢三百五萬餘貫除三百貫外令減以元推天下物力錢三百五萬餘貫除三百貫外令減五萬餘貫今減不及数復續收二萬餘貫即是實三萬貫爾而曰續收何也對曰此謂舊脱漏而今首出者及民地舊無力耕種而今耕種者也上曰通檢舊数止於視其營運息耗與房地多寡而加減之彼人賣地此人買之皆舊数也至如營運此强則彼弱强者増之弱者減之而已且物力之数葢是定差役之法其大数不在多寡也朕恐寔有營運富家所當出者應分與貧者爾章宗大定二十九年六月命為國信使之副者免増物力命又農民如有積粟毋充物力錢慳之郡所納錢貨則許折粟帛九月以曹州河溢遣馬百禄等推排遭墊溺州縣之貧乏者明昌元年四月刑部郎中路伯逹等言民地已納税又通定物力比之浮財所出差役是為重併也遂詳酌民地定物力減十之二尚書户部言中都等路被水詔委官推排比舊減錢五千六百餘貫三年八月勅尚書省臣曰百姓當豐稔之時不務積貯一遇凶儉輒有阻飢何法可使民重榖而多積也宰臣對曰二十九年已詔農民能積粟免充物力明昌初命民之物力與地土通推者亦減十分之二此固其術也承安元年尚書省奏是年九月當推排以有故不克詔以冬已深比事畢恐妨農作乃權止之二年冬十月勅令議通檢宰臣奏曰大定二十七年通檢後距今已十年舊户貧弱者衆儻遲更定恐致流亡遂定制已典賣物業止隨物推收析户異居者許令别籍户絶及困弱者減免新强者詳審增之止當從寔不必敷足元數邊城被冦之地皆不必推排於是令吏部尚書賈執剛吏部侍郎髙汝礪先推排在都兩警巡院示為諸路法毎路差官一員命提刑司官一員副之三年九月奏十三路籍定推排物力錢二百五十八萬六千七百二貫四百九十文舊額三百二萬二千七百十八貫九百二十二文以貧乏除免六十三萬八千一百一十一貫除上京北京西京路無新强増者餘路計收二十萬二千九十五貫㤗和二年閏十二月上以推排時既問人戸浮財物力而又勘當比次期廹事繁難得其寔勅尚書省定人戸物力隨時推收法詔令自今凡典賣事産者随業推收别置標簿臨時止拘浮財物力以増減之四年十二月上以職官仕於逺方其家物力有應除而不除者遂成典賣寔業逐時推收若無浮財營運應除免者令本家陳告集坊村人戸推唱騐寔免之造籍後如無人告一月内以本官文牒推唱定標附於籍五年以西京北京邊地常罹兵荒遣使推排之舊大定二十六年所定三十五萬三千餘貫遂減為二十八萬七千餘貫六月簽南京按察司事李革上言近奉制令人戸推收物力置簿標題至通推時止増新强銷舊弱庻得其實今有司奉行滅裂恐臨時冗併卒難詳審可定期限立罪以督之遂令自今年十一月一日令人戸告詣推收標附至次年二月一日畢違期不言者坐罪且令諸處税務具税訖房地毎半月具数申報所属違者坐以怠慢輕重之罪仍勅物力既随業通推時令止定浮財八年九月以吏部尚書賈守謙知濟南府事富察章嘉努莒州刺史完顔伯嘉南京路轉運使宋元吉等十三員分路同本路按察司一員推排諸路上乃召至香閣親諭之曰朕選卿等随路推排除推收外其新強銷乏戸雖集衆推唱然消乏者勿銷不盡如一戸物力元三百貫令蠲免二百五十貫猶有未當者新強勿添盡量存其力如一戸可添三百貫而止添二百貫之類卿等各宜盡心一推之後十年利害所關苟不副所任罪當不輕也金史卷四十六
