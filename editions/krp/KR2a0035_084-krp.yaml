body:
  text: 金史卷八十四元中書右丞相總裁托克托等修列傳第二十二杲本名薩里罕諾延温都思忠子伊徳温都烏逹昂本名璸都髙楨白彦敬本名約索張景仁杲本名薩里罕安帝六代孫泰州博勒和之族和勒博繖之子雄偉有才畧太祖愛之常在軍中及博勒和為泰州都統宗族皆隨遷泰州薩里罕嘗為世祖養子獨得不遷仍居於按春水宗翰宗望凡再克汴執宋二主北還宗望分遣諸將定河北左都監棟摩攻下河間雄州李成棄城走薩里罕邀擊大破之雄州遂降睿宗經畧山東留薩里罕于河上而真定境内有賊衆自稱元帥泰王薩里罕擊破其衆執而戮之從平陜西薩里罕徇地自渭以西降德順軍又降涇原路鎮戎軍進平熙河降甘泉等二堡遂取保川城明年同璸都討平河外降寧洮安隴二寨并降下河及樂州至西寧盡降其都䕶官屬於是木波族長等皆迎降攻慶陽敗其拒者遂降其城慕洧以環州來降得城寨十三歩騎一萬於是宗弼軍敗于和尚原上褒美薩里罕而戒勵宗弼睿宗已定陜西留兵屯衝要使薩里罕總之居無何請收劔外十三州與宋王彦之軍七千人遇于沙㑹濼敗之遂克金州連破呉玠諸軍于饒風關遂取真符縣取洋州入興元府敗呉玠兵子固鎮擒其兩將薩克蘇等破宋兵盡下諸砦及仙人闗天㑹十四年為元帥右監軍天眷三年宗弼復取河南薩里罕自河中出陜西既至鳯翔擊走宋軍是時宋軍在京兆西者甚衆諸將以暑雨欲駐軍且聞宋兵九萬㑹于涇州都元帥遣河南歩卒來㑹軍薩里罕留諸將屯環慶獨以輕騎取涇州六月敗宋兵于涇州宋兵走渭州巴爾斯追擊大敗之未幾為右副元帥皇統三年封應國公賜賚甚厚熙宗出獵賜具裝馬二命射于圍中加開府儀同三司將還軍命宰臣餞之海陵升蒲州為河中府薩里罕為河中尹左副元帥如故自陜西入朝因從容言曰唐建成不道太宗以義除之即位之後力行善政後世稱賢陛下以前主失德大義廢絶力行善政則如唐太宗矣海陵聞其言色變薩里罕亦悔其言既而進封國王從行官吏皆官賞之海陵念薩里罕久握兵在外頗得士心忌之以為行臺左丞相兼左副元帥又恐不奉命陽尊以殊禮使係屬籍以玉帯璽書賜之薩里罕至汴詔諭行臺右丞相右副元帥托卜嘉無使薩里罕預軍事薩里罕不知每事輒爭之托卜嘉詭曰太師梁王以陜西事屬公以河南事屬托卜嘉今未嘗别奉詔命陜西之事薩里罕固不敢干涉托卜嘉久在河南將帥畏而附之薩里罕始至勢孤爭之不得白於朝大臣知上㫖報曰如梁王教及詔使至汴諭㫖於托卜嘉使還托卜嘉獨有附奏薩里罕不得與聞人皆知海陵使托卜嘉圖之矣㑹海陵欲除遼王舍音子孫及平章政事宗義等元帥府令史約索希海陵㫖誣薩里罕父子謀反并平章宗義尚書穆里延等約索學薩里罕手署及印文詐為契丹小字家書與其子宗安從右都監璸都上變封題作已經開拆者書紙隱約有白字作曾經水浸致字畫分明者稱御史大夫宗安於宫門外遺下此書約索拾得之其書畧曰托卜嘉自來於我不好凡事常有隄防應是知得上意伊里布丞相於我不好若遲緩分毫猜疑必落他手也又曰阿格每見此書約定月日教薩古令史却寫白字書來有司鞫問宗安不服曰使真有此書我剖肌肉藏之猶恐漏泄安得於朝門下遺之有司掠笞楚毒宗安神色不變乃寘薩古爐炭上薩古不能堪自誣服宗安謂薩古曰爾苦矣宗義被掠笞不能當亦自誣服曰我軰知不免矣不早决徒自苦宗安曰今雖無以自明九泉之下當有冤對吾終不能引屈竟不服而死使色哷琿殺薩里罕于汴族其家而無寫書及傳書者主名有哲格者能契丹小字舊嘗從薩里罕特黙者陜西舊將嘗以左副元帥事馳驛赴闕兩人者皆族誅薩里罕親屬坐是死者二十餘人潞王烏哲孫頁嚕候薩里罕于汴色哷琿執之頁嚕曰願付有司若法當同坐雖死不恨色哷琿亦殺之其家訟于朝海陵不問但賜錢二百萬璸都遷元帥左監軍加開府儀同三司約索為同知博州事賜錢三百萬謂之曰爾無自比老人老人親告朕爾以告有司設有薩里罕黨人在其間敗吾事矣老人指蕭玉也蕭玉名老人故云然約索在博州數嵗後與蕭裕謀反伏誅大定初詔復薩里罕官爵三年追封金源郡王諡莊襄以郡王品秩官為營𦵏十七年配享太宗廟庭諾延温都思忠本名伊里布阿卜薩水人太祖伐遼是時未有文字凡軍事當中覆而應密者諸將皆口授思忠思忠面奏受詔還軍傳致詔辭雖往復數千言無少誤及遼人議和思忠與烏陵阿贊謨徃來專對其問號扎拉扎拉者漢語云行人也自收國元年正月遼人遣僧嘉努來使者三往反議不决使者薩喇至遼遼人殺之遼主自將至圖們大敗歸復遣使議和太祖使呼圖克昆往書曰若不從此呼圖克昆但送至界上或如薩喇殺之惟所欲者天輔三年六月遼大册使太傅實納埒以册璽至上京一舍先取册文副録閲視文不稱兄不稱大金稱東懐國太祖不受使宗翰宗雄宗幹希尹定册文義指揚朴潤色和碩台阿薩爾髙慶裔譯契丹字使贊謨與實訥埒偕行贊謨至遼見遼人再撰册文復不盡如本國㫖意欲見遼王自陳閽者止之賛謨不顧直入閽者相與搏撠折其信牌遼人懼遽遣賛謨歸太祖再遣賛謨如遼遼人前後十三遣使和議終不可成太祖自將遂克臨潢其後伐宋思忠從宗翰軍封劉豫為齊帝思忠為傳宣使俄授穆昆從宗弼克和尚原還為同知西京留守事天眷初改蒲州防禦使元帥府在陜西者其官屬往往豪壓貧民為奴起遣工匠千人東來至河上思忠留止其人以聞詔皆還之為行臺尚書左丞是時賛謨為行臺參知政事思忠黷貨無厭賛謨鄙之兩人由是交惡海陵殺左丞相秉德于行臺賛謨妻秉德乳母也思忠因構謨殺之是嵗思忠入為尚書右丞俄進平章政事封郜國公進拜左丞相兼侍中封沂國公大德三年致仕貞元二年十月海陵率三品以上官幸思忠第使以家禮見謂思忠曰卿神氣康實習先朝舊事舍卿無能知者當為朕起共治國政對曰君之命臣敢不敬從但恨老病疎謬無以塞責耳遂命思忠乗馬從入宫拜太傅領三省事封齊國王尋拜太師兼勸農使已而罷中書門下省不置領三省事置尚書令位丞相上思忠為尚書令特置散從八人聽隨至宫省奏賜坐海陵欲定封爵制度風思忠建白之封王者皆降封異姓或封公或一品二品階惟封思忠廣平郡王賜以玉帯思忠言百官不當封妻海陵從之惟封思忠次室為郡夫人而思忠亦自謂太祖舊臣頗自任雖海陵遂非拒諫而思忠盡言無所避海陵將伐宋問諸大臣皆不敢對思忠曰不可海陵不悦謂思忠曰汝勿論可否但云何時克之思忠曰以十年為期海陵曰何久也朞月耳思忠曰太祖伐遼猶且數年今百姓愁怨師出無名江淮間暑熱湫濕不堪久居未能以嵗月期也海陵怒顧視左右若欲取兵刃者思忠無所畏恐復曰老臣厯事四朝位至公相苟有補於國家死亦何憾有頃海陵曰自古帝王混一天下然後可為正統爾耄夫固不知此汝子伊徳識書可往問之思忠曰臣昔見太祖取天下此時豈有文字耶臣年垂七十更事多矣彼乳臭子安足問哉海陵既不用思忠言運四方甲仗于中都思忠曰州郡無兵何以備盗賊海陵盡籍丁壯為兵思忠曰山後契丹諸部恐未可盡起皆不聼其後州郡盗起守令不能制契丹薩巴斡罕果反期年乃克之當是時海陵伐宋祁宰諫而死張浩進言被杖思忠見疎孔彦舟畫䇿先取兩淮他無及者正隆六年思忠薨年七十三海陵深悼惜之親臨奠賻贈加等賜金螭頭車使者監䕶給道路費大定十二年詔復烏凌阿賛謨官爵贈特進上謂宰臣曰賛謨忠實剛毅雖古人無以過與思忠有隙遂勸海陵殺之今思忠子孫皆不肖亦隂報也初思忠已構殺賛謨遂納其妻曹氏盡取其家財産章宗即位賛謨女五十九乞改𦵏詔賜𦵏地于懷州并以思忠元取家貲付之謙本名伊德累官御史中丞世宗謂之曰省部官受請託有以室家傳逹者官刑不肅士風頽敝如此其糾正之初世宗至中都多放宫人還家有稱心等數人在放遣之例所司失於檢照不得出宫心常怏怏大定二年閏二月癸巳夜遂於十六位放火延燒太和神龍殿上命近臣迹火之所發十六位宫人袁六娘等六人告實稱心等為之稱心等伏誅賞賜袁六娘六人放出宫為良謙意宫殿被火將復興工役勞民傷財乃上表乞權紓修建上使張汝弼詔謙曰朕思正隆比年徭役百姓瘡痍未復邊事未息豈遽有營繕也卿可悉之久之襲父思忠濟州明安利涉軍節度副使烏凌阿楚呼追捕逃軍至明安中謙畏其擾乃醵民財買銀賂楚呼事覺楚呼抵罪謙坐奪明安遇赦求叙上曰伊德無自與贓使復其所諾延温都烏逹太師思忠姪也天㑹間充女直字學生學問通逹觀書史工為詩選為尚書省令史除右司都事轉行臺右司郎中入為左司員外郎累官同知大興尹京師盗賊止息事無留滯再遷刑部尚書改定海軍節度使除兵部尚書改吏部正隆伐宋為武定軍都總管世宗即位遣使召之授咸平尹為北邊行軍都統改㑹寧尹都統如故是時初定斡罕人心未安烏逹為治寛簡多備禦謹斥候邉郡以寧改北京留守以亷察舉烏逹所在有能名無私過由是入拜參知政事世宗諭之曰凡在卿上者行事或不當理咨禀不從卿以所見奏聞下位有可用之才當推薦之久之屬疾上命左宣徽使敬嗣暉往視遣醫治療薨年四十七上聞悼惜之賻銀千兩重綵四十端絹四百匹勑有司致祭久之上謂侍臣曰故參知政事烏逹刑部尚書彦忠滄州節度使鄂博庫侍郎德斡郎中固納皆為人忠直後進中少有能及之者朕樂得忠直之人有如烏逹軰者乎卿等為朕舉之其見思如此昻本名璸都景祖弟伯赫之孫咱斡之子㓜時侍太祖太祖令數人兩兩角力時昻年十五太祖顧曰汝能此乎對曰有命敢不勉遂連仆六人太祖喜曰汝吾宗弟也自今勿逺左右居數日賜金牌令佩以侍年十七太祖伐遼謂之曰汝可擐甲從軍矣昻遂佩所賜金牌從軍太祖平燕策功賜甲第一區天輔六年宗翰駐北安州聞遼主延禧在鴛鴦濼遣諾延温都思忠請命於古倫貝勒杲願以所部軍追之杲不能决乃遣昻與思忠詣宗翰議其事遂定天㑹二年南京叛軍帥棟摩遣昻劉彦宗分兵討之宗望伐宋承制以為河南諸路兵馬都統稱金牌郎君及攻汴州宗弼與昻以兵三千為前鋒比暮昻先以兵千人馳至其北門時軍中遣使入城宋人不納昻諭之以事遂得入宗望至汴令棟摩逹蘭等屯于城之東北隅慮宋主遁去遣昻等率輕騎環城廵邏昻所領止八穆昆遇敵萬人與戰敗之其歩軍溺死於汴者過半七年大軍渡江敗宋兵於江上帥府遣昻等以兵追宋主宋主入㑹稽若為堅守計有兵數千列陣於郭東竹葦間諸將欲擊之昻曰此詐也不若急攻城不然將由他門逸去諸將猶豫未决而宋主果於他門以單舟入海不獲而還宗輔定陜西宗弼經畧熙秦遣昻與薩里罕領兵八千攻取河西郡縣昻等遂取寧洮安隴二寨進至河州其通判率士民迎降攻樂州其都䕶及河州安撫使郭寧偕降復進取三寨至西寧州都䕶許居簡以城降吐蕃酋長之孫趙鈐轄率其所部木波首領五人來降昻别領軍四千徃積石軍降其軍及所部五寨官吏追吐蕃鈐轄等十二人至廓州招之不下攻取之天眷元年授鎮國上將軍除東平尹明年夏宋將岳飛以兵十萬號稱百萬來攻東平東平有軍五千倉卒出禦之時桑柘方茂昻使多張旗幟於林間以為疑兵自以精兵陳于前飛不敢動相拒數日而退昻勒兵襲之至清口飛衆泛舟逆水而去時霖雨晝夜不止昻乃附水屯營夜將半忽促衆北行諸將諌曰軍士逺涉泥淖饑憊未食恐難遽行昻怒不應鳴鼓督之下令曰鼓聲絶而敢後者斬遂棄營去幾二十里而止是夜宋人來劫營無所得而去諸將入賀且問其故昻曰㳂流而下者走也泝流而上者誘我必追也今大雨泥淖彼舟行安我陸行勞士卒飢乏弓矢敗弱我軍居其下流勢不便利其襲我必矣衆皆稱善岳飛以兵十萬圍邳州甚急城中兵纔千餘守將懼遣人求救昻曰為我語守將我嘗至下邳城中西南隅有塹深丈餘可速實之守將如其教填之岳飛果自此穴地以入知有備遂止昻舉兵以為聲援飛乃退在東平七年改益都尹遷東北路招討使改崇義軍節度使遷㑹寧牧天德初改安武軍節度使遷元帥右都監轉左監軍授上京路額勒敏哈爾琿河世襲明安海陵曰汝有大功一明安不足酬也益以四穆昆昻受親管穆昆餘三穆昆讓其族兄弟拜樞密副使轉太子少保進樞密使尚書左丞相昻怒族弟妻去衣杖其脊海陵聞之杖昻五十久之拜太尉封瀋國公進太保判大宗正事封楚國公累進封莒衛齊兼樞宻太保如故海陵南伐命分諸路軍為三十二總管分𨽻左右領軍大都督府遂以昻為左領軍大都督海陵築臺于江上召昻及右領軍副大都督富勒琿謂之曰舟楫已具可以濟矣富勒琿曰舟小不可濟海陵怒詔昻與富勒琿明日先濟昻懼欲亡去抵暮海陵遣人止之曰前言一時之怒耳既而至揚州軍變海陵死世宗即位遼陽昻使人殺皇太子光英于南京遣其子寢殿實逹爾宗浩與其壻牌印祗候輝罕等奉表賀登寳位大軍北還昻恐宋人躡其後即以罷兵移書于宋二年入見世宗深慰勞之進封漢國公拜都元帥太保如故置元帥府於山東經畧邉事未幾奉遷睿宗皇帝梓宫於山陵以昻為勑𦵏使事畢還山東三年召至京師以疾薨年六十四上為輟朝親臨奠賻銀千兩重綵五十端絹五百匹昻在海陵時縱飲沉酣輒數日不醒海陵聞之常靣戒不令飲得間輒飲如故大定初還自揚州妻子為置酒私第未數行輒臥不飲其妻大氏海陵庶人從母姊也怪而問之昻曰吾本非嗜酒者但向時不以酒自晦則汝弟殺我久矣今遇遭明時正當自愛是以不飲聞者稱之睦於兄弟尤善施予其親族有貧困者必厚給之至於茵帳衣衾器皿僕馬之屬常預設於家即命駕相就為具歡樂終日盡以遺之即日使富足人或以子孫計為言答曰人各有命但使其能自立爾何至為子孫奴耶君子以為逹賛曰薩里罕温都思忠璸都皆有功舊臣當天㑹皇統之際戰勝攻取可謂壯哉及海陵之世﨑嶇嫌忌薩里罕既自以言致疑猶與大臭辨爭軍事何見幾之不早也烏陵阿賛謨亷直自奮思忠擠之於死自謂固結海陵堅若金石豈意執議不合而遽棄耶始之不以道未有能終者也且思忠之最可罪者構害賛謨又納其室而敚其貲此何異於殺越人于貨者乎隂報不在其身在其子孫亦已晩矣正隆之末璸都位三公居上將内不肯與謀外不肯與戰逼側趑趄苟免自全大臣之道固若是乎髙楨遼陽渤海人五世祖模翰仕遼官至太師楨少好學嘗業進士斡魯討髙永昌已下瀋州永昌懼偽送欵以緩師是時楨母在瀋州遂來降告以永昌降欵非誠斡魯乃進攻既破永昌遂以楨同知東京留守事授明安天㑹六年遷尚書左僕射判廣寧尹加太子太傅在鎮八年政令清肅吏畏而人安之十五年加太子太師提㸃河北西路錢帛事天眷初同簽㑹寧牧及熙宗幸燕兼同知留守封戴國公改同知燕京留守魏王道濟出守中京以楨為同判俄改行臺平章政事為西京留守封任國公是時奚霫軍民皆南徙穆昆布木者因之嘯聚為盗海陵患之即以楨為中京留守命乗驛之官責以平賊之期賊平封河内郡王海陵至中京楨警夜嚴肅有近侍馮僧嘉努李街喜等皆得幸海陵嘗夜飲干禁楨杖之瀕死由是權貴皆震懾遷太子太保行御史大夫封莒王䇿拜司空進封代王太子太保行御史大夫如故楨久在臺彈劾無所避每進對必以區别流品進善退惡為言當路者忌之薦張忠輔馬諷為中丞二人皆險詖深刻欲令以事中楨正隆例封冀國公楨因固辭曰臣為衆小所嫉恐不能免尚可受封爵耶海陵知其忠直慰而遣之及疾革書空獨語曰某事未决某事未奏死有餘恨薨年六十九海陵悼惜之遣使致奠賻贈加等楨性方嚴家居無聲伎之奉雖甚暑未嘗解衣緩帯對妻孥危坐終日不一談笑其簡黙如此白彦敬本名約索博勒和部族人初名彦恭避睿宗諱改焉祖額布根父阿蘇仕遼為率府率彦敬善騎射起家為吏補元帥府令史伐宋為錢帛司都管勾立三省選為尚書省令史除都元帥府知事招諭諸部授以金牌行數千里有功超遷兵部郎中熙宗罷統軍司改招討司遣彦敬分僚屬收牌印諭諸部隸招討司還為本部侍郎遷大理卿出為通州防禦使改刑部侍郎怨家告誣開府慎思與西北路部族謀叛彦敬鞫得其實海陵嘉之遷簽書樞宻院事以便宜措置邉防正隆六年調諸路兵伐宋及調民馬使彦敬主㑹寧扶餘呼爾哈三路事改吏部尚書充南征萬户遷樞宻副使契丹薩巴反樞宻使布薩呼圖等以無功坐誅以彦敬為北靣行營都統與副統赫舍哩志寧以便宜往賜御服衣襖行至北京聞南征諸軍逃歸者皆奔東京欲推戴世宗彦敬與志寧謀隂結㑹寧尹完顔富色里利涉軍節度使通吉義圖之世宗已即位使舒穆嚕伊德伊喇赫伯等九人招彦敬志寧彦敬拒之使伊德跪伊德不屈皆殺之及完顔黙音將兵攻北京彦敬使偏將率兵拒於建州之境而通吉義先歸世宗富色里稱疾不至世宗宻遣人乗夜揭牓於北京市購以官賞彦敬志寧恐為人圖已遂降以為哈斯罕節度使不數月召為御史大夫斡罕僣帝號諸軍馬瘦弱遣彦敬往西北路招討司市馬得六千餘匹斡罕敗西走山後完顔思敬以新馬三千備追襲彦敬屯于夏國兩界間斡罕平召還為兵部尚書出為鳯翔尹改太原尹兼河北東路兵馬總管㝷改河中尹大定九年卒于官張景仁字夀甫遼西人累官翰林待制貞元二年與翟永固俱試禮部進士以尊祖配天為賦題忤海陵㫖語在永固傳大定二年布薩忠義伐宋景仁掌其文辭宋人議和朝廷已改奉表為國書稱臣為姪但不肯世稱姪國往復凡七書然後定其書皆景仁為之世宗稱其能嘗曰今之文章如張景仁與宋人往復書指事逹意辨而裁眞能文之士也五年罷兵入為翰林直學士七年遷侍講八年為詳讀官宋國書中有寳鄰字景仁奏鄰字太渉平易上問累年國書有鄰字否命一一校勘六年書中亦有之上責問六年詳讀官劉仲淵右丞石琚亦請罪曰臣嘗預六年詳讀上曰此有司之過安得一一責宰臣邪詔有司就諭宋臣王瀹使歸告其主後日國書不得復爾仲淵時為禮部侍郎降石州刺史景仁遷翰林學士兼同修國史久之上召景仁讀陳言文字上問事欵幾何景仁率易少周密對曰二十餘事復曰其中如某事某事十事可行餘皆無謂也明日上召景仁責之曰卿昨言可行者朕觀之中復有不可行者卿謂無謂者中亦有可行者朕未嘗使卿分别可否卿輒專可否何也自今戒之十年兼太常卿學士同修國史如故轉承㫖兼修國史改河南尹二十一年召為御史大夫仍兼承旨修國史世宗謂景仁曰卿博學老儒求如古之御史大夫然後行之斯謂稱矣不能如古之人衆人不獨誚卿亦謂朕不能知人卿醉中頗輕脱失言當以酒為戒初朝臣言景仁有文藝而頗率易不可任臺察景仁被詔就臺中治監察罪輒以便服視决罰上聞之責景仁曰朕初用卿為大夫或言卿不可居此官今果不用故事率易如此卿自慎不然黜罰及矣景仁頓首謝未幾詔𦵏元妃季氏于海王莊平章政事烏庫哩元忠提控𦵏事都水監丞髙杲夀治道路不如式元忠不奏决之四十景仁劾奏元忠輒斷六品官無人臣禮上曰卿劾奏甚當使左宣徽使富察鼎夀傳詔戒勑元忠曰監丞六品有罪聞奏今乃一切趨辨擅决六品官法當如是耶御史在尊朝廷汝當自咎勿復再元忠尚豫國公主怗寵自任倨慢朝士景仁劾之朝廷肅然是嵗薨贊曰髙楨以舊勞為御史大夫剛明自任䋲治無所避幾不免於怨憎之茶毒直已而行自古難之白彦敬不受大定之詔而世宗賢之嚮使久在此位其深謀讜論必有竦動人者張景仁儒者之勇廷論元忠正矣金史卷八十四
