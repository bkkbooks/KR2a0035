body:
  text: 金史卷一百十九元中書右丞相總裁托克托等修列傳第五十七鈕祜禄納新劉天起附完顔羅索烏庫哩鎬本名噶老張天綱完顔仲德本名呼沙呼鈕祜禄納新由任子入官或曰策論進士天興初倅開封府以嚴輪稱其年五月擢為陳州防禦使時兵戈搶攘道路不通納新受命毅然䇿孤騎由間道以徃陳自兵興軍民皆避遷他郡納新為之擇官吏明號令完城郭立廬舍實倉廩備器械未幾聚流亡數十萬口米一斛直白金四兩市肆喧閧如汴之闤闠京城危困之民望而歸者不絶遂指以為東南生路明年哀宗走歸德改陳州為金興軍馳使褒諭以納新為節度使俄拜參知政事行尚書省于陳於是納新立五都尉以将其兵建威来準虎威富察哈達振武李順兒振威王義果毅完顔某凡招撫司至者皆使隸都尉司是時交戰無虚日州所屯軍十萬有餘納新與官屬謀曰大兵日至而吾州糧有盡奈何乃減軍所給月一斛五斗者作一斛又作八斗又作六斗將領則不給人心稍怨故李順兒崔都尉因而有異志劉提控及完顔博碩庫提控者預焉納新知其謀常以兵自防及聞大元兵往朱仙鎮市易納新遣五都尉軍各二百人以李順兒副都尉崔某將之襲項城寨孫鎮撫者召順兒議兵事孫至于其家順兒已擐甲孫欲觀其刀順兒拔示之孫色動即出門奔去順兒追殺之乃上馬引兵二百人入省説軍士曰行省剋减軍糧汝輩欲飽食則從我不欲則從行省於是省中軍士皆坐不起納新聞變走後堂追殺之提控劉某知害解其虎􅀢以與順兒并殺其子姪婿及鄉人王都尉順兒令五都尉軍皆甲守街曲自稱行省署元帥都尉以劉提控語不順斬之坐中明日遂遣赫舍哩正之送欵于汴崔立乃遣其弟倚就加順兒淮陽軍節度使行省如故未幾虎威都尉富察哈逹與髙元帥者盡殺順兒之徒舉城走蔡州大兵覺追及孫家林老糼數十萬少有脱者初納新聞崔立之變遣人探其事情而順兒崔都尉亦密令人給搆崔立適與納新所遣者同往同還順兒懼其謀泄故發之益速納新亦知其謀故遣襲項城欲因其行襲殺之然已為所先劉天起者起於匹夫初甚庸鄙汴京戒嚴嘗上書以干君相願暫假一職以自効每言戰國兵法平章博索等信之令景徳寺監造革車三千兩天興元年授都招撫使佩金符召見乞往陳州運糧上從之一時皆竊笑其僥倖及至陳行軍殊有方略每出戰數有功陳人甚倚重之順兒之變天起偃蹇不從為所殺同時一唐古招撫者亦不屈而死完顔羅索三人皆内族也時以其名同故各以長幼别之正大八年慶善努棄京兆適鷹揚都尉大羅索運軍器至白鹿原遇大兵與戰兵刃既盡以絛繫掉金牌力戰而死九年正月大兵至襄城元帥中羅索小羅索以馬軍三千遇之於汝墳時大兵以三四十騎入襄城驅驛馬而出又入東營殺一千夫長金人始覺之兩羅索以正旦飲將校皆醉不能軍遂敗退走許州㑹中使召入京師天興二年正月河朔軍潰哀宗走歸徳中羅索為北面總帥小羅索左翼元帥收潰卒及將軍𤓰爾佳九十奔蔡州蔡帥鳥庫哩噶老知其跋扈不納遂走息州息帥舒穆嚕玖珠納之時白華以上命送虎符於玖珠為息州行帥府事玖珠出近侍好自標致騶從盈路三人妬之各以招集勤王軍士為名得五六百人州給以甲仗久之漸生猜貳玖珠亦招負販牙儈數百人為虎子軍夜則擐甲為備一日玖珠使一萬戸巡城三帥執而驅之使大呼云勿學我欲開西門反即斬之乃召玖珠玖珠欲不往懼州人及禍乃從三百卒以往三帥令甲士守街曲玖珠從者過處處執之玖珠獨入三帥問汝何為欲反玖珠曰我何縁反三帥怒欲殺者久之小羅索意稍觧頗為救䕶得不殺乃鎖之以𤓰爾佳九十為帥兼權息州蔡帥噶老聞玖珠為三帥所誣上奏辨之三帥亦捃摭玖珠之過上聞朝廷主噶老之辨且不直三帥六月赦至蔡噶老懼玖珠為三帥所誅遣二卒馳送詔書於息乃得免及上將幸蔡密召中羅索引兵來迓羅索遲疑久之乃率所招卒奉迎七月上遣近侍局使入息州括馬即召玖珠玖珠至與中羅索辨於上前時中羅索已授同簽樞密院事上不欲使之終訟乃罷玖珠帥職授戸部郎中以烏庫哩呼嚕為息州刺史時有土豪劉禿兒馬安撫者自蔡朝還以軍儲不給叛入宋州之北闗為所焚是時城中軍無幾日日有叛去者且覘知宋人有窺息意息帥懼上奏請益兵為備朝廷以參知政事穆延鳥登行省事于息州中羅索以同簽樞密院事為總帥小羅索以副㸃檢為元帥王進為彈壓帥𤓰爾佳九十都尉以忠孝馬軍二百步軍五百屬之行省院於息將行上諭之日北兵所以常取金勝者恃北方之馬力就中國之技巧耳我實難與之敵至於宋人何足道哉朕得甲士三千縱横江淮間有餘力矣卿等勉之八月壬辰行省遣人奏中渡店之捷初烏登等赴息既至之夜潛遣忠孝軍百餘騎襲宋營於中渡我軍皆北語又散漫似之宋人望之駭愕奔潰斬獲甚衆復奏元帥張閏不遵約束失亡軍士乞正典刑羅索表閏無罪上遣人赦之比至已死獄中蓋閏為羅索腹心玖珠之獄皆閏𤼵之烏登廉得其事因其失律而誅之也九月以呼嚕退縮不能撫御民多叛去奪其職以𤓰爾佳九十權息州事十一月宋以軍二萬來攻城中食盡乃和糴既而括之每石止留一斗并括金帛衣物城中皆無聊矣前兩月蔡州以軍䕶老幼萬口來就食北兵覺之追及於二十里之外至息者才十餘人至是蔡問不通行省及諸帥日以歌酒為事聲樂不絶下及軍士强娶寡婦幼女絶滅人理無所不至三年甲午正月蔡凶問至諸帥殺之以滅口然民間亦頗有知者初諸帥欲北降而逓相猜忌無敢先𤼵者蔡信閧然諸帥屏人聚議皆言送欵南中之為便時李裕為睦親府同僉和勒端國信使下經厯官乃使送欵于宋發喪設祭諡哀宗曰昭宗州民奉行省為領省丞相總帥左平章皆娶婦十三日舉城南遷宋人焚州樓櫓州人老幼渡淮南行入羅山委曲之信陽北兵見火起追及之無有免者且誅索行省已下官屬于宋宋人令官屬入城託犒賞從萬戸以上六七百人皆殺之軍中亦有奮命死敵者宋人論諸軍行省已下有罪已處置汝等就迷魂寨安屯遂以軍防之既而與北軍接南軍斂避一軍悉為所殺烏庫哩鎬本名噶老東北路招討司人由䕶衛起身累官慶陽總管天興􅀄遷蔡息陳潁等州便宜總帥二年哀宗在歸徳富察官努國用安欲上幸海州未决㑹鎬餫宋四百餘斛至歸徳且請幸蔡上意遂決先遣直學士鳥庫哩布希如蔡告蔡人以臨幸之意六月徴蔡息軍馬來迓以蔡重鎮且慮有不測詔鎬勿逺迎辛卯車駕發歸徳時久雨朝士扈從者徒行泥水中掇青棗為糧數日足脛盡􅔨參政天綱亦然壬辰至亳上黄衣皂笠金兔鶻帶以青黄旗二導前黄繖擁後從者二三百人馬五十餘匹而已行次城中僧道父老拜伏道左上遣近侍諭以國家涵養汝輩百有餘年今朕無德令爾塗炭朕亦無足言者汝輩無忘祖宗之徳可也皆呼萬歲泣下留一日進亳之南六十里避雨雙溝寺中蒿艾滿目無一人迹上太息曰生靈盡矣為之一慟是日小羅索自息來迓得馬二百己亥入蔡蔡之父老干人羅拜於道見上儀衛蕭條莫不感泣上亦歔欷者乆之七月以鎬為御史大夫總帥如故初鎬守蔡門禁甚嚴男女樵采必以墨識其面人有以錢出者十取一分有半以贍軍上至蔡或言其非便即弛其禁時大兵去逺啇販頗集小民鼓舞以為復見太平公私宿釀一日俱盡郾城土豪盧進殺其長吏自稱招撫使以前闗陜帥府經歴范天保為副至是天保來見進麥三百石及獐鹿脯茶蜜等物遂賜進金牌加天保官自是進物者踵至旣而遣内侍殿頭宋珪與鎬妻選室女備後宮已得數人右丞呼沙呼諌曰小民無知將謂陛下駐蹕以來不聞恢復逺略而先求處女以示久居民愚而神不可不畏上曰朕以六宮失散左右無人故令採擇今承規誨敢不敬從止留解文義者一人餘皆放遣是時從官近侍率皆窮乏悉取給於鎬鎬亦不能人滿其欲日夕交譛於上甚以尚食闕供為言上怒雖擢拜大夫而召見特疎小羅索之在息州也與舒穆嚕玖珠有隙怨鎬為玖珠辨曲直及上幸蔡羅索見於雙溝因厚誣鎬罪上頗信之鎬自知被䜛憂憤欝抑常稱疾在告㑹前參知政事實嘉紐勒歡姪大安來以紐勒歡無反狀為官努所殺白尚書省求改正尚書省以聞上曰朕嘗謂紐勒歡反邪而無迹可尋謂不反邪朕方暴露遣人徵援兵彼留精鋭自防發其羸弱者以來既到睢陽彼厚自奉養使朕醯醬有闕朕為人君不當語此細事但四海郡縣孰非國家所有坐保一城臣子之分彼乃自負而有驕君上之心非反而何然朕方駕馭人材以其艱難録功忘過此其時也其釐正之羣臣知上意之在鎬也數為右丞仲徳言之仲徳每見上必稱鎬功業宜令預參機務又薦以自代上怒少解及參政穆延烏登行省息州鎬遂以御史大夫權參知政事九月大兵圍蔡鎬守南面忠孝軍元帥蔡巴爾副之未幾城破被執以招息州不下殺之烏庫哩先生者本貴人家奴為全真師佯為狂態祼顛露足綴麻為衣人亦謂之麻帔先生宣宗嘗召入宮問以秘術因出入長大主家殊有穢迹上微聞之勑有司掩捕已逃去正大末從鎬來官汝南人皆知與其妻通而鎬不知生不自安求出鎬為營道宇親率僧道送使居之車駕將至蔡生欲遁無所往因自言能使軍士服氣不費糧右丞仲徳知其妄乃奏欲如田單假神師退敵之意授一真人之號旋出竒計北兵信巫必駭異之或可以有成功參政天綱以為不可遂止復求入見言有詭計可以退敵及見長揖不拜且多大言欲出説大帥布展為脱身計時郎中伊喇克忠員外郎王鶚具以向者麻帔為言上怒殺之贊曰晉劉越石長於撫納短於駕馭以故取敗鈕祜禄納新陳州之事殆類之矣三羅索皆金内族唯大羅索死得其所其兩羅索䜛賊人也襄城事急醉不能軍乃逭一死金失政刑一至於是烏庫哩鎬幸蔡之請雖非至謀區區效忠以䜛見忌哀宗之明蓋可知矣張天綱字正鄉霸州益津人也至寧元年詞賦進士性寛厚端直論議醇正造次不少變累官咸寧臨潼令入補尚書省令史拜監察御史以鯁直聞陞戸部郎中權左右司員外郎哀宗東幸遷左右司郎中扈從至歸徳改吏部侍郎知元帥官努有反狀屢為上言之上不從官努果變遂擢天綱權參知政事及從上遷蔡留亳州適軍變天綱以便宜授作亂者官州頼之以官及蔡轉御史中丞仍權參政扶溝縣招撫司知事劉昌祖上封事請大舉伐宋其略云官軍在前饑民在後南踐江淮西入巴蜀頗合上意上命天綱面詰其藴藉召與語無可取者然重違上命且恐閉塞言路奏以為尚書省委差官䕶衛鈕祜禄温綽近侍局直長鈕祜禄色埒黙奉御陳謙權近侍局直長内族泰和四人以食不給出怨言乞往陳州就食天綱奏令監之出門任所往才出及汝南岸遇北兵皆見殺時人快之妖人烏庫哩先生者自言能使軍士服氣可不費糧右丞仲徳援田單故事欲假其術以駭敵語在烏庫哩鎬傳上頗然之天綱力辨以為不可遂止且曰向非張天綱幾為此賊所誑軍使舒穆嚕和爾者求見仲徳自謂有竒計退敵出馬面具如獅子狀而惡别制青麻布為足尾因言北兵所恃者馬而以欲制其人先制其馬如我軍進戰尋少却彼必求追我以馴騎百餘皆此狀仍繫大鈴于頸壯士乘之以突彼騎騎必驚逸我軍皷譟繼其後此田單所以破燕也天綱曰不可彼衆我寡此不足恃縱使驚去安保其不復來乎恐徒費工物秪取敵人笑耳乃罷之蔡城破為宋將孟珙得之檻車械至臨安備禮告廟既而命臨安知府薛瓊問曰有何面目到此天綱對曰國之興亡何代無之我金之亡比汝二帝何如瓊大叱曰曵去明日遂奏其語宋主召問曰天綱真不畏死耶對曰大丈夫患死之不中節爾何畏之有因祈死不已宋主不聴初有司命供狀必欲書虜主天綱曰殺即殺馬用狀為有司不能屈聴其所供天綱但書故主而已聞者憐之後不知所終完顏仲徳本名呼沙呼海蘭路人少穎悟不羣讀書習䇿論有文武才初試補親衛軍雖備宿衛而學業不輟中泰和三年進士第歴仕州縣貞祐用兵辟充軍職嘗為大元兵所俘不踰年盡解其語尋率諸降人萬餘來歸宣宗召見竒之授邳州刺史兼從宜増築城壁匯水環之州由是可守哀宗即位遙授同知歸徳府事同簽樞密院事行院於徐州徐州城東西北三面皆黄河而南獨平陸仲徳疊石為基増城之半復浚隍引水為固民賴以安正大五年詔闗陜以南行元帥府事以備小闗及扇車回時北兵叩闗仲徳適與前帥鄂屯阿里布酌酒更代而兵猝至遂驅而東阿里布素無所守之䇿為有司所劾罪當死仲徳上書引咎以謂北兵越闗之際符印已交安得歸罪前帥臣請受戮上義之止杖阿里布而貰其死六年移知鞏昌府兼行總帥府事時陜西諸郡已殘仲徳招集散亡得軍數萬依山為柵屯田積穀人多歸焉一方獨得小康號命明肅至路不拾遺八年四月詔授仲徳鞏昌行省及虎符銀印天興元年九月拜工部尚書參知政事行尚書省事於陜州時烏登新敗陜州殘破仲徳復立山寨安撫軍民㑹上以蠟丸書徵諸道兵八援行省院帥府往往觀望不進或中道遇兵而潰惟仲徳提孤軍千人歴秦藍商鄧擷果菜為食間闗百死至汴至之日適上東遷妻子在京師五年矣仲徳不入其家趨見上於宋門問東幸之意知欲北渡力諌云北兵在河南而上逺徇河北萬一無功得完歸乎國之存亡在此一舉願加審察臣嘗屢遣人奏秦鞏之間山巖深固糧餉豐贍不若西幸依險固以居命帥臣分道出戰然後進取興元經咯巴蜀此萬全䇿也上已與博索議定不從然素重仲徳且嘉其赴難進拜尚書省右丞兼樞密副使軍次黄陵二年正月車駕至歸徳以仲徳行尚書省于徐州既至遣人與國用安通問沛縣卓翼孫璧冲者初投用安用安封翼為東平郡王璧冲博平公升沛縣為源州已而翼璧仲來歸仲徳畀舊職令統河北諸砦行源州帥府事用安累檄王徳全入援不赴仲徳至徐徳全大恐求赴歸徳仲徳留之遣人納奏帖云徐州重地徳全不宜離鎮仲徳虚州廨不居亦無兵衛自防日以觀書為事而徳全自疑益甚二月魚山總領張瓛作亂殺元帥完顏呼圖降北仲徳累議討之徳全不從即領麾下十許人親勸民兵得三百人經往魚山而從宜嚴禄己誅瓛反正仲徳撫慰軍民而還有曹總領者盗御馬東行制㫖諭行省討之仲徳既殺賊徳全欲功出已殺曹黨四十八人三月阿勒楚爾攻蕭縣游騎至徐徳全馬悉為所邀仲徳時往宿州徳全以失馬故始議救蕭縣遣張元哥苗秀昌率騎八百以往未及交戰元哥退走北兵掩之皆為所擒殺之蕭縣遂破四月仲徳陽以闗糧往邳州州官出迎就執徳全并其子殺之餘黨之外一無所問闔郡稱快􅀄完顏呼圖以遥授徐州節度往帥嚴禄軍於永州北保安鎮時禄以為從宜在碭山數年又得士心呼圖到軍士不悦二月辛卯夜遂為總領張瓛崔振所害吏部郎中張敏修呼圖下經歴官乃以軍變脅嚴禄降北禄佯應之隂召永州守陳立副招撫郭昇㑹諸義軍赴保安鎮誅作亂者軍夜至禄遣敏修招瓛振計事二人不疑介胄而至及其黨與皆為禄所殺徐州去保安百里行省聞之來討㑹禄已反正乃以便宜授禄行元帥左都監就佩呼圖虎符朝廷復授禄遥領歸徳知府兼行帥府事未幾大元將阿勒楚爾至保安禄夜遁後禄聞官努變一軍頓徐宿幾一月遂投漣水敏脩入徐五月詔仲徳赴徳在時官努已變官屬懼為所紿勸勿往仲徳曰君父之命豈辨真偽耶死亦當行尋使者至果官努之詐六月官努誅詔仲徳議遷蔡仲徳雅欲奉上西幸因贊成及蔡領省院事無鉅細率親身為之選士括馬繕治甲兵未嘗一日無西志近侍左右久困睢陽幸即汝陽之安皆娶妻營業不願遷徙日夕為上言西行不便未幾大兵梗路竟不果行仲徳每深居燕坐瞑目太息以不得西遷為恨是月上至蔡命有司修見山亭及同知衙為遊息之所仲徳諫曰自古人君遭難播越于外必痛自刻苦貶損然後可以克復舊物况今諸郡殘破保完者獨一蔡耳蔡之公廨固不及宮闕萬一万之野處露宿則有加矣且上初行幸已嘗勞民葺治今又興土本之役以求安逸恐人心解弛不足以濟大事上遽命止之八月定進馬遷賞格毎甲馬一匹或二匹以上遷賞有差自是西山帥臣范真姬汝作等各以馬進凡得千餘匹以穆延烏登領之又遣使分詣諸道徵兵赴蔡得精鋭萬人又以器甲不完命工部侍郎珠嘉耀珠監督修繕不踰月告成軍威稍振扈從諸人苟一時之安遂以蔡為可守矣魯山元帥元志領軍千餘來援時諸帥往往擁兵自固志獨冒險數百里且戰且行北至蔡幾喪其半上表異之賜以大信牌升為總帥息州忠孝軍帥蔡巴爾王善爾亦來援壬午忠孝軍提控李徳率十餘人乗馬入省大呼以月糧不優幾於罵詈郎中伊喇克忠白之仲徳仲徳大奴縳徳堂下杖之六十上諭仲徳曰此軍得力方欲倚用卿何不容忍責罸乃爾仲徳曰時方多故録功隱過自陛下之徳至于將帥之職則不然小犯則決大犯則誅強兵悍卒不可使一日不在紀律蓋小人之情縱則驕驕則難制睢陽之禍豈獨官努之罪亦有司縱之太過耳今欲更易前轍不宜愛克厥威賞必由中罰則臣任其責軍士聞之至于國亡不敢有犯九月蔡城戒嚴行六部尚書富察世達以大兵將至請諭民併收晩田不及者踐毀之毋資敵制可丙辰詔裁冗員汰冗軍及定官吏軍兵月俸自宰執以下至于皂隸人月支六斗初有司定減糧人頗怨望上聞之欲分軍為三上軍月給八斗中七斗下六斗人復怨不均乃立射格而上中軍輙多受賞連中者或面賜酒人益為勸且隂有所増而人不知仲徳之謀也甲子分軍方守四面十月壬申朔大兵壕壘成耀兵城下旗幟蔽天城中駭懼及暮焚四闗夷其墻而退十一月辛丑大兵以攻具傅城有司盡籍民丁防守不足則括婦女壯健者假男子衣冠使運木石蔡既受圍仲徳營畫禦備未嘗一至其家拊存軍士無不得其懽心將校有戰亡者親為賻祭哭之盡哀己丑西城破城中前期築柵浚濠為備雖克之不能入也但於城上立柵南北相去百餘步而已仲徳摘三面精鋭日夕戰禦終不能拔三年正月庚子朔大兵以正旦㑹飲鼓吹相接城中飢窘愁嘆而已圍城以來戰殁者四帥三都尉其餘總帥下不可勝紀至是盡出禁近至於舍人牌印省部掾屬亦皆供役戊申大兵鑿西城為五門整軍以入督軍鏖戰及暮乃退聲言來日復集己酉大兵果復來仲徳率精兵一千巷戰自卯及已俄見子城火起聞上自縊謂將士曰吾君已崩吾何以戰為吾不能死亂兵之手吾赴汝水從吾君矣諸君其善為計言訖赴水死將士皆曰相公能死吾輩獨不能耶於是參政富珠哩羅索烏凌阿呼圖總帥元志元帥王善爾赫舍哩栢壽烏庫哩和勒端及軍士五百餘人皆從死焉仲徳狀貌不踰常人平生喜怒未嘗妄發聞人過常護諱之雖在軍旅手不釋卷門生故吏每以名分教之家貧敝衣糲食終其身晏如也雅好賓客及薦舉人才人有寸長極口稱道其掌軍務賞罰明信號令嚴整故所至軍民為用至危急死生之際無一士有異志者南渡以後將相文武忠亮始終無瑕仲徳一人而已贊曰金之亡不可謂無人才也若完顔仲徳張天綱豈非將相之器乎昔者智伯死又無後其臣豫讓不忘國士之報君子謂其無所為而為之真義士也金亡矣仲徳天綱諸臣不變所守豈愧古義士哉金史卷一百十九
