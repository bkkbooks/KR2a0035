body:
  text: 金史卷八十三元中書右丞相總裁托克托等修列傳第二十一張通古張浩張汝霖張𤣥素張汝弼耶律安禮納哈塔椿年本名烏頁祁宰張通古字樂之易州易縣人讀書過目不忘該綜經史善屬文遼天慶二年進士第𥙷樞密院令史丁父憂起復懇辭不獲因遯去屏居興平太祖定燕京割以與宋宋人欲収人望召通古通古辭謝隠居易州太寧山下宗望復燕京侍中劉彦宗與通古素善知其才召為樞密院主奏改兵刑房承旨天㑹四年初建尚書省除工部侍郎兼六部事高慶裔設磨勘法仕宦者多奪官通古亦免去遼王宗幹素知通古名惜其才遣人諭之使自理通古不肯曰多士皆去而巳何心獨求用哉宗幹為論理之除中京副留守為詔諭江南使宋主欲南靣使通古北靣通古曰大國之卿當小國之君天子以河南陜西賜之宋宋約奉表稱臣使者不可以北靣若欲貶損使者使者不敢傳詔遂索馬欲北歸宋主遽命設東西位使者東靣宋主西靣受詔拜起皆如儀使還聞宋已置戍河南謂送伴韓肖胄曰天子裂壤地益南國南國當思圖報大恩今輒置守戍自取嫌疑若興師問罪將何以為辭江左且不可保况齊乎肖胄惶恐曰敬聞命矣即馳白宋主宋主遽命罷戍通古至上京具以白宗幹且曰及其部置未定當議収復宗幹喜曰是吾志也即除參知行臺尚書省事未㡬詔宗弼復取河南通古請先行至汴諭之比至汴宋人巳去矣或謂通古曰宋人先退詐也今聞將自許宿來襲我通古曰南人宣言来者正所以走耳廼使人覘之宋人果潰去宗弼撫髀笑曰誰謂書生不能曉兵事哉河南卒孫進詐稱皇弟按察大王謀作亂是時海陵為相内懷覬覦欲先除熙宗弟胙王常勝因孫進稱皇弟大王遂指名為胙王以誣搆之熙宗自太子濟安薨後繼嗣未定深以為念費摩后多專制不得肆意後宫頗鬱鬱因縱酒往往迷惑妄怒手刃殺人及海陵中傷胙王熙宗以為信然不疑遣䕶衛費摩就汴京鞫治行臺知熙宗意在胙王導引孫進連屬之通古執其咎極力辨正及孫進引服蓋假託名稱將以感衆規取財物耳實無其人也塔斯奏状海陵譖之曰塔斯且將徼福於胙王熙宗益以海陵為信遂殺胙王并塔斯殺之行臺諸人乃責通古曰為君所誤今坐死矣通古曰以正獲罪死賢於生海陵既殺胙王不復縁害他人由是坐止塔斯行臺不坐天徳初遷行臺左丞進拜平章政事封譚王改封鄆王以疾求解機務不許拜司徒封瀋王海陵御下嚴厲収威柄親王大臣未嘗少假以顔色惟見通古必以禮貎㑹磁州僧法寳欲去張浩張暉欲留之不可得朝官又有欲留之者海陵聞其事詔三品以上官上殿責之曰聞卿等每到寺僧法寳正坐卿等皆坐其側朕甚不取佛者本一小國王子能輕舍富貴自苦修行由是成佛今人崇敬以希福利皆妄也况僧者往往不第秀才市井游食生計不足乃去為僧較其貴賤未可與簿尉抗禮閭閻老婦迫於死期多歸信之卿等位為宰輔乃復效此失大臣體張司徒老成舊人三教該通足為儀表何不師之召法寳謂之曰汝既為僧去住在已何乃使人知之法寳戰懼不知所為海陵曰汝為長老當有定力今乃畏死耶遂於朝堂杖之二百張浩張暉杖二十正隆元年以司徒致仕進封曹王是年薨年六十九通古天資樂易不為表襮雖居宰相自奉如寒素焉子沉天徳三年賜楊建中牓及第張浩字浩然遼陽渤海人本姓髙東明王之後曽祖霸仕遼而為張氏天輔中遼東平浩以䇿干太祖太祖以浩為承應御前文字天㑹八年賜進士及第授柲書郎太宗將幸東京浩提㸃繕修大内超遷衛尉卿權簽宣徽院事管勾御前文字初定朝儀求養親去職起為趙州刺史官制行以中大夫為大理卿天眷二年詳定内外儀式厯户工禮三部侍郎遷禮部尚書田㲄黨事起臺省一空以浩行六部事簿書叢委决遣無留人服其才以疾求外補除彰徳軍節度使遷燕京路都轉運使俄改平陽尹平陽多盗臨汾男子夜掠人婦浩捕得搒殺之盜遂衰息近郊有淫祠郡人頗事之廟祝田主爭香火之利累年不决浩撤其祠屋投其像水中強宗㸃吏屏迹莫敢犯者郡中大治乃繕葺堯帝祠作擊壌遺風亭海陵召為户部尚書拜參知政事天徳二年丁母憂起復參知政事進拜尚書右丞天徳三年廣燕京城營建宫室浩與燕京留守劉筈大名尹盧彦倫監䕶工作命浩就擬差除既而暑月工役多疾疫詔發燕京五百里内醫者使治療官給藥物全活多者與官其次給賞下者轉運司舉察以聞貞元元年海陵定都燕京改燕京為中都改析津府為大興府浩進拜平章政事賜金帶玉帶各一賜宴于魚藻池浩請凡四方之民欲居中都者給復十年以實京城從之拜尚書右丞相兼侍中封潞王賜其子汝霖進士及第未㡬改封蜀王進拜左丞相正隆二年改封魯國公表乞致仕海陵曰人君不明諫不行言不聴則宰相求去宰相老病不能任事則求去卿於二者何居浩對曰臣羸病不堪任事宰相非養病之地也是以求去不許海陵欲伐宋將幸汴而汴京大内失火於是使浩與敬嗣暉營建南京宫室浩從容奏曰往嵗營治中都天下樂然趨之今民力未復而重勞之恐不似前時之易成也不聼浩朝辭海陵問用兵利害浩不敢正諌乃婉詞以對欲以微止海陵用兵奏曰臣觀天意欲絶趙氏乆矣海陵愕然曰何以知之對曰趙構無子樹立疎屬其勢必生變可不煩用兵而服之海陵雖喜其言而不能從也浩至汴海陵時時使宦者梁珫來視工役凡一殿之成費累鉅萬珫指曰某處不如法式輒撤之浩不能抗而與之均禮汴宫成海陵自燕来遷居之浩拜太傅尚書令進封秦國公海陵至汴累月不視朝日治兵南伐部署諸將浩欲奏事不得見㑹海陵遣周福兒至浩家浩附奏曰諸將皆新進少年恐誤國事宜求舊人練習兵者以為千戸穆昆而海陵部署已是惡聞其言乃杖之海陵自將發汴京皇后太子居守浩留治尚書省事世宗即位於遼陽揚州軍變海陵遇害都督府使使殺太子光英于南京浩遣戸部員外郎完顔黙音上賀表明年二月浩朝京師入見世宗謂曰朕思天位惟艱夙夜惕懼不遑寧處卿國之元老當戮力贊治宜令後世稱揚徳政毋失委任之意也俄拜太師尚書令封南陽郡王世宗曰卿在正隆時為首相不能匡救惡得無罪營建兩宫殫竭民力汝亦嘗諫故天下不以咎汝惟怨正隆而卿在省十餘年練達政務故復用卿為相當自勉毋負朕意浩頓首謝居數日世宗謂浩曰卿為尚書令凡人材有可用者當舉用之浩舉赫舍哩志寧等其後皆為名臣浩有疾在告者乆之遣左司郎中髙衎及浩姪汝弼宣諭浩力疾入對即詔入朝毋拜許設座殿陛之東若有咨謀然後進對或體中不佳不必日至省中大政可就第裁决浩雖受詔然每以退為請三年夏復申前請乃除判東京留守疾不能赴任因請致仕初近侍有欲罷科舉者上曰吾見太師議之浩入見上曰自古帝王有不用文學者乎浩對曰有曰誰歟浩曰秦始皇上顧左右曰豈可使我為始皇乎事遂寢是嵗薨上輟朝一日詔左宣徽使趙興祥率百官致奠賻銀千兩重綵五十端絹五百匹謚曰文康明昌五年配享世宗廟庭泰和元年圖像衍慶宫子汝為汝霖汝能汝方汝猷汝霖字仲澤少聰慧好學浩嘗稱之曰吾家千里駒也貞元二年賜吕忠翰牓下進士第特授左補闕擢大興縣令再遷禮部員外郎翰林待制大定八年除刑部郎中召見於香閣諭之曰卿以待制除郎中勿以為降朕以刑部闕漢官故以授卿且卿入仕未乆姑試其能耳如職事修舉當有陞擢爾父太師以戸部尚書升諸相位由崇徳大夫躐遷金紫卿所目見也當既厥心無忝乃父明年授太子左諭徳兼禮部郎中先是知登聞檢院王震改禮部郎中世宗諭宰臣曰此除未允人望禮官當選有學術士如張汝霖者可也於是命汝霖兼之而除震别職擢刑部侍郎以憂􅄙起復為太子詹事遷太子少師兼御史中丞世宗召謂曰卿嘗言監察御史所察州縣官多因沽買以得名譽良吏奉法不為表襮必無所稱朕意亦然卿今為臺官可革其弊尋改中都路都轉運使太子少師兼禮部尚書俄轉吏部為御史大夫時將陵主簿高徳温大収稅石米逮御史獄汝霖具二法上世宗責之曰朕以卿為公正故登用之徳温有人在宮掖故朕頗詳其事朕肯以宫掖之私撓法耶不謂卿等顧徇如是汝霖跪謝乆之上顧左諫議大夫楊伯仁曰臺官不正如此伯仁奏曰罪疑惟輕故具二法上請在陛下裁斷耳且人材難得與其材智而邪不若用愚而正者上作色曰卿輩皆愚而不正者也未幾復坐失出大興推官高公羙罪謫授棣州防禦使頃之復為太子少師兼禮部尚書拜參知政事太子少師如故是日汝霖兄汝弼亦進拜尚書左丞時人榮之後因朝奏曰論事上前世宗謂曰朕觀唐史見太宗行事初甚勵精晩年與羣臣議多飾辭朕不如是也又曰唐太宗明天子也晩年亦有過舉朕雖不能比迹聖帝明王然常思始終如一今雖年髙敬愼之心無時或怠汝霖對曰古人有言靡不有初鮮克有終有始有卒者其惟聖人乎魏徴所言守成難者正謂此也上以為然二十五年章宗以原王判大興府事上命汝霖但涓視事日且加輔導尋坐擅支東宫諸皇孫食料奪官一階乆之遷尚書右丞是時世宗在位乆熟悉天下事思得賢材與圖致治而大臣皆依違苟且無所薦達一日世宗召宰臣謂曰卿等職居輔相曽無薦舉何也且卿等老矣殊無可以自代者乎惟朕嘗言某人可用然後從而言之卿等既無所言必待朕知而後進用將復有幾因顧汝霖曰若右丞者亦因右丞相言而知也汝霖對曰臣等苟有所知豈敢不薦但無人耳上曰春秋諸國分裂土地􅄶小皆稱有賢今天下之大豈無人才但卿等不舉而已今朕自勉庶幾致治他日子孫誰與共治乎汝霖等皆有慙色二十八年拜平章政事兼修國史封芮國公世宗不豫與太尉圖克坦克寧右丞相襄同受顧命章宗即位加銀青榮禄大夫進封莘先是右丞相襄言熙宗聖節在七月七日為係景祖忌辰更用五月受外國賀今天壽節在七月雨水淫暴外方人使赴闕有礙行李乞移他月為便汝霖言帝王之道當示信於天下昔宋主構生日亦係五月是時都在㑹寧上國遣使賜禮不聞有霖潦礙阻之説今與宋講好日乆遽以暑雨為辭示以不實萬一雨水踰常愆期到闕猶愈更用别日參知政事劉瑋御史大夫唐古貢中丞李晏刑部尚書兼右諫議大夫完顔守道修起居注完顔烏哲同知登聞檢院事孫鐸亦皆言其不可帝初從之既而竟用襄議時帝在諒陰初出獵諫院聫章言新喪中未宜其後冬獵汝霖諫之詔荅曰卿能每事如此朕復何憂然時異事殊難同古昔如能斟酌得中斯為當矣一日帝謂宰臣曰今之用人太拘資歴如此何能得人汝霖奏曰不拘資格所以待非常之材帝曰崔祐甫為相未踰年薦八百人豈皆非常材耶時有司言民間收藏制文恐因而滋訟乞禁之汝霖謂王者之法譬猶江河欲使易避而難犯本朝法制坦然明白今以著為不刋之典天下之人無不聞誦若令私家収之則人皆曉然不敢為非亦助治之一端也不禁為便詔從之明昌元年三月表乞致仕不許十二月卒時帝獵饒陽訃聞勑百官送葬賻禮加厚諡曰文襄汝霖通敏習事凡進言必揣上微意及朋附多人為説故言不忤而似忠也初宗新即位有司言改造殿庭諸陳設物日用繡工一千二百人二年畢事帝以多費意輟造汝霖曰此非上服用未為過侈將来外國朝㑹殿宇壯觀亦國體也其後奢用寖廣蓋汝霖有以導之云張𤣥素字子貞與涪同曽祖祖祐父匡仕遼至節度使𤣥素初以廕得官髙永昌據遼陽𤣥素在其中斡魯軍至乃開門出降特授世襲銅州明安天㑹間厯西上閤門使客省使東宫計司天眷元年以静江軍節度使知涿州察㢘最進官一階皇子魏王道濟遙領中京以𤣥素為魏王府同提㸃尋改鎭西軍節度使遷東京路都轉運使改興平軍節度使正􅂭末年天下盜起𤣥素發民夫増築城郭同僚諫止之不聴未幾宼掠鄰郡皆無備而興平獨安世宗即位𤣥素来見于東京𤣥素在東京希海陵旨言世宗嘗取在官黄糧及摭其數事至是来見世宗一切不問𤣥素與李石力言宜早幸燕京上深然之遷戸部尚書出鎭定武遂致仕年八十四卒𤣥素厚而剛毅人畏憚之往往以片紙署字其上治㿖疾輒愈人皆異之汝弼字仲佐父𤣥徴彰信軍節度使𤣥素兄也汝弼初以父廕補軍官正􅂭二年中進士第調瀋州樂郊縣主簿𤣥徴妻髙氏與世宗母貞懿皇后有屬世宗納𤣥徴女為次室是為元妃張氏生趙王永中世宗即位于遼陽汝弼與叔𤣥素俱往歸之擢應奉翰林文字世宗御翠巒閤召左司郎中髙衎及汝弼問曰近日除授外議何如宜以實奏毋少隠也有不可用者當改之衎汝弼皆無以對自皇統以来内藏諸物費用無度吏夤縁為姦多亡失汝弼與宫籍直長髙公穆入殿實逹爾添兒閲實之以類為籍作四庫以貯之於是内藏庫使王可道等皆杖一百汝弼等各進階頃之兼修起居注轉右司員外郎母憂去官起復吏部郎中累遷吏部尚書拜參知政事詔徙女直明安穆昆于中都給以近郊官地皆塉薄其腴田皆豪民乆佃遂專為已有上出獵明安穆昆人前訴所給地不可種蓺詔拘官田在民乆佃者與之因命汝弼議其事請條約立限令百姓自陳過限許人首告實者與賞上可其奏仍遣同知中都轉運使張九思拘籍之上問髙麗夏皆稱臣使者至髙麗與王抗禮夏王立受使者拜何也左丞襄對曰故遼與夏為甥舅夏王以公主故受使者拜本朝與夏和同用遼故禮所以然耳汝弼曰誓書稱一遵遼國舊儀今行之已四十年不可改也上曰卿等言是也上聞尚書省除授小官多不稱職召汝弼至香閤謂之曰他宰相年老卿等宜盡心汝弼對曰材薄不足以副聖意耳進拜尚書右丞於是户部糶官倉粟汝弼請使暖湯院得糴之上讓曰汝欲積陰徳邪何區區如此左丞相圖克坦克寧解政務為樞密使是日汝弼亦懷表乞致仕上使人止之曰卿年未老未可退也進左丞與族弟參知政事汝霖同日拜族里以為榮有年未六十而乞致仕者上不許汝弼曰聖㫖嘗許六十致仕上責之曰朕嘗許至六十者致仕不許未六十者且朕言六十致仕是則可行否則當言卿等不言皆此類也乆之坐擅増諸皇孫食料與丞相守道右丞鈕祜禄額特埒參政張汝霖各削一階上曰准法當􅄙職但示薄責耳汝弼在病告上謂宰相曰汝弼乆居執政練習制度頗能斟酌人材而用心不正乃罷為廣寧尹賜通犀帶汝弼為相不能正諫上所欲為則順而導之所不欲為則微言以觀其意上責之則婉辭以引過終不忤之也而上亦知之且黷貨以計取諸家名園甲第珍玩竒好士論薄之二十七年薨汝弼既與永中甥舅陰相為黨章宗即位汝弼妻髙氏毎以邪言怵永中覬非望畫永中母像侍奉祈祝使術者推算永中有司鞫治髙氏伏誅事連汝弼上以事覺在汝弼死後得免削奪耶律安禮本名納罕系出約尼氏㓜孤事母以孝聞遼季間闗避難未嘗一日怠温清入朝當路者重其行義使主帥府文字授在班殿直天眷初從元帥於山西母喪不克歸葬主帥憐之賻禮甚厚安禮冒大暑挽柩行十餘里哀毁骨立行路嗟歎服除由行臺吏禮部主事累遷工部侍郎改左司郎中天徳間罷行臺尚書省入為工部侍郎累遷本部尚書明年冬為宋國嵗元使被詔治鞫韓王亨獄于廣寧亨無反状安禮還奏海陵怒疑安禮梁王宗弼故吏乃責安禮曰伯特有三罪其論額哷楚克有誓劵不當死既引伏其謂不足進馬及密遣刺客二者安得無之汝等来奏欲測我喜怒以為輕重耳乃遣安禮再往與李老僧同鞫之老僧由是殺亨于獄海陵猶謂安禮輒殺亨以絶滅事迹親戚得不以坐安禮之不附上刻下乃如此改吏部尚書䕶大房山諸陵工作拜樞密副使封譚國公遷尚書右丞進封郕國公轉左丞議除累朝功臣封爵密諫伐江南忤海陵意罷為南京留守封温國公安禮長於吏事㢘謹自將從帥府再伐宋寳貨人口一無所取貴為執政奴婢止數人皆有契劵時議賢之薨年五十六納哈塔椿年本名烏頁初置女直字立學官于西京椿年與諸部兒童入學最號警悟乆之選諸學生送京師俾上京教授頁嚕教之椿年在選中補尚書省令史累官殿中侍御史改監察御史海陵為相薦為右司員外郎編定新制海陵簒立以為諫議大夫椿年有酒失海陵使之戒酒遂終身不復飲改秘書監修起居注授世襲明安為翰林學士兼御史中丞正隆初起上京諸明安於中都山東等路安置以勞賜玉帶閑廐馬奉遷山陵還為都㸃檢賜今名拜參知政事海陵謂椿年曰如卿吏材甚難得復有如卿者乎椿年薦大理丞赫舍哩羅索海陵以羅索為右司員外郎未旬日海陵謂椿年曰吾試用羅索果如卿言惟賢知賢信矣羅索後賜名良弼有宰相才世宗時至右丞相號賢相焉正􅂭二年椿年薨海陵親臨哭之追封特進譚國公諡忠辯賻銀二千兩綵百端絹千匹錢千萬以長子薩木哈為定逺大將軍襲明安次子哈逹為忠武校尉及歸葬再賜錢百萬仍給道路費椿年有宰相才好推輓士類然頗營産業為子孫慮冐占西南路官田八百餘頃大定中括檢田土百姓陳言官豪占據官地貧民不得耕種温都思忠子長夀椿年子明安薩木哈等三十餘家凡冐占三十餘頃詔詔家除牛頭稅地各再給十頃其餘盡賦貧民種佃世頗以此譏椿年云祁宰字彦甫江淮人宋季以醫術補官王師破汴得之後隸太醫累遷中奉大夫太醫使數被賞賚常感激欲自效海陵將伐宋宰欲諫不得見㑹元妃有疾召宰診視既入見即上疏諌其畧言國朝之初祖宗以有道伐無道曾不十年蕩遼戡宋當此之時上有武元文烈英武之君下有宗翰宗雄謀勇之臣然猶不能混一區宇舉江淮巴蜀之地以遺宋人况今謀臣猛將異於曩時且宋人無罪師出無名加以大起徭役營中都建南京繕治甲兵調發軍旅賦役煩重民人怨嗟此人事之不修也間者晝星見於牛斗熒惑伏於翼軫已嵗自形害氣在揚州太白未出進兵者敗此天時不順也舟師水涸舳艫不繼而江湖島渚之間騎士馳射不可驅逐此地利不便也言甚激切海陵怒命戮於市籍其家産天下哀之綦戩宰壻也海陵疑奏疏戩為之辭曰實不知也海陵猶杖戩召禁中諸司局官至咸徳門諭以殺宰事明年世宗即位於遼東四年詔贈資政大夫復其田宅章宗即位詔訪其子忠勇校尉平定州酒監公史擢尚藥局都監泰和初詔定功臣諡尚書省掾李秉鈞上言事有宜緩而急若輕而重者名教是也伏見故贈資政大夫祁宰以忠言被誅慕義之士䀌傷厥心世宗即位贈之以官陛下録用其子甚大惠也雖武王封比干之墓孔子譽夷齊之仁何以異此而有司拘文以職非三品不在議諡之例臣竊疑之若職至三品方得請諡當時居髙官食厚禄者不為無人皆畏罪淟涊曽不敢申一喙畫一策以為社稷計卒使立名死節之士顧出於醫卜之流亦可以少愧矣臣以為非常之人當以非常之禮待之乞詔有司特賜諡以旌其忠斯亦助名教之一端也制曰可下太常謚曰忠毅贊曰异哉海陵之為君也舞智御下而不䘏焉君子仕於朝動必以禮然後免於恥張通古耶律安禮位不及張浩進退始終其賢逺矣浩無事不為無役不從為相最乆用之厚遇之薄豈亦自取之邪海陵伐宋浩安禮位皆大臣一以婉辭一以密諫賢於不諫而以祁宰一醫流獨能極諫其後皆如所言海陵戕之足以成其百世之名耳納哈塔椿年援引善類有君子風其死適在宋兵未舉之前然觀其好營産殖亦未必忘身徇國之士也祁宰卓乎不可及也夫金史卷八十三
