body:
  text: 金史卷六元中書右丞相總裁托克托等修本紀第六世宗上世宗光天興運文徳武功聖明仁孝皇帝諱雍本諱烏祿太祖孫睿宗子也母曰貞懿皇后李氏天輔七年癸外嵗生于上京體貌竒偉美鬚髯長過其腹胷間有七子如北斗形性仁孝沉静明達善騎射國人推為第一每出獵耆老皆隨而觀之皇統間以宗室子例授光禄大夫封葛王為兵部尚書天徳初判㑹寜牧明年判大宗正事改中京留守俄改燕京未幾為濟南尹貞元初為西京留守三年改東京進封趙王正隆二年例降封鄭國公進封衛國三年再任留守徙封曹國六年五月居貞懿皇后喪一日方寢有紅光照室及黄龍見寝室上又嘗夜有大星流入留守第中是嵗東梁水漲溢暴至城下水與城等決女墻石罅中流入城湍激如涌城中人惶駭上親登城舉酒酧之水退海陵南伐天下騷動是時籍契丹部人丁壯為兵部人不願行以告使者使者蘇赫畏海陵不以告部人遂反至是咸平府穆昆𤓰里攻䧟韓州據咸平將犯東京八月起復東京留守博索路兵四百來㑹討𤓰里復得城中子弟願為兵者數百人帝舅興中少尹李石以病免家居遼陽戊午𤼵東京以石主留務賊覘者聞鼙鼓聲震天見旌旗蔽野𫝊言國公兵十萬且至賊衆至瀋州遯去㑹烏雅扎拉等敗賊兵還至常安縣海陵使博索路總管完顔黙音來討賊以兵屬之九月至東京副留守髙存福其女在海陵後宫海陵使存福伺起居適以造兵器餘材造甲數十存福宣言留守何為造甲密使人以白海陵遂與推官李彦隆託為擊毬謀不利存福家人以其謀來告平定知軍李富色克亦言其事海陵嘗聞上有疾即使近習來觀動静至是又使摩囉歡圖淮北諸王上知之心常隠憂及討𤓰里還至清河遇故吏魯爾錦乗𫝊自南來具言海陵殺其母殺兄子塔納阿里布及樞宻使布薩呼圖等又曰且遣人來害宗室兄弟矣上聞之益懼及聞存福圖已事且有迹李石勸上早圖之于是以議備賊事召官屬㑹清安寺彦隆先到存福累召始來並于座上執之是月復有雲來自西黄龍見雲中十月辛丑南征萬戸完顔福壽髙忠建盧萬嘉努等自山東率所領兵二萬完顔黙音自長安率兵五千皆來附黙音即以臣禮上謁乙巳諸軍入城共擊殺存福等是夜諸軍被甲環衛皇城丙午慶雲見屬官諸軍勸進固讓良久于是親告于太祖廟還御宣政殿即皇帝位以完顔黙音為右副元帥髙忠建元帥左監軍完顔福壽右監軍盧萬嘉努顯徳軍節度使丁未大赦改元大定下詔暴揚海陵罪惡數十事己酉饗将士賜官賞各有差仍給復三年㑹寜呼爾哈率賓等路南伐諸軍㑹尚書省奏請以從軍來者補諸局司承應人及官吏闕員上曰舊人南征者即還何以處之必不可闕者量用新人可也辛亥以利渉軍節度使通吉義為叅知政事中都留守西北面行營都統完顔古雲将兵三萬駐歸化以為左副元帥丁巳出内府金銀器物贍軍吏民出財物佐官用者甚衆壬戌以前臨潢尹晏為左丞相癸亥詔諭南京太傅尚書令張浩甲子興平軍節度使張𤣥素上謁尚書省奏正隆軍興之餘進錢粟者宜量授以官從之詔遣伊喇扎巴招契丹諸部為亂者以前肇州防禦使實圗美為元帥右都監十一月己巳朔以左丞相晏兼都兀帥辛未以戸部尚書李石為叅知政事己夘詔調民間馬􅂶軍用事畢還主死者給價阿蘇璋殺同知中都留守事薩勒扎阿蘇自稱中都留守璋自稱同知留守事使厚嘉努等來上表賀辛巳以如中都期日詔羣臣壬午詔中都都轉運使左淵曰凡宫殿張設毋得増置無役一夫以擾百姓但謹圍禁嚴出入而已以尚書右司員外郎完顔烏肯徹為詔諭髙麗使癸未遣權元帥左都監烏哲庫右都監實圖美廣寜尹布薩歡塔討契丹諸部甲申追尊皇考豳王為皇帝諡簡肅廟號睿宗皇妣富察氏曰欽慈皇后李氏曰貞懿皇后羣臣上尊號曰仁明聖孝皇帝乙酉追復東昬王帝號諡武靈廟號閔宗詔中外封子薩喇勒為許王呼塔噶為楚王戊子辭謁太祖廟及貞懿皇后園陵己丑如中都次小口使中都留守宗憲先往壬辰次梁魚務樞宻副使北面行營都統白彦敬南京留守北面行營副統赫舍哩志寜以所統軍數來上安武軍節度使爽來歸乙未完顔元宜等弑海陵于揚州丙申次義州丁酉宋人破陜州防禦使折可直降同知防禦使事李柔立死之十二月乙夘次三河縣左副元帥完顔古雲來朝丙辰次通州延安尹唐古徳溫來朝丁巳至中都戊午謁太祖廟己未御貞元殿受羣臣朝庚申以元帥左監軍髙忠建等為報諭宋國使壬戌詔軍士自東京扈從至京師者復三年同知河間尹髙昌福上書陳便宜上覽之再三詔内外大小職官陳便宜丙寅詔左副元帥完顔古雲䂓措南邊及陜西等路事二年正月戊辰朔日有食之伐鼓用幣上徹樂減膳不視朝庚午上謂宰相曰進賢退不肖宰相之職也有才能髙于己者或懼其分權往往不肯引置同列朕甚不取卿等毋以此為心以前翰林學士承㫖致仕翟永固為尚書左丞濟南尹布薩忠義為右丞都統色克副統完顔布呼坐擅易置中都官吏色克除名布呼削兩階罷之辛未御太和殿宴百官宗戚命婦賜賚有差壬申勑御史臺檢察六部文移稽而不行行而失當皆舉劾之甲戌除迎賽神佛禁令乙亥如大房山丙子獻享山陵禮畢欲獵而還左丞相晏等諌曰邊事未寜不宜逰幸戊寅還宮因諭晏等曰朕常慕古之帝王虚心受諌卿等有言即言毋緘黙以自便辛巳以兵部尚書克實等謀反伏誅詔中外是日賜扈從明安穆昆甲士下至伊勒希有差遣左副㸃檢富察阿布哈等賞賚河南将士以前勸農使伊喇元宜為御史大夫詔前工部尚書蘇保衡太子少保髙思廉振賜山東百姓粟帛無妻者具姓名以聞庚寅行納粟補官法遣右副元帥完顔黙音率師討蕭斡罕壬辰上謂宰執曰朕即位未半年可行之事甚多近日全無敷奏朕深居九重正賴卿等贊襄各思所長以聞朕豈有倦怠癸巳太白晝見甲午上謂宰執曰卿等當參民間利害及時事之可否以時敷奏不可公餘輒從自便優㳺而已命河北山東陜西等路征南歩軍並放還家咸平濟州軍三萬入屯京師丙申以西南路招討使完顔思敬兵部尚書阿林督北邉将士二月己亥前翰林待制大穎以言盜賊忤海陵杖而除名起為秘書承補闕馬欽以謟事海陵得幸除名庚子詔前戸部尚書梁球户部郎中耶律道安撫山東百姓招諭盜賊或避賊及避徭役在他所者並令歸業及時農種無問罪名輕重並與原免壬寅太傅尚書令張浩來見癸夘以初即位遣遼陽主簿舒穆嚕伊徳東京麴院都監伊喇格布招契丹叛人為白彦敬赫舍哩志寜所害並贈鎮國上将軍令其家各食五品俸仍收録其子甲辰以張浩為太師尚書令如故御史大夫伊喇元宜為平章政事辛亥定世襲明安穆昆遷授格壬子以太保左領軍大都督璸都為都元帥太保如故癸丑詔降蕭玉敬嗣暉許霖等官放歸田里甲寅復用進士為尚書省令史丙辰嵩州刺史舒穆嚕珠徳勒敗宋兵于壽安縣丁巳鄭州防禦使富察世傑取陜州甲子詔都元帥璸都開府山東經畧邊事澤州刺史特黙格及其妻髙福娘伏誅閏月甲戌上謂宰臣曰比聞外議言奏事甚難朕于可行者未嘗不從自今敷奏勿有所隠朕固樂聞之戊子上謂宰臣曰臣民上書者多敕尚書省詳閲而不即具奏天下将謂朕徒受其言而不行也其亟條具以聞庚寅詔平章政事伊喇元宜泰州路䂓措邉事辛夘太和厚徳殿火乙未尚書兵部侍郎温都珠徳勒等與斡罕戰敗于勝州三月癸卯參知政事通吉義罷元帥左都監圖克坦喀齊喀敗宋師于徳順州甲辰追削李通官職乙巳免南京正隆丁夫貸役錢辛亥以廉平誡諭中外官吏癸亥詔河南陜西山東昨因捕賊良民被虜為賊者釐正之四月己巳右副元帥完顔黙音等敗斡罕于長濼辛未降廢帝亮為海陵郡王乙亥詔減御膳及宫中食物之半夏國遣使來賀即位及進方物及賀萬春節右副元帥完顔黙音復敗斡罕于霧􅟶河辛巳宴夏使貞元殿故事外國使三節人從皆坐廡下賜食上察其食不精腆曰何以服逺人之心掌食官皆杖六十癸未夏使朝辭乞互市從之己丑以左丞相晏為太尉壬辰詔征契丹部将士曰應契丹與大軍未戰而降者不得殺傷仍安撫之後詔誘來降者除奴婢以已虜為定其親屬使各還其家仍官為贖之五月丁酉朔以哈斯罕節度使白彦敬為御史大夫戊戌遣元帥左監軍髙忠建㑹北征将帥討契丹己亥以臨海節度使赫舍哩志寜為元帥右監軍右副元帥完顔黙音元帥右監軍完顔福壽坐逗遛召還京師皆罷之壬寅立楚王允迪為皇太子詔中外丁巳押軍萬戸費摩阿拉明安伊喇薩爾拉敗宋兵于華州六月戊辰命御史大夫白彦敬西北路市馬庚午以尚書右丞布薩忠義為平章政事兼右副元帥經畧契丹詔出内府金銀給征契丹軍用戊寅詔居庸闗古北口譏察契丹姦細捕獲者加官賞己夘詔守禦古北口及石門闗庚辰宋遣使賀即位壬午右副元帥布薩忠義與斡罕戰于和托戊子以南京留守赫舍哩良弼為尚書右丞右副元帥庚寅布薩忠義大敗斡罕于諾爾嶺西陷泉獲其弟諾爾壬辰以西南路招討使完顔思敬為元帥右都監七月丁酉復取原州丙午宋主傳位于子眘甲寅詔諭契丹丁巳率賓軍士珠勒呼等誣完顔黙音子色克寄書其父謀反以其書上之上覽書曰此誣也止訊告者訊之果誣也珠勒呼伏誅庚申太尉尚書左丞相晏致仕壬戌詔𤼵濟州㑹寜府軍在京師者以五千人赴北京都統府陜西都統璋敗宋将吳璘于張義堡八月乙丑朔奚實黙伯穆昆實哷等降左監軍髙忠建破奚于栲栳山及招降旁近奚六營有不降者攻破之盡殺其男子以其婦女童孺分給諸軍丁夘永興縣進嘉禾壬申萬户溫特赫阿嚕岱與奚戰于古北口敗焉詔同判大宗正事完顔黙音等禦之癸酉上謂宰臣曰百姓上書陳時政其言猶有所補卿等位居機要略無獻替可乎夫聽㫁獄訟簿書期㑹何人不能唐虞之聖猶務兼覽博照乃能成治正隆専任獨見故取敗亡朕早夜孜孜冀聞讜論卿等宜體朕意詔百司官吏凡上書言事或為有司所抑許進表以聞朕将親覽以觀人材優劣夏國遣使賀尊號丁丑免齊國妃韓王亨樞宻呼圖留守賾等家親屬在宫籍者詔元帥右都監完顔思敬以所部軍與大軍㑹討斡罕乙酉詔左諫議大夫石琚監察御史馮仲尹廉察河北東路丁亥詔御史臺曰卿等所劾惟諸局行移稽緩及緩于赴局者耳此細事也自三公以下官僚善惡邪正當審察之若止理細務而畧其大者将治卿等罪矣契丹老和尚降辛夘罷諸闗征稅九月甲午朔完顔黙音擒奚明安和卓元帥右都監圖克坦喀齊喀敗宋吳璘于徳順州乙未詔尚書右丞赫舍哩良弼以便宜招撫奚契丹之叛者庚子元帥右都監完顔思敬獲丹斡罕餘衆悉平以尚書左司員外郎完顔正臣為夏國生日使壬寅獵于近郊乙巳以伊喇斡罕平詔中外庚戌改葬睿宗皇帝壬子以元帥右都監完顔思敬為右副元帥戊午詔思敬經畧南邊辛酉奉遷睿宗皇帝梓宫于磐寜宫癸亥元帥右監軍圖克坦喀齊喀敗宋兵徳順州河南統軍使宗尹復取汝州十月丁夘以左副元帥完顔古雲為平章政事戊辰如山陵謁睿宗皇帝梓宫哭盡哀平章政事右副元帥布薩忠義等還自軍上謁丙戌以布薩忠義為尚書右丞相元帥左監軍赫舍哩志寜為左副元帥戊子葬睿宗皇帝于景陵大赦己丑詔左副元帥赫舍哩志寜經略南邊壬辰華州防禦使富察世傑丹州刺史持嘉烏蘇埓克敗宋兵于徳順州十一月癸己朔詔右丞相布薩忠義伐宋丁酉第職官㢘能汙濫不職各為三等而黜陟之十二月乙酉遣尚書刑部侍郎劉仲淵等㢘察宣諭東京北京等路三年正月壬辰朔髙麗夏遣使來賀庚子太白晝見壬子遣客省使烏居仁賞勞河南軍士癸丑復取徳順州二月甲子詔太子少詹事楊伯雄等廉問山西路庚午上謂宰相曰灤州飢民流散逐食甚可矜恤移于山西富民贍濟仍于道路計口給食壬申詔撫諭陜西庚辰太保都元帥璸都薨丙戌趙景元等以亂言伏誅庚寅髙麗夏遣使來賀萬春節髙麗遣使賀即位東京僧法通以妖術亂衆都統府討平之三月丙申中都以南八路蝗詔尚書省遣官捕之壬寅詔戸部侍郎魏子平等九人分詣諸路明安穆昆勸農及㢘問詔臨潢漢民逐食于㑹寜府濟信等州庚戌詔免去年租税四月辛酉朔右副元帥完顔思敬罷丁夘平章政事完顔古雲御史大夫白彦敬罷以參知政事李石為御史大夫丁丑詔吏犯􅂍罪雖㑹赦不叙己夘以引進使韓綱為横賜髙麗使乙酉賑山西路明安穆昆貧民給六十日糧是月取商虢環州宋所侵一十六州至是皆復五月辛夘朔右丞相布薩忠義朝京師乙未以重五幸廣樂園射栁命皇太子親王百官皆射勝者賜物有差上復御常武殿賜宴擊毬自是嵗以為常丙申宋人攻破靈壁虹縣己亥罷河南山東陜西統軍司置都統副統以太子詹事完顔守道從皇太子上召諭守道曰卿任執政所責非輕自今毋從行辛丑以右丞相布薩忠義兼都元帥癸夘布薩忠義還軍河南路都統奚托卜嘉叛入于宋丙午宋人攻破宿州辛亥更定出征軍逃亡法尚書省請籍天徳間被誅大臣諸奴𨽻及從斡罕亂者為軍上以四方甫定民意稍蘇而復簽軍非長䇿不聽癸丑詔諭契丹餘黨富色克等如能自新並釋其罪若執富色克父子以來者仍官賞之左副元帥赫舍哩志寜復取宿州河南副統冨珠哩定方死于陣乙夘以北京留守完顔思敬復為右副元帥中都蝗詔參知政事完顔守道按問大興府捕蝗官六月庚申朔日有食之以刑部尚書蘇保衡為參知政事丙子詔曰正隆之末濟州路逃回軍士為中都官軍所邀殺者官為收葬己夘觀稼于近郊甲申太師尚書令張浩罷以宿直将軍珠勒根呼雅克為横賜夏國使七月庚戌太白晝見以太子太師宗憲為平章政事以孔總襲封衍聖公八月丙寅太白經天庚午詔曰祖宗時有勞効未曽遷賞者五品以上奏聞六品以下及無職事者尚書省約量升除甲戌詔參知政事完顔守道招撫契丹餘黨戊寅詔罷契丹明安穆昆其戸分𨽻女直明安穆昆命諸官員年老者許存馬一二匹餘並括買入官勑殿前都㸃檢唐古徳溫重九出獵國朝舊俗今扈從軍二千能無擾民可嚴為約束仍以錢萬貫分賜之乙酉如大房山丁亥薦享于睿陵戊子還宫癸巳宿直将軍布薩實訥埓為夏國生日使九月丁酉秋獵以重九拜天于北郊丙午詔翰林待制劉仲誨等㢘問車駕所經州縣乙夘還宫十月甲子大享于太廟丙寅以許王府長史伊喇塔富拉為髙麗生日使癸酉冬獵十一月庚寅太白晝見經天壬辰還都戊申詔求仕官輒入權要之門追一官仍降除以請求有所饋獻及受之者具状奏裁庚戌百官請上尊號不允詔中都平州及饑荒地并經契丹剽掠有質賣妻子者官為收贖壬子尚書左丞翟永固罷癸丑罷貢金線段匹甲寅以尚書右丞赫舍哩良弼為左丞吏部尚書石琚為參知政事十二月丁丑臘獵于近郊以所獲薦山陵自是嵗以為常詔流民未復業増限招誘己夘參知政事蘇保衡至自軍辛巳以為尚書右丞四年正月丁亥朔髙麗夏遣使來賀戊子罷路府州元日及萬春節貢獻上謂侍臣曰秦王宗翰有功于國何乃無嗣皆未知所對上曰朕嘗聞宗翰在西京坑殺匄者千人得非其報耶癸巳百官復請上尊號不允丁酉如安州春水壬寅至安州大雪詔扈從人舍民家者人日支錢一百與其主甲辰元帥府言宋遣審議官胡昉致尚書右僕射書來議和好以其言失信拘昉軍中以書答之及以書進上覽之曰宋人失信行人何罪當即遣還邊事令元帥府從宜措畫乙巳尚書省奏徐州民曹珪討賊江志而子弼亦在賊中并殺之法當補二官敘雜班上以所奏未當進一官正班用之辛亥獲頭鵝遣使薦山陵自是嵗以為常二月丁巳免安州今年賦役及保塞縣御城邊吳二村凡扈從人嘗止其家者亦復一年辛酉獵于髙陽之北庚午還都庚辰以北京粟價踴貴詔免今年課甲三月丙戌朔萬春節髙麗夏遣使來賀詔免北京嵗課段匹一年庚子京師地震壬寅百官復請上尊號不允四月丁巳平章政事完顔元宜罷甲戌出宮女二十一人五月旱癸夘敕有司審􅁈獄禁宫中音樂放毬塲役夫乙巳詔禮部尚書王競禱雨於北岳己酉命參知政事石琚等于北郊望祭禱雨士子雨斡罕餘黨富色克伏誅六月甲寅朔日有食之壬戌尚書左丞赫舍哩良弼至自征南元帥府甲子以雨足命有司祭謝嶽鎮海瀆于北郊己巳幸東宫視皇太子疾庚午初定祭五嶽四瀆禮辛未觀稼于近郊庚辰詔諭元帥府曰所請伐宋軍萬五千今以騎三千歩四千赴之詔陜西元帥府議入蜀利害以聞七月壬辰故衛王襄妃及其子和尚以妖妄伏誅庚子以尚書左丞赫舍哩良弼為平章政事辛丑大風雷雨拔木八月甲寅朔詔征南元帥府曰前所請收復舊疆乞候秋凉進𤼵今巳秋凉復俟何時戊午以參知政事完顔守道為尚書左丞大興尹唐古安禮為參知政事壬申上謂宰臣曰卿毎奏皆常事凡治國安民及朝政不便于民者未嘗及也如此則宰相之任誰不能之己夘如大房山辛巳致祭于山陵九月癸未朔還都乙酉上謂宰臣曰形勢之家親識訴訟請屬道達官吏往往屈法狥情宜一切禁止巳丑上謂宰臣曰北京懿州臨潢等路嘗經契丹寇掠平薊二州近復蝗旱百姓艱食父母兄弟不能相保多冐鬻為奴朕甚憫之可速遣使閲實其數出内庫物贖之乙未幸鷹房主者以鷹隼置内省堂上上怒曰此宰相㕔事豈置鷹隼處耶痛責其人俾置他所己亥以宿直将軍烏哩雅為夏國生日使辛亥以太子少詹事烏庫哩薩哈為髙麗生日使十月癸亥朔獵于密雲縣丙寅還都己夘命泰寜軍節度使張𢎞信等二十四人分路通檢諸路物力十一月乙酉征南都統圖克坦克寜敗宋兵取楚州己丑封子永功為鄭王辛夘冬獵乙未詔進師伐宋戊戌次河間府辛丑尚書省火甲辰次清州閏月壬子朔還都十二月丁亥尚書省奏都統髙景山取商州己丑臘獵于近郊辛夘太白晝見經天是嵗大有年斷死罪十有七人五年正月辛亥朔髙麗夏遣使來賀乙夘詔泰州臨潢接境設邊堡七十駐兵萬三千己未宋通問使魏杞等以國書來書不稱大稱姪宋皇帝稱名再拜奉書于叔大金皇帝嵗幣二十萬辛未詔中外復命有司旱蝗水溢之處與免租賦癸酉命兀帥府諸新舊軍以六萬人留戍餘並放還以宋國嵗幣悉賞諸軍二月壬午以左副都㸃檢完顔仲等為宋報問使壬寅罷納粟補官令三月戊申萬春節宋髙麗夏遣使來賀壬申羣臣奉上尊號曰應天興祚仁徳聖孝皇帝詔中外四月癸夘西京留守壽王京謀反獄成特免死杖之除名嵐州安置乙巳右副元帥完顔思敬罷丁未右丞相都元帥布薩忠義還自軍五月壬子左副元帥赫舍哩志寜以召入見丁巳以布薩忠義為尚書左丞相赫舍哩志寜為平章政事還軍乙丑以平章政事宗憲為尚書右丞相癸酉罷山東路都統府以其軍各隸總管府六月甲辰芝産大安殿柱丙午京師地震雨毛七月戊申朔京師地復震罷陜西都統府復置統軍司京兆徙陜西元帥府河中八月己夘前宿州防禦使烏淩阿薩喇以與宋李世輔交通伏誅癸巳宋夏遣使賀尊號九月丁未朔以吏部尚書髙衎等為賀宋生日使戊申秋獵庚戌以宿直将軍珠格芬徹為夏國生日使甲戌還都十月丁丑朔地震辛巳以大宗正丞璋為髙麗生日使乙未冬獵辛丑還都十一月丙午朔上謂宰臣曰朕在位日淺未能徧識臣下賢否全頼卿等盡公舉薦今六品以下殊乏人材何以副朕求賢之意癸丑幸東宫戊午以右副都㸃檢烏庫哩尼瑪哈為賀宋正旦使癸亥立諸路通檢地土等第税法癸酉大霧晝晦十二月己丑獵于近郊髙麗遣使賀尊號六年正月丙午朔宋髙麗夏遣使來賀庚午敕有司宫中張設毋以塗金為飾二月丁亥尚書左丞相兼都元帥沂國公布薩忠義薨三月壬寅萬春節宋髙麗夏遣使來賀甲寅上如西京庚申次歸化州西京留守唐古徳溫上謁戊辰至西京庚午朝謁太祖廟壬申擊毬百姓縱觀四月甲戌朔詔月朔禁屠宰戊戌以尚書右司郎中伊喇道為横賜髙麗使宿直将軍錫黙果囉為横賜夏國使辛丑太白晝見五月戊申幸華巖寺觀故遼諸帝銅像詔主僧謹視之壬子詔雲中大同縣及警巡院復給一年壬戌詔将幸銀山諸扈從軍士賜錢五萬貫有敢損苗稼者並償之六月辛丑太白晝見經天丙戌𤼵自西京庚子獵于銀山七月辛酉次三义口八月辛未朔次凉陘庚辰獵于望雲之南山九月辛丑朔至自西京丁未以戸部尚書魏子平為賀宋生日使辛亥以翰林待制伊喇熙載為夏國生日使澤州刺史劉徳裕等以盜用官錢伏誅壬子太白晝見癸丑尚書右丞相宗憲薨丙辰太白書見經天十月己夘以尚書兵部侍郎伊喇諳達為髙麗生日使甲申朝享于太廟詔免雄莫等州今年租壬辰太白晝見經天丁酉如安肅州冬獵十一月丙午還都癸丑以右副都㸃檢烏庫哩元忠為賀宋正旦使上謂宰臣曰朝官當慎選其人庶可激勵其餘若不當則啓覬覦之心卿等必知人才優劣舉實才用之庚申太白晝見經天丁夘參知政事石琚以母憂罷十二月甲戌詔有司每月朔望及上七日母奏刑名戊子太白晝見經天甲午泰州民和卓謀反伏誅丙申以平章政事赫舍哩良弼為尚書右丞相赫舍哩志寜為樞密使七年正月庚子朔宋髙麗夏遣使來賀辛亥石琚起復參知政事壬子服衮冕御大安殿受尊號冊寶癸丑大赦庚申以元帥左監軍圖克坦喀齊喀為樞密副使二月庚寅尚書右丞蘇保衡薨丙申以參知政事石琚為尚書右丞三月己亥朔萬春節宋髙麗夏遣使來賀四月戊辰朔日有食之壬辰以御史大夫李石為司徒大夫如故五月丙午大興府獄空詔賜錢三百貫為宴樂之用以勞之甲寅以北京留守諾延温都烏逹為參知政事六月癸酉命地衣用龍文者罷之七月戊申禁服用金線其織賣者皆抵罪丙辰幸東宫己未幸東宫視皇太子疾閏月丁夘觀稼于近郊戊辰越王永中進封許王鄭王永功封隋玉永成封瀋王甲戌詔遣秘書監伊喇子敬經畧北邊戌寅幸東宫己夘慶雲環日壬午觀稼于近郊戊子觀稼于北郊八月辛亥慶雲環日癸丑尚書右丞相監修國史赫舍哩良弼進太宗實録上立受之己未如大房山壬戌致祭睿陵九月乙丑朔還宫己巳右三部檢法官韓贊以捕蝗受賂除名詔吏人但犯􅂍罪雖㑹赦非特㫖不叙用以勸農使富察索囉等為賀宋生日使辛未參知政事唐古安禮罷乙亥以宿直将軍唐古呼嚕為夏國生日使庚辰地震辛巳以都水監李衛國為髙麗生日使乙酉秋獵庚寅次保州詔修起居注王天祺察訪所經過州縣官十月乙未朔上謂侍臣曰近聞朕所幸郡邑曽宴寢堂宇後皆避之此甚無謂可宣諭令仍舊居止戊申還都丁巳上謂宰臣曰海陵不辨人才優劣惟狥已欲多所升擢朕即位以來以此為戒止取實才用之近聞蠡州同知伊喇延壽在官汚濫詢其出身乃正隆時鷹房子如鷹房􅌮人之類可典城牧民耶自今如此局分不得授以臨民職任以御史中丞孟浩為參知政事是日參知政事諾延溫都烏達薨辛酉勅有司于東宫涼樓前増建殿位孟浩諌曰皇太子雖為儲貳宜示以儉徳不當與至尊宫室相侔乃罷之十一月乙丑朔上謂宰臣曰縣令多非其人令吏部察善惡明加黜陟辛未以河間尹圖克坦克寜等為賀宋正旦使壬申太白晝見丁丑嵗星晝見丁亥樞密副使圖克坦喀齊喀罷十二月戊戌東京留守圖克坦喀齊喀北京留守完顔黙音肇州防禦使富察通朝辭賜通金帯諭曰卿雖有才用心多詐朕左右須忠實人故命卿補外賜卿金帯者答卿服勞之久也又顧謂左宣徽使敬嗣暉曰如卿不可謂無才所欠者純實耳甲辰以北京留守完顔思敬為平章政事是嵗斷死囚二十人八年正月甲子朔宋髙麗夏遣使來賀乙丑上謂宰臣曰朕治天下方與卿等共之事有不可各當面陳以輔朕之不逮慎毋阿順取容卿等致位公相正行道揚名之時苟或偷安自便雖為今日之幸後世以為何如羣臣皆稱萬嵗辛未謂秘書監伊喇子敬等曰昔唐虞之時未有華飾漢惟孝文務為純儉朕于宫室惟恐過度其或興修即損宫人嵗費以充之今亦不復營建矣如宴飲之事近惟太子生日及嵗元嘗飲酒往者亦止上元中秋飲之亦未嘗至醉至于佛法尤所未信梁武帝為同泰寺奴遼道宗以民户賜寺僧復加以三公之官其惑深矣庚辰行皇太子冊禮二月甲午朔制子為改嫁母服喪三年上諭左宣徽使敬嗣暉曰凡為人臣上欲要君之恩下欲干民之譽必虧忠節卿宜戒之三月癸亥朔萬春節宋髙麗夏遣使來賀己巳命以職官子補令史丁丑命䕶衛親軍百戸五十戸非直日不得帯刀入宫己丑太白晝見四月丙午詔曰馬者軍旅所用牛者農耕之資殺牛有禁馬亦何殊其令禁之戊申擊毬常武殿司天馬貴中諌曰陛下為天下主繫社稷之重又春秋髙圍獵擊毬危事也宜悉罷之上曰朕以示習武耳五月甲子北望淀大震風雨雹廣十里長六十里詔戸工兩部自今宫中之飾並勿用黄金乙丑上如涼陘丁夘嵗星晝見庚寅改旺國崖曰静寜山和爾和東川曰金蓮川六月河決李固渡水入曹州七月甲子制盜羣牧馬者死告者給錢三百貫戊辰上謂平章政事完顔思敬等曰朕思得賢士寤寐不忘自今朝臣出外即令體訪外任職官廉能者及草萊之士可以助治者具姓名以聞甲戌秋獵己夘次三义口上諭㸃檢司曰㳂路禾稼甚佳其扈從人少有蹂踐則當汝罪八月乙夘至自涼陘九月辛酉上諭尚書右丞石琚參政孟浩曰聞蔚州採地蕈役夫數百千人朕所用幾何而擾動如此自今差役凡稱御前者皆須禀奏仍附冊癸亥以右宣徽使伊喇錫勒塔干等為賀宋生日使己巳以引進使髙希甫為夏國生日使庚午上幸東宫癸酉上諭宰臣曰卿等舉用人材凡己所知識必使他人舉奏朕甚不喜如其果賢何必以親疎為避忌也以戸部尚書魏子平為參知政事辛巳上謂御史大夫李石曰臺憲固在分别邪正然内外百司豈謂無人惟見卿等劾人之罪不聞舉善自今宜令監察御史分别刺舉善惡以聞上嘗命左衛将軍大磐訪來良弓而磐多自取䕶衛羅索以告上命㸃檢司鞠磐磐妹為寶林磐屬内侍僧兒言之寶林寶林以聞命杖僧兒百出磐為隴州防禦使十月己丑朔以戒諭官吏貪墨詔中外乙未命􅃰州刺史兼提㸃山陵毎以朔望致祭朔則用素望則用肉仍以明年正月為首及命圖畫功臣于太祖廟其未立碑者立之以翰林待制靖為髙麗生日使上謂宰臣曰海陵時修起居注不任直臣故所書多不實可訪求得實詳而録之參政孟浩進曰良史直筆君舉必書自古帝王不自觀史意正在此辛亥詔罷復州嵗貢鹿筋十一月乙丑幸東宫以同簽大宗正事博克托等為賀宋正旦使十二月戊子朔遣武定軍節度使伊喇安等招諭準布九年正月戊午朔宋髙麗夏遣使來賀辛酉上與宣徽使敬嗣暉秘書監伊喇子敬論古今事因曰亡遼日屠食羊三百亦豈能盡用徒傷生耳朕雖處至尊每當食常思貧民飢餒猶在己也彼身為惡而口祈福何益之有如海陵以張仲軻為諌議大夫何以得聞忠言朕與大臣論議一事非正不言卿等不以正對豈人臣之道也庚午詔諸州縣和糴毋得抑配百姓戊寅契丹愛實拉等謀叛伏誅丙戌制漢人渤海兄弟之妻服闋歸宗以禮續婚者聽二月庚寅制妄言邊闗兵馬者徒二年丙申詔改葬漢二燕王于城東庚子以中都等路水免稅詔中外又以曹單二州被水尤甚給復一年甲寅詔女直人與諸色人公事相闗只就女直理問三月丁巳朔萬春節宋髙麗夏遣使來賀丁夘以尚書省定網捕走獸法或至徒上曰以禽獸之故而抵民以徒是重禽獸而輕民命也豈朕意哉自今有犯可杖而釋之詔御史中丞伊喇道廉問山東河南辛未禁民間稱言銷金條理内舊有者改作明金字辛巳以大名路諸明安民戸艱食遣使𤼵倉廩減價出之四月己丑謂宰臣曰朕觀在位之臣初入仕時競求聲譽以取爵位亦既顯達即狥黙苟容為自安計朕甚不取宜宣諭百官使知朕意癸巳遣翰林修撰富察烏琿監察御史完顔和碩分詣河北西路大名河南山東等路勸明安穆昆農五月丙辰朔符寶郎圖克坦懐貞為横賜髙麗使宿直将軍完顔賽音為横賜夏國使戊辰尚書省奏越王永中隋王永功二府有所興造𤼵役夫上曰朕見宫中竹有枯瘁者欲令更植恐勞人而止二王府各有引從人力又奴婢甚多何得更役百姓爾等但以例為請海陵横役無度可盡為例耶自今在都浮役久為例者仍舊餘並官給傭直重者奏聞六月庚寅冀州張和等反伏誅戊戌以乆旱命宫中毋用扇庚子雨七月乙夘朔罷東北路採珠壬申觀稼于近郊八月甲申朔有司奏日食以雨不見伐鼓用幣如常禮九月甲寅朔以刑部尚書髙徳基等為賀宋生日使宿直将軍布薩守中為夏國生日使提㸃司天臺馬貴中為髙麗生日使罷皇太子月料嵗給錢五萬貫上謂臺臣曰比聞朝官内有攬中官物以規貨利者汝何不言皆對曰不知上曰朕尚知之汝有不知者乎朕若舉行汝将安用壬戌秋獵十月丁亥還都辛丑以尚書右丞相赫舍哩良弼為左丞相樞密使赫舍哩志寜為右丞相詔宗廟之祭以鹿代牛著為令丙午大享于太廟辛亥以平章政事完顔思敬為樞密使十一月己未以尚書右丞完顔守道為平章政事右丞石琚為左丞參知政事孟浩為右丞庚申上幸東宫辛酉以京兆尹毅等為賀宋正旦使壬戌冬獵丙子還都十二月丙戌詔賑臨潢泰州山東東路河北東路諸明安民東京留守圖克坦喀齊喀為平章政事丁酉太白晝見辛丑獵近郊丙午制職官犯公罪在官已承伏者雖去官猶論十年正月壬子朔宋髙麗夏遣使來賀甲子命宫中元宵無得張燈甲戌以司徒御史大夫李石為太尉尚書令二月甲午安化軍節度使圖克坦子温副使老君努以􅂍罪誅戊申上謂近臣曰䕶衛以後皆是治民之官其令教以讀書三月壬子朔萬春節宋髙麗夏遣使來賀丙辰上因命䕶衛中善射者押賜宋使射弓宴宋使中五十押宴者纔中其七謂左右将軍曰䕶衛十年出為五品職官每三日上直役亦輕矣豈徒令飽食安卧而已弓矢不習将焉用之戊午以河南統軍使宗敘為參知政事庚午上謂參政宗叙曰卿昨為河南統軍時言黄河堤埽利害甚合朕意朕每念百姓差調官吏互為姦弊不早計料臨期星火率斂所費倍蓰為害非細卿既參朝政皆當革弊擇利行之又諭左丞石琚曰女直人徑居達要不知閭閻疾苦汝等自丞簿至是民間何事不知凡有利害宜悉敷陳四月丁酉制命婦犯姦不用夫廕以子封者不拘此法五月乙夘如栁河川閏月庚辰夏國任得敬脅其主李仁孝使上表請中分其國上問宰臣李石石等以為事繫彼國不如許之上曰彼劫于權臣耳詔不許并却其貢物七月壬午秋獵戊戌放圍場役夫詔扈從糧食並從官給乙夘勑扈從人縱畜牧蹂踐禾稼者杖之仍償其值八月己未至自栁河川壬申遣參知政事宗敘北巡九月庚辰尚書左丞相赫舍哩良弼丁憂起復如故壬午以簽書樞密院事伊喇子敬為賀宋生日使庚寅戸部即中𤓰爾佳阿里布為夏國生日使十月己酉以大宗正丞堅為髙麗生日使甲寅如霸州冬獵乙丑上謂大臣曰比因巡獵聞固安縣令髙昌裔不職已令罷之霸州司候成奉先奉職謹恪可進一階除固安令辛未上謂宰臣曰朕凡論事有未能深究其利害者卿等宜悉心論列無為面從而退有後言十一月辛巳制盜太廟物者與盜宫中物同論甲申上幸東宫丁亥以太子詹事富察富色克等為賀宋正旦使癸巳夏國以誅任得敬遣使來謝詔慰諭之十二月丙寅上謂宰臣曰比體中不佳有妨朝事今觀所奏事皆依條格殊無一利國之事若一朝行一事嵗計有餘則其利溥矣朕居深宫豈能悉知外事卿等尤當注意十一年正月丙子朔宋夏遣使來賀丁丑封子永升為徐王永蹈為滕王永濟為薛王壬午詔職官年七十以上致仕者不拘官品並給俸禄之半丙申命賑南京屯田明安被水災者戊戌尚書省奏汾陽軍節度使副牛信昌生日受饋獻法當奪官上曰朝廷行事苟不自正何以正天下尚書省樞宻院生日節辰饋獻不少此而不問小官饋獻即加按劾豈正天下之道自今宰執樞密饋獻亦宜罷去上謂宰臣曰往嵗清暑山西近路禾稼甚廣殆無畜牧之地因命五里外乃得耕墾今聞民皆去之他所甚可矜憫其命依舊耕種事有類此卿等宜即告朕三月己亥朔萬春節宋夏遣使來賀辛巳命有司以天水郡公旅襯依一品禮葬于鞏洛之原四月丁未歸徳府民臧安兒謀反伏誅大理卿李昌圖以廉問真定尹圖克坦貞咸平尹舒穆嚕阿瑪拉受􅂍事既得實不即黜罷杖之四十癸亥參知政事魏子平罷髙麗國王晛弟皓廢其主自立詐稱讓國遣使以表來上五月辛夘詔遣吏部侍郎靖使髙麗問故癸巳以南京留守伊喇成為樞宻副使六月己酉詔曰諸路常貢數内同州沙苑羊非急用徒勞民爾自今罷之朕居深宫勞民之事豈能盡知當具以聞戊午觀稼于近郊甲子平章政事圖克坦喀齊喀薨七月甲申參知政事宗敘薨八月癸夘朔太白晝見詔朝臣曰朕嘗諭汝等國家利便治體遺闕皆可直言外路官民亦嘗言事汝等終無一語凡政事所行豈能皆當自今直言得失毋有所隠乙巳上謂宰臣曰隨朝之官自謂厯一考則當得某職兩考則當得某職第務因循碌碌而已自今以外路官與内除者察其公勤則升用之但苟簡于事不須任滿便以本品出之賞罰不明豈能勸勉庚戌詔曰應因斡罕被掠女直及諸色人未經刷放者官為贖放隠匿者以違制論其年幼不能稱説住貫者從便住坐上謂宰臣曰五品以下闕員甚多而難于得人三品以上朕則知之五品以下不能知也卿等曽無一言見舉者欲畫久安之計興百姓之利而無良輔佐所行皆尋常事耳雖日日視朝何益之有卿等宜勉思之己巳以尚書刑部侍郎烏凌阿天錫等為賀宋生日使近侍局使劉珫為夏國生日使九月癸未獵于横山庚寅還都十月壬寅朔以左宣徽使敬嗣暉為參知政事甲寅上謂宰臣曰朕已行之事卿等以為成命不可復更但承順而已一無執奏且卿等凡有奏何嘗不從自今朕㫖雖出宜審而行有未便者即奏改之或在下位有言尚書省所行未便亦當從而改之毋拒而不從丙寅尚書左丞相赫舍哩良弼進睿宗實録戊辰上謂宰臣曰衍慶宫圖畫功臣已命増為二十人如丞相韓企先自本朝興國以來憲章法度多出其手至于闗決大政但與大臣謀議終不使外人知覺漢人宰相前後無比若褒顯之亦足示勸慎無遺之十一月丁丑以西南路招討使宗寜等為賀宋正旦使戊寅幸東宫上謂皇太子曰吾兒在儲貳之位朕為汝措天下當無復有經營之事汝惟無忘祖宗純厚之風以勤修道徳為孝明信賞罰為治而已昔唐太宗謂其子髙宗曰吾伐髙麗不克終汝可繼之如此之事朕不以遺汝如遼之海濵王以國人愛其子嫉而殺之此何理也子為衆愛愈為美事所為若此安有不亡唐太宗有道之君而謂其子髙宗曰爾于李勣無恩今以事出之我死宜即授以僕射彼必致死力矣君人者焉用偽為受恩于父安有忘報于子者乎朕御臣下惟以誠實耳羣臣皆稱萬嵗丙戌朝享于太廟丁亥有事于圓丘大赦癸巳羣臣奉上尊號曰應天興祚欽文廣武仁徳聖孝皇帝乙未詔中外十二月癸夘冬獵乙夘還宫丙辰參知政事敬嗣暉薨辛酉進封越王永中趙王隋王永功曹王瀋王永成􅃎王徐王永升虞王滕王永蹈徐王薛王永濟滕王乙丑趙王永中曹王永功俱授明安仍命永功親治事以習為政金史卷六
