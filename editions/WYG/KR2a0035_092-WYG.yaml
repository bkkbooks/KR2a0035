body:
  text: 金史卷九十二元中書右丞相總裁托克托等修列傳第三十毛碩李上逹曹望之大懐貞盧孝儉盧庸李偲圖克坦克寜本名錫馨毛碩字仲權甘陵人宋末試弓馬子弟碩中選調髙陽闗路安撫司准備差使尋辟河間尉再辟兵馬都監宗望軍至碩以夲部迎降齊國建由淮東路第一副将擢知滑州劉麟伐宋充行營中軍統制軍馬天眷間厯汴京路山東西路兵馬都監皇統元年權知拱州宋将張俊㨿亳州而柘城酒監房人傑叛以應俊碩𤼵兵討之至柘城躬叩城門呼耆老以諭意縣人縛人傑以降碩徑入縣署召百姓慰安之衆皆感悦刻石紀其事四年真授拱州刺史元帥梁王宗弼承制授武義将軍改知曹州有書生投書於碩辭涉謗訕僚屬皆不能堪碩延之上座謝曰使碩常聞斯言庶乎寡過士論以故嘉之遷鄭州防禦使尋改通州天徳二年充陜西路轉運使碩以陜右邊荒種藝不過麻粟蕎麥賦入甚薄市井交易惟用絹乾薑商賈不通酒稅之入耗減請視汴京燕京例結交鈔通行而鞏㑹徳順道路多險鹽引斤數太重請一引分作三四以從輕便朝廷皆從之秦州倉粟陳積而百姓有支移者止就本州折納其直公私便之改河東南路轉運使上言頃者定立商酒課不量土産厚薄戸口多寡及今昔物價之增耗一槩理責之故監官被繫失身破家折傭逃竄或為姦吏盜有實錢而以賒劵輸官故河東有積負至四百餘萬貫公私苦之請自今禁約酒官不得折准賒貸惟許收用實錢則官民俱便至今行之秩滿除南京路都轉運使大定六年致仕卒于家碩文雅好士性謹飭每見古人行事有益於時者常書置座右以為莅官之戒云李上達字達道曹州濟隂人在宋時以䕃補官累東平府司戸參軍達蘭取東平上達給軍須號辦治齊國建為吏部員外郎攝戸部事劉豫行什一之法樂嵗輸多歉嵗寡取之蓋古人助法也收歛之時蓄積蓋藏民或不以實輸官官亦不肯盡信於是告訐起而獄訟繁公私苦之上達論其弊豫改定為五等之制齊國廢以河南與宋人上達隨地入宋宗弼復取河南上達為同知大名尹按察陜西河南是時闗陜蒲解汝蔡民飢上達輙以便宜發倉粟賑百姓累遷知山東西路轉運使上達到官再期比舊增三十餘萬貫戸部以其法頒之鄰路上達長於吏事能治繁劇猾不能欺所至稱之卒官年六十一曹望之字景蕭其先臨潢人遼季移家宣徳天㑹間以秀民子選􅂶女直字學生年十四業成除西京教授為元帥府書令史補正令史轉行臺省令史録教授資補修武校尉除右司都事吏部侍郎田瑴素薄望之望之願交不肯納遂與蔡松年許霖構致黨獄改行臺吏部員外郎海陵為相嘗以書致其私望之不從天徳元年調同知石州軍州事坐事免丁母憂久之除絳陽軍節度副使入為戸部員外郎詔買牛萬頭以給按春八明安徙居南京者望之主給之薩巴反轉致甲仗八萬自洺州輸燕子城運米八十萬斛由蔡水入淮饋伐宋諸軍期以一日望之如期集事進本部郎中特賜進士及第大定初討斡罕望之主軍食給與有節凡省糧三十萬石省剉草五十萬石帥府以㨗入告議者欲遂罷轉輸望之以為元惡末誅不可弛備既而大軍追討果賴以濟以勞進一階兼同修國史請於大鹽濼設官𣙜鹽聽民以米貿易民成聚落可以固邊圉其利無窮從之其後凡貯米二十餘萬石及東北路嵗饑賴以濟者不可勝數三年上曰自正隆兵興農桑失業明安穆昆屯田多不如法詔遣戸部侍郎魏子平大興少尹同知中都轉運事李滌禮部侍郎李愿工部郎中伊喇道戸部員外郎完顔烏肯徹監察御史𤓰爾佳阿里布及望之分道勸農㢘問職官臧否望之還言乞汰諸路胥吏可減其半詔胥吏如故於是始禁用貼書遷本部侍郎領覆實繕修大内財用費用大省復以勞進階上召見諭勉之望之家奴袁一言渉妖妄大興府鞫治望之恐使戸部令史劉公輔問其事于大興少尹王全全具其事語公輔公輔以語望之御史臺劾奏劉公輔言泄獄情上曰妖妄之言交相傳說何也於是望之決杖一百王全杖八十劉公輔杖一百五十除名頃之運河堙塞世宗出郊見之問其故主者奏曰戸部不肯經畫嵗久以致如此上責望之曰有水運不濬治乃用陸運煩費民力罪在汝等其往治之尚書省奏當用夫役數萬人上曰方春耕作不可勞民以宫籍監戸及摘東宫諸王人從克役若不足即以五百里内軍夫補之太宗實録成監修國史赫舍哩良弼賜金帯一重綵二十端同修國史張景仁劉仲淵望之皆賜銀幣有差望之嘆賞薄謂人曰栽花接木乃加爵命勤勞者不遷官無何張景仁遷翰林學士望之又曰止與他人便遣獨不及我哉世宗聞之出望之徳州防禦使謂之曰汝為人能幹而心不忠實朕前往安州春水人言汝無事君之義朕敕臣下有過即當諫爭汝但面從退則謗議此不忠不孝也汝自五品起遷四品太宗皇帝實録成優賜銀幣不思盡心竭力惟官賞是覬今出汝於外宜改心滌慮不然則身亦莫保望之到徳州有恵政百姓為立生祠改同知西京留守事上書論便宜事其一論山東河北明安穆昆與百姓雜處民多失業陳蔡汝頴之間土廣人稀宜徙百姓以實其處復數年之賦以安輯之百姓亡命及避役軍中者閲實其人使還本貫或編近縣以為客户或留為佃户者亦籍其姓名州縣與明安事干涉者無相黨匿庶幾軍民恊和盗賊弭息其二論薦舉之法虚文無實宰相㧞擢及其所識不及其所不識内外官所舉亦輒不用或指以為朋黨遂不敢復舉宜令宰執歳舉三品二人御史大夫以下内外宫終秩舉二人自此以下以品殺為差等終秩不舉者遇轉官勒不遷三品者削後任俸三月其舉者已改除吏部以類品第季而上之三品闕則於類第四品中𥙷授四品五品以下視此為差其待以不次者宰執具才行功實以聞舉當否罪當如律亷介之士老於令幕無舉主者七考無􅂍私罪者准朝官三考勞敘吏部每季圖上外路職官姓名路為一圖大書贓汙者於其名下使知畏慎外任五品以上官改除令代之者具功過以聞年六十以上者終更赴調有司察其視聽精力老疾不堪釐務給以半禄罷遣其三論守邊將帥及沿邊州縣官漁剥軍民多興力役宜嵗遣監察御史周行察之邊部有訟招討司無得輙遣白身中徵斷宜於省部有出身女直契丹人及縣令丞簿中擇廉能者因其風俗畧定科條務為簡易徵斷羊馬入官籍數如邊部遇饑饉即以此賑給之招討及都監視事宜限邊部饋送馳馬招討司女直人戸或擷野菜以濟艱食而軍中舊籍馬死則一村均錢補買往往鬻妻子賣耕牛以備之臣恐數年之後邊防困弊臨時賑濟費財十倍而無益早為之所則財用省而邊備實矣官給軍箭用盡則市以補之皆朽鈍不堪用可每嵗給官箭一分以補其闕邊民闕食給米地逺負重往往就倉賤賣而去可計口支錢則公私兩便陜西正副宜如明安穆昆用土人一員隊將亦宜參用土人久居其任增弓箭田復其賦役以㢘吏為提舉舉察總管府以下官農隙校閲以嚴武備則太平之時有經畧之制矣又論六鹽塲用人宜令戸部公議辟舉論漕運先計河倉見在幾何通州容受幾何京師嵗費幾何今近河州縣嵗稅或六七萬石小民有入資之費富室收轉輸之利益計實數以科稅入論民間私錢苦惡宜以官錢五百易私錢千期以一月易之過期以銷錢法坐之論州縣力役錢物戸部頒印署白簿使盡書之以俟審閱有畏避不書者坐之論工部營造調發妨民生業諸路射糧軍約量人數習武藝期以三年成以息調民書奏多見采納以本官行六部事於北邊召拜户部尚書上數之曰汝前為侍郎以不忠外補頗能練習錢穀故任以尚書之重宜改前非以圖新効也是時戸部尙書髙徳基坐髙估俸粟責降世宗念望之吝出納或懲徳基也既出使人諭之曰勿以髙徳基下粟直要在平估而已十五年新宫成世宗幸新宫勅望之曰新宫中所須毋取于民間也有良民夫婦質身於東京留守完顔古雲家期終而不遣尚書省下東京鞫治望之言古雲為留守其同官必且阿狥不肯窮竟當移他州望之久習事有治錢穀名性剛愎頗沾沾自露希覬執政而刑部尚書梁肅自詳問宋國使還世宗嘗欲以為執政久而未用亦頗衒耀求進世宗謂左丞相赫舍哩良弼曰曹望之梁肅急於見知渉於躁進遂出梁肅為濟南尹數年乃召拜參知政事而望之終於戸部尚書年五十六世宗惜其未及用賜錢三千貫勅使致祭賻銀五百兩重綵二十端絹二百匹以其子淵為奉御澤為筆硯承奉其後尚輦局舉出身人年六十餘可以臨事世宗曰豈為此軰惜官邪但此軰專以盜取官錢為謀生計不可用也由是欲更改監臨格式以問戸部尚書劉瑋瑋恐監官謗已不肯實對世宗因思望之嘆曰不如望之之敢行也望之初不學及貴稍知讀書遂刻苦自致有詩集三十卷大懷貞字子正遼陽人皇統五年除閤門祗候三遷東上閤門使丁母憂起復符寳郎累官右宣徽使正隆伐宋為武勝軍都總管大定二年除洺州防禦使兼押軍萬戸改沂州再遷彰國安武軍節度使縣尉獲盜得一旗上圖亢宿詰之有謀叛狀株連幾萬人懐貞當以亂民之刑請誅其首亂者十八人餘皆釋之嘗以私忌飯僧數人就中一僧異常懐貞問曰汝何許人也對曰山西人復問曾為盜殺人否對曰無之後三日詰盜果引此僧皆服其明察改興中尹錦州富民蕭鶴壽塗中殺人匿府少尹家有司捕不得懷貞以計取之寘於法改彰徳軍節度使卒盧孝儉宣徳州人登天眷二年第調憲州軍事判官補尚書省令史累官太原少尹大定二年陜西用兵尚書省發本路税粟赴平凉充軍實期甚嚴迫孝儉輒易以金帛馳至平凉用省而不失期并人稱之用亷進官二階遷同知廣寜尹廣寜太饑民多流亡失業乃借僧粟留其一歳之用使平其價市與貧民既以救民僧亦獲利累遷山東東路轉運使孝儉素􅄶躁與同僚王公謹失歡其子嘗私用官帑孝儉不知也既而改河北西路轉運使公謹乃發其事孝儉聞被逮莫測所以行至章邱自縊死盧庸字子憲薊州豐潤人大定二十八年進士調唐州軍事判官再調定平縣令庸治舊堰引涇水溉田民賴其利𥙷尚書省令史除南京轉運副使改中都户籍判官察亷遷禮部主事累官鳯翔治中大安三年徴陜西屯田軍衛中都以庸簽三司事主兵食至潞州放還屯田軍庸改乾州刺史入為吏部郎中至寜元年改陜西按察副使夏人犯邊庸繕治平凉城池積芻粟團結土兵為備十一月夏人掠鎮戎䧟涇邠遂圍平凉庸矢盡募人取夏兵射城上箭以濟急用出府庫賞有功者人樂為死平凉賴以完貞祐二年庸移書陜西行省布薩端大槩謂慶陽平涼徳順陜西重地長安以西邠為阸塞當重兵屯守詔賞平涼功庸進官四階遷按察轉運使三年詔諸道按察使講究防秋庸陳便宜曰自鄜延至積石雖多溝坂無長河大山為之屏蔽恃弓箭手以禦侮其人皆剛猛善鬬熟于地利夏人畏之向者徙屯他所夏人即時犯邊此近年深患也人情樂土且耕且戰緩急將自奮又曰防秋之際宜先清野又曰掌軍之官不宜臨時易代兵家所忌將非其人屢代何益無何有言庸老不勝任者即罷之未幾改定海軍節度使山東亂不能赴按察司劾之當奪兩官審理官直之庸以病請求醫藥致仕興定三年卒李偲字子友定州安喜人中天眷二年進士調遼山簿累官戸部主事丁母憂起復舊職除同知河東南路轉運使事大定初改同知中都路都轉運使事布薩忠義行省事於汴京奏偲幕府世宗曰李偲方治京畿漕事行省可他選也三年權知登聞檢院再遷戸部侍郎上曰戸部財用出入朕難其人卿非舊勞資敘尚淺勿以秩滿例升三品因循嵗月若不自勉必不汝貸偲每朝㑹與髙徳基屏人私語上聞而恠之問右丞石琚曰李偲果何如人琚曰亦幹事吏耳改同知北京留守沂州防禦使沂南邊郡戸部符借民閑田種禾取藁秸備警急用度偲曰如此則農民失業具奏止之轉運司牒郡輸粟朐山調急夫數萬人是時久雨泥濘輓運不能前進偲遣吏往朐山刺取其官廪見儲糧數可支半嵗即具其事牒運司請緩期毋自困百姓先是郡縣街陌間聽民作㕓舍取其僦直至是罷收僦直㕓舍一切撤毁他郡奉承號令督百姓必盡撤取使街陌繩齊矢棘如初時然後止偲獨教民撒治前却不齊一者三五所使巷道端正即已民便之改陜西西路轉運使卒贊曰毛碩李上達曹望之李偲之流皆金之能吏也望之悻悻然以求大用君子無取焉圖克坦克寧本名錫馨其先金源縣人徙居北古土之地後徙置明安于山東占籍萊州父和珍官至汾陽軍節度使克寧資質渾厚寡言笑善騎射有勇畧通女直契丹字左丞相希尹克寧母舅熙宗問希尹表戚中誰可侍衛者希尹奏曰錫馨可用以為符寶祗候是時悼后千政后弟費摩呼圖侮克寧克寧毆之明日呼圖以告悼后后曰錫馨剛直必汝之過也已而􅂶護衞轉符寶郎遷侍衞親軍馬步軍都指揮使改忠順軍節度使克寧娶宗幹女嘉祥縣主同母兄富勒堅判大宗正事海陵忌之出為西京留守構致其罪誅之因降克寧知􅅬陽軍厯宿州防禦使呼爾哈路節度使海蘭路兵馬都總管大定初詔克寧以本路兵㑹東京遷左翼都統詔與廣寧尹布薩歡塔同知廣寧尹完顔頁頁肇州防禦使唐古烏頁從右副元帥完顔黙音討契丹斡罕趨濟州黙音用契丹降吏竒徹計䇿襲賊輜重克寧與赫舍哩志寧為殿與賊遇于長濼黙音使使兵于左翼之側賊二萬餘躡吾後又以騎四百餘突出左翼伏兵之間欲繞出陣後攻我克寧與善射二十餘人拒之衆曰賊衆我寡不若與伏兵合擊或與大軍相依可以萬全克寧曰不可若賊出陣後則前後夾擊我敗矣大軍不可俟也於是奮擊賊乃却左翼萬戸襄與大軍合擊之賊遂敗追奔十餘里二年四月一日也越九日復追及賊干霿􅟶河左翼軍先與賊戰克寧以騎三千追掩十五里賊迫澗不得亟渡殺傷甚衆賊收軍返斾大軍尚未至克寧令軍士下馬射賊賊遂引而南是時斡罕已再北元帥黙音利虜掠駐師白濼世宗訝其持久遣問之黙音曰賊騎壯我騎弱此少駐所以完養馬力也不然非益萬騎不可勝克寧奮然而言曰吾馬固不少但帥不得人耳其意常利虜掠賊至則引避賊去則緩隨之故賊常得善牧而我常拾其蹂踐之餘此吾馬所以弱也今誠能更置良帥雖不益兵可以有功不然騎雖十倍未見其利也朝廷知其議召還黙音以平章政事布薩忠義兼都元帥師將發賊聲言乞降克寧曰賊初困蹙且無降意所以揚言者是欲緩吾師期也不若攻其未備賊若挫衂則其降必速如其不降乘其怠而急擊之可一戰而定也忠義以為然乃與克寧出中路遂敗賊兵于婁博囉之地賊奔七渡河負險為柵克寧覘知賊栅之背其勢可上乃潛師夜登俯射之大軍自下攻賊潰皆遁去契丹平克寧除太原尹未閲月宋呉璘侵陜右元帥左都監圖克坦喀齊喀乞益兵遣克寧佩金牌駐馬平涼詔喀齊喀曰朕遣克寧參議軍事其智勇足敵萬人不必益軍克寧至下令安輯未幾民皆完聚治兵伐宋右丞相布薩忠義駐南京節制諸軍左副元帥赫舍哩志寧經畧邊事克寧改益都尹兼山東路兵馬都總管行軍都統四年元帥府欲遣左都監璋以兵四千由水路進詔曰可付都統圖克坦錫馨仍益兵二千擇良將副之璋可經畧山東於是克寧出軍楚泗間與宋將魏勝相拒于楚州之十八里口魏勝取弊舟鑿其底貫以大木列植水中别以船載巨石貫以鐡鏁沉之水底以塞十八里口及淮渡舟路以步兵四萬人屯於淮渡南㟁運河之間克寧使錫黙和尚選善游者没水繫大繩植木上數百人於㟁上引繩曵一植木皆㧞出之徹去沉船進至淮口宋兵來拒隔水矢石俱發錫黙和尚以竹編籬捍矢石復㧞去植木沉船師遂入淮與宋兵奪渡口合戰數四明安長壽先行薄㟁水淺先率勁卒數人涉水登㟁敗其津口兵五百人餘衆皆濟宋兵四百餘自清河口來鎮國上將軍富察阿里罕以歩兵百人禦之克寜自與章京尼楚赫五騎先行六七里與宋戰尼楚赫先登奮擊敗之宋大兵整陣來拒克寧麾兵前戰自旦至午宋兵敗踰運河為陣餘衆數千皆走入營中克寧使以火箭射其營舍盡焚踰河撤橋與其大軍相㑹隔水射之宋兵不能為陣明安楚呼以六十騎擊宋騎兵千餘不利少却克寧以明安薩喇九十騎横擊之宋兵大敗追至楚州射殺魏勝遂取楚州及淮隂縣是役也薩喇功居多是時宋屢遣使請和布薩忠義赫舍哩志寧約以世為叔姪國割還海泗唐鄧四州宋人尚遷延有請及克寧取楚州宋人大懼一一如約兵罷改大名尹厯河間東平尹召為都㸃檢十一年從丞相志寧北伐還師十一月皇太子生日世宗置酒東宫賜克寧金帯明年遷樞密副使兼知大興府事改太子太保樞密副使如故拜平章政事封密國公克寧女嫁為瀋王永成妃得罪克寧不悅求致仕不許罷為東京留守明年上將復相克寧改南京留守兼河南統軍使遣使者諭之曰統軍使未嘗以留守兼之此朕意也可過京師入見克寧至京師復拜平章政事授世襲伯竒圖河明安兼親管穆昆世宗欲以制書親授克寧主者不知上意及克寧已受制上謂克寧曰此制朕欲親授與親誤授之於外也又曰朕欲盡徙卿宗族在山東者居之近地卿族多官田少無以盡給之乃選其最親者徙之十九年拜右丞相徙封譚國公克寧辭曰臣無功不明國家大事更内外重任當自愧乞歸田里以盡餘年上曰朕念衆人之功無出卿右者卿慎重得大臣體毋復多讓克寧出上使圖克坦懐忠諭之曰凡人醉時醒時處事不同卿今日親賔慶㑹可一飲過今日可勿飲也克寧頓首謝曰陛下念臣及此臣之福也克寧為相持正守大體至於簿書期㑹不屑屑然也世宗嘗曰錫馨在樞宻未嘗有過舉謂克寧曰宰相之職進賢為上克寧謝曰臣愚幸得備位宰輔但不能明於知人以此為恨耳二十一年左丞相守道為尚書令克寧為左丞相徙為定國公懇求致仕上曰汝立功立事迺登相位朝廷是賴年雖及未可去也後三日與守道奏事俱跪而請曰臣等齒髮皆衰幸陛下賜以餘年上曰上相坐而論道不惟其官惟其人豈可屡改易之邪頃之克寧改樞密使而難其代復以守道為左丞相虛尚書令位者數年其重如此未幾以司徒兼樞密使二十二年詔賜今名二十三年克寧復以年老為請上曰卿昔在政府勤勞夙夜除卿樞密使亦可以優逸矣朕念舊臣無幾人萬一邊隅有警選將帥授方畧山川險要兵道軍謀舍卿誰可與共者勉為朕留克寧乃不敢復言二十四年世宗幸上京皇太子守國詔左丞相守道與克寧俱留中都輔太子上謂克寧曰朕廵省之後萬一有事卿必躬親之毋忽細微圖難於其易可也二十五年左丞相守道賜宴北部詔克寧行左丞相事是時世宗自上京還次天平山清暑皇太子薨於京師諸王妃主入宫弔哭奴婢從入者多頗喧雜不嚴克寧遣出之身護宫門嚴飭殿廷宫門禁衛如法然後聽宗室外戚入臨從者有數謂東官官屬曰主上廵幸未還宫闕太子不幸至于大故汝等此時能以死報國乎吾亦不敢愛吾生也辭色俱厲聞者肅然敬憚章宗時為金源郡王哀毁過甚克寧諫曰哭泣常禮也郡王身居冡嗣豈以常禮而忘宗社之重乎召太子侍讀完顔匡曰爾侍太子日久親臣也郡王哀毁過甚爾當固諫謹視郡王勿去左右世宗在天平山皇太子訃至哀慟者屢矣聞克寧嚴飭宫衛謹護皇孫嘉其忠誠而愈重之九月世宗還京師十一月克寧表請立金源郡王為皇太孫以係天下之望其畧曰今宣孝皇太子陵寢已畢東宫虚位此社稷安危之事陛下明聖超越前古寧不察此事貴果㫁不可緩也緩之則起覬覦之心來䜛侫之言䜛侫之言起雖欲無疑得乎兹事深可畏大可慎而不畏不慎豈惟儲位久虚而骨肉之禍自此始矣臣愚不避危身之罪伏願亟立嫡孫金源郡王為皇太孫以釋天下之惑塞覬覦之端絶搆禍之萌則宗廟獲安臣民䝉福臣備位宰相不敢不盡言惟陛下裁察踰月有詔起復皇孫金源郡王判大興尹封原王世宗諸子中趙王永中最長其母張𤣥徴女𤣥徴子汝弼為尚書左丞二十六年世宗出汝弼為廣平尹於是左丞相守道致仕遂以克寧為太尉兼左丞相原王為右丞相因使克寧輔導之原王為丞相方四日世宗問之曰汝治事幾日矣對曰四日京尹與省事同乎對曰不同上笑曰京尹浩穣尚書省總大體所以不同也數日復謂原王曰宫中有四方地圖汝可觀之知逺近阨塞也世宗與宰相諭錢幣上曰中外皆患錢少今京師積錢止五百萬貫除屯兵路分其他郡縣錢可運至京師克寧曰郡縣錢盡入京師民間錢益少矣若起運其半其半變折輕齎庻幾錢貨流布也上嘉納之章宗雖封原王為丞相克寧猶以未正太孫之位屢請於世宗世宗嘆曰克寧社稷之臣也十一月戊午宰相入見于香閣既退原王已出克寧率宰臣屏左右奏立太孫世宗許之庚申詔立原王右丞相為皇太孫明日圖克坦公弼尚息國公主納幣賜六品以上宴慶和殿上謂諸王大臣曰太尉忠實明逹漢之周勃也稱嘆再三克寧進酒上舉觴為之釂有詔給太尉假三日明年正月復求解機務上曰卿遽求去邪豈朕用卿有未盡乎或因喜怒用刑賞乎其他宰相未有能如卿者宜勉留以輔朕卿若思念鄉土可以一徃不必謝政事三月一日朕之生辰卿不必到從容至暑月還京師相見四月克寧還朝入見上上問曰卿徃鄉中百姓皆安業否克寧曰生業頗安然初起移至彼未能滋殖耳未幾以丞相監修國史上問史事奏曰臣聞古者人君不觀史願陛下勿觀上曰朕豈欲觀此深知史事不詳故問之耳初盧溝河決久不能塞加封安平侯久之水復故道上曰鬼神雖不可窺測即獲感應如此克寧奏曰神之所佑者正也人事乖則弗享矣報應之來皆由人事上曰卿言是也世宗頗信神仙浮圖之事故克寧及之宋前主殂宋主遣使進遺留物上恠其禮物薄克寧曰此非常貢責之近於好利上曰卿言是也乃以其玉器五事玻瓈器大小二十事及茶器刀劍等還之二十八年十一月癸丑上幸克寧第初上欲以甲第賜克寧克寧固辭乃賜錢因其舊居宏大之畢工上臨幸賜金器錦繡重綵克寧亦有獻上飲懽甚解御衣以衣之詔畫克寧像藏内府十二月乙亥世宗不豫甲申克寧率宰執入問起居上曰朕疾殆矣謂克寧曰皇太孫年雖弱冠生而明逹卿等竭力輔之又曰尚書省政務權聴於皇太孫克寧奏曰陛下幸上京時宣孝太子守國許除六品以下官今可權行也上曰五品以下亦何不可乙酉詔皇太孫攝行政事注授五品以下官詔太孫與諸王大臣俱宿森中克寧奏曰皇太孫與諸王宜别嫌疑正名分宿止同處禮有未安詔太孫居慶和殿東廡丙戍詔克寧以太尉兼尚書令封延安郡王平章政事襄為右丞相右丞張汝霖為平章政事戊子詔克寧襄汝霖宿於内殿二十九年正月癸巳世宗崩于福安殿是日克寧等宣遺詔立皇太孫為皇帝是為章宗徙封為東平郡王詔克寧朝朔望朝日設坐殿上克寧固辭詔近臣勉諭克寧涕泣謝曰憐憫老臣幸免常朝豈敢當坐禮其後毎朝必為克寧設坐克寧侍立益敬即位詔文凡除名開落官吏並量材録用張汝霖奏真盜枉法不可恕克寧曰陛下初即位行非常之典贓吏誤沾恩宥其害小國之大信不可失也章宗深然之無何進拜太傅兼尚書令賜尚衣玉帯乞致仕不許詔譯諸葛孔明傳賜之詔尚書省曰太傅年髙旬休外四日一居休大事録之細事不須親也賜金五百兩銀五千兩錢千萬重綵二百端絹二千匹尚書省奏明安穆昆願試進士者聴之上曰其應襲明安穆昆者學於太學可乎克寧曰承平日久今之明安穆昆其材武已不及前軰萬一有警使誰禦之習辭藝忘武備於國弗便上曰太傅言是也章宗初即位頗好辭章而疆場方有事故克寧言及之明昌二年克寧屬疾章宗徃視之克寧頓首謝曰臣無似嘗䝉先帝任使陛下即位屬以上相今臣老病將先犬馬填溝壑無以輔明主綏四方陛下念臣駑怯親枉車駕臨幸死有餘罪矣是日即榻前拜太師封淄王加賜甚厚是嵗二月薨遺表其大槩言人君往往重君子而反疎之輕小人而終昵之願陛下慎終如始安不妄危而言不及私詔有司護喪事歸𦵏于萊州諡曰忠烈明昌五年配享世宗廟廷圖像衍慶宫大安元年改配享章宗廟廷贊曰圖克坦克寧可謂大臣矣功髙而身愈下位盛而心愈勞經曰在上不驕髙而不危制節謹度滿而不溢所以長守富貴故曰忠信匪懈不施其功履盛滿而不忘徳之上也孜孜勉勉恪守職業不居不可成不事不可行人主知之次也諫期必行言期必聽為其事必有其功者又其次也金史卷九十二
