body:
  text: 金史卷一百十七元中書右丞相總裁托克托等修列傳第五十五圖克坦伊都鈕祜祿經實劉均附王賔王進等附國用安時青圖克坦伊都不詳其始嘗累官為延安總管正大九年正月行省事於徐州時慶善努撤東方之備入援未至睢州徐邳義勝軍總領侯進杜政張興率本軍䧏大兵於永州辛丑大兵守徐張盆渡伊都到官才三日懼兵少不能守即令伊喇長夀率甲士千人迎大兵長夀軍無紀律大兵掩之一軍皆覆徐危甚伊都籍州人及運糧埽兵得萬人乙巳大兵傅城燒南關而去侯進既降北即以為京東行省進遂請千人來襲二月庚申未明大兵坎南城而上守者皆散走城中大呼曰大兵入南門矣伊都聞之不及甲率州署夜直兵三百由黄樓而南力戰禦敵亂定遷賞有差由是軍勢稍振復奪張盆渡敗蕭縣破白塔戰於土山救被俘老幼五千還徐既而侯進亡命駐靈壁杜政張興亦慮為北所害窮窘自歸伊都撫而納之興留徐杜政還邳州伊都資稟仁厚持大體二子兩姪為軍將頗侵漁軍民青州人王祐為埽兵總領將兵千七百人伊都常倚之雖有過亦不責以故祐亦横恣與河間張祚下邑令李閏義勝都統豐紳遙授永州刺史成進忠輩乘軍政廢弛城中空虚以六月丁巳夜燒草塲作亂時張興臥病祐恐事不成起興與同行伊都疑左右皆叛挈妻子縋城而出就從宜重僧努及東面總領劉安國軍張興推祐為都元帥復懼祐圖已遂誅祐并張祚殺之因大掠城中壬戌國用安以行山東路尚書省事率兵至徐張興率甲士迎之用安輕騎而入執興與其黨十餘人斬之于市遂以豐紳為元帥兼節度使主徐州伊都窘無所歸乃奔宿州節度使赫舍哩阿古以伊都為人所逐不納乃與諸將駐于城南時宿之鎮防軍有逃還者阿古以為叛歸亦不納城中鎮防千户髙拉格結小吏郭仲安謀就徐州將士内外相應以取宿因歸楊妙真甲戌夜半開門納徐州總領王徳全及妻弟髙元格軍劉安國尋亦入城縳阿古父子殺之州中請伊都主帥府事伊都不從曰吾國家舊人為將帥亦乆以資性疎迂不能周防遂失重鎮今大事已去方逃罪不暇豈有改易髻髪奪人城池以降外方乎即日率官吏而行至穀熟東遇大兵不屈而死徐州既歸海州邳帥烏凌阿某亦讓印於杜政遂送款於用安已而州州王徳全劉安國亦送款海州惟伊都不改髻髪以至於死云鈕古祿經實不知其始正大中累官毫州節度使開興元年正月己丑游騎自鄧至毫鈔鹿邑營於衛真西北五十里鹿邑令高昻霄知太康已降即夜趨毫道出衛真呼縣令楚珩同行珩知勢不支即明諭縣人避遷之意遂同走亳丁未二邑皆降是日軍至亳州城下州止有單州兵四百人號鎮安軍提控楊春邢某都統戴興屯已六年經實悉籍城中丁壯為軍修守具而大兵亦不暇攻四月擁降民而北城門閉不之知也五月縱遷民収麥老幼得出丁壯悉留之民往往不肯留而遁數日城為之空經實遣將領各詣所屬招之并將領亦不返鎮安者皆紅襖餘黨力盡來歸變詐反覆朝廷終以盜賊待之經實以遷民為軍蓋防之也及召外兵不至乃請於歸徳得甲騎百餘兩總領統之既至鎮安疑其謀已乃乘將士新到不設備至夜掩殺殆盡經實出走衛真楚珩與之馬而去州中豪貴悉被剽略劉堅者初為大兵守城父亳州復擒之囚之於獄楊春謀欲北降乃出之使為宣差乙巳大兵石總管入州改州為順天府春為總管戴興為同知劉順治中留党項軍千人戍之屬縣皆下惟城父令李用宜不降其妻子在亳春以為質竟不屈而死春既據州與劉堅坐樓上召副提控刑某刑剛直循理將士嚴憚之時臥病聞春亂流涕不自禁春遣人舁致之邢指春大罵春慚恧無言春欲殺經實家邢力勸止之且令給道路費逸之出城邢尋病卒二年夏四月北省特黙岱攻歸徳春以戴興提精卒以徃獨與疲弱者守城州人王賔遂反正春渡河北遁既而崔齊錦為亂殺王賔朝廷不得已以齊錦為節度使就其兵杖入蔡八月劉順攻亳州破之齊錦為城父令所殺未幾單州軍以州人殺其家屬召大兵來攻不能拔殺屬縣民而去既渡河知亳人不疑復來攻州竟為春所破是年六月宋人來攻春出降劉堅北走劉均者林慮人時為亳州觀察判官春既遂經實納欵大兵脅均同降均佯應之歸其家取朝服服之顧謂妻子曰我起身刀筆仰荷上知始列朝著又佐大藩死亦足矣今頭顱已如此假使有十年夀何以見先帝於地下乎即仰藥而死王賔字徳卿亳州人貞祐二年進士外若曠達而深有謀畫初調蘭陵主薄辟虹縣令尋入為尚書省令史坐事罷歸鄉里天興元年正月亳州軍變節度使鈕祜祿經實出走楊春以州出降既而自以羸兵守之賔與前譙縣尉王進魏節亨吕鈞約城中軍民復其州楊春遂遁遣節亨詣歸徳以聞哀宗嘉之授進節度使賔同知節度使節亨節度副使鈞觀察判官楊春復以兵來攻月餘不能拔即渡河而北六月哀宗遷蔡賔奉迎於州北之高安上與語大悦恨用之晩擢為行部尚書世襲穆昆上初至亳賔等適徴民丁負鐵甲入蔡及㑹計忠孝軍家屬口糧故留參知政事張天綱董之就遷有功將士時亳之糧儲不廣賔等常吝惜軍士以此歸怨及運甲之役復不欲行㑹天綱與賔等於一樓上銓次立功等第鎮防軍崔富格王六十之徒擐甲譁譟登樓天綱問曰即欲見殺容我望闕拜辭賊曰無預相公即拽賔及吕鈞往市中鈞且行且跪涕泣俱下賔岸然不懼大呌曰不過殺我但殺但殺乃並害之節度副使魏節亨節度判官孫良觀察副使孫玖珠皆被害又數日殺節度使王進進嘗應經實之募由間道入汴京納奏賞以物不受又散家所有濟貧民以死自勵至汴以勞遷本州判度判官賜以白金亦不受一時甚稱之有李喜珠者本宿州重僧努下宣差天興二年四月進糧入歸徳將還聞亳州王進反正制旨以喜珠為振武都尉將兵三千􅀿援是時大兵圍亳步騎十萬喜珠以衆寡不敵獨與三人間道入城王進方議遷左軍林喜珠不可進即以兵付喜珠大兵攻八日不能下五月壬子兵退已未官努與阿里哈提忠孝軍百人至亳與諸將議遷可否以為不可當留輜重於蔡選軍扈從入聖朶就武仙軍遂入關中關中地利可恃又有郭哈瑪爾等軍在西可恃甲子詔召官努還歸徳不赴再召留其軍半於亳乃赴六月壬辰車駕舟行至亳王進奏臣本軍伍不知治體如李喜珠扈從入蔡則亳不守矣乞留治此州詔以喜珠為集慶軍節度使便宜從事進領帥職七月進死喜珠先往城父督糧餫聞亂遂不敢入亳後投宋論曰金季之亂軍士欲代其偏裨偏裨欲代其主將即羣起而僨之無復忌憚伊都經實皆忠亮之士賔進才略尤足取焉而並不免於難惜哉國用安先名安用本名咬兒淄州人紅襖賊楊安兒李全餘黨也嘗歸順大元為都元帥行山東路尚書省事天興元年六月徐州埽兵總領王祐義勝軍都統豐紳總領張興等夜燒草塲作亂逐元帥圖克坦伊都安用率兵入徐州斬張興及其黨十餘人以豐紳為元帥兼節度使主徐州宿州鎮防軍千户高拉格與面面總帥劉安國搆徐州總帥王徳全殺宿帥赫舍哩阿古以其州歸海州邳州從宜烏凌阿某亦讓州於杜政送欵海州既而皆歸安用北大將阿勒楚爾聞安用據徐宿邳大怒曰三州我當攻取安用何人輒受降遣信安張進等率兵入徐欲圖安用奪其軍安用懼謀於徳全劫殺張進及海州元帥田福等數百人與楊妙真絶乃還邳州會山東諸將及徐宿邳主帥刑馬結盟誓歸金朝既盟諸將皆散去安用無所歸遂同徳全安國託從宜重僧努自通於朝廷重僧努遣人上奏安用以數州反正功甚大且其兵力强盛材略可稱國家果欲倚用非極品重權不足以堅其許國之心未報安用率兵萬人攻海州未至衆稍散去安國因勸安用當赤心歸國安用亦自知反復失計事已無可奈何於是復金朝衣冠妙真怒其叛已又懼為所圖悉屠安用家走益都安用遂選兵分將期必得妙真自此淮海之上無寧歲矣未幾朝廷遣近侍局直長因世英都事高天祐持手詔至邳以安用為開府儀同三司平章政事兼都元帥京東山東等路行尚書省事特封兖王賜號英烈戡難保節忠臣錫姓完顔附屬籍改名用安賜金鍍銀印駞紐金印金虎符世襲千户宣命勅様牌樣御畫體宣空頭河朔山東赦文便宜從事且以彭王妃誥委用安招妙真用安始聞使者至猶豫未決以總領楊懋迎使者入堅于州廨問所以來世英對以封建事意頗順諸帥王杜輩皆不欲宣言欲殺使者明日用安乃出見使者跪揖如等夷坐定語世英曰予向隨大兵攻汴嘗於開陽門下與侯摯議内外夾擊此時大兵病死者衆十七頭項皆在京城若從吾計出軍中興乆矣朝廷乃無一人敢決者今日悔將何及言竟而起既而選人取朝廷賜物遍觀之喜見顔色復與使者私議欲不以朝禮受之世英等不可即設宴拜受如議以主事常謹等隨使者奉表入謝上復遣世英天祐賜以鐵劵一虎符六龍文衣一玉魚帶一弓矢二封贈其父母妻誥命及郡王宣世襲宣大信牌玉兎鶻帶各十聼同盟可賜者賜之使者至邳用安迎受如禮始有入援意及聞上將遷蔡州乃遣人以蠟書言遷蔡有六不可大率以為歸徳還城皆水卒難攻擊蔡無此險一也歸徳雖乏糧儲而魚芡可以取足蔡若受圍廩食有限二也大兵所以去歸徳者非畏我也縱之出而躡其後舍其難而就其易者攻焉三也蔡去宋境不百里萬一資敵兵糧禍不可解四也歸徳不保水道東行猶可以去蔡若不守去將安之五也時方暑雨千里泥淖聖體豐澤不便鞍馬倉卒遇敵非臣子所敢言六也雖然陛下必欲去歸徳莫若權幸山東山東富庶甲天下臣略有其地東連沂海西接徐邳南扼旰楚北控淄齊若鑾輿少停臣仰頼威靈河朔之地可傳檄而定惟陛下審察上以其言示宰臣宰臣奏用安反復本無匡輔志此必參議張介等議之業已遷蔡議遂寢初世英等過徐王徳全劉安國説之曰朝廷恩命豈宜出自用安郡王宣吾二人最當得者乞就留之世英乃留郡王宣世襲宣玉帶各二由是與用安有隙又懼為所圖皆不聼其節制十郡王者李明徳豐紳張瑀張友卓翼康琮杜政吳歪頭王徳全劉安國也用安必欲取山東累徵徐宿兵止以勤王為辭二帥不應用安怒令杜政等率兵三千以取糧為名襲徐宿既入城徳全覺之就留杜政豐紳不遣用安愈怒謂徳全安國必有謀乃執桃園帥吳某等八九人下獄鞫問二帥遣溫特赫張格以杜政豐紳欲襲取徐州白用安不聼驅吳帥張格輩九人併斬之張格將死大呼曰國咬兒汝無尺寸功受國家大封爵何負於汝而從杜政等變亂又殺無罪之人今雖死當與汝辨於地下矣㑹上遣臧國昌以密詔徵兵東方故用安假朝命聲言入援檄劉國安為前鋒親率兵三千駐徐州城下招徳全徳全終疑見圖不出繫豐紳於獄殺之遣杜政出城安國既至宿州用安復召安國還安國不從獨與重僧努赴援行及臨渙龍山寺用安使人劫殺之遂攻徐州踰三月不能下退歸漣水於是因世英以用安終不赴援乃還朝至宿州西遇大兵不屈而死事聞贈汝州防禦使既而用安軍食不給乞糧於宋宋陽許之即改從宋衣而私與朝使相親尋益之食軍民多亡去乃命蕭均以嚴刑禁亡者血流滿道大元東平萬戸扎拉將兵至漣水遂降焉扎拉既渡河趨蔡州用安以詭計還漣水復叛歸於宋受浙東總管忠州團練使隸淮閫甲午正月聞大兵圍沛用安往救之敗走徐州㑹移兵攻徐用安投水死求得其尸㓟面繫馬尾為怨家田福一軍臠食而盡用安刑狀短小無須喜與輕薄子游日擊鞠衢市間顧盼自矜無將帥大體介字介甫平州人正大元年經義進士第一時為用安參議初天祐等出汴微服間行經北軍營幕至通許崔橋始有義軍招撫司官府去京師二百里矣至陳州防禦使鈕祜祿納紳始立州事留二日至項城縣令朱珍立縣事有士卒千二百人至泰和縣縣令王義立縣已五月矣八月至宿州重僧努得報且知朝廷授以權宿州節度使兼元帥左都堅之命真彩輿儀衛出城五里奉迎時東方不知朝廷音問已八月矣官民見使者至且拜且哭有張顯者任俠尚氣知義理即謂天祐曰東方不知朝廷音問已數月今見使者百姓皆感動若不以聖旨撫慰之恐失東民之心我欲矯稱制者宣諭如何天祐書生守規矩不敢從但以宰相旨集州民慰撫之州民復大哭明日往徐州時青滕陽人初與叔父全俱為紅襖賊及楊安兒劉二祖敗承赦來降隸軍中興定初青為濟州義軍萬戸是時叔父全為行樞密院經歴官興定二年冬全馳驛過東平青來見因告全將叛入宋全秘之頃之青率其衆入于宋宋人置之淮南屯龜山有衆數萬興定四年泗州行元帥府赫舍哩約赫徳遣人招之青以書來書曰青本滕陽良民遭時亂離扶老攜幼避地草莽官吏不明此心目以叛逆無所逃死竄匿淮海離親舊去鄉邑豈人情之所樂哉僕雖偷生寄食他國首丘之念未甞一日忘之如朝廷赦青之罪乞假邳州以屯老幼當襲取盱眙盡定淮南以贖往昔之過約赫徳復書曰公等初亦無罪誠能為國違功全軍來歸即吾人也邳州吾城以吾人居之亦何不可易曰君子見幾而作不俟終日公其亟圖之生還父母之邦富貴終身傳芳後世與其覊縻異域目以兵虜孰愈哉約赫徳奏其事十月詔加青銀青榮祿大夫封滕陽公仍為本處兵馬總領元帥兼宣撫使青潛表陳謝復以邳州為請樞密院奏恐青意止欲得邳州可諭約赫徳若青誠實來歸即當授之如審其詐可使人入宋境宣布往來之言及所授官爵亦行間之術也青既不得邳州復為宋守興定五年正月二十五日夜青襲破泗州西城提控王祿遇害是時時全為同簽樞密院事朝廷不知青襲破西城止稱宋人而已詔全往督泗州兵取西城全至泗州獲紅襖賊一人詰問之乃知青為宋京東鈐轄襲破西城全頗喜乃殺其人以滅口約赫徳晝夜力戰募死士以梯衝逼城青縋兵出拒不得前約赫徳遣提控王應孫穴城東北隅青夜出兵來襲擊却之越二日復出又却之攻城益急青以舟兵二千合城中兵來犯約赫徳營提控鄂爾多先知設伏掩撃青兵大敗溺淮水死者千人自是不復出矣王應孫穴城將及城中青隧地然薪逼出之青乘城指麾流矢中目餘衆往往被創樓堞相繼摧壞城中恟懼遂無固志二月二十六日夜青拔衆走遂復西城元光元年二月全與元帥左監軍額爾克節制三路軍馬伐宋詔曰卿等重任毋致不和以貽喪敗其資糧可取規取失宜不能得之罪在額爾克既已得之不能運致以為我用罪在全全與額爾克由頴夀進渡淮敗宋人于高塘市攻固始縣破宋廬州將焦思忠兵無何獲生口言宋詔時青來拒全兵全匿其事五月兵還距淮二十里諸軍將渡全矯稱密詔諸軍且留収淮南麥遂下令人獲麥三石以給軍衆惑之額爾克及將佐勸之不聼軍留三日額爾克謂全曰淮水淺狹可以速濟時方暑雨若値暴漲宋乘其後不得完歸矣全力拒之從宜達哈伊實布色埒黙李辛稍稍不平全怒曰額爾克一帥耳汝曹黨之汝曹致身至此皆吾之力吾院官也於汝無不可者衆乃不敢言是夜大雨明日淮水暴漲乃為橋渡軍宋兵襲之軍遂敗續橋壊全以輕舟先濟士卒皆覆沒宣宗下詔誅之遣官招集潰軍詔曰大軍渡淮每立功効諸將謬誤部曲散亡流離憂苦朕甚閔焉各歸舊營勉圖自効又詔曰陣亡把軍品官子孫十五以上者依品官子孫例隨局承應十五以下十歲以上者依品從隨局給俸至成人本局差使無子孫官依例給俸應贈官賻錢軍人家口當養贍者並如舊制贊曰金自章宗季年宋韓侂胄搆難招誘隣境亡命以撓中原事竟無成而青徐淮海之郊民心一搖歲遇饑饉盜賊蠭起相為長雄又自屠滅害及無辜十餘年麋沸未息宣宗不思靖難復為伐宋之舉迄金之亡其禍尤甚簡書所載國用安時青等遺事至今仁人君子讀之猶蹙額終日當時烝黎如魚在釡其何以自存乎兵凶器也金以兵得國亦以兵失國可不慎哉可不慎哉金史卷一百十七
