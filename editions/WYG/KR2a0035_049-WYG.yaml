body:
  text: 金史卷四十九元中書右丞相總裁托克托等修志第三十食貨四鹽酒醋茶諸征商金銀税鹽金制𣙜貨之目有十曰酒麴茶醋香礬丹錫鐵而鹽為稱首貞元初蔡松年為戸部尚書始復鈔引法設官置庫以造鈔引鈔合鹽司簿之符引㑹司縣批繳之数七年一釐革之初遼金故地濱海多産鹽上京東北二路食肇州鹽率賓路食海鹽臨潢之北有大鹽濼烏庫哩寔壘部有鹽池皆足以食境内之民嘗征其税及得中土鹽場倍之故設官立法加詳焉然而増減不一廢置無恒亦随時捄弊而已益都濱州舊置兩鹽司大定十三年四月併為山東鹽司二十一年滄州及山東各務増羡冒禁鬻鹽朝論慮其乆或隳法遂併為海豐鹽使司十一月又併遼東等路諸鹽場為兩鹽司大定二十五年更狗濼為西京鹽司是後惟置山東滄寳坻莒解北京西京七鹽司山東滄寶坻斤三百為袋袋二十有五為大套鈔引公㨿三者俱備然後聴鬻小套袋十或五或一毎套鈔一引如袋之数寳坻零鹽較其斤数或六之三或六之一又為小鈔引給之以便其鬻解鹽斤二百有五十為一席席五為套鈔引則與陕西轉運司同鬻其輸粟於陕西軍營者許以公牒易鈔引西京等塲鹽以石計大套之石五小套之石三北京大套之石四小套之石一遼東大套之石十皆套一鈔石一引零鹽積十石亦一鈔而十引其行鹽之界各視其地宜山東滄州之場九行山東河北大名河南南京歸德諸府路及許亳陳蔡頴宿泗曹睢鈞單壽諸州莒之場十二濤洛場行莒州臨洪場行贛榆縣獨木場行海州司候司朐山東海縣板浦塲行漣水沭陽縣信陽場行宻州之五場又與大鹽塲通行沂邳徐宿泗滕六州西由塲行莱州録事司及招逺縣衡村場行即墨莱陽縣之二塲鈔引及半袋小鈔引聴本州縣鬻之寧海州五塲皆鬻零鹽不用引目黄縣塲行黄縣巨風塲行登州司候司蓬莱縣福山塲行福山縣是三塲又通行旁縣棲霞寧海州塲行司候司牟平縣文登塲行文登縣寳坻鹽行中都路平州副使於馬城縣置局貯錢觧鹽行河東南北路狭西東及南京河南府陕鄭唐鄧嵩汝諸州西京遼東鹽各行其地北京宗錦之末鹽行本路及臨潢府肇州泰州之境與接壤者亦預焉世宗大定三年二月定軍私煮鹽及盗官鹽之法命明安穆昆巡捕三年十一月詔以銀牌給益都濱滄鹽使司十一年正月用西京鹽判宋俣言更定狗濼鹽塲作六品使司以俣為使順聖縣令白仲通為副以是嵗入錢為定額四月以烏庫哩寔壘民饑罷其鹽池税十二年十月詔西北路招討司明安所轄貧民富人奴婢皆給食鹽宰臣言去鹽濼逺者所得不償道里之費遂命計口給直富家奴婢二十口止十三年二月併𣙜永鹽為寳坻使司罷平濼鹽錢滄州舊廢海阜鹽塲三月州人李格請復置詔遣使相視有司謂是場興則損滄鹽之課且食鹽戸仍舊而鹽貨嵗增必徒多積而不能售遂寝其議三月大鹽濼設鹽税官復免烏庫哩寔壘部鹽池之税二十一年八月恭知政事粱肅言寳坻及傍縣多闕食可減鹽價増粟價而以粟易塩上命宰臣議皆謂鹽非多食之物若減價易粟恐乆而不售以至虧課今嵗糧以七十餘萬石至通州比又以恩獻等六州粟百餘萬石繼至足以振之不煩易也遂罷十二月罷平州椿配鹽課二十三年七月博興縣民李孜收日炙鹽大理寺具私鹽及刮鹹土二法以上宰臣謂非私鹽可比張仲愈獨曰私鹽罪重而犯者猶衆不可縱也上曰刮鹻非煎何以同私仲愈曰如此則渤海之人恣刮鹻而食将侵官課矣力言不已上乃以孜同刮鹻科罪後犯則同私鹽法論十一月張邦基言寳坻鹽課若毎石收正課百五十斤慮有風乾折耗遂令石加耗鹽二十二斤半仍先一歳貸支償直以􅄖竈戸二十四年七月上在上京謂丞相烏庫哩元忠等曰㑹寧尹富察通言其地明安穆昆戸甚艱舊率賔以東食海鹽扶餘呼爾哈等路食肇州鹽初定額萬貫今増至二萬七千若罷鹽引添竈戸庻可易得元忠對曰已嘗遣使咸平府以東規畫矣上曰不湏待此宜亟為之通又言可罷上京酒務聴民自造以輸税上曰先灤州諸地亦嘗令民煮鹽後以不便罷之今豈可令民自沽耶二十五年十月上還自上京謂宰臣曰朕聞遼東凡人家食鹽但無引目者即以私治罪夫細民徐買食之何由有引目可止令散辦或詢諸民從其所欲因為之罷北京遼東鹽使司二十八年尚書省論鹽事上曰鹽使司雖辦官課然素􅅰民鹽官毎出廵而廵捕人往往私懐官鹽所至求賄及酒食稍不如意則以所懐誣以為私鹽鹽司苟圖羡増雖知其誣亦必加刑宜令别設廵捕官勿與鹽司闗渉庻革其弊五月剏巡捕使山東滄寳坻各二員觧西京各一貟山東則置於濰州招逺縣滄置於深州及寧津縣寳坻置於易州及永濟縣觧置於澄城縣西京置於多塔古秩從六品直𨽻省部各給銀牌取鹽使司弓手充巡捕人且禁不得於人家捜索若食鹽一斗以下不得究治惟盗販私煮則捕之在三百里内者属轉運司外者卽随路府提㸃所治罪盗課鹽者亦如之章宗大定二十九年十月上朝隆􅂟宫諭有司曰比因獵知百姓多有鹽禁獲罪者民何以堪朕欲令依平濼太原均辦例令民自煎其令百官議之十二月戸部尚書鄧儼等謂若令民計口定課民既輸乾辦錢又必别市而食是重費民財而徒増煎販者之利也且今之鹽價蓋昔日錢幣易得之時所定今日與向不同况太平日乆戸口蕃息食鹽嵗課宜有羡増而反無之何哉縁官估高貧民利私鹽之賤致虧官課爾近已减寶坻山東滄鹽價斤為三十八文乞更减去八文歲不過减一百二十餘萬貫官價既賤所售必多自有羡餘亦不全失所减之数况今府庫金銀約折錢萬萬貫有竒設使鹽課不足亦足補百有餘年之經用若量入為出必無不足之患乞令平濼乾辦鹽課亦宜減價各路巡鹽弓手不得自専巡捕庶革誣罔之弊禮部尚書李晏對曰所謂乾辦者既非美名又非良法必欲杜絶私煮盗販之弊莫若毎斤減為二十五文使公私價同則私将自已又巡鹽兵吏往往挟私鹽以誣人可令與所属司縣期㑹方許巡捕違者按察司罪之刑部尚書郭邦傑等則謂平濼瀕海及太原鹵地可依舊乾辦餘同儼議御史中丞伊喇仲方則謂私煎盗販之徒皆知禁而犯之者也可選能吏充巡捕使而不得入人家捜索同知大興府事王翛請毎斤減為二十文罷廵鹽官左諫議大夫圖克坦鎰則以乾辦為便宰臣奏以毎斤官本十文若減作二十五文似為得中巡塩弓手可減三分之一鹽官出巡湏約所屬同往不同獲者不坐可自来嵗五月一日行之上遂命寳坻山東滄鹽每斤減為三十文已發鈔引未支者準新價足之餘從所請十二月遂罷西京觧鹽巡捕使時既詔罷乾辦鹽錢以大理司直伊喇玖勝努廣寕推官宋扆議北京遼東兩路鹽司利病遂復置北京遼東鹽使司北京路嵗以十萬餘貫為額遼東路以十三萬為額罷西京及觧州巡捕使明昌元年七月上封事者言河東北路乾辦鹽錢嵗十萬貫太重以故民多逃徙乞緩其徵督上命俟農隙遣使察之十二月定禁司縣擅科鹽制二月五月省臣以山東鹽課不足葢由鹽司官出巡不敢擅捕必約所屬同徃人不畏故也遂詔自今如有盗販者聴鹽司官輙捕民私煮及藏匿則約所属捜索巡尉弓兵非與鹽司相約則概不許擅入入家三年六月孫即康等同鹽司官議軍民犯私鹽三百里内者鹽司按罪逺者付提點所皆徴捕獲之賞於販造者明安穆昆部人煎販及盜者所管官論贖三犯杖之能捕獲則免罪又濵州渤海縣永和鎮去州逺恐藏盗及私鹽可改為永豊鎮與曹子山村各剏設巡檢山東寳坻滄鹽司判官乞陞為從七品用進士上命明安穆昆杖者冄議餘皆從之尚書省奏山東濵益九塲之鹽行於山東等六路濤洛等五場止行於沂邳徐宿滕泗六州已有定課方之九場大課不同若令與九塲通比増虧其五場官恃彼大課恐不用力轉生姦弊遂定令五場自為通比舊法與鹽司使副通比故至是始改焉五年正月八小塲鹽官左蓽等以課不能及額繳進告勅遂遣便按視十三場冄定除濤洛等五場係設管勾可即日恢辦乃以蓽所告八塲從大定二十六年制自見管課依新例永相比磨戸部郎中李敬義等言八小場今新定課有減其半者如使俱從新課而舊課已辦入官恐所減錢多因而作弊而所收錢数不復盡寔附厯納官遂從明昌元年所定酒税院務制令即日收辦十一月以舊制明安穆昆犯私鹽酒麴者轉運司按罪遂更定軍民犯私鹽者皆令属鹽司私酒麴則屬轉運司三百里外者則付提點所若逮問犯人而所属恡不遣者徒二年十一月尚書省議山東滄州舊法毎一斤錢四十一文寳坻毎一斤四十三文自大定二十九年赦恩併特㫖减為三十文計减百八十五萬四千餘貫後以國用不充遂奏定毎一斤復加三文為三十三文至承安三年十二月尚書省奏鹽利至大今天下戸口蕃息食者倍於前軍儲支引者不甚多况日用不可闕之物豈以價之低昻而有多寡也若不随時取利恐徒失之遂復定山東寳坻滄州三鹽司價毎一斤加為四十二文觧州舊法毎席五貫文増為六貫四百文遼東北京舊法每石九百文増為一貫五百文西京煎鹽舊石二貫文増為二貫八百文撈鹽舊一貫五百文増為二貫文既増其價復加其所鬻之数七鹽司舊課歲入六百二十二萬六千六百三十六貫五百六十六文至是増為一千七十七萬四千五百一十二貫一百三十七文二分山東舊課歲入二百五十四萬七千三百三十六貫増為四百三十三萬四千一百八十四貫四百文滄州舊課歲入百五十三萬一千二百貫増為二百七十六萬六千六百三十六貫寳坻舊入八十八萬七千五百五十八貫六百文増為一百三十四萬八千八百三十九貫觧州舊入八十一萬四千六百五十七貫五百文増為一百三十二萬一千五百二十貫二百五十六文遼東舊入十三萬一千五百七十二貫八百七十文増為三十七萬六千九百七十貫二百五十六文北京舊入二十一萬三千八百九十二貫五百文増為三十四萬六千一百五十一貫六百一十七文二分西京舊入十萬四百一十九貫六百九十六文増為二十八萬二百六十四貫六百八文四月宰臣奏在法明安穆昆有告私鹽而不捕者杖之其部人有犯而失察者以数多寡論罪今乃有身犯之者與犯私酒麴殺牛者皆世襲權貴之家不可不禁遂定制徒年杖􅂾不以贖論不及徒者杖五十八月命山東寳坻滄州三鹽司毎春秋遣使督按察司及州縣巡察私鹽泰和元年九月省臣以滄濱兩司鹽袋嵗買席百二十萬皆取於民清州北靖海縣新置滄鹽場本故獵地沮洳多蘆宜弛其禁令民時採而織之十一月陕西路轉運使高汝礪言舊制捕告私鹽酒麴者計斤給賞錢皆徴於犯人然監官獲之則充正課巡捕官則不賞巡捕軍則減常人之半免役弓手又半之是罪同而賞異也乞以司縣巡捕官不賞之数及巡捕弓所減者皆徴以入官則其罪賞均矣詔從之三年二月以觧鹽司使治本州以副治安邑十一月定進士授鹽使司官以榜次及入仕先後擬注四年六月以七鹽使司課額七年一定為制毎斤増為四十四文時桓州刺史張煒乞以鹽易米詔省臣議之六月詔以山東滄州鹽司自増新課之後所増嵗積葢官既不為經畫而管勾監同與合干人互為姦弊以致然也即選才幹者代兩司使副以進士及部令史譯人書史譯史律科經童諸局分出身之亷慎者為管勾而罷其舊官十月西北路有犯花鹹禁者欲同鹽禁罪宰臣謂若比私鹽則有不同詔定制收鹹者杖八十十斤加一等罪止徒一年賞同私礬例五年六月以山東滄州两鹽司侵課遣戸部員外郎石鉉按視之還言令两司分辦為便詔以周昻分河北東西路大名府恩州南京睢陳蔡許潁州頴滄鹽司以山東東西路開濮州歸德府曹单亳壽泗州頴山東鹽司各計口承課十月簽河北東西大名路按察司事張德輝言海壖人易得私鹽故犯法者衆可量戸口均配之尚書省命山東按察司議其利便言莱宻等州比年不登計口賣鹽所歛雖㣲人以為重恐致流亡且私煮者皆無籍之人豈以配賣而不為哉遂定制命與滄鹽司皆馳驛巡察境内六年二月右丞相内族宗浩恭知政事賈鉉言國家經費惟頼鹽課今山東虧五十餘萬貫葢以私煮盗販者成黨鹽司既不能捕統軍司按察司亦不為禁若止論販私鹽者之数罰俸降職彼将抑而不申愈難制矣宜立制以各官在職時所増虧之寔令鹽司以逹省部以為陞降遂詔諸統軍招討司京府州軍官所部有犯者两次則奪半月俸一歲五次則奏裁巡捕官但犯則的决令按察司御史察之四月從涿州刺史𤓰爾佳博諾言以莱州所納鹽錢聴輸絲綿銀鈔七年九月定西北京遼東鹽使判官及諸塲管勾増虧升降格凡文資官吏員諸局署承應人應騐資歴注者増不及分者陞本等首一分减一資二分减两資遷一官四分减両資遷两官虧則視此為降如任回騐官注擬者増不及分陞本等首一分减一資二分减兩資遷一階四分减兩資遷兩階虧者亦視此為降十二月尚書省以盧附翼所言遂定制竈戸盗賣課鹽法若應納鹽課外有餘則盡以申官若留者减盗一等若刮鹻土煎食之採黄穂草燒灰淋鹵及以酵粥為酒者杖八十八年七月宋克㑓言鹽管勾自改注進士諸科人而監官有失超陞縣令之階以故怠而虧課乞依舊為便有司以泰和四年改注時選當時到部人截替遂擬以秋季到部人注代八年七月詔㳂淮諸𣙜塲聴官民以鹽市易宣宗貞祐二年十月戸部尚書言陽武延津原武滎澤諸縣饒鹹鹵民私煎不能禁遂詔置場設判官管勾各一員隸戸部既而御史臺奏諸縣皆為有力者奪之而商販不行遂勅御史分行申明禁約三年十二月河東南路權宣撫副使烏庫哩慶壽言綘觧民多業販鹽由大陽闗以易陕虢之粟及還渡河而官邀糴其八其旅費之外所存幾何而河南行部復自運以易粟于陕以盡奪民利比嵗河東旱蝗加以邀糴物價踴貴人民流亡誠可憫也乞罷邀糴以舒其患四年七月􅂟壽又言河中乏糧既不能濟而又邀糴以奪之夫鹽乃官物有司陸運至河復以舟逹京兆鳳翔以與商人貿易艱得而甚勞而陕西行部毎石複邀糴二斗是官物而自糴也夫轉鹽易物本濟河中而陕西復强取之非奪而何乞彼此壹聴民便則公私皆濟上從之興定二年六月以延安行六部員外郎盧進建言綏德之嗣武城義合克戎寨近河地多産鹽請設鹽塲管勾一員歳獲十三萬餘斤可輸錢二萬貫以佐軍三年詔用其言設官鬻鹽給邉用四年李復亨言以河中西岸觧鹽舊所易粟麥萬七千石充関東之用尋命觧鹽不得通陕西以北方有警河禁方急也元光二年内族額爾克言民運觧鹽有助軍食詔修石墻以固之酒金𣙜酤因遼宋舊制天會三年始命𣙜官以周歲為滿世宗大定三年詔宗室私醸者從轉運司鞫治三年省奏中都酒戸多逃以故課額愈虧上曰此官不嚴禁私醸所致也命設軍百人隸兵馬司同酒使副合千人巡察雖權要家亦許捜索奴婢犯禁杖其主百且令大興少尹招復酒戸八年更定酒使司課及五萬貫以上鹽場不及五萬貫者依舊例通注文武官餘竝右職有才能累差不虧者為之九年大興縣官以廣陽鎮務虧課而懼奪其俸乃以酒散部民使輸其税大理寺以財非入已請以贖論上曰雖非私贓而貧民亦被其害若止從贖何以懲後特命觧職二十六年省奏鹽鐵酒麴自定課後増各有差上曰朕頃在上京酒味不嘉朕欲如中都麴院取課庻使民得美酒朕日膳亦减省嘗有一公主至而無餘膳可與朕欲日用五十羊何難哉慮費用皆出於民不忍為也監臨官惟知利己不知利何從来若恢辦増羡者酬遷虧者懲殿仍更定併増併虧之課無失元額如横班祗虧者與餘差一例降罰庻有激􅂆且如功酬合辦二萬貫而止得萬七八千難迭兩酬者必止納萬貫而輙以餘錢入已今後可令見差使内不迭酬餘錢與後差使内所増錢通算為酬則庻可入官及監官食直若不先與何以責亷今後及格限而至者卽用此法又奏罷杓欄人二十七年議以天下院務依中都例改收麴課而聴民酤戸部遣官詢問遼東来逺軍南京路新息虞城西京路西京酒使司白登縣德哷勒部族天城縣七處除税課外願自承課賣酒上曰自昔監官多私官錢若令百姓承辦庶革此弊試行之明昌元年正月更定新課令即日收辦中都麴使司大定間歲獲錢三十六萬一千五百貫承安元年歳獲四十萬五千一百三十三貫西京酒使司大定間歳獲錢五萬三千四百六十七貫五百八十八文承安元年歳獲錢十萬七千八百九十三貫七月定中都麴使司以大定二十一年至明昌六年為界通比均取一年之數為額五年四月省奏舊隨處酒税務所設杓欄人以射糧軍歴過隨朝差役者充大定二十六年罷去其隨朝應役軍人各給添支錢粟酬其勞今擬将元收杓欄錢以代添支令各院務騐所收之数百分中取三隨課代輸更不入比嵗約得錢三十餘萬以佐國用泰和四年九月省奏在都麴使司自定課以来八年併増宜依舊法以八年通該課程均其一年之数仍取新増諸物一分税錢併入通為課額以後之課毎五年一定其制又令随時酒務元額上通取三分作糟酵錢六年制院務賣酒数各有差若数外賣及将帯過数者罪之宣宗貞祐三年十二月御史田迴秀言大定中酒税歳及十萬貫者始設使司其後二萬貫亦設今河南使司亦五十餘貟虚費月廩宜依大定之制元光元年復設麴使司醋税自大定初以國用不足設官𣙜之以助經用至二十三年以府庫充牣遂罷之章宗明昌五年以有司所入不充所出言事者請𣙜醋息遂令設官𣙜之其課額竣當差官定之後罷承安三年三月省臣以國用浩大遂復𣙜之五百貫以上設都監千貫以上設同監一員茶自宋人嵗供之外皆貿易於宋界之𣙜塲世宗大定十六年以多私販乃更定香茶罪賞格章宗承安三年八月以為費國用而資敵遂命設官製之以尚書省令史承德郎劉成往河南視官造者以不親嘗其味但採民言謂為温桑寔非茶也還即白上上以為不幹杖七十罷之四年三月於淄宻寕海蔡州各置一坊造新茶依南方例毎斤為袋直六百文以商旅卒未販運命山東河北四路轉運司以各路戸口均其袋数付各司縣鬻之買引者納錢及折物各從其便五月以山東人戸造買私茶侵牟𣙜貨遂定比煎私礬例罪徒二年泰和四年上謂宰臣曰朕嘗新茶味雖不嘉亦豈不可食也比令近侍察之乃知山東河北四路悉椿配於人旣曰强民宜抵以罪此舉未知運司與縣官孰為之所属按察司亦當坐罪也其閲寔以聞自今其令毎袋减價三百文至来年四月不售雖腐敗無傷也五年春罷造茶之坊三月上諭省臣曰今雖不造茶其勿伐其樹其地則恣民耕樵六年河南茶樹槁者命補植之十一月尚書省奏茶飲食之餘非必用之物比歲上下競啜農民尤甚市井茶肆相属商旅多以絲絹易茶歳費不下百萬是以有用之物而易無用之物也若不禁恐耗財彌甚遂命七品以上官其家方許食茶仍不得賣及饋獻不應留者以斤两立罪賞七年更定食茶制八年七月言事者以茶乃宋土草芽而易中國絲綿錦絹有益之物不可也國家之鹽貨出於鹵水歲取不竭可令易茶省臣以為所易不廣遂奏兼令以雜物博易宣宗元光二年三月省臣以國蹙財竭奏曰金幣錢穀世不可一日缺者也茶本出於宋地非飲食之急而自昔商賈以金帛易之是徒耗也泰和間嘗禁止之後以宋人求和乃罷兵興以来復舉行之然犯者不少衰而邉民又窺利越境私易恐因泄軍情或盗賊入境今河南陕西凡五十餘郡郡日食茶率二十袋袋直銀二兩是一嵗之中妄費民銀三十餘萬也奈何以吾有用之貨而資敵乎乃制親王公主及見任五品以上官素蓄者存之禁不得賣饋餘人竝禁之犯者徒五年告者賞寳泉一萬貫諸征商海陵貞元元年五月以都城隙地賜随朝大小職官及䕶駕軍七月各徴錢有差大定二年制院務剏虧及功酬格八月罷詔路闗税止令譏察三年尚書省奏山東西路轉運司言坊蕩河渡多逋欠詔如監臨制以年歲逺近為差蠲減又以尚書工部令史劉行義言定城郭出賃房税之制五年以前此河濼罷設官復召民射買兩界之後仍舊設官二十年正月定商税法金銀百分取一諸物百分取三章宗大定二十九年戸部言天下河泊已許與民同利其七處設官可罷之委所属禁豪強毋得擅其利明昌元年正月勅尚書省定院務課商税額諸路使司院務千六百一十六處比舊減九十四萬一千餘貫遂罷坊塲免賃房税十月尚書省奏今天下使司院務既減課額而監官増虧既有陞遷追殿之制宜罷提點所給賞罸俸之制但委提刑司察提點官侵犯塲務者則論如制詔從之二年詔減南京出賃官房及地基錢三年諭提刑司禁勢力家不得固山澤之利又司竹監嵗採入破竹五十萬竿春秋兩次輸都水監備河防餘邉刀笋皮等賣錢三千貫葦錢二千貫為額明昌五年陳言者乞復舊置坊塲上不許惟許増置院務詔尚書省恭酌定制遂擬遼東北京依舊許人分辦中都等十一路差官按視量添設院務于二十三處自今歲九月一日立界制可大定間中都税使司嵗獲十六萬四千四百四十餘貫承安元年嵗獲二十一萬四千五百七十九貫泰和六年五月制院務課虧令運司差官監𣙜金銀之税大定三年制金銀坑冶許民開採二十分取一為税泰和四年言事者以金銀百分中取一諸物取三今物價視舊為高除金銀則額所不能盡該自餘金銀可竝添一分詔從之七年三月戸部尚書髙汝礪言舊制小商貿易諸物收錢四分而金銀乃重細之物多出富有之家復止三分是為不倫亦乞一例收之省臣議以為如此恐多匿隠遂止從舊金史巻四十九
