body:
  text: 金史卷二十三元中書右丞相總裁托克托等修志第四五行五行之精氣在天為五緯在地為五材在人為五常及五事五緯志諸天文歴代皆然其形質在地性情在人休咎各以其類為感應於兩間者歴代又有五行志焉兩漢以來儒者若夏侯勝之徒專以洪範五行為學作史者多采其説凡言某徵之休咎則以某事之得失繫之而配之以五行謂其盡然其弊不免於傅會謂其不然肅時雨若䝉恒風若之類箕子蓋嘗言之金世未能一天下天文災祥猶有星埜之説五行休咎見於國内者不得他諉乃彚其史氏所書仍前史法作五行志至於五常五事之感應則不必泥漢儒為例云初金之興平定諸部屢有禎異故世祖每與敵戰嘗以夢寐卜其勝負烏春兵至蘇蘇海甸世祖曰予夙昔有異夢不可親戰若左軍有力戰者當克既而與肅宗等擊之敵大敗太祖之生也常有五色雲氣若二千斛囷廩之狀屢見東方遼司天孔致和曰其下當生異人建非常之事天以象告非人力所能為也温都部巴圖叛穆宗遣太祖討之入辭奏曰昨日見赤祥往必克遂與巴圖戰殺之穆宗攻阿蘇日辰巳間忽暴雨昏曀雷電環阿蘇所居是夕有巨火聲如雷墜阿蘇城中遂攻下之太祖嘗往寧江夢威泰之禾塲焚頃刻而盡覺而大戚即馳還威泰已寢疾翌日不起烏色伐高麗太祖臥而得夢亟起曰今日㨗音必至乃為具於毬塲以待有二麞渡水而至獲之太祖曰此休徵也言未既㨗書至衆大異之他日軍寧江駐高阜薩哈仰見太祖體如喬松所乘馬如岡阜之大太祖亦視薩哈人馬異常薩哈因白所見太祖喜曰此吉兆也即舉酒酹之曰異日成功當識此地師次唐古特旺結之地諸軍介而立有光起於人足及戈矛上明日至扎扎水光復如初收國元年上在寧江州有光正圓自空而墜八月己卯黄龍見空中丁未上候遼軍還至舒吉濼有光復見於矛端天輔六年三月師攻西京有火如斗墜其城中是月城降而復叛四月辛卯取之太宗天㑹二年海蘭伊勒呼水霖雨害稼且為蝗所食秋泰州潦害稼三年七月錦州野蠶成蠒九月廣寧府進嘉禾四年十月中京進嘉禾六年冬伊蘭路饑九年七月丙申上御西樓聽政聞咸州所貢白鵲音忽異常上起視之見東樓外光明中有像巍然高五丈許下有紅雲承之若世所謂佛者乃擎跽修䖍久之而没十年冬伊蘭海蘭等路饑熙宗天㑹十三年四月甘露降於盧州熊岳縣十五年七月辛巳有司進四足雀丙戌夜京師地震天眷元年夏有龍見於熙州野水凡三日初於水面見一蒼龍良久而没次日見金龍一爪承一嬰兒兒為龍所戲略無懼色三日如故又見一人乘白馬紅􅂁玉帶如少年官狀馬前有六蟾蜍凡三時乃没郡人競往觀之七月丁酉按春河水溢壞民廬舍三年十二月丁丑地震皇綂元年秋蝗十一月己酉稽古殿火二年二月熙河路饑三月辛丑大雪秋燕西東二京河東河北山東汴平州大熟三年陜西旱五月丁巳京兆府貢瑞麥七月丙寅太原進獬豸及瑞麥四年正月乙丑陜西進嘉禾十有二莖一本七穎十月甲辰地震五年閠月戊寅大名府進牛生麟壬辰懷州進嘉禾七年十一月完顔秉德進三角羊九年四月壬申夜大風雨雷電震寢殿鴟尾壞有火入帝寢燒帷幔上懼徙别殿丁丑有龍鬭于利州榆林河上大風壞民居官舍十六七木瓦人畜皆飄揚十餘里死傷者數百同知州事舒穆嚕里壓死海陵天德二年十二月野人採石炭𫉬異香貞元二年五月癸丑南京大内災三年十二月己丑雨木氷正隆二年六月壬辰蝗飛入京師秋中都山東河東蝗四年十一月庚寅霜附木五年二月辛未河東陜西地震鎭戎德順等軍大風壞廬舍民多壓死海陵問司天馬貴中等曰何為地震貴中等曰伏陽逼隂所致又問震而大風何也對曰土失其性則地以震風為號令人君嚴急則有烈風及物之災六年六月壬戌大風壞承天門鴟尾是歲世宗居貞懿皇后憂在遼陽一日方寢有紅光照其室及黄龍見於室上又夜有大星流入其邸八月復有雲氣自西來黄龍見其中人皆見之是時臨潢府聞空中有車馬聲仰視見風雲杳靄神鬼兵甲蔽天自北而南仍有語促行者未幾海陵下詔南征世宗大定二年閠二月辛卯神龍殿十六位焚延及太和厚德殿三年二月丙申中都以南八路蝗四年三月庚子夜京師地震七月辛丑大風雷雨㧞木臨潢府境禾黍穭生嵐州進白兎二八月永興進嘉禾異畝同穎中都南八路蝗飛入京畿十一月辛丑尚書省火是歲有年五月六月戊子河南府進芝草十三本云得於芝田石上乃薦之太廟甲辰大安殿楹産芝其色如玉丙申京師地震有聲自西北來殷殷如雷地生白毛七月戊申又震十一月癸酉大霧晝晦七年九月庚辰地震八年五月甲子北望淀大風雨雹廣十里長六十里六月河決李固渡水入曹州十年正月鄧州進芝草十一年六月戊申西南路招討司必勒哈水之地雨雹三十餘里小者如雞卵其一最大廣三尺長丈餘四五日始消十二年三月庚寅雨土四月旱十三年正月尚書省奏宛平張孝善有子曰合得大定十二年三月旦以疾死至暮復活云本是良鄉人王建子喜兒而喜兒前三年已死建驗以家事能具道之此蓋假屍還魂擬付王建為子上曰若是則姦倖小人競生詐偽瀆亂人倫止付孝善八月丁丑䇿試進士於憫忠寺夜半忽聞音樂聲起東塔上西達於宮考官完顔佛寧李晏等以為文運始開得賢之兆十四年八月丁巳朔次珠爾蘇日午白龍見於御帳之東小港中既而乘雷雲而上尾猶曵地良乆北去十六年三月戊申雨豆於臨潢之境其形上鋭而赤食之味頗苦五月戊申南京宮殿火是歲中都河北山東陜西河東遼東等十路旱蝗十七年七月大雨滹沱盧溝水溢河決白溝二十年四月己亥大寧宮門火五月丙寅京師地震生黒白毛七月旱秋河决衛州二十二年五月慶都蝗蝝生散漫十餘里一夕大風蝗皆不見二十三年正月辛巳廣樂園燈山焚延及熙春殿三月乙酉氛埃雨土四月庚子亦如之五月丁亥雨雹地生白毛二十四年正月辛卯朔徐州進芝十有八莖眞定進嘉禾二本異畝同穎二十六年正月庚辰河南府進芝三本秋河决壞衛州城二十七年四月辛丑京師地微震章宗大定二十九年五月丁未地生白毛六月曹州河溢十二月密州進白鶉白雉各一河間府進嘉禾是冬無雪明昌元年正月懷州河間等處進芝草嘉禾二月地生白毛六月庚子都水進異卵夏旱七月􅁋雨傷稼二年五月桓撫等州旱秋山東河北旱饑三年秋綏德虸蚄蟲生旱四年三月御史中丞董師中奏迺者太白晝見京師地震北方有赤氣遲明始散天之示象兾有以警悟聖主也上問所言天象何從得之師中曰前監察御史陳元升得之於一司天長行上曰司天臺官不奏固有罪其以語人尤非朕欲令自今司天有事而不奏者長行得言之何如師中曰善五月霖雨命有司祈晴六月河决衛州魏清滄皆被害是歲河北山東南京陜西諸路大稔邢洺深冀及河北西路十六穆昆之地野􅁞成蠒十一月壬午木氷五年七月丙戌天壽節先隂雨連日至是開霽有龍曵尾於殿前雲間是月河决陽武故堤灌封邱而東六年二月丁丑京師地震大雨雹晝晦大風震應天門右鴟尾壞八月大雨雷電有龍起於渾儀鼇雲水跌下臺忽中裂而摧儀仆於臺下承安元年五月自正月不雨至是月雨六月平晉縣民利通家􅁞自成綿叚長七尺一寸五分闊四尺九寸二年自正月至四月不雨六月丙午雨雹四年三月戊午雨雹五月旱五年五月庚辰地震十月庚子天久隂是日雲色黄而風霾癸卯晨隂霜附木至日入亦如之泰和二年八月丙申磁州武安縣鼔山石聖臺有大鳥十集於臺上其羽五色爛然文多赤黄赭冠鷄項尾闊而修狀若鯉魚尾而長高可逾人九子差小傍侍亦高四五尺禽鳥萬數形色各異或飛或蹲或歩或立皆成行列首皆正向如朝拱然初自東南來勢如連雲聲如殷雷林木震動牧者驚惶即驅牛擊物以驚之殊不為動俄有大鳥如鵰鶚者怒來搏擊之民益恐奔告縣官皆以為鳳凰也命工圖上之留二日西北去按視其處糞迹數頃其色各異遺禽數千累日不能去所食皆巨鯉大者丈餘魚骨蔽地章宗以其事告宗廟詔中外三年四月旱十月己亥大風四年正月壬申隂霧木氷三月丁卯大風毁宣陽門鴟尾四月旱壬戌萬寧宮端門災十一月丁卯隂木氷凡三日五年夏旱八年四月甲午雨雹河南路蝗六月戊子飛蝗入京畿八月乙酉有虎至陽春門外駕出射獲之時又有童謠云易水流汴水流百年易過又休休兩家都好住前後總成留至貞祐中舉國遷汴衛紹王大安元年徐沛界黄河清五百餘里幾二年以其事詔中外臨洮人楊珪上書曰河性本濁而今反清是水失其性也正猶天動地靜使當動者靜當靜者動則如之何其為災異明矣且傳曰黄河清聖人生假使聖人生恐不在今日又曰黄河清諸侯為天子正當戒懼以銷災變而復誇示四方臣所未喻宰相以為妖言議誅之慮絶言路即詔大興府鎻還本管十一月丙申平陽地震有聲自西北來戊戌夜又震自此時復震動浮山縣尤劇城􅅟民舍圮者十七八死者凡二三千人二年二月乙酉地大震有聲殷殷然六月七月至九月晦其震不一十一月京師民周修武宅前渠内火出高二尺焚其板橋又旬日大悲閣幡竿下石隙中火出高二三尺人近之即滅凡十餘日自是都城連夜燔􅅡二三十處是歲四月山東河北大旱至六月雨復不止民間斗米至千餘錢三年二月乙亥夜大風從西北來發屋折木吹通元門關折三月戊午大悲閣災延燒萬餘家火五日不絶山東河北河東諸路大旱是歲有男子郝贊詣省言上即位之後天變屢見火焚萬家風折門關非小異也宜退位讓有德有司問爾狂疾乎贊大言曰我不狂疾但為社稷計宰相皆非其言每日省前大呼凡半月上怒誅之隱處崇慶元年七月辛未未時有風從東來吹帛一叚高數十丈宛轉如龍墜於拱辰門内是歲河東陜西山東南京諸路旱二年二月放進士榜有狂僧公言殺天子求之不知所在是歲河東陜西大旱京兆斗米至八千錢至寧元年宣宗彰德故園竹開白花如鷺鷥藤紫雲覆城上數日俄而入繼大綂七月以河東陜西諸路旱遣工部尚書高道拉祈雨于嶽瀆至是雨足時斗米有至錢萬二千者八月癸巳衛紹王遇弑是日海水不潮寳坻鹽司懼其虧課致禱無應九月丙午宣宗即位乃潮初衛王即位改元大安四年改曰崇慶既而又改曰至寧有人謂曰三元大崇至矣俄而有呼沙呼之變宣宗貞祐元年八月戊子夜將曙大霧蒼黒跂歩無所見至辰巳間始散十二月乙卯雨木氷時衛州有童謡曰團圞冬劈半年寒食節没人煙明年正月元兵破衛遂丘墟矣二年六月潮白河溢漂古北口鐵褁關門至老王谷庚申南京寳鎭閣災壬戌上次宜村有黄龍見於西北冬黄河自陜州界至衛州八柳樹清十餘日纖鱗皆見十二月己酉雨木氷三年二月戊午大風隆德殿鴟尾壞三月戊辰大風霾四月自去冬不雨至於是月五月河南大蝗六月京城中夜妄相驚逐狼月餘方息十月丙申昏西北有霧氣如積土至二更乃散四年正月己未旦黒霧四塞巳時乃散是春河朔人相食五月河南陜西大蝗鳳翔扶風岐山郿縣䗣蟲傷麥七月旱癸丑飛蝗過京師興定元年三月宮中有蝗四月單州雹傷稼陳州商水縣進瑞麥一莖四穗開封府進瑞麥一莖三穗二莖四穗五月乙丑河南大風吹府門署以去延州原武縣雹傷稼七月癸卯大社壇産嘉禾一莖十五穗秋霖雨十月邠州進白兔丹州進嘉禾異畝同穎二年四月河南諸郡蝗五月秦陜狼害人六月旱是歲京師屢火遣禮部尚書楊雲翼禜之三年春吏部火四月癸未陜右黒風晝起有聲如雷頃之地大震平凉鎭戎德順尤甚廬舍傾壓死者以萬計雜畜倍之夏旱十二月壬申雨木氷四年正月戊辰二更天鳴有聲壬子晝晦有頃大雷風雨四月丁丑大風吹河南府署飛百餘歩户案門鑰開文牘飄散不知所在六月旱七月河南大水唐鄧尤甚十二月癸酉火是歲華州渭南縣民裴德寧家伐樹破其中有赤色太字表裏脗合有司言與唐大厯中成都瑞木有文天下太平者其事頗同蓋太平之兆也乞付史館五年三月以久旱詔中外仍命有司祈禱十一月壬寅京師相國寺火十二月丁丑霜附木先是有童謠云青山轉轉山青耽誤盡少年人蓋言是時人皆為兵轉鬭山谷戰伐不休當至老也元光元年四月京畿旱十月上獵近郊獲白羣臣以為瑞明日御便殿置鈴於項將縱之驚躍不已忽斃几上二年正月辛酉日午有鶴千餘翔于殿庭移刻乃去七月乙卯丹鳳門壞壓死者數人十一月開封有虎害人是時屢有妖怪二年之中白日虎入鄭門吏部及宮中有狐狼鬼夜啼于輦路烏鵲夜驚飛鳴蔽天十二月宣宗崩哀宗正大元年正月戊午上初視朝尊太后為仁聖宮皇太后太元妃為慈聖宮皇太后是日大風飄端門瓦昏霾不見日黄氣塞天仁聖又夢乞丐萬數踵其後心惡之占者曰后為天下母百姓貧窶將誰訴焉遂勅京城設粥與氷藥以應之人以為壬辰癸巳之兆又有人衣麻衣望承天門大笑者三大哭者三有司拘而問之其人曰我先笑者笑許大天下將相無人後哭者哀祖宗國家破蕩至此也有司以為妖言處之重典上曰近詔草澤之士竝許直言雖渉譏訕亦不治罪况此人言亦有理止不應笑哭闕下耳乃杖之二年正月甲申有黄黒之祲四月旱京畿大雨雹三年春大寒三月乙丑有火自吏部中出大如斛流行展轉人皆驚避踰時而滅四月旱蝗六月京東雨雹蝗死四年六月丙辰地震八月癸亥大風吹左掖門鴟尾墜丹鳳門扉壞是日風霜損禾皆盡五年春大寒二月雷而雪木之華者皆敗四月鄭州大雨雹桑柘皆枯京畿旱八月御座上聞若有言者曰不放捨則何索之不見七年十二月新衛州北三里許有影在沙上如舊衛州城狀寺塔宛然數日乃滅天興元年正月丁酉大雪二月癸丑又雪戊午又雪是時鈞州陽邑盧氏兵皆大敗五月大寒如冬七月庚辰兵刄有火閠八月己未有箭射入宮中九月辛丑夜大雷工部尚書富聶遜震死二年六月上遷蔡自發歸德連日暴雨平地水數尺軍士漂没及蔡始晴復大旱數月識者以為不祥初南京未破一二年間市中有一僧不知所從來持一布囊貯棗日散於市人無窮所在兒童百十從之又有一人拾街中破瓦復以石擊碎之人皆以為狂不曉其理後乃知之其意蓋欲使人早散國家將瓦解矣金史卷二十三
