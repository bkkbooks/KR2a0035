body:
  text: 金史巻五十六元中書右丞相總裁托克托等修志第三十七百官二殿前都㸃檢司監宣徽院監祕書監監國子監太府少府軍噐都水監院登聞鼓院聞大理寺記𢎞文院登檢院注院集賢院衛尉司益政院刑武衛軍都指揮使司戸禮兵工部所轄諸司三路檢察及外路倉庫牧圉等職殿前都㸃檢司天眷元年置掌親軍總領左右衛將軍符寳郎宿直將軍左右振肅宫籍監近侍等諸局署鷹坊頓舍官𨽻焉殿前都㸃檢正三品兼侍衛將軍都指揮使掌行從宿衛闗防門禁督攝隊仗總判司事殿前左副都㸃檢從三品兼侍衛將軍副都指揮使殿前右副都㸃檢從三品兼侍衛將軍副都指揮使掌宮掖及行從殿前都㸃檢判官從六品大定十二年設知事一員從七品殿前左衛將軍殿前右衛將軍殿前左衛副將軍殿前右衛副將軍掌宫禁及行從宿衛警嚴仍總領䕶衛右衛同此符寳郎四員掌御寳及金銀等牌舊名牌印祗候大定二年改為符寶祗候改牌印令史為符寶典書四人左右宿直將軍從五品掌總領親軍凡宫城諸門衛禁并行從宿衛之事八員大定二十九年行十員復作十一員左右振肅正七品掌妃嬪出入總領䕶衛導從本妃嬪䕶衛之長大定二年改今名宫籍監提㸃正五品監從五品副監從六品丞從七品掌内外監户及地土錢帛小大差𤼵直長二員正八品掌同丞近侍局提㸃正五品泰和八年剏設使從五品副使從六品掌侍從承勅令轉進奏帖直長正八品大定十八年增二員奉御十六人舊名入寢殿實逹爾奉職三十人舊名不入寢殿實達爾又名外帳實達爾皆大定十二年更器物局提㸃正五品使從五品副使從六品掌進御器械鞍轡諸物直長正八品都監正九品明昌三年省罷同監從九品泰和四年設尚厩局提㸃正五品使從五品副使從六品掌御馬調習牧養以奉其事大定二十九年添副使一員管小馬羣直長一員司馬牛羣掌厩都轄正九品不限員副轄從九品不限員數資考尚輦局使五品副使從六品掌承奉輿輦等事直長正八品不限資考大定十九年除年六十以下人充典輿都轄從九品不限資考收支都監正九品大定二十年設掌給受之事同監泰和四年設大安二年省巴哩巴四人鷹坊提㸃正五品使從五品副使從六品掌調養鷹鶻海東青之類直長正八品不限員管勾從九品不限員數資考武庫署令從六品掌收貯諸路常課甲仗以曉軍器女直人充丞從七品直長二員正八品大定二年省一員武器署提㸃從五品令從六品丞從七品掌祭祀朝㑹廵幸及公卿婚𦵏鹵簿儀仗旗鼓笛角之事直長正八品或二員頓舍官二員㤗和令總格作四員正八員直長見士民湏知㤗和令無右屬殿前都㸃檢司宣徽院左宣徽使正三品右宣徽使正三品同知宣徽院事正四品同簽宣徽院事正五品宣徽判官從六品掌朝㑹燕享凡殿庭禮儀及監知御膳所𨽻弩手傘子二百三十九人控鶴二百人拱衛直使司威㨗軍𨽻焉舊名龍翔軍正隆二年更為神衛軍大定二年更名為拱衛司都指揮使從四品舊曰使副都指揮使從五品舊曰副使掌總統本直謹嚴儀衛大定五年詔以使為都指揮使副使為副都指揮使什將長行威㨗軍承安二年簽弩手千人泰和四年以之備邊事鈐轄正六品都轄從九品不奏客省使正五品副使從六品掌接伴人使見辭之事引進使正五品副使從六品掌進外方人使貢獻禮物事閤門明昌五年閤門官以次排轉除授東上閤門使二員正五品明昌六年省一員作從五品西同副使二員正六品明昌六年省一員西同簽事一員從六品掌簽判閤門事西同明昌六年以減副使置西上閤門使二員正五品副使二員正六品簽事一員從六品掌贊導殿庭禮儀西閤門餘副二門閤門祗候二十五人正大間三十二人閤門通事舍人二員從七品掌通班贊唱承奏勞問之事承奉班都知正七品掌總率本班承奉之事舊置判官後罷内承奉班押班正七品掌總率本班承奉之事御院通進四員從七品掌諸進獻禮物及薦享編次位序尚衣局提㸃正五品使從五品副使從六品掌御用衣服冠帶等事都監正五品舊設後罷直長正八品同監從九品儀鸞局㤗和四年或以少府監官兼或兼少府監官提㸃正五品使從五品副使從六品掌殿庭鋪設帳幕香燭等事直長四員正八品㤗和令三員收支都監正九品二員一員掌給受鋪陳諸物一員掌萬寜宫收支庫大定十年置明昌二年増一員同監二員從九品司吏二人如内藏庫知書例尚食局元光二年參用近侍奉御奉職提㸃正五品使從五品副使從六品掌總知御膳進食先嘗兼管從官食直長一員正八品不限資考都監三員正九品不限資考生料庫都監同監各一員掌給受生料物色收支庫都監同監各一員掌給受金銀裹諸色器皿以外路差除人内選充尚藥局提㸃正五品使從五品出職官内選除副使從六品掌進湯藥茶果直長正八品都監正九品果子都監同監各一員掌給受進御果子本局巴哩巴四人太醫院提㸃正五品使從五品副使從六品判官從八品掌諸醫藥總判院事管勾從九品隨科至十人設一員以術精者充如不至十人併至十人置不限資考正奉上太醫一百二十月升除副奉上太醫不算月日長行太醫不算月日十科額五十人御藥院提㸃從五品直長正八品掌進御湯藥明昌五年設以親信内侍人充都監正九品不限員泰和令四員同監從九品不常除泰和令無教坊提㸃正五品使從五品副使從六品判官從八品掌殿庭音樂總判院事諧音郎從九品不限資考員數内藏庫大定二年分為四庫使從五品副使從六品掌内府珍寳財物率隨庫都監等供奉其事直長一員承安三年增頭面庫都監正九品同監從九品巴哩巴十人大定二年定出身依不入寢殿例寳逹爾叚匹庫都監正九品同監從九品巴哩巴十二人金銀庫都監正九品巴哩巴八人雜物庫都監正九品同監從九品巴哩巴八人每庫知書各二人宮闈局舊名宮門司大定二年改為局舊設令丞改為使副提㸃正五品使從五品副使從六品掌宮中閤門之禁率隨位都監同監及内直各給其事直長正八品内直一百七十人後作百七十九人内侍局令二員從八品興定五年陞作從六品丞二員從九品興定五年陞從七品掌正位閤門之禁率殿位都監同監及御直各給其事局長二員從九品興定五年陞正八品御直内直共六十四人明昌元年分宮闈局正位内直置初隷宮闈局東門都監同監諸隨殿位承應都監同監掌各位承應及門禁管鑰昭明殿都監同監大定二十九年設各一員承徽殿都監同監麗妃位隆徽殿都監同監木隆和殿係皇后位鸞翔殿都監同監崇儀殿都監同監迎腪殿都監同監七妃充容泰和三年罷蘂珠殿都監同監瑞寧殿都監同監回春殿都監同監芸香殿都監同監瑞像殿都監同監係佛殿以上殿字下無位字凝福改韶景溫芳二位都監同監瑶華柔則二位都監同監以上無殿字及承應字嘉福等殿位都監同監四位廣仁殿都監同監睿思殿都監同監以上有承應字滋福殿都監同監本以隆慶改無位字咨正殿都監同監邇英殿都監同監長慶院都監同監仙韶院都監同監貞和門都監同監應係錢帛經此門出入明昌四年添一員右昇平門都監同監長樂門都監同監瓊林苑都監同監各二員廣樂園都監同監順儀位提控都監同監舊寳林位瑞華門俗名金骨朶門都監一員同監三員太師位提控都監同監寳昌門都監同監㑹昌門都監同監東京孝寧宫都監同監崇妃位提控世宗夫人興陵惠妃位提控都監同監裕陵溫妃位提控都監同監裕陵二位明昌四年添報德寺提控都監同監世宗御容光泰門街報恩寺提控都監同監世宗御容清夷門街明昌三年設三孝嚴寺都監同監在南京安宣宗御容改興國感城寺正大元年設三以下皆在南京寧福殿都監同監三純和殿都監同監三仁安殿都監同監三真妃位都監同監三麗妃位都監同監宣儀位都監同監莊獻妃位都監同監三廟都監同監貞祐二年設西華門都監同監京後園都監同監内侍寄禄官㤗和二年設初隷宮聞局尋直隷宣徽院所以陞用内侍局御直内直有年勞者中常侍正五品給事中從五品内殿通直正六品先名内殿給使黄門郎從六品内謁者正七品内侍殿頭從七品内使高品正八品不限員内侍高班從八品典衛司大定二十九年世宗才人寶林位各設泰和五年閏八月以崇妃薨興定元年復設世宗妃才人寶林位各設防衛軍導從人令正七品丞從七品直長見士民須知孝靖宮章宗五妃位大安元年以有同監無總領者故設令從八品丞正九品端妃位同監真妃圖克坦氏慧妃位同監麗妃圖克垣氏貞妃位同監柔妃唐古氏靚儀位同監昭儀𤓰爾佳氏才媛位同監修儀烏庫哩氏懿安家貞祐三年為莊獻太子設令從八品丞正九品宮苑司令從六品丞從七品掌宫庭修飭洒掃啓閉門户鋪設氈席之事直正八品一員泰和令一員都監同監二員泰和二年設泰和四年罷同監尚醞署令從六品丞從七品掌進御酒醴直長正八品二員典客置令從六品丞從七品直長後罷書表十八人侍儀司舊名擎執局大定元年改為侍儀局大定五年陞局為司令從六品舊曰局使掌侍奉朝儀率捧案擎執奉輦各給其事直長正七品舊設局副品從七右屬宣徽院袐書監著作局筆硯局書畫局司天䑓𨽻焉監一員從三品少監一員正五品丞一員正六品祕書郎二員正七品泰和元年定為二員通掌經籍圖書校書郎一員從七品承安五年二員泰和五年以翰林院官兼大安二年省一員專掌校勘在監文籍著作局著作郎一員從六品著作佐郎一員正七品掌修日厯皇統六年著作局設著作郎佐郎各二員編修日厯以學士院兼領之筆硯局直長二員正八品掌御用筆墨硯等事泰和七年以女直應奉兼舊名筆硯令史大定三年改為筆硯供奉以避諱改為承奉書畫局直長一員正八品掌御用書畫紙扎都監正九品二員或一員司天臺提㸃正五品監從五品掌天文厯數風雲氣色密以奏聞少監從六品判官從八品教授舊設二員正大初省一員係籍學生七十六人漢人五十人女直二十六人試補長行司天管勾從九品不限資考員數隨科十人設一員以藝業尤精者充長行人五十人未授職事者試補管勾天文科女直漢人各六人算厯科八人三式科四人測驗科八人漏刻科二十五人銅儀法物舊在法物庫貞元二年始付本臺右屬祕書監國子監國子學太學𨽻焉祭酒正四品司業正五品掌學校丞二員從六品明昌二年増一員兼提控女直學國子學博士二員正七品分掌教授生員考藝業大學同明昌二年添女直一員泰和四年滅大安二年並罷助教二員正八品女直漢人各一員教授四員正八品分掌教誨諸生明昌二年小學各添二員承安五年一員不除國子校勘從八品掌校勘文字國子書寫官從八品掌書寫實録太學博士四員正七品大安二年减二員助敎四員正八品明昌二年不除一員大安二年减一員右屬國子監太府監左右藏支應所太倉酒坊典給署市買司𨽻焉監正四品少監從五品丞二員從六品掌出納邦國財用錢穀之事左藏庫使從六品副使從七品興定三年增一員掌金銀珠玉寳貨錢幣巴哩巴四人右藏庫使從六品副使從七品興定三年添一員掌錦帛絲綿毛褐諸道常課諸色雜物巴哩巴四人支應所又作支承所都監二員正九品掌宫中出入御前支賜金銀幣帛大安三年省太倉使從六品掌九穀廪藏出納之事預除人副使從七品酒坊部除使從八品副使正