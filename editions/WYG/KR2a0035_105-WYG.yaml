body:
  text: 金史卷一百五元中書右丞相總裁托克托等修列傳第四十三程宷任熊祥孔璠子拯范拱張用直劉樞王翛楊伯雄兄伯淵蕭貢溫特赫提克徳張翰任天寵程宷字公弼燕之析津人祖冀仕遼東徳軍節度使冀凡六男父子皆擢科第士族號其家為程一舉冀次子四穆遼崇義軍節度使宷四穆之季子也自幼如成人及冠篤學中進士甲科累遷殿中丞天輔七年太祖入燕授尚書都官員外郎錦州安昌令累加起居郎為史舘修撰以從軍有勞加少府少監熙宗時厯翰林待制兼右諫議大夫宷上疏言事其略曰殿前㸃檢司古殿巖環衞之任所以肅禁籞尊天子備不虞也臣幸得近清光從天子觀時畋之禮比見陛下校獵凡羽衞從臣無貴賤皆執弓矢馳逐而聖駕﨑嶇于沙礫之地加之林木叢欝易以迷失是日自卯及申百官始出沙漠獨不知車駕何在瞻望久之始有騎來報皇帝從數騎已至行在竊惟古天子出入警蹕清道而行至於楚畋雲夢漢獵長楊皆大陳兵衞以備非常陛下膺祖宗付託之重奈何獨與數騎出入林麓沙漠之中前無斥候後無羽衞甚非肅禁籞之意也臣願陛下熟計之後若復獵當預戒有司圖上獵地具其可否然後下令清道而行擇衝要稍平之地為駐蹕之所簡忠義爪牙之士統以親信腹心之臣警衞左右俟其麋鹿既來然後馳射仍先遣捜閲林藪明立幖幟為出入之馳道不然後恐貽宗廟社稷之憂又曰臣伏讀唐史追尊高祖以下諡號或加至十八字前宋大中祥符間亦加至十六字亡遼因之近陛下亦受崇天體道欽明文武聖徳十字臣竊謂人臣以歸羙報上為忠天子以追崇祖考為孝太祖武元皇帝受命開基八年之間奄有天下功徳茂盛振古無前止諡武元二字理或未安何以示于將來臣願詔有司定議諡號庶幾上慰祖宗在天之靈使耿光丕烈傳于無窮又曰古者天子皆有廵狩無非事者或省察風俗或審理寃獄或問民疾苦以布宣徳澤皆巡狩之名也國家肇興誠恐郡國新民逐末棄本習舊染之汙奢侈詐偽或有不明之獄僣濫之刑或力役無時四民失業今鑾輅省方將憲古行事臣願天心洞照委之長貳釐正風俗或置匭匣以申寃枉或遣使郡國問民無告皆古巡狩之事昔漢昭帝問疾苦光武求民瘼如此則和氣通天下太平可坐而待也又曰臣聞善醫者不視他人之肥瘠察其脈之病否而已善計天下者不視天下之安危察其紀綱理否而已天下者人也安危者肥瘠也紀綱者脉也脉不病雖瘠不害脉病而肥者危矣是故四肢雖無故不足恃也脉而已矣天下雖無事不足矜也綱紀而已矣尚書省天子喉舌之官綱紀在焉臣願詔尚書省戒勵百官各楊其職以立綱紀如吏部天官以進賢退不肖為任誠使升黜有科任得其人則綱紀理而民受其賜前代興替未始不由此者虞舜不告而娶二妃帝嚳娶四妃法天之四星周文王一后三夫人嬪御有數選婌媛以充後宮古帝王之制也然女無羙惡入宮見妬陛下欲廣嗣續不可不知而告戒之又曰臣伏見本朝富有四海禮樂制度莫不一新宮禁之制尙未嚴密胥吏健卒之輩皆得出入莫有呵止至淆混而無别雖有闌入之法久尚未行甚非嚴禁衞明法令之意陛下不可不知而必行疏奏上嘉納之於是始命有司議贈上太祖尊諡皇統八年十二月由翰林侍講學士為横海軍節度使移彰徳軍節度使卒官年六十二宷剛直耿介不諂奉權貴以希苟進有古君子之風云任熊祥字子仁八代祖圜為後唐宰相圜孫睿隨石晉北遷遂為燕人熊祥登遼天慶八年進士第為樞密院令史太祖平燕以其地畀宋熊祥至汴授武當丞宋法新附官不釐務熊祥言於郡守楊晢曰既不與事請止給半俸以養親晢雖不許而喜其亷金人取均房州熊祥歸朝復為樞密院令史時西京留守高慶裔攝院事無敢忤其意者熊祥未敢阿意事之其後杜充劉括同知燕京行省法制未一日有異論熊祥為折𠂻之厯深磁州刺史開府少尹行臺工部郎中同知汴京留守事天徳初為山東東路轉運使改鎮西軍節度使是時詔徐文張𢎞信討東海縣𢎞信逗遛稱疾不進決杖二百熊祥被詔為㑹試主文以事不避難臣之職為賦題及御試熊祥復以賞罰之令信如四時為賦題海陵大喜以為翰林侍讀學士大定初以為太子少師時契丹賊斡罕竊號北鄙用兵未息上以為憂詔公卿百官議所以招伐之宜衆皆異議熊詳徐進曰陛下以勞民為憂用兵為重莫若以恩信招懷之上問孰可使者對曰臣雖老憑國威靈尙堪一行上曰卿老矣無煩為此七年復致仕熊祥事母以孝聞母没時熊祥年已七十不食三日人皆稱之卒于家孔璠字文老至聖文宣王四十九代孫故宋朝奉郎襲封端友弟端操之子齊阜昌三年補迪功郎襲封衍聖公主管祀事大㑹十五年齊國廢熙宗即位興制度禮樂立孔子廟於上京天眷三年詔求孔子後加璠承奉郎襲封衍聖公奉祀奉是時熙宗頗讀論語尙書春秋左氏傳及諸史通厯唐律乙夜乃罷皇統元年三月戊午上謁奠孔子廟北面再拜顧謂侍臣曰朕幼年游佚不知志學歲月逾邁深以為悔大凡為善不可不勉孔子雖無位其道可尊萬世高仰如此皇統二年璠卒子拯襲封加文林郎拯字元濟天徳二年定襲封衍聖公俸格有加于常品是歲立國子監久之加拯承直郎大定元年卒弟總襲封加文林郎總字元㑹大定二十年召總至京師欲與之官尚書省奏總主先聖祀事若加任使守奉有闕上曰然乃授曲阜縣令明昌元年卒子元措襲加加文林郎元措字夢得三年四月詔曰衍聖公視四品階止八品不稱可超遷中議大夫永著于令四年八月丁未章宗行釋奠禮北面再拜親王百官六學生員陪位承安二年正月詔元措兼曲阜縣令仍世襲元措厯事宣宗哀宗後歸大元終焉四十八代端甫者明昌初學士党懷英薦其年徳俱高讀書樂道該通古學召至京師特賜王澤榜及第除將仕郎小學教授以主簿奉祀致仕范拱字清叔濟南人九歲能屬文深於易學宋末登進士第調廣濟軍曹權邦彦辟為書記攝學士劉豫鎮東拱撰謁廟文豫竒之深加賞識拱獻六箴齊國建累擢中書舍人上初政録十五篇一曰得民二曰命將三曰簡禮四曰納諫五曰逺圖六曰治亂七曰舉賢八曰守令九曰延問十曰畏慎十一曰節祥瑞十二曰戒雷同十三曰用人十四曰御將十五曰御軍豫納其説而不能盡用也久之權尚書右丞進左丞兼門下侍郎豫以什一税民名為古法其實裒歛而刑法嚴急吏夤縁為暴民久罹兵革益窮困陷罪者衆境内苦之右丞相張孝純及拱兄侍郎巽極言其弊請仍因履畆之法豫不從巽坐貶官自是無復敢言者拱曰吾言之則為黨兄不言則百姓困弊吾執政也寧為百姓言之乃上疏其大略以為國家懲亡宋重歛弊什一税民本務優恤官吏奉行太急驅民犯禁非長久計也豫雖未即從而亦不加譴拱令刑部條上諸路以税抵罪者凡千餘人豫見其多乃更為五等税法民猶以為重也齊廢梁王宗弼領行臺省事拱為官屬宗弼訪求百姓利病拱以減税為請宗弼從之減舊三分之一民始蘇息拱慎許可而推轂士李南張輔劉長言皆拱薦也長言自汝州郟城酒監擢省郎人不知其所以進拱亦不自言也以久病乞近郡除淄州刺史皇統四年以疾求退以通議大夫致仕齋居讀書罕對妻子世宗在濟南聞其名大定初拱上風事七年召赴闕除太常卿議郊祀或有言前代都長安及汴洛以太華等山列為五岳今既都燕當别議五岳名寺僚取嵩高疏周都酆鎬以吳嶽為西岳拱以為非是議略曰軒轅居上谷在恒山之西舜居蒲坂在華山之北以此言之未嘗據所都而改岳祀也後遂不改嘗言禮官當守禮法官當守法若漢臣張釋之可謂能守法矣故其議論確然不可移奪九年復致仕卒於家年七十四張用直臨潢人少以學行稱遼王宗幹聞之延置門下海陵與其兄充皆從之學天眷二年以教宗子賜進士及第除禮部郎中皇統四年為宣徽判官厯横海軍節度副使改寧州刺史海陵即位召為簽書徽政院事太常卿太子詹事海陵嘗謂用直曰朕雖不能博通經史亦粗有所聞皆卿平昔輔導之力太子方就學宜善道之朕父子並受卿學亦儒者之榮也為賀宋國正旦使卒于汴海陵深悼惜之遣使迎䕶其喪官給道途費喪至親臨奠賜錢千萬其養子始七歲特授武義將軍劉樞字居中通州三河人少以良家子從軍屯河間同軰皆騎射獨樞刻意經史登天眷二年進士調唐山主簿改飛狐令蔚州刺史恃功貪汙無所顧忌屬邑皆厭苦之樞一無所應乃摭以他事繁獄將致之死郡人有憐樞者道樞脱走訴於朝㑹亷察使至守倅而下皆抵罪廢獨樞治狀入優等躐遷奉直大夫張浩營建燕京宫室選樞治工役遷尚書刑部員外郎鞫治太原尹圖克坦額哷楚克反狀旬日獄具轉工部郎中進本部侍郎正隆末從軍還自江上大定初與左司郎中王蔚右司員外郎王全俱出補外樞為南京路轉運使事初世宗欲復用樞等御史臺奏樞等在正隆時皆以巧進敗法蠧政人多怨嫉之上以樞等頗幹濟猶用之戒之曰能悛心改過必加升擢不然則斥汝等矣是時珠勒根彦忠為南京都轉運使不閑吏事故用樞以佐之遷山東路轉運使改中都路轉運使大定四年卒於官王翛字翛然涿州人也登皇統二年進士第由尚書省令史除同知霸州事累遷刑部員外郎坐請囑故人姦罪杖四十降授泰定軍節度副使四遷大興府治中授户部侍郎世宗謂宰臣曰王翛前為外官聞有剛直名今聞專務出罪為陰徳事多非理從輕又巧倖偷安若果剛直則當忘身以為國履正以無偏何必賣法以徼福耶尋命賑濟密雲等三十六縣明安人户冒請粟三萬餘石為尚書省奏奪官一階出為同知北京留守事上曰人多言王翛能官以朕觀之凡事不肯盡力直一老姦耳二十四年遷遼東路轉運使歲餘改顯徳軍節度使以前任轉運使拽辱倉使王祺致死追兩官解職勑杖七十降鄭州防禦使章宗即位擢同知大興府事審録官奏翛前任顯徳潔亷剛直軍吏歛跡無訟獄遷禮部尚書兼大理卿使宋還㑹改𦵏太師廣平郡王圖克坦貞貞章宗母孝懿皇后父也帝欲用前代故事班劔鼓吹羽葆等儀衞宰臣以貞與弑熙宗誅死意難之於是詔下禮官儀翛言晉𦵏丞相王導給前後羽葆鼔吹武賁班劒百人唐以來大駕鹵簿有班劔其王公以下鹵簿並無班劔兼羽葆非臣下所宜用國朝𦵏大臣亦無之上先知唐𦵏大臣李靖等皆用班劔羽葆怒曰典故所無固可從然用之亦不過禮一日詔翛及諫議大夫兼禮部侍郎張暐詣殿門諭之曰朝廷之事汝諫官禮官即當辯析且小民言可採朕尚從之况卿等乎自今議事母但附合尚書省明昌二年改知大興府事時僧徒多游貴戚門翛惡之乃禁僧午後不得出寺嘗一僧犯禁皇姑大長公主為請翛曰奉上命即令出之立召僧杖一百死京師肅然後坐故出人罪復削官解職明年特授定海軍節度使諭㫖曰卿賦性太剛率意行事乃自陷於刑若殿年降叙念卿入仕乆頗有執持故特起於罪謫之中授以見職且彼歲歉民飢盜賊多須用舊人鎮撫庶得安治勉盡乃心以圖後效未幾表乞致仕上曰翛能幹者得力為多不許復申請從之泰和七年卒年七十五歲性剛嚴臨事果決吏民憚其威雖豪右不敢犯承安間知大興府事闕詔諭宰臣曰可選極有風力如王翛軰者用之其為上所知如此楊伯雄字希雲真定藁城人八世祖彦稠後唐清泰中為定州兵馬使後隨晉主北還遂居臨潢父邱行太子左衞率府率伯雄登皇統二年進士海陵留守中京邱行在幕府伯雄來省視海陵見之深加器重乆之調韓州軍事判官有二盗詐稱賈販逆旅主人見欺至州署陳訴實欲刼取伯雄心覺其詐執而詰之因并獲其黨十餘人一郡駭服遷應奉翰林文字是時海陵執政自以舊知伯雄屬之使時時至其第伯雄諾之而不往他日海陵怪問之對曰君子受知於人當以禮進附麗奔走非素志也由是愈厚待之海陵簒立數月遷右補闕改修起居注海陵鋭於求治論講毎至夜分嘗問曰人君治天下其道何貴對曰貴靜海陵黙然明日復謂曰我遷諸部明安分屯邊戍前夕之對豈指是為非靜邪對曰徙兵分屯使南北相維長䇿也所謂靜者乃不擾之耳乙夜復問鬼神事伯雄進曰漢文帝召見賈生夜半前席不問百姓而問鬼神後世頗譏之陛下不以臣愚陋幸及天下大計鬼神之事未之學也海陵曰但言之以釋永夜倦思伯雄不得已乃曰臣家有一卷書記人死復生或問𡨕官何以免罪答曰汝置一厯白日所為暮夜書之不可書者是不可為也海陵為之改容夏日海陵登瑞雲樓納凉命伯雄賦詩其卒章云六月不知蒸熱到清涼㑹與萬方同海陵忻然以示左右曰伯雄出言不忘規戒為人臣當如是矣再遷兵部員外郎丁父憂起復翰林待制兼修起居注遷直學士再遷右諫議大夫兼注作郎修起居注如故皇子舒蘇鄂博薨伯雄坐與同直者竊議被責語在海陵諸子傳海陵議征江南伯雄奏晉武平吳皆命將帥何勞親總戎律不聽乃落起居注不復召見大定初除大興少尹丁母憂顯宗為皇太子選東宫官屬張浩薦伯雄起復少詹事兄子蟠為左贊善言聽諫從時論榮之集古太子賢不肖為書號瑶山往鑒進之及進羽獵保成等箴皆見嘉納復為左諫議大夫翰林直學士㑹太子詹事闕宰相復舉伯雄上曰伯雄不可去朕左右而東宫亦須輔導遂以太子詹事兼諫議六年上幸西京欲因往凉陘避暑伯雄率衆諫官入諫上曰朕徐思之伯雄言之不已同列皆引退乆之乃起是年至涼陘徼巡果有䟱虞上思伯雄之言及還遷禮部尚書謂近臣曰羣臣有幹局者衆矣如伯雄忠實皆莫及也上謂伯雄曰龍逄比干皆以忠諫而死使遇明君豈有是哉伯雄對曰魏徴願為良臣正謂遇明君耳因顧謂宰臣曰書曰汝無面從退有後言朕與卿等共治天下有事可否即當面陳卿等致位卿相正行道揚名之時偷安自便徼倖一時如後世何羣臣皆稱萬歲十二年改沁南軍節度使召為翰林學士承㫖丞相石琚致仕上問誰可代卿者琚對曰伯雄可時論以琚舉得其人復權詹事伯雄知無不言匡救𢎞多後宫僚有詭隨者人必稱楊詹事以愧之除定武軍節度使改平陽尹先是張浩治平陽有惠政及伯雄為尹百姓稱之曰前有張後有楊徙河中尹卒年六十五諡莊獻弟伯傑伯仁族兄伯淵伯淵字宗之父邱文遼中書舍人伯淵早孤事母以孝聞疎財好施喜收古書天㑹初以名家子補尚書省令史十四年賜進士第厯吏禮二部主事御前承應文字秩滿除同知永定軍節度使事召為司計郎中知平定軍用亷遷平州路轉運使知泰安軍有惠政百姓刻石紀其事四遷山東東路轉運使正隆末羣盜蠭起州郡往往罹害獨濟南頼伯淵保全大定三年致仕卒于家蕭貢字貞卿京兆咸陽人大定二十二年進士調鎮戎州判官涇陽令涇州觀察判官補尚書省令史舊例試補兩月乃補用貢至數日執政以為能即用之擢監察御史提刑司奏涇州有美政遷北京轉運副使親老歸養左丞董師中右丞楊伯通薦其文學除翰林修撰上書論比年之弊人才不以器識操履巧于按牘不涉吏議者為工用人不務因才授官惟泥資叙名器不務慎與人多僥倖守令不務才實民罹其害伏望擢真才以振澆俗核功能以理職業慎名器以抑僥倖重守令以厚邦本然後政化可行百事可舉矣詔詞臣作唐用董重質誅郭誼得失論貢為第一賜重幣四端貢論時政五弊言路四難詞意切至改治書侍御史丁父憂起復改右司員外郎尋轉郎中遷國子祭酒兼太常少卿與陳大任刋修遼史改刑部侍郎厯同知大興府事徳州防禦使三遷河東北路按察轉運使大安末改漳徳軍節度使坐兵興不能守城亡失百姓降同知通逺軍節度事未幾改靜難軍節度使厯河東北路南京路轉運使御史中丞户部尚書南京戒嚴坐乏軍儲詔釋不問興定元年致仕元光二年卒諡文簡貢好學讀書至老不倦有注史記一百卷温特赫提克徳該習經史以女直字出身累官國史院編修初丞相希尹制女直字設學校使額哩埒等教之其後學者漸盛轉習經史故納哈塔椿年赫舍哩良弼皆由此致位宰相提克徳最精深大定十二年詔提克徳所教生員習詩䇿若有文采量才任使願從學者聽十三年設女直進士科是歲圖克坦鎰等二十七人登第十五年提克徳遷著作佐郎與編修宗璧尚書省譯史阿嚕吏部令史張克忠譯經書累遷祕書丞十九年改左贊善以母老求養顯宗使内直丞禄錦謂提克徳曰贊善初未除此官天子謂孤曰朕得一出倫之才學問該貫當令輔汝徳義既數日贊善除此官自謂親炙徳義不勝其喜未可去也勿難于懷乆之轉翰林待制卒明昌五年贈翰林學士承㫖諡文成子額實章宗即位以為符寶典書累官左諫議大夫貞祐四年上疏畧曰今邊備未撤征調不休州縣長吏不知愛養其民督責徴科鞭笞逼迫急於星火文移重複不勝其弊宜敕有司務從簡易兵興以來忠臣烈士孝子順孫義夫節婦湮没無聞者甚衆乞遣史官一員廣為采訪以義褒嘉興定元年遷武勝州節度使改吏部尚書知開封府坐縱軍人家屬出城當杖詔解職四年復知開封府復坐以事囑警巡使完顔金僧努降為鄭州防禦使未幾復為知開封府事張翰字林卿忻州秀容人大定二十八年進士調隰州軍事判官有誣昆弟三人為刼者翰微行亷得其狀白于州釋之厯東勝義豐㑹川令補尚書省令史除户部主事遷監察御史丁母憂服闋調山東路鹽使丁父憂起復尚書省都事户部員外郎大安間平章政事通吉思忠叅知政事承裕行省翰充左右司郎中論議不相叶處置乖方翰屢爭之不見省承裕就逮衞紹王知翰嘗有言召見撫慰之改知登聞鼔院兼前職遷侍御史貞祐初為翰林直學士充元帥府經厯官中都戒嚴調度方殷改户部侍郎宣宗遷汴翰規措扈從糧草至真定上書言五事一曰强本謂當裒兵徒徙豪民以實南京二曰足用謂當按蔡汴舊渠以通漕運三曰防亂謂當就集義軍假之官印使相統攝以安反側四曰省事謂縣邑不能自立者宜稍併之即以省官且易於備盜五曰推恩謂當推恩以示天子所在稱幸之意上畧施行之翰雅有治劇才所至輒辨遷河平軍節度使都水監提控軍馬使俄改户部尚書是時初至南京庶事草略翰經度區處皆有條理是歲卒諡逹義任天寵字清叔曹州定陶人也明昌二年進士調考城主簿再遷威戎縣令縣故堡寨無文廟學舍天寵以廢署建有兄弟訟田者天寵諭以理義委曲周至皆感泣而去調泰定軍節度判官丁父憂服闋調崇義軍節度判官補尙書省令史右三部檢法司正遷監察御史改右司都事遷員外郎改左司諫轉左司郎中遷國子祭酒貞祐初轉祕書監兼吏部侍郎改中都路都轉運使時京師戒嚴糧運艱阻天寵悉力營辨曲盡勞瘁出家貲以濟飢者全活甚衆監察御史高夔劉元規舉天寵二十人公勤明敏有材幹可安集百姓遷户部尚書三年中都不守天寵繼走南京中道遇兵死之諡純肅贊曰程宷任熊祥遼之進士孔璠范揕曾仕宋齊至金皆見禮遇而金之文治日已盛矣張用直父子並列舊學劉樞之練逹王翛之疆敏於事楊伯雄之善諷諫工辭藻蕭貢温特赫提克徳之文藝適時之數人者迭用於正隆大定明昌間張翰任天寵之經理調度宣宗南遷猶頼其用焉金源氏百餘年所以培植人才而獲其效者於斯可槩見矣金史卷一百五
