body:
  text: 金史卷一元中書右丞相總裁托克托等修本紀第一世紀金之先出靺鞨氏靺鞨本號勿吉勿吉古肅慎地也元魏時勿吉有七部曰粟末部曰博綽部曰恩徹亨部曰佛寧部曰哈沙部曰黑水部曰白山部隋稱靺鞨而七部並同唐初有黑水靺鞨粟末靺鞨其五部無聞粟末靺鞨始附高麗姓大氏李勣破高麗粟末靺鞨保東牟山後為渤海稱王傳十餘世有文字禮樂官府制度有五京十五府六十二州黑水靺鞨居肅慎地東瀕海南接高麗亦附于高麗嘗以兵十五萬衆助高麗拒唐太宗敗于安市開元中來朝置黑水府以部長為都督刺史置長史監之賜都督姓李氏名獻誠領黑水經略使其後渤海盛强黑水役屬之朝貢遂絶五代時契丹盡取渤海地而黑水靺鞨附屬于契丹其在南者籍契丹號熟女直其在北者不在契丹籍號生女直生女直地有混同江長白山混同江亦號黑龍江所謂白山黑水是也金之始祖諱函普初從高麗來年已六十餘矣兄阿庫納好佛留高麗不肯從曰後世子孫必有能相聚者吾不能去也獨與弟博和哩俱始祖居完顏部布爾罕水之涯博和哩居扎蘭其後呼實黙以曷蘓館歸太祖自言其祖兄弟三人相别而去蓋阿庫納之後實圖美都古嚕納博和哩之裔也及太祖敗遼兵于境上獲耶律色實乃使梁福額特埓招諭渤海人曰女直渤海本同一家葢其初皆勿吉之七部也始祖至完顏部居久之其部人嘗殺它族之人由是兩族交惡閧鬬不能解完顔部人謂始祖曰若能為部人解此怨使兩族不相殺部有賢女年六十而未嫁當以相配仍為同部始祖曰諾廼自往諭之曰殺一人而鬬不解損傷益多曷若止誅首亂者一人部内以物納償汝可以無鬬而且獲利焉怨家從之乃為約曰凡有殺傷人者徴其家人口一馬十偶牸牛十黄金六兩與所殺傷之家即兩解不得私鬭曰謹如約女直之俗殺人償馬牛三十自此始既備償如約部衆信服之謝以青牛一并許歸六十之婦始祖乃以青牛為聘禮而納之并得其貲產後生二男長烏嚕次斡魯一女卓克索巴自是遂為完顔部人天㑹十四年追諡景元皇帝廟號始祖皇統四年號其藏曰光陵五年増諡始祖懿憲景元皇帝子徳帝諱烏嚕天㑹十四年追諡徳皇帝皇統四年號其藏曰熙陵五年增諡淵穆𤣥徳皇帝子安帝諱巴哈天㑹十四年追諡安皇帝皇統四年號其藏建陵五年增諡和靖慶安皇帝子獻祖諱綏赫黑水舊俗無室廬負山水坎地梁木其上覆以土夏則出隨水草冬則入處其中遷徙不常獻祖乃徙居海古勒水耕墾樹藝始築室有棟宇人呼其地為額訥格爾額訥格爾者漢語居室也自此遂定居于安春水之側矣天㑹十四年追諡定昭皇帝廟號獻祖皇統四年號其藏曰輝陵五年增諡獻祖純烈定昭皇帝子昭祖諱舒嚕剛毅質直生女直無書契無約束不可檢制昭祖欲稍立條敎諸父部人皆不悅欲坑殺之已被執叔父錫里庫知部衆將殺昭祖曰吾兄子賢人也必能承家安輯部衆此輩奈何輒欲坑殺之亟往彎弓注矢射于衆中刼執者皆散走昭祖乃得免昭祖稍以條敎為治部落寖强遼以特哩衮官之諸部猶以舊俗不肯用條敎昭祖耀武至于青嶺白山順者撫之不從者討伐之入于蘇伯扎蘭之地所至皆克㨗還經佛頁水昭祖惡其地名類禽鳥所居雖已困憊不肯止行至古哩甸得疾迨夜寢于村舍有盜至遂中夜啟行至巴喇濟村止焉是夕卒載柩而行遇賊於路奪柩去部衆追賊與戰復得柩爪爾佳部人富呼復來襲埀及富呼問諸路人曰舒嚕柩去此幾何其人曰逺矣追之不及也富呼遂止於是乃得歸𦵏焉生女直之俗至昭祖時稍用條敎民頗聽從尚未有文字無官府不知歲月晦朔是以年壽脩短莫得而考焉天㑹十五年追諡成襄皇帝廟號昭祖皇統四年藏號安陵五年增諡昭祖武惠成襄皇帝子景祖諱烏古鼐遼太平元年辛酉歲生自始祖至此六世矣景祖稍役屬諸部自白山葉赫圖們扎蘭扎卜古倫之屬以至五國之長皆聽命是時遼之邊民有逃而歸者及遼以兵徙圖埓烏舍之民圖埓烏舍多不肯徙亦逃而來歸遼使赫嚕林牙將兵來索逋逃之民景祖恐遼兵深入盡得山川道路險易或將圖之乃以計止之曰兵若深入諸部必驚擾變生不測逋户亦不可得非計也赫嚕以為然遂止其軍與赫嚕自行素之是時鄰部雖稍從海蘭水烏凌阿部錫馨尚拒阻不服攻之不克景祖以計告遼主遼主遣使責讓錫馨錫馨乃遣其子頗克綽歡入朝遼主厚賜遣還其後錫馨與頗克綽歡見遼主於春蒐遼主留錫馨於邊地而遣頗克綽歡還所部景祖之謀也既而五國佛寧部節度使巴哩美叛遼鷹路不通遼人將討之先遣通肯來諭㫖景祖曰可以計取若用兵彼將走保險阻非歲月可平也遼人從之葢景祖終畏遼兵之入其境也故自以為功於是景祖陽與巴哩美為好而以妻子為質襲而擒之獻於遼主遼主召見於寢殿燕賜加等以為生女直部族節度使遼人呼節度使為太師金人稱都太師者自此始遼主將刻印與之景祖不肯繫遼籍辭曰請俟他日遼主終欲與之遣使來景祖詭使部人揚言曰主公若受印繫籍部人必殺之用是以拒之遼使乃還既為節度使有官屬紀綱漸立矣生女直舊無鐵鄰國有以甲胄來鬻者傾貲厚賈以與貿易亦令昆弟族人皆售之得鐵既多因之以修􅃓矢備􅄊械兵勢稍振前後願附者衆鄂敏水富察部特克新特布水完顔部圖們水温特赫部舍音水完顔部相繼來附景祖為人寛恕能容物平生不見喜愠推財與人分食解衣無所吝惜人或忤之亦不念先時有叛去者遣人諭誘之叛者曰汝主和鑾也和鑾吾能獲之吾豈能為和鑾屈哉和鑾漢語慈烏也北方有之狀如大雞善啄物見牛馬槖駞脊間有瘡啄其脊間食之馬牛輒死若飢不得食雖砂石亦食之景祖嗜酒好色飲啗過人時人呼曰和鑾故彼以此訕之亦不以介意其後訕者力屈來降厚賜遣還海蘭水有率衆降者錄其歲月姓名即遣去俾復其故人以此益信服之遼咸雍八年五國穆延部蘇頁貝勒叛遼鷹路不通景祖伐之蘇頁來禦景祖被重鎧率衆力戰蘇頁兵敗走巴喇宻特濼時方十月氷忽解蘇頁不能軍衆潰去乃旋師道中遇逋亡要􅃒險阻晝夜拒戰比至部已憊即往見遼邊將逹嚕噶自陳敗蘇頁功行次拉林水未見達嚕噶疾作而復卒於家年五十四天㑹十四年追諡惠桓皇帝廟號景祖皇統四年藏號定陵五年增諡景祖英烈惠桓皇帝第二子襲節度使是為世祖諱和哩布生女直之俗生子年長即異居景祖九子元配唐古氏生和卓次世祖次噶順次肅宗次穆宗及當異居景祖曰和卓柔和可治家務和哩布有􅄊量智識何事不成噶順亦柔善人耳乃命和卓與世祖同居噶順與肅宗同居景祖卒世祖繼之世祖卒肅宗繼之肅宗卒穆宗繼之穆宗復傳世祖之子至於太祖竟登大位焉世祖遼重熙八年己卯歲生遼咸雍十年襲節度使景祖異母弟伯赫有異志世祖慮其為變不使將兵但為部長伯赫遂誘和諾克薩克逹烏春烏木罕為亂及間諸部使貳于世祖世祖猶欲撫慰之語在伯赫和諾克等𫝊中世祖嘗買𤓰爾佳部鍜工鄂博台被甲九十烏春欲託此以為兵端世祖還其甲語在烏春傳部中有流言曰欲生則附於伯赫欲死則附于和哩布頗拉淑世祖聞之疑焉無以察之乃佯為具裝欲有所往者隂遣人揚言曰㓂至部衆聞者莫知虚實有保於伯赫之室者有保於世祖之室者世祖乃盡得兄弟部屬向背彼此之情矣間數年烏春來攻世祖拒之時十月已半大雨累晝夜氷澌覆地烏春不能進乃悔曰此天也引兵去烏春舍於阿勒哈村卓巴納家而以兵圍其弟雙寛於赫伯村兵退雙寛執其兄卓巴納而請涖殺于世祖且請免其孥戮從之和諾克薩克逹亦舉兵遣肅宗拒之當是時烏春兵在北和諾克兵在南其勢甚盛戒之曰可和則和否則戰肅宗兵敗㑹烏春以久雨解去世祖乃以偏師渉舍琿水經特克水覆和諾克薩克逹之家明日大霧晦㝠失道至摩多圖水乃覺即還至舍琿特克之間升高阜望見六騎來大呼馳擊之世祖射一人斃生獲五人問之則布呼薩克薩使助和諾克薩克逹者也世祖至和諾克薩克逹所居焚其家殺百許人舊將主保亦死之比世祖還與肅宗㑹肅宗兵又敗世祖以失利讓肅宗遣人議和和諾克薩克逹曰以爾英格之大赤馬希卜蘇之紫騮馬與我則和二馬皆女直名馬不許和諾克薩克逹㑹諸部來攻過費摩部以其附於世祖也縱火焚之富察部沙津貝勒呼卜圖貝勒使愛實來告難世祖使之詭從以自全曰戰則以旗鼓自别遂往禦和諾克之衆將行有報者曰伯赫食於愛妾之父家肉脹咽死矣乃遣肅宗求援於遼即率衆出使希卜蘇取海古勒兄弟兵則知海古勒兄弟已貳於和諾克矣欲併取其衆徑往偵者報曰敵已至將戰世祖戒希卜蘇曰汝先設陣於托果原待吾三揚旗三鳴鼔即棄旗決戰死生唯在今日使費摩呼實牽大紫騮馬以為貳馬疾馳至陣時和諾克薩克逹軍盛强世祖軍吏未戰而懼皆植立無人色世祖陽陽如平常亦無責讓之言但令士卒解甲少憇以水沃面調麨水飲之有頃訓勵之軍勢復振乃避衆獨引穆宗執其手密與之言曰今日之事若勝則已萬一有不勝吾必無生汝今介馬遙觀勿預戰事若我死汝勿收吾骨勿顧戀親戚亟馳馬奔告汝兄頗拉淑于遼繫籍受印乞師以報此讐語畢袒袖不被甲以緼袍埀襴護前後心韔弓提劍三揚旗三鳴鼔棄旗搏戰身為軍鋒突入敵陣衆從之希卜蘇從後奮擊大敗之乗勝逐之自安巴彎至于北隘甸死者如仆麻摩多圖水水為之赤棄車甲馬牛軍實盡獲之世祖曰今日之㨗非天不能及此亦可以知足矣雖縱之去敗軍之氣没世不振乃引軍還世祖視其戰地馳突成大路濶且三十隴手殺九人自相重積人皆異之和諾克薩克逹自此不復能聚各以其屬來降遼大安七年也初和諾克兄弟之變博都哩部布呼富察部薩克蘇助之至是招之不來布呼之黨舒嚕遂殺布呼來降薩克蘇追躡亡者道傍人濳射之中口而死自是舊部悉歸景祖時沃哷部人博諾來屬及是有他志㑹其家失火因以縱火誣罕都世祖徴償如約博諾不自安遂結烏春烏木罕舉兵使肅宗與戰敗之獲博諾世祖獻之於遼拉必瑪察侵掠野居女直畧拉林水牧馬世祖擊之中四創久之疾愈拉必等復畧穆宗牧馬交結諸部世祖復伐之拉必等紿降乃旋拉必得古哩甸兵百十有七人據穆稜水守險錫馨子頗克綽歡亦在其中世祖克之盡獲古哩甸兵瑪察遁去遂擒拉必及頗克綽歡皆獻之遼既而復請之遼人與之并以前後所獻罪人歸之罕都破烏春等於實都古實巴克實皆就擒世祖自將與罕都合兵嶺東諸軍皆至是時烏春已前死烏木罕請于遼願和解既與和復來襲乃進軍圍之烏木罕棄城遁去破其城盡俘獲之以功差次分賜諸軍城始破議渠長生殺衆皆長跪遼使者在坐忽一人佩長刀突前咫尺謂世祖曰勿殺我遼使及左右皆走匿世祖色不少動執其人之手語之曰吾不殺汝也於是罰左右匿者曰汝等何敢失次耶罰既已乃徐使執突前者殺之其膽勇鎮物如此師還寢疾遂篤元娶納喇氏哭不止世祖曰汝勿哭汝惟後我一歲耳肅宗請後事曰汝惟後我三年肅宗出謂人曰吾兄至此亦不與我好言乃叩地而哭俄呼穆宗謂曰烏雅舒柔善若辦集契丹事阿固逹能之遼大安八年五月十五日卒襲位十九年年五十四明年納喇氏卒又明年肅宗卒肅宗病篤歎曰我兄真多智哉世祖天性嚴重有智識一見必識暫聞不忘凝寒不縮栗動止不回顧毎戰未嘗被甲先以夢兆候其勝負嘗乗醉騎驢入室中明日見驢足跡問而知之遂不復飲酒襲位之初内外潰叛締交為㓂世祖因敗為功變弱為彊既破和諾克薩克逹烏春烏木罕基業自此大矣天㑹十五年追諡聖肅皇帝廟號世祖皇統四年號其藏曰永陵五年增諡世祖神武聖肅皇帝母弟頗拉淑襲節度使景祖第四子也是為肅宗遼重熙十一年壬午歲生在父兄時號國相國相之稱不知所始初雅逹為國相雅逹者和諾克薩克逹之父也景祖以幣馬求於雅逹而命肅宗為之肅宗自幼機敏善辯當其兄時身居國相盡心匡輔時叔父伯赫有異志及和諾克薩克逹烏春烏木罕錫馨父子拉必瑪察作難毎用兵肅宗獨當一面尤能知遼人國政人情凡有遼事一切委之肅宗専心焉凡白事於遼官皆令逺跪陳辭譯者傳致之往往為譯者錯亂肅宗欲得自前委曲言之故先不以實告譯者譯者惑之不得已引之前使自言乃以草木瓦石為籌枚數其事而陳之官吏聽者皆愕然問其故則為卑辭以對曰鄙陋無文故如此官吏以為實然不復疑故所訴無不如意和諾克薩克逹之戰部人賽罕死之其弟和鑾隂懐忿怨一日忽以劍脊置肅宗項上曰吾兄為汝輩死矣剄汝以償則如之何久之因其兄柩至遂怒而攻希卜蘇希卜蘇走避之攻肅宗于家矢注次室之裙著于門扉復攻罕都罕都衷甲拒于室中既不能入持其門旃而去往附博諾博諾誘烏春兵度嶺世祖與遇于蘇蘇海甸世祖曰予昔有異夢今不可親戰若左軍中有力戰者則大功成矣命肅宗及色埓黙希卜蘇與戰肅宗下馬名呼世祖復自呼其名而言曰若天助我當為衆部長則今日之事神祗監之語畢再拜遂炷火束緼頃之大風自後起火益熾是時八月并青草皆焚之煙熖漲天我軍隨煙衝擊大敗之遂獲博諾囚而獻諸遼并獲和鑾肅宗釋其罪左右任使之後竟得其力焉大安八年自國相襲位是時瑪察尚據哲克依水繕完營堡誘納亡命招之不聽遣康宗伐之太祖以别軍取瑪察家屬錡釜無遺既獲瑪察殺之獻馘于遼屯水民來附二年癸酉遣太祖以偏師伐尼瑪哈部帥水抹離海村跋黑播立開平之自是㓂賊皆息三年八月肅宗卒天㑹十五年追諡穆憲皇帝皇統四年藏號泰陵五年增諡肅宗明睿穆憲皇帝母弟穆宗諱英格字額嚕溫景祖第五子也南人稱揚割太師又曰揚割追諡孝平皇帝號穆宗又曰揚割號仁祖金代無號仁祖者穆宗諱英格諡孝平盈近揚歌近割南北音訛遼人呼節度使為太師自景祖至太祖皆有是稱凡叢言松漠記張棣金志等書皆無足取穆宗遼重熙二十一年癸己歲生肅宗時擒瑪察遼命穆宗為詳衮大安十年甲戌襲節度使年四十二以兄和卓子薩哈為國相三年丙子唐古部巴噶貝勒與温都部人巴圖有舊巴噶以事往巴圖殺巴噶使太祖率師伐巴圖巴圖亡去追及殺之錫馨水赫舍哩部阿蘇穆都哩阻兵為難穆宗自將伐阿蘇薩哈以偏師攻通恩城㧞之阿蘇初聞來伐乃自往訴于遼遂留和卓守阿蘇城穆宗乃還㑹屯水圖嚕庫水赫舍哩部阿勒班及舒嚕阻五國鷹路執殺遼捕鷹使者遼詔穆宗討之阿勒班等據險立柵方大寒乃募善射者操勁􅃓利矢攻之數日入其城出遼使存者數人俾之歸圖們琿春水之交烏庫哩部埓克卓多適與蘓伯水烏庫哩達薩塔並起兵穆嚕宻斯罕城訥格納之子通恩亦亡去於是兩黨作難八月薩哈為都統希卜蘇阿里罕威泰副之以伐埒克卓多烏塔等們圖琿實圖美伐逹薩塔薩哈欲先平邊地城堡或欲先取埓克莫能决乃命太祖往通恩將援埒克乘們圖琿兵未集而攻之實圖美軍既與們圖琿㑹迎擊通恩大敗之降穆嚕宻斯罕城獲通恩逹薩塔釋弗殺太祖度佛寧嶺與薩哈㑹攻破埓克城埓克己先往遼矣盡殺其城中渠長還圍烏塔城烏塔先己亡在外城降於軍卓多亦降於普嘉努於是撫寧諸路如舊時太祖因致穆宗敎圖們琿春葉赫錫馨四路及嶺東諸部自今勿復稱都部長命雙寛綽哈等撫定伊勒呼嶺綽滿水之西諸部居民又命威泰及偏裨悉平二額訥斯琿二恩楚等路冦盜而還七年庚辰和卓尚守阿蘇城穆都哩來降阿蘇猶在遼遼使使來罷兵未到穆宗使烏凌阿舒嚕往佐和卓戒之曰遼使來罷兵但換我軍衣服旗幟與阿蘇城中無辨勿令遼使知之因戒和卓曰遼使可以計却勿聽其言遽罷兵也遼使果來罷兵穆宗使富察部呼嚕貝勒宻遜貝勒與俱至阿蘇城和卓見遼使詭謂呼嚕宻遜曰我部族自相攻擊于汝等何事誰識汝之太師乃援槍刺殺呼嚕宻遜所乘馬遼使驚駭遽走不敢回顧徑歸居數日破其城逹呼布還自遼在城中執而殺之阿蘇復訴於遼遼遣奚節度使伊里來穆宗至拉林水興克村見伊里問阿蘇城事命穆宗曰凡攻城所獲存者復與之不存者備償且徴馬數百匹穆宗與遼佐謀曰若償阿蘇則諸部不復可號令任使也乃令矩威圖塔兩水之民陽為阻絶鷹路復使布古徳部節度使言于遼曰欲開鷹路非生女直節度使不可遼不知其為穆宗謀也信之命穆宗討阻絶鷹路者而阿蘇城事遂止穆宗聲言平鷹路乃畋於屯水而歸是歲埓克來降八年辛巳遼使使持賜物來賞平鷹路之有功者九年壬午使普嘉努以遼賜給矩威圖塔之民且修鷹路而歸冬蕭哈里叛入于係案女直阿克占部遣其族人額特埓來結和曰願與太師友同往伐遼穆宗執額特埓㑹遼命穆宗捕討哈里穆宗送額特埓于遼募軍得甲千餘女直甲兵之數始見于此葢未嘗滿千也軍次混同水蕭哈里再使人來復執之既而與哈里遇哈里遙問曰我使者安在對曰與後人偕來哈里不信是時遼追哈里兵數千里攻之不能克穆宗謂遼將曰退爾軍我當獨取哈里遼將許之太祖䇿馬突戰流矢中哈里首哈里墮馬下執而殺之大破其軍使阿里罕獻馘于遼金人自此知遼之易與也是役也康宗最先登於是以先登并有功者為前行次以諸軍䕶俘獲歸所部穆宗朝遼主于漁所大被嘉賞授以使相錫予加等十年癸未二月穆宗還遼使使授從破哈里者官賞高麗始來通好十月二十九日穆宗卒年五十有一初諸部各有信牌穆宗用太祖議擅置牌號者寘于法自是號令乃一民聽不疑自景祖以來兩世四主志業相因卒定離析一切治以本部法令東南至于伊勒呼海蘭扎蘭托卜古倫東北至于五國矩威圖塔金葢盛于此天㑹十五年追諡孝平皇帝廟號穆宗皇統四年號其藏曰獻陵五年增諡章順孝平皇帝兄子康宗諱烏雅舒字茂禄完世祖長子也遼清寧七年辛丑歲生乾統五年癸未襲節度使年四十三穆宗末年阿蘇使徳濟誘扇邊民海蘭甸人執送之穆宗使碩碩歡撫納海蘭甸未行穆宗卒至是遣焉先是高麗通好既而頗有隙高麗使來請議事使者至高麗拒而不納五水之民附于高麗執團練使十四人語在高麗傳中二年甲申高麗再來伐碩碩歡再破之高麗復請和前所執團練十四人皆遣歸碩碩歡撫定邊民而還蘇伯水民不聽命使威泰等至呼爾哈川召諸官僚告諭鴻觀部蘇伯水齋沃赫貝勒不至威準部哲爾徳部既至復亡去烏塔遇二部於瑪竒嶺執之而來遂伐沃赫克之威泰進至博齊赫攻拔歡塔城乃還四年丙戌高麗遣黑歡方石來賀襲位遣博囉報之高麗約還諸亡在彼者乃使阿古雙寛往受之高麗背約殺二使築九城於海蘭甸以兵數萬來攻烏色敗之斡魯亦築九城與高麗九城相對高麗復來攻烏色復敗之高麗約以還逋逃之人退九城之軍復所侵故地九月乃罷兵七年己丑歲不登減盜賊徴償振貧乏者十一年癸酉康宗卒年五十三天㑹十五年追諡㳟簡皇帝皇統四年號其藏曰喬陵五年增諡康宗獻敏㳟簡皇帝贊曰金之厥初兄弟三人亦微矣熙宗追帝祖宗定著始祖景祖世祖廟世世不祧始祖娶六十之婦而生二男一女豈非天耶景祖不受遼籍遼印取雅逹國相以與其子世祖既破和諾克薩克逹遼政日衰而以太祖屬之穆宗其思慮豈不深逺矣夫金史卷一
