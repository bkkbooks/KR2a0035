body:
  text: 金史卷三十八元中書右丞相總裁托克托等修志第十九禮十一外國使入見儀夏曲宴儀朝辭儀新定使儀外國使入見儀皇帝卽御座鳴鞭報時畢殿前班小起居畢至侍立位引臣僚左右入丹墀小起居引宰執上殿其餘臣僚分班出閤門使奏使者入見牓子先引宋使副出笏捧書左入至丹墀北向立閤使左下接書捧書者單跪授書拜起立閤使左上露階右入欄内奏封全轉讀畢引使副左上露階齊揖入欄内揖使副鞠躬使少前拜跪附奏畢拜起復位立待宣問宋皇帝時並鞠躬受勅旨再揖鞠躬使少前拜跪奏畢起復位齊退却引使副左下至丹墀北嚮立禮物右入左出盡揖使副傍折通班再引至丹墀北嚮立禮物右入左聖躬萬福再拜揖使副鞠躬使出班謝面天顏復位舞蹈五拜再揖使副鞠躬使出班謝遠差接伴兼賜湯藥諸物等復位舞蹈五拜各祗候引右出賜衣次引宋人從入通名已下再拜不出班又再拜各祗候亦引右出次引高麗使左入至丹墀北嚮略立引使左上露階立定揖横使鞠躬正使少前拜跪附奏畢拜起復位立閤使宣問高麗王時並鞠躬受勅旨畢再揖横使鞠躬正使少前拜跪奏畢拜起復位齊退却引左下至丹墀面殿立定禮物右入左出盡揖使傍折通班畢引至丹墀通一十七拜各祗候平立引左階立次引夏使見如上儀引右階立次再引宋使副左入至丹墀謝恩舞蹈五拜各祗候平立次引高麗夏使並至丹墀三使並鞠躬有勅賜酒食舞蹈五拜各祗使引右出次引宰執下殿禮畢曲宴儀皇帝卽御座鳴鞭報時畢殿前班小起居到侍立位引臣僚並使客左入傍折通班至丹墀舞蹈五拜不出班奏聖躬萬福又再拜出班謝宴舞蹈五拜各上殿祗候分引預宴官上殿其餘臣僚右出次引宋使從人入至丹墀再拜不出班奏聖躬萬福又再拜有勅賜酒食又再拜引左廊立次引高麗夏從人入分引左右廊立果床入進酒皇帝舉酒時上下侍立官並再拜接盞畢候進酒官到位當坐者再拜坐卽行臣使酒傳宣立飲畢再拜坐次從人再拜坐至四盞餅茶入致語聞鼔笛時揖臣使并人從立口號絶坐宴并侍立官並再拜坐次從人再拜坐食入五盞歇宴敎坊謝恩畢揖臣使起果床出皇帝起入閤臣使下殿歸幕次賜花人從隨出戴花畢先引人從入左右廊立次引臣使入左右再拜坐九盞將曲終揖從人至位再拜引出聞曲時揖臣使起再拜下殿果床出至丹墀謝宴舞蹈五拜分引臣使起再拜下殿果床出至丹墀謝宴舞蹈五拜分引出朝辭儀皇帝卽御座鳴鞭報時畢殿前班小起居至侍立位引臣僚合班入至丹墀小起居引宰執上報其餘臣僚分班出閤使奏辭榜子先引夏使左入傍折通班畢至丹墀再拜不出班奏聖躬萬福又再拜揖使副鞠躬使出班戀闕致詞復位又再拜唱各好去引右出次引高麗使如上儀亦引右出次引宋使副左入傍折通班畢至丹墀依上通六拜各祗候平立閤使賜衣馬鞠躬聞勅再拜賜衣馬畢平身搢笏單跪受别錄物過盡出笏拜起謝恩舞蹈五拜有勅賜酒食舞蹈五拜引使副左上露階齊揖入欄内揖鞠躬大使少前拜跪受書起復位揖使副齊鞠躬受傳達畢齊退引左下至丹墀鞠躬喝各好去引右出次引宰執下殿禮畢熙宗時夏使入見改為大起居定制以宋使列於三品班高麗夏列於五品班皇統二年六月定臣使辭見臣僚服色拜數止從常朝起居三國使班品如舊俟殿前班及臣僚小起居引宰執升殿餘臣分班畢乃令行人見及朝辭之禮凡入見則宋使先禮畢夏使入禮畢而高麗使入其朝辭則夏使先禮畢而高麗使入禮畢而宋使入夏高麗朝辭之賜則遣使就賜於會同館惟宋使之賜則庭授舊高麗使至闕皆有私進禮大定五年上以宋夏使皆無此禮而小國獨有之不可遂命罷之六年詔外國使初見朝辭則於左掖門出入朝賀賜宴則由應天門東偏門出入大定二十九年三月章宗以在諒闇免宋使朝辭太常寺言若不面授書及傳達語言恐後别有違失遂令宋使先辭靈幄然後詣仁政殿朝辭授書時右丞相襄言伏見熙宗聖誕七月七日以景宗忌辰避之更為翌日復周正月十七日受外國賀今聖誕節若依期令外方人使過界恐為雨潦所滯設能到闕或値隂雨亦難行禮乞以正月十一日或三月十五日為聖節定宋人過界之期平章政事張汝霖叅知政事劉瑋等言帝王當示信以雨潦路阻輒改之或恐失信且宋帝生日亦五月也是時都在會寧上國遣使賜生日萬里渡越江河尚不避霖潦如期而至今久與宋好不可以小阻示以不實彼若過界多作程頓亦不至留滯縱使雨水愆期而入見猶勝更用他日也御史大夫唐古貢中丞李宴刑部尙書兼右諫議大夫完顏居貞等亦皆言不可上初從之旣而竟用襄議令有司移報使明知聖誕之實特改其日以示優待行人之意承安三年正月上諭旨有司曰比聞宋國花宴殿上不設餚饌至其歇時乃備於廊下今花宴上賜食甚為拘束若依彼例可乎且向者人使見辭殿上亦嘗有酒禮今已移在館宴矣有司奏曰曲宴之禮舊矣彼方酒一行食一上必相須成禮而國朝之例酒旣罷而食始進至有食宴日宋使至客省幕次有酒禮而我使至其幕則有食而無洒各因其舊不必相同古者宴禮設食以示慈惠今遽更之恐遠人有疑失朝廷寵待臣子之意乃命止如舊正大元年十月夏國遣使修好二年九月夏國和議定以兄事金各用本國年號定擬使者見辭儀注云蓋夏人自天會議和臣屬於金八十餘年無兵革事及貞祐之初小有侵掠以至搆難十年兩國俱敝至是始以兄弟之國成和十月遣禮部尚書鄂屯良弼大理卿費摩欽甫侍御史烏克遜𢎞毅為報成使三年十月夏人告哀遣中大夫完顏履信為弔祭使夏人以兵事方殷各停使聘四年遣王立之來聘未復命而夏亡新定夏使儀注夏國使副及參議各一謂之使都管三上節中節各五下節二十四謂之三節人從報至行省差接伴使與書表人迓於境入界則先具驛程腰宿之次始至京兆行省翌日賜宴至河南行省亦然謂之來宴將至京遣内侍一人以油絹􅃨韜三銀盒貯湯藥二十六品逆於近境尉氏縣賜之至恩華館舊名燕賓館承安三年更名更衣由宜照門入預差館伴使副使二員書表四人牽擺官三十人以俟來使三節人從至會同館謂之聚㕔先以館伴使名銜付之而使者亦以其銜呈然後使副都管上中節人從以次見館伴使接伴使初相見之儀亦然次以館伴所書表見又使館伴所牽攏官與下節人互相參見畢乃請館伴接伴人使副各公服齊出幕次對行上㕔欄子外館伴在北對立先接伴揖次來使副與館伴互展狀揖各傳示再揖各就位請收笏坐先湯次酒三盞置果殽茶罷執笏近前齊起欄子外館伴在南對立先館伴揖次展接伴辭狀相别揖各傳示再揖通揖分位是日皇帝遣使撫問天使至館轉銜如館伴初見之儀館伴與天使來使副各公服齊行至位對立請來使副升拜褥望闕立次請天使升拜褥稍前立來使副鞠躬天使言有勅乃再拜鞠躬天使口宣辭畢復位來使再拜舞蹈三拜復位立來使與天使各展狀相見揖次館伴使來使令人傳示請館伴天使與來使對行上㕔各赴椅子立通揖請收笏坐湯酒殽茶並如前畢執笏近前齊請起至拜褥依前對立請來使副升褥位進表謝撫問再拜副使平立使跪奉表天使近前搢笏受之出笏復位來使就拜退復對立來使令人傳示館伴依例書送天使土物畢展天使辭狀相别揖次館伴揖各請分位是後毎旦暮傳示并牽攏官聲喏如儀到館之明日遣使賜酒果天使初至轉銜後望拜傳宣皆如撫問之儀使副單跪以酒果過其側拜舞蹈如儀上㕔湯酒茶畢詣拜褥位跪進謝賜酒果表贈天使土物皆如撫問使禮押酒果軍亦有土物之贈乃命閤門副使至館習儀初轉衘前後皆如館伴相見之儀湯茶罷館伴閤副傳示使副來日入見例當習儀來使副回傳示習儀畢第二盞後當面勸習儀承受人酒一盞先揖飲酒再拜退三盞果茶罷執笏近前齊起欄子外南為上對立以來旧入見故但揖而不展辭狀分位乃以入見牓子付閤門持去以付禮進司來使副以書送土物於引進使及交進物軍員人等閤門副及習儀承受人各贈土物第三日入見其日質明都管三節人從皆裏帶館伴與來使副各公服齊請赴馬臺館伴牽攏官喝排馬來使牽攏官喝牽馬各上馬張蓋都管馬上奉書在使前至中門外以外為上對立先來使牽攏官兩聲喏次館伴牽攏官亦然齊揖各傳示再揖請行至左掖門外五百步館伴典使副乃左右易位而行揖畢去門百步去傘下馬出笏對行凡後入稱賀曲宴皆同是儀來使人從持物者不得人門牽攏官權收之客省令二人傳示館伴與來使各令人回傳示至客省幕前館伴所書表在上立齊揖乃入幕先館伴所書表傳示次來使書表傳示依前欄子外立先揖當面勸酒一盞再揖退引館伴來使入客省幕内為上對立揖畢請分位立先館伴揖次展客省起居狀揖各傳示再揖通揖請赴位立再揖請收笏坐先湯次酒三盞各有果殽第二盞酒畢客省乃傳示來使請都管上中節勸酒回傳示畢引都管上中節於幕次前堦下排立先揖飲酒再揖引退第三盞酒畢茶罷執笏近前齊起幕次前立通揖畢各歸本幕次俟殿上小起居畢宰執升殿餘臣分班退閤使奏來使見牓子乃先請館伴入班俟閤門招引乃請客省與來使副對立於幕前外為上使者奉書揖畢對行至三門外與引揖閤副揖使奉書副出笏後隨左上露臺殿簷柱外奉書單跪舊儀於丹墀内奉書閤使接書使副就拜立閤使右入欄子内奏封全轉讀畢故事皆不讀引使副入殿欄子内揖使副鞠躬再拜引少前跪奏弟大夏皇帝致問兄大金皇帝聖躬萬福再拜興復位皇帝乃宣問夏皇帝使副鞠躬受旨畢引使少前跪奏弟大夏皇帝聖躬萬福拜復位立齊退左下階至丹墀北向立以禮物右入左出盡揖使副傍折通班再引至丹墀舞蹈五拜不出班代奏聖躬萬福畢再拜引使副前雙跪皇帝遣入勞問復位謝恩舞蹈五拜再揖使副出班謝面天顏復位舞蹈五拜再揖閤副鞠躬引使出班謝遠差接伴兼賜湯藥諸物復位舞蹈五拜喝各祗候引右出至三門階下與閤副揖别與客省同行至幕次前對揖各歸幕次引都管上中節左入丹墀立下節於門外階下立齊鞠躬通名先再拜不出班奏聖躬萬福再拜下節鞠躬聲喏初一拜呼萬歲次一拜呼萬歲臨起呼萬萬歲喝各祗候平立引右出乃賜使者衣拜舞皆如賜酒果之儀畢使者與天使對立次請都管三節人從望闕立天使稍前立都管人從鞠躬天使傳勅拜謝如使儀就拜畢謝恩再拜下節鞠躬聲喏如入見儀乃再引入賜以酒食閤門招客省皆如入見儀至丹墀謝賜衣物再拜舞蹈三拜鞠躬贊有勅賜酒食舞蹈五拜喝各祗俟引右出如前儀歸幕乃請出館伴與使副幕前對立揖各傳示再揖請行至元下馬所復左右易位而行揖畢各收笏上馬至館又左右易位入門内為上對立先來使牽攏官次館伴牽攏官各聲喏再拜揖畢請分位乃以押伴使賜宴於節押伴至館轉名銜回畢與館伴來使公服齊詣褥位對立押伴稍前立先請押伴館伴上褥位望闕拜謝坐再拜舞蹈三拜起先請押伴上副陽上立乃引使副上褥位望闕亦謝坐儀同上乃與館伴對行上㕔押伴在副階上與使副展叅狀來使副先令人報上聞押伴回傳示再揖請押伴先入於卓前椅位立館伴與使副對揖各就位立通揖請端笏坐湯八乃於拜席上排立都管人從湯盞出揖起押伴等離位立都管人從鞠躬拜下節人聲喏如入見儀呼萬歲畢喝押伴及使副皆就