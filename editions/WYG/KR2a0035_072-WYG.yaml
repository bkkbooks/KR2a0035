body:
  text: 金史卷七十二元中書右丞相總裁托充托等修列傳第十羅索和尼黙音仲本名實古納哈里尼楚赫古雲本名達蘭馬竒子烏色巴爾斯實古納羅索字斡里延完顔部人年二十一代父布達為七水諸部長太祖克寧江州使羅索招諭係遼籍女直降伊騰伊罕路達哈藩卓勒等敗遼兵于布爾罕山復敗遼兵擒兩將軍既而伊克尼瑪蘭兩路皆降進兵咸州克之諸部相繼來降獲遼北女直係籍之戸遼都統耶律卾爾多以二十餘萬衆來戍邊太祖趨達嚕噶城次寧江州西召羅索羅索見上于軍中上見羅索馬多疲乏以三百給之使隸左翼宗翰軍與尼楚赫縱兵衝其中堅凡九陷陣皆力戰而出復與尼楚赫戍邊及九百奚營等部來降則與尼楚赫攻黄龍府上使完顔琿楚博勒和實古納以兵四千助之敗遼兵萬餘于白馬濼宗雄等下金山縣使羅索分兵二千招沿山逃散之人耶律聶哷軍蒺藜山烏楞古羅索等破之遂取顯州太祖取黄龍府羅索請曰黄龍一都㑹且僻逺苟有變則鄰郡相煽而起請以所部屯守太祖然之仍合諸路穆昆命羅索為萬戸守黄龍府進都統從杲取中京與希尹等襲走逹魯和尚伊勒希等敗奚王錫黙降奚部西節度額哩埒遼主自鴛鴦濼西走羅索等追至白水濼獲其内庫寶物羅索遂與棟摩攻破西京復與棟摩至天徳雲内寧邊東勝其官吏皆降獲阿蘓夏人救遼兵次天徳羅索使托紐布當以騎二百為候兵夏人敗之㡬盡額圗琿復以二百騎往遇伏兵獨額圗琿脫歸時久雨諸將欲且休息羅索曰彼再破吾騎兵我若不復往彼將以我怯即來攻我矣乃選千騎與實實巴爾斯往斡魯壯其言從之羅索遲明出陵野嶺留巴爾斯以兵二百據險守之獲生口問之其帥李良輔也將至野登髙望之夏人恃衆而不整方濟水為陣乃使人報斡魯羅索分軍為二迭出迭入進退轉戰三十里過宜水斡魯軍亦至合擊敗之遼都統逹實犯奉聖州壁龍門東二十五里羅索卓哩馬和尚等以兵取之生獲逹實其衆遂降遼必埓哩守奉聖州棄城遯去後與宗望追遼帝羅索芬徹以二十騎候敵敗其軍三千人于三山有千人將趨奉聖州芬徹復敗之擒其主帥而還夏人屯兵於哈屯館宗翰遣羅索戍朔州築城於霸徳山西南二十里遂破朔州西山兵二萬擒其帥趙公直其後復襲遼帝于伊都谷獲之賜鐵劵惟死罪乃笞之餘罪不問尼楚赫圍太原宋統制劉臻救太原率衆十萬出夀陽羅索擊破之繼敗宋兵數千於榆次宋張灝軍出汾州巴爾斯擊走之灝復營文水羅索及托克索巴爾斯與戰灝大敗宗翰定太原羅索取汾石二州及其屬縣温泉方山離石芬徹降夀陽取平定軍及樂平復招降遼州及榆社遼山和順諸縣宗翰趨汴州使羅索等自平陽道先趨河南曰若至澤州與色哩博勒和實實遇當與俱進實實之前軍薩木哈敗宋兵三千于襄垣遇伏兵二千又敗之薩喇達破天井闗復破步兵於孔子廟南遂降河陽羅索軍至既渡河遂薄西京城中兵來拒戰實實逆擊敗之西京降羅索取偃師永安軍鞏縣降薩喇達敗宋兵於汜水於是滎陽滎澤鄭州中牟相次皆降宗翰已與宗望㑹軍于汴使羅索率師趨陜津攻河東郡縣之未下者烏爾圖罕敗敵于河上桑阿敗敵于陜城下呼沙呼降虢州守陴卒三百人遂克陜府實古納桑衮破陜之散卒于平陸西北和尼别破敵於平陸羅索破蒲解之軍二萬盡覆之安邑解州皆降遂克河中府降綘慈隰石等州宗翰往洛陽使羅索取陜西敗宋將范致虚軍下同華二州克京兆府獲宋制置使傅亮遂克鳯翔阿林等破宋大兵於河中斡魯破宋劉光烈軍於馮翊額特埓桑衮敗敵於渭水遂取下邽宗翰㑹宗輔伐康王命羅索芬徹專事陜西以博勒和勝額監戰勝額等遇敵於蒲城及同州皆破之羅索芬徹克丹州破臨真進克延安府遂降綏徳軍及靜邉懐逺等城寨十六復破青澗城宋安撫使折可求以麟府豐三州及堡寨九降于羅索晉寧所部九寨皆降而晉寧軍久不下羅索欲去之色哩不可曰此與夏鄰且生他變城中無井日取河水以為飲乃決渠于東泄其水城中遂困李位石乙啓郭門降諸將率兵入城守將徐徽言據子城戰三日衆潰徽言出奔獲之使之拜不聴臨之以兵不為動縶之軍中使先降者諭之使降徽言大罵與統制孫昻皆不屈乃并殺之遂降定安堡渭平寨及鄜坊二州於是羅索博勒和守延安折可求屯綏徳芬徹還守蒲州延安鄜坊州皆殘破人民存者無㡬羅索置官府輯安之别將卾倫降建昌軍京兆府叛羅索復討平之遂與阿里布穆里延至三原額克沁阿古擊淳化兵敗之羅索乃攻乾州已築甬道列礟具而州降遂進兵克邠州軍于京兆陜西城邑已降定者輒復叛於是睿宗以右副元帥總陜西征伐時羅索已有疾睿宗與張浚戰于富平宗弼左翼軍已却羅索以右翼力戰軍勢復振張浚軍遂敗睿宗曰力疾鏖戰以徇王事遂破巨敵雖古名將何以加也以所用犀玉金銀器及甲胄并馬七匹與之天㑹八年薨十三年贈泰寧軍節度使兼侍中加太子太師皇統元年贈開府儀同三司追封莘王以正隆例改贈金源郡王配享大宗廟庭諡莊義子和尼黙音實古納和尼年十七從攻寧江州力戰創甚扶出陣問太祖憑髙望見問之知是羅索子親撫慰賜藥歎曰此兒他日必為名將其攻濟州敗敵八千與敵遇于信州伊喇本陷于陣和尼力戰出之敵遂北敗耶律佛徳等兵于瀋州及宗翰以兵襲奚王錫黙和尼以兵三百敗敵二千從攻伊實部敗之破其二營塔喇部族叛率二穆昆突入大破之和尼常從羅索圍太原宋將种師中以兵十萬來援和尼擊敗之大軍至河無船不得渡羅索遣和尼循水上下和尼率軍三百自孟津而下度其可渡遂引軍以濟大軍於是皆繼之宋將郭京出兵數萬趨羅索營和尼從旁奮擊敵亂遂破之師還破敵於平陸渡得其船以濟又以兵破敵於張店原時屯留太平翼城皆有重敵並破之又分兵取陜西蒲州降留和尼鎮之攻鳯翔和尼先登睿宗定陜西和尼為都統進攻涇州敗其兵王開山以兵拒歸路邀戰再擊再敗之遂降京兆鳯翔諸縣羅索薨襲哈濟明安代為黄龍府路萬戸天眷三年為元帥右都監遷左監軍元帥府罷改安化軍節度使厯京兆尹封廣平郡王以正隆例改封代國公進封隋國公諡貞濟卒年六十一黙音勇力過人善用長矛突戰天眷間充牌印祗候授顯武將軍擢符寶郎皇統四年其兄和尼襲濟州路萬戸以親管沃濟明安讓黙音朝廷從之權濟州路萬戸八年為元帥右都監天徳三年為順天軍節度使厯河間臨潢尹數月改博索路兵馬都總管薩巴反黙音往討之是時世宗為東京留守自將討𤓰里還遇黙音于常安縣盡以甲士付之世宗還東京完顔福夀髙忠建率所部南征軍亡歸東京黙音亦率其衆來附即以臣禮上謁遂殺髙存福李彦隆等黙音福夀忠建及諸將吏民勸進世宗即位拜右副元帥都統白彦敬副統赫舍哩志寧在北京拒不受命黙音伐之遇其衆于建州之境皆不肯戰彦敬志寧遂降二年正月黙音率諸軍討斡罕㑹兵於濟州合甲士萬三千人過泰州至珠格崖乃捨輜重持數日糧輕騎追之是時斡罕新敗于泰州將走濟州黙音兵至長濼南獲其諜者知敵將由别路邀糧運遂分軍往迎敵吏吉勒扎來降黙音用其計因夜亟往邀敵輜重忽大風不能燧火路暗莫相辨比曉纔行三十餘里將至敵營將士少憩黙音率善射者數十騎往覘之而都統志寧克寧等已敗敵衆二萬餘於長濼追殺甚衆敵遂西遁志寧軍先追及於霿􅟶河急擊敗之而黙音貪鹵掠不復追以故敵得縱去遂涉懿州界陷靈山同昌惠和等縣窺取北京西攻三韓縣惟克寧軍追躡黙音託馬弱引還懿州上聞之下詔切責黙音以布薩忠義為右副元帥代之赫合哩志寧為右監軍代完顔福夀而黙音子色克暴横軍中詔勒歸本貫黙音至京師以為同判太宗正事世宗責之曰朕以汝為將汝不追賊當正汝罪以汝父羅索有大功特免汝死汝雖非宗室而授此職汝其勉之未㡬率賓路軍士珠勒呼告色克寄書與黙音謀反有司并上其書世宗察其誣詔鞫告者珠勒呼欵伏遂誅之召黙音謂之曰人有告卿子為反謀者朕知卿必不為此今告者果自服罪宜悉此意初斡罕方熾上使温特赫阿嚕岱守古北口及斡罕敗于陷泉入于奚中率諸奚攻古北口阿嚕岱因其妻生日輒離軍六十里賊衆聞之來襲殺傷士卒甚衆阿嚕岱坐除名詔黙音芬徹烏哩頁富察通以兵三千㑹舊屯兵擊之擒賊黨明安和卓未㡬斡罕平乃還七年出為北京留守上御便殿賜食及御服衣帶佩刀謂之曰以卿故老欲以均勞逸故授此職卿其勉之改東京留守封榮國公大定十一年薨年六十四黙音性忠厚善擊毬射獵時論以為雖智略不及其父而勇敢肖之云仲本名實古納體貌魁偉通女直契丹漢字其兄斡魯為統軍愛仲才欲使通吏事每視事常在左右遇事輒問之應對如響斡魯嘆曰此子必為令器皇統初充䕶衛授世襲穆昆天徳元年攝其兄和尼濟州萬戸部内稱治除濱州刺史以母憂去官起復知積石軍事轉同知河南尹正隆六年伐宋為神勇軍副都總管與大軍北還除同知大興尹將兵二千益遵化屯軍備契丹遷西南路招討使兼天徳軍節度使政尚忠信決獄公平番部不敢寇邊召為左副都㸃檢宿衛嚴謹每事有規矩後來者守其法莫能易也世宗常謂侍臣曰實古納入直朕寢益安五年宋人請和為姪國不稱臣仲為報問使仲請與宋主相見禮儀世宗曰宋主親起立接書則授之乃至宋一一如禮正隆用兵宋人執商州刺史完顔守能以歸至是仲取守能與俱還上嘉之轉都㸃檢兼侍衛親軍都指揮使遷河南路統軍使上曰卿在禁近小心畏慎河南控制江淮為國重地卿益勉之賜廐馬金帶玉吐鶻復有罪解職久之起為西北路招討使改北京留守卒哈里羅索族子體貌豐偉善用矟羅索為黄龍府萬戸哈里從徙於舒吉卾摩從羅索追及遼主於朔州阿敦山遼主從數十騎逸去羅索遣哈里及珠敦往見遼主諭之使降遼主已窮蹙待於阿敦山之東羅索因獲之賞哈里金五十兩銀五百兩幣帛二百匹綿三百兩睿宗經略陜西哈里戰却吳玠軍於涇邠之南尋遣修棧道宋人恐棧道成以兵來拒破其兵賞銀百五十兩奴婢十人天眷元年擢宿直將軍與定宗磐宗儁之亂再遷廣威將軍除都水使者改西北路招討都監厯復州灤州刺史伊囉斡羣牧使塔喇部族節度使同知大興尹兼中都路兵馬都總管改武寧軍節度使廣寧尹卒年六十二尼楚赫宗室子太祖嗣位使普嘉努如遼取阿蘇事久不決乃使實古納尼楚赫繼往當是時遼主荒于政上下解體尼楚赫等還具以遼政事人情告太祖且言遼國之狀太祖決意伐遼葢自尼楚赫等發之太祖與耶律鄂爾多戰于達嚕噶城遼兵二十餘萬尼楚赫羅索率衆衝其中堅凡九陷陣輒戰而出大敗遼軍尼楚赫為穆昆遂與羅索戍邉復與羅索琿楚博勒和實古納等攻黄龍府敗遼兵萬餘于白馬濼太祖拒遼尼楚赫守達嚕噶城收國二年分雅達納阿拉所遷穆昆二千戸以尼楚赫為穆昆屯寧江州遼大冊使實訥埓遣回約以七月半至而盡九月實訥埓未來上使諸軍過江屯駐遼伊喇滿達十三人兵士八人縱火於渾河以絶芻牧尼楚赫獲之乃知遼邊吏伊蘇使之太祖命釋之從都統杲克中京尼楚赫與實古納芬徹哈布爾率兵三千擊奚王錫黙于京西七十里錫黙棄兵遯遼主西奔天徳尼楚赫以兵絶其後遼主遂見獲後從宗翰伐宋圍太原宗翰進兵澤州及宗翰還西京太原因未下皆命尼楚赫留兵圍之招討都監馬武破宋兵於文水節度使耿守忠等敗宋黄迪兵於西都谷所殺不可勝計宋樊夔施詵髙豐等軍來救太原分兵據近部尼楚赫與實實博囉烏蘇大破之索羅希破宋兵於太谷宋兵據太谷祁縣阿古喇巴爾斯復取之种師中出井陘據榆次救太原尼楚赫使卾倫擊之破其軍和尼斬師中於殺熊嶺進攻宋制置使姚古軍于隆州谷大敗之薩喇圖敗宋軍於回馬口郭企忠殱宋軍於五臺及宗翰定太原與宗望㑹兵于汴尼楚赫等攻汴城克之師還尼楚赫降岢嵐寧化等軍攻嵐州拔之招降火山軍與希尹同賜鐵劵宗翰趨洛陽色哩取汝州尼楚赫取鄧州殺其將李操等蘇瑪拉入襄陽巴爾斯入均州馬武取房州擒轉運使劉吉鄧州通判王彬巴爾斯破唐蔡陳三州克潁昌沙琿額哲别克舊潁昌宗翰㑹伐康王尼楚赫守太原天㑹十年為燕京留守天㑹十三年致仕加保大軍節度使同中書門下平章事遷中書令封蜀王天眷三年薨年六十八以正隆例贈金源郡王配饗太宗廟庭大定十五年諡武襄改配享太祖廟庭子古雲古雲本名達蘭幼警敏有志膽初丱角太祖見而竒之年十六父尼楚赫授以甲使從伐遼常為先鋒授世襲穆昆宗翰自太原還西京尼楚赫圍守之古雲在行間屢有功宋兵數萬救太原至南闗尼楚赫與弟巴爾斯完顔羅索等擊之當隘巷間一卒揮刀向巴爾斯古雲以刀斷其腕一卒復從旁以槍刺之古雲斷其槍追殺之拔太原下河東諸州攻汴京皆有功與都統馬武徇地漢上至上蔡以先鋒破孔家軍睿宗攻開州古雲先登流矢中其口睿宗親視之創未愈强起之攻大名府第功宗弼第一古雲次之攻東平古雲居最巴爾斯襲宋康王于揚州古雲為先鋒巴爾斯追宋孟后於江南古雲前行趨潭州宋大兵在常武古雲以選兵薄其城敗千餘人明日城中出兵來戰古雲以五百騎敗之獲馬二百匹遂攻常武巴爾斯以諸軍為大陣居其後古雲以五百騎為小陣當前行即麾兵馳宋軍宋軍亂遂大敗之巴爾斯觀其周旋嘆賞之其後河東郡縣多叛古雲以先鋒攻絳州克之復攻沁州飛礟擊其右脅舁歸營中諸軍攻沁州三日不能下别將固納强起古雲指麾士卒遂克之攝河東路都統從左監軍伊喇伊都招西北諸部古雲將騎三千五百平其九部獲生口三千馬牛羊十五萬以先鋒破宋吳山軍再戰再勝遂衂宋兵于隘死者不可勝計宋兵遯去宗弼再取和尚原古雲以本部破宋五萬人遂奪新叉口宗弼留兵守之是夜大雪道路皆氷和尚原宋兵勢重不可徑取宗弼用古雲策入自傍近高山叢薄醫薈間出其不意遂取和尚原古雲請速入大散闗自以本部為殿以備伏兵宗弼至仙人闗古雲先攻之宗弼止之古雲不止宗弼以刀背擊其兠鍪使之退古雲曰敵氣已沮不乘此而取之後必悔之已而果然宗弼嘆曰既往不咎乃班師古雲殿且戰且却遂達秦中齊國初廢元帥右監軍薩里罕馳驛撫治諸郡至同州故齊觀察使李世輔出迎陽墜馬稱折臂舁歸薩里罕入城世輔詐使通判獻甲以壯士十人被甲上㕔事世輔自壁後突出執薩里罕古雲方索馬于外變起倉卒不得入城門已閉皆有兵衛至東門合荅雅領騎三十餘與古雲遇遂斬門者出而世輔擁衆自西門出古雲因與合荅雅襲之一進一退以綴世輔使不得速世輔慮救兵至乃要薩里罕與之盟勿使追之留撒离喝於道側古雲識其聲與騎而歸除安逺大將軍攝太原尹四境咸治兼攝河東南北兩路兵馬都總管朝廷以河南陜西與宋已而復取之師至耀州宋人每旦出城張旗閲隊抵暮而還道隘騎不得逞古雲請兵五百薄暮先使五十人趨山巔令之曰旦日視敵出舉幟指其所向乃以餘兵伏山谷間明日城中人出閲如前山巔旗舉伏兵發宋兵爭馳入城古雲麾軍登城拔宋幟立金軍旗幟宋軍後者望見之不敢入遂降城中人亦降宋吳玠擁重兵據涇州涇原以西多應之元帥薩里罕欲退守京兆俟河南河東軍古雲曰我退守吳玠必取鳯翔京兆同華據潼闗吾屬無類矣薩里罕曰計將安出古雲曰事危矣不如速戰我軍陣涇之南原宋兵必自西原來古雲與錫卜察各以選騎五百摧其兩翼元帥當其中擊之可以得志監軍巴爾斯曰二子當其左右巴爾斯願當其中元帥據岡阜多張旗幟為疑兵可以得志薩里罕從之吳玠兵果自西原來古雲錫卜察擊其左右自旦至午吳玠左右軍少退巴爾斯當其前衝擊之遂敗玠軍僵尸枕藉大澗皆滿自此蜀人喪氣不敢復出闗陜遂定厯行臺吏部工部侍郎從宗弼巡邊遷刑部尚書轉元帥左都監天徳二年遷右監軍元帥府罷改山西路統軍使領西北西南兩路招討兵馬坐無功降臨海軍節度使厯平陽太原尹正隆末為中都留守兼西北面都統討契丹薩巴駐軍歸化州世宗即位於遼陽使古雲姪阿爾法持詔往命古雲為左副元帥就遣使召陜西統軍圖克坦喀齊喀宣大定改元詔赦于西南西北招討司河東河北山東諸路州鎮調明安軍屯京畿阿爾法見古雲古雲猶豫未決士卒皆欲歸世宗古雲不得已乃受詔以元帥令下諸路亟泥馬糟二萬具諸路聞之以為大軍且至然後遣人宣赦所至皆聴命大定元年十一月古雲以軍至中都同知留守璋請至府議事古雲疑璋有謀乃陽許諾排節仗若將往者遂率騎從出施仁門駐兵通州見世宗于三河詔古雲以便宜規措河南陜西山東邊事二年正月至南京遂復汝潁嵩等州縣授世襲明安入拜平章政事罷為東京留守未行改濟南尹初古雲宿將恃功在南京頗黷貨不恤軍民詔使問以邊事古雲不答謂詔使曰爾解何事待我到闕奏陳及召入竟無一語及邊事者在相位多自專已所欲輒自奏行之除留守輒忿忿不接賓客雖近臣往亦不見上怒遂改濟南上數之曰朕念卿父有大功于國卿舊將亦有功故改授此職卿宜知之若復不悛非但不保官爵身亦不能保也古雲頓首謝久之改平陽尹致仕起為西京留守以母憂去官尋以本官起復俄復為東京厯上京詔曰上京王業所起風俗日趨詭薄宗室聚居號為難治卿元老大臣衆所聴服當正風俗檢制宗室持以大體十五年致仕久之史臣上太宗睿宗實録上曰當時舊人親見者惟古雲在詔修撰温特赫提克徳往北京就問之多所更定焉十九年薨年七十四最前後以功被賞者十有一金為兩二百五十銀為兩六千五百絹為匹八百綿為兩二千馬三百十有四牛羊六千五百奴婢百三十人瑪竒尼楚赫之母弟也年十五隸軍中從破髙麗兵下寧江州平係遼女直克黄龍府皆身先力戰以功為穆昆繼領明安破奚兵千餘自烏楞古攻下咸信瀋州及東京諸城瑪竒皆有功都統杲取中京與素赫和碩台别降綽里特部屯兵髙州以兵援䝉克貝勒大破敵兵復敗恩州兵五萬人討平遼人聚中京山谷者降三千餘人戰于髙州境上伏矢射之中目遂卒瑪竒大小三十餘戰所至皆㨗皇統中贈銀青光禄大夫諡毅敏子烏色烏色年十七隸軍中從巴爾斯擊遼將馬武敗之瑪竒死領其職宗望伐宋至河上宋兵屯于河外以二舟來伺我師乃遣烏色率勇士數輩以一舟往迎之盡俘以還襲康王於江淮間烏色皆與焉師還駐東平及廢齊屯兵河上招降旁近諸營多獲畜産兵仗軍帥嘉之賞以甲馬從攻陜西為右翼都統攻城破敵皆與有功師還正授穆昆遷華州防禦使屬闗中嵗饑盜賊充斥烏色募兵討平之部以無事郡人列狀丐留不報俄遷徳哷勒部族節度使改塔喇部用亷入為都水使者秩滿同知燕京留守事為西北路招討使薩巴秩滿已數月冐其俸禄不即解去烏色發其事薩巴反烏色遇害巴爾斯尼楚赫弟天輔六年宗翰在北安州將㑹舍音于奚王嶺遼兵奄至古北口使博勒和琿楚各領兵二百擊之琿楚請濟師宗翰欲自往希尹羅索曰此易與耳請以千人為公破之琿楚以騎士三十人前行至古北口遇其遊兵逐入山谷遼人以步騎萬餘迫戰亡騎五人琿楚退據闗口希尹羅索至巴爾斯烏木罕呼實罕推鋒奮擊大破之斬馘甚衆盡獲甲胄輜重希尹與薩拉噶圖費摩托紐敗其伏兵殺千餘人獲馬百餘匹羅索拒夏人出陵野嶺留巴爾斯以兵二百據險守之尼楚赫圍太原近縣先已降宋軍來救太原者復據太谷祁縣巴爾斯阿古喇復取之宋姚古軍隆州谷巴爾斯敗之張灝兵出汾州又擊走之天㑹四年克太原巴爾斯為管勾太原府路兵馬事復與羅索敗宋兵于文水遂從宗翰圍汴與尼楚赫略地襄鄧入均州還攻唐蔡陳三州皆破之克潁昌府遂與托雲馬武襲宋康王于揚州康王渡江入于建康天㑹十五年遷元帥左都監宗弼再定河南薩里罕經略陜西至涇州巴爾斯大破宋軍于渭州渭州徳順軍皆降陜西平遷元帥左監軍加金吾衛上將軍卒諡敏定實古納亦書作實古迺嘗與尼楚赫俱往遼國取阿蘇還言遼人可取之狀太祖始決意伐遼矣博勒和取居庸闗蕭妃自古北口出奔太祖使實古納追之不及後為臨潢府軍帥討平塔喇其羣官率衆降者請使就領諸部太宗賜以空名宣頭及銀牌使以便宜授之獲遼許王索囉駙馬都尉蕭伊遜遼梁王在哈里水雅里自立不知果在何處至是始知之於是徙遼降人於泰州時暑未可徙實古納請姑處之嶺西及實古納築新城於契丹珠敦城詔置㑹平州烏庫哩部人迪里華沙率部族降朝廷以托卜嘉為本部節度使烏琿為都監實古納封還托卜嘉等宣誥以便宜加托卜嘉散官填空名告身授之及録上降附有勞故官八百九十三人朝廷從之於是迪里加防禦使為本部節度華沙加諸司使為節度副使知達魯特部事達勒達加左金吾衛上將軍節度副使知圖吉部事阿實克加觀察使為本部節度其餘遷授有差以巴噶城之地分賜烏庫哩達魯特二部及契丹人其未墾者聴任力占射久之領咸州烟火事天輔六年完顔慎思所部及其餘未置明安穆昆戸口命實古納通閲具籍以上天㑹十年改南京路軍帥司為東南路都統司實古納為都統移治東京鎮髙麗贊曰金啓疆土斡魯烏楞古方面功最先著博勒和羅索最先封泰州之邊圉黄龍之衝要寄亦重矣若棟摩之勤勞南路羅索之經營陜西尼楚赫之圍守太原勞亦至矣烏楞古之不治棟摩之敗譴罰之亟諸將慴焉夫能以弱小終制彊大其效驗與尼楚赫實古納觀人之國而知其可伐古語云國有八觀善矣夫金史卷七十二
