body:
  text: 金史卷六十三元中書右丞相總裁托克托等修列傳第一后妃上始祖明懿皇后徳帝思皇后安帝節皇后獻祖㳟靖皇后昭祖威順皇后景祖昭肅皇后世祖翼簡皇后肅宗靖宣皇后穆宗貞惠皇后康宗敬僖皇后太祖聖穆皇后太祖光懿皇后太祖欽憲皇后太祖宣獻皇后太祖崇妃蕭氏太宗欽仁皇后熙宗悼平皇后海陵嫡母圖克坦氏海陵母大氏后圖克坦氏諸嬖附古者天子娶后三國來媵皆有娣姪凡十二女諸侯一娶九女所以正嫡妾廣繼嗣息妬忌防淫慝塞禍亂也后亡則媵為繼室各以其叙無三媵則娣姪繼室亦各以其叙繼室者治其内政不敢正其位號禮廟無兩祔不並尊也魯成風始兩祔宋國三媵齊管氏三歸春秋皆譏之周禮内宰其屬則内小臣閽人寺人次之九嬪世婦女御女祝女史典婦功典絲典枲内司服又次之昏義稱后立六宫三夫人九嬪二十七世婦八十一御妻不與春秋周禮合後世因仍其說後宫遂至數千金代后不娶庻族甥舅之家有周姬齊姜之義國初諸妃皆無位號熙宗始有貴妃賢妃徳妃之號海陵淫嬖後宫寖多元妃姝妃惠妃貴妃賢妃宸妃麗妃淑妃徳妃昭妃溫妃柔妃凡十二位大定後宫簡少明昌以後大備内宫制度諸妃視正一品比三夫人昭儀昭容昭媛修儀修容修媛充儀充容充媛視正二品比九嬪媫妤九人視正三品美人九人視正四品才人九人視正五品比二十七世婦寳林二十七人視正六品御女二十七十視正七品采女二十七人視正八品比八十一御妻又有尚宫尚儀尚服尚食尚寢尚功皆内官也太祖嫡后聖穆生景宣光懿生宗幹有定䇿功欽憲有保佑之功故自熙宗時聖穆光懿欽憲皆祔宣獻生睿宗大定祔馬故太祖廟祔四后睿世顯宣皆祔兩后惟太宗景宣熙宗章宗室附一后貞慈光獻昭聖雖庶姓皆以子貴宣宗册溫都氏乃賜姓變古甚矣故自初起至于國亡列其世次著其族里可考鑒焉其無與於世道者置不録始祖明懿皇后完顔部人年六十餘嫁始祖天㑹十五年追謚徳帝思皇后不知何部人天㑹十五年追諡安徳節皇后不知何部人天㑹十五年追諡獻祖恭請皇后不知何部人天㑹十五年追諡昭祖威順皇后圖克坦氏諱烏爾袞都喀哈勒琿水達魯鄉圖克坦部人其父巴圖達爾罕后性剛毅人莫敢聘獻祖將為昭祖娶婦曰此子勇㫁異常柔弱之女不可以為配乃為昭祖娶焉天㑹十五年追謚景祖昭肅皇后唐古氏刷水鄂約村唐古部人諱圖卜新父蘇布特薩固察巫者也后有識度在父母家好待賓客父母出則多置酒饌享鄰里迨于行旅景祖飲食過人時人名之和鑾解在景祖紀昭祖曰儉嗇之女吝惜酒食不可以配烏古鼐聞后性度如是乃娶焉遼使通肯來伐五國佛寧部景祖使后與噶順為質於巴哩美而與通肯襲取之遼主以景祖為節度使后雖喜賓客而自不飲酒景祖與客飲后專聴之翌日枚數其人所為無一不中其綮肻有醉而喧呶者輙自歌以釋其忿爭軍中有被笞罰者每以酒食慰諭之景祖行部輙與偕行政事獄訟皆與决焉景祖沒後世祖兄弟凡用兵皆禀於后而後行勝負皆有懲勸農月親課耕耘刈穫逺則乘馬近則䇿杖勤於事者勉之晏出蚤休者訓勵之后往伊敦村世祖肅宗皆從㑹和諾克薩克達偕來是時已有隙被酒語相侵舉刃相向后起兩執其手謂和諾克薩克達曰汝等皆吾夫時舊人奈何一旦遽忘吾夫之恩與小兒子輩忿爭乎因自作歌和諾克薩克達怒乃解其後和諾克兄弟起兵來攻肅宗再失利世祖已退烏春兵與和諾克戰于北隘甸部人碩碩歡逃歸袒甲而至告后曰軍敗矣后方憂懣㑹康宗來報㨗后乃喜既而和諾克薩克達皆降后不妬忌闊略女工能輯睦宗族當時以為有丈夫之度云天㑹十五年追諡世祖翼簡皇后納喇氏大安九年癸酉歳卒天㑹十五年追諡肅宗靖宣皇后富察氏太祖將舉兵入告于后后曰汝邦家之長見可則行吾老矣無貽我憂汝亦必不至是太祖奉觴為夀即奉后出門酹酒禱天后命太祖正坐號令諸將自是太祖毎出師還輒率諸將上謁獻所俘獲天㑹十五年追謚穆宗貞惠皇后烏庫哩氏天㑹十五年追諡康宗敬僖皇后唐古氏天㑹十五年追諡太祖聖穆皇后唐古氏天㑹十三年追諡仍贈后父羅索太尉榮國公祖達呼布司徒英國公曽祖哈納司空溫國公太祖光懿皇后費摩氏天㑹十三年追諡太祖欽憲皇后赫舎哩氏天㑹十三年尊為太皇太后宫號慶元十四年正月己巳朔熙宗朝于慶元宫然後御乾元殿受羣臣賀是月丁丑崩于慶元宫二月癸卯祔𦵏睿陵太祖宣獻皇后布薩氏睿宗母也天㑹十三年追冊曰徳妃大定元年追諡崇妃蕭氏熙宗時封貴妃天徳二年正月封元妃是月尊封太妃海陵母大氏事蕭氏甚謹海陵簒立尊大氏為皇太后居永寧宫每有宴集太妃坐上坐大氏執婦禮海陵積不能平及殺宗義等誣太妃以隠惡殺之併殺所生子任王威赫大定十九年詔改𦵏大宗正丞宗安監護𦵏事遣使致祭上欲復太妃舊號下禮官議前代稱太妃者皆以子貴古者入稱后繫夫在朝稱太繫子與今蕭妃事不同恐不得稱太止當追封妃號詔從之乃封崇妃云太宗欽仁皇后唐古氏熙宗即位與太祖欽憲皇后俱尊為太皇太后號明徳宫贈后父阿爾遜太尉宋國公祖沙必司徒英國公曽祖阿喇蘇司空温國公十四年正月己巳朔上朝兩宫太后然後御乾元殿受賀自後歳以為常皇統元年上自燕京還京師朝謁于明徳宫明年上如天開殿皇子生使使馳報太后太后至天開殿上與皇后親迎之二年崩于明徳宫諡曰欽仁皇后祔𦵏㳟陵熙宗悼平皇后費摩氏熙宗即位封貴妃天眷元年立為皇后父呼達拜太尉贈曽祖舍音司空祖和碩司徒皇統元年熙宗受尊號冊為慈明恭孝順徳皇后二年太子濟安生是歳熙宗年二十四喜甚乃肆赦告天地宗廟彌月冊為皇太子未一歳薨熙宗在位宗翰宗幹宗弼相繼秉政帝臨朝端黙雖初年國家多事而廟算制勝齊國就廢宋人請臣吏清政簡百姓樂業宗弼既沒舊臣亦多物故后干預政事無所忌憚朝官往往因之以取宰相濟安薨後數年繼嗣不立后頗掣制熙宗熙宗内不能平因無聊縱酒酗怒手刃殺人左丞相亮生日上遣太興國以司馬光畫像玉吐鶻廐馬賜之后亦附賜生日禮物熙宗聞之怒遂杖興國而奪回所賜海陵本懐覬覦因之疑畏愈甚蕭牆之變從此萌矣近侍髙夀星隨例遷屯燕南入訴於后后激怒熙宗殺左司郎中薩哈杖平章政事秉徳而夀星竟得不遷秉徳唐古辯之姦謀起焉海陵乘之以成逆亂之計乆之熙宗積怒遂殺后而納胙王常勝妃薩滿入宫繼又殺徳妃烏庫哩氏妃𤓰爾佳氏張氏費摩氏明日熙宗遇弑海陵已弑熙宗欲收人心以后死無罪降熙宗為東昏王追諡后為悼皇后封后父呼達為王大定間復熙宗帝號加諡后為悼平皇后祔𦵏思陵海陵嫡母圖克坦氏宗幹之正室也圖克坦無子次室李氏生長子鄭王充次室大氏生三子長即海陵也圖克坦賢遇下有恩大氏事之甚謹相得歡甚圖克坦養充為己子充與海陵俱為熙宗宰相充嗜酒圖克坦常責怒之尤愛海陵海陵以其母大氏與圖克坦嫡妾之分心常不安及弑熙宗圖克坦與太祖妃蕭氏相顧愕然曰帝雖失道人臣豈可至此圖克坦入宫見海陵不曽賀海陵衘之天徳二年正月圖克坦與大氏俱尊為皇太后圖克坦居東宫號永壽宫大氏居西宫號永寧宫太后父富徳與大氏父俱贈太尉封王圖克坦太后生日酒酣大氏起為夀圖克坦方與坐客語大氏跽者乆之海陵怒而出明日召諸公主宗婦與太后語者皆杖之大氏以為不可海陵曰今日之事豈能尚如前日邪自是嫌隙愈深四年海陵遷中都獨留圖克坦於上京圖克坦常憂懼每中使至必易衣以俟命大氏在中都常思念圖克坦太后謂海陵曰永夀宫待吾母子甚厚慎毋相忘也十二月十四日圖克坦氏生日海陵使祕書監納哈塔椿年往上京上壽貞元元年大氏病篤恨不得一見臨終謂海陵曰汝以我之故不令永夀宫偕來中都我死必迎致之事永夀宫當如事我三年右丞相布薩思恭大宗正丞哈布爾往上京奉遷山陵海陵因命永夀宫太后與俱來繼使平章政事蕭玉迎祭祖宗梓宫於廣寧海陵謂玉曰醫巫閭山多佳致祭奠禮畢可奏太后於山水佳處遊覧及至沙流河海陵迎謁梓宫遂謁見太后海陵命左右約杖二束自隨跪於太后前謝罪曰亮不孝乆闕温凊願太后痛笞之不然且不安太后親扶起之叱約杖者使去太后曰今庶民有克家子立百金之産尚且愛之不忍笞我有子如此寧忍笞乎十月太后至中都海陵帥百官郊迎入居壽康宫是日海陵及後宫宰臣以下奉觴上壽極歡而罷海陵侍太后于宫中外極恭順太后坐起自扶掖之常從輿輦徒行太后所御物或自執之見者以為至孝太后亦以為誠然及謀伐宋太后諫止之海陵心中益不悦每謁太后還必忿怒人不知其所以及至汴京太后居寧徳宫太后使侍婢髙福娘問海陵起居海陵幸之因使伺太后動静几太后動止事無大小福娘夫特黙格教福娘増飾其言以告海陵及樞密使布薩思恭征契丹薩巴辭謁太后太后與思恭語乆之大槩言國家世居上京既徙中都又自中都至汴今又興兵渉江淮伐宋疲弊中國我嘗諌止之不見聼契丹事復如此奈何福娘以告海陵海陵意謂太后以充為子充四子皆成立恐思恭將兵在外太后或有異圖乃召㸃檢大懐忠翰林待制鄂倫尚衣局使華特黙武庫直長實實使弑太后于寧徳宫命䕶衛髙福色埒富僧額以兵士四十人從且戒之曰汝等見太后但言有詔令太后跪受即擊殺之勿令艱苦太后同乳妹安圖多口必妄言當令速死及指名太后左右數人皆令殺之太后方樗蒲大懐忠等至令太后跪受詔太后愕然方下跪華特黙從後擊之仆而復起者再髙福等縊殺之年五十三并殺安圖及郡君巴克繖阿爾法徹辰乳母納蘇侍女阿蘇阿爾本寧徳宫護衛温特赫扎拉直長旺嘉努薩巴實達爾和碩等海陵命焚太后屍棄其骨於水并殺充之子塔納阿里布元努額布勒逃匿歸于世宗自軍中召思恭還殺之及殺阿蘇子孫薩巴二子和碩二子封髙福娘為鄖國夫人以特黙格為澤州刺史海陵許福娘征南回以為妃賜銀二千兩勑戒特黙格無酣酒歐福娘毆福娘必殺汝大定間謚圖克坦曰哀皇后自澤州械特黙格福娘至中都誅之其後貶海陵為庶人宗幹去帝號復封遼王圖克坦降封遼王妃云海陵母大氏天徳二年正月與圖克坦俱尊為皇太后大氏居永寧宫曽祖豎嗣贈司空祖臣寳贈司徒父昊天贈太尉國公兄興國努贈開府儀同三司衛國公十一月昊天進封為王三年正月十六日海陵生日宴宗室百官於武徳殿大氏懽甚飲盡醉明日海陵使中使奏曰太后春秋髙常日飲酒不過數杯昨見飲酒沉醉兒為天子固可樂若聖體不和則子心不安其樂安在至樂在心不在酒也及遷中都永夀宫獨留上京大氏常以為言貞元元年四月大氏有疾詔以錢十萬貫求方藥及病篤遺言海陵當善事永夀宫戊寅崩詔尚書省應隨朝官至五月一日方治事中都自四月十九日為始禁樂一月外路自詔書到日後官司三日不治事禁樂一月聲鐘七晝夜貞元三年大祥海陵率後宫奠哭于菆宫海陵將遷山陵于大房山故大氏猶在菆宫也九月太祖太宗徳宗梓宫至中都尊謚曰慈憲皇后海陵親行冊禮與徳宗合𦵏于大房山升祔太廟大定七年降封海陵太妃削去皇后謚號及宗幹降帝號封遼王詔以圖克坦氏為妃而大氏與順妃李氏寧妃蕭氏文妃圖克坦氏並追降為遼王夫人云廢帝海陵后圖克坦氏大師舎音女初為岐國妃天徳二年封為惠妃九月立為皇后三年十一月二十一日后生日百僚稱賀於武徳殿乆之海陵後宫寖多后寵頗衰希得進見沈璋妻張氏嘗為光英保母耶律徹在北京與海陵游從海陵使璋妻及徹妻侯氏入宫侍后徹本名實訥負官錢二千六百餘萬海陵皆免之正隆六年海陵幸南京六月癸亥左丞相張浩率百官迎謁海陵備法駕乗玉輅與后及太子光英共載而入海陵伐宋后與光英居守海陵遇害圖們額哩頁殺光英于汴后至中都居于海陵母大氏故宫頃之世宗憐其無依詔歸父母家于上京歳賜錢二千貫奴婢皆給官廪大定十年卒海陵為人善飾詐初為宰相妾媵不過三數人及踐大位逞欲無厭後宫諸妃十二位又有昭儀至充媛九位媫妤美人才人三位殿直最下他不可舉數初即位封岐國妃圖克坦氏為惠妃後為皇后第二娘子大氏封貴妃第三娘子蕭氏封昭容耶律氏封修容其後貴妃大氏進封惠妃貞元元年進封姝妃正隆二年進封元妃昭容蕭氏天徳二年特封淑妃貞元二年進封宸妃修容耶律氏天徳四年進昭媛貞元元年進昭儀三年進封麗妃即位之初後宫止此三人尊卑之叙等威之辨若有可觀者及其侈心既萌淫肆蠱惑不可復振矣昭妃阿里庫姓富察氏駙馬都尉穆里延女初嫁宗磐子阿古岱阿古岱誅再嫁宗室囊嘉特囊嘉特死是時囊嘉特父托克索為元帥都監海陵從梁王宗弼俱在南京欲取阿里庫托克索不從遂止及簒位方三日詔遣阿里庫歸父母家閲兩月以婚禮納之數月特封賢妃再封昭妃阿里庫嗜酒海陵責讓之不聼由是寵衰昭妃初嫁阿古岱生女重節海陵與重節亂阿里庫怒重節批其頰頗有詆訾之言海陵聞之愈不悦阿里庫以衣服遺前夫子海陵將殺之圖克坦后率諸妃嬪求哀乃得免凡諸妃位皆以侍女服男子衣冠號假厮兒有勝格者阿里庫與之同臥起如夫婦厨婢三娘以告海陵海陵不以為過惟戒阿里庫勿笞箠三娘阿里庫榜殺之海陵聞昭妃閤有死者意度是三娘曰若果爾吾必殺阿里庫問之果然是月光英生月海陵私忌不行戮阿里庫聞海陵將殺之也即不食日焚香禱祝冀脱死逾月阿里庫已委頓不知所為海陵使人縊殺之倂殺侍婢擊三娘者貴妃定格姓唐古氏有容色崇義節度使烏逹之妻海陵舊嘗有私侍婢貴格與知之烏逹在鎮毎遇元㑹生辰使家奴葛魯葛温詣闕上夀定格亦使貴格候問海陵及兩宫太后起居海陵因貴格傳語定格曰自古天子亦有兩后者能殺汝夫以從我乎貴格歸具以海陵言告定格定格曰少時醜惡事已可恥今兒女已成立豈可為此海陵聞之使謂定格汝不忍殺汝夫我將族滅汝家定格大恐乃以子烏逹布為辭曰彼常侍其父不得使海陵即召烏逹布為符寳祇候定格曰事不可止矣因烏逹醉酒令葛温葛魯縊殺烏達天徳四年七月也海陵聞烏達死詐為哀傷已𦵏烏達即納定格宫中為娘子貞元元年封為貴妃大愛幸許以為后每同輦遊瑶池諸妃步從之海陵嬖寵愈多定格希得見一日獨居樓上海陵與他妃同輦從樓下過定格望見號呼求去詛罵海陵海陵陽為不聞而去定格自其夫時與家奴閻乞兒通嘗以衣服遺乞兒及為貴妃乞兒以妃家舊人給事本位定格既怨海陵疎已欲復與乞兒通有比丘尼三人出入宫中定格使比丘尼向乞兒索所遺衣服以調之乞兒識其意笑曰妃今日富貴忘我耶定格欲以計納乞兒宫中恐閽者索之乃令侍兒以大篋盛褻衣其中遣人載之入宫閽者索之見篋中皆褻衣固已悔懼定格使人詰責閽者曰我天子妃親體之衣爾故翫視何也我且奏之閽者惶恐曰死罪請後不敢定格乃使人以篋盛乞兒載入宫中閽者果不敢復索乞兒入宫十餘日使衣婦人衣離諸宫婢扺暮遣出貴格以告海陵定格縊死乞兒及比丘尼三人皆伏誅封貴格莘國夫人初海陵既使定格殺其夫烏達使實達爾藥師帑傳㫖定格告以納之之意藥師努知定格與乞兒有姦定格以奴婢十八口賂藥師努使無言與乞兒私事定格敗杖藥師努百五十初藥師努嘗盗玉帶當死海陵釋其罪逐去及遷中都復召為實達爾及藥師努既以匿定格姦事被杖後與祕書監文俱與靈夀縣主有姦文杖二百除名藥師努當斬海陵欲杖之謂近臣曰藥師努於朕有功再杖之即死矣丞相李賭等執奏藥師努於法不可恕遂伏誅海陵以葛温葛魯為䕶衛葛温累官長安縣令葛魯累官襄城縣令大定初皆除名麗妃實格者定格之妹祕書監文之妻也海陵私之欲納宫中乃使文庶母阿都固主文家海陵謂阿都固曰必出而婦不然我將别有所行阿都固以語文文難之阿都固曰上謂别有所行是欲殺汝也豈以一妻殺其身乎文不得已與實格相持慟哭而訣是時海陵遷都至中京遣實格至中都俱納之海陵召文至便殿使實格穢談戲文以為笑定格死遣實格出宫不數日復召入封為修容貞元三年進昭儀正隆元年進封柔妃二年進麗妃柔妃密哷姓耶律氏天徳二年使禮部侍郎蕭拱取之于汴過燕京拱父仲恭為燕京留守見密哷身形非若處女者歎曰上必以疑殺拱矣及入宫果非處女明日遣出宫海陵心疑蕭拱竟致之死密哷出宫數月復召入封為充媛封其母張氏莘國夫人伯母蘭陵郡君蕭氏為鞏國夫人蕭拱妻色特爾密哷女兄也海陵既奪文妻實格却以色特爾妻文既而詭以密哷之召召色特爾入宫亂之其後密哷進封柔妃云昭妃阿蘭海陵叔曹國王宗敏妻也海陵殺宗敏而納阿蘭宫中貞元元年封為昭妃大臣奏宗敏屬近尊行不可乃令出宫修儀髙氏秉徳弟嘉哩妻也海陵殺諸宗室釋其婦女宗本子薩爾拉妻宗固子呼喇勒妻和色哩妻及嘉哩妻皆欲納之宫中諷宰相奏請行之使圖克坦貞諷蕭裕曰朕嗣續未廣此黨人婦女有朕中外親將納之何如裕曰近殺宗室中外異議紛紜奈何復為此邪海陵曰吾固知裕不肻從乃使貞自以己意諷裕必欲裕等請其事貞謂裕曰上意已有所屬公固止之將成疾矣裕曰必不肻已唯上擇焉貞曰必欲公等白之裕不得已乃具奏遂納之未㡬封髙氏為修儀加其父髙伊囉幹輔國上將軍母完顔氏封密國夫人髙氏以家事訴於海陵海陵自熙宗時見悼后干政心惡之故自即位不使母后得預政事於是遣髙氏還父母家詔尚書省凡后妃有請于宰相者收其使以聞昭媛扎巴姓耶律氏嘗許嫁奚人蕭唐古特海陵納之封為昭媛唐古特為䕶衛扎巴使侍女鍚納以軟金鵪鶉袋數枚遺之事覺是時唐古特謁告在河間驛召問之唐古特以實對海陵釋其罪海陵登寳昌門樓以扎巴徇諸后妃手刃擊之墮門下死井誅侍女鍚納夀寧縣主實庫宋王宗望女也靜樂縣主布拉及鍚納梁王宗弼女也實古爾宗雋女也皆從姊妹混同郡君蘇哷和卓及其妹伊都太傳宗本女也再從姊妹郕國夫人重節宗磐女孫再從兄之女及母大氏表兄張定安妻鼐喇古麗妃妹富魯和卓皆有夫唯實庫喪夫海陵無所忌恥使髙實古訥格阿古等傳達言語皆與之私凡妃主宗婦嘗私之者皆分屬諸妃出入位下鼐喇古出入元妃位富魯和卓出入麗妃位蘇埒和卓伊都出入貴妃位實庫重節出入昭妃位布拉實古爾出入淑妃位海陵使訥格召實庫先於䁔位小殿置琴阮其中然後召之實庫已色衰常譏其衰老以為笑唯鍚納蘇哷和卓最寵恃勢笞决其夫海陵使鍚納夫素赫押䕶衛直宿蘇哷和卓夫蘇色近侍局直宿謂蘇色曰爾妻年少遇爾直宿不可令宿於家常令宿於妃位每召入必親伺候廊下立乆則坐於髙實古膝上髙實古曰天子何勞苦如此海陵曰我固以天子為易得耳此等期㑹難得乃可貴也每於臥内徧設地衣倮逐以為戯蘇哷和卓在外為淫泆海陵聞之大怒謂蘇哷和卓曰爾愛貴官有貴如天子者乎爾愛人才有才兼文武似我者乎爾愛娛樂有豐富偉岸過於我者乎怒甚氣咽不能言少頃乃撫慰之曰無謂我聞知便爾慚恧遇燕㑹當行立自如無為衆所測度也恐致非笑後亦屢召入焉伊都牌印僧古埒妻也海陵嘗曰伊都貎雖不楊而肌膚㓗白可愛布拉進封夀康公主實庫進封昭寧公主蘇哷和卓進封夀陽縣主重節進封蓬莱縣主重節即昭妃富察氏所生富察怒重節與海陵滛批其頰海陵怒富察氏終殺之者也凡宫人在外有夫者皆分畨出入海陵欲率意幸之盡遣其夫往上京婦人皆不聼出外常令教坊畨直禁中每幸婦人必使奏樂撤其幃帳或使人説淫穢語於其前嘗幸室女不得遂使元妃以手左右之或妃嬪列坐輒率意淫亂使共觀或令人效其形狀以為笑凡坐中有嬪御海陵必自擲一物於地使近侍環視之他視者殺誡宫中給使男子於妃嬪位舉首者刓其目出入不得獨行便旋須四人偕往所司執刀監䕶不由路者斬之日入後下階砌行者死告者賞錢二百萬男女倉卒誤相觸先聲言者賞三品官後言者死齊言者皆釋之女使闢拉有夫在外海陵封以縣君欲幸之惡其有娠飲以麝香水躬自揉拉其腹欲墮其胎闢拉乞哀欲全性命苟得乳免當不舉海陵不顧竟墮其胎富察阿古岱女徹辰海陵姊慶宜公主所生嫁秉徳之弟圖哩秉徳誅當連坐太后使梧桐請于海陵由是得免海陵白太后欲納徹辰太后曰是兒始生先帝親抱至吾家養之至于成人帝雖舅猶父也不可其後嫁宗室安塔哈之子伊里布海陵數使人諷伊里布出之因而納之徹辰與完顔守誠有姦守誠本名格哷勒事覺海陵殺守誠太后為徹辰求哀乃釋之徹辰家奴告徹辰語渉不道海陵自臨問責徹辰曰汝以守誠死詈我邪遂殺之同判大宗正阿古爾妻富僧額元妃之妹因入見元妃海陵逼淫之富僧額自是不復入宫世宗為濟南尹海陵召夫人烏凌阿氏夫人謂世宗曰我不行上必殺王我當自勉不以相累也夫人行至良鄉自殺是以世宗在位二十九年不復立后焉金史卷六十三
