body:
  text: 金史卷一百二十六元中書右丞相總裁托克托等修列傳第六十四文藝下趙渢周昂王庭筠子曼慶劉昂李經劉從益子祁吕中孚張建附李純甫王鬱宋九嘉龐鑄李獻能王若虚王元節弟元徳孫國綱麻九疇李汾元徳明子好問趙渢字文孺東平人大定二十二年進士仕至禮部郎中性冲澹學道有所得尤工書自號黄山趙秉文云渢之正書體兼顔蘇行草備諸家體其超放又似楊凝式當處蘇黄伯仲間党懐英小篆李陽冰以来鮮有及者時人以渢配之號曰党趙有黄山集行於世周昂字德卿真定人父伯禄字天錫大定進士仕至同知沁南軍節度使昂年二十四擢第調南和簿有異政遷良鄉令入拜監察御史路鐸以言事被斥昂送以詩語渉謗訕坐停銓乆之起為龍州都軍以邊功復召為三司官大安兵興權行六部員外郎其甥王若虚甞學於昂昂教之曰文章工於外而拙於内者可以驚四筵而不可以適獨坐可以取口稱而不可以得首肯又云文章以意為主以言語為役主强而役弱則無令不從今人往往驕其所役至跋扈難制甚者反役其主雖極辭語之工而豈文之正哉昂孝友喜名節學術醇正文筆髙雅諸儒皆師尊之既厯臺省為人所擠竟坐詩得罪謫東海上十數年始入翰林言事愈切出佐三司非所好從宗室承裕軍承裕失利跳走上谷衆欲徑歸昂獨不從城陷與其從子嗣明同死於難嗣明字晦之王庭筠字子端河東人生未期視書識十七字七嵗學詩十一嵗賦全題稍長涿郡王翛一見期以國士登大定十六年進士第調恩州軍事判官臨政即有聲郡民鄒四者謀為不軌事覺逮捕千餘人而鄒四竄匿不能得朝廷遣大理司直王仲軻治其獄庭筠以計獲鄒四分别詿誤坐預謀者十二人而已再調館陶主簿明昌元年三月章宗諭㫖學士院曰王庭筠所試文句太長朕不喜此亦恐四方傚之又謂平章張汝霖曰王庭筠文藝頗佳然語句不健其人才髙亦不難改也四月召庭筠試館職中選御史臺言庭筠在館陶甞犯贓罪不當以館閣處之遂罷乃卜居彰德買田隆慮讀書黄華山寺因以自號是年十二月上因語及學士嘆其乏材參政守貞曰王庭筠其人也三年召為應奉翰林文字命與秘書郎張汝方品第法書名畫遂分入品者為五百五十卷五年八月上顧謂宰執曰應奉王庭筠朕欲以詔誥委之其人才亦豈易得近党懐英作長白山冊文殊不工聞文人多妬庭筠者不論其文顧以行止為訾大抵讀書人多口頰或相黨昔東漢之士與宦官分朋固無足恠如唐牛僧孺李德裕宋司馬光王安石均為儒者而互相排毀何耶遂遷庭筠為翰林修撰承安元年正月坐趙秉文上書事削一官杖六十解職語在秉文傳二年降授鄭州防禦判官四年起為應奉翰林文字㤗和元年復為翰林修撰扈從秋山應制賦詩三十餘首上甚嘉之明年卒年四十有七上素知其貧詔有司賻錢八十萬以給䘮事求生平詩文藏之秘閣又以御製詩賜其家其引云王遵古朕之故人也乃子庭筠又以才選直禁林者首尾十年今兹云亡玉堂東觀無復斯人矣庭筠儀觀秀偉善談笑外若簡貴人初不敢與接既見和氣溢於顔間殷勤慰藉如恐不及少有可取極口稱道他日雖百負不恨也從游者如韓溫甫路元亨張進卿李公度其薦引者如趙秉文馮璧李純甫皆一時名士世以知人許之為文能道所欲言暮年詩律深嚴七言長篇尤工險韻有藂辨十卷文集四十卷書法學米元章與趙渢趙秉文俱以名家庭筠尤善山水墨竹云子曼慶亦能詩并書仕至行省右司郎中自號澹游云劉昂字之昂興州人大定十九年進士曾髙而下七世登科昂天資警悟律賦自成一家作詩得晚唐體尤工絶句李純甫故人外傳云昂早得仕年三十三為尚書省掾調平涼路轉運副使時術士有言昂官止五品昂不信俄以母憂去職連蹇十年卜居洛陽有終焉之志有薦其才於章宗者㤗和初自國子司業擢為左司郎中㑹掌書大中與賈鉉漏言除授事為言者所劾獄辭連昂章宗震怒一時聞人如史肅李著王宇宗室從郁皆譴逐之尋亦罷政昂降上京留守判官道卒竟如術者之言李經字天英錦州人作詩極刻苦喜出竒語不蹈襲前人李純甫見其詩曰真今世太白也由是名大震再舉不第拂衣去南渡後其鄉帥有表至朝廷士大夫識之曰此天英筆也朝議以武功就命倅其州後不知所終劉從益字雲卿渾源人其髙祖撝天㑹元年詞賦進士子孫多由科第入仕從益登大安元年進士第累官監察御史坐與當路辨曲直得罪去乆之起為葉縣令修學勵俗有古良吏風葉自兵興戸減三之一田不毛者萬七千畆有竒其嵗入七萬石如故從益請於大司農為減一萬民甚賴之流亡歸者四千餘家未幾被召百姓詣尚書省乞留不聴入授應奉翰林文字踰月以疾卒年四十四葉人聞之以端午罷酒為位而哭且立石頌德以致哀思從益博學强記精於經學為文章長於詩五言尤工有蓬門集子祁字京叔為太學生甚有文名值金末䘮亂作歸潛志以紀金事修金史多採用焉吕中孚字信臣冀州南宫人張建字吉甫蒲城人皆有詩名中孚有清漳集建明昌初授絳州教官召為宫教應奉翰林文字以老請致仕章宗愛其純素不欲令去授同知華州防禦使仍賜詩以寵之自號蘭泉有集行于世李純甫字之甫宏州襄隂人祖安上甞魁西京進士父采卒於益都府治中純甫幼頴悟異常初業詞賦及讀左氏春秋大愛之遂更為經義學擢承安二年經義進士為文法莊周列禦冦左氏戰國策後進多宗之又喜談兵慨然有經世心章宗南征兩上疏䇿其勝負上竒之給送軍中後多如所料宰執愛其文薦入翰林及大元兵起又上疏論時事不報宣宗遷汴再入翰林時丞相髙琪擅威福柄擢為左司都事純甫審其必敗以母老辭去既而髙琪誅復入翰林連知貢舉正大末坐取人踰新格出倅坊州未赴改京兆府判官卒於汴年四十七純甫為人聰敏少自負其材謂功名可俯拾作矮柏賦以諸葛孔明王景略自期由小官上萬言書援宋為證甚切當路者以迂濶見抑中年度其道不行益縱酒自放無仕進意得官未成考旋即歸隠日與禪僧士子游以文酒為事嘯歌袒裼出禮法外或飲數月不醒人有酒見招不擇貴賤必往往輙醉雖沉醉亦未甞廢著書然晩年喜佛力探其奥義自類其文凡論性理及闗佛老二家者號内藁其餘應物文字為外藁又解楞嚴金剛經老子莊子中庸集解鳴道集解號中國心學西方文教數十萬言以故為名教所貶云王鬱字飛伯大興人儀狀魁竒目光如鶻少居鈞臺閉門讀書不接人事乆之為文法栁宗元閎肆竒古動輙數千言歌詩俊逸效李白甞作王子小傳以自叙天興初元汴京被圍上書言事不報四月圍稍解挺身突出為兵士所得其將遇之甚厚鬱徑行無機防為其下所忌見殺臨終懐中出書曰是吾平生著述可傳付中州士大夫曰王鬱死矣年三十餘同時以詩鳴者雷琯侯冊王元粹云宋九嘉字飛卿夏津人為人剛直豪邁少遊太學有能賦聲長從李純甫讀書為文有竒氣與雷淵李經相伯仲中至寧元年進士第厯藍田髙陵扶風三水四縣令咸以能稱入為翰林應奉正大中以疾去沒于癸巳之難龎鑄字才卿遼東人少擢第仕有聲南渡後為翰林待制遷戸部侍郎坐游貴戚家出倅東平改京兆路轉運使卒博學能文工詩造語竒健不凡世多傳之李獻能字欽叔河中人先世有為金吾衛上將軍者時號李金吾家迨獻能昆弟皆以文學名從兄獻卿獻誠從弟獻甫相繼擢第故李氏有四桂堂獻能苦學博覽於文尤長於四六貞祐三年特賜詞賦進士廷試第一人宏詞優等授應奉翰林文字在翰苑凡十年出為鄜州觀察判官用薦者復為應奉俄遷修撰正大末以鎮南軍節度副使充河中帥府經厯官大元兵破河中奔陜州行省以權左右司郎中值趙三三軍變遇害年四十三獻能為人眇小而墨色頗有髯善談論每敷說今古聲鏗亮可聴作詩有志於風雅又刻意樂章在翰院應機敏捷號得體趙秉文李純甫甞曰李獻能天生今世翰苑材故每薦之不令出館家故饒財盡於貞祐之亂在京師無以自資其母素豪奢厚於自奉小不如意則必訶譴人視之殆不堪憂獻能處之自若也時人以純孝稱之甞謂人云吾幼夢官至五品夀不至五十後竟如其言王若虚字從之槀城人也幼頴悟若夙昔在文字間者擢承安二年經義進士調鄜州錄事厯管城門山二縣令皆有思政秩滿老幼攀送數日乃得行用薦入為國史院編修官遷應奉翰林文字奉使夏國還授同知泗州軍州事留為著作佐郎正大初章宗宣宗實錄成遷平凉府判官未幾召為左司諫後轉延州刺史入為直學士天興元年哀宗走歸德明年春崔立變羣小附和請為立建功德碑翟奕以尚書省命召若虚為文時奕輩恃勢作威人或少忤則讒搆立見屠滅若虚自分必死私謂左右司員外郎元好問曰今召我作碑不從則死作之則名節掃地不若死之為愈雖然我姑以理諭之乃謂奕輩曰丞相功徳碑當指何事為言奕輩怒曰丞相以京城降活生靈百萬非功德乎曰學士代王言功德碑謂之代王言可乎且丞相既以城降則朝官皆出其門自古豈有門下人為主帥誦功德而可信乎後世哉奕輩不能奪乃召太學生劉祁麻革輩赴省好問張信之喻以立碑事曰衆議屬二君且已白鄭王矣二君其無讓祁等固辭而别數日促迫不已祁即為草定以付好問好問意未惬乃自為之既成以示若虚乃共刪定數字然止直敘其事而已後兵入城不果立也金亡㣲服北歸鎮陽與渾源劉郁東游㤗山至黄峴峯憩萃美亭顧謂同游曰汨沒塵土中一生不意晚年乃造仙府誠得終老此山志願畢矣乃令子忠先歸遣子恕同行視夷險因垂足坐大石上良乆瞑目而逝年七十所著文章號慵夫集凡若干卷滹南遺老若干卷傳於世王元節字子元宏州人也祖山甫遼戸部侍郎父詡海陵朝左司員外郎元節幼頴悟雖家世貴顯而從學甚謹渾源劉撝愛其才俊以女妻之遂傳其賦學登天德三年詞賦進士第雅尚氣節不能隨時俯仰故仕不顯及遷宻州觀察判官既罷即逍遥鄉里以詩酒自娱號曰遯齋年五十餘卒有詩集行於世弟元德亦第進士有能名於時終南京路提刑使孫國綱字正之業儒術尤長吏事為人端重樂易或有忤者略不與校亦未甞形于怒色大定三年試補尚書吏部掾未㡬轉御史臺令史宣宗聞其材幹興定三年特召為近侍奉職承應甚見寵遇勒留凡三考出為同知申州事無何召為筆硯直長擢監察御史秩滿勑留再任盖知其材器故也開興元年闗陜完顔總帥屯河中府與大元軍戰敗績哀宗遣國綱乗上廄馬徑詣河中問敗軍之由還至中途值大兵見殺時年四十四麻九疇字知幾易州人三嵗識字七嵗能草書作大字有及數尺者一時目為神童章宗召見問汝入宫殿中亦懼怯否對曰君臣父子也子寧懼父耶上大竒之弱冠入太學有文名南渡後寓居郾蔡間入遂平西山始以古學自力博通五經於易春秋為尤長興定末試開封府詞賦第二經義第一再試南省復然聲譽大振雖婦人小兒皆知其名及廷試以誤黜士論惜之已而隠居不為科舉計正大初門人王說王采苓俱中第上以其年幼怪而問之及知甞師九疇平章政事侯摰翰林學士趙秉文連章薦之特賜盧亞牓進士第以病未拜官告歸再授太常寺太祝權博士俄遷應奉翰林文字九疇性資野逸髙蹇自便與人交一語不相入則逕去不返顧自度終不能與世合頃之復謝病去居郾城天興元年大元兵入河南挈家走確山為兵士所得驅至廣平病死年五十九疇初因經義學易後喜邵堯夫皇極書因學算數又喜卜筮射覆之術晚更喜醫與名醫張子和游盡傳其學且為潤色其所著書為文精宻竒健詩尤工緻後以避謗忌持戒不作明昌以来稱神童者五人太原常添夀四嵗能作詩劉滋劉㣲張漢臣後皆無稱獨知幾能自樹立耆舊如趙秉文以徵君目之而不名李汾字長源太原平晉人為人尚氣跌宕不羈性褊躁觸之輙怒以是多為人所惡喜讀史工詩雄健有法避亂入關京兆尹子容愛其材招致門下留二年去之涇州謁左丞張行信一見即以上客禮之元光間游大梁舉進士不中用薦為史館書寫書寫特抄書小史耳凡編修官得日錄纂述既定以藁授書寫書寫錄潔本呈翰表汾既為之殊不自聊時趙秉文為學士雷淵李獻能皆在院刋修之際汾在旁正襟危坐讀太史公左邱明一篇或數百言音吐洪暢旁若無人既畢顧四坐漫為一語云㸔秉筆諸人積不平而雷李尤切齒乃以嫚罵官長訟于有司然時論亦有不直雷李者尋罷入關明年来京師上書言時事不合去客唐鄧間恒山公武仙署行尚書省講議官既而仙與參知政事完顔色埓相異同頗謀自安懼汾言論欲除之汾覺遁泌陽仙令總帥王德追獲之鎻養馬坪絶食而死年未四十汾平生詩甚多不自收集世所傳者十二三而已元徳明系出拓拔魏太原秀容人自幼嗜讀書口不言世俗鄙事樂易無畦畛布衣蔬食處之自若家人不敢以生理累之累舉不第放浪山水間飲酒賦詩以自適年四十八卒有東嵓集三卷子好問最知名好問字裕之七嵗能詩年十有四從陵川郝晉卿學不事舉業淹貫經傳百家六年而業成下太行渡大河為箕山琴臺等詩禮部趙秉文見之以為近代無此作也於是名震京師中興定五年第厯内鄉令正大中為南陽令天興初擢尚書省掾頃之除左司都事轉行尚書省左司員外郎金亡不仕為文有繩尺備衆體其詩竒崛而絶雕劌巧縟而謝綺麗五言髙古沉鬱七言樂府不用古題特出新意歌謡慷慨挾幽并之氣其長短句揄揚新聲以寫恩怨者又數百篇兵後故老皆盡好問蔚為一代宗工四方碑板銘志盡趨其門其所著文章詩若干卷杜詩學一卷東坡詩雅三卷錦機一卷詩文自警十卷晩年尤以著作自任以金源氏有天下典章法度幾及漢唐國亡史作已所當任時金國實錄在順天張萬戸家乃言於張願為撰述既而為樂夔所沮而止好問曰不可令一代之跡泯而不傳乃搆亭於家著述其上因名曰野史凡金源君臣遺言往行采摭所聞有所得輙以寸紙細字為記錄至百餘萬言今所傳者有中州集及壬辰雜編若干卷年六十八卒纂修金史多本其所著云贊曰韓昉吴激楚材而晉用之亦足為一代之文矣蔡珪馬定國之該博胡礪楊伯仁之敏贍鄭子聃麻九疇之英儁王鬱宋九嘉之邁往三李卓犖純甫知道汾任氣獻能尤以純孝見稱王庭筠党懐英元好問自足知名異代王競劉從益王若虚之吏治文不掩其所長蔡松年在文藝中爵位之最重者道金人言利興黨獄殺田瑴文不能掩其所短者歟事繼母有至行其死家無餘資有足取云金史卷一百二十六
