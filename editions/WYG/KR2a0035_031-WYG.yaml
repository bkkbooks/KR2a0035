開寳二年詔昊天上帝皇地祗用犢餘大祀皆以羊豕代之合二羊五豕足代一犢今三年一祫乃為親祀其禮至重每室一犢恐難省減遂命時享與祭社稷如舊若親祠宗廟則共用一犢有司行事則不用十二年十月祫享以攝官行事詔共用三犢二十二年十月詔祫禘共用三犢有司行事則以鹿代昭徳皇后廟大定十九年禘祭不用犢大定二十九年章宗即位禮官言自大定二十七年十月祫享至今年正月世宗升遐故四月不行禘禮按公羊傳閔公二年吉禘于莊公言吉者未可以吉謂未三年也注謂禘祫從先君數朝聘從今君數三年喪畢遇禘則禘遇祫則祫故事宜於辛亥歳為大祥三月禫祭踰月則吉則四月一日為初吉適當孟夏禘祭之時可為親祠詔從之及期以孝懿皇后崩而止五月禮官言世宗升祔已三年尚未合食於祖宗若來冬遂行祫禮伏為皇帝見居心喪喪中之吉春秋譏其速恐冬祫未可行然周禮王有哀􅆭則春官攝事竊以世宗及孝懿皇后升祔以來未曽躬謁豈可令有司先攝事哉况前代令攝事者止施於常祀今乞依故事三年喪畢祫則祫禘則禘於明昌四年四月一日釋心喪行禘禮上從之明昌三年十二月尚書省奏明年親禘室當用犢一欽懷皇后祔于明徳之廟按大定三年祫享明徳皇后室未嘗用犢勑欽懷皇后亦用之上因問拜數右丞瑋具對上曰世宗聖壽高故殺其數亦不立於位今當從禮而已大定六年定晨祼行禮自大次至版位先見神之禮兩拜再至版位又兩拜祼鬯畢還版位先再拜還小次酌獻時罍洗盥訖至版位先兩拜酌獻畢還版位再兩拜止将始祖祝冊於版位西南安置讀冊訖又再拜還小次又至飲福位先兩拜飲畢兩拜凡十六拜貞祐四年命参政知事李革為修太廟使七月吉日親行祔享有司以故事用皇帝時享儀初至版位兩拜晨祼及酌獻則每位三拜飲福五拜總七十九拜今升祔則徧及祧廟五室則為一百九拜也明昌間嘗減每位酌獻奠爵後一拜則為九十二拜而已然大定六年世宗嘗令禮官通減為十六拜文皇帝當散齋四日于别殿致齋三日于大慶殿今國事方殷宜權散齋二日致齋一日上曰拜數從大定例餘准奏禮部尚書張行簡言近奉詔從世宗十六拜之禮臣與太常参定儀注世有疑焉謹按唐宋親祠典禮皆有通拜及隨位拜禮竊宗大定二年親行奉安之禮亦通七拜每室各五拜合七十二拜逮六年禘始勑有司減為十六拜仍存七十二拜之儀其意亦可見矣葢初年享禮以備故後從權更定通拜今陛下初廟見奉安而遽從此制是於隨室神位並無拜禮此臣之所疑一也大定間十有二室姑從十六拜猶可今十有七室而拜數反不及之此臣之所疑二也况六年所定儀注惟於皇帝版位前讀始祖一室祝冊夫祭有祝辭本告神明今諸祝冊各書帝后尊諡及高曽祖考世次不一皇帝所自稱亦自不同而乃止讀一冊餘皆虛室恐於禮未安此臣之所疑三也先王之禮順時施宜不可多寡惟稱而已今近年禮官酌古今别定四十四拜之禮初見神二拜晨祼通四拜隨室酌獻讀祝畢兩拜飲福四拜似為得中上從之乃定祔享如時享十二室之儀又以祧廟五主始祖室不能容止於室户外東西一列以西為上神主闕者以升祔前三日廟内敬造以享日丑前題冩畢以次奉陞十月己未親王百官自明俊殿奉迎祖宗神主于太廟幄次辛酉行禮用四十四拜之儀無宫縣樂犧牲從儉十七室用犢三羊豕九而已以皇太子為亞獻濮王守純為終獻皇帝權服靴􅂁行禮日服衮冕皇太子以下公服無鹵簿儀仗禮畢乘馬還宫金史卷三十一
