body:
  text: 金史巻五十元中書右丞相總裁托克托等修志第三十一食貨五𣙜塲水田和糴區田常平倉度牒入粟鬻𣙜塲與敵國互市之所也皆設塲官嚴厲禁廣屋宇以通二國之貨歳之所獲亦大有助於經用焉熈宗皇統二年五月許宋人之請遂各置於两界九月命壽州鄧州鳳翔府等處皆置海陵正隆四年正月罷鳳翔府唐鄧潁蔡鞏洮等州并膠西縣所置者而専置於泗州尋伐宋亦罷之五年八月命𣙜塲起赴南京國初於西北招討司之燕子城北羊城之間嘗置之以易北方牧畜世宗大定三年市馬於夏國之𣙜塲四年以尚書省奏復置泗壽蔡唐鄧潁宻鳳翔秦鞏洮諸場七年禁秦州塲不得賣米麵及羊豕之腊并可作軍器之物入外界十七年二月上謂宰臣曰宋人喜生事背盟或與逹寔交通恐枉害生靈不可不備其陕西沿邉𣙜塲可止留一處餘悉罷之令所司嚴察姦細前此以防奸細罷西界蘭州保安綏德三𣙜塲二十一年正月夏國王李仁孝上表乞復置以保安蘭州無所産而且税少惟於綏德為要地可復設互市命省臣議之宰臣以陜西隣西夏邊民私越境盗竊縁有𣙜塲故姦人得往来擬東勝可依舊設陕西者竝罷之上曰東勝與陕西道路隔絶貿易不通其令環州置一場尋於綏德州復置一場十二月禁壽州𣙜塲受分例分例者啇人贄見場官之錢幣也章宗明昌二年七月尚書省以泗州𣙜塲自前闗防不嚴遂奏定從大定五年制官為増修舍屋倍設闌禁委場官及提控所拘𣙜以提刑司舉察惟東勝静􅂟州來逺軍者仍舊餘皆脩完之泗州場大定間歳獲五萬三千四百六十七貫承安元年増為十萬七千八百九十三貫六百五十三文所湏雜物泗州場嵗供進新茶千胯荔支五百斤圓眼五百斤金橘六千斤橄欖五百斤芭蕉乾三百箇蘓木千斤溫柑七千箇橘子八千箇沙糖三百斤生薑六百斤梔子九十稱犀象丹砂之類不與焉宋亦歲得課四萬三千貫秦州西子城場大定間歳三萬三千六百五十六貫承安元年歳獲十二萬二千九十九貫承安二年復置於保安蘭州三年九月行樞宻院奏薩察等告開𣙜場擬於色勒年安置許自今年十二月貿易尋定制随路𣙜場若擅以見錢入外界與外人交易者徒五年三斤以上死宋界諸場以伐宋皆罷泰和八年八月以與宋和宋人請如舊置之遂復置於唐鄧壽泗息州及秦鳳之地宣宗貞祐元年秦州𣙜場為宋人所焚二年陕西安撫副使烏庫哩揚珠復開設之歳所獲以十數萬計三年七月議欲聴𣙜場互市用銀而計數税之上曰如此是公使銀入外界也平章盡忠權恭知政事德升曰賞賜之用莫如銀絹而府庫不足以給之互市雖有禁而私易者自如若税之則歛不及民而用可足平章高琪曰小人敢犯法不行爾况許之乎今軍未息而産銀之地皆在外界不禁則公私指日罄矣上曰當熟計之興定元年集賢諮議官吕鑑言嘗監息州𣙜場毎塲獲布数千匹銀数百两兵興之後皆失之金銀之税世宗大定五年聴人射買寳山縣銀冶九年御史臺奏河南府以和買金銀抑配百姓且下其直上曰初朕欲泉貨流通故令行豈可反害民乎遂罷之十二年詔金銀坑冶恣民採毋收税二十七年尚書省奏聴民於農隙採銀承納官課明昌二年天下見在金千二百餘鋌銀五十五萬二千餘鋌三年以提刑司言封諸處銀冶禁民採煉五年以御史臺奏請令民採煉隨處金銀銅冶上命尚書省議之宰臣議謂國家承平日乆戸口増息雖嘗禁之而貧人苟求生計聚衆私煉上有禁之之名而無杜絶之寔故官無利而民多犯法如令民射買則貧民壯者為夫匠老稚供雜役各得均齊而射買之家亦有餘利如此則可以乆行比之官役顧工縻費百端者有間矣遂定制有冶之地委穆昆縣令籍数召募射買禁權要官吏弓兵里胥皆不得與如舊場之例令州府長官一員提控提刑司訪察而禁治之上曰此終非長䇿恭知政事胥持國曰今姑聴如此後有利然後設官可也譬之酒酤葢先為坊場而後官𣙜也上亦以為然遂從之墳山西銀山之銀窟凡百一十有三和糴熈宗皇統二年十月燕西東京河東河北山東汴京等路秋熟有命司増價和糴世宗大定二年以正隆之後倉廪乆匱遣太子少師完顔守道等山東東西路收糴軍糧除戸口歲食外盡令納官給其直三年謂宰臣曰國家經費甚大向令山東和糴止得四十五萬餘石未足為備自古有水旱所以無患者由蓄積多也山東軍屯處湏急為二年之儲若遇水旱則用振濟自餘宿兵之郡亦湏糴以足之京師之用甚大所需之儲其勅戸部宜急為計五年責宰臣曰朕謂積貯為國本當脩倉廪以廣和糴今聞外路官文具而已卿等不留心甚不稱委任之意六年八月勅有司秋成之後可於諸路廣糴以備水旱九年正月諭宰臣曰朕觀宋人虚誕恐不能乆遵誓約其令将臣謹飭邊備以戒不虞去嵗河南豐宜令所在廣糴以寔倉廪詔州縣和糴毋得抑配百姓十二年十二月詔在都和糴以寔倉廪且使錢幣流通又詔凡秋熟之郡廣糴以備水旱十六年九月諭左丞相赫舍哩良弼曰西邊自来不備儲蓄其令所在和糴以備緩急十七年春尚書省奏先奉詔振濟東京等路飢民三路粟􅂾不能給上曰朕嘗諭卿等豐年廣糴以備凶歉卿等皆言天下倉廪盈溢今欲振濟乃云不給自古帝王皆以蓄積為國長計朕之積蓄豈欲獨用即今不給可於隣道取之自今多備當以為常四月尚書省奏東京三路十二明安尤闕食者已振之矣尚未有振者詔遣官詣復州哈斯罕路檢視富家蓄積有餘増直以糴令近地居民就往受糧十八年四月命泰州所管諸明安西北路招討司所管奚明安咸平府􅂟雲縣霿鬆河等等遇豐年多和糴章宗明昌四年七月諭㫖戸部官聞通州米粟甚賤若以平價官糴之何如於是有司奏中都路去嵗不熟今其價稍減者以商旅運販繼至故也若即差官爭糴竊恐市價騰踴貧民愈病請俟秋收日依常平倉條理收糴詔從之明昌五年五月上曰聞米價騰踴今官運至者有餘可減直以糶之其明告民不湏貴價私糴也六年七月勑宰臣曰詔制内􅀈饉之地令減價糶之而貧民無錢者何以得食其議振濟省臣以為闕食州縣一年則當振貸二年然後振濟如其民寔無恒産者雖應振貸亦請振濟上遂命間隔饑荒之地可以辦錢收糴者減價糶之貧乏無依者振濟宣宗貞祐三年十月命高汝礪糴於河南諸郡令民輸輓入京復命在京諸倉糴民輸之数粟侍御史洪果納新言汝礪所糴足給歲支民既於租賦之外轉輓而来亦已勞矣止將其餘以為歸資而又强取之可乎且糴此有日矣而止得三百餘石此何濟也詔罷之十二月附近郡縣多糴於京師榖價騰踴遂禁其出境四年河北行省侯摯言河北人相食觀滄等州斗米銀十餘两伏見㳂河諸津許販粟北渡然每石官糴其八商人無利誰肯為之且河朔之民皆陛下赤子既罹兵革又坐視其死臣恐弄兵之徒得以藉手而起也願止其糴縱民輸販為便詔從之又制凡軍民客旅粟不於官糴處糶而私販渡河者杖百㳂河軍及譏察權豪家犯者徒年杖数並的决從重以物沒官上以河北州府錢多其散失民間頗廣命尚書省措畫之省臣奏己命山東河北𣙜酟及濵滄鹽司以分数帯納矣今河北艱食販粟北渡者衆宜權立法以遮糴之擬於諸渡口南岸選通練財貨官先以金銀絲絹等博易商販之糧轉之北岸以廻易糴本兼收見錢不惟杜姦弊亦使錢入京師從之又上封事者言比年以来屡艱食雖由調度徴歛之繁亦兼并之家有以奪之也收則乘賤多糴困急則以貸人私立券質名為無利而寔数倍饑民惟恐不得莫敢較者故場功甫畢官租未了而囤已空矣此富者益富而貧者益貧者也國朝立法舉財物者月利不過三分積乆至倍則止今或不期月而息三倍願明勅有司舉行舊法豐熟之日増價和糴則在公有益而私無損矣詔宰臣行之是年權河東南路宣撫副使烏庫哩慶壽言邀糴事見鹽志下興定元年上頗聞百姓以和糴太重棄業者多命宰臣加意焉八月以戸部郎中楊貞權陕西行六部尚書收給潼陕軍馬之用奏糴販糧濟河者之半以寛民從之六月立和糴賞格常平倉世宗大定十四年嘗定制詔中外行之其法尋廢章定明昌元年八月御史請復設勅省臣詳議以聞省臣言大定舊制豐年則増市價十之二以糴儉嵗則減市價十之一以出平歳則己夫所以豐則增價以收者恐物賤傷農儉則減價以出者恐物貴傷民増之損之以平粟價故謂常平非謂使天下之民専仰給於此也今天下生齒至衆如欲計口使餘一年之儲則不惟数多難辦又慮出不以時而致腐敗也况復有司抑配之弊殊非經乆之計如計諸郡縣騐戸口例以月支三斗為率毎口但儲三月已及千萬􅂾亦足以平物價救荒凶矣若令諸處自官兵三年食外可充三月之食者免糴其不及者俟豐年糴之庻可乆行也然立法之始貴在必行其令提刑司各路計司兼領之郡縣吏沮格者紏能推行者加擢用若中都路年榖不熟之所則依常平法減其價三之一以糶詔從之三年八月勅常平倉豐糴儉糶有司奉行勤惰褒罸之制其徧諭諸路其奉行滅裂者提刑司紏察以聞又謂宰臣曰随處常平倉往往有名無寔况逺縣人戸豈肯䟦渉直就州縣糶糴可各縣置倉命州縣府官兼提控管勾遂定制縣距州六十里内就州倉六十里外則特置舊擬備戸口三月之糧恐数多致損改令戸二萬以上備三萬石一萬以上備二萬石一萬以下五千以上備萬五千石五千户以下備五千石河南陜西屯軍貯糧之縣不在是數州縣有倉仍舊否則剏置郡縣吏受代所糴粟無壊一月内交割給由如無同管勾亦准上交割違限委州府并提刑司差官催督監交本處嵗豐而収糴不及一分者本等内降提刑司體察直申尚書省至日斟酌黜陟九月勑置常平倉之地令州府官提舉之縣官兼董其事以所糴多寡約量升降為永制又諭尚書省曰上京路諸縣未有常平倉如亦可置定亦當備粟數以聞四年十月尚書省奏今上京扶餘率賔海蘭呼爾哈等路明安穆昆民户計一十七萬六千有餘毎嵗収税粟二十萬五千餘石所支者六萬六千餘石總其見數二百四十七萬六千餘石臣等以為此地收多支少遇災足以振濟似不必置遂止五年九月尚書省奏明昌三年始設常平倉定其永制天下常平倉總五百一十九處見積粟三千七百八十六萬三千餘石可備官兵五年之食米八百一十餘萬石可備四年之用而見在錢總三千三百四十三萬貫有竒僅支二年以上見錢既少且比年稍豐而米價猶貴若復預糴恐價騰踴於民未便遂詔權罷中外常平倉和糴俟官錢羡餘日舉行水田明昌五年閏十月言事者謂郡縣有河者可開渠引以溉田詔下州郡既而八路提刑司雖有河者皆言不可溉惟中都路言安肅定興二縣可引河溉田四千餘畆詔命行之六年十月定制縣官任内有能興水利田及百頃以上者陞本等首注除穆昆所管屯田能剏増三十頃以上賞銀絹二十兩匹其租税止從陸田承安二年勑放白蓮潭東牐水與百姓溉田三年又命勿毁髙梁河閘從民灌溉泰和八年七月詔諸路按察司規畫水田部官謂水田之利甚大沿河通作渠如平陽掘井種田俱可灌溉比年邳沂近河布種荳麥無水則鑿井灌之計六百餘頃比之陸田所收數倍以此較之它境無不可行者遂令轉運司因出計㸃就令審察若諸路按察司因勸農可按問開河或掘井如何為便規畫具申以俟興作貞祐四年八月言事者程淵言碭山諸縣陂湖水至則畦為稲田水退種麥所收倍於陸地宜募人佃之官取三之一嵗可得十萬石詔從之興定五年五月南陽令李國瑞創開水田四百餘頃詔陞職二等仍録其最状徧諭諸道十一月議興水田省奏漢召信臣於南陽灌溉三萬頃魏賈逵堰汝水為新陂通運二百餘里人謂之賈侯渠鄧艾修淮陽百尺二渠通淮潁大治諸陂於潁之南穿渠三百餘里溉田二萬頃今河南郡縣多古所開水田之地收穫於陸地數倍勑令分治戸部按行州郡有可開者誘民赴功其租止依陸田不復添徴仍以官賞激之陜西除三自渠設官外亦宜視例施行元光元年正月遣戸部郎中楊大有等詣京東西南三路開水田區田之法見嵇康養生論自是厯代未有天下通用如趙過一畆三甽之法者章宗明昌三年三月宰執嘗論其法於上前上曰卿等所言甚嘉但恐農不逹此法如其可行當遍諭之四年夏四月上與宰執復言其法乆之參知政事胥持國曰今日方之大定間戸口既多費用亦厚若區種之法行良多利益上曰此法自古有之若其可行則何為不行也持國曰所以不行者蓋民未見其利今已令試種於城南之地乃委官徃監督之若民見收成之利當不率而自效矣參知政事瓜爾佳衡以為若有其利古已行矣且用功多而所種少復恐廢瓏畆之田功也上曰姑試行之六月上問參知政事胥持國曰區種事如何對曰六七月之交方可見矣又問河東及代州田種今嵗佳否曰比常年頗登是日命近侍二人馳驛廵視京畿禾稼五年正月勑諭農民使區種先是陳言人武陡髙翌上區種法且請驗人丁地土多少定數令種上令尚書省議既定遂勑令農田百畆以上如瀕河易得水之地須區種三十餘畆多種者聼無水之地則從民便仍委各千戸穆昆縣官依法勸率承安元年四月初行區種法男年十五以上六十以下有土田者丁種一畆丁多者五畆止二年二月九路提刑馬百禄奏聖訓農民有地一頃者區種一畆五畆即止臣以為地肥瘠不同乞不限畆數制可泰和四年九月尚書省奏近奉㫖講議區田臣等謂此法本欲利民或以天旱乃始用之倉率施功未必有益也且五方地肥瘠不同使皆可以區種農民見有利自當勉以效之不然督責雖嚴亦徒勞耳勑遂令所在長官及按察司隨宜勸諭亦竟不能行入粟鬻度牒熙宗皇統三年三月陜西旱饑詔許富民入粟補官世宗大定元年以兵興嵗歉下令聼民進納補官又募能濟饑民者視其人數為補官格五年上謂宰臣曰頃以邉事未定財用闕乏自東南兩京外命民進納補官及賣僧道尼女冠度牒紫褐衣師號寺觀名額今邉鄙已寕其悉罷之慶夀寺天長觀嵗給度牒毎道折錢二十萬以賜之明昌二年勑山東河北闕食之地納粟補官有差承安二年賣度牒師號寺觀額復令人入粟補官三年西京饑詔賣度牒以濟之宣宗貞祐二年從知大興府事胥鼎所請定權宜鬻恩例格進官升職丁憂人許應舉求仕監戸從良之類入粟草各有数三年制無問官民有能勸率諸人納物入官者米百五十石遷官一階正班任使七百石兩階除諸司千石三階除丞簿過此数則請於朝廷議賞推司縣官有能􅂆二千石遷一階三千石两階以濟軍儲又定制司縣官能􅂆率進糧至五千石以上者減一資考萬石以上遷一官減二等考二萬石以上遷一官陞一等皆注見闕四年河東行省胥鼎言河東兵多民少倉空嵗飢竊見潞州元帥府雖設鬻爵恩例然條目至少未嘗勸率之術今擬凡補買正班依格止廕一名若願輸許増廕一名僧道已具師號者許補買本司官職官願納粟或不願給俸及劵糧者宜量数遷加三舉終塲人年五十以上四舉年四十五以上並許入粟該恩大小官及承應人令譯史吏員雖未係班亦許進納遷官其有品官應注諸司者聴獻物借注丞簿丞簿注縣令差使免一差掌軍官能自備芻糧者依職官例遷官如舊四年耀州僧廣惠言軍儲不足凡京府節鎮以上僧道官乞令納粟百石防刺郡副綱威儀等七十石者乃充三十月滿替諸監寺十石周年一代願復買者聴詔從之興定元年潞州行元帥府事鈕祜禄貞言近承格奏去嵗覃恩之官以品從差等聴其入栗委帥府書空名宣勅授之則人無陳訴之勞而官有儲蓄矣比年屡降覃恩凡羈縻軍職者多未暇授若止許遷新覃則將隔越矣乞令計前後所該輸粟積遷詔從之金史巻五十
