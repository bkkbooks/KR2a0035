body:
  text: 金史卷六十八元中書右丞相總裁托克托等修列傳第六罕都子黙音伊克阿里布固納額爾古訥芬徹罕都完顔部人祖舒嚕與昭祖同時同部同名交相得誓曰生則同川居死則同谷葬土人呼昭祖為勇舒嚕呼舒嚕為賢舒嚕初烏蘇展部有美女名博多和青嶺東混同江舒舒水人掠而去生二女長曰達呼幼曰濟色昭祖與舒嚕謀取之遂偕至嶺右炷火於箭端而射舒舒水人怪之皆走險阻久之無所復見却還所居昭祖及舒嚕以衆至攻取其貲産虜二女子以歸昭祖納其一賢舒嚕納其一皆以為妾是時諸部不肯用條教昭祖耀武于青嶺白山入于蘇伯扎蘭之地賢舒嚕佐之也其後别去至景祖時舒嚕之子噶順舉部來歸居於按春水源庫堪山之南庫堪山者所謂和琳之地是也罕都噶順子世祖初襲節度使而伯赫以屬尊蓄異謀不可制諸部不肯受約束相繼為變罕都入與謀議出臨戰陣未嘗去左右沃哷部人博諾自景祖時與其兄弟俱居按春水之北及烏春作難博諾將與烏春合間誘烏嚕斯哈珠水居人與之相結欲先除去罕都㑹其家被火隂約𨽻人布格蘇詭稱放火為罕都呼圖二人使珠敦來謂世祖曰布格蘇來告曰前日之火罕都等縱之若不棄舊好其執縱火之人以來世祖疑之蘇爾噶勒貝勒曰博諾兄弟也豈以一二人之故而與兄弟搆怨乎彼自取之又將尤誰不如與之便罕都被甲執㦸而起曰彼為亂之人也若取太師兄弟則亦與之乎今取我輩我輩決不可往若必用戰當盡力致死穆宗曰壯哉罕都以我所見正如此耳贈罕都以馬曰戰則乘此衆皆稱善世祖乃往見博諾隔必喇水而與之言曰布格蘇旣告縱火由罕都等謹當如約當先遣布格蘇來布格蘇至世祖於馬前殺之使博諾見之旣而聞之放火者博諾家人恩楚華善也博諾欲開此釁故以誣罕都云拉必瑪察與世祖遇于野鵲水日己曛惟從五六十騎罕都入敵陣鏖擊之左右出入者數四世祖中創乃止烏春烏木罕據哈勒琿水世祖旣許之䧏遂還軍於是薩喇貝勒富哲達蘭觀勝負不助軍而薩喇達蘭先曾與拉必瑪察合世祖欲因軍還而遂滅之馳馬前進達蘭者貞惠皇后之弟也罕都下馬執轡而諫曰獨不念愛弟費揚古與弟婦乎世祖感其言遂止費揚古者漢語云幼弟也世祖母弟中穆宗最少故云然穆宗德罕都言後以達蘭女克爾森妻其子古新太祖追瑪察罕都射中其首獲之遼人命穆宗太祖希卜蘇罕都俱為詳袞烏新烏爾圖以古哩甸兵來歸使薩布貝勒撫定之富察部古實巴克實等誘其衆入城陷三百餘人罕都為都統往治薩布失軍之狀盡解薩布所將軍大破烏春烏木罕於實都擒古實巴克實初頁赫水納哈塔部薩巴之弟日安扎與人爭部族官不得直遂來歸安扎之甥曰薩必曰薩塔希卜蘇破烏春烏木罕城獲薩必薩塔并獲其母以為次室撫其二子薩塔告安扎必為變不信而殺之薩塔臨刑歎曰日後必當知之至是安扎果為變因穆宗晨出獵糾率七八人操兵入宅奪據寢門刧貞惠皇后及家人等罕都入見安扎曰汝輩所謀之事奈何閨門眷屬豈足以刧質徒使之驚恐耳汝固識我盍以我為質也再三言之安扎從之貞惠皇后於是得解而質罕都而薩哈希卜蘇使人告急於獵所穆宗亦心動罷獵歸中途逢告者日午至安扎謂穆宗曰可使係案女直知名官僚相結送我兄弟親屬由咸州路入遼國庫金廐馬與我勿惜罕都亦當送我至遼境然後還而要穆宗與之盟穆宗皆從之遂執罕都及阿勒坦阿喇卜丹等七人共以衣裾相結與安扎俱行至遼境乃釋罕都罕都至濟州實黄龍府使人馳驛要遮安扎之黨屬惟縱其親人使去遂殺薩必并其母遣使報於遼乞還安扎遼人流之和勒端城其後安扎懷思鄉土亡歸附于係案女直因亂其官僚之室捕之不伏乃見殺穆宗襲位之初諸父之子錫林錫伯及諸兄有異言曰君相之位皆渠輩為之奈何罕都曰汝輩若紛爭則吾必不黙黙但已衆聞之遂帖然自是不復有異言者罕都事四君出入四十年征伐之際遇敵則先戰廣廷大議多用其謀世祖嘗曰吾有罕都則何事不成肅宗時委任冠於近僚穆宗嗣位凡圖遼事皆専委之康宗以為父叔舊人尤加敬禮多所補益康宗十一年癸巳二月得疾避疾於黙勒們水薨年六十三喪歸康宗親迓於路送至其家親視葬事天會十五年追贈儀同三司代國公明昌五年贈開府儀同三司諡曰忠敏子古新黙音古新别有傳黙音當安扎之難曾從罕都代為質後與宗峻俱侍太祖宗峻坐黙音上上怒命坐其下貝勒拉巴哩博克順希卜蘇三人爭千戸上曰汝輩能如罕都父子有勞於國者乎乃命黙音為千戸三人者皆𨽻焉其眷顧如此天輔五年十二月卒天㑹十五年贈太子少傅伊克系出景祖居舍音水完顏部為其部貝勒與同部人巴哩貝勒鄂敏水富察部歡托和貝勒蘇都貝勒特克新特布水完顔部安圖貝勒圖卜穆爾水温特赫部和囉海貝勒俱來歸金自此益大肅宗拒和諾克己再失利世祖命罕都伊克以本部穆昆之兵助之伊克與罕都常在世祖左右居則與謀議出則涖行陣未嘗不在其間天會十五年贈銀青光禄大夫明昌五年贈特進諡忠濟與代國公罕都特進和卓開府儀同三司博諾儀同三司巴達俱配享世祖廟廷伊克子阿里布固納額爾古訥薩克達薩克達子芬徹阿里布伊克之子為人魁偉多智略勇於戰未冠從軍下咸州東京遼人來取海州從貝勒瑪竒往援道遇重敵力戰斬首千級從烏楞古攻豪懿州以十餘騎破敵七百進襲遼主阿里布徇北地招降營帳二十四民户數千時已下西京棟摩攻應州未下退營於州北十餘里夜遣阿里布率兵四百伺敵城中果出兵三千來襲阿里布道與之遇斬首百餘獲馬六十後遼兵三萬出馬邑之境以千兵擊之斬其將於陣天會初宋王宗望討張覺於平州聞應州有兵萬餘來援遣阿里布與阿勒達迎擊之斬馘數千而還復從其兄約罕率兵三千攻乾州約罕道病卒代領其衆至乾州降其軍及營帳三十獲印四十與布呼攻下義州宗望伐宋與郭藥師戰于白河宗望命阿里布以二穆昆先登奮戰賞賚特異至汴破淮南援兵斬其二將大軍退次孟陽姚平仲夜以重兵來襲阿里布適當其中力戰敗之旣還聞大名開德合兵十餘萬來爭河至河上知去敵尚遠乃以輕兵夜發詰旦至衞縣遇敵斬首數千級餘皆潰去師次邢州滹沱橋已焚阿里布先以偏師營于水上比軍至而橋成宗望嘉其功出真定庫物賞之為長勝軍千戸及再伐宋從宗望破敵於井陘遂下欒城師自大名濟河阿里布屯於洺州之境時康王留相州大名府以兵來攻我營阿里布乘夜以騎二百潛出其後反擊敗之居數日敵復來蘇統制以兵二萬先至阿里布乘其未集以三百騎出戰大敗其衆生擒蘇統制殺之大軍旣克汴京攻洺州敗大名救兵遂下洺州從達蘭攻恩州還洺人復叛阿里布先至城下城中出兵來戰敗之執其守佐遂與富埒琿取信德軍梁王宗弼取開德阿里布以步兵五千赴之大名境内多盜命阿里布留屯其地賊犯莘縣聞阿里布至即潰去追襲一晝夜至館陶及之皆俘以歸從宗弼襲康王旣渡淮阿里布以兵四千留和州總督江淮間戍將以討未附郡縣遂攻下太平州隳其城廬州叛以偏師討之敗其騎六千擒三校明日復破敵二萬於慎縣斬首五百張永合步騎數萬來戰阿里布兵止二千敵圍之阿里布潰圍力戰竟敗之追殺四十里獲馬三百而還再攻廬州與達呼布敗敵萬衆於拓臯至廬州騎兵五百出戰敗之斬其二校師還宗弼趨陜西道聞大名復叛遣阿里布經略之獨與譯者至城下招之大名果降翌日下令民間兵器悉上送官於是吏民按堵如故為大名開德路都統齊國建阿里布屯兵於汴城外天會十五年詔廢齊國已執劉麟阿里布先入汴京備變明年除歸德尹割河南地與宋入為燕京内省使宗弼復河南阿里布先濟河撫定諸郡再為歸德尹河南路都統宋兵來取河南地宗弼召阿里布與許州韓常潁州大臭陳州持嘉暉皆會于汴阿里布以敵在近獨不赴而宋將岳飛劉光世等果乘間襲取許潁陳三州旁郡皆響應其兵攻歸德者阿里布連擊敗之復取亳宿等州河南平阿里布功最皇統五年為行臺參知政事授世襲明安兼哈濟穆昆改元帥右監軍博索路統軍歸德軍節度使累階儀同三司其在汴時嘗取官舍材木構私第於恩州至是事覺法當議勳議親海陵嘗在軍中惡阿里布詔曰若論勳勞更有過於此者況官至一品足以酬之國家立法貴賤一也豈以親貴而有異也遂論死年五十五阿里布以將家子從征伐屢立功厯官有惠愛得民心及死人皆惜之大定三年贈儀同三司詔以其子為右衞將軍襲明安及親管穆昆賜銀五百兩重綵二十端絹三百匹固納伊克子善騎射有才幹從討和諾克薩克達烏春烏木罕埒克之叛皆有功太祖伐遼固納從戰寧江州珠赫店破遼主親軍皆以力戰受賞襲其父穆昆領秦王宗翰千戸攻下中西兩京宗翰伐宋圍太原未下宗翰還西京固納以右翼軍佐尼楚赫守太原是時汾州團柏榆次嵐憲潞皆有兵來援固納凡四戰皆破之大軍圍汴固納引萬户軍屢敗其援兵憲潞等州復叛固納引兵復取之并收撫保德火山而還後領軍鎮夏邊在職十二年天會八年授世襲明安天眷初為天德軍節度使致仕累遷開府儀同三司卒年八十五子喜格襲明安加宣武將軍額爾古訥伊克子姿質魁偉年十四隷宗翰軍中常領兵行前為偵候及大軍襲遼主額爾古訥以甲騎六十追遼招討圖善獲之又以七騎追獲遼公主額布勒以獻有軍來為遼援方臨陣中有躍馬而出者軍帥謂之曰能為我取此乎額爾古訥曰諾果生擒而還問其名曰通古盖北部中勇者也額爾古訥善馳驛日能千里及伐宋屢遣將命以行天會八年從秦王在燕聞伊都反於西北秦王促令額爾古訥馳驛以往黎明走天德及至日猶未曛也皇統元年以功授寧逺大將軍哈喇唐古部節度使五年授千户六年遷西北路招討使九年再遷天德尹西南路招討使天德二年召見四年遷臨洮尹加金紫光禄大夫卒官年五十三芬徹自上京密齊顯河徙屯天德初為元帥府章京奉使皆稱職按事能得其實領明安皇統間除同知開逺軍節度使斥候嚴整邊境無事正隆初為中都路兵馬判官是時京畿多盜芬徹捕得大盜四十餘人百姓稍安改安化軍節度副使大定二年領行軍萬户充邳州刺史知軍事領本州萬戸管所屯九明安軍昌武軍節度使山東副都統薩哈南征元帥府以芬徹行副統事入為太子少詹事再遷開遠軍節度使襲伯父固納明安歴博索路兵馬都總管西北路招討使卒芬徹性廉潔忠直臨事能斷凡被任使無不稱云贊曰賢舒嚕與昭祖為友罕都事景祖世祖為之臣盖金自景祖始大諸部君臣之分始定故傳異姓之臣以罕都為首伊克雖宗室與罕都同功故列敘焉金史卷六十八
