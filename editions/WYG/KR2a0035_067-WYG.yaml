body:
  text: 金史卷六十七元中書右丞相總裁托克托等修列傳第五錫馨和諾克弟薩克逹鳥春温都布拉附拉必弟瑪察通恩埒克阿蘇奚王和勒博錫馨海蘭水烏淩阿部人昭祖以條教約束諸部錫馨陸梁不可制及昭祖沒于巴喇濟村部人以柩歸至海蘭水錫馨與完顔部鄂和出而邀諸路攻而奪之柩揚言曰汝輩以嚕為能而推尊之吾今得之矣昭祖之徒徃告于佛穆丹與瑪竒嶺赫伯村完顔部䝉克巴圖等募軍追及之與戰復得柩衆推景祖為諸部長白山赫圖們扎蘭托卜古倫五國皆從服及遼使赫噌林牙來索逋人錫馨拒阻不聽命景祖攻之不能克景祖自度不可以力取遂以詭計取之乃以錫馨阻絶海東路請於遼遼帝使人讓之曰汝何敢阻絶鷹路審無他意遣其酋長來錫馨使其長子頗克綽歡入朝曰不敢違大國之命遼人厚賜遣還謂之曰汝父信無他宜身自入朝錫馨信之明年入見於春蒐頗克綽歡從遼主謂鍚馨曰罪在汝不在汝子乃命頗克綽歡還而流錫馨於邊地葢景祖以計除鍚馨而欲撫有其子與部人也頗克綽歡蓄怨未發㑹哈勒琿水赫舎哩部拉必瑪察叛頗克綽歡從之及敗於穆稜水瑪察遁去頗克綽歡與必拉就擒及其黨與皆獻之遼主久之世宗復使人言曰頗克綽歡不還則其部人自知罪重恐懼不肯歸服遼主以為然遂遣頗克綽歡及前後所獻罪人皆還之和諾克薩克達兄弟者國相雅達之子也居完顔部伊敦村雅達稱國相不知其所從來景祖嘗以幣與馬求國相於雅達許之景祖得之以命肅宗後薩哈亦居是官焉和諾克兄弟嘗事景祖世祖初季父伯赫有異志陰誘和諾克欲為亂昭肅皇后往伊敦村世祖肅宗皆從行遇和諾克薩克達各被酒紛爭遂舉刃相向后親解之乃止自是謀益甚是時烏春烏木罕亦與伯赫相結詭以鄂博台賣甲為兵端世祖不得已而與之和間數年烏春以其衆渉和倫拉林二水世祖親往拒之和諾克薩克達遂起兵肅宗以偏師拒和諾克薩克達世祖畏其合勢也戒之曰可和則和否則戰至烏嚕斯哈珠水既陣成列肅宗使富德貝勒議和和諾克亦恃烏春之在北也無和意富德報肅宗曰敵欲戰或曰戰地廹近村墟雖勝不能盡敵宜退軍誘之寛地肅宗惑之令軍少却未成列和諾克薩克達乘之肅宗敗焉和諾克乘勝鈔畧是役也烏春以久雨不能前乃罷兵世祖聞肅宗敗自將經舎琿特克兩水取和諾克薩克達之家和諾克薩克達不知也焚其所居殺畧百許人而還未至軍肅宗之軍又敗世祖至責譲肅宗失利之狀使罕都伊克以本部七穆昆助之復請和和諾克薩克達欲得英格之大赤馬希卜蘇之紫騮馬世祖不許遂與博都哩部布呼富察部薩克蘇及混同江左右布克坦水北諸部兵皆㑹厚集為陣鳴鼓作氣馳騁和諾克恃其衆有必勝之心下令曰今天門開矣以爾車自隨凡烏古鼐夫婦寳貨財産恣爾取之有不從者俘畧之而去於是摩多圖水費摩部鄂博貝勒附於世祖和諾克等縱火焚之鄂博死世祖厚撫其家既定和諾克乃以舊地還之和諾克軍復來富察部沙津貝勒呼卜圖貝勒使愛實間道來告且問曰宼將至何以待之世祖曰事至此不及謀矣以衆從之自救可也惟以旗幟自别耳毎有兵至則輒遣愛實穿林潜來令與拜察往還大道即故潜行林中路也和諾克至北隘甸世祖將出兵聞伯赫食於圖們村死矣乃沿按春水行且欲并取海古勒珠爾蘇貝勒之衆而後戰覘者來報曰敵至矣世祖戒希卜蘇整軍速進使待於托果原當是時和諾克兵衆世祖兵少衆寡不敵比世祖至軍士氣衂甚世祖心知之而不敢言但令解甲少憇以水洗面飲麨水頃之士氣稍蘇息是時肅宗求救於遼不在軍中將戰世祖屏人獨與穆宗私語兵敗則就與肅宗乞師以報讐仍令穆宗勿預戰亊介馬以觀勝負先圖去就乃袒袖韔弓服矢以縕袍下幅護前後心三揚旗三撾鼔棄旗提劒當前鋒盡銳摶戰和諾克歩軍以干盾進世祖之衆以長槍擊之歩軍大敗希卜蘇從後奮擊之和諾克騎兵亦敗世祖乘勝逐北摩多圖水水為之赤世祖止軍勿追盡獲所棄車甲馬牛軍實以戰勝告於天地頒所獲於將士各以功為差未幾和諾克薩克逹率屬來降布呼猶保薩喇村招之不出薩克蘇據烏嚕斯哈珠村世祖遣人與之議和薩克蘇謾言為戲答之曰我本欲和壯士巴特瑪不肯和泣而謂我曰若果與和則美衣肥羊不可復得是以不敢從命遂縦兵俘畧隣近村墅有人從道傍射之中口死布呼之屬曰舒嚕舒嚕之母嫁於圖們部達爾歡貝勒而為之妾達爾歡與族兄弟荗賽音貝勒俱事世祖世祖欲間舒嚕於布呼謂達爾歡曰汝之事我不如茂賽音之堅固也葢謂舒嚕母子一彼焉一此焉以此撼舒嚕舒嚕聞之遂殺布呼而降舒嚕通於布呼之妾常懼得罪及聞世祖言惑之使告於達爾歡曰將殺布呼而來汝待我於江伺布呼睡熟剚刃於胸而殺之追者急白日露鼻匿水中逮夜至江方㳺以濟達爾歡使人待之乃得免久之醉酒而與達爾歡狠爭達爾歡殺之烏春阿卜薩水溫都部人以鍛鐵為業因歲歉䇿杖負擔與其族屬來歸景祖與之處以本業自給既而知其果敢善斷命為本部長仍遣族人富德送歸舊部富德烏春之甥也世祖初嗣節度使叔父伯赫陰懐覬覦間誘和諾克薩克達及烏春烏木罕等烏春以伯赫居肘腋為變信之由是頗貳於世祖而虐用其部人部人訴於世祖世祖使人讓之曰吾父信任汝以汝為部長今人告汝有實狀殺無罪人聽訟不平自今不得復爾為也烏春曰吾與汝父等輩舊人汝為長能幾日干汝何事世祖内畏伯赫恐羣朋為變故曲意懐撫而欲以婚姻結其歡心使與約婚烏春不欲笑曰狗彘之子同處豈能生育呼爾哈與女直豈可為親也烏春欲發兵而世祖待之善無以為端𤓰爾佳部鄂博台亦鐵工也以被甲九十來售烏春聞之使人來讓曰甲吾甲也拉林水以南布克坦水以北皆吾土也何故輒取吾甲其亟以歸我世祖曰彼以甲來市吾與直而售之烏春曰汝不肯與我甲而為和解則使汝叔之子色克及色埒來色克葢伯赫之子也世祖度其意非真肯議和者將以有為也不欲遣衆固請曰不遣則必用兵不得已遣之謂色埒曰色克無害彼且執汝矣半途辭疾勿往既行色埒曰我疾作將止不往色克曰吾亦不能獨往矣同行者强之使行既見烏春烏春與色克厚為禮而果執色埒曰得甲則生否則殺汝世祖與其甲色埒乃得歸烏春自此益無所憚後數年烏春舉兵來戰道色辰嶺渉和倫拉林水舎於珠格部阿勒哈村卓巴納具勒家時十月大雨累晝夜不止氷澌覆地烏春不能進乃引去於和諾克薩克達亦舉兵世祖自拒烏春而使肅宗拒和諾克烏春遇雨歸適叔父伯赫亦死故世祖得倂力於和諾克薩克達一戰敗之沃哷部人博諾舊事景祖至是亦有他志徙於納巴克坦村遂以縱火誣罕都欲因此除去之語在罕都傳中世祖獲博諾釋其罪博諾終不自安徙居圖庫村與烏春烏木罕結約烏春舉兵度嶺世祖駐軍溫闢村待之進至蘇素海甸兩皆陣將戰世祖不親戰命肅宗以左軍戰色埒黙希卜蘇助之徵異夣也肅宗束縕縱火大風從後起火熾烈時八月野草尚青火盡燎烟熖漲天烏春軍在下風肅宗自上風擊之烏春大敗復獲博諾獻於遼而城蘇蘇海甸以據之赫舎哩拉必瑪察與世祖戰於野鵲水世祖中四創軍敗拉必使吉遜圖罕等過青嶺見烏春賂諸部與之交結拉必瑪察求助於烏春烏春以古哩甸兵百十七人助之世祖擒拉必獻於遼主并言烏春助兵之狀仍以不修鷹道罪之遼主使人至烏春問狀烏春懼乃為讕言以告曰未嘗與拉必為助也德里石之北古哩甸之民所管不及此拉必既敗世祖盡得烏春古哩甸助兵一百十七人使其卒長拉必烏爾圖往招其衆繼遣薩布貝勒撫定之薩布不能撫富察部古實巴克實等誘三百餘人入城盡陷之世祖治鷹道還色埒黙來告乃使罕都為都統破烏春烏木罕於實都古實巴克實皆就擒世祖自將過沃濟嶺至烏木罕村和倫𤓰爾佳部䨇寛貝勒烏雅部富哲固納請分一軍由所部伐烏春葢所部與烏春近欲以自蔽故也乃使色埒黙雅爾盤以支軍道其所居世祖自將大軍與罕都合至阿卜薩水嶺東諸部皆㑹實圖美亦以所部兵來是時烏春前死烏木罕聞知世祖來伐訴於遼人乞與和解使者已至其家世祖軍至烏木罕請緩師盡以前所納亡人歸之世祖使烏淩阿果多歡貝勒往受所遣亡者烏木罕以三百騎乘懈來攻世祖敗之遼使惡其無信不復為主和乃進軍圍之太祖衣短甲行圍號令諸軍烏木罕使托雲潜出城攻之托雲馳馬援槍已將及太祖和爾和擊斷其槍乃得免色埒黙至色辰水用固納計取先在烏春軍者二十二人烏春軍覺之殺二人餘二十人皆得之益以土軍來助烏木罕自知不敵乃遁去遂克其城盡以資産分賚軍中以功為次諸部皆安輯焉穆宗常嘉固納功後以色埒黙之女守寧妻其子呼爾罕烏春之後為溫都氏裔孫曰布拉溫都布拉始居長白山阿布繖河徙隆州額勒敏河布拉初從希尹征伐攝明安穆昆事遇賊突出力擊敗之手殺二十餘人用是擢修武校尉天德初充護衛遷宿直將軍與衆護衛射遠皆莫能及海陵以玉鞍銜賞之往海蘭路選可充護衛者使還稱㫖遷伊囉斡羣牧使改遼州刺史正隆伐宋召為武翼軍副都總管將兵二千至汝州南遇宋兵二萬餘邀擊敗之手殺將士十餘人是時嵩汝二州百姓多逃去布拉招集使之復其業改莫州刺史徵為太子左衛率府率再遷隴州防禦使歴鎮西呼爾哈顯德軍節度使致仕卒拉必瑪察兄弟者哈勒琿水赫林鄉赫舎哩部人兄弟七人素有名聲人推服之及烏春烏木罕等為難故拉必兄弟乘此際結屯水之民勢寖不可制其同里中有避之者徙於必罕村野居女直中拉必怒將攻之乃約烏庫哩部薩喇貝勒富哲達蘭呼實黙貝勒和羅貝勒温綽歡貝勒和羅溫綽歡間使人告野居女直野居女直有備拉必等敗歸拉必乃由南路復襲野居女直勝之俘略甚衆和羅溫綽歡呼實黙畏拉必求援於世祖色埒黙以輕兵邀拉必等於特黙圖村敗之盡得所俘拉必瑪察驅掠拉林水牧馬世祖至混同江與穆宗分軍世祖自圖古勒津倍道兼行馬多乏皆留之路傍從五六十騎遇拉必於野鵲水日已曛拉必兵衆世祖兵少罕都鏖戰出入數四馬中創死者十數世祖突陣力戰中四創不能軍穆宗自額圖琿津渡江遇敵於巴喇密特水敵問為誰應曰罕都問者射穆宗矢著於弓箙是嵗拉必瑪察使其徒吉遜圖罕及托迪剽取呼拉布濼牧馬四百及富哲尼堪之馬合七百餘匹過青嶺東與烏春烏木罕交結世祖自將伐之拉必等偽降還軍拉必復求助於烏春烏木罕烏木罕以古哩甸兵百有十七人助之拉必據穆稜水保固險阻鍚馨子頗克綽歡往從之世祖率兵圍之克其軍瑪察遯去遂擒拉必及頗克綽歡獻之遼盡獲其兵使其卒長烏新烏爾圖招其衆俾薩布撫定之復使鄂蘭哈瑪爾察穆稜水人情募兵與薩布合語在烏春傳世祖既没肅宗襲節度使瑪察據哲克依水繕完營堡招納亡命杜絶往來者恃屯水民為之助招之不聽乃使康宗伐之是歲白山混同江大溢水與岸齊康宗自阿林岡乘舟至於刷水舎舟沿刷水而進使太祖從東路取瑪察家屬盡獲之康宗圍瑪察急太祖來㑹軍於是瑪察先亡在外其人乘夜突圍遯去太祖曰瑪察之家蕩盡矣走將安歸追之瑪察不知太祖急求已也與三騎來伺軍其一人墜馬下太祖識之問狀其人曰我隨瑪察來伺軍彼走者二人瑪察在焉瑪察與其人分道走太祖命呼嚕古追東走者而自追西走者至哲克依水失瑪察不見急追之得遺甲於路迹而往前至大澤濘淖瑪察棄馬入萑葦大祖亦棄馬追及之與之挑戰烏庫哩壯士和爾和乘馬來問曰此何人也太祖初不識瑪察佯應曰瑪察也和爾和曰今亦追及此人邪遂下馬援槍進戰瑪察連射和爾和和爾和中二矢不能戰有頃軍至圍之罕都射中瑪察首遂擒之無有識之者和爾和乃前扶其首而視之見其齒豁曰真瑪察也瑪察張目曰公等事定矣遂殺之太祖獻馘於遼通恩阿爾本特克新水赫舎哩部人祖曰和囉竒父訥格納世為其部貝勒威凖部人伊喇貝勒海罕貝勒暴其族人完塔哈貝勒及諸弟烏哷赫烏都溫抄畧其家及抄畧阿古爾貝勒家侵及訥格納所部穆宗使訥格納以本部兵往治伊喇等行至蘇伯水輒募人為兵主者拒之輒抄畧其人遂攻烏庫哩部達薩塔入穆嚕密斯罕城及烏色伊克來問狀止蘇伯水西諾木歡村訥格納止蘇伯水東烏滿村訥格納雖款伏而不肯徵償時甲戌歲十月也明年八月訥格納遯去烏色追而殺之執其母及其妻子以歸而使通恩復其所埒克圖們琿春水合流之地烏庫哩部人呼沙呼貝勒之子卓多琿春丞安春之呼沙呼之子也間誘烏遜烏塔兩部民作亂達薩塔通恩皆叛而與埒克卓多合兩黨揚言曰圖克坦部之黨十四部為一烏庫哩部之黨十四部為一富察部之黨七部為一凡三十五部完顔部十二而已以三十五部戰十二部三人戰一人也勝之必矣世祖降附諸部亦皆有離心當是時惟烏雅部色埒貝勒及圖們水溫特赫部阿勒巴貝勒薩克蘇貝勒等皆使人來告難色埒達希布之子也先使其兄巴古拉來既而以其甲來歸阿勒巴等曰吾等必不從亂但乞兵為援耳穆宗使薩哈伐埒克使們圖琿伐達薩塔既而太祖以七十甲詣薩哈軍中道以四十甲與們圖琿實圖美之軍與們圖琿㑹於穆嚕密斯罕城下而通恩將援埒克聞們圖琿之兵寡以為無備而未知實圖美之來㑹也欲先攻們圖琿們圖琿實圖美迎擊大破通恩穆嚕密斯罕城遂降獲通恩達薩塔皆釋弗誅太祖至薩哈軍明日遂攻破埒克城城中渠帥皆誅之取其孥累貲産而還烏塔城亦撤守備而降埒克先在遼烏塔已脫身在外由是皆未獲卓多亦詣普嘉努降太祖釋之於是諸部皆安業如故久之埒克烏塔皆來降阿蘇鍚馨水赫舎哩部人父阿哈貝勒事景祖世祖世祖破烏春還阿哈率官屬士民迎謁於桑阿塔濼獻黄金五斗世祖諭之曰烏春本微賤吾父撫育之使為部長而忘大恩乃結怨於我遂成大亂自取滅亡吾與汝等三十部之人自今可以保安休息吾大數亦將終我死汝等當念我竭力以輔我子弟若亂心一生則滅亡如烏春矣阿哈與衆跪而泣曰太師若有不諱衆人賴誰以生勿為此言未幾世祖没阿哈亦死阿蘇繼之阿蘇自其父時常以事來昭肅皇后甚憐愛之毎至必留月餘乃遣歸阿蘇既為貝勒嘗與圖克坦部卓多貝勒爭長肅宗治之乃長阿蘇穆宗嗣節度聞阿蘇有異志召阿蘇賜以鞍馬深加撫諭隂察其意趣阿蘇歸謀益甚乃斥其事復召之阿蘇不來遂以同部穆都哩貝勒等起兵穆宗自瑪竒嶺出兵攻之薩哈自和倫嶺往畧定珊沁鍚馨兩路攻下通恩城穆宗畧阿齊呼水益募軍至阿蘇城是日辰已間忽暴雨晦曀雷電下阿蘇所居既又冇大光聲如雷墜阿蘇城中識者以謂破亡之徵阿蘇聞穆宗來與其弟達呼布往訴於遼遼人來止勿攻穆宗不得已留和卓貝勒守阿蘇城而歸金初亦有兩和卓其一薩哈父贈韓國公其一守阿蘇城者後贈特進云和卓以兵守阿蘇城者二年矣阿蘇在遼不敢歸穆都哩乃降遼使復為阿蘇來穆宗聞之使烏淩阿舒嚕濟師且戒和卓令易衣服旗幟與阿蘇城中同色使遼使不可辨遼使至乃使富察部呼嚕貝勒密遜貝勒與俱至和卓軍而軍中已易衣服旗幟與阿蘇城中如一遼使果不能辨和卓詭曰吾等自相攻干汝何事誰識汝之太師乃刺殺呼嚕密遜所乗馬遼使驚怖走去遂破其城逹呼布先歸殺之阿蘇聞穆宗以計却遼使破其城殺逹呼布復訴於遼遼使奚節度使伊里來問狀且使備償阿蘇穆宗復使矩威圖塔水人偽阻絶鷹路者而使布古徳部節度使言於遼平鷹路非己不可遼人不察也信之穆宗出畋於屯水謂遼人曰吾平鷹路也遼人以為功使使來賞之穆宗盡以其物與矩威圖塔之人而不復備償阿蘇遼人亦不復問阿蘇在遼無所歸後二年使其徒徳濟至生女直界上海蘭甸人畏穆宗執而送之阿蘇遂終于遼及太祖伐遼底遼之績告于天地而以阿蘇亡命遼人不與為言凡與遼徃復書命必及之天輔六年棟摩羅索畧定天徳雲内寧邊東勝等州獲阿蘇軍士問之曰爾為誰曰我破遼鬼也贊曰金之興也有自來矣世祖擒拉必頗克綽歡既獻之遼以為功又曰若不遣還其部人疑懼且為亂階遼人不察盡以前後所獻罪人歸之景祖止赫嚕林牙止通肯穆宗止遼使阿蘇城始終以鷹路誤之而遼人不悟景祖有黄馬服乗如意景祖没遼貴人爭欲得之世祖弗與曰難未息也馬不可以與人遂割其兩耳謂之禿耳馬遼貴人乃弗取其削平諸部則借遼以為己重既獻而求之則市以為己重戰陣一良馬終弗與遼人而遼人終不悟豈興亡有数蓋天奪其魄歟奚與契丹俱起在元魏時號庫莫奚歴宇文周隋唐皆號兵強其後契丹破走奚奚西保隆科其留者臣服于契丹號東西奚厥後遼太祖稱帝諸部皆内屬矣圖埒者古部族之號奚有其地號稱圖埒州又書作鐵驪州奚有五世族世與遼人為昏姻附姓舒嚕氏中事具遼史今不載奚有十三部二十八落一百一帳三百六十二族甲午歲太祖破耶律色實諸将連戰皆㨗奚鐵驪王和勒博以所部降未幾遯歸于遼及遼主使使請和太祖曰歸我叛人阿蘇降人和勒博迪里等餘事徐議之久之遼主至鴛鴦濼都統杲襲之亡走天徳和勒博與遼大臣立秦晉國王耶律聶哷于燕京聶哷死蕭妃權國事太祖入居庸闗蕭妃自古北口出奔和勒博至盧龍嶺遂留不行㑹諸奚吏民于雅里部僣稱帝改元天復改置官屬籍渤海奚漢丁壮為軍太祖詔和勒博曰聞汝脅誘吏民僣竊位號遼主越在草莽大福不再汝之先世臣服于遼今來臣屬與昔何異汝與伊都有隙故難其來伊都設有睚眦朕豈從之儻能速降盡釋汝罪仍俾主六部族總山前奚衆還其官屬財産若尚執迷遣兵致討必不汝赦和勒博不聼天輔七年五月和勒博南冦燕地敗於景薊間其衆奔潰耶律阿固齊及甥巴錦家奴伯特赫等殺之其妻阿古聞之自剄死先是蘇庫部人據克斯山奚路都統逹蘭招之不服徃討之托紐部衆扼險拒戰殺之殆盡至是蘇庫卓琳托紐三部所據十三巖皆討平之逹嚕噶部節度使伊里已降復叛奚馬和尚討達嚕噶並五院司等諸部諸部皆降遂執伊里杖之一百其父及其家人先被獲者皆還之初太祖破遼兵于逹嚕噶城九百奚營來降至是和勒愽死奚人以次附屬亦各置明安穆昆領之贊曰庫莫奚契丹起于漢末盛于隋唐之間俱彊為隣國合并為君臣歴八百餘年相為終始奚有五大定間類族著姓有約囉氏伯特氏斡里氏穆濟氏吹氏金史卷六十七
