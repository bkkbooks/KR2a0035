body:
  text: 金史卷七十一元中書右丞相總裁托克托等修列傳第九斡魯烏楞古貝勒博勒和烏哲庫棟摩宗叙本名徳夀斡魯韓國公和卓第二子康宗初蘇伯水鴻觀部沃赫貝勒及威凖哲爾徳二部有異志威泰治之烏色斡魯為之佐伐沃赫拔其城以歸髙麗築九城於海蘭甸烏色母疾病斡魯代將其兵者數月斡魯亦對築九城與髙麗抗出則戰入則守烏色用之卒城髙麗收國二年四月詔斡魯統諸軍與棟摩芬徹都古嚕訥合咸州路都統烏楞古等伐髙永昌詔曰永昌誘脅戍卒竊據一方直投其隙而取之爾此非有逺大計其亡可立待也東京渤海人徳我舊矣易為招懐如其不從即議進討無事多殺髙永昌渤海人在遼為裨將以兵三千屯東京八甔口永昌見遼政日敗太祖起兵遼人不能支遂覬覦非常是時東京漢人與渤海人有怨而多殺渤海人永昌乃誘諸渤海并其戍卒入據東京旬月之間逺近響應有兵八千人遂僣稱帝改元隆基遼人討之久不能克永昌使托卜嘉標哈以幣求救於太祖且曰願併力以取遼太祖使華沙布往諭之曰同力取遼固可東京近地汝輒據之以僣大號可乎若能歸欵當處以王爵仍遣係遼籍女直呼圖克來髙永昌使托卜嘉與華沙布呼圖克偕來而永昌表辭不遜且請還所俘渤海人太祖留呼圖克不遣遣大藥師努與托卜嘉往招諭之斡魯方趨東京遼兵六萬來攻昭蘇城額圖琿貝勒阿里罕與戰於伊都之地大破之五月斡魯與遼軍遇於瀋州敗之進攻瀋州取之永昌聞取瀋州大懼使家奴道拉以金印一銀牌五十來願去名號稱藩斡魯使華沙布薩巴往報之㑹渤海髙禎降言永昌非真降者特以緩師爾斡魯進兵永昌遂殺華沙布等率衆來拒遇于卾爾和水我軍既濟永昌之軍不戰而却逐北至東京城下明日永昌盡率其衆來戰復大敗之遂以五千騎奔長松島初太祖下寧江州獲東京渤海人皆釋之往往中道亡去諸將請殺之太祖曰既已克敵下城何為多殺昔先太師常破敵獲百餘人釋之皆亡去既而往往招其部人來降今此輩亡後日當有効用者至是東京人恩勝努仙格等執永昌妻子以城降即寧江州所釋東京渤海人也先太師葢謂世祖云未㡬托卜嘉執永昌及道拉以獻皆殺之於是遼之南路係籍女直及東京州縣盡降以斡魯為南路都統徳特貝勒留烏珍知東京事詔除遼法省賦稅置明安穆昆一如本朝之制九月斡魯朝于巴爾密特水上慰勞之辛亥幸斡魯第張宴官屬皆預賜賚有差矩威水部錫勒哈塔殺綽哈布古徳斡魯分和隆果烏珍之兵討之綽哈宗室子魁偉善戰年十五𨽻軍中多見任用以兵五百敗室韋獲其民衆及招降矩威水部以功為穆昆布古徳初事薩哈從討蕭哈里降矩威水部領行軍千戸從破黄龍府戰達嚕噶城皆有功其破寧江州渤海伊實布叛去布古徳追復之至是與綽哈同被害斡魯至希爾哈河錫勒哈塔遯去追及于哈達拉山誅其首惡四人撫定餘衆詔曰汝討平叛亂不勞師衆朕甚嘉之綽哈等死於國事聞其尸棄於河俟氷釋必求以塟其民可三百戸為一穆昆以衆所推服者領之仍以其子弟等為質斡魯乃還天眷中綽哈贈奉國上將軍布古徳贈昭毅大將軍斡魯從都統襲遼主遼主西走西京已降復叛敵據城西浮圖下射攻城者斡魯與哈布爾攻浮圖奪之復以精鋭乘浮圖下射城中遂破西京夏國王使李仁輔將兵三萬來救遼次于天徳之境羅索與斡魯合軍擊敗之追至野谷殺數千人夏人渡澗水水暴至漂溺者無算遼主在隂山青塚之間斡魯為西南都統往襲之使博爾蘇薩噶爾瑪克以兵二百襲遼權六院司喀勒扎於白水濼獲之遼主留輜重於青塚領兵一萬往應州遣卓哩布達各率兵邀之宗望奄至遼主營盡俘其妻子宗族得其傳國璽斡魯使使奏㨗曰賴陛下威靈屢敗敵兵遼主無歸勢必來降已嚴戒鄰境毋納宋人合饋軍糧令尼楚赫往代州受之詔徧諭有功將士俟朕至彼當次第推賞遼主戚屬勿去其輿帳善撫存之遼主伶俜去國懐悲負恥恐隕其命孽雖自作而嘗居大位深所不􅃘如招之肯來以其宗族付之已遣楊璞徵糧於宋尼楚赫不須往矣遼趙王實訥埓及諸官吏並釋其罪且撫慰之太祖還京師宗翰為西北西南兩路都統斡魯及普嘉努副之宗翰朝京師詔以夏人言宋侵略新割地以便宜決之魯斡奏曰夏人不盡歸戸口資幣又以宋人侵賜地求援兵宋之邊臣將取所賜夏人疆土葢有異圖詔曰夏人屢求援兵者或不欲歸我戸口沮吾追襲遼主事也宋人敢言自取疆土于夏誠有異圖宜謹守備盡索在夏戸口通聞兩國事審處之斡魯復請弗割山西與宋則遼主不能與宋郭藥師交通復詔曰宗翰請毋與宋山西地卿復及此疆場之事當慎毋忽及宗翰等伐宋斡魯行西南西北兩路都統事天㑹五年薨皇統五年追封鄭國王天徳二年配享太祖廟庭子薩巴銀青光禄大夫子色哩烏楞古貝勒宗室子也太祖伐遼使烏楞古阿嚕撫諭斡琿集賽兩路係遼女直與遼節度托卜嘉戰敗之斬托卜嘉古納嶺烏爾圖罕等十四達哈藩皆降斡琿集賽兩路亦降與遼都統錫埓戰于咸州西敗之斬錫埓于陣與羅索克咸州圖們呼圖以所部降于烏楞古鄰部戸七千亦來歸遂與遼將赫伯戰破其軍數萬人太祖嘉之以為咸州軍帥斡魯伐髙永昌于東京烏楞古以咸州軍佐之遼秦晉國王耶律聶哷來伐都古嚕訥羅索博勒和等將二萬衆合烏楞古咸州兵往擊之呼圖克嘗叛入于遼居東京南永昌據東京太祖索之以歸烏楞古伐永昌以便宜署呼圖克為千戸蘇都哩卾勒博皆無功亦以便宜除官及以便宜解權穆昆哈布爾黄格達希布等職皆非其罪太祖聞之盡復哈布爾等穆昆呼圖克等皆罷去太祖聞烏楞古軍中往往闕馬而官馬多匿於私家遂檢括之耶律聶哷佛徳遺烏楞古書請和烏楞古以聶哷書并所答書來上且請曰復有書問宜如何報之詔曰若彼再來請和汝當以阿蘇等叛亡索而不獲至於交兵我行人薩喇亦不遣還若歸薩喇及送阿蘇等則和好之議方敢奏聞仍恐議和非實無失備禦聶哷軍于蒺藜山烏楞古以兵一萬戍東京太祖使都古嚕訥羅索復以兵一萬益之詔曰遼主失道肆命徂征惟爾將士當體朕意拒命者討之服者撫安之毋貪俘掠毋肆殺戮所賜聶哷詔書可傳致也詔聶哷曰汝等誠欲請和當廢黜昏主擇立賢者副朕弔伐之意然後可議和約不然當盡并爾國其審圖之聶哷復書烏楞古云降去人赫伯見還則當送阿蘇等上曰赫伯等乃交兵之後來降阿蘇則平日以罪亡去其事特異復詔聶哷令此月十三日送阿蘇至顯州各遣重臣議疆場事烏楞古等攻顯州知東京事完顔鄂倫以兵來㑹即以兵三千先渡遼水得降户千餘遂薄顯州郭藥師乘夜來襲卾倫擊走之烏楞古等遂與聶哷等戰于蒺藜山大敗遼兵追北至額勒錦陂獲佛徳家屬遂圍顯州攻其城西南軍士實都踰城先入燒其佛寺烟熖撲人守陴者不能立諸軍乘之遂拔顯州於是乾懿豪徽成川惠等州皆降乾州後為閭陽縣遼諸陵多在此禁無所犯徙成川州人于同銀二州居之聶哷再以書來請和烏楞古承前詔以阿蘇為言答之駐軍顯州以聴命賜烏楞古等馬十匹詔曰汝等力摧大敵攻下諸城朕甚嘉之遼主未獲人心易搖不可恃戰勝而失備禦遼雙州節度使張崇降烏楞古以便宜命復其職仍令世襲烏楞古久在咸州多立功亦多自恣和勒博雙寛等告烏楞古不法事遼帝在中京可追襲而不追襲咸州糧草豐足而奏數不以實攻顯州獲生口財畜多自取聶哷博爾蘇等亦告貝勒䝉克瑪竒卾倫齊遜阿爾本伊喇等多取生口財畜遂以闍格代為咸州路都統闍格亦宗室子也既代烏楞古治咸州初都古嚕訥羅索奏攻顯州新降附之民可遷其富者于咸州路貧者徙内地於是詔使闍格擇其才可幹事者授之穆昆其豪右誠心歸附者擬為明安録其姓名以聞饑貧之民官賑給之而使棟摩為其副統云久之遼通褀雙遼四州之民八百餘家詣咸州都統降上曰遼人賦歛無度民不堪命相率求生不可使失望分置諸部擇善地以處之太祖召烏楞古自問之烏楞古引伏闍格鞫卾倫等詔降烏楞古為穆昆而禁錮卾倫等天輔六年討賊于牛心山道病卒天眷中贈特進天徳二年配享太祖廟庭大定十五年諡莊翼博勒和安帝五代孫太祖伐遼使博勒和徵都古嚕訥兵失期杖之後與琿楚以四千人助羅索尼楚赫攻黄龍府薩里罕察必達爾兄弟齊達勒部人嘗寇扎蘭路穆宗遣博勒和討之至阿里瑪河薩里罕偽降略馬畜三百而去復沃楞部掠二十五寨太祖復使博勒和討之博勒和渡索歡河招降旁近諸部因籍丁壯為軍至特通額水察必達爾偽降復叛執而殺之博勒和至徳里城圍之薩里罕遯去博勒和破其城執其妻子薩里罕遂降曰我之馬牛財貨盡矣何以為生博勒和與之馬十匹齊達勒部産良馬太祖使赫舍哩阿實罕掌其畜牧博勒和及子博索俱為穆昆天輔五年摘取諸路明安中萬餘家屯田于泰州博勒和為都統賜耕牛五十博勒和舊居按春水自是徙居泰州并實登扎克丹阿里托歡錫勒塔干等俱徙焉唯族子薩拉噶嘗為世祖養子獨得不徙太祖取燕京博勒和為右翼兵出居庸闗大敗遼兵遂取居庸蕭妃遯去都監髙陸等來送欵乞降實古納追蕭妃至古北口蕭妃已過三日不及而還上令博勒和和索哩率輕騎追之蕭妃己逺去獲其從官統軍察喇宣徽扎拉并其家族及銀牌二印十有一及達喇叛博勒和實古納討平之其羣官率衆降者就使領其所部太宗以空名宣頭及銀牌給之同時有博勒和者羅索平陜西博勒和勝額監戰後為平陽尹西南路招討使終於慶陽尹泰州博勒和守邊屢有功太宗賜衣一襲并賜其子博碩八年以甲胄賜所部諸穆昆天㑹十二年加同中書門下平章事天眷元年駐烏爾古徳哷勒地薨贈開府義同三司諡剛毅子博碩襲明安天眷二年為泰州副都統子威泰廣威將軍博索官特進子烏哲庫烏哲庫善騎射年二十以本班祗候郎君都管從征伐有功授修武校尉皇統二年權領泰州軍平陜西至涇州大破宋兵於馬西鎮超遷寧逺大將軍襲明安復以本部軍從宗弼權都統正隆末從海陵伐宋契丹反與徳昌軍節度使伊蘇瑪勒同討之詔許便宜從事大定初除咸平尹駐軍泰州俄改臨潢尹攝元帥左都監與廣寧尹布薩歡塔俱從元帥右都監實圖美解臨潢之圍契丹引衆東行烏哲庫追及于斡里山押軍明安契丹呼魯蘇以所部助敵攻官軍官軍失利泰州節度使烏哩雅來救未至臨潢與敵遇烏哩雅敗僅以數騎脫歸敵攻泰州其勢大振城中震駭將士不敢出戰敵四面登城押軍明安烏克遜阿里布率軍士數人持鉶刀循城應敵力戰斫刈甚衆敵乃退泰州得完烏哲庫迺使穆昆富埓琿徙百姓旁邑及險阨之地以俟大軍明年聚甲士萬三千於濟州㑹元帥黙音敗斡罕於長濼戰霧􅟶河戰陷泉皆有功改呼爾哈節度使卒烏哲庫性聰敏有才智善用軍常出敵之不意故能以寡敵衆而所往無不克號為鶻軍云棟摩世祖第九子太祖異母弟也髙永昌據東京斡魯征伐之命棟摩等為之佐已克瀋州城中出奔者棟摩邀擊殆盡與永昌隔卾爾和水衆遇淖不敢進棟摩以所部先濟諸軍畢濟軍東京城下城中人出城來戰棟摩破之于首山殲其衆獲馬五百匹及烏楞古以罪去咸州棟摩代之於是棟摩為咸州路副統遼議和久不成太祖進兵詔咸州路都統司令色克留兵一千鎮守棟摩以餘兵㑹于渾河太祖攻上京實臨潢府諭之不下遼人恃儲蓄自固上親臨陣棟摩以衆先登克其外城留守托卜嘉率衆出降都統杲兵至中京棟摩自城西沿土河以進城中兵尚餘三千皆不能守遂克之宗翰等攻西京棟摩羅索等於城東為木洞以捍蔽矢石於北隅以芻茭塞其隍城中出兵萬餘將燒之温特赫博恰率衆力戰執旗者被割博恰自執旗奮擊却之又為四輪革車髙出於堞棟摩與麾下乘車先登諸軍繼之遂克西京與遼步騎五千戰於朔州之境斬首三百級復敗遼騎三百于河隂遼兵五千屯於馬邑縣南復擊破之隳其營壘盡得其車馬器械遼兵三萬列營于西京之西棟摩以三千擊之棟摩使士卒皆去馬陣於溝塹之間曰以一擊十不致死地不可使戰也因謂衆曰若不勝敵不可以求生於是人皆殊死戰遼兵遂敗追至其營而止明日復敗其兵七百餘人興中府宜州復叛棟摩討之并下詔招諭詔棟摩曰遼之土地皆為我有彼雖復叛終皆吾民可縱其耕稼毋得侵掠貝勒䝉克薩布烏達等獲契丹紏堅興中平棟摩為南路都統討和勒博詔曰和勒布以烏合之衆保據險阻其勢必將自斃若彼不出掠毋庸攻討耶律阿固齊等殺和勒博于景薊之間其衆遂潰張覺據平州叛入于宋棟摩自錦州往討之覺將以兵脅遷來潤隰四州之民棟摩至潤州擊走張覺軍逐北至榆闗遣俘持書招之復敗覺兵於營州東北欲乘勝進取南京時方暑雨退屯海壖逐水草休息使布呼䝉克兩明安屯潤州制未降州縣不得與覺交通九月棟摩破覺將王孝古於新安敗覺軍於樓峯口復與覺戰於耳山棟摩大敗太宗使宗望問棟摩敗軍之狀宗望遂以棟摩軍討覺及宗望破張覺太宗乃赦棟摩召宗望赴闕棟摩連破偽都統張敦固遂克南京執敦固殺之上遣使迎勞之詔曰聞下南京撫定兵民甚善諸軍之賞卿差等以給之又詔曰南京疆場如舊屯兵以鎮之命有司運米五萬石于廣寧給南京潤州戍卒遂下宜州拔义牙山殺其節度使韓慶民得糧五千石詔以南路嵗饑許田獵其後宋童貫郭藥師治兵棟摩輒因降人知之即具奏語在宋事中而宗翰宗望皆請伐宋於是棟摩副宗望伐宋宗望以棟摩屬尊先皇帝任使有功請以為都統以監戰事於是棟摩為都統素赫副之敗郭藥師兵於白河遂降燕山以先鋒渡河圍汴宋人請盟將士分屯于安肅雄霸廣信之境宗望還山西棟摩與劉彦宗留燕京節制諸軍八月復伐宋大軍克汴州諸軍屯於城上城中諸軍潰而西出者十三萬人棟摩達蘭分擊大敗之師還棟摩為元帥左都監攻河間下之大破敵兵萬餘於莫州宗輔為右副元帥徇地淄青棟蘭與宗弼分兵破山谷諸屯宋李成兵圍淄州烏凌阿托雲破之棟摩克濰州達呼布珠爾蘇連破趙子昉等兵至于河上烏凌阿托雲破敵于靈城鎮及議伐康王棟摩欲先定河北然後進討太宗乃酌取羣議之中使羅索取陜西宗翰宗輔南伐天㑹六年薨年四十熙宗時追封吳國王天徳二年配享太祖廟庭正隆改封譚王大定二年徙封魯王諡莊襄子宗叙宗叙本名徳夀棟摩第四子也竒偉有大志喜談兵天徳二年充䕶衛授武義將軍明年授世襲穆昆擢御院通進遷翰林待制兼修起居注轉國子司業兼左補闕正隆初轉符寶郎在宫職凡五年皆帶劍押領宿衛遷大宗正丞以母憂去官以本官起復未㡬遷侍衛親軍馬軍都指揮使改左驍騎都指揮使明年海陵幸南京宗叙至汴契丹薩巴反宗叙為咸平尹兼本路兵馬都總管以甲仗四千付之許以便宜宗叙出松亭闗取牛遞于廣寧聞世宗即位將歸之廣寧尹安塔哈弟雅爾堅勸宗叙乃還興中白彦敬赫舍哩志寧使宗叙奉表降乃見世宗於梁魚務授寧昌軍節度使明年二月契丹攻寧昌宗叙止有女直渤海騎兵三十漢兵百二十人自將擊之遇賊千餘騎漢兵皆散走宗叙與女直渤海三十騎盡銳力戰身被二創所乘馬中箭而仆遂為所執居百餘日㑹賊中有臨潢民伊喇阿達等盗馬授之得脱歸宗叙陷賊久盡得其虚實見元帥完顔黙音平章政事完顔元宜謂之曰賊衆烏合無紀律破之易爾於是帥府欲授軍職宗叙見黙音貪鹵掠失事㡬欲歸白上不肯受職曰我有機密須面奏是夕乃遁去至廣寧矯取驛馬馳至京師而帥府先事以聞上遣中使詰之曰汝為節度不度衆寡戰敗被獲幸得脱歸乃拒帥府命輒自乘傳赴都朕姑置汝罪可速還軍併力破賊宗叙附奏曰臣非辭難者事須面奏不得不來遂召入乃條奏賊中虛實及諸軍進退不合事機狀詔大臣議皆以其言為然是時已詔布薩忠義代黙音為元帥進討於是拜宗叙為兵部尚書以本職領左翼都統率宗寧烏雅扎拉烏凌阿喇實兵各千人號三萬佐忠義軍至花道遇賊與戰右翼都統宗亨先敗走忠義亦引却宗叙勒本部遮擊之麾帳下士三百捨馬步戰賊不得逞大軍整列復至合勢擊之賊遂敗去而元帥右監軍赫舍哩志寧率軍至追及斡罕於陷泉大破之復與志寧及圖克坦克寧追至七渡河大敗之元帥忠義遂留宗叙自從賊平入為右宣徽使宋兵據海州將謀深入詔以宗叙為元帥右監軍往禦之宗叙駐山東分兵據守要害敵不得西尋奉詔與左副元帥赫舍哩志寧參議軍事四年宗叙入朝奏曰暑月在近頓兵邊陲飛輓頗艱乞俟秋涼進發上從其請及還軍授以成算賜襲衣弓矢九月渡淮宗叙出唐鄧北至襄陽屢戰皆㨗明年宋人請和軍還除河南路統軍使河決李固渡分流曹單之間詔遣都水監梁肅視河決宗叙言河道填淤不受水故有決溢之患今欲河復故道卒難成功幸而可塞它日不免決溢山東非曹單比也沿河數州驟興大役人心動搖恐宋人乘間煽誘搆為邊患梁肅亦請聴兩河分流以殺水勢遂止不塞十年召至京師拜參知政事上曰卿奏黄河利害甚合朕意朕念百姓差調官吏為姦率歛星火所費倍蓰委積經年腐朽不可復用若此等類百孔千瘡百姓何以堪之卿參朝政擇利而行以副朕心及與上論南邊事宗叙曰南人遣諜來多得我事情我遣諜人多不得其實葢彼以厚賞故也上曰彼以厚利資諜人徒費其財何能為也十一年奉詔巡邊六月至軍中將戰有疾詔以右丞相赫舍哩志寧代宗叙還七月病甚遺表朝政得失及邊防利害力疾使其子上之薨年四十六上見其遺表傷悼不己輟朝遣宣徽使敬嗣暉致祭賻銀千兩綵四十端絹四百匹上謂宰臣曰宗叙勤勞國家他人不能及也初宗叙嘗請募貧民戍邊屯田給以廩粟既貧者無艱食之患而富家免更代之勞得專農業上善其言而未行也十七年上謂宰臣曰戍邊之卒嵗冐寒暑往來畨休以馬牛往戍往往皆死且奪其農時敗其生業朕甚閔之朕欲使百姓安于田里而邊圉彊固卿等何術可以致此左丞相良弼曰邊地不堪耕種不能久戍所以畨代耳上曰卿等以此急務為末事耶往嵗參政宗叙嘗為朕言此事若宗叙可謂盡心於國者矣今以兩路招討司烏庫哩實壘部族臨潢泰州等路分置堡戍詳定以聞朕將親覽上追念宗叙聞其子孫家用不給詔賜錢三千貫明昌五年配享世宗廟廷金史卷七十一
