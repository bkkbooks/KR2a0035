body:
  text: 金史卷三十五元中書右丞相總裁托克托等修志第十六禮八宣聖廟祠諸神雜武成王廟祈禜諸前代帝王拜天本國拜儀宣聖廟皇統元午二月戊子熙宗詣文宣王廟奠祭北面再拜顧儒臣曰為善不可不勉孔子雖無位以其道可尊使萬世髙仰如此大定十四年國子監言歲春秋仲月上丁日釋奠於文宣王用本監官房錢六十貫止造茶食等物以大小楪排設用留守司樂以樂工為禮生率倉場等官陪位於古禮未合也伏覩國家承平日久典章文物當粲然備具以光萬世况京師為首善之地四方之所觀仰據釋奠器物行禮次序合行下詳定兼兖國公親承聖教者也鄒國公功扶聖教者也當於宣聖像左右列之今孟子以燕服在後堂宣聖像側還虚一位禮宜遷孟子像於宣聖右與顔子相對改塑冠冕粧飾法服一遵舊制禮官參酌唐開元禮定擬釋奠儀數文宣王兗國公鄒國公每位籩豆各十犧尊一象尊一簠簋各二俎二祝版各一皆設案七十二賢二十一先儒每位各籩一豆一爵一兩廡各設象尊二總用籩豆各二百二十三簠簋各六俎六犧罇三象罇七爵九十四其尊皆有坫罍二洗二篚勺各二羃六正位并從祀藉罇罍俎豆席約用三十幅罇席用葦俎豆席用莞牲用羊豕各三酒二十瓶禮行三獻以祭酒司業博士充分獻官二讀祝官一太官令一捧祝官二罍洗官一爵洗官一巾篚官二禮直官十一學生以儒服陪位樂用登歌大樂令一員本署官充樂工三十九人迎神三奏姑洗宮來寧之曲辭曰上都隆化廟堂作新神之來格威儀具陳穆穆凝旒巍然聖眞斯文伊始羣方所視初獻盥洗姑洗宮靜寧之曲辭曰偉矣素王風猷至粹垂二千年斯文不墜涓辰維良爰修祀事沃盥于庭嚴禋禮備升階南呂宮肅寧之曲辭曰巍乎聖師道全德隆修明五常垂教無窮增崇儒宮遹追遺風嚴祀申䖍登降有容奠幣姑洗宮和寧之曲辭曰天生聖人賢於堯舜仰之彌髙磨而不磷新廟告成宮墻數仞遣使陳祠斯文復振降階姑洗宮安寧之曲辭曰禀靈尼丘垂芳闕里生民以來孰如夫子新祠巋然四方所視酹觴告成祇循典禮兖國公酌獻姑洗宮輯寧之曲辭曰聖師之門顔惟居上其殆庶幾是宜配饗桓圭衮衣有嚴儀象載之神祠增光吾黨鄒國公酌獻姑洗宮泰寧之曲辭曰有周之衰王網既墜是生眞儒宏才命世言而為經醇乎仁義力扶聖功同垂萬祀亞終獻姑洗宮咸寧之曲辭曰於昭聖能與天立極有承其流皇仁帝德豈伊立言訓經王國煥我文明典祀千億送神姑洗宮來寧之曲辭曰吉蠲為饎孔惠孔時正辭嘉言神之格思是饗是宜神保聿歸惟時肇祀太平極致承安二年春丁章宗親祀以親王攝亞終獻皇族陪祀文武羣臣助奠上親為贊文舊封公者升為國公侯者為國侯郕國以下皆封侯宣宗遷汴建廟㑹朝門内歲祀如儀宣聖顔孟各羊一豕一餘同小祀共用羊八無豕其諸州釋奠並遵唐儀武成王廟泰和六年詔建昭烈武成王廟于闕庭之右麗澤門内其制一遵唐舊禮三獻官以四品官以下儀同中祀用二月上戊七年完顔匡等言我朝創業功臣禮宜配祀於是以秦王宗翰同子房配武成王而降管仲以下又躋楚王宗雄宗望宗弼等侍武成王坐韓信而下降立於廡又黜王猛慕容恪等二十餘人而增金臣遼王賽音等其祭武成王宗翰子房各羊一豕一餘共用羊八無豕宣宗遷汴於㑹朝門内闕庭之右營廟如制春秋上戊之祭仍舊諸前代帝王三年一祭於仲春之月祭伏犧於陳州神農於亳州軒轅於坊州少昊於兖州顓頊於開州高辛於歸徳府陶唐於平陽府虞舜夏禹成湯於河中府周文王武王於京兆府泰和三年尚書省奏太常寺言開元禮祭帝嚳堯舜禹湯文武漢祖祝版請御署開寶禮犧軒顓頊帝嚳陶唐女媧成湯文武請御署自漢髙祖以下二十七帝不署平章政事鎰左丞匡太常博士温特赫天興言方嶽之神各有所主有國所頼請御署固宜至於前古帝王寥落杳茫列于中祀亦已厚矣不須御署參知政事即康及鉉以為三皇五帝禹湯文武皆垂世立教之君唐宋致祭皆御署而今降祝版不署恐於禮未盡不若止從外路祭社稷及釋奠文宣王例不降祝版而令學士院定撰祝文頒各處為常制勅命依期降祝版而不請署長白山大定十二年有司言長白山在興王之地禮合尊崇議封爵建廟宇十二月禮部太常學士院奏奉勅㫖封興國靈應王即其山北地建廟宇十五年三月奏定封冊儀物冠九旒服九章玉圭玉冊函香幣冊祝遣使副各一員詣㑹寧府行禮官散齋二日致齋一日所司於廟中陳設如儀廟門外設玉冊衮冕幄次牙杖旗鼓從物等視一品儀禮用三獻祭如嶽鎭其冊文云皇帝若曰自兩儀剖判山嶽神秀各鍾于其分野國將興者天實作之對越神休必以祀事故肇基王迹有若岐陽望秩山川於稽虞典厥惟長白載我金德仰止其高實惟我舊邦之鎭混同流光源所從出秩秩幽幽有相之道列聖蕃衍熾昌迄于太祖神武徵應無敵于天下爰作神主肆予沖人紹休聖緒四海之内名山大川靡不咸秩矧王業所因瞻彼旱麓可儉其禮服章爵號非位於公侯之上不足以稱焉今遣某官某持節備物冊命兹山之神為興國應靈王仍勅有司歲時奉祀於戲廟食之享亘萬億年維金之禎與山無極豈不偉歟自是每歲降香命有司春秋二仲擇日致祭明昌四年十月備衮冕玉冊儀物上御大安殿用黄麾立仗八百人行仗五百人復冊為開天𢎞聖帝大房山大定二十一年勅封山陵地大房山神為保陵公冕八旒服七章圭冊香幣使副持節行禮並如冊長白山之儀其冊文云皇帝若曰古之建邦設都必有名山大川以為形勝我國既定鼎於燕西顧郊圻巍然大房秀㧞混厚雲雨之所出萬民之所瞻祖宗陵寢於是焉依仰惟嶽鎭古有秩序皆載祀典矧兹大房禮可闕歟其爵號服章俾列于侯伯之上庶足以稱今遣某官某備物冊命神為保陵公申勅有司歲時奉祀其封域之内禁無得樵採弋獵著為令是後遣使山陵行禮畢山陵官以一獻禮致奠混同江大定二十五年有司言昔太祖征遼策馬徑渡江神助順靈應昭著宜修祠宇加賜封爵廼封神為興國應聖公致祭如長白山儀冊禮如保陵公故事其冊文云昔我太祖武元皇帝受天明命掃遼季荒茀成師以出至于大江浩浩洪流不舟而濟雖穆滿渡江而黿梁光武濟河而水冰自今觀之無足言矣執徐之歲四月孟夏朕時邁舊邦臨江永歎仰藝祖之開基嘉江神之効靈至止上都議所以尊崇之典蓋古者五嶽視三公四瀆視諸侯至有唐以來遂享帝王之尊稱非直後世彌文而崇徳報功理亦有當然者矧兹江源出於長白經營帝鄉實相興運非錫以上公之號則無以昭答神休今遣某官某持節備物冊命神為興國應聖公申命有司歲時奉祀於戯嚴廟貌正封爵禮亦至矣惟神其衍靈長之徳用輔我國家彌億年神亦享廟食於無窮豈不休哉嘉蔭侯大定二十五年勅封上京護國林神為護國嘉蔭侯毳冕七旒服五章圭同信圭遣使詣廟以三獻禮祭告其祝文曰蔚彼長林實壯天邑廣袤百里惟神主之廟貌有嚴侯封是享歆時蠲潔相厥滋榮是後遇月七日上京幕官一員行香著為令盧溝河神大定十九年有司言盧溝河水勢泛決嚙民田乞官為封冊神號禮官以祀典所不載難之已而特封安平侯建廟二十七年奉㫖每歲委本縣長官春秋致祭如令昭應順濟聖后大定十七年都水監言陽武上埽黄河神聖后廟宜依唐仲春祭五龍祠故事二十七年春正月尚書省言鄭州河陰縣聖后廟前代河水為患屢禱有應嘗加封號廟額今因禱祈河遂安流乞加褒贈上從其請特加號曰昭應順濟聖后廟曰靈徳善利之廟每歲委本縣長官春秋致祭如令鎭安公舊名旺國崖太祖伐遼嘗駐蹕於此大定八年五月更名靜寧山後建廟明昌六年八月以冕服玉冊冊山神為鎭安公冊文曰皇帝若曰古之名山咸在祀典軒皇之世神靈所奉者七千虞氏之時望秩每及於五載蓋惟有益於國是以必報其功逮乎後王申以徽冊至于嶽鎭之外亦或封爵之加故太白有神應之稱而終南有廣惠之號禮由義起事與時偕載籍所傳于今猶監朕修和有夏咸秩無文眷兹靜寧秀峙朔野緼澤布氣幽贊乎坤元導風出雲協符乎乾造一方之表萬物所瞻南直都畿北維障徼連延廣厚寳藏攸興盤固高明謻宮斯奠昔有遼嘗恃以富國迄大定更為之錫名洪惟世宗功昭列聖亦越顯考德利生民爰即歲時駕言臨幸兵革不試遠人輯寧雨暘常調品彚蕃廡此上帝無疆之貺亦英靈有相之符比即輿情載修故事顧先皇帝駐蹕之地揖累世承平之風迓續遺休式甄神佑肆象德以畀號仍班台而闡儀宇像一新采章具舉今遣使某副某持節備物冊命神為鎭安公仍勅歲時奉祀於戯容典焜燿精明感通惟永億年翊我昌運神其受職豈不偉歟瑞聖公即瑪達格山也章宗生於此世宗愛此山勢衍氣清故命章宗名之後更名瑚圖哩巴山建廟明昌四年八月以冕服玉冊封山神為瑞聖公建廟命撫州有司春秋二仲擇日致祭為常冊文曰皇帝若曰國家之興命厯攸屬天地元化惟時合符山川百神無不受職粹精薦瑞明聖繼生著丕應於殊禎啓昌期於幽贊裒對信猶之典咸修望秩之文嘉乃名山奠兹勝地下綿乾分上直樞輝盤析木之津達中原之氣廓除氛祲函毓泰和仰惟光烈昭垂徽音如在即高明而清暑克靜夀以安仁周廬安寧厚澤浹治朕祗循祖武順講時巡感美號以興懐佩聖謨而介福言念誕彌之初度抑由翊衞之効靈然猶祀秩無章神居不屋非所以盡報功崇德之義副追始樂原之心爰飾名稱載新祠宇勒忱辭於貞琰涓良日於元龜彰服采以辨威潔庪縣而致祭闡揚茂實敷繹多儀今遣使某副某持節備物冊命神為瑞聖公仍勅有司歲時奉祀於戲尚其聰明歆此誠意孚休惟永亦莫不寧貞獻郡王廟明昌五年正月陳言者謂頁嚕古紳二賢創置女直文字乞各封贈名爵建立祠廟令女直漢人諸生隨拜孔子之後拜之有司謂頁嚕難以致祭若金源郡貞獻王古紳則既以配享太廟矣亦難特立廟也有㫖令再議之禮官言前代無創製文字入孔子廟故事如於廟後或左右置祠令諸儒就拜亦無害也尚書省謂若如此恐不副國家厚功臣之意遂詔令依蒼頡立廟于􅉦厔例官為立廟于上京納爾琿莊委本路官一員與本千户春秋致祭所用諸物從宜給之祈禜大定四年五月不雨命禮部尚書王競祈雨北嶽以定州長貳官充亞終獻又卜日於都門北郊望祀嶽鎭海瀆有司行事禮用酒脯醢後七日不雨祈太社太稷又七日祈宗廟不雨仍從嶽鎭海瀆如初祈其設神座實樽罍如常儀其樽罍用瓢齊擇甘瓠去抵以為樽祝版惟五岳宗廟社稷御署餘則否後十日不雨乃徙市禁屠殺斷繖扇造土龍以祈雨足則報祀送龍水中十七年夏六月京畿久雨遵祈雨儀命諸寺觀啓道塲祈禱拜天金因遼舊俗以重五中元重九日行拜天之禮重五於鞠塲中元於内殿重九於都城外其制刳木為盤如舟狀赤為質畫雲鶴文為架高五六尺置盤其上薦食物其中聚宗族拜之若至尊則於常武殿築臺為拜天所重五日質明陳設畢百官班俟於毬塲樂亭南皇帝靴袍乘輦宣徽使前導自毬塲南門入至拜天臺降輦至褥位皇太子以下百官皆詣褥位宣徽贊拜皇帝再拜上香又再拜排食抛盞畢又再拜飲福酒跪飲畢又再拜百官陪拜引皇太子以下先出皆如前導引皇帝囘輦至幄次更衣行射柳擊毬之戲亦遼俗也金因尚之凡重五日拜天禮畢挿柳毬塲為兩行當射者以尊卑序各以帕識其枝去地約數寸削其皮而白之先以一人馳馬前導後馳馬以無羽橫鏃箭射之既斷柳又以手接而馳去者為上斷而不能接去者次之或斷其青處及中而不能斷與不能中者為負每射必伐鼓以助其氣已而擊毬各乘所常習馬持鞠杖杖長數尺其端如偃月分其衆為兩隊共爭擊一毬先於毬塲南立雙桓置板下開一孔為門而加網為囊能奪得鞠擊入網囊者為勝或曰兩端對立二門互相排擊各以出門為勝毬狀小如拳以輕韌木枵其中而朱之皆所以習蹺㨗也既畢賜宴歲以為常本國拜儀金之拜制先袖手微俯身稍復却跪左膝左右揺肘若舞蹈狀凡跪揺袖下拂膝上則至左右肩者凡四如此者四跪復以手按右膝單跪左膝而成禮國言揺手而拜謂之禪珠喇承安五年五月上諭有司曰女直漢人拜數可以相從者酌中議之禮官奏曰周官九拜一曰稽首拜中至重臣拜君之禮也乞自今凡公服則用漢拜若便服則各用本俗之拜主事陳松曰本朝拜禮其來久矣乃便服之拜也可令公服則朝拜便服則從本朝拜平章政事張萬公謂拜禮各便所習不須改也司空完顔襄曰今諸人衽髪皆從本朝之制宜從本朝拜禮松言是也上乃命公裳則朝拜諸色人便服則皆用本朝拜金史卷三十五
