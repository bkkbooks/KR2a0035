body:
  text: 金史卷一百一元中書右丞相總裁托克托等修列傳第三十九承暉本名福興穆延盡忠本名摶多布薩端本名齊錦耿端義李英富珠哩徳裕本名富拉塔烏庫哩慶夀承暉字維明本名福興好學淹貫經史襲父益都尹鄭家塔呼喇鄂摩穆昆大定十五年選充符寶祗候遷筆硯直長轉近侍局直長調中都右警廵使章宗為皇太孫選充侍正章宗即位遷近侍局使孝懿皇后妹夫烏頁爾世宗時以罪斥去乙夜詔開宫城門召之承暉不奉詔明日奏曰烏頁爾得罪先帝不可召章宗曰善未幾遷兵部侍郎兼右補闕初置九路提刑司承暉東京咸平等路提刑副使改同知上京留守事御史臺奏承暉前為提刑副使改同知臨海軍節度使厯利涉遼海軍遷北京路提刑使厯知咸平臨潢府為北京留守副留守李東陽素貴承暉自非公事不與交一言改知大名府召為刑部尚書兼知審官院惠民司都監裕爾罕都遷織染署直長承暉駮奏曰罕都以䕃得官别無才能前為大陽渡譏察纔八月擢惠民司都監已為太優依格兩除之後當再入監差今乃超授隨朝八品職任况罕都乃平章鎰之甥不能不涉物議上從承暉議召圖克坦鎰責之改知大興府事宦者李新喜有寵用事借大興府妓樂承暉拒不與新喜慙章宗聞而嘉之豪民與人爭種稻水利不直厚賂元妃兄左宣徽使李仁惠仁惠使人屬承暉右之承暉即杖黎民而遣之謂其人曰可以此報宣徽也復改知大名府事雨潦害稼承暉決引潦水納之濠隍及伐宋遷山東路統軍使山東盜賊起承暉言捕盜不即獲比奏報或遷官去官請權行的決尚書省議明安依舊收贖穆昆奏報其餘鈐轄都軍廵尉先決奏聞俟事定復舊從之及罷兵盜賊渠魁稍就招降猶往往潛匿泰山巖穴間按察司請發數萬人刋除林木則盜賊無所隱矣承暉奏曰泰山五岳之宗故曰岱宗王者受命封禪告代國家雖不行此事而山亦不可赭也齊人易動驅之入山必有凍餓失所之患此誨盜非止盜也天下之山亦多矣豈可盡赭哉議遂寢是時行限錢法承暉上疏畧曰貨聚於上怨結於下不報改知興中府事衛紹王即位召為御史大拜參知政事駙馬都尉圖克坦黙哷與其父南平干政事大為姦利承暉面質其非進尚書左丞行省于宣徳參知政事承裕敗績于㑹河堡承暉亦坐除名至寜元年起為横海軍節度使貞祐初召拜尚書右丞承暉即日入朝妻子留滄州滄州破妻子皆死赫舍哩執中伏誅進拜平章政事兼都元帥封鄒國公中都被圍承暉出議和事宣宗遷汴梁拜右丞相兼都元帥徙封定國公與皇太子留守中都承暉以尚書左丞穆延盡忠乆在軍旅知兵事遂以赤心委盡忠悉以兵事付之已乃總持大綱期於保完都城頃之莊獻太子去之右副元帥富察齊錦以其軍出降中都危急詔以穆延盡忠為平章政事兼左副元帥三年二月詔元帥左監軍永錫將中山真定兵元帥左都監烏庫哩慶夀將大名軍萬八千人西南路步騎萬一千河北兵一萬御史中丞李英運糧叅知政事大名行省富珠哩徳調遣繼發救中都承暉間遣人以礬寫奏曰齊錦既降城中無有固志臣雖以死守之豈能持乆伏念一失中都遼東河朔皆非我有諸軍倍道来援猶冀有濟詔曰中都重地廟社在焉朕豈一日忘也已趣諸路兵與糧俱往卿㑹知之及詔中都官吏軍民曰朕欲紓民力遂幸陪都天未悔禍時尚多虞道路乆梗音問難通汝等朝暮矢石暴露風霜思惟報國靡有貳心俟兵事之稍息當不愆於旌賞今已㑹合諸路兵馬救援故兹奨諭想宜知悉永錫慶夀等軍至霸州北三月乙亥李英被酒軍無紀律大元兵攻之英軍大敗是時高琪居中用事忌承暉成功諸將顧望既而以刑部侍郎阿克占桑阿為左監軍行元帥府于清州同知真定府事鈕祜祿和爾察為右都監行元帥府于保州户部侍郎侯摯行尚書六部往来應給終無一兵至中都者慶夀軍聞之亦潰承暉與穆延盡忠㑹議于尚書省承暉約盡忠同死社稷盡忠謀南奔承暉怒即起還第無如盡忠何召盡忠腹心元帥府經厯官完顔實庫至謂曰始我謂平章知兵故推心以權畀平章嘗許與我俱死今或異議行期且在何日汝必知之實庫曰今日向暮且行曰汝行李辦未曰辦矣承暉變色曰社稷若何實庫不能對叱下斬之承暉起辭謁家廟召左右司郎中趙思文與之飲酒謂之曰事勢至此惟有一死以報國家作遺表付尚書省令史師安石其表皆論國家大計辨君子小人治亂之本厯指當時邪正者數人曰平章政事高琪賦性隂險報復私憾竊弄威柄包藏禍心終害國家因引咎以不能終保都城為謝復謂妻子死于滄州為書以從兄子永懷為後從容若平日盡出財物召家人隨年勞多寡而分之皆與從良書舉家號泣承暉神色泰然方與安石舉白引滿謂之曰承暉於五經皆經師授謹守而力行之不為虚文既被酒取筆與安石訣最後倒寫二字投筆嘆曰遽爾謬誤得非神志亂邪謂安石曰子行矣安石出門聞哭聲復還問之則已仰藥薨矣家人匆匆瘞庭中是日暮盡忠出奔中都不守貞祐三年五月二日也師安石奉遺表奔赴行在奏之宣宗設奠於相國寺哭之盡哀贈開府儀同三司太尉尚書令廣平郡王諡忠肅詔以永懷為器物局直長永懷子蘇色為奉御承暉生而貴富居家類寒素常置司馬光蘇軾像於書室曰吾師司馬而友蘇公平章政事完顔守貞素敬之與為忘年交穆延盡忠本名博多京路明安人中大定二十八年進士第調高陽朝城主簿北京臨潢提刑司知事御史臺舉亷能遷順義軍節度副使以憂去官起復翰林修撰同知徳昌軍節度事簽北京按察司滑州刺史改恩州上言凡買賣軍器乞令告給憑驗以防盗賊私市尚書省議止聽係籍人匠貨賣有知情售不應存留者同私造法從之遷山東按察副使坐虚奏田稼豐收請糴常平粟詐稱宣差和糴降虢州刺史改乾州泰和六年伐宋為元帥右監軍完顔充經厯官坐奏報稽滯杖五十八年入為吏部郎中累遷中都西京按察使是時赫舎哩執中為西京留守與盡忠爭私意不恊盡忠隂伺執中過失申奏執中雖跋扈善撫御其部曲密於居庸北口置腹心刺取按察司文字及執中自紫荆關走還中都詔盡忠為副元帥兼西京留守以保全西京功進官三階賜金百兩銀千兩重綵段絹二百疋未幾拜尚書右丞行省西京貞祐初進拜左丞詔曰卿總領行省鎮撫陪京守禦有功人民攸賴朕新嗣祚念爾重臣益勉乃力以副朕懷二年五月自西京入朝加崇進封申國公賜玊帶金鼎重幣二年進拜都元帥左丞如故宣宗遷汴與右丞相承暉守中都承暉為都元帥盡忠復為左副元帥十月進拜平章政事監修國史左副元帥如故宣宗詔盡忠善撫乣軍盡忠不察殺乣軍數人已而中都受圍承暉以盡忠乆在軍旅付以兵事嘗約同死社稷及烏庫哩慶夀等兵潰外援不至中都危急密與腹心元帥府經厯官完顔實庫謀棄中都南奔已戒行李期以五月二日向暮出城是日承暉盡忠㑹議于尚書省承暉無奈盡忠何徑歸家召實庫問之知將以其夜出奔乃先殺實庫然後仰藥而死是日凡在中都妃嬪聞盡忠出奔皆束裝至通𤣥門盡忠謂之曰我當先出與諸妃啟途諸妃以為信然盡忠乃與愛妾及所親者先出城不復顧矣中都遂不守盡忠行至中山謂所親曰若興諸妃偕来我輩豈能至此盡忠至南京宣宗釋不問棄中都事仍以為平章政事盡忠言記注之官奏事不當回避可令左右司官兼之宣宗以為然盡忠奏應奉翰林文字完顔蘇哷可為近侍局宣宗曰近侍局例注本局人及宫中出身雜以他流恐或不和盡忠曰若給使左右可止注本局人既令預政固宜慎選宣宗曰何謂預政盡忠曰中外之事得議論訪察即為預政矣宣宗曰自世宗章宗朝許察事外非自朕始也如請謁營私擬除不當臺諫不職非近侍體察何由知之盡忠乃謝罪參政徳升繼之曰固當慎選其人宣宗曰朕於庶官曷嘗不慎有外似可用而實無才力者視之若忠孝而包藏悖逆者富察齊錦以刺史立功驟升顯貴輒懷異志布希萬努委以遼東乃復肆亂知人之難如此朕敢輕乎衆以富察烏錦為公幹乃除副使以色埒黙為淳直乃用為提點若烏庫哩沙琿乃汝等共舉之朕豈不盡心哉徳升曰比来訪察開決河隄水損田禾等覆之皆不實上曰朕自今不敢問若輩外間事皆不知朕幹何事但終日黙坐聽汝等所為矣方朕有過汝等不諌今乃面訐此豈為臣之義哉徳升亦謝罪赫舎哩執中之誅近侍局嘗先事啟之遂以為功隂秉朝政高琪託此輩以自固及盡忠徳升面責愈無所忌未㡬徳升罷相盡忠下獄自是以後中外蔽隔以至于亡盡忠與高琪素不相能疑宣宗頗疎已高琪間之其兄烏哩雅為許州監酒秩滿求調南京盡忠與烏哩雅語及中都事日邇来上頗疎我此高琪所為也若再主兵必不置此呼沙呼之子孰為為之烏哩雅曰然九月尚書省奏遙授武寜軍節度副使圖克坦烏登告盡忠謀逆上憮然曰朕何負摶多彼棄中都凡祖宗御容及道陵諸妃皆不顧獨與其妾偕来此固有罪乃命有司鞫治問得與兄烏哩雅相語事遂并烏哩頁誅之布薩端本名齊錦中都路和爾和必喇明安人事親孝選充護衛除太子僕正滕王府長史宿直將軍邳州刺史尚廐局副使右衛將軍章宗即位轉左衛章宗朝隆慶宫護衛哈噶邀駕陳言端叔父呼都克預弑海陵端不宜在侍衛詔杖哈噶六十代撰章奏人杖五十丁憂起復東北路招討副使改左副㸃檢轉都㸃檢厯河南陜西統軍使復召為都㸃檢承安四年上如薊州秋山獵端射鹿誤入圍杖之解職泰和三年起為御史大夫明年進拜尚書左丞六年詔大臣議伐宋皆曰無足慮者左丞相崇浩叅知政事賈鉉亦曰狗盗䑕竊非舉兵也端曰小宼當晝伏夜出豈敢白日列陳犯靈壁入海口攻夀春邪此宋人欲多方誤我不早為之所一旦大舉入宼將墮其計中上深然之未幾丁母憂起復尚書左丞平章政事布薩揆伐宋發兵南京詔端行省主留務布薩揆已渡淮次廬州宋使皇甫拱奉書乞和端奏其書朝議諸道兵既進疑宋以計緩師詔端遣拱還宋七年布薩揆以暑雨班師端還朝初婦人阿里布嫁為武衛軍士妻生二女而寡常託夢中言以惑衆頗有驗或以為神乃自言夢中屢見白頭老父指其二女曰皆有福人也若侍掖庭必得皇嗣是時章宗在位乆皇子未立端請納之章宗從之既而京師乆不雨阿里布復言夢見白頭老父使已祈雨三日必大澍足過三日雨不降章宗疑其誕妄下有司鞫問阿里布引伏詔讓端曰昔者所奏今其若何後人謂朕信其妖妄實由卿啟其端倪鬰于予懷念之難置其循省于往咎思善補于將来恪整乃心式副朕意端上表待罪詔釋不問頃之進拜平章政事封申國公八年宋人請盟端遷一官章宋遺詔内人有娠者兩位生子立為儲嗣衛紹王即位命端與尚書左丞孫即康護侍章宗内人有娠者泰和八年十一月二十日章宗崩二十二日大醫副使儀師顔狀診得范氏胎氣有損明年四月有人告元妃李氏教承御賈氏詐稱有身元妃承御皆誅死端進拜右丞相授世襲穆昆貞祐二年五月判南京留守與河南統軍使長夀按察轉運使王質表請南遷凡三奏宣宗意乃決百官士庶皆言其不可太學生趙昉等四百人上書極論利害宣宗慰遣之乃下詔遷都明年中都失守宣宗至南京以端知開封府事頃之為御史大夫無何拜尚書左丞相三年兼摳密副使未幾進兼樞密使數月以左丞相兼都元帥行省陜西給親軍三十人騎兵三百為衞次子宿直將軍納丹珠侍行賜契紙勘同曰緩急有事以此召卿端招遙領通安軍節度使完顔果勒即日来歸奏遷知平涼府事諸將聞之皆感激遣納喇巴克繖招諭臨洮果爾五族都營管成格勒積州將羅雅爾唐及道精族都管河淩結蘭州巴鄂特族都營汪三郎等相繼内附汪三郎賜姓完顔後為西方名將四年以疾請致仕不許遣近侍與太醫診視端雖癃老凡朝廷使至必遠迓宴勞不解故䜛構不果行宣宗聞之許自今專使酒三行别于儀門他事經過者一見而止初同華舊屯陜西軍及河南步騎九千餘人皆𨽻陜州宣撫副使永錫端奏潼關之西皆陜西地請此軍𨽻行省緩急可使朝廷從之及大元兵入潼關永錫坐誅而罪不及端興定四年朝廷以知臨洮府事承裔為元帥左都監行元帥府於鳳翔端奏隴外十州介宋夏之間與諸番雜處先於鞏州置元帥府以鎮之今承裔以隴外萬兵移居鳯翔臣恐一旦有警援應不及乞令承裔行元帥府於鞏州若以鳯翔宻邇宋界則本路屯兵已多但令總管攝行帥事與京兆鞏相為首尾足以備緩急矣從之是歲薨訃聞宣宗震悼輟朝贈延安郡王諡忠正正大三年配享宣宗廟庭子納丹珠為定國軍節度使天興初納丹珠之子莽噶嘉們與兄實勒們及護衞延扎桑阿飲莽噶嘉們詐以事出投北兵省以刑部郎中趙楠推其家屬及同飲人時上下迎合必欲以知情處之至於莽噶嘉們妻皆被訊掠其母完顔氏曰莽噶嘉們通其父妾父殺此妾莽噶嘉們不自安遂叛求脫命而已委曲推問無知情之狀省中微聞之召小吏郭從革喻以風㫖從革言之楠方食擲匕筯於案大言曰寜使趙楠除名亦不能屈斷無辜人遂以不知情奏且以妾事上聞上曰丞相功臣納丹珠父子俱受國恩吾已保其不知情也立命赦出之楠字才羙進士高平人耿端義字忠嗣博州博平人大定二十八年進士調滑州軍事判官厯上洛陽令安化順義軍節度判官補尚書省令史除汾陽軍節度副使改都轉運司戸籍判官轉太常博士遷太常丞兼秘書郎再除左司員外郎厯太常少卿兼吏郭員外郎同修國史户部郎中河北東路按察副使同知東平府事充山東安撫使宣宗判汾陽軍是時端義為副使宣宗即位召見訪問時事遷翰林侍講學士兼戸部侍郎未幾拜參知政事貞祐二年中都被圍將帥皆不肯戰端義奏曰今日之患衞王啟之士卒縱不可使城中軍官自都統至穆昆不啻萬餘遣此輩一出或可以得志議竟不行中都解圍端義請遷南京既而布薩端二表皆言遷都事宣宗意遂決是歲薨宣宗輟朝賻贈甚厚遣使祭葬李英字子賢其先遼陽人徙益都中明昌五年進士第調淳化主簿登州軍事判官封邱令丁父憂服除調通遠令番部取民物不與直攝之不時至即掩捕之論如法補尚書省令史大安三年集三品以上官議兵事英上疏曰軍旅必練習者珠格髙琪烏克遜鄂屯納喇奎騰穆延盡忠先朝嘗任使可與商略餘者紛紛恐誤大計又曰比来増築城郭修完樓櫓事勢可知山東河北不大其聲援則京師為孤城矣不報除吏部主事貞祐初攝左司都事遷監察御史右副元帥珠格高琪辟為經厯官乃上書高琪曰中都之有居庸猶秦之崤函蜀之劔門也邇者撤居庸兵我勢遂去今土豪守之朝廷當遣官節制失此不圖忠義之士將轉為他矣又曰可鎮撫宣徳徳興餘民使之從戎所在自有宿藏足以取給是國家不費斗糧尺帛坐收所失之關隘也居庸咫尺都之北門而不能衞䕶英實恥之髙琪奏其書即除尚書工部員外郎充宣差都提控居庸等關隘悉𨽻焉二年正月乘夜與壯士李雄郭仲光郭興祖等四百九十人出城緣西山進至佛巖寺令李雄等下山招募軍民旬日得萬餘人擇衆所推服者領之詭稱土豪時時出戰被創召還遷翰林待制因獻十䇿其大槩謂居中土以鎮四方委親賢以收中都立藩屏以固關隘集人力以防不虞養馬力以助軍威愛禾稼以結民心明賞罰以勸百官選守令以復郡縣并州縣以省民力頗施行之宣宗南遷與左議諫大夫巴古拉俱為御前經厯官詔曰扈從軍馬朕自總之事有利害可因近侍局以聞宣宗次真定以英為國子祭酒充宣差提控隴右邊事無何召為御史中丞英言兵興以来百務皆弛其要在于激濁揚清奬進人材耳近年改定四善二十七最之法徒為虚文大定間數遣使者分道考察亷能當時號為得人願改前日徒設之文遵大定已試之効庶㡬人人自勵為國家用矣宣宗嘉納之自兵興以来亟用官爵為賞程陳僧敗官軍于龕谷道偽統制董九招西關堡都統王果勒果勒立殺之詔除通逺軍節度使加榮祿大夫賜姓完顔氏英言名器不可以假人上恩以難得為貴比来醲於用賞實駭聞聽帑藏不足惟恃爵命今又輕之何以使人伏見蘭州西關堡守將王果勒向以微勞既䝉甄錄頃者堅守關城誘殺賊使論其忠節誠有可嘉若官之五品命以一州亦無負矣急於勸奬遂擢節鉞階加二品賜以國姓若取蘭州又將何以待之陜西名將項背相望曹吉遜包長夀東永昌圖克坦徹爾郭祿大皆其著者果勒藐然賤卒一朝處衆人之右為統領官恐衆望不厭難得其死力宣宗以英奏示宰臣宰臣奏果勒奮發如此賞以異恩殆不為過上然其言中都乆圍丞相承暉遣人以礬寫奏告急詔元帥右監軍永錫左都監烏庫哩慶夀將兵英收河間清滄義軍自清州督糧運救中都英至大名得兵數萬馭衆素無紀律貞祐三年三月十六日英被酒與大元兵遇于霸州北大敗盡失所運糧英死士卒殱焉慶夀永錫軍聞之皆潰歸五月中都不守宣宗猶加恩贈通奉大夫諡剛貞官護葬事錄用其子云富珠哩徳裕本名富拉塔隆安路明安人補樞密院尚書省令史右三部檢法監察御史遷少府監丞明昌末修北邉濠塹立堡寨以勞進官三階授大理正丁母憂起復廣寜治中厯順州濵州刺史坐前在順州市物虧直遇赦改刺瀋州累官北京路按察使太子詹事元帥左都監遷左監軍兼臨潢府路兵馬都總管坐士馬物故多及都統諳達私率官兵救護家屬徳裕蔽之御史劾奏逮獄遇赦謫寜海州刺史稍遷泗州防禦使武勝軍節度使貞祐二年改知臨洮府事兼陜西路副統軍召為御史中丞拜參知政事兼簽樞密院事行省大名詔發河北兵救中都凡真定中山保涿等兵元帥左監軍永錫將之大名河間清滄觀霸河南等兵徳裕將之并護清滄糧運徳裕不時發及李英至霸州兵敗糧盡亡失坐弛慢兵期責授沂州防禦使尋知益都府事興定元年二月卒烏庫哩慶夀河北西路明安人由扎布書畫充奉御除近侍局直長再轉本局使禦邉有勞進一階賜金帶泰和四年遷本局提㸃是時議開通州漕河詔慶夀按視漕河成賜銀一百五十兩重幣十端泰和六年伐宋從右副元帥完顔匡出唐鄧為先鋒都統賜御弓二以騎兵八千攻下棗陽頃之完顔匡軍次白虎粒遣都統完顔諳達取隨州遣慶夀以兵五千扼赤岸斷襄漢路行與宋兵遇斬首五百級宋隨州將雷太尉遯去遂克隨州於是宋鄧城樊城戍兵皆潰遂與大軍渡漢江圍襄陽元帥匡表薦慶夀謀略出衆上嘉之進一官遷拱衞直都指揮使提㸃如故初慶夀上書云汝州襄城縣去汝州遠於許州兩舎請割𨽻許州便尚書省議汝州南有鴉路舊屯四千其三千在襄城今割襄𨽻許州道里近便仍食用解鹽其屯軍三千依舊汝州總押從之八年罷兵遷兩階賜銀二百五十兩重幣十端有疾賜御藥衞紹王即位改左副㸃檢近侍局如故未幾坐與黃門李新喜題品諸王免死除名乆之起為保安州刺史厯同知延安府西北西南招討副使棣州防禦使興平軍節度使貞祐二年遷元帥右都監以保全平州功進官五階賜金吐鶻重幣十端頃之宣宗遷汴改右副㸃檢兼侍衞親軍副都指揮使閱月知大興府事未行改左副檢㸃兼親軍副都指揮數月知彰徳府事三年中都危急改元帥左都監將大名兵萬八千西南路步騎萬一千河北兵一萬救中都次霸州北兵潰頃之中都不守改大名府權宣撫使未幾知河中府權河東南路宣撫副使四年遷元帥右監軍兼陜西統軍使駐兵延安敗夏人于安塞堡戰于鄜州之倉曲谷有功與定元年與簽樞密院事完顔薩布經略伐宋敗宋兵于泥河灣石濠村斬首三千級獲馬四百匹牛三百頭器械稱是復破宋兵七千於樊城縣既而以軍士多被傷奏不以實詔有司鞫問已而釋之厯鎮南集慶軍節度使卒贊曰承暉守中都朞年相為存亡臨終就義古人所難也大抵宣宗既遷汴中都必不能守中都不守則土崩之勢決矣布薩端耿端義似忠而實愚穆延盡忠委中都庸何議焉高琪忌承暉成功富珠哩徳裕緩師期姦人之黨於是何誅李英被酒敗軍雖死不能贖也烏庫哩慶夀無罰貞祐之刑政從可知矣金史卷一百一
