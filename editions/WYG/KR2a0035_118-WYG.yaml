body:
  text: 金史卷一百十八元中書右丞相總裁托克托等修列傳第五十六苗道潤王福伊喇重嘉努武仙張甫靖安民郭文振胡天作張開燕寧苗道潤貞祐初為河北義軍隊長宣宗遷汴河北土人往往團結為兵或為羣盜道潤有勇略敢戰鬭能得衆心比戰有功略定城邑遣人詣南京求官封宰相難其事宣宗召河南轉運使王擴問曰卿有智慮為朕決道潤事今即以其衆使為將肯終為我盡力乎擴對曰兼制天下者以天下為度道潤得衆有功因而封之使自為守羈縻使之䇿之上也今不許彼負其衆何所不可為宣宗顧謂宰執曰王擴之言實契朕心於是除道潤宣武將軍同知順天軍節度使事貞祐四年復以功遷懷遠大將軍同知中山府事再閲月復戰有功遷驃騎上將軍中都路經略使兼知中山府事頃之加中都留守兼經略使道潤前後撫定五十餘城興定元年詔道潤恢復中都以山東兵益之道潤奏去年十一月臣遣總領張子明招降蠡州通吉齊錦近日河北東路兵馬都總管伊喇特爾格移軍蠡州襲破其軍殺數百人子明亦被創臣將提兵問罪重以特爾格自拔來歸但備之而已今欲復取都城乞無罪特爾格直令受臣節制庶可集事宣宗以問宰相奏曰道潤特爾格不協不可相統屬詔完顔寓行元帥府事督道潤復中都和輯特爾格軍初道潤與順天軍節度使李琛不相能兩軍土兵因相攻琛遣兵攻滿城完州道潤軍拒戰殺琛兄榮弟明等琛奏潞州提控烏林阿烏登承道潤指日謀侵害山東行省數諭道潤與臣通和竟不見從且殺臣兄榮弟明等恣横如此將為後患又奏乞令河北州府官不相統攝並聼帥府節制仍遣官増減諸路兵力使權均勢敵無相併吞則百姓安農畝矣道潤奏李琛以衆叛陷滿城攻完州琛亦奏道潤叛廷議以為兩人失和故至于此令山東行省樞密院諭琛行省在彼自當俱聼節制何待帥府土兵本以義團結且耕且戰今乃聚之城寨遂相併吞百姓不安皆由官長無所忌憚使之然也嚴為約束依時樹藝無致生事詔道潤與伊喇特爾格合兵撫定河北令諸道兵互相應援既而道潤與賈仝賈瑀互相攻擊詔道潤賈仝王福武仙賈瑀分畫各路元帥府控制之彰徳衞輝招撫司隸樞密院賈瑀既與道潤相攻已而詐為約和道潤信之遂伏兵刺殺道潤朝廷不能問一軍彷徨無所依提控靖安民乞權隸潞州行元帥府聼其節制時興定二年也右丞侯摰乞以保蠡完三州隸真定而蠡州舊受伊喇重嘉努節制一旦改隸真定恐因而交爭靖安民等願隸潞州乃令河北行省審處之經略副使張柔奏賈瑀攻易州寨殺刺史馬信及其裨校奪所佩金符而去頃之張柔攻賈瑀殺之道潤既死靖安民代領其衆是後乃封建矣初貞祐四年右司諫珠嘉濟敦乞封建河朔詔尚書省議事寢不行定興三年太原不守河北州縣不能自立詔百官議所以為長乆之利者翰林學士承㫖圖克坦鎬等十有六人謂制兵有三一曰戰二曰和三曰守今欲戰則兵力不足欲和則彼不肯從唯有守耳河朔州郡既殘毁不可一槩守之宜取願就遷徙者屯于河南陜西其不願者許自推其長保聚險阻刑部侍郎鄂屯哈斯罕三人曰河北於河南有輔車之勢蒲解於陜西有襟喉之要盡徙其民是撤其藩籬也宜令諸郡選才幹衆所推服能糾衆遷徙者願之河南或晉安河中及諸險隘量給之食授以曠土盡力耕稼置僑治之官以撫循之擇其壯者教之戰陣勑晉安河中守臣檄石嵐汾霍之兵以謀恢復莫大之便兵部尚書烏凌阿與等二十一人曰河朔諸州親民掌兵之職擇土人嘗居官有材略者授之急則走險無事則耕種宣徽使伊喇光祖等三人曰度太原之勢雖暫失之頃亦可復當募土人威望服衆者假以方面重權能克復一道即以本道總管授之能捍州郡即以長佐授之必能各保一方使百姓復業提㸃尚食局舒穆嚕穆請以高爵募民略同光祖議宰臣欲置公府宣宗意未決御史中丞完顔伯嘉曰宋人以虚名致李全遂有山東實地苟能統衆守土雖三公亦何惜焉宣宗曰他日事定公府無乃多乎伯嘉曰若事定以三公就節鎮何不可者宣宗意乃決四年二月封滄州經略使王福為滄州公河間路招撫使伊喇重嘉努為河間公真定經略使武仙為恒山公中都東路經略使張甫為高陽公中都西路經略使靖安民為易水公遼州從宜郭文振為晉陽公平陽招撫使胡天作為平陽公昭義軍節度使完顔開為上黨公山東安撫副使燕寧為東莒公九公皆兼宣撫使階銀青榮祿大夫賜號宣力忠臣總帥本路兵馬署置官吏徵歛賦税賞罰號令得以便宜行之仍賜詔曰乃者邉防不守河朔失寧卿等自總戎昭備殫忠力若能自効朕復何憂宜膺茅土之封復賜忠臣之號除已畫定所管州縣外如能収復鄰近州縣者亦聼管屬王福本河北義軍積戰功累遷同知横海軍節度使事滄州經略副使興定元年福遣提控張聚王進復濵棣二州以聚攝棣州防禦使進攝濵州刺史乆之福與聚有隙聚以棣州附於益都張林興定三年九月福上言滄州東濵滄海西連真定北備大兵可謂要地乞選重臣為經略使得便宜從事以鎮撫軍民朝廷以福初率義兵復滄州招集殘民今有衆萬餘器甲完具自雄一方與益都張林棣州張聚皆為鄰境今利津已不守遼東道路艱阻且其意本欲自為使但託詞耳因而授之使招集濵棣之人通遼東音問今若不許宋人或以大軍迫脅或以官爵招之將貽後悔宣宗以為然乃以福為本州經略使仍令自擇副使㑹福有戰功遷遙授同知東平府事權元帥右都監經略節度如故興定四年封為滄海公以清滄觀州鹽山無棣樂陵東光寧津吳橋將陵阜城蓨縣隸焉四月紅襖賊李二太尉宼樂陵棣州張聚來攻福皆擊却之李二復宼鹽山經略副使張文與戰李二大敗擒其統制二人斬首二千級獲馬三十匹七月宋人與紅襖賊入河北福嬰城固守益都張林隸州張聚日來攻掠滄州危蹙福將南奔為衆所止遂納欵於張林東平元帥府請討福乞益河南步卒七千騎兵五百滑濬衞州資助芻糧先定賞格以待有功朝廷以防秋在近河南兵不可往東平兵少不能獨成功待至來年春使東平帥府與高陽公併力討之乃止伊喇重嘉努積戰功累官河間路招撫使遙授開州刺史權元帥右都監賜姓完顔氏興定四年與張甫俱封重嘉努封河間公以獻蠡安深州河間肅寧安平武强饒陽六家莊郎山寨隸焉興定末所部州縣皆不可守元光元年移屯信安本張甫境内張甫因奏信安本臣北境地當衝要乞權改為府以重之詔改信安為鎮安府是歲與甫合兵復取河間府及安蠡獻三州與張甫皆遷金紫光祿大夫二年重嘉努及張甫同保鎮安各當一面别遣總領提領孫汝楫楊夀提控袁徳李成分保外垣遂全鎮安未幾重嘉努奏鎮安距迎樂堌海口二百餘里實遼東往來之衝高陽公甫有海船在鎮安西北可募人直抵遼東以通中外之意若賞不重不足以使人今擬􅀿募者特遷忠顯校尉授八品職仍賞寳泉五千貫如官職已至忠顯八品以上者遷兩官升職一等回日再遷兩官升職二等詔從之武仙威州人或曰嘗為道士時人以此呼之貞祐二年仙率郷兵保威州西山附者日衆詔仙權威州刺史興定元年破石海于真定宣差招撫使惟宏請加官賞真授威州刺史兼真定府治中權知真定府事遷洺州防禦使兼同知真定府事遙授河平軍節度使興定四年遷知真定府事兼經略使遙領中京留守權元帥右都監無何封恒山公以中山真定府沃冀威鎮寧平定州抱犢寨欒城南宫縣隸焉同時九府財富兵强恒山最盛是歲歸順于大元副史天倪治真定仙兄貴為安國軍節度使史天祥擊之貴亦歸順于大元仙與史天倪俱治真定且六年積不相能懼天倪圖已嘗欲南走宣宗聞之詔樞密院牒詔之仙得牒大喜正大二年仙賊殺史天倪復以真定來降大元大將薩納台討仙仙走閲月乘夜復入真定薩納台復擊之仙乃奔汴京五年召見哀宗使樞密判官白華導其禮儀復封為恒山公置府衞州七年仙圍上黨已而大兵至仙遯歸未幾衞州被圍内外不通詔平章政事哈達樞密副使布哈救之徙仙兵屯胡嶺關扼金州路八年十一月大元兵涉襄漢哈達布哈駐鄧州仙由荆子口㑹鄧州軍天興元年正月丁酉哈達布哈敗績於三峰山仙從四十餘騎走密縣趨御寨都尉烏凌阿呼圖不納幾為追騎所得乃舍騎步登嵩山絶頂清涼寺謂登封蘭若寨招撫使和卓僧秀曰我豈敢入汴京一旦有急縳我獻大國矣遂走南陽留山収潰軍得十萬人屯留山及威遠寨立官府聚糧食修器仗兵勢稍振三月汴京被圍哀宗以仙為參知政事樞密副使河南行省詔與鄧州行省色埒合兵入救八月至密縣東遇大元大將蘇布特兵過之仙即按軍睂山店報色埒曰阻澗結營待仙至俱進不然敗矣色埓急欲至汴不聼行至京水大兵乘之不戰而潰仙亦令其軍散走期會留山仙至留山潰軍至者益衆哀宗罷色埒為中京留守詔仙曰色埒不知兵向使從卿阻澗之策豈有敗哉軍務一以付卿日夕以待戮力一心以圖後舉十一月遣刑部主事烏庫哩呼嚕召仙仙不欲行乃上疏陳利害請緩三月生死入援初色埒至鄧州承制授宣差總領洪果薩哈五朶山一帶行元帥府事兼行六部尚書及仙還留山惡薩哈權盛改為征行元帥屯比陽薩哈怨仙奪其權乃歸順于大元大將蘇布特署薩哈守裕州薩哈乃詐以書約仙取裕州可以得志仙信之薩哈乃報大元大將遣兵夾撃敗仙于柳河仙跳走聖朶寨初沈丘尉曹政承制召兵西山裕州防禦使李天祥不用命政斬之以徇仙至聖朶謂政曰何故擅誅吾將政曰天祥違詔逗遛不行政用便宜斬之仙怒曰今日宣差來起軍明日宣差來起軍因此軍卒戰亡殆盡矣自今選甚人來亦不聼且敎兒郎輩山中休息又曰天祥果有罪待我來處置汝何人輒敢殺之政曰參政柳河失利不知存亡天祥違詔何為不殺仙大怒叱左右奪政所佩銀牌令總領楊全械繫之㑹赦猶囚之及仙敗始得釋與楊全俱降宋是時哀宗走歸徳遣翰林修選魏璠間道召仙行至裕州會仙敗于柳河璠矯詔招集潰軍以待仙仙疑璠圖已二年正月仙閲兵選鋒尚十萬璠曰主上旦夕西首望公公不宜乆留於北仙怒幾殺璠璠及呼喇勒還歸徳仙乃奏請誅璠哀宗不聼以璠為歸徳元帥府經歴官璠字邦彥渾源人貞祐二年進士云仙部將董祐有戰功詔賜虎符仙畏其偪已乆不與佩祐憾之乃結官努欲殺仙猶豫未敢𤼵近侍局使完顔四和有謀敢斷嘗徵兵鄧州禦牧使伊喇愛罕有異志四和以計誅之祐使謂四和曰仙終不肯入援祐等位卑力不能誅惟君為國家圖之四和曰已殺愛罕復殺武仙他日使者來人誰肯信不從仙知祐嘗有此謀使祐使河北其後竟殺之三月仙以聖朶軍食不足徙軍鄧州仰給于鄧州總帥伊喇瑗鄧州倉廩亦乏乃分軍新野順陽浙川就食民家遣講議官朱槩劉琢往襄陽借糧于宋制置使史嵩之琢槩持兩端畏留廼以情告史嵩之曰仙兵勢不復振矣且曰名為借糧實欲納欵待將軍一諾耳嵩之以為實然遣田俊持書報仙四月仙遣大理少卿張伯直取糧于襄陽屯軍小江口以待之嵩之聞張伯直至大喜謂仙送欵矣發書乃謝狀也大怒留伯直不遣仙自順陽入鄧州伊喇瑗畏逼以女女仙仙不疑納之乃遷順陽鄧州糧盡瑗終疑仙五月瑗舉城降宋嵩之益知仙軍虚實使孟珙率兵五千襲仙軍于順陽是時仙令亡卒刈麥供軍未至二里許始覺仙率帳下百餘人迎擊之孟珙不敢前俄頃軍士稍集有五六百人大敗珙兵珙與數百人脱走生擒其統制統領數十人獲馬千餘至是槩琢妄説將納欵于嵩之之語泄矣仙皆誅之伊喇瑗本名聶赫字廷玉世襲契丹明安累功鄧州便宜總帥既至襄陽使更姓名稱歸正人劉介具將校禮謁制置使瑗大悔恨明年三月疽發背死孟珙雖敗而去仙懼宋兵復來七月徙淅川之石穴是時哀宗在蔡州遣近侍烏頁責仙赴難詔曰朕平日未嘗負卿國家危難至此忍擁兵自恃坐待滅亡邪將士聞之相視哽咽皆願赴難與國同生死仙懼衆心有變乃殺馬牛與將士三千人㰱血盟誓不負國家衆乃大喜無何仙復謂衆曰蔡州道梗吾兵食少恐不能到且蔡不可堅守縱到亦無益近遣人覘視宋金州百姓據山為柵極險固廣袤百里積糧約三百萬石今與汝曹共圖之可不勞而下留老弱守此寨以為根本然後選勁勇趨蔡迎上西幸未晩也衆未及應即令戒行李取淅川泝流而上山路險阻霖雨旬日水湍悍老幼弱死者不可勝數糧食絶軍士亡者八九仙計無所出八月乃由荆子口東還自内郷將入聖朶寨至峽石左右八疊秋林聞總領楊全已降宋留秋林十日乃遷太和九月至黑谷泊進退失據遂謀北走行部尚書盧芝侍郎石玠不從芝字廷瑞河東人任子補官以西安軍節度使行尚書玠字子堅河中人崇慶二年進士以汝州防禦使行侍郎二人相與謀曰吾等知仙不䘏國家乆矣諫之不從去之未可事至今日正欠蔡州一死耳假若不得到蔡州死於道中猶勝死於仙也既去仙始覺追玠殺之芝走至南陽為土賊所害甲午蔡州破糧且盡將士大怨皆散去仙無所歸乃從十八人北渡河又亡五人五月趨澤州為澤之戍兵所殺張甫賜姓完顔氏初歸順大元涿州刺史李竒嚕招之興定元年正月甫與張進俱來降東平行省蒙古綱承制除甫中都路經略使進經略副使二年苗道潤死河北行省侯摯承制以李竒嚕權道潤中都路經略使甫與張柔為副頃之苗道潤之衆請以靖安民代道潤是時張柔安民實分掌道潤部衆朝廷乃以竒嚕為中都東路經略使自雄覇以東皆隸之甫進與永定軍節度使賈仝不協以兵相攻奪據仝地取仝馬以遺經略使李竒嚕竒嚕受之朝廷怪竒嚕不能和輯州府乃有向背召竒嚕别與官職詔東平蒙古綱講睦甫與賈仝綱遣同知安武軍王郁博野令高常住往平之輒留竒嚕不遣因奏曰張甫本受竒嚕招降情意厚善今遣郁先與竒嚕議所以平之者然後可況甫等不識禮義之人竒嚕就徵則皆自疑恐生他變故不避專擅之罪詔從綱奏未幾賈仝復以兵捕甫部民殺甫參議官邢㻫甫率兵攻之賈仝敗走遂自縊死甫請符印以安輯部衆詔與之無何李竒嚕歸順大元甫為中都東路經略使遙授同知彰徳府事權元帥右都監三年張進為中都南路經略使甫奏真定兵衝乞遣重臣與恒山公武仙併力守之不報及真定不守甫復奏權元帥右都監柴茂保冀州水寨孤立無援若不益兵非臣之所知也四年甫封高陽公以雄莫覇州高陽信安文安大成保定静海寳坻武清安次縣隸焉元光元年伊喇重嘉努不能守河間甫居之信安是歲以功進金紫光祿大夫始賜姓完顔二年二月張進亦遷元帥左監軍賜姓完顔靖安民徳興府永興縣人貞祐初充義軍歴穆昆千戸總領萬户都統皆隸苗道潤麾下以功遙授定安縣令遷涿州刺史遙授順天軍節度使充提控興定元年遙授安武軍節度使興定二年遷知徳興府事中都路總領招撫使是歲苗道潤死安民代領其衆行省承制以涿州刺史李竒嚕權中都路經略使三年詔竒嚕自雄覇以東為中都東路經略使自易州以西安民為中都西路經略使西山義軍屯壘諸招撫皆隸焉四年遙授知徳興府事權元帥左監軍行中都西路元帥府事三月安民上書曰苗道潤撫定州縣五十餘城其功甚大西京路經略使劉鐸嫉其功反間賈瑀李琛與道潤不協轉相攻伐竟以隂謀殺道潤鐸令所部劉智元等掠鎮撫孫資孫招撫楊徳勝家人二十餘口錮之山寨若鐸常居此恐致敗事劉鐸亦遣副使劉璋詣南京自訴且言安民侵人飛狐之境冒濫封拜誘感人心强抑總領馮通等輸銀粟索飛孤總領王彥暉彈壓劉智元杜貴欲充偏裨彥暉等拒之輒殺貴而杖智元竟驅彥暉而去又言經略職卑以致從宜李栢山等日謀見害乞許罷去廷議劉鐸本行招誘逋亡今乃與安民互相論列以起爭端苗道潤死安民實代領其衆彥暉等軍本隸道潤當聼安民節制乃召鐸還頃之封易水公以涿易安肅保州君氏川季鹿三保河北江礬山寨青白口朝天寨水谷懽谷東安寨隸焉十月安民出兵至礬山復取檐車寨大元兵圍安民所居山寨守寨提控馬豹等以安民妻子及老弱出降安民軍中聞之駭亂衆議欲降以保妻子安民及經歴官郝端不肯從遂遇害詔贈金紫光祿大夫郭文振字拯之太原人承安二年進士累官遼州刺史貞祐四年昭義節度使必喇阿嚕岱請升遼州為節鎮廷議遼州城郭人户不稱節鎮而文振有功當遷乃以本官充宣差從宜都提控興定元年詔文振接應苗道潤恢復中都會道潤與賈仝相攻而止文振治遼州深得衆心興定三年遷遙授中都副留守權元帥左都監行河東北路元帥府事刺史從宜如故文振招降太原東山二百餘村遷老幼于山寨得壯士七千分駐營柵防護秋穫文振奏若秋高無兵直取太原河東可復優詔許之十月權元帥右都監行元帥府事與張開合堅臺州兵復取太原四年詔升樂平縣為臯州夀陽縣西張寨為晉州從文振之請也文振上疏曰揚子雲有言御得其道則天下徂詐咸作使御失其道則天下狙詐咸作敵有天下者審所御而已河朔自用兵之後郡邑蕭然並無官長武夫悍卒因緣而起以為得志僭越名位𤓰分角競以相侵攘雖有内除之官亦不得領其職所為不法可勝言哉乞行帥府擅請便宜妄自誇張以尊大其權包藏之心蓋可知也朝廷因而撫之假權傳授至與各路帥府力侔勢均不相統屬陜西行省總為節制相去遼遠道路梗塞卒難聞知故飛揚跋扈無所畏憚鄰道相望莫敢誰何自平陽城破以來河北不置行省朝廷信臣不復往來布揚聲敎但令伊喇行報而已所司勞以酒食悦以貨財借其聲譽共欺朝廷姦倖既行遂至驕恣變故之生何所不有此臣所以夙夜痛心而為之憂懼也乞分遣公廉之官徧詣訪察庶知所在利害之實伏見澤潞等處芻糧猶廣人民猶衆地多險阻乞選重臣復直行省皆聼節制上下相維可臂指使之則國勢日重姦惡不萌矣是時澤潞已詔張開規畫不能盡用文振之言但令南京兵馬使珠嘉賽音行帥府於懷孟而已是歲封晉陽公河東北路皆隸焉文振奏孟州每以豪猾不逞之人攝行州事朝廷重於更代就令主之去年伯特和攝刺史提控伯特安殺之奪其職河東行省以陳景璠代安安内不能平因誣告景璠死罪朝廷未及按問安輒逐之恥受臣節制宣言于衆待道路稍通當隸恒山公節制今真定已不守安猶向慕不已臣徵兵諸郡安輒詭辭不遣臣若興師是自生一敵非國家之便也聞安有女臣輒違律令為姪孫述娶之安遂見許臣非願與安為姻為公家計屑就之耳自結親以來安頗循率以從王事法不當娶而輒娶之敢以此罪為請宣宗嘉其意遣近臣慰諭之文振復奏武仙所統境土甚大雖與林州元帥府共招撫之乞更選本土州縣官重其職任同與安集可使還定宣宗用其策五年文振奏臣所統嵐管隩石寧化保徳諸州境土闊遠不能周知利害恐誤軍國大計伏見葭州刺史𤓰爾佳芬徹智勇過人深悉河東事勢乞令行元帥府事或為本路兵馬都總管與臣分治詔文振就擇可者處之便地仍受文振節制上黨公張開以厚賞誘文振將士頗有亡歸者詔分遼潞粟賑太原饑民張開不與文振奏其事詔遣使慰諭之文振復申前請以葭州刺史𤓰爾佳芬徹分治嵐管以西諸州制可仍令防秋後再度其宜文振請分上黨粟以贍太原詔文振與張開計度頃之詔以石州隸晉陽公府元光元年林州行元帥府惟良得罪召還文振奏近聞惟良召還臣竊以為不可惟良在林州五歲政尚寛厚大得民心今兹被召軍民遮路泣留其去未幾㠖尖之衆作亂逐招撫使康瑭乞遣惟良還林州為便不許文振上書乞遣前平章政事胥鼎行省河北諸公府帥府並聼節制詔諭百姓使知不忘遺黎之意然後以河南陜西精鋭併力恢復不報文振復奏河朔百姓引領南望臣再四請於樞府但以㑹合府兵為言公府雖號分封力實單弱且不相統攝所在被兵朝廷不即遣兵復河北人心將以為舉河朔而棄之甚非計也文振大抵欲起胥鼎為行省定河北朝廷不能用二年詔文振應援史詠復河東是歲遼州不能守徙其軍于孟州以部將郝安等為文振副護㳂山諸寨文振等公府詔不許頃之文振部將汾州招撫使王遇與孟州防禦使納喇蒙古勒不相能復徙衛州然亦不可以為軍迄正大間寓于衞而已胡天作字景山管州人初以郷兵守禦本州累功少中大夫管州刺史興定二年遙授同知太原府事刺史如故是歲平陽失守改同知平陽府事三年復取平陽天作言汾潞皆置帥府平陽大鎮今稍完復所管州縣不下十萬戸復業者相繼不絶其過汾潞遠甚宜一體置之是時晉安嵐州皆有帥府乃以天作充便宜招撫使權元帥左都監四年封平陽公以平陽晉安府隰吉州隸焉天作請以晉安府之翼城縣為翼州以垣曲絳縣隸焉置平水縣于汾河之西朝廷皆從之初軒成本隸程琢麾下琢死成率衆保隰州以為同知隰州軍州事兼提控軍馬成増繕器甲招納亡命頗有他志是時隰州方用兵未可制天作請增置要害州縣以分其勢隰州之境蒲縣最居其衝可改為州隰州之仵城鎮可改為縣選官守備詔升蒲縣為蒲州以大寧縣隸之仵城鎮為仵城縣天作守平陽凡四年屢有功詔錄其子定格為奉職元光元年十月青龍堡危急詔遣𤓰爾佳實倫㑹張開郭文振兵救之次彈平寨東三十里不得進知府事珠格和索哩總領提控王和各以兵歸順臨城索其妻子兵民皆潰執天作出天作已歸順詔珠和索哩子之南京者命天作子定格承應如故天作已受大元官爵佩虎符招撫懷孟之民定格聞之乃自經死贈信武將軍同知睢州軍州事詔張開郭文振招天作天作至濟源欲脱走先遣人奏表南京大元大將惡其反覆遂誅之天作死後宣宗以同知平陽府事史詠權行平陽公府事後封平陽公平陽初破詠父詐母蕭氏藏於窟室索出之使詐招詠詐乃自縊死蕭氏逃歸詠妻梗氏亦自死宣宗贈詐榮祿大夫京兆郡公諡成忠蕭氏封京兆郡太夫人賜號歸義梗氏贈京兆郡夫人諡義烈未幾詠乞内徙徙其軍于解州河中府張開賜姓完顏氏景州人至寧末河北兵起開團結郷兵為固守累功遙授同知青州防禦事兼同知觀州事貞祐四年開率所部復取河間府及滄獻二州十有三縣開有宣府司留付空名宣勑二百道奏乞從權署置就任所復州縣舊宫闕者補之詔遷同知觀州軍州事開復青州乞輸鹽易糧詔與之糧遷觀州刺史權本州經略使至是始賜姓完顏氏開奏乞許便宜及論淇門安陽黎陽皆作堰塞水河運不通乞開發水道不報觀州糧盡是歲秋徙軍輝州乞麥種三千石驢驘三百或寳劵二百貫户部不與御史臺奏開自觀州轉戰來此乆著勞績欲令其軍耕種以自給有司計小費拒不與乞斷自宸衷與之麥種若無牛可與給以寳劵制可是歲潼關不守被召入衞南京興定元年遙授澤州刺史二年遙授同知彰徳府兼總領提控三年充潞州招撫使林州元帥府徙潞人實林州既復遣還開乞隸晉安元帥府或與林州並置元帥府各自為治十月開以權昭義軍節度使遙授孟州防禦使權元帥左都監行元帥府事與郭文振共復太原四年封上黨公以澤潞沁州隸焉五年詔復以涉縣為崇州從開請也元光元年復取高平縣及澤州二年大戰壺關有功既而潞州危急開奏封建公府以固屛翰今胡天作出平陽郭文振南徙河東公府獨臣與史詠而已乞升澤沁二州為節鎮以重守禦詔以澤為忠昌軍沁為義勝軍林州㠖尖寨衆亂逐招撫使康塘推杜仙為招撫使開請以盧芝瑞為副代領其衆又奏比聞郭文振就食懷孟史詠徙解州高倫遷葛伯寨各自保守民安所仰哉臣領孤軍内無儲㣥外無􅀿援臣不敢避失守之罪恐益重朝廷之憂正大間潞州不守開居南京部曲離散名為舊公與匹夫無異天興初起復與劉益為西面元帥領安平都尉紀綱軍五千攻衞州敗績于白公廟是時哀宗走歸徳開與劉益謀収潰兵從衞不果遂與承裔西走皆為民家所殺初置公府開與恒山公武仙最強後駐兵馬武山遣人間道請糧二萬石用事者難之止給二千石公府將佐得報皆不敢白開聞置酒召諸將曰朝廷待某特厚今日與諸君一醉諸將問故曰頃以糧竭為請祈二萬而得二千是吾君相不以武仙輩待我也是時郭文振處開西北當兵之衝民貧地瘠開又不奉命以糧賑文振軍文振窮竄開勢愈孤以至於敗燕寧初為莒州提控守天勝寨與益都田琢東平䝉古綱相依為輔車之勢山東雖殘破猶倚三人為重紅襖賊五公喜據注子堌率衆襲據沂州寧擊走之遂復沂州語在田琢傳寧既屢破紅襖賊招降胡七胡八引為腹心賊中聞之多有欲降者累官遙授同知安化軍節度使事山東安撫副使興定四年封東莒公益都府路皆隸焉五年與䝉古綱王庭玉保全東平以功遷金紫光祿大夫還天勝戰死䝉古綱奏寧克盡忠孝雖位居上公祖考未有封爵身没之後老稚無所衣食乞降異恩以勵節義之士詔贈故祖臯銀青榮祿大夫祖母張氏范陽郡夫人父希遷金紫光禄大夫母彭氏繼母許氏妻霍氏皆為范陽郡夫人族屬五十二人皆廩給之自益都張林逐田琢繼而寧死蒙古綱勢孤徙軍邳州山東不復能守矣贊曰苗道潤死中分其地靖安民有其西之半中分以東者其後張甫有之然無北境矣大凡九公封建宣宗實録所載如此他書載滄海公張進河間公伊喇重格易水公張進晉陽公郭棟此必正大間繼封如史詠繼胡天作者然不可攷矣金史卷一百十八
