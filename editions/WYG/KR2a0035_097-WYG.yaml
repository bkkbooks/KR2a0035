body:
  text: 金史卷九十七元中書右丞相總裁托克托等修列傳第三十五費摩亨本名哈希天哷忠本名蘇布張大節子巖叟張亨韓鍚鄧儼巨構賀揚庭閻公貞焦旭劉仲洙李完馬百禄楊伯元劉璣兄訛康元弼伊喇益本名托摩布費摩亨字仲通本名哈希臨潢府人其先世居遼海祖諱華善者天輔間移屯東受降城以禦夏人後徙居臨潢亨性敦敏習儒大定間收充奉職世宗謂曰聞爾業進士舉其勿忘為學也二十八年擢第世宗嘉之升為奉御一日問以上古為治之道亨奏陛下欲興唐虞之治要在進賢退不肖信賞罰薄徵歛而已章宗即位諭之曰朕左右侍臣多以門第顯惟爾繇科甲進且先朝信臣國家利害為朕盡言俄擢監察御史内侍梁道兒恃恩驕横朝士側目亨劾奏其姦遷鎬王府尉出為定國軍節度副使三遷同知大名府事先是豪猾從衡前政莫制亨下車宣明約束闔境帖然承安四年改河南路按察副使就遷本路副統軍中都西京等路按察使時世襲家豪奪民田亨檢其實悉還正之泰和五年改安武軍節度使歲大雪民多凍殍亨輸已俸為之賙贍及勸率僚屬大姓同出物以濟轉河東南北路按察使卒於官上聞而惜之贈嘉議大夫賻物甚厚亨性尤謹密出入宫禁數年讜議忠言多所禆益有藁則焚之雖家人輩莫知也所歴州郡皆有政績可紀云沃哷忠本名蘇布葢州人也習女直契丹字歴兵部樞宻院尚書省令史再轉大理寺知法遷右三部司正練達邊事嘗奉命使北歸致馬四千餘匹詔褒諭之大定二十六年為監察御史轉尚書省都事章宗立遷尚書兵部員外郎出為滄州刺史河東路提刑副使圖克坦伊勒呼舉以自代改滕州刺史嘗調發黄河船數以稽期聽贖授北京副留守入為同簽樞密院事兼沂王傅承安二年拜武寧軍節度使致仕㤗和三年卒年七十一忠性敦慤通法律以直自守不交權貴故時譽歸之張大節字信之代州五臺人擢天德三年進士第調崞縣丞改東京市令世宗判留務甚愛重之海陵修汴京以大節領其役世宗改元於遼東或勸赴之富貴可一朝遂大節曰自有定分何遽爾隨例補尚書省令史擢祕書郎大理司直㑹左警巡使闕世宗謂宰臣曰朕得其人矣遂授大節俄以杖殺豪民為有司所劾削一階解職未幾授同知洺州防禦使事入為太府丞工部員外郎盧溝水囓安次承詔䕶視堤城擢修内司使推排東京路户籍人服其平進工部郎中時阜通監鑄錢法弊與吏部員外郎麻珪涖其事積銅皆窳惡或欲徵民先所給直大節曰此有司受納之過民何與焉以其事聞卒得免徵就改户部郎中定㐮退吏誣縣民匿銅者十八村大節廉得其實抵吏罪民斵石頌之召授工部侍郎改户部世宗東廵徙太府監諭之曰侍郎與太府監品同以從行支應藉卿辦耳㝷為宋生日使還授横海軍節度使過闕謁謝東宫顯宗撫慰良久曰萬事惟中可也因牓其公堂曰惟中郡境有巨盜久不獲大節以方略擒之後河決於衞横流而東滄境有九河故道大節即相宜繕堤水不為害章宗即位擢中都路都轉運使因言河東賦重宜減議者或不同大節以他路田賦質之遂命減焉乞致仕不許徙知太原府以并代鄉郡故優寵之近郭有男子被殺者聞其妻哭聲不哀召而審之果為姦夫所殺人以為神西山有晉叔虞祠舊以施錢輸公使庫大節還其廟以給營繕選授河東路提刑使未赴留知大興府事治有能名閱歲移知廣寧府復請老授震武軍節度使部有銀冶有司以為爭盜由此生付河東西京提刑司與州同議皆以官𣙜為便大節曰山澤之利當與民共且貧而無業者雖嚴刑能禁其竊取乎宜明諭民授地輸課則其游手者有所資於官亦便上從其議復乞致仕許之仍擢其子尚書刑部員外郎巖叟為忻州刺史以便禄養承安五年卒年八十大節素廉勤好學能勵勉後進自以得學于任倜待倜子如親而加厚又善奕碁當世推為第一嘗被召與禮部尚書張景仁奕世宗嘗謂宰臣曰人多稱王翛能官以朕觀之凡事不肯盡心一老姦耳張大節賦性剛直果於從政逺在王翛之上惜乎用之太晚又屢語近臣曰某某非不幹然不及張大節忠實也其見知如此巖叟字孟弼大節子也大定十九年進士調葭州司候判官冄除雄州觀察判官補尚書省令史除大理評事冄遷監察御史同知河東北路轉運使事中都路都轉運副使刑部員外郎沂州刺史以父憂去官起復大理少卿河北東西大名等路按察轉運副使累遷刑部侍郎兼夔王傅太常卿兼國子祭酒大安三年朝廷欲塞諸城門以為兵備集三品官議於尚書省巖叟曰塞門所以受兵是任城而不任人莫若遣兵擇將背城疾戰時議多之除鎮西軍節度使移定國軍貞祐二年改昭義復移沁南逾年按察司言其年老不任邊要乃致仕退寓洛陽卒張亨字彦通大興漷隂人登皇統六年進士第調樊山丞以廉幹聞授𢎞州軍事判官歴鉅鹿宜川令大定二年補尚書省令史除大理司直累遷尚書左司郎中授戸部侍郎移吏部擢中都路都轉運使坐草塲使鄧汝霖盜草失舉劾解職削一官起授户部尚書世宗謂宰臣曰御史中丞馬惠迪與張亨人才孰優平章政事張汝霖曰惠迪為人雖正於事不敏亨吏才極髙上曰如汝父浩於事明敏少有及者但臨事多徇若無此過則誠難得之賢相也時車駕東廵費用百出自遼以東泉貨甚少計司患其不給欲輦運以支調度亨謂上京距都四千里若輓錢而行是率三而致一也不獨枉費國用無乃重勞民力乎不若行㑹便法使行旅便於囊槖國家無轉輸之勞而用自足矣出為絳陽軍節度使已而復謂宰臣曰漢人三品以上官常少得人如張亨近令補外頗為衆議所歸以朕觀之無甚過人小官中豈無才能之士第未知耳又曰亨嘗為左司奏事多有脫略是亦謬庸人也章宗即位初置九路提刑司時方重其選上以亨為河東南北路提刑使兼勸農採訪事訪其利病條為十三事以聞上嘉納之亨在職毎事存大體略苛細御史以寛緩不事事劾之降授蔡州防禦使明年遷南京路轉運使轉知歸德府事致仕泰和二年卒年七十八亨才識强敏明達吏事終始有可稱云韓鍚字難老其先自析津徙薊之漁陽祖貽愿遼宣徽北院使父秉休歸朝領忠正軍節度使錫以廕補閤門祗候天㑹中南伐錫從軍掌禮儀俄以母老迺就監差久之授神銳軍都指揮使入為宫苑使天德元年擢尚書工部員外郎領燕都營繕特賜胡礪榜進士及第四遷尚書戸部侍郎以母喪解旋起復舊職付金牌一銀牌十籍水手於山東時蘇保衡為水軍都統制趨杭州俾錫部船三百㑹廣陵適保衡敗還喪船過半令鍚補足之時水淺船不得進海陵遣使急責之衆稍亡錫召諸豪諭之曰今連保法嚴逃將安徃縱一身偶脫其如妻子何衆悟亡者稍止大定改元於遼東鍚奔赴行在詔復前職明年授同知河間府事引見於香閤誡之曰聞皇族居彼者縱甚卿當以法繩之鍚下車宣布詔言後無有撓政害民者遷孟州防禦使累拜絳陽軍節度使改知濟南府事告老許之明昌五年卒年八十三鄧儼字子威懿州宜民人也天德三年擢進士第大定中為左司員外郎右司郎中尋轉左司掌機務者數年有司奏使宋者世宗命選漢官一人叅知政事梁肅以户部侍郎王翛工部侍郎張大節左司郎中鄧儼對世宋曰王翛張大節苦無資歴與左右司官辛苦不同其命儼徃嘗謂宰臣曰人言鄧儼用心不正朕視儼奏事其心識甚明在太府監心亦向公宰臣因奏儼明事機有心力於是擢户部侍郎翌日復謂宰臣曰吏部掌銓選當得通練人可寘儼於吏部因改命焉累遷中都路都轉運使明昌初為戸部尚書上命尚書省集百官議如何使民棄末務本以廣儲蓄儼言今之風俗競為侈靡莫若定立制度使貴賤上下衣冠車馬室宇器用各有等差裁抑婚姻喪葬過度之禮罷去鄉社追逐無名之費用度有節則蓄積日廣矣尋知歸徳府事致仕卒初儼致仕復夤緣求進上問左右鄧儼可復用乎平章政事完顔守貞曰儼有才力第以謀身為心上曰朕亦知之然儼可以誰比守貞曰臨事則不後於人但多務自便耳儼前乞致仕陛下以其頗黠故許之甚合衆議今使復列于朝恐風化從此壊矣上然之遂不復用云巨構字子成薊州平谷人㓜篤學年二十登進士第由信都丞察廉為石城令補尚書省令史授震武軍節度副使改同提舉解鹽司事以課增入為少府監丞再遷知登聞檢院兼都水少監時右司郎中段珪卒世宗曰是人甚明正可用如巨構每事但委順而已二十五年除南京副留守上謂宰臣曰巨構外淳質而内明悟第乏剛鯁耳佐貳之任貴能與長官辨正恐此人不能爾若任以長官必有可稱章宗即位擢横海軍節度使承安五年致仕卒構性寛厚寡言所治以鎭靜稱性尤恬退故人既貴不復徃來先遣以書則裁荅寒温而已大定中詔與近臣同經營香山行宫及佛舍其近臣私謂構曰公今之德人我欲舉奏公行将大任矣構辭之以廉愼守法在考功籍始終無過云賀揚庭字公叟曹州濟隂人也登天德三年經義進士第調范縣主簿兼尉籍有治聲大定十三年由安肅令補尚書省令史授沁南軍節度副使入為監察御史歴右司都事户部員外郎侍御史右司員外郎世宗喜其剛果謂揚庭曰南人礦直敢為漢人性姦臨事多避難異時南人不習詞賦故中第者少近年河南山東人中第者多殆勝漢人為官俄以廉能遷户部郎中進官二階頃之授右司郎中改刑部侍郎山東東路轉運使章宗即位初置九路提刑司驛召赴闕授山東東西路提刑使揚庭性疾惡纎介不少容明昌改元詔諸路提刑使入見親問所察事條至揚庭則斥之曰爾何治之煩也明年夏除洺州防禦使時歲歉民飢揚庭諭蓄積之家令出所餘以糶之飢者獲濟洺人為之立石頌德改陜西西路轉運使表乞致仕上曰揚庭能幹者也當何如右丞劉瑋言其疾遂許之卒年六十七贊曰費摩亨以進士選奉御能陳唐虞致治之道於宫庭燕私之地又能斥中貴梁道兒之姦沃哷忠以吏道致身始終不交權貴世宗自立於遼東歸者如市張大節獨守正不赴韓錫出守河間面諭皇族之居彼者恣睢不道俾繩以法佞者必希㫖以市權錫下車宣布告戒而已是皆有識之士不為富貴所移者也巨構骫骳賀揚庭骨鯁大定於二人而屢評南北士習之優劣亶其然乎張亨始以繆庸見薄晚以論列稱賞亦砥礪之功歟鄧儼專務謀身上下稱黠致仕又求進用弗可改也夫閻公貞字正之大興宛平人大定七年擢進士第調朝邑主簿由普潤令補尚書省令史察廉升同知亳州防禦事改中都左警廵使以政績聞遷同知武定軍節度使明昌初召為大理正累進大理卿承安元年遷翰林侍讀學士仍兼前職命與登聞檢院賈益同看讀陳言文字公貞居法寺幾十年詳愼周密未嘗有過舉被命校定律令多所是正金人以為法家之祖云焦旭字明銳沃州栢鄉人第進士調安喜主簿冄轉大興令攝左警廵事以杖親軍百人長有司議其罪當杖決世宗曰旭親民吏也若因杖有官人復行杖之何以行事其令收贖改良鄉令世宗幸春水見石城玉田令皆年老不治謂宰臣曰縣令最親民當得賢才畿甸尚如此天下可知矣平章政事石琚薦旭幹能可甄用上然之召為右警廵使旭為人剛果自任不避權勢初旭部民訴良旭以無文據付本主道逢監察御史訴其事語涉訛亂即收付旭旭釋之不問為御史所劾削官兩階杖百八十出為大名府推官㝷授右三部檢法司正代韓天和為監察御史時御史臺言監察糾彈之司天和諸科出身難居是職上命别舉中丞李晏薦旭剛正可任遂授之而改天和獲鹿令章宗初即位太傅克寧右丞相襄請上出獵旭劾奏其非上慰諭之為罷獵明昌元年登聞皷院初設官􅈗執奏司諫郭安民補闕許安仁及旭皆堪擢用改侍御史四遷都水監以治河防勞進官一階授西京路轉運使卒旭性警敏練達時政與王翛劉仲洙輩世稱能吏云劉仲洙字師魯大興宛平人大定三年登進士第歴龍門主簿香河酒稅使再調深澤令縣近滹沱河時秋成水忽暴溢仲洙極力䕶塞竟無害有盜夜發居民震驚仲洙率縣卒生執其一餘衆遂潰旦日掩捕皆獲㝷以廉能進官一階陞河北西路轉運司支度判官入為刑部主事六遷右司員外郎俄轉吏部世宗謂􅈗臣曰人有言語敏辯而庸常不正者有語言拙訥而才智通達存心向正者如劉仲洙頗以才行見稱然而口語甚訥也右丞張汝霖曰人之若是者多矣願陛下深察之二十九年出為祁州刺史以六善為教民化之章宗即位除中都西京等路提刑副使先是田瑴等以黨罪廢錮者三十餘家仲洙知其寃上書力辯帝從之迺復瑴官爵而黨禁遂解明昌二年授并王傅兼同知大同府事尋改平陽移德州防禦使轉運郭邦傑節度李晏皆舉仲洙以自代陞為定海軍節度使歲饑仲洙表請開倉未報先為賑貸有司劾之罪以贖論時仲洙兄仲淵以罪責石州仲洙上書請以萊易石朝廷義而不許久之以年老乞致仕累表方聼㤗和八年卒年七十五仲洙性剛直果於從政尤長於治民所在皆有功迹葢一時之能吏云李完字全道朔州馬邑人經童出身復登詞賦進士第調澄城主簿有遺愛民為立祠用廉遷定襄令召補尚書省令史時以縣令闕人廉問世宗選能吏八人按行天下完其一也明昌初年為監察御史故事臺令史以六部令史久者補吏同類皆莫肯舉劾完言尚書省令史正隆間用雜流大定初以太師張浩奏請始純取進士天下以為當今乞以三品官子孫及終場舉人委臺官辟用上納其言擢尚書省都事出為同知横海軍節度使事河間府治中提刑司言完習法律有治劇材軍民無間語陞沁州刺史仍以璽書褒諭遷同知廣寧府初遼濵民崔元入城飲不歸求得尸於水中有司執同飲者訊之皆誣服提刑司疑其寃以獄畀完完廉得其賊乃舟師也遂免同飲人改北京臨潢路提刑副使承安二年遷陜西西路轉運使㝷授南京路按察使卒完長於吏治所至姦惡屏迹民皆便之馬百禄字天錫通州三河人父柔德天㑹初第進士累遷翰林修撰坐田瑴黨免官迨世宗朝解黨禁復召用焉百禄㓜志學事繼母以孝文登大定三年詞賦進士第調武清主簿由龍山令召補尚書省令史不就改㩁貨副使平陽府判官入為國子博士朝廷以宰縣日清白有治迹特遷官一階升同知北京路轉運事委録南北路刑獄所至無寃召為尚書户部員外郎與同知河北東路轉運事季京為中都等路推排使明昌初遷耀州刺史吏民畏愛提刑司以状聞授韓王傅同知安武軍節度事俄改兼同知興平軍以提刑司復舉廉升孟州防禦使再遷南京路提刑使御史臺以剛直能幹聞轉知河中府承安四年致仕卒諡曰貞忠楊伯元字長卿開封尉氏人登大定三年進士第調郾城主簿升榆次令召為大理評事累除定海軍節度副使用廉超授同知河東北路轉運事入為尚書刑部員外郎以憂免起為遼州刺史明昌元年移涿州久之擢工部侍郎四遷安武軍節度使泰和二年致仕卒伯元以才幹多被委任凡兩為推排定課使累為審録官人稱其平毎有疑獄必專遣決明辯多中理賜諡曰達劉璣字仲璋益都人也登天德三年進士第大定初為太常博士改左拾遺兼許王府文學璣奏王府事世宗責之曰汝職掌敎道何預奏事因命近侍諭㫖永中曰卿有長史而令文學奏事何也後勿復爾累除同知漕運司事嘗奏言漕户顧直太髙虚費官物宜約量裁損若減三之一歲可省官錢一十五萬餘貫世宗是其言授户部員外郎條上便宜數事世宗謂宰臣曰璣言河堤種栁可省毎歲隄防之費及言官錢利害甚可取前後户部官徃徃偷延歲月如璣者不可多得卿等議其可者行之璣向言漕運省費事盡心公家不厚賞無以勸來者乃賜錢三千貫擢濰州刺史徙知濟州未幾遷同知北京留守事坐曲法放免奴婢訴良者左降管州刺史世宗謂宰臣曰璣為人何如參知政事程輝曰璣執强䟦扈嘗追濟南府官錢以至委曲生意而害及平民上曰朕聞璣在北京凡奴𨽻訴良不問契劵眞偽輙放為良意欲徼福於㝠㝠則在已之奴何為不放又曰璣放朕之家奴意欲以此邀福存心若是不宜再用明昌二年入為國子司業乞致仕不許轉國子祭酒㝷擢太常卿以昏耄不任職為御史臺所糾罷承安二年卒年八十二兄珫珫字伯玉幼名太平以功臣子補閤門祗候遭父喪求終制㑹海陵簒立不許改充䕶衛海陵忌宗室珫坐與徃來斥居鄉里世宗即位珫晝夜兼馳上謁世宗大悅以為䕶衞十人長徃招宗叙白彦敬赫舍哩志寧皆相繼來附還報上喜其有功呼其小字而謂之曰太平所至庻幾能贊朕至太平矣改御院通進與烏居仁等徃南京發遣六宫百司珫建議留尚書右丞赫舍哩良弼經略淮右餘皆北來詔從之丁母憂起復三遷武庫署令車駕幸西京留珫為中都總管判官再轉近侍局使遷太子少詹事兼引進使賜襲衣未幾為陜西統軍都監賜廐馬金帶皇太子以馬與幣為贐召為同知宣徽院事遷太子詹事右宣徽使與張謹言典領昭徳皇后園陵襄事太子贈以厩馬轉左宣徽使以疾求補外除定海軍節度使以其弟太府監瑋為同知宣徽院事珫朝辭上曰卿舊臣今補外寧不惻然東萊瀕海風物亦佳卿到必得調養朕用卿弟在近密如見卿也仍賜廐馬金帶綵十端絹百匹卒官年五十七珫柩過京畿敕有司致祭賻銀三百兩重綵三十端康元弼字輔之大同雲中人幼敏學善屬文登正隆二年進士第調汝陽簿改崇義軍節度判官由垣曲縣令補尚書省令史累遷同知河北西路轉運使事召為大理丞大定二十七年河決曹濮間瀕水者多墊溺朝廷遣元弼徃視相其地如盎而城在盎中水易為害請命於朝以徙之卒改築於北原曹人頼焉出為𢎞州刺史閱歲授大理少卿先是衞城為河所壊増築蘇門以寓州治水既退民不樂遷欲復歸衞於是遣元弼按視還言治故城便遂復其舊轉祕書少監兼著作郎改通州刺史兼領漕事章宗立尊孝懿皇后為皇太后以元弼舊臣詔充副衞尉再轉大理卿以喪去起復為尚書刑部侍郎兼鄆王傅遷南京路轉運使承安三年致仕卒伊喇益字子遷本名托摩布中都路呼喇圖明安人也以廕補圖史院書寫積勞調徐州録事召為樞密院知法三遷為翰林修撰時北邉有警詔百官集尚書省議之太尉克寧銳意用兵益言天時未利宜俟後圖御史臺舉益剛正可任遂兼監察御史未幾改户部員外郎明昌三年畿内饑擢授霸州刺史同授刺史者十一人既入謝詔諭之曰親民之職惟在守令比歲民饑故遣卿等徃撫育之其資序有過者有弗及者朕不計此但以材選爾其知之既至首出俸粟以食飢者于是倅以下及郡人遞出粟以佐之且命屬縣視以為法多所全活郡東南有堤久頺圯水屢為害益増修之民以為便為益立祠升遼東路提刑副使五年宋主新立詔以泗州當使客所經守臣宜擇人宰臣進擬數人皆不合上意上曰托摩布近安在此人可也即授防禦使召為尚書户部侍郎㝷轉兵部屬羣牧人叛命益同殿前都㸃檢兖徃招降之承安二年邊鄙弗寧上御便殿召朝官四品以上入議益謂守為便天子之兵當取萬全若王師輕出少有不利非惟損大國之威恐啟敵人侵玩之心出為山東西路轉運使有勅使按鷹于山東益奏乞止令調於近甸何必驚逺方耳目書聞上命有司治使者罪遷河東南北路按察使舊制在位官有不任職委所屬上司體訪州府長貳幕職許互相舉申益上言以為傷禮讓之風亦恐同官因之不睦别生姦弊乞止令按察使糾劾似為得體又曰隨路㸃軍官與富人飲㑹公通獻遺宜依准監臨官於所部内犯罪究治上皆納焉泰和二年卒于官贊曰閻公貞定金律令楊伯元定金推排人皆以平稱之難矣焦旭畿内小官聽㫁不受御史風指遂罹深憲大臣請人主遊獵劾奏其非為之罷獵誠有古人之風焉李完康元弼無他足稱完論臺令史一事元弼論曹衞兩城各當其可馬百禄初坐黨廢晚著治跡劉璣初以理財得幸晩以曲法得罪人有前後遭遇不同而百禄求福不囬非璣所及也劉珫以大定之立馳赴行在雖終身榮寵盖一趨時之士耳劉仲洙剛而納於言伊喇益剛而敢言益以克寧北代為不可仲洙釋田瑴黨禍三十家語曰剛毅木訥近仁豈不信哉金史卷九十七
