body:
  text: 金史卷三十元中書右丞相總裁托克托等修志第十一禮三宗廟朝享禘祫儀時享金初無宗廟天輔七年九月太祖葬上京宫室之西南建寧神殿于陵上以時薦享自是諸京皆立廟惟在京師者則曰太廟天㑹六年以宋二帝見太祖廟者是也或因遼之故廟安置御容亦謂之廟天眷三年熙宗幸燕及受尊號皆親享恭謝是也皇統三年初立太廟八年太廟成則上京之廟也貞元初海陵遷燕乃増廣舊廟奉遷祖宗神主于新都三年十一月丁卯奉安于太廟正隆中營建南京宫室復立宗廟南渡因之其廟制史不載傳志雜記或可概見今附之汴京之廟在宫南馳道之東殿規一屋四間限其北為神室其前為通廊東西二十六楹為間二十有五每間為一室廟端各虚一間為夾室中二十三間為十一室從西三間為一室為始祖廟祔徳帝安帝獻祖昭祖景祖祧主五餘皆兩間為一室或曰惟第二第三室兩間餘止一間為一室總十有七間世祖室祔肅宗穆宗室祔康宗餘皆無祔每室門一牖一門在左牖在右皆南向石室之龕於各室之西壁東向其世祖之龕六南向者五東向者一其二其三俱二龕餘皆一室一龕總十八龕祭日出主於北牖下南向禘祫則並出主始祖東向群主依昭穆南北相向東西序列室户外之通廊殿階二級列陛三前井亭二外作重垣四繚南東西皆有門内垣之隅有樓南門五闔餘皆三中垣之外東北冊寳殿也太常官一人季視其封緘謂之㸃寳内垣之南曰大次東南為神庖廟門翼兩廡各二十有五楹為齋郎執事之次西南垣外則廟署也神門列㦸各二十有四植以木錡㦸下以板為掌形畫二青龍下垂五色帶長五尺享前一日則縣㦸上祭畢藏之室次大定十二年議建閔宗别廟禮官援晉惠懐唐中宗後唐莊宗升祔故事若依此典武靈皇帝無嗣亦合升祔然中宗之祔始則為虚室終則増至九室惠懐之祔乃遷豫章潁川二廟莊宗之祔乃祧懿祖一室今太廟之制除祧廟外為七世十一室如當升祔武靈即須别祧一廟荀子曰有天下者事七世若旁容兄弟上毁祖考則天子有不得事七世者矣伏覩宗廟世次自睿宗上至始祖凡七世别無可祧之廟晉史云廟以容主為限無拘常數東晉與唐皆用此制遂増至十一室康帝承統以兄弟為一室故不遷逺廟而祔成帝唐以敬文武三宗同為一代於太廟東間増置兩室定為九代十一室今太廟已滿此數如用不拘常數之說増至十二室可也然廟制已定復議増展其事甚重又與睿宗皇帝祏室昭穆亦恐更改春秋之義不以親親害尊尊漢志云父子不並坐而孫可從王父若武靈升祔太廟増作十二室依春秋尊尊之典武靈當在十一室禘祫合食依孫從王父之典當在太宗之下而居昭位又當稱宗然前升祔睿宗已在第十一室累遇祫享睿宗在穆位與太宗昭位相對若更改祏室及昭穆序非有司所敢輕議宜取聖裁十九年四月禘祔閔宗遂増展太廟為十二室二十九年世宗將祔廟有司言太廟十二室自始祖至熙宗雖係八世然世宗與熙宗為兄弟不相為後用晉成帝故事止係七世若特升世宗顯宗即係九世於是五月遂祧獻祖昭祖升祔世宗明徳皇后顯宗于廟貞祐二年宣宗南遷廟社諸祀並委中都自穆延盡忠棄城南奔時謁之禮盡廢四年禮官言廟社國之大事今主上駐蹕陪京列聖神主已遷于此宜重修太廟社稷以奉歲時之祭按中都廟制自始祖至章宗凡十二室而今廟室止十一若増建恐難卒成况時方多故禮宜從變今擬權祔肅宗主世祖室始祖以下諸神主于隨室奉安主用栗依唐制皇統九年所定也祏室旁及上下皆石門東向以木為闔髹以朱室中有褥奠主訖帝主居左覆以黄羅帕后主居右覆以紅羅帕黼扆以紙木為筐兩足如立屏牀覆以紅羅三幅繡金斧五十四裹以紅絹覆於屏上其半無文者垂於其後置北牖下南向前設几筵以坐神主五席各長五尺五寸濶二尺五寸筦筵粉純以藺為席縁以紅羅以白繡蕙文及雲氣之狀復以紅絹裹之毎位二繅席畫純以五色絨織青蒲為之縁以紅羅畫藻文及雲氣狀亦以紅絹裹之毎位二在筦上次席黻純以輕筠為之亦曰桃枝席縁以紅綃繡鐵色斧裹以紅絹毎位二在繅席上虎席二大者長同惟濶増一尺以虎皮為褥在緼以紅羅繡金色斧緣之又有小虎皮褥制同三席時暄則用桃枝次席時寒則去桃枝加虎皮褥夏秋享則用桃枝次席二冬則去桃枝加小虎皮褥於繅席上臘冬則又添大虎皮褥二於繅上遷小虎皮褥二在大褥之上曲几三足直几二足各長尺五寸以丹漆之帝主前設曲几后設直几禘祫大定十一年尚書省奏禘祫之儀曰禮緯三年一祫五年一禘唐開元中太常議禘祫之禮皆為殷祭祫謂合食祖廟禘謂禘序尊卑申先君逮下之慈成群嗣奉親之孝自異常享有時行之祭不欲數數則黷不欲疎疎則怠是以王者法諸天道以制祀典烝嘗象時禘祫象閏五歲再閠天道大成宗廟法之再為殷祭自周以後並用此禮自大定九年已行祫禮若議禘祭當於祫後十八月孟夏行禮詔以三年冬祫五年夏禘為常禮又言海陵時每嵗止以二月十月遣使兩享三年祫享按唐禮四時各以孟月享于太廟季冬又臘享歲凡五享若依海陵時歲止兩享非天子之禮宜從典禮歲五享從之享日並出神主前廊序列昭穆應圖功臣配享廟廷各配所事之廟以位次為序以太子為亞獻親王為終獻咸並用親王或以太尉為亞獻光祿卿為終獻其月則停時享儀闕朝享儀大定十一年十一月郊祀前一日朝享太廟齋戒如親郊享前三日太廟令帥其屬掃除廟之内外㸃檢司於廟之前約度設兵衞旗幟尚舍於南神門之西設饌幔十一南向以西為上殿中監帥尚舍陳設大次殿又設小次於阼階下稍南西向又設皇帝拜褥位殿上版位稍西又設黄道褥於廟門之内外自玉輅至升輦之所又自大次至東神門又設七祀位一於殿下横街之北西街之西東向配享功臣位於殿下道東横街之南西向北上前二日大樂令設宫縣之樂於庭中四方各設編鐘三編磬三東方編鐘起北編磬間之東向西方編磬起北編鐘間之西向南方編磬起西編鐘間之北方編鐘起西編磬間之俱北向設特磬大鐘鎛鐘共十二於編縣之内各依神位樹路皷路鼗於北縣之内道之左右晉皷一在其後稍南植建皷鞞皷應皷於四隅建皷在中鞞皷在左應皷在右置祝敔於縣内柷一在道東敔一在道西立舞表於酇綴之間設登歌之樂於殿上前楹間金鐘一在東玉磬一在西俱北向柷一在金鐘北稍西敔一在玉磬北稍東搏拊二一在柷北一在敔北東西相向琴瑟在前其匏竹者立於階間重行北向諸工人各位於縣後前一日太廟令開室奉禮郎帥其屬設神位於每室内北牖下各設黼扆一筦席一繅席二次席二紫綾厚褥一紫綾䝉褥一曲几一直几一又設皇帝版位於殿東間門内西向又設飲福位於東序西向又設亞終獻位於殿下横街之北稍東西向助祭親王宗室使相位在亞終獻之後助祭宗室位在横街之南西向奉瓚官奉瓚盤官進爵酒官奉爵官等又在其南奉匜幋巾筐官位於其後七祀獻官位在奉爵官之南助奠讀祝奉罍洗爵洗等官位於其後司尊彜官位在七祀獻官之南亞終獻司罍洗爵洗奉爵酒官等又在其南並西向北上大禮使位於西階之西稍南與亞終獻相對大尉司徒助祭宰相位在大禮使之南侍中執政官又在其南禮部尚書太常卿太僕卿光祿卿功臣獻官在西舉冊光禄丞太常博士又在其西功臣助奠罍洗爵洗等官位於功臣獻官之後又設監祭御史位二於西階下俱東向北上奉禮郎太廟令太官令太祝宫闈令祝史位於亞獻終獻奉爵酒官之南薦籩豆簠簋官薦俎齋郎又在太祝奉禮郎之南大廟丞太官丞各位於令後協律郎位二一於殿上前楹間一於宫縣之西北俱東向大樂令於登歌樂縣之北大司樂於宫縣之北良醖令於酌尊所俱北向又設助祭文武群官位於横街之南東向北上又設光祿卿陳牲位於東神門外横街之東西向以南為上設廩犧令位於牲西南北向諸太祝位於牲東各當牲後祝史各陪其後俱西向設禮部尚書省牲位於牲前稍北又設御史位於禮部尚書之西俱南向禮部帥其屬設祝冊案於室戸外之右司尊彜帥其屬設彜尊之位於室尸之左每位斝彜一黄彜一犧尊二象尊二著尊二山罍二各加勺羃坫為酌尊又設瓚槃爵坫於篚置于始祖尊彜所又設壺尊二太尊二山罍四各有坫羃在殿下階間北向西上設而不酌七配功臣每位設壺尊二於座之左皆加羃坫於内酌尊加勺皆藉以席奉禮郎設祭器每位四簋在前四簠次之次以六㽅次以六鉶籩豆為後左十有二籩右十有二豆皆濯而陳之藉以席籩豆加以巾葢於内籩一豆一簠一簋一并俎四設於每室饌幔内又設御洗二於東階之東又設亞終獻罍洗於東横街下東南北向罍在洗東篚在洗西南肆實以巾又設亞終獻爵洗於罍洗之西罍在洗東篚在洗西南肆實以巾爵并坫執巾罍巾篚各位於其後享日丑前五刻太常卿帥執事者設燭於神位前及戸外光祿卿帥其屬入實籩豆籩之實魚鱐糗餌粉餈乾棗形鹽鹿脯榛實乾䕩桃菱芡栗以序為次豆之實芹菹笋菹葵菹菁菹韮菹酏食魚醢􅇠醢豚胉鹿臡醓醢糝食以序為次又鉶實以羮加芼滑豋實以大羮簠實以稻粱簋實以􅁰稷粱在稻前稷在􅁰前良醖令入實尊彜斝彜黄彜實以鬱鬯犧尊象尊著尊實以𤣥酒外皆實以酒用香藥酒各加坫勺羃殿下之尊罍壺尊太尊山罍内除山罍太尊實以𤣥酒外皆實以酒加羃坫太廟令帥其屬設七祀功臣席褥於其次每位各設莞席一碧綃褥一又各設版位於其座前又籩豆簠簋各二俎一每位次各設壺尊二於神座之右北向𤣥酒在西良醖令以法酒實尊如常加勺羃置爵於尊下加坫光祿卿實饌左二􅇼栗在前鹿脯次之右二豆菁菹在前鹿臡次之俎實以羊熟簠簋實以黍稷太廟令又設七祀燎柴又開瘞坎於西神門外之北太府監陳異寳嘉瑞伐國之寳户部陳諸州嵗貢金為前列玉帛次之餘為後皆於宫縣之北東西相向各藉以席凡祀神之物當時所無者則以時物代之省牲器前一日未後廟所禁行人司尊彜奉禮郎及執事者升自西階以俟少頃諸太祝與廩犧令以牲就位禮直官贊者引禮部尚書光禄卿丞詣省牲位立定禮直官引禮部尚書贊引者引御史入就西階升遍視滌濯訖執事者皆舉羃曰潔俱䧏就省牲位禮直官稍前曰告潔畢請省牲次引禮部尚書侍郎稍前省牲訖退復位次引光祿卿丞出班巡牲一匝光祿丞西向曰充曰備廩犧令帥諸太祝巡牲一匝西向躬身曰腯禮直官稍前曰省牲畢請就省饌位引禮部尚書以下各就位立定御史省饌具畢禮直官贊省饌訖俱還齋所光祿卿丞及太祝廩犧令以次牽牲詣厨授太官令禮直官引禮部尚書詣厨省鼎鑊視濯溉訖還齋所晡後一刻太官令帥宰人執鸞刀割牲祝史各取毛血每座共實一豆遂烹牲祝史洗肝於鬱鬯又取肝膋每座共實一豆俱還饌所鑾駕出宫前一日有司設大駕鹵簿於應天門外尚輦進玉輅於應天門内南向其日質明侍臣直衛及導駕官於致齋殿前左右分班立俟通事舍人引侍中俛伏跪奏請中嚴皇帝脤通天冠絳紗􅂁少頃侍中奏外辨皇帝出齋室即御座群官起居訖尚輦進輿待中奏請皇帝升輿皇帝乘輿侍衞警蹕如常儀太僕卿先詣玉輅所攝衣而升正立執轡導駕官前導皇帝至應天門内玉輅所侍中進當輿前奏請皇帝降輿升輅皇帝升輅太僕卿立授綏導駕官分左右步導以裏為上門下侍郎進當輅前奏請車駕進發