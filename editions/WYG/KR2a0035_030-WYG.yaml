每室羊豕各一鼎皆設扄羃齋郎對舉入鑊於饌幔前齋郎抽扄委于鼎右除羃光祿卿帥太官令以七升羊載于一俎肩臂臑在上端肫胳在下端脊脅在中次升豕及羊各載于一俎每室羊豕各一俎齋郎即以扄舉鼎先退置于神厨訖復還饌幔所禮直官引司徒出詣饌幔前立以俟光祿卿帥其屬實籩以粉餈實豆以糝食實簠以梁實簋以稷俟初獻祼畢復位祝史俱進徹毛血之豆降自西階以出禮直官引司徒帥薦籩豆簠簋官奉俎齋郎各奉籩豆簠簋羊豕俎每室以序而進立於南神門之外以俟羊俎在前豕俎次之籩豆簠簋又次之入自正門樂作升自太階諸太祝迎引於階上樂止各設於神位前訖禮直官引司徒以下降自西階樂作復位樂止諸太祝各取蕭蒿黍稷擩於脂燔於爐炭還尊所禮直官引初獻詣罍洗位樂作至位北向立樂止搢笏盥手帨手執笏詣爵洗位北向立搢笏洗爵拭爵以爵授執事者執笏升殿樂作詣始祖室酌尊所西向立樂止執事者以爵授初獻初獻搢笏執爵執事者舉羃太官令酌犧尊之泛齊訖次詣第二室酌尊所如上儀詣始祖神位前樂作北向立搢笏跪執事者以爵授初獻初獻執爵三祭酒於茅苴奠爵執笏俛伏興出室戸外北向立樂止贊者引太祝詣室户外東向搢笏跪讀祝祝文讀訖執笏興次詣第二室次詣每室行禮並如上儀初獻降階樂作復位樂止禮直官次引亞獻詣盥洗位北向立搢笏盥手帨手執笏詣爵洗位北向立搢笏洗爵拭爵以授執事官執笏升殿詣始祖酌尊所西向立執事者以爵授亞獻亞獻搢笏執爵執尊者舉羃太官令酌象尊之醴齊訖次詣第二室酌尊所如上儀詣始祖神位前樂作北向立搢笏跪執事者以爵授亞獻亞獻執爵三祭酒于茅苴奠爵執笏俛伏興出户外北向再拜訖樂止次詣每室行禮並如上儀降階樂作復位樂止禮直官次引終獻詣盥洗及升殿行禮並如亞獻之儀降復位次引太祝徹籩豆少移故處樂作卒徹樂止俱復位禮直官曰賜胙贊者承𫝊曰賜胙再拜在位者皆再拜禮直官引太祝官闈令奉神主太祝搢笏納帝主於匱奉入祏室執笏退復位次引宫闈令納后主於匱奉入祏室並如上儀退復位禮直官贊者引行事執事官各就位奉禮曰再拜贊者承𫝊應在官官皆再拜禮直官贊者引百官次出大樂令帥工人次出太官令帥其屬徹禮饌次引監祭御史詣殿監視卒徹訖還齋所太廟令闔户以降太常藏祝版於櫃光祿以胙奉進監祭御史就位展視光祿卿望闕再拜乃退其七祀夏竈中霤秋門厲冬行鋪設祭器入實酒饌俟終獻將升獻獻官行禮并讀祝文并毎歲四孟月臘五享並如上儀金史卷三十
