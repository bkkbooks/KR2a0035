body:
  text: 金史卷一百二十九元中書右丞相總裁托克托等修列傳第六十七酷吏髙閭山富察和卓太史公有言法家嚴而少恩信哉斯言也金法嚴密律文雖因前代而増損之大抵多凖重典熈宗迭興大獄海陵剪滅宗室鈎棘傅㑹告姦上變者賞以不次於是中外風俗一變咸尚威虐以為事功而䜛賊作焉流毒逺邇慘矣金史多闕逸據其舊録得二人焉作酷吏傳髙閭山澄州析木人選充護衛調順義軍節度副使轉唐古伊埒圖乣詳衮改震武軍節度副使曹王府尉大名治中遷汝州刺史改單州制禁不依法用杖決人者閭山見之笑曰此亦難行是日特用大杖杖死部民楊仙坐削一官解職久之降鳯翔治中厯原州泗洲濟州刺史改正州防禦使遷扶餘路節度使移臨海盤安軍寧昌軍貞祐二年城破死之富察和卓以吏起身乆為宣宗所信聲勢烜赫性復殘刻人知其蠧國而莫敢言其子充護衛先逐出之繼而和卓為恒州刺史需次近縣後大兵入陜西闗中震動或言和卓赴恒州為北走計朝廷命開封覊其親屬和卓出怨言曰殺却我即太平矣尋為御史所劾初議笞贖宰相以為悖理斬於開封府門之下故當時有宣朝三賊之目謂王阿里富察耀珠和卓具一也興定中駙馬布薩阿哈之獄京師宣勘七十餘所阿里軰乗時起事以肆其毒朝士惴惴莫克自保惟通吉文之在開封府幕明其不反竟不署字阿哈誅文之亦無所問耀珠正大初致仕居睢陽潰軍變與其家皆被殺初宣宗喜刑罰朝士徃徃被笞楚至用刀杖決殺言者髙琪用事威刑自恣南渡後習以成風雖士大夫亦無所移如圖克坦右丞思忠好用麻椎撃人號麻椎相公李運使特立號半截劍言其短小鋒利也馮内翰璧號馮劊雷淵為御史至蔡州得姦豪杖殺五百人號曰雷半千又有完顔莽伊蘇皆以酷聞而和卓王阿里李渙之徒胥吏中尤狡刻者也佞幸蕭肄張仲軻幼名牛兒李通馬欽幼名韓哥高懐貞蕭裕本名揚珠胥持國世之有嗜慾者何嘗不被其害哉龍天下之至神也一有嗜慾見制於人故人君亦然嗜慾不獨柔曼之傾意也征伐畋獵土木神仙彼為佞者皆有以投其所好焉金主内蠱聲色外好大喜功莫甚於熈宗海陵而章宗次之金史自蕭肄至胥持國得佞臣之尤者七人皆被寵遇於三君之朝以亡其身以􅗜其國其禍皆始於此可不戒哉作佞幸傳蕭肄本奚人有寵於熙宗復謟事悼后累官參知政事皇統九年四月壬申夜大風雨雷電震壊寢殿䲭尾有火自外入燒内寢幃幔帝徙别殿避之欲下詔罪已翰林學士張鈞視草鈞意欲奉答天戒當深自貶損其文有曰惟徳弗類上干天威及顧兹寡昧眇予小子等語肄譯奏曰弗類是大無道寡者孤獨無親昧則於人事弗曉眇則目無所見小子嬰孩之稱此漢人託文字以詈主上也帝大怒命衛士洩鈞下殿榜之數百不死以手劔釐其口而醢之賜肄通天犀帶慿恃恩倖倨視同列遂與海陵有惡及簒立加大臣官爵例加銀青光禄大夫數日召肄詰之曰學士張鈞何罪受誅爾何功受賞肄不能對海陵曰朕殺汝無難事人或以我報私怨也於是詔除名放歸田里禁錮不得出百里外張仲軻幼名牛兒市井無賴説傳竒小説雜以俳優詼諧語為業海陵引之左右以資戲笑海陵封岐國王以為書表及即位為秘書郎海陵嘗對仲軻與妃嬪䙝瀆仲軻但稱死罪不敢仰視又嘗令仲軻裸形以觀之侍臣每令倮褫雖圖克坦貞亦不免此兵部侍郎完顔布琳大興少尹李惇皆以贓敗海陵置之要近伶人千慶兒官五品大氏家奴王之彰為秘書郎之彰睪珠偏僻海陵親視之不以為䙝唐古辯家奴和尚烏達家奴葛温葛魯皆置宿衛有僥倖至一品者左右或無官職人或以名呼之即授以顯階海陵語其人曰爾復能名之乎常置黄金裀褥間喜之者令自取之其濫賜如此宋余唐弼賀登寶位且還海陵以玉帶附賜宋帝使謂宋帝曰此帶卿父所常服今以為賜使卿如見而父當不忘朕意也使退仲軻曰此希世之寳可惜輕賜上曰江南之地他日當為我有此置之外府耳由是知海陵有南伐意俄遷秘書丞轉少監是時營建燕京宫室有司取真定府潭園材木仲軻乗間言其中材木不可用海陵意仲軻受請託免仲軻官未幾復用為少監海陵獵于托紐山次于逹斡酹天而拜謂羣臣曰朕幼時習射至一門下黙祝曰若我異日大貴當使一矢横加門脊上及射果横加門脊上後為中京留守嘗大獵于此地圍未合禱曰我若有大位百歩之内當獲三鹿若止為公相獲一而已於是不及百歩連獲三鹿又祝曰若統一海内當復獲一大鹿於是果獲一大鹿此事嘗與蕭裕言之朕今復至此地故拜奠焉海陵意欲取江南故先設禨祥以諷羣臣是以仲軻毎先逢其意導之南伐貞元二年正月宋賀正旦使施臣朝辭海陵使左宣徽使敬嗣暉問施臣曰宋國幾科取士對曰詩賦經義策論兼行又問秦檜作何官年今幾何對曰檜為尚書左僕射中書門下平章事年六十五矣復謂之曰我聞秦檜賢故問之正隆二年仲軻為左諫議大夫修起居注但食諫議俸不得言事三年正月宋賀正使孫道夫陛辭海陵使左宣徽使敬嗣暉諭之曰歸白爾帝事我上國多有不誠今畧舉二事爾民有逃入我境者邊吏皆即發還我民有逃叛入爾境者有司索之往往託辭不發一也爾於沿邊盗買鞍馬備戰陣二也且馬待人而後可用如無其人得馬百萬亦奚以為我亦豈能無備且我不取爾國則己如欲取之固非難事我聞接納叛亡盜買鞍馬皆爾國楊太尉所為常因俘獲問知其人無能為者也又曰聞秦檜已死果否道夫對曰檜實死矣陪臣亦檜所薦用者又曰爾國比来行事殊不似秦檜時何也道夫曰容陪臣還國一一具聞宋帝海陵蓋欲南伐故先設納叛亡盗買馬二事而雜以他辭言之海陵召仲軻右補闕馬欽校書郎田與信直長實實入便殿侍坐海陵與仲軻論漢書謂仲軻曰漢之封疆不過七八千里今吾國幅員萬里可謂大矣仲軻曰本朝疆土雖大而天下有四主南有宋東有髙麗西有夏若能一之乃為大耳海陵曰彼且何罪而伐之仲軻曰臣聞宋人買馬修器械招納山東叛亡豈得謂無罪海陵喜曰向者梁珫嘗謂朕言宋有劉貴妃者姿質艶羙蜀之華蘂呉之西施所不及也今一舉而兩得之俗所謂因行掉手也江南聞我舉兵必逺竄耳欽與與信俱對曰海島蠻越臣等皆知道路彼將安往欽又曰臣在宋時常帥軍征蠻所以知也海陵謂實實曰汝敢戰乎對曰受恩日久死亦何避海陵曰汝料彼敢出兵否彼若出兵汝果能死敵乎實實良久曰臣雖懦弱亦將與之為敵矣海陵曰彼將出兵何地曰不過淮上耳海陵曰然則天與我也既而曰朕舉兵滅宋逺不過二三年然後討平髙麗夏國一統之後論功遷秩分賞將士彼必忘勞矣四年三月仲軻死冬至前一夕海陵夢仲軻求酒既覺嗟悼良久遣使者奠其墓李通以偏辟側媚得幸於海陵累官右司郎中遷吏部尚書請謁賄賂輻輳其門正隆二年正月乙酉詔左右司御史中丞以下奏事便殿海陵曰知子莫若父知臣莫若君朕嘗試之矣朕詢及人材汝等若不舉同類必舉其相善者朕聞女直契丹之仕進者必賴刑部尚書烏逹簽書樞密約索為之先容左司員外郎哈喇古勒任其事渤海漢人仕進者必賴吏部尚書李通户部尚書許霖為之先容右司郎中王尉任其事凡在仕版朕識者寡不識者衆莫非人臣豈有親疎逺近之異哉苟奉職無愆尚書侍郎節度使便可得萬一獲罪必罰無赦頃之拜參知政事海陵恃累世彊盛欲大肆征伐以一天下嘗曰天下一家然後可以為正統通揣知其意遂與張仲軻馬欽宧者梁珫近習羣小輩盛談江南富庶子女玉帛之多逢其意而先道之海陵信其言以通為謀主遂議興兵伐江南四年二月海陵諭宰相曰宋國雖臣服有誓約而無誠實比聞沿邊買馬及招納叛亡不可不備遣使籍諸路明安部族及州縣渤海丁壯充軍仍括諸道民馬於是遣使分往上京率賔路呼爾哈路海蘭路扶餘路秦州咸平府東京博索路哈斯罕臨潢府西南招討司西北招討司北京河間府真定府益都府東平府大名府西京路凡年二十以上五十以下者皆籍之雖親老丁多求一子留侍亦不聽五年十一月使益都尹京等三十一人押諸路軍器於軍行要㑹處安置俟軍至分給之其分給之餘與繕完不及者皆聚而焚之六年正月海陵使通諭㫖宋使徐度等曰朕昔從梁王嘗居南京樂其風土帝王巡狩自古有之淮右多隙地欲校獵其間從兵不踰萬人汝等歸告汝主令有司宣諭朕意使淮南之民無懐疑懼二月通進拜右丞詔曰卿典領繕完兵械今已畢功朕嘉卿忠謹故有是命俟江南事畢别當旌賞四月簽書樞宻院事髙景山為賜宋帝生日使右司員外郎王全副之海陵謂全曰汝見宋主即靣數其焚南京宫室沿邊買馬招致叛亾之罪當令大臣某人某人來此朕将親詰問之且索漢淮之地如不從即厲聲詆責之彼必不敢害汝海陵葢使王全激怒宋主将以為南伐之名也謂景山曰回日以全所言奏聞全至宋一如海陵之言詆責宋主宋主謂全曰聞公北方名家何乃如是全復曰趙桓今已死矣宋主遽起發哀而罷海陵至南京宋遣使賀遷都海陵使韓汝嘉就境上止之曰朕始至此比聞北方小警欲復歸中都無庸來賀宋使乃還於是大括天下驘馬官至七品聽留一馬等而上之并舊籍民馬其在東者給西軍在西者給東軍東西交相往來晝夜絡繹不絶死者狼籍于道其亡失多者官吏懼罪或自殺所過蹂踐民田調發牽馬夫役詔河南州縣所貯糧米以偹大軍不得他用而驘馬所至當給芻粟無可給有司以為請海陵曰此方比歳民間儲蓄尚多今禾稼滿野驘馬可就牧田中借令再歳不獲亦何傷乎及徴發諸道工匠至京師疫死者不可勝數天下始騷然矣調諸路馬以戸口為率富室有至六十匹者凡調馬五十六萬餘匹仍令本家養飼以俟師期海陵因出獵遂至通州觀造戰船籍諸路水手得三萬餘人及東海縣人張旺徐元反遣都水監徐文等率師浮海討之海陵曰朕志不在一邑将試舟師耳於是民不堪命盗賊蠭起大者連城邑小者保山澤遣䕶衛布琳二十四人各授甲士五千人分往山東河北河東中都等路節鎮州郡屯駐捕捉盗賊以䕶衛斡實為定武軍節度副使尚賢為武安軍節度副使富勒堅為昭義軍節度副使皆給銀牌使督責之時山東賊犯沂州臨沂令哈薩力戰而死大名府賊王九等據城叛衆至數萬契丹邊録錦王三輩皆以十數騎張旗幟白晝公行官軍不敢誰何所過州縣開劫府庫物置于市令人攘取之小人皆喜賊至而良民不勝其害太府監髙彦福大理正耶律道翰林待制大頴出使還朝皆言盗賊事海陵惡聞怒而杖之頴仍除名自是人人不復敢言海陵自将分諸道兵為神策神威神㨗神鋭神毅神翼神勇神果神略神鋒武勝武定武威武安武㨗武平武成武毅武鋭武揚武翼武震威定威信威勝威㨗威烈威毅威震威略威果威勇三十二軍置都總管副總管各一員分𨽻左右領軍大都督及三道都統制府置諸軍巡察使副各一員以太保璸都為左領軍大都督通為副大都督海陵以璸都舊将使帥諸軍以從人望實使通専其事海陵召諸將授方畧賜宴于尚書省海陵曰太師梁王連年南伐淹延嵗月今舉兵必不如彼逺則百日近止旬月惟爾將士無以征行為勞戮力一心以成大功當厚加旌賞其或弛慢刑兹無赦海陵恐糧運不繼命諸軍渡江無以僮僕従行聞者皆怨嗟圖克坦后與太子光英居守尚書令張浩左丞相蕭玉參知政事敬嗣暉留治省事九月甲午海陵戎服乗馬具装啟行明日嬪妃皆行宫中慟哭乆之十月乙巳隂晦失路是夜二更始至䝉城丁未大軍渡淮至中流海陵拜而酹之至宿次見築繚垣者殺四方館使張永鈐將至廬州見白兔馳射不中既而後軍獲之以進海陵大喜以金帛賜之顧謂李通曰昔武王伐紂白魚躍于舟中今朕獲此亦吉兆也癸亥海陵至和州百官表奉起居海陵謂其使汝等欲伺我動静耶自今勿復来俟平江南始進賀表是時梁山濼水涸先造戰船不得進乃命通更造戰船督責苛急將士七八日夜不得休息壊城中民居以為材木煮死人膏為油用之遂築臺于江上海陵被金甲登臺殺黑馬以祭天以一羊一豕投于江中召都督昂副都督富埒琿謂之曰舟楫已具可以濟江矣富埓琿曰臣觀宋舟甚大我舟小而行遲恐不可濟海陵怒曰爾昔従梁王追趙構入海島豈皆大舟耶明日汝與昂先濟昂聞令已渡江悲懼欲亡去至暮海陵使謂昂曰前言一時之怒耳不須先渡江也明日遣武平軍都總管阿林武捷軍副總管阿薩爾率舟師先濟宿直將軍温都敖拉國子司業馬欽武庫直長實實皆従戰海陵置黄旗紅旗于岸以號令進止紅旗立則進黄旗仆則退既渡江兩舟先逼南岸水淺不得進與宋兵相對射者良乆兩舟中矢盡遂為所獲亡一明安軍士百餘人海陵遂還和州于是尚書省使右司郎中鄂博庫員外郎王全奏報世宗即位於東京改元大定海陵前此已遣䕶衛摩羅歡徳哩布往東京欲害世宗行至遼東遇世宗詔使薩巴執而殺之遂還軍中海陵拊髀歎曰朕本欲平江南改元大定此豈非天乎乃出素所書取一戎衣天下大定改元事以示羣臣遂召諸將帥謀北歸且分兵渡江議定通復入奏曰陛下親師深入異境無功而還若衆散于前敵乗于後非萬全計若留兵渡江車駕北還諸將亦將解體今燕北諸軍近遼陽者恐有異志宜先發兵渡江歛舟焚之絶其歸望然後陛下北還南北皆指日而定矣海陵然之明日遂趨揚州過烏江縣觀項羽祠歎曰如此英雄不得天下誠可惜也海陵至揚州使符寳耶律摩多䕶神果軍扼淮渡凡自軍中還至淮上無都督府文字皆殺之乃出内箭飾以金龍題曰御箭繫帛書其上使人乗舟射之南岸其書言宋國遣人焚毁南京宫室及沿邊買馬招誘軍民今興師問罪義在弔伐大軍所至必無秋毫之犯以此招諭宋人于是宋將王權亦縦所獲金軍士三人齎書數海陵罪通奏其書即命焚之海陵怒亟欲渡江驍騎果桑欲誘其黨以亡事覺命衆刃剉之乃下令軍士亡者殺其富埓琿富埒琿亡者殺其穆昆穆昆亡者殺其明安明安亡者殺其總管由是軍士益危懼甲午令軍中運鴉鶻船及糧船于𤓰州渡期以明日渡江敢後者死乙未完顔元宜等以兵犯御營海陵遇弑都督府以南伐之計皆通等贊成之圖克坦永年乃其姻戚郭安國衆所共惡皆殺之大定二年削通官爵人心始快馬欽幼名韓哥甞仕江南故能知江南道路正隆三年海陵將南伐遂召用欽自貴徳縣令為右補闕欽為人輕脱不識大體海陵每召見與語欽出宫輒以語人曰上與我論某事將行之矣其視海陵如僚友然累遷國子司業海陵至和州欲遣富埒琿渡江富埒琿言舟小不可濟海陵使人召欽先戒左右曰欽若言舟小不可渡江即殺之欽至問曰此舟可渡江否欽曰臣得栰亦可渡也大定二年除名是日起前翰林待制大頴為秘書丞頴在正隆間甞言山東盜賊海陵惡其言杖之除名世宗嘉頴忠直惡欽巧佞故復用頴而放欽焉髙懐貞為尚書省令史素與海陵狎昵海陵乆蓄不臣之心甞與懐貞各言所志海陵曰吾志有三國家大事皆自我出一也帥師伐國執其君長問罪于前二也得天下絶色而妻之三也由是小人佞夫皆知其志争進諛説大定縣丞張忠輔謂海陵言夢公與帝擊毬公乗馬衝過之帝墜馬下海陵聞之大喜㑹熈宗在位乆委政大臣海陵以近屬為宰相専威福柄遂成弑逆之計皆懐貞輩小人従臾導之海陵簒立以懐貞為修起居注懐貞故父濵州刺史贈中奉大夫懐貞累遷禮部侍郎大定二年降奉政大夫放歸田里五年與許霖俱賜起復懐貞為定國軍節度使上戒之曰汝等在正隆時姦佞貪私物論鄙之朕念沒身不齒則無以自新若怙舊不悛必不貸汝矣蕭裕本名揚珠奚人初以明安居中京海陵為中京留守與裕相結每與論天下事裕揣海陵有覬覦心密謂海陵曰留守先太師太祖長子徳望如此人心天意宜有所屬誠有志學大事願竭力以從海陵喜受之遂與謀議海陵竟成弑逆之謀者裕啟之也海陵為左丞除裕兵部侍郎改同知南京留守事改北京海陵領行臺尚書省事道過北京謂裕曰我欲就河南兵建立位號先定兩河舉兵而北君為我結諸明安以應我定約而去海陵雖自良鄉召還不能如約遂弑熙宗簒立以裕為秘書監海陵心忌太宗諸子欲除之與裕宻謀裕傾險巧詐因構致太傅宗本秉徳等反狀海陵殺宗本唐古辯遣使殺秉徳宗懿及太宗子孫七十餘人秦王宗翰子孫三十餘人宗本已死裕乃求宗本門客蕭玉教以具欵反狀令作主名上變海陵既詔天下天下寃之海陵賞誅宗本功以裕為尚書左丞加儀同三司授明安賜錢二千萬馬四百匹牛四百頭羊四千口再閲月為平章政事監修國史舊制首相監修國史海陵以命裕謂裕曰太祖以神武受命豐功茂烈光於四海恐史官有遺逸故以命卿久之裕為右丞相兼中書令裕在相位任職用事頗専恣威福在已勢傾朝廷海陵倚信之他相仰成而已裕與高藥師善嘗以海陵宻語告藥師藥師以其言奏海陵且曰裕有怨望心海陵召裕戒諭之而不以為罪也或有言裕擅權者海陵以為忌裕者衆不之信又以為人見裕弟蕭祚為左副㸃檢妹夫耶律必埒哩為左衛将軍勢位相慿藉遂生忌嫉乃出祚為益都尹必埒哩為寧昌軍節度使以絶衆疑裕不知海陵意遽見出其親表補外不令己知之自是深念恐海陵疑己海陵弟太師兖領三省事共在相位以裕多自用頗防閑之裕乃謂海陵使兖備之也而海陵猜忍嗜殺裕恐及禍遂與前真定尹蕭豐嘉努前御史中丞蕭珠展博州同知約束裕女夫和勒博謀立亡遼豫王延禧之孫裕使親信蕭托諾往結西北路招討使蕭海呼海呼即懐忠懐忠依違未決謂托諾曰此大事汝歸遣一重人來裕乃使珠展往珠展前為中丞以罪免以此得詣懐忠懐忠問珠展與謀者復有何人珠展曰五院節度使耶律朗亦是也懐忠舊與朗有隙而珠展嘗上達蘭變事懐忠疑珠展反覆因執珠展收朗繋獄遣使上變約束亦與筆硯令史布達書使布達助裕以取富貴布達奏其書海陵信裕不疑謂布達構誣之命殺布達于市執布達出宣華門㸃檢圖克坦貞得蕭懐忠上變事入奏遇見布達問其故因止之圖克坦貞已奏變事以布達為請海陵遽使釋之海陵使宰相問裕裕即欵伏海陵甚驚愕猶未盡信引見裕問之裕曰大丈夫所為事至此又豈可諱海陵復問曰汝何怨於朕而作此事裕曰陛下凡事皆與臣議及除祚等乃不令臣知之領省國王每事謂臣専權頗有隄防恐是得陛下㫖意陛下與唐古辯及臣約同生死辯以强忍果敢致之死地臣皆知之恐不得死所以此謀反幸苟免耳太宗子孫無罪皆死臣手臣之死亦晚矣海陵復謂裕曰朕為天子若於汝有疑雖汝弟輩在朝豈不能施行以此疑我汝實錯誤太宗諸子豈獨在汝朕為國家計也又謂之曰自來與汝相好雖有此罪貸汝性命惟不得作宰相令汝終身守汝祖先墳壠裕曰臣子既犯如此罪逆何面目見天下人但願絞死以戒其餘不忠者海陵遂以刀刺左臂取血塗裕面謂之曰汝死之後當知朕本無疑汝心裕曰久䝉陛下非常眷遇仰戀徒切自知錯謬雖悔何及海陵哭送裕出門殺之并誅約索及豐嘉努豐嘉努妻豫王女也與其子榖皆與反謀并殺之遣護衛巴噶徃西北路招討司誅朗及珠展而托諾和勒博皆出走捕得托諾棄市和勒博自縊死托諾出走過河間少尹蕭之詳之詳初不知裕事留之三日托諾徃之詳徹珍家徹珍遣人詣之詳告公引得之付托諾遣之他所徹珍家奴發其事吏部侍郎沃辰鞫之之詳曰托諾宿二日而去法家以之詳隠其間欺尚書省罪當贖海陵怒命殺之杖沃辰及議法者徹珍杖四百死巴噶殺珠展等并殺無罪四人海陵不問杖之五十而已以裕等罪詔天下賞上變功懐忠遷樞宻副使以布逹為牌印云髙藥師遷起居注進階顯武將軍藥師嘗奏裕有怨望至是賞之云胥持國字秉鈞代州繁畤人經童出身累調博野縣丞上書者言民間冒占官地如太子務大王莊非私家所宜有部委持國按覈之持國還言此地自異代已為民有不可取也事遂寢尋授太子司倉轉掌飲令兼司倉皇太子識之擢祗應司令章宗即位除宫籍副監賜宫籍庫錢五十萬宅一區俄改同簽宣徽院事工部侍郎並領宫籍監閱三月遷工部尚書使宋明昌四年拜參知政事賜孫用康牓下進士第㑹河決陽武持國請督役遂行尚書省事明年進尚書右丞持國為人柔佞有智術初李妃起微賤得幸於上持國久在太子宫素知上好色陰以秘術干之又多賂遺妃左右用事人妃亦自嫌門第簿欲藉外廷為重乃數稱譽持國能由是大為上所信任與妃表裏筦擅朝政誅鄭王永蹈鎬王永中罷黜完顔守貞等事皆起於李妃持國士之好利躁進者皆趨走其門下四方為之語曰經童作相監婢為妃惡其卑賤庸鄙也承安三年御史臺劾奏右司諫張復亨右拾遺張嘉貞同知安豐軍節度使事趙慪同知定海軍節度使事張光庭戸部主事髙元甫刑部員外郎張巖叟尚書省令史傅汝梅張翰裴元郭乳皆趨走權門人戲謂胥門十哲復亨嘉貞尤卑佞苟進不稱諫職俱宜黜罷奏可於是持國以通奉大夫致仕嘉貞等皆補外頃之起知大名府事未行改樞宻副使佐樞宻使襄治軍於北京一日上召翰林修撰路鐸問以他事因語及董師中張萬公優劣鐸曰師中附胥持國進持國姦邪小人不宜典軍馬以臣度之不惟不允人望亦必不能服軍心若囘日再相必亂天下上曰人臣進退人難人君進退人易朕豈以此人復為相耶第遷官二階使之致仕耳尋卒于軍謚曰通敏後上問平章政事張萬公曰持國今已死其為人竟何如萬公對曰持國素行不純謹如貨酒樂平樓一事可知矣上曰此亦非好利如馬琪位參政私鬻省醖乃為好利也子鼎别有傳金史卷一百二十九
