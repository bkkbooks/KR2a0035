body:
  text: 金史卷一百十四元中書右丞相總裁托克托等修列傳第五十二白華錫黙愛實哈昭附舒穆嚕世勣白華字文舉澳州人貞祐三年進士初為應奉翰林文字正大元年累遷為樞宻院經歴官二年四月武仙以真定來歸朝廷方經理河北宋將彭義斌乘之遂由山東取邢洺磁等州華上奏曰北兵有事河西故我獨少寛今彭義斌招降河朔郡縣駸駸及於真定宜及此大舉以除後患時院官不欲行即遣華相視彰徳實擠之也事竟不行三年五月宋人掠壽州永州桃園軍失利死者四百餘人時夏全自楚州來奔十一月庚申集百官議和宋上問全所以來華奏全初在盱眙從宋帥劉卓往楚州州人訛言劉大帥來欲屠城中北人耳衆軍怒殺卓以城來歸全終不自安跳走盱眙盱眙不納城下索妻拏又不從計無所出乃狼狽而北只求自免無他慮也華因是為上所知全至後旴􅇇楚州王義深張惠范成進相繼以城降詔改楚州為平淮府以全為金源郡王平淮府都總管惠臨淄郡王義深東平郡王成進膠西郡王和宋議寢四年李全據楚州衆皆謂盱眙不可守上不從乃以淮南王招全全曰王義深范成進皆我部曲而受王封何以處我竟不至是嵗慶善努敗績於龜山五年秋増築歸徳城擬工數百萬宰相奏遣華往相役華見行院斡色辛語以民勞朝廷愛養之意減工三之一斡色李辛賜姓也六年以華權樞宻院判官上召忠孝軍總領富察鼎珠經歴王仲澤户部郎中刁璧及華諭之曰李全據有楚州睥睨山東久必為患今北事稍緩合乘此隙令鼎珠權監軍率所統軍一千别遣都尉司步軍萬人以璧仲澤為參謀同往沂海界招之不従則以軍馬從事卿等以為何如華對曰臣以為李全借大兵之勢要宋人供給餽餉特一滑宼耳老狐穴塚待夜而出何足介懷我所慮者北方之強耳今北方有事未暇南圖一旦事定必來攻矣與我爭天下者此也全何預焉若北方事定全將聴命不暇設不自量更有非望天下之人寧不知逆順其肯去順而從逆乎為今計者姑養士馬以備北方使全果有不軌之謀亦當𤼵於北朝息兵之日當此則我易與矣上沉思良久曰卿等且退容我更思明日遣鼎珠還屯尉氏時陜西兵大勢已去留托和倫駐慶陽以擾河朔且有攻河中之耗而衛州帥府與恒山公府竝立慮一旦有警節制不一欲合二府為一又恐其不和命華往經畫之初華在院屢承面諭云汝為院官不以軍馬責汝汝辭辯特以喀齊喀布哈皆武夫一語不相入便為齟齬害事非細以汝調停之或有乖忤罪及汝矣院中事當一一奏我汝之職也今衛州之委亦前日調停之意國制凡樞宻院上下所倚任者名奏事官其目有三一曰承受聖旨二曰奏事三曰省院議事皆以一人主之承受聖旨者凡院官奏事或上處分獨召奏事官付之多至一二百言或直傳上旨辭多者即與近侍局官批寫奏事者謂事有區處當取奏裁者殿奏其奏每嫌辭費必欲言簡而意明退而奉行即立文字謂之檢目省院官殿上議事則黙記之議定歸院亦立檢目呈覆有疑則復稟無則付掾吏施行其赴省議者議既定留奏事官與省左右司官同立奏草圓覆諸相無異同則右司奏上此三者之外又有難者曰僃顧問如軍馬糧草器械軍帥部曲名數與夫屯駐地里阨塞逺近之類凡省院一切事務顧問之際一不能應輙以不用心被譴其職為甚難故以華處之二月以丞相薩布行尚書省事於闗中布哈率完顔陳和尚忠孝軍一千駐邠州且令審觀北勢如是兩月上謂白華曰汝往邠州六日可往復否華自量日可馳三百應之曰可上令宻諭布哈纔候春首當事慶陽華如期而還上一日顧謂華言我見汝從來凡語及征進必有難色今此一舉特鋭於平時何也華曰向日用兵以南征及討李全之事梗之不能專意北方故以北向為難今日異於平時況事至於此不得不一舉大軍入界已三百餘里若縱之令下秦川則何以救終當一戰摧之與其戰於近裏之平川不若戰於近邊之險隘上亦以為然七年正月慶陽圍解大軍還白華上奏凡今之計兵食為急除宻院已定忠孝軍及馬軍都尉司步軍足為一戰之資此外應河南府州亦須簽㨂防城軍秋聚春放依古務農講武之義各令防本州府城以今見在九十七萬無致他日為資敵之用五月華真授樞宻判官上遣近侍局副使齊錦傳旨云朕用汝為院官非責汝將兵對壘第欲汝立軍中綱紀發遣文移和睦將帥䆒察非違至於軍伍之閲習器仗之修整皆汝所職其悉力國家以稱朕意八年大軍自去嵗入陜西翺翔京兆同華之間破南山砦柵六十餘所已而攻鳯翔金軍自閿鄉屯至澠池兩行省晏然不動宰相臺諫皆以樞院瞻望逼遛為言京兆士庻横議蜂起以至諸相力奏上前上曰哈達布哈必相度机㑹可進而進耳若督之使戰終出勉強恐無益而反害也因遣華與右司郎中𤓰爾佳巴喇瑪道宰相百官所言并問以目今二月過半有怠歸之形諸軍何故不動且詔華等往復六日華等既到同諭兩行省以上意哈達言不見機㑹見則動耳布哈曰彼軍絶無糧餉使欲戰不得欲留不能將自敝矣哈達對布哈及諸帥則言不可動見士大夫則言可動人謂哈達近嘗得罪又謂布哈方得君不敢與抗而亦言不可動華等觀二相見北兵勢大皆有懼心遂私問樊澤鼎珠陳和尚以為何如三人者皆曰他人言北兵疲困故可攻此言非也大兵所在豈可輕料是真不敢動華等還以二相及諸將意奏之上曰我固知其怯不敢動矣即復遣華傳旨諭二相云鳯翔圍久恐守者力不能支行省當領軍出闗宿華隂界次日及華隂次日及華州畧與渭北軍交手計大兵聞之必當奔赴且以少紓鳯翔之急我亦得為掣肘計耳二相廻奏領旨華東還及中牟已有兩行省納奏人追及華取報密院副本讀之言領旨提軍出闗二十里至華隂界與渭北軍交是晩收軍入闗華為之仰天浩歎曰事至於此無如之何矣華至京奏章已達知所奏為徒然不二三日鳯翔陷兩行省遂棄京兆與約赫徳起遷居民於河南留慶善努守之夏五月楊妙真以夫李全死於宋構浮橋於楚州北就北帥蘇埒呼圖哩乞師復讐朝廷覘知之以謂北軍果能渡淮淮與河南跬歩間耳遣哈達布哈駐軍桃源界滶河口僃之兩行省乃約宋帥趙范趙葵為夾攻之計二趙亦遣人報聘俱以議和為名以張聲勢二相屢以軍少為言而省院難之因上奏云向來附闗屯駐半年適還舊屯喘不及息又欲以暑月東行實無可圖之事徒自疲而已況兼桃源青口蚊虻湫濕之地不便牧養目今非征進時月決不敢妄動且我之所慮特楚州浮梁耳姑以計圖之已遣提控王鋭往視可否奏上上遣白華以此傳諭二相兼領王鋭行二相不悦布哈遣水軍虹縣所屯王提控者以小船二十四隻令華順河而下必到八里莊城門為期且曰此中望八里莊如在雲間天上省院端坐徒事口吻今樞判親來可以相視可否歸而奏之華力辭不獲遂登舟及淮與河合流處纔及八里莊城門相直城守者以白鷂大船五十沂流而上占其上流以截華歸路華㡬不得還昏黑得徑先歸乃悟兩省怒朝省不益軍謂皆華輩主之故擠之險地耳是夜二更後八里莊次將遣人送款云早者主將出城開船截大金歸路某等商議主將還閉門不納渠即就奔去楚州乞𤼵軍馬接應二相即𤼵兵騎開船赴約明旦入城安慰又知楚州大軍已還河朔宋將燒浮橋二相附華納奏上大喜初哈達謀取宋淮隂五月渡淮淮隂主者胡路鈐往楚州計事於楊妙真比還提正官郭恩送款於金胡還不納慟哭而去哈達遂入淮隂詔改歸州以行省烏庫哩雅爾噶守之郭恩為元帥右都監既而宋人以銀絹五萬兩匹來贖盱眙龜山宋使留館中郭恩謀刼而取之或報之於盱眙帥府即以軍至恩不果發明日宋將劉虎湯孝信以船三十艘燒浮梁因遣其將夏友諒來攻盱眙未下泗州總領完顔實格利館中䬶絹遂反防禦使圖克坦達喇聞變扼罘山亭甬路好謂之曰容我拜辭朝廷然後死遂取朝服望闕拜慟良久投亭下水死實格遂以州歸楊妙真總帥納哈塔邁珠亦以盱眙降宋九月陜西行省防秋時大兵在河中睿宗已領兵入界慶善努力糧盡將棄京兆而東一日白華奏偵候得睿宗所領軍馬四萬行營軍一萬布置如此為今計者與其就漢禦之諸軍比到可行半月不若徑往河中目今㳂河屯守一日可渡如此中得利襄漢軍馬必當遲疑不進在北為投機在南為掣肘臣以為如此便上曰此䇿汝畫之為得之他人華曰臣愚見如此上平日鋭於武事聞華言若欣快者然竟不行未㡬哈達自陜州進奏帖亦為此事上得奏甚喜布哈時在洛陽驛召之葢有意於此矣布哈至奏對之間不及此止言大兵前鋒特黙岱統之將出冷水谷口且當先禦此軍上曰朕不問此只欲問河中可擣否布哈不獲已始言睿宗所領兵騎雖多計皆冗雜大兵軍少而精無非選鋒金軍北渡大兵必遣輜重屯於平陽之北匿其選鋒百里之外放我師渡然後斷我歸路與我決戰恐不得利上曰朕料汝如此果然更不須再論且還陜州布哈曰哈達樞宻使所言此間一面革撥恐亦未盡乞召至同議可否上曰見得哈達亦止此而已往復遲滯轉致誤事華奏哈達必見機㑹召至同議為便副樞持嘉喀齊喀亦奏布哈白華言為是上乃從之召哈達至上令先與密院議定然後入見既議華執哈達奏帖舉似再三竟無一先𤼵言者移時布哈言且勾當冷水谷一軍何如哈達曰是矣遂入見上間卿等所議若何哈達敷奏甚多大槩言河中之事與前日上奏時勢不同所奏亦不敢自主議遂寢二相還陜量以軍馬出冷水谷奉行故事而已十二月河中府破開興元年京城被攻四月兵退改元天興是月十六日併樞密院歸尚書省以宰相兼院官左右司首領官兼經歴官惟平章博索副樞喀齊喀院判白華權院判完顔呼喇勒罷呼喇勒有口辯上愛幸之朝議罪呼喇勒而書生輩妬華得君先嘗以語撼之用是而罷金制樞密院雖主兵而節制在尚書省兵興以來兹制漸改凡在軍事省官不得預院官獨任專見往往敗事言者多以為將相權不當分至是始併之十二月朔上遣近侍局提㸃伊喇寧古即白華所居問事勢至於此計將安出華附奏入耕稼已廢糧斛將盡四外援兵皆不可指擬車駕當出就外兵可留皇兄荆王使之監國任其裁處聖主既出遣使告語北朝我出非他處收整軍馬止以軍卒擅誅唐慶和議從此斷絶京師今付之荆王乞我一二州以老耳如此則太后皇族可存正如春秋紀季入齊為附庸之事聖主亦得少寛矣於是起華為右司郎中初新廵之計決諸將皆預其議將退首領官張衮聶天驥奏尚有舊人諳練軍務者乃置而不用今所用者皆不見軍中事體此為未盡上問未用者何人皆曰院判白華上頷之故有是命明日召華諭之曰親廵之計已決但所往羣議未定有言歸徳四面背水可以自保者或言可㳂西山入鄧或言設欲入鄧大將蘓布特今在汝州不如取陳蔡路轉往鄧下卿以為何如華曰歸徳城雖堅久而食盡坐以待斃決不可往欲往鄧下既汝州有蘇布特斷不能往以今日事勢博徒所謂孤注者也孤注云者止有背城之戰為今之計當直赴汝州為之一决有楚則無漢有漢則無楚汝州戰不如半塗戰半塗戰又不如出城戰所以然者何我軍食力猶在馬則豆力猶在若出京益逺軍食日減馬食野草事亦難矣若我軍便得戰存亡決此一舉外則可以激三軍之氣内則可以慰都人之心或止為避遷之計人心顧戀家業未必毅然從行可詳審之遂召諸相及首領官同議哈薩喇烏達布元帥珠爾髙顯王義深俱主歸徳之議丞相薩布主鄧議竟不能決明日制旨京城食盡今擬親出聚集軍士於大慶殿諭以此意諭訖諸帥將佐合辭奏曰聖主不可親出止可命將三軍欣然願為國家効死上猶豫欲以官努為馬軍帥髙顯為歩軍帥劉益副之葢採輿議也而三人者亦欲奉命權叅政内族恩楚大罵云汝輩把鋤不知髙下國家大事敢易承邪衆黙然惟官努曰若將相可了何至使我輩事亦中止明日民間閧傳車駕欲奉皇太后及妃后往歸徳軍士家屬留後目今食盡坐視城中俱餓死矣縱能至歸徳軍馬所費支吾復得㡬許日上聞之召薩布哈昭恩楚烏克遜布希完顔正大議餘人不預移時方出見首領官丞相言前日廵守之議已定止為一白華都改却今往汝州就軍馬索戰去矣遂擇日祭太廟誓師擬以二十五日啓行是月晦車駕至黄陵岡復有北幸之議語在博索傳天興二年正月朔上次黄陵岡就歸徳餫船北渡諸相共奏京師及河南諸州聞上幸河北恐生他變可下詔安撫之是時所在父老僧道獻食及牛酒犒軍者相屬上親為拊慰人人為之感泣乃赦河朔招集兵糧赦文條畫十餘款分道傳送二日或云昨所發河南詔書儻落大軍中柰泄事機何上怒委近侍局官傳旨謂首領官張衮白華内族額爾克當發詔時不為後慮皆量決之是時衛州軍兩日至蒲城而大軍徐躡其後十五日宰相諸帥共議上前郎中完顔呼喇勒秉筆書某軍前鋒某軍殿後餘事皆有條畫書畢惟不言所往華私問呼喇勒托以不知是晩平章及諸帥還蒲城軍中夜半額爾克衮就華帳中呼華云上已登舟君不知耶華問其由額爾克云我昨已知上意欲與李左丞完顔郎中先下歸徳令諸軍竝北岸行至鳯池渡河今夜平章及哈薩喇元帥官努等來言大軍在蒲城曾與金軍接戰勢莫能支遂擁主上登舟軍資一切委棄止令忠孝軍上船馬悉留營中計舟已行數里矣華又問公何不從往云昨日擬定首領官上令呼喇勒登舟餘悉隨軍用是不敢是夜總帥拜扎領諸軍舟往鳯池大軍覺之兵遂潰上在歸徳三月崔立以汴京降右宣徽提點近侍局伊喇寧古謀之鄧上不聽時寧古之兄瑗為鄧州節度使兼行樞密院事其子與寧古之子竝從駕為衛士適朝廷將召鄧兵入援寧古因與華謀同之鄧且拉其二子以往上覺之獨命華行而寧古改之徐州華既至鄧以事久不濟淹留於館遂若無意於世者㑹瑗以鄧入宋華亦從至襄陽宋署為制斡又改均州提督後范用吉殺均之長吏送款於北朝遂因而北歸士大夫以華夙儒貴顯國危不能以義自處為貶云用吉者本姓富珠哩名玖珠初歸入宋謁制置趙范將以計動其心故更姓名范用吉趙怒其觸諱斥之用吉猶應對如故趙良久方悟且利其事與己符遂擢置左右凡所言動畧不加疑遂易其姓曰花使為太尉改鎮均州未㡬納欵於北後以家人誣以欲叛為同列所害贊曰白華以儒者習吏事以經生知兵其所論建屢中事機然三軍敗衂之餘士氣不作其言果可行乎從瑗歸宋聲名掃地而猶得列於金臣之傳者援蜀譙周等例云錫默愛實字正之策論進士也正大間累官翰林直學士兼左司郎中天興元年正月聞大兵將至以㸃檢𤓰爾佳薩哈為總帥率歩騎三萬廵河渡命宿直將軍内族長樂權近侍局使監其軍行至封丘而還入自梁門樞密副使喀齊喀遇之笑語薩哈曰吾言信矣當為我作主人葢世俗酬謝之意也明日大兵遂合朝廷不問於是愛實上言曰薩哈統兵三萬本欲乗大兵逺至喘息未定而擊之出京纔數十里不逢一人騎已畏縮不敢進設遇大兵其肯用命乎乞斬二人以肅軍政不報葢喀齊喀輩以京師倚此一軍為命不敢俾之出戰特以外議閧然故暫出以應之云衛紹鎬厲二王家屬皆以兵防䕶且設官提控廵警之嚴過於獄犴至是衛紹宅四十年鎬厲宅二十年正大間朝臣屢有言及者不報愛實乃上言曰二族衰微無異匹庻假欲為不善孰與同惡男女婚嫁人之大欲豈有幽囚終世永無伉儷之望在他人尚且不忍況骨肉乎哀宗感其言始聴自便未㡬有青城之難愛實憤時相非其人嘗歴數曰平章博索固權市恩擊丸外百無一能丞相薩布菽麥不分更謂乏材亦不至此人為相叅政兼樞宻副使特嘉喀齊喀麤暴一馬軍之材止矣乃兼將相之權右丞延扎舒嚕居相位已七八年碌碌無補備員而已患難之際倚注此類欲冀中興難矣於是舒嚕罷相薩布乞致仕而博索哈齊喀不恤也是年四月京城罷攻大兵退既而以害唐慶和議遂絶於是再簽民兵為守禦備八月括京城粟以轉運使完顔珠赫張俊民伊喇克忠等置局以推舉為名珠赫諭民曰汝等當從實推唱果如一旦糧盡令汝妻子作軍食復能吝否既而罷括粟令復以進獻取之前御史大夫内族哈昭復冀進用建言京城括粟可得百餘萬石朝廷信之命權參知政事與左丞李蹊總其事先令各家自實壯者存石有三斗幼者半之仍書其數門首敢有匿者以升斗論罪京城三十六坊各選深刻者主之内族完顔玖珠尤酷暴有寡婦二口實豆六斗内有蓬子約三升玖珠笑曰吾得之矣執而以令於衆婦泣訢曰妾夫死於兵姑老不能為養故雜蓬粃以自食耳非敢以為軍儲也且三斗六升之餘不從竟死帳下京城聞之股栗盡投其餘於糞溷中或白李蹊蹊頻蹙曰白之參政其人即白哈昭哈昭曰人云花又不損宻又得成予謂花不損何由成蜜且京師危急今欲存社稷耶存百姓耶當時皆莫敢言愛實遂上奏大槩言罷括粟則改虐政為仁政散怨氣為和氣不報時所括不能三萬斛而京城益蕭然矣自是之後死者相枕貧富束手待斃而已上聞之命出太倉米作粥以食餓者愛實聞之歎曰與其食之寧如勿奪為奉御博諾所告又近侍干預朝政愛實上章諫曰今近侍權太重將相大臣不敢與之相抗自古僕御之臣不過供給指使而已雖名僕臣亦必選揀正人今不論賢否惟以世胄或吏員為之夫給使令之材使預社稷大計此輩果何所知乎章既上近侍數人泣訢上前曰愛實以臣等為奴隸置至尊何地耶上益怒送有司近侍局副使李大節從容開釋乃赦之出為中京留守後不知所終哈昭者一名永錫貞祐中為元帥左監軍失援中都宣宗削除官爵杖之八十已而復用四年以御史大夫權尚書右丞總兵陜西哈昭留澠池數日進及京兆而大兵已至哈昭竟不出兵遂失潼闗有司以敵至不出兵當斬諸皇族百餘人上章救之上曰向哈昭救中都未至而軍潰使宗廟山陵失守罪當誅朕特寛貸以全其命尋復重職今鎮陜西所犯乃爾國家大法豈敢私耶遂再奪爵免死除名至是為參知政事性好作詩詞語鄙俚人采其語以為戲笑因自草括粟榜文有雀無翅兒不飛蛇無頭而不行等語以而作兒掾吏知之不敢易也京城目之曰雀兒參政哀宗用而不悟竟致敗事舒穆嚕世勣字景畧幼勤學為文有體裁承安二年以父元毅死王事收充擎執五年登詞賦經義南科進士第貞祐三年累官太常丞預講議所事時朝廷徙河北軍户河南宰職議給以田世勣上言曰荒閑之田及牧馬地其始耕墾費力當倍一嵗斷不能熟若奪民素蒔者與之則民將失所且啟不和之端况軍户率無耕牛雖或有之而廩給未敢遽減彼既南來所捐田宅為人所有一旦北歸能無爭奪切謂冝令軍户分人歸守本業收其晩禾至春復還為固守計㑹侍御史劉元規亦言給田不便上大悟乃罷之未㡬遷同知金安軍節度使興定二年選為華州元帥府參議官初右都監完顔哈達行帥府於楨州嘗以前同知平涼府事珠勒呼富聶遜為參議及移駐華州陜西行省議復用富聶遜令世勣副之上曰富聶遜但能承奉人耳餘無所長非如世勣可任以事華為要鎮而輕用其人或致敗事遂獨用世勣焉尋入為尚書省左司郎中元光元年奪一官解職初世勣任華州有薦其深通錢穀者覆察不如所舉未藉行止中後主者舉覺平章英王以世勣避都司之繁私屬治籍吏冀改他職奏下有司故有是責久之起為禮部侍郎轉司農改太常卿正大中為禮部尚書兼翰林院侍講學士天興元年哀宗將北渡世勣率朝官劉肅田芝等二十人求見仁安殿上問卿等欲何言世勣曰臣等聞陛下欲親出切謂此行不便上曰我不出軍分為二一軍守一軍出戰我出則軍合為一世勣曰陛下出則軍分為三一守一戰一中軍䕶從不若不出為愈也上曰卿等不知我若得完顔仲徳恒山公武仙付之兵事何勞我出我豈不知今日將兵者官努統馬兵三百止矣劉益將歩兵五千止矣欲不自將得乎上又指御榻曰我此行豈復有還期但恨我無罪亡國耳我未嘗奢侈未嘗信任小人世勣應聲曰陛下用小人則亦有之上曰小人謂誰世勣歴數曰伊喇寧古温都察遜烏色完顔長樂皆小人也陛下不知其為小人所以用之肅與世勣復多有言良久君臣涕泣而别初肅等求見本欲數此四人至是世勣獨言之於是哀宗以世勣從行自蒲城至歸徳明年六月走蔡州次新蔡縣之姜寨世勣子嵩時為縣令拜上於馬前兵亂後父子始相見上嘉之授嵩應奉翰林文字以便養親蔡城破父子俱死嵩字企隆興定二年經義進士贊曰愛實言衛鎬家屬禁錮之虐京城括粟之暴近侍干政之横世勣言河北軍户給田之不便親出渡河之非計皆藥石之言也然金至斯時病在膏肓間矣倉扁何施焉其為忠讜則不可廢也金史卷一百十四
