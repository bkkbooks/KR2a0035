body:
  text: 金史卷一百二十四元中書右丞相總裁托克托等修列傳第六十二忠義四馬慶祥本名蘇爾濟蘇胥謙等附商衡珠嘉托羅海楊達夫馮延登烏克遜仲端本名布希烏克遜納新費摩阿固岱等附富察琦蔡巴爾毛佺等附温都察遜納塔和碩台附完顔經實畢資倫郭哈瑪爾馬慶祥字瑞寧本名蘇爾濟蘇先世自西域入居臨洮狄道以馬爲氏後徙家淨州天山泰和中試補尚書省譯史大安初衞王始通問大元選使副上曰蘇爾濟蘓智辯通六國語徃必無辱也使還授開封府判官内城之役充應辦使不擾而事集未幾大元兵出陜右朝廷命完顔仲元為鳯翔元帥舉慶祥為副上曰此朕志也且築城有勞即拜鳯翔府路兵馬都總管判官元光元年冬十一月聞大將䝉古布哈將攻鳯翔行省檄慶祥與治中胥謙分道清野將行命畫工肖其貌付其家人或曰君方壯何乃為此不祥慶祥曰非汝所知也明日遂行遇先鋒于澮水戰不利且行且戰將及城㑹大兵邀其歸路度不能脱令其騎曰吾屬荷國厚恩竭力効死乃其職也諸騎皆曰諾人殊死戰良乆矢盡大兵圍數匝欲降之軍擁以行語言徃復竟不屈而死年四十有六元帥郭仲元輿其尸以歸𦵏鳯翔普門寺之東事聞詔贈輔國上將軍恒州刺史謚忠愍胥謙及其子嗣亨亦不屈死謙贈輔國上將軍彰化軍節度使嗣亨贈威逺將軍鳯翔府判官楨州金勝堡提控布薩和碩亦死贈銀青榮禄大夫正大二年哀宗詔褒死節士若馬蘇爾濟蘇王清田榮李貴王斌馮萬努張徳威髙行中程濟姫玘張山等十有三人為立褒忠廟仍録其孤二人者逸其名餘無所考商衡字平叔曹州人至寧元年特恩第一人授鄜州洛郊主簿以亷能換郿縣尋辟威戍令興定三年嵗饑民無所於糴衡白行省得開倉賑貸全活者甚衆後因地震城圯夏人乗釁入侵衡率畨部土豪守禦應敵保以無虞秩滿縣人為立生祠再辟原武令未幾入為尚書省令史轉户部主事兩月拜監察御史哀宗姨鄜國夫人不時出入宫闈干預政事聲跡甚惡衡上章極言自是郕國被召乃敢進見内族慶善努將兵守盱眙與李全戰敗朝廷置而不問衡上言自古敗軍之将必正典刑不爾則無以謝天下詔降慶善努為定國軍節度使戸部侍郎權尚書曹温之女在掖庭親舊干預權利其家人填委諸司貪墨彰露臺臣無敢言者衡歴數其罪詔罷温户部改太后府衞尉再上章言温果可罪當貶逐無罪則臣為妄言豈有是非不别而兩可之理哀宗為之動容乃出温為汝州防禦使未幾為右司都事改同知河平軍節度使未赴改樞密院經歴官遙領昌武軍同知節度使事丞相完顔薩布領陜西行省奏衡為左右司員外郎密院表留有㫖行省地重急於得人可從丞相奏明年召還行省再奏留之正大八年以母喪還京師十月起復為秦藍總帥府經歴官天興元年二月關陜行省圖克坦烏登等敗於鐡嶺衡未知諸帥存殁招集潰軍以須其至遂為兵士所得欲降之不屈監至長水縣東岳祠前誘之使招洛陽衡曰我洛陽識何人為汝招之耶兵知不可誘欲捽其巾衡瞋目大呼曰汝欲脅從我耶終不肯降望闕瞻拜曰主將無狀亡兵失利臣之罪責亦無所􅏉但以一死報國耳遂引佩刀自剄年四十有六正大初河間許古詣闕拜章言八座率非其材省寺小臣有可任宰相者不大升黜之則無以致中興章奏詔古赴都堂問孰為可相者許以衡對則衡之材可知矣珠嘉托羅海上京人世為北京路部長其先有開國功授北京路蘇克棟阿明安托羅海自幼襲爵貞祐二年宣宗遷汴率本部兵赴中都扈從上喜特授御前馬歩軍都總領宋人畧南鄙命同簽樞密院事時全將大軍南伐托羅海率本部屢摧宋兵破城寨以功遙授武昌軍節度使元帥右都監行蔡息等路元帥府事既而宋人有因畜牧越境者邏卒擒之法當械送朝廷托羅海曰國家自遷都以來境土日蹙民力彫耗幸邊無事人稍得息若戮此曹則邊釁復生兵連禍結矣不如釋之以絶兵端哀宗即位授鎮南軍節度使蔡州管内觀察使行户工部尚書時大元兵入陜西乃上章曰宋人與我為讐敵頃以力屈自保非其本心今陜西被兵河南出師轉戰連年不絶兵死于陣民疲于役國力竭矣壽泗一帶南接盱楚紅襖賊李全巢穴也萬一宋人諜知與全乗虛而入腹背受敵非計之得者也臣已令所部沿邊警斥以備非常宜帥壽泗帥臣謹斥候嚴烽燧常若敵至此兵法所以無恃其不來恃吾有以待之之道也上從之正大二年秋傳言宋人將入侵農司令民先期刈禾托羅海曰夫民所恃以仰事俯育及供億國家者秋成而已今使秋無所獲國何以仰民何以給遂遣軍廵邏聽民待熟而刈宋人卒不入冦諜者又報光州汪太尉將以八月發兵來取真陽議者請籍丁男以備托羅海曰汪太尉恇怯人耳寧敢為此必姦人聲言來宼欲使吾民廢務也不可信已而果然叛人焦風子者㳂河南北屢為反覆朝廷授以提控之職令將三千人戍遂平四年春風子謀率其衆入宋托羅海䇿之以兵數千伏鄱陽道賊果夜出此途伏發殪之七年大元兵攻藍關至八渡倉而退朝皆賀以為無事托羅海獨言曰潼關險隘兵精足用然商洛以南瀕於宋境大山重􅃨宋人不知守國家亦不能逾宋境屯戍大兵若由散闗入興元下金房繞出襄漢北入鄧鄙則大事去矣宜與宋人釋怨諭以輔車之勢唇亡齒寒彼必見從據其險要以備不然必敗是秋改授小關子元帥屯商州大吉口天興元年春從行省參政圖克坦烏登將潼關兵入援至商山遇雪大兵邀擊之士卒飢凍不能戰而潰托羅海被執不屈㧞佩刀自殺楊達夫字晉卿耀州三原人泰和三年進士有才幹所至可紀召補省掾草奏章坐字誤降平涼府判官嘗主鄠縣簿事一從簡吏民樂之達夫亦愛其山水之勝因家焉日以詩酒自娯了無宦情㑹有詔徙民東入關達夫與衆行及韶避兵于州北之横嶺為游騎所執將禠衣害之達夫挺然直立馬首畧無所懼稍侵辱之即大言曰我金國臣子既為汝所執不過一死忍裸袒以黷天日耶遂見殺兩山潛伏之民竊觀之者皆相告曰若此好官異日祠之當作我横嶺之神馮延登字子駿吉州吉鄉人世業醫延登幼頴悟既長事舉業承安二年登詞賦進士第調臨真簿徳順州軍事判官泰和元年轉寧邉令大安元年秋七月雹害稼民艱于食延登發粟賑貸全活甚衆貞祐二月補尚書省令史尋授河中府判官兼行尚書省左右司員外郎興定五年入為國史院編修官改太常博士元光二年知登聞鼓院兼翰林修撰奉使夏國就充接送伴使正大七年十二月遷國子祭酒假翰林學士承㫖充國信使以八年春奉國書朝見於虢縣御營有司問汝識鳯翔帥否對曰識之又曰何如人曰敏於事者也又問汝能招之使降即貰汝死不則殺汝矣曰臣奉書請和招降豈使職乎招降亦死還朝亦死不若今日即死為愈也明日復問汝曽思之不對如前問至再三執義不回又明日乃喻㫖曰汝罪應死但古無殺使者理汝愛汝須髯猶汝命也叱左右以刀截去之延登岸然不動乃監之豐州二年後放還哀宗撫慰乆之復以為祭酒歴禮吏二部侍郎權刑部尚書明年大元兵圍汴京倉猝􅏉難為騎兵所得欲擁而北行延登辭情慷慨義不受辱遂躍城旁井中年五十八烏克遜仲端本名布希字子正承安二年策謫進士宣宗時累官禮部侍郎與翰林待制安延珍奉使乞和于大元謁見太師國王穆呼哩於是安延珍留止仲端獨徃並大夏渉流沙踰葱嶺至西域進見太祖皇帝致其使事乃還自興定四年七月啓行明年十二月還至朝廷嘉其有奉使勞進官兩階延珍進一階歴裕州刺史正大元年召為御史中丞奉詔安撫陜西及歸權參知政事正大五年十二月知開封府事完顔莽伊蘇吏部郎中楊居仁以奉使不職尚書省具獄有㫖釋之備再使仲端言曰莽伊蘇等辱君命失臣節大不敬宜償禮幣誅之奏上莽伊蘇等免死除名㑹議降大軍事及諍太后奉佛渉亡家敗國之語上怒貶同州節度使哀宗將遷歸德召為翰林學士承㫖兼同簽大睦親府事留守汴京及大元兵圍汴日乆食盡諸將不相統一仲端自度汴中事變不測一日與同年仲州防禦費摩思忠小飲談太學同舍事以為笑樂因數言人死亦易事耳思忠曰吾兄何故頻出此語仲端因寫一詩示之其詩大槩謂人生大似巢燕或在華屋杏梁或在村居茅茨及秋社甫臨皆當逝去人生雖有富貴貧賤不同要之終有一死耳書畢連飲數杯送思忠出門曰此别終天矣思忠去仲端即自縊其妻亦從死明日崔立變仲端為人樂易寛厚知大體奉公好善獨得士譽一子名愛實嘗為䕶尉奉御以誅官努功授節度世襲千户思忠名正之本名富拉塔亦承安二年進士烏克遜納新字道逺由譯史入官性伉特敢為有直氣嘗為監察御史時中丞完顔伯嘉以酷烈聞納新以事紏罷朝士聳然後為左司郎中近侍局使皆有名哀宗東遷為諫議大夫近侍局使行省左右司郎中兼知宫省事留汴京居守崔立變之明日同御史大夫費摩阿固岱自縊死於臺中是日户部尚書完顔珠赫亦自縊阿虎帶字仲寧珠顆字仲平皆女直進士時不辱而死者奉御完顔莽格大睦親府事烏克遜端大理費摩德輝右副㸃檢完顔阿薩爾參政完顔納新之子瑪延可知者數人餘各有傳富察琦本名阿林字仁卿棣州陽信人試補刑部掾兄世襲穆昆兄死琦承襲正大六年秦藍總帥府辟琦為安平都尉鈕祜禄哈坦下都統兼知事其冬小關破事勢己廹琦常在哈坦左右哈坦令避矢石琦不去曰業已從公死生當共之尚安所避耶哀宗遷歸德汴京立講議所受陳言文字其官則御史大夫納哈塔寧以下十七人皆朝臣之選而琦以有論議預焉時左司都事元好問領講議兼看讀陳言文字與琦甚相得崔立變後令改易巾髻琦謂好問曰今日易巾髻在京人皆可獨琦不可琦一刑部譯史襲先兄世爵安忍作此今以一死付公然死則即死付公一言亦剰矣因泣涕而别琦既至其家母氏方晝寢驚而窹琦問阿母何為母曰適夢三人潛伏梁間故驚寤仁卿跪曰梁上人鬼也兒意在懸梁阿母夢先見耳家人軰泣勸曰君不念老母歟母止之曰勿勸兒所處是矣即自縊時年四十餘琦性沉静好讀書知古今事其母完顔氏以孝謹聞蔡巴爾不知其所始趫㨗有勇性純質可任時為忠孝軍元帥天興二年自息州入援㑹大將布展遣數百騎駐城東令人大呼曰城中速降當免殺戮不然無噍類矣於是上登城遣巴爾率挽强兵百餘潛出暗門渡汝水左右交射之自是兵不復薄城築長壘為乆困計上令分軍防守西城以殿前都㸃檢烏淩阿呼圖守西面巴爾副之已而哀宗度蔡城不守傳位承麟羣臣入賀班定巴爾不拜謂所親曰事至於此有死而已安能更事一君乎遂戰死毛佺者恩州人貞祐中為盗宣宗南渡率衆歸國署為義寅招撫哀宗遷蔡以佺為都尉圍城之戰佺力居多城破自縊其子先佺戰殁時死事者則有閻忠郝乙王阿嚕樊喬焉忠滑州人衞王時開州刺史賽格叛忠單騎入城縛賽格以出由是漸被擢用乙磁州人同日戰死哀宗贈官阿嚕樊喬皆河中人初為礮軍萬户鳯翔破北降從軍攻汴司礮如故即紿主者曰礮利於短不利於長信之使截其木數尺綆十餘握由是機雖起伏所擊無力即日二人皆捐家走城是時女直人無死事者長公主言於哀宗曰近來立功効命多諸色人無事時則自家人爭强有事則他人盡力焉得不怨上黙然餘各有傳温都察遜皇太后之姪衞尉七十五之子為人短小精悍性復豈弟累遷諸局分官上幸蔡授殿前左副㸃檢圍城中數引軍潛出廵邏時尚食須魚汝河魚甚美上以水多浮尸惡之城西有積水曰練江魚大且多徃捕必軍衞乃可察遜常自領兵以徃所得動千餘斤分賜將士後知其出左右設伏伺而邀之力戰而死蔡城破前御史監察納塔和碩台聞之慟哭投水而死完顔經實哀宗之奉御也系出始祖天興二年十月蔡城被圍城中饑民萬餘訴於有司求出有司難之民大呼於道上聞之遣近侍官分監四門門日出千人必老稚嬴疾者聽其出經實時在北門憫人之饑出過其數命杖之四十然出者多泄城中虛實尋止之三年正月己酉蔡城破哀宗傳位承麟即自縊于幽蘭軒權㸃檢内族色埒黙矯制召承御實嘉氏近侍局大使焦春和内侍局殿頭宋珪赴上前曉以名分大義及侍從官巴良弼珠勒根文卿皆從死色埒黙將死遺言經實使焚幽蘭軒火方熾子城破大兵突入近侍左右皆走避獨經實留不去為兵所執問曰汝為誰絳山曰吾奉御經實也兵曰衆皆散走而獨死何也曰吾君終于是吾候火滅灰寒收瘞其骨耳兵笑曰若狂者耶汝命且不能保能瘞而君耶經實曰人各事其君吾君有天下十餘年功業弗終身死社稷忍使暴露遺骸與士卒等耶吾逆知君軰必不遺吾吾是以留果瘞吾君之後雖寸斬吾不恨矣兵以告其帥布展曰此竒男子也許之經實乃掇其餘燼褁以敝衾瘞于汝水之旁再拜號哭將赴汝水死軍士救之得免後不知所終畢資倫縉山人也泰和南征以傭雇從軍軍還例授進義副尉崇慶元年改縉山為鎮州珠格髙琪為防禦使行元帥府事于是州選資倫為防城軍千户至寧元年秋大元兵至鎮州髙琪棄城遁資倫行及昌平收避遷民兵轉戰有功擢授都統統軍數千與軍中將領沈思忠寗子都軰同𨽻一府屯鄭州反衞州時號沈畢軍積功至都總領思忠為副都尉布薩阿哈南征軍次梅林關不得過阿哈問諸將誰能取此闗者資倫首出應命問須軍士幾何曰止用資倫所統足矣不煩餘軍明日遲明出宋軍不意引兵薄之萬衆崩遂取梅林關阿哈軍得南行留提控王禄軍萬人守關不數日宋兵奪關守之阿哈以梅林歸途為敵據計無所出復問誰能取梅林者以帥職賞之資倫復出應命以本軍再奪梅林阿哈破蘄黄按軍而還論功資倫第一授遙領同知昌武軍節度使宣差總領都提控既而樞密院以資倫思忠不相能恐敗事以資倫統本軍屯泗州興定五年正月戊戌提控王禄湯餅㑹軍中宴飲宋龜山統制時青乗隙襲破泗州西城資倫知失計墮南城求死為宋軍所執以見時青時青説之曰畢宣差我知爾好男子亦宜相時逹變金國勢巳衰弱爾肯降我宋亦不負爾若不從見劉大帥即死矣資倫極口罵曰時青逆賊聽我言我出身至貧賤結栁器為生自征南始得一官今職居三品不幸失國家城池甘分一死尚不能報肯從汝反賊求生耶青知無降意下盱眙獄時臨淮令李某者亦被執後得歸為泗州從宜伊喇揚格言其事揚格以資倫惡語罵時青必被殺即以死不屈節聞于朝時資倫子牛兒年十三居宿州收充皇后位奉閤舍人宋人亦賞資倫忠憤不撓欲全活之鈐以鐵繩囚于鎮江府土獄畧給衣食使不至寒餓脅誘百方時一引出問云汝降否資倫或罵或不語如是十四年及盱眙將士降宋宋使總帥納哈塔邁珠已下北望哭拜謂之辭故主驅資倫在旁觀之資倫見邁珠罵曰納哈塔邁珠國家未嘗負汝何所求死不可乃作如此觜鼻耶邁珠俯首不敢仰視及蔡州破哀宗自縊宋人以告資倫資倫歎曰吾無所望矣容我一祭吾君乃降耳宋人信之為屠牛羊設祭鎮江南岸資倫祭畢伏地大哭乗其不防投江水而死宋人義之宣示四方仍議為立祠鎮江之囚有方士者親嘗見之以告元好問及言泗州城陷資倫被執事且曰資倫長身面赤色顴頰微髙髯䟽而黄資禀質直重然諾故其堅忍守節卓卓如此宣宗實録載資倫為亂兵所殺當時傳聞不得其實云郭哈瑪爾㑹州人世為保甲射生手與兄羅丹以善射應募興定初羅丹以功遷遙授同知平凉府事兼㑹州刺史進官二階賜姓延扎夏人攻㑹州羅丹遙見其主兵者人馬皆衣金出入陣中約二百餘歩一發中其吭殪之又射一人矢貫兩手於樹敵大駭城破羅丹哈瑪爾俱被禽夏人憐其忠囚之皆誓死不屈朝廷聞之議加優奬而未知存殁乃特遷羅丹子博紐官一階授廵尉職以旌其忠後兄弟謀奔拔其鬚事覺羅丹被殺哈瑪爾獨拔歸上思羅丹之忠復遷博紐官一階遙授㑹州軍事判官哈瑪爾遙授鞏州鈐轄㑹言者乞奬用羅丹弟遂遷哈瑪爾官兩階授同知蘭州軍州事興定五年冬夏人萬餘侵定西哈瑪爾敗之斬首七百獲馬五十以功遷同知臨洮府事元光二年夏人歩騎數十萬攻鳯翔甚急元帥持嘉喀齊喀以哈瑪爾總領軍事從廵城濠外一人坐胡床以箭力不及氣貌若藐城守者喀齊喀指似哈瑪爾云能射此人否哈瑪爾測量逺近曰可哈瑪爾平時發矢伺腋下甲不掩處射之無不中即持弓矢伺坐者舉肘一發而斃兵退升遙授静難軍節度使尋改通逺軍節度使授山東西路斡罕必喇穆昆仍遣使賞賚徧諭諸郡焉是年冬哈瑪爾與鞏州元帥田瑞攻取㑹州哈瑪爾率騎兵五百皆被赭衲蔽州之南山而下夏人猝望之以為神城上有舉手於懸風版者哈瑪爾射之手與版俱貫殱數百人夏人震恐乃降葢㑹州為夏所據近十年至是復焉正大初田瑞據鞏州叛詔陜西兩行省併力擊之哈瑪爾率衆先登瑞開門突出為其弟濟所殺斬首五千餘級以功遷遙授知鳯翔府事本路兵馬都總管元帥左都監兼行蘭㑹洮河元帥府事六年九月哈瑪爾進西馬二匹詔曰卿武藝超絶此馬可充戰用朕豈能盡其力既入進即尚廐物也就以賜卿仍賜金鼎一玉兎鶻一并所遺郭倫格等物有差天興二年哀宗遷蔡州慮孤城不能保擬遷鞏昌以鈕祐禄烏展為鞏昌行省三年春正月烏展聞蔡已破欲安衆心城守以待嗣立者乃遣人稱使者至自蔡有㫖宣諭綏德州帥汪世顯者亦知蔡凶問且嫉烏展制已欲發矯詔事以兵圖之然懼哈瑪爾威望乃遣使約哈瑪爾併力破鞏昌使者至哈瑪爾謂曰鈕祜禄公為行省號令孰敢不從今主者受圍於蔡擬遷鞏昌國家危急之際我輩既不能致死赴援又不能叶衆奉迎乃欲攻鈕祜禄公先廢遷幸之地上至何所歸乎汝帥若欲背國家任自為之何及於我世顯即攻鞏昌破之刼殺烏展送款於大元復遣使二十餘輩諭哈瑪爾以祸福不從甲午春金已亡西州無不歸順者獨哈瑪爾堅守孤城丙申歳冬十月大兵併力攻之哈瑪爾度不能支集州中金銀銅鐵雜鑄為礟以擊攻者殺牛馬以食戰士又自焚廬舍積聚曰無至資兵日與血戰而大兵亦不能卒㧞及軍士死傷者衆乃命積薪於州廨呼集家人及城中将校妻女閉諸一室将自焚之哈瑪爾之妾欲有所訴立斬以徇火既熾率將士於火前持滿以待城破兵填委以入鏖戰既久有弓盡矢絶者挺身入火中哈瑪爾獨上大草積以門扉自蔽𤼵二三百矢無不中者矢盡投弓劒于火自焚城中無一人肯降者哈瑪爾死年四十土人為立祠烏展字世昌泰和三年䇿論進士初為行省以蠟丸為詔期以天興二年九月集大軍與上㑹於饒風闗出宋不意取興元既而不果云金史卷一百二十四
