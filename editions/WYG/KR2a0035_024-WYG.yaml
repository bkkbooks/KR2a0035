body:
  text: 金史卷二十四元中書右丞相總裁托克托等修志第五地理上上京路北京路咸平路西京路東京路中都路金之壤地封疆東極濟喇敏烏逹噶諸野人之境北自扶餘路之北三千餘里和羅和摶穆昆地為邉右旋入泰州博勒和所浚界壕而西經臨潢金山跨慶桓撫昌淨州之北出天山外包東勝接西夏逾黄河復西厯葭州及米脂寨出臨洮府㑹州積石之外與生羗地相接復自積石諸山之南左折而東逾洮河越鹽州堡循渭至大散關北竝山入京兆絡商州南以唐鄧西南皆四十里取淮之中流為界而與宋為表裏襲遼制建五京置十四總管府是為十九路其閒散府九節鎮三十六防禦郡二十二刺史郡七十三軍十有六縣六百三十二後復盡升軍為州或升城堡寨鎮為縣是以金之京府州凡百七十九縣加於舊五十一城寨堡關百二十二鎮四百八十八雖貞祐興定危亡之所廢置既歸大元或有因之者故凡可考必盡著之其所不載則闕之上京路即海古勒之地金之舊土也國言金曰愛新以按春水源於此故名金源國號葢取此史文殊誤詳後考證國初稱為内地天眷元年號上京海陵貞元二年遷都于燕削上京之號止稱㑹寧府稱為國中者以違制論大定十三年七月復為上京其山有長白青􅊐瑪竒嶺温都爾水有按春水混同江拉林河松阿哩江鴨子河府一領節鎮四防禦一縣六鎮一舊有㑹平州天㑹二年築契丹之珠特城也後廢其宫室有乾元殿天㑹三年建天眷元年更名皇極殿慶元宫天㑹十三年建殿曰辰居門曰景暉天眷二年安太祖以下御容為原廟朝殿天眷元年建殿曰敷徳門曰延光寢殿曰宵衣書殿曰稽古又有明徳宫明徳殿熈宗嘗享太宗御容於此太后所居也涼殿皇統二年構門曰延福樓曰五雲殿曰重明東廡南殿曰東華次曰廣仁西廡南殿曰西清次曰明義重明後東殿曰龍夀西殿曰奎文時令殿及其門曰奉元有泰和殿有武徳殿有黄風殿其行宫有天開殿約羅春水之地也有混同江行宫年太廟社稷皇統三年建正隆二年毁原廟天眷元以春亭名天元殿安太祖太宗徽宗及諸后御容春亭者太祖所嘗御之所也天眷二年作原廟皇統七年改原廟乾文殿曰世徳正隆二年毁大定五年復建太祖廟永興聖宫徳宗所居也天徳元年名之興徳宫後更名祚宫睿宗所居也光興宮世宗所居也正隆二年命吏部郎中蕭彦良盡毁宫殿宗廟大族邸第及儲慶寺夷其址耕墾之大定二十一年復修宫殿建城隍廟二十三年以甓束其城有皇武殿擊毬校射之所也有雲錦亭有臨漪亭為籠鷹之所在按春水側㑹寧府下初為㑹寧州太宗以建都升為府天眷元年置上京留守司以留守帶本府尹兼本路兵馬都總管後置上京海蘭等路提刑司户三萬一千二百七十舊嵗貢秦王魚大定十二年罷之又貢猪二萬二十五年罷之東至呼爾哈六百三十里西至肇州五百五十里北至扶餘路七百里東南至率賓路一千六百里至海蘭路一千八百里縣三㑹寧倚與府同時置有長白山青嶺瑪竒嶺巴延淀綠野淀有按春河又别書作阿术滸有混同江拉林河有得勝陀國言額特赫格們大祖誓師之地也曲江初名鎮東大定七年置十三年更今名宜春大定七年置有鴨子河肇州下防禦使舊珠赫店也天㑹八年以太祖兵勝遼肇基王迹於此遂建為州天眷元年十月置防禦使隸㑹寧府海陵時嘗為濟州支郡承安三年復以為太祖神武隆興之地陞為節鎮軍名武興五年置漕運司以提舉兼州事後廢軍貞祐二年復陞為武興軍節鎮置招討司以使兼州事戸五千三百七十五縣一始興倚與州同時置有鴨子河黑龍江隆州下利涉軍節度使古扶餘之地遼太祖時有黄龍見遂名黄龍府天眷三年改為濟州以太祖來攻城時大軍徑涉不假舟楫之祥也置利涉軍天徳二年置上京路都轉運司四年改為濟州路轉運司大定二十九年嫌與山東路濟州同更今名貞祐初陞為隆安府戸一萬一百八十縣一利涉倚與州同時置有混同江拉林河鎮一與縣同時置有混同館信州下彰信軍刺史本渤海懷逺軍遼開泰七年建取諸路漢民置户七千三百五十九縣一武昌本渤海懷福縣地鎮一八千戸扶餘路國初置萬户海陵例罷萬户乃改置節度使承安三年設節度副使南至上京六百七十里東南至呼爾哈一千四百里北至北邊界和羅和摶穆昆三千里海蘭路置總管府貞元元年改總管為尹仍兼本路兵馬都總管承安三年設兵馬副總管舊貢海葱大定二十七年罷之有伊勒呼水西北至上京一千八百里東南至髙麗界五百里率賓路節度使遼時為率賓府置刺史本率賓故地太宗天㑹二年以扎蘭路都貝勒所居地瘠遂遷于此以海陵例罷萬户置節度使因名率賓路節度使世宗大定十一年以扎蘭率賔相去千里既居率賔然不可忘本遂命名親管明安曰扎蘭明安承安三年設節度副使西北至上京一千五百七十里東北至呼爾哈一千一百西南至海蘭一千二百北至邊界斡罕阿林千户二千里扎蘭又書作押懶哈斯罕路置節度使天㑹七年徙治寧州嘗置都統司明昌四年廢有化成關國言曰哈斯哈雅呼爾哈路國初置萬户海陵例罷萬戸乃改置節度使承安三年置節度副使西至上京六百三十里北至邉界哈喇巴圖千户一千五百里烏爾古徳哷勒統軍司後升為招討司與扶餘路近咸平路府一領刺郡一縣十咸平府下總管府安東軍節度使本髙麗銅山縣地遼為咸州國初為咸州路置都統司天徳二年八月陞為咸平府後為總管府置遼東路轉運司東京咸平路提刑司户五萬六千四百四縣八平郭倚舊名咸平大定七年更銅山遼同州鎮安軍本漢襄平縣遼大祖時以東平寨置因名東平軍曰鎮東章宗大定二十九年以與東平重故更南有柴河北有清河西有遼河新興遼銀州富國軍本渤海富州熈宗皇統三年更名來屬南有范河北有柴河西有遼河慶雲遼祺州祐聖軍本以所俘檀州密雲民建州密雲後更名有遼河清安遼肅州信陵軍熈宗皇統三年降為縣榮安東有遼河歸仁遼舊隸通州安逺軍本渤海强師縣遼更名金因之北有細河玉山章宗承安三年以穆蘇集平郭林河之間相去六百餘里之地置貞祐二年四月陞為節鎮軍曰鎮安韓州下刺史遼置東平軍本渤海鄭頡府户一萬五千四百一十二舊有營縣二臨津倚未詳何年置栁河本渤海粤喜縣地遼以河為名有枸河栁河東京路府一領節鎮一刺郡四縣十七鎮五皇統四年二月立東京新宫寢殿曰保寧宴殿曰嘉恵前後正門曰天華曰乾貞七月建宗廟有孝寧宫七年建御容殿遼陽府中東京留守司本渤海遼陽故城遼完葺之郡名東平天顯三年陞為南京府曰遼陽十三年更為東京太宗天㑹十年改南京路平州軍帥司為東南路都統司之時嘗治於此以鎮髙麗後置兵馬都部署司天徳二年改為本路都總管府後更置留守司産白兎師姑布䑕毫白鼠皮人參白附子戸四萬六百四縣四鎮一遼陽倚東梁河國名烏勒呼必喇俗名太子河鶴野鎮一長宜哈斯罕在其地宜豐遼舊衍州安廣軍皇統三年廢為縣有東梁河石城興定三年九月以縣之靈巖寺為巖州名其倚郭縣名東安署行省澄州南海軍刺史下本遼海州天徳三年改州名户一萬一千九百三十五縣二鎮一臨溟鎮一新昌析木遼銅州廣利軍附郭析木縣也皇統三年廢州來屬有沙河瀋州昭徳軍刺史中本遼定理府地遼太宗時置軍曰興遼後為昭徳軍置節度明昌四年改為刺史與通貴徳澄三州皆隸東京户三萬六千八百九十二縣五樂郊遼太祖俘三河之民建三河縣於此後改今名有渾河章義遼舊廣州皇統三年降為縣來屬有遼河東梁河遼河大口遼濵遼舊遼州東平軍遼太宗改為始平軍皇統三年廢為縣有遼河􅀈樓遼舊興州興中軍常安縣遼嘗置定理府刺史於此本􅀈樓故地大定二十九年章宗更名有范河清河國名奎必喇䨇城遼䨇州保安軍也皇統三年降為縣章宗時廢貴徳州刺史下遼貴徳州寧逺軍國初廢軍降為刺郡戸二萬八百九十六縣二貴徳倚有范河奉集遼集州懐逺軍奉集縣本渤海舊縣有渾河葢州奉國軍節度使下本髙麗蓋葛牟城遼辰州明昌四年罷哈斯罕建辰州遼海軍節度使六年以與陳同音更取蓋葛牟為名户一萬八千四百五十六縣四鎭二湯池遼鐵州建武軍湯池縣鎮一神鄉建安遼縣鎮一大寧秀巖本大寧鎮明昌四年陞太和四年廢為鎮貞祐四年復陞置熊岳遼盧州𤣥徳軍熊岳縣遼屬南女直湯河司復州下刺史遼懷逺軍節度明昌四年降為刺史舊貢鹿筋大定八年罷之戸一萬三千九百五十縣二鎮一永康倚舊名永寧大定七年更化成遼蘇州安復軍本髙麗地興宗置皇統三年降為縣來屬貞祐四年五月陞為金州興定二年陞為防禦鎮一歸勝來逺州下舊來逺城本遼熟女直地大定二十二年升為軍後為州博索府路國初置統軍司天徳二年置總管府貞元元年與海蘭路總管竝為尹兼本路兵馬都總管此路皆明安戸北京路府四領節鎮七刺郡三縣四十二鎮七塞一堡五十六大定府中北京留守司遼中京統和二十五年建為中京國初因稱之海陵貞元元年更為北京置留守司都轉運司警廵院産鼦鼠螺盃茱茰梳玳瑁鞍酥乳餅五味子户六萬四千四十七縣十一鎮二大定倚遼縣舊名有土河七金山隂涼河鎮一恩化長興有塗河富庶有沁河鎮一文安松山遼松山州勝安軍松山縣開泰中置舊置刺史太祖天輔七年置觀察使皇統三年廢州來屬承安三年隸髙州泰和四年復有隂涼河落馬河神山遼澤州神山縣遼太祖俘蔚州之民置章宗承安二年嘗置恵州陞孩兒館為灤陽縣以隸之太和四年罷州及灤陽縣惠和皇統三年以遼惠州惠和縣置金源唐青山縣遼開泰二年置以地有金甸為名有駱駝山和衆遼榆州和衆縣皇統三年罷州來屬武平遼築城杏堝初名新州統和間更為武安州皇統三年降為武安縣來屬大定七年更名承安三年隸髙州泰和四年復來屬靖封承安二年以和碩務置隸全州三年隸髙州泰和四年來屬三韓遼伐髙麗遷馬韓辰韓弁韓三國民為縣置髙州太祖天輔七年以髙州置節度使皇統三年廢為縣承安三年復陞為髙州置刺史為全州支郡分武平松山靖封三縣隸焉泰和四年廢有落馬河塗河利州下刺史遼統和十六年置户二萬一千二百九十六縣二鎮一寨一阜俗遼統和四年置金因之龍山遼故潭州廣潤軍故名熙宗皇統三年廢州來屬有榆河寨一蘭州鎮一漆河義州下崇義軍節度使遼宜州天徳三年更州名戸三萬二百三十三縣三鎮一𢎞政有凌河開義遼海北州廣化軍縣故名熈宗皇統三年廢州來屬鎮一饒慶同昌遼成州興府軍縣故名國初隸川州大定六年罷川州隸懿州承安二年復隸川州泰和四年來屬錦州下臨海軍節度使舊隸興中府後來屬戸三萬九千一百二十三縣三永樂本慕容皝之西樂縣地安昌神水遼開泰二年置皇統三年廢為鎮大定二十九年復升為縣有土河瑞州下歸徳軍節度使本來州天徳三年更為宗州泰和六年以避睿宗諱謂本唐瑞州地故更今名戸一萬九千九百五十三縣三鎮一瑞安舊名來賔唐來逺縣也明昌六年更為宗安泰和六年復更今名海陽遼潤州海陽軍故縣皇統三年廢州來屬海濵本慕容皝集寧縣地遼隰州海平軍故縣皇統三年廢州來屬鎮一遷民廣寧府散下鎮寧軍節度使本遼顯州奉先軍漢望平縣地天輔七年升為府因軍名置節度天㑹八年改軍名鎮寧天德二年隸咸平後廢軍隸東京泰和元年七月來屬戶四萬三千一百六十一縣三舊有奉𤣥縣天㑹八年改為鍾秀縣鎮六寨四鎮二歡城遼西廣寧舊名山東縣大定二十九年更名有遼世宗顯陵鎮寨二閭城兎兒窩望平大定二十九年升梁漁務置鎮一有梁漁務山西店閭陽遼乾州廣徳軍以下乾陵故名奉陵縣天㑹八年廢州更名來屬有凌河有遼景宗乾陵鎮一閭陽衡家寨二大斧山北川懿州下寧昌軍節度使遼嘗更軍名慶懿又為廣順復更今名金因之先隸咸平府泰和末來屬戶四萬二千三百五十一縣二大定六年罷川州以宜民同昌二縣來屬承安二年復以二縣隸川州泰和四年罷川州以宜民𨽻興中同昌隸義州順安靈山本渤海靈峰縣地興中府散下本唐營州城遼太祖遷漢民以實之曰霸州彰武軍重熈十一年升為府更今名金因之戸四萬九百二十七縣四鎮三興中本唐栁城地南有凌河鎮一黔城永徳遼安徳州化平軍安徳縣世宗大定七年更今名北有凌河鎮一阜安興城遼嚴州保肅軍縣故名皇統三年廢州隸錦州有桃花島宜民遼川州長寧軍㑹同中嘗名白川州天祿五年去白字國初因之與同昌縣皆𨽻焉大定六年䧏為宜民縣隸懿州承安二年復置川州改徽川寨為徽川縣為懿州支郡太和四年罷州及徽川縣來屬鎮一咸康遼縣也國初廢為鎮建州下保靖軍刺史遼初名軍曰武寧後更金因之戸一萬一千四百三十九縣一永霸本唐昌黎縣地全州下盤安軍節度使承安二年置改和碩務為靖封縣黑河舖為盧川縣撥北京三韓縣拉呼等五明安以隸焉貞祐二年四月嘗僑置于薊州户九千三百一十九縣一安豐承元元年十月改豐州舖為安豐縣隸臨潢府三年置全州盤安軍節度使治有黄河黒河臨潢府下總管府地名西樓遼為上京國初因稱之天眷元年改為北京天徳二年改北京為臨潢府路以北京路都轉運司為臨潢府路轉運司天徳三年罷貞元元年以大定府為北京後但置北京臨潢路提刑司大定後罷路併入大定府路貞祐二年四月嘗僑置于平州有天平山好水川行宫地也大定二十五年命名有色爾鼐地熈宗皇統九年避暑于此有䧟泉國言曰埓綳伊有哈納卓果斯鄂博穆爾哈沙地户六萬七千九百七縣五堡三十七大定間二十四後増臨潢倚有金粟河長泰有伊拉齊山其北千餘里有龍駒河國言曰逹罕必喇有薩拉噶圖地盧川承安二年以黒河鋪升隷全州復來屬有潢河寧塞泰和元年五月置有滑河長寧遼永州永昌軍縣故名太祖天輔七年嘗置節度使皇統三年廢州來屬慶州下𤣥寧軍刺史境内有祖州天㑹八年改為奉州皇統三年廢境内有遼懷州遼太祖祖陵在焉舊置奉陵軍天㑹八年更為奉徳軍皇統三年廢遼太宗穆宗懷陵北山有遼聖宗興宗道宗慶陵城中有遼行宫比他州為富庶遼時刺此郡者非耶律蕭氏不與遼國寳貨多聚藏于此北至界二十里南至盧川二百二十西至桓州九百東至臨潢一百六十戸二千七縣一舊有孝安縣天㑹八年改為慶民縣皇統三年廢朔平有𣙜塲務興州寧朔軍節度使本遼北安州興化軍興化縣承安五年陞為興州置節度軍名寧朔改利民寨為利民縣撥密齊顯河圖們必罕寧江蘇瑪拉三明安隸焉貞祐二年四月僑置于密雲縣户萬五千九百七十縣二又有利民縣承安五年以利民寨升泰和四年廢興化倚遼舊縣皇統三年䧏興化軍置隸大定府承安五年建興州於縣為倚郭舊有白檀鎮宜興本興化縣白檀鎮泰和三年陞為縣來屬泰州昌徳軍節度使遼時本契丹二十部族牧地海陵正隆間置徳昌軍隸上京大定二十五年罷之承安二年復置于長春縣以舊泰州為金安縣隸焉北至邉四百里南至懿州八百里東至肇州三百五十里户三千五百四縣一舊有金安縣承安三年置尋廢堡十九長春遼長春州韶陽軍天徳二年降為縣隸肇州承安三年來屬有達嚕噶河鴨子河必哷布泉邉堡大定二十一年三月世宗以東北路招討司十九堡在泰州之境及臨潢路舊設二十四堡障參差不齊遣大理司直富察章嘉努等往視其處置於是東北自逹勒逹石堡子至海呼河地分臨潢路自海呼河堡子至色爾鼐皆取直列置堡戍評事伊喇敏言東北及臨潢所置土塉樵絶當令所徙之民姑逐水草以居分遣丁壯營畢開壕塹以備邉上令無水草地官為建屋及臨潢路諸堡皆以放良人戍守省議臨潢路二十四堡堡置戸二十共為七百二十若營建畢官給一嵗之食上以年饑權寢姑令開壕為備四月遣吏部郎中奚呼實罕經畫壕塹旋為沙雪堙塞不足為禦乃言可築二百五十堡堡日用工三百計一月可畢糧亦足備可為邉防久計泰州九堡臨潢五堡之地斥鹵官可為屋外自色爾鼐以西十九堡舊戍軍舎少可令大鹽灤官木三萬餘與直東堡近嶺求木每家官為構室一椽以處之西京路府二領節鎮七刺郡八縣四十鎮九大定五年建宫室名其殿曰保安其門南曰奉天東曰宣仁西曰阜成天㑹三年建太祖原廟大同府中西京留守司晉雲州大同軍節度遼重熈十三年升為西京府名大同金因之皇統元年以燕京路隸尚書省西京及山後諸部族隸元帥府舊置兵馬都部署司天徳二年改置本路都總管府後更置留守司置轉運司及中都西京路提刑司貢瑪瑙環子瑪瑙數珠産白駞安息香松明松脂黄連百藥煎芥子煎鹽憦鹽石綠綠礬鐵甘草枸杞碾玉砂地簟戸九萬八千四百四十四縣七鎮三大同倚遼析雲中置金因之有牛皮關武周山方山奚望山盛樂成御河闘鷄臺平城外郭鹽場如渾水桑乾河紇真山有遼帝后像在華嚴寺鎮一奉義雲中晉舊縣名宣寧遼徳州昭聖軍宣徳縣永定八年更名有官山彌陀山石綠山産碾玉沙鎮一窟龍城懐安晉故縣名天城遼析雲中置白登本名長清大定七年更有白登臺採掠山懐仁遼析雲中置貞祐二年五月升為雲州有黄花嶺錦屏山清涼山金龍山早起城日中城鎮一安七疃豐州下天徳軍節度使遼嘗更軍名應天尋復金因之皇統九年升為天徳總管府置西北路招討司以天徳尹兼領之大定元年降為天徳軍節度使兼豐州管内觀察使以元管部族直薩軍馬公事竝隸西南路招討司産不灰木地蕈户二萬二千六百八十三縣一鎮一富民晉舊名有黒山神山鎮一振武𢎞州下刺史遼名軍曰愽寧本襄隂村統和中建國初置保寧軍後廢軍産瑪瑙户二萬二千二縣二鎮二襄隂倚本名永寧大定七年改順聖本安塞軍故地遼應厯中置金因之鎮二陽門貞祐二年七月陞為縣大羅淨州下刺史大定十八年以天山縣升為豐州支郡刺史兼權機察北至界八十里户五千九百三十八縣一天山舊為𣙜塲大定十八年置為倚郭桓州下威逺軍節度使軍兵隸西北路招討司明昌七年改置刺史北至舊界一里半户五百七十八縣一和爾和東川更名金蓮川世宗曰蓮者連也取金枝玉葉相連之義景明宫避暑宫也在涼陘有殿揚武殿皆大定二十年命名有扎實有白櫟國言曰舎音齊喇清塞倚明昌四年以罷錄事司置撫州下鎮寧軍節度使遼秦國大長公主建為州章宗明昌三年復置刺史為桓州支郡治柔逺明昌四年置司候司承安二年陞為節鎮軍名鎮寧撥西北路招討司所管密齊顯必喇温都必喇納琳卓果斯松科錫特亨四明安隸之户一萬一千三百八十縣四有旺國崖大定八年五月更名静寧山有瑪逹格山大定二十九年更名呼圖哩巴山有氷井柔逺倚大定十年置于燕子城隸宣徳州明昌三年來屬有燕子城國言曰古勒逹爾罕尼巴羊城國言曰和寧𣙜塲扎拉嶺沔山大漁櫟行宫有樞光殿有䨇山七里河石井蝦蟆山昂吉爾櫟又名鴛鴦濼得勝口舊名北望淀大定二十年更集寧明昌三年以春市塲置北至界二百七十里豐利明昌四年以泥濼置有葢里泊威寧承安二年以撫州新城鎮置德興府晉新州遼奉聖州武定軍節度國初因之大安元年陞為府名徳興户八萬八百六十八縣六有漫天楇泰和二年更名拂雲平惡崖更名壘翠巖鎮一徳興倚舊名永興縣大安元年更名有涿鹿淀方水鎮有雞鳴山媯川遼汗州清平軍本晉媯州㑹同元年遼太祖嘗名汗州之縣曰懷戎又更名懐來明昌六年更今名西北有合河龜頭館石橋明昌四年建縉山遼儒州縉陽軍縣故名皇統元年廢州來屬崇慶元年陞為鎮州鎮一永安望雲本雲川地遼帝嘗居號曰御莊後更為縣今因之礬山晉故縣國初隸𢎞州明昌三年來屬龍門晉縣國初隸𢎞州後來屬明昌三年割隸宣徳州有慶寧宫行宫也泰和五年以提舉兼龍門令昌州天輔七年䧏為建昌縣隸桓州明昌七年以狗濼復置隸撫州後來屬户一千二百四十一縣一寳山有狗濼國言曰音逹渾泥約其北五百餘里有日月山大定二十年更曰抹白山國言納喇薩喇山宣徳州下刺史遼改晉武州為歸化州雄武軍大定七年更為宣化州八年復更為宣徳户三萬二千一百四十七縣二宣徳舊文徳縣大定二十九年更名宣平承安二年以大新鎮置以北邉用兵嘗駐此地朔州中順義軍節度使貞祐三年七月嘗割朔州廣武縣隸代州産鐡荆三稜枸杞戸四萬四千八百九十縣二鄯陽晉故縣有桑乾河太和嶺天池雁門闗霸徳山馬邑晉故縣貞祐二年五月陞為固州有洪濤山灅水又曰桑乾河武州邉下刺史大定前仍置宣威軍户一萬三千八百五十一縣一寧縣晉故縣黄河應州下彰國軍節度使户三萬二千九百七十七縣三金城晉故縣有黄𤓰堆復宿山桑乾河渾河崞川水黄花城山隂本名河隂大定七年以與鄭州屬縣同故更焉貞祐二年五月陞為忠州有黄花嶺桑乾河渾源晉縣貞祐三年五月陞為渾源州産鹽蔚州下忠順軍節度使遼嘗更為武安軍尋復貢地蕈户五萬六千六百七十四縣五靈仙北有桑乾河代王城薄家村廣靈亦作陵遼統和三年析靈仙置靈丘晉縣貞祐二年四月陞為成州四年割為代州支郡定安晉縣有桑乾河貞祐二年四月陞為定安州飛狐晉縣雲内州下開逺軍節度使天㑹七年徙奚第一第三部來戍産青鑌鐡户二萬四千八百六十八縣二鎮一柔服夾山在城北六十里鎮一寧仁舊縣也大定後廢為鎮雲川本歡托和後陞為裕民縣皇統元年復廢為歡托和大定二十九年復陞更為今名寧邉州下刺史國初置鎮西軍貞祐三年隸嵐州四年二月陞為防禦户六千七十二縣一寧邉正隆三年置東勝州下邉刺史國初置武興軍有古東勝城户三千五百三十一縣一鎮一東勝鎮一寧化部族節度使烏克蘇喇部族節度使軍兵事屬西北路招討司明昌三年罷節度使以招討司兼領烏庫哩部族節度使實壘部族節度使珠嚕部族節度使布塔布部族節度使竒嚕部族節度使唐古部族承安三年改為博勒和扎薩克節度使徳哷勒又作迭剌孟古部族承安三年改為特哩衮札薩克節度使詳衮九處茂乣詳衮貞祐四年六月改為額頁阿林明安穆騰乣詳衮貞祐四年改為亨克阿林穆昆古勒敦乣詳衮貞祐四年改為薩哈連必喇穆昆唐古乣詳衮伊埒圖乣詳衮伊勒敦乣詳衮蘇布特乣詳衮近北京呼敦乣詳衮哈瑪爾乣詳衮羣牧十二處烏都温羣牧大定四年改為阿都齊羣牧富僧額羣牧本阿都齊地大定七年分置伊囉斡羣牧鄂爾多羣牧嘉勒斡羣牧額勒本羣牧烏展羣牧特們羣牧托克托圖羣牧烏拉圖羣牧騰羣牧承安四年剏置布希羣牧承安四年剏置中都路遼㑹同元年為南京開泰元年號燕京海陵貞元元年定都以燕乃列國之名不當為京師號遂改為中都府一領節鎮三刺郡九縣四十九鎮七天徳三年始圖上燕城宫室制度三月命張浩等増廣燕城城門十三東曰施仁曰宣曜曰陽春南曰景風曰豐宜曰端禮西曰麗澤曰顥華曰彰義北曰㑹城曰通𤣥曰崇智曰光泰浩等取真定府潭園材木營建宫室及涼位十六應天門十一楹左右有樓門内有左右翔龍門及日華月華門前殿曰大安左右掖門内殿東廊曰敷徳門大安殿之東北為東宫正北列三門中曰粹英為夀康宫母后所居也西日㑹通門門北曰承明門又北曰昭慶門東曰集禧門尚書省在其外其東西門左右嘉㑹門也門有二樓大安殿後門之後也其北曰宣明門則常朝後殿門也北曰仁政門傍為朶殿朶殿上為兩髙樓曰東西上閤門内有仁政殿常朝之所也宫城之前廊東西各二百餘間分為三節節為一門將至宫城東西轉各有廊百許間馳道兩傍植栁廊脊覆碧瓦宫闕殿門則純用碧瓦應天門舊名通天門大定五年更七年改福夀殿曰夀安宫明昌五年復以隆慶宫為東宫􅄌訓殿為承華殿承華殿者為皇子所居之東宫也泰和殿泰和二年更名慶寧殿又有崇慶殿魚藻池瑶池殿位貞元元年建有神龍殿又有觀㑹亭又有安仁殿隆徳殿臨芳殿皇統元年有元和殿有常武殿有廣武殿為擊毬習射之所又京城北離宮有大寧宮大定十九年建後更為寧夀更為夀安明昌二年更為萬寧宫瓊林苑有横翠殿寧徳宫西園有瑶光臺又有瓊花島又有瑶光樓皇統元年有宣和門正隆二年有宣華門又有薩哈門大興府上晉幽州遼㑹同元年陞為南京府曰幽都仍號盧龍軍開泰元年更為永安析津府天會七年析河北為東西路時屬河北東路貞元元年更今名户二十二萬五千五百九十二大定四年十月命都門外夾道重行植栁各百里産金銀銅鐵藥産滑石半夏蒼术代赭石白龍骨薄荷五味子白牽牛縣十鎮一大興倚遼名析津貞元二年更今名有建春宫鎮一廣陽宛平倚本晉幽都縣遼開泰二年有玉泉山行宫安次晉舊名漷隂遼太平中以漷隂村置永清晉舊名寳坁本新倉鎮大定十二年置以香河縣近民附之承安三年陞置盈州為大興府支郡以杳河武清𨽻焉尋廢州香河遼以武清縣之孫村置昌平有居庸關國名齊喇哈藩武清晉縣良鄉有料石岡間溝通州下刺史天徳三年陞潞縣置以三河隸焉興定二年五月陞為防禦户三萬五千九十九縣二潞晉縣名有潞水三河晉縣名薊州中刺史遼置尚武軍户六萬九千一十五産粟縣五舊又有永濟縣大定二十七年以永濟務置未詳何年廢又有黎豁縣廢置皆未詳鎮二漁陽倚遵化遼景州清安軍鎮一石門豐潤泰和間置玉田有行宫偏林大定二十年改為御林鎮一韓城平峪大定二十七年以漁陽縣大王鎮陞易州下刺史遼置髙陽軍户四萬一千五百七十七縣二易有易水淶水有淶水涿州中刺史遼為永泰軍貢羅戸一十一萬四千九百一十二縣五鎮一范陽倚晉縣有湖梁河有劉李河鎮一政滿固安晉縣新城定興大定六年以范陽縣黄村置割淶水易縣近民屬之有臣馬河奉先大定二十九年置萬寧縣以奉山陵明昌二年更今名有房山龍泉河盤寧宫順州下刺史遼置歸化軍戸三萬三千四百三十三縣一温陽舊名懐柔明昌六年更有螺山溆水兎兒山宻雲遼檀州武威軍古北口國言曰紐斡哩平州中興平軍節度使遼為遼興軍天輔七年以燕西地與宋遂以平州為南京以錢帛司為三司天㑹四年復為平州嘗置軍帥司天㑹十年徙軍帥司治遼陽府後置轉運司貞元元年以轉運司併隸中都路貞祐二年四月置東面經畧司八月罷貢櫻桃綾户四萬一千七百四十八縣五鎮一盧龍倚撫寧本新安鎮大定二十九年置海山本漢海陽故城遼以所俘望都縣民置故名望都大定七年更名遷安本漢令支縣故城遼以所俘安喜縣民置因名安喜大定七年更今名鎮一建昌昌黎遼營州鄰海軍以所俘定州民置廣寧縣皇統二年降州來屬大定二十九年以與廣寧府重故更今名灤州中刺史本黄落故城遼為永安軍天輔七年因置節度使户六萬九千八百六縣四松亭闗國名薩勒扎鎮二義豐倚石城有長春行宫長春淀舊名大定淀大定二十年更鎮一榛子馬城樂亭鎮一新橋雄州中天㑹七年置永定軍節度使賜名易陽郡隸河北東路貞元二年來屬户二萬四百一十一縣三歸信倚有易水巨馬河容城泰和八年割𨽻安州貞祐三年𨽻安肅州有南易水大泥淀渾泥村保定宋保定軍後廢為縣霸州下刺史遼益津郡隸河北東路貞元二年來屬戸四萬一千二百七十六縣四益津倚大定三十九年剏置倚郭文安大城信安國初因宋為信安軍大定七年降為信安縣隸霸州元光元年四月陞為鎮安府所以重髙陽公張甫也保州中順天軍節度使宋舊軍事天㑹七年置順天軍節度使隸河北東路貞祐二年來屬海陵賜名清苑郡户九萬三千二十一縣二清苑倚宋名保塞大定十六年更有抱陽山沉水饋軍河滿城大定二十八年以清苑縣塔院村置安州下刺史宋順安軍治髙陽天㑹七年陞為安州隸河北東路後置髙陽軍大定二十八年徙治葛城因陞葛城為縣作倚郭泰和四年改混泥城為渥城縣來屬八年移州治於渥城以葛城為屬縣戸三萬五百三十二縣三渥城倚泰和四年置葛城大定二十八年置髙陽泰和八年正月改隸莫州四月復有徐河百濟河遂州下刺史宋廣信軍天㑹七年改為遂州隸河北東路貞元二年來屬號龍山郡泰和四年廢為遂城縣隸保州貞祐二年復置州户一萬一千一百七十四縣一遂城倚有光春宫行宫有遂城山易水漕水鮑河安肅州下刺史宋安肅軍天㑹七年陞為徐州軍如舊隸河北東路貞元二年來屬天徳三年改為安肅州軍名徐郡軍大定後降為刺郡廢軍户一萬二千九百八十縣一安肅按金初川郡志雄霸保安遂安肅六川皆隸廣寜府太宗紀載天㑹七年分河北為東西路則隸河北然東路豈以平川為南京之後以六州隸廣寧也不則郡志誤金史卷二十四
