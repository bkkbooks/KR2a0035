body:
  text: 金史卷十二元中書右丞相總裁托克托等修本紀第十二章宗四四年春正月乙丑朔宋髙麗夏遣使來賀丁卯諭外方使人不得佩刀入宫庚午幸豫王永成第視疾辛未如光春宫春水壬申隂霧木冰丁丑行尚書省奏宋賀正使還至慶都卒詔遣防禦使努色爾往祭致賻絹布各二百二十疋仍命送伴使張雲䕶喪以歸豫王永成薨辛卯髙麗國王王晫没嗣子韺遣使來告哀二月乙未朔還宫丁酉以山東河北旱詔祈雨東北二嶽己亥命購豫王永成遺文庚戌始祭三皇五帝四王癸丑詔刺史州郡無宣聖廟學者並増修之三月丁卯日昬無光大風毀宣陽門鴟尾癸酉命大興府祈雨戊寅幸太極宫詔定前代帝王合致祭者尚書省奏三皇五帝四王已行三年一祭之禮若夏太康殷太甲太戊武丁周成王康王宣王漢髙祖文景武宣光武明帝章帝唐髙祖文皇一十七君致祭為宜從之乙酉祈雨于北郊丁亥如萬寧宫壬辰祈雨于社稷遼陽府判官錫黙瑠嘉以上書論列朝臣削官一階罷之夏四月丙申詔定縣令以下考課法己亥祈雨于太廟庚子増定闗防姦細格丙午定衣服制以祈雨望祀嶽鎮海瀆于北郊癸丑祈雨于社稷甲寅以久旱下詔責躬求直言避正殿減膳撤樂省御廐馬免旱菑州縣徭役及今年夏稅遣使審繫囚理寃獄乙卯宰臣上表待罪詔答曰朕徳有愆上天示異卿等各趨乃職思副朕懷戊午以西上閤門使張偁等為故髙麗國王王晫勅祭使東上閤門使石慤等為髙麗國王王韺慰問起復横賜使庚申祈雨于太廟壬戌萬寧宫端門災五月乙丑祈雨于北郊有司請雩詔三禱嶽瀆社稷宗廟不雨乃行之癸酉平章政事圖克坦鎰尚書右丞完顔匡罷甲戌乙亥雨百官表奏御正殿復常儀乙酉謝雨于宗廟丁亥報祀社稷汰隨朝冗官定省令史闗決公務詭稱已稟擅退六部大理寺法状及妄有所更易者罪辛卯報謝嶽鎮海瀆六月壬辰朔罷兼官俸給壬寅復行吏目移轉法乙巳始祭中霤戊申罷恵川髙三州秀巖灤陽徽川咸寧全安利民六縣及北京宫苑使諸羣牧提舉居庸紫荆通會三闗使西北路鎮防十三千户諸路醫學博士壬子司天臺長行張翼進天象𫝊秋七月丁卯定申報盜賊制戊辰朝獻于衍慶宫庚午幸望京甸壬申如萬寧宫甲戌罷限錢法甲申改𦵏鎬王永中于威州八月大理丞姬端修司直温都諳逹論奏知大興府事赫舍哩執中坐所言不當各削一官罷職丁酉以尚書右丞相崇浩為左丞相右丞布薩揆為平章政事參知政事孫即康為尚書右丞御史大夫布薩端為左丞吏部尚書通吉思忠為參知政事庚子詔完顔綱喬宇宋元吉等編類陳言文字其言涉宫廷若大臣省臺六部各以類從凡二千卷辛丑以西京留守崇肅為御史大夫癸卯更定閤門祗候出職格先是以天旱詔求直言至是尚書省奏河南府盧顯逹汝州王大材所陳言涉不遜請以情理切害論其罪從之仍徧諭中外命諸路學校生徒少者罷敎授止以本州府文資官提控之丁未以安州軍事判官劉常言諸按察司體訪不實輒加糾劾者從故出入人罪論仍勒停若事涉私曲各從本法辛亥還宫乙卯以知真定府事完顔昌等為賀宋生日使丁巳幸太極宫弛圍塲逺地禁縱民耕捕樵採減敎坊長行五十人渤海敎坊長行三十人文繡署女工五十人出宫女百六十人九月庚申朔天夀節宋髙麗夏遣使來賀丙寅如薊州秋山壬申定屯田户自種及租佃法冬十月甲午定私鹻法丙申詔親軍三十五以下令習孝經論語癸卯至自秋山甲寅以提㸃尚衣局完顔夑為夏國生日使十一月丁卯以殿前右副都㸃檢烏凌阿毅等為賀宋正旦使癸酉木冰凡三日丁丑定收補承應人格十二月己丑朔新平等縣虸蚄蟲生己亥左丞相崇浩等請上尊號不許辛丑勅陜西河南饑民所鬻男女官為贖之乙卯百官再表乞受尊號不許五年春正月己未朔大雪宋髙麗夏遣使來賀庚申謁衍慶宫乙丑幸太極宫丁卯如光春宫春水壬申朝獻于衍慶宫乙亥詔有司自太和三年郡縣三經行幸民嘗供億者賜今年租稅之半丁丑次霸州調山東河北軍夫改治漕渠二月己丑朔論按察司近制以鎮静而知大體為稱職苛細而闇於大體為不稱由是各路按察以因循為事莫思舉刺郡縣以貪黷相尚莫能畏戢自今若糾察得實民無寃滯能使一路鎮静者為稱職其或煩紊使民伸愬者是為曠廢癸巳定鞫勘之官受飲宴者罪己亥如建春宫甲寅制盜用及偽造都門契者罪視宫城門減一等三月庚申還宫癸亥更定兩稅輸限乙丑宋兵入秦川界庚午親王百官請上尊號不許甲戌諭有司進士名有犯孔子諱者避之仍著為令命給米諸寺自十月十五日為始至次年正月十五日作糜以食貧民戊寅罷獄空錢辛巳宋兵入鞏州來逺鎮唐州得宋諜者言韓侂胄屯兵鄂岳將謀北侵四月戊子朔如萬寧宫癸巳命樞宻院移文宋人依誓約撤新兵毋縱入境壬子定隨路轉運司及府官每季檢視庫物法五月甲子以平章政事布薩揆為河南宣撫使籍諸道兵以備宋癸酉詔定遼東邑社人數戊寅更定檢知法勒留格己卯如慶寧宫制司屬丞凡遭父母喪止給卒哭假為永制甲申宋人入漣水縣六月戊子復漣水縣丁酉制定本朝婚禮更定鬻米麫入外界法己酉制鎮防軍盜亡致邊事失錯䧟敗户口者罪甲寅詔拜禮不依本朝者罰召諸大臣問備宋之䇿皆以設備養惡為言上以南北和好四十餘載民不知兵不忍先𤼵七月戊辰如錦屏山壬申朝獻于衍慶宫乙亥宣撫使揆奏定姦細罪賞法丙子定圍塲誤射中人罪壬午詔諸縣盜賊多所選注巡尉八月辛卯詔罷宣撫司時宋殿帥郭倪濠州守將田俊邁誘虹縣民蘇貴等為河間南將臣亦屢縱諜往往利俊邁之賂反為遊說皆言宋之増戍本虞他盜及聞行臺之建亦畏讋不敢去備且兵皆白丁自裹糧糒窮蹙饑疫死者十二三由是中外信之宣撫司以宋三省樞密院及盱眙軍牒來上又皆鐫㸃邊臣為辭宣撫使揆因請罷司從之揆又奏罷臨洮徳順秦鞏新置弓箭手閏月乙卯朔典衛司丙子還宫九月甲申朔天夀節宋髙麗夏遣使來賀戊子西北方黑雲間有赤氣如大色次及西南正南東南方皆赤有白氣貫其中至中夜赤氣滿天四更乃散以河南路統軍使赫舍哩子仁等為賀宋生日使戊戌宋兵三百攻比陽寺莊副巡檢阿里哈肆嘉努死之甲辰宋人焚黄澗擄巡檢髙顥冬十月庚申以刑部員外郎李元忠為髙麗生日使丁丑宋人襲比陽唐州軍事判官索多死之十一月乙酉宋人入内鄉攻洛南之固縣商州司獄夀祖追至丹河擊敗之己丑以太常卿趙之傑等為賀宋正旦使癸巳山東闕食賜錢三萬貫以賑之乙未初定武舉格丁酉詔山東陜西帥臣訓練士卒以備非常仍以銀十五萬兩分給邊帥募民偵伺復遣武衞軍副都指揮使完顔太平殿前右衞副將軍富察阿里赴邊伺其入伏兵掩之戊戌大雪免朝參己亥更定宫中局署承應收補格宋吳曦擁衆興元欲窺闗隴皇甫斌益募兵擾淮北所掠即以與之使自為戰六年春正月癸未朔宋髙麗夏遣使來賀丁亥宋使陳克俊等朝辭遣御史大夫孟鑄就館諭克俊等曰大定初世宗皇帝許宋世為姪國朕遵守遺法和好至今豈意爾國屢有盜賊犯我邊境以此遣大臣宣撫河南軍民及得爾國有司公移稱已罷黜邊臣抽去兵卒朕方以天下為度不介小嫌遂罷宣撫司未幾盜賊甚于前日比來羣臣屢以爾國渝盟為言朕惟和好嵗久委曲涵容恐姪宋皇帝或未詳知若依前不息臣下或復有云朕雖兼愛生靈事亦豈能終已卿等歸國當以朕意具言之汝主辛卯朝享于衍慶宫丙申宋興元守將吳曦遣兵圍穆舒隆堡部將布希長安擊走之斬其將辛丑更定保伍法癸卯始以㳂河縣官兼管句漕河事州府府官兼提控丁未如春水庚戌宋人入薩滿谷陜西統軍判官完顔果囉鞏州兵馬鈐轄完顔齊勤約宋西和州守將會境上俄伏發為所襲木波部長趙彦雄等七人死焉果囉馬䧟淖中中流矢齊勤僅以身免二月甲戌御史中丞孟鑄言提刑改為按察司又差官覆察權削而望輕非便參知政事賈鉉曰按察司既差監察體訪復遣官覆察之誠為繁冗請自今差監察時即遣官與俱更不覆察從之三月甲午尚書省奏啇州刺史烏庫哩揚珠請賻押軍官與南兵戰没者又奏遷右振肅富察烏錦官皆從之明昌初烏錦嘗為奉御出使山東至河間以百姓饑輒移提刑司開倉賑之還具以聞上甚悅太傅圖克坦克寧言陛下始親大政不宜假近侍人權乞正専擅之罪詔杖之二十克寧又以為言乃罷之後上思之由泰州都軍召為振肅己亥如萬寧宫甲辰勅尚書省祖父母父母無人侍養而子孫逺遊至經嵗者甚傷風化雖舊有徒二年之罪似涉太輕其考前律再議以聞己酉宋人攻靈壁南京按察使行部至縣匿民舍得免四月丙辰宋人圍夀春夀春告急于毫同知防禦使賢聖努將部騎六百赴之乃退癸亥尚書省奏河南統軍司言統軍使赫舍哩子仁等遣嚴整閻忠周秀輩入襄陽覘敵隂事還言皇甫斌遣兵四萬規取鄧以我叛人田元為鄉導三萬人規取唐以張貞張勝為鄉導俱授統領官故不敢無備乃聚鄭汝陽翟之兵于昌武以南京副留守兼兵馬副都總管赫舍哩毅統之聚亳陳襄邑兵于歸徳以河南路副統軍圖克坦鐸統之而自以所部兵駐汴及擬山東東西路軍七千付統軍赫舍哩執中駐大名河北東西路軍萬七千屯河南皆給以馬有老弱者易其人皆從之甲子宋人攻天水界乙丑入東柯谷部將劉鐸戰敗之丙寅詔平章政事布薩揆領行省于汴許以便宜從事升諸道統軍司為兵馬都統府以山東東西路統軍使赫舍哩執中為山東西路兵馬都統使定海軍節度使副都統軍使完顔薩喇副之陜西統軍使充為陜西五路兵馬都統使通逺軍節度使和碩知臨洮府事舒穆嚕仲温副之河南皆聽揆節制如故盡徵諸道籍兵辛未宋吳曦攻來逺鎮之蘭家領丙子詔諸職官納馬各有數丁丑宋人入新息内鄉又入泗州戊寅入褒信己卯入虹縣庚辰入頴上五月壬午宋李爽圍夀州田俊邁入蘄州秦詵攻蔡州防禦使完顔佛珠敗之又入金城海口殺長山尉執二巡檢以去甲申太白晝見丙戌以宋畔盟出師告于天地太廟社稷丁亥親告于衍慶宫戊子平章政事布薩揆兼左副元帥陜西兵馬都統使充為元帥右監軍知真定府事烏庫哩誼為元帥左都監辛卯以征南詔中外賜唐州刺史烏克遜鄂屯總押鄧州兵馬事完顔江山爵各二級蔡州防禦使完顔佛珠爵一級餘賞賚有差又以非嚴整上變必為所誤授整嵩州巡檢使賜爵八級錢二百萬上以宋兵方熾東北新調之兵未集河南之衆不足支命河北大名北京天山之兵萬五千屯真定河間清獻等以為應壬辰諭尚書省今國家多故凡言軍國利害五品以上官以次奏陳朕將親問之六品以下則具帖子以進癸巳山東路災赦死罪以下以樞宻副使完顔匡為右副元帥宋田俊邁攻宿州安國軍節度副使納喇邦烈等出兵擊之邦烈中流矢宋郭倬李汝翼以衆繼之遂圍宿州壬寅納喇邦烈等擊敗之俊邁退保于蘄癸卯執俊邁于蘄甲辰皇甫斌攻唐州刺史烏克遜鄂屯拒之行省遣泌陽副巡檢納哈塔軍勝來援遂敗之庚戌太白經天六月辛亥朔左丞布薩端以母憂罷平章政事揆報蘄之捷并送所䕶宋將田俊邁至闕上降詔褒諭賜赫舍哩貞納喇邦烈薩克逹等爵賞有差宋將李爽以兵圍夀州刺史圖克坦羲拒守踰月不能下壬子河南統軍判官竒珠及邁格等以兵來援羲出兵應之爽敗同知軍州事布埓軍中流矢死乙夘初置急遞鋪腰鈴轉遞日行三百里非軍期河防不許起馬定軍前差發受贓罪除飛蝗入境雖不食禾稼亦坐罪法丁巳詔彰徳府宋韓侂胄祖琦墳毋得損壞仍禁樵採庚申右翼都統完顔薩布敗宋曹統制于溱水辛酉詔有司有宋宗族所居各具以聞長官常加提控壬戌平章政事揆報夀州捷戊辰詔升夀州為防禦免今年租稅諸科名錢釋死罪以下以圖克坦羲為防禦使贈布埓庫昭勇大將軍賜錢三百貫官其子圖喇擢奇珠同知昌武軍節度使事邁格河南路統軍判官都統薩布副統布希萬努各進爵一級賜金幣各有差辛未木星晝見至七月戊申經天乙亥宋呉曦攻鹽川戍將完顔王喜敗之秋七月癸未宋商榮復攻東海縣令完顔綳森復敗之還中伏矢死贈海州刺史以銀五百兩絹百匹給其家仍官一子甲申朝獻于衍慶宫丁亥勅翰林直學士陳大任以本職専修遼史甲午宋統制戚春以舟師攻邳州刺史完顔從正敗之春赴水死斬其副夏統制吳曦兵五萬入秦州陜西路都統副使承裕等敗之丙申夏國王李純佑廢姪安全立遣使奉表來告詔禁賣馬入外境但至界欲賣而為所捕即論死八月庚戌山東帥來報邳州之捷辛亥木星晨見乙夘以羌酋青伊克為疊州副都總管己未太白晝見丙寅左丞布薩端起復前職詔設平南諸將軍辛未宋程松襲取方山原富察貞破走之壬申太白晝見經天甲戌至自萬寧宫乙亥赦唐鄧潁蔡宿泗六州免來年租稅三分之一九月己夘朔天夀節髙麗遣使來賀辛巳元帥右都監富察貞取和尚原臨洮番部遵寧獻芻粟戰馬以助軍乙酉將五鼓北方有赤白氣數道起于王良之下行至北斗開陽搖光之東丙戌幸香山庚寅勅行尚書省有方畧出衆武藝絶倫才幹辨事工巧過人者其招選之甲午參知政事賈鉉乞致政不許戊戌尚書左丞布薩端行省于汴己亥尚書户部尚書梁鏜行六部尚書事于山東辛丑遣尚書左司郎中温特赫思敬冊李安全為夏國王甲辰宋吳曦將馮興楊雄李珪等入秦州陜西都統副使承裕等擊破之斬楊雄李珪冬十月戊申朔平章政事布薩揆督諸道兵伐宋庚戌揆以行省兵三萬出潁夀河南路統軍使赫舍哩子仁以兵三萬出渦口元帥匡以兵二萬五千出唐鄧左監軍赫舍哩執中以山東兵二萬出清口右監軍充以闗中兵一萬出陳倉右都監富察貞以岐隴兵一萬出成紀蜀漢路安撫使完顔綱以漢番步騎一萬出臨潭臨洮路兵馬都總管舒穆嚕仲温以隴右部騎五千出鹽川隴州防禦使完顔璘以本部兵五千出來逺甲子獵近郊十一月戊寅朔詔定諸州府物力差役式壬午完顔匡攻下棗陽乙酉詔屯田軍户與所居民為婚姻者聽丁亥布薩揆克安豐軍取霍邱縣赫舍哩執中克淮隂遂圍楚州己丑尚書省奏減朝官及承應人月俸折支錢庚寅完顔匡克光化軍及神馬坡壬辰布薩揆次廬江宋督視江淮兵馬事邱崈遣劉祐來乞和赫舍哩子仁克定逺縣乙未完顔匡取隨州丙申赫舍哩子仁克滁州戊辰詔諸路行用小鈔完顔匡圍徳安别以兵徇下安陸應城雲夢孝感漢川荆山等縣庚子日斜有流星二光芒如炬幾及一丈起東北没東南初定茶禁完顔綱圍祐州降之宋邱崈遣林拱持書乞和辛丑完顔匡攻襄陽破其外城布薩揆克含山富察貞克天水赫舍哩子仁徇下來安全椒二縣壬寅完顔綱徇下荔川閭川等城癸夘邱崈復遣宋顯等以書幣乞和乙巳完顔綱克宕昌丙午富察貞克西和州十二月丁未朔完顔匡克宜城布薩揆攻和州薩克逹中流矢死壬子完顔綱次大潭縣降之富察貞克成州癸丑宋太尉昭信軍節度使四川宣撫副使吳曦納欵于完顔綱戊午右監軍充攻下大散闗己未赫舍哩子仁克真州邱崈復遣陳璧等奉書乞和辛酉右監軍充遣烏雅綽哈以兵趣鳯州城潰入焉完顔綱遣京兆錄事張仔會吳曦于興州之置口曦具言所以歸朝之意仔請以告身為報盡出以付之仍獻階州乙丑初設都提控急逓鋪官平章政事布薩揆班師完顔綱以朝命假太倉使馬良顯齎詔書金印立吳曦為蜀王戊辰富察貞以西和天水等捷來報完顔匡進所掠女子百人己巳曦遣其果州團練使郭澄提舉仙人闗使任辛奉表及蜀地圖志吳氏譜牒來上壬申詔完顔匡權尚書右丞行省事右副元帥如故以赫舍哩執中縱下擄掠遣近臣杖其經厯阿爾巴斯等仍詔放還所掠七年春正月丁丑朔髙麗夏遣使來賀完顔匡攻襄陽戊寅勅宰臣舉材幹官同議南征事辛巳詔御史大夫崇肅同知大睦親府事圖克坦懷忠吏部尚書范楫户部尚書髙汝礪禮部尚書張行簡知大興府事温特赫思齊等十有四人同對于慶和殿壬午詔百官及前十四人同對于廣仁殿甲申朝獻于衍慶宫乙酉贈故夀州死節軍士魏全宣武將軍䝉城令封其妻鄉君子竢年至十五收充八貫石正班局分承應仍賜錢百萬初李爽圍夀州刺史羲募人往斫敵營全在選中而為敵所執敵令罵羲則免全陽許及至城下反罵敵遂殺之至死罵不絶聲故有是恩戊子召完顔綱赴闕庚申布薩揆還駐下蔡而病丙申以左丞相崇浩兼都元帥行省于南京以代揆己亥有司奏更定茶禁辛丑完顔匡取穀城二月丙辰赦鳯成西和階山五州丁巳詔追復永中永蹈王爵宋知樞宻院張巖遣方信孺以書詣平章政事揆左丞端乞和己未獵于近郊完顔匡克荆門軍癸亥如建春宫吳曦遣使奉三表來謝封爵陳誓言賀全蜀内附丙寅還宫戊辰平章政事兼左副元帥布薩揆薨于軍癸酉遣同知府事珠格髙琪等冊吳曦為蜀國王判平陽府事衛王永濟改武定軍節度使兼奉聖州管内觀察使是月蜀國王呉曦為宋臣安丙所殺壬辰初定蟲蝻生發地主及鄰主首不申之罪宋復攻破階州癸巳復攻破西和州乙未宣撫副使完顔綱至鳯翔詔撤五州之兵分保要害綱召諸軍還庚子以完顔匡為左副元帥壬寅如萬寧宫甲辰幸西園夏四月壬子遣宫籍副監楊序為横賜髙麗王使癸丑宋人攻破散闗鞏州鈐轄烏雅愛實死之丙辰以赫舍哩子仁為右副元帥戊辰詔元帥府分遣諸將遊奕淮南諸州癸酉復下散闗五月己夘幸東園射栁己丑幸玉泉山丙申宋知樞宻院事張巖復遣方信孺以書至都元帥府増嵗幣乞和四州安撫使安丙遣西和州安撫使李孝義率步騎三萬攻秦州圍皂角堡珠格髙琪以兵赴之七戰而解其圍是月放宫女二十人六月乙巳朔詔朝官六品外官五品以上及親王舉通錢穀官一人不舉者罰舉不當者論如律己酉以山東盜制同黨能自殺捕出首官賞法戊午烏庫哩誼為元帥左監軍完顔薩喇為元帥左都監乙丑遣使捕蝗秋七月庚辰朝獻于衍慶宫壬午詔民間交易典質一貫以上並用交鈔毋用錢乙酉勅尚書省自今初受監察者令進利害帖子以待召見甲午左副元帥匡至自許州乙未詔覈西夏人口盡贖放還敢有藏匿者以違制論八月戊申宋張巖復遣方信孺齎其主誓書藁來乞和庚戌割汝州襄城縣于許州戊辰至自萬寧宫九月甲戌朔天夀節髙麗夏遣使來賀左丞相兼都元帥崇浩薨于軍甲申定西北京遼東鹽司判官諸塲管句増虧升降格以尚書左丞布薩端為平章政事封申國公左副元帥完顔匡為平章政事兼左副元帥封定國公丙戌獵于近郊壬辰還宫戊戌更定受制忘誤及誤寫制書事重加等罪壬寅勅女直人不得改為漢姓及學南人裝束冬十月甲辰詔應廕之家旁正廕足其正廕者未出官而亡許補廕一人辛亥以武庫令珠嘉佛新為髙麗生日使丙辰獵于近郊己巳詔定隨軍遷賞格辛未陜西宣撫使圖克坦鎰分遣副統巴噶罕攻下蘇嶺闗是月定南征將士功賞格十一月癸酉詔新定學令内削去薜居正五代史用歐陽修所撰是日都統雅爾拔鶻嶺闗新道口副統把噶罕取小湖闗敖倉至營口鎮遂取其城丙子宋韓侂胄遣左司郎中王柟以書來乞和請稱伯増嵗幣犒軍錢誅蘇師旦函首以獻丙戌上聞陜州防禦使赫舍哩博索禁民糶命尚書省罪之壬辰宋參知政事錢象祖以誅韓侂胄移書行省甲午獵于近郊戊戌參知政事賈鉉罷詔完顔匡檄宋函侂胄首以贖淮南故地十二月壬寅朔遼史成丙午以符寶郎烏庫哩福齡為夏國生日使丙午詔䇿論進士免試弓箭擊毬庚申以尚書右丞孫即康為左丞參知政事通吉思忠為右丞中都路都運使孫鐸為參知政事八年春正月辛未朔髙麗夏來賀壬申朝謁于衍慶宫癸酉毁大鈔行小鈔以元帥左都監完顔薩喇為參知政事乙亥宋安丙遣兵襲鶻嶺闗副統把噶罕完顔果囉擊走之斬其將景統領丙子左司郎中劉昻通州刺史史肅監察御史王宇吏部主事曹元吏部員外郎圖克坦永康太倉使馬良顯順州刺史唐古卓克索巴坐于蒲陰令太中私議朝政皆杖之癸未如春水丙戌如廣春宫二月乙巳宋參知政事錢象祖遣王柟來以書上行省復請川陜關隘甲寅如建春宫庚申諭有司曰方農作時雖在禁地亦令耕種己巳還宫三月丁亥幸瀛王第視疾庚寅以與宋和諭尚書省壬辰宰臣上表謝罪甲午瀛王從憲薨乙未上親臨祭夏四月癸夘日暈三重皆内黄外赤戊申禘于太廟庚戌如萬寧宫甲寅以北邊無事勅尚書省命東北路招討司還治泰州就兼節度使其副招討仍置于邊詔諭有司以苖稼方興宜速遣官分道巡行農事以備蟲蝻詔更定明安穆昆承襲程試格宋錢象祖復遣王柟以書上行省庚申詔諸路按察司嵗賜公用錢閏月辛未諭尚書省曰翰林侍講學士富察烏延言使宋官當選人其言甚當彼通謝使雖未到闕其報聘人當先議擇自此更始凡有禮數皆在奉使今既行之遂為永例不可不慎也甲戌制諸州府司縣造作不得役諸色人匠違者凖私役之律計傭以受所監臨財物論甲申定承應人收補年甲格甲午雨雹定保甲軍殺獲南軍官賞乙未宋獻韓侂胄等首于元帥府五月丁未御應天門備黄麾立仗親王文武合班起居中路兵馬提控平南撫軍上將軍赫舍哩貞以宋賊臣韓侂胄蘇師旦首獻并奉元帥府露布以聞懸其首并畫像于市以露布頒中外丙辰平章政事匡至自軍己未更元帥府為樞宻院癸亥詔移天夀節于十月十五日丁夘遣使分路捕蝗六月癸酉宋通謝使朝議大夫試禮部尚書許奕福州觀察使右武衛上將軍吳衡等奉其主書入見甲戌謁謝于衍慶宫癸未以許宋平詔中外免河南山東陜西等六路今年夏稅河東河北大名等五路半之丁亥以元帥左都監烏庫哩誼為御史大夫戊子飛蝗入京畿乙未定服飾明金象金制丁酉以副都檢㸃完顔侃為宋諭成使禮部侍郎喬宇副之秋七月戊戌朔太白晝見庚子詔更定蝗蟲生𤼵坐罪法乙巳朝獻于衍慶宫詔頒捕蝗圖于中外戊申宋使朝辭致答通謝書及誓書于宋主八月壬申更定遼東行使鈔法癸酉如建春宫己丑以户部尚書髙汝礪等為宋生日使庚寅如秋山九月甲子遣吏部尚書賈守謙等一十三人與各路按察司官推排民户物力乙丑至自秋山冬十月辛未以吏部郎中郭郛為髙麗生日使辛巳宋髙麗夏遣使來賀夏國有兵遣使來告癸未更定安泊强竊盜罪格辛夘以軍民共譽為廉能官條附善最法十一月丁酉朔詔諸路按察使並兼轉運使初設三司使掌判鹽鐵度支勸農事以樞宻使赫舍哩子仁兼三司使癸夘詔戒諭尚書省曰國家之治在于紀綱紀綱所先賞罰必信今乃上自省部之重下逮司縣之間律度勿循私懷自便遷延曠嵗苟且成風習此為恒從何致理朝廷者百官之本京師者諸夏之儀其勗自今各懲已往遵繩奉法竭力赴功無枉撓以循情無依違而避𫝑壹歸于正用範乃民是日御臨武殿試䕶衛丁未勅諭臨潢泰州路兵馬都總管承裔等修邊備乙夘上不豫丙辰崩于福安殿年四十一大安元年春正月諡曰憲天光運仁文義武神聖英孝皇帝廟號章宗二月甲申𦵏道陵贊曰章宗在位二十年承世宗治平日久宇内小康乃正禮樂省刑法定官制典章文物粲然成一代治規又數問羣臣漢宣綜核名實唐代考課之法葢欲跨遼宋而比跡於漢唐亦可謂有志於治者矣然婢寵擅朝冡嗣未立疏忌宗室而傳授非人向之所謂維持鞏固於久逺者徒為文具而不得為後世子孫一日之用金源氏從此衰矣昔楊雄氏有云秦之有司負秦之法度秦之法度負聖人之法度蓋有以夫金史卷十二
