body:
  text: 金史卷五十九元中書右丞相總裁托克托等修表第一宗室表古者太史掌叙邦國之世次辨其姓氏别其昭穆尚矣金人初起完顔十二部後皆以部為氏史臣記錄有稱宗室者有稱完顔者稱完顔者亦有二焉有同姓完顔蓋疎族若實圖美都古嚕訥是也有異姓完顔蓋部人若罕都是也大定以前稱宗室明昌以後避睿宗諱稱内族其實一而已書名不書氏其制如此宣宗詔宗室皆稱完顔不復識别焉大定泰和之間袒免以上親皆有屬籍以叙授官大功以上薨卒輟朝親親之道行焉貞祐以後譜牒散失大槩僅存不可殫悉今掇其可次第者著于篇其上無所係下無所承者不能盡錄也右始祖子與徳帝凡二人右徳帝子與安帝凡二人右安帝子與獻祖凡五人博勒和稱安帝五代孫不稱誰子不可以世置之卷末右獻祖子與昭祖凡七人右昭祖子與景祖凡六人實古納稱昭祖曾孫崇成稱昭祖𤣥孫不稱誰子不可以世置之卷末右景祖子與世祖肅宗穆宗凡九人伊克阿里布稱係出景祖不稱誰子不可以世置之卷末右世祖子與康宗太祖太宗凡十一人右穆宗子五人哈布爾稱穆宗孫不稱誰子不可以世置之卷末右諸宗室可譜者凡十一族雖稱係出某帝而不能世次不譜於各帝之下所以慎也金史卷五十九
  hash: sha256:9b4e0c68c899d1876fec96b68c210d02cea44b3d2472ac327762e2ed2196582c
