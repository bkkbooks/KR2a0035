body:
  text: 金史卷二十六元中書右丞相總裁托克托等修志第七地理下大名府路河東南路河東北路京兆府路鳳翔路慶原路鄜延路臨洮路大名守路宋北京魏郡府一領刺郡三縣二十鎮二十二貞祐二年十月置行尚書省大名府上天雄軍舊為散府先置統軍司天徳二年罷以其所轄民户分𨽻旁近總管府正隆二年陞為總管府附近十二明安皆隸焉兼漕河事産皺縠絹梨肉櫻桃煎木耳硝户三十萬八千五百一十一縣十鎮十三舊有桞林侯固二鎮元城有愜山漕運御河屯氏河鎮二安定安賢大名倚鎮一魏縣冠氏有弇山水沙河鎮四普通清水博寧桑橋南樂鎮一南樂館陶有漕運御河鎮一館陶夏津有屯氏河潤溝河鎮一孫生朝城鎮一韓張清平有新渠金堤鎮一清平莘鎮一馬橋恩州中刺史宋清河郡軍事治清河今治厯亭户九萬九千一百一十九縣四鎮六厯亭倚有永濟渠置河倉鎮四漳南新安樂舊安樂王杲武城有永濟渠沙河鎮一武城清河有永濟渠漳渠臨清有河倉鎮一曹仁濮州下刺史宋濮陽郡户五萬二千九百四十八縣二鎮三鄄城倚有旄邱陶邱金堤鎮二臨濮雷澤皆舊縣貞元二年為鎮范鎮一定安開州中刺史宋開徳府澶淵郡鎮寧軍節度降為澶州皇統四年復更今名户三萬三千八百三十六縣四鎮一濮陽倚有衛陽山鮒􅀈山黄河淇河瓠子口清豐有廣陽山黄河觀城有泉源河鎮一武鄉長垣本隸南京㤗和八年以限河不便來屬河東北路宋河東路天㑹六年析河東為南北路各置兵馬都總管府一領節鎮三刺郡九縣三十九鎮四十堡十寨八太原府上武勇軍宋太原郡河東軍節度國初依舊為次府復名并州太原郡河東軍總管府置轉運司有造墨埸煉銀洞瑪瑙石藥産松脂白膠香五靈脂大黄白玉石户一十六萬五千八百六十二縣十一鎮八陽曲倚冇罕山䝉山汾水鎮五陽曲百并赤塘闗天門闗陵井驛太谷有太谷山蒋水平晉貞祐四年七月廢興定元年復置有龍山晉水鎮二晉寧晉祠清源有清源水汾水徐溝本清源縣之徐溝鎮大定二十九年升榆次有麓臺山塗水祈有幘山太谷水鎮一團栢文水有隱泉山汾水文水交城有少陽山狐突山汾水盂興定中升為州聽絳州元帥府節制置刺史尋復有白馬山泉􅄷山滹沱水壽陽興定二年九月嘗割隸平定州有方山洞過水晉州興定四年正月以夀陽縣西張寨置忻州下刺史舊定襄郡軍户三萬二千三百四十一縣二鎮四秀容有程候山雲母山忻水滹沱水鎮四忻口雲内徒合石嶺定襄平定州中刺史本宋平定軍大定二年升為州興定二年為防禦十一月復降為刺郡户一萬八千二百九十六縣二鎮三平定倚有浮山浮濼水鎮二承天東百井樂平興定四年正月升為臯州有樂平山清漳水鎮一浄陽汾州上宋西河郡軍事天㑹六年置汾陽軍節度使後又置河東南北路提刑司户八萬七千二百二十七縣五鎮二西河有謁泉山比二山文水汾水鎮一郭柵孝義有勝水介休有介山汾水鎮一洪山平遥有鹿臺山汾水靈石貞祐三年割隸霍州四年五月復來屬有静巖山汾水石州上舊昌化軍刺史興定五年復隸晉陽從郭文振之請也户三萬六千五百二十八縣六鎮四離石倚有胡公山離石水鎮一石窟方山貞祐四年徙治于積翠山有方山赤洪水孟門舊名定胡明昌六年更宋隸晉寧軍有黄河寧鄉水鎮二吴保天澤温泉貞祐四年五月改隸汾州有逺望山温泉臨泉宋隸晉寧軍有黄河臨泉水鎮一克明寧鄉舊名平夷明昌六年更葭州下刺史本晉寧軍貞元元年隸汾州大定二十二年升為晉寧州二十四年更今名在黄河西興定二年五月以河東殘破改隸延安府户八千八百六十四寨八堡九神泉寨永作堡烏龍寨康定堡寧河寨寧河堡太和寨神木寨通津堡彌川寨䕶川堡强川堡清川堡通泰寨通泰堡晉安堡吴堡寨已上皆在黄河西臨西夏界代州中宋鴈門郡防禦天㑹六年置震武軍節度使貞祐二年四月僑置西面經略司八月罷户五萬七千六百九十縣五鎮十三鴈門倚有夏屋山鴈門山滹沱水鎮三鴈門西徑胡谷崞有崞山石鼓山滹沱河沙河鎮一樓板五臺貞祐四年三月升為臺州有五臺山􅫧慮水鎮二興若石觜廣武貞祐三年七月來屬繁畤貞祐三年九月升為堅州鎮七茹越大石義興麻谷瓶形梅廻實興隩州下本宋舊火山軍大定二十二年升為火山州後更今名興定二年九月改隸嵐州四年以殘破徙治于黄河灘許父寨户七千五百九十二縣一鎮一河曲貞元元年置有火山黄河鎮一鄴鎮寧化州下刺史本寧化軍大定二十二年陞為州户六千一百縣一鎮一寧化鎮一窟谷嵐州下宋舊樓煩郡軍事天㑹六年置鎮西節度使户一萬七千五百五十七縣三鎮四宜芳鎮一飛鳶合河鎮三合河津乳浪鹽院渡樓煩岢嵐州下刺史本宋岢嵐軍大定二十二年為州貞祐三年九月升為防禦四年正月升為節鎮五月復為防禦户五千八百五十一縣一堡一嵐谷有嵐谷山雪山岢嵐山堡一寒光保徳州下刺史本宋保徳軍大定二十二年升為州元光元年六月升為防禦户三千一百九十一縣一保徳大定十一年置有大堡津汝谷津管州下刺史本宋憲州静樂郡天徳三年更興定三年升為防禦户五千八百八十一縣一静樂河東南路府二節鎮三防禦一刺郡六縣六十九鎮三十闗六平陽府上宋平陽郡建雄軍節度本晉州初為次府置建雄軍節度使天㑹六年升總管府置轉運司興定二年十二月以殘破降為散府有書籍産解鹽隰州綠卷子布龍門椒紫團參甘草蒼术户一十三萬六千九百三十六縣十鎮一臨汾天㑹六年定臨汾為次赤餘並次畿置丞簿尉各一有姑射山平水壺口山汾水襄陵倚有浮山汾水橘水鎮一故闗洪洞有霍水汾水趙城有姑射山汾水霍水霍邑貞祐三年七月升為霍州以趙城汾西靈石隸焉興定元年七月开為節鎮軍曰鎮定有霍山汾水彘水汾西有汾西山汾水岳陽有烏嶺山通軍水浮山舊名神山大定七年更為浮山興定四年更名曰忠孝和川冀氏隰州上刺史宋大寧郡團練舊大寧郡軍刺史天㑹六年改為南隰州以與北京隰州重也天徳三年去南字户二萬五千四百四十五縣六闗四隰州倚有石馬山石樓山仵城興定五年正月陞以隰州之午城鎮置蒲興定五年正月升為蒲州以大寧隸焉有孤石山横木嶺大寧有孔山黄河白斤水闗一馬門闗永和有樓山横河山芝水闗一永和關石樓有石樓山黄河龍泉闗二永寧上平闗吉州下宋置團練舊名慈州天徳三年改為耿州置文成郡軍明昌元年更名吉户一萬三千三百二十四縣二吉鄉有壺口山孟門山黄河蒲水鄉寧河中府散上宋河東郡舊置䕶國軍節度使天㑹六年降為蒲州置防禦使天徳元年升為河中府仍舊䕶國軍節度使大定五年置陜西元帥府户十萬六千五百三十九縣七鎮四河東倚有中條山五老山黄河媯水汭水鎮二永樂合河滎河貞祐三年升為滎州以河津萬泉隸焉有黄河汾水睢邱鎮一北郎虞鄉有雷首山中條山壇道山萬泉鎮一胡壁臨晉有三疑山黄河河津猗氏有涑水絳州上宋置絳郡防禦天㑹六年置絳陽軍節度使興定二年十二月升為晉安府總管河東南路兵馬三年三月置河東南路轉運司户一十三萬一千五百一十縣八鎮五闗一正平倚劇有定境山汾水澮水鼓水鎮一澤掌曲沃劇有絳山絳水汾水澮水鎮二柴村九王稷山有稷山汾水翼城興定四年七月升為翼州以垣曲絳縣隸焉元光二年升為節鎮軍曰翼安有澮髙山清野山烏嶺山太平有汾水垣曲有王屋山清廉山黄河清水鎮一臯落闗一行臺綘有太陰山敎山綘水鎮一繪交平水興定四年七月徙置汾河之西從平陽公胡天作之請也解州上刺史宋慶成軍防禦國初置解梁郡軍後廢為刺郡貞祐三年復升為節鎮軍名寳昌興定四年徙治平陸縣户七萬一千二百三十二縣六鎮四解倚有壇道山鹽池平陸有呉山黄河鎮一張店芮城宋隸陜州有中條山黄河龍泉夏有巫咸山中條山淡水鎮一曹張安邑有中條山稷山鹽池涑水聞喜有九龍山湯山涑水鎮二東鎮劉荘澤州上刺史宋髙平郡天㑹六年以與北京澤州同加南字天徳三年復去南字貞祐四年𨽻潞州昭義軍後又改隸孟州元光二年升為節鎮軍曰忠昌戸五萬九千四百一十六縣六鎮二晉城倚有太行山丹水白水天井闗鎮二周村巴公舊又置星軺鎮端氏有石門山巨峻山陵川有太行山九仙山陽城元光二年十一月升為勣州有王屋山濩澤髙平有頭顱山米山丹水沁水有鹿臺山沁水馬邑山潞州上宋隆徳府上黨郡昭徳軍節度使天㑹六年節度使兼潞南遼沁觀察處置使戸七萬九千二百三十六縣八鎮四上黨倚鎮一八義壺闗有抱犢山紫團山赤壤山屯留有盤秀山絳山鎮一寺底長子有羊頭山發鳩山堯水鎮一横水潞城有三垂山伏牛山潞水漳水襄垣有鹿臺山湼水漳水鎮一裭亭黎城有白巖山故壺闗山涉貞祐三年七月升為崇州以黎城縣隸焉四年八月以殘破復為縣興定五年九月復升為州有崇山涉水遼州中刺史宋本樂平郡刺史天㑹六年以與東京遼州同加南字天徳三年復去南字戸一萬五千八百五十縣四鎮一闗一遼山倚有箕山青谷水鎮一平城舊縣也貞元間廢為鎮屬遼山縣及廢舊芹泉鎮闗一黄榆社有武鄊水石勒漚麻池和順有九原山儀城舊為平城縣貞元二年廢入遼山為鎮貞祐四年復升為縣更今名沁州中錦山郡宋威勝軍天㑹六年升為州元光二年升為節鎮軍曰義勝戸一萬八千五十九縣四鎮一銅鞮倚冇銅鞮山石梯山洹水交水武鄊有湖甲山武鄊水鎮一南闗沁源元光二年十一月升為穀州有霍山沁水綿上有羊頭山沁水懐州上宋河内郡防禦天㑹六年以與臨潢府懐州同加南字仍舊置沁南軍節度使天徳三年去南字皇統三年閏四月置黄沁河堤都大管勾司大定五年置行元帥府興定五年置招撫司戸八萬六千七百五十六縣四鎮六河内倚有太行陘太行山黄河沁水淇水鎮四武德栢鄊萬善清化修武有濁鹿城鎮一承恩山陽興定四年以修武縣重泉村為山陽縣隸輝州武渉冇太行山天門山黄河沁水鎮一宋郭孟州上宋濟源郡節度天㑹六年降河陽府為孟州置防禦守盟津宣宗朝置經畧司户四萬一千六百四十九縣四鎮二河陽倚有嶺山黄河湛水同水鎮二縠羅沇河王屋有王屋山天壇山析城山黄河濟源有太行山孔山濟水澳水沁水温有黄河湋水京兆府路宋為永興軍路皇統二年省併陜西六路為四曰京兆曰慶原曰熙秦曰鄜延府一領節鎮一防禦一刺郡四縣三十六鎮三十七京兆府上宋京兆郡永興軍節度使皇統二年置總管府天徳二年置陜西路統軍司陜西東路轉運司産白芷麻黄白蒺藜茴香細辛户九萬八千一百七十七縣十二鎮十舊又有中橋臨涇二鎮後廢長安倚有終南山龍首山灃水渭水鎬水鎮一子午咸寧倚本萬年後更名泰和四年廢尋復鎮二鳴犢乾祐興平有渭水醴泉涇陽臨潼有驪山渭戯鎮一零口藍田有藍田山蕢山灞水雲陽鎮一孟店髙陵有涇渭白渠鎮二毗沙渭城終南宋清平軍鎮一甘河櫟陽有渭水洹河清泉陂鎮一栗邑鄠有終南山牛首渼陂渭水鎮一秦渡咸陽商州下刺史宋上洛郡軍事貞祐四年升為防禦尋隸陜州興定二年正月復來屬元光二年五月改隸河南路户三千九百九十九縣二鎮二舊又有西市黄川青雪三鎮後廢上洛有楚山熊耳山丹水嶢闗鎮二商洛灃陽皆舊為縣貞元二年廢為鎮洛南有冡嶺山洛水虢州下刺史宋虢郡軍事貞祐二年割為陜