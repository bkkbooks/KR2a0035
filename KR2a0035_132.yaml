body:
  text: 金史卷一百三十二列傳第七十逆臣秉德本名乙辛唐括辨烏帶大興國徒單阿里出虎僕散師恭本名忽土徒單貞李老僧完顏元宜紇石烈執中本名胡沙虎昔者孔子作春秋而亂臣賊子懼其法有五焉微而顯志而晦婉而成章盡而不汙懲惡而勸善夫懲惡乃所以勸善也作逆臣傳秉德本名乙辛初為西南路招討使改汴京留守丁母憂起復為兵部尚書拜參知政事皇統八年與烏林答蒲盧虎等廉察郡縣使還拜平章政事廷議欲徙遼陽渤海人屯燕南秉德及左司郎中三合議其事近侍高壽星在徙中壽星訴於悼后后以白帝帝怒杖秉德而殺三合是時熙宗在位久悼后干政而繼嗣未立帝無聊不平屢殺宗室箠辱大臣秉德以其故懷忿乃與唐括辨烏帶等謀廢立烏帶以其謀告海陵海陵乃與秉德謀弒熙宗皇統九年十二月九日遂與唐括辨烏帶忽土阿里出虎大興國李老僧海陵妹夫特厮弒熙宗于寢殿秉德初意不在海陵已弒熙宗未有所屬忽土奉海陵坐秉德等皆拜稱萬歲殺曹國王宗敏左丞相宗賢時秉德位在海陵上因被杖怨望謀廢立而海陵因之以為亂既立以秉德為左丞相兼侍中左副元帥封蕭王賜鐵券與錢二千萬絹一千匹馬牛各三百羊三千久之為烏帶所譖出領行臺尚書省事時秉德方在告亟召之限十日內發行會海陵欲除太宗諸子並除秉德以秉德首謀廢立及弒熙宗不即勸進銜之烏帶因言秉德與宗本謀反有狀曰昨來秉德曾於宗本家飲酒海州刺史子忠言秉德有福貌類趙太祖秉德偃仰笑受其言臣妻言秉德妻嘗指斥主上語皆不順及秉德與宗本相別時指斥尤甚且謂曆數有歸秉德招刑部侍郎漫獨曰已前曾說那公事頗記憶否漫獨曰不存性命事何可對衆便說似此逆狀甚明海陵遣使就行臺殺秉德並殺前行臺參知政事烏林答贊謀贊謀妻秉德乳母也初贊謀與前行臺左丞溫敦思忠同在行臺思忠黷貨無厭贊謀薄之由是有隙故思忠乘是並誣贊謀及其子殺之贊謀不肯跪受刑行刑者立而縊殺之海陵以贊謀家財奴婢盡賜思忠秉德與烏帶以口語致怨既死遂並殺其弟特里辭里及宗翰子孫死者三十餘人宗翰之後遂絶世宗即位追復秉德官爵贈儀同三司初撒改薨宗翰襲其猛安親管謀克秉德死海陵以賞烏帶傳其子兀答補大定六年世宗憫宗翰無後詔以猛安謀克還撒改曾孫盆買遣使改葬撒改宗翰於山陵西南二十里百官致奠其家産給近親以奉祭祀秉德既死其中都宅第左副元帥杲居之杲死海陵遷都迎其嫡母徒單氏居之徒單遇害世宗惡其不祥施為佛寺唐括辨本名斡骨剌尚熙宗女代國公主為駙馬都尉纍官參知政事尚書左丞與右丞相秉德謀廢立而烏帶以告海陵海陵謂辨曰我輩不能匡救旦暮且及禍若行大事誰可立者辨曰無乃胙王常勝乎海陵問其次辨曰鄧王子阿楞海陵曰阿楞屬疏安得立辨曰公豈有意邪海陵曰若不得已捨我其誰於是旦夕相與密謀護衛將軍特思疑之以告悼后曰辨等因間每竊竊偶語不知議何事悼后以告熙宗熙宗怒召辨責之曰爾與亮謀何事將如我何杖而遣之自是謀益甚十二月九日代國公主為其母悼后作佛事居寺中故海陵秉德等俱會於辨家至夜辨等以刀藏衣下相隨入宮門者以辨駙馬不疑皆內之至殿門直宿護衛覺之辨舉刀呵之使無動既弒熙宗立海陵辨為尚書右丞相兼中書令封王賜錢二千萬絹千匹馬牛各三百羊三千並鐵券進拜左丞相父彰德軍節度使重國遷東平尹初辨與海陵謀逆辨嘗言其家奴多可用者海陵固已懷之及行弒之夕會於辨家待興國出宮辨因設饌衆皆恇懼不能食辨獨飽食自若海陵由此知其忮忍畏忌之及即位嘗與辨觀太祖畫像海陵指示辨曰此眼與爾相似辨色動海陵亦色動由是疑辨益忌之及與蕭裕謀致宗本罪並致辨嘗與宗本謀反即殺之重國坐奪官正隆二年起為沂州防禦使改清州防禦使大定初重國與徒單拔改俱以政跡著聞歷安國彰化橫海軍節度使後辨子孫上書言辨死天德間祖重國亦坐追削正隆初重國已復官職乞追復辨官爵是時海陵已降為庶人以辨與弒逆不許言本名烏帶行臺左丞相阿魯補子也熙宗時纍官大理卿熙宗晚年喜怒不常大臣往往危懼右丞相秉德左丞唐括辨謀廢立烏帶即詣海陵啓之遂與俱弒熙宗海陵即位烏帶為平章政事封許國王賜錢絹馬牛羊鐵券並如其黨烏帶妻唐括氏淫泆舊與海陵通又私其家奴閻乞兒秉德嘗對熙宗斥其事烏帶銜之未發也時海陵多忌會有疾少間烏帶遂誣奏秉德有指斥語曰主上數日不視朝若有不諱誰當繼者臣曰主上有皇子秉德曰嬰兒豈能勝天下大任必也葛王乎海陵以為實然故出秉德已而殺之以秉德世襲猛安謀克授烏帶進右丞相烏帶與宗本有親海陵以烏帶告秉德事故宗本之禍烏帶獨免遂以秉德千戶謀克及其子婦家産盡賜之進司空左丞相兼侍中居數月烏帶早朝以日陰晦將雨意海陵不視朝先趨出朝百官皆隨之去已而海陵御殿知烏帶率百官出朝惡之遂落司空出為崇義軍節度使後海陵思慕唐括容色因其侍婢來候問起居海陵許立為后使殺烏帶海陵詐為烏帶哀傷使其子兀答補佩金符乘驛赴喪追封為王仍詔有司送其靈車賜絹三百為道途費納唐括於宮中封貴妃兀答補襲猛安謀克大定六年以猛安謀克還撒改曾孫以阿魯補謀克授兀答補終同知大興尹子瑭本名烏也阿補以曾祖阿魯補功充筆硯祗候大興國事熙宗為寢殿小底權近侍局直長最見親信未嘗去左右每逮夜熙宗就寢興國時從主者取符鑰歸家主者即以付之聽其出入以為常皇統九年海陵生日熙宗使興國以宋司馬光畫像及他珍玩賜海陵悼后亦以物附賜熙宗不悅杖興國一百海陵謀弒意先得興國乃可伺間入宮行大事且度興國無罪被杖必有怨望心可乘此說之乃因李老僧結興國既而知無異心可與謀乃召至臥內令解衣欲與之俱臥意有所屬者興國固辭不敢曰即有使惟大王之命海陵曰主上無故殺常勝又殺皇后乃以常勝家産賜阿楞既又殺阿楞遂以賜我我深以為憂奈何興國曰是固可慮也海陵曰朝臣旦夕危懼皆不自保向者我生日因皇后附賜物君遂被杖我亦見疑主上嘗言會須殺君我與君皆將不免寧坐待死何如舉大事我與大臣數人謀議已定爾以為如何興國曰如大王言事不可緩也乃約十二月九日夜起事興國取符鑰開門矯詔召海陵入夜二更海陵秉德等入熙宗常置佩刀於御榻上是夜興國先取投榻下及亂作熙宗求佩刀不得遂遇弒海陵既立以興國為廣寧尹賜奴婢百口犀玉帶各一錢絹馬牛鐵券如其黨進階金紫光祿大夫再賜興國錢千萬黃金四百兩銀千兩良馬四匹駝車一乘橐駝三頭真珠巾玉鈎帶玉佩刀及玉校鞍轡天德四年改崇義軍節度使賜名邦基再授絳陽武寧節度使改河間尹世宗即位廢于家凡海陵所賜皆奪之大定中邦基兄邦傑自京兆判官還世宗曰大邦傑因其弟進濫厠縉紳豈可復用並罷其子弟與所贈父官及海陵降為庶人詔曰大邦基與海陵同謀弒逆逋誅至今為幸多矣遂磔于思陵之側徒單阿里出虎會寧葛馬合窟申人徙懿州父拔改太祖時有戰功領謀克曷速館軍帥皇統四年為兵部侍郎歷天德軍節度使改興中尹與宗幹世為姻家皇統九年阿里出虎與僕散忽土俱為護衛十人長海陵將弒熙宗欲得二人者為內應遂許以女妻阿里出虎子而以逆謀告之阿里出虎素凶暴聞其言喜甚曰阿家此言何晚邪廢立之事亦男子所為主上不能保天下人望所屬惟在阿家今日之謀乃我素志也遂與忽土俱以十二月九日直禁中海陵故以是夜二更入宮至寢殿阿里出虎先進刃忽土次之熙宗頓仆海陵復刃之血濺其面及衣海陵既立以阿里出虎為右副點檢賜錢絹馬牛羊如其黨子术斯剌尚榮國公主合女加昭毅大將軍駙馬都尉天德二年留守東京加儀同三司八月改河間尹世襲臨潢府路斜剌阿猛安領親管謀克以憂去職起復為太原尹封王阿里出虎自謂有佐立功受鐵券凶狠益甚奴視僚屬少忤其意輒箠辱無所恤嘗問休咎於卜者高鼎遂以鼎所占問張王乞王乞以謂當有天命阿里出虎喜以王乞語告鼎鼎上變阿里出虎伏誅並殺其妻及王乞海陵使其子术斯剌焚其尸投骨水中拔改自西京留守歷西南路招討使忠順軍節度使入為勸農使復為河間尹改臨洮尹入為工部尚書改興平軍節度使濟南尹卒僕散師恭本名忽土上京老海達葛人本微賤宗幹嘗周恤之擢置宿衛為十人長海陵謀逆以忽土出自其家有恩欲使為內應謂之曰我有一言欲告君久矣恐泄於人未敢也忽土曰肌肉之外皆先太師所賜苟有補於國王死不敢辭先太師謂宗幹也海陵曰主上失道吾將行廢立事必得君為助乃可忽土許之十二月九日忽土直宿海陵因之入宮至寢殿熙宗聞步屣聲咄之衆皆却立不敢動忽土曰事至此不進得乎乃相與排闥而入既弒熙宗秉德等尚未有所屬忽土曰始者議立平章今復何疑乃奉海陵坐衆前稱萬歲遂召曹國王宗敏至即使忽土殺之既即位忽土為左副點檢賜錢絹馬牛羊鐵券轉都點檢改名師恭遷會寧牧拜太子少師工部尚書封王頃之以憂解職起復為樞密副使進拜樞密使貞元三年為右丞相正隆初拜太尉復為樞密使無何以憂去起復為太尉樞密使海陵至汴京賜忽土第一區鄰寧德宮宮徒單太后所居也忽土時時入見太后及契丹撒八反海陵命忽土與蕭懷忠北伐比行忽土入辭寧德太后與語久之海陵聞而惡之疑其與太后有異謀是時蕭禿剌斡盧補與契丹撒八連戰皆無功糧運不繼乃退軍臨潢而撒八聞師恭以大軍且至乃謀歸大石沿龍駒河西去師恭至臨潢追之不及海陵使樞密副使白彥敬等討撒八師恭還遣其子忽殺虎乘傳逆之至則執而戮于市師恭臨刑繩枚窒口不能言但舉首視天日而已遂族滅之並誅滅蕭禿剌蕭賾蕭懷忠家大定初皆復官爵及海陵降為庶人師恭以預弒復削之世宗幸上京過老海達葛師恭族人臨潢尹守中定遠大將軍阿里徒等皆奪官二十八年上謂宰臣曰海陵遣僕散師恭蕭禿剌蕭懷忠追撒八不及皆坐誅遂夷其族虐之甚也平章政事襄對曰是時臣在軍中忽土賾有精甲一萬三千有餘賊軍雖多皆脅從之人以氈紙為甲易與也忽土等恇怯遷延賊乃遁去上曰審如是則誅之可也兄渾坦徒單貞本名特思忒黑闢剌人也祖抄從太祖伐遼有功授世襲猛安父婆盧火以戰功纍官開府儀同三司貞娶遼王宗幹女海陵同母女弟也皇統九年貞與海陵俱弒熙宗海陵既立以貞為左衛將軍封貞妻平陽長公主貞為駙馬都尉殿前左副點檢轉都點檢兼太子少保封王改大興尹都點檢如故俄授臨潢府路昏斯魯猛安居二年海陵召貞勖之曰汝自幼常在左右頗著微勞而近日乃怠忽縱有罪樹私恩凡人富貴而驕皆死徵也汝若不制汝心將無所不至賜之死復何辭朕念弟襄及公主與朕同胞故少示懲戒貞但號泣即日解點檢職仍為大興尹復戒之曰今而後能以勤自勵朕當思之不然黜爾歸田里矣逾月復為都點檢大興尹如故正隆二年例封瀋遷樞密副使賜佩刀入宮轉同判大宗正事海陵將伐宋詔朝官除三國人使宴飲其餘飲酒者死六年正月四日立春節益都尹京安武節度使爽金吾上將軍阿速飲於貞第海陵使周福兒賜土牛至貞第見之以告海陵召貞詰之曰戎事方殷禁百官飲酒卿等知之乎貞等伏地請死海陵數之曰汝等若以飲酒殺人太重固當諫古人三諫不聽亦勉從君命魏武帝軍行令曰犯麥者死已而所乘馬入麥中乃割髮以自刑犯麥微事也然必欲以示信朕為天下主法不能行于貴近乎朕念慈憲太后子四人惟朕與公主在而京等皆近屬曲貸死罪於是杖貞七十京等三人各杖一百降貞為安武軍節度使京為灤州刺史爽歸化州刺史無何拜貞御史大夫以本官為左監軍從伐宋至揚州海陵死北還見世宗于中都詔以貞女為皇太子妃除貞為太原尹改咸平貞在咸平貪汙不法纍贓巨萬徙真定尹事覺世宗使大理卿李昌圖鞫之貞即引伏昌圖還奏上問之曰貞停職否對曰未也上怒抵昌圖罪復遣刑部尚書移剌道往真定問之徵其贓還主有司徵給不以時詔先以官錢還其主而令貞納官凡還主贓皆準此例降貞為博州防禦使降貞妻為清平縣主頃之遷震武節度使遣使者往戒敕之詔曰朕念卿懿戚不待終考更遷大鎮非常之恩不可數得卿勿蹈前過轉河中尹進封其妻為任國公主賜黃金百兩重綵二十端賜貞擊毬馬二匹改東京留守賜玉吐鶻弓矢賜貞妻錢萬貫有司奏海陵已貶為庶人宗幹不當猶稱帝於是以宗幹有社稷功詔追封為遼王其子孫及諸女皆降貞妻降永平縣主貞自儀同三司降特進奪猛安不稱駙馬都尉再徙臨潢尹初與弒熙宗凡九人海陵以暴虐自斃秉德辨忽土阿里出虎以疑見殺言以妻殞裕老僧以反誅至是貞與大興國尚在而興國擯棄不用獨貞以世姻籍恩寵雖夫婦降削爵號而世宗慮久遠終不以私恩曲庇久之詔誅貞及其妻與二子慎思十六而宥其諸孫俄而興國亦誅皇統逆黨盡矣章宗即位尊母皇太子妃為皇太后追封貞為太尉梁國公貞祖抄司空魯國公父婆盧火司徒齊國公貞妻梁國夫人子補火慎思十六俱為鎮國上將軍無何再贈貞太師廣平郡王諡莊簡貞妻進封梁國公主李老僧舊為將軍司書吏與大興國有親素相厚海陵秉政興國屬諸海陵海陵以為省令史及將舉事使老僧結興國興國終為海陵取符鑰納海陵宮中成弒逆者老僧為之也海陵既立以老僧為同知廣寧尹事賜錢千萬絹五百匹馬牛各二百羊二千久之海陵惡韓王亨將殺之求其罪不可得遂以亨為廣寧尹再任老僧同知使伺察亨構致其罪亨喜博及至廣寧常與老僧博待之甚厚老僧由是不忍致亨死罪遲疑者久之海陵再使小底訛論促老僧老僧乃與亨家奴六斤謀殺亨獄中語在亨傳及耶律安禮自廣寧還朝海陵謂之曰孛迭三罪伏其一已見觖望爾乃梁王故吏若亨伏辜必罪及親族故榜殺之海陵以老僧於亨有遲回意遂降老僧為易州刺史久之遷同知大興尹賜名惟忠改延安府同知大定二年與兵部尚書可喜謀反誅論曰書曰王左右常伯常任準人綴衣虎賁周公曰嗚呼休茲知恤鮮哉穆王告伯冏曰慎簡乃僚其無以巧言令色便辟側媚其惟吉士金人所謂寢殿小底猶周之綴衣所謂護衛猶周之虎賁也則皆羣僕侍御之臣矣海陵弒逆而大興國忽土阿里出虎為之扼掔皆出于小底護衛之中熙宗固不知恤之也一日熙宗與近侍飲酒會夜稽古殿火上欲往視都點檢辭不失引帝裾止之奏曰臣在此陛下何患願無親往熙宗謂辭不失被酒甚怒之明日杖而出之已而思其忠復見召用海陵與唐括辨時時屏人私語護衛特思察其非常海陵擠而殺之皇統末年羣臣解體無尊君謹上之心而羣姦竊發僕御之臣不復有如辭不失特思者矣綿之詩曰豫曰有疏附豫曰有先後豫曰有奔走豫曰有禦侮嗚乎先後禦侮之臣豈可少哉完顏元宜本名阿列一名移特輦本姓耶律氏父慎思天輔七年宗望追遼主至天德慎思來降且言夏人以兵迎遼主將渡河去宗望移書夏人諭以禍福夏人乃止賜慎思姓完顏氏官至儀同三司元宜便騎射善擊毬皇統元年充護衛纍遷甌里本羣牧使入為武庫署令轉符寶郎海陵篡立為兵部尚書天德三年詔凡賜姓者皆復本姓元宜復姓耶律氏歷順義昭義節度使復為兵部尚書勸農使海陵伐宋以本官領神武軍都總管以大名路騎兵萬餘益之前鋒渡淮拔昭關遇宋兵萬餘于柘臯力戰却之至和州宋兵十萬來拒元宜麾軍力戰抵暮而罷宋人乘夜襲營元宜擊走之黎明追及宋兵斬首數萬以功遷銀青光祿大夫海陵增置浙西道都統制使元宜領之督諸軍渡江佩金牌賜衣一襲是時世宗已即位于遼陽軍中多懷去就海陵軍令慘急亟欲渡江衆欲亡歸決計於元宜猛安唐括烏野曰前阻淮渡皆成擒矣比聞遼陽新天子即位不若共行大事然後舉軍北還元宜曰待王祥至謀之王祥者元宜子為驍騎副都指揮使在別軍元宜使人密召王祥既至遂約詰旦衛軍番代即行事元宜先欺其衆曰有令爾輩皆去馬詰旦渡江衆皆懼乃以舉事告之皆許諾十月乙未黎明元宜王祥與武勝軍都總管徒單守素猛安唐括烏野謀克斡盧保婁薛溫都長壽等率衆犯御營海陵聞亂以為宋兵奄至攬衣遽起箭入帳中取視之愕然曰乃我兵也大慶山曰事急矣當出避之海陵曰走將安往方取弓已中箭仆地延安少尹納合斡魯補先刃之手足猶動遂縊殺之驍騎指揮使大磐整兵來救王祥出語之曰無及矣大磐乃止軍士攘取行營服用皆盡乃取大磐衣巾裹海陵尸焚之遂收尚書右丞李通浙西道副統制郭安國監軍徒單永年近侍局使梁珫副使大慶山皆殺之元宜行左領軍副大都督事使使者殺皇太子光英于南京大軍北還大定二年春入見拜御史大夫詔曰高楨為御史大夫號為正直頗涉煩碎臣下衣冠不正亦被糾舉職事有大於此者爾宜勉之未幾拜平章政事封冀國公賜玉帶甲第一區復賜姓完顏氏往泰州路規措討契丹事元宜使忠勇校尉李榮招窩斡窩斡殺榮詔追贈榮進官四階五月上聞元宜將還遣使止之契丹已平元宜還朝奏請益諸羣牧鎧甲詔從之每羣牧益二十副元宜復請益臨潢戍軍士馬詔給馬六百匹久之罷為東京留守乞還所賜甲第上從之賜以襲衣吐鶻馬海東青鶻未幾致仕薨于家上聞之遣使致祭賻贈甚厚大定十一年尚書省奏擬納合斡魯補除授上曰昔廢海陵此人首入弒之人臣之罪莫大於是豈可復加官使其世襲謀克姑聽仍舊大定十八年扎里海上言凡為人臣能捍災禦侮有功者宜録用之今弒海陵者以為有功賞以高爵非所以勸事君也宜削奪以為人臣之戒臣在當時亦與其黨如正名定罪請自臣始上曰扎里海自請其罪以勸事君此亦人之所難遂以扎里海充趙王府祗候郎君元宜子習涅阿補大定二十五年為符寶祗候乞依女直人例遷官上曰賜姓一時之權宜令習涅阿補還本姓論曰春秋書齊公子商人弒其君舍又曰齊人弒其君商人嗟乎弒舍者商人也弒商人者邴歜閻職也海陵弒熙宗完顏元宜弒海陵商人之弒也邴歜閻職去之海陵之弒也元宜歸于世宗邴閻賤役元宜都將也握君之親兵窺利以弒之其罪豈容誅乎世宗僅能不大用之而已扎里海猶殺人而自首者也在律殺人未聞准首免罪而又豫賞者也況弒逆乎海陵弒五十三年復有胡沙虎之事紇石烈執中本名胡沙虎阿疏裔孫也徙東平路猛安大定八年充皇太子護衛出職太子僕丞改鷹坊直長再遷鷹坊使拱衛直指揮使明昌四年使過阻居監酒官移剌保迎謁後時飲以酒酒味薄執中怒毆傷移剌保詔的決五十未幾遷右副點檢肆傲不奉職降肇州防禦使踰年遷興平軍節度使丁母憂起復歸德軍節度使改開遠軍兼西南路招討副使俄知大名府事承安二年召為簽樞密院事詔佐丞相襄征伐執中不欲行奏曰臣與襄有隙且殺臣矣上怒其言不遜事下有司既而赦之出為永定軍節度使改西北路招討使復為永定軍坐奪部軍馬解職泰和元年起知大興府事詔契丹人立功官賞恩同女直人許存養馬匹得充司吏譯人著為令執中格詔不下上責之曰汝雖意在防間而不知朝廷自有定格自今勿復如此煩碎生事也乃下詔行之淶水人魏廷實祖任兒舊為靳文昭家放良天德三年編籍正戶已三世矣文昭孫勍詆廷實為奴及妄訴毆詈警巡院鞫對無狀法當訴本貫勍訴于府執中使廷實納錢五百貫與勍廷實不從還淶水執中徑遣鎖致廷實御史臺請移問執中轉奏御史臺不依制府未結斷令移推詔吏部侍郎李炳戶部侍郎粘割合答推問炳合答奏御史臺理直詔乃切責執中御史中丞孟鑄奏彈執中貪殘專恣不奉法令釋罪之後纍過不悛既蒙恩貸轉生跋扈如雄州詐認馬平州冒支俸破魏廷實家發其冢墓拜表不赴祈雨聚妓毆詈同僚擅令停職失師帥之體不稱京尹之任上曰執中粗人似有跋扈爾鑄對曰明天子在上豈容有跋扈之臣上意寤取閲奏章詔尚書省問之由是改武衛軍都指揮使平章政事僕散揆宣撫河南執中除山東東西路統軍使揆行省汴京伐宋升諸道統軍司為兵馬都統府執中為山東兩路兵馬都統定海軍節度使完顏撒剌副之執中分兵駐金城朐山請益發東平路兵屯密沂寧海登萊以遏兵衝詔從之時泰和六年四月也五月宋兵犯金城執中遣巡檢使周奴以騎兵三百禦之會宋益兵轉趨沭陽謀克三合伏卒五十人篁竹中伺宋兵過突出擊之殺十數人追至縣城宋兵不敢出會周奴以兵入城宋兵踰城走三合已焚其舟合擊大破之斬首五百餘級殺宋統領李藻擒忠義軍將呂璋十月執中率兵二萬出清口宋以步騎萬餘列南岸戰艦百艘拒上流相持纍日執中以舟兵二千搏戰遏宋舟兵遣副統移剌古與涅率精騎四千自下流徑渡宋兵望騎兵登南岸水陸俱潰追斬及溺死者甚衆盡獲其戰艦及戰馬三百遂克淮陰進兵圍楚州遷元帥左監軍執中縱兵虜掠上聞之杖其經歷官阿里不孫放還所掠未幾宋人請和詔罷兵除西南路招討使改西京留守大安元年授世襲謀克復知大興府事出知太原府復為西京留守行樞密院兼安撫使以徑兵七千遇大兵戰于定安之北薄暮先以麾下遁去衆遂潰行次蔚州擅取官庫銀五千兩及衣幣諸物奪官民馬與從行私人入紫荊關杖殺淶水令至中都朝廷皆不問乃遷右副元帥權尚書左丞執中益無所忌憚自請步騎二萬屯宣德州與之三千令駐媯川崇慶元年正月執中乞移屯南口或屯新莊移文尚書省曰大兵來必不能支一身不足惜三千兵為可憂十二關建春萬寧宮且不保朝廷惡其言下有司按問詔數其十五罪罷歸田里明年復召至中都預議軍事左諫議大夫張行信上書曰胡沙虎專逞私意不遁公道蔑省部以示強梁媚近臣以求稱譽骫法行事枉害平民行院山西出師無律不戰先退擅取官物杖殺縣令屯駐媯川乞移內地其謀略概可見矣欲使改易前非以收後效不亦難乎才誠可取雖在微賤皆當擢用何必老舊始能立功一將之用安危所係惟朝廷加察天下幸甚丞相徒單鎰以為不可用參知政事𤨠跪奏其姦惡乃止執中善結近幸交口稱譽五月詔給留守半俸預議軍事張行信復諫曰伏聞以胡沙虎老臣欲起而用人之能否不在新舊彼向之敗朝廷既知之矣乃復用之無乃不可乎遂止上終以執中為可用賜金牌權右副元帥將武衛軍五千人屯中都城北執中乃與其黨經歷官文繡局直長完顏醜奴提控宿直將軍蒲察六斤武衛軍鈐轄烏古論奪剌謀作亂是時大元大兵在近上使奉職即軍中責執中止務馳獵不恤軍事執中方飼鷂怒擲殺之遂妄稱知大興府徒單南平及其子刑部侍郎駙馬都尉沒烈謀反奉詔討之南平姻家福海別將兵屯於城北遣人以好語招之福海不知既至乃執之八月二十五日未五更分其軍為三軍由章義門入自將一軍由通玄門入執中恐城中出兵來拒乃遣一騎先馳抵東華門大呼曰大軍至北關已接戰矣既而再遣一騎亦如之使徒單金壽召知大興府徒單南平南平不知行至廣陽門西富義坊馬上與執中相見執中手槍刺之墮馬下金壽斫殺之使烏古論奪剌召沒烈殺之符寶祗候鄯陽護衛十人長完顏石古乃聞亂遽召大漢軍五百人赴難與執中戰不勝皆死之執中至東華門使呼門者親軍百戶冬兒五十戶蒲察六斤皆不應許以世襲猛安三品職事官亦不應呼都點檢徒單渭河渭河即徒單鎬也渭河縋城出見執中執中命聚薪焚東華門立梯登城護衛斜烈乞兒親軍春山共掊鎖開門納執中執中入宮盡以其黨易宿衛自稱監國都元帥居大興府陳兵自衛急召都轉運使孫椿年取銀幣賞金壽奪剌及軍官軍士大興府輿隸是夜召聲妓與親黨會飲明日以兵逼上出居衛邸誘左丞完顏綱至軍中即殺之執中意不可測丞相徒單鎰勸執中立宣宗執中然之是時莊獻太子在中都執中以皇太子儀仗迎莊獻入居東宮召符寶郎徒單福壽取符寶陳於大興府露階上盜用御寶出制除完顏醜奴德州防禦使烏古論奪剌順天軍節度使蒲察六斤潢海軍節度使徒單金壽永定軍節度使雖除外官皆留之左右其餘除拜猶數十人同時有兩蒲察六斤其一守東華門不肯從亂者召禮部令史張好禮欲鑄監國元帥印好禮曰自古無異姓監國者乃止遣奉御完顏忽失來等三人護衛蒲鮮班底完顏醜奴等十人迎宣宗於彰德使宦者李思忠弒上於衛邸盡徹沿邊諸軍赴中都平州騎兵屯薊州以自重邊戍皆不守矣九月甲辰宣宗即位拜執中太師尚書令都元帥監修國史封澤王授中都路和魯忽土世襲猛安以其弟同知河南府特末也為都點檢兼侍衛親軍都指揮使子猪糞除濮王傅兵部侍郎都點檢徒單渭河為御史中丞烏古論奪剌遙授知真定府事徒單金壽遙授知東平府事蒲察六斤遙授知平陽府事完顏醜奴同知河中府事權宿直將軍詔以烏古論誼居第賜執中儀鸞局給供張妻王賜紫結銀鐸車戊申執中侍朝宣宗賜之坐執中就坐不辭無何執中奏請降衛紹王為庶人奏再上詔百官議于朝堂太子少傅奧屯忠孝侍讀學士蒲察思忠附執中議衆相視莫敢言獨文學田廷芳奮然曰先朝素無失德尊號在禮不當削於是從之者禮部張敬甫諫議張信甫戶部武文伯龐才卿石抹晉卿等二十四人宣宗曰譬諸問途百人曰東行是十人曰西行是行道之人果適東乎適西乎豈以百人十人為是非哉既而曰朕徐思之數日詔降為東海郡侯大元遊騎至高橋宰臣以聞宣宗使人問執中執中曰計畫已定矣既而讓宰執曰吾為尚書令豈得不先與議而遽奏耶宰執遜謝而已提點近侍局慶山奴副使惟弼奉御惟康請除執中宣宗念援立功隱忍不許元帥右監軍术虎高琪屢戰不利執中戒之曰今日出兵果無功當以軍法從事矣高琪出戰復敗自度不免頗聞慶山奴諸人有謀十月辛亥高琪遂率所將辭軍入中都圍執中第執中聞變彎弓注矢外射不勝登後垣欲走衣絓墮而傷股軍士就斬之高琪持執中首詣闕待罪宣宗赦之以為左副元帥執中之黨呼於衢路曰辭軍反矣殺之者有賞市人從之辭軍死者甚衆一軍皆恟恟宣宗遣近侍撫諭之詔有司量加賻贈衆乃稍安明日除特末也泰寧軍節度使烏古論奪剌真授知濟南府事徒單金壽真授知歸德府事蒲察六斤真授知平陽府事甲寅左諫議大夫張行信上封事曰春秋之法國君立不以道若嘗與諸侯盟會即列為諸侯東海在位已六年矣為其臣者誰敢干之胡沙虎握兵入城躬行弒逆當是時惟鄯陽石古乃率衆赴援至于戰死論其忠烈在朝食祿者皆當愧之陛下始親萬機海內望化褒顯二人延及子孫庶幾少慰貞魂激天下之義氣宋徐羡之傅亮謝晦弒營陽王立文帝文帝誅之以江陵奉迎之誠免其妻子胡沙虎國之大賊世所共惡雖已死而罪名未正合暴其過惡宣布中外除名削爵緣坐其家然後為快陛下若不忍援立之勞則依倣元嘉故事亦足以示懲戒宣宗乃下詔暴執中過惡削其官爵贈鄯陽石古乃加恩其子慶山奴惟弼惟康皆遷賞近侍局自此用事矣論曰金九主遇弒者三其逆謀者十人熙宗之弒惟大興國一人世宗聲其罪而磔之思陵之側徒單貞雖誅未聞暴其罪狀後以戚畹又復贈官追封餘秉德唐括辨等六人皆以他罪誅海陵之弒其首惡為完顏元宜則令終焉衛紹王之弒日胡沙虎不死於司敗之誅而死於高琪之手古所謂弒君之賊人得而討之者謂請于公上而致討焉如孔子之請討陳是也豈有如琪之擅殺而以為功者乎金之政刑其亂若此國欲不亡其可得乎
