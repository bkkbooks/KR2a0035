body:
  text: 金史卷二本紀第二太祖太祖應乾興運昭德定功仁明莊孝大聖武元皇帝諱旻本諱阿骨打世祖第二子也母曰翼簡皇后拏懶氏遼道宗時有五色雲氣屢出東方大若二千斛囷倉之狀司天孔致和竊謂人曰其下當生異人建非常之事天以象告非人力所能為也咸雍四年戊申七月一日太祖生幼時與羣兒戲力兼數輩舉止端重世祖尤愛之世祖與臘醅麻産戰於野鵲水世祖被四創疾困坐太祖于膝循其髮而撫之曰此兒長大吾復何憂十歲好弓矢甫成童即善射一日遼使坐府中顧見太祖手持弓矢使射羣鳥連三發皆中遼使矍然曰奇男子也太祖嘗宴紇石烈部活離罕家散步門外南望高阜使衆射之皆不能至太祖一發過之度所至踰三百二十步宗室謾都訶最善射遠其不及者猶百步也天德三年立射碑以識焉世祖伐卜灰太祖因辭不失請從行世祖不許而心異之烏春既死窩謀罕請和既請和復來攻遂圍其城太祖年二十三被短甲免胄不介馬行圍號令諸軍城中望而識之壯士太峪乘駿馬持槍出城馳刺太祖太祖不及備舅氏活臘胡馳出其間擊太峪槍折刺中其馬太峪僅得免嘗與沙忽帶出營殺略不令世祖知之且還敵以重兵追之獨行隘巷中失道追者益急值高岸與人等馬一躍而過追者乃還世祖寢疾太祖以事如遼統軍司將行世祖戒之曰汝速了此事五月未半而歸則我猶及見汝也太祖往見曷魯騷古統軍既畢事前世祖沒一日還至家世祖見太祖來所請事皆如志喜甚執太祖手抱其頸而撫之謂穆宗曰烏雅束柔善惟此子足了契丹事穆宗亦雅重太祖出入必俱太祖遠出而歸穆宗必親迓之世祖已擒臘醅麻産尚據直屋鎧水肅宗使太祖先取麻産家屬康宗至直屋鎧水圍之太祖會軍親獲麻産獻馘於遼遼命太祖為詳穩仍命穆宗辭不失歡都皆為詳穩久之以偏師伐泥厖古部跋黑播立開等乃以達塗阿為鄉導沿帥水夜行襲之鹵其妻子初溫都部跋忒殺唐括部跋葛穆宗命太祖伐之太祖入辭謂穆宗曰昨夕見赤祥此行必克敵遂行是歲大雪寒甚與烏古論部兵沿土溫水過末鄰鄉追及跋忒於阿斯溫山北濼之間殺之軍還穆宗親迓太祖于靄建村撒改以都統伐留可謾都訶合石土門伐敵庫德撒改與將佐議或欲先平邊地部落城堡或欲徑攻留可城議不能決願得太祖至軍中穆宗使太祖往曰事必有可疑軍之未發者止有甲士七十盡以畀汝謾都訶在米里迷石罕城下石土門未到土人欲執謾都訶以與敵使來告急遇太祖於斜堆甸太祖曰國兵盡在此矣使敵先得志於謾都訶後雖種誅之何益也乃分甲士四十與之太祖以三十人詣撒改軍道遇人曰敵已據盆搦嶺南路矣衆欲由沙偏嶺往太祖曰汝等畏敵邪既度盆搦嶺不見敵已而聞敵乃守沙偏嶺以拒我及至撒改軍夜急攻之遲明破其衆是時留可塢塔皆在遼既破留可還攻塢塔城城中人以城降初太祖過盆搦嶺經塢塔城下從騎有後者塢塔城人攻而奪之釜太祖駐馬呼謂之曰毋取我炊食器其人謾言曰公能來此何憂不得食太祖以鞭指之曰吾破留可即於汝乎取之至是其人持釜而前曰奴輩誰敢毀詳穩之器也遣蒲家奴招詐都詐都乃降釋之穆宗將伐蕭海里募兵得千餘人女直兵未嘗滿千至是太祖勇氣自倍曰有此甲兵何事不可圖也海里來戰與遼兵合因止遼人自為戰勃海留守以甲贈太祖太祖亦不受穆宗問何為不受曰被彼甲而戰戰勝則是因彼成功也穆宗末年令諸部不得擅置信牌馳驛訊事號令自此始一皆自太祖啓之康宗七年歲不登民多流莩強者轉而為盜歡都等欲重其法為盜者皆殺之太祖曰以財殺人不可財者人所致也遂減盜賊徵償法為徵三倍民間多逋負賣妻子不能償康宗與官屬會議太祖在外庭以帛繫杖端麾其衆令曰今貧者不能自活賣妻子以償債骨肉之愛人心所同自今三年勿徵過三年徐圖之衆皆聽令聞者感泣自是遠近歸心焉歲癸巳十月康宗夢逐狼屢發不能中太祖前射中之旦日以所夢問僚佐衆皆曰吉兄不能得而弟得之之兆也是月康宗即世太祖襲位為都勃極烈遼使阿息保來曰何以不告喪太祖曰有喪不能弔而乃以為罪乎他日阿息保復來徑騎至康宗殯所閲賵馬欲取之太祖怒將殺之宗雄諫而止既而遼命久不至遼主好畋獵淫酗怠于政事四方奏事往往不見省紇石烈阿踈既奔遼穆宗取其城及其部衆不能歸遂與族弟銀术可辭里罕陰結南江居人渾都僕速欲與俱亡入高麗事覺太祖使夾古撒喝捕之而銀术可辭里罕先為遼戍所獲渾都僕速已亡去撒喝取其妻子而還二年甲午六月太祖至江西遼使使來致襲節度之命初遼每歲遣使市名鷹海東青于海上道出境內使者貪縱徵索無藝公私厭苦之康宗嘗以不遣阿踈為言稍拒其使者太祖嗣節度亦遣蒲家奴往索阿踈故常以此二者為言終至于滅遼然後已至是復遣宗室習古乃完顏銀术可往索阿踈習古乃等還具言遼主驕肆廢弛之狀於是召官僚耆舊以伐遼告之使備衝要建城堡修戎器以聽後命遼統軍司聞之使節度使哥來問狀曰汝等有異志乎修戰具飭守備將以誰禦太祖答之曰設險自守又何問哉遼復遣阿息保來詰之太祖謂之曰我小國也事大國不敢廢禮大國德澤不施而逋逃是主以此字小能無望乎若以阿踈與我請事朝貢苟不獲已豈能束手受制也阿息保還遼人始為備命統軍蕭撻不野調諸軍於寧江州太祖聞之使僕聒剌復索阿踈實觀其形勢僕聒剌還言遼兵多不知其數太祖曰彼初調兵豈能遽集如此復遣胡沙保往還言惟四院統軍司與寧江州軍及渤海八百人耳太祖曰果如吾言謂諸將佐曰遼人知我將舉兵集諸路軍備我我必先發制之無為人制衆皆曰善乃入見宣靖皇后告以伐遼事后曰汝嗣父兄立邦家見可則行吾老矣無貽我憂汝必不至是也太祖感泣奉觴為壽即奉后率諸將出門舉觴東向以遼人荒肆不歸阿踈並己用兵之意禱于皇天后土酹畢后命太祖正坐與僚屬會酒號令諸部使婆盧火徵移懶路迪古乃兵斡魯古阿魯撫諭斡忽急賽兩路係遼籍女直實不迭往完睹路執遼障鷹官達魯古部副使辭列寧江州渤海大家奴於是達魯古部實里館來告曰聞舉兵伐遼我部誰從太祖曰吾兵雖少舊國也與汝鄰境固當從我若畏遼人自往就之九月太祖進軍寧江州次寥晦城婆盧火徵兵後期杖之復遣督軍諸路兵皆會于來流水得二千五百人致遼之罪申告于天地曰世事遼國恪修職貢定烏春窩謀罕之亂破蕭海里之衆有功不省而侵侮是加罪人阿踈屢請不遣今將問罪於遼天地其鑒佑之遂命諸將傳梃而誓曰汝等同心盡力有功者奴婢部曲為良庶人官之先有官者進輕重視功苟違誓言身死梃下家屬無赦師次唐括帶斡甲之地諸軍禳射介而立有光如烈火起於人足及戈矛之上人以為兵祥明日次扎只水光見如初將至遼界先使宗幹督士卒夷塹既度遇渤海軍攻我左翼七謀克衆少却敵兵直犯中軍斜也出戰哲垤先驅太祖曰戰不可易也遣宗幹止之宗幹馳出斜也前控止哲垤馬斜也遂與俱還敵人從之耶律謝十墜馬遼人前救太祖射救者斃併射謝十中之有騎突前又射之徹扎洞胸謝十拔箭走追射之中其背飲矢之半僨而死獲所乘馬宗幹與數騎陷遼軍中太祖救之免胄戰或自傍射之矢拂于顙太祖顧見射者一矢而斃謂將士曰盡敵而止衆從之勇氣自倍敵大奔相蹂踐死者十七八撒改在別路不及會戰使人以戰勝告之而以謝十馬賜之撒改使其子宗翰完顏希尹來賀且稱帝因勸進太祖曰一戰而勝遂稱大號何示人淺也進軍寧江州諸軍填塹攻城寧江人自東門出溫迪痕阿徒罕邀擊盡殪之十月朔克其城獲防禦使大藥師奴陰縱之使招諭遼人鐵驪部來送款次來流城以俘獲賜將士召渤海梁福斡答剌使之偽亡去招諭其鄉人曰女直渤海本同一家我興師伐罪不濫及無辜也使完顏婁室招諭係遼籍女直師還謁宣靖皇后以所獲頒宗室耆老以實里館資産給將士初命諸路以三百戶為謀克十謀克為猛安酬斡等撫定讒謀水女直鱉古酋長胡蘇魯以城降十一月遼都統蕭糾里副都統撻不野將步騎十萬會于鴨子河北太祖自將擊之未至鴨子河既夜太祖方就枕若有扶其首者三寤而起曰神明警我也即鳴鼓舉燧而行黎明及河遼兵方壞凌道選壯士十輩擊走之大軍繼進遂登岸甲士三千七百至者才三之一俄與敵遇于出河店會大風起塵埃蔽天乘風勢擊之遼兵潰逐至斡論濼殺獲首虜及車馬甲兵珍玩不可勝計遍賜官屬將士燕犒彌日遼人嘗言女直兵若滿萬則不可敵至是始滿萬云斡魯古敗遼兵斬其節度使撻不野僕虺等攻賓州拔之兀惹雛鶻室來降遼將赤狗兒戰于賓州僕虺渾黜敗之鐵驪王回離保以所部降吾睹補蒲察復敗赤狗兒蕭乙薛軍于祥州東斡忽急塞兩路降斡魯古敗遼軍于咸州西斬統軍實婁于陳完顏婁室克咸州是月吳乞買撒改辭不失率官屬諸將勸進願以新歲元日恭上尊號太祖不許阿離合悶蒲家奴宗翰等進曰今大功已建若不稱號無以繫天下心太祖曰吾將思之收國元年正月壬申朔羣臣奉上尊號是日即皇帝位上曰遼以賓鐵為號取其堅也賓鐵雖堅終亦變壞惟金不變不壞金之色白完顏部色尚白於是國號大金改元收國丙子上自將攻黃龍府進臨益州州人走保黃龍取其餘民以歸遼遣都統耶律訛里𩽆左副統蕭乙薛右副統耶律張奴都監蕭謝佛留騎二十萬步卒七萬戍邊留婁室銀术可守黃龍上率兵趨達魯古城次寧江州西遼使僧家奴來議和國書斥上名且使為屬國庚子進師有火光正圓自空而墜上曰此祥徵殆天助也酹白水而拜將士莫不喜躍進逼達魯古城上登高望遼兵若連雲灌木狀顧謂左右曰遼兵心二而情怯雖多不足畏遂趨高阜為陳宗雄以右翼先馳遼左軍左軍却左翼出其陳後遼右軍皆力戰婁室銀术可衝其中堅凡九陷陳皆力戰而出宗翰請以中軍助之上使宗幹往為疑兵宗雄已得利擊遼右軍遼兵遂敗乘勝追躡至其營會日已暮圍之黎明遼軍潰圍出逐北至阿婁岡遼步卒盡殪得其耕具數千以給諸軍是役也遼人本欲屯田且戰且守故併其耕具獲之二月師還三月辛未朔獵于寥晦城四月遼耶律張奴以國書來上以書辭慢侮留其五人獨遣張奴回報書亦如之五月庚午朔避暑于近郊甲戌拜天射柳故事五月五日七月十五日九月九日拜天射柳歲以為常六月己亥朔遼耶律張奴復以國書來猶斥上名上亦斥遼主名以復之且諭之使降七月戊辰以弟吳乞買為諳班勃極烈國相撒改為國論勃極烈辭不失為阿買勃極烈弟斜也為國論勃極烈甲戌遼使辭剌以書來留之不遣九百奚營來降八月戊戌上親征黃龍府次混同江無舟上使一人道前乘赭白馬徑涉曰視吾鞭所指而行諸軍隨之水及馬腹後使舟人測其渡處深不得其底熙宗天眷二年以黃龍府為濟州軍曰利涉蓋以太祖涉濟故也九月克黃龍府遣辭剌還遂班師至江徑渡如前丁丑至自黃龍府己卯黃龍見空中癸巳以國論勃極烈撒改為國論忽魯勃極烈阿離合悶為國論乙室勃極烈十一月遼主聞取黃龍府大懼自將七十萬至門駙馬蕭特末林牙蕭查刺等將騎五萬步四十萬至斡鄰濼上自將禦之十二月己亥行次爻刺會諸將議皆曰遼兵號七十萬其鋒未易當吾軍遠來人馬疲乏宜駐于此深溝高壘以待上從之遣迪古乃銀术可鎮達魯古丁未上以騎兵親候遼軍獲督餉者知遼主以張奴叛西還二日矣是日上還至熟結濼有光見于矛端戊申諸將曰今遼主既還可乘怠追擊之上曰敵來不迎戰去而追之欲以此為勇邪衆皆悚愧願自效上復曰誠欲追敵約齎以往無事餫饋若破敵何求不得衆皆奮躍追及遼主于護步答岡是役也兵止二萬上曰彼衆我寡兵不可分視其中軍最堅遼主必在焉敗其中軍可以得志使右翼先戰兵數交左翼合而攻之遼兵大潰我師馳之橫出其中遼師敗績死者相屬百餘里獲輿輦帟幄兵械軍資他寶物馬牛不可勝計是戰斜也援矛殺數十人阿離本被圍溫迪罕迪忽迭以四謀克兵出之完顏蒙刮身被數創力戰不已功皆論最蕭特末等焚營遁去遂班師夾谷撒喝取開州婆盧火下特鄰城辭里罕降二年正月戊子詔曰自破遼兵四方來降者衆宜加優恤自今契丹奚漢渤海係遼籍女直室韋達魯古兀惹鐵驪諸部官民已降或為軍所俘獲逃遁而還者勿以為罪其酋長仍官之且使從宜居處閏月高永昌據東京使撻不野來求援高麗遣使來賀捷且求保州詔許自取之二月己巳詔曰比以歲凶庶民艱食多依附豪族因為奴隸及有犯法徵償莫辦折身為奴者或私約立限以人對贖過期則為奴者並聽以兩人贖一為良若元約以一人贖者即從元約四月乙丑以斡魯統內外諸軍與蒲察迪古乃會咸州路都統斡魯古討高永昌胡沙補等被害五月斡魯等敗永昌撻不野擒永昌以獻戮之于軍東京州縣及南路係遼女直皆降詔除遼法省稅賦置猛安謀克一如本朝之制以斡魯為南路都統迭勃極烈阿徒罕破遼兵六萬于照散城九月己亥上獵近郊乙巳南路都統斡魯來見于婆盧買水始製金牌十二月庚申朔諳班勃極烈吳乞買及羣臣上尊號曰大聖皇帝改明年為天輔元年天輔元年正月開州叛加古撒喝等討平之國論勃極烈斜也以兵一萬取泰州四月遼秦晉國王耶律捏里來伐迪古乃婁室婆盧火將兵二萬會咸州路都統斡魯古擊之五月丁巳詔自收寧江州已後同姓為婚者杖而離之七月戊申以完顏斡論知東京事八月癸亥高麗遣使來請保州十二月甲子斡魯古等敗耶律捏里兵于蒺藜山拔顯州乾懿豪徽成川惠等州皆降是月宋使登州防禦使馬政以國書來其略曰日出之分實生聖人竊聞征遼屢破勍敵若克遼之後五代時陷入契丹漢地願畀下邑二年正月庚寅遼雙州節度使張崇降使散覩如宋報聘書曰所請之地今當與宋夾攻得者有之二月癸丑朔遼使耶律奴哥等來議和辛酉孛堇迪古乃婁室來見上以遼主近在中京而敢輒來皆杖之劾里保雙古等言咸州都統斡魯古知遼主在中京而不進討芻糧豐足而不以實聞攻顯州時所獲生口財畜多自取三月癸未朔命闍哥代為都統而鞫治之斡魯古坐降謀克壬辰遼使耶律奴哥以國書來庚子以婁室言黃龍府地僻且遠宜重戍守乃命合諸路謀克以婁室為萬戶鎮之四月辛巳遼使以國書來五月丙申命胡突衮如遼六月甲寅詔有司禁民凌虐典雇良人乃倍取贖直者甲戌遼通祺雙遼等州八百餘戶來歸命分置諸部擇膏腴之地處之七月癸未詔曰匹里水路完顏术里古渤海大家奴等六謀克貧乏之民昔嘗給以官糧置之漁獵之地今歷日已久不知登耗可具其數以聞胡突衮還自遼耶律奴哥復以國書來丙申胡突衮如遼遼戶二百來歸處之泰州詔遣阿里骨李家奴特里底招諭未降者仍詔達魯古部勃堇辭列凡降附新民善為存撫來者各令從便安居給以官糧毋輒動擾八月胡突衮還自遼耶律奴哥突迭復以國書來九月戊子詔曰國書詔令宜選善屬文者為之其令所在訪求博學雄才之士敦遣赴闕閏月庚戌朔以降將霍石韓慶和為千戶九百奚部蕭寶乙辛北部訛里野漢人王六兒王伯龍契丹特末高從祐等各率衆來降遼耶律奴哥以國書來十月癸未以龍化州降者張應古劉仲良為千戶乙未咸州都統司言漢人李孝功渤海二哥率衆來降命各以所部為千戶十二月甲辰遣孛堇术孛以定遼地諭高麗耶律奴哥以國書來遼懿州節度使劉宏以戶三千並執遼候人來降以為千戶川州寇二萬已降復叛紇石烈照里擊破之三年正月甲寅東京人為質者永吉等五人結衆叛事覺誅其首惡餘皆杖百沒入在行家屬資産之半詔知東京事斡論繼有犯者並如之丙辰詔鱉古孛堇酬斡曰胡魯古迭八合二部來送款若等先時不無交惡自今毋相侵擾三月耶律奴哥以國書來四月丙子朔日有食之五月壬戌詔咸州路都統司曰兵興以前曷蘇館回怕里與係遼籍不係遼籍女直戶民有犯罪流竄邊境或亡入于遼者本皆吾民遠在異境朕甚憫之今既議和當行理索可明諭諸路千戶謀克遍與詢訪其官稱名氏地里具録以上六月辛卯遼遣太傅習泥烈等奉册璽來上擲册文不合者數事復之散覩還自宋宋使馬政及其子宏來聘散覩受宋團練使上怒杖而奪之宋使還復遣孛堇辭列曷魯等如宋七月辛亥遼人楊詢卿羅子韋各率衆來降命各以所部為謀克八月己丑頒女直字九月以遼册禮使失期詔諸路軍過江屯駐十一月習泥烈等復以國書來曷懶甸長城高麗增築三尺詔胡剌古習顯慎固營壘四年二月辭列曷魯還自宋宋使趙良嗣王暉來議燕京西京地三月甲辰上謂羣臣曰遼人屢敗遣使求成惟飾虛辭以為緩師之計當議進討其令咸州路統軍司治軍旅修器械具數以聞辛酉詔咸州路都統司曰朕以遼國和議無成將以四月二十五日進師令斜葛留兵一千鎮守闍母以餘兵來會于渾河遼習泥烈以國書來四月乙未上自將伐遼以遼使習泥烈宋使趙良嗣等從行五月甲辰次渾河西使宗雄先趨上京遣降者馬乙持詔諭城中壬子至上京詔官民曰遼主失道上下同怨朕興兵以來所過城邑負固不服者即攻拔之降者撫恤之汝等必聞之矣今爾國和好之事反覆見欺朕不欲天下生靈久罹塗炭遂決策進討比遣宗雄等相繼招諭尚不聽從今若攻之則城破矣重以弔伐之義不欲殘民故開示明詔諭以禍福其審圖之上京人恃禦備儲蓄為固守計甲寅亟命進攻上謂習泥烈趙良嗣等曰汝可觀吾用兵以卜去就上親臨城督將士諸軍鼓譟而進自旦及巳闍母以麾下先登克其外城留守撻不野以城降趙良嗣等奉觴為壽皆稱萬歲是日赦上京官民詔諭遼副統余覩壬戌次沃黑河宗幹率羣臣諫曰地遠時暑軍馬罷乏若深入敵境糧餽乏絶恐有後艱上從之乃班師命分兵攻慶州余覩襲闍母於遼河完顏背答烏塔等戰却之完顏特虎死焉七月癸卯上至自伐遼九月燭隈水部實里古達等殺孛堇酬斡僕忽得以叛十月戊辰朔日有食之戊寅命斡魯分胡剌古烏春之兵以討實里古達十一月東京留守司乞本京官民質子增數番代上不許曰諸質子已各受田廬若復番代則往來動搖可並仍舊十二月宋復使馬政來請西京之地五年春正月斡魯敗實里古達於合撻剌山誅首惡四人餘悉撫定二月遣昱及宗雄分諸路猛安謀克之民萬戶屯泰州以婆盧火統之賜耕牛五十四月乙丑朔宗翰請伐遼詔諸路預戒軍事五月遼都統耶律余覩等詣咸州降閏月辛巳國論胡魯勃極烈撒改薨六月癸巳余覩與其將吏來見丙申千戶胡離答坐擅署部人為蒲里衍杖一百罷之庚子詔諳版勃極烈吳乞買二國政以勃極烈斜也為忽魯勃極烈蒲家奴為勃極烈宗翰為移賚勃極烈七月庚辰詔咸州都統司曰自余覩來灼見遼國事宜已決議親征其治軍以俟師期尋以連雨罷親征命勃極烈昱為都統移賚勃極烈宗翰副之帥師而西十二月辛丑以忽魯勃極烈杲為內外諸軍都統以昱宗翰宗幹宗望宗盤等副之甲辰詔曰遼政不綱人神共棄今欲中外一統故命汝率大軍以行討伐爾其慎重兵事擇用善謀賞罰必行糧餉必繼勿擾降服勿縱俘掠見可而進無淹師期事有從權毋須申稟戊申詔曰若克中京所得禮樂儀仗圖書文籍並先次津發赴闕六年正月癸酉都統杲克高恩回紇三城乙亥取中京遂下澤州二月庚寅朔日有食之己亥宗翰等敗遼奚王霞末于北安州降奚部西節度使訛里剌以本部降壬寅都統杲遣使來奏捷並獻所獲貨寶詔曰汝等提兵于外克副所任攻下城邑撫安人民朕甚嘉之所言分遣將士招降山前諸部計悉已撫定續遣來報山後若未可往即營田牧馬俟及秋成乃圖大舉更當熟議見可則行如欲益兵具數來上不可恃一戰之勝輒有弛慢新降附者當善撫存宣諭將士使知朕意宗翰駐北安遣希尹等略地獲遼護衛耶律習泥烈知遼主獵鴛鴦濼以其子晉王賢而有人望惡而殺之衆益離心雖有西北西南兩路兵馬皆羸弱遂遣耨碗溫都等報都統杲進兵襲之三月都統杲出青嶺宗翰出瓢嶺追遼主于鴛鴦濼遼主奔西京宗翰復追至白水濼不及獲其貨寶己巳至西京壬申西京降希尹追遼主于乙室部不及乙亥西京復叛是月遼秦晉國王耶律捏里即位于燕四月辛卯復取西京壬辰遣徒單吳甲高慶裔如宋戊戌都統杲自西京趨白水濼勃極烈昱襲毗室部于鐵呂川為敵所敗還會察剌兵追至黃水北大破之耶律坦招徠西南諸部西至夏其招討使耶律佛頂降金肅西平二郡漢軍四千餘人叛去耶律坦等襲取之闍母婁室招降天德雲內寧邊東勝等州獲阿踈而還是時山西城邑諸部雖降人心未固遼主保陰山耶律捏里在燕京都統杲遣宗望入奏請上臨軍五月辛酉宗望來奏捷百官入賀賜宴歡甚先是獲遼樞密使得里底節度使和尚雅里斯余里野等都統杲使阿鄰護送赴闕得里底道亡阿鄰坐誅耶律捏里遣使請罷兵戊寅使楊勉以書諭捏里使之降謀葛失遣其子菹泥刮失貢方物六月戊子朔上親征遼發自上京諳班勃極烈吳乞買監國辛亥詔諭上京官民曰朕順天弔伐已定三京但以遼主未獲兵不能已今者親征欲由上京路進恐撫定新民驚疑失業已出自篤密呂其先降後叛逃入險阻者詔後出首悉免其罪若猶拒命孥戮無赦是月耶律捏里卒斡魯婁室敗夏人於野谷七月甲子詔諸將無得遠迎以廢軍務乙丑上京漢人毛八十率二千餘戶降因命領之丙寅以斡答剌招降者衆命領八千戶以忽薛副之壬午希尹以阿踈見杖而釋之八月己丑次鴛鴦濼都統杲率官屬來見癸巳上追遼主于大魚濼昱宗望追及遼主于石輦鐸與戰敗之遼主遁己亥次居延北辛丑中京將完顏渾黜敗契丹奚漢六萬于高州孛堇麻吉死之得里得滿部降昱宗望追遼主于烏里質鐸不及九月庚申次草濼闍母平中京部族之先叛者及招撫沿海郡縣節度使耶律慎思領諸部入內地乙丑詔六部奚曰汝等既降復叛扇誘衆心罪在不赦尚以歸附日淺恐綏懷之道有所未孚故復令招諭若能速降當釋其罪官皆仍舊歸化州降戊辰次歸化州甲戌宗雄薨丁丑奉聖州降十月丙戌朔次奉聖州詔曰朕屢敕將臣安輯懷附無或侵擾然愚民無知尚多逃匿山林即欲加兵深所不忍今其逃散人民罪無輕重咸與矜免有能率衆歸附者授之世官或奴婢先其主降並釋為良其布告之使諭朕意蔚州降庚寅余覩等遣蔚州降臣翟昭彥徐興田慶來見命昭彥慶皆為刺史興為團練使詔曰比以幽薊一方招之不服今欲帥師以往故先安撫山西諸部汝等既已懷服宜加撫存官民未附已前罪無輕重及係官逋負皆與釋免諸官各遷之丁酉蔚州翟昭彥田慶殺知州事蕭觀寧等以叛丙午復降十一月詔諭燕京官民王師所至降者赦其罪官皆仍舊十二月上伐燕京宗望率兵七千先之迪古乃出得勝口銀术哥出居庸關婁室為左翼婆盧火為右翼取居庸關丁亥次媯州戊子次居庸關庚寅遼統軍都監高六等來送款上至燕京入自南門使銀术哥婁室陳于城上乃次于城南遼知樞密院左企弓虞仲文樞密使曹勇義副使張彥忠參知政事康公弼僉書劉彥宗奉表降辛卯遼百官詣軍門叩頭請罪詔一切釋之壬辰上御德勝殿羣臣稱賀甲午命左企弓等撫定燕京諸州縣詔西京官吏曰乃者師至燕都已皆撫定唯蕭妃與官屬數人遁去已發兵追襲或至彼路可執以來黃龍府叛宗輔討平之七年正月丁巳遼奚王回離保僭稱帝甲子遼平州節度使時立愛降詔曲赦平州又詔諳班勃極烈曰比遣昂徙諸部民人于嶺東而昂悖戾騷動煩擾致多怨叛其違命失衆當置重典若或有疑禁錮以待庚午詔中京都統斡論曰聞卿撫定人民各安其業朕甚嘉之回離保聚徒逆命汝宜計畫無使滋蔓壬申詔招諭回離保癸酉以時立愛言招撫諸部己卯宋使來議燕京西京地庚辰宜錦乾顯成川豪懿等州皆降甲申詔曰諸州部族歸附日淺民心未寧今農事將興可遣分諭典兵之官無縱軍士動擾人民以廢農業二月乙酉朔命撒八詔諭興中府降之遼來州節度使田皓隰州刺史杜師回遷州刺史高永福潤州刺史張成皆降壬辰詔諳版勃極烈曰郡縣今皆撫定有逃散未降者已釋其罪更宜招諭之前後起遷戶民去鄉未久豈無懷土之心可令所在有司深加存恤毋輒有騷動衣食不足者官賑貸之癸巳詔曰頃因兵事未息諸路關津絶其往來今天下一家若仍禁之非所以便民也自今顯咸東京等路往來聽從其便其間被虜及鬻身者並許自贖為良仍令馳驛布告興中宜州復叛宋使趙良嗣來請加歲幣以代燕稅及議畫疆與遣使賀正旦生辰置榷場交易並計議西京等事癸卯銀术哥鐸剌如宋乙巳詔都統杲曰新附之民有材能者可録用之戊申詔平州官與宋使同分割所與燕京六州之地癸丑大赦是月改平州為南京以張覺為留守三月甲寅朔將誅昂以習不失諫杖之七十仍拘泰州戊午都統杲等言耶律麻哲告余覩吳十鐸剌等謀叛宜早圖之上召余覩等從容謂之曰朕得天下皆我君臣同心同德以成大功固非汝等之力今聞汝等謀叛若誠然耶必須鞍馬甲胄器械之屬當悉付汝朕不食言若再為我擒無望免死欲留事朕無懷異志吾不汝疑余覩等皆戰栗不能對命杖鐸剌七十餘並釋之宋使盧益趙良嗣馬宏以國書來四月丁亥遣斡魯宗望襲遼主于陰山壬辰復書于宋師初入燕遼兵復犯奉聖州林牙大石壁龍門東二十五里都統斡魯聞之遣照立婁室馬和尚等率兵討之生獲大石悉降其衆癸巳詔曰自今軍事若皆中覆不無留滯應此路事務申都統司餘皆取決樞密院契丹九斤聚黨興中府作亂擒之九斤自殺命習古乃婆盧火監護長勝軍及燕京豪族工匠由松亭關徙之內地己亥次儒州斡魯宗望等襲遼權六院司喝離質于白水濼獲之其宗屬秦王許王等十五人降聞遼主留輜重青冢以兵萬人往應州遣照里背答宗望婁室銀术哥等追襲之宗望追及遼主決戰大敗之獲其子趙王習泥烈及傳國璽五月甲寅南京留守張覺據城叛丙寅次野狐嶺己巳次落藜濼斡魯等以趙王習泥烈林牙大石駙馬乳奴等來獻並上所獲國璽宗雋以所俘遼主子秦王許王女奧野等來見奚部都統撻懶攻速古啜里鐵尼所部十三巖皆平之又遣奚馬和尚攻下品達魯古並五院司諸部執其節度乙列回離保為其下所殺辛巳詔諭南京官民六月壬午朔次鴛鴦濼是日闍母敗張覺于營州丙申上不豫將還上京命移賚勃極烈宗翰為都統勃極烈昱迭勃極烈斡魯副之駐兵雲中以備邊己酉次斡獨山驛召諳班勃極烈吳乞買七月辛酉次牛山宗翰還軍中八月辛巳朔日有食之乙未次渾河北諳班勃極烈吳乞買率宗室百官上謁戊申上崩于部堵濼西行宮年五十六九月癸丑梓宮至上京乙卯葬宮城西南建寧神殿丙辰諳班勃極烈即皇帝位天會三年三月上尊諡曰武元皇帝廟號太祖立原廟于西京天會十三年二月辛酉改葬和陵立開天啓祚睿德神功之碑于燕京城南嘗所駐蹕之地皇統四年改和陵曰睿陵五年十月增諡應乾興運昭德定功睿神莊孝仁明大聖武元皇帝貞元三年十一月改葬于大房山仍號睿陵贊曰太祖英謨睿略豁達大度知人善任人樂為用世祖陰有取遼之志是以兄弟相授傳及康宗遂及太祖臨終以太祖屬穆宗其素志蓋如是也初定東京即除去遼法減省租稅用本國制度遼主播越宋納歲幣以幽薊武朔等州與宋而置南京于平州宋人終不能守燕代卒之遼主見獲宋主被執雖功成于天會間而規摹運為實自此始金有天下百十有九年太祖數年之間算無遺策兵無留行底定大業傳之子孫嗚呼雄哉
