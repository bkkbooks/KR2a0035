body:
  text: 金史卷一百六列傳第四十四張暐張行簡賈益謙劉炳术虎高琪塔不也張暐字明仲莒州日照縣人博學該通登正隆五年進士調陳留主簿淄州酒稅副使課增羡遷昌樂令改永清令補尚書省令史除太常博士兼國子助教丁父憂服除調山東東路轉運副使入為太常丞兼左贊善大夫章宗封原王兼原王府文學章宗册為皇太孫復為左贊善轉左諭德兼太常丞充宋國報諭使至盱眙宋人請赴宴暐曰大行在殯未可及受賜不舞蹈宋人服其知禮使還遷太常少卿兼修起居改禮部郎中修起居注如故遷右諫議大夫兼禮部侍郎明昌二年太傅徒單克寧薨章宗欲親為燒飯是時孝懿皇后梓宮在殯暐奏仰惟聖慈追念勳臣恩禮隆厚孰不感勸太祖時享尚且權停若為大臣燒飯禮有未安今已降恩旨聖意至厚人皆知之乞俯從典禮則兩全矣章宗從之上封事者言提刑司可罷暐上疏曰陛下即位因民所利更法立制無慮數十百條提刑之設政之大者若為浮議所搖則內外無所取信唐開元中或請選擇守令停採訪使姚崇奏十道採訪猶未盡得人天下三百餘州縣多數倍安得守令皆稱其職然則提刑之任誠不可罷擇其人而用之生民之大利國家之長策也因舉漢刺史六條以奏上曰卿言與朕意合拜禮部尚書孫即康鞫治鎬王永中事還奏有詔覆訊羣臣舉暐及兵部侍郎烏古論慶裔上使參知政事馬琪諭暐曰百官舉閲實鎬王事要勿屈抑其人亦不可虧損國法上因謂宰臣曰鎬王視永蹈為輕馬琪曰人臣無將由是永中之獄決矣霍王從彝母早死溫妃石抹氏養之明昌六年溫妃薨上問從彝喪服暐奏慈母服齊衰三年桐杖布冠禮也從彝近親至尊壓降與臣下不同乞於未葬以前服白布衣絹巾既葬止用素服終制朝會從吉上從其奏承安元年八月壬子上召暐至內殿問曰南郊大祀今用度不給俟他年可乎暐曰陛下即位于今八年大禮未舉宜亟行之上曰北方未寧致齋之際有不測奏報何如對曰豈可逆度而妨大禮今河平歲豐正其時也上復問曰僧道三年一試八十而取一不亦少乎對曰此輩浮食無益有損不宜滋益也上曰周武帝唐武宗後周世宗皆賢君其壽不永雖曰偶然似亦有因也對曰三君矯枉太過今不毀除不崇奉是為得中矣是歲郊見上帝焉頃之翰林修撰路鐸論胥持國不可再用因及董師中趨走持國及丞相襄之門上曰張暐父子必不如是也三年為御史大夫懇辭不許明年坐奏事不實奪一官解職起為安武軍節度使致仕例給半俸久之暐不復請遂止暐自妻卒後不復娶亦無姬侍齋居與子行簡講論古今諸孫課誦其側至夜分乃罷以為常歷太常禮部二十餘年最明古今禮學家法為士族儀表子行簡行信行信自有傳行簡字敬甫穎悟力學淹貫經史大定十九年進士第一除應奉翰林文字丁母憂歸葬益都杜門讀書人莫見其面服除復任章宗即位轉修撰進讀陳言文字攝太常博士夏國遣使陳慰欲致祭大行靈殿行簡曰彼陳慰非專祭不可廷議遣使橫賜高麗比遣使報哀彼以細故邀阻且出嫚言俟移問遇報橫賜未晚徒單克寧韙其言深器重之轉翰林修撰與路伯達俱進讀陳言文字纍遷禮部郎中司天臺劉道用改進新曆詔學士院更定曆名行簡奏乞覆校測驗俟將來月食無差然後賜名詔翰林侍講學士黨懷英等覆校懷英等校定道用新曆明昌三年不置閏即以閏月為三月二年十二月十四日金木星俱在危十三度道用曆在十三日差一日三年四月十六日夜月食時刻不同道用不曾考驗古今所記比證事迹輒以上進不可用道用當徒一年收贖長行彭徽等四人各杖八十罷去羣臣屢請上尊號章宗不從將下詔以示四方行簡奏曰往年飢民棄子或丐以與人其後詔書官為收贖或其父母衣食稍充即識認官亦斷與之自此以後飢歲流離道路人不肯收養肆為捐瘠餓死溝中伏見近代禦災詔書皆曰以後不得復取今乞依此施行上是其言詔書中行之久之兼同修國史改禮部侍郎提點司天臺直學士同修史如故行簡言唐制僕射宰相上日百官通班致賀降階答拜國朝皇太子元正生日三師三公宰執以下須羣官同班拜賀皇太子立受再答拜今尚書省宰執上日分六品以下別為一班揖賀宰執坐答揖左右司郎中五品官廷揖亦坐答之臣謂身坐舉手答揖近於坐受也宰執受賀其禮乃重於皇太子恐於義未安別嫌明微禮之大節伏請宰執上日令三品以下官同班賀宰執起立依見三品官儀式通答揖上曰此事何不早辨正之如都省擅行卿論之是矣行簡對曰禮部蓋嘗參酌古今典禮擬定儀式省廷不從輒改以奏下尚書省議遂用之宰執上日三品以下羣官通班賀起立答拜自此始行簡轉對因論典故之學乞於太常博士之下置檢閲官二員通禮學資淺者使為之積資乃遷博士又曰今雖有國朝集禮至於食貨官職兵刑沿革未有成書乞定會要以示無窮承安五年遷侍講學士同修史提點司天如故泰和二年為宋主生日副使上召生日使完顏瑭戒之曰卿過界勿飲酒每事聽於行簡謂行簡曰宋人行禮好事末節苟有非是皆須正之舊例所有不可不至上復曰頗聞前奉使者過淮每至中流即以分界爭渡船此殊非禮卿自戒舟人且語宋使曰兩國和好久矣不宜爭細故傷大體丁寧諭之使悉此意也四年詔曰每奏事之際須令張行簡常在左右五年羣臣復請上尊號上不許詔行簡作批答因問行簡宋范祖禹作唐鑑論尊號事行簡對曰司馬光亦嘗諫尊號事不若祖禹之詞深至以謂臣子生諡君父頗似慘切上曰卿用祖禹意答之仍曰太祖雖有尊號太宗未嘗受也行簡乞不拘對偶引祖禹以微見其意從之其文深雅甚得代言之體改順天軍節度使上謂行簡曰卿未更治民今至保州民之情偽卒難臆度如何治之則可對曰臣奉行法令不敢違失獄訟之事以情察之鈐制公吏禁抑豪猾以鎮靜為務庶幾萬分之一上曰在任半歲或一年所得利害上之行簡到保州上書曰比者括官田給軍既一定矣有告欲別給者輒從其告至今未已名曰官田實取之民以與之奪彼與此徒啓爭端臣所管已撥深澤縣地三百餘頃復告水占沙鹹者三之二若悉從之何時可定臣謂當限以月日不許再告為便下尚書省議奏請如實有水占河塌不可耕種本路及運司佐官按視尚書省下按察司覆同然後改撥若沙鹹塉薄當準已撥為定制曰可六年召為禮部尚書兼侍講同修國史祕書監進太一新曆詔行簡校之七年上遣中使馮賢童以實封御扎賜行簡曰朕念鎬鄭二王誤干天常自貽伊戚藁葬郊野多歷年所朕甚悼焉欲追復前爵備禮改葬卿可詳閲唐貞觀追贈隱巢並前代故事密封以聞又曰欲使石古乃於威州擇地營葬歲時祭奠兼命衛王諸子中立一人為鄭王後謹其祭祀此事既行理須降詔卿草詔文大意一就封進行簡乃具漢淮南厲王長楚王英唐隱太子建成巢剌王元吉譙王重福故事為奏並進詔草遂施行焉纍遷太子太保翰林學士承旨尚書修史如故貞祐初轉太子太傅上書論議和事其略曰東海郡侯嘗遣約和較計細故遷延不決今都城危急豈可拒絶臣願更留聖慮包荒含垢以救生靈或如遼宋相為敵國歲奉幣帛或二三年以繼選忠實辨捷之人往與議之庶幾有成可以紓患是時百官議者雖有異同大概以和親為主焉莊獻太子葬後不置宮師官升承旨為二品以寵行簡兼職如故三年七月朝廷備防秋兵械令內外職官不以丁憂致仕皆納弓箭行簡上書曰箭非通有之物其清貧之家及中下監當丁憂致仕安有所謂如法軍器今繩以軍期補弊修壞以求應命而已與倉猝製造何以異哉若於隨州郡及猛安謀克人戶拘括擇其佳者買之不足則令職輸所買之價庶不擾而事可辦左丞相僕散端平章政事高琪盡忠右丞賈益謙皆曰丁憂致仕者可以免此權參政烏古論德升曰職官久享爵祿軍興以來曾無寸補況事已行而復改天下何所取信是議也丁憂致仕官竟得免是歲卒贈銀青榮祿大夫諡文正行簡端賣心慎密為人主所知自初入翰林至太常禮部典貢舉終身縉紳以為榮與弟行信同居數十年人無間言所著文章十五卷禮例纂一百二十卷會同朝獻禘祫喪葬皆有記録及清臺皇華戒嚴為善自公等記藏于家贊曰張暐行簡世為禮官世習禮學其為禮也行於家庭講於朝廷施用於鄰國無不中度古者官有世掌學有專門金諸儒臣唯張氏父子庶幾無愧於古乎賈益謙字彥亨沃州人也本名守謙避哀宗諱改焉大定十年詞賦進士歷仕州郡以能稱明昌間入為尚書省令史纍遷左司郎中章宗諭之曰汝自知除至居是職左司事不為不練凡百官行止資歷固宜照勘勿使差繆若武庫署直長移剌郝自平定州軍事判官召為典輿副轄在職才五月降授門山縣簿尉朕比閲貼黃行止乃俱書作一十三月行止尚如此失實其如選法何蓋是汝不用心致然爾今姑杖知除掾汝勿復犯之五年為右諫議大夫上言提刑司官不須遣監察體訪宜據其任內行事考其能否而升黜之上曰卿之言其有所見乎守謙對曰提刑官若不稱職衆所共知且其職與監察等臣是故言之上嘉納焉是年夏上將幸景明宮清暑守謙連上疏極諫之上御後閣召守謙入對稱旨進兼尚書吏部侍郎時鎬王以疑忌下獄上怒甚朝臣無敢言者守謙上章論其不可言極懇切上諭之曰汝言諸王皆有覬心而遊其門者不無橫議此何等語固當罪汝以汝前言事亦有當處故免既而以議鎬王事有違上意解職削官二階承安元年七月降為寧化州刺史五年八月改為山東路按察使轉河北西路轉運使泰和三年四月召為御史中丞四年三月出為定武軍節度使八年六月復為御史中丞八月改吏部尚書九月詔守謙等一十三員分詣諸路與本路按察司官一員同推排民戶物力上召見於香閣諭之曰朕選卿等隨路推排除推收外其新強銷乏戶雖集衆推唱然銷乏者勿銷不盡如一戶元物力三百貫今蠲減二百五十貫猶有不能當新強者勿添盡量存氣力如一戶添三百貫而止添二百貫之類卿等宜各用心百姓應當賦役十年之間利害非細苟不稱所委治罪當不輕也尋出知濟南府移鎮河中大安末拜參知政事貞祐二年二月改河東南路安撫使俄知彰德府三年召為尚書省右丞會宣宗始遷汴梁益謙乃建言汴之形勢惟恃大河今河朔受兵羣盜並起宜嚴河禁以備不虞凡自北來而無公憑者勿聽渡是時河北民遷避河南者甚衆侍御史劉元規上言僑戶宜與土民均應差役上留中而自以其意問宰臣丞相端平章盡忠以為便益謙曰僑戶應役甚非計也蓋河北人戶本避兵而來兵稍息即歸矣今旅寓倉皇之際無以為生若又與地著者並應供億必騷動不能安居矣豈主上矜恤流亡之意乎上甚嘉賞曰此非朕意也因出元規章示之三年八月進拜尚書左丞四年正月致仕居鄭州興定五年正月尚書省奏章宗實録已進呈衛王事迹亦宜依海陵庶人實録纂集成書以示後世制可初胡沙虎弒衛王立宣宗一時朝臣皆謂衛王失道天命絶之虎實無罪且有推戴之功獨張行信抗章言之不報舉朝遂以為諱及是史官謂益謙嘗事衛王宜知其事乃遣編修一人就鄭訪之益謙知其旨謂之曰知衛王莫如我然我聞海陵被弒而世宗立大定三十年禁近能暴海陵蟄惡者輒得美仕故當時史官修實録多所附會衛王為人勤儉慎惜名器較其行事中材不及者多矣吾知此而已設欲飾吾言以實其罪吾亦何惜餘年朝議偉之正大三年年八十薨三子賢卿頤卿翔卿皆以門資入仕贊曰賈益謙於衛紹王可謂盡事君之義矣海陵之事君子不無憾焉夫正隆之為惡暴其大者斯亦足矣中冓之醜史不絶書誠如益謙所言則史亦可為取富貴之道乎嘻其甚矣傳曰不有廢者其何以興劉炳葛城人每讀書見前古忠臣烈士為國家畫策慮萬世安輒歎息景慕貞祐三年中進士第即日上書條便宜十事其一曰任諸王以鎮社稷臣觀往歲王師屢戰屢衄率皆自敗承平日久人不知兵將帥非才既無靖難之謀又無效死之節外託持重之名而內為自安之計擇驍果以自隨委疲懦以臨陳陳勢稍動望塵先奔士卒從而大潰朝廷不加詰問輒為益兵是以法度日紊倉庾日虛閭井日凋土地日蹙自大駕南巡遠近相望益無固志吏任河北者以為不幸逡巡退避莫之敢前昔唐天寶之末洛陽潼關相次失守皇輿夜出向非太子回趨靈武率先諸將則西行之士當終老於劍南矣臣願陛下擇諸王之英明者總監天下之兵北駐重鎮移檄遠近戒以軍政則四方聞風者皆將自奮前死不避折衝厭難無大於此夫人情可以氣激不可以力使一卒先登則萬夫齊奮此古人所以先身教而後威令也二曰結人心以固基本天子惠人不在施豫在于除其同患因所利而利之今艱危之後易於為惠因其欲安而慰撫之則忠誠親上之心當益加於前日臣願寬其賦役信其號令凡事不便者一切停罷時遣重臣按行郡縣延見耆老問其疾苦選廉正黜貪殘拯貧窮恤孤獨勞來還定則效忠徇義無有二志矣故曰安民可與行義危民易與為亂惟陛下留神三曰廣收人材以備國用備歲寒者必求貂狐適長塗者必畜騏驥河南陝西車駕臨幸當有以大慰士民之心其有操行為民望者稍擢用之平居可以勵風俗緩急可以備驅策昭示新恩易民觀聽陰係天下之心也四曰選守令以安百姓郡守縣令天子所恃以為治百姓所依以為命者也今衆庶已弊官吏庸暗無安利之才貪暴昏亂與姦為市公有斗粟之賦私有萬錢之求遠近囂囂無所控告自今非才器過人政迹卓異者不可使在此職親勳故舊雖望隆資高不可使為長吏則賢者喜於殊用益盡其能不肖者愧慕而思自勵矣五曰褒忠義以勵臣節忠義之士奮身效命力盡城破而不少屈事定之後有司略不加省棄職者顧以恩貸死事者反不見録天下何所慕憚而不為自安之計邪使為臣者皆知殺身之無益臨難可以苟免甚非國家之利也六曰務農力本以廣蓄積此最強兵富民之要術當今之急務也七曰崇節儉以省財用今海內虛耗田疇荒蕪廢奢從儉以紓生民之急無先於此者八曰去冗食以助軍費兵革之後人物凋喪者十四五郡縣官吏署置如故甚非審權救弊之道九曰修軍政以習守戰自古名將料敵制勝訓練士卒故可使赴湯蹈火百戰不殆孔子曰以不教民戰是謂棄之兵法曰器械不利以其卒與敵也卒不服習以其將與敵也將不知兵以其主與敵也主不擇將以其國與敵也可不慎哉十曰修城池以備守禦保障國家惟都城與附近數郡耳北地不守是無河朔矣黃河豈足恃哉書奏宣宗異焉復試之曰河北城邑何術可保兵民雜居何道可和鈔法如何而通物價如何而平炳對大略以審擇守將則城邑固兵不侵民則兵民和斂散相權則鈔法通勸農薄賦則物價平宣宗雖異其言而不能用但補御史臺令史而已論曰劉炳可謂能言之士矣宣宗召試既不失對而以一臺令史賞之足以倡士氣乎术虎高琪或作高乞西北路猛安人大定二十七年充護衛轉十人長出職河間都總管判官召為武衛軍鈐轄遷宿直將軍除建州刺史改同知臨洮府事泰和六年伐宋與彰化軍節度副使把回海備鞏州諸鎮宋兵萬餘自鞏州轆轤嶺入高琪奮擊破之賜銀百兩重綵十端青宜可內附詔知府事石抹仲溫與高琪俱出界與青宜可合兵進取詔高琪曰汝年尚少近聞與宋人力戰奮勇朕甚嘉之今與仲溫同行出界如其成功高爵厚祿朕不吝也詔封吳曦為蜀國王高琪為封册使詔戒諭曰卿讀書解事蜀人亦識威名勿以財賄動心失大國體如或隨去奉職有違禮生事卿與喬宇體察以聞使還加都統號平南虎威將軍宋安丙遣李孝義率步騎三萬攻秦州先以萬人圍皂角堡高琪赴之宋兵列陳山谷以武車為左右翼伏弩其下來逆戰既合宋兵陽却高琪軍見宋兵伏不得前退整陳宋兵復來凡五戰宋兵益堅不可以得志高琪分騎為二出者戰則止者俟止者出則戰者還還者復出以更久之遣蒲察桃思剌潛兵上山自山馳下合擊大破宋兵斬首四千級生擒數百人李孝義乃解圍去宋兵三千致馬連寨以窺湫池遣夾谷福壽擊走之斬七百餘級大安三年纍官泰州刺史以辭軍三千屯通玄門外未幾升縉山縣為鎮州以高琪為防禦使權元帥右都監所部辭軍賞賚有差至寧元年八月尚書左丞完顏綱將兵十萬行省於縉山敗績貞祐初遷元帥右監軍閏月詔高琪曰聞軍事皆中覆得無失機會乎自今當即行之朕但責成功耳是月被詔自鎮州移軍守禦中都迤南次良鄉不得前乃還中都每出戰輒敗紇石烈執中戒之曰汝連敗矣若再不勝當以軍法從事及出果敗高琪懼誅十月辛亥高琪自軍中入遂以兵圍執中第殺執中持其首詣闕待罪宣宗赦之以為左副元帥一行將士遷賞有差丙寅詔曰胡沙虎畜無君之心形迹露見不可盡言武衛副使提點近侍局慶山奴近侍局使斜烈直長撒合輦纍曾陳奏方慎圖之斜烈漏此意於按察判官胡魯胡魯以告翰林待制訛出訛出達於高琪今月十五日將胡沙虎戮訖惟茲臣庶將恐有疑肆降札書不匿厥旨論者謂高琪專殺故降此詔頃之拜平章政事宣宗論馬政顧高琪曰往歲市馬西夏今肯市否對曰木波畜馬甚多市之可得括緣邊部落馬亦不少矣宣宗曰盡括邊馬緩急如之何閲三日復奏曰河南鎮防二十餘軍計可得精騎二萬緩急亦足用宣宗曰馬雖多養之有法習之有時詳諭所司令加意也貞祐二年十一月宣宗問高琪曰所造軍器往往不可用此誰之罪也對曰軍器美惡在兵部材物則戶部工匠則工部宣宗曰治之且將敗事宣宗問楊安兒事高琪對曰賊方據險臣令主將以石牆圍之勢不得出擒在旦夕矣宣宗曰可以急攻或力戰突圍我師必有傷者應奉翰林文字完顏素蘭自中都議軍事還上書求見乞屏左右故事有奏密事輒屏左右先是太府監丞遊茂以高琪威權太重中外畏之常以為憂因入見屏人密奏請裁抑之宣宗曰既委任之權安得不重茂退不自安復欲結高琪詣其第上書曰宰相自有體豈可以此生人主之疑招天下之議恐高琪不相信復曰茂嘗間見主上實惡相公權重相公若能用茂當使上不疑而下無所議高琪聞茂嘗請間屏人奏事疑之乃具以聞遊茂論死詔免死杖一百除名自是凡屏人奏事必令近臣一人侍立及素蘭請密召至近侍局給筆札使書所欲言少頃宣宗御便殿見之惟留近侍局直長趙和和侍立素蘭奏曰日者元帥府議削伯德文哥兵權朝廷乃詔領義軍改除之命拒而不受元帥府方欲討捕朝廷復赦之且不令隸元帥府不知誰為陛下畫此計者臣自外風聞皆出平章高琪宣宗曰汝何以知此事出於高琪素蘭曰臣見文哥與永清副提控劉溫牒云差人張希韓至自南京道副樞平章處分已奏令文哥隸大名行省毋遵中都帥府約束溫即具言於帥府然則文哥與高琪計結明矣上頷之素蘭復奏曰高琪本無勳望嚮以畏死擅殺胡沙虎計出於無聊耳妬賢能樹黨與竊弄威權自作威福去歲都下書生樊知一詣高琪言辭軍不可信恐生亂高琪以刀杖決殺之自是無復敢言軍國利害者使其黨移剌塔不也為武寧軍節度使招辭軍已而無功復以為武衛軍使以臣觀之此賊滅亂紀綱戕害忠良實有不欲國家平治之意惟陛下斷然行之社稷之福也宣宗曰朕徐思之素蘭出復戒曰慎無泄也四年十月大元大兵取潼關次嵩汝間待闕臺院令史高嶷上書曰向者河朔敗績朝廷不時出應此失機會一也及深入吾境都城精兵無慮數十萬若效命一戰必無今日之憂此失機會二也既退之後不議追襲此失機會三也今已度關不亟進禦患益深矣乞命平章政事高琪為帥以厭衆心不報御史臺言兵踰潼關崤澠深入重地近抵西郊彼知京師屯宿重兵不復叩城索戰但以遊騎遮絶道路而別兵攻擊州縣是亦困京師之漸也若專以城守為事中都之危又將見於今日況公私蓄積視中都百不及一此臣等所為寒心也不攻京城而縱其別攻州縣是猶火在腹心撥置于手足之上均一身也願陛下察之請以陝西兵扼拒潼關與右副元帥蒲察阿里不孫為掎角之勢選在京勇敢之將十數人各付精兵數千隨宜伺察且戰且守復諭河北亦以此待之詔付尚書省高琪奏曰臺官素不習兵備禦方略非所知也遂寢高琪止欲以重兵屯駐南京以自固州郡殘破不復恤也宣宗惑之計行言聽終以自斃未幾進拜尚書右丞相奏曰凡監察有失糾彈者從本法若人使入國私通言語説知本國事情宿衛近侍官承應人出入親王公主宰執之家災傷闕食體究不實致傷人命轉運軍儲而有私載及考試舉人關防不嚴者並的杖在京犯至兩次者臺官減監察一等論贖餘止坐專差者任滿日議定升降若任內有漏察之事應的決者依格雖為稱職止從平常平常者從降罰制可高琪請修南京𩹉城宣宗曰此役一興民滋病矣城雖完固能獨安乎初陳言人王世安獻攻取盱眙楚州策樞密院奏乞以世安為招撫使選謀勇二三人同往淮南招紅襖賊及淮南宋官宣宗可其奏詔泗州元帥府遣人同往興定元年正月癸未宋賀正旦使朝辭宣宗曰聞息州透漏宋人此乃彼界飢民沿淮為亂宋人何敢犯我高琪請伐之以廣疆土上曰朕但能守祖宗所付足矣安事外討高琪謝曰今雨雪應期皆聖德所致而能包容小國天下幸甚臣言過矣四月遣元帥左都監烏古論慶壽簽樞密院事完顏賽不經略南邊尋復下詔罷兵然自是與宋絶矣興定元年十月右司諫許古勸宣宗與宋議和宣宗命古草牒以示宰臣高琪曰辭有哀祈之意自示微弱不足取遂寢集賢院咨議官呂鑑言南邊屯兵數十萬自唐鄧至壽泗沿邊居民逃亡殆盡兵士亦多亡者亦以人煙絶少故也臣嘗比監息州榷場每場所獲布帛數千匹銀數百兩大計布帛數萬匹銀數千兩兵興以來俱失之矣夫軍民有逃亡之病而國家失日獲之利非計也今隆冬沍寒吾騎得騁當重兵屯境上馳書諭之誠為大便若俟春和則利在於彼難與議矣昔燕人獲趙王趙遣辨士説之不許一牧豎請行趙王乃還孔子失馬馭卒得之人無貴賤苟中事機皆可以成功臣雖不肖願效牧豎馭卒之智伏望宸斷詔問尚書省高琪曰鑑狂妄無稽但其氣岸可尚宜付陝西行省備任使制可十二月胥鼎諫伐宋語在鼎傳高琪曰大軍已進無復可議遂寢二年胥鼎上書諫曰錢穀之冗非九重所能兼天子總大綱責成功而已高琪曰陛下法上天行健之義憂勤庶務夙夜不遑乃大平之階也鼎言非是宣宗以南北用兵深以為憂右司諫呂造上章乞詔內外百官各上封事直言無諱或時召見親為訪問陛下博采兼聽以盡羣下之情天下幸甚宣宗嘉納詔集百官議河北陝西守禦之策高琪心忌之不用一言是時築汴京城𩹉城宣宗問高琪曰人言此役恐不能就如何高琪曰終當告成但其濠未及浚耳宣宗曰無濠可乎高琪曰苟防城有法正使兵來臣等愈得效力宣宗曰與其臨城曷若不令至此為善高琪無以對高琪自為宰相專固權寵擅作威福與高汝礪相唱和高琪主機務高汝礪掌利權附己者用不附己者斥凡言事忤意及負材力或與己頡頑者對宣宗陽稱其才使幹當於河北陰置之死地自不兼樞密元帥之後常欲得兵權遂力勸宣宗伐宋置河北不復為意凡精兵皆置河南苟且歲月不肯輒出一卒以應方面之急平章政事英王守純欲發其罪密召右司員外郎王阿里知案蒲鮮石魯剌令史蒲察胡魯謀之石魯剌胡魯以告尚書省都事僕散奴失不僕散奴失不以告高琪英王懼高琪黨與遂不敢發頃之高琪使奴賽不殺其妻乃歸罪於賽不送開封府殺之以滅口開封府畏高琪不敢發其實賽不論死事覺宣宗久聞高琪姦惡遂因此事誅之時興定三年十二月也尚書省都事僕散奴失不以英王謀告高琪論死蒲鮮石魯剌蒲察胡魯各杖七十勒停初宣宗將遷南欲置辭軍于平州高琪難之及遷汴戒彖多厚撫此軍彖多輒殺辭軍數人以至于敗宣宗末年嘗曰壞天下者高琪彖多也終身以為恨云移剌塔不也東北路猛安人明昌元年纍官西上閣門使二年襲父謀克泰和伐宋有功遙授同知慶州事權迪列辭詳穩丁父憂起復西北路招討判官改尚輦局使曹王傅貞祐二年遷武寧軍節度使招徠中都辭軍無功平章高琪芘之召為武衛軍都指揮使應奉翰林文字完顏素蘭嘗面奏高琪黨比語在高琪傳尋知河南府事兼副統軍徙彰化軍節度使上言盡籍山東河間大名猛安人為兵老弱城守壯者捍禦又言河東地險人勇步兵為天下冠可盡調以戍諸隘從之自是河東郡縣屯兵少不可守矣改知臨洮府事兼陝西副統軍貞祐三年十一月破夏兵于熟羊寨平章高琪率宰臣入賀曰塔不也以少敗衆蓋陛下威德所致宣宗曰自古興國皆賴忠賢今茲立功皆將率諸賢之力也乃以塔不也為勸農使兼知平涼府事進階銀青榮祿大夫四年伐西夏攻威靈安會等州興定元年知慶陽府事三年遷元帥左都監卒論曰高琪擅殺執中宣宗不能正其罪又曲為之説以詔臣下就其事論之人君欲誅大臣而與近侍密謀于宮中已非其道謀之不密又為外臣所知以告敗軍之將因殺之以為説此可欺後世邪金至南渡譬之羸病人元氣無幾琪喜吏而惡儒好兵而厭靜沮遷辭之議破和宋之謀正猶繆醫投以烏喙附子祗速其亡耳使宣宗於擅殺之日即能伸大義而誅之何至誤國如是邪
