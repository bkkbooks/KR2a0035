body:
  text: 金史卷一百四列傳第四十二納坦謀嘉鄒谷高霖孟奎烏林答與郭俁溫迪罕達王擴移剌福僧奧屯忠孝蒲察思忠紇石烈胡失門完顏𧜛斡勒合打蒲察移剌都納坦謀嘉上京路牙塔懶猛安人初習策論進士大定二十六年選入東宮教鄆王琮瀛王瓌讀書以終場舉人試補上京提刑司書史以廉能著稱承安元年契丹陀鎖寇掠韓州信州提刑司問諸書史誰入奏者皆難之謀嘉請行五年特賜同進士出身調東京教授湯池主簿太學助教丁母憂服闋纍除翰林修撰兼修起居注監察御史貞祐初遷吏部員外郎翰林待制侍御史完顏𧜛舉謀嘉才行志在匡國可預軍政充元帥府經歷官中都被圍食且盡胥鼎奏京師官民能贍足貧民者計所贍遷官皆先給據謀嘉不受據而去中都危急謀嘉曰帥臣統數萬衆不能出城一戰何如自縛請降邪宣宗議遷都謀嘉曰不可河南地狹土薄他日宋夏交侵河北非我有矣當選諸王分鎮遼東河南中都不可去也不聽頃之除唐州刺史入為太常少卿兼左拾遺遷鄭州防禦使改左諭德轉少詹事攝御史中丞未幾攝太子詹事興定元年潼關失守遷河南統軍使兼昌武軍節度使攝簽樞密院事行院許州汰去冗食軍士二千餘人上書諫伐宋不聽三年降潁州防禦使有告宋人將襲潁州者已而宋兵果至謀嘉有備乃引去有司上功不及告者謀嘉請而賞之四年召為翰林侍講學士兼兵部侍郎同修國史五年卒鄒谷字應仲密州諸城人中大定十三年進士第纍官瀋王府文學尚書省奏擬大理司直上曰司直爭論情法折正疑難谷非所長也宰臣曰谷有吏才陝西河南訪察及定課皆稱職上以谷為同知曹州軍州事召為刑部主事轉北京臨潢提刑判官入為大理寺丞尚書省點差接送伴宋國使官令史周昂具數員呈請左司都事李炳乘醉見之怒曰吾口舉兩人即是安用許為命左右攬昂衣欲杖之會左司官召昂去乃已詈諸令史為奴畜明日語權令史李秉鈞曰吾豈惟箠罵汝進退去留亦皆在我羣吏將陳訴會官劾奏事下大理寺議差接送伴官事當奏聞炳謂口舉兩人當科違制谷曰口舉兩人一時之言當杖贖攬昂衣欲加杖當決三十上曰李炳讀書人何乃至是宰臣對曰李炳疾惡衆人不能容耳上曰炳誠過矣告者未必是也乃從谷議歷濟南彰德府治中吏部郎中河東按察副使沂州防禦使歷定海泰寧軍節度使泰和六年致仕貞祐初卒高霖字子約東平人大定二十五年進士調符離主簿察廉遷泗水令再調安國軍節度判官以父憂還鄉里教授生徒數百人服除為絳陽軍節度判官用薦舉召為國史院編修官建言黃河所以為民害者皆以河流有曲折適逢隘狹故致湍決按水經當疏其塞行所無事今若開雞爪河以殺其勢可免數掃之勞凡捲掃工物皆取於民大為時病乞並河隄廣樹榆柳數年之後隄岸既固掃材亦便民力漸省朝廷從之遷應奉翰林文字兼前職改監察御史丁母憂起復太常博士改都水監丞簽陝西路按察司事體訪官員能否仍赴闕待對時南征調發繁急民稍稽滯有司皆坐失誤軍期罪霖言其枉悉出之授都水少監大安初為耀州刺史三年遷河北東路按察副使改韓王傅兼翰林直學士崇慶初改工部侍郎兼直學士至寧元年八月霖奉儲螱迎宣宗至新城敕霖南迎諸妃既至賜錢千貫遷官三階貞祐二年除河平軍節度使兼都水監霖請城宜村為衛州以護北門上從之入為兵部尚書知大興府事俄權參知政事與右丞相承暉行省于中都尋改中都留守兼本路兵馬都總管平章政事抹撚盡忠棄中都南奔霖與子義傑率其徒夜出不能進謂義傑曰汝可求生吾死於此矣霖死義傑伏羣尸中以免贈翰林學士承旨令立碑鄉里歲時致祭訪其子孫録用諡文簡孟奎字元秀遼陽人也大定二十一年進士調黎陽主簿丁母憂服闋調淄州軍事判官遷汲縣令察廉改定興令補尚書省令史從參知政事馬琪塞澶淵決河改中都左警巡使平章政事完顏守貞禮接士大夫在其門者號冷巖十俊奎其一也改都轉運司支度判官上京等路提刑判官初遼東契丹判余里也嘗殺驛使大理司直有契丹人同名者有司輒繫之獄奎按囚速頻路讞而出之既而果獲其殺司直者遷同知西京路轉運使事置行樞密院于鎮寧充宣差規措所官給軍用改簽河東南北路按察司事武州刺史上言三事其一曰親民之寄今吏部之選頗輕使武夫計資而得權歸胥吏每縣宜參用士人使紀綱其事未幾改曹州刺史再調同知中都路都轉運使事旱詔審録中都路寃獄多平反大安初除博州防禦使凡屬縣事應赴州者不得泊於逆旅以防吏姦人便之改山東東西路安撫副使遷北京臨潢等路按察轉運使以本官為行六部侍郎劾奏監軍完顏訛出虛造功狀訛出坐免官詔以奎為宣差都提控貞祐初以疾卒諡莊肅烏林答與本名合住大名路納鄰必剌猛安人充奉職奉御尚食局直長兼頓舍除監察御史纍官武勝軍節度使北京按察轉運使太子詹事武衛軍都指揮使貞祐二年知東平府事權宣撫副使改西安軍節度使入為兵部尚書上言按察轉運司拘榷錢穀糾彈非違此平時之治法今四方兵動民心未定軍士動見刻削乞權罷按察及勸農使又曰東平屯兵萬餘可運濱鹽易糧芻給之又曰潼關及黃河津要將校皆出卒伍類庸懦不可用乞選材武者代之又曰兗曹濮濬諸郡皆可屯重兵敕州縣官勸民力穡至於防秋則清野保城下尚書省竟不施行新制科買軍器材物稽緩者並的決與奏有司必督責趣辦民將不堪可量罰月俸從之坐前在陝州市物虧直降鄭州防禦使尋召為拱衛直都指揮使復為兵部尚書興定三年卒郭俁字伯有澤州人大定二十二年進士調長子主簿萊州觀察判官萊陽縣令補尚書省令史知管差除除大理司直丁母憂起復太常博士左司都事御史臺舉俁及前應奉翰林文字張楫吏部主事王質刑部主事抹撚居中通事舍人完顏合住弘文校理把掃合吏部架閣管勾烏古論和尚尚書省令史溫迪罕思敬皆才幹可用詔各升一等遷除俁平陽府治中張楫國子博士王質昭義軍節度副使抹撚居中大理司直完顏合住侍儀司令把掃合同知弘文院事烏古論和尚利涉軍節度副使溫迪罕思敬同知定武軍節度事久之俁召為同知登聞鼓院兼祕書丞遷禮部郎中滕州刺史同知真定府事上言每季合注巡尉官吏刑兩部斟酌盜賊多寡處選注詔議行之改中都西京按察副使遷國子祭酒泰和六年伐宋充宣差山東安撫副使七年遷山東宣撫副使大安元年遷遼東按察轉運使改中都路都轉運使泰定軍節度使陝西東路按察轉運使貞祐三年罷按察司仍充本路轉運使行六部尚書改河北西路轉運使致仕元光二年卒溫迪罕達字子達本名謀古魯蓋州按春猛安人性敦厚寡言笑初舉進士廷試搜閲官易達藐小謂之曰汝欲求作官邪達曰取人以才學不以年貌衆咸異之明昌五年中第調固安主簿以憂去官服除調信州判官丞相襄辟行省幕府改順州刺史補尚書省令史除南京警巡使居父喪是時伐宋兵興起復給事行尚書省大安初遷德興府判官再遷監察御史宣宗遷汴以本職護送衛士妻子復被詔運大名粟由御河抵通州事集遷一官轉戶部員外郎左司郎中遇繼母憂起復太常少卿充陝西元帥府經歷官興定元年召還攝侍御史上疏論伐宋略曰天時向暑士馬不利宜俟秋涼無不可者又曰遼東興王之地移剌都不能守走還南京度今之勢可令濮王守純行省蓋州駐兵合思罕以繫一方之心昔祖宗封建諸王錯峙相維以定大業今乃委諸疏外非計也宣宗曰一子非所愛但幼不更事詎能辦此逾月復上言天下輕重係于宰相邇來每令權攝甚無謂也今之將帥謀者不能戰戰者不能謀今豈無其人但用之未盡耳宣宗曰人才難知故先試其稱否卿何患焉所謂用之未盡者為誰對曰陝西統軍使把胡魯忠直幹略知延安府古里甲石倫深沉有謀能得士心雖有微過不足以纍大宰相高琪高汝勵惡其言俄充陝州行樞密院參議官二年召為戶部侍郎改刑部兼左司諫同知集賢院改大理卿兼越王傅尋遷河南統軍使昌武軍節度使行六部攝同簽樞密院行院許州改集慶軍節度使是時東方荐饑達上疏曰亳州戶舊六萬今存者無十一何以為州且今調發數倍于舊乞量為減免是歲大水碭山下邑野無居民轉運司方憂兵食達謾聞二縣無主稻田且萬頃收可數萬斛即具奏朝廷大駭詔戶部尚書高夔佩虎符專治其事所獲無幾夔坐纍抵罪達自念失奏因感愧發病尋卒王擴字充之中山永平人明昌五年進士調鄧州録事潤色律令文字遷懷安令猾吏張執中誣敗二令擴到官執中挈家避去改徐州觀察判官補尚書省令史除同知德州防禦使事被詔賑貸山東西路饑民棣州尤甚擴輒限數外給之泰和伐宋山東盜賊起被安撫使張萬公牒提控督捕擴行章丘道中遇一男子舉止不常捕訊果歷城大盜也衆以為有神再遷監察御史被詔詳讞寃獄是時凡鬬殺奏決者章宗輒減死由是中外斷獄皆以出罪為賢擴謂同輩曰生者既讞地下之寃云何是時置三司治財擴上書曰大定間曹望之為戶部財用殷阜亦存乎人而已今三司職掌皆戶部舊式其官乃戶部之舊官其吏亦戶部之舊吏何愚於戶部而智於三司乎既而三司亦竟罷張煒職辦西北路糧草者數年失亡多尚書省奏擴考按會煒亦舉王謙自代王謙發其姦蠹擴按之無所假借煒舊與擴厚使人諉擴曰君不念同舍邪擴曰既奉詔安得顧故人哉大安中同知橫海軍節度事簽河東北路按察事貞祐二年上書陳河東守禦策大概謂分軍守隘兵散而不成軍聚之隘內軍合則勢重饋餉一塗以逸待勞以主待客此上策也又曰軍校猥衆分例過優萬戶一員其費可給兵士三十人本路三從宜萬戶二百餘員十羊九牧類例可知乞以千人為一軍擇望重者一人萬戶兩猛安四謀克足以教閲約束矣豈不簡易而省費哉又曰按察兼轉運本欲假糾劾之權以檢括錢穀邇來軍興糧道軍府得而制之令太原代嵐三軍皆其州府長官如令通掌資儲則弊立革按察之職舉矣又曰數免租稅科糴益繁民不為恩徒增廪給教練無法軍不足用書奏不見省遷汴後召為戶部侍郎遷南京路轉運使太府監奏羊瘦不可供御宣宗召擴詰問擴奏曰官無羊皆取於民今民心未安宜崇節儉廷議肥瘠紛紛非所以示聖德也宣宗首肯之平章政事高琪閲尚食物謂擴曰聖主焦勞萬機賴膳羞以安養臣子宜盡心擴曰此自食監事何勞宰相高琪默然銜之有司奪市人衣以給往戍潼關軍士京師大擾擴白宰相請三日造之高琪怒不從潼關已破大元兵至近郊遣擴行六部事規辦潼關芻糧偕戶部員外郎張好禮往商虢過中牟不可進高琪奏擴畏避下吏論死宣宗薄其責削兩階杖七十張好禮削三階杖六十降為遙授隴州防禦使行六部侍郎規辦秦鞏軍食逾月權陝西東路轉運使行六部尚書致仕興定三年卒諡剛毅擴博學多才梗直不容物以是不振於時云移刺福僧東北路烏連苦河猛安人以蔭補吏部令史轉樞密院調滕州軍事判官歷甄官署直長豳王府司馬順義軍節度副使部內世襲猛安木吞掠民婦女藏之窟室人頗聞之無敢發其罪者福僧請于節度使願自效既跡得其所在率衆入索之得婦女四十三人木吞抵罪徙橫海軍轉同知開遠軍節度事簽北京臨潢按察事興中治中莫州刺史上言沿邊軍官私役軍人邊防不治及擾動等事按察司專一體究各路宣差提控嚴勒禁治詔尚書省行之大安初改沃州同知興中府事福僧督民繕治城郭浚濠為禦守備百姓頗怨頃之兵果至攻其北城福僧戰其北使備其西薄暮果攻其西以有備乃解去尋改廣寧崇慶元年秋福僧被牒如鄰郡大兵薄城其子銅和尚率家奴拒戰廣寧賴之以完福僧還悉放奴為良終不言子之功識者多之未幾充遼東宣撫副使歲大饑福僧出沿海倉粟先賑其民而後奏之優詔奬諭至寧元年除鞏王傅兼吏部郎中胡沙虎作難福僧稱疾不出宣宗封胡沙虎澤王百官皆賀福僧不往胡沙虎欲托而罪之詔除福僧壽州防禦使貞祐三年遷山東西路按察轉運使是歲按察司罷仍充轉運使久之致仕興定二年十一月庚辰宣宗御登賢門召致仕官兵部尚書完顏蒲剌都戶部尚書蕭貢刑部尚書僕散偉工部尚書奧屯扎里吉翰林學士完顏孛迭轉運使福僧河東北路轉運使趙重福沁南軍節度使猪奮鎮南軍節度使石抹仲溫泰定軍節度使李元輔中衛尉完顏奴婢原州刺史紇石烈孛吉賜食訪問時政得失福僧乃上書曰為今之計惟先招徠辭人選擇辭人舊有宿望雄辨者諭以恩信彼若內附然後中都可復遼東可通今西北多虞而南鄙不敢撤戍芻糧調度仰給河南賦役頻繁民力疲弊宜開宋人講和之端撫定河朔養兵蓄鋭策之上也又曰山東殘破羣盜滿野官軍既少且無騎兵若宋人資以糧餉假以官爵為患愈大當選才幹官充宣差招捕以恩賞諭使復業募其壯悍為兵亦致勝之一也又曰自承安用兵軍中設監戰官論議之間動相矛盾不懲其失反以為法若輩平居皆選材勇自衛一旦有急驅疲懦出戰寧不敗事罷之為便書奏朝廷略施用焉元光元年卒贊曰宣宗急於求賢而使小人間之悅於直言而使邪說亂之貞祐興定之間豈無其人哉是故直言蔽於所惑羣才詘於見忌耳自納坦謀嘉以下可考見焉奧屯忠孝字全道本名牙哥懿州胡土虎猛安人幼孤事母孝中大定二十二年進士科調蒲州司候察廉遷一官除校書郎兼太子司經三遷禮部員外郎遷翰林待制權戶部侍郎佐參知政事胥持國治決河以勞進一階除河平軍節度使兼都水監遂疏七祖佛河及王村周平道口雞爪孫家港復開東明南陽岡馬蹄孫村諸河忠孝常曰河之為患不免勞民復壘石為岸十餘里民不勝其病矣改沁南軍坐前在衛州勾集妨農軍借民錢不令償由是貧富不相假貸軍民不相安降寧海州刺史改滑州歷同知南京留守遷定國軍節度使復為沁南軍入為太子少傅兼禮部尚書貞祐初議降衛紹王忠孝與蒲察思忠附胡沙虎議語在思忠傳頃之拜參知政事中都圍急糧運道絶詔忠孝搜括民間積粟存兩月食用悉令輸官酬以銀鈔或僧道戒牒是時知大興府事胥鼎計畫軍食奏許人納粟買官鼎已籍者忠孝再括之令百姓兩輸欲為己功左諫議大夫張行信上疏論之曰民食止存兩月而又奪之使當絶食不獨歸咎有司而亦怨朝廷之不察也宣宗善行信言命近臣與忠孝同審取焉謂忠孝曰國家本欲得糧今既得矣姑從民便可也頃之行信復奏曰參政奧屯忠孝平生矯僞不近人情急於功名詭異要譽慘刻害物忍而不恤勾當河防河朔居民不勝其病軍負民錢抑不令償東海欲用胡沙虎舉朝皆曰不可忠孝獨力薦及胡沙虎作難忠孝自謂有功詔議東海爵號忠孝請籍沒其子孫及論特末也則云不當籍沒其偏黨不公如此無事之時猶不容一相非才況今多故乃使此人與政如社稷何宣宗曰朕初即位當以禮進退大臣卿語其親知諷之求去可也行信以語右司郎中把胡魯把胡魯以宣宗意白忠孝忠孝靦然不聽頃之罷為太子太保出知濟南府事改知中山府尋薨年七十諡惠敏蒲察思忠本名畏也隆安路合懶合兀主猛安人大定二十五年進士調文德漷陰主簿國子助教應奉翰林文字太學博士纍遷涿州刺史吏部郎中遷潞王傅被詔與翰林侍讀學士張行簡討論武成王廟配等列思忠奏曰伏見武成王廟配享諸將不以世代為先後按唐祀典李靖李績居吳起樂毅上聖朝太祖以二千之衆破百萬之師太宗克宋成此帝業秦王宗翰宋王宗望婁室谷神與前代之將各以功德間列可也思忠論多矯飾不盡録録其頗有理者云遷大理卿兼左司諫同修國史泰和六年平章政事僕散揆宣撫河南詔以備禦攻守之法集百官議于尚書省廷臣尚多異議思忠曰宋人攻圍城邑動至數千不得為小寇但當選擇賢將宜攻宜守臨時制變無不可者上以為然頃之遷翰林侍講學士兼左諫議大夫大理卿同修國史如故再閲月兼知審官院正職外兼四職自思忠始宋人請和賜銀五十兩重綵十端丁母憂起復侍講學士兼諫議修史知審官院轉侍讀兼兵部侍郎貞祐初胡沙虎請廢衛紹王為庶人思忠與奧屯忠孝阿附胡沙虎曰竊人之財猶謂之盜況偷天位以私己乎宣宗不從頃之遷太子太保兼侍讀修國史二年春享于太廟思忠攝太尉醉驅禮直官御史臺劾奏降祕書監兼同修國史頃之遷翰林學士同修國史卒紇石烈胡失門上京路猛安人明昌五年進士纍官補尚書省令史除中都路支度判官調河北東路都勾判官纍官翰林直學士大理卿右諫議大夫興定二年伐宋充元帥左都監紇石烈牙吾塔參議官牙吾塔至楚州不待行省僕散安貞節制輒進兵宋人堅壁不出野無所掠軍士疲乏餓死相望直前至江而復安貞劾奏之牙吾塔坐不奉詔約胡失門不矯正特詔原之改同知彰德府事五遷吏部尚書五年拜御史大夫元光元年兼大司農二年薨宣宗輟朝百官致奠完顏𧜛本名訛出西南路猛安人大定二十八年進士纍調河東北路提刑司知事改同知遼州軍州事召為國史院編修官遷應奉翰林文字南京路轉運副使丁父憂起復太府監丞改吏部員外郎大安初除知登聞檢院纍遷右司郎中翰林待制兼侍御史貞祐初議衛紹王事語在衛紹王紀中都圍急詔於東華門置招賢所內外士庶皆得言事或不次除官由是閭閻細民往往衒鬻求售王守信者本一村夫敢為大言以諸葛亮為不知兵𧜛薦于朝詔署行軍都統募市井無賴為兵教閲進退跳擲大概似童戲其陳法大書古今相對四字於旗上作黃布袍緇巾鑞牌各三十六事牛頭響環六十四枚欲以怖敵而走之大率皆誕妄因與其衆出城殺百姓之樵採者以為功賈耐兒者本歧路小說人俚語詼嘲以取衣食製運糧車千兩是時材木甚艱所費浩大觀者皆竊笑之草澤李棟在衛紹王時嘗事司天監李天惠依附天文假託占卜趨走貴臣俱為司天官棟嘗密奏白氣貫紫微主京師兵亂幸不貫徹得不成禍既而高琪殺胡沙虎宣宗愈益信之左諫議大夫張行信奏曰狂子庸流猥蒙拔擢參預機務甚無謂也司天之官占見天象據經陳奏使人主飭己修政轉禍為福如有天象乞令諸監官公同陳奏所見或異則各以狀聞不宜偏聽也上召行信與𧜛面計守信事復與近侍就決于高琪高琪言守信不可用上乃以行信之言為然頃之𧜛遷禮部侍郎改東京副留守隴州防禦使遷安化軍節度使兼山東路統軍副使興定元年四月詔𧜛以本官權元帥左都監行元帥府事和輯苗道潤移剌鐵哥軍事語在道潤傳十二月密州破𧜛為亂軍所殺斡勒合打蓋州本得山猛安人以蔭補官充親軍調山陰尉縣當兵衝合打率土豪官兵身先行陳貞祐初以功遷本縣令縣升為忠州合打充刺史州被兵久耕桑俱廢詔徙其民于太和嶺南合打遙授同知太原府事仍領其衆俄以本官遙授彰國軍節度使權河東北路宣撫副使督糧餉往代州合打不欲行因與宣撫使完顏伯嘉爭辨合打恐伯嘉奏聞乃先奏伯嘉辱己御史臺廉得其事未及奏伯嘉合打皆改遷合打改武寧軍節度使數月召為勸農使久之為金安軍節度使興定元年復為勸農使歷知河間府權元帥右都監行元帥府事駐兵蔡息間權同簽樞密院事守河清改知歸德府事合打屢守邊要無他將略雖未嘗敗北亦無大功元光元年卒蒲察移剌都東京猛安人父吾迭太子太傅致仕移刺都勇健多力充護衛十人長調同知秦州防禦使事武衛軍鈐轄以憂去官起復武器署令從軍兵潰被執貞祐二年與降兵萬餘人俱脫歸遷隆安府治中賜銀百兩重幣六端遙授信州刺史有功遷蒲與路節度使兼同知上京留守事進三階改知隆安府事逾年充遼東上京等路宣撫使兼左副元帥再閲月就拜尚書右丞移剌都與上京行省蒲察五斤爭權及賣隆安戰馬擅造銀牌睚眦殺人已而矯稱宣召棄隆安赴南京宣宗皆釋不問除知河南府事俄改元帥左監軍權左副元帥充陝西行省參議官無何兼陝西路統軍使興定二年四月改簽樞密院事權右副元帥行樞密院於鄧州御史臺奏移剌都在軍中買沙覆道盜用官銀矯制收禁書指斥鑾輿使親軍守門護衛押宿擬前後衛仗婢妾效內人葬飾等數事詔吏部尚書阿不罕斜不失鞫之坐是誅贊曰讀金史至張行信論奧屯忠孝事曰嗟乎宣宗之不足與有為也如此夫進退宰執豈無其道也哉語其親知諷之求去豈禮邪是故奧屯忠孝蒲察思忠之黨比紇石烈胡失門之疲衆完顏𧜛之輕信誤國斡勒合打之詆訟上官於是曾不之罪失政刑矣豈小懲大誡之道哉
