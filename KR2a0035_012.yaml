body:
  text: 金史卷十二本紀第十二章宗四四年春正月乙丑朔宋高麗夏遣使來賀丁卯諭外方使人不得佩刀入宮庚午幸豫王永成第視疾辛未如光春宮春水壬申陰霧木冰丁丑行尚書省奏宋賀正使還至慶都卒詔遣防禦使女奚烈元往祭致賻絹布各二百二十匹仍命送伴使張雲護喪以歸豫王永成薨辛卯高麗國王王沒嗣子韺遣使來告哀二月乙未朔還宮丁酉以山東河北旱詔祈雨東北二嶽己亥命購豫王永成遺文庚戌始祭三皇五帝四王癸丑詔刺史州郡無宣聖廟學者並增修之三月丁卯日昏無光大風毀宣陽門鴟尾癸酉命大興府祈雨戊寅幸太極宮詔定前代帝王合致祭者尚書省奏三皇五帝四王已行三年一祭之禮若夏太康殷太甲太戊武丁周成王康王宣王漢高祖文景武宣光武明帝章帝唐高祖文皇一十七君致祭為宜從之乙酉祈雨于北郊丁亥如萬寧宮壬辰祈雨于社稷遼陽府判官斜卯劉家以上書論列朝臣削官一階罷之夏四月丙申詔定縣令以下考課法己亥祈雨于太廟庚子增定關防姦細格丙午定衣服制以祈雨望祀嶽鎮海瀆于北郊癸丑祈雨于社稷甲寅以久旱下詔責躬求直言避正殿減膳撤樂省御馬免旱災州縣徭役及今年夏稅遣使審繫囚理寃獄乙卯宰臣上表待罪詔答曰朕德有愆上天示異卿等各趨乃職思副朕懷戊午以西上閣門使張稱等為故高麗國王王敕祭使東上閣門使石賣心等為高麗國王王韺慰問起復橫賜使庚申祈雨于太廟壬戌萬寧宮端門災五月乙丑祈雨于北郊有司請雩詔三禱嶽瀆社稷宗廟不雨乃行之癸酉平章政事徒單鎰尚書左丞完顏匡罷甲戌雨乙亥百官上表請御正殿復常儀乙酉謝雨于宗廟丁亥報祀社稷汰隨朝冗官定省令史關決公務詭稱已禀擅退六部大理寺法狀及妄有所更易者罪辛卯報謝嶽鎮海瀆六月壬辰朔罷兼官俸給壬寅復行吏目移轉法乙巳始祭中霤戊申罷惠川高三州秀巖灤陽徽川咸寧金安利民六縣及北京宮苑使諸羣牧提舉居庸紫荊通會三關使西北路鎮防十三千戶諸路醫學博士壬子司天臺長行張翼進天象傳秋七月丁卯定申報盜賊制戊辰朝獻于衍慶宮庚午幸望京甸壬申如萬寧宮甲戌罷限錢法甲申改葬鎬王永中于威州八月大理丞姬端修司直溫敦按帶論奏知大興府事紇石烈執中坐所言不當各削一官罷職丁酉以尚書右丞相宗浩為左丞相右丞僕散揆為平章政事參知政事孫即康為尚書右丞御史大夫僕散端為左丞吏部尚書獨吉思忠為參知政事庚子詔完顏綱喬宇宋元吉等編類陳言文字其言涉宮庭若大臣省臺六部各以類從凡二千卷辛丑以西京留守崇肅為御史大夫癸卯更定閣門祗候出職格先是以天旱詔求直言至是尚書省奏河南府盧顯達汝州王大材所陳言涉不遜請以情理切害論其罪從之仍遍諭中外命諸路學校生徒少者罷教授止以本州府文資官提控之丁未以安州軍事判官劉常言諸按察司體訪不實輒加糾劾者從故出入人罪論仍勒停若事涉私曲各從本法辛亥還宮乙卯以知真定府事完顏昌等為賀宋生日使丁巳幸太極宮弛圍場遠地禁縱民耕捕樵採減教坊長行五十人渤海教坊長行三十人文繡署女工五十人出宮女百六十人九月庚申朔天壽節宋高麗夏遣使來賀丙寅如薊州秋山壬申定屯田戶自種及租佃法冬十月甲午定私法丙申詔親軍三十五以下令習孝經論語癸卯至自秋山甲寅以提點尚衣局完顏燮為夏國生日使十一月丁卯以殿前右副都點檢烏林答毅等為賀宋正旦使癸酉木冰凡三日丁丑定收補承應人格十二月己丑朔新平等縣刟繕蟲生己亥左丞相宗浩等請上尊號不許辛丑敕陝西河南饑民所鬻男女官為贖之乙卯百官再表乞受尊號不許五年春正月己未朔大雪宋高麗夏遣使來賀庚申謁衍慶宮乙丑幸太極宮丁卯如光春宮春水壬申朝獻于衍慶宮乙亥詔有司自泰和三年郡縣三經行幸民嘗供億者賜今年租稅之半丁丑次霸州調山東河北軍夫改治漕渠二月己丑朔諭按察司近制以鎮靜而知大體為稱職苛細而暗於大體為不稱由是各路按察以因循為事莫思舉刺郡縣以貪黷相尚莫能畏戢自今若糾察得實民無寃滯能使一路鎮靜者為稱職其或煩紊使民不得伸訴者是為曠廢癸巳定鞫勘官受飲宴者罪己亥如建春宮甲寅制盜用及僞造都門契者罪視宮城門減一等三月庚申還宮癸亥更定兩稅輸限乙丑宋兵入秦川界庚午親王百官請上尊號不許甲戌諭有司進士名有犯孔子諱者避之仍著為令命給米諸寺自十月十五日至次年正月十五日作糜以食貧民戊寅罷獄空錢辛巳宋兵入鞏州來遠鎮唐州得宋諜者言韓托胄屯兵鄂嶽將謀北侵四月戊子朔如萬寧宮癸巳命樞密院移文宋人依誓約撤新兵毋縱入境壬子定隨路轉運司及府官每季檢視庫物法五月甲子以平章政事僕散揆為河南宣撫使籍諸道兵以備宋癸酉詔定遼東邑社人數戊寅更定檢知法勒留格己卯如慶寧宮制司屬丞凡遭父母喪止給卒哭假為永制甲申宋人入漣水縣六月戊子復漣水縣丁酉制定本朝婚禮更定鬻米入外界法己酉制鎮防軍逃亡致邊事失錯陷敗戶口者罪甲寅詔拜禮不依本朝者罰召諸大臣問備宋之策皆以設備養惡為言上以南北和好四十餘載民不知兵不忍先發七月戊辰如錦屏山壬申朝獻于衍慶宮乙亥宣撫使揆奏定姦細罪賞法丙子定圍場誤射中人罪壬午詔諸縣盜賊多所選注巡尉八月辛卯詔罷宣撫司時宋殿帥郭倪濠州守將田俊邁誘虹縣民蘇貴等為間河南將臣亦屢縱諜往往利俊邁之賂反為遊說皆言宋之增戍本虞他盜及聞行臺之建益畏讋不敢去備且兵皆白丁自裹糧糒窮蹙飢疫死者十二三由是中外信之宣撫司以宋三省樞密院及盱眙軍牒來上又皆鐫點邊臣為辭宣撫使揆因請罷司從之揆又奏罷臨洮德順秦鞏新置弓箭手閏月乙卯朔罷典衛司丙子還宮九月甲申朔天壽節宋高麗夏遣使來賀戊子西北方黑雲間有赤氣如火色次及西南正南東南方皆赤有白氣貫其中至中夜赤氣滿天四更乃散以河南路統軍使紇石烈子仁等為賀宋生日使戊戌宋兵三百攻比陽寺莊副巡檢阿里根寺家奴死之甲辰宋人焚黃澗虜巡檢高皓冬十月庚申以刑部員外郎李元忠為高麗生日使丁丑宋人襲比陽唐州軍事判官撒覩死之十一月乙酉宋人入內鄉攻洛南之固縣商州司獄壽祖追至丹河擊敗之己丑以太常卿趙之傑等為賀宋正旦使癸巳山東闕食賜錢三萬貫以賑之乙未初定武舉格丁酉詔山東陝西帥臣訓諫士卒以備非常仍以銀十五萬兩分給邊帥募民偵伺復遣武衛軍副都指揮使完顏太平殿前右衛副將軍蒲察阿里赴邊伺其入伏兵掩之戊戌大雪免朝參己亥更定宮中局署承應收補格宋吳曦擁衆興元欲窺關隴皇甫斌益募兵擾淮北所掠即以與之使自為戰六年春正月癸未朔宋高麗夏遣使來賀丁亥宋使陳克俊等朝辭遣御史大夫孟鑄就館諭克俊等曰大定初世宗皇帝許宋世為姪國朕遵守遺法和好至今豈意爾國屢有盜賊犯我邊境以此遣大臣宣撫河南軍民及得爾國有司公移稱已罷黜邊臣抽去兵卒朕方以天下為度不介小嫌遂罷宣撫司未幾盜賊甚于前日比來羣臣屢以爾國渝盟為言朕惟和好歲久委曲涵容恐姪宋皇帝或未詳知若依前不息臣下或復有云朕雖兼愛生靈事亦豈能終已卿等歸國當以朕意具言之汝主辛卯朝享于衍慶宮丙申宋興元守將吳曦遣兵圍抹熟龍堡部將蒲鮮長安擊走之斬其將辛丑更定保伍法癸卯始以沿河縣官兼管勾漕河事州府官兼提控丁未如春水庚戌宋人入撒牟谷陝西統軍判官完顏摑剌鞏州兵馬鈐轄完顏七斤約宋西和州守將會境上俄伏發為所襲木波部長趙彥雄等七人死焉摑剌馬陷淖中中流矢七斤僅以身免二月甲戌御史中丞孟鑄言提刑改為按察司又差官覆察權削而望輕非便參知政事賈鉉曰按察司既差監察體訪復遣官覆察之誠為繁冗請自今差監察時即遣官與俱更不覆察從之三月甲午尚書省奏商州刺史烏古論兗州請賻押軍官與南兵戰沒者又奏遷右振肅蒲察五斤官皆從之明昌初五斤嘗為奉御出使山東至河間以百姓飢輒移提刑司開倉賑之還具以聞上初甚悅太傅徒單克寧言陛下始親大政不宜假近侍人權乞正專擅之罪詔杖之二十克寧又以為言乃罷之後上思之由泰州都軍召為振肅己亥如萬寧宮甲辰敕尚書省祖父母父母無人侍養而子孫遠遊至經歲者甚傷風化雖舊有徒二年之罪似涉太輕其考前律再議以聞己酉宋人攻靈璧南京按察使行部至縣匿民舍得免四月丙辰宋人圍壽春壽春告急于亳同知防禦使賢聖奴將步騎六百赴之乃退癸亥尚書省奏河南統軍司言統軍使紇石烈子仁等遣嚴整閻忠周秀輩入襄陽覘敵陰事還言皇甫斌遣兵四萬規取鄧以我叛人田元為鄉導三萬人規取唐以張真張勝為鄉導俱授統領官故不敢無備乃聚鄭汝陽翟之兵于昌武以南京副留守兼兵馬副都總管紇石烈毅統之聚亳陳襄邑之兵于歸德以河南路副統軍徒單鐸統之而自以所部兵駐汴及擬山東東西路軍七千付統軍紇石烈執中駐大名河北東西路軍萬七千屯河南皆給以馬有老弱者易其人皆從之甲子宋人攻天水界乙丑入東柯谷部將劉鐸戰敗之丙寅詔平章政事僕散揆領行省于汴許以便宜從事升諸道統軍司為兵馬都統府以山東東西路統軍使紇石烈執中為山東西路兵馬都統使定海軍節度使副都統軍使完顏撒剌副之陝西統軍使充為陝西五路兵馬都統使通遠軍節度使胡沙知臨洮府事石抹仲溫副之河南皆聽揆節制如故盡徵諸道籍兵辛未宋吳曦攻來遠鎮之蘭家嶺丙子詔內外職官納馬各有數丁丑宋人入新息內鄉又入泗州戊寅入褒信己卯入虹縣庚辰入潁上五月壬午宋李爽圍壽州田俊邁入蘄縣秦詵攻蔡州防禦使完顏佛住敗之又入金城海口殺長山尉執二巡檢以去甲申太白晝見丙戌以宋畔盟出師告于天地太廟社稷丁亥親告于衍慶宮戊子平章政事僕散揆兼左副元帥陝西兵馬都統使充為元帥右監軍知真定府事烏古論誼為元帥左都監辛卯以征南詔中外賜唐州刺史吾古孫兀屯總押鄧州軍馬事完顏江山爵各二級蔡州防禦使完顏佛住爵一級餘賞賚有差又以非嚴整上變必為所誤授整嵩州巡檢使賜爵八級錢二百萬上以宋兵方熾東北新調之兵未集河南之衆不足支命河北大名北京天山之兵萬五千屯真定河間清獻等以為應壬辰諭尚書省今國家多故凡言軍國利害五品以上官以次奏陳朕將親問之六品之下則具帖子以進癸巳山東路災赦死罪已下以樞密副使完顏匡為右副元帥宋田俊邁攻宿州安國軍節度副使納蘭邦烈等出兵擊之邦烈中流矢宋郭倬李汝翼以衆繼至遂圍宿州壬寅納蘭邦烈等擊敗之俊邁退保于蘄癸卯執俊邁于蘄甲辰皇甫斌攻唐州刺史吾古孫兀屯拒之行省遣泌陽副巡檢納合軍勝來援遂擊敗之庚戌太白經天六月辛亥朔左丞僕散端以母憂罷平章政事揆報蘄之捷並送所獲宋將田俊邁至闕上降詔褒諭賜紇石烈貞納蘭邦烈史扢搭等爵賞有差宋將李爽以兵圍壽州刺史徒單羲拒守踰月不能下壬子河南統軍判官乞住及買哥等以兵來援羲出兵應之爽大敗同知軍州事蒲烈古中流矢死乙卯初置急遞鋪腰鈴轉遞日行三百里非軍期河防不許起馬定軍前差發受贓罪除飛蝗入境雖不損苗稼亦坐罪法丁巳詔彰德府宋韓托胄祖琦墳毋得損壞仍禁樵採庚申右翼都統完顏賽不敗宋曹統制于溱水辛酉詔有司有宋宗族所居各具以聞長官常加提控壬戌平章政事揆報壽州之捷戊辰詔升壽州為防禦免今年租稅諸科名錢釋死罪以下以徒單羲為防禦使贈蒲烈古昭勇大將軍賜錢三百貫官其子圖剌擢乞住同知昌武軍節度使事買哥河南路統軍判官都統賽不副統蒲鮮萬奴各進爵一級賜金幣有差辛未木星晝見至七月戊申經天乙亥宋吳曦攻鹽川戍將完顏王喜敗之秋七月癸未宋商榮復攻東海縣令完顏卞僧復敗之還中伏矢死贈海州刺史以銀五百兩絹百匹給其家仍官其一子甲申朝獻于衍慶宮丁亥敕翰林直學士陳大任妨本職專修遼史甲午宋統制戚春以舟師攻邳州刺史完顏從正敗之春赴水死斬其副夏統制吳曦兵五萬入秦州陝西路都統副使承裕等敗之丙申夏國王李純佑廢姪安全立遣使奉表來告詔禁賣馬入外境但至界欲賣而為所捕即論死八月庚戌山東帥來報邳州之捷辛亥木星晨見乙卯以羌酋青宜可為疊州副都總管己未太白晝見丙寅左丞僕散端起復前職詔設平南諸將軍辛未宋程松襲取方山原蒲察貞破走之壬申太白晝見經天甲戌至自萬寧宮乙亥赦唐鄧潁蔡宿泗六州免來年租稅三分之一九月己卯朔天壽節高麗遣使來賀辛巳元帥右都監蒲察貞取和尚原臨洮蕃部遵寧獻芻粟戰馬以助軍乙酉將五鼓北方有赤白氣數道起于王良之下行至北斗開陽搖光之東丙戌幸香山庚寅敕行尚書省有方略出衆武藝絶倫才幹辦事工巧過人者其招選之甲午參知政事賈鉉乞致政不許戊戌尚書左丞僕散端行省于汴己亥尚書戶部侍郎梁鏜行六部尚書事於山東辛丑遣尚書左司郎中溫迪罕思敬冊李安全為夏國王甲辰宋吳曦將馮興楊雄李圭等入秦州陝西都統副使承裕等擊破之斬楊雄李圭冬十月戊申朔平章政事僕散揆督諸道兵伐宋庚戌揆以行省兵三萬出潁壽河南路統軍使紇石烈子仁以兵三萬出渦口元帥匡以兵二萬五千出唐鄧左監軍紇石烈執中以山東兵二萬出清口右監軍充以關中兵一萬出陳倉右都監蒲察貞以岐隴兵一萬出成紀蜀漢路安撫使完顏綱以漢蕃步騎一萬出臨潭臨洮路兵馬都總管石抹仲溫以隴右步騎五千出鹽川隴州防禦使完顏璘以本部兵五千出來遠甲子獵于近郊十一月戊寅朔詔定諸州府物力差役式壬午完顏匡攻下棗陽乙酉詔屯田軍戶與所居民為婚姻者聽丁亥僕散揆克安豐軍取霍丘縣紇石烈執中克淮陰遂圍楚州己丑尚書省奏減朝官及承應人月俸折支錢庚寅完顏匡克光化軍及神馬坡壬辰僕散揆次廬江宋督視江淮兵馬事丘䥩遣劉祐來乞和紇石烈子仁克定遠縣乙未完顏匡取隨州丙申紇石烈子仁克滁州戊戌詔諸路行用小鈔完顏匡圍德安別以兵徇下安陸應城雲夢孝感漢川荊山等縣庚子日斜有流星二光芒如炬幾及一丈起東北沒東南初定茶禁完顏綱圍祐州降之宋丘䥩遣林拱持書乞和辛丑完顏匡攻襄陽破其外城僕散揆克含山蒲察貞克天水紇石烈子仁徇下來安全椒二縣壬寅完顏綱徇下荔川閭川等城癸卯丘䥩復遣宋顯等以書幣乞和乙巳完顏綱克宕昌丙午蒲察貞克西和州十二月丁未朔完顏匡克宜城僕散揆攻和州史扢搭中流矢死壬子完顏綱次大潭縣降之蒲察貞克成州癸丑宋太尉昭信軍節度使四川宣撫副使吳曦納款于完顏綱戊午右監軍充攻下大散關己未紇石烈子仁克真州丘䥩復遣陳璧等奉書乞和辛酉右監軍充遣兀顏抄合以兵趣鳳州城潰入焉完顏綱遣京兆録事張仔會吳曦于興州之置口曦具言所以歸朝之意仔請以告身為報盡出以付之仍獻階州乙丑初設都提控急遞鋪官平章政事僕散揆班師完顏綱以朝命假太倉使馬良顯齎詔書金印立吳曦為蜀王戊辰蒲察貞以西和天水等捷來報完顏匡進所掠女子百人己巳曦遣其果州團練使郭澄提舉仙人關使任辛奉表及蜀地圖志吳氏譜牒來上壬申詔完顏匡權尚書右丞行省事右副元帥如故以紇石烈執中縱下虜掠遣近臣杖其經歷阿里不孫等仍詔放還所掠七年春正月丁丑朔高麗夏遣使來賀完顏匡進攻襄陽戊寅敕宰臣舉材幹官同議南征事辛巳詔御史大夫崇肅同判大睦親府事徒單懷忠吏部尚書范楫戶部尚書高汝礪禮部尚書張行簡知大興府事溫迪罕思齊等十有四人同對于慶和殿壬午詔百官及前十四人同對于廣仁殿甲申朝獻于衍慶宮乙酉贈故壽州死節軍士魏全宣武將軍蒙城令封其妻鄉君子俟年至十五收充八貫石正班局分承應仍賜錢百萬初李爽圍壽州刺史羲募人往斫敵營全在選中而為敵所執敵令罵羲則免全陽許及至城下反罵敵遂殺之至死罵不絶聲故有是恩戊子召完顏綱赴闕庚寅僕散揆還駐下蔡而病丙申以左丞相宗浩兼都元帥行省于南京以代揆己亥有司奏更定茶禁辛丑完顏匡取穀城二月丙辰赦鳳成西和階山五州丁巳詔追復永中永蹈王爵宋知樞密院張巖遣方信孺以書詣平章政事揆左丞端乞和己未獵于近郊完顏匡克荊門軍癸亥如建春宮吳曦遣使奉三表來謝封爵陳誓言賀全蜀內附丙寅還宮戊辰平章政事兼左副元帥僕散揆薨于軍癸酉遣同知府事术虎高琪等冊吳曦為蜀國王判平陽府事衛王永濟改武定軍節度使兼奉聖州管內觀察使是月蜀國王吳曦為宋臣安丙所殺三月戊子幸太極宮庚寅詔撫諭陝西軍士壬辰初定蟲蝻生發地主及鄰主首不申之罪宋復攻破階州癸巳復攻破西和州乙未宣撫副使完顏綱至鳳翔詔撤五州之兵分保要害綱召諸軍還庚子以完顏匡為左副元帥壬寅如萬寧宮甲辰幸西園夏四月壬子遣宮籍副監楊序為橫賜高麗王使癸丑宋人攻破散關鞏州鈐轄兀顏阿失死之丙辰以紇石烈子仁為右副元帥戊辰詔元帥府分遣諸將遊奕淮南諸州癸酉復下散關五月己卯幸束園射柳己丑幸玉泉山丙申宋知樞密院事張巖復遣方信孺以書至都元帥府增歲幣乞和四川安撫使安丙遣西和州安撫使李孝義率步騎三萬攻秦州圍皂角堡术虎高琪以兵赴之七戰而解其圍是月放宮女二十人六月乙巳朔詔朝官六品外官五品以上及親王舉通錢穀官一人不舉者罰舉不當者論如律己酉以山東盜制同黨能自殺捕出首官賞法戊午烏古論誼為元帥左監軍完顏撒剌為元帥左都監乙丑遣使捕蝗秋七月庚辰朝獻于衍慶宮壬午詔民間交易典質一貫以上並用交鈔毋用錢乙酉敕尚書省自今初受監察者令進利害帖子以待召見甲午左副元帥匡至自許州乙未詔核西夏人口盡贖放還敢有藏匿者以違制論八月戊申宋張巖復遣方信孺齎其主誓書䤝來乞和庚戌割汝州襄城縣于許州戊辰至自萬寧宮九月甲戌朔天壽節高麗夏遣使來賀左丞相兼都元帥宗浩薨于軍甲申定西北京遼東鹽司判官諸場管勾增虧升降格以尚書左丞僕散端為平章政事封申國公左副元帥完顏匡為平章政事兼左副元帥封定國公丙戌獵于近郊壬辰還宮戊戌更定受制忘誤及誤寫制書事重加等罪壬寅敕女直人不得改為漢姓及學南人裝束冬十月甲辰詔應廕之家旁正廕足其正廕者未出官而亡許補廕一人辛亥以武庫令术甲法心為高麗生日使丙辰獵于近郊己巳詔定隨軍遷賞格辛未陝西宣撫使徒單鎰分遣副統把回海攻下蘇嶺關是月定南征將士功賞格十一月癸酉詔新定學令內削去薛居正五代史止用歐陽修所撰是日都統押剌拔鶻嶺關新道口副統回海取小湖關倉進至營口鎮遂取其城丙子宋韓托胄遣左司郎中王柟以書來乞和請稱伯復增歲幣犒軍錢誅蘇師旦函首以獻丙戌上聞陝州防禦使紇石烈孛孫禁民糶命尚書省罪之壬辰宋參知政事錢象祖以誅韓托胄移書行省甲午獵于近郊戊戌參知政事賈鉉罷詔完顏匡檄宋函托胄首以贖淮南故地十二月壬寅朔遼史成丙午以符寶郎烏古論福齡為夏國生日使戊午詔策論進士免試弓箭擊毬庚申以尚書右丞孫即康為左丞參知政事獨吉思忠為右丞中都路都轉運使孫鐸為參知政事八年春正月辛未朔高麗夏遣使來賀壬申朝謁于衍慶宮癸酉收毀大鈔行小鈔以元帥左都監完顏撒剌為參知政事乙亥宋安丙遣兵襲鶻嶺關副統把回海完顏摑剌擊走之斬其將景統領丙子左司郎中劉昂通州刺史史肅監察御史王宇吏部主事曹元吏部員外郎徒單永康太倉使馬良顯順州刺史唐括直思白坐與蒲陰令大中私議朝政皆杖之癸未如春水丙戌如光春宮二月乙巳宋參知政事錢象祖遣王柟來以書上行省復請川陝關隘甲寅如建春宮庚申諭有司曰方農作時雖在禁地亦令耕種己巳還宮三月丁亥辛瀛王第視疾庚寅以與宋和諭尚書省壬辰宰臣上表謝罪甲午瀛王從憲薨乙未上親臨祭夏四月癸卯日暈三重皆內黃外赤戊申禘于太廟庚戌如萬寧宮甲寅以北邊無事敕尚書省命東北路招討司還治泰州就兼節度使其副招討仍置于邊詔諭有司以苗稼方興宜速遣官分道巡行農事以備蟲蝻詔更定猛安謀克承襲程試格宋錢象祖復遣王柟以書上行省庚申詔諸路按察司歲賜公用錢閏月辛未諭尚書省曰翰林侍講學士蒲察畏也言使宋官當選人其言甚當彼通謝使雖未到闕其報聘人當先議擇此乃更始凡有禮數皆在奉使今既行之遂為永例不可不慎也甲戌制諸州府司縣造作不得役諸色人匠違者準私役之律計傭以受所監臨財物論甲申定承應人收補年甲格甲午雨雹定保甲軍殺獲南軍官賞乙未宋獻韓托胄等首于元帥府五月丁未御應天門備黃麾立仗親王文武合班起居中路兵馬提控平南撫軍上將軍紇石烈貞以宋賊臣韓托胄蘇師旦首獻並奉元帥府露布以聞懸其首並畫像于市以露布頒中外丙辰平章政事匡至自軍己未更元帥府為樞密院癸亥詔移天壽節於十月十五日丁卯遣使分路捕蝗六月癸酉宋通謝使朝議大夫試禮部尚書許奕福州觀察使右武衛上將軍吳衡等奉其主書入見甲戌謁謝于衍慶宮癸未以許宋平詔中外免河南山東陝西等六路今年夏稅河東河北大名等五路半之丁亥以元帥左都監烏古論誼為御史大夫戊子飛蝗入京畿乙未定服飾明金象金制丁酉以左副都點檢完顏侃為宋諭成使禮部侍郎喬宇副之秋七月戊戌朔太白晝見庚子詔更定蝗蟲生發坐罪法乙巳朝獻于衍慶宮詔頒捕蝗圖于中外戊申宋使朝辭致答通謝書及誓書于宋主八月壬申更定遼東行使鈔法癸酉如建春宮己丑以戶部尚書高汝礪等為宋生日使庚寅如秋山九月甲子遣吏部尚書賈守謙等一十三人與各路按察司官推排民戶物力乙丑至自秋山冬十月辛未以吏部郎中郭郛為高麗生日使辛巳宋高麗夏遣使來賀夏國有兵遣使來告癸未更定安泊強竊盜罪格辛卯以軍民共譽為廉能官條附善最法十一月丁酉朔詔諸路按察使並兼轉運使初設三司使掌判鹽鐵度支勸農事以樞密使紇石烈子仁兼三司使癸卯詔戒諭尚書省曰國家之治在於紀綱紀綱所先賞罰必信今乃上自省部之重下逮司縣之間律度弗循私懷自便遷延曠歲苟且成風習此為從何致理朝廷者百官之本京師者諸夏之儀其勗自今各懲已往遵繩奉法謁力赴功無枉撓以循情無依違而避勢一歸于正用範乃民是日御臨武殿試護衛丁未敕諭臨潢泰州路兵馬都總管承裔等修邊備乙卯上不豫丙辰崩于福安殿年四十一大安元年春正月諡曰憲天光運仁文義武神聖英孝皇帝廟號章宗二月甲申葬道陵贊曰章宗在位二十年承世宗治平日久宇內小康乃正禮樂修刑法定官制典章文物粲然成一代治規又數問羣臣漢宣綜核名實唐代考課之法蓋欲跨遼宋而比跡於漢唐亦可謂有志於治者矣然婢寵擅朝冢嗣未立疏忌宗室而傳授非人向之所謂維持鞏固於久遠者徒為文具而不得為後世子孫一日之用金源氏從此衰矣昔揚雄氏有云秦之有司負秦之法度秦之法度負聖人之法度蓋有以夫
