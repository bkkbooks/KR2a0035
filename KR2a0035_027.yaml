body:
  text: 金史卷二十七志第八河渠黃河漕渠盧溝河滹沱河漳河黃河金始克宋兩河悉畀劉豫豫亡河遂盡入金境數十年間或決或塞遷徙無定金人設官置屬以主其事沿河上下凡二十五掃六在河南十九在河北掃設散巡河官一員雄武滎澤原武陽武延津五掃則兼汴河事設黃汴都巡河官一員於河陰以蒞之懷州孟津孟州及城北之四掃則兼沁水事設黃沁都巡河官一員於懷州以臨之崇福上下衛南淇上四掃屬衛南都巡河官則居新鄉武城白馬書城教城四掃屬濬滑都巡河官則處教城曹甸都巡河官則總東明西佳孟華淩城四掃曹濟都巡河官則司定陶濟北寒山金山四掃者也故都巡河官凡六員後又特設崇福上下掃都巡河官兼石橋使凡巡河官皆從都水監廉舉總統掃兵萬二千人歲用薪百一十一萬三千餘束草百八十三萬七百餘束樁杙之木不與此備河之制也大定八年六月河決李固渡水潰曹州城分流于單州之境九年正月朝廷遣都水監梁肅往視之河南統軍使宗室宗言大河所以決溢者以河道積淤不能受水故也今曹單雖被其患而兩州本以水利為生所害農田無幾今欲河復故道不惟大費工役又卒難成功縱能塞之他日霖潦亦將潰決則山東河患又非曹單比也又沿河數州之地驟興大役人心動搖恐宋人乘間構為邊患而肅亦言新河水六分舊河水四分今若塞新河則二水復合為一如遇漲溢南決則害於南京北決則山東河北皆被其害不若李固南築隄以防決溢為便尚書省以聞上從之十年三月拜宗為參知政事上諭之曰卿昨為河南統軍時嘗言黃河堤掃利害甚合朕意朕每念百姓凡有差調吏互為姦若不早計而迫期徵斂則民增十倍之費然其所徵之物或委積經年至腐朽不可復用使吾民數十萬之財皆為棄物此害非細卿既參朝政凡類此者皆當革其弊擇所利而行之十一年河決王村南京孟衛州界多被其害十二年正月尚書省奏檢視官言水東南行其勢甚大可自河陰廣武山循河而東至原武陽武東明等縣孟衛等州增築堤岸日役夫萬一千期以六十日畢詔遣太府少監張九思同知南京留守事紇石烈邈小字阿補孫監護工作十三年三月以尚書省請修孟津滎澤崇福掃堤以備水患上乃命雄武以下八掃並以類從事十七年秋七月大雨河決白溝十二月尚書省奏修築河堤日役夫一萬一千五百以六十日畢工詔以十八年二月一日發六百里內軍夫並取職官人力之半餘聽發民夫以尚書工部郎中張大節同知南京留守事高蘇董役先是祥符縣陳橋鎮之東至陳留潘岡黃河堤道四十餘里以縣官攝其事南京有司言乞專設掃官十九年九月乃設京掃巡河官一員二十年河決衛州及延津京東掃瀰漫至于歸德府檢視官南京副留守石抹輝者言河水因今秋霖潦暴漲遂失故道勢益南行宰臣以聞乃自衛州掃下接歸德府南北兩岸增築堤以捍湍怒計工一百七十九萬六千餘日役夫二萬四千餘期以七十日畢工遂于歸德府創設巡河官一員掃兵二百人且詔頻役夫之地與免今年稅賦二十一年十月以河移故道命築堤以備二十六年八月河決衛州堤壞其城上命戶部侍郎王寂都水少監王汝嘉馳傳措畫備禦而寂視被災之民不為拯救乃專集衆以網魚取官物為事民甚怨嫉上聞而惡之既而河勢泛濫及大名上於是遣戶部尚書劉瑋往行工部事從宜規畫黜寂為蔡州防禦使冬十月上謂宰臣曰朕聞亡宋河防一步置一人可添設河防軍數它日又曰比聞河水泛溢民罹其害者資産皆空今復遣官於被災路分推排何耶右丞張汝霖曰今推排者皆非被災之處上曰雖然必其鄰道也既鄰水而居豈無驚擾遷避者乎計其資産豈有餘哉尚何推排為十一月又謂宰臣曰河未決衛州時嘗有言者既決之後有司何故不令朕知命詢其故二十七年春正月尚書省言鄭州河陰縣聖后廟前代河水為患屢禱有應嘗加封號廟額今因禱祈河遂安流乞加褒贈上從其請特加號曰昭應順濟聖后廟曰靈德善利之廟二月以衛州新鄉縣令張簴丞唐括唐古出主簿溫敦偎喝以河水入城閉塞救護有功皆遷賞有差御史臺言自來沿河京府州縣官坐視管內河防缺壞特不介意若令沿河京府州縣長二官皆於名銜管勾河防事如任內規措有方能禦大患或守護不謹以致疏虞臨時聞奏以議賞罰上從之仍命每歲將泛之時令工部官一員沿河檢視於是以南京府及所屬延津封丘祥符開封陳留胙城嵵縣長垣歸德府及所屬宋城寧陵虞城河南府及孟津河中府及河東懷州河內武陟同州朝邑衛州汲新鄉獲嘉徐州彭城蕭豐孟州河陽溫鄭州河陰滎澤原武泛水濬州衛陝州閿鄉湖城靈寶曹州濟陰滑州白馬睢州襄邑滕州沛單州單父解州平陸開州濮陽濟州嘉祥金鄉鄆城四府十六州之長二皆提舉河防事四十四縣之令佐皆管勾河防事初衛州為河水所壞乃命增築蘇門遷其州治至二十八年水息居民稍還皆不樂遷於是遣大理少卿康元弼按視之元弼還奏舊州民復業者甚衆且南使驛道館舍所在向以不為水備以故被害若但修其堤之薄缺者可以無虞比之遷治所省數倍不若從其民情修治舊城為便乃不遷州仍敕自今河防官司怠慢失備者皆重抵以罪二十九年五月河溢于曹州小堤之北六月上諭旨有司曰比聞五月二十八日河溢而所報文字如此稽滯水事最急功不可緩稍緩時頃則難固護矣十二月工部言營築河堤用工六百八萬餘就用掃兵軍夫外有四百三十餘萬工當用民夫遂詔命去役所五百里州府差顧於不差夫之地均徵顧錢驗物力科之每工錢百五十文外日支官錢五十文米升半仍命彰化軍節度使內族裔都水少監大齡壽提控五百人往來彈壓先是河南路提刑司言沿河居民多困乏逃移蓋以河防差役煩重故也竊惟禦水患者不過堤掃若土功從實計料薪藁樁杙以時徵斂亦復何難今春築堤都水監初料取土甚近及其興工乃遠數倍人夫懼不及程貴價買土一隊之間多至千貫又許州初科薪藁十八萬餘束既而又配四萬四千是皆常歲必用之物農隙均科則易輸納自今堤掃興工乞令本監以實計度量一歲所用物料驗數折稅或令和買於冬月分為三限輸納為便詔尚書省詳議以聞明昌元年春正月尚書省奏臣等以為自今凡興工役先量負土遠近增築高卑定功立限榜諭使人先知無令增加力役並河防所用物色委都水監每歲於八月以前先拘籍舊貯物外實闕之數及次年春工多寡移報轉運司計置於冬三月分限輸納如水勢不常夏秋暴漲危急則用相鄰掃分防備之物不足則復於所近州縣和買然復慮人戶道塗泥淖艱于運納止依稅內科折他物更為增價當官支付違者並論如律仍令所屬提刑司正官一員馳驛監視體究如此則役作有程而河不失備制可之四年十一月尚書省奏河平軍節度使王汝嘉等言大河南岸舊有分流河口如可疏導足泄其勢及長堤以北恐亦有可以歸納排瀹之處乞委官視之濟北掃以北宜創起月堤臣等以為宜從所言其本監官皆以諳練河防故注以是職當使從汝嘉等同往相視庶免異議如大河南北必不能開挑歸納其月堤宜依所料興修上從之十二月敕都水監官提控修築黃河堤及令大名府差正千戶一員部甲軍二百人彈壓勾當五年春正月尚書省奏都水監丞田櫟同本監官講議黃河利害嘗以狀上言前代每遇古堤南決多經南北清河分流南清河北下有枯河數道河水流其中者長至七八分北清河乃濟水故道可容三二分而已今河水趨北齧長堤而流者十餘處而堤外率多積水恐難依元料增修長堤與創築月堤也可於北岸牆村決河入梁山濼故道依舊作南北兩清河分流然北清河舊堤歲久不完當立年限增築大堤而梁山故道多有屯田軍戶亦宜遷徙今擬先於南岸王村宜村兩處決堤導水使長堤可以固護姑宜仍舊如不能疏導即依上開決分為四道俟見水勢隨宜料理尚書省以櫟等所言與明昌二年劉瑋等所案視利害不同及令陳言人馮德輿與櫟面對亦有不合者送工部議復言若遽於牆村疏決緣瀕北清河州縣二十餘處兩岸連亙千有餘里其堤防素不修備恐所屯軍戶亦卒難徙今歲先於南岸延津縣堤決堤泄水其北岸長堤自白馬以下定陶以上並宜加功築護庶可以遏將來之患若定陶以東三掃棄堤則不必修止決舊壓河口引導積水東南行流堤北張彪白塔兩河間礙水軍戶可使遷徙及梁山濼故道分屯者亦當預為安置宰臣奏曰若遽從櫟等所擬恐既更張利害非細比召河平軍節度使王汝嘉同計議先差幹濟官兩員行戶工部事覆視之同則就令計實用工物量州縣遠近以調丁夫其督趣春工官即充今歲守漲及與本監官同議經久之利詔以知大名府事內族裔尚書戶部郎中李敬義充行戶工部事以參知政事胥持國都提控又奏差德州防禦使李獻可尚書戶部郎中焦旭於山東當水所經州縣築護城堤及北清河兩岸舊有堤處別率丁夫修築亦就令講究河防之計他日上以宋閻士良所述黃河利害一帙付參知政事馬琪曰此書所言亦有可用者今以賜卿二月上諭平章政事守貞曰王汝嘉田櫟專管河防此國家之重事也朕比問其曾於南岸行視否乃稱未也又問水決能行南岸乎又云不可知且水趨北久矣自去歲便當經畫今不稱職如是耶可諭旨令往盡心固護無致失備及講究所以經久之計稍涉違慢當併治罪三月行省並行戶工部及都水監官各言河防利害事都水監元擬於南岸王村宜村兩處開導河勢緣比來水勢去宜村堤稍緩唯王村岸向上數里臥捲可以開決作一河且無所犯之城市村落又擬於北岸牆村疏決依舊分作兩清河入梁山故道北清河兩岸素有小堤不完後當築大堤尚書省謂以黃河之水勢若於牆村決注則山東州縣膏腴之地及諸鹽場必被淪溺設使修築壞堤而又吞納不盡功役至重虛困山東之民非徒無益而又害之也況長堤已加固護復於南岸疏決水勢已寢決河入梁山濼之議水所經城邑已勸率作護城堤矣先所修清河舊堤已遣罷之監丞田櫟言定陶以東三掃棄堤不當修止言決舊壓河口以導漸水入堤北張彪白塔兩河之間凡當水衝屯田戶須令遷徙臣等所見止當堤前作木岸以備之其間居人未當遷徙至夏秋水勢泛溢權令避之水落則當各復業此亦戶工部之所言也上曰地之相去如此其遠彼中利害安得悉知惟委行省盡心措畫可也四月以田櫟言河防事上諭旨參知政事持國曰此事不惟責卿要卿等同心規畫不勞朕心爾如櫟所言築堤用二十萬工歲役五十日五年可畢此役之大古所未有況其成否未可知就使可成恐難行也遷徙軍戶四千則不為難然其水特決尚不知所歸儻有潰走若何枝梧如令南岸兩處疏決使其水趨南或可分殺其勢然水之形勢朕不親見難為條畫雖卿亦然丞相左丞皆不熟此可集百官詳議以行百官咸謂櫟所言棄長堤無起新堤放河入梁山故道使南北兩清河分流為省費息民長久之計臣等以為黃河水勢非常變易無定非人力可以斟酌可以指使也況梁山濼淤填已高而北清河窄狹不能吞伏兼所經州縣農民廬井非一使大河北入清河山東必被其害櫟又言乞許都水監符下州府運司專其用度委其任責一切同於軍期仍委執政提控緣今監官已經添設又於外監署司多以沿河州府長官兼領之及令佐管勾河防其或怠慢已有同軍期斷罪的決之法凡櫟所言無可用遂寢其議八月以河決陽武故堤灌封丘而東尚書省奏都水監行部官有失固護詔命同知都轉運使高旭武衛軍副都指揮使女奚列奕小字韓家奴同往規措尚書省奏都水監官前來有犯已經戒諭使之常切固護今王汝嘉等殊不加意既見水勢趨南不預經畫承留守司纍報輒為遷延以至害民即是故違制旨私罪當的決詔汝嘉等各削官兩階杖七十罷職上謂宰臣曰李愈論河決事謂宜遣大臣往以慰人心其言是嚮慮河北決措畫堤防猶嘗置行省況今方橫潰為害而止差小官恐失衆望自國家觀之雖山東之地重於河南然民皆赤子何彼此之間乃命參知政事馬琪往仍許便宜從事上曰李愈不得為無罪雖都水監官非提刑司統攝若與留守司以便宜率民固護或申聞省部亦何不可使朕聞之徒能張皇水勢而無經畫及其已決乃與王汝嘉一往視之而還亦未嘗有所施行問王村河口開導之月則對以四月終其實六月也月日尚不知提刑司官當如是乎尋命戶部員外郎何格賑濟被浸之民時行省參知政事胥持國馬琪言已至光祿村周視堤口以其河水浸漫堤岸陷潰至十餘里外乃能取土而堤面窄狹僅可數步人力不可施雖窮力可以暫成終當復毀而中道淤澱地有高低流不得泄且水退新灘亦難開鑿其孟華等四掃與孟陽堤道沿汴河東岸但可施功者即悉力修護將於農隙興役及凍畢工則京城不至為害參知政事馬琪言都水外監員數冗多每事相倚或復邀功議論紛紜不一隳廢官事擬罷都水監掾設勾當官二員又自昔選用都散巡河官止由監官辟舉皆諸司人或有老疾避倉庫之繁行賄請託以致多不稱職擬升都巡河作從七品於應入縣令廉舉人內選注外散巡河依舊亦於諸司及丞簿廉舉人內選注並取年六十以下有精力能幹者到任一年委提刑司體察若不稱職即日罷之如守禦有方致河水安流任滿從本監及提刑司保申量與升除凡河橋司使副亦擬同此選注繼而胥持國亦以為言乃從其請閏十月平章政事守貞曰馬琪措畫河防事未見功役之數加之積歲興功民力將困今持國復病請別遣有材幹者往議之上曰堤防救護若能成功則財力固不敢惜第恐財殫力屈成而復毀如重困何宰臣對曰如盡力固護縱為害亦輕若恬然不顧則為害滋甚上曰無乃因是致盜賊乎守貞曰宋以河決興役亦嘗致盜賊然多生於凶歉今時平歲豐少有差役未必至此且河防之役理所當然今之當役者猶為可耳至於科徵薪芻不問有無督輸迫切則破産業以易之恐民益困耳上曰役夫須近地差取若遠調之民益艱苦但使津濟可也然當俟馬琪至而後議之庚辰琪自行省還入見言孟陽河堤及汴堤已填築補修水不能犯汴城自今河勢趨北來歲春首擬於中道疏決以解南北兩岸之危凡計工八百七十餘萬可於正月終興工臣乞前期再往河上監視上以所言付尚書省而治檢覆河堤並守漲官等罪有差他日尚書省奏事上語及河防事馬琪奏言臣非敢不盡心然恐智力有所不及若別差官相度儻有奇畫亦未可知如適與臣策同方來興功亦庶幾稍寬朝廷憂顧上然之命翰林待制奧屯忠孝權尚書戶部侍郎太府少監溫昉權尚書工部侍郎行戶工部事修治河防且諭之曰汝二人皆朕所素識以故委任冀副朕意如有錯失亦不汝容承安元年七月敕自今沿河傍側州府縣官雖部除者皆勿令員闕泰和二年九月敕御史臺官河防利害初不與卿等事然臺官無所不問應體究者亦體究之五年二月以崔守真言黃河危急芻藁物料雖云折稅每年不下五六次或名為和買而未嘗還其直敕委右三部司正郭澥御史中丞孟鑄講究以聞澥等言大名府鄭州等處自承安二年以來所科芻藁未給價者計錢二十一萬九千餘貫遂命以各處見錢差能幹官同各州縣清強官一一酬之續令按察司體究宣宗貞祐三年十一月壬申上遣參知政事侯摯祭河神於宜村三年四月單州刺史顏盞天澤言守禦之道當決大河使北流德博觀滄之境今其故堤宛然猶在工役不勞水就下必無漂沒之患而難者若不以犯滄鹽場損國利為説必以浸沒河北良田為解臣嘗聞河側故老言水勢散漫則淺不可以馬涉深不可以舟濟此守禦之大計也若曰浸民田則河徙之後淤為沃壤正宜耕墾收倍于常利孰大焉若失此計則河南一路兵食不足而河北山東之民皆瓦解矣詔命議之四年三月延州刺史溫撒可喜言近世河離故道自衛東南而流由徐邳入海以此河南之地為狹臣竊見新鄉縣西河水可決使東北其南有舊堤水不能溢行五十餘里與清河合則由濬州大名觀州清州柳口入海此河之故道也皆有舊堤補其缺罅足矣如此則山東大名等路皆在河南而河北諸郡亦得其半退足以為禦備之計進足以壯恢復之基又言南岸居民既已籍其河夫修築河堰營作戍屋又使轉輸芻糧賦役繁殷倍於他所夏秋租稅猶所未論乞減其稍緩者以寬民力事下尚書省宰臣謂河流東南舊矣一旦決之恐故道不容衍溢而出分為數河不復可收水分則淺狹易渡天寒輒凍禦備愈難此甚不可詔但令量宜減南岸郡縣居民之賦役五年夏四月敕樞密院沿河要害之地可壘石岸仍置撒星樁陷馬塹以備敵漕渠金都於燕東去潞水五十里故為閘以節高良河白蓮潭諸水以通山東河北之粟凡諸路瀕河之城則置倉以貯傍郡之稅若恩州之臨清歷亭景州之將陵東光清州之興濟會川獻州及深州之武強是六州諸縣皆置倉之地也其通漕之水舊黃河行滑州大名恩州景州滄州會川之境漳水東北為御河則通蘇門獲嘉新鄉衛州濬州黎陽衛縣彰德磁州洺州之餽衡水則經深州會于滹沱以來獻州清州之餉皆合于信安海壖泝流而至通州由通州入閘十餘日而後至于京師其它若霸州之巨馬河雄州之沙河山東之北清河皆其灌輸之路也然自通州而上地峻而水不留其勢易淺舟膠不行故常從事陸挽人頗艱之世宗之世言者請開盧溝金口以通漕運役衆數年竟無成功事見盧溝河其後亦以閘河或通或塞而但以車挽矣其制春運以冰消行暑雨畢秋運以八月行冰凝畢其綱將發也乃合衆以所載之粟苴而封之先以付所卸之地視與所封樣同則受凡綱船以前期三日修治日裝一綱裝畢以三日啓行計道里分泝流沿流為限至所受之倉以三日卸又三日給收付凡挽漕腳直水運鹽每石百里四十八文米五十文一分二釐七毫粟四十文一分三毫錢則每貫一文七分二釐八毫陸運傭直米每石百里百一十二文一分五毫粟五十七文六分八釐四毫錢每貫三文九釐六毫餘物每百斤行百里平路則春冬百三十一文五分夏秋百五十七文八分山路則春冬百四十九文夏秋二百一文凡使司院務納課傭直春冬九十文三分夏秋百一十四文諸民戶射賃官船漕運者其腳直以十分為率初年剋二分二年剋一分八釐三年剋一分七釐四年剋一分五釐五年以上剋一分初世宗大定四年八月以山東大熟詔移其粟以實京師十月上出近郊見運河湮塞召問其故主者云戶部不為經畫所致上召戶部侍郎曹望之責曰有河不加濬使百姓陸運勞甚罪在汝等朕不欲即加罪宜悉力使漕渠通也五年正月尚書省奏可調夫數萬上曰方春不可勞民令宮籍監戶東宮親王人從及五百里內軍夫濬治二十一年以八月京城儲積不廣詔沿河恩獻等六州粟百萬餘石運至通州輦入京師明昌三年四月尚書省奏遼東北京路米粟素饒宜航海以達山東昨以按視東京近海之地自大務清口並咸平銅善館皆可置倉貯粟以通漕運若山東河北荒歉即可運以相濟制可承安五年邊河倉州縣可令折納菽二十萬石漕以入京驗品級養馬於俸內帶支仍漕麥十萬石各支本色乃命都水監丞田櫟相視運糧河道泰和元年尚書省以景州漕運司所管六河倉歲稅不下六萬餘石其科州縣近者不下二百里官吏取賄延阻人不勝苦雖近官監之亦然遂命監察御史一員往來糾察之五年上至霸州以故漕河淺止𣥖敕尚書省發山東河北河東中都北京軍夫六千改鑿之犯屯田戶地者官對給之民田則多酬其價六年尚書省以凡漕河所經之地州縣官以為無與於己多致淺滯使綱戶以盤淺剝載為名姦弊百出於是遂定制凡漕河所經之地州府官銜內皆帶提控漕河事縣官則帶管勾漕河事俾催檢綱運營護堤岸為府三大興大名彰德州十二恩景滄清獻深衛濬滑磁洺通縣三十三大名元城館陶夏津武城歷亭臨清吳橋將陵東光南皮清池靖海興濟會川交河樂壽武強安陽湯陰臨漳成安滏陽內黃黎陽衛蘇門獲嘉新鄉汲潞武清香河漷陰十二月通濟河創設巡河官一員與天津河同為一司通管漕河閘岸止名天津河巡河官隸都水監八年六月通州刺史張行信言船自通州入閘凡十餘日方至京師而官支五日轉腳之費遂增給之貞祐三年既遷于汴以陳潁二州瀕水欲借民船以漕不便遂依觀州漕運司設提舉官募船戶而籍之命戶部勾當官往來巡督四年從右丞侯摯言開沁水以便餽運上又念京師轉輸之勞命出尚竹罒戊牛及官車以助其力興定四年十月諭皇太子曰中京運糧護送官當擇其人萬有一失樞密官亦有罪矣其船當用毛花輦所造兩首尾者仍張幟如渡軍之狀勿令敵知為糧也陝西行省把胡魯言陝西歲運糧以助關東民力浸困若以舟自渭入河順流而下可以紓民力遂命嚴其偵候如有警則皆維於南岸時朝廷以邳徐宿泗軍儲京東縣挽運者歲十餘萬石民甚苦之元光元年遂於歸德府置通濟倉設都監一員以受東郡之粟定國軍節度使李復亨言河南駐蹕兵不可闕糧不厭多比年少有匱乏即仰給陝西陝西地腴歲豐十萬石之助不難但以車運之費先去其半民何以堪宜造大船二十由大慶關渡入河東抵湖城往還不過數日篙工不過百人使舟皆容三百五十斛則是百人以數日運七千斛矣自夏抵秋可漕三千餘萬斛且無稽滯之患上從之時又於靈璧縣潼郡鎮設倉都監及監支納以方開長直溝將由萬安湖舟運入汴至泗以貯粟也盧溝河大定十年議決盧溝以通京師漕運上欣然曰如此則諸路之物可徑達京師利孰大焉命計之當役千里內民夫上命免被災之地以百官從人助役已而敕宰臣曰山東歲飢工役興則妨農作能無怨乎開河本欲利民而反取怨不可其姑罷之十一年十二月省臣奏復開之自金口疏導至京城北入壕而東至通州之北入潞水計工可八十日十二年三月上令人覆按還奏止可五十日上召宰臣責曰所餘三十日徒妨農費工卿等何為慮不及此及渠成以地勢高峻水性渾濁峻則奔流漩洄齧岸善崩濁則泥淖淤塞積滓成淺不能勝舟其後上謂宰臣曰分盧溝為漕渠竟未見功若果能行南路諸貨皆至京師而價賤矣平章政事駙馬元忠曰請求識河道者按視其地竟不能行而罷二十五年五月盧溝決於上陽村先是決顯通寨詔發中都三百里內民夫塞之至是復決朝廷恐枉費工物遂令且勿治二十七年三月宰臣以孟家山金口閘下視都城高一百四十餘尺止以射糧軍守之恐不足恃儻遇暴漲人或為姦其害非細若固塞之則所灌稻田俱為陸地種植禾麥亦非曠土不然則更立重閘仍於岸上置掃官廨署及掃兵之室庶幾可以無虞也上是其言遣使塞之夏四月丙子詔封盧溝水神為安平侯二十八年五月詔盧溝河使旅往來之津要令建石橋未行而世宗崩章宗大定二十九年六月復以涉者病河流湍急詔命造舟既而更命建石橋明昌三年三月成敕命名曰廣利有司謂車駕之所經行使客商旅之要路請官建東西廊令人居之上曰何必然民間自應為耳左丞守貞言但恐為豪右所占況罔利之人多止東岸若官築則東西兩岸俱稱亦便於觀望也遂從之六月盧溝堤決詔速遏塞之無令泛溢為害右拾遺路鐸上疏言當從水勢分流以行不必補修玄同口以下丁村以上舊堤上命宰臣議之遂命工部尚書胥持國及路鐸同檢視其堤道滹沱河大定八年六月滹沱犯真定命發河北西路及河間太原冀州民夫二萬八千繕完其堤岸十年二月滹沱河創設巡河官二員十七年滹沱決白馬岡有司以聞詔遣使固塞發真定五百里內民夫以十八年二月一日興役命同知真定尹鶻沙虎同知河北西路轉運使徐偉監護漳河大定二十年春正月詔有司修護漳河閘所須工物一切並從官給毋令擾民明昌二年六月漳河及盧溝堤皆決詔命速塞之四年春正月癸未有司言修漳河堤掃計三十八萬餘工詔依盧溝河例招被水闕食人充夫官支錢米不足則調礙水人戶依上支給
