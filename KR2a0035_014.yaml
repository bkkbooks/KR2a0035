body:
  text: 金史卷十四本紀第十四宣宗上宣宗繼天興統述道勤仁英武聖孝皇帝諱珣本名吾睹補顯宗長子母曰昭華劉氏大定三年癸未歲生世宗養于宮中十八年封溫國公加特進二十六年賜今名二十九年進封豐王加開府儀同三司纍判兵吏部又判永定彰德等軍承安元年進封翼王泰和五年改賜名從嘉八年進封邢王又封升王所至著祥異至寧元年八月衛紹王被弒徒單銘等迎于彰德府既至京親王百官上表勸進九月甲辰即皇帝位於大安殿以紇石烈胡沙虎為太師尚書令兼都元帥封澤王乙巳諭尚書省事有規畫者皆即規畫悉依世宗所行行之丙午以駙馬雄名第賜胡沙虎丁未諭宰臣曰朕即大位羣臣凡有所見各直言勿隱臨奠于衛紹王第有司奏舊禮當設坐哭上命撤坐伏哭盡哀敕有司以禮改葬戊申御仁政殿視朝賜胡沙虎坐胡沙虎不辭辛亥封皇子守禮為遂王守純為濮王皇女溫國公主夔王永升薨上親臨奠大元遣乙里只來壬子改元貞祐大赦恩賚中外臣民有差丙辰左諫議大夫張行信上章言崇節儉廣聽納明賞罰三事尚書右丞相徒單鎰進左丞相封廣平郡王庚申澤王胡沙虎等議廢故衛王為庶人上曰朕徐思之以諭卿等壬戌授胡沙虎中都路和魯忽土世襲猛安丙寅詔諭六品以下官事有可言者言之無隱閏月戊辰朔拜日于仁政殿自是每月吉為常授尚書左丞相徒單鎰中都路迭魯猛安庚午上復舊名珣詔所司告天地廟社前所更名二字自今不須回避辛未詔追尊皇妣為皇太后是日皇妃皇子至自彰德府遣使使宋己卯左諫議大夫張行信上疏請立皇太子甲申立子守忠為皇太子丙戌詔降故衛王為東海郡侯甲午減定監察御史為十二員冬十月丁酉朔京師戒嚴辛丑大元乙里只來乙巳詔應遷加官賞諸色人與本朝人一體庚戌敕有司皇太子冊禮俟邊事息然後舉行辛亥元帥右監軍术虎高琪戰于城北凡兩敗績而歸就以兵殺胡沙虎于其第持其首詣闕待罪赦之仍授左副元帥壬子殿前都點檢紇石烈特末也等補外甲寅張行信上封事言正刑賞擇將帥及鄯陽石古乃之寃大元兵下涿州設京城鎮撫彈壓官置招賢所癸亥放宮女百三十人十一月戊辰夏人攻會州徒單醜兒出兵擊走之庚午將乞和于大元詔百官議于尚書省以橫海軍節度使承暉為尚書右丞耿端義為參知政事癸未詔贈死事裴滿福興及鄯陽石古乃官大元兵徇觀州刺史高守約死之又徇河間府滄州乙未定亡失告身文憑格十二月丁酉朔上御應天門詔諭軍士仍出銀以賜之平章政事徒單公弼進尚書右丞相尚書右丞承暉進都元帥兼平章政事左副元帥术虎高琪進平章政事兼前職二年春正月丁卯朔以邊事未息詔免朝賀辛未大元兵徇彰德府知府事黃摑九住死之宋人攻秦州統軍使石抹仲溫擊却之癸未有司奏請權止今年禘享朝獻原廟及皇太后冊禮從之乙酉徵處士王澮不至大元兵徇益都府命有司復議本朝德運乙未大元兵徇懷州沁南軍節度使宋扆死之二月丙申朔壬子大元乙里只扎八來丙辰罷按察司壬戌大元乙里只復來三月辛未遣承暉詣大元請和丁丑赦國內癸未京師大括粟甲申大元乙里只扎八來詔百官議于尚書省戊子以濮王守純為殿前都點檢兼侍衛親軍都指揮使權都元帥府事庚寅奉衛紹王公主歸于大元太祖皇帝是為公主皇后辛卯詔許諸人納粟買官京師戒嚴壬辰大元兵下嵐州鎮西軍節度使烏古論仲溫死之夏四月乙未朔以知大興府事胥鼎為尚書右丞戊戌奉遷昭聖皇后柩于新寺時山東河北諸郡失守惟真定清沃大名東平徐邳海數城僅存而已河東州縣亦多殘燬兵退命僕散安貞等為諸路宣撫使安集遺黎至是以大元允和議大赦國內癸卯權厝昭聖皇后于新寺甲辰詔有司具陳亡人子孫以備録用丁未以都元帥承暉為右丞相庚戌左丞相監修國史廣平郡王徒單鎰薨乙卯尚書省奏巡幸南京詔從之己未葬衛紹王五月癸酉承暉加金紫光祿大夫封定國公尚書左丞抹撚盡忠加崇進封申國公甲戌霍王從彝薨乙亥輟朝上決意南遷詔告國內太學生趙昉等上章極論利害以大計已定不能中止皆慰諭而遣之詣原廟奉辭戊寅將發雨不果行以南京留守僕散端等嘗請臨幸及行先詔諭之辛巳詔遷衛紹鎬厲王家屬于鄭州壬午車駕發中都是日雨至甲申止丙戌次定興禁有司扈從踐蹂民田丁亥次安肅州元帥右監軍完顏弼以兵迎見癸巳次中山府敕扈從軍所踐禾稼計直酬之六月甲午朔以按察轉運使高汝礪為參知政事癸丑次內丘縣大元乙里只來戊午次彰德府曲赦其境內庚申次巨橋鎮是日南京行宮寶鎮閣災壬戌次宜村黃龍見西北秋七月車駕至南京詔立元妃溫敦氏為皇后八月甲午以立后百官上表稱賀庚子皇太子至自中都丁未夏人入邊命移文責之甲寅罷經略司應奉翰林文字完顏素蘭上書言事九月壬戌朔日有食之皇孫生癸亥山東路報萊州之捷辛未立監察御史升黜格庚辰詔訓練軍士丁亥諭宣徽院正旦生辰不須進物太白晝見于軫戊子禁軍官圍獵冬十月甲午詔遣官市木波西羌馬陝西軍戶戰死者給糧贍其家丁酉大元兵徇順州勸農使王晦死之壬寅左副元帥兼尚書左丞抹撚盡忠進平章政事以御史中丞孛术魯德裕為參知政事兼簽樞密院事曲赦中都路乙卯遣參知政事孛术魯德裕行尚書省于大名府丙辰大元兵收成州諭大名行省貶損用度德州防禦使完顏醜奴伏誅十一月丁卯以御史大夫僕散端為尚書左丞相曲赦山東路辛未詔賜衛紹王家屬既禀詔有司答夏國牒丙子許諸色人試武舉蘭州譯人程陳僧叛西結夏人為援辛巳熒惑犯房宿鈎鈐星癸未曲赦遼東路敕罷宣撫司輒擬官十二月戊戌遣真定行元帥府事永錫等援中都頒勸農詔丁未以和議既定聽民南渡乙卯登州刺史耿格伏誅流其妻孥大元兵徇懿州節度使高閭山死之三年春正月辛酉朔宋遣使來賀壬戌遣內侍諭永錫防邊毋以和議為辭癸亥曲宴羣臣宋使定文武五品以上侍坐員遂為常制乙丑詔宣撫阿海總管合住討賊劉二祖張汝楫戊辰尚書省言內外軍人入粟補官者多行伍浸虛請俟平定應監差者與三酬門戶有職事者升一等其子弟應蔭者罷之上可其奏乙亥夏人犯環州北京軍亂殺宣撫使奧屯襄丁丑右副元帥蒲察七斤以其軍降於大元辛巳皇太子疾輟朝乙酉皇太子薨二月辛卯環州刺史烏古論延壽及斜卯毛良虎等敗夏人于州境詔進官有差大元乙里只來壬辰上臨奠皇太子殯所有司奏辰日不哭上曰父子至親何可拘忌命御史中丞李英元帥左都監烏古論慶壽領兵護餉中都付以空名宣敕許視功遷逗撓者治以軍律乙未改寧邊州隸嵐州丁酉詔諸色人遷官並視女直人有司妄生分別以違制論從戶部郎中奧屯阿虎請也辛丑敕宰臣饋乙里只酒饌壬寅頒奬諭官吏軍民詔曲赦招撫北京作亂者丙午尚書省以南遷後吏部秋冬置選南京春夏置選中都赴調者不便請併選於南京從之武清縣巡檢梁佐柳口巡檢李咬住以誅辭賊張暉劉永昌等功進官有差皆賜姓完顏丁未山東宣撫使僕散安貞遣提控僕散留家等破賊楊安兒步騎三萬殲其衆降僞頭目三百餘人脅從民三萬餘戶戊申減沿邊州府官資考有差壬子立保城無虞及捕獲姦叛遷賞格乙卯敕奏急事不拘假日丁巳日初出赤如血欲沒復然戊午大風隆德殿鴟尾壞三月壬戌詔河北州縣官令文武五品以上辟舉不聽以它事差占仍敕終任有勞績者但升遙領之職應降罰者亦止本處居住時河北殘燬吏治多苟且以求代易故著是令癸亥詔百官各陳防邊利害封章以聞丙寅敕河東河北大名長二官訓練隨處義兵鄰境有警責其救援降人自拔歸國者遷職仍列其姓名以招諭來者沿河州縣官罷軟不勝職任者汰去令五品已上官公舉仍許今季到部人內先擇能者量緩急易之丁卯安武軍節度使張行信上書言急務四事庚午諭遼東宣撫使蒲鮮萬奴選精鋭屯瀋州廣寧以俟進止壬申長春節宋遣使來賀戊寅諭尚書省歲旱議弛諸處碾磑以其水溉民田己卯雨自去冬不雨雪至是始雨勸農使李革言河北州縣官吏多求河南差占以避難宜發元任領戍兵者不可離則別注以往庚辰御史臺言在京軍官及委差官芻糧券例悉同征行乞減其給樞密院委差有俸人吏非征行不必給皆從之敕尚書省入粟補官者毋括其戶為軍有司議賞軍功毋有所沮格壬午山東宣撫司報大沫堌之捷夾谷石里哥及沒烈擒賊渠劉二祖等斬之前後殪賊萬計西京軍民變遣官撫諭之己丑禁州縣置刃於杖以決罪人前年京兆治中李友直私逃華州結同知防禦使馮朝河州防禦判官郝遵甫平涼府同知致仕楊庭秀水洛縣主簿宿徽等團集州民號忠義扈駕都統府相挻為亂殺其防禦判官完顏八斤及城中女直人以書約都統楊圭為府兵所得圭諱之請自效誘友直等執之麾所招千餘人納仗坑諸城下時京師道路隔絶安撫司以便宜族友直等至是以狀聞乃贈八斤及被害官軍十餘人各一官賻錢三百貫夏四月癸巳河東宣撫使胥鼎言利害十三事長勝軍都統楊圭伏誅丙申河南路蝗遣官分捕上諭宰臣曰朕在潛邸聞捕蝗者止及道傍使者不見處即不加意當以此意戒之權參知政事德升言舊制夏至後免朝四日一奏事上曰此在平時可耳方今多故勿謂朕勞遂云當免但使國事無廢則善矣己亥曲赦山東路癸卯籍赴選監當官為軍乙巳罷都南行尚書六部侯摯言九事曲赦蒲察七斤脅從之黨募能殺獲七斤者以其官官之丙午以調度不給凡隨朝六品以下官及承應人罷其從己人力輸傭錢經兵州府其吏減半司縣吏減三之一其餘除開封府南京轉運司外例減三之一有祿官吏被差不出本境者並罷給券出境者以其半給之修內司軍夫亦減其半丁未故皇太子啓菆賜諡曰莊獻戊申權葬迎朔門外詔自今策論詞賦進士第一甲第一人特遷奉直大夫第二人以下經義第一人並儒林郎第二甲以下徵事郎同進士從仕郎經童將仕郎壬子芮國公從厚薨詔遣使同山西宣撫司選其民勇健者為軍諭有司勿拒河北避兵之民所至加存恤用山東西路宣撫副使完顏弼言招大沫堌渠賊孫邦佐張汝楫以五品職下詔湔洗其罪乙卯詔檢核朝廷差遣官券曆無故稽留中道者罪之丙辰諭田琢留山西流民少壯者充軍老幼者令就食於邢洺等州欲趣河南者聽上議遣親軍六千餘及所募二千七百人援中都宰臣以為行宮單弱親軍不可遣遂止五月庚申招撫山西軍民仍降詔諭之是日中都破尚書右丞相兼都元帥定國公承暉死之戶部尚書任天寵知大興府事高霖皆及於難壬戌降空名宣敕紫衣師德號度牒以補軍儲辛未立皇孫鏗為皇太孫癸酉劉炳上書言十事辛巳上諭宰臣多事之秋陳言者悉送省恐卿等不暇朕於宮中置局命方正官數員擇可取者付出施行何如宰臣請如聖諭詔削納馬補官恩例戊子謀伐西夏遣大臣鎮撫京兆秋七月戊午朔大元兵收濟源縣己未徵弓箭于內外品官三品以上三副四品五品二副餘以等級徵之庚申置陳潁漕運提舉官以戶部勾當官往來督察有星如太白色青白有尾出紫微垣北極傍入貫索中上聞河北譏察官有要求民財始聽民渡河者避兵民至或餓死自溺特命御史臺體訪之又禁隨朝職官敓民碾磑以自營利詔河間孤城移其軍民就粟清州括民間騾付諸軍與馬參用辛酉議括官田及牧馬地以贍河北軍戶之徙河南者巳為民佃者俟穫畢日付之羣臣迭言其不便遂寢癸亥詔河北郡縣軍須並減河南之半定尚書所造諸符樞密院鹿宣撫司魚統軍司虎丙寅遣參知政事高汝礪往河南便宜措置糧儲制品官納弓箭之令丁憂致仕者免甲戌借平陽民租一年詔職官更兵亡失告身見任者保識即重給之妄冒者從詐僞法丙子尚書省奏給皇太孫歲賜錢上不從曰襁褓兒安所用之詔致仕官俸給比南征時減其半丁丑肅宗神主至自中都奉安于明俊殿戊寅月入畢宿中戊夜犯畢大星己卯明德皇后神主至自中都裁損宮中歲給有差甲申詔尚書省行六部太多其令各路運司兼之改交鈔名貞祐寶券八月戊子朔以陝西統軍使完顏合打簽樞密院事己丑制軍府庶事樞密院官須與經歷官裁決經歷議是而院官不從許直以聞癸巳詔遣官體究京西路新遷軍戶丙申諭尚書省職官犯罪大者即施行之小者籍之事定始論其罪諭樞密院撒合輦所簽軍有具戒僧人可罷遣之己亥詔武舉官非見任及已從軍者隨處調赴京師別為一軍以備用被薦未授官者量才任之庚子上慮平陽城大兵食不足議棄之宰臣持不可賞前冀州教授粘割忒鄰集義兵出方略遏土寇兵後攝州復立州治積芻糧招徠民戶至五萬特遷三官升正五品職置山東西路總管府于歸德府及徐亳二州以太常卿侯摯為參知政事行尚書省于河北東西兩路太祖御容至自西京奉安于啓慶宮甲辰置行樞密院于徐州歸德府詔諸職官不拘何從出身其才可大用者尚書省具以聞丙午山東西路宣撫使完顏弼表遙授同知東平府事張汝楫將謀復叛密遣人招同知益都府事孫邦佐邦佐斬其人馳報弼弼殺汝楫及其黨萬餘承制升邦佐德州防禦使餘立功者賞有差上嘉弼功加崇進封密國公詔奬諭之丁未詔近臣舉良將加孫邦佐昭毅大將軍泰定軍節度使仍官其子戊申東平益都太原潞州置元帥府大赦己酉監察御史許古獻恢復中都之策紅襖賊掠成武宣撫副使顏盞天澤討走之斬首數百級進天澤一官將校有功者命就遷賞命侯摯招邢州賊程邦傑以官不從則誘其黨圖之減戶部幹辦官四員及委差官有差壬子置行省于陝西乙卯增沿河闌糴之法十取其八以抑販粟之弊仍嚴禁私渡增步軍萬人戍京以西四萬人戍京以東選陝西騎兵二千增京畿之衛諭陝西堅守延安臨洮環慶蘭會保安綏德平涼德順鎮戎涇原鄜坊邠寧乾耀等處要害分渭南州郡步兵屯平涼令宣撫使治邠州副使治同州之澄城以統之更以步騎守沿渭諸津丙辰元帥左監軍兼知真定府事永錫坐援中都失律削官爵杖之八十九月丁巳朔戶部侍郎奧屯阿虎言國家多故職官往往不仕乞限以兩季違者勿復任用上嫌其太重命違限者止奪三官降職三等仍永不升注辛酉除名永錫特遷信武將軍息州刺史甲子諭宰臣沿淮塘路以南地嚮授民業今為豪勢據奪者其令有司察之丙寅樞密院言陝西河東世襲蕃部巡檢昨與世襲猛安謀克例罷其俸今邊事方急宜仍給之庶獲其用又西邊弓箭手有才武出衆獲功未推賞者令宣撫司核實以聞從之丁卯以秋稼未穫禁軍官圍獵授隱士王澮太中大夫右諫議大夫充遼東宣撫司參謀官戊辰遙授武寧軍節度副使徒單吾典告平章政事抹撚盡忠逆謀詔有司鞫之設潼關提控總領軍馬等官辛未置河北東路行總管府於原武陽武封丘陳留延津通許嵵諸縣以治所徙軍戶命司屬令和尚等護治鞏國公按辰第上謂宰臣曰按辰所為不慎或至犯法舍之則理所不容治之則失親親之道但當設官以防之耳按辰尋以不法謫博州防禦使黜衛紹王母李氏光獻皇后尊諡神主在太廟畫像在啓慶宮並遷出之陳州鎮防軍段仲連進羊三百詔遷三官命右丞汝礪詣陳州規畫糧儲壬申以蘇門縣為輝州癸酉朝謁世祖太祖御容于啓慶宮行獻享禮始用樂賜東永昌姓為溫敦氏包世顯包疙疸為烏古論氏覩令孤為和速嘉氏何定為必蘭氏馬福德馬柏壽為夾谷氏各遷一官甲戌朝謁太宗熙宗睿宗御容行獻享禮詔開滑濬濟曹滕諸州置連珠寨如衛州乙亥詔河北山東等路及平涼慶陽臨洮府涇邠秦鞏德順諸州經兵四品以下職事官並以二十月為滿募隨處主帥及官軍義軍將校有能率衆復取中都者封王遷一品階授二品職能戰却敵善誘降人取附都州縣者豫本處長官散官隨職遷授餘州縣遞減二等紅襖賊周元兒陷深祁州束鹿安平無極等縣真定帥府以計破之斬元兒及殺其黨五百餘人丁丑詔司縣官能募民進糧五千石以上減一資考萬石以上遷一官減二資考二萬石以上遷一官升一等注見闕諸色人以功賜國姓者能以千人敗敵三千人賜及緦麻以上親二千人以上賜及大功以上親千人以上賜止其家庚辰陝西宣撫司來上第五將城萬戶楊再興擊走夏人之捷壬午以空名宣敕付陝西宣撫司凡夏人入寇有能臨陳立功者五品以下並聽遷授乙酉置大名府行總管府于柘城縣以治所徙軍戶冬十月丙戌朔翰林侍讀學士權參知政事烏古論德升出為集慶軍節度使兼亳州管內觀察使丁亥尚書右丞汝礪言河北軍戶之徙河南者宜以係官閒田及牧馬草地之可耕者賜之使自耕以食而罷其月糧上從其請命右司諫馮開隨處按視人給三十畝夏人入保安都統完顏國家奴破之攻延安戍將又敗之是日捷至戊子以御史中丞徒單思忠為參知政事己丑平章抹撚盡忠下獄既久監察御史許古言盡忠逮繫有司此必重罪而莫知其由甚駭衆聽乞遣公正重臣鞫之如得其實明示罪目以厭中外之心書上不報庚寅遂誅盡忠癸巳罪狀盡忠告中外詔樞密副使僕散安貞行樞密院于徐州戊戌遼東宣撫司報敗留哥之捷甲辰詔求廣平郡王承暉之後得其猶子歷亭縣丞永懷以為器物直長丙午夏人陷臨洮陝西宣撫副使完顏胡失剌被執庚戌詔尚書左丞相僕散端兼都元帥行尚書省于陝西辛亥蒙古綱奏昨被旨權山東路宣撫副使屯東平行至徐北岸北兵已逼徐不可往詔樞密副使僕散安貞權於沿河任使之壬子以同華舊屯陝西兵及河南所移步騎舊隸陝州宣撫司者改隸陝西行省召中奉大夫襲封衍聖公孔元措為太常博士上初用元措於朝或言宣聖墳廟在曲阜宜遣之奉祀既而上念元措聖人之後山東寇盜縱橫恐罹其害是使之奉祀而反絶之也故有是命遼東賊蒲鮮萬奴僭號改元天泰十一月丙辰朔河北行尚書省侯摯入見詔河北西路宣撫副使田琢自濬徙其兵屯陝戊午樞密院進王世安取盱眙楚州之策遂以世安為招撫使與泗州元帥府所遣人同往淮南計度其事戊辰夏人犯綏德之克戎寨官軍敗之犯綏平又敗之賞有功將士及來告捷者參知政事徒單思忠言今陳言者多掇拾細故乞不送省止令近侍局度其可否發遣上曰若爾是塞言路凡係國家者豈得不由尚書省乎庚午上與尚書右丞汝礪商略遣官括田賜軍之利害汝礪言不便者數端乃詔有司罷其令仍給軍糧之半其半給詣實之價壬申遣參知政事侯摯祭河神于宜村甲戌移剌塔不也以軍萬人破夏人數萬於熟羊寨丙子詔市民間挽車羸疾牝馬置羣牧中以圖滋息知臨洮府陀滿胡土門破夏人八萬於城下丁丑監察御史陳規劾參知政事侯摯上不允所言而慰答之庚辰上謂宰臣曰朕恐括地擾民罷其令矣官荒牧馬地軍戶願耕者聽己為民承種者勿敓舊例點檢左右將軍近侍局官護衛承應人秩滿皆賜匹帛雖所司為之製造然不免賦取於民近亦罷之止給寶券至於朕所服御亦以官絲付太府監織之自今勿復及民也大元兵徇彰德府知府陀滿斜烈死之十二月乙酉朔徙朔州民分屯嵐石隰吉絳解等州戊子以軍事免樞密院官朝拜己丑侯摯復行尚書省于河北庚寅太白晝見壬辰詔免元日朝賀乙未敕贈昭聖皇后三代官爵太康縣人劉全時溫東平府民李寧謀反伏誅戊戌陝西行元帥府乞益兵以田琢之衆隸之仍奬諭以詔壬寅詔林州刺史惟宏與都提控從坦同經理邊事諸將功賞次第便宜行之乙巳大元兵徇大名府癸丑皇太孫薨以殤無祭享之制戒勿勞民諭宣徽院免元日親王公主進酒甲寅禮官奏正旦宋遣使來賀不宜輟朝命舉樂服色如常儀詔臨洮路兵馬都總管陀滿胡土門進官三階再任四年春正月癸亥監察御史田䄄秀條陳五事丙寅紅襖賊犯泰安德博等州山東西路行元帥府敗之丁卯諭御史臺曰今旦視朝百官既拜之後始聞開封府報衙聲四方多故之秋弛慢如此可乎中丞福興號素謹于官事者當一詰之己巳尚書右丞高汝礪進左丞庚午大元兵收曹州辛未參知政事侯摯進尚書右丞壬申太原元帥左監軍烏古論德升招其民降北者得四千三百餘人癸酉詔賜故皇太孫諡曰冲懷更定捕獲僞造寶券者官賞乙亥以殿前都點檢皇子遂王守禮為樞密使樞密使濮王守純為平章政事己卯立遂王守禮為皇太子庚辰詔免逃戶租壬午言者請遣官劭農至秋成考其績以甄賞宰臣言民恃農以生初不待勸但寬其力勿奪其時而已遣官不過督州縣計頃畝嚴期會而已吏卒因為姦利是乃妨農何名為勸上是其言不遣二月甲申朔日有食之上不視朝詔皇太子控制樞密院事大元兵圍太原乙酉以信武將軍宣撫副使永錫簽樞密院事權尚書右丞皇太子既總樞務詔有司議典禮以金鑄撫軍之寶授太子啓禀之際用之平章政事高琪表乞致仕不允召樞密院官問所以備禦之策丁亥以河東南路宣撫使胥鼎為樞密副使權尚書左丞行省于平陽鼎方抗表求退詔勉諭就職因有是命行省左丞相僕散端先亦告老遣太醫往鎮護視其疾戊子宰臣以皇太子既立服御儀物悉與已受冊同今邊事未寧請少緩冊寶之禮從之戊戌免親王公主長春節入賀致禮己亥大元兵攻下霍山諸隘甲辰命參知政事李革為修奉太廟使禮部尚書張行信提控修奉社稷權祔肅宗神主于世祖室奉始祖以下神主于隨室祭器以瓦代銅獻官以公服行事供張等物並從簡約庚戍詔凡死節之臣籍其數立廟致祭壬子任國公瑋薨輟朝是月同知觀州軍州事張開復河間府滄獻等州並屬縣十有三表請赦旁郡脅從之臣又請以宣撫司空名宣敕二百道付之從權署補仍以糧繼其軍食詔樞密措畫三月乙卯以將修太廟遣李革奏告祖宗神主于明俊殿丁巳曲赦中都河北等路議軍戶給地事乙丑延州刺史溫撒可喜上疏言皇太子宜選正人為師保丙寅長春節宋遣使來賀己巳以將修社稷遣太子少保張行信預告滄州經略副使張文破趙福復恩州丙子曲赦遼東路己卯處士王澮以右諫議大夫復遷中奉大夫翰林學士仍賜詔褒諭庚辰復邢州捷至夏四月己丑陝西行省來報秦州官軍破妖賊趙用劉高二之捷遣官鞫單州防禦使僕散倬之罪罷其城單州之役癸巳張開奏復清州等十有一城詔遷官兩階賞將士有差甲午改賜皇太子名守緒詔諭陝西路軍民丙申河北行省侯摯言北商販粟渡河官遮糴其什八商遂不行民饑益甚請罷其令從之河南陝西蝗丁酉太白晝見于奎己亥夏人葩俄族都管汪三郎率其蕃戶來歸以千羊進詔納之優給其直辛丑侯摯言紅襖賊掠臨沂費縣之境官軍敗之獲其黨訊之知其渠賊郝定僭號署官已陷滕兗單諸州萊蕪新泰等十餘縣時道路不通宰臣請諭摯為備仍詔樞密院招捕蔡息行元帥府兵拔木陡關斬首千級甲辰有司言扶風郿縣有傷麥五月癸丑朔禮官言太廟既成行都禮雖簡約惟以親行祔享為敬請權不用鹵簿儀仗及宮縣樂舞從之山東行省上沂州之捷甲寅鳳翔及華汝等州蝗辛酉以尚書右丞侯摯行省事于東平己巳來遠鎮獲夏諜者陳岊等知夏人將圖臨洮鞏州窺長安命陝西行省嚴為之備丙子上將以七月行祔享禮慮時雨有妨詔改用十月夏人修來羌城界河橋元帥右都監完顏賽不遣兵焚之俘馘甚多戊寅京兆同華鄧裕汝亳宿泗等州蝗六月戊子詔凡進奏帖及申尚書省樞密院關應大事私發視者絞誤者減二等制書應密者如之壬辰遼西僞瀛主張致遣完顏南合張頑僧上表來歸詔授致特進行北京路元帥府事兼本路宣撫使南合同知北京兵馬總管府頑僧同知廣寧府丙申木星晝見于奎百有一日乃伏癸卯詔有司祈雨丁未河南大蝗傷稼遣官分道捕之罷河北諸路宣撫司更置經略司壬子以旱詔參知政事李革審決京師寃獄秋七月癸丑朔昭義軍節度使必蘭阿魯帶復威州及獲鹿縣飛蝗過京師甲寅山東行省檻賊郝定等至京師伏誅乙卯以旱蝗詔中外己未敕減尚食數品及後宮歲給縑帛有差辛酉監察御史陳規上章條陳八事閏月壬午朔日有食之辛卯復深州癸巳翰林學士完顏孛迭進中興事跡甲午命掌軍官舉奇才絶力之人提控都副統等官互舉其屬頒舉官賞罰格許功過相除品官及草澤人有才武者舉薦升降亦如之庚子詔河南陝西鎮防軍應廕及納粟補官者當役如舊俟事定乃聽赴銓八月甲寅太子少保兼禮部尚書張行信定祔享親祀之儀以進上嘉納之三原縣僧廣惠進僧道納粟多寡與都副威儀及監寺等格從其言鬻之夏人入安塞堡元帥左監軍烏古論慶壽遣軍敗之壬戌賜張行信寶券二萬貫重幣十端旌其議禮之當乙亥詔諭中都民命大名招撫使募人持詔以往丙子大元兵攻延安己卯夏人入結耶觜川官軍擊走之九月辛巳朔大元兵攻坊州以簽樞密院事永錫為御史大夫領兵赴陝西便宜從事壬辰大元兵攻代州經略使奧屯醜和尚戰沒以中衛尉完顏奴婢等充賀宋生日使冬十月己未親王百官奉迎祖宗神主于太廟招射生獵戶練習武藝知山徑者分屯陝虢要地命元帥左監軍必蘭阿魯帶守潼關遙授知歸德府事完顏仲元軍盧氏大元兵攻潼關西安軍節度使泥厖古蒲魯虎戰沒辛酉上親行祔享禮甲子祔享禮成赦乙丑詔諭河南官吏軍民以賞格募立功之士命參知政事徒單思忠提控鎮撫京師移剌周剌阿不屯關陝丙寅詔京師具防城器械多鑿坎穽築垣牆於隙地徙衛紹及鎬厲王家屬于京師丁卯以奉安社稷遣官預告戊辰命張行信攝太尉奉安社稷禮樂咸閷其數詔吏禮兵工四部尚書董防城之役大元兵徇汝州己巳沿河唯存通報小舟餘皆焚之庚午詔宿糧州縣屯兵其簽民為兵者就署隊長以自防遏河東行省胥鼎遣潞州元帥左監軍必蘭阿魯帶以軍一萬孟州經略使徒單百家以軍五千由便道濟河趣關陝自將平陽精兵援京師命樞府督軍應之辛未置官領招賢所事命內外官採訪有才識勇略能區畫防城者具以聞得實超任仍賞舉主內負長才不為人所知者聽赴招賢所自陳壬申以龍處衛上將軍裴滿羊哥知歸德府事行樞密院事癸酉詔罷遣有司所拘民間輸稅車牛以運軍士衣糧者甲戌諭附京民盡徙其芻糧入城官儲併運之丙子行樞密院知河南府事完顏合打以徵兵失應坐誅戶部郎中魏琦以沒王事官其子己卯議禁京師靡穀近侍以寶券方行恐滯其用不果吏部令史韓希祖陳言曾以戰功致身者盡拘京師備用從之十一月庚辰朔增定守禦官及軍人遷賞格辛巳詔止附京農民自撤其廬舍壬午河東行省胥鼎入援京師用其言以知平陽府王質權元帥左監軍同知完顏僧家奴權右監軍代鎮河東拜鼎為尚書左丞兼樞密副使知歸德府完顏伯嘉簽樞密院事以完顏合打伏誅詔中外乙酉元帥右都監完顏賽不來獻其提控石盞合喜楊斡烈等大敗夏人于定西之捷命行省視其功賞之大元兵至澠池右副元帥蒲察阿里不孫軍潰而逃失其所佩虎符丙戌前臨潢府推官權元帥右監軍完顏合達率官軍老幼自北歸國升鎮南軍節度使進官三階詔出公帑綿絹付有司償所括民服以衣軍者是夕月暈木星木在奎月在壁己丑定毀防城器具法辛卯詔立功五品以上官賜饌御前六品以下官賜饌近侍局癸巳上諭皇太子京城提控官有以文資充者彼豈知兵其速易之甲午放免諸職官傔從及諸司局射糧兵卒嘗選充軍者戊戌敕諸州縣簽籍軍民以備土寇華州元帥府復潼關庚子罷在京防城民軍遣御史陳規等充河南宣差安撫捕盜官河南路統軍使紇石烈掃合以發兵後期坐誅甲辰以尚書工部侍郎和尚等充賀宋正旦使丙午河南行樞密院從坦言其族人道哥願隸行伍以自效上嘉其忠許之內族承立進所獲馬駝上曰此軍士所得即以豫之可也朕安用哉因遍諭諸道將帥後勿復如是十二月辛亥平章政事术虎高琪加崇進尚書右丞相參知政事李革罷癸亥大元兵攻平陽丙寅皇太子議伐西夏大元兵徇大名府壬申大元兵進自代州神仙橫城及平定承天鎮諸隘攻太原府宣撫使烏古論禮遣人間道齎礬書至京師告急詔發潞州元帥府平陽河中絳孟宣撫司兵援之乙亥高琪請修南京𩹉城上曰民力已困此役一興病滋甚矣城雖完固朕亦何能獨安此乎
