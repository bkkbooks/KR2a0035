body:
  text: 金史卷三十二志第十三禮五上尊諡天會三年六月諳班勃極烈杲等表請追冊先大聖皇帝十二月二十五日奉玉冊玉寶恭上尊諡曰大聖武元皇帝廟號太祖天會十三年三月七日遣攝太尉皇叔祖大司空昱奉玉冊玉寶上尊諡曰文烈皇帝廟號太宗九月追諡皇考曰景宣皇帝廟號徽宗十四年八月庚戌文武百僚太師宗磐等上議曰國家肇造區夏四征弗庭太祖武元皇帝受命撥亂光啓大業太宗文烈皇帝繼志卒伐奮張皇威原其積德纍功所由來者遠矣且禮多為貴固前籍之美談德厚流光實本朝之先務伏惟皇九代祖廓君人之量挺御世之姿虞舜生馮遷於負夏太王避狄邑此岐山聖姥來歸天原肇發皇八代祖皇七代祖承家襲慶裕後垂芳不求赫赫之名終大振振之族皇六代祖徙居得吉播種是勤去暴露獲棟宇之安釋負載興車輿之利皇五代祖孛堇雄姿邁世美略濟時成百里日辟之功戎車既飾著五教在寬之訓人紀肇修皇高祖太師質自天成德為民望兼精騎射往無不摧始置官師歸者蓋衆皇曾祖太師威稜震遠機警絶人雅善運籌未嘗襟甲臨敵愈奮應變若神皇曾叔祖太師機獨運心公無私物四方聳動諸部歸懷德威兩隆風俗大定皇伯祖太師友于盡愛國爾惟忠謀必罔愆舉無不濟纍代祖妣婦道警戒王業艱難俱殫內助之勞實著始基之漸是宜采羣臣之僉議酌故事以遵行款帝于郊稱天以誄謹按諡法布義行剛曰景主義行德曰元保民耆艾曰明溫柔聖善曰懿請上皇九代祖尊諡曰景元皇帝廟號始祖妣曰明懿皇后中和純備曰德道德純一曰思請上皇八代祖尊諡曰德皇帝妣曰思皇后好和不爭曰安好廉自克曰節請上皇七代祖尊諡曰安皇帝妣曰節皇后安民治古曰定明德有勞曰昭尊賢讓善曰恭柔德好衆曰靖請上皇六代祖尊諡曰定昭皇帝廟號獻祖妣曰恭靖皇后愛民立政曰成辟土有德曰襄強毅執正曰威慈仁和民曰順請上皇五代祖孛堇尊諡曰成襄皇帝廟號昭祖妣曰威順皇后愛民好與曰惠辟土兼國曰桓明德有勞曰昭執心決斷曰肅請上皇高祖太師尊諡曰惠桓皇帝廟號景祖妣曰昭肅皇后大而化之曰聖剛德克就曰肅思慮深遠曰翼一德不懈曰簡請上皇曾祖太師尊諡曰聖肅皇帝廟號世祖妣曰翼簡皇后申情見貌曰穆博聞多能曰憲柔德好衆曰靜聖善周聞曰宣請上皇曾叔祖太師尊諡曰穆憲皇帝廟號肅宗妣曰靜宣皇后慈愛忘勞曰孝執事有制曰平清白守節曰貞愛民好與曰惠請上皇曾叔祖太師尊諡曰孝平皇帝廟號穆宗妣曰貞惠皇后愛民長悌曰恭一德不懈曰簡夙夜共事曰敬小心畏忌曰僖請上皇伯祖太師尊諡曰恭簡皇帝廟號康宗妣曰敬僖皇后仍請以始祖景元皇帝景祖惠桓皇帝世祖聖肅皇帝太祖武元皇帝太宗文烈皇帝為永永不祧之廟須廟室告成涓日備物奉上寶冊藏于天府施之罔極丙辰奉上九代祖妣尊諡廟號是日百僚上表稱賀皇統五年增上太祖尊諡禮官議自古辨祀以南北郊太社太稷太廟為序若太廟神主造畢即合題尊諡擇日奉安恐在郊社之前於禮未倫候築郊兆畢擇日奏告昊天上帝皇地祇次奉安社稷神主及奏告其次恭造太廟神主題號奉安入室以此為序元奉敕旨候到上京行禮不見元奏目內有無指定候修建太廟奉安神主以後行禮或只於慶元宮奉上諡號若候奉安太廟神主禮畢方奉上諡號冊寶即百官並合法服兼於皇帝所御殿合立黃麾仗及殿中省細仗太廟殿前亦合立黃麾仗其冊寶在路亦合量設儀仗若太廟未奉安只於慶元宮上冊寶即行事及立班官並用常服及依例量用大小旗甲騎門仗官供奉官引從冊寶綵服若奉安後發冊即御服通天冠絳紗袍若只就慶元宮即幞頭紅袍並慶元宮上冊寶即將來題太廟本室神主便可用新諡若於太廟先奉安神主即先題舊諡及至就本室上冊寶又須改題新諡有兩節不同五月九日擬奏告於太廟上冊寶竊慮法物樂舞難辦只於慶元宮上冊寶從之十月三日奉上尊諡冊寶儀前期有司供張辰居殿神御牀案少府監鈎盾署設燎薪于殿庭西南掘坎於其側儀鸞司設小次于辰居殿下東廂又設冊寶幄殿于景輝門外東仗舍殿前司宣徽院量差甲騎大小旗鼓門仗官香輿自製造冊寶所迎奉冊寶奉安于幄殿行事官製造官皆騎馬引從門下中書侍郎在前侍中中書令在後大禮使又在其後舉舁奉冊寶官製造官分左右夾侍以北為上皆給人從錦帽衫帶是日未明翰林使大官令丞鋪設香案酒果供具牲體膳羞於神御前儀鸞司設皇帝拜褥四一在阼階上面西一在香案南面北一在殿上東欄子內面西一在燎薪之東面西設黃道自小次至阼階褥位質明有司備常行儀仗駕頭扇筤常朝官常服騎馬執鞭前導以北為上造冊寶官排辦管勾官常服於慶元宮門外立班迎駕再拜皇帝自宮中服靴袍御馬至景暉門外下馬步入小次少頃御史臺催班大禮使行事官自幄殿奉冊寶入正門置于辰居殿西階下大禮使歸押班位閣門使奏班齊太常卿奏請皇帝行奉上冊寶之禮宣徽使太常卿分引前導皇帝由黃道升阼階上面西褥位立贊請再拜閣門使臚傳在位官皆再拜乃引皇帝由殿上正門入殿於香案前褥位再拜上香又再拜退稍東於欄子內面西褥位立定儀鸞司徹香案前拜褥設冊寶褥位於香案南舉冊舁冊官取冊匣于牀對捧由西階升中書侍郎分左右前導奉冊中書令讀冊中書令並後從候於褥位置定奉冊中書令於褥位南再拜退就殿階上西南柱外面東立讀冊官中書令稍前再拜舁冊官取匣蓋下置于西階下冊牀舉冊官對舉冊讀冊官中書令一拜起跪搢笏讀冊文曰孝孫嗣皇帝臣某謹拜手稽首奉玉冊玉寶恭上尊諡曰應乾興運昭德定功睿神莊孝仁明大聖武元皇帝讀冊畢就拜興又再拜退立于奉冊中書令之次奉冊官進與中書侍郎率舉冊舁冊官奉冊匣由西階下引從如上儀復置于冊牀置定舉寶官以寶盝進至侍中讀畢由西階下復置于牀皆如冊匣之儀有司徹冊寶褥位復設香案南拜褥宣徽使太常卿導皇帝進就褥位再拜上香茶酒樂作三酹酒樂止太祝讀祝文訖皇帝再拜復歸阼階褥位立定大禮使升殿於香案南宣徽使處授福酒臺盞行至皇帝阼階褥位前宣徽使贊皇帝再拜飲福閣門臚傳賜胙再拜應在位官皆再拜大禮使跪以酒盞進授皇帝樂作飲訖又再拜大禮使受酒盞復以授宣徽使訖由西階下歸押班位太祝奉祝版翰林使酌酒太官令丞量取牲羞自西階下置于燎薪之上文武班皆回班向燎所立禮官贊請皇帝就望燎位宣徽使取酒盞臺于翰林使以進授皇帝皇帝酹酒于燎薪之上執事者舉燎半燎瘞于坎宣徽使贊皇帝再拜閣門喝百官皆再拜太常卿宣徽使前導皇帝歸小次即御座簾降太常卿俯伏興跪奏太常卿臣某言禮畢百官皆卷班西出大禮使以下奉冊寶牀納于慶元宮收掌去處皇帝進膳于別殿侍食官取旨有司轉仗由來路皇帝便服還內教坊作樂前導次日大禮使率百官稱賀是歲閏十一月增上祖宗尊諡始祖景元皇帝曰懿憲景元皇帝德皇帝曰淵穆玄德皇帝安皇帝曰和靖慶安皇帝獻祖定昭皇帝曰純烈定昭皇帝昭祖成襄皇帝曰武惠成襄皇帝景祖惠桓皇帝曰英烈惠桓皇帝世祖聖肅皇帝曰神武聖肅皇帝肅宗穆憲皇帝曰明睿穆憲皇帝穆宗孝平皇帝曰章順孝平皇帝康宗恭簡皇帝曰獻敏恭簡皇帝太宗文烈皇帝曰體元應運世德昭功哲惠仁聖文烈皇帝徽宗景宣皇帝曰允恭克讓孝德玄功佑聖景宣皇帝已上廟號如故十二月一日奏告如儀大定三年增上睿宗尊諡先是元年十一月十六日追冊皇考曰簡肅皇帝廟號睿宗皇妣蒲察氏欽慈皇后皇妣李氏貞懿皇后二年八月一日有司奏祖宗諡號或十六字或十四字或十二字即今睿宗皇帝更合增上尊諡於升祔前奉冊寶制可十七日左平章元宜等奏請增上尊諡曰睿宗立德顯仁啓聖廣運文武簡肅皇帝有司奏睿宗皇帝未經升祔合無於衍慶宮聖武殿設神御牀案奉旨崇聖閣借設正位又奏皇帝親授冊寶太尉行事制可九月二十二日奏告太廟二十八日大安殿置大樂閲習前一日自衍慶宮奉迎冊寶於大安殿安置授冊日未明三刻有司各勒所部整肅儀衛羣臣集于殿門行事官各法服陪位官公服皇帝自宮中常服乘輿侍衛如儀赴大安殿後更衣幄次御史臺催班通事舍人引太尉及羣臣就位侍中跪奏中嚴少頃又跪奏外辦皇帝服通天冠絳紗袍出太常卿跪奏稱太常卿臣某言請皇帝行奉上冊寶之禮奏訖俯伏興宣徽使分左右前導皇帝步詣冊寶幄次將至幄次登歌樂作至幄次前北向宣徽使贊請皇帝再拜典儀贊在位官再拜拜訖奏請皇帝搢圭三上香訖執圭奏請皇帝再拜典儀贊在位官再拜訖各分班東西序立奏請皇帝詣稍東褥位樂止中書令中書侍郎奉引冊侍中門下侍郎奉引寶行登歌樂作宣徽使贊導皇帝隨冊寶降自西階登歌樂止宮縣樂作至大安殿下當中褥位中書令侍中奉冊寶於皇帝褥位之西樂止宣徽使奏請皇帝再拜典儀贊在位官皆再拜拜訖中書令搢笏奉冊匣宮縣樂作至皇帝褥位前俯伏跪奉置訖執笏俯伏興退稍西立東向太常博士引太尉至褥位北向立宣徽使奏請皇帝搢圭跪捧冊匣授太尉太尉搢笏跪受訖執笏少東立宣徽使奏請執圭俯伏興舁冊官捧冊匣中書侍郎奉冊匣置於冊牀樂止侍中搢笏奉寶盝宮縣樂作至皇帝褥位前俯伏跪奉置訖執笏俯伏興退稍西立東向太常博士引太尉至褥位北向立宣徽使奉皇帝搢圭跪捧寶盝授太尉太尉搢笏跪受訖執笏少東立宣徽使奏請執圭俯伏興舁寶官捧寶盝門下侍郎奉置於寶牀樂止宣徽使奏皇帝再拜典儀贊在位官再拜皇帝南向立宮縣樂作太常博士引太尉奉冊寶出主節者持節前導冊牀在前寶牀次之樂止中書門下侍郎各導於冊寶之前太尉居其後至大安門外太尉以次跪奉冊寶於玉輅中中書侍郎於輅旁夾侍所司迎衛如式太尉奉冊寶訖步出通天門外革車用本品鹵簿導從如儀鼓吹不振作俟冊寶出大安門太常卿跪奏稱太常卿臣某言禮畢奏訖俯伏興前導皇帝升自東階登歌樂作還大安殿後幄次樂止侍中跪奏解嚴乘輿還內侍衛如來儀十月一日攝太尉特進平章政事兼太子太師定國公臣完顏宗憲率百官赴衍慶宮行禮前一日設冊寶幄次於聖武殿門外西向其日質明太常寺官率所屬於聖武殿設神御牀案宣徽院排備茶酒果時饌茶食香花等並如太祖皇帝忌辰供備之數大樂署設登歌之樂於殿上前楹間稍南北向迎衛冊寶至衍慶宮門外中書門下侍郎各奉冊寶降輅各置於牀太尉至門外降車率中書令以下導從赴聖武殿門外幄次奉安如式其儀仗兵士並退次引文武百官各服其服以次就位大樂令率工人就位禮直官亦先就位應執事者並先入殿庭北向立禮直官贊再拜訖升殿次引太尉就東階下褥位西向立禮直官贊拜在位官俱再拜禮直官曰有司謹具請行事禮直官贊拜在位官俱再拜訖引太尉詣罍洗盥手升殿詣神座前搢笏跪三上香樂作奠茶奠酒訖執笏俯伏興樂止太尉再拜訖還位少立次引太尉出率中書門下侍郎等奉冊寶牀入自殿門中書令侍中等並導從登歌樂作冊寶牀至殿庭列於西階之下承以席褥樂止太尉以下各就面北褥位立定禮直官贊拜在位官俱再拜訖太尉率中書令侍郎奉冊匣升殿登歌樂作至殿上冊匣置於食案之前仍設褥位樂止次引太尉詣神位前俯伏跪稱攝太尉臣