body:
  text: 金史卷十六本紀第十六宣宗下四年春正月壬辰朔詔免朝丙申金安軍節度使行元帥府事古里甲石倫除名丁酉大元兵下好義堡霍州刺史移剌阿里合等死之詔贈官有差庚戌宋步騎十餘萬圍鄧州聞援軍至夜焚營去招撫副使术虎移剌答追及之奪其俘還壬子晝晦有頃大雷電雨以風癸丑戶部侍郎張師魯上書請遣騎兵數千及春淮蜀並進以撓宋丙辰以武仙遙領中京留守進官一階三月辛丑議遷睢州治書侍御史蒲魯虎奉詔相視京東城池還言勿遷便乃止癸卯長春節詔免朝乙巳林州元帥惟良擒叛人單仲李俊誅之降其黨盧廣己酉以吏部尚書李復亨參知政事南京兵馬使术甲賽也行懷孟帥府事辛亥進平章政事高汝礪為尚書右丞相監修國史封壽國公參知政事李復亨兼修國史平章政事陝西行尚書省胥鼎進封溫國公致仕壬子紅襖賊于忙兒襲據海州經略使完顏陳兒以兵擊敗忙兒復取之甲寅木星犯鬼宿積尸氣夏四月庚申朔詔御史中丞完顏伯嘉提控防城事癸亥安武軍節度使柴茂破紅襖賊于棗強祁州經略使段增順破叛賊甄全于唐縣夏人犯邊元帥石盞合喜破之乙丑以彰德衛輝滑濬諸州隸河南路轉運司以河南路轉運司為都轉運視中都增置官吏戊辰禘于太廟大元遣趙瑞以兵攻孟州提控魯德王安復大名府以參知政事把胡魯權尚書右丞左副元帥元帥左都監承立為右監軍權參知政事同行尚書省元帥府于京兆庚辰東平元帥府總領提控蒲察山兒破紅襖賊于聊城壬午命六部檢法以法狀親白部官聽其面議大理寺如之五月壬辰定二品至三品立功遷官格癸巳紅襖賊寇樂陵鹽山橫海軍節度使王福連擊敗之張聚來寇又敗之甲午上擊鞠于臨武殿丙申以時暑免常朝四日一奏事丁酉諭工部暑月停工役癸卯大元兵徇隩州丙辰大元兵徇兗州泰定軍節度使兀顏畏可死之六月丙寅遣人招張柔丁卯詔減監察御史四員戊辰山東民僑居者募壯士五百人益東莒公燕寧軍月犯土星己巳太白晝見于張百八十有四日乃伏甲戌制諸倉場庫院巡護軍受提舉倉場司及監支納官彈壓京畿不雨敕有司閲獄雜犯死罪以下皆釋之丁丑大元遣楊在攻下大名又攻開州及東明長垣等縣己卯祈雨庚辰宋人方子欣來歸有司處之鄭州上曰吾民奔宋者彼例衣食之彼來歸者不善視之或復逃歸漏泄機事命增子欣廩給有司優遇之元帥右監軍權參知政事承立上封事秋七月辛卯宋人及紅襖賊犯河朔諸郡皆降獨滄州經略使王福固守會益都賊張林來攻福乃叛降林帥府請討之是日雨癸丑林州行元帥府遣總領嚴祿等討紅襖賊于彰德府生擒偽安撫使王九詔參知政事李復亨為宣慰使御史中丞完顏伯嘉副之循行郡縣劭農以烏古論仲端等使大元八月戊午朔嚴實成江王贇據濟南山東招撫高居實遣人招嚴實于青崖寨獲其款以聞李全犯東平府監軍王庭玉敗之擒其偽安化軍節度使張林庚申高陽公張甫請增兵守冀州上諭樞密潁州民渡淮為宋軍者凡十村可追索主者懲一二以誡其餘庚午敕掌兵官不聽舉縣令夏人陷會州刺史烏古論世顯降甲戌陝西行省報龕谷敗夏人之捷乙亥上諭宰臣河南水災唐鄧尤甚其被災州縣已除其租餘順成之方止責正供和糴雜徵並免仍自今歲九月始停周歲桑皮故紙折輸流民佃荒田者如上優免丙子陝西行省與夏人議和戊寅定選補親軍法己卯罷葭州招撫司壬午陝西路行省承裔報定西州之捷丙戌以隨路諸軍戶徙河南京東西南路各設檢察使副山公武仙降大元九月戊子詔遣官于河南陝西選親軍辛卯進章宗實録戊戌大元木華里屯軍真定置總領元帥府于歸德以壽州陳留兩鎮兵屬之庚子夏人入定西州壬寅宋人屯皂郊堡行軍提控完顏益都擊敗之大元遣塔忽等來癸卯夏人來侵甲辰滕州招捕提控夏義勇討紅襖賊敗之乙巳詔參知政事李復亨提控芻糧事己酉夏人陷西寧州尚書省都事僕散奴失不坐誅駙馬都尉徒單壽春奪官一階杖六十癸丑更定安泊逃亡出征軍人罪及捕獲賞格甲寅宋人出秦州及夏人來侵丙辰鞏州行元帥府事石盞合喜報定西州之捷冬十月壬戌大元遣蒙古塔忽訛里剌等來己卯陝西東路行省報綏德州之捷泗州元帥府言紅襖賊一月四入寇掠人畜而去庚辰上擊鞠于臨武殿辛巳授紅襖賊時青滕陽公本處兵馬總領元帥兼宣撫癸未京西山寨各設守禦使副令本路帥府總之諭陝西行省圖復會州上擊鞠于臨武殿十一月丁亥朔免越王永功朔望朝參易水公靖安民為其下所殺戊子黃陵缸經略使烏古論石虎等以戰陳失律伏誅壬辰木星晝見于翼積六十有七日伏夜又犯靈臺北第一星甲午河南水遣官勸課更浮山縣名忠孝戊戌詔復衛紹王王爵仍加開府儀同三司壬寅山東東路軍戶徙許州命行東平總管府治之判官一人分司臨潁乙巳詔柴茂權元帥左都監蓋仁貴攝右都監同行元帥府于真定是月大元木華里國王以兵圍東平十二月甲戌祈雪禮部郎中權左司諫抹撚胡魯剌上封事戊寅詔軍官許月擊鞠者三次以習武事庚辰臘享于太廟乙酉鎮南軍節度使溫迪罕思敬上書言錢幣稅賦二事五年春正月丙戌朔免朝丁亥世宗忌日謁奠于啓慶宮戊子括南京諸州逋戶舊耕官田給軍戶壬辰議禦西夏及征南事諭皇太子以東平禦敵方略甲午諭樞密院南伐事重當詳議其便撰故衛王事迹如海陵庶人例丁酉大元兵攻天井關戊戌宋人襲泗州西城提控王祿死之辛丑太白晝見于牛二百三十有二日伏乙巳詔諸道兵集蔡州己酉伐宋庚戌山東行省報東平之捷二月丙辰朔置招撫司于單州曲赦東平府庚申下詔伐宋以內族惟弼權同簽樞密院事行院于中京斡勒合打權元帥府右都監行元帥府于蔡息納合降福權簽樞密院事行院于宿州孛术魯達阿權元帥右都監完顏訛論副右都監行元帥府于唐鄧戊辰罷懷州行元帥府復置招撫司與孟州經略司並受中京行樞密院節制辛未僕散安貞以兵出息州破宋人于淨居山寺拔黃土關癸酉以旱災曲赦河南路丙子禁京城兵器元帥紇石烈牙吾塔破宋兵復泗州進逼濠州至渦口乏糧而還西城癸未以旱災詔中外三月丙戌朔上御仁安殿祈雨仍望祭于北郊庚寅宋人圍唐鄧行元帥府事完顏訛論力戰却之前鄧州千戶孛术魯毛良虎自拔歸國訛論便宜遷其官三階授同知唐州事乞正授以示信從之乙未罷河南路行三司丙申參知政事徒單思忠進尚書右丞兼修國史以太子詹事僕散毅夫為參知政事諭宰臣曰今奉御奉職多不留心采訪外事聞章宗時近侍人秩滿以所采事定升降今亦宜預為考核之法以激勸之戊戌長春節免朝己亥夏因叛人竇趙兒之招入據來羌城孛术魯合住以重賞誘脅從人為內應督兵急攻城拔之省試經義進士考官於常額外多放喬松等十餘人有司奏請駁放上已允尋復遣諭松等曰汝等中選而復黜不能無動于心方今久旱恐傷和氣今特恩放汝矣庚子賜林州行元帥府經歷官康琚進士及第琚以武階乞赴廷試故有是命丙午以旱築壇祀雷雨師壬子雨四月己未山東行省蒙古綱言東莒公燕寧戰敗而死寧所居天勝寨據險寧亡衆無所歸變在朝夕權署其提控孫邦佐為招撫使黃摑兀也為總領以撫其衆遣使請命敕有司議之辛酉禱雨于太廟丙寅僕散安貞破宋黃蘄等州壬申俘宋宗室男女七十餘口獻于京師癸酉詔親軍中武舉第而授職需次者仍執舊役廩給循常闕至發遣辛巳監察御史劉從益以彈劾失當奪官一階罷之詔定進士中下甲及監官散階至明威者舉充縣令法五月甲申朔日有食之戊戌宋人據楚丘官軍復之庚子納蘭記僧伏誅告人趙鋭升職四等壬寅陝西元帥完顏賽不遣使來獻晉安平陽之捷方議其賞御史烏古論胡魯劾其縱將士鹵掠不副主上除亂救民之意乞正其罪上以賽不有功詔勿問賞議亦寢癸卯唐州守將訛論為元帥賽不猶子與宋人戰唐州境上為宋人所敗死者七百餘人匿之而以捷聞御史納蘭發其事上以賽不故亦不之罪而以是意諭之乃稱納蘭敢言録其功付有司秩滿考最癸丑東平內徙命蒙古綱行省于邳州王庭玉行帥府于黃陵缸六月甲寅朔尚書省奏駙馬都尉安貞反狀上閲奏慮其不實謂平章政事英王守純曰國家誅一大臣必合天下後世公議其令覆按之乙丑遣使諭晉陽公郭文振上黨公完顏開各守疆土同心濟難毋以細故啓釁端誤國事戊寅僕散安貞坐謀反並其三子皆伏誅己卯越王永功薨庚辰輟朝壬午上親奠于殯所秋七月己亥義勇軍叛據碭山縣庚子詔增給徐州清口等處戍兵衣糧己酉碭山賊夜襲永城縣行軍副總領高琬敗之命蒙古綱併力討捕辛亥單州招撫劉瓊乞移河南糧濟其軍詔給之八月壬子朔罷黃陵缸招撫司上諭尚書省碭山叛軍家屬囚歸德旬餘不給糧恐傷其生宰臣奏已給之矣又諭樞密河北艱食民欲南來者日益多速令渡之毋致殍死癸亥林懷帥府邀擊紅襖賊于伏恩村敗之甲子詔南征潰軍復歸而能力戰者依出界立功格賞之乙丑宋人掠沈丘殺縣令甲戌命有司除逋戶負租毋徵見戶九月甲申以京東歲飢多盜遣御史大夫紇石烈胡失門為宣慰使往撫安之更定監察御史違犯的決法丁亥詔州府及軍官捕盜慢職四品以下宣慰使決之三品以上奏裁戊子增授隰州招撫使軒成官改受陝西省節制乙巳崇進駙馬都尉定國公徒單公弼薨庚戌歲星犯左執法右丞相高汝礪表乞致仕詔溫留之冬十月癸丑進汝礪官榮祿大夫命僕散毅夫行尚書省于京東督諸軍芻糧乙卯太醫侯濟張子英治皇孫疾用藥瞑眩皇孫不能任遂不療罪當死上曰濟等所犯誠宜死然在諸叔及弟兄之子便應準法行之以朕孫故殺人所不忍也命杖七十除名尚書省言司縣官貪暴不法部民逃亡既有決罰他縣停匿亦宜定罪隨處土民久困徭役客戶販鬻坐獲厚利官無所斂亦宜稍及客戶以寬土民行院帥府幕職雖無部衆亦嘗贊畫戎功而推賞止進官一階宜聽主將保奏第功行賞上皆從其請戊午遣親軍討河南羣盜辛酉大元兵攻綏德州壬戌夏人復侵龕谷甲子敕監察所彈事同列不可預聞著為令丁卯夏人犯定西積石之境戊寅分京畿戍卒萬二千河中民兵八千以許州元帥紇石烈鶴壽將之屯潼關西十一月癸未陝西東路行省報安塞堡敗夏人之捷甲申諭太府減損食品庚寅募民興南陽水田壬辰太子親王百官表賀安塞堡之捷却之乙未夏人攻龕谷宋人攻蘄縣紅襖賊掠宿州辛丑詔蠲徐邳宿泗等州逋租官民有能墾闢間田除來年科徵歸德亳壽潁停閣逋戶租外仍蠲三之一逋戶田廬有司募民承業禁其毀損以俟來復蒲城縣民李文秀等謀反伏誅壬寅宋人焚潁州執防禦判官而去是日相國寺火大元兵攻延安十二月辛亥朔以大元兵下潼關京兆詔省院議之壬子罷辟舉縣令法丁巳禮部侍郎烏古孫仲端翰林待制安庭珍使北還各遷一階庚申罷河南義軍丁卯詔罷新簽民軍減樞密院掌兵官及京城戍兵仍諭行院帥府毋擅增設補簽辛未罷行總管府及招討統軍檢察等司定宋人來歸賞格及詐誘征防軍人逃亡罪法癸酉元帥合達買住及其將士以延安功特賞賚之仍下詔奬諭閏月辛巳朔大元兵徇鄜州保大軍節度使完顏六斤權元帥左都監紇石烈鶴壽右都監蒲察婁室遙授金安軍節度使女奚烈資祿皆死之乙酉提控术甲咬住破沈丘賊于陳瓦丙戌頒詔撫諭河南土寇戊子熒惑犯軒轅己丑孫瑀及捕盜官吾古出招降泰和縣賊二千人詔斬其首惡餘皆釋之同知保靜軍節度使郭澍以徵糧失期誣殺平民坐誅辛卯官軍復葭州癸巳通遠軍節度使孛术魯合住削官甲午月犯熒惑丙申紅襖賊夜入蒙城縣縣官失其符印軍民死者甚衆賊大掠而去戊戌鎮星晝見于軫己亥發兵捕京東盜太白晝見于室壬寅發上林署粟賑貧民陳亳等州鹿邑城父諸縣盜𧔧起趣樞府遣官討之捕盜軍所過殘民遣御史一人按視軍所獲牛有司以官錢收贖戊申詔定招捕土寇官賞格己酉更造興定寶泉每一貫當通寶四百貫元光元年春正月庚戌朔免朝辛亥世宗忌辰謁奠于啓慶宮元帥惟弼破紅襖賊于張鶱店壬子遣官墾種京東西南三路水田甲寅禁非邊關急速事無馳傳即濫乘者州縣徑白省部四方館從御史臺外路從分按御史治之詔陝西西路行省徙京兆者兵退還治平涼坊州刺史把移失剌以棄城伏誅鄭州防禦使裴滿羊哥同知防禦使古里甲石倫除名平西節度使把古咬住奪官一階丁卯詔撫諭京東百姓二月壬午詔徙中京唐鄧商虢許陝等州屯軍及諸軍家屬赴京兆同華就糧屯乙酉陝西西路行省請以厚賞募河西諸蕃部族寺僧圖復大通城命行省樞密院籌之癸巳上諭宰臣宋人以重兵攻平輿褒信我師力戰却之又偵知其事狀之詳若俟帥府上功推賞豈急於勸奬之道其遣清望官齎空名宣敕核實給之乙未詔諭河南陝西大元兵屯葭州壬寅權定行省樞府元帥府輒杖左右司經歷司官罪法甲辰上念鄜延被兵又延安受圍嘗發民粟給軍詔除延安鄜坊丹葭綏德稅租仍令有司償其粟直不足者許補官戊申州軍變萬戶呼延棫等千餘人殺掠城中焚廬舍而去己酉遣元帥左監軍訛可行元帥府事節制三路軍馬伐宋同簽樞密院事時全行院事副之三月辛酉宋人掠確山縣之劉村丙寅歲星犯太微左執法戊辰樞密院委差官賈天安上書言利害壬申尚書右丞徒單思忠以病馬輸官冒取高價御史劾之有司以監主自盜論死上顧惜大體降授陳州防禦使癸酉提控李師林敗夏人于永木嶺郭文振表近得俘者言南北合兵將攻河南陝西詔樞密備禦夏四月辛巳以金吾衛上將軍勸農使訛可簽樞密院事置大司農司設大司農卿少卿丞京東西南三路置行司並兼採訪事壬午大元兵攻陵川縣丁酉林懷路行元帥府事惟良削官兩階罷之更定辟舉縣令之法而復行之戊戌籍丁憂待闕追殿等官備防秋丁未行樞密院報淮南之捷五月戊申朔大元兵屯隰吉翼等州壬戌訛可時全軍大敗甲子訛可以敗績當死上面數而責之勉其後效命朘官兩階丁卯召致政胥鼎等赴省議利害壬申時全伏誅六月戊寅朔造舟運陝西糧由大慶關渡抵湖城癸未大赦陳州防禦使呂子羽坐乏軍興自盡制諸監官及八品以下職事丁憂待闕任滿遙授者試補侍衛親軍命各路司農司設捕盜方略丁酉紅襖賊掠柳子鎮驅百姓及驛馬而去提控張瑀追擊奪所掠還偽監軍王二據黎陽縣提控王泉討之復其城秋七月庚戌大元將按察兒以其衆屯晉安冀州之境丙辰上黨公完顏開復澤州己未歸德行樞密院王庭玉報曹州破紅襖賊之捷庚申定監當官選法河北羣盜犯封丘開封界令樞密院禦捕甲子京東總帥紇石烈牙吾塔請自今行院帥府幕職有過得自決之不允戊辰紅襖賊襲徐州之十八里寨又襲古城桃園官軍破之乙亥太白晝見經天與日爭光八月丁丑定西征將士官賞有差己卯彗星見西方甲申增定藏匿逃亡親軍罪及告捕賞格積石州蕃族叛附于夏鞏州提控尼厖古三郎討之獲羊千口進尚膳詔却之以彗星見改元大赦諭旨宰臣曰赦書已頒時刻之間人命所係其令將命者速往計期而至以大司農把胡魯為參知政事癸巳河間公移剌衆家奴高陽公張甫兵復河間府是日報捷者始達上以道途梗塞報者艱虞命厚賞之夏人入德順壬寅祈雨九月丙午朔以左右警巡使兼彈壓諭陝西行省備邊壬子牙吾塔請以兵由壽州渡淮搗宋人巢穴不從乙卯議經略淮南己巳宋人掠遂平縣之石寨店復侵南陽唐州提控夾谷九住敗之冬十月丁丑夏人掠德順之神林堡壬午宋張惠攻零子鎮為斡魯𩽆所敗虜其裨將二人河中府萬戶孫仲威執其安撫使阿不罕胡魯剌據城叛陝西行省遣將討平之癸未復曹州甲申上獵于近郊詔免百官送迎且勿令治道以勞百姓庚寅徙彰德招撫使杜先軍於衛州乙未大元兵下榮州之胡壁堡及臨晉庚子詔所司巡護避兵民資産甲辰以京兆官民避兵南山者多至百萬詔兼同知府事完顏霆等安撫其衆十一月丁未大元兵徇同州定國軍節度使李復亨同知定國軍節度使訛可皆自盡甲寅京東總帥牙吾塔報臨淮破宋兵之捷戊辰大元蒙古蒲花攻鳳翔府十二月乙亥朔上謂皇太子曰吾嘗夜思天下事必索燭以記明而即行汝亦當然以河中治中侯小叔權元帥右都監便宜行事乙酉遷同知平陽府事史詠龍虎衛上將軍賜號守節忠臣權行平陽公府事丁亥疊州總管青宜可卒特命其子角襲職詔諭近侍局官曰奉御奉職皆少年不知書朕憶曩時置説書人日為講論自古君臣父子之教使知所以事上者其復置己丑蘭州提控唐括昉敗夏人于質孤堡大元以大軍攻鳳翔二年春正月甲辰朔詔免朝賀乙巳世宗忌日謁奠于啓慶宮右丞相汝礪乞致政上面諭使留大元兵下河中府權元帥右都監侯小叔復之壬子壽州防禦使完顏乃剌奪官四階甲寅上諭宰臣曰向有人言便宜事卿等屢奏乞作中旨行之帝王從諫足矣豈可掠人之美以為己出哉戊午四方館使李瘸驢以罪罷宰臣請以散地羈縻之上曰此輩豪傑正須誠待若以術制適使自疑但不畀軍政外補何害授瘸驢州刺史又謂鬻爵恩例有丁憂官得起復者是教人以不孝也何為著此令哉丁卯大元兵復下河中府二月甲戌朔皇后生辰詔免賀禮己卯丞相汝礪朝會免拜設榻殿下久立賜休壬午詔軍官犯罪舊制更不任用今多故之秋人才難得朕欲除大罪外徒刑追配有武藝善掌兵者量才復用其令尚書省議以聞丁亥大赦己亥鳳翔圍解石盞合喜加金紫光祿大夫升左監軍特授大名府海谷忽申猛安完顏仲元加光祿大夫升右監軍特授河北東路洮委必剌猛安各賜金鞶帶有差三月甲辰朔宋人襲汝陽壬子誡諭平章英王守純崇飲癸丑以河中府推官籍阿外權元帥右都監代領侯小叔軍甲寅上謂宰臣人有才堪任事其心不正者終不足貴丞相汝礪對曰其心不正而濟之以才所謂虎而翼者也雖古聖人亦未易知上以為然丙辰長春節免朝以戶部尚書石盞畏欣為參知政事兼修國史辛酉禁茶壬戌詔以鳳翔戰功及頒賞等級遍諭諸郡甲子以完顏伯嘉權參知政事行尚書省于河中府辛未詔職官犯罪非死罪除名遇赦幸免有才幹者中外並用夏四月癸酉朔復霍州汾西縣詔給空名宣敕遷賞將士之有功者丙子設京兆南山安撫司丁丑故鳳翔萬戶完顏醜和以死節贈懷遠大將軍授刺史職其父恕除以功例賞外遷兩官升職二等己卯遣官閲河南帥府見兵籍間官豪右親丁及遼東河北客戶為軍庚子募西山獵戶為軍五月癸卯朔始造元光重寶丙午復河中府及榮州遣人持檄招前山公武仙乙卯權平陽公史詠復霍州及洪洞縣丁巳始造元光珍貨同銀行用戊午以檄招東平嚴實己未參知政事毅夫言脅從人號忠孝軍而置沿淮者所為多不法請防間之上曰人心無常顧馭之何如耳馭之有術遠方猶且聽命況此輩乎不然雖左右亦難防間正在廓開大度而已若是而不能致太平者命也庚申簽河南路寄居官民充軍辛酉徙晉陽公郭文振兵于孟州甲子徙權平陽公史詠兵于解州河中府六月乙亥京東總帥牙吾塔報淮南之捷丁亥罷行省所置監察御史兼彈壓之職戊子議遣人招李全嚴實張林甲午詔罷河中行省置元帥府辛丑遙授靜難軍節度使顏盞蝦等以保鳳翔功進官秋七月壬寅朔夏人犯積石州羌界寺族多陷沒惟桑逋寺僧看逋昭逋厮沒及答那寺僧奔鞠等拒而不從詔賞諸僧鈐轄正將等官而給以廩祿乙巳遣兵守衛解州鹽池庚戌以空名宣敕遷賞諸部降人壬子除市易用銀及銀與寶泉私相易之禁癸丑敕諸御史曰瑣細事非人主所宜詰然凡涉姦弊靡不有關國政者比聞朝官及承應人月給俸糧多雜粳土有司所收曷嘗有是物哉至于出納斗斛亦小大不一此皆理所不容者而臺官初不問事事須朕言之安用汝曹也乙卯丹鳳門壞丁巳陰坡族之骨鞠門等叛歸夏元帥夾谷瑞發兵討之以捷聞御史中丞師安石言制敵二事戊午宰臣方對次有司奏前奉御溫敦太平卒上大駭曰朕屢欲授太平一職每以事阻今僅授之未數日而亡豈非天耶因謂宰臣曰海陵時有護衛二人私語一曰富貴在天一曰由君所賜海陵竊聞之詔授言由君所賜者以五品職意謂誠由己也而其人以疾竟不及授章宗秋獵聞平章張萬公薨歎曰朕回將拜萬公丞相而遂不起命也乙丑詔籍陝西路僑居官民為軍八月辛未朔邳州從宜經略使納合六哥等率都統金山顏俊以沂州百餘人晨入省署殺行尚書省蒙古綱據州反壬申詔賞京兆路官軍保全南山諸谷之功以所全人數多寡為等第千人以上官一階三千人以上兩階五千人以上三階仍升職一等能以力戰護之者又增一階戰沒者就以贈之甲戌遣官持空名宣敕諭以重賞招納合六哥拒命即命牙吾塔合行院兵討滅之乙亥火星入鬼宿中掩積尸氣乙酉詔能捕獲反賊六哥者除見定官外仍與世襲謀克丙戌遣官分行蔡息陳亳唐鄧裕諸州洎司農司州縣吏同議凡民丁相聚立寨避兵與各巡檢軍相依者五十戶以上置寨長一員百戶增副一員仍先遷一官能安民弭盜勸農者論功注授九月庚子朔日有食之宋人入壽州女奚烈蒲乃力戰却之壬寅樞密院奏提控术甲銼只罕破宋人之功甲辰宋人攻南陽丙午牙吾塔報桃園淮陽之捷並以納合六哥結搆李全之狀來告戊申降人孫邦佐自李全軍中歸遙授知東平府兼山東西路兵馬都總管官軍與宋人力戰于胡陂而却之提控术虎春兒為所殺癸丑納合六哥所署偽都統烏古論賽漢夾谷留住等來歸己未贈术虎春兒銀青榮祿大夫丙寅扎也胡魯等拔邳州南城丁卯權御史中丞師安石等劾英王守純不實付有司鞠治尋詔免罪而猶責諭之冬十月癸酉徙晉陽公郭文振等兵于衛州乙亥制行樞密院及元帥府農隙之月分番巡徼校獵月不過三次丁丑上獵于近郊己卯祫于太廟壬午火星犯靈臺乙酉上獵于近郊辛卯詔石壕店澠池永寧縣各屯兵千人壬辰滕州人時明謀反伏誅戊戌唐鄧行元帥報淮南之捷十一月己亥紅襖賊偽監軍徐福等來降詔進牙吾塔官一階賜金幣有差辛丑總帥牙吾塔報邳州之捷函叛人六哥首以獻開封縣境有虎嘻人詔親軍百人射殺之賞射獲者銀二十兩而以內府藥賜傷者丙午邳州紅襖賊三千來降初擬置諸陳許之間上以為若輩雖降家屬尚在河朔餘黨必殺之所得者寡而被害者衆亦復安忍不若命使撫諭加以官賞而遣之還果忠於我雖處河朔豈負我耶且餘衆感恩將有效順者矣戊午以上黨公完顏開之請諭開及郭文振史詠王遇張道盧芝等各與所鄰帥府相視可耕土田及瀕河北岸之地分界而種之以給軍餉辛酉鞏州行元帥府報會州破夏人之捷十二月己巳朔徙沿淮巡檢邊軍于內地癸酉以空名宣命金銀符給完顏開賞功辛巳詔延安土人充司縣官義軍使者選人代之量免其民差稅邳州民丁死戰陳者各贈官一階歸德徐邳宿泗永亳潁壽等州復業及新地民免差稅二年見戶一年嘗供給邳州者復免一年之半睢州陳留嵵縣免三之一丁亥上不豫免朝戊子皇太子率百官及王妃公主入問起居己丑復入問起居庚寅上崩于寧德殿壽六十有一上疾大漸暮夜近臣皆出惟前朝資明夫人鄭氏年老侍側上知其可託詔之曰速召皇太子主後事言絶而崩夫人祕之是夜皇后及貴妃龐氏問安寢閣龐氏陰狡機慧常以其子守純年長不得立心鞅鞅夫人恐其為變即紿之曰上方更衣后妃可少休他室伺其入遽鑰之急召大臣傳遺詔立皇太子始啓戶出后妃發喪皇太子方入宮英王守純已先入皇太子知之分遣樞密院官及東宮親衛軍官移剌蒲阿集軍三萬餘于東華門街部署既定命護衛四人監守純於近侍局乃即皇帝位於柩前壬辰宣遺詔是日詔赦中外明年正月戊戌朔改元正大諡大行曰繼天興統述道勤仁英武聖孝皇帝廟號宣宗三月庚申葬德陵贊曰宣宗當金源末運雖乏撥亂反正之材而有勵精圖治之志迹其勤政憂民中興之業蓋可期也然而卒無成功者何哉良由性本猜忌崇信御奬用吏胥苛刻成風舉措失當故也執中元惡此豈可相者乎顧乃懷其援立之私自除廉陛之分悖禮甚矣高琪之誅執中雖云除惡律以春秋之法豈逃趙鞅晉陽之責既不能罪而遂相之失之又失者也遷汴之後北顧有道之朝日益隆盛智識之士孰不先知方且狃於餘威牽制羣議南開宋釁西啓夏侮兵力既分功不補患曾未數年昔也日闢國百里今也日蹙國百里其能濟乎再遷遂至失國豈不重可歎哉
