body:
  text: 金史卷一百二十列傳第五十八世戚石家奴裴滿達忽覩徒單恭烏古論蒲魯虎唐括德溫烏古論粘沒曷蒲察阿虎迭烏林荅暉蒲察鼎壽徒單思忠徒單繹烏林荅復烏古論元忠子誼唐括貢烏林荅琳徒單公弼徒單銘徒單四喜金昭祖娶徒單氏后妃之族自此始見世祖時烏春為難世祖欲求昏以結其驩心烏春曰女直與胡里改豈可為昏世宗時賜夾谷清臣族同國人清臣胡里改人也然則四十七部之中亦有不通昏因者矣其故則莫能詰也有國家者昏因有族能使風氣淳固親義不渝而貴賤等威有別焉蓋良法也歟作世戚傳石家奴蒲察部人世居案出虎水祖斛魯短世祖外孫桓散達之亂昭肅皇后父母兄弟皆在敵境斛魯短以計迎還之石家奴自幼時撫養于太祖家及長太祖以女妻之年十五從攻寧江州敗遼主親軍攻臨潢府皆有功襲謀克其後自山西護齊國王謀良虎之喪歸上京道由興中是時方攻興中未下石家奴置柩于驛率其所領猛安兵助王師遂破其城從宗望討張覺再從宗翰伐宋宗翰聞宗望軍已圍汴遣石家奴計事抵平定軍遇敵兵數萬敗之遂見宗望已還報宗翰聞其平定之戰甚嘉之明年復伐宋石家奴隸婁室軍婁室討陝西未下石家奴領所部兵援之既而以本部屯戍西京會契丹大石出奔以余睹為元帥石家奴為副襲諸部族以還未幾有疾退居鄉里天眷間授侍中駙馬都尉再以都統定邊部熙宗賜御書嘉奬之封蘭陵郡王除東京留守以病致仕卒年六十三加贈鄖王正隆奪王爵封魯國公裴滿達本名忽撻婆盧木部人為人淳直孝友天輔六年從蒲家奴追叛寇於鐵呂川力戰有功熙宗娶忽撻女是為悼平皇后天眷元年授世襲猛安明年以皇后父拜太尉封徐國公皇統元年除會寧牧居數歲以太尉奉朝請九年悼后死無何海陵弒熙宗欲邀衆譽揚熙宗過惡以悼后死非罪於是封忽撻為王天德三年薨子忽覩為燕京留守以罪免居中都海陵命馳驛赴之及葬使祕書監納合椿年致祭賻銀五百兩忽覩天眷三年權猛安皇統元年為行軍猛安歷橫海崇義軍節度使以后戚怙勢贓汙不法其在橫海拜富人為父及死為之行服而分其資在崇義諷寺僧設齋而受其施及留守中京益驕恣苟可以得財無不為者選諸猛安富人子弟為扎野規取財物時號閑郎君朝廷以忽覩與徒單恭等汙濫至甚命秉德黜陟天下官吏忽覩以贓罷海陵以忽覩所至縱家奴擾民乃定禁外官任所閑雜人條約天德三年復起為鄭州防禦使改安國軍節度使卒年三十九徒單恭本名斜也天眷二年為奉國上將軍以告吳十反事超授龍虎衞上將軍為戶部侍郎出為濟南尹遷會寧牧封譚國公復出為太原尹斜也貪鄙使工繪一佛像自稱嘗見佛其像如此當以金鑄之遂賦屬縣金而未嘗鑄佛盡入其家百姓號為金總管秉德廉訪官吏斜也以贓免海陵篡立海陵后徒單氏斜也女由是復用為會寧牧封王未幾拜平章政事海陵獵於胡剌渾水斜也編列圍場凡平日不相能者輒杖之海陵謂宰相曰斜也為相朕非私之今聞軍國大事凡斜也所言卿等一無取豈千慮無一得乎他宰相無以對溫都思忠舉數事對曰某事本當如此斜也輒以為如彼皆妄生異議不達事宜臣逮事康宗累朝宰相未嘗有如斜也專恣者海陵默然斜也於都堂脊杖令史馮仲尹御史臺劾之海陵杖之二十斜也猛安部人撒合出者言斜也強率取部人財物海陵命侍御史保魯鞫之保魯鞫不以實海陵杖保魯而以撒合出為符寶祗候改隸合扎猛安斜也兄定哥尚太祖長女兀魯定哥死無子以季弟之子查剌為後斜也謀取其兄家財強納兀魯為室而不相能兀魯嘗怨詈斜也斜也妾忽撻與兀魯不叶乃譖兀魯於海陵后徒單氏曰兀魯怨上殺其兄宗敏有怨望語會韓王亨改廣寧尹諸公主宗婦往賀其母兀魯以言慰亨母忽撻亦以怨望指斥誣兀魯海陵使蕭裕鞫之忽撻得幸于徒單后左驗皆不敢言遂殺兀魯斜也因而盡奪查剌家財大定間皆追正之海陵以兀魯有怨望語斜也不奏遂杖斜也免所居官俄復為司徒進拜太保領三省事兼勸農使再進太師封梁晉國王貞元二年九月斜也從海陵獵于順州方獵聞斜也薨即日罷獵臨其喪親為擇葬地遣使營治及葬賜轀輬車上及后率百官祭之賜諡曰忠正隆間改封趙國公再進齊國公其妻先斜也卒海陵嘗至其葬所致祭起復其子率府率吾里補為諫議大夫大定間海陵降為庶人徒單氏為庶人妻斜也降特進鞏國公烏古論蒲魯虎父當海國初有功蒲魯虎通契丹大小字娶宋王宗望女昭寧公主什古熙宗初為護衞改牌印常侍左右轉通進襲父謀克再遷臨海軍節度使改衞州防禦使海陵賜食內殿謂之曰衞州風土甚佳勿以防禦為降也對曰頗聞衞州官署不利守者即日改汾陽軍節度使賜衣服佩玉帶劍入為太子詹事卒年四十一海陵親臨哭之后妃皆弔祭賻贈甚厚有司給喪事贈特進駙馬都尉正隆例贈光祿大夫唐括德溫本名阿里上京率河人也曾祖石古從太祖平臘醅麻產領謀克祖脫孛魯領其父謀克從太祖伐遼攻寧江泰州戰有功父撻懶尚康宗女從宋王宗望以軍二萬收平州至城東十里許遇敵兵甚衆戰敗之太祖賞賚甚厚授行軍猛安皇統初遷龍虎衞上將軍歷興平臨海等軍節度使德溫善射尚睿宗皇帝女楚國長公主天眷三年授宣武將軍皇統元年從都元帥宗弼南征以善突戰遷廣威將軍六年遷定遠大將軍七年授殿前右副都點檢天德初改殿前左副都點檢遷兵部尚書出為大名尹兼本路兵馬都總管改橫海軍節度使延安尹兼鄜延路兵馬都總管世宗即位封道國公為殿前都點檢駙馬都尉大定二年以父祖功授按出虎猛安所管世襲謀克三年九月九日世宗以故事出獵謂德溫曰扈從軍士二千飲食芻能無擾百姓乎嚴為約束仍以錢一萬貫分給之四年為勸農使出為西京留守賜犀弓玉帶召入為皇太子太傅卒上輟朝親臨喪奠祭賻贈甚厚十八年追錄其父撻懶幷德溫前後功授其長子駙馬都尉鼎世襲西北路沒里山猛安徙隸泰州烏古論粘沒曷上京胡剌溫屯人也移屯河間祖喚端太祖伐遼常侍左右追遼主延禧却夏人援兵皆有功授世襲謀克父歡覩官至廣威將軍粘沒曷尚睿宗女冀國長公主初為護衞天德二年襲謀克海陵伐宋為押軍猛安世宗即位軍還授侍衞親軍步軍都指揮使加駙馬都尉歷左副點檢禁直被酒不親視扃鐍杖四十遷右宣徽使勸農使出為興平軍節度使改廣寧尹賜錢三千貫粘沒曷至廣寧嗜酒不視事上以兵部員外郎宗安為少尹詔宗安戒諭之上謂宗安曰汝能繼修前政朕不忘汝勉之大定中粘沒曷卒上聞之遣其子駙馬都尉公說馳驛奔喪賜錢三千貫沿路祭物並從官給蒲察阿虎迭初授信武將軍尚海陵姊遼國長公主迪鉢為駙馬都尉遼國薨繼尚鄧國長公主崔哥皇統三年為右副點檢五年使宋為賀正旦使改左副點檢禮部工部尚書廣寧咸平臨潢尹武定軍節度使封葛王薨年二十八海陵親臨葬贈譚王正隆例贈特進楚國公鳥林荅暉本名謀良虎明德皇后兄也天眷初充護衞以捕宗磐宗雋功授忠勇校尉遷明威將軍從宗弼北征遷廣威將軍賞以金幣尚擊毬馬久之除殿中侍御史再除蒲速碗羣牧使謹畜牧不事遊宴孳產蕃息進秩改特滿羣牧使世宗即位召見行在除中都兵馬都指揮使世宗至中都將遣使於宋以暉為使世宗曰暉嘗私用官錢五百貫廼數其罪而罷之遣高忠建往因謂宰臣曰朕於賞罰豪髮無所假借果公廉辦治雖素所不喜必加升擢若抵冒公法雖至親不少恕遷都點檢兼侍衞親軍副都指揮使卒遣官致祭皇太子諸王百官會喪賻銀千兩重綵四十端絹四十匹詔以暉第三子天錫世襲納鄰河猛安親管謀克蒲察鼎壽本名和尚上京曷速河人欽懷皇后父也賦性沉厚有明鑒通契丹漢字長於吏事尚熙宗女鄭國公主貞元三年以海陵女弟慶宜公主子加定遠大將軍為尚衣局使累官器物局使大定二年加駙馬都尉職如故歷符寶郎蠡州刺史濬州防禦使有惠政兩州百姓刻石紀之遷泰寧軍節度使歷東平府橫海軍入為右宣徽使改左宣徽授中都路昏得渾山猛安曷速木單世襲謀克改河間尹號令必行豪右屏跡有宗室居河間侵削居民鼎壽奏徙其族于平州郡內大治卒官上聞之深加悼惜喪至香山皇太子往奠百官致祭賻銀綵絹明昌三年以皇后父贈太尉越國公鼎壽既世連姻戚女為皇后長子辭不失凡三尚定國景國道國公主其寵遇如此未嘗以富貴驕人當時以為外戚之冠云徒單思忠字良弼本名寧慶曾祖賽補尚景祖女從太祖伐遼戰歿于臨潢之渾河父賽一尚熙宗妹正隆末為辤椀羣牧使契丹賊窩斡擾北邊賽一與戰死之大定初贈金吾衞上將軍思忠通敏有才頗通經史世宗在潛邸撫養之賦性寬厚十有二歲從上在濟南一日與姻戚公子出遊近郊有醉人腰弓矢策馬突過諸公子怒欲鞭之思忠曰醉人昏昧又何足責遂釋之其人行數十步忽執弓矢思忠恐欲傷人速馳至其傍奪其弓弛而還之上聞之嘉有識量由是常使侍側尚皇弟二女唐國公主大定初世宗使思忠迎南征萬戶高忠建完顏福壽于遼口察其去就思忠知其誠意乃與俱至東京世宗即位如中都思忠從行軍國庶事補益弘多大定元年十月拜殿前左衞將軍二年加駙馬都尉卒上為輟朝即喪所臨奠命有司備禮葬之營費從官給十九年上追念思忠輔立功贈驃騎衞上將軍仍授其子鐸武功將軍世襲中都路烏獨渾謀克徒單繹本名术輩其先上京按出虎達阿人祖撒合懣國初有功授隆安府路合扎謀克奪古阿隣猛安繹美姿儀通諸國語尚熙宗第七女瀋國公主充符寶祗候遷御院通進授符寶郎歷宣德泰安淄州刺史有廉名改同知廣寧府事以母鄂國公主憂不赴世宗特許以憂制中襲父封服闋授同知濟南府事二十六年遷棣州防禦使以政迹聞升臨海軍節度使卒繹家世貴寵自曾祖照至繹尚公主者凡四世云烏林荅復本名阿里剌東平人也奉御出身大定七年尚世宗第七女宛國公主授駙馬都尉改引進使兼符寶郎出為蠡州刺史三遷歸德軍節度使明昌三年轉知興中府事久之為曷懶路兵馬都總管承安四年拜絳陽軍節度使卒烏古論元忠本名訛里也其先上京獨拔古人父訛論尚太祖女畢國公主元忠幼秀異世宗在潛邸以長女妻之後封魯國大長公主正隆末從海陵南伐世宗即位遼陽時太保昂為海陵左領軍大都督遣元忠朝于行在遂授定遠大將軍擢符寶郎諭之曰朕初即位親密無如汝者侍從宿衞宜戒不虞大定二年加駙馬都尉除近侍局使遷殿前左衞將軍從世宗獵上欲射虎元忠諫止之進殿前右副都點檢為賀宋正旦使還轉左副都點檢坐家奴結攬民稅免官十一年復舊職明年升都點檢十五年北邊進獻命元忠往受之及還詔諭曰朕每遇卿直宿其寢必安今夏幸景明宮卿去久朕甚思之會大興府守臣闕遂以元忠知府事有僧犯法吏捕得置獄皇姑梁國大長公主屬使釋之元忠不聽主奏其事世宗召謂曰卿不徇情甚可嘉也治京如此朕復何憂秩滿授吏部尚書以其子誼尚顯宗長女薛國公主十八年擢御史大夫授撒巴山世襲謀克世宗問左丞相紇石烈良弼孰可相者良弼以元忠對乃拜平章政事封任國公進尚書右丞相策論進士之科設元忠贊成之世宗將幸會寧元忠進諫不聽出知真定府尋復詔為右丞相世宗欲甓上京城元忠曰此邦遭正隆軍興百姓凋弊陛下休養二十餘年尚未完復況土性疏惡甓之恐難經久風雨摧壞歲歲繕完民將益困矣駕東幸久之未還元忠奏曰鸞輿駐此已閱歲倉儲日少市買漸貴禁衞暨諸局署多逃者有司捕置諸法恐傷陛下仁愛世宗嘉納之尋出為北京留守責諭之曰汝強悍自用顓權而結近密汝心叵測其速之官後左丞張汝弼奏事世宗惡其阿順謂左右曰卿等每事依違苟避不肯盡言高爵厚祿何以勝任如烏古論元忠為相剛直敢言義不顧身誠可尚也於是改知真定府事移知河間明昌二年知廣寧府以河間修築毬場擾民會赦下除順義軍節度使乞致仕不許特加開府儀同三司北京留守徙知濟南府過闕令預宴班平章政事之上承安二年移守南京尋改知彰德府卒訃聞上遣宣徽使白琬燒飯賻物甚厚元忠素貴性豪而內深忌世宗嘗責之又所至不能戢奴僕世以此為訾云子誼誼本名雄名大定八年尚海陵女宴宗室及六品以上官命婦預焉上曰此女亦太祖之曾孫猶朕之女乃父廢亡非其女之罪也海陵女卒大定二十一年尚顯宗女廣平郡主誼歷仕宮衞為人豪類其父二十六年上謂原王曰元忠勿望其可復相也雄名又不及乃父朕嘗宥待殊不知恩汝宜知其為人謂平章政事襄曰雄名可令補外自今宮掖官已有旨補外者比及廷授即毋令入宮於是誼除同知澄州軍州事章宗即位廣平郡主進封鄴國長公主誼改順天軍節度副使加駙馬都尉承安元年累遷祕書監兼吏部侍郎改刑部遷工部尚書泰和元年遇父元忠憂二年以本官起復三年知東平府事改知真定府事六年伐宋遷元帥左都監七年轉左監軍八年拜御史大夫大安中知大名府至寧初以謀逆伏誅唐括貢本名達哥太傅阿里之子也尚世宗第四女吳國公主授駙馬都尉充奉御特授拱衞直副都指揮使五遷刑部侍郎坐擅離職削官一階出為德州防禦使升順天軍節度使移鎮橫海召為左宣徽使遷兵部尚書改吏部轉禮部尚書兼大理卿先是大理卿闕世宗命宰臣選可授者左丞張汝弼舉西京副留守楊子益法律詳明上曰子益雖明法而用心不正豈可任之以分別天下是非也大理須用公正人右丞粘割斡特剌舉貢可任以閑簡部分而兼領是職遂以貢為之二十八年拜樞密副使章宗立為御史大夫會貢生日右丞相襄參知政事劉瑋吏部郎中中都兵馬都指揮使和喜為貢壽遂犯夜禁和喜遣軍人送襄至第監察御史徒單德勝劾其事下刑部逮等問狀上以襄瑋大臣釋之而貢等各解職尋知大興府事復為樞密副使乞致仕不許進樞密使封莘國公改封蕭復上表乞退上曰向已嘗告續知意欲外除今之告將復若何遂優詔許之尋起知真定府事泰和二年薨烏林荅琳本名留住尚郜國公主加駙馬都尉貞祐元年為靜難軍節度使夏人犯邠州琳降會延安府遣通事張福孫至夏國夏人使福孫見琳時已中風公主令人狀付福孫屬以懇禱朝廷冀早太平得還鄉之意福孫具以聞詔賜以藥物徒單公弼本名習烈河北東路算主海猛安人父府君奴尚熙宗女加駙馬都尉終武定軍節度使公弼初充奉御大定二十七年尚世宗女息國公主加定遠大將軍駙馬都尉改器物局直長轉副使兼近侍局直長丁父憂起復本局副使章宗秋山射中虎虎怒突而前侍衞皆避去公弼不動虎亦隨斃詔責侍衞而慰諭公弼除濱州刺史再遷兵部侍郎累除知大名府事是時伐宋軍興有司督逋租及牛頭稅甚急公弼奏軍士從戎民亦疲弊可緩徵以紓民朝廷從之大安初知大興府事讞武清盜疑其有寃已而果獲真盜歲餘拜參知政事進右丞轉左丞至寧初拜平章政事封定國公貞祐初進拜右丞相罷知中山府事是時中都圍急不可行圍解宣宗曰中山新被兵不如河中善乃改知河中府歷定國軍節度使事太孫太師同判大睦親府事興定五年薨宣宗輟朝賻贈諡恪愿徒單銘字國本顯宗賜名重泰祖貞別有傳父特進涇國公性重默寡言粗通經史事母盡孝大定末充奉御章宗即位特勅襲中都路渾特山猛安明昌五年授尚醞署直長累遷侍儀司令宿直將軍尚衣局使兵部郎中與大理評事孫人鑑為採訪使覆按提刑司事改右衞將軍轉左衞出為永定軍節度使移河東北路按察使轉運使大安三年改知大名府就陞河北東西大名路安撫使大名荐饑重困銘乞大出交鈔以賑之崇慶初移知真定府復充河北東西大名路宣撫使至寧元年九月奉迎宣宗于彰德府俄拜尚書右丞出為北京留守以路阻不能赴貞祐二年卒贊曰天子娶后王姬下嫁豈不重哉秦漢以來無世世甥舅之家關雎之道缺外戚驕盈何彼穠矣不作王姬肅雝之義幾希矣蓋古者異姓世爵公侯與天子為昏因他姓不得參焉女為王后己尚王姬而自貴其貴富厚不加焉寵榮不與焉使漢唐行此道則無呂氏王氏武氏之難公主下嫁各安其分各得其所矣金之徒單拏懶唐括蒲察裴滿紇石烈僕散皆貴族也天子娶后必于是公主下嫁必于是與周之齊紀無異此昏禮之最得宜者盛於漢唐矣徒單四喜哀宗皇后之弟也天興二年正月辛酉夜四喜內侍馬福惠至自歸德時河朔已失利京城猶未知二人被旨迎兩宮遂託以報捷執小黃旗以入至則奏兩宮以奉迎之意是日召二相入議二相及烏古孫奴申諫不可行四喜作色曰我奉制旨迎兩宮有敢言不行者當以別勅從事矣二相不復敢言行議遂決制旨所取兩宮柔妃裴滿氏及令人張秀蘃都轄承御湯藥皇乳母鞏國夫人等十餘人外皆放遣之又取宮中寶物馬蹄金四百枚大珠如栗黃者七千枚生金山一龍腦板二及信瑞御璽仍許賜忠孝軍以兩宮隨行物之半壬寅太后御仁安殿出錠金及七寶金洗分賜忠孝軍是夜兩宮騎而出至陳留見城外二三處火起疑有兵遲回間奴申初不欲行即承太后旨馳還癸卯入京頓四喜家少頃還宮復議以是夜再往太后憊於鞍馬不能動遂止明日崔立變四喜术甲塔失不及塔失不之父咬住四喜妻完顏氏以忠孝卒九十七騎奪曹門而出將往歸德不得出轉陳州門亦為門卒所止門帥裕州防禦使阿不罕斜合已遁去經歷官完顏合住權帥職麾門卒放塔失不等去且曰罪在我非汝等之過明日立以數十騎召合住合住自分必死易衣冠而往立左右扼腕欲加刃立遙見問汝是放忠孝軍出門者耶合住曰然天子使命某實放之罪在某立忽若有所省顧羣卒言此官人我識之前築𩹉城時與我同事我所部十餘卒盜官木罪當死此官人不之問但笞數十而已此家能殺人能救人因好謂合住曰業已放出吾不汝罪也四喜等至歸德上驚問兩宮何如二人奏京城軍變不及入宮上曰汝父汝妻獨得出耶下之獄皆斬於市贊曰四喜奉迎兩宮而值崔立之變智者居此與兩宮周旋兵間以俟事變之定而徐圖之萬一不然以一死徇之耳他無策也四喜奉其私親以歸而望人主貸其死豈非愚乎
