body:
  text: 金史卷一百二十九列傳第六十七酷吏高閭山蒲察合住太史公有言法家嚴而少恩信哉斯言也金法嚴密律文雖因前代而增損之大抵多準重典熙宗迭興大獄海陵翦滅宗室鈎棘傅會告姦上變者賞以不次於是中外風俗一變咸尚威虐以為事功而讒賊作焉流毒遠邇慘矣金史多闕逸據其舊録得二人焉作酷吏傳高閭山澄州析木人選充護衛調順義軍節度副使轉唐括移剌都辭詳穩改震武軍節度副使曹王府尉大名治中遷汝州刺史改單州制禁不依法用杖決人者閭山見之笑曰此亦難行是日特用大杖杖死部民楊仙坐削一官解職久之降鳳翔治中歷原州濟州泗州刺史改鄭州防禦使遷蒲與路節度使移臨海軍盤安軍寧昌軍貞祐二年城破死之蒲察合住以吏起身久為宣宗所信聲勢烜赫性復殘刻人知其蠹國而莫敢言其子充護衛先逐出之繼而合住為州刺史需次近縣後大兵入陝西關中震動或言合住赴州為北走計朝廷命開封羈其親屬合住出怨言曰殺却我即太平矣尋為御史所劾初議笞贖宰相以為悖理斬於開封府門之下故當時有宣朝三賊之目謂王阿里蒲察咬住合住其一也興定中駙馬僕散阿海之獄京師宣勘七十餘所阿里輩乘時起事以肆其毒朝士惴惴莫克自保惟獨吉文之在開封府幕明其不反竟不署字阿海誅文之亦無所問咬住正大初致仕居睢陽潰軍變與其家皆被殺初宣宗喜刑罰朝士往往被笞楚至用刀杖決殺言者高琪用事威刑自恣南渡之後習以成風雖士大夫亦為所移如徒單右丞思忠好用麻椎擊人號麻椎相公李運使特立號半截劍言其短小鋒利也馮內翰璧號馮劊雷淵為御史至蔡州得姦豪杖殺五百人號曰雷半千又有完顏麻斤出皆以酷聞而合住王阿里李渙之徒胥吏中尤狡刻者也佞辛蕭肄張仲軻李通馬欽高懷貞蕭裕胥持國世之有嗜欲者何嘗不被其害哉龍天下之至神也一有嗜欲見制於人故人君亦然嗜欲不獨柔曼之傾意也征伐畋獵土木神仙彼為佞者皆有以投其所好焉金主內蠱聲色外好大喜功莫甚於熙宗海陵而章宗次之金史自蕭肄至胥持國得佞臣之尤者七人皆被寵遇於三君之朝以亡其身以蠹其國其禍皆始於此可不戒哉作佞幸傳蕭肄本奚人有寵於熙宗復諂事悼后纍官參知政事皇統九年四月壬申夜大風雨雷電震壞寢殿鴟尾有火自外入燒內寢幃幔帝徙別殿避之欲下詔罪己翰林學士張鈞視草鈞意欲奉答天戒當深自貶損其文有曰惟德弗類上干天威及顧茲寡昧眇豫小子等語肄譯奏曰弗類是大無道寡者孤獨無親昧則於人事弗曉眇則目無所見小子嬰孩之稱此漢人託文字以詈主上也帝大怒命衛士拽鈞下殿榜之數百不死以手劍其口而醢之賜肄通天犀帶憑恃恩幸倨視同列遂與海陵有惡及篡立加大臣官爵例加銀青光祿大夫數日召肄詰之曰學士張鈞何罪被誅爾何功受賞肄不能對海陵曰朕殺汝無難事人或以我報私怨也於是詔除名放歸田里禁錮不得出百里外張仲軻幼名牛兒市井無賴説傳奇小説雜以俳優詼諧語為業海陵引之左右以資戲笑海陵封岐國王以為書表及即位為祕書郎海陵嘗對仲軻與妃嬪褻瀆仲軻但稱死罪不敢仰視又嘗令仲軻倮形以觀之侍臣往往令倮褫雖徒單貞亦不免此兵部侍郎完顏普連大興少尹李惇皆以贓敗海陵置之要近伶人于慶兒官五品大氏家奴王之彰為祕書郎之彰置珠偏僻海陵親視之不以為褻唐括辨家奴和尚烏帶家奴葛溫葛魯皆置宿衛有僥幸至一品者左右或無官職人或以名呼之即授以顯階海陵語其人曰爾復能名之乎常置黃金裀褥間喜之者令自取之其濫賜如此宋余唐弼賀登寶位且還海陵以玉帶附賜宋帝使謂宋帝曰此帶卿父所常服今以為賜使卿如見而父當不忘朕意也使退仲軻曰此希世之寶可惜輕賜上曰江南之地他日當為我有此置之外府耳由是知海陵有南伐之意俄遷祕書丞轉少監是時營建燕京宮室有司取真定府潭園材木仲軻乘間言其中材木不可用海陵意仲軻受請託免仲軻官未幾復用為少監海陵獵于途你山次于鐸瓦酹天而拜謂羣臣曰朕幼時習射至一門下默祝曰若我異日大貴當使一矢橫加門脊上及射果橫加門脊上後為中京留守嘗大獵于此地圍未合禱曰我若有大位百步之內當獲三鹿若止為公相獲一而已於是不及百步連獲三鹿又祝曰若統一海內當復獲一大鹿於是果獲一大鹿此事嘗與蕭裕言之朕今復至此地故拜奠焉海陵意欲取江南故先設禨祥以諷羣臣是以仲軻每先逢其意導之南伐貞元二年正月宋賀正旦使施巨朝辭海陵使左宣徽使敬嗣暉問施巨曰宋國幾科取士對曰詩賦經義策論兼行又問秦檜作何官年今幾何對曰檜為尚書左僕射中書門下平章事年六十五矣復謂之曰我聞秦檜賢故問之正隆二年仲軻為左諫議大夫修起居注但食諫議俸不得言事三年正月宋賀正使孫道夫陛辭海陵使左宣徽使敬嗣暉諭之曰歸白爾帝事我上國多有不誠今略舉二事爾民有逃入我境者邊吏皆即發還我民有逃叛入爾境者有司索之往往託辭不發一也爾於沿邊盜買鞍馬備戰陳二也且馬待人而後可用如無其人得馬百萬亦奚以為我亦豈能無備且我不取爾國則已如欲取之固非難事我聞接納叛亡盜買鞍馬皆爾國楊太尉所為常因俘獲問知其人無能為者也又曰聞秦檜已死果否道夫對曰檜實死矣陪臣亦檜所薦用者又曰爾國比來行事殊不似秦檜時何也道夫曰容陪臣還國一一具聞宋帝海陵蓋欲南伐故先設納叛亡盜買馬二事而雜以他辭言之海陵召仲軻右補闕馬欽校書郎田與信直長習失入便殿侍坐海陵與仲軻論漢書謂仲軻曰漢之封疆不過七八千里今吾國幅員萬里可謂大矣仲軻曰本朝疆土雖大而天下有四主南有宋東有高麗西有夏若能一之乃為大耳海陵曰彼且何罪而伐之仲軻曰臣聞宋人買馬修器械招納山東叛亡豈得為無罪海陵喜曰向者梁珫嘗為朕言宋有劉貴妃者姿質艷美蜀之華蘂吳之西施所不及也今一舉而兩得之俗所謂因行掉手也江南聞我舉兵必遠竄耳欽與與信俱對曰海島蠻越臣等皆知道路彼將安往欽又曰臣在宋時嘗帥軍征蠻所以知也海陵謂習失曰汝敢戰乎對曰受恩日久死亦何避海陵曰汝料彼敢出兵否彼若出兵汝果能死敵乎習失良久曰臣雖懦弱亦將與之為敵矣海陵曰彼將出兵何地曰不過淮上耳海陵曰然則天與我也既而曰朕舉兵滅宋遠不過二三年然後討平高麗夏國一統之後論功遷秩分賞將士彼必忘勞矣四年三月仲軻死冬至前一夕海陵夢仲軻求酒既覺嗟悼良久遣使者奠其墓李通以便辟側媚得幸於海陵纍官右司郎中遷吏部尚書請謁賄賂輻湊其門正隆二年正月乙酉詔左右司御史中丞以下奏事便殿海陵曰知子莫若父知臣莫若君朕嘗試之矣朕詢及人材汝等若不舉同類必舉其相善者朕聞女直契丹之仕進者必賴刑部尚書烏帶簽書樞密遙設為之先容左司員外郎阿里骨列任其事渤海漢人仕進者必賴吏部尚書李通戶部尚書許霖為之先容左司郎中王蔚任其事凡在仕版朕識者寡不識者衆莫非人臣豈有遠近親疏之異哉苟奉職無愆尚書侍郎節度使便可得萬一獲罪必罰無赦頃之拜參知政事海陵恃纍世強盛欲大肆征伐以一天下嘗曰天下一家然後可以為正統通揣知其意遂與張仲軻馬欽宦者梁珫近習羣小輩盛談江南富庶子女玉帛之多逢其意而先道之海陵信其言以通為謀主遂議興兵伐江南四年二月海陵諭宰相曰宋國雖臣服有誓約而無誠實比聞沿邊買馬及招納叛亡不可不備遣使籍諸路猛安部族及州縣渤海丁壯充軍仍括諸道民馬於是遣使分往上京速頻路胡里改路曷懶路蒲與路泰州咸平府東京婆速路曷蘇館臨潢府西南招討司西北招討司北京河間府真定府益都府東平府大名府西京路凡年二十以上五十以下者皆籍之雖親老丁多求一子留侍亦不聽五年十一月使益都尹京等三十一人押諸路軍器於軍行要會處安置俟軍至分給之其分給之餘與繕完不及者皆聚而焚之六年正月海陵使通諭旨宋使徐度等曰朕昔從梁王嘗居南京樂其風土帝王巡狩自古有之淮右多隙地欲校獵其間從兵不踰萬人汝等歸告汝主令有司宣諭朕意使淮南之民無懷疑懼二月通進拜右丞詔曰卿典領繕完兵械今已畢功朕嘉卿忠謹故有是命俟江南事畢別當旌賞四月簽書樞密院事高景山為賜宋帝生日使右司員外郎王全副之海陵謂全曰汝見宋主即面數其焚南京宮室沿邊買馬招致叛亡之罪當令大臣某人某人來此朕將親詰問之且索漢淮之地如不從即厲聲詆責之彼必不敢害汝海陵蓋使王全激怒宋主將以為南伐之名也謂景山曰回日以全所言奏聞全至宋一如海陵之言詆責宋主宋主謂全曰聞公北方名家何乃如是全復曰趙桓今已死矣宋主遽起發哀而罷海陵至南京宋遣使賀遷都海陵使韓汝嘉就境上止之曰朕始至此比聞北方小警欲復歸中都無庸來賀宋使乃還於是大括天下吂月馬凡馬官至七品聽留一馬等而上之並舊籍民馬其在東者給西軍在西者給東軍東西交相往來晝夜絡繹不絶死者狼籍于道其亡失多者官吏懼罪或自殺所過蹂踐民田調發牽馬夫役詔河南州縣所貯糧米以備大軍不得他用而吂月馬凡馬所至當給芻粟無可給有司以為請海陵曰此方比歲民間儲畜尚多今禾稼滿野吂月馬凡馬可就牧田中借令再歲不獲亦何傷乎及徵發諸道工匠至京師疫死者不可勝數天下始騷然矣調諸路馬以戶口為率富室有至六十匹者凡調馬五十六萬餘匹仍令本家養飼以俟師期海陵因出獵遂至通州觀造戰船籍諸路水手得三萬餘人及東海縣人張旺徐元反遣都水監徐文等率師浮海討之海陵曰朕意不在一邑將試舟師耳於是民不堪命盜賊𧔧起大者連城邑小者保山澤遣護衛普連二十四人各授甲士五十人分往山東河北河東中都等路節鎮州郡屯駐捕捉盜賊以護衛頑犀為定武軍節度副使尚賢為安武軍節度副使蒲甲為昭義軍節度副使皆給銀牌使督責之是時山東賊犯沂州臨沂令胡撒力戰而死大名府賊王九等據城叛衆至數萬契丹邊六斤王三輩皆以十數騎張旗幟白晝公行官軍不敢誰何所過州縣開劫府庫物置于市令人攘取之小人皆喜賊至而良民不勝其害太府監高彥福大理正耶律道翰林待制大穎出使還朝皆言盜賊事海陵惡聞怒而杖之穎仍除名自是人人不復敢言海陵自將分諸道兵為神策神威神捷神鋭神毅神翼神勇神果神略神鋒武勝武定武威武安武捷武平武成武毅武鋭武揚武翼武震威定威信威勝威捷威烈威毅威震威略威果威勇三十二軍置都總管副總管各一員分隸左右領軍大都督及三道都統制府置諸軍巡察使副各一員以太保奔睹為左領軍大都督通為副大都督海陵以奔睹舊將使帥諸軍以從人望實使通專其事海陵召諸將授方略賜宴于尚書省海陵曰太師梁王連年南伐淹延歲月今舉兵必不如彼遠則百日近止旬月惟爾將士無以征行為勞戮力一心以成大功當厚加旌賞其或弛慢刑茲無赦海陵恐糧運不繼命諸軍渡江無以僮僕從行聞者莫不怨咨徒單后與太子光英居守尚書令張浩左丞相蕭玉參知政事敬嗣暉留治省事九月甲午海陵戎服乘馬具裝啓行明日妃嬪皆行宮中慟哭久之十月乙巳陰晦失路是夜二更始至蒙城丁未大軍渡淮至中流海陵拜而酹之至宿次見築繚垣者殺四方館使張永鈐將至廬州見白兔馳射不中既而後軍獲之以進海陵大喜以金帛賜之顧謂李通曰昔武王伐紂白魚躍於舟中今朕獲此亦吉兆也癸亥海陵至和州百官表奉起居海陵謂其使汝等欲伺我動靜邪自今勿復來俟平江南始進賀表是時梁山濼水涸先造戰船不得進乃命通更造戰船督責苛急將士七八日夜不得休息壞城中民居以為材木煮死人膏為油用之遂築臺於江上海陵被金甲登臺殺黑馬以祭天以一羊一豕投於江中召都督昂副都督蒲盧渾謂之曰舟楫已具可以濟江矣蒲盧渾曰臣觀宋舟甚大我舟小而行遲恐不可濟海陵怒曰爾昔從梁王追趙構入海島豈皆大舟邪明日汝與昂先濟昂聞令己渡江悲懼欲亡去至暮海陵使謂昂曰前言一時之怒耳不須先渡江也明日遣武平軍都總管阿鄰武捷軍副總管阿撒率舟師先濟宿直將軍溫都奧剌國子司業馬欽武庫直長習失皆從戰海陵置黃旗紅旗於岸上以號令進止紅旗立則進黃旗仆則退既渡江兩舟先逼南岸水淺不得進與宋兵相對射者良久兩舟中矢盡遂為所獲亡一猛安軍士百餘人海陵遂還和州於是尚書省使右司郎中吾補可員外郎王全奏報世宗即位於東京改元大定海陵前此已遣護衛謀良虎特離補往東京欲害世宗行至遼水遇世宗詔使撒八執而殺之遂還軍中海陵拊髀嘆曰朕本欲平江南改元大定此豈非天乎乃出素所書取一戎衣天下大定改元事以示羣臣遂召諸將帥謀北歸且分兵渡江議定通復入奏曰陛下親師深入異境無功而還若衆散於前敵乘於後非萬全計若留兵渡江車駕北還諸將亦將解體今燕北諸軍近遼陽者恐有異志宜先發兵渡江斂舟焚之絶其歸望然後陛下北還南北皆指日而定矣海陵然之明日遂趨揚州過烏江縣觀項羽祠嘆曰如此英雄不得天下誠可惜也海陵至揚州使符寶耶律沒答護神果軍扼淮渡凡自軍中還至淮上無都督府文字皆殺之乃出內箭飾以金龍題曰御箭繫帛書其上使人乘舟射之南岸其書言宋國遣人焚毀南京宮室及沿邊買馬招誘軍民今興師問罪義在弔伐大軍所至必無秋毫之犯以此招諭宋人於是宋將王權亦縱所獲金軍士三人齎書數海陵罪通奏其書即命焚之海陵怒亟欲渡江驍騎高僧欲誘其黨以亡事覺命衆刃銼之乃下令軍士亡者殺其蒲里衍蒲里衍亡者殺其謀克謀克亡者殺其猛安猛安亡者殺其總管由是軍士益危懼甲午令軍中運鴉鶻船及糧船於瓜洲渡期以明日渡江敢後者死乙未完顏元宜等以兵犯御營海陵遇弒都督府以南伐之計皆通等贊成之徒單永年乃其姻戚郭安國衆所共惡皆殺之大定二年詔削通官爵人心始快馬欽幼名韓哥嘗仕江南故能知江南道路正隆三年海陵將南伐遂召用欽自貴德縣令為右補闕欽為人輕脫不識大體海陵每召見與語欽出宮輒以語人曰上與我論某事將行之矣其視海陵如僚友然纍遷國子司業海陵至和州欲遣蒲盧渾渡江蒲盧渾言舟小不可濟海陵使人召欽先戒左右曰欽若言舟小不可渡江即殺之欽至問曰此舟可渡江否欽曰臣得亦可渡也大定二年除名是日起前翰林待制大穎為祕書丞穎在正隆間嘗言山東盜賊海陵惡其言杖之除名世宗嘉穎忠直惡欽巧佞故復用穎而放欽焉高懷貞為尚書省令史素與海陵狎昵海陵久蓄不臣之心嘗與懷貞各言所志海陵曰吾志有三國家大事皆自我出一也帥師伐國執其君長問罪於前二也得天下絶色而妻之三也由是小人佞夫皆知其志爭進諛説大定縣丞張忠輔謂海陵言夢公與帝擊毬公乘馬衝過之帝墜馬下海陵聞之大喜會熙宗在位久委政大臣海陵以近屬為宰相專威福柄遂成弒逆之計皆懷貞輩小人從臾導之海陵篡立以懷貞為修起居注懷貞故父濱州刺史贈中奉大夫懷貞纍遷禮部侍郎大定二年降奉政大夫放歸田里五年與許霖俱賜起復懷貞為定國軍節度使上戒之曰汝等在正隆時姦佞貪私物論鄙之朕念沒身不齒則無以自新若怙舊不悛必不貸汝矣蕭裕本名遙折奚人初以猛安居中京海陵為中京留守與裕相結每與論天下事裕揣海陵有覬覦心密謂海陵曰留守先太師太祖長子德望如此人心天意宜有所屬誠有志舉大事願竭力以從海陵喜受之遂與謀議海陵竟成弒逆之謀者裕啓之也海陵為左丞除裕兵部侍郎改同知南京留守事改北京海陵領行臺尚書省事道過北京謂裕曰我欲就河南兵建立位號先定兩河舉兵而北君為我結諸猛安以應我定約而去海陵雖自良鄉召還不能如約遂弒熙宗篡立以裕為祕書監海陵心忌太宗諸子欲除之與裕密謀裕傾險巧詐因構致太傅宗本秉德等反狀海陵殺宗本唐括辨遣使殺秉德宗懿及太宗子孫七十餘人秦王宗翰子孫三十餘人宗本已死裕乃求宗本門客蕭玉教以具款反狀令作主名上變海陵既詔天下天下寃之海陵賞誅宗本功以裕為尚書左丞加儀同三司授猛安賜錢二千萬馬四百匹牛四百頭羊四千口再閲月為平章政事監修國史舊制首相監修國史海陵以命裕謂裕曰太祖以神武受命豐功茂烈光於四海恐史官有遺逸故以命卿久之裕為右丞相兼中書令裕在相位任職用事頗專恣威福在己勢傾朝廷海陵倚信之他相仰成而已裕與高藥師善嘗以海陵密語告藥師藥師以其言奏海陵且曰裕有怨望心海陵召裕戒諭之而不以為罪也或有言裕擅權者海陵以為忌裕者衆不之信又以為人見裕弟蕭祚為左副點檢妹夫耶律闢離剌為左衛將軍勢位相憑藉遂生忌嫉乃出祚為益都尹闢離剌為寧昌軍節度使以絶衆疑裕不知海陵意遽見出其親表補外不令己知之自是深念恐海陵疑己海陵弟太師兗領三省事共在相位以裕多自用頗防間之裕乃謂海陵使兗備之也而海陵猜忍嗜殺裕恐及禍遂與前真定尹蕭馮家奴前御史中丞蕭招折博州同知遙設裕女夫遏剌補謀立亡遼豫王延禧之孫裕使親信蕭屯納往結西北路招討使蕭好胡好胡即懷忠懷忠依違未決謂屯納曰此大事汝歸遣一重人來裕乃使招折往招折前為中丞以罪免以此得詣懷忠懷忠問招折與謀者復有何人招折曰五院節度使耶律朗亦是也懷忠舊與朗有隙而招折嘗上撻懶變事懷忠疑招折反覆因執招折收朗繫獄遣使上變遙設亦與筆硯令史白答書使白答助裕以取富貴白答奏其書海陵信裕不疑謂白答構誣之命殺白答於市執白答出宣華門點檢徒單貞得蕭懷忠上變事入奏遇見白答問其故因止之徒單貞已奏變事以白答為請海陵遽使釋之海陵使宰相問裕裕即款伏海陵甚驚愕猶未能盡信引見裕親問之裕曰大丈夫所為事至此又豈可諱海陵復問曰汝何怨於朕而作此事裕曰陛下凡事皆與臣議及除祚等乃不令臣知之領省國王每事謂臣專權頗有隄防恐是得陛下旨意陛下與唐括辨及臣約同生死辨以強忍果敢致之死地臣皆知之恐不得死所以此謀反幸苟免耳太宗子孫無罪皆死臣手臣之死亦晚矣海陵復謂裕曰朕為天子若於汝有疑雖汝弟輩在朝豈不能施行以此疑我汝實錯誤太宗諸子豈獨在汝朕為國家計也又謂之曰自來與汝相好雖有此罪貸汝性命惟不得作宰相令汝終身守汝祖先墳壠裕曰臣子既犯如此罪逆何面目見天下人但願絞死以戒其餘不忠者海陵遂以刀刺左臂取血塗裕面謂之曰汝死之後當知朕本無疑汝心裕曰久蒙陛下非常眷遇仰戀徒切自知錯繆雖悔何及海陵哭送裕出門殺之並誅遙設及馮家奴馮家奴妻豫王女也與其子榖皆與反謀並殺之遣護衛厖葛往西北路招討司誅朗及招折而屯納遏剌補皆出走捕得屯納棄市遏剌補自縊死屯納出走過河間少尹蕭之詳之詳初不知裕事留之三日屯納往之詳茶扎家茶扎遣人詣之詳告公引得之付屯納遣之他所茶扎家奴發其事吏部侍郎窊産鞫之之詳曰屯納宿二日而去法家以之詳隱其間欺尚書省罪當贖海陵怒命殺之杖窊産及議法者茶扎杖四百死厖葛殺招折等并殺無罪四人海陵不問杖之五十而已以裕等罪詔天下賞上變功懷忠遷樞密副使以白答為牌印云高藥師遷起居注進階顯武將軍藥師嘗奏裕有怨望至是賞之云胥持國字秉鈞代州繁畤人經童出身纍調博野縣丞上書者言民間冒占官地如太子務大王莊非私家所宜有部委持國按核之持國還言此地自異代已為民有不可取也事遂寢尋授太子司倉轉掌飲令兼司倉皇太子識之擢祗應司令章宗即位除宮籍副監賜宮籍庫錢五十萬宅一區俄改同簽宣徽院事工部侍郎並領宮籍監閲三月遷工部尚書使宋明昌四年拜參知政事賜孫用康榜下進士第會河決陽武持國請督役遂行尚書省事明年進尚書右丞持國為人柔佞有智術初李妃起微賤得幸於上持國久在太子宮素知上好色陰以祕術干之又多賂遺妃左右用事人妃亦自嫌門地薄欲藉外廷為重乃數稱譽持國能由是大為上所信任與妃表𩹉管擅朝政誅鄭王永蹈鎬王永中罷黜完顏守貞等事皆起於李妃持國士之好利躁進者皆趨走其門下四方為之語曰經童作相監婢為妃惡其卑賤庸鄙也承安三年御史臺劾奏右司諫張復亨右拾遺張嘉貞同知安豐軍節度使事趙樞同知定海軍節度使事張光庭戶部主事高元甫刑部員外郎張巖叟尚書省令史傅汝梅張翰裴元郭郛皆趨走權門人戲謂胥門十哲復亨嘉貞尤卑佞苟進不稱諫職俱宜黜罷奏可於是持國以通奉大夫致仕嘉貞等皆補外頃之起知大名府事未行改樞密副使佐樞密使襄治軍於北京一日上召翰林修撰路鐸問以他事因語及董師中張萬公優劣鐸曰師中附胥持國進持國姦邪小人不宜典軍馬以臣度之不惟不允人望亦必不能服軍心若回日再相必亂天下上曰人臣進退人難人君進退人易朕豈以此人復為相耶第遷官二階使之致仕耳尋卒于軍諡曰通敏後上問平章政事張萬公曰持國今已死其為人竟如何萬公對曰持國素行不純謹如貨酒平樂樓一事可知矣上曰此亦非好利如馬琪位參政私鬻省醞乃為好利也子鼎別有傳
