body:
  text: 金史卷十五本紀第十五宣宗中興定元年春正月己卯朔宋遣使來賀癸未宋使朝辭上謂宰臣曰聞息州南境有盜此乃彼界飢民沿淮為亂耳宋人何故攻我高琪請伐之以廣疆土上曰朕意不然但能守祖宗所付足矣安事外討乙未詔中都西京北京等路策論進士及武舉人權試于南京東平婆速上京等四路丙申東平行省言調兵以來吏卒因勞進爵多至五品例獲封贈及民年七十並該覃恩若人往自陳公私俱費請令本路為製誥敕類赴朝廷以求印署使受命者量輸諸物而給之人力不勞兵食少濟從之皇子平章政事濮王守純授世襲東平府路三屯猛安尚書左丞胥鼎進平章政事封莘國公癸卯議減庶官冗員乙巳大元兵攻觀州二月戊申朔初用貞祐通寶凡一貫當貞祐寶券千貫己酉命樞密院汰罷軟軍士諭尚書省用官馬給驛傳以紓民力庚戌皇后生辰詔百官免賀仍諭旨曰時方多難將來長春節亦免賀禮辛亥以崇進元帥右都監完顏賽不簽樞密院事癸丑罷招賢所乙卯皇孫生宣徽請稱賀詔無用樂己未大元兵徇欣代詔定州縣官雖積階至三品坐乏軍儲者聽行部決遣壬戌尚書省以軍儲不繼請罷州府學生釰給上曰自古文武並用向在中都設學養士猶未嘗廢況今日乎其令仍舊給之丙子議置莊獻太子廟三月戊寅敕事關刑名當面議之勿聽轉奏以絳陽軍節度使李革知平陽府兼河東南路兵馬都總管權參知政事行尚書省壬午定民間收潰軍亡馬之法及以馬送官酬直之格乙酉上宮中見蝗遣官分道督捕仍戒其勿以苛暴擾民庚寅長春節宋遣使來賀辛卯詔罷平陽河中元帥乙未先徵山東兵接應苗道潤共復中都而石海據真定叛慮為所梗乃集粘割貞郭文振武仙所部精鋭與東平軍為掎角之勢圖之己亥大元兵攻新城庚子攻霸州甲辰威州刺史武仙率兵斬石海及其黨二百餘人降葛仲趙林張立等軍盡獲海僭擬之物尋進仙權知真定府事夏四月丁未朔以宋歲幣不至命烏古論慶壽完顏賽不等經略南邊戊申孟州經略司萬戶宋子玉率所部叛斬關而出經略使從坦等追敗之庚戌花帽軍作亂于滕州詔山東行省討之南陽五𩽆山盜發衆至千餘人節度副使移剌羊哥出討遇之方城招之不從乃進擊之殺其衆殆盡癸丑以安化軍節度使完顏𧜛權元帥左都監行元帥府事督經略使苗道潤進復都城且令和輯河間招撫使移剌鐵哥等軍鐵哥與道潤不協互言其有異志故命重臣臨鎮之戊午單州雨雹傷稼詔遣官勸諭農民改蒔秋田官給其種平定州賊閻德用之黨閻顯殺德用以其衆降己未以權參知政事遼東路行省完顏阿里不孫為參知政事行尚書省元帥府于婆速路以權遼東路宣撫使蒲察五斤權參知政事行尚書省元帥府于上京庚申李革請罷義軍總領使副以畀州縣尚書省以秋防在邇改法非便姑如舊制州縣各司察之甲子元帥完顏賽不破宋兵于信陽使來奏捷乙丑濟南泰安滕兗等州賊並起侯摯遣棣州防禦使完顏霆討平之降其壯士二萬人老幼五萬人完顏賽不復奏敗宋軍于隴山等處俘馘甚衆戊辰太白晝見于井辛未權孟州經略使從坦追賊宋子玉至輝州境上其黨邢福殺子玉以衆來歸壬申以萬奴叛逆未殄詔諭遼東諸將完顏賽不軍渡淮破光州兩關獲軍實分給將士五月戊寅陝西行省破夏人于大北岔是日捷至丁亥民苑汝濟上書陳利害上以示宰臣曰卑賤小人猶能盡言如此有可采者即行之己丑賊宋子玉餘黨家屬悉放歸農尚書右丞蒲察移剌都棄官擅赴京師降知河南府事行樞密院兼行六部事壬辰延州原武縣雨雹傷稼詔官貸民種改蒔癸巳宋人攻潁州焚掠而去戊戌行樞密院兵敗宋人於泥河灣又敗之樊城縣山東行元帥府事蒙古綱擅械轉運使李秉鈞法當決秉鈞返詈綱應論贖詔兩釋之宋人取漣水縣癸卯蘭州水軍千戶李平等苦提控蒲察燕京貪暴殺之構夏人以叛脅其徒張扆俱行扆以計盡獲之陝西行省便宜遷扆官四階授同知蘭州事賞士卒有差以其事上聞甲辰大元兵下沔城縣軍官任福死之丙午定河北求仕官渡河之法曾經總兵者白樞密院餘驗據聽渡行樞密院事烏古論慶壽南伐還奏不以實詔鞫之六月己酉苗道潤表歸國人李琛復以衆叛琛亦表道潤異謀詔山東行省察之修潼關遣中使持詔及暑藥勞夫匠權參知政事張行信進參知政事庚戌捕治遼東受僞署官家屬得按察使高禮妻子皆戮之壬子制鄜坊丹州四品以下州縣官視環慶例以二十月終更甲寅招撫使惟宏言彰德府守臣擅徙民山寨避兵上曰難保之城守之何益徒傷吾民耳勿治乙卯顯宗忌日謁奠于啓慶宮丙辰詔樞密院遣經歷官分諭行院嚴兵利器以守衝要仍禁飲宴違以軍律論宋人合土寇攻東海境戊午以宋遣兵數犯境及歲幣不至詔諭沿邊罪宋己未詔凡上書人其言已采用者上其姓名辛酉以進土朱蓋草澤人李維嶽論議可取詔給八貫石俸乙丑設潼關使副及三門集津提舉官尚書左丞相兼都元帥僕散端薨輟朝置南京流泉務遼東行省遣使來上正月中敗契丹之捷秋七月丙子朔日有食之辛巳宋人圍泗州壬午圍靈璧縣癸未隩州振威軍萬戶馬寬逐其刺史李策據城叛遣使招之乃降已而復謀變州吏擒戮之夷其族甲申詔諭遼東諸路乙酉宋人襲破東海縣丙申置提舉倉場使副癸卯太社壇産嘉禾一莖十有五穗甲辰夏人犯黃鶴岔官軍敗之乙巳初置集賢院知院事同知院事等官宋人及土寇攻海州經略使擊破其衆夏人圍羊狼寨帥府發諸鎮兵擊走之八月戊申陝西行省報木波賊犯洮州敗績遁去木星晝見于昴六十有七日乃伏己酉海州經略司表官軍與宋人戰石湫南戰漣水縣戰中土橋宋兵敗績壬子削御史大夫永錫官爵有司論失律當斬上以近族特貰其死癸丑宋人攻確山縣為官軍所敗詔諭國內軍士使知宋人渝盟之故仍命大臣議其事乙卯集賢院咨議官朱蓋上書陳禦敵三策壬戌海州經略使阿不罕奴失剌敗宋人于其境提控李元與宋人戰屢捷多所俘獲徙欄通渡經略司於黃陵缸乙丑制增定擒捕逃軍賞格及居停人罪丙寅左司諫僕散毅夫乞更開封府號賜美名以尉氏縣為刺郡睢州為防禦使與鄭延二州左右前後輔京師上曰山陵在中都朕豈樂久居此乎遂止癸酉太祖忌日謁奠于啓慶宮甲戌元帥左都監承裔遣其部將納蘭記僧等合葩俄族都管尼厖古以兵掩襲瓜黎餘族諸蕃帳屢破之斬馘士卒禽其首領俘獲人畜甚多是日捷至九月丁丑更定監察御史失察法以元帥左監軍必蘭阿魯帶權參知政事行省于益都戊寅夏人犯綏德之克戎寨都統羅世暉逆擊却之己卯蔡州帥府偵宋人將窺息州以輕兵誘其進別以鋭師邀擊之虜其將沈俊壬午以改元興定赦國內甲申規運所設行六部辛卯大元兵徇隰州及汾西縣癸巳攻沁州遼東行省完顏阿里不孫為叛人伯德胡土所殺月犯東井西扇北第二星乙未大元兵攻太原簸箕掌寨丁酉薄太原城攻交城清源癸卯立沿河冰牆鹿角冬十月丁未以霖雨詔寬農民輸稅之限庚戌以將有事于宋詔帥臣整厲師徒辛亥遣官括市民馬紅賞格以示勸甲寅命高汝礪張行簡同修章宗實録息州帥府獻破宋人于中渡之捷乙卯大元兵徇中山府及新樂縣丙辰丹州進嘉禾異畝同穎辛酉制定州府司縣官失覺姦細罪壬戌右司諫兼侍御史許古上疏請先遣使與宋議和乙丑大元兵下磁州丙寅定職官不求仕及規避不赴任法高汝礪上疏言和議先發於我恐自示弱非便戊辰上命許古草通宋議和牒既進以示宰臣宰臣以其言有祈哀之意徒示微弱無足取者議遂寢辛未罷流泉務大元兵收鄒平長山及淄州壬申改郇國號為管避上嫌名高汝礪表致仕不允十一月壬午從宜移剌買奴言五𩽆山賊魚張二等若悉誅之屢詔免罪恐乖恩信且其親屬淪落宋境近在均州或相構亂乞貸其死徙之歸德睢陳鈞許間為便詔許之癸未月暈木火二星木在胃火在昴丙戌太白晝見遣翰林侍講學士楊雲翼禜之大元兵收山東濱棣博三州己丑下淄州庚寅下沂州甲午河西掬納籛納等族千餘戶來歸丁酉詔唐鄧蔡州行元帥府舉兵伐宋戊戌大元兵攻太原府庚子上謂宰臣曰朕聞百姓流亡逋賦皆配見戶人何以堪又添徵軍須錢太多亡者詎肯復業其並議除之宰臣請命行部官閲實蠲貸已代納者給以恩例或除他役或減本戶雜征四之一上曰朕於此事未嘗去懷其亟行之十二月甲辰朔大元兵攻潞州都統馬甫死之戊申即墨移風寨於大舶中得日本國太宰府民七十二人因糴遇風飄至中國有司覆驗無他詔給以糧俾還本國庚戌元帥左監軍蒲察五斤進右副元帥權參知政事充遼東行省是日大元兵平益都府辛亥陝西行省胥鼎諫伐宋不報甲寅海州經略使報提控韓璧敗宋人于鹽倉己未大元兵復攻沂州官民棄城遁辛酉下密州節度使完顏𧜛死之壬戌侯摯兼三司使庚午免逃戶復業者差賦二年春正月乙亥詔議賑恤辛巳敕南征將帥所至毋縱殺掠壬午宋人攻淮北唐州元帥府擊敗之獲統領李雄韜陳臯以歸癸未近侍局副使訛可遣使報南師之捷乙酉陝西行省獲歸國人言大元兵圍夏王城李遵頊命其子居守而出走西涼詔諭諸帥府明斥候嚴守備戊子唐鄧元帥完顏賽不報連破宋人之捷宋人攻泗州又戰却之二月癸卯宋人侵青口行樞密院遣兵敗之甲辰免中京嵩汝等州逋租諭胥鼎克宋散關可保則保不可保則焚毀而還定奴婢救主法丙午訛可敗宋人于防山紇石烈桓端亦遣使來上光州信陽之捷庚戌海州經略敗宋兵于朐山表請繼其軍儲督東平帥府發兵護送資糧以應之許州長社縣何冕等謀反伏誅辛亥張行信出為彰化軍節度使兼涇州管內觀察使壬子御史以北兵退請汰各處行樞密院元帥府冗官尚書以為非便上從尚書言仍舊制完顏賽不報棗陽之捷癸丑完顏阿鄰報皂郊堡之捷丁巳壽州行樞密院破宋人高柳橋水寨夷其寨而還壬戌訛可遣兵拔宋柵盤嶺又破其衆於裴家莊寒山嶺龍門關等處得粟二千餘石乙丑諭樞密曰中京商虢諸州軍人願耕屯田比括地授之聞徐宿軍獨不願受意謂豫田必絶其廪給也朕肯爾耶其以朕意曉之丙寅諭尚書省曰聞中都納粟官多為吏部繳駁殊不思方闕乏時利害為如何又立功戰陳人必責保官若輩皆義軍白丁豈識職官苟文牒可信即當與之至若在都時規運薪炭入城者朕嘗植恩授以官此豈容僞而間亦為所沮格其悉諭之勿復若是紇石烈牙吾塔破宋人于盱眙軍上俘獲之數己巳以侯摯行省河北兼行三司安撫司事三月庚辰尚書集文資官雜議進士之選詔依泰和例行之癸未訛可敗宋人于光化軍甲申長春節戊子諭宰臣曰舊制廷試進士日晡後出宮近欲復舊恐能文而思遲者不得盡其才其令日沒乃出以御史中丞把胡魯為參知政事陝西行六部尚書楊貞削五官纍杖一百七十解職訛可表言官軍自桐柏入宋境所向多克捷癸巳宋人爭皂郊堡擊官軍軍潰主將完顏阿鄰戰沒丙申更定京城捕告強盜官賞制辛丑上京行省蒲察五斤表左監軍哥不靄誣坊州宣撫副使紇石烈按敦將叛而殺之事下尚書省宰臣以為按敦之死徐議恤典哥不靄亦姑牢籠使之上勉從其言夏四月壬寅朔蒲察五斤表遼東便宜阿里不孫貸糧高麗不應輒以兵掠其境上命五斤遣人以詔往諭高麗使知興兵非上國意乙巳詔河南路行總管府節鎮以上官充宣差捕盜使以防禦刺史以上長二官及世襲猛安之才武者為之副又命濮王府尉完顏毛良虎為宣差提控以巡督之是日曲赦遼東等路以戶部尚書夾谷必蘭為翰林學士承旨權參知政事行省于遼東丁未承裔敗宋人于皂郊堡庚戌御史劾集賢院咨議官李維嶽本中山府無極縣進士趙孝選家奴乞正其事上曰國家用人奚擇貴賤命以官銀五十兩贖放為良任使仍舊壬子遣侍御史完顏素蘭近侍局副使訛可同赴遼東察訪叛賊萬奴事體行省侯摯督兵復密州提控朱琛復高密縣癸丑完顏素蘭請宣諭高麗復開互市從之乙卯特賜武舉溫迪罕繳住以下一百四十人及第丁巳陝西行省兵破宋雞公山取和州成州至河池縣黑谷關守者皆遁前後獲糧九萬斛錢數千萬軍實不可勝計戊午紅襖賊犯徐邳行樞密院兵大破之己未阿里不孫自潼關之敗失其所在變姓名匿居柘城為御史覺察繫其家屬將窮治之乃遣子上書詣吏待罪臺臣力請誅之以懲不忠上卒赦其罪諭以自效癸亥遣重臣審理京師寃獄丁卯河南諸郡蝗臨洮路報敗宋人之捷東平行省敗黑旗賊拔西縣渠賊李全來援併破之戊辰河北行省敗紅襖賊進至密州降僞將校數十人士卒七百人悉復其業五月辛未朔鳳翔元帥完顏閭山破宋人步落堝香爐堡諸屯甲戌招撫副使黃摑阿魯答襲破李全于莒州及日照縣之南三道擊之追奔四十里丙子夏人自葭州入鄜延元帥承立遣兵敗之馬吉峰是日捷至詔遣官督捕河南諸路蝗辛巳策論詞賦經義進士及武舉人入見賜告命章服萊州民曲貴殺節度經略使內族轉奴自稱元帥構宋人據城叛山東招撫司遣提控王庭玉招撫副使黃摑阿魯答等討平之斬僞統制白珍及牙校數十人生禽貴及僞節度使呂忠等十餘人誅之乃命庭玉保萊朱琛保密阿魯答保寧海以安輯其民丙戌陝西行省言四月中鞏州行元帥承裔遣提控烏古論長壽納蘭記僧分道伐宋長壽出鹽川鎮記僧出鐵城堡皆克捷而還辛卯壽州行樞密院南城軍攻辛城鎮一軍趣史河與宋人戰勝之壬辰河北行省復黃縣乙未第鳳翔秦鞏三道南征將士功各遷其官丙申增隨朝官及諸承應人俸戊戌陝西行省連報承裔等入宋境之捷己亥大元兵徇錦州元帥劉仲亨死之庚子陝州羣狼傷百餘人立賞募人捕殺六月甲辰樞密院言諸道表稱大元集兵應州飛狐將分道南下觀其意不在河北而在陝西河東各路義士土兵蕃漢弓箭手宜於農隙教閲以備緩急東平單州衝要豫徙其農民糧畜置可守之城修近城水寨因以為固潼谷遠連商虢宜令兩帥府選官按視厄塞又言賈瑀等刺殺苗道潤乞治瑀等專殺之罪餘州郡各以正職授頭目使分治一方上諭之曰道潤之衆亟收集之瑀等是非未明姑置勿問諸頭目各制一方利害至重更審處之石州賊馮天羽衆數千據臨泉縣為亂帥府命將討捕之為賊所敗旁郡縣將謀應之州刺史紇石烈公順赴以兵天羽等數十人迎降公順殺之餘賊走保積翠山遣將王九思攻之不下詔國史院編修官馬季良持告敕金幣往招之比至九思先破柵殺賊二千人餘復走險已而其黨安國用等詣季良降者五千餘人就署國用同知孟州防禦使事以次遷擢有差分其衆于絳霍間丁未以參知政事把胡魯權左副元帥與平章政事胥鼎協力防秋己酉苗道潤所部軍請隸潞州元帥府詔河北行省審處之壬子紅襖賊犯沂州官軍敗之追至白里港都提控齊信沒於陳詔有司議贈恤丙辰遣監察御史粘割梭失往河中絳解等郡同守土官商度可保城池丁巳上以久旱諭宰臣治京獄寃因及京城小民中納石炭既給其價御史劾以過請官錢並繫之獄有論至極刑者欲悉從寬宥何如高琪對不然遂止壬戌御史言戶部員外郎臧伯升供億息州偶遇官軍戰勝亦冒遷一官乞論其罪上曰軍前如此者何止伯升今遽見罪餘皆不安且詰所從來勢連及帥府多故之秋豈為一官遂忘大計但令釐正之癸亥遣高汝礪徒單思忠禱雨秋七月庚午朔日有食之辛未詔賞南伐將士有差夏人犯龕谷提控夾谷瑞及其副趙防擊走之甲戌以旱災詔中外己卯遣官望祀嶽鎮海瀆于北郊享太廟祭太社太稷祭九宮貴神于東郊以禱雨遣太子太保阿不罕德剛禮部尚書楊雲翼分道審理寃獄癸未大雨太子親王百官表請御正殿復常膳庚寅擇明幹官提控銓選無違失者與升擢令譯史不任事者驗已歷俸月放滿別選能者甲午夏人復犯龕谷夾谷瑞大破之用點檢承玄言遣官詣諸道選寄居守闕丁憂官及親軍入仕才堪總兵者得一百六人付樞密任使八月庚子朔河北行省以苗道潤軍隸涿州刺史李瘸驢副以張甫張柔戊申敕親軍百戶以下授職待闕者給本俸仍充役俟當赴任遣之己酉詔河北行省完顏霆進軍援山東招撫使田琢自今將士立功聽琢先賞以聞大元遣木華里等帥步騎數萬自太和嶺徇河東乙卯大元兵收代州辛酉棣州提控紇石烈醜漢討賊張聚大破其衆復濱棣二州姦人李宜伏誅禁北歸民渡河戊辰大元兵收隰州九月乙亥下太原府元帥左監軍兼知樞府事烏古論德升死之丙戌諭皇太子曰軍務之速動關機會悉從中覆則或稽緩自今有當亟行者先行後聞以戶部尚書納合蒲剌都為元帥右監軍行元帥府事于潞州戊子置秦關等處九守禦使命完顏蒲察等分戍諸厄議遷海州侯摯言不便止大元兵徇汾州節度使兀顏訛出虎死之庚寅李全破密州執招撫副使黃摑阿魯答同知節度使夾谷寺家奴辛卯大元兵下孝義縣乙未設隨處行六部官以京府節鎮長官充尚書次侍郎郎中員外郎防刺長官侍郎次郎中員外郎主事勾當官聽所屬任使州府官並充勸農事防刺長官及京府節鎮同知以下充副使丙申李全破壽光縣冬十月甲辰李全破鄒平縣戊申破臨朐縣己酉大元兵徇絳潞壬子攻平陽提控郭用死之癸丑下平陽知府事權參知政事行尚書省李革及從坦死之甲寅權平定州刺史范鐸以棄城伏誅詔諸郡録囚官凡坐軍期者皆奏讞山東路轉運副使兼同知沂州防禦使程戩及邳州副提控王汝霖等通宋人為變伏誅宋人攻漣水縣提控劉瑛敗之丁巳大元兵攻澤州戊午尚書省言獲姦細叛亡率多僧道詔沿邊諸州惟本處受度聽依舊居止來自河北山東遣入內郡譏其出入己未李全據安丘提控王政屯昌樂俟王庭玉兵同進討宣差太府少監伯德玩擅率政兵攻全為全所敗提控王顯死焉田琢上言乞正玩罪癸亥月犯軒轅左角之少民星甲子詔河東北路欣代寧化東勝諸州並受嵐州帥府節制十一月庚午大赦庚辰御登賢門召致政舊臣賜食訪以時政得失辛巳以行元帥府紇石烈桓端權簽樞密院事行院于徐州權右都監訛可行元帥府事于息州甲申詔河東南路隰吉等州聽絳州元帥府節制大元兵收潞州元帥右監軍納合蒲剌都參議官修起居注王良臣死之戊子龕谷提控夾谷瑞敗夏人于質孤堡河北行省報海州之捷壬辰定經兵州縣職官子孫非本貫理蔭及過期不蔭等格丙申大元兵下太原之韓村寨定京師失火法十二月己亥朔以御史中丞完顏伯嘉權參知政事元帥左監軍行河中府尚書省元帥府控制河東南北路便宜從事升絳州為晉安府總管河東南路兵降平陽為散府辛丑簽樞密院事蒲察移剌都伏誅壬寅前山東西路轉運使致仕移剌福僧上章言時事癸卯詔大理卿溫迪罕達權同簽樞密院事行院于許州甲辰以誅移剌都詔中外乙巳命徒單思忠祈雪已而大雪甲寅以開封府治中呂子羽等使宋講和紅襖賊攻彭城之胡材寨徐州兵討敗之乙卯以禮部侍郎抹撚胡魯剌為汾陽軍節度使權元帥右監軍與嵐州元帥古里甲石倫完復河東丁巳籍瀕河掃兵癸亥尚書省言樞密掌天下兵皇太子撫軍而諸道又設行院其有功及失律者須白院啓東宮至於奏可然後誅賞有司但奉行而已自今軍中號令關賞罰者皆明注詔旨教令毋容軍司售其姦欺上從之以樞密副使駙馬都尉僕散安貞為左副元帥權參知政事行尚書省元帥府事伐宋甲子上諭旨有司京師丐食死於祁寒朕甚憫之給以後苑竹木令居獲燠所三年春正月庚午呂子羽至淮宋人不納而還詔伐宋丙子稅民種地畝議行均輸戊寅敕和市邊城軍需無至配民定鎮戍征行軍官減資歷月日格壬午大雪上聞東掖有撤瓦聲問左右知為丁夫葺器物庫廡舍上惻然諭主者曰雪寒役人不休可乎姑止之丙戌紇石烈牙吾塔上濠州香山村之捷丁亥諭宣徽皇后生日免百官賀壬辰以大元兵已定太原河北事勢非復向日集百官議備禦長久之計伐宋捷至上謂侍臣曰此事豈得已哉近日遣使實欲講和彼既不從安得不用兵也免單丁民戶月輸軍需錢甲午有司請立價以買南征軍士所獲馬上恐失衆心因至敗事不聽乙未敕尚書省自今六部禀議常事但可再送不得趣召辨正餘應入法寺定斷而再送猶未當者具以聞下吏治之宰相執政以下皆不得召部寺官部寺官亦不得詣省犯者論違制丁酉鄧州元帥府提控婁室有罪減死削爵二月庚子上與太子謀南征帥不得其人歎曰天下之廣緩急無可使者朕安得不憂紇石烈牙吾塔敗宋人于滁甲辰胥鼎言軍中誅賞近制須聞朝廷賞由中出示恩有歸可部分失律主將不得即治其罪不可詔尚書樞密雜議宰臣請城守野戰將校有罪從七品以下許便宜決罰餘悉奏裁上曰七品以下財令治之將權太輕或至誤事自今四品以下聽決乙巳攻宋光山縣俘其統制蔡從定等光州以兵來援復敗之丙午上謂宰臣江淮之人號稱選磱然官軍攻蔓菁其衆困甚脅之使降無一肯從者我家河朔州郡一遇北警往往出降此何理也丁未敕凡立功將士有居喪者特起復遷授戊申拔宋小江寨殺其統制王大蓬己酉取宋武休關庚戌元帥左都監承立以綏德保安之境各獲夏人統軍司文移來上其辭雖涉不遜而皆有保境息民之言詔尚書省議之宰臣言鎮戎靈平等鎮近耗夏人數犯疆埸此文正緩我耳宜嚴備禦以破姦計上然其言又曰頃近侍還自陝西謂白撒已得鳳州如得武休關將遂取蜀朕意殊不然假令得之亦何可守此舉蓋為宋人渝盟初豈貪其土地耶朕重惜生靈惟和議早成為佳耳高汝礪乞致事優詔不允甲寅詔陝西行省從七品以下官許注擬有罪許決罰丁憂待闕隨宜任使軍官徙以上罪及軍事怠慢者巡按御史治之己未行省安貞入宋境破梁縣等軍擒統制李申之右副元帥完顏賽不左都監牙吾塔白石關平山寨之捷俱至三月丁卯朔陝西兵破宋虎頭關取興元洋州捷至上大悅庚午破宋人于七口倉甲戌高麗先請朝貢因遣使撫諭之使還表言道路不通俟平定後議通款命行省姑示羈縻勿絶其好戊寅蔡州行元帥府右都監完顏合達破宋人于梅林關擒統制張時己卯長春節免朝賀提控奧屯吾里不敗宋人于上津縣軍還至濠州宋人來拒牙吾塔擊走之乙酉河南路節鎮以上立軍器庫設使副各一員防刺郡設都監同監各一員完顏合達敗宋人于馬嶺堡丙戌行省安貞破宋人于石堌山己丑追賜皇后父太尉汴國公彥昌姓溫敦庚寅攻宋麻城縣拔之獲其令張倜等辛卯行省安貞破宋兵于塗山壬辰賽不敗宋兵于老口鎮又敗宋人于石鶻崖甲午録用罪廢官副元帥蒲察阿里不孫御史大夫永錫等七十人詔太原等路州縣闕正授官令民推其所愛為長從行省量與職任及運解鹽入陝西以濟調度命胥鼎兼領其事閏三月丙申朔申明屠宰牛罪律以雄霸以東付權中都經略李瘸驢易州以西付權中都西路經略靖安民治之遙授金安軍節度使完顏和尚故行軍副提控夾古吾典皆除名庚子皇子平章政事濮王守純進封英王壬寅叛賊王公喜構宋人取沂州甲辰以沂國公主薨輟朝丙午給空名宣敕及金銀符付嵐州帥古里甲石倫許便宜遷注以招脅從丁未諭樞密院議晉安東平河中諸郡備兵之策庚戌行省左副元帥僕散安貞至自軍前入見于仁安殿辛亥少府少監粘割梭失言利害七事甲寅以南伐師還罷南邊州郡籍民為兵者戊午夏人破葭州之通秦寨刺史紇石烈王家奴戰沒壬戌治書侍御史蒲魯虎上書請選太子師傅甲子胥鼎等各遷官賞南伐之功夏四月丙寅朔裕宿等州置元帥府選陝西步騎精鋭六千人實京兆戊辰選精鋭六萬分屯平凉涇邠乾耀等州庚午以秦州防禦使女奚烈古里間行元帥府于平涼罷募民運解鹽築京師𩹉城命侯摯董役高琪總監之甲戌以知臨洮府事石盞合喜為元帥左都監行元帥府事于鞏州壬午遣近侍四人巡視築城丁夫時其飲食聽其更休督吏慘酷悉禁止之癸未陝西黑風晝起有聲如雷地大震甲申詔河北州縣官止令土著推其所愛者充朝廷已授者別議任使乙酉夏人據通秦寨提控納合買住擊敗之己丑林州都統霍成以疑二誣殺降人論罪當死元帥惟良不欲以殺敵人誅邊將請寬其罰仍請立護送降民賞格以杜後患上為之赦成而命有司班賞格焉護送十人以上至者遷一官不及者每名賞錢二百緡五十人以上兩官百人以上兩官雜班任使庚寅以時暑詔朝臣四日一奏事高汝礪請備防秋之糧宜及年豐於河南州郡驗直立式募民入粟上與議定其法而行之同提舉榷貨司王三錫請榷油歲可入銀數萬兩高琪主之衆以為不便遂止辛卯夏人犯通秦寨元帥完顏合達出兵安塞堡以搗其巢至隆州夏人逆戰官軍擊之衆潰進薄城俄陷其西南隅會日暮還壬辰以同知平陽府事胡天作充便宜招撫使五月乙未朔鳳翔元帥府遣兵敗宋人于黃牛等堡壬子太白晝見于參六月甲子朔時暑給修城夫病者藥餌遣諭元帥合達曰以卿幹局故有唐鄧之委或有侵軼戰退不宜遠追第固吾圉以驃騎上將軍河南路統軍使石盞女魯歡為元帥右都監行平涼元帥府事詔付遼東等處行省金銀符及空名宣敕聽便宜處置壬申制沿河戍兵逃亡罪並同征行軍人例詔御史中丞完顏伯嘉行樞密院于許州甲戌定防秋將校擊毬飲燕之罰李全寇日照博興紇石烈萬奴敗之寇即墨完顏僧壽又敗之復萊州戊寅詔陝西簽軍如河南例曲赦河東南北路丁亥命防禦使徒單福定等帥所部義軍與沂州民老幼盡徙于邳戊子遼州總領提控唐括狗兒帥師復太原府平凉等處地震詔右司諫郭著撫諭其軍民秋七月丁酉籍邳海等州義軍及脅從歸國而充軍者人給地三十畝有力者五十畝仍蠲差稅日支糧二升號決勝軍戊戌上進樞密臣僚諭之曰𩹉城久未畢功尚書欲增調民朕慮妨農況糧儲不繼將若之何盍改圖之樞臣言是役之興實為大計今功已過半偶值霖潦成功差遲尚書議增丁夫勢必驗口不令妨業比及防秋當告成矣上曰卿等善為計畫無貽朕憂庚子以地震曲赦陝西路甲辰置京東西南三路行三司乙卯曲赦山東西路丁巳遣徒單思忠以地震祭地祇于上清宮八月丙寅補闕許古等削官解職丁卯木星犯輿鬼東南星戊辰遣禮部尚書楊雲翼祭社稷翰林侍讀學士趙秉文祭后土于河中府京西行三司李復亨言汝鄧冶鐵河南北食鹽之利木星晝見于柳百有九日乃滅壬申上敕臺臣朕處分尚書事或至數日不奉行及再問則巧飾次第以對大臣容有遺忘左右司玩弛臺臣當糾今後復爾併罪卿等乃定御史上下半月勾檢省中制敕文字大元兵下武州軍事判官郭秀死之丁丑緩在京差徭中山治中王善殺權知府事李仲等以叛大元兵下合河縣縣令喬天翼等死之乙酉命樞密遣官簡嶺外諸軍之武健者養之彰德邢洺衛濬懷孟等城弱者罷遣戊子敕侯摯諭三司行部官勸民種麥無種粒者貸之九月甲午詔單州經略使完顏仲元屯宿州與右都監紇石烈德同行帥府事丙申唐州從宜夾谷天成敗宋人于桐柏丁酉尚書省請申命侯摯廣營積貯上不許曰徵斂已多今更規畫不過復取於民耳防秋稍緩當量減戍兵用度幸足何至是耶甲辰大元兵徇東勝州節度使伯德窊哥死之庚戌命行省胥鼎領兵赴河中壬子真定招撫使武仙請給金銀符賞有功從之沿河造戰艦付行院帥府冬十月癸亥朔定保舉縣令能否升黜舉主制乙丑用蒙古綱言招集義軍各置都統副統等官如貞祐三年制平凉府先以地震被命醮祭方行事慶雲見以圖來上遣官覆驗得實是日百官奉表稱賀丁卯以完顏開權元帥左都監郭文振權右都監並行元帥府事謀復太原壬申定贓吏計罪以銀為則癸酉以慶雲遣官告太廟甲戌以慶雲詔國內己卯大元兵次單州境詔諸路民應遷避兵而不欲者亟遣人以利害曉之癸未𩹉城畢工百官稱賀宴宰臣便殿遷右丞摯官一階賜右丞相琪左丞汝礪參知政事思忠金鼎各一重幣三是役上慮擾民募人能致甓五十萬者遷一官百萬仍升一等平陽判官完顏阿剌左廂譏察霍定和發宋蔡京故居得二百萬有奇准格遷賞甲申宰臣請以𩹉城之功建碑會朝門從之丁亥大元兵屯綿上壬辰命有司葺閒舍給薪米以濟貧民期明年二月罷俟時平則贍之以為常十一月癸巳朔前嵐州倉使張祐自夏國來歸以樞密副使僕散安貞同簽院事訛可行院事于河北乙未以官驢借朝士之無馬者乘之仍給芻豆己亥大元兵徇彰德府辛丑詔朝官七品外路六品以上官二歲舉縣令一人戶部令史蘇唐催租封丘期限迫促民有生刈禾輸租者上聞之遣吏按問杖唐五十縣令高希隆減二等尚書以希隆罰輕上曰使臣至外路自非至剛者孰能不從其依前詔甲寅徐州總領納合六哥大破紅襖賊于狄山禮部郎中抹撚胡魯剌上疏言時事丁巳右丞相高琪下獄泰安軍副使張天翼為賊張林所執以歸宋縶之楚州至是逃歸授睢州刺史超兩官進職一等戊午大元兵平晉安府行元帥府事工部尚書粘割貞死之十二月誅高琪
