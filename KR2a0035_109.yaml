body:
  text: 金史卷一百九列傳第四十七完顏素蘭陳規許古完顏素蘭一名翼字伯揚至寧元年策論進士也貞祐初纍遷應奉翰林文字權監察御史二年宣宗遷汴留皇太子於燕都既而召之素蘭以為不可平章高琪曰主上居此太子宜從且汝能保都城必完否素蘭曰完固不敢必但太子在彼則聲勢俱重邊隘有守則都城可無虞昔唐明皇幸蜀太子實在靈武蓋將以繫天下之心也不從竟召太子從七月車駕至汴素蘭上書言事略曰昔東海在位信用讒諂疏斥忠直以致小人日進君子日退紀綱紊亂法度益隳風折城門之關火焚市里之舍蓋上天垂象以警懼之也言者勸其親君子遠小人恐懼修省以答天變東海不從遂至亡滅夫善救亂者必迹其亂之所由生善革弊者必究其弊之所自起誠能大明黜陟以革東海之政則治安之效可指日而待也陛下龍興不思出此輒議南遷詔下之日士民相率上章請留啓行之日風雨不時橋梁數壞人心天意亦可見矣此事既往豈容復追但自今尤宜戒慎覆車之轍不可引轅而復蹈也又曰國家不可一日無兵兵不可一日無食陛下為社稷之計宮中用度皆從貶損而有司復多置軍官不恤妄費甚無謂也或謂軍官之衆所以張大威聲臣竊以為不然不加精選而徒務其多緩急臨敵其可用乎且中都惟其糧乏故使車駕至此稍獲安地遂忘其危而不之備萬一再如前日未知有司復請陛下何之也三年正月素蘭自中都計議軍事回上書求見乞屏左右上遣人諭之曰屏人奏事朕固常爾近以遊茂因緣生疑間之語故凡有所引見必令一近臣立侍汝有封章亦無患不密也尋召至近侍局給紙劄令書所欲言書未及半上出御便殿見之悉去左右惟近侍局直長趙和和在焉素蘭奏曰臣聞興衰治亂有國之常在所用之人如何耳用得其人雖衰亂尚可扶持一或非才則治安亦亂矣向者辭軍之變中都帥府自足勦滅朝廷乃令移剌塔不也等招誘之使帥府不敢盡其力既不能招愈不可制矣至於伯德文哥之叛帥府方議削其權而朝廷傳旨俾領義軍文哥由是益肆改除之令輒拒不受不臣之狀亦顯矣帥府方且收捕而朝廷復赦之且不令隸帥府國家付方面於重臣乃不信任顧養叛賊之姦不知誰為陛下畫此計者臣自外風聞皆平章高琪之意惟陛下裁察上曰汝言皆是文哥之事朕所未悉誠如所言朕肯赦之乎且汝何以知此事出於高琪素蘭曰臣見文哥牒永清副提控劉溫云所差人張希韓至自南京道副樞平章處分已奏令文哥隸大名行省勿復遵中都帥府約束溫即具言於帥府然則罪人與高琪計結明矣上頷之素蘭續奏曰高琪本無勳勞亦無公望向以畏死故擅誅胡沙虎蓋出無聊耳一旦得志妬賢能樹姦黨竊弄國權自作威福去歲都下書生樊知一者詣高琪言辭軍不可信恐終作亂遂以刀杖決殺之自是無復敢言軍國利害者宸聰之不通下情之不達皆此人罪也及辭軍為變以黨人塔不也為武寧軍節度使往招之已而無成則復以為武衛軍使塔不也何人且有何功而重用如此以臣觀之此賊變亂紀綱戕害忠良實有不欲國家平治之意昔東海時胡沙虎跋扈無上天下知之而不敢言獨臺官烏古論德升張行信彈劾其惡東海不察卒被其禍今高琪之姦過於胡沙虎遠矣臺諫職當言責迫於凶威噤不敢忤然內外臣庶見其恣橫莫不腕切齒欲一剚刃陛下何惜而不去之耶臣非不知言出而患至顧臣父子迭仕聖朝久食厚祿不敢偷安惟陛下斷然行之社稷之福也上曰此乃大事汝敢及之甚善素蘭復奏丞相福興國之勳舊乞召還京以鎮雅俗付左丞彖多以留後事足矣上曰如卿所言二人得無相惡耶素蘭曰福興彖多同心同德無不協者上曰都下事殷恐丞相不可輟素蘭曰臣聞朝廷正則天下正不若令福興還以正根本上曰朕徐思之素蘭出上復戒曰今日與朕對者止汝二人慎無泄也厥後上以素蘭屢進直言命再任監察御史四年三月言臣近被命體問外路官廉幹者擬不差遣若懦弱不公者罷之具申朝廷別議擬注臣伏念彼懦弱不公之人雖令罷去不過止以待闕者代之其能否又未可知或反不及前官蓋徒有選人之虛名而無得人之實迹古語曰縣令非其人百姓受其殃今若後官更劣則為患滋甚豈朝廷恤民之意哉夫守令治之本也乞令隨朝七品外路六品以上官各舉堪充司縣長官者仍明著舉官姓名他日察其能否同定賞罰庶幾其可議者或以閡選法紊資品為言是不知方今之事與平昔不同豈可拘一定之法坐視斯民之病而不權宜更定乎詔有司議行之時哀宗為皇太子春宮所設師保贊諭之官多非其人於是素蘭上章言臣聞太子者天下之本也欲治天下先正其本正本之要無他在選人輔翼之耳夫生于齊者能齊言而不能楚語未習之故也人之性亦在夫習之而已昔成王在襁褓中即命周召以為師保戒其逸豫之心告以持守之道終之功光文武垂休無窮欽惟陛下順天人之心預建春宮皇太子仁孝聰明出于天資總制樞務固已綽然有餘儻更選賢如周召之儔者使之夾輔則成周之治不足侔矣上稱善未幾擢為內侍局直長尋遷諫議大夫進侍御史興定二年四月以蒲鮮萬奴叛遣素蘭與近侍局副使內族訛可同赴遼東詔諭之曰萬奴事竟不知果何如卿等到彼當得其詳然宜止居鐵山若復遠去則朕難得其耗也又曰朕以訛可性頗率易故特命卿偕行每事當詳議之素蘭將行上言曰臣近請宣諭高麗復開互市事聞以詔書付行省必蘭出若令行省就遣諭之不過鄰境領受恐中間有所不通使聖恩不達於高麗高麗亦無由知朝廷本意也況彼世為藩輔未嘗闕臣子禮如遣信使明持恩詔諭之貸糧開市二者必有一濟苟俱不從則其曲在彼然後別議圖之可也上是其言於是遣典客署書表劉丙從行及還授翰林待制正大元年正月詔集羣臣議修復河中府素蘭與陳規等奏其未可語在規傳是月轉刑部郎中時南陽人布陳謀反坐繫者數百人司直白華言於素蘭曰此獄詿誤者多新天子方務寬大他日必再詔推問比得昭雪死於榜笞之下者多矣素蘭命華及檢法邊澤分別當死當免者素蘭以聞止坐首惡及擬偽將相者數人餘悉釋之八月權戶部侍郎二年三月授京西司農卿俄改司農大卿轉御史中丞七年七月權元帥右都監參知政事行省於京兆未幾遷金安軍節度使兼同華安撫使既而召還朝行至陝被圍久之亡奔行在道中遇害素蘭蒞官以修謹得名然苛細不能任大事較之輩流頗可稱自擢為近侍局直長每進言多有補益其居父喪不飲酒廬墓三年時論以為難陳規字正叔絳州稷山人明昌五年詞賦進士南渡為監察御史貞祐三年十一月上章言參政侯摯初以都西立功獲不次之用遂自請鎮撫河北陛下遽授以執政蓋欲責其報效也既而盤桓西山不能進退及召還闕自當辭避乃恬然安居至於按閲倉庫規畫榷酤豈大臣所宜親方今疆土日蹙將帥乏人士不選練冗食猥多守令貪殘百姓流亡盜賊滋起災變不息則當日夜講求其故啓告陛下者也而摯未嘗及之伏願陛下特賜省察量其才分別加任使無令負天下之謗不報又言警巡使馮祥進由刀筆無他才能第以慘刻督責為事由是升職恐長殘虐之風乞黜退以勵餘者詔即罷祥職且諭規曰卿知臣子之分敢言如此朕甚嘉之四年正月上言伏見沿河悉禁物斛北渡遂使河北艱食人心不安昔秦晉為讎一遇年飢則互輸之粟今聖主在上一視同仁豈可以一家之民自限南北坐視困餒而不救哉況軍民效死禦敵使復乏食生亦何聊人心一搖為害不細臣謂宜於大陽孟津等渡委官閲視過河之物每石官收不過其半則富有之家利其厚息輻湊而往庶幾公私俱足宰執以河南軍儲為重詔兩渡委官取其八二以與民至春澤足大兵北還乃依規請制可三月上言臣因巡按至徐州去歲河北紅襖盜起州遣節度副使紇石烈鶴壽將兵討之而乃大掠良民家屬為驅甚不可也乞明敕有司凡鶴壽所虜俱放免之餘路軍人有掠本國人為驅者亦乞一體施行庶幾河朔有所係望上恩無有極已事下尚書省命徐州歸德行院拘括放之有隱匿者坐掠人為奴婢法仍許諸人告捕依令給賞被虜人自訴者亦賞之四月上言河北瀕河州縣率距一舍為一寨籍居民為兵數寨置總領官一人並以宣差從宜為名其人大抵皆間官義軍之長偏裨之屬尤多無賴輩徵逐宴飲取給于下日以為常及敵至則伏匿不出敵去騷擾如初此輩小人假以重柄朝廷號令威權無乃太輕乎臣謂宜皆罷之第委宣撫司從宜措畫足矣制可七月上章言陛下以上聖寬仁之姿當天地否極之運廣言路以求至論雖狂妄失實者亦不坐罪臣忝耳目之官居可言之地苟為緘默何以仰酬洪造謹條陳八事願不以人微而廢之即無可採乞放歸山林以懲尸祿之罪一曰責大臣以身任安危今北兵起自邊陲深入吾境大小之戰無不勝捷以致神都覆沒翠華南狩中原之民肝腦塗地大河以北莽為盜區臣每念及此驚怛不已況宰相大臣皆社稷生靈所繫以安危者豈得不為陛下憂慮哉每朝奏議不過目前數條特以碎末互生異同俱非救時之急者況近詔軍旅之務專委樞府尚書省坐視利害泛然不問以為責不在己其於避嫌周身之計則得矣社稷生靈將何所賴古語云疑則勿任任則勿疑又曰謀之欲衆斷之欲獨陛下既以宰相任之豈可使親其細而不圖其大者乎伏願特出睿斷若軍伍器械常程文牘即聽樞府專行至于戰守大計征討密謀皆須省院同議可否則為大臣者知有所責而天下可為矣二曰任臺諫以廣耳目人主有政事之臣有議論之臣政事之臣者宰相執政和陰陽遂萬物鎮撫四夷親附百姓與天子經綸於廟堂之上者也議論之臣者諫官御史與天子辨曲直正是非者也二者豈可偏廢哉昔唐文皇制中書門下入閣議事皆令諫官隨之有失輒諫國朝雖設諫官徒備員耳每遇奏事皆令回避或兼他職或為省部所差有終任不覿天顏不出一言而去者雖有御史不過責以糾察官吏照刷案牘巡視倉庫而已其事關利害或政令更革則皆以為機密而不聞萬一政事之臣專任胸臆威福自由或掌兵者以私見敗事機陛下安得而知之伏願遴選學術博通曉世務骨鯁敢言者以為臺諫凡事關利害皆令預議其或不當悉聽論列不許兼職及充省部委差苟畏徇不言則從而黜之三曰崇節儉以答天意昔衛文公乘狄人滅國之餘徙居楚丘才革車三十兩乃躬行儉約冠大帛之冠衣大布之衣季年致騋牝三千遂為富庶漢文帝承秦項戰爭之後四海困窮天子不能具鈞駟乃示以敦朴身衣弋綈足履革舄未幾天下富安四夷咸服國家自兵興以來州縣殘毀存者復為土寇所擾獨河南稍完然大駕所在其費不資舉天下所奉責之一路顧不難哉賴陛下慈仁上天眷佑蝗災之餘而去歲秋禾今年夏麥稍得支持夫應天者要在以實行儉者天必降福切見宮中及東宮奉養與平時無異隨朝官吏諸局承應人亦未嘗有所裁省至於貴臣豪族掌兵官莫不以奢侈相尚服食車馬惟事紛華今京師鬻明金衣服及珠玉犀象者日增於舊俱非克己消厄之道願陛下以衛文公漢文帝為法凡所奉之物痛自撙節罷冗員減浮費戒豪侈禁戢明金服飾庶皇天悔禍太平可致四曰選守令以結民心方今舉天下官吏軍兵之費轉輸營造之勞皆仰給河南陝西加之連年蝗旱百姓荐飢行賑濟則倉廩懸乏免征調則用度不足欲其實惠及民惟得賢守令而已當賦役繁殷期會促迫之際若措畫有方則百姓力省而易辦一或乖謬有不勝其害者況縣令之弊無甚于今由軍衛監當進納勞效而得者十居八九其桀黠者乘時貪縱庸懦者權歸猾吏近雖遣官廉察治其姦濫易其疲軟然代者亦非選擇所謂除狼得虎也伏乞明敕尚書省公選廉潔無私才堪牧民者以補州府官仍清縣令之選及責隨朝七品外任六品以上官各保堪任縣令者一員如他日犯贓並從坐其資歷已係正七品及見任縣令者皆聽寄理俟秩滿升遷復令監察以時巡按有不法及不任職者究治之則實惠及民而民心固矣五曰博謀羣臣以定大計比者徙河北軍戶百萬餘口于河南雖革去冗濫而所存猶四十二萬有奇歲支粟三百八十餘萬斛致竭一路終歲之斂不能贍此不耕不戰之人雖無邊事亦將坐困況兵事方興未見息期耶近欲分布沿河使自種殖然遊惰之人不知耕稼羣飲賭博習以成風是徒煩有司徵索課租而已舉數百萬衆坐糜釰給緩之則用闕急之則民疲朝廷惟此一事已不知所處又何以待敵哉是蓋不審於初不計其後致此誤也使初遷時去留從其所願則欲來者是足以自贍之家何假官釰其留者必有避難之所不必強遣當不至今日措畫之難古昔人君將舉大事則謀及乃心謀及卿士庶人卜筮乞自今凡有大事必令省院臺諫及隨朝五品以上官同議為便六曰重官賞以勸有功陛下即位以來屢沛覃恩以均大慶不吝官爵以激人心至有未滿一任而併進十級承應未出職而已帶驃騎榮祿者冗濫之極至于如此復開鬻爵進獻之門然則被堅執鋭效死行陳者何所勸哉官本虛名特出於人主之口而天下之人極意趨慕者以朝廷愛重耳若不計勳勞朝授一官暮升一職人亦將輕之而不慕矣已然之事既不可咎伏願陛下重惜將來無使公器為尋常之具功賞為僥幸所乘又今之散官動至三品有司艱於遷授宜於減罷八資內量增階數易以美名庶幾歷官者不至于太驟而國家恩權不失之太輕矣七曰選將帥以明軍法夫將者國之司命天下所賴以安危者也舉萬衆之命付之一人呼吸之間以決生死其任顧不重歟自北兵入境野戰則全軍俱殃城守則闔郡被屠豈皆士卒單弱守備不嚴哉特以庸將不知用兵之道而已古語云三辰不軌取士為相四夷交侵拔卒為將今之將帥大抵先論出身官品或門閥膏粱之子或親故假託之流平居則意氣自高遇敵則首尾退縮將帥既自畏怯士卒夫誰肯前又居常裒刻納其饋獻士卒因之以擾良民而莫可制及率之應敵在途則前後亂行頓次則排門擇屋恐逼小民恣其求索以此責其畏法死事豈不難哉況今軍官數多自千戶而上有萬戶有副統有都統有副提控十羊九牧號令不一動相牽制切聞國初取天下元帥而下惟有萬戶所統軍士不下數萬人專制一路豈在多哉多則難擇少則易精今之軍法每二十五人為一謀克四謀克為一千戶謀克之下有蒲輦一人旗鼓司火頭五人其任戰者才十有八人而已又為頭目選其壯健以給使令則是一千戶所統不及百人不足成其隊伍矣古之良將常與士卒同甘苦今軍官既有俸釰又有券糧一日之給兼數十人之用將帥則豐飽有餘士卒則飢寒不足曷若裁省冗食而加之軍士哉伏乞明敕大臣精選通曉軍政者分詣諸路編列隊伍要必五十人為一謀克四謀克為一千戶五千戶為一萬戶謂之散將萬人設一都統謂之大將總之帥府數不足者皆併之其副統副提控及無軍虛設都統萬戶者悉罷省仍敕省院大臣及內外五品以上各舉方略優長武勇出衆材堪將帥者一二人不限官品以充萬戶以上都統元帥之職千戶以下選軍中有謀略武藝為衆所服者充申明軍法居常教閲必使將帥明於奇正虛實之數士卒熟于坐作進退之節至于弓矢鎧仗須令自負習於勞苦若有所犯必刑無赦則將帥得人士氣日振可以待敵矣八曰練士卒以振兵威昔周世宗常曰兵貴精而不貴多百農夫不能養一戰士奈何朘民脂膏養此無用之卒苟健懦不分衆何以勸因大搜軍卒遂下淮南取三關兵不血刃選練之力也唐魏徵曰兵在以道御之而已御壯健足以無敵于天下何取細弱以增虛數比者凡戰多敗非由兵少正以其多而不分健懦故為敵所乘懦者先奔健者不能獨戰而遂潰此所以取敗也今莫若選差習兵公正之官將已籍軍人隨其所長而類試之其武藝出衆者別作一軍量增口糧時加訓練視等第而賞之如此則人人激厲爭效所長而衰懦者亦有可用之漸矣昔唐文皇出征常分其軍為上中下凡臨敵則觀其強弱使下當其上而上當其中中當其下敵乘下軍不過奔逐數步而上軍中軍已勝其二軍用是常勝蓋古之將帥亦有以懦兵委敵者要在預為分別不使混淆耳上覽書不悅詔付尚書省詰之宰執惡其紛更諸事謂所言多不當於是規惶懼待罪詔諭曰朕始以規有放歸山林之語故令詰之乃辭以不識忌諱意謂朕惡其言而怒也朕初無意加罪其令御史臺諭之尋出為徐州帥府經歷官正大元年召為右司諫數上章言事尋權吏部郎中時詔羣臣議修復河中府規與楊雲翼等言河中今為無人之境陝西民力疲乏修之亦不能守不若以見屯軍士量力補治待其可守即修之未晚也從之未幾坐事解職初吏部尚書趙伯成坐銓選吏員出身王京與進士王著填開封警巡判官見闕為京所訟免官規亦坐之是年十一月改充補闕十二月言將相非材且薦數人可用者二年正月規及臺諫同奏五事一乞尚書省提控樞密院如大定明昌故事二簡留親衛軍三沙汰冗軍減行樞密院帥府四選大臣為宣撫使招集流亡以實邊防五選官置所議一切省減略施行之四月以大旱詔規審理寃滯臨發上奏今河南一路便宜行院帥府從宜凡二十處陝西行尚書省二帥府五皆得以便宜殺人寃獄在此不在州縣又曰雨水不時則責審理然則職燮理者當何如上善其言而不能有為也十一月上召完顏素蘭及規入見面諭曰宋人輕犯邊界我以輕騎襲之冀其懲創告和以息吾民耳宋果行成尚欲用兵乎卿等當識此意規進曰帝王之兵貴於萬全昔光武中興所征必克猶言每一出兵頭須為白兵不妄動如此上善之四年三月上召羣臣喻以陝西事曰方春北方馬漸羸瘠秋高大勢併來何以支持朕已喻合達盡力決一戰矣卿等以為如何又言和事無益撒合輦力破和議賽不言今已遣和使可中輟乎餘皆無言規獨進曰兵難遙度百聞不如一見臣嘗任陝西官近年又屢到陝西兵將冗懦恐不可用未如聖料言未終烏古論四和曰陳規之言非是臣近至陝西軍士勇鋭皆思一戰監察御史完顏習顯從而和之上首肯又泛言和事規對曰和事固非上策又不可必成然方今事勢不得不然使彼難從猶可以激厲將士以待其變上不以為然明日又令集議省中欲罷和事羣臣多以和為便乃詔行省斟酌發遣而事竟不行十月規與右拾遺李大節上章劾同判大睦親事撒合輦諂佞招權納賄及不公事由是撒合輦竟出為中京留守朝廷快之五年二月又與大節言三事一將帥出兵每為近臣牽制不得專輒二近侍送宣傳旨公受賂遺失朝廷體可一切禁絶三罪同罰異何以使人上嘉納焉初宣宗嘗召文繡署令王壽孫作大紅半身繡衣且戒以勿令陳規知及成進召壽孫問曰曾令陳規輩知否壽孫頓首言臣侍禁庭凡宮省大小事不敢為外人言況親被聖訓乎上因嘆曰陳規若知必以華飾諫我我實畏其言蓋規言事不假借朝望甚重凡宮中舉事上必曰恐陳規有言一時近臣切議惟畏陳正叔耳挺然一時直士也後出為中京副留守未赴卒士論惜之規博學能文詩亦有律度為人剛毅質實有古人風篤於學問至老不廢渾源劉從益見其所上八事歎曰宰相材也每與人論及時事輒憤惋蓋傷其言之不行也南渡後諫官稱許古陳規而規不以訐直自名尤見重云死之日家無一金知友為葬之子良臣許古字道真汾陽軍節度使致仕安仁子也登明昌五年詞賦進士第貞祐初自左拾遺拜監察御史時宣宗遷汴信任丞相高琪無恢復之謀古上章曰自中都失守廟社陵寢宮室府庫至于圖籍重器百年積纍一朝棄之惟聖主痛悼之心至為深切夙夜思懼所以建中興之功者未嘗少置也為臣子者食祿受責其能無愧乎且閭閻細民猶顒望朝廷整訓師徒為恢復計而今才聞拒河自保又盡徙諸路軍戶河南彼既棄其産無以自生土居之民復被其擾臣不知誰為此謀者然業已如是但當議所以處之使軍無妄費民不至困窮則善矣臣聞安危所繫在於一相孔子稱危而不持顛而不扶則將焉用事勢至此不知執政者每對天顏何以仰答清問也今之所急莫若得人如前御史大夫裴滿德仁工部尚書孫德淵忠諒明敏可以大用近皆許告老願復起而任之必能有所建立以利國家太子太師致仕孫鐸雖頗衰疾如有大議猶可賜召或就問之人才自古所難凡知治體者皆當重惜況此耆舊豈宜輕棄哉若乃臨事不盡其心雖盡心而不明於理得無益失無損者縱其尚壯亦安所用方時多難固不容碌碌之徒備員尸素以塞賢路也惟陛下宸衷剛斷黜陟一新以幸天下臣前為拾遺時已嘗備論擇相之道乞取臣前奏並今所言加審思焉臣又聞將者民之司命國家安危所繫故古之人君必重其選為將者亦必以天下為己任夫將者貴謀而賤戰必也賞罰使人信之而不疑權謀使人由之而不知三軍奔走號令以取勝然後中心誠服而樂為之用邇來城守不堅臨戰輒北皆以將之不才故也私於所昵賞罰不公至於衆怨而懼其生變則撫摩慰籍一切為姑息之事由是兵輕其將將畏其兵尚能使之出死力以禦敵乎願令腹心之臣及間於兵事者各舉所知果得真才優加寵任則戰功可期矣如河東宣撫使胥鼎山東宣撫使完顏弼涿州刺史內族從坦昭義節度使必蘭阿魯帶或忠勤勇幹或重厚有謀皆可任之以扞方面又曰河北諸路以都城既失軍戶盡遷將謂國家舉而棄之州縣官往往逃奔河南乞令所在根括立期遣還違者勿復録用未嘗離任者議加恩賚如願自效河北者亦聽陳請仍先賞之減其日月州縣長二官並令兼領軍職許擇軍中有才略膽勇者為頭目或加爵命以收其心能取一府者即授以府長官州縣亦如之使人懷復土之心別遣忠實幹濟者以文檄官賞招諸脅從人彼既苦於敵役來者必多敵勢當自削有司不知出此而但為清野計事無緩急惟期速辦今晚禾十損七八遠近危懼所謀可謂大戾矣又曰京師諸夏根本況今常宿重兵緩急征討必由于此平時尚宜優於外路使百姓有所蓄積雖在私室猶公家也今有司搜括餘糧致轉販者無復敢入宜即止之臣頃看讀陳言見其盡心竭誠以吐正論者率皆草澤疏賤之人況在百僚豈無為國深憂進章疏者乎誠宜明敕中外使得盡言不諱則太平之長策出矣詔付尚書省略施行焉尋遷尚書左司員外郎兼起居注無何轉右司諫時丞相高琪立法職官有犯皆的決古及左司諫抹撚胡魯剌上言曰禮義廉以治君子刑罰威獄以治小人此萬世不易論也近者朝廷急於求治有司奏請從權立法職官有犯應贖者亦多的決夫爵祿所以馭貴也貴不免辱則卑賤者又何加焉車駕所駐非同征行而凡科徵小過皆以軍期罪之不已甚乎陛下仁恕決非本心殆有司不思寬靜可以措安而專事督責故耳且百官皆朝廷遴選多由文行武功閥閲而進乃與凡庶等則享爵祿者亦不足為榮矣抑又有大可慮者為上者將曰官猶不免民復何辭則苛暴之政日行為下者將曰彼既亦然吾復何則陵犯之心益肆其弊豈勝言哉伏願依元年赦恩刑不上大夫之文削此一切之法幸甚上初欲行之而高琪固執以為不可遂寢四年以右司諫兼侍御史時大兵越潼關而東詔尚書省集百官議古上言曰兵踰關而朝廷甫知此蓋諸將欺蔽罪也雖然大兵駐閿鄉境數日不動意者恐吾河南之軍逆諸前陝西之衆議其後或欲先令覘者伺趨向之便或以深入人境非其地利而自危所以觀望未遽進也此時正宜選募鋭卒併力擊之且開其歸路彼既疑惑遇敵必走我衆從而襲之其破必矣上以示尚書省高琪沮其議遂不行是月始置招賢所令古等領其事興定元年七月上聞宋兵連陷贛榆漣水諸縣且獲偽檄辭多詆斥因諭宰臣曰宋人構禍久矣朕姑含容者衆慮開兵端以勞吾民耳今數見侵將何以處卿等其與百官議於是集衆議于都堂古曰宋人孱弱畏我素深且知北兵方強將恃我為屏蔽雖時跳梁計必不敢深入其侮嫚之語特市井屠沽兒所為烏足較之止當命有司移文諭以本朝纍有大造及聖主兼愛生靈意彼若有知復尋舊好則又何求其或怙惡不悛舉衆討之顧亦未晚也時預議者十餘人雖或小異而大略則一既而丞相高琪等奏百官之議咸請嚴兵設備以逸待勞此上策也上然之時朝廷以諸路把軍官時有不和不聽更相訴訟古上言曰臣以為善者有勸惡者有懲國之大法也苟善惡不聞則上下相蒙懲勸無所施矣上嘉納之古以朝廷欲舉兵伐宋上疏諫曰昔大定初宋人犯宿州已而屢敗世宗料其不敢遽乞和乃敕元帥府遣人議之自是太平幾三十年泰和中韓托胄妄開邊釁章宗遣駙馬僕散揆討之揆慮兵興費重不能久支陰遣托胄族人賫乃祖琦畫像及家牒偽為歸附以見丘崇因之繼好振旅而還夫以世宗章宗之隆府庫充實天下富庶猶先俯屈以即成功告之祖廟書之史册為萬世美談今其可不務乎今大兵少息若復南邊無事則太平不遠矣或謂專用威武可使宋人屈服此殆虛言不究實用借令時獲小捷亦不足多賀彼見吾勢大必堅守不出我軍倉猝無得須還以就糧彼復乘而襲之使我欲戰不得欲退不能則休兵之期殆未見也況彼有江南蓄積之餘我止河南一路征斂之弊可為寒心願陛下隱忍包容速行此策果通和則大兵聞之亦將斂迹以吾無掣肘故也河南既得息肩然後經略朔方則陛下享中興之福天下賴涵養之慶矣惟陛下略近功慮後患不勝幸甚上是其言即命古草議和牒文既成以示宰臣宰臣言其有哀祈之意自示微弱遂不用監察御史粘割梭失劾榷貨司同提舉毛端卿貪污不法古以詞理繁雜輒為刪定頗有脫漏梭失以聞削官一階解職特免殿年三年正月尚書省奏諫官闕員因以古為請上曰朕昨暮方思古而卿等及之正合朕意其趨召之復拜左補闕八月削官四階解職初朝廷遣近侍局直長溫敦百家奴暨刑部侍郎奧屯胡撒合徙吉州之民於丹以避兵鋒州民重遷遮道控訴百家奴諭以天子恐傷百姓之意且令召晉安兵將護老幼以行衆意兵至則必見強也乃譟入州署索百家奴殺之胡撒合畏禍矯徇衆情與之會飲歌樂盡日衆肩舁導擁歡呼拜謝而去既還詔古與監察御史紇石烈鐵論鞫之諭旨曰百家奴之死皆胡撒合所賣也其閲實以聞奧屯胡撒合既下獄上怒甚亟欲得其情以正典刑而古等頗寬縱之胡撒合自縊死有司以故出論罪遂有是罰哀宗初即位召為補闕俄遷左司諫言事稍不及昔時未幾致仕居伊陽郡守為起伊川亭古性嗜酒老而未衰每乘舟出村落間留飲或十數日不歸及泝流而上老稚爭為挽舟數十里不絶其為時人愛慕如此正大七年卒年七十四古平生好為詩及書然不為士大夫所重時論但稱其直云天興間有右司諫陳岢者遇事輒言無少隱上嘗面奬及汴京被兵屢上封事言得失請戰一書尤為剴切其略云今日之事皆出陛下不斷將相怯懦若因循不決一旦無如之何恐君臣相對涕泣而已可謂切中時病而時相赤盞合喜等沮之策為不行識者惜焉岢字和之滄州人大安元年進士贊曰宣宗即位孜孜焉以繼述世宗為志而其所為一切反之大定講和南北稱治貞祐用兵生民塗炭石琚為相君臣之間務行寬厚高琪秉政惡儒喜吏上下苛察完顏素蘭首攻琪惡謂琪必亂紀綱陳規力言刀筆吏殘虐恐壞風俗許古請與宋和辭極忠愛三人所言皆切中時病有古諍臣之風焉宣宗知其為直而不用其言如是而欲比隆世宗難矣
