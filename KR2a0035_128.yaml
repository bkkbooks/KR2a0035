body:
  text: 金史卷一百二十八列傳第六十六循吏盧克忠牛德昌范承吉王政張奕李瞻劉敏行傅慎微劉煥高昌福孫德淵趙鑑蒲察鄭留女奚烈守愚石抹元張彀趙重福武都紇石烈德張特立王浩金自穆宗號令諸部不得稱都孛堇於是諸部始列於統屬太祖命三百戶為謀克十謀克為猛安一如郡縣置吏之法太宗既有中原申畫封疆分建守令熙宗遣廉察之使循行四方世宗承海陵雕之餘休養生息迄于明昌承安之間民物滋殖循吏迭出焉泰和用兵郡縣多故吏治衰矣宣宗尚刀筆之習嚴考核之法能吏不乏而豈弟之政罕見稱述焉金百餘年吏治始終可考於是作循吏傳盧克忠貴德州奉集人高永昌據遼陽克忠走詣金源郡王斡魯營降遂以撒屋出為鄉導斡魯克東京永昌走長松島克忠與渤海人撻不也追獲之收國二年授世襲謀克其後定燕伐宋皆與有功除登州刺史改刺澶州天德間同知保大軍節度使綏德州軍卒數人道過鄜城求宿民家是夜有賊剽主人財而去有司執假宿之卒繫獄榜掠誣服克忠察其寃獨不肯署未幾果得賊假宿之卒遂釋大定二年除北京副留守會民艱食克忠下令凡民有蓄積者計留一歲悉平其價糴之由是無捐瘠之患轉陳州防禦使後以靜難軍節度使致仕卒牛德昌字彥欽蔚州定安人父鐸遼將作大監德昌少孤其母教之學有勸以就蔭者其母曰大監遺命不使作承奉也中皇統二年進士第調礬山簿遷萬泉令屬蒲陝荐飢群盜充斥州縣城門晝閉德昌到官即日開城門縱百姓出入榜曰民苦飢寒剽掠鄉聚以偷旦夕之命甚可憐也能自新者一不問賊皆感激解散縣境以安府尹王伯龍嘉之禮待甚厚纍官刑部吏部侍郎中都路都轉運使廣寧太原尹卒贈中奉大夫范承吉字寵之好學問屬遼季盜賊起雖避地未嘗廢書天慶八年中進士丙科授祕書省校書郎至大定府金源令歸朝為御前承應文字天會初遷殿中少監四年從攻太原遷少府監五年宗翰克宋所得金珠承吉司其出入無毫髮欺及還犢車載書史而已尋遷昭文館直學士知絳州先是軍興民有為將士所掠而逃歸者承吉使吏遍諭俾其自實凡數千人具白元帥府許自贖為良或貧無資者以公代輸六年改河東北路轉運使時承宋季之弊民賦繁重失當承吉乃為經畫立法簡便所入增十數萬斛官既足而民有餘歷同知平陽尹西京副留守遷河東南路轉運使改同簽燕京留守事順天軍節度使屬地震壞民廬舍有欲爭先營葺者工匠過取其直承吉命官屬董其役先後以次不間貧富民賴以省費歷鎮西軍節度使行臺禮部尚書泰寧軍節度使復鎮順天奚卒散居境內率數千人為盜承吉繩以法不少貸懼而不敢犯貞元二年以光祿大夫致仕卒年六十六王政辰州熊嶽人也其先仕渤海及遼皆有顯者政當遼季亂浮沈州里高永昌據遼東知政材略欲用之政度其無成辭謝不就永昌敗渤海人爭縛永昌以為功政獨逡巡引退吳王闍母聞而異之言於太祖授盧州渤海軍謀克從破白霫下燕雲及金兵伐宋滑州降留政為安撫使前此數州既降復殺守將反為宋守及是人以為政憂政曰苟利國家雖死何避宋王宗望壯之曰身沒王事利及子孫汝言是也政從數騎入州是時民多以飢為盜坐繫政皆釋之發倉廩以賑貧乏於是州民皆悅不復叛傍郡聞之亦多降者宋王召政至轅門撫其背曰吾以汝為死矣乃復成功耶慰諭者久之天會四年為燕京都麴院同監未幾除同知金勝軍節度使事改權侍衛親軍都指揮使兼掌軍資是時軍旅始定管庫紀綱未立掌吏皆因緣為姦政獨明會計嚴扃鐍金帛山積而出納無錙銖之失吳王闍母戲之曰汝為官久矣而貧不加富何也對曰政以楊震四知自守安得不貧吳王笑曰前言戲之耳以黃金百兩銀五百兩及所乘馬遺之六年授左監門將軍歷安州刺史檀州軍州事戶吏房主事天眷元年遷保靜軍節度使致仕卒年六十六政本名南撒里嘗使高麗因改名政子遵仁遵義遵古遵古子庭筠有傳張奕字彥微其先澤州高平人以廕補官仕齊為歸德府通判齊國廢齊兵之在郡者二萬人謀為亂約夜半舉燎相應奕知之選市人丁壯授以兵結陳扼其要巷開小南門以示生路亂不得作比明亡匿略盡擒其首惡誅之後五日都統完顏阿魯補以軍至歸德欲根株餘黨奕以闔門保郡人無他遂止行臺承制除同知歸德尹天眷元年以河南與宋改同知沂州防禦使事三年宗弼復取河南徵奕赴行省既定汴京授汴京副留守歷陳秦州防禦使同知太原尹晉寧軍報夏人侵界詔奕往征之奕至境上按籍各歸所侵土還奏曰折氏世守麟府以抗夏人本朝有其地遂以與夏夏人夷折氏墳壠而戮其尸折氏怨入骨髓而不得報也今復使守晉寧故激怒夏人使為鼠侵而條上其罪苟欲開邊釁以雪私讎耳獨可徙折氏他郡則夏人自安朝廷從之遂移折氏守青州正隆間同知西京留守事遷河東北路轉運使大定二年徵為戶部尚書甫視事得疾卒李瞻薊州玉田人遼天慶二年進士為平州望雲令張覺據平州叛以瞻從事宗望復平州覺亡去城中復叛瞻踰城出降其子不能出為賊所害宋王宗望嘉之承制以為興平府判官天會三年遷大理少卿從宗望南伐為漢軍糧料使四年金兵圍汴宋人請割河北三鎮瞻與禮部侍郎李天翼安撫河北東西兩路略定懷濬衛等州衛湯陰等縣七年知寧州纍遷德州防禦使為政寬平民懷其惠相率詣京師請留者數百千人貞元三年遷濟州路轉運使改忠順軍節度使正隆末盜賊𧔧起瞻增築城壘為備蔚人賴之以安大定初卒于官劉敏行平州人登天會三年進士除太子校書郎纍遷肥鄉令歲大飢盜賊掠人為食諸縣老弱入保郡城不敢耕種農事廢畎畝荒蕪敏行白州借軍士三十護縣民出耕多張旗幟為疑兵敏行率軍巡邏日暮則閲民入城由是盜不敢犯而耕稼滋殖轉高平令縣城圮壞久不修大盜橫恣掠縣鎮不能禦敏行出己俸率僚吏出錢顧役繕治百姓欣然從之凡用二千人版築遂完鄉村百姓入保賊至不能犯凡九遷為河北東路轉運使致仕卒傅慎微字幾先其先秦州沙溪人後徙建昌慎微遷居長安宋末登進士纍官河東路經制使宗翰已克汴京使婁室定陝西慎微率衆迎戰兵敗被獲送至元帥府元帥宗翰愛其才學弗殺羈置歸化州希尹收置門下宗弼復取河南地起為陝西經略使尋權同州節度使事明年陝西大旱飢死者十七八以慎微為京兆鄜延環慶三路經濟使許以便宜慎微募民入粟得二十餘萬石立養濟院飼餓者全活甚衆改同知京兆尹權陝西諸路轉運使復修三白龍首等渠以溉田募民屯種貸牛及種子以濟之民賴其利轉中京副留守用廉改欣州刺史纍遷太常卿除定武軍節度使移靜難軍忤用事者蘇保衡救之得免大定初復為太常卿遷禮部尚書與翰林侍講學士徒單子溫翰林待制移剌熙載俱兼同修國史卒官年七十六慎微博學喜著書嘗奏興亡金鏡録一百卷性純質篤古喜談兵時人以為迂闊云劉煥字德文中山人宋末兵起城中久乏食煥尚幼煮粳核而食之自飲其清者以醲厚者供其母鄉里異之稍長就學天寒擁糞火讀書不怠登天德元年進士調任丘尉縣令貪汙煥每規正之秩滿令持杯酒謝曰尉廉慎使我獲考調中都市令樞密使僕散忽土家有絛結工牟利於市不肯從市籍役煥繫之忽土召煥煥不往暴工罪而笞之煥初除市令過謝鄉人吏部侍郎石琚琚不悅曰京師浩穰不與外郡同棄簡就煩吾所不曉也至是始重之以廉升京兆推官再遷北京警巡使捕二惡少杖于庭中戒之曰孝弟敬慎則為君子暴戾隱賊則為小人自今以往毋狃于故習國有明罰吾不得私也自是衆皆畏憚毋敢犯者召為監察御史父老數百人或臥車下或挽其靴鐙曰我欲復留使君期年不可得也以本官攝戶部員外郎代州錢監雜青銅鑄錢錢色惡類鐵錢民間盜鑄抵罪者衆朝廷患之下尚書省議煥奏曰錢寶純用黃銅精治之中濡以錫若青銅可鑄歷代無緣不用自代州取二分與四六分青黃雜糅務省銅而功易就由是民間盜鑄陷罪者衆非朝廷意也必欲為天下利宜純用黃銅得數少而利遠其新錢已流行者宜驗數輸納準換從之再遷管州刺史耆老數百人疏其著迹十一事詣節鎮請留煥曰刺史守職奉法乞留之以廉升鄭州防禦使遷官一階轉同知北京留守事世宗幸上京所過州郡大發民夫治橋梁馳道以希恩賞煥所部惟平治端好而已上嘉其意遷遼東路轉運使卒高昌福中都宛平人父履遼御史中丞致仕太宗聞其名召之未及入見而卒特詔昌福釋服應舉登天會十年進士第補樞密院令史明年辟元帥府令史皇統初宗弼復河南元帥府治汴人有疑似被獲皆目為宋諜者即殺之昌福讞得其實釋去者甚衆許州都統韓常用法嚴好殺人遣介送囚於汴或道亡監吏自度失囚恐得罪欲盡殺諸囚以滅口昌福識監吏意窮竟其狀免死者十七八而諸吏遂怨昌福欲搆害之是時方用兵梁楚間夜多陰雨元帥府選人偵宋兵動靜諸吏遣昌福昌福不辭即行盡得敵軍虛實報元帥府師還除震武軍節度副使轉行臺禮部員外郎天德間行臺罷改絳陽軍節度副使入為兵部員外郎改河間少尹世宗即位上書陳便宜事上披閲再三因謂侍臣曰內外官皆上書言事可以知人材優劣不然朕何由知之三除同知東京留守事治最遷山東西路轉運使工部尚書改彰德軍節度使上書言賦稅太重上問翰林學士張景仁曰稅法比近代為輕而以為重何也景仁曰今之稅殊輕若復輕之國用且不足事遂寢纍遷河中尹致仕卒孫德淵字資深興中府人也大定十六年進士調石州軍事判官淶水丞察廉遷沙河令有盜秋桑者主逐捕之盜以叉自刺其足面曰秋桑例不禁採汝何得刺我主懼賂而求免盜不從訴之縣德淵曰若逐捕而傷瘡必在後今在前乃自刺也盜遂引服選尚書省令史不就丁父憂去官民為刻石祠之察廉起復北京轉運司都勾判官以纍薦遷中都左警巡使監察御史山東東路轉運副使纍官大理丞兼左拾遺審官院奏德淵剛正幹能可任繁劇遂再任丁母憂服除特遷恩州刺史入為右司郎中滕州刺史遷同知河間府事歷大興治中同知府事大安初遷盤安軍節度使改河北西路按察轉運使改昭義軍節度使潞州破被執俄有拜于前者皆沙河舊民也密護德淵由是得脫貞祐二年拜工部尚書攝御史中丞是時山東乏兵食有司請鬻恩例舉人居喪者亦許納錢就試德淵奏此大傷名教事遂寢尋致仕監察御史許古論德淵忠亮明敏可以大用近許告老士大夫竊歎望朝廷起復必能建明以利國家宣宗嘉納未及用而卒趙鑑字擇善濟南章丘人宋建炎二年進士調廬州司理參軍是時江淮方用兵鑑棄官還鄉里齊國建除歷城丞轉長清令皆劇邑難治鑑政甚著劉豫召見遷直祕閣提舉涇原路弓箭手兼提點本路刑獄公事誡之曰邊將多不法可痛繩之原州守將武悍自用以鑑年少易之鑑發其姦守將坐免郡縣聞風無敢犯者齊廢除知城陽軍改山東東路轉運副使攝行臺左司郎中行臺宰相欲以故宋宦者權都水監鑑曰誤國閹竪汴人視為寇讎付以美官將失人望遂不用以母憂解職天德初起為濟州刺史移涿州海陵召鑑入朝應對失旨遣還郡俄除知火山軍以病免大定初起知寧海軍秋禾方熟子方蟲生鑑出城行視蟲乃自死再遷鎮西軍節度使改河北西路轉運使致仕卒蒲察鄭留字文叔東京路斡底必剌猛安人大定二十二年進士調高苑主簿濬州司候補尚書省令史除監察御史纍遷北京臨潢按察副使戶部侍郎御史臺奏鄭留前任北京稱職遷陝西路按察使改順義軍節度使西京人李安兄弟爭財府縣不能決按察司移鄭留平理月餘不問會釋奠孔子廟鄭留乃引安兄弟與諸生齒列坐會酒陳説古之友悌數事安兄弟感悟謝曰節使父母也誓不復爭乃相讓而歸朔州多盜鄭留禁絶遊食多蓄兵器因行春撫諭之盜乃衰息獄空賜錫宴錢以褒之改利涉軍節度使詔括馬鄭留使百姓飼養以須御史劾之既而伐宋諸路括馬皆瘦惟隆州馬肥乃釋鄭留大安初徙安國軍二年知慶陽府事三年夏人犯邊鄭留擊走之至寧元年改知平涼府是時平涼新被兵夏人復來攻鄭留招潰卒為禦守計夏兵退遷官四階貞祐二年改東京留守致仕貞祐四年卒鄭留重厚寡言笑人不見其喜慍臨終取奏盡焚之女奚烈守愚字仲晦本名胡里改門真定府路吾直克猛安人也六歲知讀書既或謂食肉昏神識乃戒而不食性至孝父沒時年十五營葬如禮治家有法鄉人稱之中明昌二年進士調深澤主簿治有聲遷懷仁令改弘文校理秩滿為臨沂令有不逞輩五百人結為黨社大擾境內守愚下車其黨散去蝗起莒密間獨不入臨沂境先是朝廷括河朔山東地隱匿者沒入官告者給賞莒州刺史教其奴告臨沂人冒地積賞錢三百萬先給官鏹乃徵于民民甚苦之守愚列其寃狀白州州不為理即聞于戶部而徵還之流民歸業縣人勒其事于石改祕書郎母喪勺飲不入口三日終喪未嘗至內寢太常寺勸農司交辟守愚皆不聽服除除同知登聞檢院改著作郎永定軍節度副使泰和伐宋守愚為山東行六部員外郎改大興都總管判官大安元年除修起居注轉刑部員外郎戶部郎中太子左諭德貞祐初除戶部侍郎數月拜諫議大夫提點近侍局二年除保大軍節度使改翰林學士參議陝西路安撫司事安撫完顏弼重其為人每事咨而後行未幾有疾詔賜御藥三年卒守愚為人忠實無華孜孜于公蓋天性然也石抹元字希明懿州路胡土虎猛安人七歲喪父號泣不食者數日十三居母喪如成人嘗為擊鞠戲馬踣歎曰生無兄弟而數乘此險設有不測奈何由是終身不復為之補樞密院尚書省譯史調同知恩州軍州事遷監察御史為同知淄州軍州事劇盜劉奇久為民患一日捕獲方訊鞫聞赦將至亟命杖殺之闔郡稱快改大興府判官沂王府司馬沁南軍節度副使河內民家有多美橙者歲獲厚利仇家夜入殘毀之主人捕得乃以劫財誣其人仇家引服贓不可得元攝州事究得其情尋改河北西路轉運副使纍遷山東西路按察轉運使貞祐初黃摑吾典徵兵東平擁衆不進大括民財衆皆忿怨副統僕散掃合殺吾典於坐取其符佩之縱恣尤甚元密疏劾掃合擅殺近臣無上不道掃合坐誅移知濟南府到官六月卒元生平寡言笑尚節儉居官自守不交權要人以是稱之張彀字伯英許州臨潁人大定二十八年進士調寧陵縣主簿改泰定軍節度判官率儒士行鄉飲酒禮改同州觀察判官是時出兵備邊州徵箭十萬限以雕雁羽為之其價翔躍不可得彀曰矢去物也何羽不可節度使曰當須省報彀曰州距京師二千里如民急何萬一有責下官身任其咎一日之間價減數倍尚書省竟如所請補尚書省令史除同知鄭州防禦使事改北京鹽使丁父憂服除再遷監察御史從伐宋遷武寧軍節度副使居母憂貞祐二年改惠民司令歷河南治中隰州刺史刑部郎中同知河南府事遷河東南路轉運使權行六部尚書安撫使興定元年以疾卒彀天性孝友任子悉先諸弟俸入所得亦委其弟掌之未嘗問有無云趙重福字履祥豐州人通女直大小字試補女直誥院令史轉兵部譯史陝西提刑知法遷陝西東路都勾判官右藏庫副使同知陳州防禦事宋諜人蘇泉入河南重福迹之至魚臺將渡河見前一舟且渡令從者大呼泉姓名前舟中忽有蒼惶失措者執之果泉也改滄州鹽副使歲飢民煮鹵為鹽賣以給食鹽官往往杖殺之重福曰寧使課殿不忍殺人歲滿課殿當降尚書右丞完顏匡三司使按出虎知其事乃以歲荒薄其罰除織染署令大安三年佐戶部尚書張煒調兵食于古北口遷都水少監行西北路六部郎中治密雲縣俄兼戶部員外郎貞祐二年以守密雲功遷同知河間府事行六部侍郎權清州防禦使攝河北東路兵馬都總管三年河間被圍有劉中者嘗與重福密雲聯事勸重福出降重福不聽是時河間兵少多羸疾不任戰欲亡去重福勸其父老率其子弟強者戰弱者守會久雨圍乃解去遷河東北路轉運使致仕元光二年卒武都字文伯東勝州人大定二十二年進士調陽穀主簿遷商水令縣素多盜凡姦民嘗縱火行劫椎埋發冢者都皆廉得姓名榜之通衢約毋再犯悉奔他境察廉遷南京路轉運支度判官纍遷中都路都轉運副使以親老與弟監察御史郁俱乞侍尋丁憂服除調太原治中復為都轉運副使遷灤州刺史充宣差北京路規措官都拘括散逸官錢百萬入為戶部郎中權右司郎中奏事稱旨被詔由海道漕遼東粟賑山東都高其價直募人入粟招海賈船致之三遷中都西京按察副使大安三年充宣差行六部侍郎以勞遷本路按察使行西南路六部尚書佐元帥抹撚盡忠備禦西京有勞召為戶部尚書賞銀二百兩絹一百匹宣宗即位議衛紹王降封語在衛紹王紀頃之中都戒嚴都知大興府佩虎符便宜行事彈壓中外軍民都醉酒以褻衣見詔使坐是解職起為刑部尚書中都解圍為河東路宣撫使俄以參知政事胥鼎代之興定元年以疾卒紇石烈德字廣之真定路山春猛安人明昌二年進士調南京教授察廉能遷厭次令補尚書省令史除同知泗州防禦事監察御史大名治中安曹裕三州刺史歷同知臨潢大興府事貞祐二年遷肇州防禦使是歲肇州升為武興軍節度德為節度使宣撫司署都提控肇州圍急食且盡有糧三百船在鴨子河去州五里不能至德乃浚濠增陴築甬道導濠水屬之河鑿陷馬穽伏甲其傍以拒守一日兵數接士殊死戰渠成船至城下兵食足圍乃解改遼東路轉運使軍民遮道挽留乘夜乃得去蒲鮮萬奴逼上京德與部將劉子元戰却之遷東京留守歷保靜武勝軍節度使興定二年以本官行六部事三年以節度權元帥右都監與左都監單州經略使完顏仲元俱行元帥府于宿州四年遷工部尚書明年召還中都是歲卒張特立字文舉曹州東明人泰和三年中進士第調宣德州司候郡多皇族巨室特立律之以法闔境肅然調萊州節度判官不赴躬耕嵵之圉城以經學自樂正大初左丞侯摯參政師安石薦其才授洛陽令四年拜監察御史拜章言鎬厲二宅久加禁錮棘圍柝警如防寇盜近降赦恩謀反大逆皆蒙湔雪彼獨何罪幽囚若是世宗神靈在天得無傷其心乎聖嗣未立未必不由是也又言方今三面受敵百姓凋敝宰執非才臣恐中興之功未可以歲月期也又言尚書右丞顏盞世魯遣其奴與小民爭田失大臣體參知政事徒單兀典諂事近習得居其位皆宜罷之當路者忌其直陰有以擠之因劾省掾高楨輩受請託飲娼家時平章政事白撒犒軍陝西歸楨等泣訴于道以當時同席並有省掾王賓張為其進士故不劾白撒以其私且不實並治特立及賓特立左遷邳州軍事判官杖五十賓亦勒停士論皆惜特立之去後卒癸丑歲年七十五王浩由吏起身初辟涇陽令廉白為關輔第一時西臺檄州縣增植棗果督責嚴急民甚被擾浩獨無所問主司將坐之浩曰是縣所植已滿其數若欲增植必盜他人所有取彼置此未見其利其愛民多此類所在有善政民絲毫無所犯秦人為立生祠歲時思之南遷後為扶溝令開興元年正月民錢大亨等執縣官送款于北大亨以浩有恩於民不忍加刃日遣所知勸之降浩終不聽於是殺之無血主簿劉坦尉宋乙並見害棄尸道路自春徂夏獨浩尸儼然如生目且不瞑烏犬莫敢近殆若有神護者初辟舉法行縣官甚多得人如咸寧令張天綱長安令李獻甫洛陽令張特立三人有傳餘如興平師夔臨潼武天禎泛水黨君玉偃師王登庸高陵宋九嘉登封薛居中長社李天翼河津孫鼎臣郟城李無黨滎陽李過庭尉氏張瑜長葛張子玉猗氏安德璋三原蕭邦傑藍田張德直葉縣劉從益皆清慎才敏極一時之選而能扶持百年將傾之祚者亦曰吏得其人故也
