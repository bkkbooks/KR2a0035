body:
  text: 金史卷一百二十二列傳第六十忠義二吳僧哥烏古論德升張順馬驤伯德窊哥奧屯醜和尚從坦孛术魯福壽吳邦傑納合蒲剌都女奚烈斡出時茂先溫迪罕老兒梁持勝賈邦獻移剌阿里合完顏六斤紇石烈鶴壽蒲察婁室女奚烈資祿趙益侯小叔王佐黃摑九住烏林答乞住陀滿斜烈尼厖古蒲魯虎兀顏畏可兀顏訛出虎粘割貞吳僧哥西南路唐古乙剌辭上沙燕部落人拳勇善騎射大安間選籍山西人為兵僧哥充馬軍千戶有功貞祐初遷萬戶權順義軍節度使朔州失守僧哥復取之真授同知節度使事弟權同知節度使事迪剌真授節度副使權節度副使燕曹兒真授節度判官提控馬壽兒以下遷授有差衆苦乏食僧哥乞賜糧十五萬斛朝廷以為應州已破朔為孤城其勢不可守乃遷朔之軍民九萬餘口分屯於嵐石隰吉絳解之間未行大元兵至朔州戰七晝夜有功加遙授同知太原府事兼同知節度使事迪剌石州刺史曹兒同知岢嵐州防禦使事四年始遷其民南行且戰且行者數十里僧哥力憊馬躓死焉時年三十詔贈鎮國上將軍順義軍節度使烏古論德升本名六斤益都路猛安人明昌二年進士纍官補尚書省令史知管差除除吏部主事絳陽軍節度副使丁父憂起復太常博士東平治中大安初知弘文院改侍御史論西京留守紇石烈執中姦惡衛紹王不聽遷肇州防禦使宣宗遷汴召赴闕上言泰州殘破東北路招討司猛安謀克人皆寓于肇州凡徵調往復甚難乞升肇州為節度使以招討使兼之置招討副使二員分治泰州及宜春詔從之進翰林侍讀學士兼戶部侍郎俄以翰林侍讀權參知政事與平章政事抹撚盡忠論近侍局預政宣宗怒語在盡忠傳無何出為集慶軍節度使改汾陽軍節度使河東北路宣撫副使復改知太原府事權元帥左監軍興定元年大元兵急攻太原糧道絶德升屢出兵戰糧道復通詔遷官一階德升上言皇太子聰明仁孝保訓之官已備更宜選德望素著之士朝夕左右之日聞正言見正行此社稷之洪休生民之大慶也宣宗嘉納之二年真授左監軍行元帥府事大元兵復圍太原環之數匝已破濠垣德升植柵為拒出其家銀幣及馬賞戰士北軍壞城西北隅以入德升聯車塞之三却三登矢石如雨守陴者不能立城破德升至府署謂其姑及其妻曰吾守此數年不幸力窮乃自縊而死其姑及其妻皆自殺詔贈翰林學士承旨子兀里偉尚幼詔以奉御俸養之張順淄州士伍淄州被圍行省侯摯遣總領提控王庭玉將兵救之庭玉募順等三十人往覘兵勢且欲令城中知援兵之至乘夜潛至城下順為所得執之使宣言行省軍敗績庭玉亦死宜速降順陽許諾既乃呼謂城中曰外兵無多王節度軍且至堅守毋降兵刃交下順曰得為忠孝鬼足矣遂死淄人知救兵至以死守城賴以完後贈宣武將軍同知棣州防禦使事詔有司給養其親且訪其子孫優加任用馬驤禹城人也登進士歷官有聲貞祐三年為曹州濟陰令四月大元克曹州驤被執軍卒搒掠求金驤曰吾書生何從得是又使跪驤曰吾膝不能屈欲殺即殺得死為大金鬼足矣遂死贈朝列大夫泰定軍節度副使仍樹碑于州歲時致祭貞祐四年七月詔以其男惟賢于八貫石局分收補伯德窊哥西南路咩辭奚人壯健沉勇大元兵克西南路鄰郡皆降窊哥獨不屈貞祐五年東勝州已破窊哥與姚里鴉胡姚里鴉兒招集義軍披荊棘復立州事河東北路行元帥府承制除窊哥武義將軍寧遠軍節度副使姚里鴉胡武義將軍節度判官姚里鴉兒武義將軍觀察判官窊哥等以恩不出朝廷頗懷觖望縱兵剽掠興定元年詔窊哥遙授武州刺史權節度使姚里鴉胡權同知節度使事姚里鴉兒權節度副使各遷官兩階興定三年窊哥特遷三官遙授同知晉安府事尋真授東勝軍節度使東勝被圍城中糧盡援兵絶窊哥率衆潰圍走保長寧寨詔各進一官戰沒者贈三官九月復被圍窊哥死之奧屯醜和尚為代州經略使貞祐四年八月大元兵攻代州和尚禦戰敗績身被數創被執欲降之不屈遂死從坦宗室子大安中充尚書省祗候郎君貞祐二年自募義兵數千充宣差都提控詔從提舉奉先范陽三都統兵除同知涿州事遷刺史佩金牌經略海州頃之充宣差都提控安撫山西軍民應援中都上書曰絳解二州僅能城守而村落之民皆嘗被兵重以連歲不登人多艱食皆恃鹽布易米今大陽等渡乃不許粟麥過河願罷其禁官稅十三則公私皆濟矣又曰絳解河中必爭之地惟令寶昌軍節度使從宜規畫鹽池之利以實二州則民受其利兵可以強矣又曰中條之南垣曲平陸芮城虞鄉河東之形勢陝洛之襟喉也可分陝州步騎萬二千人為一提控四都統分戍四縣此萬全之策也又曰平陸産銀鐵若以鹽易米募工鍊冶可以廣財用備戎器小民傭力為食可以息盜又曰河北貧民渡河逐食已而復還濟其飢者艱苦殊甚苛暴之吏抑止誅求弊莫大焉又曰河南陝西調度未急擇騎軍牝馬羣牧不二三年可增數萬騎軍勢自振矣又曰諸路印造寶券久而益多必將積滯止於南京印造給降庶可久行又曰河北職任雖除授不次而人皆不願者蓋以物價十倍河南祿廩不給飢寒且至若實給俸粟之半少足養廉則可責其效力又曰河北之官朝廷減資遷秩躐等以答其勞聞河南官吏以貶逐目之彼若以為信然誰不解體書奏下尚書省議惟許放大陽等渡宣撫司量民力給河北官俸目河北為貶所者有禁而已四年行樞密院于河南府上書曰用兵纍年出輒無功者兵不素勵也士庶且充行伍況於皇族與國同休戚哉皆當從軍親冒矢石為士卒先少寬聖主之憂族人道哥實同此心願隸臣麾下宣宗嘉其忠許之興定元年改輝州刺史權河平軍節度使孟州經略使初御史大夫權尚書右丞永錫被詔經略陝西宣宗曰敵兵強則謹守潼關毋使得東永錫既行留澠池數日至京兆駐兵不動頃之潼關破大元兵次近郊由是永錫下獄久不決從坦乃上疏救之略曰竊聞周祚八百漢享國四百餘載皆以封建親戚犬牙相制故也孤秦曹魏亡國不永晉八王相魚肉猶歷過秦魏自古同姓之親未有不與國存亡者本朝胡沙虎之難百僚將士無敢誰何鄯陽石古乃奮身拒戰盡節而死御史大夫永錫才不勝任而必用之是朝廷之過也國之枝葉已無幾矣伏惟陛下審圖之於是宗室四百餘人上書論永錫皆不報久之永錫杖一百除名當是時諸路兵皆入城自守百姓耕稼失所從坦上書曰養兵所以衛民方今河朔惟真定河間之衆可留扞城其餘府州皆當散屯于外以為民防俟稼穡畢功然後移于屯守之地是為長策從之加遙授同知東平府事權元帥左監軍行元帥府事與參知政事李革俱守平陽興定二年十月從坦上奏太原已破行及平陽河東郡縣皆不守大抵屯兵少援兵不至故耳行省兵不滿六千平陽河東之根本河南之藩籬也乞並懷孟衛州之兵以實潞州調澤州沁水端氏高平諸兵並山為營為平陽聲援惟祈聖斷以救倒懸之急是月壬子大元兵至平陽提控郭用戰于城北濠垣被執不屈而死癸丑城破從坦自殺贈昌武軍節度使孛术魯福壽為唐邑主簿大元兵攻唐邑福壽與戰死之贈官三階賻錢五百貫吳邦傑登州軍事判官邦傑寓居日照之村墅為大元兵所得驅令攻城邦傑曰吾荷吾國恩詎忍攻吾君之城與之酒食不顧乃殺之詔贈朝列大夫定海軍節度副使納合蒲剌都大名路猛安人承安二年進士調大名教授纍除比陽令補尚書省令史除彰德軍節度副使以憂去官貞祐二年調同知西安軍節度使事歷同知臨洮平涼府事河州防禦使三年夏人圍定羌蒲剌都擊走之以功加遙授彰化軍節度使四年升河州為平西軍就以蒲剌都為節度使上言古者一人從軍七家奉之興十萬之師不得操事者七十萬家今籍諸道民為兵者十之七八奉之者才二三民安得不困夫兵貴精不在衆寡擇勇敢謀略者為兵脆懦之徒歸農畝是亦紓民之一端也又請補官贖罪以足用及請許人射佃陝西荒田開採礦冶不報改知平涼府事入為戶部尚書是時伐宋大捷蒲剌都奏宋人屢敗其氣必沮可乘此遣人諭説以尋舊盟若宋人不從然後伐之疾讎怒頑易以成功朝廷不能用蒲剌都又言諸軍當汰去老弱妙選精鋭庶可取勝陝西弓箭手不習騎射可選善騎者代之延安屯兵甚衆分徙萬人駐平涼關中元帥猥多除京兆重鎮其餘皆可罷鞏縣以北黃河南岸及金鉤弔橋虎牢關虢州崿嶺凡斜徑僻路俱當置兵防守詔下尚書省樞密院議竟不施行未幾改元帥右監軍兼昭義軍節度使行元帥府事興定二年潞州破力戰而死贈御史大夫女奚烈斡出仕至楨州刺史被行省牒徙州人于金勝堡已而大兵至斡出拒戰中流矢病創臥花帽軍張提控言兵勢不可當宜速降斡出曰吾曹坐食官祿可忘國家恩乎汝不聞趙坊州乎以金帛子女與敵人終亦不免我輩但當力戰而死耳至夜張提控引數人持兵仗以入脅斡出使出降斡出曰聽汝所為吾終不屈也遂殺之執其妻子出降初楨州人遷金勝堡多不能至軍事判官王謹收遺散之衆別屯周安堡周安堡不繕完樓堞置戰守之具兵至謹拒戰十餘日內潰被執不屈而死詔斡出謹各贈官六階升職三等時茂先日照縣沙溝酒監寓居諸城紅襖賊方郭三據密州過其村居民相率迎之賊以元帥自稱茂先怒謂衆曰此賊首耳何元帥之有方郭三聞而執之斷其腕茂先大罵賊不勝忿復剔其目亂刃銼之至死罵不絶詔贈武節將軍同知沂州防禦使事溫迪罕老兒為同知上京留守事蒲鮮萬奴攻上京其子鐵哥生獲老兒脅之使招餘人不從鐵哥怒亂斫而死贈龍虎衛上將軍婆速兵馬都總管以其姪黑厮為後特授四官梁持勝字經甫本名詢誼避宣宗嫌名改焉保大軍節度使襄之子多力善射泰和六年進士復中宏詞纍官太常博士遷咸平路宣撫司經歷官興定初宣撫使蒲鮮萬奴有異志欲棄咸平徙曷懶路持勝力止之萬奴怒杖之八十持勝走上京告行省太平是時太平已與萬奴通謀口稱持勝忠而心實不然署持勝左右司員外郎既而太平受萬奴命焚毀上京宗廟執元帥承充奪其軍持勝與提控咸平治中裴滿賽不萬戶韓公恕約殺太平復推承充行省事共伐萬奴事泄俱被害詔贈持勝中順大夫韓州刺史賽不鎮國上將軍顯德軍節度使公恕明威將軍信州刺史賈邦獻霍州霍邑縣陳村人也舉進士第質直有勇略大元攻河東邦獻集居民為守禦計既而兵大至居民悉降邦獻棄其家獨與子懿保於松平寨是時權知州事劉珍在寨與之共守竟能成功珍每欲辟之邦獻輒以衰老為辭興定四年十月兵復大至病不能避與懿俱被執欲以為鎮西元帥且持刃脅之邦獻不屈密遣懿歸松平遂自剄贈奉直大夫本縣令移剌阿里合遼人興定間纍遷霍州刺史興定四年正月移霍州治好義堡大元兵至阿里合力戰不能敵兵敗被執誘使降阿里合曰吾有死無二叱使跪但向闕而立於是叢矢射殺之寶昌軍節度副使孔祖湯同時被獲既又令祖湯跪祖湯不從亦死詔贈阿里合龍虎衛上將軍泰定軍節度使祖湯資善大夫同知平陽府事祖湯泰和三年進士完顏六斤中都路胡土愛割蠻猛安人大安中以蔭補官選充親軍調阜平尉遷方城令改通州軍事判官以功遷本州刺史頃之元帥右都監蒲察七斤執之以去未幾挈家脫歸除同知臨洮府事徙慶陽遷保大軍節度使興定五年鄜州破六斤自投崖下死焉贈特進知延安府事詔陝西行省訪其子孫以聞紇石烈鶴壽河北西路山春猛安人性淳質軀幹雄偉初充親軍中泰和三年武舉調褒信縣副巡檢六年宋人圍蔡州鶴壽請于防禦使與勇士五十人夜斫宋營使諸軍譟于城上斬三百餘級宋兵自相蹂踐死者千餘人遲明宋人解圍去鶴壽追之使殿曳柴宋人顧塵起以為大兵且至遂奔追至陳寨而還已而宋兵復據新蔡新息褒信三縣鶴壽皆復取之得馬三百匹充行軍萬戶從大軍出壽春敗宋人于渦口奪馬千餘匹攻下真滁二州及盱眙軍軍還進九官遷同知息州軍州事改萬寧宮同提舉大安三年充西南路馬軍萬戶夏人五萬圍東勝鶴壽救之突圍入城夏兵解去遷兩階賜銀百兩重綵十端遷尚方署令充行軍副統升充行省左翼都統轉武衛軍都統充馬軍副提控轉鈐轄充都城東面宣差副提控貞祐二年丁父憂起復武寧軍節度副使破紅襖賊于蘭陵石城堌一切掠良人為生口監察御史陳規奏乞敕有司凡鶴壽所獲俱從放免詔徐州歸德行院拘括放之尋遙授同知武寧軍節度使事兼節度副使坐出獵縱火延燒官草杖一百改同知河平軍節度使事興定元年充馬軍都提控入宋襄陽界遙授同知武勝軍節度使事改遙授睢州刺史二年攻棗陽三敗宋兵改遙授同知歸德府事三年奪宋石渠寨決去棗陽濠水加宣差鄧州路軍馬從宜遙授汝州防禦使四年宋扈太尉步騎十萬圍鄧州鶴壽分兵拒守出府庫金帛賞士許以遷官加爵自將餘衆日出搏戰宋兵焚營去鶴壽被創不能騎馬遣招撫副使术虎移刺答追及之殺數十人奪其俘而還詔所散金帛勿問將士優遷官爵鶴壽遷金紫光祿大夫遙授武勝軍節度使俄丁母憂以本官起復權元帥左都監行元帥府于鄜州興定五年閏十二月鄜州破鶴壽與數騎突出城追及之鶴壽據土山力戰而死諡果勇蒲察婁室東北路按出虎割里罕猛安人泰和三年進士調慶都牟平主簿以廉能遷中都右警巡副使補尚書省令史知管差除貞祐初除吏部主事監察御史丁母憂服闕充行省經歷官改京兆治中遙授定西州刺史充元帥參議官興定二年與元帥承裔攻下西和州白撒由秦州進兵抵棧道宋人悉鋭來拒婁室乘高立幟策馬旋走揚塵為疑兵別遣精騎掩出其後宋兵大潰乘勝遂拔興元進一階除丹州刺史再遷同知河中府事權元帥右都監河東路安撫使復取平陽晉安優詔褒寵進一階賜銀二百兩重幣二十端遙授孟州防禦使權都監如故將兵救鄜州轉戰而至城破死之贈資德大夫定國軍節度使諡襄勇敕行省求其尸以葬女奚烈資祿本姓張氏咸平府人泰和伐宋從軍有功調易縣尉遷潞縣主簿貞祐初遙授同知德州防禦事改秦州三年遙授同知通遠軍節度事興定元年改西寧州刺史賜今姓久之遙授同知臨洮府事兼定西州刺史從元帥右都監完顏阿鄰破宋兵于梢子嶺三年攻破武休關資祿功最詔比將士遷五官職二等外資祿更加官職一等遙授通遠軍節度使刺史如故五年遙授隴安軍節度使俄改金安軍詔曰陝西行省奏軍官闕員卿久在行陳御下有法舊隸士卒多在京兆今正防秋關河要衝悉心備禦將兵救鄜州閏十二月鄜州破被執不肯降遂死贈銀青榮祿大夫中京留守元光元年言事者謂資祿褒贈尚薄詔録其二子烈山林泉升職一等陝西行省軍中用之趙益太原人讀書肄業大元兵入境益鳩合土豪保聚山硤屢戰有功晉陽公郭文振署為壽陽令駐兵榆次重原寨遂率衆收復太原夜登其城斬馘甚衆所獲馬仗不可計護老幼二萬餘口以出升太原治中復擢同知府事兼招撫使元光元年八月大元兵大至攻城益急知不可支乃自焚其府庫殺妻子沉其符印于井遂自殺宣宗聞之嘉歎贈銀青榮祿大夫河東北路宣撫使仍諭有司求其子孫録用侯小叔河東縣人為河津水手貞祐初籍充鎮威軍以勞補官元光元年遷河中府判官權河東南路安撫副使小叔盡護農民入城以家財賞戰士河中圍解遷治中安撫如故樞密院奏小叔才能可用權位輕不足以威衆乞假符節十二月詔權元帥右都監便宜從事提控吳德説小叔出降叱出斬之表兄張先從容言大兵勢重可出降以保妻子小叔怒謂先曰我舟人子致身至此何謂出降縛先於柱而殺之飯僧祭葬以盡戚黨之禮頃之樞密院遣都監訛論與小叔議兵事小叔出城與訛論會石天應乘之取河中府作浮橋通陝西小叔駐樂李山寨衆兵畢會夜半坎城以登焚樓櫓火照城中天應大驚不知所為盡棄輜重牌印馬牛雜畜死于雙市門小叔燒絶浮橋撫定其衆遷昭毅大將軍遙授孟州防禦使同知府事監軍安撫如故二年正月大元軍騎十萬圍河中總帥訛可遣提控孫昌率兵五千樞密副使完顏賽不遣李仁智率兵三千俱救河中小叔期以夜中鳴鉦內外相應及期小叔出兵戰昌仁智不敢動小叔斂衆入城圍益急衆議出保山寨小叔曰去何之密遣經歷官張思祖潰圍出奔告于汴京明日城破小叔死不得其尸總帥訛可以河中府推官籍阿外代小叔權右都監樞密院奏小叔功卓異或疑尚在遽令阿外代之絶歸向之路至是小叔已亡四十餘日中條諸寨無所統領乃詔阿外權領宣宗思小叔功下詔褒贈切責訛可不救河中之罪王佐字輔之霍州農家子豁略不事産業輕財好施善騎射興定中聚兵數千人權領霍州事平陽胡天作承制加忠勇校尉趙城丞遷霍邑令同知蒲州軍事權招撫副使蒲州經略使詔遷宣武將軍遙授寶昌軍節度副使大元兵取青龍堡佐被獲署霍州守將隸元帥崔環質其妻子招撫使成天祐與環有隙佐與天祐謀殺環天祐曰君妻子為質奈何佐曰佐豈顧家者邪元光二年七月因環出獵殺之率軍民數萬請命加龍虎衛上將軍元帥右監軍兼知平陽府事佐與平陽公史詠素不協請徙沁州玉女寨詔從之仍令聽上黨公完顏開節制是歲七月救襄垣中流矢卒贈金吾衛上將軍以其子為符寶典書黃摑九住臨潢人大定間以廕補部令史轉樞密院令史調安肅州軍事判官明昌四年為大理執法同知薊州軍事再遷潞王府司馬纍官河東北路按察使轉運使改知彰德府事戰歿贈榮祿大夫南京留守仍録用其子孫烏林答乞住大名路猛安人大定二十八年進士纍官補尚書省令史除山東提刑判官英王府司馬御史臺舉前在山東稱職改太原府治中簽陝西按察司事歷汝州沁州刺史北京臨潢按察副使遷蒲與路節度使未幾以罪奪三官解職降德昌軍節度副使崇慶初戍邊有功遷一官賞銀百兩重幣十端轉利州刺史貞祐初改同知咸平府事遷歸德軍節度使改興平軍就充東面經略使尋罷經略司改元帥右都監赴援中都戰歿贈榮祿大夫參知政事以參政半俸給其家陀滿斜烈咸平路猛安人襲父猛安明昌中以所部兵充押軍萬戶戍邊承安中討契丹有功除陳州防禦使遷知平涼府事改保大軍節度使徙知彰德府事貞祐四年大元兵復取彰德斜烈死焉尼厖古蒲魯虎中都路猛安人明昌五年進士纍官補尚書省令史從平章政事僕散揆伐宋兵罷除同知崇義軍節度使事察廉改東平府治中歷環州裕州刺史翰林待制開封府治中大理卿尋擢知河南府事兼河南路副統軍貞祐四年急備京西為陝州宣撫副使兼西安軍節度使是歲大元兵取潼關戍卒皆潰蒲魯虎禦戰兵敗死焉兀顏畏可隆安路猛安人補親軍充護衛除益都總管府判官中都兵馬副都指揮使纍官會州刺史貞祐初為左衛將軍拱衛直都指揮使山東副統軍安化軍節度使土賊據九仙山為巢穴畏可擁衆不擊賊愈熾東平行省蒙古綱劾奏畏可不任將帥朝廷不問改鎮西軍權經略副使歷金安武勝軍興定四年改泰定軍是歲五月兗州破死焉兀顏訛出虎隆安府猛安人大定二十八年進士纍官補尚書省令史除順天軍節度副使召為治書侍御史刑部員外郎單州刺史戶部郎中河東北路按察副使同知大興府事秦州防禦使丁母憂起復泗州防禦使遷武寧軍節度使徙河平軍兼都水監坐前在武寧奏軍功不實降沂州防禦使遷汾陽軍節度使兼經略使興定二年九月城破死焉粘割貞本名抄合西南路招討司人大定二十八年進士歷教授主簿用薦舉除河北大名提刑知事察廉遷都轉運戶籍判官纍官泰定軍節度副使丁父憂服闋除德興治中宣德州刺史貞祐元年十二月貞以禮部郎中攝國子祭酒與恩州刺史攝武衛軍副都指揮使粘割合達河間府判官攝同知順天軍節度使事梅只乞奴保州録事攝永定軍節度副使伯德張奴出議和事二年和議成賞銀二百兩重幣十端玉吐鶻改戶部侍郎歷沁南河平鎮南集慶汾陽軍節度使貞祐四年改昭義軍充潞州經略使興定二年入為工部尚書由壽州伐宋攻正陽有功權元帥左都監守晉安府興定三年十一月城破貞與府官十餘人皆死之
