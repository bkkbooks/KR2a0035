body:
  text: 金史卷二十四志第五地理上上京路咸平路東京路北京路西京路中都路金之壤地封疆東極吉里迷兀的改諸野人之境北自蒲與路之北三千餘里火魯火疃謀克地為邊右旋入泰州婆盧火所浚界壕而西經臨潢金山跨慶桓撫昌淨州之北出天山外包東勝接西夏逾黃河復西歷葭州及米脂寨出臨洮府會州積石之外與生羌地相錯復自積石諸山之南左折而東逾洮州越鹽川堡循渭至大散關北並山入京兆絡商州南以唐鄧西南皆四十里取淮之中流為界而與宋為表𩹉襲遼制建五京置十四總管府是為十九路其間散府九節鎮三十六防禦郡二十二刺史郡七十三軍十有六縣六百三十二後復盡升軍為州或升城堡寨鎮為縣是以金之京府州凡百七十九縣加於舊五十一城寨堡關百二十二鎮四百八十八雖貞祐興定危亡之所廢置既歸大元或有因之者故凡可考必盡著之其所不載則闕之上京路即海古之地金之舊土也國言金曰按出虎以按出虎水源於此故名金源建國之號蓋取諸此國初稱為內地天眷元年號上京海陵貞元元年遷都于燕削上京之號止稱會寧府稱為國中者以違制論大定十三年七月復為上京其山有長白青嶺馬紀嶺完都魯水有按出虎水混同江來流河宋瓦江鴨子河府一領節鎮四防禦一縣六鎮一舊有會平州天會二年築契丹之周特城也後廢其宮室有乾元殿天會三年建天眷元年更名皇極殿慶元宮天會十三年建殿曰辰居門曰景暉天眷二年安太祖以下御容為原廟朝殿天眷元年建殿曰敷德門曰延光寢殿曰宵衣書殿曰稽古又有明德宮明德殿熙宗嘗享太宗御容於此太后所居也涼殿皇統二年構門曰延福樓曰五雲殿曰重明東廡南殿曰東華次曰廣仁西廡南殿曰西清次曰明義重明後東殿曰龍壽西殿曰奎文時令殿及其門曰奉元有泰和殿有武德殿有薰風殿其行宮有天開殿爻剌春水之地也有混同江行宮太廟社稷皇統三年建正隆二年毀原廟天眷元年以春亭名天元殿安太祖太宗徽宗及諸后御容春亭者太祖所嘗御之所也天眷二年作原廟皇統七年改原廟乾文殿曰世德正隆二年毀大定五年復建太祖廟興聖宮德宗所居也天德元年名之興德宮後更名永祚宮睿宗所居也光興宮世宗所居也正隆二年命吏部郎中蕭彥良盡毀宮殿宗廟諸大族邸第及儲慶寺夷其趾耕墾之大定二十一年復修宮殿建城隍廟二十三年以甓束其城有皇武殿擊毬校射之所也有雲錦亭有臨漪亭為籠鷹之所在按出虎水側會寧府下初為會寧州太宗以建都升為府天眷元年置上京留守司以留守帶本府尹兼本路兵馬都總管後置上京曷懶等路提刑司戶三萬一千二百七十舊歲貢秦王魚大定十二年罷之又貢豬二萬二十五年罷之東至胡里改六百三十里西至肇州五百五十里北至蒲與路七百里東南至恤品路一千六百里至曷懶路一千八百里縣三會寧倚與府同時置有長白山青嶺馬紀嶺勃野淀緑野淀有按出虎河又書作阿术滸有混同江淶流河有得勝陀國言忽土皚葛蠻太祖誓師之地也曲江初名鎮東大定七年置十三年更今名宜春大定七年置有鴨子河肇州下防禦使舊出河店也天會八年以太祖兵勝遼肇基王績於此遂建為州天眷元年十月置防禦使隸會寧府海陵時嘗為濟州支郡承安三年復以為太祖神武隆興之地升為節鎮軍名武興五年置漕運司以提舉兼州事後廢軍貞祐二年復升為武興軍節鎮置招討司以使兼州事戶五千三百七十五縣一始興倚與州同時置有鴨子河黑龍江隆州下利涉軍節度使古扶餘之地遼太祖時有黃龍見遂名黃龍府天眷三年改為濟州以太祖來攻城時大軍徑涉不假舟楫之祥也置利涉軍天德三年置上京路都轉運司四年改為濟州路轉運司大定二十九年嫌與山東路濟州同更今名貞祐初升為隆安府戶一萬一百八十縣一利涉倚與州同時置有混同江淶流河鎮一與縣同時置有混同信州下彰信軍刺史本渤海懷遠軍遼開泰七年建取諸路漢民置戶七千三百五十九縣一武昌本渤海懷福縣地鎮一八十戶蒲與路國初置萬戶海陵例罷萬戶乃改置節度使承安三年設節度副使南至上京六百七十里東南至胡里改一千四百里北至北邊界火魯火疃謀克三千里合懶路置總管府貞元元年改總管為尹仍兼本路兵馬都總管承安三年設兵馬副總管舊貢海蔥大定二十七年罷之有移鹿古水西北至上京一千八百里東南至高麗界五百里恤品路節度使遼時為率賓府置刺史本率賓故地太宗天會二年以耶懶路都孛堇所居地瘠遂遷于此以海陵例罷萬戶置節度使因名速頻路節度使世宗大定十一年以耶懶速頻相去千里既居速頻然不可忘本遂命名石土門親管猛安曰押懶猛安承安三年設節度副使西北至上京一千五百七十里東北至胡里改一千一百西南至合懶一千二百北至邊界斡可阿憐千戶二千里耶懶又書作押懶曷蘇館路置節度使天會七年徙治寧州嘗置都統司明昌四年廢有化成關國言曰曷撒罕關胡里改路國初置萬戶海陵例罷萬戶乃改置節度使承安三年置節度副使西至上京六百三十里北至邊界合里賓忒千戶一千五百里烏古迪烈統軍司後升為招討司與蒲與路近咸平路府一領刺郡一縣十咸平府下總管府安東軍節度使本高麗銅山縣地遼為咸州國初為咸州路置都統司天德二年八月升為咸平府後為總管府置遼東路轉運司東京咸平路提刑司戶五萬六千四百四縣八平郭倚舊名咸平大定七年更銅山遼同州鎮安軍本漢襄平縣遼太祖時以東平寨置因名東平軍曰鎮東章宗大定二十九年以與東平重故更南有柴河北有清河西有遼河新興遼銀州富國軍本渤海富州熙宗皇統三年廢州更名來屬有范河北有柴河西有遼河慶雲遼祺州祐聖軍本以所俘檀州密雲民建檀州密雲後更名有遼河清安遼肅州信陵軍熙宗皇統三年降為縣榮安東有遼河歸仁遼舊隸通州安遠軍本渤海強師縣遼更名金因之北有細河玉山章宗承安三年以烏速集平郭林河之間相去六百餘里之地置貞祐二年四月升為節鎮軍曰鎮安韓州下刺史遼置東平軍本渤海鄚頡府戶一萬五千四百一十二舊有營縣二臨津倚未詳何年置柳河本渤海粵喜縣地遼以河為名有狗河柳河東京路府一領節鎮一刺郡四縣十七鎮五皇統四年二月立東京新宮寢殿曰保寧宴殿曰嘉惠前後正門曰天華曰乾貞七月建宗廟有孝寧宮七年建御容殿遼陽府中東京留守司本渤海遼陽故城遼完葺之郡名東平天顯三年升為南京府曰遼陽十三年更為東京太宗天會十年改南京路平州軍帥司為東南路都統司之時嘗治於此以鎮高麗後置兵馬都部署司天德二年改為本路都總管府後更置留守司産白兔師姑布鼠毫白鼠皮人參白附子戶四萬六百四縣四鎮一遼陽倚東梁河國名兀魯忽必剌俗名太子河鶴野鎮一長宜曷蘇館在其地宜豐遼舊衍州安廣軍皇統三年廢為縣有東梁河石城興定三年九月以縣之靈巖寺為巖州名其倚郭縣曰東安置行省澄州南海軍刺史下本遼海州天德三年改州名戶一萬一千九百三十五縣二鎮一臨溟鎮一新昌析木遼銅州廣利軍附郭析木縣也皇統三年廢州來屬有沙河瀋州昭德軍刺史中本遼定理府地遼太宗時置軍曰興遼後為昭德軍置節度明昌四年改為刺史與通貴德澄三州皆隸東京戶三萬六千八百九十二縣五樂郊遼太祖俘三河之民建三河縣於此後改更今名有渾河章義遼舊廣州皇統三年降為縣來屬有遼河東梁河遼河大口遼濱遼舊遼州東平軍遼太宗改為始平軍皇統三年廢為縣有遼河樓遼舊興州興中軍常安縣遼嘗置定理府刺史於此本樓故地大定二十九年章宗更名有范河清河國名叩隈必剌雙城遼雙州保安軍也皇統三年降為縣章宗時廢貴德州刺史下遼貴德州寧遠軍國初廢軍降為刺郡戶二萬八百九十六縣二貴德倚有范河奉集遼集州懷遠軍奉集縣本渤海舊縣有渾河蓋州奉國軍節度使下本高麗蓋葛牟城遼辰州明昌四年罷曷蘇館建辰州遼海軍節度使六年以與陳同音更取蓋葛牟為名戶一萬八千四百五十六縣四鎮二湯池遼鐵州建武軍湯池縣鎮一神鄉建安遼縣鎮一大寧秀巖本大寧鎮明昌四年升泰和四年廢為鎮貞祐四年復升置熊嶽遼盧州玄德軍熊嶽縣遼屬南女直湯河司復州下刺史遼懷遠軍節度明昌四年降為刺史舊貢鹿筋大定八年罷之戶一萬三千九百五十縣二鎮一永康倚舊名永寧大定七年更化成遼蘇州安復軍本高麗地興宗置皇統三年降為縣來屬貞祐四年五月升為金州興定二年升為防禦鎮一歸勝來遠州下舊來遠城本遼熟女直地大定二十二年升為軍後升為州婆速府路國初置統軍司天德二年置總管府貞元元年與曷懶路總管並為尹兼本路兵馬都總管此路皆猛安戶北京路府四領節鎮七刺郡三縣四十二鎮七寨一大定府中北京留守司遼中京統和二十五年建為中京國初因稱之海陵貞元元年更為北京置留守司都轉運司警巡院産鼠螺杯茱萸梳玳瑁鞍酥乳餅五味子戶六萬四千四十七縣十一鎮二大定倚遼縣舊名有土河七金山陰涼河鎮一恩化長興有塗河富庶有心河鎮一文安松山遼松山州勝安軍松山縣開泰中置舊置刺史太祖天輔七年置觀察使皇統三年廢州來屬承安三年隸高州泰和四年復有陰涼河落馬河神山遼澤州神山縣遼太祖俘蔚州之民置章宗承安二年嘗置惠州升孩兒館為灤陽縣以隸之泰和四年罷州及灤陽縣惠和皇統三年以遼惠州惠和縣置金源唐青山縣遼開泰二年置以地有金甸為名有駱駝山和衆遼榆州和衆縣皇統三年罷州來屬武平遼築城杏堝初名新州統和間更為武安州皇統三年降為武安縣來屬大定七年更名承安三年隸高州泰和四年復來屬靜封承安二年以胡設務置隸全州三年隸高州泰和四年來屬三韓遼伐高麗遷馬韓辰韓辨韓三國民為縣置高州太祖天輔七年以高州置節度使皇統三年廢為縣承安三年復升為高州置刺史為全州支郡分武平松山靜封三縣隸焉泰和四年廢有落馬河塗河利州下刺史遼統和十六年置戶二萬一千二百九十六縣二鎮一寨一阜俗遼統和四年置金因之龍山遼故潭州廣潤軍縣故名熙宗皇統三年廢州來屬有榆河寨一蘭州鎮一漆河義州下崇義軍節度使遼宜州天德三年更州名戶三萬二百三十三縣三鎮一弘政有凌河開義遼海北州廣化軍縣故名熙宗皇統三年廢州來屬鎮一饒慶同昌遼成州興府軍縣故名國初隸川州大定六年罷川州隸懿州承安二年復隸川州泰和四年來屬錦州下臨海軍節度使舊隸興中府後來屬戶三萬九千一百二十三縣三永樂本慕容皓之西樂縣地安昌神水遼開泰二年置皇統三年廢為鎮大定二十九年復升為縣有土河瑞州下歸德軍節度使本來州天德三年更為宗州泰和六年以避睿宗諱謂本唐瑞州地故更今名戶一萬九千九百五十三縣三鎮一瑞安舊名來賓唐來遠縣也明昌六年更為宗安泰和六年復更今名海陽遼潤州海陽軍故縣皇統三年廢州來屬鎮一遷民海濱本慕容皓集寧縣地遼隰州海平軍故縣皇統三年廢州來屬廣寧府散下鎮寧軍節度使本遼顯州奉先軍漢望平縣地天輔七年升為府因軍名置節度天會八年改軍名鎮寧天德二年隸咸平後廢軍隸東京泰和元年七月來屬戶四萬三千一百六十一縣三舊有奉玄縣天會八年改為鐘秀縣鎮六寨四鎮二歡城遼西廣寧舊名山東縣大定二十九年更名有遼世宗顯陵寨二閭城兔兒窩望平大定二十九年升梁漁務置鎮二梁漁務山西店閭陽遼乾州廣德軍以奉乾陵故名奉陵縣天會八年廢州更名來屬有凌河有遼景宗乾陵鎮二閭陽衡家寨二大斧山北川懿州下寧昌軍節度使遼嘗更軍名慶懿又為廣順復更今名金因之先隸咸平府泰和末來屬戶四萬二千三百五十一縣二大定六年罷川州以宜民同昌二縣來屬承安二年復以二縣隸川州泰和四年罷川州以宜民隸興中同昌隸義州順安靈山本渤海靈峯縣地興中府散下本唐營州城遼太祖遷漢民以實之曰霸州彰武軍重熙十一年升為府更今名金因之戶四萬九百二十七縣四鎮三興中本漢柳城地南有凌河鎮一黔城永德遼安德州化平軍安德縣世宗大定七年更今名北有凌河鎮一阜安興城遼嚴州保肅軍縣故名皇統三年廢州隸錦州有桃花島宜民遼川州長寧軍會同中嘗名白川州天祿五年去白字國初因之與同昌縣皆隸焉大定六年降為宜民縣隸懿州承安二年復置川州改徽川寨為徽川縣為懿州支郡泰和四年罷州及徽川縣來屬鎮一咸康遼縣也國初廢為鎮建州下保靖軍刺史遼初名軍曰武寧後更金因之戶一萬一千四百三十九縣一永霸本唐昌黎縣地全州下盤安軍節度使承安二年置改胡設務為靜封縣黑河鋪為盧川縣撥北京三韓縣烈虎等五猛安以隸焉貞祐二年四月嘗僑置于平州戶九千三百一十九縣一安豐承安元年十月改豐州鋪為安豐縣隸臨潢府二年置全州盤安軍節度使治有黃河黑河臨潢府下總管府地名西樓遼為上京國初因稱之天眷元年改為北京天德二年改北京為臨潢府路以北京路都轉運司為臨潢府路轉運司天德三年罷貞元元年以大定府為北京後但置北京臨潢路提刑司大定後罷路併入大定府路貞祐二年四月嘗僑置于平州有天平山好水川行宮地也大定二十五年命名有撒里乃地熙宗皇統九年嘗避暑于此有陷泉國言曰落孛魯有合裊追古思阿不漠合沙地戶六萬七千九百七縣五堡三十七大定間二十四後增臨潢倚有金粟河長泰有立列只山其北千餘里有龍駒河國言曰喝必剌有撒里葛覩地盧川承安二年以黑河鋪升隸全州後復來屬有潢河寧塞泰和元年五月置有滑河長寧遼永州永昌軍縣故名太祖天輔七年嘗置節度使皇統三年廢州來屬慶州下玄寧軍刺史境內有遼祖州天會八年改為奉州皇統三年廢遼太祖祖陵在焉境內有遼懷州舊置奉陵軍天會八年更為奉德軍皇統三年廢遼太宗穆宗懷陵在焉北山有遼聖宗興宗道宗慶陵城中有遼行宮比他州為富庶遼時刺此郡者非耶律蕭氏不與遼國寶貨多聚藏於此北至界二十里南至盧川二百二十西至桓州九百東至臨潢一百六十戶二千七縣一舊有孝安縣天會八年改為慶民縣皇統三年廢朔平有榷場務興州寧朔軍節度使本遼北安州興化軍皇統三年降軍置興化縣承安五年升為興州置節度軍名寧朔改利民寨為利民縣撥梅堅河徒門必罕寧江速馬剌三猛安隸焉貞祐二年四月僑置于密雲縣戶一萬五千九百七十縣二又有利民縣承安五年以利民寨升泰和四年廢興化倚遼舊縣皇統三年降興化軍置隸大定府承安五年建興州於縣為倚郭舊有白檀鎮宜興本興化縣白檀鎮泰和三年升為縣來屬泰州德昌軍節度使遼時本契丹二十部族牧地海陵正隆間置德昌軍隸上京大定二十五年罷之承安三年復置于長春縣以舊泰州為金安縣隸焉北至邊四百里南至懿州八百里東至肇州三百五十里戶三千五百四縣一舊有金安縣承安三年置尋廢堡十九長春遼長春州韶陽軍天德二年降為縣隸肇州承安三年來屬有撻魯古河鴨子河有別里不泉邊堡大定二十一年三月世宗以東北路招討司十九堡在泰州之境及臨潢路舊設二十四堡障參差不齊遣大理司直蒲察張家奴等往視其處置於是東北自達里帶石堡子至鶴五河地分臨潢路自鶴五河堡子至撒里乃皆取直列置堡戍評事移剌敏言東北及臨潢所置土塉樵絶當令所徙之民姑逐水草以居分遣丁壯營畢開壕塹以備邊上令無水草地官為建屋及臨潢路諸堡皆以放良人戍守省議臨潢路二十四堡堡置戶三十共為七百二十若營建畢官給一歲之食上以年飢權寢姑令開壕為備四月遣吏部郎中奚胡失海經畫壕塹旋為沙雪堙塞不足為禦乃言可築二百五十堡堡日用工三百計一月可畢糧亦足備可為邊防久計泰州九堡臨潢五堡之地斥鹵官可為屋外自撒里乃以西十九堡舊戍軍舍少可令大鹽濼官木三萬餘與直東堡近嶺求木每家官為構室一椽以處之西京路府二領節鎮七刺郡八縣三十九鎮九大定五年建宮室名其殿曰保安其門南曰奉天東曰宣仁西曰阜成天會三年建太祖原廟大同府中西京留守司晉雲州大同軍節度遼重熙十三年升為西京府名大同金因之皇統元年以燕京路隸尚書省西京及山後諸部族隸元帥府舊置兵馬都部署司天德二年改置本路都總管府後更置留守司置轉運司及中都西京路提刑司貢瑪瑙環子瑪瑙數珠産白駝安息香松明松脂黃連百藥煎芥子煎鹽撈鹽石緑緑礬鐵甘草枸嵵碾玉砂地菌戶九萬八千四百四十四縣七鎮三大同倚遼析雲中置金因之有牛皮關武周山方山奚望山盛樂城御河鬬雞臺平城外郭鹽場如渾水桑乾河紇真山有遼帝后像在華嚴寺鎮一奉義雲中晉舊縣名宣寧遼德州昭聖軍宣德縣大定八年更名有官山彌山石緑山産碾玉砂鎮一窟龍城懷安晉故縣名天成遼析雲中置白登本名長清大定七年更有白登臺採掠山懷仁遼析雲中置貞祐二年五月升為雲州有黃花嶺錦屏山清涼山金龍山早起城日中城鎮一安七疃豐州下天德軍節度使遼嘗更軍名應天尋復金因之皇統九年升為天德總管府置西南路招討司以天德尹兼領之大定元年降為天德軍節度使兼豐州管內觀察使以元管部族直撒軍馬公事並隸西南路招討司産不灰木地菌戶二萬二千六百八十三縣一鎮一富民晉舊名有黑山神山鎮一振武弘州下刺史遼名軍曰博寧本襄陰村統和中建國初置保寧軍後廢軍産瑪瑙戶二萬二千二縣二鎮二襄陰倚本名永寧大定七年改順聖本安塞軍故地遼應曆中置金因之鎮二陽門貞祐二年七月升為縣大羅淨州下刺史大定十八年以天山縣升為豐州支郡刺史兼權譏察北至界八十里戶五千九百三十八縣一天山舊為榷場大定十八年置為倚郭桓州下威遠軍節度使軍兵隸西北路招討司明昌七年改置刺史北至舊界一里半戶五百七十八縣一曷里滸東川更名金蓮川世宗曰蓮者連也取其金枝玉葉相連之義景明宮避暑宮也在涼陘有殿揚武殿皆大定二十年命名有查沙有白濼國言曰勺赤勒清塞倚明昌四年以罷録事司置撫州下鎮寧軍節度使遼秦國大長公主建為州章宗明昌三年復置刺史為桓州支郡治柔遠明昌四年置司候司承安二年升為節鎮軍名鎮寧撥西北路招討司所管梅堅必剌王敦必剌拿憐术花速宋葛斜忒渾四猛安以隸之戶一萬一千三百八十縣四有旺國崖大定八年五月更名靜寧山有麻達葛山大定二十九年更名胡土白山有冰井柔遠倚大定十年置于燕子城隸宣德州明昌三年來屬有燕子城國言曰吉甫魯灣城北羊城國言曰火唵榷場查剌嶺沔山大漁濼行宮有樞光殿有雙山七里河石井蝦蟆山昂吉濼又名鴛鴦濼得勝口舊名北望淀大定二十年更集寧明昌三年以春市場置北至界二百七十里豐利明昌四年以泥濼置有蓋里泊威寧承安二年以撫州新城鎮置德興府晉新州遼奉聖州武定軍節度國初因之大安元年升為府名德興戶八萬八百六十八縣六有漫天堝泰和二年更名拂雲平惡崖更名壘翠巖鎮一德興倚舊名永興縣大安元年更名有涿鹿定方水鎮有雞鳴山媯川遼可汗州清平軍本晉媯州會同元年遼太祖嘗名可汗州縣舊曰懷戎更名懷來明昌六年更今名西北有合河龜頭館石橋明昌四年建縉山遼儒州縉陽軍縣故名皇統元年廢州來屬崇慶元年升為鎮州鎮一永安望雲本望雲川地遼帝嘗居號曰御莊後更為縣金因之礬山晉故縣國初隸弘州明昌三年來屬龍門晉縣國初隸弘州後來屬明昌三年割隸宣德州有慶寧宮行宮也泰和五年以提舉兼龍門令昌州天輔七年降為建昌縣隸桓州明昌七年以狗濼復置隸撫州後來屬戶一千二百四十一縣一寶山有狗濼國言曰押恩尼要其北五百餘里有日月山大定二十年更曰抹白山國言涅里塞一山宣德州下刺史遼改晉武州為歸化州雄武軍大定七年更為宣化州八年復更為宣德戶三萬二千一百四十七縣二宣德舊文德縣大定二十九年更名宣平承安二年以大新鎮置以北邊用兵嘗駐此地也朔州中順義軍節度使貞祐三年七月嘗割朔州廣武縣隸代州産鐵荊三稜枸嵵戶四萬四千八百九十縣二鄯陽晉故縣有桑乾河大和嶺天池雁門關霸德山馬邑晉故縣貞祐二年五月升為固州有洪濤山灅水又曰桑乾河武州邊下刺史大定前仍置宣威軍戶一萬三千八百五十一縣一寧遠晉故縣黃河應州下彰國軍節度使戶三萬二千九百七十七縣三金城晉故縣有黃瓜堆復宿山桑乾河渾河崞川水黃花城山陰本名河陰大定七年以與鄭州屬縣同故更焉貞祐二年五月升為忠州有黃花嶺桑乾河渾源晉縣貞祐二年五月升為渾源州産鹽蔚州下忠順軍節度使遼嘗更為武安軍尋復貢地菌戶五萬六千六百七十四縣五靈仙北有桑乾河代王城薄家村廣靈亦作陵遼統和三年析靈仙置靈丘晉縣貞祐二年四月升為成州四年割為代州支郡定安晉縣有桑乾河貞祐二年四月升為定安州飛狐晉縣雲內州下開遠軍節度使天會七年徙奚第一第三部來戍産青鑌鐵戶二萬四千八百六十八縣二鎮一柔服夾山在城北六十里鎮一寧仁舊縣也大定後廢為鎮雲川本曷董館後升為裕民縣皇統元年復廢為曷董館大定二十九年復升更為今名寧邊州下刺史國初置鎮西軍貞祐三年隸嵐州四年二月升為防禦戶六千七十二縣一寧邊正隆三年置東勝州下邊刺史國初置武興軍有古東勝城戶三千五百三十一縣一鎮一東勝鎮一寧化部族節度使烏昆神魯部族節度使軍兵事屬西北路招討司明昌三年罷節度使以招討司兼領烏古里部族節度使石壘部族節度使助魯部族節度使孛特本部族節度使計魯部族節度使唐古部族承安三年改為部羅火扎石合節度使迪烈又作迭剌女古部族承安三年改為土魯渾扎石合節度使詳穩九處咩辭詳穩貞祐四年六月改為葛也阿鄰猛安木典辭詳穩貞祐四年改為抗葛阿鄰謀克骨典辭詳穩貞祐四年改為撒合輦必剌謀克唐古辭詳穩耶剌都辭詳穩移典辭詳穩蘇木典辭詳穩近北京胡都辭詳穩霞馬辭詳穩羣牧十二處斡獨碗羣牧大定四年改為斡覩只羣牧蒲速斡羣牧本斡覩只地大定七年分置耶魯碗羣牧訛里都羣牧辭斡羣牧歐里本羣牧烏展羣牧特滿羣牧駝駝都羣牧訛魯都羣牧忒恩羣牧承安四年創置蒲鮮羣牧承安四年創置中都路遼會同元年為南京開泰元年號燕京海陵貞元元年定都以燕乃列國之名不當為京師號遂改為中都府一領節鎮三刺郡九縣四十九天德三年始圖上燕城宮室制度三月命張浩等增廣燕城城門十三東曰施仁曰宣曜曰陽春南曰景風曰豐宜曰端禮西曰麗澤曰皓華曰彰義北曰會城曰通玄曰崇智曰光泰浩等取真定府潭園材木營建宮室及涼位十六應天門十一楹左右有樓門內有左右翔龍門及日華月華門前殿曰大安左右掖門內殿東廊曰敷德門大安殿之東北為東宮正北列三門中曰粹英為壽康宮母后所居也西曰會通門門北曰承明門又北曰昭慶門東曰集禧門尚書省在其外其東西門左右嘉會門也門有二樓大安殿後門之後也其北曰宣明門則常朝後殿門也北曰仁政門傍為𩽆殿𩽆殿上為兩高樓曰東西上閣門內有仁政殿常朝之所也宮城之前廊東西各二百餘間分為三節節為一門將至宮城東西轉各有廊百許間馳道兩傍植柳廊脊覆碧瓦宮闕殿門則純用碧瓦應天門舊名通天門大定五年更七年改福壽殿曰壽安宮明昌五年復以隆慶宮為東宮慈訓殿為承華殿承華殿者皇太子所居之東宮也泰和殿泰和二年更名慶寧殿又有崇慶殿魚藻池瑤池殿位貞元元年建有神龍殿又有觀會亭又有安仁殿隆德殿臨芳殿皇統元年有元和殿有常武殿有廣武殿為擊毬習射之所京城北離宮有太寧宮大定十九年建後更為壽寧又更為壽安明昌二年更為萬寧宮瓊林苑有橫翠殿寧德宮西園有瑤光臺又有瓊華島又有瑤光樓皇統元年有宣和門正隆三年有宣華門又有撒合門大興府上晉幽州遼會同元年升為南京府曰幽都仍號盧龍軍開泰元年更為永安析津府天會七年析河北為東西路時屬河北東路貞元元年更今名戶二十二萬五千五百九十二大定四年十月命都門外夾道重行植柳各百里産金銀銅鐵藥産滑石半夏蒼朮代赭石白龍骨薄荷五味子白牽牛縣十鎮一大興倚遼名析津貞元二年更今名有建春宮鎮一廣陽宛平倚本晉幽都縣遼開泰元年更今名有玉泉山行宮安次晉舊名漷陰遼太平中以漷陰村置永清晉舊名寶坻本新倉鎮大定十二年置以香河縣近民附之承安三年升置盈州為大興府支郡以香河武清隸焉尋廢州香河遼以武清縣之孫村置昌平有居庸關國名查剌合攀武清晉縣良鄉有料石岡閻溝通州下刺史天德三年升潞縣置以三河隸焉興定二年五月升為防禦戶三萬五千九十九縣二潞晉縣名有潞水三河晉縣名薊州中刺史遼置上武軍戶六萬九千一十五産栗縣五舊又有永濟縣大定二十七年以永濟務置未詳何年廢又有黎豁縣廢置皆未詳鎮二漁陽倚遵化遼景州清安軍鎮一石門豐潤泰和間置玉田有行宮偏林大定二十年改為御林鎮一韓城平峪大定二十七年以漁陽縣大王鎮升易州下刺史遼置高陽軍戶四萬一千五百七十七縣二易有易水淶水有淶水涿州中刺史遼為永泰軍貢羅戶一十一萬四千九百一十二縣五鎮一范陽倚晉縣有湖梁河有劉李河鎮一政滿固安晉縣新城定興大定六年以范陽縣黃村置割淶水易縣近民屬之有巨馬河奉先大定二十九年置萬寧縣以奉山陵明昌二年更今名有房山龍泉河盤寧宮順州下刺史遼置歸化軍戶三萬三千四百三十三縣二溫陽舊名懷柔明昌六年更有螺山蝄水兔耳山密雲遼檀州武威軍有古北口國言曰留斡嶺平州中興平軍節度使遼為遼興軍天輔七年以燕西地與宋遂以平州為南京以錢帛司為三司天會四年復為平州嘗置軍帥司天會十年徙軍帥司治遼陽府後置轉運司貞元元年以轉運司併隸中都路貞祐二年四月置東面經略司八月罷貢櫻桃綾戶四萬一千七百四十八縣五鎮一盧龍倚撫寧本新安鎮大定二十九年置海山本漢海陽故城遼以所俘望都縣民置故名望都大定七年更名遷安本漢令支縣故城遼以所俘安喜縣民置因名安喜大定七年更今名鎮一建昌昌黎遼營州鄰海軍以所俘定州民置廣寧縣皇統二年降州來屬大定二十九年以與廣寧府重故更今名灤州中刺史本黃落故城遼為永安軍天輔七年因置節度使戶六萬九千八百六縣四有松亭關國名斜烈只鎮二義豐倚石城有長春行宮長春淀舊名大定淀大定二十年更鎮一榛子馬城樂亭鎮一新橋雄州中宋名易陽郡天會七年置永定軍節度使隸河北東路貞元二年來屬戶二萬四百一十一縣三歸信倚有易水巨馬河容城泰和八年割隸安州貞祐二年隸安肅州有南易水大泥淀渾泥城保定宋保定軍後廢為縣霸州下刺史遼益津郡隸河北東路貞元二年來屬戶四萬一千二百七十六縣四益津倚大定二十九年創置倚郭文安大城信安國初因宋為信安軍大定七年降為信安縣隸霸州元光元年四月升為鎮安府所以重高陽公張甫也保州中順天軍節度使宋舊軍事天會七年置順天軍節度使隸河北東路貞元二年來屬海陵賜名清苑郡戶九萬三千二十一縣二清苑倚宋名保塞大定十六年更有抱陽山沉水饋軍河滿城大定二十八年以清苑縣塔院村置安州下刺史宋順安軍治高陽天會七年升為安州隸河北東路後置高陽軍大定二十八年徙治葛城因升葛城為縣作倚郭泰和四年改混泥城為渥城縣來屬八年移州治於渥城以葛城為屬縣戶三萬五百三十二縣三渥城倚泰和四年置葛城大定二十八年置高陽泰和八年正月改隸莫州四月復有徐河百濟河遂州下刺史宋廣信軍天會七年改為遂州隸河北東路貞元二年來隸號龍山郡泰和四年廢為遂城縣隸保州貞祐二年復置州戶一萬一千一百七十四縣一遂城倚有光春宮行宮有遂城山易水漕水鮑河安肅州下刺史宋安肅軍天會七年升為徐州軍如舊隸河北東路貞元二年來屬天德三年改為安肅州軍名徐郡軍大定後降為刺郡廢軍戶一萬二千九百八十縣一安肅按金初州郡志雄霸保安遂安肅六州皆隸廣寧府太宗紀載天會七年分河北為東西路則隸河北東路豈以平州為南京之後以六州隸廣寧也不然則郡志誤
