body:
  text: 金史卷一百十七列傳第五十五徒單益都粘哥荊山劉均附王賓王進等附國用安時青徒單益都不詳其履歷嘗纍官為延安總管正大九年正月行省事於徐州時慶山奴撤東方之備入援未至睢州徐邳義勝軍總領侯進杜政張興率本軍降大兵於永州辛丑大兵守徐張盆渡益都到官才三日懼兵少不能守即令移剌長壽率甲士千人迎大兵長壽軍無紀律大兵掩之一軍皆覆徐危甚益都籍州人及運糧掃兵得萬人乙巳大兵傅城燒南關而去侯進既降北即以為京東行省進遂請千人來襲二月庚申未明大兵坎南城而上守者皆散走城中大呼曰大兵入南門矣益都聞之不及甲率州署夜直兵三百由黃樓而南力戰禦敵亂定遷賞有差由是軍勢稍振復奪張盆渡取蕭縣破白塔戰於土山救被俘老幼五千還徐既而侯進亡命駐靈璧杜政張興亦慮為北所害窮窘自歸益都撫而納之興留徐杜政還邳州益都資禀仁厚持大體二子兩姪為軍將頗侵漁軍民青州人王祐為掃兵總領將兵千七百人益都常倚之雖有過亦不責以故祐亦橫恣與河間張祚下邑令李閏義勝都統封仙遙授永州刺史成進忠輩乘軍政廢弛城中空虛以六月丁巳夜燒草場作亂時張興臥病祐恐事不成起興與同行益都疑左右皆叛挈妻子縋城而出就從宜衆僧奴及東面總領劉安國軍張興推祐為都元帥復懼祐圖己遂誅祐並張祚殺之因大掠城中壬戌國用安以行山東路尚書省事率兵至徐張興率甲士迎之用安輕騎而入執興與其黨十餘人斬之于巿遂以封仙為元帥兼節度使主徐州益都窘無所歸乃奔宿州節度使紇石烈阿虎以益都為人所逐不納乃與諸將駐于城南時宿之鎮防軍有逃還者阿虎以為叛歸亦不納城中鎮防千戶高臘哥結小吏郭仲安謀就徐州將士內相應以取宿因歸楊妙真甲戌夜半開門納徐州總領王德全及妻弟高元哥軍劉安國尋亦入城縛阿虎父子殺之州中請益都主帥府事益都不從曰吾國家舊人為將帥亦久以資性疏迂不能周防遂失重鎮今大事已去方逃罪不暇豈有改易髻髮奪人城池以降外方乎即日率官吏而行至穀熟東遇大兵不屈而死徐州既歸海州邳帥兀林答某亦讓印於杜政遂送款於用安已而宿州王德全劉安國亦送款海州惟益都不改髻髮以至於死云粘哥荊山不知其所始正大中纍官亳州節度使九年正月己丑游騎自鄧至亳鈔鹿邑營於衛真西北五十里鹿邑令高昂霄知太康已降即夜趨亳道出衛真呼縣令楚珩約同行王亍知勢不支即明諭縣人以避遷之意遂同走亳丁未二邑皆降是日軍至亳州城下州止有單州兵四百人號鎮安軍提控楊春邢某都統戴興屯已六年荊山悉籍城中丁壯為軍修守具而大兵亦不暇攻四月擁降民而北城門閉不之知也五月縱遷民收麥老幼得出丁壯悉留之民往往不肯留而遁數日城為之空荊山遣將領各詣所屬招之並將領亦不返鎮安者皆紅襖餘黨力盡來歸變詐反覆朝廷終以盜賊待之荊山以遷民為軍蓋防之也及召外兵不至乃請於歸德得甲騎百餘兩總領統之既至鎮安疑其謀己乃乘將士新到不設備至夜掩殺殆盡荊山出走衛真楚珩與之馬而去州中豪貴悉被剽略劉堅者初為大兵守城父亳州復擒之囚之於獄楊春謀欲北降乃出之使為宣差乙巳大兵石總管入州改州為順天府春為總管戴興為同知劉順治中留党項軍千人戍之屬縣皆下惟城父令李用宜不降其妻子在亳春以為質竟不屈而死春既據州與劉堅坐樓上召副提控邢某邢剛直循理將士嚴憚之時臥病聞春亂流涕不自禁春遣人舁致之邢指春大罵春慚恧無言春欲殺荊山家邢力勸止之且令給道路費送之出城邢尋病卒二年夏四月北省忒木木受攻歸德春以戴興提精卒以往獨與疲弱者守城州人王賓遂反正春渡河北遁既而崔七斤為亂殺王賓朝廷不得已以七斤為節度使就其兵仗入蔡八月劉順攻亳州破之七斤為城父令所殺未幾單州軍以州人殺其家屬召大兵來攻不能拔殺屬縣民而去既渡河知亳人不疑復來攻州竟為春所破是年六月宋人來攻春出降劉堅北走劉均者林慮人時為亳州觀察判官春既逐荊山納款大兵脅均同降均佯應之歸其家取朝服服之顧謂妻子曰我起身刀筆仰荷上知始列朝著又佐大藩死亦足矣今頭顱已如此假使有十年壽何以見先帝於地下乎即仰藥而死王賓字德卿亳州人貞祐二年進士外若曠達而深有謀畫初調蘭陵主簿辟虹縣令尋入為尚書省令史坐事罷歸鄉里天興元年正月亳州軍變節度使粘哥荊山出走楊春以州出降既而自以羸兵守之賓與前譙縣尉王進魏節亨呂鈞約城中軍民復其州楊春遂遁遣節亨詣歸德以聞哀宗嘉之授進節度使賓同知節度使節亨節度副使鈞觀察判官楊春復以兵來攻月餘不能拔即渡河而北六月哀宗遷蔡賓奉迎於州北之高安上與語大悅恨用之晚擢為行部尚書世襲謀克上初至亳賓等適徵民丁負鐵甲入蔡及會計忠孝軍家屬口糧故留參知政事張天綱董之就遷有功將士時亳之糧儲不廣賓等常吝惜軍士以此歸怨及運甲之役復不欲行會天綱與賓等於一樓上銓次立功等第鎮防軍崔復哥王六十之徒擐甲譁譟登樓天綱問曰即欲見殺容我望闕拜辭賊曰無預相公即拽賓及呂鈞往巿中鈞且行且跪涕淚俱下賓岸然不懼大叫曰不過殺我但殺但殺乃並害之節度副使魏節亨節度判官孫良觀察副使孫九住皆被害又數日殺節度使王進進嘗應荊山之募由間道入汴京納奏賞以物不受又散家所有濟貧民以死自勵至汴以勞遷本州節度判官賜以白金亦不受一時甚稱之有李喜住者本宿州衆僧奴下宣差天興二年四月進糧入歸德將還聞亳州王進反正制旨以喜住為振武都尉將兵三千應援是時太赤圍亳步騎十萬喜住以衆寡不敵獨與三人間道入城王進方議遷左軍林喜住不可進即以兵付喜住大兵攻八日不能下五月壬子兵退己未官奴與阿里合提忠孝軍百人至亳與諸將議遷可否以為不可當留輜重於蔡選軍扈從入聖朵就武仙軍遂入關中關中地利可恃又有郭蝦等軍在西可恃五月甲子召官奴還歸德不赴再召留其軍半於亳乃赴六月壬辰車駕舟行至亳王進奏臣本軍伍不知治體如李喜住扈從入蔡則亳不守矣乞留治此州詔以喜住為集慶軍節度使便宜從事進領帥職七月進死喜住先往城父督糧餫聞亂遂不敢入亳後投宋論曰金季之亂軍士欲代其偏裨偏裨欲代其主將即羣起而僨之無復忌憚益都荊山皆忠亮之士賓進才略尤足取焉而並不免於難惜哉國用安先名安用本名咬兒淄州人紅襖賊楊安兒李全餘黨也嘗歸順大元為都元帥行山東路尚書省事天興元年六月徐州掃兵總領王祐義勝軍都統封仙總領張興等夜燒草場作亂逐元帥徒單益都安用率兵入徐執張興與其黨十餘人斬之以封仙為元帥兼節度使主徐州宿州鎮防軍千戶高臘哥與東面總帥劉安國搆徐州總帥王德全殺宿帥紇石烈阿虎以其州歸海州邳州從宜兀林答某亦讓州於杜政送發海州既而皆歸安用北大將阿术魯聞安用據徐宿邳大怒曰此三州我當攻取安用何人輒受降遣信安張進等率兵入徐欲圖安用奪其軍安用懼謀於德全劫殺張進及海州元帥田福等數百人與楊妙真絶乃還邳州會山東諸將及徐宿邳主帥刑馬結盟誓歸金朝既盟諸將皆散去安用無所歸遂同德全安國託從宜衆僧奴自通於朝廷衆僧奴遣人上奏安用以數州反正功甚大且其兵力強盛材略可稱國家果欲倚用非極品重權不足以堅其許國之心未報安用率兵萬人攻海州未至衆稍散去安國因勸安用當赤心歸國安用亦自知反復失計事已無可奈何於是復金朝衣冠妙真怒其叛己又懼為所圖悉屠安用家走益都安用遂選兵分將期必得妙真自此淮海之上無寧歲矣未幾朝廷遣近侍局直長因世英都事高天祐持手詔至邳以安用為開府儀同三司平章政事兼都元帥京東山東等路行尚書省事特封兗王賜號英烈戡難保節忠臣錫姓完顏附屬籍改名用安賜金鍍銀印紐金印金虎符世襲千戶宣命敕樣牌樣御畫體宣空頭河朔山東赦文便宜從事且以彭王妃誥委用安招妙真用安始聞使者至猶豫未決以總領楊懋迎使者入監于州廨問所以來世英對以封建事意頗順諸帥王杜輩皆不欲宣言欲殺使者明日用安乃出見使者跪揖如等夷坐定語世英曰豫向隨大兵攻汴嘗於開陽門下與侯摯議內外夾擊此時大兵病死者衆十七頭項皆在京城若從吾計出軍中興久矣朝廷乃無一人敢決者今日悔將何及言竟而起既而選人取朝廷賜物遍觀之喜見顏色復與使者私議欲不以朝禮受之世英等不可即設宴拜授如儀以主事常謹等隨使者奉表入謝上復遣世英天祐賜以鐵券一虎符六龍文衣一玉魚帶一弓矢二封贈其父母妻誥命及郡王宣世襲宣大信牌玉兔鶻帶各十聽同盟可賜者賜之使者至邳用安迎受如禮始有入援意及聞上將遷蔡州乃遣人以蠟書言遷蔡有六不可大率以謂歸德環城皆水卒難攻擊蔡無此險一也歸德雖乏糧儲而魚芡可以取足蔡若受圍廩食有限二也大兵所以去歸德者非畏我也縱之出而躡其後舍其難而就其易者攻焉三也蔡去宋境不百里萬一資敵兵糧禍不可解四也歸德不保水道東行猶可以去蔡若不守去將安之五也時方暑雨千里泥淖聖體豐澤不便鞍馬倉卒遇敵非臣子所敢言六也雖然陛下必欲去歸德莫如權幸山東山東富庶甲天下臣略有其地東連沂海西接徐邳南扼盱楚北控淄齊若鑾輿少停臣仰賴威靈河朔之地可傳檄而定惟陛下審察上以其言示宰臣宰臣奏用安反復本無匡輔志此必參議張介等議之業已遷蔡議遂寢初世英等過徐王德全劉安國說之曰朝廷恩命豈宜出自用安郡王宣吾二人最當得者乞就留之世英乃留郡王宣世襲宣玉帶各二由是與用安有隙又懼為所圖皆不聽其節制十郡王者李明德封仙張瑀張友卓翼康琮杜政吳歪頭王德全劉安國也用安必欲取山東纍徵徐宿兵止以勤王為辭二帥不應用安怒令杜政等率兵三千以取糧為名襲徐宿既入城德全覺之就留杜政封仙不遣用安愈怒謂德全安國必有謀乃執桃園帥吳某等八九人下獄鞫問二帥遣溫特罕張哥以杜政封仙欲襲取徐州白用安不聽驅吳帥張哥輩九人並斬之張哥將死大呼曰國咬兒汝無尺寸功受國家大封爵何負於汝而從杜政等變亂又殺無罪之人今雖死當與汝辨於地下矣會上遣臧國昌以密詔徵兵東方故用安假朝命聲言入援檄劉安國為前鋒親率兵三千駐徐州城下招德全德全終疑見圖不出係封仙於獄殺之遣杜政出城安國既至宿州用安復召安國還安國不從獨與衆僧奴赴援行及臨渙龍山寺用安使人劫殺之遂攻徐州踰三月不能下退歸漣水於是因世英以用安終不赴援乃還朝至宿州西遇大兵不屈而死事聞贈汝州防禦使既而用安軍食不給乞糧於宋宋陽許之即改從宋衣冠而私與朝使相親尋益乏食軍民多亡去乃命蕭均以嚴刑禁亡者血流滿道大元東平萬戶查剌將兵至漣水遂降焉查剌既渡河趨蔡州用安以詭計還漣水復叛歸於宋受浙東總管忠州團練使隸淮閫甲午正月聞大兵圍沛用安往救之敗走徐州會移兵攻徐用安投水死求得其尸面繫馬尾為怨家田福一軍臠食而盡用安形狀短小無須喜與輕薄子游日擊鞠衢巿間顧眄自矜無將帥大體介字介甫平州人正大元年經義進士第一時為用安參議初天祐等出汴微服間行經北軍營幕至通許崔橋始有義軍招撫司官府去京師二百里矣至陳州防禦使粘葛奴申始立州事留二日至項城縣令朱珍立縣事有士卒千二百人至泰和縣縣令王義立縣已五月矣八月至宿州衆僧奴得報且知朝廷授以權宿州節度使兼元帥左都監之命具彩輿儀衛出城五里奉迎時東方不知朝廷音問已八月矣官民見使者至且拜且哭有張顯者任俠尚氣知義理即謂天祐曰東方不知朝廷音問已數月今見使者百姓皆感動若不以聖旨撫慰之恐失東民之心我欲矯稱制旨宣諭如何天祐書生守規矩不敢從但以宰相旨集州民慰撫之州民復大哭明日往徐州時青滕陽人初與叔父全俱為紅襖賊及楊安兒劉二祖敗承赦來降隸軍中興定初青為濟州義軍萬戶是時叔父全為行樞密院經歷官興定二年冬全馳驛過東平青來見因告全將叛入宋全祕之頃之青率其衆入于宋宋人置之淮南屯龜山有衆數萬興定四年泗州行元帥府紇石烈牙吾塔遣人招之青以書來書曰青本滕陽良民遭時亂離扶老幼避地草莽官吏不明此心目以叛逆無所逃死竄匿淮海離親舊去鄉邑豈人情之所樂哉僕雖偷生寄食他國首丘之念未嘗一日忘之如朝廷赦青之罪乞假邳州以屯老幼當襲取盱眙盡定淮南以贖往昔之過牙吾塔復書曰公等初亦無罪誠能為國建功全軍來歸即吾人也邳州吾城以吾人居之亦何不可易曰君子見幾而作不俟終日公其亟圖之生還父母之邦富貴終身傳芳後世與其羈縻異域目以兵虜孰愈哉牙吾塔奏其事十月詔加青銀青榮祿大夫封滕陽公仍為本處兵馬總領元帥兼宣撫使青潛表陳謝復以邳州為請樞密院奏恐青意止欲得邳州可諭牙吾塔若青誠實來歸即當授之如審其詐可使人入宋境宣布往來之言及所授官爵亦行間之術也青既不得邳州復為宋守興定五年正月二十五日夜青襲破泗州西城提控王祿遇害是時時全為同簽樞密院事朝廷不知青襲破西城止稱宋人而已詔全往督泗州兵取西城全至泗州獲紅襖賊一人詰問之乃知青為宋京東鈐轄襲破西城全頗喜乃殺其人以滅口牙吾塔晝夜力戰募死士以梯衝逼城青縋兵出拒不得前牙吾塔遣提控王應孫穴城東北隅青夜出兵來襲擊却之越二日復出又却之攻城益急青以舟兵二千合城中兵來犯牙吾塔營提控斡魯𩽆先知設伏掩擊青兵大敗溺淮水死者千人自是不復出矣王應孫穴城將及城中青隧地然薪逼出之青乘城指麾流矢中其目餘衆往往被創樓堞相繼摧壞城中恟懼遂無固志二月二十六日夜青拔衆走遂復西城元光元年二月全與元帥左監軍訛可節制三路軍馬伐宋詔曰卿等重任毋致不和以貽喪敗其資糧可取規取失宜不能得之罪在訛可既已得之不能運致以為我用罪在全全與訛可由潁壽進渡淮敗宋人于高塘巿攻固始縣破宋廬州將焦思忠兵無何獲生口言時青受宋詔與全兵相拒全匿其事五月兵還距淮二十里諸軍將渡全矯稱密詔諸軍且留收淮南麥遂下令人獲麥三石以給軍衆惑之訛可及諸將佐勸之不聽軍留三日訛可謂全曰今淮水淺狹可以速濟時方暑雨若值暴漲宋乘其後將不得完歸矣全力拒之從宜達阿移失不斜烈李辛稍稍不平全怒曰訛可一帥耳汝曹黨之汝曹致身至此皆吾之力吾院官也於汝無不可者衆乃不敢言是夜大雨明日淮水暴漲乃為橋渡軍宋兵襲之軍遂敗績橋壞全以輕舟先濟士卒皆覆沒宣宗乃下詔誅之遣官招集潰軍詔曰大軍渡淮每立功效諸將謬誤部曲散亡流離憂苦朕甚閔焉各歸舊營勉圖自效又詔曰陳亡把軍品官子孫十五以上者依品官子孫例隨局承應十五以下十歲以上者依品從隨局給俸至成人本局差使無子孫官依例給俸應贈官賻錢軍人家口當養贍者並如舊制贊曰金自章宗季年宋韓托胄搆難招誘鄰境亡命以撓中原事竟無成而青徐淮海之郊民心一搖歲遇饑饉盜賊𧔧起相為長雄又自屠滅害及無辜十餘年麋沸未息宣宗不思靖難復為伐宋之舉迄金之亡其禍尤甚簡書所載國用安時青等遺事至今仁人君子讀之猶蹙頞終日當時蒸黎如魚在釜其何以自存乎兵凶器也金以兵得國亦以兵失國可不慎哉可不慎哉
