body:
  text: 金史卷一百二十三列傳第六十一忠義三徒單航完顏陳和尚楊沃衍烏古論黑漢陀滿胡土門姬汝作愛申馬肩龍附禹顯徒單航一名張僧駙馬樞密使某之子也父號九駙馬衛王有事北邊改授都元帥仍權平章殊不允人望張僧時為吏部侍郎力勸其父請辭帥職遂拜平章至寧元年胡沙虎弒逆降航為安州刺史會北兵大至城下聲言都城已失守汝可速降航謂其民曰城守雖嚴萬一攻破汝輩無孑遺矣我家兩世駙馬受國厚恩決不可降汝輩計將安出其民曰太守不屈我輩亦何忍降願以死守航乃盡出家財以犒軍民軍民皆盡力備禦又五日城危航度不可支謂其妻孥曰今事急矣惟有死爾乃先縊其妻孥謂其家人曰我死即撤屋焚之遂自縊死城破人猶力戰曰太守既死我輩不可獨降死者甚衆完顏陳和尚名彝字良佐世以小字行豐州人系出蕭王諸孫父乞哥泰和南征以功授同知階州軍事及宋復階州乞哥戰歿於嘉陵江貞祐中陳和尚年二十餘為北兵所掠大帥甚愛之置帳下時陳和尚母留豐州從兄安平都尉斜烈事之甚謹陳和尚在北歲餘託以省母乞還大帥以卒監之至豐乃與斜烈劫殺監卒奪馬奉其母南奔大兵覺合騎追之由他路得免既而失馬母老不能行載以鹿角車兄弟共挽南渡河宣宗奇之斜烈以世官授都統陳和尚試補護衛未幾轉奉御及斜烈行壽泗元帥府事奏陳和尚自隨詔以充宣差提控佩金符斜烈辟太原王渥為經歷渥字仲澤文章論議與雷淵李獻能相上下故得師友之陳和尚天資高明雅好文史自居禁衛日人以秀才目之至是渥授以孝經小學論語春秋左氏傳略通其義軍中無事則窗下作牛毛細字如寒苦之士其視世味漠然正大二年斜烈落帥職例為總領屯方城陳和尚隨以往凡兄軍中事皆預知之斜烈時在病軍中李太和者與方城鎮防軍葛宜翁相毆訴於陳和尚宜翁事不直即量笞之宜翁素凶悍恥以理屈受杖竟鬱鬱以死留語其妻必報陳和尚妻訟陳和尚以私忿侵官故殺其夫訴於臺省於近侍積薪龍津橋南約不得報則自焚以謝其夫以故陳和尚繫獄議者疑陳和尚狃於禁近倚兵閫之重必橫恣違法當以大辟奏上久不能決陳和尚聚書獄中讀之凡十有八月明年斜烈病愈詔提兵而西入朝哀宗怪其瘦甚問卿寧以方城獄未決故耶卿但行吾今赦之矣以臺諫復有言不敢赦未幾斜烈卒上聞始馳赦陳和尚曰有司奏汝以私忿殺人汝兄死失吾一名將今以汝兄故曲法赦汝天下必有議我者他日汝奮發立功名國家得汝力始以我為不妄赦矣陳和尚且泣且拜悲動左右不能出一言為謝乃以白衣領紫微軍都統踰年轉忠孝軍提控五年北兵入大昌原平章合達問誰可為前鋒者陳和尚出應命先已沐浴易衣若將就木然者擐甲上馬不反顧是日以四百騎破八千衆三軍之士踴躍思戰蓋自軍興二十年始有此捷奏功第一手詔褒諭授定遠大將軍平涼府判官世襲謀克一日名動天下忠孝一軍皆回紇乃滿羌渾及中原被俘避罪來歸者鷙狠凌突號難制陳和尚御之有方坐作進退皆中程式所過州邑常料所給外秋毫無犯街曲間不復喧雜每戰則先登陷陳疾若風雨諸軍倚以為重六年有衛州之勝八年有倒回谷之勝自刑徒不四五遷為禦侮中郎將副樞移剌蒲阿無持重之略嘗一日夜馳二百里趨小利軍中莫敢諫止陳和尚私謂同列曰副樞以大將軍為剽略之事今日得生口三百明日得牛羊一二千士卒喘死者則不復計國家數年所積一旦必為是人破除盡矣或以告蒲阿一日置酒會諸將飲酒行至陳和尚蒲阿曰汝曾短長我又謂國家兵力當由我盡壞誠有否陳和尚飲畢徐曰有蒲阿見其無懼容漫為好語云有過當面論無後言也九年正月三峯山之敗走鈞州城破大兵入即縱軍巷戰陳和尚趨避隱處殺掠稍定乃出自言曰我金國大將欲見白事兵士以數騎夾之詣行帳前問其姓名曰我忠孝軍總領陳和尚也大昌原之勝者我也衛州之勝亦我也倒回谷之勝亦我也我死亂軍中人將謂我負國家今日明白死天下必有知我者時欲其降斫足脛折不為屈豁口吻至耳噀血而呼至死不絶大將義之酹以馬湩祝曰好男子他日再生當令我得之時年四十一是年六月詔贈鎮南軍節度使塑像褒忠廟勒石紀其忠烈斜烈名鼎字國器畢里海世襲猛安年二十以善戰知名自壽泗元帥轉安平都尉鎮商州威望甚重敬賢下士有古賢將之風初至商州一日搜伏於大竹林中得歐陽修子孫問而知之並其族屬鄉里三千餘人皆縱遣之楊沃衍一名斡烈賜姓兀林答朔州靜邊官莊人本屬唐括迪剌部族少嘗為北邊屯田小吏會大元兵入境朝命徙唐括族內地沃衍留不徙率本部族願從者入保朔州南山茶嵵溝有衆數千推沃衍為招撫使號其溝曰府故殘破鎮縣徒黨日集官軍不能制又與大兵戰連獲小捷及乏食遂行剽劫官軍捕之巨戰不下轉走寧隩武朔寧邊諸州民以為病朝廷遣人招之沃衍即以衆來歸時宣宗適南遷次淇門聞之甚喜遂以為武州刺史武州屢經殘毀沃衍入州未幾而大兵來攻死戰二十七晝夜不能拔乃退時貞祐二年二月也既而朝廷以武州終不可守令沃衍遷其軍民駐岢嵐州以武州功擢為本州防禦使俄升岢嵐為節鎮以沃衍為節度使仍詔諭曰卿於國盡忠纍有勞績今特升三品恩亦厚矣其益勵忠勤與宣撫司輯睦以安軍民沃衍自奉詔即以身許國曰為人不死王事而死於家非大丈夫也三年奉旨屯涇邠隴三州沃衍分其軍九千人為十翼五都統親統者十之四是冬西夏四萬餘騎圍定西州元帥右都監完顏賽不以沃衍提控軍事率兵與夏人戰斬首幾二千生擒數十人獲馬八百餘匹器械稱是餘悉遁去詔陝西行省視功官賞之興定元年春上以沃衍纍有戰功賜今姓未幾遙授通遠軍節度使兼鞏州管內觀察使是冬詔陝西行省伐宋沃衍與元帥左都監內族白撒通遠軍節度使溫迪罕婁室同知通遠軍節度使事烏古論長壽平西軍節度副使和速嘉兀迪將兵五千出鞏州鹽川至故城逢夏兵三百擊走之又入西和州至岐山堡遇兵六千凡三隊遣軍分擊逐北三十餘里斬首四百級生獲十人馬二百匹甲仗不勝計尋復得散關二年正月捷報至上大喜詔遷沃衍官一階遙授知臨洮府事三年武休關之捷沃衍功居多詔特遷一官元光元年正月遙授中京留守六月進拜元帥右監軍仍世襲納古胡里愛必剌謀克二年春北兵游騎數百掠延安而南沃衍率兵追之戰于野猪嶺獲四人而還俄而兵大至駐德安寨復擊走之未幾大兵攻鳳翔還道出保安沃衍遣提控完顏查剌破于石樓臺前後獲馬二百符印數十詔有司論賞初聞野猪嶺有兵沃衍約陀滿胡土門以步軍會戰胡土門宿將常輕沃衍至是失期沃衍戰還會諸將欲斬胡土門諸將哀請乃釋之時大兵聲勢益振陝西行省檄沃衍清野不從曰我若清野明年民何所得食遂隔大澗持勢使民畢麥事正大二年進拜元帥左監軍遙領中京留守八年冬平章合達參政蒲阿由鄧州而西沃衍自豐陽川遇於五𩽆山下問禹山之戰如何合達曰我軍雖勝而大兵已散漫趨京師矣沃衍憤云平章參政蒙國厚恩握兵失事機不能戰禦乃縱兵深入尚何言耶三峯山之敗沃衍走鈞州其部曲白留奴呆劉勝既降請于大帥願入鈞招沃衍大帥質留奴令勝入鈞見沃衍道大帥意降則當授大官沃衍善言慰撫之使前拔劍斫之曰我起身細微蒙國大恩汝欲以此污我耶遂遺語部曲後事望汴京拜且哭曰無面目見朝廷惟有一死耳即自縊部曲舉火並所寓屋焚之從死者十餘人沃衍死時年五十二初大兵破西夏長驅而至關輔千里皆洶洶不安雖智者亦無如之何沃衍與其部將劉興哥者率兵往來邠隴間屢戰屢勝故大軍猝不能東下興哥鳳翔虢縣人起於羣盜人呼曰熱劉後於清化戰死大兵至酹酒以弔西州耆老語之至為泣下烏古論黑漢初以親軍入仕嘗為唐鄧元帥府把軍官天興二年唐州刺史內族斜魯病卒鄧州總帥府以蒲察都尉權唐州事宋軍兩來圍唐又唐之糧多為鄧州所取以故乏食六月遣萬戶夾谷定住入歸德奏請軍糧不報七月鎮防軍馮總領甄改住為變殺蒲察都尉時朝廷道梗帥府承制以黑漢權刺史行帥府事既而鎮防軍有歸宋之謀時裕州大成山聶都統一軍五百人在州獨不欲歸宋與鎮防軍為敵鎮防不能勝棄老幼奔棗陽宋人以故知唐之虛實會鄧帥移剌瑗以城叛歸于宋遺書招黑漢黑漢殺其使者不報宋王安撫率兵攻唐鄂司王太尉繼至攻益急黑漢聞哀宗遷蔡遣人求救上命權參政兀林答胡土將兵以往宋人設伏縱其半入城邀擊之胡土大敗僅存三十騎以還城中糧盡人相食黑漢殺其愛妾啖士士爭殺其妻子官屬聚議欲降黑漢與聶都統執議益堅馮總領乃私出城與王安撫會飲約明日宋軍入城馮歸宋軍不得入聶都統請馮議事即坐中斬之及其黨皆死總領趙醜兒者初與馮同謀內不自安開西門納宋軍黑漢率大成山軍巷戰自辰至午宋軍大敗而出殺傷無數宋人城下大呼趙醜兒約並力殺大成山軍大成軍敗宋人獲黑漢脅使降黑漢不屈為所殺其得脫走者十餘人總領移剌望軍女奚烈軍醜兒走蔡州皆得遷賞後俱死於甲午之難陀滿胡土門字子秀策論進士也纍官翰林待制貞祐二年遷知中山府三年改知臨洮府兼本路兵馬都總管叛賊蘭州程陳僧等誘夏人入寇圍臨洮凡半月城中兵數千而粟且不支衆皆危之胡土門日為開諭逆順禍福皆自奮因捕其黨欲為內應者二十人斬之擲首城外賊四面來攻乃夜出襲賊壘夏兵大亂金軍乘之遂大捷夏人遁去四年知河中府事權河東南路宣撫副使十月進元帥右監軍兼前職興定二年為絳陽軍節度使兼絳州管內觀察使十月遷元帥左監軍行元帥府事兼知晉安府河東南路兵馬都總管於是修城池繕甲兵積芻糧以備戰守民不悅行省胥鼎聞之遺以書曰元帥始鎮河中惠愛在民移斾晉安遠近欣仰去歲兵入平陽不守河東保完者惟絳而已蓋公坐籌制勝威德素著故不動聲氣以至無虞也邇來傳聞治政太剛科徵太重鼎切憂之古人有言御下不寬則人多懼禍用人有疑則士不盡心況大兵在邇鄰境已虛小人易動誠不可不慮也願公以謙虛待下忠孝結人明賞罰平賦稅上以分聖主宵旰之憂下以為河東長城之託胡土門得書懼民不從且或生變乃上言臣本瑣材猥膺重寄方將治隍陴積芻糧為捍禦之計而小民難與慮始以臣政令頗急皆有怨言遂貽行省之憂自聞訓諭措身無所內自悛悔外加寬撫庶幾少慰衆心而近以朝命分軍過河則又歡言帥臣不益兵保守而反助河南將棄我也人心如此恐一旦遂生他變向者李革在平陽人不安之而革隱忍不言以至于敗臣實拙繆無以服人敢以鼎書上聞惟朝廷圖之朝廷以鼎言遣吏部尚書完顏閭山代之或曰胡土門欲以計去晉安乃大興役恣為殺戮務失民心故鼎言及之未幾晉安失守死者幾百萬人遂失河東三年八月改太常卿權簽樞密院事知歸德府事元光二年二月坐上書不實削一官正大三年七月復為臨洮府總管四年五月城破被執誘之降不應使之跪不從以刀亂斫其膝脛終不為屈遂殺之五年詔贈中京留守立像褒忠廟録用其子孫其妻烏古論氏亦死節有傳姬汝作字欽之汝陽人全州節度副使端修之姪孫也父懋以蔭試部掾轉尚書省令史汝作讀書知義理性豪宕不拘細行平日以才量稱正大末避兵嵩山保鄉鄰數百家衆以長事之後徙居交牙山寨會近侍局使烏古論四和撫諭西山以便宜授汝作北山招撫使佩銀符遂遷入汝州初汝州殘破之後天興元年正月同知宣徽院事張楷授防禦使自汴率襄郟縣土兵百餘人入青陽𣛀時呼延實者領青陽寨事實趙城人本楊沃衍部曲以戰功至寶昌軍節度使閒居汝之西山楷自揣不能服衆乃以州事託實尋往鄧州從山公武仙後大元兵至城破殺數千人乃許降以張宣差者管州事三月鈞州潰軍柳千戶者入州張逃去柳遂據之未幾城復破及汝作至北兵雖去但空城爾汝作招集散亡復立市井北兵屢招之不從數戰互有勝負已而北兵復來攻汝作親督士卒以死拒之兵退間道納奏哀宗宣諭此州無險固可恃汝乃能為國用命今授以同知汝州防禦使便宜從事是時此州南通鄧州西接洛陽東則汴京使傳所出供億三面傳通音耗然呼延實在青陽為總帥忌汝作城守之功不能相下州事動為所制實欲遷州入山謂他日必為大兵所破汝作以為倉中糧尚多四面潰軍日至此輩經百死激之皆可用朝廷倚我守此州總帥乃欲棄之何心哉讒間既行有相圖之隙詳議官楊鵬釋之曰外難未解而顧私忿語甚諄切實乃還山鵬因勸汝作納奏乞死守此州以堅軍民之心其冬戰于襄郟得馬百餘士氣頗振遂以汝作為總帥不復與實相關矣天興二年六月哀宗在蔡州遣使徵兵入援州人為邏騎所擾農事盡廢城中糧亦垂盡是月中京破部曲私議有唇亡之懼謀以城降懼汝作不敢言乃以遷州入山白之汝作怒曰吾家父祖食祿百年今朝廷又以州事帥職委我吾生為金民死為金鬼汝輩欲避於山非欲降乎有再言遷者吾必斬之八月塔察將大兵攻蔡經汝州州人梁臯作亂與故吏溫澤王和七八人徑入州廨汝作不為備遂為所殺時宣使石圭體究洛陽所以破及強伸死節事以路阻留汝州驛梁臯既殺汝作走告圭曰汝作私積糧斛不恤軍民衆怒殺之矣臯不圖汝作官職惟宣使裁之圭懼乃以臯權汝州防禦使行帥府事脫走入蔡以臯殺汝作事聞哀宗甚嗟惜之遣近侍張天錫贈汝作昌武軍節度使子孫世襲謀克仍詔峴山帥呼延實登封帥范真並力討臯天錫避峴山遠先約范真真以麾下李某者往以撫諭軍民為名臯率軍士迎於東門知朝廷圖己陰為之備李猶豫不敢發臯館天錫于望嵩樓隱毒於食天錫遂中毒而死臯後為大元兵所殺楊鵬字飛卿能詩愛申逸其族與名或曰一名忙哥本虢縣鎮防軍纍功遷軍中總領李文秀據秦州宣宗詔鳳翔軍討之軍圍秦州城時愛申在軍中有罪當死宣宗問之樞帥有知其名者奏此人將帥材忠實可倚宣宗命馳赦之以為德順節度使行元帥府事正大四年春大兵西來擬以德順為坐夏之所德順無軍人甚危之愛申識鳳翔馬肩龍舜卿者可與謀事乃遺書招之肩龍得書欲行鳳翔總管禾速嘉國鑑以大兵方進吾城可恃德順決不可守勸勿往肩龍曰愛申平生未嘗識我一見許為知己我知德順不可守往則必死然以知己故不得不為之死耳乃舉行橐付族父明為死別冒險而去既至不數日受圍城中惟有義兵鄉軍八九千人大兵舉天下之勢攻之愛申假舜卿鳳翔總管府判官守禦一與共之凡攻百二十晝夜力盡乃破愛申以劍自剄時年五十三軍中募生致肩龍而不知所終臺諫有言當贈德順死事者官以勸中外詔各贈官配食褒忠廟肩龍字舜卿宛平人先世遼大族有知興中府者故人號興中馬氏祖大中金初登科節度全錦兩州父成誼明昌五年登科仕為京兆府路統軍司判官肩龍在太學有賦聲宣宗初有誣宗室從坦殺人將置之死人不敢言其寃肩龍上書大略謂從坦有將帥材少出其右者臣一介書生無用於世願代從坦死留為天子將兵書奏詔問汝與從坦交分厚歟肩龍對曰臣知有從坦從坦未嘗識臣從坦寃人不敢言臣以死保之宣宗感悟赦從坦授肩龍東平録事委行省試驗宰相侯摯與語不契留數月罷歸將渡河與排岸官紛競搜篋中得軍馬糧料名數及利害數事疑其為姦人偵伺者繫歸德獄根勘適從坦至立救出之正大三年客鳳翔元帥愛申深器重之至是同死於難禹顯雁門人貞祐初隸上黨公張開纍以戰功授義勝軍節度使兼沁州招撫副使元光二年四月大帥達兒木受按察兒攻河東張開遣顯扼龍猪谷夾攻敗之擒元帥韓光國獲輜重甲仗甚衆追至祁縣而還所歷州縣悉復之顯將軍三百人守襄垣八年不遷大帥嘗集河朔步騎數萬攻之至於數四不能拔既而戰於玉女寨大獲開言於朝權元帥右都監正大六年冬十二月軍內變城破被擒帥義之不欲加害初以鐵繩鈐之既而密與舊部曲二十人遁去聞上黨公軍復振將往從之大兵四向來追顯適與負釜一兵相失乞飯山寺中僧走報焉被執不屈死時年四十一秦州人張邦憲字正叔登正大中進士第為永固令天興二年避兵徐州卓翼率兵至城邦憲被執將驅之北邦憲罵曰我進士也誤蒙朝廷用為邑長可從汝曹反耶遂遇害劉全者彭城民也率鄉鄰數百避兵沫溝推為寨主北兵至徐盡俘其老幼全父亦在其中北兵質之以招全全縛其人送徐州因竊其父以歸徐帥益都嘉其忠承制以為昭信校尉遙領彭城縣尉後遇國用安怒其不附己見殺
