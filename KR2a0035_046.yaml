body:
  text: 金史卷四十六志第二十七食貨一戶口通檢推排國之有食貨猶人之有飲食也人非飲食不生國非食貨不立然燧人庖犧能為飲食之道以教人而不能使人無飲食之疾三王能為食貨之政以遺後世而不能使後世無食貨之弊唯善養生者如不欲食啖而飲食自不闕焉故能適飢飽之宜可以疾少而長壽善裕國者初不事貨殖而食貨自不乏焉故能制豐約之節可以弊少而長治金於食貨其立法也周其取民也審太祖肇造減遼租稅規模遠矣熙宗海陵之世風氣日開兼務遠略君臣講求財用之制切切然以是為先務雖以世宗之賢儲積之志曷嘗一日而忘之章宗彌文煟興邊費亦廣食貨之議不容不急宣宗南遷國土日蹙汙池數罟往往而然考其立國以來所謂食貨之法犖犖大者曰租稅銅錢交鈔三者而已三者之法數變而數窮官田曰租私田曰稅租稅之外算其田園屋舍車馬牛羊樹藝之數及其藏鏹多寡徵錢曰物力物力之徵上自公卿大夫下逮民庶無苟免者近臣出使外國歸必增物力錢以其受饋遺也猛安謀克戶又有所謂牛頭稅者宰臣有納此稅庭陛間諮及其增減則州縣徵求於小民蓋可知矣故物力之外又有鋪馬軍須輸庸司吏河夫桑皮故紙等錢名目瑣細不可殫述其為戶有數等有課役戶不課役戶本戶雜戶正戶監戶官戶奴婢戶二稅戶有司始以三年一籍後變為通檢又為推排凡戶隸州縣者與隸猛安謀克其輸納高下又各不同法之初行唯恐不密言事者謂其厲民即命罷之罷之未久會計者告用乏又即舉行其罷也志以便民而民未見德其行也志以足用而用不加饒一時君臣節用之言不絕告誡嘗自計其國用數亦浩瀚若足支歷年者郡縣稍遇歲侵又遽不足竟莫詰其故焉至於銅錢交鈔之弊蓋有甚者初用遼宋舊錢雖劉豫所鑄豫廢亦兼用之正隆而降始議鼓鑄民間銅禁甚至銅不給用漸興窰冶凡產銅地脈遣吏境內訪察無遺且及外界而民用銅器不可闕者皆造於官而鬻之既而官不勝煩民不勝病乃聽民冶銅造器而官為立價以售此銅法之變也若錢法之變則鼓鑄未廣斂散無方已見壅滯初恐官庫多積錢不及民立法廣布繼恐民多匿錢乃設存留之限開告訐之路犯者繩以重罰卒莫能禁州縣錢艱民間自鑄私錢苦惡特甚乃以官錢五百易其一千其策愈下及改鑄大錢所準加重百計流通卒莫獲效濟以鐵錢鐵不可用權以交鈔錢重鈔輕相去懸絕物價騰踊鈔至不行權以銀貨銀弊又滋捄亦無策遂罷銅錢專用交鈔銀貨然而二者之弊乃甚於錢在官利於用大鈔而大鈔出多民益見輕在私利於得小鈔而小鈔入多國亦無補於是禁官不得用大鈔已而恐民用銀而不用鈔則又責民以鈔納官以示必用先造二十貫至百貫例後造二百貫至千貫例先後輕重不倫民益眩惑及不得已則限以年數限以地方公私受納限以分數由是民疑日深其間易交鈔為寶券寶券未久更作通寶準銀幷用通寶未久復作寶泉寶泉未久織綾印鈔名曰珍貨珍貨未久復作寶會汔無定制而金祚訖矣歷觀自古財聚民散以至亡國若鹿臺鉅橋之類不足論也其國亡財匱比比有之而國用之屈未有若金季之甚者金之為政常有卹民之志而不能已苛征之令徒有聚斂之名而不能致富國之實及其亡也括粟闌糴一切掊克之政靡不為之加賦數倍豫借數年或欲得鈔則豫賣下年差科高琪為相議至榷油進納濫官輒售空名宣勅或欲與以五品正班僧道入粟始自度牒終至德號綱副威儀寺觀主席亦量其貲而鬻之甚而丁憂鬻以求仕監戶鬻以從良進士出身鬻至及第又甚而叛臣劇盜之效順無金帛以備賞激動以王爵固結其心重爵不蔇則以國姓賜之名實混淆倫法斁壞皆不暇顧國欲不亂其可得乎迨夫宋絕歲幣而不許和貪其淮南之蓄謀以力取至使樞府武騎盡於南伐訛可時全之出初志得糧後乃尺寸無補三軍僨亡我師壓境兵財俱困無以禦之故志金之食貨者不能不為之掩卷而興慨也傳曰作法於涼其弊猶貪作法於貪弊將若何金起東海其俗純實可與返古初入中夏兵威所加民多流亡土多曠閒遺黎惴惴何求不獲使於斯時縱不能復井地溝洫之制若用唐之永業口分以制民產倣其租庸調之法以足國計何至百年之內所為經畫紛紛然與其國相終始耶其弊在於急一時之利踵久壞之法及其中葉鄙遼儉朴襲宋繁縟之文懲宋寬柔加遼操切之政是棄二國之所長而併用其所短也繁縟勝必至於傷財操切勝必至於害民訖金之世國用易匱民心易離豈不由是歟作法不慎厥初變法以捄其弊秖益甚焉耳其他鹽筴酒麴常平和糴茶稅征商榷場等法大概多宋舊人之所建明息耗無定變易靡視錢鈔何異田制水利區田之目或驟行隨輟或屢試無效或熟議未行咸著于篇以備一代之制云戶口金制男女二歲以下為黃十五以下為小十六為中十七為丁六十為老無夫為寡妻妾諸篤廢疾不為丁戶主推其長充內有物力者為課役戶無者為不課役戶令民以五家為保泰和六年上以舊定保伍法有司滅裂不行其令結保有匿姦細盜賊者連坐宰臣謂舊以五家為保恐人易為計搆而難覺察遂令從唐制五家為隣五隣為保以相檢察京府州縣郭下則置坊正村社則隨戶衆寡為鄉置里正以按比戶口催督賦役勸課農桑村社三百戶以上則設主首四人二百戶以上三人五十戶以上二人以下一人以佐里正禁察非違置壯丁以佐主首巡警盜賊猛安謀克部村寨五十戶以上設寨使一人掌同主首寺觀則設綱首凡坊正里正以其戶十分內取三分富民均出顧錢募強幹有抵保者充人不得過百貫役不得過一年大定二十九年章宗嘗欲罷坊里正復以主首遠入城應代妨農不便乃以有物力謹願者二年一更代凡戶口計帳三年一籍自正月初州縣以里正主首猛安謀克則以寨使詣編戶家責手實具男女老幼年與姓名生者增之死者除之正月二十日以實數報縣二月二十日申州以十日內達上司無遠近皆以四月二十日到部呈省凡漢人渤海人不得充猛安謀克戶猛安謀克之奴婢免為良者止隸本部為正戶凡沒入官良人隸宮籍監為監戶沒入官奴婢隸太府監為官戶當收國二年時法制未定兵革未息貧民多依權右為苟安多隱蔽為奴婢者太祖下詔曰比以歲凶民飢多附豪族因陷為奴隸及有犯法徵償莫辦折身為奴或私約立限以人對贖過期則以為奴者並聽以兩人贖一為良元約以一人贖者從便天輔五年以境土既拓而舊部多瘠鹵將移其民于泰州及遣皇弟昱及族子宗雄按視其地昱等苴其土以進言可種植遂摘諸猛安謀克中民戶萬餘使宗人婆盧火統之屯種于泰州婆盧火舊居阿注滸水又作按出虎至是遷焉其居寧江州者遣拾得查端阿里徒歡奚撻罕等四謀克挈家屬耕具徙于泰州仍賜婆盧火耕牛五十天輔六年既定山西諸州以上京為內地則移其民實之又命耶律佛頂以兵護送諸降人于渾河路以皇弟昂監之命從便以居七年以山西諸部族近西北二邊且遼主未獲恐陰相結誘復命皇弟昂與孛菫稍喝等以兵四千護送處之嶺東惟西京民安堵如故且命昂鎮守上京路既而上聞昂已過上京而降人復苦其侵擾多叛亡者遂命孛菫出里底往戒諭之比至而諸部已叛去又以猛安詳穩留住所領歸附之民還東京命有司常撫慰且貸一歲之糧其親屬被虜者皆令聚居及七年取燕京路二月盡徙六州氏族富強工技之民於內地太宗天會元年以舊徙潤隰等四州之民於瀋州之境以新遷之戶艱苦不能自存詔曰比聞民乏食至鬻子者聽以丁力等者贖之又詔孛堇阿實賚曰先皇帝以同姓之人昔有自鬻及典質其身者命官為贖今聞尚有未復者其悉閱贖之又命以官粟贖上京路新遷置寧江州戶口貧而賣身者六百餘人二年民有自鬻為奴者詔以丁力等者易之三年禁內外官及宗室毋得私役百姓權勢家不得買貧民為奴其脅買者一人償十五人詐買者一人償二人罪皆杖百七年詔兵興以來良人被略為驅者聽其父母妻子贖之熙宗皇統四年詔陝西蒲解汝蔡等州歲飢百姓流落典雇為驅者官以絹贖為良丁男三疋婦人幼小二疋世宗大定二年詔免二稅戶為民初遼人佞佛尤甚多以良民賜諸寺分其稅一半輸官一半輸寺故謂之二稅戶遼亡僧多匿其實抑為賤有援左證以告者有司各執以聞上素知其事故特免之十七年五月省奏咸平府路一千六百餘戶自陳皆長白山星顯禪春河女直人遼時簽為獵戶移居於此號移典部遂附契丹籍本朝義兵之興首詣軍降仍居本部今乞釐正詔從之二十年以上京路女直人戶規避物力自賣其奴婢致耕田者少遂以貧乏詔定制禁之又謂宰臣曰猛安謀克人戶兄弟親屬若各隨所分土與漢人錯居每四五十戶結為保聚農作時令相助濟此亦勸相之道也二十一年六月徙銀山側民於臨潢又命避役之戶舉家逃於他所者元貫及所寓司縣官同罪為定制二十三年定制女直奴婢如有得力本主許令婚娉者須取問房親及村老給據方許娉於良人是年八月奏猛安謀克戶口墾地牛具之數猛安二百二謀克千八百七十八戶六十一萬五千六百二十四口六百一十五萬八千六百三十六內正口四百八十一萬二千六百六十九奴婢口一百三十四萬五千九百六十七墾田一百六十九萬三百八十頃有奇牛具三十八萬四千七百七十一在都宗室將軍司戶一百七十口二萬八千七百九十內正口九百八十二奴婢口二萬七千八百八墾田三千六百八十三頃七十五畝牛具三百四迭剌唐古二部五辤戶五千五百八十五口十三萬七千五百四十四內正口十一萬九千四百六十三奴婢口一萬八千八十一墾田萬六千二十四頃一十七畝牛具五千六十六二十五年命宰臣禁有祿人一子及農民避課役為僧道者大定初天下戶纔三百餘萬至二十七年天下戶六百七十八萬九千四百四十九口四千四百七十萬五千八十六章宗大定二十九年十一月上封事者言乞放二稅戶為良省臣欲取公牒可憑者為准參知政事移剌履謂憑驗真偽難明凡契丹奴婢今後所生者悉為良見有者則不得典賣如此則三十年後奴皆為良而民且不病焉上以履言未當令再議省奏謂不拘括則訟終不絕遂遣大興府治中烏古孫仲和侍御史范楫分括北京路及中都路二稅戶凡無憑驗其主自言之者及因通檢而知之者其稅半輸官半輸主而有憑驗者悉放為良明昌元年正月上封事者言自古以農桑為本今商賈之外又有佛老與他游食浮費百倍農歲不登流殍相望此末作傷農者多故也上乃下令禁自披剃為僧道者是歲奏天下戶六百九十三萬九千口四千五百四十四萬七千九百而粟止五千二百二十六萬一千餘石除官兵二年之費餘驗口計之口月食五斗可為四十四日之食上曰蓄積不多是力農者少故也其集百官議所以使民務本廣儲之道以聞六月奏北京等路所免二稅戶凡一千七百餘戶萬三千九百餘口此後為良為驅皆從已斷為定明昌六年二月上謂宰臣曰凡言女直進士不須稱女直字卿等誤作廻避女直契丹語非也今如分別戶民則女直言本戶漢戶及契丹餘謂之雜戶明昌六年十二月奏天下女直契丹漢戶七百二十二萬三千四百口四千八百四十九萬四百物力錢二百六十萬四千七百四十二貫泰和七年六月勅中物力戶有役則多逃避有司令以次戶代之事畢則復業以致大損不逃之戶令省臣詳議宰臣奏舊制太輕遂命課役全戶逃者徒二年賞告者錢五萬先逃者以百日內自首免罪如實銷乏者內從御史臺外從按察司體究免之十二月奏天下戶七百六十八萬四千四百三十八口四千五百八十一萬六千七十九戶增於大定二十七年一百六十二萬三千七百一十五口增八百八十二萬七千六十五此金版籍之極盛也及衞紹王之時軍旅不息宣宗立而南遷死徙之餘所在為虛矣戶口日耗軍費日急賦斂繁重皆仰給於河南民不堪命率棄廬田相繼亡去及屢降詔招復業者免其歲之租然以國用乏竭逃者之租皆令居者代出以故多不敢還興定元年十二月宣宗欲懸賞募人捕亡戶而復慮騷動遂命依已降詔書已免債逋更招一月違而不來者然後捕獲治罪而以所遺地賜人四年省臣奏河南以歲飢而賦役不息所亡戶令有司招之至明年三月不復業者論如律時河壖為疆烽鞞屢警故集慶軍節度使溫迪罕達言亳州戶舊六萬自南遷以來不勝調發相繼逃去所存者曾無十一碭山下邑野無居民矣通檢推排通檢即周禮大司徒三年一大比各登其鄉之衆寡六畜車輦辨物行徵之制也金自國初占籍之後至大定四年承正隆師旅之餘民之貧富變更賦役不均世宗下詔曰粵自國初有司常行大比于今四十年矣正隆時兵役並興調發無度富者今貧不能自存版籍所無者今為富室而猶幸免是用遣信臣泰寧軍節度使張弘信等十三人分路通檢天下物力而差定之以革前弊俾元元無不均之嘆以稱朕意凡規措條理命尚書省畫一以行又命凡監戶事產除官所撥賜之外餘凡置到百姓有稅田宅皆在通檢之數時諸使往往以苛酷多得物力為功弘信檢山東州縣尤為酷暴棣州防禦使完顏永元面責之曰朝廷以正隆後差調不均故命使者均之今乃殘暴妄加民產業數倍一有來申訴者則血肉淋離甚者即殞杖下此何理也弘信不能對故惟棣州稍平五年有司奏諸路通檢不均詔再以戶口多寡貧富輕重適中定之既而又定通檢地土等第稅法十五年九月上以天下物力自通檢以來十餘年貧富變易賦調輕重不均遣濟南尹梁肅等二十六人分路推排二十年四月上謂宰臣曰猛安謀克戶富貧差發不均皆自謀克內科之暗者惟胥吏之言是從輕重不一自窩斡叛後貧富反復今當籍其夾戶推其家貲儻有軍役庶可均也詔集百官議右丞相克寧平章政事安禮樞密副使宗尹言女直人除猛安謀克僕從差使餘無差役今不推奴婢孳畜地土數目止驗產業科差為便左丞相守道等言止驗財產多寡分為四等置籍以科差庶得均也左丞通右丞道都點檢襄言括其奴婢之數則貧富自見緩急有事科差與一例科差者不同請俟農隙拘括地土牛具之數各以所見上聞上曰一謀克戶之貧富謀克豈不知一猛安所領八謀克一例科差設如一謀克內有奴婢二三百口者有奴婢一二人者科差與同豈得平均正隆興兵時朕之奴婢萬數孳畜數千而不差一人一馬豈可謂平朕於庶事未嘗專行與卿謀之往年散置契丹戶安禮極言恐擾動朕決行之果得安業安禮雖盡忠未審長策其從左丞通等所見拘括推排之十二月上謂宰臣曰猛安謀克多新強舊弱差役不均其令推排當自中都路始至二十二年八月始詔令集耆老推貧富驗土地牛具奴婢之數分為上中下三等以同知大興府事完顏烏里也先推中都路續遣戶部主事按帶等十四人與外官同分路推排九月詔毋令富者匿隱畜產貧戶或有不敢養馬者昔海陵時拘括馬畜絕無等級富者倖免貧者盡拘入官大為不均今並覈實貧富造籍有急即按籍取之庶幾無不均之弊張汝弼梁肅奏天下民戶通檢既定設有產物移易自應隨業輸納至於浮財須有增耗貧者自貧富者自富似不必屢推排也上曰宰執家多有新富者故皆不願也肅對曰如臣者能推排中都物力臣以嘗為南使先自添物力錢至六十餘貫視其他奉使無如臣多者但小民無知法出姦生數動搖則易駭如唐宋及遼時或三二十年不測通比則有之頻歲推排似為難爾二十六年復以李晏等分路推排二十七年奏晏等所定物力之數上曰朕以元推天下物力錢三百五萬餘貫除三百萬貫外令減五萬餘貫今減不及數復續收二萬餘貫即是實二萬貫爾而曰續收何也對曰此謂舊脫漏而今首出者及民地舊無力耕種而今耕種者也上曰通檢舊數止於視其營運息耗與房地多寡而加減之彼人賣地此人買之皆舊數也至如營運此強則彼弱強者增之弱者減之而已且物力之數蓋是定差役之法其大數不在多寡也朕恐實有營運富家所當出者反分與貧者爾章宗大定二十九年六月命為國信使之副者免增物力又命農民如有積粟毋充物力錢慳之郡所納錢貨則許折粟帛九月以曹州河溢遣馬百祿等推排遭墊溺州縣之貧乏者明昌元年四月刑部郎中路伯達等言民地已納稅又通定物力比之浮財所出差役是為重併也遂詳酌民地定物力減十之二尚書戶部言中都等路被水詔委官推排比舊減錢五千六百餘貫明昌三年八月勅尚書省百姓當豐稔之時不務積貯一遇凶儉輒有阻飢何法可使民重穀而多積也宰臣對曰二十九年已詔農民能積粟免充物力明昌初命民之物力與地土通推者亦減十分之二此固其術也承安元年尚書省奏是年九月當推排以有故不克詔以冬已深比事畢恐妨農作乃權止之二年冬十月勅令議通檢宰臣奏曰大定二十七年通檢後距今已十年舊戶貧弱者衆儻遲更定恐致流亡遂定制已典賣物業止隨物推收析戶異居者許令別籍戶絕及困弱者減免新強者詳審增之止當從實不必敷足元數邊城被寇之地皆不必推排於是令吏部尚書賈執剛吏部侍郎高汝礪先推排在都兩警巡院示為諸路法每路差官一員命提刑司官一員副之三年九月奏十三路籍定推排物力錢二百五十八萬六千七百二貫四百九十文舊額三百二萬二千七百十八貫九百二十二文以貧乏除免六十三萬八千一百一十一貫除上京北京西京路無新強增者餘路計收二十萬二千九十五貫泰和二年閏十二月上以推排時既問人戶浮財物力而又勘當比次期迫事繁難得其實勅尚書省定人戶物力隨時推收法令自今典賣事產者隨業推收別置標簿臨時止拘浮財物力以增減之泰和四年十二月上以職官仕於遠方其家物力有應除而不除者遂定典賣實業逐時推收若無浮財營運應除免者令本家陳告集坊村人戶推唱驗實免之造籍後如無人告一月內以本官文牒推唱定標附于籍五年以西京北京邊地常罹兵荒遣使推排之舊大定二十六年所定三十五萬三千餘貫遂減為二十八萬七千餘貫五年六月簽南京按察司事李革言近制令人戶推收物力置簿標題至通推時止增新強銷舊弱庶得其實今有司奉行滅裂恐臨時冗併卒難詳審可定期限立罪以督之遂令自今年十一月一日令人戶告詣推收標附至次年二月一日畢違期不言者坐罪且令諸處稅務具稅訖房地每半月具數申報所屬違者坐以怠慢輕事之罪仍勅物力既隨業通推時止令定浮財八年九月以吏部尚書賈守謙知濟南府事蒲察張家奴莒州刺史完顏百嘉南京路轉運使宋元吉等十三員分路同本路按察司官一員推排諸路上召至香閤親諭之曰朕選卿等隨路推排除推收外其新強消乏戶雖集衆推唱然消乏者勿銷不盡如一戶物力元三百貫今蠲免二百五十貫猶有未當者新強勿添盡量存其力如一戶可添三百貫而止添二百貫之類卿等各宜盡心一推之後十年利害所關苟不副所任罪當不輕也
