body:
  text: 金史卷九本紀第九章宗一章宗憲天光運仁文義武神聖英孝皇帝諱璟小字麻達葛顯宗嫡子也母曰孝懿皇后徒單氏大定八年世宗幸金蓮川秋七月丙戌次冰井上生翌日世宗幸東宮宴飲歡甚語顯宗曰祖宗積慶而有今日社稷之福也又謂司徒李石樞密使紇石烈志寧等曰朕子雖多皇后止有太子一人幸見嫡孫又生於麻達葛山朕嘗喜其地衍而氣清其以山名之羣臣皆稱萬歲十八年封金源郡王始習本朝語言小字及漢字經書以進士完顏匡司經徐孝美等侍讀二十四年世宗東巡顯宗守國上奉表詣上京問安仍請車駕還都世宗嘉其意賜敕書答諭二十五年三月萬春節復奉表朝賀六月顯宗崩世宗遣滕王府長史御院通進來護視十二月進封原王判大興府事入以國語謝世宗喜且為之感動謂宰臣曰朕嘗命諸王習本朝語惟原王語甚習朕甚嘉之諭旨曰朕固知汝年幼服制中未可付以職然政事亦須學京輦之任姑試爾才其勉之二十六年四月詔賜名璟五月拜尚書右丞相世宗謂曰宮中有輿地圖觀之可以具知天下遠近厄塞又謂宰臣曰朕所以置原王於近輔者欲令親見朝廷議論習知政事之體故也十一月詔立為皇太孫稱謝於慶和殿世宗諭之曰爾年尚幼以明德皇后嫡孫惟汝一人試之以事甚有可學之資朕從正立汝為皇太孫建立在朕保守在汝宜行正養德勿近邪佞事朕必盡忠孝無失衆望則惟汝嘉二十七年三月世宗御大安殿授皇太孫冊赦中外丁巳謁謝太廟及山陵始受百官箋賀二十八年十二月乙亥世宗不豫詔攝政聽授五品以下官丁亥受攝政之寶二十九年春正月癸巳世宗崩即皇帝位于柩前丙申詔中外賜內外官覃恩兩重三品已上者一重免今歲租稅並自來懸缺係官等錢魚衆寡孤獨人絹一匹米兩石己亥遷大行皇帝梓宮于大安殿癸卯以皇太后命為令旨甲辰以大理卿王元德等報哀于宋高麗夏乙卯白虹貫日亙天丁巳參知政事宗浩罷山東統軍裔以私過都城不赴哭臨笞五十降授彰化軍節度使戊午名皇太后宮曰仁壽設衛尉等官二月辛酉朔日有食之癸亥始聽政追尊皇考為皇帝尊母為皇太后甲子命學士院進呈唐便民事及當今急務乙丑白虹亙天敕登聞鼓院所以達寃枉舊嘗鎖戶其令開之戊辰更仁壽宮名隆慶詔宮籍監戶舊係睿宗及大行皇帝皇考之奴婢者悉放為良己巳敕御史臺自今監察令本臺辟舉任內不稱職亦從奏罷丁丑增定百官俸乙酉詔有司稽考典故許引用宋事是月宋主內禪子惇嗣立三月壬辰朝于隆慶宮是月凡五朝己酉詔以生辰為天壽節癸丑夏國遣使來弔夏四月己巳夏國遣使來祭辛未宋遣使來弔祭乙酉葬世宗光天興運文德武功聖明仁孝皇帝於興陵戊子朝于隆慶宮五月庚寅朔太白晝見壬寅宋主遣使來報嗣位夏國遣使來賀即位丙午以祔廟禮成大赦丁未地生白毛庚戌詔罷送宣錢今後諸護衛考滿賜官錢二千貫壬子敕收録功臣子孫量材於局分承應戊午朝于隆慶宮以東北路招討使溫迪罕速可等為賀宋主即位使河溢曹州閏月庚申朔封兄珣為豐王琮鄆王瓌瀛王從彝沂王弟從憲壽王玠溫王辛酉制諸飢民賣身已贖放為良復與奴生男女並聽為良丙寅觀稼于近郊庚午以樞密副使唐括貢為御史大夫壬申封乳母孫氏蕭國夫人姚氏莘國夫人丙子進封趙王永中漢王曹王永功冀王豳王永成吳王虞王永升隨王徐王永蹈衛王滕王永濟潞王薛王永德瀋王庚辰宋遣使來賀即位癸未朝于隆慶宮詔學士院自今誥詞並用四六乙酉詔諸有出身承應人係將來受親民之職可命所屬諭使為學其護衛符寶奉御奉職侍直近密當選有德行學問之人為之教授六月己丑朔有司言律科舉人止知讀律不知教化之原必使通治論語孟子涵養器度遇府會試委經義試官出題別試與本科通定去留為宜從之詔有司請親王到任各給錢二十萬辛卯修起居注完顏烏者同知登聞檢院孫鐸皆上書諫罷圍獵上納其言拾遺馬升上儉德針乙未初置提刑司分按九路並兼勸農採訪事屯田鎮防諸軍皆屬焉丁酉幸慶壽寺作瀘溝石橋己亥朝于隆慶宮甲辰罷送赦禮物錢朝于隆慶宮乙卯高麗國王晧遣使來弔祭及會葬敕有司移報宋高麗夏天壽節於九月一日來賀丁巳命提刑官除後於便殿聽旨每十月使副內一員入見議事如止一員則令判官入見其判官所掌煩劇可升同隨朝職任秋七月辛酉減民地稅十之一河東南北路十之二下田十之三甲子朝于隆慶宮乙丑敕近侍官授外任三品四賜金帶一重幣有差丁卯以太尉尚書令東平郡王徒單克寧為太傅改封金源郡王辛未高麗遣使來賀即位甲戌奉皇太后幸壽安宮辛巳詔京府節鎮防禦州設學養士初設經童科御史大夫唐括貢罷禮部尚書移剌履為參知政事以刑部尚書完顏守貞等為賀宋生日使八月戊子朔奉皇太后幸壽安宮辛卯敕有司京府州鎮設學校處其長二幕職內各以進士官提控其事仍具入銜壬辰初定品官子孫試補令史格及提刑司所掌三十二條左司諫郭安民上疏論三事曰崇節儉去嗜欲廣學問丁酉如大房山戊戌謁奠諸陵己亥還都庚子朝于隆慶宮是月凡三朝壬寅制提刑司設女直契丹漢兒知法各一人甲辰參知政事劉瑋罷丙辰宋高麗夏遣使來賀天壽節九月戊午朔天壽節以世宗喪不受朝庚申詔增守山陵為二十丁給地十頃壬戌詔罷告捕亂言人賞甲子制諸盜賊聚集至十人或騎五人以上所屬移捕盜官捕之仍遞言省部三十人以上聞奏違者杖百是日朝于隆慶宮是月凡四朝丁卯制強族大姓不得與所屬官吏交往違者有罪戊辰以隆慶宮衛尉把思忠為夏國生日使庚午以尚輦局使崇德為橫賜高麗使丙子獵于近郊戊寅監察御史焦旭劾奏太傅克寧右丞相襄不應請車駕田獵上曰此小事不須治之乙酉如大房山冬十月丁亥朔謁奠諸陵己丑還都庚寅朝于隆慶宮是月凡四朝辛卯上顧謂宰臣曰翰林闕人平章政事汝霖對曰鳳翔治中郝俁可汝霖諫止田獵詔答曰卿能每事如此朕復何憂然時異事殊得中為當丙申冬獵己亥次羅山庚子次玉田辛丑沁州丹州進嘉禾丁未次寶坻庚戌中侍石抹阿古誤帶刀入禁門罪應死詔杖八十癸丑至自寶坻十一月己未朝于隆慶宮辛酉以右宣徽院使裴滿餘慶等為賀宋正旦使癸亥上謂宰臣曰今之用人太拘資歷循資之法起於唐代如此何以得人平章政事汝霖對曰不拘資格所以待非常之材上曰崔祐甫為相未踰年薦八百人豈皆非常之材歟甲子諭尚書省曰太傅年高每趨朝而又赴省恐不易自今旬休外四日一居休庶得調攝常事他相理問惟大事白之可也戊辰諭尚書省自今五品以上官各舉所知歲限所舉之數如不舉者坐以蔽賢之罪仍依唐制內五品以上官到任即舉自代並從提刑司採訪之己巳初制轉遞文字法壬申朝于隆慶宮乙亥命參知政事移剌履提控刊修遼史丁丑以西上閣門使移剌邴為高麗生日使御史臺奏故事臺官不得與人相見蓋為親王宰執形勢之家恐有私徇然無以訪知民間利病官吏善惡詔自今許與四品以下官相見三品以上如故辛巳詔有司今後諸處或有饑饉令總管節度使或提刑司先行賑貸或賑濟然後言上十二月丙戌朔朝于隆慶宮是月凡五朝詔罷鑄錢丁亥密州進白雉壬辰諭有司女直人及百姓不得用網捕野物及不得放羣鵰枉害物命亦恐女直人廢射也戊戌復置北京遼東鹽使司仍罷西京解鹽巡捕使以河東南北路提刑司言賑寧化保德嵐州饑其流移復業給復一年是日禁宮中上直官及承應人毋得飲酒乙巳祭奠興陵壬子諭臺臣曰提刑司所舉劾多小過行則失大體不行則恐有所沮其以此意諭之甲寅宋高麗夏遣使來賀正旦是冬無雪明昌元年春正月丙辰朔改元以世宗喪不受朝賀上朝于隆慶宮是月凡四朝丁巳制諸王任外路者許游獵五日過此禁之仍令戒約人從毋擾民辛酉諭尚書省宰執所以總持國家不得受人餽遺或遇生辰受所獻毋過萬錢若緦大功以上親及二品以上官不禁壬戌以知河中府事王蔚為尚書右丞刑部尚書完顏守貞為參知政事甲子如大房山乙丑奠謁興陵裕陵丙寅還都戊辰制禁自披剃為僧道者敕外路求世宗御書辛未如近畿春水己卯如春水二月丁亥太白晝見丙申遣諭諸王凡出獵毋越本境壬寅諭有司寒食給假五日著于令甲辰至自春水朝于隆慶宮是月凡四朝癸丑地生白毛甲寅如大房山三月乙卯朔謁奠興陵丙辰還都朝于隆慶宮是月凡六朝己未敕點檢司諸試護衛人須身形及格若功臣子孫善射出衆雖不及格亦令入見癸亥禮官言民或一産三男內有才行可用者可令察舉量材用其驅婢所生舊制官給錢百貫以資乳哺尚書省請更給錢四十貫贖以為良制可丙寅有司言舊制朝官六品以下從人輸庸者聽五品以上不許輸庸恐傷禮體其有官職俱至三品年六十以上致仕者人力給半乞不分內外願令輸庸者聽從之己巳擊毬於西苑百僚會觀癸酉詔內外五品以上歲舉廉能官一員不舉者坐蔽賢罪乙亥初設應制及宏詞科丁丑制內外官並諸局承應人遇祖父母父母忌日並給假一日辛巳詔修曲阜孔子廟學壬午如壽安宮夏四月甲申朔朝于隆慶宮是月凡四朝戊戌如壽安宮五月不雨乙卯祈于北郊及太廟朝于隆慶宮是月凡三朝丙辰以鷹坊使移剌寧為橫賜夏國使戊午拜天于西苑射柳擊毬縱百姓觀壬戌祈雨于社稷甲子制省元及四舉終場人許該恩己巳復祈雨于太廟庚午置知登聞鼓院事一人丙子以祈雨望祭嶽鎮海瀆于北郊戊寅命內外官五品以上任內舉所知才能官一員以自代壬午以參知政事移剌履為尚書右丞御史中丞徒單鎰為參知政事尚書右丞相襄罷六月己丑制定親王家人有犯其長史府掾失覺察故縱罪壬辰奉皇太后幸慶壽寺甲辰敕僧道三年一試秋七月己巳以禮部尚書王翛等為賀宋生日使庚午朝于隆慶宮丁丑詔罷西北路蝦山市場八月癸未朔禁指託親王公主奴隸占綱船侵商旅及妄徵錢債乙酉詔設常平倉丁亥至自壽安宮戊子朝于隆慶宮是月凡三朝己丑以判大睦親府事宗寧為平章政事壬辰幸玉泉山即日還宮癸巳罷諸府鎮流泉務選才幹之官為諸州刺史皆召見諭戒之戊戌上諭宰臣曰何以使民棄末而務本以廣儲蓄令集百官議戶部尚書鄧儼等曰今風俗侈靡宜定制度辨上下使服用居室各有差等抑昏喪過度之禮禁追逐無名之費用度有節蓄積自廣矣右丞履參知政事守貞鎰曰凡人之情見美則願若不節以制度將見奢侈無極費用過多民之貧乏殆由此致方今承平之際正宜講究此事為經久法上是履議壬寅敕麻吉以皇家袒免之親特收充尚書省祗候郎君仍為永制丁未獵于近郊己酉宋高麗夏遣使來賀天壽節九月壬子朔天壽節以世宗喪不受朝丙辰以廉能進擢北海縣令張翺等十八人官己未以武衛軍副都指揮使烏林答謀甲為夏國生日使庚申朝于隆慶宮壬戌如秋山冬十月丁亥至自秋山戊子朝于隆慶宮丙申詔賜貴德州孝子翟巽遂州節婦張氏各絹十匹粟二十石戊戌以有司言登聞鼓院同記注院勿有所隸制民庶聘財為三等上百貫次五十貫次二十貫丁未獵于近郊十一月乙卯朝于隆慶宮是月凡五朝以惑衆亂民禁罷全真及五行毗盧以僉書樞密院事把德固等為賀宋正旦使丁巳制諸職官讓蔭兄弟子姪者從其所請戊辰召禮部尚書王翛諫議大夫張暐詣殿門諭之曰朝廷可行之事汝諫官禮官即當辨析小民之言有可採者朕尚從之況卿等乎自今所議毋但附合於尚書省辛未以西上閣門使移剌撻不也為高麗生日使丙子冬獵己卯次雄州判真定府事吳王永成判定武軍節度使隋王永升來朝十二月壬午免獵地今年稅丁亥次饒陽己丑平章政事張汝霖薨丁酉至自饒陽甲辰幸太傅徒單克寧第視疾以克寧為太師尚書令封淄王賜銀千五百兩絹二千匹乙巳朝于隆慶宮丙午詔有司正旦可先賀隆慶宮然後進酒丁未宋高麗夏遣使來賀正旦二年春正月庚戌朔以世宗喪不受朝癸丑諭有司夏國使可令館內貿易一日尚書省言故事許貿易三日從之甲寅始許宮中稱聖主乙卯皇太后不豫自是日往侍疾丙夜乃還辛酉皇太后崩丙寅以左副都點檢等報哀于宋高麗夏庚午太師尚書令淄王徒單克寧薨甲戌百官表請聽政不許戊寅詔賜括里部羊三萬口重幣五百端絹二千匹以振其乏吳王永成隋王永升以聞國喪奔赴失期罰其俸一月其長史笞五十己卯有司言漢王永中以疾失期上諭使回二月壬午百官復請聽政不許壬辰上始視朝敕親王及三品官之家毋許僧尼道士出入諭有司進士程文但合格者即取之毋限人數丙申以樞密副使夾谷清臣為尚書左丞戊戌更定奴誘良人法丙午初設王傅府尉官三月丁巳夏國遣使來弔癸亥敕有司國號犯漢遼唐宋等名不得封臣下有司議以遼為宋為汴秦為鎬晉為並漢為益梁為邵齊為彭殷為譙唐為絳吳為鄂蜀為夔陳為宛隋為涇虞為澤制可丁卯夏國遣使來祭乙亥高麗遣使來弔祭丁丑宋遣使來弔祭四月戊寅朔尚書省言齊民與屯田戶往往不睦若令遞相婚姻實國家長久安寧之計從之乙酉葬孝懿皇太后于裕陵戊子制諸部內災傷主司應言而不言及妄言者杖七十檢視不以實者罪如之因而有傷人命者以違制論致枉有徵免者坐贓論妄告者戶長坐詐不以實罪計贓重從詐匿不輸法庚寅禁民庶不得服純黃銀褐色婦人勿禁著為永制辛卯上幸壽安宮諫議大夫張暐等上疏請止其行不允癸巳諭有司自今女直字直譯為漢字國史院專寫契丹字者罷之甲午改封永中為並王永功為魯王永成兗王永升曹王永蹈鄭王永濟韓王永德豳王戊戌增太學博士助教員己亥學士院新進唐杜甫韓愈劉禹錫杜牧賈島王建宋王禹稱歐陽修王安石蘇軾張耒秦觀等集二十六部庚子改壽安宮名萬寧壬寅如萬寧宮詔襲封衍聖公孔元措視四品秩五月庚戌敕自今四日一奏事仍免朝戊辰詔諸郡邑文宣王廟風雨師社稷神壇隳廢者復之詔御史臺令史並以終場舉人充六月戊子平章政事宗寧薨癸巳禁稱本朝人及本朝言語為蕃違者杖之丙午尚書右丞移剌履薨秋七月丁巳以參知政事徒單鎰為尚書右丞御史中丞夾谷衡為參知政事己未觀稼于近郊己巳禁職官元日生辰受所屬獻遺仍為永制以同僉大睦親府事兗等為賀宋生日使庚午諭有司自今外路公主應赴闕其駙馬都尉非奉旨毋擅離職八月癸未至自萬寧宮己亥敕山東河北闕食等處許納粟補官諭有司自今親王所領如有軍處令佐二總押軍事乙巳宋高麗夏遣使來賀天壽節九月丁未朔天壽節以皇太后喪不受朝甲寅如大房山乙卯謁奠裕陵丙辰還都丁巳以西上閣門使白琬為夏國生日使己未定詐為制書未施行制以尚書左丞夾谷清臣為平章政事封芮國公參知政事完顏守貞為尚書左丞知大興府事張萬公為參知政事庚申如秋山冬十月己丑至自秋山甲午敕司獄毋得與府州司縣官筵宴還往違者罪之禁以太一混元受籙私建庵室者壬寅以河北山東旱應雜犯及強盜已未發覺減死一等釋徒以下十一月丙午朔制諸女直人不得以姓氏譯為漢字甲寅禁伶人不得以歷代帝王為戲及稱萬歲犯者以不應為事重法科丁巳以豳王傅宗璧等為賀宋正旦使戊午夏人殺我邊將阿魯帶甲子制投匿名書者徒四年丙寅以近侍局副使完顏匡為高麗生日使壬申敕提刑司官自今每十五日一朝十二月乙亥朔敕三品致仕官所得傔從毋令輸庸己卯定鎮邊守將致盜賊罪甲申獵于近郊乙酉詔罷契丹字己丑尚書右丞徒單鎰罷癸卯宋高麗夏遣使來賀正旦三年春正月乙巳朔以皇太后喪不受朝丙辰以孝懿皇后小祥尚書省請依明昌元年世宗忌辰例諸王陪位服慘紫去金玉之飾百官不視事禁音樂屠宰從之壬戌如春水二月甲戌朔敕猛安謀克許於冬月率所屬戶畋獵二次每出不得過十日壬辰至自春水丁酉獵于近郊辛丑詔追復田瑴等官爵閏月甲子以山東路統軍使烏林答願為御史大夫三月乙亥更定強盜徵贓品官及諸人親獲強盜官賞制辛巳初設左右衛副將軍癸未瀘溝石橋成幸熙春園丁亥如萬寧宮辛卯詔賜棣州孝子劉瑜錦州孝子劉慶祐絹粟旌其門閭復其身上因問宰臣曰從來孝義之人曾官使者幾何左丞守貞對曰世宗時有劉政者嘗官之然若輩多淳質不及事上曰豈必盡然孝義之人素行已備稍可用即當用之後雖有希覬作僞者然僞為孝義猶不失為善可檢勘前後所申孝義之人如有可用者可具以聞癸巳尚書省奏言事者謂釋道之流不拜父母親屬敗壞風俗莫此為甚禮官言唐開元二年敕云聞道士女冠僧尼不拜二親是為子而忘其生傲親而徇於末自今以後並聽拜父母其有喪紀輕重及尊屬禮數一准常儀臣等以為宜依典故行之制可左丞守貞言上嘗命臣問欣州陳毅上書所言事其一極論守令之弊臣面問所以救之之道竟不能言上曰方今政欲知其弊也彼雖無救弊之術但能言其弊亦足嘉矣如毅言及隨處有司不能奉行條制為人傭雇尚須出力況食國家祿而乃如是得無虧臣子之行乎其令檢會前後所降條理舉行之是日溫王玠薨丁酉命有司祈雨望祀嶽鎮海瀆于北郊四月壬寅朔定宣聖廟春秋釋奠三獻官以祭酒司業博士充祝詞稱皇帝謹遣及登歌改用太常樂工其獻官並執事與享者並法服陪位學官公服學生儒服尚書省奏提刑司察舉涿州進士劉器博博州進士張安行河中府胡光謙光謙年雖八十三尚可任用敕劉器博張安行特賜同進士出身胡光謙召赴闕甲辰祈雨于社稷丙午罷天山北界外採銅戊申瀛王瓌薨戊午詔集百官議北邊開壕事詔賜雲內孝子孟興絹十匹粟二十石賜同州貞婦師氏諡曰節丙寅以旱災下詔責躬丁卯復以祈雨望祀嶽鎮海瀆山川于北郊戊辰敕親王衣領用銀褐紫緣遣御史中丞吳鼎樞等審決中都寃獄外路委提刑司處決左丞守貞以旱上表乞解職不允參知政事衡萬公皆入謝上曰前詔所謂罷不急之役省無名之費議冗官決滯獄四事其速行之五月壬申朔以尚書禮部員外郎孛术魯子元為橫賜高麗使癸酉罷北邊開壕之役甲戌祈雨于社稷是日雨戊寅出宮女百八十三人尚書省奏近以山東河北之饑已委宣差所至安撫賑濟復遣右三部司正范文淵往視之乙酉以雨足致祭于社稷戊子百官賀雨足尚書左丞完顏守貞罷己丑以雨足望祀嶽鎮海瀆六月癸卯宰臣請罷提刑司上曰諸路提刑司官止三十餘員猶患不得其人州郡三百餘處其能盡得人乎弗許甲寅以久雨命有司祈晴丁巳定提刑司條制辛酉詔定內外所司公事故作疑申呈罪罰格乙丑以知大名府事劉瑋為尚書右丞有司言河州災傷民乏食而租稅有未輸詔免之諭戶部可預給百官冬季俸令就倉以時直糶與貧民秋成各以其資糴之其所得必多矣而上下便之其承應人不願者聽秋七月戊寅敕尚書省曰饑民如至遼東恐難遽得食必有饑死者其令散糧官問其所欲居止給以文書命隨處官長計口分散令富者出粟養之限以兩月其粟充秋稅之數己卯祁州刺史頓長壽安武軍節度副使胡剌坐賑濟不及四縣各杖五十癸未詔增北邊軍千二百人分置諸堡丁亥胡光謙至闕命學士院以雜文試之稱旨上曰朕欲親問之辛卯以殿前都點檢僕散端等為賀宋生日使己亥上謂宰臣曰聞諸王傅尉多苛細舉動拘防亦非朕意是職之設本欲輔導諸王使歸之正得其大體而已平章政事清臣曰請以聖意遍行之曰已諭之矣八月癸卯敕諸職官老病不肯辭避有司諭使休間者不在給俸之列格前勿論上以軍民不和吏員姦弊詔四品以下六品以上集議于尚書省各述所見以聞甲辰集三品以下六品以上官問以朝政得失及民間利害令各書所對丁未以有司奏寧海州文登縣王震孝行以嘗業進士並試其文特賜同進士出身仍注教授一等職任辛亥至自萬寧宮特賜胡光謙明昌二年進士第三甲及第授將仕郎太常寺奉禮郎官制舊設是職未嘗除人以光謙德行才能故特授之己未以烏林答願為尚書左丞辛酉獵于近郊乙丑上謂宰臣曰朕欲任官令久於其事若今日作禮官明日司錢穀雖間有異材然事能悉辦者鮮矣對曰使中材之人久於其職事既熟終亦得力上問太常卿張暐古有三恪今何無之暐具典故以聞丁卯宋高麗夏遣使來賀天壽節九月庚午朔天壽節以皇太后喪不受朝諭尚書省去歲山東河北被災傷處所閣租稅及借貸錢粟若便徵之恐貧民未蘇俟豐收日以分數帶徵可也又諭宰臣曰隨路提刑司舊止察老病不任職及不堪親民者如得其實即改除他路若他路提刑司覆察得實勿復注親民之職卿等其議行之甲戌以郊社署令唐括合達為夏國生日使己卯如秋山免圍場經過人戶今歲夏秋租稅之半曾當差役者復一年冬十月壬寅至自秋山丙午敕御史臺提刑司自今保申廉能官勿復有乞升品語壬子有司奏增修曲阜宣聖廟畢敕党懷英撰碑文朕將親行釋奠之禮其檢討典故以聞甲寅敕置常平倉處並令州府官以本職提舉縣官兼管勾其事以所糴多寡約量升降以為永制賜河南路提刑司所舉逸民游總同進士出身以年老不樂仕進授登仕郎給正八品半俸終身戊午諭尚書省訪求博物多知之士癸亥遣諭諸王府傅尉曰朕分命諸王出鎮蓋欲政事之暇安便優逸有以自適耳然慮其舉措之間或違於理所以分置傅尉使勸導彌縫不入於過失而已若公餘遊宴不至過度亦復何害今聞爾等或用意太過凡王門細碎之事無妨公道者一一干與贊助之道豈當如是宜各思職分事舉其中無失禮體仍就諭諸王使知朕意丙寅敕應保舉官及試中書判者委官覆察言行相副者量與升除隨朝及六品以上各隨所長用之己巳獵于近郊十一月庚午朔尚書省奏翰林侍講學士党懷英舉孔子四十八代孫端甫年德俱高該通古學濟南府舉魏汝翼有文章德誼苦學三十餘年已四舉終場蔚州舉劉震亨學行俱優嘗充舉首益都府舉王樞博學善書事親至孝敕魏汝翼特賜進士及第劉震亨等同進士出身並附王澤榜孔端甫俟春暖召之丙子詔臣庶名犯古帝王而姓復同者禁之周公孔子之名亦令回避戊寅升相州為彰德府以前右副都點檢溫敦忠等為賀宋正旦使壬午尚書省奏知河南府事程嶧乞進封父祖權尚書禮部郎中党懷英言凡宰執改除外任長官其佐官以下相見禮儀皆與他長官不同其子亦得試補省令史其子且爾父祖封贈理當不同合與宰執一例封贈從之甲申改提刑司令史為書史丙申以有司言河州定羌民張顯孝友力田焚券已責又獻粟千石以賑饑棣州民榮楫賑米七百石錢三百貫冬月散柴薪三千束皆別無希覬特各補兩官仍正班十二月癸卯以東上閣門使張汝猷為高麗生日使辛亥諭有司祈雪癸丑獵于近郊丙辰有赤氣見于北方丁巳敕華州下邽縣置武定鎮倉京兆櫟陽縣置粟邑鎮倉許州舞陽縣置北舞渡倉各設倉草都監一人縣官兼領之乙丑定到任告致仕格丁卯宋高麗夏遣使來賀正旦
