body:
  text: 金史卷一百十六列傳第五十四徒單兀典石盞女魯歡蒲察官奴內族承立一名慶山奴徒單兀典不知其所始纍官為武勝軍節度使駐鄧州尋遷中京留守知金昌府事駐洛陽鄧及洛陽兀典皆城之且招亡命千人號熊虎軍以剽掠南鄙為事宋人亦時時報復邊民為之搔動兀典資性深刻而以大自居好設耳目凡諸將官屬下及民家細事令親昵日報之務為不可欺正大間以兵部尚書權參知政事行省事於徐州自恃得君論議之際不少假貸同列皆畏之天興元年正月朝廷聞大兵入饒風移兀典行省閺鄉以備潼關徒單百家為關陝總帥便宜行事百家馳入陝榜州民云淮南透漏軍馬慮其道由潼關勢不能守縣鎮遷入大城糧斛輜重聚之陝州近山者入山寨避兵會阿里合傳旨召兀典入援兀典遂與潼關總帥納合合閏秦藍總帥都點檢完顏重喜安平都尉苗秀蕩寇都尉术甲某振武都尉張翼及虎威鷹揚葭州劉趙二帥軍十有一萬騎五千盡撒秦藍諸隘之備從虢入陝同華閺鄉一帶軍糧數十萬斛備關船二百餘艘皆順流東下俄聞大兵近糧皆不及載船悉空下復盡起州民運靈寶硤石倉粟遊騎至殺掠不勝計又遣陝州觀察副使兼規措轉運副使抹撚速也以船八十往運潼關閺鄉糧行及靈寶北河夾灘義軍張信侯三集壯士三百餘保老幼立水柵北將忽魯罕只乘淺攻之不能克遇速也船至即降大兵得此船遂破侯張殺戮殆盡是時陝州同知內族探春願從行省征進兀典授以帥職聽招在城民充軍探春厚擬官賞數日無一人乃以兀典命招之得壯士八百宣差趙三三名偉亦依探春招募偉人所知識不二日得軍八百餘號破敵軍兀典忌偉得衆欲挾詐坑之完顏素蘭時為同華安撫使力諫乃止尋以偉權興寶軍節度使兼行元帥府事領軍三百屯金雞堡大兵既知潼關焚棄長驅至陝賀都喜不待命出城迎戰馬蹶幾為所獲兀典易以一馬遂下令不復令一人出大兵亦去自此潼關諸渡船筏俱盡偉亦無船可渡矣初兀典發閺鄉拜天賞軍人白金三兩將校有差州之庫藏軍資器械為之一空期日進發已而不行日造銀器及兵幕牌印陝州及鹽司牌亦奪取之又欲草疏州民財物以資軍素蘭諫之而止二月戊午乃行有李先生者諫曰方今大兵俱在河南河北空虛相公可先取衛州出其不意彼知我軍在北必分兵北渡京師即得少寬相公入援亦易為矣兀典大怒以為泄軍機斬之於市遂行軍士各以老幼自隨州中亦有關中河中遷避商賈老幼亦倚兵力從行婦女皆嫁士卒軍中亦有強娶奪者是日軍出兩東門及南門不遵洛陽路乃由州西南徑入大山冰雪中葭州劉趙兩帥即日叛去大兵以數百騎遙躡其後明日張翼軍叛往朱陽入鹿盧關大兵追及降之山路積雪晝日凍釋泥淖及脛隨軍婦女棄擲幼稚哀號盈路軍至鐵嶺大兵潛召洛陽大軍從西三縣過盧氏所至燒官民廬舍積聚慮為金軍所據又反守鐵嶺以斷歸路金兵知必死皆有鬬志然已數日不食行二百里許困憊不支頗亦散走於是完顏重喜先降大軍斬於馬前鄭倜草疏苗英降英不從殺之其首以降於是士卒大潰兀典合閏提數十騎走山間追騎禽得皆殺之先是兀典嘗為鄧州節度使世襲謀克黃摑三合時為宣差都總領與兀典親厚故決計入鄧是役也安平蕩寇鷹揚振威諸都尉及西安金雞等軍脫走者百才一二二月素蘭竄歸有報徒單百家言行省至百家欲出迎父老遮馬前哀訴云行省復來吾州碎矣願無出迎百家曉之曰前日兀典欲草疏此州為素蘭力勸而止此行省非兀典乃素蘭也父老乃聽百家出城陝州自軍出日有逃還者百家皆撫納之所得及萬人百家又募收所棄甲仗若獲二副即以一與之其一官出直買之由是軍稍振五月總帥副點檢顏盞領軍復立商州總帥華州人王某立虢州權刺史七月制旨召百家入援以權西安軍節度使行元帥府事阿不罕奴十剌為金安軍節度使關陝總帥九月鞏昌知府元帥完顏忽斜虎入陝州詔拜參知政事行尚書省事以河中總帥府經歷李獻能充左右司員外郎獻能字欽叔貞祐三年進士復立山寨安撫軍民十月朔制旨召忽斜虎赴南陽留山寺以阿不罕奴十剌權參知政事行省時趙偉為河解元帥屯金雞堡軍務隸陝省行省月給糧以贍其軍明年五月麥熟省劄令偉計置兵食權罷月給十月偉軍食又盡屢白陝省云無糧可給偉私謂其軍言我與李員外郎有隙坐視我軍飢餓不為存恤於是自往永寧勸喻偉頗為小民所信往往獻糧或導其發藏南縣把隘軍提控以偉橫恣言於行省行省遣趙提控者權元帥守永寧元村寨偉還金雞十一月冬至大兵已攻破元村寨偉攻解州不能下於是密遣總領王茂軍士三十人入陝州匿菜圃中凡三四日乘夜王茂殺北城邏卒舉號召偉軍八百渡河入城草疏殺阿不罕奴十剌李獻能提控蒲鮮某總領來道安因誣奏奴十剌等欲反臣誅之矣朝廷知其寃而莫敢詰就授偉元帥左監軍兼西安軍節度使行總帥府事食盡括粟粟又盡以明年三月降大兵或謂偉軍餉不繼以草疏掠自資一日詣李獻能獻能靳之曰從宜破敵不易由是憾之乃乘奴十剌宴飲不設備選死士二十八人夜由後河灘踰城而上取餅爐碎石擲屋瓦門扇為箭鏃聲州人疑叛軍多不敢動遂開門納軍殺行省以下官屬二十一人獻能最為所恨故被害尤酷偉之變絳州録事張升字進之大同人戶工部令史出身曾為漁陽簿遷絳州録事謂知識者曰我本小人受國家官祿今日國家遭不幸我不能從反賊言訖赴水死岸上數百人皆嗟惜之及徒單百家鄭西之敗單騎間道數百里入京為上言兀典等鐵嶺敗狀於是籍重喜合閏兀典家資暴兀典為罪首榜通衢云石盞女魯歡本名十六興定三年以河南路統軍使為元帥右都監行平涼元帥府事先是陝西行省胥鼎言平涼控制西垂實為要地都監女奚烈古里間材識凡庸不間軍務且以入粟補官遂得升用握重兵當方面豈能服衆防秋在邇宜選才謀有宿望善將兵者代之故以命女魯歡十一月女魯歡上言鎮戎赤溝川東西四十里地無險阻當夏人往來之衝比屢侵突金兵常不得利明年春當城鎮戎彼必出兵來撓乞於二三月間徵傍郡兵聲言防護且令鄜鞏各屯兵境上示進伐之勢以掣其肘臣領平涼之衆由鎮戎而入攻其心腹彼自救之不暇安能及我如此則鎮戎可城而彼亦不敢來犯又所在官軍多河北山西失業之人其家屬仰給縣官每患不足鎮戎土壤肥沃又且平衍臣裨將所統幾八千人每以遷徙不常為病若授以荒田使耕且戰則可以禦備一方縣官省費而食亦足矣其餘邊郡亦宜一體措置上嘉納焉遷昌武軍節度使元光二年九月又言商洛重地西控秦陝東接河南軍務繁密宜選才幹之士為防禦使攝帥職以鎮之又舊來諸隘守禦之官並從帥府辟置其所辟者多其親昵殖産營私專事漁獵及當代去又復保留此最害之甚者宜令樞府選舉以革其弊又州之戍兵艱於餽運亦合依上屯田以免轉輸之費又言每年防秋諸隘守者不過數十人餘衆盡屯保安石門大荊洛南以為應援中間相距遠至百里倉猝豈能徵集宜近隘築營徙見兵居之以待緩急又南邊所設巡檢十員兵率千人此乃平時以詰姦細者已有大軍宜悉罷去朝廷略施行之正大九年二月以行樞密院事守歸德乙丑大元將忒木木受率真定信安大名東平益都諸軍來攻是日無雲而雷有以神武祕略占之者曰其城無害人心稍安適慶山奴潰軍亦至城中得之頗有鬬志己巳提控張定夜出斫營發數炮而還定平日好談兵女魯歡令自募一軍使為提控小試而勝上下遂恃以為可用初患炮少欲以泥或磚為之議者恐為敵所輕不復用父老有言北門之西一菜圃中時得古炮云是唐張巡所埋掘之得五千有奇上有刻字或大吉字者大兵晝夜攻城駐營于南城外其地勢稍高相傳是安祿山將尹子奇於此攻巡遠得睢陽時經歷冀禹錫及官屬王璧李琦傅瑜極力守禦城得不拔方大兵圍城議決鳳池大橋水以護城都水官言去歲河決敖遊堌時曾以水平量之其地與城中龍興塔平果決此口則無城矣及大兵至不得已遣招撫陳貴往決之才出門為遊騎所鈔無一返者三月壬午朔攻城不能下大軍中有獻決河之策者主將從之河既決水從西北而下至城西南入故濉水道城反以水為固求獻策者欲殺之而不知所在四月以女魯歡為總帥佩金虎符罷司農司以其官蒲察世達為集慶軍節度使行六部侍郎溫特罕道僧歸德府同知李無黨府判五月圍城稍緩頗遷民出城就食十二月哀宗次黃陵岡遣奉職术甲搭失不奉職權奉御粘合斜烈來歸德徵糧女魯歡遣侍郎世達治中王元慶權郎中儀封從宜完顏胡土權元帥護送載糧千五百石是月晦二更發船二年正月達蒲城東二十里六軍給糧盡因留船不聽歸且命張布為幄上遂用此舟以濟及上來歸德隨駕軍往往出城就糧時城中止有馬用一軍近七百人用山西人與李辛同鄉里嘗為辛軍彈壓在歸德權果毅都尉車駕至授以帥職此軍外復有官奴忠孝軍四百五十人河北潰軍至者皆縱遣之故城中惟此兩軍上時召用計事而不及官奴故官奴有異心朝廷知兩人不協恐生變三月戊辰制旨令宰相錫宴省中和解之是夜用撤備官奴以兵乘之為亂明日攻用軍用敗走被殺衆下城投水奪船而去者斯須而盡官奴在雙門驅知府女魯歡至言汝自車駕到府上供不給好醬亦不與汝罪何辭遂以一馬載之令軍士擁至其家檢其家雜醬凡二十甕且出所有金具然後殺之即提兵入見言石盞女魯歡等反臣殺之矣上不得已就赦其罪且暴女魯歡之惡後其姪大安入蔡上言求湔雪上復其官語在烏古論鎬傳禾速嘉兀底代女魯歡為總帥軍變官奴無意害兀底使二卒召之道官奴有善意兀底喜各以金十星與之同見官奴二卒復恐受金事泄亦殺之初河北潰軍至歸德糧餉不給朝廷命孛术魯阿海行總帥府事以親軍武衛皆隸之往宿州就食軍士有不願者誶語道中朝廷間之使問其故或言願入京或陳州阿海請從其願以券給之軍心稍定既而令求誶語者阿海得四人斬之國子監前由是諸軍洶洶二月庚子夜劫府民武邦傑及蒲察咬住等凡九家一軍遂散數日遂有官奴之變蒲察官奴少嘗為北兵所虜往來河朔後以姦事繫燕城獄劫走夏津殺回紇使者得鞍馬資貨即自拔歸朝廷以其種人特恩收充忠孝軍萬戶此軍月給甚優官奴日與羣不逞博為有司所劾事聞以其新自河朔來未知法禁詔勿問移剌蒲阿攻平陽官奴請行論功第一遷本軍提控佩金符三峯山之敗走襄陽説宋制使以取鄧州自效制使信之至與同燕飲已而知汴城罷攻復謀北歸遣移剌留哥入鄧説鄧帥粘合稱欲劫南軍為北歸計留哥以情告粘合官奴繼以騎卒十餘入城議事粘合欲就甕城中擒之官奴知事泄即馳還見制使得騎兵五百掠鄧之邊面小城獲牛羊數百宋人不疑官奴掩宋軍得馬三百至鄧州城下移書粘合辨理屈直留馬於鄧而去乃縛忠孝軍提控姬旺詐為唐州太守械送北行隨營帳取供給因得入汴有言其出入南北軍行數千里而不懾其智略有可取者宰相以為然乃使權副都尉未幾提軍數百馳入北軍獵騎中生挾一回紇而還遂巡黃陵八谷等處劫牛羊糧資甚衆尋轉正都尉又以軍至黃陵幾獲鎮州大將於是中外皆以為可用遂拜為元帥統馬軍天興元年十二月從哀宗北渡上次黃陵岡平章白撒率諸將戰官奴之功居多及渡河朔惟官奴一軍號令明肅秋毫無犯明年正月上至歸德知府石盞女魯歡以軍𦗬食寡懼不能給請於上令河北潰軍至者就糧於徐宿陳三州親衛軍亦遣出城就食上不得已從之乃召諭官奴曰女魯歡盡散衛兵卿當小心是時惟官奴忠孝軍四百五十人馬用軍七百人留府中用本果毅都尉上至歸德始升為元帥又嘗召之謀事而不及官奴故官奴始有圖用之志是時大元將忒木木受攻歸德官奴既總兵柄私與國用安謀欲邀上幸海州及近侍局直長阿勒根兀惹使用安回附奏帖謂海州可就山東豪傑以圖恢復且已具舟楫可通遼東上覽奏不從又嘗請上北渡再圖恢復女魯歡沮之自是有異心矣且一軍倚外兵肆為剽掠官奴不之禁於是左丞李蹊左右司郎中張天綱近侍局副使李大節俱為上言官奴有反狀上竊憂之以馬軍總領紇石烈阿里合內族習顯陰察其動靜與朝臣言及則曰我從官奴微賤中起為大帥何負而反耶卿等勿過慮阿里合習顯知官奴漸不能制反泄上意上亦懼官奴馬用相圖因以為亂命宰執置酒和解之用撤備俄官奴乘隙率其軍攻用用軍敗走官奴亂殺軍民以卒五十人守行宮劫朝官皆聚於都水毛花輦宅以兵監焉驅參知政事石盞女魯歡至其家悉出所有金具然後殺之乃遣都尉馬實被甲持刃劫直長把奴申於上前上初握劍見實擲劍於地曰為我言於元帥我左右止有此人且留侍我實不敢迫逡巡而退凡殺朝官左丞李蹊已下三百餘人軍將禁衛民庶死者三千郎中完顏胡魯剌都事冀禹錫赴水死禹錫字京甫龍山人至寧元年進士仕歷州郡有能聲歸德受兵禹錫為行院都事經畫守禦一府倚重聞變或勸以微服免不從見害是日薄暮官奴提兵入見言石盞女魯歡等反臣殺之矣上不得已赦其罪以為樞密副使權參知政事初官奴之母自河北軍潰北兵得之至是上乃命官奴因其母以計請和故官奴密與忒木木受議和事令阿里合往言欲劫上以降忒木木受信之還其母因定和計官奴乃日往來講議或乘舟中流會飲其遣來使者二十餘輩皆女直契丹人上密令官奴以金銀牌與之勿令還營因知王家寺大將所在故官奴畫斫營之策先是忠孝軍都統張姓者謂官奴決欲劫上北降遂率本軍百五十人圍官奴之第數之曰汝欲獻主上我輩皆大朝不赦者使安歸乎官奴懼乃以其母出質云汝等若以吾母自北中來疑我與北有謀即殺之我不恨張意稍解即以好語與之約曰果如參政所言今後勿復言講和北使至即當殺之官奴曰殺亦可不殺亦可奏而殺之亦可張乃退官奴即聚軍北草場自言無反情今勿復相疑也遂畫斫營之策五月五日祭天軍中陰備火槍戰具率忠孝軍四百五十人自南門登舟由東而北夜殺外堤邏卒遂至王家寺上御北門繫舟待之慮不勝則入徐州而遁四更接戰忠孝初小却再進官奴以小船分軍五七十出柵外腹背攻之持火槍突入北軍不能支即大潰溺水死者凡三千五百餘人盡焚其柵而還遂真拜官奴參知政事兼左副元帥仍以御馬賜之槍制以敕黃紙十六重為筒長二尺許實以柳炭鐵滓磁末硫黃砒霜之屬以繩繫槍端軍士各懸小鐵罐藏火臨陳燒之焰出槍前丈餘藥盡而筒不損蓋汴京被攻已嘗得用今復用之兵既退官奴入亳州留習顯總其軍上御照碧堂無一人敢奏對者日悲泣云自古無不亡之國不死之君但恨我不知用人故為此奴所囚耳於是內局令宋乞奴與奉御吾古孫愛實納蘭忔答女奚烈完出密謀誅官奴或言官奴密令兀惹計構國用安脅上傳位恢復山東事不成則獻上於宋自贖反復之罪官奴以己未往亳州辛酉召之還不至再召乃以六月己卯還上諭以幸蔡事官奴憤憤而出至於扼腕頓足意趣叵測上決意欲誅之遂與內侍宋乞奴處置令裴滿抄合召宰相議事完出伏照碧堂門間官奴進見上呼參政官奴即應完出從後刺其肋上亦拔劒斫之官奴中創投階下以走完出叱忔答愛實追殺之忠孝軍聞難皆擐甲完出請上親撫慰之名呼李泰和授以虎符使往勞軍因召范陳僧王山兒白進阿里合進先至殺之堂下阿里合中路覺其事悔發之晚為亂箭所射而死乞奴愛實忔答皆授節度使世襲千戶完出兼殿前右衛將軍范陳僧王山兒忠孝軍元帥於是上御雙門赦忠孝軍以安反側除崔立不赦外其餘常所不原者咸赦之初官奴解睢陽之圍侍從官屬久苦飢窘聞蔡州城池堅固兵衆糧廣咸勸上南幸惟官奴以嘗從點檢內族斜烈過蔡知其備禦不及睢陽力爭以為不可故號於衆曰敢言南遷者斬衆以官奴為無君諷上早為計會其變遂以計誅之後遣烏古論蒲鮮如蔡還言其城池兵糧果不足恃上已在道無可奈何及蔡受兵始悔不用官奴之言特詔尚書省月給其母妻糧俾無失所習顯既黨官奴一日率忠孝軍劫官庫金四千兩上命歸德治中溫特罕道僧帥府經歷把奴申鞫問顯伏罪下獄官奴變顯脫走殺總領完顏長樂於宮門殺道僧奴申於其家遂奔亳及官奴伏誅詔點檢阿勒根阿失答即亳州斬顯及忠孝軍首領數人兀惹使用安未還伺於中路數其罪殺之內族慶山奴名承立字獻甫統軍使拐山之子平章白撒之從弟也為人儀觀甚偉而內恇怯無所有至寧初宣宗自彰德赴闕慶山奴迎見于臺城宣宗喜遣先還中都觀變宣宗既即位以承立為西京副留守權近侍局直長進官五階賜錢五千貫且詔曰汝雖授此職姑留侍朕遇闕赴之仍給汝副留守祿此朕特恩宜知悉也貞祐初遷武衛軍副都指揮使兼提點近侍局胡沙虎專權僭竊嘗為宣宗言之後胡沙虎伏誅慶山奴愈見寵幸以為殿前右副都點檢三年大元兵圍中都詔以慶山奴為宣差便宜都提控率所募兵往援俄為元帥右都監行帥府事兼前職四年知慶陽府事兼慶原路兵馬都總管以所獲馬駝進詔諭曰此皆軍士所得即以與之可也朕安用哉後勿復進因令遍諭諸道帥府焉興定元年正月大元兵及夏人回經寧州慶山奴以兵邀擊敗之以功進元帥左都監兼保大軍節度使行帥府事於鄜州二年五月夏人率步騎三千由葭州入寇慶山奴以兵逆之戰于馬吉峯殺百餘人斬酋首二級生擒數十人獲馬三十餘匹三年四月夏人據通秦寨慶山奴遣提控納合買住討之夏人以步騎二萬逆戰買住擊敗之夏人由葭蘆川遁去凡斬首八百級俄而復攻寨據之慶山奴率兵與戰斬首五千級復其寨詔賜慶山奴金帶一將士賞賚有差四年四月破夏兵于宥州斬首千餘級遂圍神堆府慶山奴四面攻之士卒方登陴援兵大至復擊走之正大四年李全據楚州詔以慶山奴為元帥同總帥完顏訛可將兵守盱眙且令城守勿出戰已而全軍盱眙界二帥迎敵大敗死者萬餘人委棄資仗甚衆時軍無見糧轉輸不繼民疲奔命愁嘆盈路諸相不肯正言樞密判官白華拜章乞斬之以謝天下不報降為定國軍節度使又以受賂奪一官八年正月鳳翔破兩行省徙京兆居民於河南令慶山奴以行省守之時京兆行省止有病卒八百瘦馬二百承立懼不能守屢上奏請還每奏一帖附其兄白撒一書令為地朝廷不許十月慶山奴棄京兆還朝留同知乾州軍州事保義軍提控苟琪守之慶山奴行至閺鄉哀宗遣近侍裴滿七斤授以黃陵岡從宜不聽入見未幾代徒單兀典行省事於徐州九年正月自徐引兵入援選精鋭一萬五千與徐帥完頻兀論統之將趨歸德義勝軍總領侯進杜政張興等率所部三千人降大兵慶山奴留睢州三日不敢進聞大兵且至懼此州不可守退保歸德二月行次楊驛店遇小乃木受軍遂潰兀論戰死慶山奴馬躓被擒惟元帥郭恩都尉烏林答阿督率三百餘人走歸德大兵以一馬載慶山奴擁迫而行道中見真定史帥承立問曰君為誰史帥言我真定五路史萬戶也承立曰是天澤乎曰然曰吾國已殘破公其以生靈為念及見大帥忒木木受誘之使招京城不從又偃蹇不屈左右以刀斫其足折亦不降即殺之議者以承立纍敗不能解其軍職死有餘責而能以死報國亦足稱云初睢州刺史張文壽聞大兵將至遷旁縣居民入城大聚芻粟然無固守意日夜謀走以自便既而聞承立入援即以州事付其僚佐託以應援徐兵夜啓關挈家走歸德慶山奴以為行部郎中死楊驛俄大兵圍睢州以無主將故殘破之甚也兀論丞相賽不之姪元光間例以諸帥為總領兀論以丞相故獨不罷金朝防近族而用疏屬故白撒承立兀論輩皆腹心倚之贊曰官奴素行反側倏南倏北若龍斷然哀宗一旦倚為腹心終為所制照碧之處何異幽囚其事與梁武侯景大同而小異徒單兀典慶山奴為將皆貪宜數取敗女魯歡無大失行而死於官奴哀宗猶暴其罪寃哉
