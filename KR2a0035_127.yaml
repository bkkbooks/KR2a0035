body:
  text: 金史卷一百二十七列傳第六十五孝友溫迪罕斡魯補陳顏劉瑜孟興王震劉政孝友者人之至行也而性存焉有子者欲其孝有弟者欲其友豈非人之情乎為子而孝為弟而友又豈非人之性乎以人之情責人之性而不副所欲者有焉有竭力於是豈非難乎天生五穀以養人五穀之有性也服田力穡以望有秋農夫之有情也五穀熟人民育豈異事乎然以唐虞之世黎民阻飢不免以命稷百姓不親五品不遜不免以命契以是知順成之不可必猶孝友之不易得也是故有年大有年以異書於聖人之經孝友以至行傳於歷代之史劭農興孝之教不廢於歷代之政孝弟力田自漢以來有其科章宗嘗言孝義之人素行已備雖有希覬猶不失為行善庶幾帝王之善訓矣夫金世孝友見於旌表載於史冊者僅六人焉作孝友傳溫迪罕斡魯補西北路宋葛斜斯渾猛安人年十五居父喪不飲酒食肉廬于墓側母疾刲股肉療之疾愈詔以為護衛陳顏衛州汲縣人世業農父光宋季擢武舉第調壽陽尉未赴值金兵取汴光病圍城中顏間關渡河往省其父因扶疾北歸光家奴謀良不可誣告光與賊殺人光繫獄榜掠不勝因自誣服顏詣郡請代父死太守徐某哀之不敢決適帥臣至郡以其狀白帥曰此真孝子也遂並釋之天會七年詔旌表其門閭劉瑜棣州人家貧甚母喪不能具葬乃質其子以給喪事明昌三年詔賜粟帛復其終身孟興蚤喪父事母孝謹母沒喪葬盡禮事兄如事其父明昌三年詔賜帛十匹粟二十石王震寧海州文登縣人為進士學母患風疾刲股肉雜飲食中疾遂愈母沒哀泣過禮目生翳服除目不療而愈皆以為孝感所致特賜同進士出身詔尚書省擬注職任劉政洺州人性篤孝母老喪明政每以舌舐母目逾旬母能視物母疾晝夜侍側衣不解帶刲股肉啖之者再三母死負土起墳鄉鄰欲佐其勞政謝之葬之日飛鳥哀鳴翔集丘木間廬於墓側者三年防禦使以聞除太子掌飲丞隱逸褚承亮王去非趙質杜時升郝天挺薛繼先高仲振張潛王汝梅宋可辛願王豫可孔子稱逸民伯夷叔齊夷逸朱張柳下惠少連其立心造行之異同各有所稱謂而柳下惠則又嘗仕於當世者也長沮桀溺之徒則無所取焉後世凡隱遁之士其名皆列於史傳何歟蓋古之仕者其志將以行道其為貧而仕下列者猶必先事而後食焉後世干祿者多其先人尚人之志與歎老嗟卑之心能去是者鮮矣故君子於士之遠引高蹈者特稱述之庶聞其風猶足以立懦廉頑也作隱逸傳褚承亮字茂先真定人宋蘇軾自定武謫官過真定承亮以文謁之大為稱賞宣和五年秋應鄉試同試者八百人承亮為第一明年登第調易州戶曹未赴會金兵南下天會六年斡離不既破真定拘籍境內進士試安國寺承亮名亦在籍中匿而不出軍中知其才嚴令押赴與諸生對策策問上皇無道少帝失信舉人承風旨極口詆毀承亮詣主文劉侍中曰君父之罪豈臣子所得言耶長揖而出劉為之動容餘悉放第凡七十二人遂號七十二賢榜狀元許必仕為郎官一日出左掖門墮馬首中閫石死餘皆無顯者劉多承亮之誼薦知城縣漫應之即棄去年七十終門人私諡曰玄貞先生子席珍正隆二年進士官州縣有聲王去非字廣道平陰人嘗就舉不得意即屏去督妻孥耕織以給伏臘家居教授束修有餘輒分惠人弟子班帎貧不能朝夕一女及筓去非為辦資裝嫁之北鄰有喪忌東出西與北皆人居南則去非家去非壞蠶室使喪南出遂得葬焉大定二十四年卒年八十四趙質字景道遼相思溫之裔大定末舉進士不第隱居燕城南教授為業明昌間章宗遊春水過焉聞絃誦聲幸其齊舍見壁間所題詩諷詠久之賞其志趣不凡召至行殿命之官固辭曰臣僻性野逸志在長林豐草金鑣玉絡非所願也況聖明在上可不容巢由為外臣乎上益奇之賜田畝千復之終身泰和二年卒年八十五杜時升字進之霸州信安人博學知天文不肯仕進承安泰和間宰相數薦時升可大用時升謂所親曰吾觀正北赤氣如血東西亙天天下當大亂亂而南北當合為一消息盈虛循環無端察往考來孰能違之是時風俗侈靡紀綱大壞世宗之業遂衰時升乃南渡河隱居嵩洛山中從學者甚衆大抵以伊洛之學教人自時升始正大間大元兵攻潼關拒守甚堅衆皆相賀時升曰大兵皆在秦鞏間若假道於宋出襄漢入宛葉鐵騎長驅勢如風雨無高山大川為之阻土崩之勢也頃之大元兵果自饒峯關涉襄陽出南陽金人敗績于三峯山汴京不守皆如時升所料云正大末卒郝天挺字晉卿澤州陵川人早衰多疾厭於科舉遂不復充賦太原元好問嘗從學進士業天挺曰今人賦學以速售為功六經百家分磔緝綴或篇章句讀不之知幸而得之不免為庸人又曰讀書不為藝文選官不為利養唯通人能之又曰今之仕多以貪敗皆苦飢寒不能自持耳丈夫不耐飢寒一事不可為子以吾言求之科舉在其中矣或曰以此學進士無乃戾乎天挺曰正欲渠不為舉子爾貞祐中居河南往來淇衛間為人有崖岸耿耿自信寧落魄困窮終不一至豪富之門年五十終于舞陽薛繼先字曼卿南渡後隱居洛西山中課童子讀書事母孝與人交謙遜和雅所居化之子純孝字方叔有父風有詐為曼卿書就方叔取物者曼卿年已老狀貌如少者客不知其為曼卿而以為方叔也而與之書曼卿如所取付之監察御史石玠行部過曼卿曼卿不之見或言君何無鄉曲情曼卿曰君未之思耳凡今時政未必皆善御史一有所劾將謂自我發之同惡相庇他日並鄰里必有受禍者其畏慎皆此類壬辰之亂病沒宜陽高仲振字正之遼東人其兄領開封鎮兵仲振依之以居既而以家業付其兄挈妻子入嵩山博極羣書尤深易皇極經世學安貧自樂不入城市山野小人亦知敬之嘗與其弟子張潛王汝梅行山谷間人望之翩然如仙或曰仲振嘗遇異人教以養生術嘗終日燕坐骨節戛戛有聲所談皆世外事有扣之者輒不復語云張潛字仲升武清人幼有志節慕荊軻聶政為人年三十始折節讀書時人高其行誼目曰張古人後客嵩山從仲振受易年五十始娶魯山孫氏亦有賢行夫婦相敬如賓負薪拾穗行歌自得不知其貧也鄰里有為潛種瓜者及熟讓潛潛弗許竟分而食之嘗行道中拾一斧夫婦計度移時乃持歸訪其主還之里有兄弟分財者其弟曰我家如此獨不畏張先生知耶遂如初天興間潛挈家避兵少室乃不食七日死孫氏亦投絶澗死焉王汝梅字大用大名人始由律學為伊陽簿秩滿遂隱居不仕性嗜書動有禮法生徒以法經就學者兼授以經學諸生服其教無敢為非義者同業嘗憫其貧時周之皆謝不受後不知所終宋可字豫之武陟人其姑適大族氏貞祐之兵夫及子皆死於難姑以白金五十笏遺可可受不辭其後姑得氏疏族立為後挈之省外家可乃置酒會鄉鄰謂姑曰姑往時遺可以金可以氏無子故受之今有子矣此金氏物非姑物也可何名取之因呼妻子舁金歸之鄉里用是重之未幾北兵駐山陽軍中有聞可名者訪知所在質其子使人招之曰從我者禍福共之不然汝子死矣親舊競勸之往可皆謝不從曰吾有子無子與吾兒死生皆有命焉豈以一子故並平生所守者亡之後竟以無子辛願字敬之福昌人年二十五始知讀書取白氏諷諫集自試一日便能背誦乃聚書環堵中讀之至書伊訓詩河廣頗若有所省欲罷不能因更致力焉由是博極書史作文有繩尺詩律精嚴有自得之趣性野逸不修威儀貴人延客麻衣草屨足脛赤露坦然於其間劇談豪飲傍若無人嘗謂王鬱曰王侯將相世所共嗜者聖人有以得之亦不避得之不以道與夫居之不能行己之志是欲澡其身而伏於厠也是難與他人道子宜保之其志趣如此後為河南府治中高廷玉客廷玉為府尹溫迪罕福興所誣願亦被訊掠幾不得免自是生事益狼狽願雅負高氣不能從俗俯仰迫以飢凍流離往往見之于詩有詩數千首常貯竹槖中正大末歿洛下其詩有云黃綺暫來為漢友巢由終不是唐臣真處士語也王豫可字南雲河東吉州人父本軍校豫可亦嘗隸籍年三十許大病後忽發狂久之能把筆作詩文及說世外恍惚事南渡後居上蔡遂平郾城之間遇文士則稱大成將軍於佛前則稱諦摩龍什於道則稱騶天玄俊於貴游則稱威錦堂主人為人軀幹雄偉貌奇古戴青葛巾項後垂雙帶若牛耳一金鏤環在頂額之間兩頰以青涅之為翠靨衣長不能掩脛落魄嗜酒每入城市人爭以酒食遺之夜宿土室中夏月或尸穢在傍蛆蟲狼藉不恤也人與之紙落筆數百言或詩或文散漫碎雜無句讀無首尾多六經中語及韻學家古文奇字字畫峭徑遇宋諱亦時避之或問以故事其應如響諸所引書皆世所未見談說之際稍若有條貫則又以誕幻語亂之麻九疇張瑴與之游最狎言其詩以百分為率可曉者才二三耳壬辰兵亂為順天將領所得知其名竊議欲挈之北歸館於州之瑞雲觀豫可明日見將領自言曰我不能住君家瑞雲觀也不數日卒後復有見於淮上者贊曰金世隱逸不多見今於簡冊所有得十有二人焉其卓爾不羣者三人褚承亮宋人勒試進士主司發策問宋徽欽之罪承亮長揖而去之方金人重舉業杜時升居山中首以伊洛之學教後進宋可不願仕人執其子為質寧棄而不就遂以無子雖制行過中豈不賢於殺妻以求大將者乎大夫士見善明用心剛故能為人所難為者如此
