body:
  text: 金史卷六十四列傳第二后妃下睿宗欽慈皇后睿宗貞懿皇后世宗昭德皇后世宗元張氏世宗元李氏顯宗孝懿皇后顯宗昭聖皇后章宗欽懷皇后章宗元李氏衛紹王后徒單氏宣宗皇后王氏宣宗明惠皇后哀宗徒單皇后睿宗欽慈皇后蒲察氏睿宗元配后之母太祖之妹也睿宗為左副元帥天會十三年薨追封潞王后封潞王妃皇統六年進號冀國王妃天德間進國號正隆例親王止封一字王睿宗封許王后封許王妃世宗即位睿宗升祔追諡欽慈皇后贈后曾祖賽補司空韓國公祖蒲剌司徒鄭國公父按補太尉曹國公大定二年祔葬景陵世宗嘗曰今之女直不比前輩雖親戚世亦不能知其詳太后之母太祖之妹人亦不能知也謂宗曰亦是卿父談王之妹知之乎宗曰臣不能知也上曰父之妹且不知其如疏遠何十九年后族人勸農使莎魯窩請致仕宰相以莎魯窩未嘗歷外請除一外官以均勞佚上曰莎魯窩不間政事不可使治民雖太后戚屬富貴之可也不聽貞懿皇后李氏世宗母遼陽人父雛訛只仕遼官至桂州觀察使天輔間選東京士族女子有姿德者赴上京后入睿宗邸七年世宗生天會十三年睿宗薨世宗時年十規矩衣服飲食器皿無不精潔敦睦親族周給貧乏宗室中甚敬之后性明敏剛正有決容貌端整言不妄發舊俗婦女寡居宗族接續之后乃祝髮為比丘尼號通慧圓明大師賜紫衣歸遼陽營建清安禪寺別為尼院居之貞元三年世宗為東京留守正隆六年五月后卒世宗哀毀過禮以喪去官未幾起復為留守是歲十月后弟李石定策世宗即位于東京尊諡為貞懿皇后其寢園曰孝寧宮大定二年改葬睿宗於景陵初后自建浮圖于遼陽是為垂慶寺臨終謂世宗曰鄉土之念人情所同吾已用浮屠法置塔于此不必合葬也我死毋忘此言世宗深念遺命乃即東京清安寺建神御殿詔有司增大舊塔起奉慈殿於塔前敕禮部尚書王競為塔銘以其意贈后曾祖參君司空潞國公祖波司徒衛國公父雛訛只太尉隋國公四年封后妹為邢國夫人賜銀千兩錦綺二十端絹五百匹九年神御殿名曰報德殿詔翰林學士張景仁作清安寺碑其文不稱旨詔左丞石琚共修之十三年東京垂慶寺起神御殿寺地褊狹詔買傍近民地優與其直不願鬻者以官地易之二十四年世宗至東京幸清安垂慶寺世宗昭德皇后烏林答氏其先居海羅伊河世為烏林答部長率部族來歸居上京與本朝為婚姻家曾祖勝管康宗時纍使高麗父石土黑騎射絶倫從太祖伐遼領行軍猛安雖在行伍間不嗜殺人以功授世襲謀克為東京留守后聰敏孝慈容儀整肅在父母家宗族皆敬重之既歸世宗事舅姑孝謹治家有甚得婦道睿宗伐宋得白玉帶蓋帝王之服御也睿宗沒後世宗寶畜之后謂世宗曰此非王邸所宜有也當獻之天子世宗以為然獻之熙宗於是悼后大喜熙宗晚年頗酗酒獨於世宗無間然海陵篡立深忌宗室烏帶譖秉德以為意在葛王秉德誅死后勸世宗多獻珍異以説其心如故遼骨睹犀佩刀吐鶻良玉茶器之類皆奇寶也海陵以世宗恭順畏己由是忌刻之心頗解后不妬忌為世宗擇後房廣繼嗣雖顯宗生後而此心不移后嘗有疾世宗為視醫藥數日不離去后曰大王視妾過厚其知者以為視疾不知者必有專妬之嫌又曰婦道以正家為大第恐德薄無補內治安能效嬪妾所為惟欲己厚也世宗在濟南海陵召后來中都后念若身死濟南海陵必殺世宗惟奉詔去濟南而死世宗可以免謂世宗曰我當自勉不可纍大王也召王府臣僕張僅言諭之曰汝王之腹心人也為我禱諸東嶽我不負王使皇天后土明鑑我心召家人謂之曰我自初年為婦以至今日未嘗見王有違道之事今宗室往往被疑者皆奴僕不良傲恨其主以誣陷之耳汝等皆先國王時舊人當念舊恩無或妄圖也違此言者我死後於冥中觀汝所為衆皆泣下后既離濟南從行者知后必不肯見海陵將自為之所防護甚謹行至良鄉去中都七十里從行者防之稍緩后得間即自殺海陵猶疑世宗教之使然世宗自濟南改西京留守過良鄉使魯國公主葬后于宛平縣土魯原大定二年追册為昭德皇后立別廟贈三代曾祖勝管司空徐國公曾祖母完顏氏徐國夫人祖术思黑司徒代國公祖母完顏氏代國夫人父石土黑太尉瀋國公母完顏氏瀋國夫人敕有司改葬命皇太子致奠以后兄暉子天錫為太尉石土黑後授世襲猛安上謂天錫曰朕四五歲時與皇后定婚乃祖太尉置朕于膝上曰吾壻七人此壻最幼後來必大吾門今卜葬有期疇昔之言驗矣六年利涉軍節度副使烏林答鈔兀捕逃軍受贓當死有司奏鈔兀后大功親當議詔論如法八年七月章宗生世宗喜甚謂顯宗曰得社稷冢嗣朕樂何極此皇后貽爾以陰德也十年十月將改葬太尉石土黑有司奏禮儀援唐葬太尉李良器司徒馬燧故事百官便服送至都門外五里上曰前改葬太后父母未嘗用此故事但以本朝禮改葬之惟親戚皆送詔皇太子臨奠十一年皇太子生日世宗宴於東宮酒酣命豫國公主起舞上流涕曰此女之母皇后婦道至矣朕所以不立中宮者念皇后之德今無其比故也十二年四月立皇后別廟于太廟東北隅是歲五月車駕幸土魯原致奠十九年改卜于大房山十一月甲寅皇后梓宮至近郊百官奉迎乙卯車駕如楊村致祭丙辰上登車送哭之慟戊午奉安于磐寧官庚申葬于坤厚陵諸妃祔焉二十九年祔葬興陵章宗時有司奏太祖諡有昭德字改諡明德皇后元妃張氏父玄徵母高氏與世宗母貞懿皇后葭莩親世宗納為次室生趙王永中而張氏卒大定二年追封宸妃是歲十月追進惠妃十九年追進元妃大定二十五年皇太子薨永中於諸子最長而世宗與徒單克寧議立章宗為太孫世宗嘗曰克寧與永中有親而建議立太孫真社稷臣也尚書左丞汝弼者玄徵子永中母舅汝弼妻高陀斡屢以邪言怵永中畫元妃像朝夕事之覬望徼福及挾左道明昌五年高陀斡誅死事連汝弼及永中汝弼以死後事覺得不追削官爵而章宗心疑永中纍年不釋諫官賈守謙路鐸上疏欲寬解上意章宗愈不悅平章政事完顏守貞持其事不肯決章宗怒守貞罷知濟南府諸諫官皆斥外賜永中死金代外戚之禍惟張氏云元妃李氏南陽郡王李石女生鄭王允蹈衛紹王允濟潞王允德豫王允成母昭儀梁氏早卒上命允成為妃養子大定元年封賢妃二年進封貴妃七年進封元妃世宗即位感念昭德皇后不復立后嘗曰朕所以不復立后者今後宮無皇后之賢故也元妃下皇后一等在諸妃上石有定策功世宗厚賞而深制之寵以尚書令之位而責成左右丞相以下妃雖貴不得預政宮壼無事大定二十一年二月上如春水次長春宮戊子妃以疾薨詔允成允蹈允濟允德皆服衰絰居喪己丑皇太子及扈從臣僚奉慰于芳明殿辛卯留守官平章政事唐括安禮曹王允功等上表奉慰御史中丞張九思提控殯事少府監左光慶大興少尹王翛典領鹵簿儀仗宮籍監別治殯所還殯京師乙未入自崇智門百官郊迎親戚迎奠道路殯于興德宮西位別室庚子上至京師幸興德宮致奠比葬三致奠焉詔平章政事烏古論元忠監護葬事癸未草坴丸土菆上輟朝皇太子親王宗戚百官送葬甲申葬於海王莊丙戌上如海王莊燒飯二十八年九月與賢妃石抹氏德妃徒單氏柔妃大氏俱陪葬于坤厚陵衛紹王即位追諡光獻皇后贈妃弟獻可特進貞祐三年九月削皇后號顯宗孝懿皇后徒單氏其先忒里闢剌人也曾祖抄從太祖取遼有功命以所部為猛安世襲之祖婆盧火以戰功多纍官開府儀同三司贈司徒齊國公父貞尚遼王宗幹女梁國公主加駙馬都尉贈太師廣平郡王后以皇統七年生於遼陽母夢神人授以寶珠光焰滿室既寤而生紅光燭于庭后性莊重寡言父母嘗令總家事細大畢辦諸男不及也世宗初即位貞為御史大夫自南京馳見世宗喜謂之曰卿雖廢主腹心臣然未嘗助彼為虐況卿家法可尚其以卿女為朕子妃及顯宗為皇太子大定四年九月備禮親迎於貞第世宗臨宴盡歡而罷是年十一月顯宗生辰初封為皇太子妃八年七月上遣宣徽使移剌神獨斡以名馬寶刀御膳賜太子及妃仍諭之曰妃今臨蓐願平安得雄有慶之後宜以此刀置左右既而皇孫生是為章宗時上幸金蓮川次冰井翌日上臨幸撫視宴甚歡又賜御服佩刀等物謂顯宗曰祖宗積慶且皇后陰德至厚而有今日社稷之洪福也又謂李石紇石烈志寧曰朕諸子雖多皇后止有太子一人而已今幸得嫡孫觀其骨相不凡又生麻達葛山山勢衍氣清朕甚嘉之因以山名為章宗小字后素謙謹每畏其家世崇寵見父母流涕而言曰高明之家古人所忌願善自保持其後家果以海陵事敗蓋其遠慮如此世宗嘗謂諸王妃公主曰皇太子妃容止合度服飾得中爾等當法效之章宗即位尊為皇太后更所居仁壽宮名曰隆慶宮詔有司歲奉金千兩銀五千兩重幣五百端絹二千匹綿二萬兩布五百匹錢五萬貫他所應用內庫奉之毋拘其數上月或五朝六朝而后愈加敬儉見諸大長公主禮如平時惇睦九族恩紀皆合尤惡聞人過諛佞之言無所得入恕以容物未嘗見喜慍然御下公平雖至親無所阿徇嘗誡諸姪曰皇帝以我故乃推恩外家當盡忠圖報勿謂小善為無益而弗為小惡為無傷而弗去毋藉吾之貴輒肆非違以干國家常憲一日妹並國夫人嫂涇國夫人等侍側因諭之曰爾家纍素重且非豐厚宜節約財用勿以吾為可恃吾受天下之養豈有所私積哉況財用者天下之財用也吾終不能多取以富爾之私室家人有以玉盂進者却之且曰貴異物而殫財用非我所欲也況我之賜豫有度今爾以此為獻何以自給徒費汝財我實無用後勿復爾明昌元年禮官議以五月奉上册寶后弗許上屢為之請后曰今世宗服未終遽衣錦繡佩珠玉於禮何安當俟服闋行之上諭有司曰太后執意甚堅其待來年明昌二年正月崩於隆慶宮年四十五諡曰孝懿祔葬裕陵后好詩書尤喜老莊學純淡清懿造次必於禮逮嬪御以和平其有生子而母亡者視之如己所生慈訓無間上時問安見事有未當者必加之嚴誡云昭聖皇后劉氏遼陽人天眷二年九月己亥夜后家若見有黃衣女子入其母室中者俄頃后生性聰慧凡字過目不忘初讀孝經旬日終卷最喜佛書世宗為東京留守因擊毬見而奇之使見貞懿皇后于府中進退間雅無恣睢之色大定元年選入東宮時年二十三三年三月十三日宣宗生是日大雨震電后驚悸得疾尋卒承安五年贈裕陵昭華宣宗即位追尊為皇太后升祔顯宗廟追諡昭聖皇后章宗欽懷皇后蒲察氏上京路曷速河人也曾祖太神國初有功纍階光祿大夫贈司空應國公祖阿胡迭官至特進贈司徒譙國公父鼎壽尚熙宗鄭國公主授駙馬都尉中都路昏得渾山猛安曷速木單世襲謀克纍官至金吾衛上將軍贈太尉越國公后之始生有紅光被體移時不退就養於姨冀國公主既長孝謹如事所生大定二十三年章宗為金源郡王行納采禮世宗遣近侍局使徒單懷忠就賜金百兩銀千兩馬六匹重綵三十端拜命間慶雲見于日側觀者異之是年十一月備禮親迎詔親王宰執三品已上官及命婦會禮封金源郡王夫人後進封妃崩后性淑明風儀粹穆知讀書為文帝即位遂加追册仍詔告中外奉安神主于坤寧宮歲時致祭大安初祔葬于道陵元妃李氏師兒其家有罪沒入宮籍監父湘母王盻兒皆微賤大定末以監戶女子入宮是時宮教張建教宮中師兒與諸宮女皆從之學故事宮教以青紗隔障蔽內外宮教居障外諸宮女居障內不得面見有不識字及問義皆自障內映紗指字請問宮教自障外口説教之諸女子中惟師兒易為領解建不知其誰但識其音聲清亮章宗嘗問建宮教中女子誰可教者建對曰就中聲音清亮者最可教章宗以建言求得之宦者梁道譽師兒才美勸章宗納之章宗好文辭妃性慧黠能作字知文義尤善伺候顏色迎合旨意遂大愛幸明昌四年封為昭容明年進封淑妃父湘追贈金紫光祿大夫上柱國隴西郡公祖父曾祖父皆追贈兄喜兒舊嘗為盜與弟鐵哥皆擢顯近勢傾朝廷風采動四方射利競進之徒爭趨走其門南京李炳中山李著與通譜系超取顯美胥持國附依以致宰相怙財固位上下紛然知其姦蠹不敢擊之雖擊之莫能去也紇石烈執中貪愎不法章宗知其跋扈而屢斥屢起終亂天下自欽懷皇后沒世中宮虛位久章宗意屬李氏而國朝故事皆徒單唐括蒲察拏懶僕散紇石烈烏林答烏古論諸部部長之家世為姻婚娶后尚主而李氏微甚至是章宗果欲立之大臣固執不從臺諫以為言帝不得已進封為元妃而勢位熏赫與皇后侔矣一日章宗宴宮中優人瑁頭者戲于前或問上國有何符瑞優曰汝不聞鳳皇見乎其人曰知之而未聞其詳優曰其飛有四所應亦異若嚮上飛則風雨順時嚮下飛則五穀豐登嚮外飛則四國來朝嚮𩹉飛則加官進祿上笑而罷欽懷后及妃姬嘗有子或二三歲或數月輒夭承安五年帝以繼嗣未立禱祀太廟山陵少府監張汝猷因轉對奏皇嗣未立乞聖主親行祀事之後遣近臣詣諸嶽觀廟祈禱詔司空襄往亳州禱太清宮既而止之遣刑部員外郎完顏匡往焉泰和二年八月丁酉元妃生皇子忒鄰羣臣上表稱賀宴五品以上于神龍殿六品以下宴于東廡下詔平章政事徒單鎰報謝太廟右丞完顏匡報謝山陵使使亳州報謝太清宮既彌月詔賜名封為葛王葛王世宗初封大定後不以封臣下由是三等國號無葛尚書省奏請於瀛王下附葛國號上從之十二月癸酉忒鄰生滿三月敕放僧道度牒三千道設醮于玄真觀為忒鄰祈福丁丑御慶和殿浴皇子詔百官用元旦禮儀進酒稱賀五品以上進禮物生凡二歲而薨兄喜兒纍官宣徽使安國軍節度使弟鐵哥纍官近侍局使少府監至八年承御賈氏及范氏皆有娠未及乳月章宗已得嗽疾頗困是時衛王永濟自武定軍來朝章宗於父兄中最愛衛王欲使繼體立之語在衛紹王紀衛王朝辭是日章宗力疾與之擊毬謂衛王曰叔王不欲作主人遽欲去邪元妃在傍謂帝曰此非輕言者十一月乙卯章宗大漸衛王未發元妃與黃門李新喜議立衛王使內侍潘守召之守頗知書識大體謂元妃曰此大事當與大臣議乃使守召平章政事完顏匡匡顯宗侍讀最為舊臣有征伐功故獨召之匡至遂與定策立衛王丙辰章宗崩遺詔皇叔衛王即皇帝位詔曰朕之內人見有娠者兩位如其中有男當立為儲二如皆是男子擇可立者立之衛紹王即位大安元年二月詔曰章宗皇帝以天下重器畀于眇躬遺旨謂掖庭內人有娠者兩位如得男則立為儲二申諭多方皎如天日朕雖涼菲實受付託思克副於遺意每曲為之盡心擇靜舍以俾居遣懿親而守視欽懷皇后母鄭國公主及乳母蕭國夫人晝夜不離昨聞有爽於安養已用軫憂而弗寧爰命大臣專為調護今者平章政事僕散端左丞孫即康奏言承御賈氏當以十一月免乳今則已出三月來事未可度知范氏産期合在正月而太醫副使儀師顏言自年前十一月診得范氏胎氣有損調治迄今脈息雖和胎形已失及范氏自願於神御前削髮為尼重念先皇帝重屬大事豈期聞此深用怛然今范氏既已有損而賈氏猶或可冀告於先帝願降靈禧默賜保全早生聖嗣尚恐衆庶未究端由要不匿於播敷使咸明於吾意四月詔曰近者有訴元妃李氏潛計負恩自泰和七年正月章宗暫嘗違豫李氏與新喜竊議為儲嗣未立欲令宮人詐作有身計取他兒詐充皇嗣遂於年前閏月十日因賈承御病嘔吐腹中若有積塊李氏與其母王盻兒及李新喜謀令賈氏詐稱有身俟將臨月於李家取兒以入月日不偶則規別取以為皇嗣章宗崩謀不及行當先帝彌留之際命平章政事完顏匡都提點中外事務明有敕旨我有兩宮人有娠更令召平章左右並聞斯語李氏並新喜乃敢不依敕旨欲喚喜兒鐵哥事既不克竊呼提點近侍局烏古論慶壽與計因品藻諸王議復不定知近侍局副使徒單張僧遣人召平章已到宣華門外始發勘同平章入內一遵遺旨以定大事方先帝疾危數召李氏李氏不到及索衣服李氏承召亦不即來猶與其母私議先皇平昔或有幸御李氏嫉妬令女巫李定奴作紙木人鴛鴦符以事魘魅致絶聖嗣所為不軌莫可殫陳事既發露遣大臣按問俱已款服命宰臣往審亦如之有司議法當極刑以其久侍先帝欲免其死王公百僚執奏堅確今賜李氏自盡王盻兒李新喜各正典刑李氏兄安國軍節度使喜兒弟少府監鐵哥如律仍追除復係監籍於遠地安置諸連坐並依律令施行承御賈氏亦賜自盡蓋章宗崩三日而稱范氏胎氣有損章宗疾彌留亦無完顏匡都提點中外事務敕旨或謂完顏匡欲專定策功構致如此自後天下不復稱元妃但呼曰李師兒及胡沙虎弒衛王立宣宗請貶降衛王降為東海郡侯其詔曰大安之初頒諭天下謂李氏與其母王盻兒及李新喜同謀令賈氏虛稱有身各正罪法朕惟章宗皇帝聖德聰明豈容有此欺紿近因集議武衛軍副使兼提點近侍局完顏達霍王傅大政德皆言賈氏事內有寃此時達職在近侍政德護賈氏所以知之朕親臨問左證其事曖昧無據當時被罪貶責者可俱令放免還家由是李氏家族皆得還衛紹王后徒單氏大安元年立為皇后至寧元年胡沙虎亂與衛王俱遷于衛邸帝遇弒宣宗即位衛王降為東海郡侯徒單氏削皇后號貞祐二年遷都汴詔凡衛紹王及鄗厲王家人皆徙鄭州仍禁錮不得出入男女不得婚嫁者十九年天興元年詔釋禁錮是時河南已不能守子孫不知所終宣宗皇后王氏中都人明惠皇后妹也其父微時嘗夢二玉梳化為月已而生二后及沒有芝生于柩初宣宗封翼王章宗詔諸王求民家子以廣繼嗣是時后與龐氏偕入王邸及見后姊有姿色又納之貞祐元年九月封后為元妃姊為淑妃龐氏為真妃淑妃生哀宗真妃生守純后無子養哀宗為己子貞祐二年七月賜姓溫敦氏立為皇后追封后曾祖得壽司空冀國公曾祖母劉氏冀國夫人祖璞司徒益國公祖母楊氏益國夫人父彥昌太尉汴國公母馬氏汴國夫人三年莊獻太子薨哀宗為皇太子宣宗崩哀宗即位正大元年尊后為皇太后號其宮曰仁聖進封后父曰南陽郡王或曰宣宗為諸王時莊獻太子母為正妃及即位尊為皇后貞祐元年九月詔曰元妃某氏久奉侍於潛藩已賜封於國號可立為皇后其名氏蓋不可考也或又曰自王氏姊妹入宮而后寵衰尋為尼王氏遂立為后皆后姊明惠之謀也初王氏姊妹受封之日大風昏霾黃氣充塞天地已而后夢丐者數萬踵其後心甚惡之占者曰后者天下之母也百姓貧窶將誰訴焉后遂敕有司京城設粥與冰藥及壬辰癸巳歲河南飢饉大元兵圍汴加以大疫汴城之民死者百餘萬后皆目覩焉京宗釋服將禘饗太廟先期有司奏冕服成上請仁聖慈聖兩宮太后御內殿因試衣之以見兩宮大悅上更便服奉觴為兩宮壽仁聖太后諭上曰祖宗初取天下甚不易何時使四方承平百姓安樂天子服此法服於中都祖廟行禘饗乎上曰阿婆有此意臣亦何嘗忘慈聖太后亦曰有此心則見此當有期矣遂酌酒為上壽歡然而罷天興元年冬哀宗遷歸德二年正月遣近侍徒單四喜术甲答失不奉迎兩宮后御仁安殿出鋌金及七寶金洗分賜從行忠孝軍是夜兩宮及柔妃裴滿氏等乘馬出宮行至陳留城左右火起疑有兵不敢進后亟命還宮明日入京憩四喜家少頃輦迎入宮方謀再行京城破后及諸妃嬪北遷不知所終惟寶符李氏從至宣德州居摩訶院李氏自入院止寢佛殿中作為幡旆會當同后妃北行將發佛像前自縊死且自書門紙曰寶符御侍此處身故宣宗明惠皇后王皇后之姊也生哀宗宣宗即位封為淑妃及妹立為后進封元妃哀宗即位詔尊為皇太后號其宮曰慈聖后性端嚴頗達古今哀宗已立為皇太子有過尚切責之及即位始免檟楚一日宮中就食尚器有玉碗楪三一奉太后二奉帝及中宮荊王母真妃龐氏以瑪瑙器進食后見之怒召主者責曰誰令汝妄生分別荊王母豈卑我兒婦耶非飲食細故已令有司杖殺汝矣是後宮中奉真妃有加或告荊王謀不軌者下獄議已決帝言于后后曰汝止一兄奈何以讒言欲害之章宗殺伯與叔享年不永皇嗣又絶何為欲效之耶趣赦出使來見我移時不至吾不見汝矣帝起后立待王至涕泣慰撫之哀宗甚寵一宮人欲立為后后惡其微賤固命出之上不得已命放之出宮語使者曰爾出東華門不計何人首遇者即賜之於是遇一販繒者遂賜為妻點檢撒合輦教上騎鞠后傳旨戒之云汝為人臣常輔主以正顧乃教之戲耶再有聞必大杖汝矣比年小捷國勢頗振文士有奏賦頌以聖德中興為言者后聞不悅曰帝年少氣鋭無懼心則驕怠生今幸一勝何等中興而若輩諂之如是正大八年九月丙申后崩遺命園陵制度務從儉約十二月己未葬汴城迎朔門外五里莊獻太子墓之西諡明惠皇后哀宗皇后徒單氏宣宗及后有疾后嘗刲膚以進宣宗聞而嘉之興定四年后父鎮南軍節度使頑僧有罪宣宗以后純孝因曲赦之聽其致仕正大元年詔立為皇后哀宗遷歸德遣后弟四喜等詣汴奉迎夜至陳留不敢進復歸于汴未幾城破北遷不知所終贊曰周禮九嬪掌婦學之法婦德婦言婦容婦功班昭氏論之曰婦德不必才明絶異也婦言不必便口利辭也婦容不必顏色美麗也婦功不必功巧過人也清間貞靜守節整齊行己有動靜有法是謂婦德擇辭而説不道惡語時然後言不厭於人是謂婦言盥浣塵穢服飾鮮潔沐浴以時身不垢辱是謂婦容專心紡績不好戲笑潔齊酒食以奉賓客是謂婦功後世婦學不修麗色以相高巧言以相傾衒能以市恩逢迎以固寵是故悼平掣頓皇統以隕其身海陵蠱惑羣嬖幾亡其國道陵李氏擅寵蠹政卒僨其宗嗚呼可不戒哉
