body:
  text: 金史卷七本紀第七世宗中十二年正月庚午朔宋高麗夏遣使來賀戊寅詔有司凡陳言文字皆國政利害自今言有可行以其本封送祕書監當行者録副付所司丙申以水旱免中都西京南京河北河東山東陝西去年租稅二月壬寅上召諸王府長史諭之曰朕選汝等正欲勸導諸王使之為善如諸王所為有所未善當力陳之尚或不從則具某日行某事以奏若阿意不言朕惟汝罪丙午尚書省奏廉察到同知城陽軍事山和尚等清強官上曰此輩暗察明訪皆著政聲可第其政績各進官旌賞其速議升除庚戌上如順州春水癸丑還都丙辰詔自今官長不法其僚佐不能糾正又不言上者並坐之戶部尚書高德基濫支朝官俸錢四十萬貫杖八十三月己巳朔萬春節宋高麗夏遣使來賀乙亥詔尚書省贓汙之官已被廉問若仍舊職必復害民其遣使諸道即日罷之丁丑詔遣宿直將軍烏古論思列冊封王晧為高麗國王庚寅雨土癸巳以前西北路招討使移剌道為參知政事回紇遣使來貢丁酉北京曹貴等謀反伏誅四月旱癸卯尚書右丞孟浩罷丁巳西北路納合七斤等謀反伏誅癸亥以久旱命禱祠山川詔宰臣曰諸府少尹多闕員當選進士雖資未至而有政聲者擢用之以宿直將軍唐括阿忽里為橫賜夏國使乙丑大名尹荊王文以贓罪奪王爵降授德州防禦使回紇使使來貢丙寅尚書右丞相紇石烈志寧薨丁卯宋高麗遣使賀尊號阻來貢五月癸酉上如百花川甲戌命賑山東東路胡剌溫猛安民饑丁丑次阻居久旱而雨戊寅觀稼禁扈從蹂踐民田禁百官及承應人不得服純黃油衣癸未諭宰臣曰朕每次舍凡馬之具皆假於民間多亡失不還其主此彈壓官不職可擇人代之所過即令詢問但亡失民間什物並償其直乙酉詔給西北路人戶牛六月甲寅如金蓮川九月丙子至自金蓮川辛巳以右副都點檢夾谷清臣等為賀宋生日使右衛將軍粘割斡特剌為夏國生日使丁亥太白晝見在日前鄜州李方等謀反伏誅十月高麗國王王晧遣使謝封冊乙未臨奠故右丞相紇石烈志寧喪志寧妻永安縣主進鎧甲弓矢鷹鶻重綵壬子召皇太子及趙王永中上殿上顧謂宰臣曰京嘗圖逆今不除之恐為後患又曰天下大器歸於有德海陵失道朕乃得之但務修德餘何足慮皇太子及永中皆曰誠如聖訓遂釋之丙辰以德州防禦使文資産賜其兄之子咬住且諭其母文之罪汝等皆當連坐念宋王有大功於國故置不問仍以家産賜汝子十一月甲戌上謂宰臣曰宗室中有不任官事者若不加恩澤於親親之道有所未弘朕欲授以散官量豫廩祿未知前代何如左丞石琚曰陶唐之親九族周家之內睦九族見於詩書皆帝王美事也丙子上以曹國公主家奴犯事宛平令劉彥弼杖之主乃折辱令既深責公主又以臺臣徇勢偷安畏忌不敢言奪俸一月以陝西統軍使璋為御史大夫以戶部尚書曹望之為賀宋正旦使壬午同州民屈立等謀反伏誅戊子上屏侍臣與宰臣議事記注官亦退上曰史官記人君善惡朕之言動及與卿等所議皆當與知其於記録無或有隱可以朕意諭之十二月乙未朔以濟南尹劉草口咢在定武軍貪墨不道命大理少卿張九思鞫之丁酉詔遣官及護衛二十人分路選年二十以上四十以下有門地才行及善射者充護衛不得過百人冀州王瓊等謀反伏誅德州防禦使文以謀反伏誅辛丑出宮女二十餘人己酉樞密副使移剌成罷辛亥禁審録官以宴飲廢公務詔金銀坑冶聽民開採毋得收稅癸丑獵于近郊以殿前都點檢徒單克寧為樞密副使己未詔自今除名人子孫有在仕者並取奏裁十三年正月乙丑朔宋高麗夏遣使來賀癸酉尚書省奏南客車俊等因榷場貿易誤犯邊界罪當死上曰本非故意可免罪發還毋令彼國知之恐復治其罪詔有司嚴禁州縣坊里為民害者閏月壬子詔太子詹事曰東宮官屬尤當選用正人如行檢不修及不稱職者具以名聞辛酉太白晝見洛陽縣賊聚衆攻盧氏縣殺縣令李庭才亡入于宋三月癸巳朔萬春節宋高麗夏遣使來賀乙卯上謂宰臣曰會寧乃國家興王之地自海陵遷都永安女直人寖忘舊風朕時嘗見女直風俗迄今不忘今之燕飲音樂皆習漢風蓋以備禮也非朕心所好東宮不知女直風俗第以朕故猶尚存之恐異時一變此風非長久之計甚欲一至會寧使子孫得見舊俗庶幾習效之太子詹事劉仲誨請增東宮牧人及張設上曰東宮諸司局人自有常數張設已具尚何增益太子生於富貴易入於侈惟當導以淳儉朕自即位以來服御器物往往仍舊卿以此意諭之四月己巳定出繼子所繼財産不及本家者以所繼與本家財産通數均分制以有司言特授洺州孝子劉政太子掌飲丞乙亥上御睿思殿命歌者歌女直詞顧謂皇太子及諸王曰朕思先朝所行之事未嘗暫忘故時聽此詞亦欲令汝輩知之汝輩自幼惟習漢人風俗不知女直純實之風至於文字語言或不通曉是忘本也汝輩當體朕意至於子孫亦當遵朕教誡也辛巳更定盜宗廟祭物法五月壬辰朔日有食之戊戌禁女直人毋得譯為漢姓壬寅真定尹孟浩薨甲辰尚書省奏鄧州民范三毆殺人當死而親老無侍上曰在醜不爭謂之孝孝然後能養斯人以一朝之忿忘其身而有事親之心乎可論如法其親官與養濟六月樞密使完顏思敬薨七月庚子復以會寧府為上京庚戌罷歲課雉尾八月丁卯以判大興尹趙王永中為樞密使詔賜諸猛安謀克廉能三等官賞己卯御史大夫璋罷丙戌以左副都點檢襄等為賀宋生日使丁亥秋獵九月辛卯朔以宿直將軍胡什賚為夏國生日使辛亥還都大名府僧李智究等謀反伏誅十月乙丑歲星晝見丙子以前南京留守唐括安禮為尚書右丞十一月以大興尹璋為賀宋正旦使引進使大洞為高麗生日使上謂宰臣曰外路正五品職事多闕員何也太尉李石對曰資考少有及者上曰苟有賢能當不次用之壬子吏部尚書梁肅請禁奴婢服羅綺上曰近已禁其服明金行之以漸可也且教化之行當自貴近始朕宮中服御常自節約舊服明金者已減太半矣近民間風俗比正隆時聞稍淳儉卿等當更務從儉素使民知所效也十四年正月己丑朔宋高麗夏遣使來賀二月壬戌以大興尹璋使宋有罪杖百五十除名仍以所受禮物入官丙寅以刑部尚書梁肅等為宋詳問使庚午以太尉尚書令李石為太保致仕戊寅詔免去年被水旱百姓租稅三月戊子朔萬春節宋高麗夏遣使來賀甲午上謂大臣曰海陵純尚吏事當時宰執止以案牘為功卿等當思經濟之術不可狃于故常也又詔猛安謀克之民今後不許殺生祈祭若遇節辰及祭天日許得飲會自二月一日至八月終並禁絶飲燕亦不許赴會他所恐妨農功雖閒月亦不許痛飲犯者抵罪可遍諭之又命應衛士有不間女直語者並勒習學仍自後不得漢語辛丑太白歲星晝見甲辰上更名雍詔中外丙辰太白歲星晝見經天四月乙丑上諭宰臣曰聞愚民祈福多建佛寺雖已條禁尚多犯者宜申約束無令徒費財用戊辰有事于太廟以皇太子攝行事乙亥以勸農副使完顏蒲涅為橫賜高麗使上御垂拱殿顧謂皇太子及親王曰人之行莫大於孝弟孝弟無不蒙天日之祐汝等宜盡孝于父母友于兄弟自古兄弟之際多因妻妾離間以至相違且妻者乃外屬耳可比兄弟之親乎若妻言是聽而兄弟相違甚非理也汝等當以朕言常銘于心戊子以樞密副使徒單克寧兼大興尹五月丙戌朔詳問使梁肅等還自宋甲午如金蓮川六月己未太白晝見八月丁巳次辭里舌日中白龍見御帳東小港中須臾乘雲雷而去癸亥獵于彌離補己卯太白晝見九月丁亥還都乙未以兵部尚書完顏讓等為賀宋生日使宿直將軍崇肅為夏國生日使癸卯上退朝謂侍臣曰朕自在潛邸及踐阼以至于今於親屬舊知未嘗欺心有徇近御史臺奏樞密使永中嘗致書河南統軍使完顏仲託以賣馬朕知而不問朕之欺心此一事耳夙夜思之其如有疾己酉宋遣使報聘十月乙卯朔詔圖畫功臣二十人衍慶宮聖武殿之左右廡十一月甲申朔日有食之丙申御史中丞劉仲誨等為賀宋正旦使戊戌召尚食局使諭之曰太官之食皆民脂膏日者品味太多不可遍舉徒為虛費自今止進可口者數品而已戊申以儀鸞局使曹士元為高麗國生日使十二月戊寅以平章政事完顏守道為右丞相樞密副使徒單克寧為平章政事十五年正月此下闕七月丙午粘拔恩與所部康里孛古等內附九月戊子至自金蓮川辛卯高麗西京留守趙位寵叛其君請以慈悲嶺以西鴨淥江以東四十餘城內附不納丙申幸新宮閏月己酉朔定應禁弓箭槍刀路分品官家奴客旅等許帶弓箭制上謂左丞相良弼曰今之在官者須職位稱愜所望然後始加勉力其或稍不如意則止以度日為務是豈忠臣之道耶丁巳又謂良弼曰海陵時領省秉德左丞相言皆有能名然為政不務遠圖止以苛刻為事言及可喜等在會寧時一月之間杖而殺之者二十人罪皆不至於死於理可乎海陵為人如虎此輩尚欲以術數要之以至賣直取死得為能乎己未以歸德尹完顏王祥等為賀宋生日使符寶郎斜卯和尚為夏國生日使辛酉高麗國王奏告趙位寵伏誅詔慰答之詔親王百官傔人所服紅紫改為黑紫甲戌詔年老之人毋注縣令年老而任從政其佐亦擇壯者參用十月乙未冬獵丁未還都十一月乙卯上幸東宮初唐古部族節度使移剌毛得之子殺其妻而逃上命捕之至是皇姑梁國公主請赦之上謂宰臣曰公主婦人不識典法罪尚可恕毛得請託至此豈可貸宥不許戊午以右宣徽使靖等為賀宋正旦使甲子太白晝見戊辰以宿直將軍阿典蒲魯虎為高麗生日使十六年正月戊申朔宋高麗夏遣使來賀甲寅詔免去年被水旱路分租稅甲子詔宗屬未附玉牒者並與編次丙寅上與親王宰執從官從容論古今興廢事曰經籍之興其來久矣垂教後世無不盡善今之學者既能誦之必須行之然知而不能行者多矣苟不能行誦之何益女直舊風最為純直雖不知書然其祭天地敬親戚尊耆老接賓客信朋友禮意款曲皆出自然其善與古書所載無異汝輩當習學之舊風不可忘也戊辰宮中火庚午上按鷹高橋見道側醉人墮驢而臥命左右扶而乘之送至其家辛未皇姑邀上至私第諸妃皆從宴飲甚歡公主每進酒上立飲之二月庚寅皇子豳王妃徒單氏以姦伏誅己亥平章政事徒單克寧罷以女故三月丙午朔日有食之是日萬春節改用明日宋高麗夏遣使來賀戊申雨豆於臨潢之境戊午上御廣仁殿皇太子親王皆侍膳上從容訓之曰大凡資用當務節省如其有餘可周親戚勿妄費也因舉所御服曰此服已三年未嘗更換尚爾完好汝等宜識之壬申復置吾都碗部禿里四月丙戌詔京府設學養士及定宗室宰相子程試等第戊子制商賈舟車不得用馬以東京留守崇尹為樞密副使壬寅如金蓮川五月戊申南京宮殿火甲寅太白晝見庚申遣使禱雨靜寧山神有頃而雨六月山東兩路蝗七月壬子夏津縣令移剌山住坐贓伏誅八月辛巳次霹靂濼九月乙巳至自金蓮川己酉諭左丞相紇石烈良弼曰西邊自來不備儲蓄其令所在和糴以為緩急之備癸丑以殿前都點檢蒲察通等為賀宋生日使宿直將軍完顏覿古速為夏國生日使諭左丞相良弼曰海陵非理殺戮臣下甚可哀憫其孛論出等遺骸仰逐處訪求官為收葬辛酉以南京宮殿火留守轉運兩司官皆抵罪十月丙申詔諭宰執曰諸王小字未嘗以女直語命之今皆當更易卿等擇名以上十一月壬寅朔參知政事王蔚罷尚書省奏河北東路胡剌溫猛安所轄謀克孛术魯舍厮以謀克讓其兄子蒲速列上賢而從之仍令議加舍廝恩賞戊午以同知宣徽院事劉珫等為賀宋正旦使庚申以吏部尚書張汝弼為參知政事甲子以粘割韓奴之子詳古為尚輦局直長婁室為武器直長初韓奴被旨招契丹大石後不知所終至是因粘拔恩部長撒里雅寅特斯等來詢知其死節之詳故録其後遣兵部郎中移剌子元為高麗國生日使十二月壬申朔詔諸科人出身四十年方注縣令年歲太遠今後仕及三十二年別無負犯贓染追奪便與縣令丙子詔諸流移人老病者官與養濟上諭宰臣曰凡已經奏斷事有未當卿等勿謂已行不為奏聞改正朕以萬幾之繁豈無一失卿等但言之朕當更改必無吝也庚寅定榷場香茶罪賞法十七年正月壬寅朔宋高麗夏遣使來賀高麗並表謝不納趙位寵丙午有司奏高麗所進玉帶乃石似玉者上曰小國無能辨識者誤以為玉耳且人不易物惟德其物若復却之豈禮體耶戊申詔於衍慶宮聖武殿西建世祖神御殿東建太宗睿宗神御殿詔西北路招討司契丹民戶其嘗叛亂者已行措置其不與叛亂及放良奴隸可徙烏古里石壘部令及春耕作尚書省奏吾都碗部體土胡魯雅里密斯請入獻許之庚戌詔諸大臣家應請功臣號者既不許其子孫自陳吏部考功郎其詳考其勞績當賜號者即以聞壬子上謂宰臣曰宗室中年高者往往未有官稱其先皆有功於國朕欲稍加以官使有名位可稱如何對曰親親報功先王之令則丁巳詔朝官嫁娶給假三日不須申告壬戌詔宰臣海陵時大臣無辜被戮家屬籍沒者並釋為良遼豫王宋天水郡王被害子孫各葬於廣寧河南舊塋其後復詔天水郡王親屬於都北安葬外咸平所寄骨殖官為葬於本處遼豫王親屬未入本塋者亦遷祔之三月辛丑朔宋高麗夏遣使來賀辛亥詔免河北山東陝西河東西京遼東等十路去年被旱蝗租稅賑東京婆速曷速館三路乙丑尚書省奏三路之粟不能周給上曰朕嘗語卿等遇豐年即廣糴以備凶歉卿等皆言天下倉廩盈溢今欲賑濟乃云不給自古帝王皆以蓄積為國家長計朕之積粟豈欲獨用之耶今既不給可於鄰道取之以濟自今預備當以為常四月甲戌制世襲猛安謀克若出仕者雖年未及六十欲令子孫襲者聽戊寅諭宰臣曰郡縣之官雖以罪解一二歲後亦須再用猛安謀克皆太祖創業之際於國勤勞有功之人其世襲之官不宜以小罪奪免戊子以滕王府長史徒單烏者為橫賜高麗使五月尚書省奏定皇家袒免以上親燕饗班次並從唐制癸卯幸姚村淀閲七品以下官及宗室子諸局承應人射柳賞有差六月己卯謂宰臣曰朕年老矣恐因一時喜怒處置有所不當卿等即當執奏毋為面從成朕之失乙未以英王爽之子思列為忠順軍節度副使爽入謝上曰朕以卿疾故特任卿子所冀卿因喜而愈也欲即加峻授恐思列年幼未間政事汝當訓之使有善可更當升擢七月壬子尚書省奏歲以羊三萬賜西北路戍兵上問如何運致宰臣不能對上曰朕雖退朝留心政務不遑安寧卿等勿謂細事非帝王所宜問以卿等於國家之事未嘗用心故問之耳是月大雨河決八月己巳觀稼于近郊壬申以監察御史體察東北路官吏輒受訟牒為不稱職笞之五十庚辰上謂宰臣曰今之在官者同僚所見事雖當理必以為非意謂從之則恐人謂政非己出如此者多朕甚不取今觀大理寺所斷雖制有正條理不能行者別具情見朕惟取其所長夫為人之理他人之善者從之則可謂善矣壬午上謂宰臣曰今在下僚豈無人材但在上者不為汲引惡其材勝己故耳丙戌上謂御史中丞紇石烈邈曰臺臣糾察吏治之能否務去其擾民且冀其得賢也今所至輒受訟牒聽其妄告使為政者如何則可也九月丁酉朔日有食之辛丑封子永德為薛王以右副都點檢完顏習尼烈等為賀宋生日使癸卯以兵部郎中石抹忽土為夏國生日使戊申秋獵庚戌歲星熒惑太白聚於尾甲子還都十月己巳夏國進百頭帳詔却之境上癸酉有司奏衍慶宮所畫功臣二十人惟五人有諡今考檢餘十五人功狀擬定諡號以進詔可詔以羊十萬付烏古里石壘部畜牧其滋息以豫貧民丁丑制諸猛安父任別職子須年二十五以上方許承襲辛巳上謂宰臣曰今在位不聞薦賢何也昔狄仁傑起自下僚力扶唐祚使既危而安延數百年之永仁傑雖賢非婁師德何以自薦乎癸未更護送罪人逃亡制上謂宰臣曰近觀上封章者殊無大利害且古之諫者既忠於國亦以求名今之諫者為利而已如戶部尚書曹望之濟南尹梁肅皆上書言事蓋覬覦執政耳其於國政竟何所補達官如此況餘人乎昔海陵南伐太醫使祁宰極諫至戮於市此本朝以來一人而已丁亥上命宰臣曰監察御史田忠孺嘗上書言事今當升擢以勵其餘十一月戊戌以南京留守徒單克寧為平章政事庚戌上謂宰臣曰朕常恐重斂以困吾民自今諸路差科之煩細者亦具以聞有司奏夏國進御帳使因邊臣懇求進入乃許之以尚書左丞石琚為平章政事丙辰以延安尹完顏蒲剌睹等為賀宋正旦使十二月戊辰以渤海舊俗男女婚娶多不以禮必先攘竊以奔詔禁絶之犯者以姦論以宿直將軍僕散懷忠為高麗生日使己巳太白晝見壬申以尚書右丞唐括安禮為左丞殿前都點檢蒲察通為右丞上謂宰執曰朕今年已五十有五若年踰六十雖欲有為而莫之能矣宜及朕之康強其女直人猛安謀克及國家政事之未完與夫法令之未一者宜皆修舉之凡所施行朕不為怠十八年正月丙申朔宋高麗夏遣使來賀壬寅定殺異居周親奴婢同居卑幼輒殺奴婢及妻無罪而輒毆殺者罪庚戌修起居注移剌傑上書言每屏人議事雖史官亦不與聞無由紀録上以問平章政事石琚左丞唐括安禮對曰古者天子置史官於左右言動必書所以警戒人君庶幾有所畏也庚申免中都河北河東山東河南陝西等路前年被災租稅壬戌如春水二月丙寅朔次管莊丙子次華港己丑還宮三月乙未朔萬春節宋高麗夏遣使來賀乙巳命戍邊女直人遇祭祀婚嫁節辰許自造酒丁未上謂宰執曰縣令之職最為親民當得賢材用之邇來犯法者衆殊不聞有能者比在春水見石城玉田兩縣令皆年老苟祿而已畿甸尚爾遠縣可知平章政事石琚對曰良鄉令焦旭慶都令李伯達皆能吏可任上曰審如卿言可擢用之己酉禁民閒無得創興寺觀獻州人殷小二等謀反伏誅四月己巳上謂宰臣曰朕巡幸所至必令體訪官吏臧否向玉田知主簿石抹杳乃能吏也可授本縣令己丑以太子左贊善阿不罕德甫為橫賜夏國使五月丙午上如金蓮川六月庚午尚書左丞相紇石烈良弼薨閏月辛丑命賑西南西北兩招討司民及烏古里石壘部轉戶饑七月丙子上謂宰臣曰職官始犯贓罪容有過誤至於再犯是無改過之心自今再犯不以贓數多寡並除名八月乙巳至自金蓮川丙辰以尚書右丞相完顏守道為左丞相平章政事石琚為右丞相九月辛未以大理卿張九思等為賀宋生日使侍御史完顏蒲魯虎為夏國生日使癸酉以尚書左丞唐括安禮為平章政事乙亥以右丞蒲察通為左丞參知政事移剌道為右丞刑部尚書粘割斡特剌為參知政事十月庚寅朔陝州防禦使石抹靳家奴以罪除名甲午御史中丞劉仲誨侍御史李瑜坐失糾察大長公主事各削官一階十一月庚申朔尚書省奏擬同知永寧軍節度使事阿可為刺史上曰阿可年幼於事未練授佐二官可也平章政事唐括安禮奏曰臣等以阿可宗室故擬是職上曰郡守係千里休戚安可不擇人而私其親耶若以親親之恩賜與雖厚無害於政使之治郡而非其才一境何賴焉壬申以靜難軍節度使烏延查剌等為賀宋正旦使丙子尚書省奏崇信縣令石安節買車材於部民三日不償其直當削官一階解職上因言凡在官者但當取其貪污與清白之尤者數人黜陟之則人自知懲勸矣夫朝廷之政太寬則人不知懼太猛則小玷亦將不免於罪惟當用中典耳戊寅上責宰臣曰近問趙承元何故再任卿等言曹王嘗遣人言其才能幹敏故再任之官爵擬注雖由卿輩豫奪之權當出于朕曹王之言尚從之假皇太子有所諭則其從可知矣此事因卿言始知其不知者知復幾何且卿等公受請屬可乎蓋承元前為曹王府文學與王邸婢姦杖百五十除名而復用也丙戌以吏部尚書烏古論元忠為御史大夫以東上閣門使左光慶為高麗生日使十二月庚戌封孫吾都補溫國公麻達葛金源郡王承慶道國公壬子羣臣奉上大金受命萬世之寶十九年正月庚申朔宋高麗夏遣使來賀丁卯如春水二月己酉還宮乙卯免去年被水旱民田租稅三月己未朔萬春節宋高麗夏遣使來賀乙丑尚書省奏虧課院務官顏葵等六十八人各合削官一階上曰以承廕人主榷沽此遼法也法弊則當更張唐宋法有可行者則行之己巳上與宰臣論史事且曰朕觀前史多溢美大抵史書載事貴實不必浮辭諂諛也辛未上謂宰臣曰姦邪之臣欲有規求往往私其黨與不肯明言託以他事陽不與而陰為之力朕觀古之姦人當國家建儲之時恐其聰明不利於己往往風以陰事破壞其議惟擇昏懦者立之冀他日可弄權為功利也如晉武欲立其弟而姦臣沮之竟立惠帝以致喪亂此明驗也丁丑上謂宰臣曰朕觀前代人臣將諫於朝與父母妻子訣示以必死同列目覩其死亦不顧身又為之諫此盡忠於國者人所難能也己卯制糾彈之官知有犯法而不舉者減犯人罪一等科之關親者許回避上謂宰臣曰人多奉釋老意欲徼福朕蚤年亦頗惑之旋悟其非且上天立君使之治民若盤樂怠忽欲以僥幸祈福難矣果能愛養下民上當天心福必報之四月己丑朔詔賑西南路招討司所部民己酉以升祔閔宗詔中外丁巳歲星晝見五月戊寅幸太寧宮六月戊子朔詔更定制條七月辛未有司奏擬趙王子石古乃人從上不從謂宰相曰兒輩尚幼若奉承太過使侈心滋大卒難節抑此不可長諸兒每入侍當其語笑娛樂之際朕必淵默涖之以嚴庶其知朕教戒之意使常畏慎而寡過也癸酉密州民許通等謀反伏誅丙子太白晝見庚辰至自太寧宮八月壬辰尚書右丞相石琚致仕戊戌以宋大觀錢當五用丙午濟南民劉溪忠謀反伏誅九月戊午以左宣徽使蒲察鼎壽等為賀宋生日使太子左衛率府率裴滿胡剌為夏國生日使癸亥秋獵癸未還都十月辛卯西南路招討使哲典以贓罪伏誅辛亥制知情服內成親者雖自首仍依律坐之十一月壬戌改葬昭德皇后大赦以御史中丞移剌慥等為賀宋正旦使戊辰以西上閣門使盧拱為高麗生日使壬申上如河間冬獵癸未至自河間二十年正月甲寅朔宋高麗夏遣使來賀戊午定試令史格壬戌命歲以錢五千貫造隨朝百官節酒及冰燭藥炭視品秩給之己巳如春水丙子幸石城縣行宮丁丑以玉田縣行宮之地偏林為御林大淀濼為長春淀二月丁未還都三月癸丑朔萬春節宋高麗夏遣使來賀己未詔凡犯罪被問之官雖遇赦不得復職乙丑以新定猛安謀克詔免中都西京河北山東河東陝西路去年租稅辛巳以平章政事徒單克寧為尚書右丞相御史大夫烏古論元忠為平章政事四月丁亥定冒廕罪賞己亥制宗室及外戚並一品命婦衣服聽用明金以西上閣門使郭喜國為橫賜高麗使太寧宮火乙巳上謂宰臣曰女直官多謂朕食用太儉朕謂不然夫一食多費豈為美事況朕年高不欲屠宰物命貴為天子能自節約亦不惡也朕服御或舊常使浣濯至于破碎方始更易向時帳幕常用塗金為飾今則不爾但令足用何必事紛華也庚戌如金蓮川五月丙寅京師地震生黑白毛七月旱八月壬午秋獵九月壬戌至自金蓮川以太府監李佾等為賀宋生日使少府少監賽補為夏國生日使丙子蒲速碗羣牧老忽謀叛伏誅十月庚辰朔更定銓注縣令丞簿格詔西北路招討司每進馬駝鷹鶻等輒率斂部內自令並罷之壬午上謂宰臣曰察問細微非人君之體朕亦知之然以卿等殊不用心故時或察問如山後之地皆為親王公主權勢之家所占轉租於民皆由卿等之不察卿等當盡心勤事毋令朕之煩勞也詔徙遙落河移馬河兩猛安於大名東平等路安置戊戌上謂宰臣曰凡人在下位欲冀升進勉為公廉賢不肖何以知之及其通顯觀其施為方見本心如招討哲典初任定州同知繼為都司未嘗少有私徇所至皆有清名及為招討不固守人心險于山川誠難知也壬寅上謂宰臣曰近覽資治通鑑編次纍代廢興甚有鑒戒司馬光用心如此古之良史無以加也校書郎毛麾朕屢問以事善於應對真該博老儒可除太常職事以備討論甲辰以殿前都點檢襄為御史大夫十一月丁巳尚書右丞移剌道罷乙丑以真定尹徒單守素等為賀宋正旦使癸酉以御史大夫襄為尚書右丞乙亥上諭宰臣曰郡守選人資考雖未及廉能者則升用之以勵其餘以太常少卿任倜為高麗生日使十二月辛巳上謂宰臣曰岐國用人但一言合意便升用之一言之失便責罰之凡人言辭一得一失賢者不免自古用人咸試以事若止以奏對之間安能知人賢否朕之取人衆所與者用之不以獨見為是也己亥河決衛州辛丑獵于近郊癸卯特授襲封衍聖公孔總兗州曲阜令封爵如故
