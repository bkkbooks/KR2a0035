body:
  text: 金史卷一百十一列傳第四十九古里甲石倫內族訛可撒合輦強伸烏林答胡土內族思烈紇石烈牙吾塔古里甲石倫隆安人以武舉登第為人剛悍頗自用所在與人不合宣宗以其勇善戰每任用之貞祐二年纍遷副提控太原府判官與從宜都提控振武軍節度使完顏蒲剌都議拒守不合措置乖方敵因大入幾不可禦既乃交章論列以自辨其無罪上惡其不和詔分統其兵未幾遷同知太原府事奏請招集義軍設置長校各立等差都統授正七品職副統正八品萬戶正九品千戶正班任使謀克雜班仍三十人為一謀克五謀克為一千戶四千戶為一萬戶四萬戶為一副統兩副統為一都統外設一總領提控制可四年遷河東宣撫副使上章言宣撫使烏古論禮不肯分兵禦敵且所行多不法詔禮罷職石倫遷絳陽軍節度使權經略使尋知延安府事兼鄜延路兵馬都總管大元兵圍欣州石倫率兵往援以兵護其民入太原所保軍民甚衆興定元年七月改河平軍節度兼衛州管內察使詔諭曰朕初謂汝勇果為國盡力故倚以濟事尋聞汝嗜酒不法而太原知府烏古論德升亦屢嘗為朕言之然皆瑣屑乃若不救汾州豈細事哉有司議罪如此汝其悉之益當戮力以掩前過是年十一月遷鎮西軍節度使兼嵐州管內觀察使行元帥府事二年四月石倫言去歲北兵破太原游兵時入嵐州境而官民將士悉力扞禦卒能保守無虞向者河東內郡皆駐以精甲實以資儲視邊城尤為完富然兵一至相繼淪沒嵐兵寡而食不足惟其上下協同表𩹉相應遂獲安帖當大軍初入郡縣倉皇非此帥府控制則隩管保德岢嵐寧化皆不可知矣今防秋不遠乞朝廷量加旌賞務令益盡心力易以鎮守詔有功者各遷官一級仍給降空名宣敕令樞密院遣授之三年二月石倫奏向者並汾既破兵入內地臣謂必攻平陽平陽不守將及潞州其還當由龍州谷以入太原故臣嘗請兵欲扼其歸路朝廷不以為然既而皆如臣所料始敵入河東時郡縣民皆老幼徙居山險後雖太原失守而衆卒不從其意謂敵不久留且望官軍復至也今敵居半歲遣步騎擾諸保聚而官軍竟無至者民其能久抗乎夫太原河東之要郡平陽陝西河南之藩籬也若敵兵久不去居民盡從屯兵積糧以固基本而復擾吾郡縣未殘者則邊城指日皆下矣北路不守則南路為邊去陝西河南益近臣竊憂之故復請兵以圖戰守而樞府檄臣並將權太原治中郭遹祖義軍李天祿等萬餘人就其糧五千石會汾州權元帥右都監抹撚胡剌復太原臣召遹祖欲號令其衆遹祖不從尋得胡剌報曰嘗問軍數於遹祖但稱天祿等言之未嘗親閲問糧則曰散在數處蓋其情本欲視朝廷以己有兵糧冀或見用以取重職不可指為實用也雖然臣已遣提控石盞吾里欣等領軍以往矣但敵勢頗重而往者皆新集白徒絶無精鋭恐不能勝乞於河南陝西量分精兵以增臣力仍令陝西州郡近河東者給之資糧更令南路諸軍綴敵之南以分其勢如此庶幾太原可復也詔陝西河東行省分糧與之請兵之事以方伐宋不從三月石倫復上言曰頃者大兵破太原招民耕稼為久駐之基臣以太原要鎮所當必爭遣提控石盞吾里欣引官兵義兵共圖收復又以軍士有功者宜速賞之故擬令吾里欣得注授九品之職以是請于朝而執政以為賞功罰罪皆須中覆夫河東去京師甚遠移報往返不暇數十日官軍皆敗亡之餘鋒鋭略盡而義兵亦不習行陳無異烏合以重賞誘之猶恐不為用況有功而久不見報乎夫衆不可用則不能退敵敵不退則太原不可復太原不可復則平陽之勢日危而境土日蹙矣今朝廷抑而不許不過慮其濫賞耳借使有濫賞之弊其與失太原之害孰重於是詔從其請自太原治中及他州七品以下職四品以下散官並聽石倫遷調焉是月石倫復言日者遣軍潛搗敵壘欲分石州兵五百權屯方山剿殺土寇且備嵐州而同知蒲察桓端拒而不發又召同知寧邊軍節度使姚里鴉鶻與之議兵竟不聽命近領兵將取太原委石州刺史納合萬家權行六部而辭以他故幾誤軍糧約武州刺史郭憲率所領並進憲亦不至臣猥當方面之任而所統官屬並不稟從乞朝廷嚴為懲誡庶人知職分易以責辦宰臣惡之乃奏曰桓端鴉鶻已經奏改無復可議石倫身兼行部不自規畫而使萬家往來應給石州無人恐亦有失武州邊郡正當兵衝使憲率軍離城敵或乘之孰與守禦萬家等不從未為過也上以為然因遣諭石倫曰卿嘗行院于歸德衛州防備之事非不素知乃屢以步騎為請何耶比授卿三品且數免罪譴卿嘗自誓以死報國今所為如此豈報國之道哉意謂河南之衆必不可分但圖他日得以藉口耳卿果赤心為國盡力經畫亦足自效萬家等若必懲戒彼中誰復可使者姑為容忍可也閏三月石倫駐兵太原之西矣諸道兵至進戰聞脅從人頗有革心上言于朝乞降空名宜敕金銀符許便宜遷注以招誘之上從其請並給付之仍聽注五品以下官職六月保德州振威軍萬戶王章弩軍萬戶齊鎮殺其刺史孛术魯銀术哥仍滅其家脅官吏軍民同狀白嵐州帥府言銀术哥專恣慘酷私造甲仗將謀不軌石倫密令同知州事把蒲剌都圖之蒲剌都乃與兵吏置酒召章等飲擒而族誅之至是朝廷命行省胥鼎量宜遷賞仍令蒲剌都攝州事撫安其衆焉六月遷金安軍節度使行帥府事於葭州時鄜州元帥內族承立慮夏人入寇遣納合買住以兵駐葭州石倫輒分留買住兵千八百人令以餘兵屯綏德而後奏之有司論罪當絞既而遇赦乃止除名元光元年起為鄭州同知防禦使與防禦使裴滿羊哥部內酤酒不償直皆除名三月上諭元帥監軍內族訛可曰石倫今以罪廢欲再起之恐生物議汝軍前得無用之乎此人頗善戰果可用便當遣去古亦有白衣領職者渠雖除名何害也十月大元兵圍青龍堡詔以石倫權左都監將兵會上黨公晉陽公往援之兵次彈平寨東三十里敵兵梗道不得進會青龍堡破召還既而復以罪免正大八年大兵入河南州郡無不下者朝議以權昌武軍節度使粘葛同周不知兵事起石倫代之石倫初赴昌武詔諭曰卿先朝宿將甚有威望故起拜是職元帥蘇椿武監軍皆曉兵事今在昌武宜與同議勿復不睦失計也時北兵已至許石倫赴鎮幾為游騎所獲數日知兩省軍敗潰軍踵來有忠孝軍完顏副統入城兩手皆折血污滿身州人憂怖不知所出石倫遣歸順軍提控嵐州人高圭往斥候圭因持在州軍馬糧草數目奔大元軍仍告以城池深淺俄大兵至城下以鳳翔府韓壽孫持檄招降言三峰敗狀石倫蘇椿不詰問即斬之市中既而武監軍偏裨何魏輩開東門內族按春開南門夾谷太守開西門大元軍入城擒蘇椿問以大名南奔之事椿曰我本金朝人無力故降我歸國得為大官何謂反耶大將怒其不屈即殺之石倫投廨後井中同周自縊州廨武監軍者初不預開門之謀何魏輩欲保全之故言於大將曰監軍令我輩獻門然亦怒其不迎軍而降亦殺之同周名暉字子陽策論進士興定間為徐州行樞密院參議官上章言惟名與器不可假人自古帝王靡不為重今之金銀牌即古符節也其上有太祖御畫往年得佩者甚難兵興以來授豫頗濫市井道路黃白相望恐非所以示信於下也乞寶惜之有所甄別上以語宰臣而丞相高琪等奏時方多難急於用人駕馭之方此其一也如故為便蘇椿大名人初守大名歸順于大元正大二年九月自大名奔汴詔置許州至是見殺完顏訛可內族也時有兩訛可皆護衛出身一曰草火訛可每得賊好以草火燎之一曰板子訛可嘗誤以宮中牙牌報班齊者為板子故時人各以是目之正大八年九月大兵攻河中初宣宗議遷都朝臣謂可遷河中河中背負關陝五路士馬全盛南阻大河可建行臺以為右翼前有絳陽平陽太原三大鎮敵兵不敢輕入應三鎮郡縣之民皆聚之山寨敵至則為晝攻夜草疏之計屯重軍中條則行在有萬全之固矣主議者以河中在河朔又無宮室不及汴梁議遂寢宣宗既遷河南三二年之後詔元帥都監內族阿祿帶行帥府事阿祿帶恇怯不能軍竭民膏血為浚築之計未幾絳州破阿祿帶益懼馳奏河中孤城不可守有旨親視果不可守則棄之無至資敵阿祿帶遂棄河中燒民戶官府一二日而盡尋有言河中重鎮國家基本所在棄之為失策設為敵人所據則大河之險我不得專恃矣宣宗悔悟繫阿祿帶同州獄纍命完復之隨守隨破至是以內族兩訛可將兵三萬守之大兵謀取宋武休關未幾鳳翔破睿宗分騎兵三萬入散關攻破鳳州徑過華陽屠洋州攻武休關開生山截焦崖出武休東南遂圍興元興元軍民散走死於沙窩者數十萬分軍而西西軍由別路入沔州取大安軍路開魚鱉山撤屋為筏渡嘉陵江入關堡並江趨葭萌略地至西水縣而還東軍止屯興元洋州之間遂趨饒峰宋人棄關不守大兵乃得入初大兵期以明年正月合南北軍攻汴梁故自將攻河中河中告急合打蒲阿遣王敢率步兵一萬救之十二月河中破初河中主將知大兵將至懼軍力不足截故城之半守之及被攻行帳命築松樓高二百尺下瞰城中土山地穴百道並進至十一月攻愈急自王敢救軍至軍士殊死鬬日夜不休西北樓櫓俱盡白戰又半月力盡乃陷草訛可戰數十合始被擒尋殺之板訛可提敗卒三千奪船走北兵追及鼓噪北岸上矢石如雨數里之外有戰船橫截之敗軍不得過船中有仭火炮名震天雷者連發之炮火明見北船軍無幾人力斫橫船開得至潼關遂入閿鄉尋有詔赦將佐以下責訛可以不能死車載入陝州決杖二百識者以為河中城守不下德順力竭而陷非戰之罪故訛可之死人有寃之者初訛可以元帥右監軍邠涇總帥權參知政事奉旨於邠涇鳳翔往來防秋奉御六兒監戰於訛可為孫行而訛可動為所制意頗不平漸生猜隙七年九月召赴京師改河中總帥受京兆節制此時六兒同赴召謂訛可奉旨往來防秋而乃畏怯避遠正與朝旨相違上意頗罪訛可及河中陷苦戰力盡而北兵百倍臨之人謂雖至不守猶可以自贖竟杖而死蓋六兒先入之言主之也劉祁曰金人南渡之後近侍之權尤重蓋宣宗喜用其人以為耳目伺察百官故奉御輩採訪民間號行路御史或得一二事即入奏之上因以責臺官漏泄皆抵罪又方面之柄雖委將帥又差一奉御在軍中號曰監戰每臨機制變多為所牽制遇敵輒先奔故師多喪敗哀宗因之不改終至亡國論曰古里甲石倫善戰而好犯法故見廢者屢晚起為將卒死於難金運將終又用數奇之李廣其乏絶不亦宜乎草訛可力戰而死板訛可亦力戰不死於陳而死於刑論者以為有近侍先入之言夫以御治軍既掣之肘又信其讒以殺人金失政刑矣唐之亡坐以近侍監軍金蹈其轍哀哉撒合輦字安之內族也宣宗朝纍遷同簽樞密院事元光二年十二月庚寅夜宣宗病篤英王盤都先入侍哀宗後至東華門已閉聞英王在宮遣樞密院官及東宮親衛軍總領移剌蒲阿勒兵東華門都點檢駙馬都尉徒單合住奏中宮得旨領符鑰啓門合住見上上命撒合輦解合住刀佩之哀宗遂入明日即位由是見親信正大元年正月庚申以輦同判大睦親府事兼前職刑部完顏素蘭言把胡魯策功第一非超拜右丞相無以酬之然同功數人亦有不次之望故胡魯之命中輟輦猶升二品云四年大元既滅西夏進軍陝西四月丙申召尚書溫迪罕壽孫中丞烏古孫卜吉祭酒裴滿阿虎帶直學士蒲察世達右司諫陳規監察烏古論四和完顏習顯同判睦親府事撒合輦同議西事上曰已諭合達盡力決一戰矣羣臣多主和事獨輦力破和議語在陳規傳八月朝廷得清水之報令有司罷防城及修城丁壯凡軍需租調不急者權停初聞大兵自鳳翔入京兆關中大震以中丞卜吉祭酒阿忽帶兼司農卿簽民兵督秋稅令民入保為避遷計當時議者以謂大兵未至而河南先亂且曰御史監察城洛陽治書供帳北使中丞下兼司農簽軍督稅臺政可知矣至是上謂撒合輦曰諺云水深見長人朝臣或欲我一戰汝獨言當靜以待之與朕意合今日有太平之望皆汝謀也先帝嘗言汝可用可謂知人矣未幾右拾遺李大節右司諫陳規言撒合輦諂佞納賄及不公事奏帖留中不報明惠皇后嘗傳旨戒曰汝諂事上上之騎鞠皆汝所教尉欣亦極言之上頗悟出為中京留守兼行樞密院事初宣宗改河南府為金昌府號中京又擬少室山頂為御營命移剌粘合築之至是撒合輦為留守九年正月北兵從河清徑渡分兵至洛出沒四十餘日二月乙亥立炮攻城洛中初無軍得三峰潰卒三四千人與忠孝軍百餘守禦時輦疽發于背不能軍同知溫迪罕斡𩽆羅主軍務有大事則就輦稟之三月甲申忠孝軍百餘騎入使宅強擁輦出奔輦不得已從之並以官屬及其子自隨才出南𩹉城門城上軍覺閉之甕城中矢石亂下人馬多死傷輦知不能出仰呼求救軍士知出奔非輦意以繩引而上送入其宅不敢出鎮撫官縛出奔之黨欲殺之已斬三人輦親為乞命得免乙酉斡𩽆羅仭金帛出北門如前日巡城犒軍之狀既出即沿城而西直出外壕城上人呼曰同知講和去矣軍士及將領隨而下者三四百人少之輦傳令云同知叛降有再下城者斬凡斬三四人乃定丙戌夜城東北角破輦奪南門出不得投濠水死已而大兵退強伸復立帥府強伸本河中射糧軍子弟貌極寢陋而膂力過人興定初從華州副都統安寧復潼關以勞任使嘗監郃陽醋後客洛下選充官軍戍陝鐵嶺軍潰被虜從都尉兀林答胡土竄歸中京時中京已破留守兼行樞密院使內族撒合輦死之元帥任守真復立府事以便宜署伸警巡使後守真率部曲軍從行省思烈入援鄭州之敗守真死天興元年八月中京人推伸為府簽事領所有軍二千五百人傷殘老幼半之甫三日北兵圍之東西北三面多樹大炮伸括衣帛為幟立之城上率士卒赤身而戰以壯士五十人往來救應大叫以憨子軍為號其聲勢與萬衆無異兵器已盡以錢為鏃得大兵一箭截而為四以筒鞭發之又創遏炮用不過數人能發大石於百步外所擊無不中伸奔走四應所至必捷得二及所乘馬皆殺之以犒軍士人不過一啖而得者如百金之賜九月大兵退百里外閏月復攻兵數倍於前又一月不能拔事聞哀宗降詔褒諭以伸為中京留守元帥左都監世襲謀克行元帥府事十月參知政事內族思烈自南山領軍民十餘萬入洛行省事二年二月伸建一堂於洛川驛之東名曰報恩刻詔文於石願以死自效三月中使至以伸便宜從事是月大兵自汴驅思烈之子於東門下誘思烈降思烈即命左右射之既而知崔立之變病不能語而死總帥忽林答胡土代行省事伸行總帥府事月餘糧盡軍民稍稍散去五月大兵復來陳於洛南伸陳水北有韓帥者匹馬立水濱招伸降伸謂帥曰君獨非我家臣子耶一日勤王猶遺令名于世君既不能乃欲誘我降耶我本一軍卒今貴為留守誓以死報國耳遂躍而射之帥奔陳率步卒數百奪橋伸軍一旗手獨出拒之殺數人伸乃手解都統銀符與之佩士卒氣復振初築戰壘於城外四隅至五門內外皆有屏謂之迷魂牆大兵以五百騎迫之伸率卒二百鼓噪而出大兵退六月行省胡土率衆走南山鷹揚都尉獻西門以降伸知城不能守率死士數十人突東門出轉戰至偃師力盡就執載以一馬擁迫而行伸宛轉不肯進強掖之將見大帥塔察及中京七里河伸語不遜兵卒相謂曰此人乖角如此若見大帥其能降乎不若殺之因好語誘之曰汝能北面一屈膝吾貸汝命伸不從左右力持使北面伸拗頭南向遂殺之烏林答胡土正大九年正月戊子北兵以河中一軍由洛陽東四十里白坡渡河白坡故河清縣河有石底歲旱水不能尋丈國初以三千騎由此路趨汴是後縣廢為鎮宣宗南遷河防上下千里常以此路為憂每冬日命洛陽一軍戍之河中破有言此路可徒涉者已而果然北兵既渡奪河陰官舟以濟諸軍時胡土為破虜都尉戍潼關以去冬十二月被旨入援至偃師聞白坡徑渡之耗直趨少室夜至少林寺時登封縣官民已遷太平頂御寨明日胡土使人紿縣官云吾軍中家屬輜重欲留此山即率兵赴汴京因攝縣官下山使之前導一軍隨之而上山既險固糧亦充足遂有久住之意尋縱軍下山劫掠居民甚於盜賊旁近一二百里無不被害胡土畏變知而不禁又所劫牛畜糧糗亦分有之七月恆山公武仙參政思烈兩行省軍屯登封城南大林下遣人約之入京胡土百計不肯下不得已乃分其軍四千與思烈俱東八月三日兩行省軍潰於中牟胡土狼狽上山殘卒三二十人外偏裨無一人至者十二月思烈自留山行省於中京徵兵同保洛陽又遷延不行思烈以檄來言若依前逗遛自有典憲吾不汝容矣胡土懼乃挈妻子及軍往中京留其半山上以為巢穴天興二年三月思烈病卒留語胡土代行省事六月敵勢益重強伸方盡力戰禦而胡土即領輕騎挈妻子棄城南奔遂失中京初胡土在太平頂既顧望不進又懼人議己乃出榜募人為救駕軍云一旅之衆可以興復國家諸人有能奮發許國捐軀者豈不濟大事乎於是不逞之徒隨募而出得澤人緝麻觜武録事等二十餘人促令赴京行及盧店即行劫械至杖之二百人無不竊笑既而走蔡州上召見慰問而心薄之會宋人攻唐州兀帥烏古論黑漢屢遣人告急即命胡土領忠孝軍百人就徵西山招撫烏古論換住黃八兒等軍赴之胡土率兵至唐宋人斂避縱其半入城夾擊之胡土大敗僅存三十騎以還換住死焉既而以胡土為殿前都點檢罷權參政大兵圍蔡分軍防守胡土守西面十一月胡土之奴竊其金牌夜縋城降朝士喧播謂胡土縱之往將有異志胡土聞之內不自安乞解軍職上慰之曰卿父子昆弟皆為帥臣受恩不為不厚顧肯降耶且卿向在洛陽不即降而千里遠來降於蔡豈人情也哉聞卿遇奴太察且其衣食不常給之此蓋往求溫飽耳卿何慊焉因賜饌以安其心初胡土罷機政頗有怨言左右勸上誅之上不聽及令守西城尤怏怏不樂至是始感恩無他慮矣尋以總帥孛术魯婁室與胡土皆權參政婁室與右丞仲德同事胡土防守如故復以都尉承麟為東面元帥權總帥先是攻東城婁室隨機備禦二日移攻南城烏古論鎬易之炮擊城樓幾仆右丞仲德率軍救援乃罷攻俄而四面受敵仲德艱於獨援遂薦承麟代婁室東面而乞與婁室同救應初胡土失外城頗慚恨聲言力小不能令衆仲德亦薦之故有是命蔡城破投汝水死贊曰撒合輦本以佞進烏林答胡土戰陳不武付以孤城望其捍禦大難豈得為知人乎強伸一射糧卒耳及授以兵乃能應變制勝遠過二人力盡乃斃猶有烈丈夫之風焉古人有言四郊多壘拔士為將使金運未去伸足以建功名矣夫內族思烈南陽郡王襄之子也資性詳雅頗知書史自五六歲入宮充奉御甚見寵幸世號曰自在奉御當宣宗入承大統胡沙虎跋扈思烈尚在髫齔嘗涕泣跪抱帝膝致說曰願早誅權臣以靖王室帝急顧左右掩其口自是帝甚器重之後由提點近侍局遷都點檢天興元年汴京被圍哀宗以思烈權參知政事行省事于鄧州會武仙引兵入援於是思烈率諸軍發自汝州過密縣遇大元兵不用武仙阻澗之策遂敗績于京水語在武仙傳中京留守元帥左監軍任守真死之上聞罷思烈行省之職以守中京無何大兵圍中京未能下崔立遣人監思烈子於中京城下招之使降思烈不顧令軍士射之既而知崔立已以汴京歸順病數日而死初思烈會武仙等軍入援即與仙論議不同仙以思烈方得君每假借之思烈謂仙本無入援意特以朝廷遣一參政召兵迫於不得已乃行耳然仙知兵頗以持重為事思烈急於入京不聽仙策於是左右司員外郎王渥乃勸思烈曰武仙大小數百戰經涉不為不多兵事當共議思烈疑其與仙有謀幾斬之渥自以無愧於內不懼也已而思烈果敗渥歿於陳渥字仲澤後名仲澤太原人性明俊不羈博學善談論工尺牘字畫清美有晉人風少游太學長於詞賦登興定二年進士第為時帥奧屯邦獻完顏斜烈所知故多在兵間後辟寧陵令有治迹入為尚書省令史因使宋至揚州應對敏給宋人重之及還為太學助教轉樞密院經歷官俄遷右司都事稍見信用及思烈往鄧州以渥為左右司員外郎從行贊曰思烈夙惠請誅權奸以立主威有甘羅辟疆之風所謂茂良不必父祖者也中京之圍崔立脅其子使招之降不顧而趣射之何愧乎橋玄至如不從武仙之言以至於敗此蓋時人因惜王仲澤之死而有是言仙無入援之意則非誣也紇石烈牙吾塔一名志本出親軍性剛悍喜戰貞祐間僕散安貞為山東路宣撫使以牙吾塔為軍中提控是時山東羣盜蜂起安貞遣牙吾塔破巨蒙等四堌又破馬耳山寨殺劉二祖賊黨四千餘人降賊八千虜其僞宣差程寬招軍大使程福又降脅從民三萬餘人貞祐四年六月積功纍遷欄通渡經略使十月為元帥左都監十二月行山東西路兵馬都總管府事兼武寧軍節度使徐州管內觀察使興定二年正月宋兵萬餘攻泗州牙吾塔赴援至臨淮遇宋人三百掩殺殆盡及泗州宋兵八千圍甚急督衆進戰大破之溺水死者甚衆獲馬三百餘匹俘五十餘人又圍盱眙宋人閉門堅守不敢出以騎兵分掠境內而時遣羸卒薄城誘之宋人出騎數百來拒牙吾塔麾兵佯北發伏擊之斬首二百宋人復出步騎八千來援合擊敗之殺一太尉斬首三百尋獲覘者稱青平宋兵甚衆將救盱眙牙吾塔移兵赴之宋兵步騎七千人突出兵少却旋以輕騎其後初逗遛不與戰縱之走東南薄諸河斬首千餘溺死者無算獲馬牛數百甲仗以千計師還遇宋兵三千於連塘村斬首千餘級俘五十人獲馬三十五匹宣宗以其有功賜金帶一三年正月敗宋人於濠州之香山村二月又敗之於滁州斬首千級拔小江寨殺統制王大篷等斬三萬俘萬餘人又拔輔嘉平山寨斬首數千俘五百餘人獲馬牛數百糧萬斛三月提控奧敦吾里不大敗宋人于上津縣兵還至濠州宋人以軍八千拒戰牙吾塔迎擊敗之獲馬百餘匹五年正月上以紅襖賊助宋為害邊兵久勞苦詔牙吾塔遺宋人書求戰略曰宋與我國通好百年於此頃歲以來納我叛亡絶我貢幣又遣紅襖賊乘間竊出跳梁邊疆使吾民不得休息彼國若以此曹為足恃請悉衆而來一決勝負果能當我之鋒沿邊城邑當以相奉度不能即宜安分保境何必狐號鼠竊乘陰伺夜以為此態耶且彼之將帥亦自受鉞總戎而臨敵則望風遠遁被攻則閉壘深藏逮吾師還然後現形耀影以示武夫小民尚氣女子有志者猶不爾也切為彼國羞之先是宋將時青襲破泗州西城二月牙吾塔將兵取之宋兵拒守甚力乃募死士以梯衝並進大敗宋兵時青乘城指麾射中其目遂拔衆南奔乃陳兵橫絶走路擊之宋兵大潰遂復泗州西城三月復出兵宋境以報其役破團山賈家等諸寨進逼濠州牙吾塔慮州人出拒率徑兵逆之遇邏騎二百于城東擊殺過半會偵者言前路芻糧甚艱乃西掠定遠由渦口而還九月又率兵渡淮大破宋兵於團山詔遷官升職有差元光元年五月以京東便宜總帥兼行戶工部事上因謂宰臣曰牙吾塔性剛人皆畏之委之行部無不辦者至於御下亦頗有術提控有胡論出者渠厚待之常同器而食其人感奮遂以戰死英王守純曰凡為將帥駕馭人材皆當如此上曰然未幾宋人三千潛渡淮至聊林盡伐隄柳塞汴水以斷吾糧道牙吾塔遣精甲千餘破之獲其舟及渡者七百人汴流由是復通二年四月上言賞罰國之大信帝王所以勸善而懲惡其令一出不可中變向官軍戰歿者皆廩給其家恩至厚也臣近抵宿州乃知例以楮幣折支往往不給至于失所此殆有司出納之吝不能奉行朝廷德意之過也自今願支本色令得贍濟以糧儲方艱詔有司給其半紅襖賊寇壽潁剽掠數日而去牙吾塔聞之率兵渡淮偵知朱村孝義村有賊各數百分兵攻之連破兩柵及焚其村塢數十還遇宋兵數百陳淮南岸擊殺其半尋有兵千餘自東南來追復大敗之先是納合六哥殺元帥蒙古綱據邳州以叛十月牙吾塔圍之焚其樓櫓斬首百餘於是宋鈐轄高顯統制侯進正將陳榮等知不能守共誅六哥持其首縋城降六哥既誅衆猶拒守方督兵進攻宋總領劉斌提控黃溫等縛首亂顏俊戚誼完顏乞哥及梟提控金山八打首遣其校馬俊吳圭來獻既而紅襖監軍徐福統制王喜等亦遣其總領孫成總押徐琦納發劉斌等遂率軍民出降牙吾塔入城撫慰其衆各使安集又招獲紅襖統制十有五人將官訓練百三十有九人十一月遣人來報仍函六哥首以獻宣宗大喜進牙吾塔官一階賜金三百兩內府重幣十端將士遷賞有差正大三年十一月北兵猝入西夏攻中興府甚急召陝西行省及陝州靈寶二總帥訛可牙吾塔議兵又詔諭兩省曰儻邊方有警內地可憂若不早圖恐成噬臍旦夕事勢不同隨機應變若逐旋申奏恐失事機並從行省從宜規畫四年牙吾塔復取平陽獲馬三千是歲大兵既滅夏國進攻陝西德順秦州清水等城遂自鳳翔入京兆關中大震五年圍慶陽六年十月上命陝省以羊酒及幣赴慶陽犒北帥為緩師計北中亦遣唐慶等往來議和尋遣斡骨欒為小使徑來行省十二月詔以牙吾塔與副樞蒲阿權簽樞密院事內族訛可將兵救慶陽七年正月戰于大昌原慶陽圍解詔以牙吾塔為左副元帥屯京兆初斡骨欒來行省恐泄事機因留之蒲阿等既解慶陽之圍志氣驕滿乃遣還謂使者曰我已準備軍馬可戰鬬來語甚不遜斡骨欒以此言上聞太宗皇帝大怒至應州以九日拜天即親統大兵入陝西八年遷居民於河南棄京兆東還五月至閿鄉得寒疾汗不出死塔亦作太亦曰牙忽帶蓋女直語無正字也是歲九月國信使內族乘慶自北使還始知牙吾塔不遜激怒之語且言慶等在旁心魄震蕩殆不忍聞當時以帥臣不知書誤國乃爾塔為人鷙狠狼戾好結小人不聽朝廷節制嘗入朝詣省堂詆毀宰執宰執亦不敢言而上倚其鎮東方亦優容之尤不喜文士僚屬有長裾者輒以刀截去又喜凌侮使者凡朝廷遣使來必以酒食困之或辭以不飲因併食不給使餓而去司農少卿張用章以行戶部過宿塔飲以酒張辭以寒疾塔笑曰此易治耳趨左右持艾來臥張於牀灸之數十又以銀符佩妓屢往州邵取賕州將之妻皆遠迎迓號省差行首厚賄之御史康錫上章劾之且曰朝廷容之適所以害之欲保全其人宜加裁制朝廷竟不治其罪以屢敗宋兵威震淮泗好用鼓椎擊人世呼曰盧鼓椎其名可以怖兒啼大概如呼麻胡云有子名阿里合世目曰小鼓椎嘗為元帥從哀宗至歸德與蒲察官奴作亂伏誅康錫字伯祿趙州人至寧元年進士正大初由省掾拜御史劾侯摯師安石非相材近侍局宗室撒合輦聲勢熏灼請托公行不可使在禁近時論韙之轉右司都事京南路司農丞為河中路治中河中破從時帥率兵南奔濟河船敗死為人氣質重厚公家之事知無不為與雷淵冀禹錫齊名贊曰金自胡沙虎高琪用事風俗一變朝廷矯寬厚之政好為苛察然為之不果反成姑息將帥鄙儒雅之風好為粗豪然用非其宜終至跋扈牙吾塔戰勝攻取威行江淮而矜暴不法肆侮王人此豈可制者乎棄陝而歸死於道途殆其幸歟其子效尤竟陷大僇君子乃知康錫之言不為過也
