body:
  text: 金史卷九十四列傳第三十二夾谷清臣內族襄夾谷衡完顏安國瑤里孛迭夾谷清臣本名阿不沙胡里改路桓篤人也姿狀雄偉善騎射皇統八年襲祖駮達猛安大定元年聞世宗即位率本部軍六千赴中都會之以功遷昭武大將軍從右副元帥紇石烈志寧為管押萬戶接應左都監完顏思敬逐窩斡餘黨敗之柔遠至抹拔里達悉獲之賊平遷鎮國上將軍知潁順軍事會宋兵二萬襲陷汝州殺刺史烏古孫麻發及漢軍二千河南統軍宗尹遣萬戶孛术魯定方與清臣等領騎兵四千往擊之宋人棄城遁遂復汝州三年五月從志寧復取宿州宋將李世輔大敗遁去志寧復遣清臣等以兵追襲又敗之捷聞授宿州防禦使移博州改西北路招討都監遷烏古十壘部族節度使十二年授右副都點檢遷左副都點檢出為陝西路統軍使兼知京兆府事朝辭賜以金帶馬仍諭之曰卿典禁兵日侍左右勤勞久矣故以是授卿宜益思勉二十六年改西京留守閱三歲遷樞密副使明昌元年初議出師以本職充東北路兵馬都統制使既而詔止之俄以其女為昭儀眷倚益重二年拜尚書左丞頃之進平章政事封芮國公賜同本朝人四年遷右丞相監修國史時議簽軍戍邊上問漢人與夏人孰勇清臣曰漢人勇上曰昔元昊擾邊宋終不能制何也清臣曰宋馭軍法不可得知今西南路人殊勝彼也未幾遷崇進改封戴一日上謂宰臣曰人有以八陣圖來上者其圖果何如朕嘗觀宋白所集武經然其載攻守之法亦多難行清臣曰兵書皆定法難以應變本朝行兵之術惟用正奇二軍臨敵制變以正為奇以奇為正故無往不克上曰自古用兵亦不出奇正二法耳且學古兵法如學弈未能自得於心而欲用舊陣勢以接敵亦以疎矣尋上表丐閒不許固請乃賜告省親諭之曰聞卿母老欲令歸省故特給假五十日馳驛以往至彼可為一月留也五年二月上御凝和殿清臣省覲還謁上上問卿母健否其壽幾何相別幾年矣清臣對曰臣母年八十三矣別十年幸頗強健上曰何不來此曰急於家務故不欲離耳上曰老人多如是所謂血氣既衰戒之在得也復謂清臣胡里改路風俗何如對曰視舊則稍知禮貌而勇勁不及矣因言西南西北等路軍人其閑習弓矢亦非復曩時六年遷儀同三司進拜左丞相改封密受命出師行尚書省事於臨潢府清臣遣人偵知虛實以輕騎八千令宣徽使移剌敏為都統左衞將軍充招討使完顏安國為左右翼分領前隊自選精兵一萬以當後隊進至合勒河前隊敏等於栲栳濼攻營十四下之回迎大軍屬部斜出掩其所獲羊馬資物以歸清臣遣人責其賧罰北阻由此叛去大侵掠上遣責清臣命右丞相襄代之承安五年降授橫海軍節度使兼滄州管內觀察使初上諭宰臣曰清臣舊有勞效罪狀未甚明若降授應須告致仕耳初擬知廣寧府上曰姑與滄州既而又曰與則與之第恐有人言也尋復致仕泰和二年薨年七十子么查剌襲猛安初議征討清臣主其事既而領軍出征雖屢獲捷而貪小利遂致北邊不寧者數歲天下尤之丞相襄本名唵昭祖五世孫也祖什古廼從太祖平遼以功授上京世襲猛安歷東京留守父阿魯帶皇統初北伐有功拜參知政事襄幼有志節善騎射多勇略年十八襲世爵大定初契丹叛從左副元帥謀衍以本部兵討賊戰于肇州之長濼襄先登鏖擊足中流矢裹創以戰氣愈厲七戰皆勝謀衍握其手曰今日之捷皆公力也賊走渡霿鬆河追及之所駐地多草賊乘風縱火襄亦縱火立空地以俟戰十餘合賊益困襄謂謀衍曰今不乘此平殄後將有悔謀衍然之襄率衆搏戰大敗之俘獲萬計會朝廷遣平章政事僕散忠義伐謀衍將襄復從忠義追賊至裊嶺西之陷泉及之率右翼身先奮擊賊大潰人馬相蹂而死陷泉幾平賊酋窩斡僅與數十騎遁去卒就擒論功為第一有司擬淄州刺史詔特授亳州防禦使時年二十三宋人犯南鄙襄為潁壽都統率甲士二千人渡潁水敗敵兵五千復潁州生擒宋帥楊思次濠州宋將郭太尉退保橫澗山襄攻之伏弩射中其膝督攻愈急拔之獲郭太尉既而趨滁州襄為先鋒將至清流關得宋偵者知敵欲三道夜出掩我不備左副元帥紇石烈志寧問計襄曰今兵少地隘儻不得關敵至我無所據必先取之曰我與若孰往襄曰元帥國家大臣詎宜輕動襄當為公往取志寧韙之襄率騎二千分二道一由衝路自以千兵間道潛登既近敵始覺襄攻克之據其關志寧履行戰地顧謂曰克敵於不可勝之地真天下英傑也及宋乞盟班師召為拱衞直都指揮使改殿前右衞將軍轉左衞出為東北路招討都監遷速頻路節度使移曷懶路兵馬都總管左丞相志寧疾甚世宗臨問之志寧薦襄智勇兼濟有經世才他人莫及異時任用殆勝于臣即召授殿前左副都點檢為宋生日使宋方祈免親接國書襄至宋人屢來議皆折之迄成禮而還授陝西路統軍使賜之尚服馬鞍勒佩刀改河南統軍使入為吏部尚書轉都點檢賜錢千萬世宗謂宰執曰襄為人甚蘊藉非直日亦入宮規畫諸事事有所付乃退其公勤如此若襄之才豈多得哉擢御史大夫踰月拜尚書右丞諭之曰卿在河南經制邊事甚有統紀及在吏部至為點檢尤奉公守法朕甚嘉之近長憲臺亦以剛直聞是用委以機政其益勉之未幾進拜左丞襄在外任治有異効至是朝廷以褒賞廉吏詔天下列其名以示奬勵二十三年進拜平章政事封蕭國公世宗以金源郡王世嫡皇孫將加王爵詔擇國號襄曰為天下大計必先正其本原者本也請封原從之故事諸部族節度使及其僚屬多用辤人而頗有私縱不法者議改用諸色人襄曰北邊雖無事恆須經略之若杜此門其後有勞績何以處之請如舊他日議及古有監軍之事襄曰漢唐初無監軍將得專任故戰必勝攻必克及叔世始以內臣監其軍動為所制故多敗而少功若將得其人監軍誠不必置並嘉納之詔受北部進貢使還世宗問邊事具圖以進因上覊縻屬部鎮服大石之策詔悉行之進拜右丞相徙封戴世宗不豫與太尉徒單克寧平章政事張汝霖宿內殿同受顧命章宗初即政議罷僧道奴婢太尉克寧奏曰此蓋成俗日久若遽更之於人情不安陛下如惡其數多宜嚴立格法以防濫度則自少矣襄曰出家之人安用僕隸乞不問從初如何所得悉放為良若寺觀物力元係奴婢之數推定者並合除免詔從襄言由是二稅戶多為良者明昌元年同知棣州防禦使上封事歷詆宰執太傅克寧奏所言襄預知之於是詔還本猛安而襄出知平陽府事移知鳳翔歷西京留守召授同判大睦親府事進樞密使復拜右丞相改封任時左丞相夾谷清臣北禦邊措畫乖方屬邊事急命襄代將其衆佩金牌便宜從事臨宴慰遣賜以貂裘鞍山細鎧及戰馬二時胡里辤亦叛嘯聚北京臨潢之間襄至遣人招之即降遂屯臨潢頃之出師大鹽濼復遣右衞將軍完顏充進軍斡魯速城欲屯守俟隙進兵繪圖以聞議者異同即召面論厚賜遣還未幾遣西北路招討使完顏安國等趨多泉子密詔進討乃命支軍出東道襄由西道而東軍至龍駒河為阻所圍三日不得出求援甚急或請俟諸軍集乃發襄曰我軍被圍數日馳救之猶恐不及豈可後時即鳴鼓夜發或請先遣人報圍中使知援至襄曰所遣者儻為敵得使知我兵寡而糧在後則吾事敗矣乃益疾馳遲明距敵近衆請少憩襄曰吾所以乘夜疾馳者欲掩其不備爾緩則不及嚮晨壓敵突擊之圍中將士亦鼓譟出大戰獲輿帳牛羊衆皆奔斡里札河遣安國追躡之衆散走會大雨凍死者十八九降其部長遂勒勳九峯石壁捷聞上遣使厚賜以勞之別詔許便宜賞賚士卒九月赴闕拜左丞相監修國史封常山郡王宴慶和殿上親舉酒飲解所服玉具佩刀以賜俾即服之十月阻復叛襄出屯北京會羣牧契丹德壽鎖等據信州叛偽建元曰身聖衆號數十萬遠近震駭襄閑暇如平日人心乃安初襄之出鎮也至石門鎮密謂僚屬曰北部犯塞奚足慮第恐姦人乘隙而動北京近地軍少當預為之備即遣官發上京等軍六千至是果得其用臨潢總管烏古論道遠咸平總管蒲察守純分道進討擒德壽等送京師契丹之亂廷臣議罷郊祀又欲改用正月上辛上遣使問之對曰郊為重禮且先期詔天下又藩國已報表賀今若中罷何以副四方傾望之意若改用正月上辛乃祈穀之禮非郊見上帝之本意也大禮不可輕廢請決行之臣乞於祀前滅賊既而賊破果如所料郊禮成進封南陽郡王始討契丹自龍虎衞上將軍節度使以下許承制授之襄以為賞罰之柄非人臣所預不敢奉詔賊平請委近臣諭旨將士使知上恩乃遣李仁惠持宣三十勅百五十視功給之方德壽之叛諸辤亦剽略為民患襄慮其與之合乃移諸辤居之近京地撫慰之或曰辤人與北俗無異今置內地或生變奈何襄笑曰辤雖雜類亦我之邊民若撫以恩焉能無感我在此必不敢動後果無患尋詔參知政事裔代領其軍入見賜錢五千萬明年以內艱免翌日起復視事時議以契丹戶之驅奴尚衆乞盡鬻以散其黨襄以為非便奏請量存口數餘悉官贖為良上納之北部復叛裔戰失律復命襄為左副元帥莅師尋拜樞密使兼平章政事屯北京民方艱食乃減價出糶倉粟以濟之或以兵食方闕為言襄曰烏有民足而兵不足者卒行之民皆悅服時議北討襄奏遣同判大睦親府事宗浩出軍泰州又請左丞衡於撫州行樞密院出軍西北路以邀阻而自帥兵出臨潢上從其策賜內庫物即軍中用之其後斜出部族詣撫州降上專使問襄襄以為受之便賜寶劍詔度宜窮討乃令士自賫糧以省輓運進屯於沔移剌烈烏滿掃等山以逼之因請就用步卒穿壕築障起臨潢左界北京路以為阻塞言者多異同詔問方略襄曰今茲之費雖百萬貫然功一成則邊防固而戍兵可減半歲省三百萬貫且寬民轉輸之力實為永利詔可襄親督視之軍民並役又募飢民以傭即事五旬而畢於是西北西南路亦治塞如所請無何泰州軍與敵接戰宗浩督其後殺獲過半諸部相率送款襄納之自是北陲遂定襄還臨潢減屯兵四萬馬二萬疋上以信符召還遣近臣迎勞于途既至復撫問于第入獻邊機十事皆為施行仍厚賜之復拜左丞相初襄至自軍上諭宰臣曰樞密使襄築立邊堡完固古來立一城一邑尚有賞賚即欲拜三公三公非賞功官如左丞相亦非賞功者雖然可特授之遣左司郎中阿勒根阿海降詔褒諭四年正月進拜司空領左丞相如故襄重厚寡言務以鎮靜守法每掾有所禀必問曰諸相云何掾對某相如是某相如是襄曰從某議其事無有異者識者謂襄誠得相體時上頗更定制度初置提刑司又議設清閑職位如宋朝宮觀使以待年高致仕之官襄言年老致仕朝廷養以俸恩禮至渥老不為退復有省會之法所以抑貪冒長廉節若擬別設恐涉于濫又言省事不如省官今提刑官吏多無益於治徒亂有司事議者以謂斯乃外臺不宜罷臣恐混淆之辭徒煩聖聽且憲臺所掌者察官吏非違正下民寃枉亦無提點刑獄舉薦之權若已設難以遽更其採訪廉能不宜隸本司宜令監察御史歲終體究仍不時選官廉訪上皆聽納俄乞致仕不許時方旱命有司祈雨襄及平章政事張萬公參政僕散揆等上表待罪上召翰林學士党懷英草罪己詔仍慰諭襄等視事泰和元年春承命馳禱于亳州太清宮及后土方嶽以其世封遠特改授河間府路算术海猛安明年皇子生襄復自請報謝既祀嵩嶽還次芝田之府店遂以疾薨年六十三訃聞輟朝遣使祭于路葬禮依太師淄王克寧諡曰武昭命張行簡銘其碑襄明敏才武過人上親待之厚故所至有功其駐軍臨潢也有以偽書遺西京留守徒單鎰欲構以罪書聞上以書還畀襄其明信如此既而果獲為偽書者在政府二十年明練故事簡重能斷器局尤寬大待掾吏盡禮用人各得所長為當世名將相大安間配享章宗廟廷夾谷衡本名阿里不山東西路三土猛安益打把謀克人也大定十三年創設女直進士舉衡中第四人補東平府教授調范陽簿選充國史院編修官改應奉翰林文字世宗嘗謂宰臣曰女直進士中才傑之士蓋亦難得如徒單鎰夾谷衡尼厖古鑑皆有用材也遷修起居注章宗立為侍御史轉右司員外郎敷奏稱旨升左司郎中明昌二年擢御史中丞未幾拜參知政事三年八月以病表乞致仕詔撫慰不許衡久在告承詔始出上見其羸瘠復賜告一月四年詔賜今名諭之曰朕選大臣俾參機務必資謀畫協贊治平其或得失晦而未形利害膠而未決正須識見純直方能去取合公比來議事之臣鮮有一定之論蓋以內無所守故臨事而惑致有中失朕將何賴卿忠實公方審其是則執而不回見其非則去而能果度其事勢有若權衡汝之所長衡實似之可賜名衡古者命名將以責實汝先有實可謂稱名行之克終乃副朕意參知政事胥持國言區種法衡曰若苟有利古已行之且用功多而所種少復恐荒廢土田徒勞民無益也進尚書右丞舊制久歷隨朝職任者得奉使江表衡未使而拜執政特賜錢六千貫六年遷尚書左丞尋出行省于撫州洎還入朝聞父憂去上亟召回起復本職承安二年出為上京留守尋改樞密副使行院規畫邊事三年以修完封界賜詔褒諭四年正月就拜平章政事封英國公薨年五十一上聞之惻然為輟朝命官致祭賻贈有加遣使勅葬諡曰貞獻完顏安國字正臣本名闍母其先占籍上京世有戰功祖斜婆授西南路世襲合札謀克安國沉雄有謀畫尤善騎射正隆元年從軍為謀克常以少擊衆大定中為常山簿轉虹縣令會王府新建選充虞王府掾再遷儀鸞局副使明昌元年改本局使會大石部長有乞修歲貢者朝廷許其請詔安國往使之至則率衆遠迓至帳望闕羅拜執禮無惰容時北阻迫近塞垣隣部欲立功以誇雄上國議邀安國俱行討之安國以未奉詔為辭強之不可或以危言怵之安國曰大丈夫豈以生死易節暴骨邊庭不猶愈於病死牖下衆壯其言餽贐如禮既還以奉使稱旨升武衞軍都指揮使出為東北路副招討未赴改西北路副招討六年左丞相夾谷清臣用兵以安國為先鋒都統適臨潢泰州屬部叛安國先討定之以功遷本路招討使兼威遠軍節度使承安元年大鹽濼之戰殺獲甚衆詔賜金幣既而右丞相襄總大軍進安國為兩路都統大捷於多泉子襄遣安國追敵僉言糧道不繼不可行也安國曰人得一羊可食十餘日不如驅羊以襲之便遂從其計安國統所部萬人疾驅以薄之降其部長捷聞進官四級遷左翼都統承安二年以營邊堡功召簽樞密院事賜虎符還邊得以便宜從事時並塞諸部降諭使輸貢如初進拜樞密副使泰和元年特授世襲西南路延晏河猛安兼合札謀克帝幸慶寧宮命安國嚴飭邊備奏西南路邊戍私竄者乞招誘以安人心上是其言三年以疾致仕封道國公四年起復前職卒上聞之輟朝勅有司葬以執政禮贈特進安國在軍旅幾十五年號令嚴明指麾卒伍如左右手又善伺知敵人虛實及山川險易戰必身先士卒故所向輒克諸部入貢安國能一一呼其祖先弟姪名字以戒諭之諸部皆震悚甚為隣國所畏服瑤里孛迭北京路窟白猛安陀羅山謀克人也以軍功歷海濱令遷徐王府掾以稱職再任御史臺察廉升同知震武軍節度使事明昌初為唐州刺史尋授西北路招討副使未幾改東北路六年正月北邊有警聚兵圍慶州急孛迭率本路軍往救敵解去州竟無患承安元年丞相襄北伐孛迭為先鋒副統進軍至龍駒河受圍會襄引大軍至得解後授鎮寧軍節度使以六羣牧人叛改寧昌軍孛迭為都統領步騎萬次懿州敵數萬來逆戰兵勢甚張孛迭親陷陣奮力鏖擊却之身中二創捷聞遷一官承安二年辤軍千餘出沒剽掠錦懿間孛迭追敗之復獲所掠悉還本戶三年從同判大睦親府事宗浩為左翼都統戰移密河勝戰骨堡子西殺獲甚衆五年授知廣寧府事俄改東北路招討使以捍邊有功賜詔褒諭三遷為崇義軍節度使泰和六年卒訃聞遣官致祭賜銀五百兩贈金紫光祿大夫孛迭勇決善戰自幼以軍功顯任兵鎮十餘年所向克捷凡再遷官賜金幣甚為上倚注云贊曰易師之初六師出以律否臧凶蓋初為師之始出師之道當慎其始清臣首議出師遽以貪小利敗襄雖賢竭力而後勝其任衡安國孛迭之功又亞於襄者也然而兵連禍結以終金世故兵無常勝制勝在勢勢制兵者強兵制勢者亡迹襄之開築壕塹以自固其猶元魏北齊之長城歟金之勢可知矣勢屈而兵勝亡國之道也金以兵始亦以兵終嗚呼用兵之始可不慎歟可不慎歟
