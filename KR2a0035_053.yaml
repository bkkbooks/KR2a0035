body:
  text: 金史卷五十三志第三十四選舉三右職吏員雜選右職省令史譯史皇統八年格初考遷一重女直人依本法外諸人越進義每三十月各遷兩重百二十月出職除正六品以下正七品以上職官正隆二年更為五十月遷一重初考女直人遷敦武校尉餘人遷保義校尉百五十月出職係正班與從七品若自樞密院臺六部轉省者以前已成考月數通算出職大定二年復以三十月遷一官亦以百二十月出職與正從七品院臺六部及它府司轉省而不及考者以三月折兩月一考與從七兩考正七品三考與六品三年定格及七十五月出職者初上令二中令三下令四五録事六下令七中令八上令百五十月出職者初刺同運判推官等二三中令四上令回呈省大定二十七年制一考及不成考者除從七品須歷縣令三任第五任則升正七品兩考以上除正七品再任降除縣令三四皆與正七品第五任則升六品三考以上者除六品再任降正七品三任四任與六品第五任則升從五品省女直譯史大定二十八年制以見任從七從八人內勾六十歲以上者相視用之明昌三年取見役契丹譯史內女直契丹字熟間者無則以前省契丹譯史出職官及國史院女直書寫見任七品八品九品官充省通事大定二十年格三十月遷一重百二十月出職一考兩考與八品三考者從七品餘與部令譯史一體免差御史臺令史譯史皇統八年遷考之制百二十月出職正隆二年格百五十月出職皆九品係正班大定二年百二十月出職皆以三十月遷一官其出職一考兩考皆與九品三考與八品明昌三年截罷見役吏人用三品職事官子弟試中者及終場舉人本臺試補者若不足於密院六部見役品官及契丹品官子孫兄弟選充承安三年敕凡補一人必詢於衆雖為公選亦恐久漸生弊況又在書史之上不試而即用本臺出身門戶似涉太優遂令除本臺班內祗令譯史名闕外於試中樞密院令譯史人內以名次取用不足即於隨部班祗令譯史上名轉充若須用終場舉人之闕則令三次終場舉人每科舉後與它試書史人同程試驗榜次用之女直十三人內班內祗六人終場舉人七人漢人十五人內班內祗七人終場舉人八人譯史四人內班內祗二人終場舉人二人樞密院令史譯史令史正隆二年制遷考與省同出職除係正班正從八品大定二十一年定元帥府令譯史三十月遷一官百二十月出職一考兩考與八品除授三考與從七品十四年遂命內祗並三品職事官承廕人與四品五品班祗及吏員人通試中選者用之十六年定一考兩考者初録事軍判防判再除上簿三中簿四同初五六下令七八中令九十上令二十六年兩考者免下令一任三考以上初上令二中令三下令四録事軍防判二十六年免此除五下令二十六年亦免此除六七中令八上令十七年制試補緦麻袒免以上宗室郎君又定制三品職事子弟設四人吏員二人睦親府宗正府統軍司令譯史遷考出職與臺部同部令史譯史皇統八年格初考三十月遷一重女直人依本格餘人越進義第二第三考各遷一重第四考並遷兩重百二十月出職八品已下正隆二年遷考與省右職令史同出職九品大定二十一年宗正府六部臺統軍司令史番部譯史元帥府通事皆三十月遷一重百二十月出職係班一考兩考與九品三考已上與八品除授十四年以三品至七品官承廕子孫一混試充尋以為不倫命以四品五品子孫及吏員試中者依舊例補六品以下不與十五年命免差使十六年格一考兩考者初除上簿再除中簿三下簿四上簿五録事軍防判六七下令八九中令十上令三考以上者初除録事軍防判再除上簿三中簿四如初五下令後免此除六七下令八中令九上令按察司書吏以終場舉人內選補遷加出職同臺部凡內外諸吏員之制自正隆二年定知事孔目出身俸給凡都目皆自朝差海陵初除尚書省樞密院御史臺吏員外皆為雜班乃召諸吏員於昌明殿諭之曰爾等勿以班次稍降為歉果有人才當不次擢用也又定少府監吏員以內省司舊吏員及外路試中司吏補大定二年戶部郎中曹望之言隨處胥吏猥多乞減其半詔胥吏仍舊但禁用貼書又命縣吏闕則令推舉行止修舉為鄉里所重者充三年以外路司吏久不升轉往往交通豪右為姦命與孔目官每三十月則一轉移於它處七年敕隨朝司屬吏員通事譯史勾當過雜班月日如到部者並不理算又詔吏人但犯贓罪罷者雖遇赦而無特旨不許復又命京府州縣及轉運司胥吏之數視其戶口與課之多寡增減之十二年上謂宰臣曰外路司吏止論名次上下恐未得人若其下有廉慎熟間吏事委所屬保舉試不中程式者付隨朝近下局分承應以待再試彼既知不得免試必當盡心以求進也章宗大定二十九年上封事者言諸州府吏人不宜試補隨朝吏員乞以五品以上子孫試補蓋職官之後清勤者多故為可任也尚書省謂吏人試補之法行之已久若止收承廕人復恐不間案牘或致敗事舊格惟許五品職官子孫投試今省部試者尚少以所定格法未寬故也遂定制散官五品而任七品散官未至五品而職事五品其兄弟子孫已承廕者並許投試而六部令史內吏人試補者仍舊泰和四年簽河東按察司事張行信言自罷移轉法後吏勢浸重恣為豪奪民不敢言今又無朝差都目止令上名吏人兼管經歷六案文字與同類分受賄賂吏目通歷三十年始得出職常在本處侵漁不便遂定制依舊三十月移轉年滿出職以杜把握州府之弊八年以僉東京按察司事楊雲翼言書吏書史皆不用本路人以別路書吏許特薦申部者類試取中選者補用凡右職官天德制忠武以下與差使昭信以上兩除一差大定十二年敕鎮國以上即與省除十三年制明威注下令宣威注中令廣威注上令信武權注下令宣武顯武免差權注丞簿又制宣武顯武功酬與上簿無虧與中簿二十六年制遷至宣武顯武始令出職又以舊制通歷五任令呈省詔減為四任明昌三年以諸司除授守闕近三十月於選調窒礙今後依舊兩除一差候員闕相副則復舊制泰和元年以縣令見闕近者十四月遠者至十六月蓋以見格官至明威者並注縣令或犯選並虧永人若帶明威人亦注是無別也遂令曾虧永及犯選格女直人展至廣威漢人至宣武方注縣令又以守闕簿丞近者十九月遠者二十一月依見格官至宣武顯武信武者合注丞簿遂命但曾虧永直至明威方注丞簿又吏格凡諸右職正雜班謂無資歷者班內祗同皆驗官資注授帶忠武以下者與監當差使昭信以上擬諸司除授仍兩除一差宣武以上與中簿功酬人與上簿明威注下令宣威注中令廣威注上令通歷縣令四任如帶定遠已歷縣令三任者皆呈省若但曾虧永及犯選格諸曾犯公罪追官私罪解任及犯贓廉訪不好併體察不堪臨民謂之犯選格女直人遷至武義漢人諸色人武略並注諸司除授皆兩除一差若至明威方注丞簿女直人遷至廣威漢人諸色人遷至宣威者皆兩任下令一任中令回呈省貞祐三年制遷至宣武者皆與諸司除授亦兩除一差凡不犯選格者若懷遠方注丞簿至安遠則注下令上令各一任呈省四年復以官至懷遠注下令定遠注中令安遠注上令四任呈省檢法知法正隆二年嘗定六部所用人數及差取格法初考兩考皆除司候三考者除上簿五年定制十年內者初考除下簿兩考除中簿三考除警判十年外者初考除第二任司候兩考除上簿三考則除市丞大定二年制曾三考者不拘十年內外皆與八品録事市令擬當合得本門戶除授舊授劄付大定三年始命給敕以律科人為之七年定制驗榜次勾取如勾省令史之制二十六年命三考除録事以後則兩除一差女直知法檢法大定三年格以臺部統軍司出職令譯史曾任縣佐市令差使人內奏差考滿比元出身升一等依隨路知事例給敕以三十月為任明昌五年以省院臺部統軍司令譯史書史內擬年五十以下無過犯慎行止試一月以能者充再勒留者升一等一考者初上令二三中令四上令兩考升二等呈省太常寺檢討二人正隆二年五十月遷一重女直遷敦武餘人進義百五十月出職係雜班大定二年制以三十月遷一重百二十月出職係正班九品省祗候郎君大定三年制以袒免以上親願承應已試合格而無闕收補者及一品官子已引見止在班祗候三十月循遷初任與正從七品次任呈省內祗在班初次任注正從八品三四注從七品而後呈省班祗在班初九品次三正從八品四五從七品而後呈省已上三等並以六十月為滿各遷一重八年定制先役六十月以試驗其才不能幹者進一官黜之才幹者再理六十月每三十月遷加百二十月為滿須用識女直字者十六年定制以制文試之能解説得制意者為中選十八年制一品官子初都軍二録事軍防判三都軍四下令五六上令回呈省內祗初録事軍防判二上簿三同初四録事五都軍六下令七中令八上令回呈省班祗初上簿二中簿三同初四録事軍防判五録事六都軍七下令八中令九上令回呈省國史院書寫正隆元年定制女直書寫試以契丹字書譯成女直字限三百字以上契丹書寫以熟於契丹大小字以漢字書史譯成契丹字三百字以上詩一首或五言七言四韻以契丹字出題漢人則試論一道遷考出職同太常檢討宗室將軍六十月為任初刺同二都軍三刺同四從六副將軍以七品出職人充明昌元年以九十月為滿中都上京初從七二録事軍防判三入本門戶餘路初録事軍防判二上簿三入本門戶承安二年改司屬令作隨朝內侍御直內直六十四人正隆二年格長行人五十月遷一重女直人遷敦武餘人遷進義無出身大定二年格同上大定六年更定收補內侍格能誦一大經以論語孟子內能誦一書並善書札者月給奉八貫石稍識字能書者七貫石不識字六貫石泰和二年以參用外官失防微之道乃創寄祿官名以專任之既足以酬其勞而無侵官之弊凡宮中諸局分大定元年世宗謂諸局分承應人班俸給涉於太濫正隆時乃無出身涉於太刻又其官品不以勞逸為制遂命更定之大定六年諭有司曰宮中諸局分承應人有年滿數差使者往往苦於稽留而卒不得其差者復多不解文字而不幹故公私不便今後願出局者聽願留者各增其秩依舊承應其十人長雖老願留者亦增秩作長行承應餘依例放還七年詔宰臣曰女直人自來諸局分不經收充祗候可自今除太醫司天內侍外餘局分並令收充勾當護衛正隆二年格每三十月遷一重初考女直遷敦武餘遷保義百五十月出職與從五品以下從六品以上除大定二年格更為初遷忠勇百二十月出職大定十四年官制從下添兩重遂命女直初遷修武餘人敦武十八年制初除五品者次降除六品第三復除從五品初任六品者不降第四任始授從五品再勒留者各遷一官明昌元年資格初任不算資歷不勒留者初從六品二三皆同上第四任升從五勒留者初從五二三同上第四正五品再勒留者初正五品二同上三少尹四刺史明昌四年降作六品七品除貞祐制一考八品兩考除縣令三考正七品四考六品五年定一考者注上令兩考者一任正七品回降從七兩任正七回升六品三考者正七一任回再任正七升六品四考者三任六品升從五品符寶郎十二人正隆二年格皆同護衛出職與從七品除授大定二年格並同護衛十四年初收餘人遷進義二十一年英俊者與六品除常人止與七品除奉御十六人以內駙馬充舊名入寢殿小底大定十二年更今名正隆二年格同符寶郎大定二年出職從七品奉職三十人舊名不入寢殿小底又名外帳小底大定十二年更今名正隆二年格女直遷敦武餘人歷進義無出身大定二年格出職正班九品大定十四年定新官制從下添兩重女直初考進義餘人進義副尉十七年格有廕者初中簿二下簿無廕者注縣尉已後則依格明昌元年格有廕者每勒留一考則減一資二年以八品出職六年定格初録事軍防判正從八品丞二上簿三中簿四正從八品若不犯選格者則免此除五下令六七中令八上令勒留一考者升下令四五中令六上令回呈省勒留兩考者升上令二中令三四上令回呈省凡奉御奉職之出職大定十二年增為百五十月二十九年復舊承安四年復增東宮護衛正隆二年出職正班從八品大定二年正從七品初收女直遷敦武餘人保義閣門祗候正隆二年格女直初遷敦武餘人保義出職正班從八品大定二年格出職從七品八年定格初都軍二録事三軍防判四都軍五下令六中令七上令已帶明威者即與下令二録事軍防判三都軍四下令五中令六上令泰和四年格初都軍二録事軍防判三下令四中令五上令筆硯承奉舊名筆硯令史大定三年更為筆硯供奉後以避顯宗諱復更今名正隆二年女直人遷敦武餘歷進義無出身大定二年格初考女直遷敦武餘保義出職正班從七品吏格初都軍二三下令四五中令六上令妃護衛正隆二年格與奉職同大定二年出職與八品符寶典書四人舊名牌印令史以皇家袒免以上親有服外戚功臣子孫為之正隆二年格出職九品大定二十八年出職八品二上簿回驗官資注授尚衣承奉天德二年格以班內祗人選充大定三年女直人遷敦武餘人遷進義出職九品知把書畫十人正隆二年格與奉職同大定二年出職九品十四年格同奉職二十一年定格有廕者初中簿二軍器庫副後依本門戶差注無廕者與差使凡已上諸局分承應人正隆二年格有出身者皆以五十月為一考五考出職無出身者五十月止遷一官大定二年三年格皆三十月為考遷一重四考出職十二年復加為五考大定二十九年又為四考承安四年復為五考自大定十二年凡增考者惟護衛則否隨局內藏四庫本把二十八人正隆二年格同奉職大定二年格十人長每三十月遷一重四考出職九品長行每五十月遷一重初考女直敦武餘人進義轉十人長者其後依親軍例轉五十人長者以三十月遷加雖未至十人長而遷加至敦武者依本門戶出職十二年加為五考二十一年格與知把書畫同二十八年以合數監同人內從下選差明昌元年如八貫石本把闕六貫石局內選六年半於隨局承應人內選左右藏庫本把八人格同內藏大定二十九年設三十月遷一重百二十月出職儀鸞局本把大定二十七年三人明昌元年設十五人格比內藏本把尚食局本把四人大定二十八年設格同儀鸞尚輦局本把六人二十八年設格同儀鸞典客署書表十八人大定十二年以班內祗並終場舉人慎行止者試三國奉使接送禮儀並往復書表格同國史院書寫十四年以女直人識漢字班內祗一同試補大定二十四年終場舉人出職八品注上簿次下簿三任依本門戶明昌五年復許終場舉人材質端偉言語辨捷者與內班祗同試與正九除捧案八人大定十九年以已承三品官廕人命宣徽院揀試儀觀修整者格同尚衣承奉二十一年格同知把書畫擎執儤使大定四年以內職及承奉班內選明昌六年以皇家袒免以上親不足則於外戚並三品已上散官五品以上職事官應廕子孫弟兄姪以宣徽院選有德而美形貌者奉輦舊名拽輦兒大定二十九年更名格同擎執妃奉事舊名不入寢殿小底大定十一年又名妃奉職大定十八年更今名格同知把書畫東宮妃護衛十人大定十三年格同親王府祗候郎君二十八年有廕人與副巡檢譏察無廕人與司軍軍轄等除東宮入殿小底三十月遷一重初考女直人遷敦武餘人遷保義吏格有廕無廕其出職初八品二上簿三中簿四八品五下令六中令八上令回呈首東宮筆硯五十月遷一重百五十月出職正班九品無廕人差使有廕人大定二十一年格與二十一年知把書畫格同正班局分尚藥果子本把奉膳奉飲司儀鸞武庫本把掌器掌輦習騎羣子都管生料庫本把大定二十一年格有廕人知把書畫格同章宗大定二十九年諸局分長行並歷三百月十人長九十月出職雜班局分鷹坊子尚食局子果子子食庫車本把儀鸞典幄武庫槍寨司獸錢帛庫官旗鼓笛角唱曲子人弩手傘子貞元元年制弩手傘子尚局小底尚食局子並授府州作院都監大定二十九年長行三百月十人長九十月出職弩手傘子四百月出職其他局分若祕書監楷書及琴書阮象説話待詔尚局醫獸駝馬牛羊羣子酪人皆無出身侍衛親軍長行初收遷一重女直敦武餘人進義每五十月遷一重以次轉五十人長者則每三十月遷一重如五十人長內遷至武義者以五十人長本門戶出職五十人長每三十月遷一重六十月出職係正班與九品除授有廕者八品除授如轉百人長者則三十月遷一重六十月出職係正班八品有廕者七品大定六年百戶任滿有廕者注七品都軍正將無廕及五十戶有廕者注八品刺郡都巡檢副將五十戶無廕者及長行有廕者注縣尉無廕注散巡檢十六年有廕百戶初中令二都軍正將三四録事五下令六中令七上令回呈省無廕者初都軍正將二録事三四副將巡檢五都軍正將六下令七中令八上令回呈省此言識字者也不識字者初止縣尉次主簿二十一年有廕者初中簿二縣尉無廕者初縣尉二散巡檢已後依本門戶識字不識字並用差注二十九年定女直二百五十月出職餘三百月出職吏格先察可親民及不可者驗其資歷若已任回帶明威懷遠者驗資擬注拱衛直正隆名龍翔軍無出身大定二年改龍翔軍為拱衛司定格軍使什將長行每五十月遷一重女直人敦武餘人進義遷至指揮使則三十月出職遷一重係正班與諸司都監雖未至指揮使遷至武義出職係雜班與差使司天長行正隆二年定五十月遷一重女直敦武餘人進義無出身太醫格同貞元元年嘗罷去六十餘人正隆二年格五十月遷一重女直人敦武餘人進義無出身教坊正隆間有典城牧民者大定間罷遂定格同上
