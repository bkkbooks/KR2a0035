body:
  text: 金史卷一百八列傳第四十六胥鼎侯摯把胡魯師安石胥鼎字和之尚書右丞持國之子也大定二十八年擢進士第入官以能稱累遷大理丞承安二年持國卒去官四年尚書省起復為著作郎上曰鼎故家子其才如何宰臣奏曰為人甚幹濟上曰著作職閑緣今無他闕姑授之未幾遷右司郎中轉工部侍郎泰和六年鼎言急遞鋪轉送文檄之制上從之時以為便至寧初中都受兵由戶部尚書拜參知政事貞祐元年十一月出為泰定軍節度使兼兗州管內觀察使未赴改知大興府事兼中都路兵馬都總管二年正月鼎以在京貧民闕食者衆宜立法振救乃奏曰京師官民有能贍給貧人者宜計所贍遷官升職以勸奬之遂定權宜鬻恩例格如進官升職丁憂人許應舉求仕官監戶從良之類入粟草各有數全活甚衆四月拜尚書右丞仍兼知府事五月宣宗將南渡留為汾陽軍節度使兼汾州管內觀察使十一月改知平陽府事兼河東南路兵馬都總管權宣撫使三年四月建言利害十三事若積軍儲備黃河選官讞獄簡將練卒鈔法版籍之類上頗採用焉又言平陽歲再被兵人戶散亡樓櫓修繕未完衣甲器械極少庾廩無兩月食夏田已為兵蹂復不雨秋種未下雖有復業殘民皆老幼莫能耕種豈足徵求比聞北方劉伯林聚兵野狐嶺將深入平陽絳解河中遂抵河南戰禦有期儲積未備不速錯置實關社稷生靈大計乞降空名宣勅一千紫衣師德號度牒三千以補軍儲上曰鼎言是也有司其如數亟給之七月就拜本路宣撫使兼前職朝廷欲起代州戍兵五千鼎上言嶺外軍已皆南徙代為邊要正宜益兵保守今更損其力一朝兵至何以待之平陽以代為藩籬豈可撤去尚書省奏宜如所請詔從之又言近聞朝廷令臣清野切謂臣所部乃河東南路太原則北路也大兵若來必始於北故清野當先北而後南況北路禾稼早熟其野既清兵無所掠則勢當自止不然南路雖清而穀草委積於北是資兵而召之南也臣已移文北路宣撫司矣乞更詔諭之既而大兵果出境賜詔奬諭曰卿以文武之才膺兵民之寄往鎮方面式固邊防坐釋朕憂孰如卿力益懋忠勤之節以收綏靜之功仰副予心嗣有後寵尋以能設方略退兵進官一階十月鼎上言臣所將義軍皆從來背本趨末勇猛兇悍盜竊亡命之徒苟無訓練統攝官以制之則朋聚黨植無所不至乞許臣便宜置總領義軍使副及彈壓仍每五千人設訓練一員不惟預為防閑使有畏忌且令武藝精熟人各為用上從之四年正月大兵略霍吉隰三州已而步騎六萬圍平陽急攻者十餘日鼎遣兵屢却之且上言臣以便宜立官賞預張文牓招還脅從人七千有奇續至者又六千餘俱令復業竊謂凡被俘未歸者更宜多方招誘已歸者所居從便優加存恤無致失所制可二月拜樞密副使權尚書左丞行省于平陽時鼎方抗表求退上不許因進拜焉且遣近侍諭曰卿父子皆朕所知向卿執政時因有人言遂以河東事相委果能勉力以保無虞方國家多難非卿孰可倚者卿退易耳能勿慮社稷之計乎今特授卿是任咫尺防秋更宜悉意時河南粟麥不令興販渡河鼎上言曰河東多山險平時地利不遺夏秋荐熟猶常藉陝西河南通販物斛況今累值兵戎農民寖少且無雨雪闕食為甚又解州屯兵數多儲糧僅及一月伏見陝州大陽渡河中大慶渡皆邀阻粟麥不令過河臣恐軍民不安或生內患伏望朝廷聽其輸販以紓解州之急從之又言河東兵革之餘疲民稍復然丁牛既少莫能耕稼重以亢旱蝗螟而餽餉所須徵科頗急貧無依者俱已乏食富戶宿藏亦為盜發蓋絕無而僅有焉其憔悴亦已甚矣有司宜奉朝廷德意以謀安集而潞州帥府遣官於遼沁諸郡搜括餘粟懸重賞誘人告訐州縣憚帥府鞭箠械繫所在騷然甚可憐憫今大兵既去惟宜汰冗兵省浮費招集流亡勸督農事彼不是務而使瘡痍之民重罹茲苦是兵未來而先自弊也願朝廷亟止之如經費果闕以恩例勸民入粟不猶愈於強括乎又言霍州回牛鳳棲嶺諸戍卒幾四千今兵既去而農事方興臣乞量留偵候餘悉遣歸有警復徵既休民力且省縣官萬一兵來亦足禦遏舉一事而獲二利臣敢以為請詔趨行之又言河東兩路農民寖少而兵戍益多是以每歲糧儲常苦不繼臣切見潞州元帥府雖設鬻爵恩例然條目至少未盡勸誘之術故進獻者無幾宜增益其條如中都時仍許各路宣撫司俱得發賣庶幾多獲貯儲以濟不給於是尚書省更定制奏行焉又言交鈔貴於通流今諸路所造不敷所出苟不以術收之不無闕誤宜從行省行部量民力徵歛以裨軍用河中宣撫司亦以寶券所支已多民不貴乞驗民貧富徵之雖然陝西若一體徵收則彼中所有日湊于河東其與不歛何異又河北寶券以不許行于河南由是愈滯將誤軍儲而啟釁端時以河北寶券商旅仭販南渡致物價翔貴權限路分行用因鼎有言罷之又言比者朝廷命擇義軍為三等臣即檄所司而潞帥必蘭阿魯帶言自去歲初置帥府時已按閱本軍去其冗者部分既定上下既親故能所向成功此皆血戰之餘屢試可者且又父子兄弟自相赴援各顧其家心一而力齊勢不可離今必析之將互易而不相諳矣國家糧儲常恐不繼豈容僥冒但本府兵不至是耳況潞州北即為異境日常備戰事務方殷而分別如此彼居中下者皆將氣挫心懈而不可用慮恐因得測吾虛實且義軍率皆農民已各散歸田畝趨時力作若徵集之動經旬日農事廢而歲計失矣乞從本府所定無輕變易臣切是其言時阿魯帶奏亦至詔遂許之又言近偵知北兵駐同耀竊慮梗吾東西往來之路遂委河中經略使陀滿胡土門領軍赴援今兵勢將叩關矣前此臣嘗奏聞北兵非止欲攻河東陝西必將進取河南雖已移文陝州行院及陝西鄰境俱令設備恐未即遵行乞詔河南行院統軍司議所以禦備之策上以示尚書省宰臣奏兵已踰關惟宜嚴責所遣帥臣趨迎擊之及命鼎益兵渡河以掣其肘制可既而鼎聞大兵已越關乃急上章曰臣叨蒙國恩擢列樞府凡有戎事皆當任之今入河南將及畿甸豈可安據一方坐視朝廷之急而不思自奮以少寬陛下之憂乎去歲頒降聖訓以向者都城被圍四方無援為恨明勅將帥若京師有警即各提兵奔赴其或不至自有常刑臣已奉詔先遣潞州元帥左監軍必蘭阿魯帶領軍一萬孟州經略使徒單百家領兵五千由便道濟河以趨關陝臣將親率平陽精兵直抵京師與王師相合又奏曰京師去平陽千五百餘里儻俟朝廷之命方圖入援須三旬而後能至得無失其機耶臣以身先士卒倍道兼行矣上嘉其意詔樞府督軍應之初鼎以將率兵赴援京師奏乞委知平陽府事王質權元帥左監軍同知府事完顏僧家奴權右監軍以鎮守河東從之至是鼎拜尚書左丞兼樞密副使是時大兵已過陝州自關以西皆列營柵連亙數十里鼎慮近薄京畿遂以河東南路懷孟諸兵合萬五千由河中入援又遣遙授河中府判官僕散掃吾出領軍趨陝西倂力禦之且慮北兵河移檄絳解吉隰孟州經略司相與會兵以為夾攻之勢已而北兵果由三門集津北渡而去鼎復上言自兵興以來河北潰散軍兵流亡人戶及山西河東老幼俱徙河南在處僑居各無本業易至動搖竊慮有司妄分彼此或加迫遣以致不安今兵日益盛將及畿甸儻復誘此失職之衆使為鄉導或驅之攻城豈不益資其力乞朝廷遣官撫慰及令所司嚴為防閑庶幾不至生釁上從其計遣監察御史陳規等充安撫捕盜官巡行郡邑大兵還至平陽鼎遣兵拒戰不利乃去興定元年正月上命鼎選兵三萬五千付陀滿胡土門統之西征至是鼎馳奏以為非便略曰自北兵經過之後民食不給兵力未完若又出師非獨饋運為勞而民將流亡愈至失所或宋人乘隙而動復何以制之此繫國家社稷大計方今事勢止當禦備南邊西征未可議也遂止是月進拜平章政事封莘國公又上奏曰臣近遣太原汾嵐官軍以備西征而太原路元帥左監軍烏古論德升以狀白臣甚言其失計臣愚以為德升所言可取敢具以聞詔付尚書省議之語在德升傳三月鼎以祖父名章乞避職詔不從朝廷詔鼎舉兵伐宋且令勿復有言以沮成算鼎已分兵由秦鞏鳳翔三路並進乃上書曰竊懷愚懇不敢自默謹條利害以聞昔泰和間蓋嘗南伐時太平日久百姓富庶馬蕃軍銳所謂萬全之舉也然猶亟和以偃兵為務大安之後北兵大舉天下騷然者累年然軍馬氣勢視舊纔十一耳至于器械之屬亦多損弊民間差役重繁寖以疲乏而日勤師旅遠近動搖是未獲一敵而自害者衆其不可一也今歲西北二兵無入境之報此非有所憚而不敢也意者以去年北還姑自息養不然則別部相攻未暇及我如聞王師南征乘隙倂至雖有潼關大河之險殆不足恃則三面受敵者首尾莫救得無貽後悔乎其不可二也凡兵雄于天下者必其士馬精強器械犀利且出其不備而後能取勝也宋自泰和再修舊好練兵歭糧繕修營壘十年于茲矣又車駕至汴益近宋境彼必朝夕憂懼委曲為防況聞王師已出唐鄧必徙民渡江所在清野止留空城使我軍無所得徒自勞費果何益哉其不可三也宋我世讎比年非無恢復舊疆洗雪前之志特畏吾威力不能窺其虛實故未敢輕舉今我軍皆山西河北無依之人或招還逃軍脅從歸國大抵烏合之衆素非練習而遽使從戎豈能保其決勝哉雖得其城內無儲蓄亦何以守以不練烏合之軍深入敵境進不得食退無所掠將復遁逃嘯聚為腹心患其不可四也發兵進討欲因敵糧此事不可必者隨軍轉輸則又非民力所及沿邊人戶雖有產而賦役繁重不勝困憊又凡失業寓河南者類皆衣食不給貧窮之迫盜所由生如宋人陰為招募誘以厚利使為鄉導伺我不虞突而入寇則內有叛民外有勍敵未易圖之其不可五也今春事將興若進兵不還必違農時以誤防秋之用此社稷大計豈特疆埸利害而已哉其不可六也臣愚以為止當遴選材武將士分布近邊州郡敵至則追擊去則力田以廣儲蓄至于士氣益強民心益固國用豐饒自可恢廓先業成中興之功一區區之宋何足平乎詔付尚書省宰臣以為諸軍既進無復可議遂寢既而元帥承裔等取宋大散關上諭鼎曰所得大散關可保則保不可則焚毀而還於是鼎奏臣近遣官問諸帥臣皆曰散關至驀關諸隘其地遠甚中間堡壘相望如欲分屯非萬人不可而又有州虢縣所直數關宋兵皆固守如舊緩急有事當復分散關之兵餘衆數少必不能支而鳳翔隴亦無應援恐兩失之且比年以來民力困於調度今方春農事已急恐妨耕墾不若焚毀此關但屯邊隘以張其勢彼或來侵互相應援易為力也制可二年四月鼎乞致仕上遣近侍諭曰卿年既耄朕非不知然天下事方有次第卿舊人也姑宜勉力以終之鼎以宣宗多親細務非帝王體乃上奏曰天下之大萬機之衆錢穀之冗非九重所能兼則必付之有司天子操大綱責成功而已況今多故豈可躬親細務哉惟陛下委任大臣坐收成算則恢復之期不遠矣上覽其奏不悅謂宰臣曰朕惟恐有怠而鼎言如此何耶高琪奏曰聖主以宗廟社稷為心法上天行健之義憂勤庶政夙夜不遑乃太平之階也鼎言非是上喜之三年正月上言沿邊州府官既有減定資歷月日之格至于掌兵及守禦邊隘者征行暴露備歷艱險宜一體減免以示激勸從之二月上言近制軍前立功犯罪之人行省行院帥府不得輒行誅賞夫賞由中出則恩有所歸茲固至當至于部分犯罪主將不得施行則下無所畏而令莫得行矣宰臣難之上以問樞密院官對如鼎言乃下詔自今四品以下皆得裁決時元帥內族承裔移剌粘何伐宋所下城邑多所焚掠於是鼎上言承裔等奉詔宣揚國威所謂弔民伐罪者也今大軍已克武休將至興元興元乃漢中西蜀喉衿之地乞諭帥臣所得城邑姑無焚掠務慰撫之誠使一郡帖然秋毫不犯則其餘三十軍將不攻自下矣若拒王師乃宜有戮上甚是其言遂詔諭承裔鼎以年老屢上表求致仕上謂宰臣曰胥鼎以老求退朕觀其精力未衰已遣人往慰諭之鼎嘗薦把胡魯以為過己遠甚欲以自代胡魯固佳至于駕馭人材處決機務不及鼎多矣俄以伐宋有功遷官一階八月上言臣奉詔兼節制河東近晉安帥府令百里內止留桑棗果木餘皆伐之方今秋收乃為此舉以奪其事既不能禦敵而又害民非計也且一朝警急其所伐木豈能盡去使不資敵乎他木雖伐桑棗舍屋獨非木乎此殆徒勞臣已下帥府止之而左都監完顏閭山乃言嘗奉旨清野臣不知其可詔從鼎便宜規畫是時大元兵大舉入陝西鼎多料敵之策朝臣或中沮之上諭樞密院官曰胥鼎規畫必無謬誤自今卿等不須指授也尋又遣諭曰卿專制方面凡事得以從宜規畫又何必一一中覆徒為逗遛也四年進封溫國公致仕詔諭曰卿屢求退朕初不許者俟其安好復為朕用爾今從卿請仍可來居京師或有大事得就諮決也五年三月上遣近侍諭鼎及左丞賈益謙曰自去冬至今雨雪殊少民心不安軍用或闕為害甚重卿等皆名臣故老今當何以處之欲召赴尚書省會議恐與時相不合難於面折故令就第延問其悉意以陳毋有所隱元光元年五月上勅宰相曰前平章胥鼎左丞賈益謙工部尚書札里吉翰林學士孛迭皆致政老臣經練國事當邀赴省與議利害仍遣侍官分詣四人者諭意焉六月晉陽公郭文振奏河朔受兵有年矣向皆秋來春去今已盛暑不廻且不嗜戕殺恣民耕稼此殆不可測也樞府每檄臣會合府兵進戰蓋公府雖號分封力實單弱且不相統攝方自保不暇朝廷不即遣兵為援臣恐人心以謂舉棄河北甚非計也伏見前平章政事胥鼎才兼將相威望甚隆向行省河東人樂為用今雖致政精力未衰乞付重兵使總制公府同力戰禦庶幾人皆響應易為恢復惟陛下圖之明年宣宗崩哀宗即位正大二年起復拜平章政事進封英國公行尚書省于衞州鼎以衰病辭上諭曰卿向在河東朝廷倚重今河朔州郡多歸附須卿圖畫卿先朝大臣必濟吾事大河以北卿皆節制鼎乃力疾赴鎮來歸者益衆鼎病不能自持復申前請優詔不許三年復上章請老且舉朝賢練軍政者自代詔答曰卿往在河東殘破孤危殆不易保卿一至而定迄卿移鎮敵不復侵何乃過為嫌避且君臣均為一體朕待下亦豈自殊自外之語殆為過計況餘人才力孰可副卿者卿年高久勞於外朕豈不知但國家百年積累之基河朔億萬生靈之命卿當勉出壯圖同濟大事鼎奉詔惶懼不敢退是年七月薨鼎通達吏事有度量為政鎮靜所在無賢不肖皆得其歡心南渡以來書生鎮方面者惟鼎一人而已侯摯初名師尹避諱改今名字莘卿東阿人明昌二年進士入官慷慨有為承安間積遷山東路鹽使司判官泰和元年以課增四分特命遷官二階八年七月追官一階降授長武縣令初摯為戶部主事與王謙規措西北路軍儲以代張煒摯上章論本路財用不實至是降除焉貞祐初大兵圍燕都時摯為中都麴使請出募軍已而嬰城有功擢為右補闕二年正月詔摯與少府監丞李䄄秀分詣西山招撫宣宗南渡轉勸農副使提控紫荊等關俄遷行六部侍郎三年四月同簽樞密院阿勒根訛論等以謂今車駕駐南京河南兵不可易動且兵不在多以將為本侯摯有過人之才儻假以便宜之權使募兵轉糧事無不克可升為尚書以總制永錫慶壽兩軍於是以摯為太常卿行尚書六部事往來應給之摯遂上章言九事其一曰省部所以總天下之紀綱今隨路宣差便宜從宜往往不遵條格輒劄付六部及三品以下官其於紀綱豈不紊亂宜革其弊其二曰近置四帥府所統兵校不為不衆然而弗克取勝者蓋一處受敵餘徒傍觀未嘗發一卒以為援稍見小却則棄戈遁去此師老將怯故也將將之道惟陛下察之其三曰率兵禦寇督民運糧各有所職本不可以兼行而帥府每令雜進累遇寇至軍未戰而丁夫已遁行伍錯亂敗之由也夫前陣雖勝而後必更者恐為敵所料耳況不勝哉用兵尚變本無定形今乃因循不改覆轍臣雖素不知兵妄謂率由此失其四曰雄保安肅諸郡據白溝易水西山之固今多闕員又所任者皆柔懦不武宜亟選勇猛才幹者分典之其五曰漳水自衞至海宜沿流設備以固山東使力穡之民安服田畝其六曰近都州縣官吏往往逋逃蓋以往來敵中失身者多兼轉輸頻倂民力困弊應給不前復遭責罰秩滿乃與他處一體計資考實負其人乞詔有司優定等級以別異之其七曰兵威不振罪在將帥輕敵妄舉如近日李英為帥臨陣之際酒猶未醒是以取敗臣謂英既無功其濫注官爵並宜削奪其八曰大河之北民失稼穡官無俸給上下不安皆欲逃竄加以潰散軍卒還相剽掠以致平民愈不聊生宜優加矜恤亟招撫之其九曰從來掌兵者多用世襲之官此屬自幼驕惰不任勞苦且心膽懦怯何足倚辦宜選驍勇過人衆所推服者不考其素用之上略施行焉時元帥蒲察七斤以通州叛累遣諜者間摯摯恐為所陷上章自辯詔諭之曰卿朕素知豈容間耶其一意於職無以猜嫌自沮也八月權參知政事俄拜參知政事行尚書省于河北先是摯言河北東西兩路最為要地而真定守帥胡論出輒棄城南奔州縣危懼今防秋在邇甚為可憂臣願募兵與舊部西山忠義軍往安撫之制可故有是命十一月入見壬申遣祭河神于宜村十二月復行省于河北四年正月進拜尚書右丞嘗上言宜開沁水以便饋運至是詔有司開之是時河北大飢摯上言曰今河朔饑甚人至相食觀滄等州斗米銀十餘兩殍殣相屬伏見沿河上下許販粟北渡然每石官糴其八彼商人非有濟物之心也所以涉河往來者特利其厚息而已利既無有誰復為之是雖有濟物之名而實無所渡之物其與不渡何異昔春秋列國各列疆界然晉饑則秦輸之粟及秦饑晉閉之糴千古譏之況今天下一家河朔之民皆陛下赤子而遭罹兵革尤為可哀其忍坐視其死而不救歟人心惟危臣恐弄兵之徒得以藉口而起也願止其糴縱民輸販為便詔尚書省行之時紅襖賊數萬人入臨沂費縣之境官軍敗之生擒偽宣徽使李壽甫訊之則云其衆皆楊安兒劉二祖散亡之餘今復聚及六萬賊首郝定者兗州泗水人署置百官僭稱大漢皇帝已攻泰安滕兗單諸州及萊蕪新泰等十餘縣又破邳州碙子堌得船數百艘近遣人北構南連皆成約行將跨河為亂摯以其言聞于上且曰今邳滕之路不通恐實有此謀遂詔摯行省事于東平權本路兵馬都總管以招誘之若不從即率兵捕討興定元年四月濟南泰安滕兗等州土賊並起肆行剽掠摯遣提控遙授棣州防禦使完顏霆率兵討之前後斬首千餘招降偽元帥石花五夏全餘黨壯士二萬人老幼五萬口是年冬陞資德大夫兼三司使二年二月摯上言山東河北數罹兵亂遺民嗷嗷實可哀近朝廷遣官分往撫輯其惠大矣然臣忝預執政敢請繼行以宣布國家德信使疲瘵者得以少蘇是亦圖報之一也宰臣難之無何詔遣摯行省于河北兼行三司安撫事既行又上言曰臣近歷黃陵崗南岸多有貧乏老幼自陳本河北農民因敵驚擾故南遷以避今欲復歸本土及春耕種而河禁邀阻臣謂河禁本以防閑自北來者耳此乃由南而往安所容姦乞令有司驗實放渡詔付尚書省宰臣奏宜令樞府講究上曰民饑且死而尚為次第何耶其令速放之四月招撫副使黃摑阿魯荅破李全於密州初賊首李全據密州及膠西高密諸縣摯督兵討之會高密賊陳全等四人默白招撫副使黃摑阿魯荅願為內應阿魯荅乃遣提控朱琛率兵五百赴之時李全暨其黨于忙兒者皆在城中聞官軍且西來全潛逸去忙兒不知所為阿魯荅馳抵城下鼓譟逼之賊守陴者八百人皆下乞降餘賊四千出走進軍邀擊之斬首千級俘百餘人所獲軍實甚衆遂復其城是夜琛又用陳全計拔高密焉六月上遣諭摯曰卿勤勞王家不避患難身居相職而往來山堌水寨之間保庇農民收穫二麥忠恪之意朕所具知雖然大臣也防秋之際亦須擇安地而處不可墮其計中摯對曰臣蒙大恩死莫能報然承聖訓敢不奉行擬駐兵于長清縣之靈巖寺有屋三百餘間且連接泰安之天勝寨介於東平益都之間萬一兵來足相應援上恐分其兵糧乃詔權移邳州行省九月摯上言東平以東累經殘毀至于邳海尤甚海之民戶曾不滿百而屯軍五千邳戶僅及八百軍以萬計夫古之取兵以八家為率一家充軍七家給之猶有傷生廢業疲於道路之歎今兵多而民不足使蕭何劉晏復生亦無所施其術況於臣者何能為哉伏見邳海之間貧民失業者甚衆日食野菜無所依倚恐因而嘯聚以益敵勢乞募選為兵自十月給糧使充戍役至二月罷之人授地三十畝貸之種粒而驗所收穫量數取之逮秋復隸兵伍且戰且耕公私俱利亦望被俘之民易于招集也詔施行之是時樞密院以海州軍食不足艱于轉輸奏乞遷于內地詔問摯摯奏曰海州連山阻海與沂莒邳密皆邊隅衝要之地比年以來為賊淵藪者宋人資給之故若棄而他徙則直抵東平無非敵境地大氣增後難圖矣臣未見其可且朝廷所以欲遷者止慮糧儲不給耳臣請盡力規畫勸喻農民趨時耕種且令鹽易糧或置場宿遷以通商旅可不勞民力而辦仍擇沭陽之地可以為營屯者分兵護邏雖不遷無患也上是其言乃止十月先是邳州副提控王汝霖以州廩將乏扇其軍為山東東路轉運副使兼同知沂州防禦使程戩懼禍及己遂與同謀因結宋兵以為外應摯聞即遣兵捕之訊竟具伏汝霖及戩幷其黨彈壓崔榮副統韓松萬戶戚誼等皆就誅至是以聞三年七月設汴京東西南三路行三司詔摯居中總其事焉十月以𩹉城畢工遷官一階四年七月遷榮祿大夫致仕天興元年正月起復為大司農四月歸大司農印復致仕八月復起為平章政事封蕭國公行京東路尚書省事以軍三千護送就舟張家渡行至封丘敵兵覺不能進諸將卒謀倒戈南奔留數騎衞摯摯知其謀遂下馬坐語諸將曰敵兵環視進退在我汝曹不思持重吾寧死於汝曹之手不忍為亂兵所蹂以辱君父之命諸將諾而止得全師以還聞者壯之十一月復致仕居汴中有園亭蔡水濱日與耆舊讌飲及崔立以汴城降為大兵所殺摯為人威嚴御兵人莫敢犯在朝遇事敢言又喜薦士如張文舉雷淵麻九疇輩皆由摯進用南渡後宰執中人望最重把胡魯不詳其初起貞祐二年五月宣宗南遷由左諫議大夫擢為御前經歷官上面諭之曰此行軍馬朕自總之事有利害可因近侍局以聞三年十一月出為彰化軍節度使兼涇州管內觀察使四年五月改知京兆府事兼本路兵馬都總管充行省參議官興定元年三月授陝西路統軍使兼前職二年正月召為御史中丞三月上言國家取人惟進士之選為重不求備數務在得賢竊見今場會試考官取人泛濫非求賢之道也宜革其弊依大定舊制詔付尚書省集文資官雜議卒依泰和例行之是月拜參知政事六月詔權左副元帥與平章胥鼎同事防秋三年六月平涼等處地震胡魯因上言皇天不言以象告人災害之生必有其故乞明諭有司敬畏天戒上嘉納之遣右司諫郭著往閱其迹撫諭軍民焉四年四月權尚書右丞左副元帥行尚書省元帥府于京兆時陝西歲運糧以助關東民力寖困胡魯上言若以舟楫自渭入河順流而下庶可少紓民力從之時以為便五年正月朝議欲復取會州胡魯上言臣竊計之月當費米三萬石草九萬稱轉運丁夫不下十餘萬人使此城一月可拔其費已如此況未必耶臨洮路新遭劫掠瘡痍未復所須芻糧決不可辦雖復取之慶陽平涼鳳翔及邠涇寧原隴等州亦恐未能無闕今農事將興沿邊常費已不暇給豈可更調十餘萬人以餉此軍果欲行之則數郡春種盡廢矣政使此城必得不免留兵戍守是飛輓之役無時而已也止宜令承裔軍于定西鞏州之地護民耕稼俟敵意怠然後取之詔付省院曰其言甚當從之可也三月上言禦敵在乎強兵強兵在乎足食此當今急務也竊見自陝以西州郡置帥府者九其部衆率不過三四千而長校猥多虛糜廩給甚無謂也臣謂延安鳳翔鞏州邊隅重地固當仍舊德順平涼等處宜皆罷去河南行院帥府存沿邊並河者餘亦宜罷之制可是年十月西北兵三萬攻延安胡魯遣元帥完顏合達元帥納合買住禦之遂保延安先是胡魯以西北兵勢甚大屢請兵於朝上由是惡之元光元年正月遂罷參知政事以知河中府事權安撫使於是陝西西路轉運使夾谷德新上言曰臣伏見知河中府把胡魯廉直忠孝公家之利知無不為實朝廷之良臣也去歲兵入延安胡魯遣將調兵城賴以完不為無功今合達買住各授世封而胡魯改知河中府切謂方今用人之時使謀略之臣不獲展力緩急或失事機誠宜復行省之任使與承裔共守京兆令合達買住捍禦延安以藩衞河南則內外安矣不報六月召為大司農既至汴遂上言曰邇來羣盜擾攘侵及內地陳潁去京不及四百里民居稀闊農事半廢蔡息之間十去八九甫經大赦賊起益多動計數百驅牛焚舍恣行剽掠田穀雖熟莫敢穫者所在屯兵率無騎士比報至而賊已遁叢薄深惡復難追襲則徒形跡而已今向秋成奈何不為處置也八月復拜參知政事上謂之曰卿頃為大司農巡行郡縣盜賊如何可息對曰盜賊之多以賦役多也賦役省則盜賊息上曰朕固省之矣胡魯曰如行院帥府擾之何上曰司農官既兼採訪自今其令禁止之初胡魯拜命日巡護衞紹王宅都將把九斤來賀御史粘割阿里言九斤不當遊執政門胡魯亦不當受其賀請併案之於是詔諭曰卿昔行省陝西擅出繫囚此自人主當行非臣下可專人苟有言其罪豈特除名朕為卿地因而肆赦以弭衆口卿知之乎今九斤有職守且握兵柄而縱至門下法當責降朕重卿素有直氣故復曲留公家事但當履正而行要取人情何必爾也卿其戒之是年十二月進拜尚書右丞元光二年正月上諭宰臣曰陝右之兵將退當審後圖不然今秋又至矣右丞胡魯深悉彼中利害其與議之尋遣胡魯往陝西與行省賽不合達從宜規畫焉哀宗即位以有冊立功進拜平章政事正大元年四月薨詔加贈右丞相東平郡王胡魯為人忠實憂國奉公及亡朝廷公宰下迨吏民皆嗟惜之師安石字子安清州人本姓尹氏避國諱更焉承安五年詞賦進士為人輕財尚義初補尚書省令史適宣宗南遷留平章完顏承暉守燕都承暉將就死以遺表託安石使赴行在安石間道走汴以聞上嘉之擢為樞密院經歷官時哀宗在春宮領密院事遂見知遇元光二年累遷御史中丞其七月上章言備禦二事其一曰自古所以安國家息禍亂不過戰守避和四者而已為今之計守和為上所謂守者必求智謀之士使內足以得戍卒之心外足以挫敵人之銳不惟彼不能攻又可以伺其隙而敗之其所謂和則漢唐之君固嘗用此策矣豈獨今日不可用乎乞令有司詳議而行其二曰今敵中來歸者頗多宜豐其糧餉厚其接遇度彼果肯為我用則擇有心力者數十人潛往以誘致其餘來者既衆彼必轉相猜貳然後徐起而圖之則中興之功不遠矣上嘉納之九月坐劾英王守純附奏不實決杖追官及哀宗即位正大元年擢為同簽樞密院事二年復御史中丞三年工部尚書權左參政四年進尚書右丞五年臺諫劾近侍張文壽張仁壽李麟之安石亦論列三人不已上怒甚有旨謂安石曰汝便承取賢相朕為昏主止矣如是數百言安石驟蒙任用遽遭摧折疽發腦而死上甚悼惜之贊曰宣宗南遷天命去矣當是時雖有忠良之佐謀勇之將亦難為也然而汝礪行信拯救于內胥鼎侯摯守禦于外訖使宣宗得免亡國而哀宗復有十年之久人才有益于人國也若是哉胡魯養兵惜穀之論善矣安石不負承暉之託遂見知遇以論列近侍觸怒而死悲夫
