body:
  text: 金史卷一百十九列傳第五十七粘葛奴申劉天起附完顏婁室烏古論鎬張天綱完顏仲德粘葛奴申由任子入官或曰策論進士天興初倅開封府以嚴幹稱其年五月擢為陳州防禦使時兵戈搶攘道路不通奴申受命毅然策孤騎由間道以往陳自兵興軍民皆避遷他郡奴申為之擇官吏明號令完城郭立廬舍實倉釰備器械未幾聚流亡數十萬口米一斛直白金四兩市肆喧鬨如汴之闤闠京城危困之民望而歸者不絶遂指以為東南生路明年哀宗走歸德改陳州為金興軍馳使褒諭以奴申為節度使俄拜參知政事行尚書省于陳於是奴申立五都尉以將其兵建威來豬糞虎威蒲察合達振武李順兒振威王義果毅完顏某凡招撫司至者皆使隸都尉司是時交戰無虛日州所屯軍十萬有餘奴申與官屬謀曰大兵日至而吾州糧有盡奈何乃減軍所給月一斛五斗者作一斛又作八斗又作六斗將領則不給人心稍怨故李順兒崔都尉因而有異志劉提控及完顏不如哥提控者預焉奴申知其謀常以兵自防及聞大元兵往朱仙鎮市易奴申遣五都尉軍各二百人以李順兒副都尉崔某將之襲項城寨令孫鎮撫者召順兒議兵事孫至其家順兒已擐甲孫欲觀其刀順兒拔示之孫色動即出門奔去順兒追殺之乃上馬引兵二百人入省説軍士曰行省剋減軍糧汝輩欲飽食則從我不欲則從行省於是省中軍士皆坐不起奴申聞變走後堂追殺之提控劉某加害解其虎符以與順兒並殺其子姪壻及鄉人王都尉順兒令五都尉軍皆甲守街曲自稱行省署元帥都尉以劉提控語不順斬之坐中明日遂遣剋石烈正之送款于汴崔立乃遣其弟倚就加順兒淮陽軍節度使行省如故未幾虎威都尉蒲察合達與高元帥者盡殺順兒之徒舉城走蔡州大兵覺追及孫家林老幼數十萬少有脫者初奴申聞崔立之變遣人探其事情而順兒崔都尉亦密令人結構崔立適與奴申所遣者同往同還順兒懼其謀泄故發之益速奴申亦知其謀故遣襲項城欲因其行襲殺之然已為所先劉天起者起於匹夫初甚庸鄙汴京戒嚴嘗上書以干君相願暫假一職以自效每言戰國兵法平章白撒等信之令景德寺監造革車三千兩天興元年授都招撫使佩金符召見乞往陳州運糧上從之一時皆竊笑其僥幸及至陳行軍殊有方略每出戰數有功陳人甚倚重之順兒之變天起偃蹇不從為所殺同時一唐括招撫者亦不屈而死完顏婁室三人皆內族也時以其名同故各以長幼別之正大八年慶山奴棄京兆適鷹揚都尉大婁室運軍器至白鹿原遇大兵與戰兵刃既盡以絛繫掉金牌力戰而死九年正月大兵至襄城元帥中婁室小婁室以馬軍三千遇之於汝墳時大兵以三四十騎入襄城驅驛馬而出又入東營殺一千夫長金人始覺之兩婁室以正旦飲將校皆醉不能軍遂敗退走許州會中使召入京師天興二年正月河朔軍潰哀宗走歸德中婁室為北面總帥小婁室左翼元帥收潰卒及將軍夾谷九十奔蔡州蔡帥烏古論栲栳知其跋扈不納遂走息州息帥石抹九住納之時白華以上命送虎符於九住為息州行帥府事九住出近侍好自標致騶從盈路三人者妬之各以招集勤王軍士為名得五六百人州以甲仗給之久之漸生猜二九住亦招負販牙儈數百人為虎子軍夜則擐甲為備一日九住使一萬戶巡城三帥執而驅之使大呼云勿學我欲開西門反即斬之乃召九住九住欲不往懼州人及禍乃從三百卒以往三帥令甲士守街曲九住從者過處處執之九住獨入三帥問汝何為欲反九住曰我何緣反三帥怒欲殺者久之小婁室意稍解頗為救護得不殺使人鎖之以夾谷九十為帥兼權息州蔡帥栲栳聞九住為三帥所誣上奏辨之三帥亦捃托九住之過上聞朝廷主栲栳之辨且不直三帥六月赦至蔡栲栳懼九住為三帥所誅遣二卒馳送詔書於息及得免及上將幸蔡密召中婁室引兵來迓婁室遲疑久之乃率所招卒奉迎七月上遣近侍局使入息州括馬即召九住九住至與中婁室辨於上前時中婁室已授同簽樞密院事上不欲使之終訟乃罷九住帥職授戶部郎中以烏古論忽魯為息州刺史時有土豪劉禿兒馬安撫者自蔡朝還以軍儲不給叛入宋州之北關為所焚毀是時城中軍無幾日有叛去者且覘知宋人有窺息之意息帥懼上奏請益兵為備朝廷以參知政事抹撚兀典行省事于息州中婁室以同簽樞密院事為總帥小婁室以副點檢為元帥王進為彈壓帥夾谷九十為都尉以忠孝馬軍二百步軍五百屬之行省院於息將行上諭之曰北兵所以常取全勝者恃北方之馬力就中國之技巧耳我實難與之敵至於宋人何足道哉朕得甲士三千縱橫江淮間有餘力矣卿等勉之八月壬辰行省遣人奏中渡店之捷初兀典等赴息既至之夜潛遣忠孝軍百餘騎襲宋營於中渡我軍皆北語又散漫似之宋人望之駭愕奔潰斬獲甚衆復奏元帥張閏不遵約束失軍士乞正典刑婁室表閏無罪上遣人赦之比至已死獄中蓋閏為婁室腹心九住之獄皆閏發之兀典廉得其事因其失律而誅之也九月以忽魯退縮不能撫御民多叛去奪其職以夾谷九十權息州事十一月宋人以軍二萬來攻城中食盡乃和糴既而括之每石止留一斗並括金帛衣物城中皆無聊矣前兩月蔡州以軍護老幼萬口來就食北兵覺之追及於二十里之外至息者才十餘人至是蔡問不通行省及諸帥日以歌酒為事聲樂不絶下及軍士強娶寡婦幼女絶滅人理無所不至三年甲午正月蔡凶問至諸帥殺之以滅口然民間亦頗有知者初諸帥欲北降而遞相猜忌無敢先發者數日蔡信鬨然諸帥屏人聚議皆言送款南中為便時李裕為睦親府同僉桓端國信使下經歷官乃使送款于宋遂發喪設祭諡哀宗曰昭宗州民奉行省為領省丞相總帥左平章皆娶婦十三日舉城南遷宋人焚州樓櫓州人老幼渡淮南行入羅山委曲之信陽北兵見火起追及之無有免者且誅索行省已下官屬于宋宋人令官屬入城託以犒賞從萬戶以上六七百人皆殺之軍中亦有奪命死敵者宋人諭諸軍行省已下有罪已處置汝等就迷魂寨安屯遂以軍防之既而與北軍接南軍斂避一軍悉為所殺烏古論鎬本名栲栳東北路招討司人由護衛起身纍官慶陽總管天興初遷蔡息陳潁等州便宜總帥二年哀宗在歸德蒲察官奴國用安欲上幸海州未決會鎬餫米四百餘斛至歸德且請幸蔡上意遂決先遣直學士烏古論蒲鮮如蔡告蔡人以臨幸之意六月徵蔡息軍馬來迓以蔡重鎮且慮有不測詔鎬勿遠迎辛卯車駕發歸德時久雨朝士扈從者徒行泥水中掇青棗為糧數日足脛盡參政天綱亦然壬辰至亳上黃衣皂笠金兔鶻帶以青黃旗二導前黃傘擁後從者二三百人馬五十餘匹而已行次城中僧道父老拜伏道左上遣近侍諭以國家涵養汝輩百有餘年今朕無德令爾塗炭朕亦無足言者汝輩無忘祖宗之德可也皆呼萬歲泣下留一日進亳之南六十里避雨雙溝寺中蒿艾滿目無一人迹上太息曰生靈盡矣為之一慟是日小婁室自息來迓得馬二百己亥入蔡蔡之父老千人羅拜於道見上儀衛蕭條莫不感泣上亦歔欷者久之七月以鎬為御史大夫總帥如故初鎬守蔡門禁甚嚴男女樵采必以墨識其面人有以錢出者十取一分有半以贍軍上至蔡或言其非便即弛其禁時大兵去遠商販頗集小民鼓舞以為復見太平公私宿釀一日俱盡郾城土豪盧進殺其長吏自稱招撫使以前關陝帥府經歷范天保為副至是天保來見進麥三百石及獐鹿脯茶蜜等物遂賜進金牌加天保官自是進物者踵至既而遣內侍殿頭宋圭與鎬妻選室女備後宮已得數人右丞忽斜虎諫曰小民無知將謂陛下駐蹕以來不聞恢復遠略而先求處女以示久居民愚而神不可不畏上曰朕以六宮失散左右無人故令採擇今承規誨敢不敬從止留解文義者一人餘皆放遣是時從官近侍率皆窮乏悉取給於鎬鎬亦不能人滿其欲日夕交譖於上甚以尚食闕供為言上怒雖擢拜大夫而召見特疏小婁室之在息州也與石抹九住有隙怨鎬為九住辨曲直及上幸蔡婁室見於雙溝因厚誣鎬罪上頗信之鎬自知被讒憂憤鬱抑常稱疾在告會前參知政事石盞女魯歡姪大安來以女魯歡無反狀為官奴所殺白尚書省求改正尚書省以聞上曰朕嘗謂女魯歡反邪而無迹可尋謂不反邪朕方暴露遣人徵援兵彼留精鋭自防發其羸弱者以來既到睢陽彼厚自奉養使朕醯醬有闕朕為人君不當語此細事但四海郡縣孰非國家所有坐保一城臣子之分彼乃自負而有驕君上之心非反而何然朕方駕馭人材以濟艱難録功忘過此其時也其釐正之羣臣知上意之在鎬也數為右丞仲德言之仲德每見上必稱鎬功業宜令預參機務又薦以自代上怒少解及參政抹撚兀典行省息州鎬遂以御史大夫權參知政事九月大兵圍蔡鎬守南面忠孝軍元帥蔡八兒副之未幾城破被執以招息州不下殺之烏古論先生者本貴人家奴為全真師佯為狂態裸顛露足綴麻為衣人亦謂之麻帔先生宣宗嘗召入宮問以祕術因出入大長主家殊有穢迹上微聞之敕有司掩捕已逃去正大末從鎬來官汝南人皆知與其妻通而鎬不知生不自安求出鎬為營道宇親率僧道送使居之車駕將至蔡生欲遁無所往因自言能使軍士服氣不費糧右丞仲德知其妄乃奏欲如田單假神師退敵之意授一真人之號旋出奇計北兵信巫必駭異之或可以有成功參政天綱以為不可遂止復求入見言有詭計可以退敵及見長揖不拜且多大言欲出説大帥噴盞為脫身計時郎中移剌克忠員外郎王鶚具以向者麻帔為言上怒殺之贊曰晉劉越石長於撫納短於駕馭以故取敗粘葛奴申陳州之事殆類之矣三婁室皆金內族唯大婁室死得其所其兩婁室讒賊人也襄城事急醉不能軍乃逭一死金失政刑一至於是烏古論鎬幸蔡之請雖非至謀區區效忠以讒見忌哀宗之明蓋可知矣張天綱字正卿霸州益津人也至寧元年詞賦進士性寬厚端直論議醇正造次不少變纍官咸寧臨潼令入補尚書省令史拜監察御史以鯁直聞升戶部郎中權左右司員外郎哀宗東幸遷左右司郎中扈從至歸德改吏部侍郎知元帥官奴有反狀屢為上言之上不從官奴果變遂擢天綱權參知政事及從上遷蔡留亳州適軍變天綱以便宜授作亂者官州賴之以安及蔡轉御史中丞仍權參政扶溝縣招撫司知事劉昌祖上封事請大舉伐宋其略云官軍在前飢民在後南踐江淮西入巴蜀頗合上意上命天綱面詰其蘊藉召與語無可取者然重違上命且恐閉塞言路奏以為尚書省委差官護衛女奚烈完出近侍局直長粘合斜烈奉御陳謙權近侍局直長內族泰和四人以食不給出怨言乞往陳州就食天綱奏令監之出門任所往才出及汝南岸遇北兵皆見殺時人快之妖人烏古論先生者自言能使軍士服氣可不費糧右丞仲德援田單故事欲假其術以駭敵語在烏古論鎬傳上頗然之天綱力辨以為不可遂止且曰向非張天綱幾為此賊所誑軍吏石抹虎兒者求見仲德自謂有奇計退敵出馬面具如獅子狀而惡別制青麻布為足尾因言北兵所恃者馬而已欲制其人先制其馬如我軍進戰尋少却彼必來追我以馴騎百餘皆此狀仍繫大鈴于頸壯士乘之以突彼騎騎必驚逸我軍鼓譟繼其後此田單所以破燕也天綱曰不可彼衆我寡此不足恃縱使驚去安保其不復來乎恐徒費工物秪取敵人笑耳乃罷之蔡城破為宋將孟珙得之檻車械至臨安備禮告廟既而命臨安知府薛瓊問曰有何面目到此天綱對曰國之興亡何代無之我金之亡比汝二帝何如瓊大叱曰曳去明日遂奏其語宋主召問曰天綱真不畏死耶對曰大丈夫患死之不中節爾何畏之有因祈死不已宋主不聽初有司令供狀必欲書虜主天綱曰殺即殺焉用狀為有司不能屈聽其所供天綱但書故主而已聞者憐之後不知所終完顏仲德本名忽斜虎合懶路人少穎悟不羣讀書習策論有文武才初試補親衛軍雖備宿衛而學業不輟中泰和三年進士第歷仕州縣貞祐用兵辟充軍職嘗為大元兵所俘不踰年盡解其語尋率諸降人萬餘來歸宣宗召見奇之授邳州刺史兼從宜增築城壁匯水環之州由是可守哀宗即位遙授同知歸德府事同簽樞密院事行院於徐州徐州城東西北三面皆黃河而南獨平陸仲德疊石為基增城之半復浚隍引水為固民賴以安正大五年詔關陝以南行元帥府事以備小關及扇車回時北兵叩關仲德適與前帥奧屯阿里不酌酒更代而兵猝至遂驅而東阿里不素無守禦之策為有司所劾罪當死仲德上書引咎以謂北兵越關之際符印已交安得歸罪前帥臣請受戮上義之止杖阿里不而貰其死六年移知鞏昌府兼行總帥府事時陝西諸郡已殘仲德招集散亡得軍數萬依山為柵屯田積穀人多歸焉一方獨得小康號令明肅至路不拾遺八年四月詔授仲德鞏昌行省及虎符銀印天興元年九月拜工部尚書參知政事行尚書省事於陝州時兀典新敗陝州殘破仲德復立山寨安撫軍民會上以蠟丸書徵諸道兵入援行省院帥府往往觀望不進或中道遇兵而潰惟仲德提孤軍千人歷秦藍商鄧擷果菜為食間關百死至汴至之日適上東遷妻子在京師五年矣仲德不入其家趨見上於宋門問東幸之意知欲北渡力諫云北兵在河南而上遠徇河北萬一無功得完歸乎國之存亡在此一舉願加審察臣嘗屢遣人奏秦鞏之間山巖深固糧餉豐贍不若西幸依險固以居命帥臣分道出戰然後進取興元經略巴蜀此萬全策也上已與白撒議定不從然素重仲德且嘉其赴難進拜尚書省右丞兼樞密副使軍次黃陵岡二年正月車駕至歸德以仲德行尚書省于徐州既至遣人與國用安通問沛縣卓翼孫璧沖者初投用安用安封翼為東平郡王璧沖博平公升沛縣為源州已而翼璧沖來歸仲德畀之舊職令統河北諸寨行源州帥府事用安纍檄王德全入援不赴仲德至徐德全大恐求赴歸德仲德留之遣人納奏帖云徐州重地德全不宜離鎮仲德虛州廨不居亦無兵衛自防日以觀書為事而德全自疑益甚二月魚山總領張瓛作亂殺元帥完顏胡土降北仲德纍議討之德全不從即領麾下十許人親勸民兵得三百人徑往魚山而從宜巖祿已誅瓛反正仲德撫慰軍民而還有曹總領者盜御馬東行制旨諭行省討之仲德既殺賊德全欲功出己殺曹黨四十八人三月阿术魯攻蕭縣遊騎至徐德全馬悉為所邀仲德時往宿州德全以失馬故始議救蕭縣遣張元哥苗秀昌率騎八百以往未及交戰元哥退走北兵掩之皆為所擒殺之蕭縣遂破四月仲德陽以關糧往邳州州官出迎就執德全並其子殺之餘黨之外一無所問闔郡稱快初完顏胡土以遙授徐州節度往帥嚴祿軍於永州北保安鎮時祿已為從宜在碭山數年又得士心忽土到軍士不悅二月辛卯夜遂為總領張瓛崔振所害吏部郎中張敏修忽土下經歷官乃以軍變脅嚴祿降北祿佯應之陰召永州守陳立副招撫郭升會諸義軍赴保安鎮誅作亂者軍夜至祿遣敏修召瓛振計事二人不疑介胄而至及其黨與皆為祿所殺徐州去保安百里行省聞之來討會祿已反正乃以便宜授祿行元帥左都監就佩忽土虎符朝廷復授祿遙領歸德知府兼行帥府事未幾大元將阿术魯兵至保安祿夜遁後祿聞官奴變一軍頓徐宿間幾一月遂投漣水敏修入徐五月詔仲德赴行在時官奴已變官屬懼為所紿勸勿往仲德曰君父之命豈辨真偽耶死亦當行尋使者至果官奴之詐六月官奴誅詔仲德議遷蔡仲德雅欲奉上西幸因贊成之及蔡領省院事無巨細率親為之選士括馬繕治甲兵未嘗一日無西志近侍左右久困睢陽幸即汝陽之安皆娶妻營業不願遷徙日夕為上言西行不便未幾大兵梗路竟不果行仲德每深居燕坐瞑目太息以不得西遷為恨是月上至蔡命有司修見山亭及同知衙為遊息之所仲德諫曰自古人君遭難播越于外必痛自刻苦貶損然後可以克復舊物況今諸郡殘破保完者獨一蔡耳蔡之公廨固不及宮闕萬一方之野處露宿則有加矣且上初行幸已嘗勞民葺治今又興土木之役以求安逸恐人心解弛不足以濟大事上遽命止之七月定進馬遷賞格每甲馬一匹或二匹以上遷賞有差自是西山帥臣范真姬汝作等各以馬進凡得千餘匹以抹撚阿典領之又遣使分詣諸道徵兵赴蔡得精鋭萬人又以器甲不完命工部侍郎术甲咬住監督修繕不踰月告成軍威稍振扈從諸人苟一時之安遂以蔡為可守矣魯山元帥元志領軍千餘來援時諸帥往往擁兵自固志獨冒險數百里且戰且行比至蔡幾喪其半上表異之賜以大信牌升為總帥息州忠孝軍帥蔡八兒王山兒亦來援壬午忠孝軍提控李德率十餘人乘馬入省大呼以月糧不優幾於詈郎中移剌克忠白之仲德仲德大怒縛德堂下杖之六十上諭仲德曰此軍得力方欲倚用卿何不容忍責罰乃爾仲德曰時方多故録功隱過自陛下之德至于將帥之職則不然小犯則決大犯則誅強兵悍卒不可使一日不在紀律蓋小人之情縱則驕驕則難制睢陽之禍豈獨官奴之罪亦有司縱之太過耳今欲更易前轍不宜愛克厥威賞必由中罰則臣任其責軍士聞之至于國亡不敢有犯九月蔡城戒嚴行六部尚書蒲察世達以大兵將至請諭民並收晚田不及者踐毀之毋資敵制可丙辰詔裁冗員汰冗軍及定官吏軍兵月俸自宰執以下至于皂隸人月支六斗初有司定減糧人頗怨望上聞之欲分軍為三上軍月給八斗中七斗下六斗人復怨不均及立射格而上中軍輒多受賞連中者或面賜酒人益為勸且陰有所增而人不知仲德之謀也甲子分軍防守四面十月壬申朔大兵壕壘成耀兵城下旗幟蔽天城中駭懼及暮焚四關夷其牆而退十一月辛丑大兵以攻具傅城有司盡籍民丁防守不足則括婦女壯健者假男子衣冠使運木石蔡既受圍仲德營畫禦備未嘗一至其家拊存軍士無不得其歡心將校有戰亡者親為賻祭哭之盡哀己丑西城破城中前期築柵浚濠為備雖克之不能入也但於城上立柵南北相去百餘步而已仲德摘三面精鋭日夕戰禦終不能拔三年正月庚子朔大兵以正旦會飲鼓吹相接城中飢窘愁嘆而已圍城以來戰歿者四帥三都尉其餘總帥以下不可勝紀至是盡出禁近至於舍人牌印省部掾屬亦皆供役戊申大兵鑿西城為五門整軍以入督軍鏖戰及暮乃退聲言來日復集己酉大兵果復來仲德率精兵一千巷戰自卯及巳俄見子城火起聞上自縊謂將士曰吾君已崩吾何以戰為吾不能死於亂兵之手吾赴汝水從吾君矣諸君其善為計言訖赴水死將士皆曰相公能死吾輩獨不能耶於是參政孛术魯婁室兀林答胡土總帥元志元帥王山兒紇石烈柏壽烏古論桓端及軍士五百餘人皆從死焉仲德狀貌不踰常人平生喜怒未嘗妄發聞人過常護諱之雖在軍旅手不釋卷門生故吏每以名分教之家素貧敝衣糲食終其身晏如也雅好賓客及薦舉人材人有寸長極口稱道其掌軍務賞罰明信號令嚴整故所至軍民為用至危急死生之際無一士有異志者南渡以後將相文武忠亮始終無瑕仲德一人而已贊曰金之亡不可謂無人才也若完顏仲德張天綱豈非將相之器乎昔者智伯死又無後其臣豫讓不忘國士之報君子謂其無所為而為之真義士也金亡矣仲德天綱諸臣不變所守豈愧古義士哉
