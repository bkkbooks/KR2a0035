body:
  text: 金史卷十三本紀第十三衛紹王衛紹王諱永濟小字興勝更諱允濟章宗時避顯宗諱詔改允為永世宗第七子母曰元妃李氏衛王長身美髯鬚天資儉約不好華飾大定十一年封薛王是歲進封滕王十七年授世襲猛安二十五年加開府儀同三司二十六年為祕書監明年轉刑部尚書又明年改殿前都點檢二十九年世宗崩章宗即位進封潞王起復判安武軍節度使五月至冀州以到任表謝賜詔優答明昌二年進封韓王四年改判興平軍五年改沁南軍承安二年改封衛王三年改昭義軍泰和元年改判彰德府事五年改判平陽府初章宗誅鄭王永蹈趙王永中久頗悔之七年下詔追復舊封仍賜諡而永蹈無後乃以衛王子按陳為鄭王後賜衛王詔曰朕念鄭王自棄天常以干國憲藁瘞曠野忽諸不祀歷歲既久深用愴然親親之情有懷難置已詔追復舊爵改葬如儀稽考古禮以卿之子按陳為鄭王後謹其祭祀卿其悉之已而改武定軍節度使八年十一月自武定軍入朝是時章宗已感嗽疾衛王且辭行而章宗意留之章宗初年雅愛諸王置王傅府尉官以傅導德義及永中永蹈之誅由是疏忌宗室遂以王傅府尉檢制王家苛問嚴密門戶出入皆有籍而衛王乃永蹈母弟柔弱鮮智能故章宗愛之既無繼嗣而諸叔兄弟多在章宗皆不肯立惟欲立衛王故於辭行留之無何章宗大漸元妃李氏黃門李新喜平章政事完顏匡定策章宗崩匡等傳遺詔立衛王衛王固讓乃承詔舉哀即皇帝位于柩前明日羣臣朝見于大安殿詔路府州縣為大行皇帝服七日大安元年正月辛丑飛星如火起天市垣有尾跡若赤龍壬戌改元大赦立元妃徒單氏為皇后二月乙丑朔太白晝見經天壬辰章宗內人范氏損其遺腹以詔內外初章宗遺詔內人有娠者兩人生男則立為儲二至是平章政事僕散端等奏承御賈氏當以十一月免乳今則已出三月范氏産期合在正月醫稱胎氣有損用藥調治脉息雖和胎形已失范氏願削髮為尼封皇子六人為王三月甲辰道陵禮成大赦詔曰自今於朕名不連續及昶詠等字不須別改以平章政事僕散端為右丞相四月庚辰殺章宗元妃李氏及承御賈氏以平章政事完顏匡為尚書令五月高麗賀即位試宏詞科七月幸海王莊臨奠魯國公主八月萬秋節宋遣使來賀九月如大房山謁奠睿陵裕陵道陵百官表請建儲不允十月歲星犯左執法己卯詔戒勵風俗十一月平陽地震有聲如雷自西北來十二月詔平陽地震人戶三人死者免租稅一年二人及傷者免一年貧民死者給葬錢五千傷者三千尚書令申王完顏匡薨右丞相僕散端為左丞相進封兄郢王永功為譙王御史大夫張行簡為太保二年正月庚戌朔日中有流星出大如盆其色碧向西行漸如車輪尾長數丈沒于濁中至地復起光散如火二月客星入紫微垣光散為赤龍地大震有聲如雷以禮部侍郎耿端義為參知政事四月校大金儀禮北方有黑氣如大道東西亙天徐邳州河清五百餘里以告宗廟社稷五月詔儒臣編續資治通鑑六月大旱下詔罪己振貧民闕食者曲赦西京太原兩路雜犯死罪減一等徒以下免丙寅地震七月地震八月地震乙丑立子胙王從恪為皇太子萬秋節宋遣使來賀獵于近郊夏人侵葭州九月地大震乙未詔求直言招勇敢撫流亡庚子遣使慰撫宣德行省軍士丙午京師戒嚴上日出巡撫百官請視朝不允辛亥宣德行省罷癸丑詔撫諭中都西京清滄被兵民戶十一月獵于近郊中都大悲閣東渠內火自出逾旬乃滅閣南剎竿下石罅中火自出人近之即滅俄復出如是者復旬日中都火焮民居十二月乙卯朔日有食之是歲大饑禁百姓不得傳說邊事三年正月乙酉朔宋高麗夏遣使來賀熒惑入氐中二月熒惑犯房宿有大風從北來發屋折木通玄門重關折東華門重關折閏月熒惑犯鍵閉星三月大悲閣災延及民居有黑氣起北方廣長若大堤內有三白氣貫之如龍虎狀括民間馬令職官出馬有差四月我大元太祖法天啓運聖武皇帝來征遣西北路招討使粘合合打乞和平章政事獨吉千家奴參知政事胡沙行省事備邊西京留守紇石烈胡沙虎行樞密院事參知政事奧屯忠孝為尚書右丞戶部尚書梁𤨠為參知政事六月壬寅更定軍前賞罰格八月詔奬諭行省官慰撫軍士千家奴胡沙自撫州退軍駐于宣平河南大名路軍逃歸下詔招撫之九月千家奴胡沙敗績于會河堡居庸關失守禁男子不得輒出中都城門大元前軍至中都中都戒嚴參知政事梁𤨠鎮撫京城十月每夜初更正東西北天明如月初出經月乃滅熒惑犯壘壁陳上京留守徒單鎰遣同知烏古孫兀屯將兵二萬衛中都泰州刺史术虎高琪屯通玄門外上巡撫諸軍罷宣德行省十一月殺河南陳言人郝贊以上京留守徒單鎰為右丞相簽中都在城軍紇石烈胡沙虎棄西京走還京師即以為右副元帥權尚書左丞是時德興府弘州昌平懷來縉山豐潤密雲撫寧集寧東過平灤南至清滄由臨潢過遼河西南至欣代皆歸大元初徒單鎰請徙桓昌撫百姓入內地上信梁𤨠議以責鎰曰是自蹙境土也及大元已定三州上悔之至是鎰復請置行省事于東京備不虞上不悅曰無故遣大臣動搖人心未幾東京不守上乃大悔右副元帥胡沙虎請兵二萬屯宣德詔與三千人屯媯川平章政事千家奴參知政事胡沙坐覆全軍千家奴除名胡沙責授咸平路兵馬總管萬戶頭屯古北口十二月簽陝西兩路漢軍五千人赴中都太保張行簡左丞相僕散端宿禁中議軍事左丞相僕散端罷崇慶元年正月己酉朔改元赦宋夏遣使來賀右副元帥胡沙虎請退軍屯南口詔數其罪免之三月大旱遣使冊李遵頊為夏國王以御史大夫福興為參知政事參知政事孟鑄為御史大夫夏人犯葭州延安路兵馬總管完顏奴婢禦之五月簽陝西勇敢軍二萬人射糧軍一萬人赴中都括陝西馬安武軍節度使致仕賈鉉起復參知政事參知政事福興為尚書左丞詔賣空名敕牒河東陝西大饑斗米錢數千流莩滿野以南京留守僕散端為河南陝西安撫使提控軍馬七月有風自東來吹帛一段高數十丈飛動如龍形墜於拱辰門八月萬秋節以兵事不設宴十月曲赦西京遼東北京十一月賑河東南路南京路陝西東路山東西路衛州旱災十二月夏國王李遵頊謝封冊至寧元年正月賑河東陝西饑二月詔撫諭遼東知大名府事烏古論誼謀不軌伏誅三月太陰太白與日並見相去尺餘五月改元詔諭咸平路契丹部人之嘯聚者起胡沙虎復為右副元帥領武衛軍三千人屯通玄門外陝西大旱六月夏人犯保安州殺刺史犯慶陽府殺同知府事以戶部尚書胥鼎刑部尚書王維翰為參知政事八月尚書左丞完顏元奴將兵備邊詔軍官軍士賜賚有差大霧晝晦治中福海別將兵屯城北辛卯胡沙虎矯詔以誅反者招福海執而殺之奪其兵壬辰自通玄門入殺知大興府徒單南平刑部侍郎徒單沒撚於廣陽門西福海男符寶鄯陽都統石古乃率衆拒戰死之胡沙虎叩東華門遣人呼守直親軍百戶冬兒五十戶蒲察六斤不應許以世襲猛安三品官職亦不應都點檢徒單渭河縋而出護衛斜烈掊鎖啓門胡沙虎以兵入宮盡逐衛士代以其黨自稱監國都元帥癸巳逼上出宮以素車載至故邸以武衛軍二百人錮守之尚宮左夫人鄭氏為內職掌寶璽聞難端居璽所待變胡沙虎遣黃門入收璽鄭曰璽天子所用胡沙虎人臣取將何為黃門曰今天時大變主上猶且不保況璽乎御侍當思自脫計鄭厲聲罵曰若輩宮中近侍恩遇尤隆君難不以死報之反為逆竪奪璽耶我死可必璽必不與遂瞑目不語黃門出胡沙虎卒取宣命之寶僞除其黨醜奴為德州防禦使烏古論奪剌順天軍節度使提控宿直將軍徒單金壽永定軍節度使及其餘黨凡數十人皆遷官遂使宦者李思中害上於邸誘奉御和尚使作書急召其父左丞元奴議事元奴以軍來并其子皆殺之九月甲辰宣宗即位丁未詣邸臨奠伏哭盡哀敕以禮改葬胡沙虎請廢為庶人詔百官議于朝堂議者二百餘人太子少傅奧屯忠孝侍讀學士蒲察思忠請從廢黜戶部尚書武都拾遺田庭芳等三十人請降為王侯太子太保張行簡請用漢昌邑王晉海西公故事侍御史完顏訛出等十人請降復王封胡沙虎固執前議宣宗不得已乃降封東海郡侯昭雪道陵元妃李氏承御賈氏十月辛亥元帥右監軍术虎高琪殺胡沙虎于其第胡沙虎者紇石烈執中也宣宗乃下詔削其官爵贈石古乃順州刺史鄯陽順天軍節度副使凡從二人拒戰者千戶賞錢五百貫謀克三百貫蒲輦散軍二百貫各遷官兩階戰沒者贈賞付其家冬兒加龍虎衛上將軍再遷宿直將軍蒲蔡六斤加定遠大將軍武衛軍鈐轄石古乃子尚幼給俸八貫石敕有司俟其年十五以聞貞祐四年詔追復衛王諡曰紹贊曰衛紹王政亂於內兵敗於外其滅亡已有徵矣身弒國蹙記注亡失南遷後不復紀載皇朝中統三年翰林學士承旨王鶚有志論著求大安崇慶事不可得采托當時詔令故金部令史竇祥年八十九耳目聰明能記憶舊事從之得二十餘條司天提點張正之寫災異十六條張承旨家手本載舊事五條金禮部尚書楊雲翼日録四十條陳老日録三十條藏在史館條件雖多重復者三之二惟所載李妃完顏匡定策獨吉千家奴兵敗紇石烈執中作難及日食星變地震氛祲不相背盩今校其重出刪其繁雜章宗實録詳其前事宣宗實録詳其後事又於金掌奏目女官大明居士王氏所紀得資明夫人援璽一事附著于篇亦可以存其梗概云爾
