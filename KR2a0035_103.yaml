body:
  text: 金史卷一百三列傳第四十一完顏仲元完顏阿鄰完顏霆烏古論長壽完顏佐石抹仲溫烏古論禮蒲察阿里奧屯襄完顏蒲剌都夾谷石里哥术甲臣嘉紇石烈桓端完顏阿里不孫完顏鐵哥納蘭胡魯剌完顏仲元本姓郭氏中都人大安中李雄募兵仲元與完顏阿鄰俱應募數有功貞祐三年與阿鄰俱纍功至節度仲元為永定軍節度使賜姓完顏氏仲元在當時兵最強號花帽軍人呼為郭大相公以與阿鄰相別頃之兼本路宣撫使八月遙授知河間府事數月改知濟南府事權山東東路宣撫副使貞祐四年山東乏糧仲元軍三萬欲於黃河之側或陝右分屯上書乞補京官且言恢復河朔之策當詣闕面陳詔曰卿兄弟鳩集義旅所在立功忠義之誠皎然可見朕以參政侯摯與卿素厚命於彼中行省應悉朕心卿求入見其意固嘉東平方危正賴卿等相為聲援俟兵勢稍緩即徙軍附河屯駐此時卿來蓋未晚也尚思戮力朕不汝忘未幾改河北宣撫副使仲元部將李霆等積功至刺史提控仲元奏賜金牌霆等皆為名將功名與仲元相埒仲元屢有功以本職為從宜招撫使計約從坦等軍圖恢復詔以仲元軍猥多差為三等上等備征伐中下給戍守懦弱者皆罷去紅襖賊千餘人據漣水縣仲元遣提控婁室率兵擊破之斬首數百敗祝春擒郭偉餘衆奔潰遂復漣水縣仲元兼單州經略使婁室遷兩階升職一等未幾仲元遙授知歸德府事是歲十月徙軍盧氏改商州經略使權元帥右都監詔曰商虢潼關實相連屬卿思為萬全之計未幾潼關失守仲元軍趨商虢復至嵩汝皆弗及仲元上書曰去年六月臣嘗請於朝廷乞選名將督諸軍臣得推鋒身先士卒糧儲不繼竟不果行今將坐甲待敵則師老財殫日就困弊其大概欲伐西夏以張兵勢又曰陝西一路最為重地潼關禁坑及商州諸隘俱當預備向者中都居庸最為要害乃由小嶺紫荊繞出我軍腹背受兵卒不能守近日由禁坑出遂失潼關可選精兵分地戍之其後乃置秦藍守禦及用兵西夏矣興定元年復為單州經略使敗宋人二千于龜山復敗步騎千餘于盱眙敗紅襖于白里港獲老幼萬餘人皆縱遣之宋人圍海州仲元軍高橋令提控完顏阿鄰領騎繞出其後夾擊之宋兵解去賜金帶優詔奬諭紅襖賊陷曹馬城剽掠徐單之間提控高琬等分兵擊之俘生口二千三年仲元奏州城既固積糧二十萬石集鄉義軍萬餘人並間訓練足以守禦乞以所部渡河詔屯宿州與右都監紇石烈德同行帥府事仲元有足疾滿百日詔曰卿處置機務撫存將士出兵使李辛可也四年兼保靜軍節度使尋為勸農使五年為鎮南節度使元光元年知鳳翔府事鳳翔被圍左監軍石盞合喜來濟軍仲元讓合喜總兵事合喜曰公素得衆心不必以官位見讓仲元請身先士卒諭諸將士曰凡有奇功者即承制超擢及危急乃輒注四品以下顏盞蝦力戰功最輒授通遠軍節度使圍解奏請擅除拜之罪宣宗嘉其功皆許之遷元帥右監軍授河北東路洮委必剌猛安賜金五十兩重幣十五端通犀帶優詔褒諭正大間為兵部尚書皇太后衛尉卒仲元為將沈毅有謀南渡後最稱名將云完顏阿鄰本姓郭氏以功俱賜姓完顏大安中李雄募兵阿鄰與完顏仲元等俱應募數有功宣宗即位遷通州防禦使宣宗遷汴阿鄰改同知河間府事兼清州防禦使將所部兵駐清滄控扼山東遷橫海軍節度使賜以國姓阿鄰與山東路宣撫副使顏盞天澤不相能詔阿鄰當與天澤共濟國事無執偏見妄分彼此尋改泰定軍節度使山東西路宣撫使是時仲元亦積功勞知濟南府賜姓完顏與阿鄰俱加從宜招撫使詔書奬諭且令計約涿州刺史從坦等軍恢復中都於是仲元阿鄰部兵猥多詔以三等差第之上等備征伐中下戍守懦弱者罷去量給地以贍其家阿鄰所部黃鶴袖軍駐魚臺者桀驁不法掠平民劫商旅道路不通有司乞徙于滕州詔阿鄰就處置之頃之破紅襖賊郝定于泗水縣柘溝村生擒郝定送京師斬之近制賜本朝姓者凡以千人敗敵三千者賜及緦麻以上敗二千人以上者賜及大功以上敗千人以上者賜止其家阿鄰既賜姓以兄守楫及從父兄弟為請宰臣奏阿鄰功止賜一家宣宗特詔許之至是仲元上奏曰臣頃在軍旅才立微功遽蒙天恩賜之國姓非臣殺身所能仰報族兄徐州譏察副使僧喜前汾州酒同監三喜前解州鹽管勾添章守興平縣監酒添福猶姓郭氏念臣與僧喜等昔同一家今為兩族完顏阿鄰與臣同功皇恩所加並及本族僧喜等四人乞依此例不許改輝州經略使阿鄰有衆萬五千詔分五千隸東平行省其衆泣訴云我曹以國家多難奮義相從捐田宅離親戚轉戰至此誓同立功偕還鄉里今將分配他軍心實艱苦乞以全軍分駐懷衛輝州之間捍蔽大河惟受阿鄰節制阿鄰亦不欲分之因以為請宰臣奏若遂聽之非唯東平失備他將倣效皆不可使矣宣宗以為然加遙授知河南府事應援陝西阿鄰將兵八千西赴至潼關聞京兆已被圍遊騎至華州陝西行院欲令阿鄰駐軍商虢拒東向之路阿鄰上奏臣本援陝西遇難而止豈人臣之節夫自古用兵步騎相參乃可以得志今乃各有所屬臨難不救互分彼此今臣所統皆步卒願賜馬軍千人則京兆之圍不足解矣宣宗謂皇太子曰阿鄰赴難不回固善矣而軍勢單弱且駐內地以觀事變並以虢州兵五千付之使乘隙而進卿以此意諭之也興定元年遷元帥右都監出秦州伐宋宋統制吳筠守皂角角又作郊堡城三重據山之巔阿鄰分兵絶其汲路克其外城再克其次城宋兵縱火而出阿鄰以騎兵邀之遣步卒襲其後宋兵敗生獲吳筠及將校二百人馬數百匹糧萬石及兵甲衣襖復敗宋兵于裴家莊六谷中斬五百級墜澗死者甚衆又敗之于寒山嶺龍門關大石渡得粟二千餘石復敗之于稍子嶺斬首二千餘級生擒百人是時三月宿麥方滋阿鄰留兵守之已而宋兵大至金兵敗阿鄰戰沒贈金紫光祿大夫西京留守完顏霆本姓李氏中都寶坻人粗知書善騎射輕財好施得鄉曲之譽貞祐初縣人共推霆為四鄉部頭霆招集離散糾合義兵衆賴以安招撫司奏其事遷兩官霆與弟雲率衆數千巡邏固安永清間遙授寶坻縣丞充義軍都統劉璋説霆使出降霆縛送經略司遷三階攝寶坻令升都提控遙授同知通州軍州事中都食盡霆遣軍分護清滄河路召募賈船通餉道遙授同知清州防禦事從河北路宣撫使完顏仲元保清滄遙授通州刺史河北東路行軍提控佩金牌舊制宣撫副使乃佩金牌仲元奏臣軍三萬管軍官三人皆至五品乞各賜金牌廷議霆輩忠勇絶人遂與之改大名路提控復取玉田三河香河三縣徙屯濱棣淄留副將孫江守滄州江以滄州降于王楫而江將兵圍觀州霆乃詐作書與孫江約同取滄州者王楫得其書果疑孫江與霆有謀召江還殺之霆乃定觀州而還進官三階充濱棣行軍都提控未幾遙授同知益都府事加宣差都提控遷棣州防禦使賜姓完顏氏屯海州俄權單州經略司事充宣差總領都提控興定元年泰安滕兗土寇𧔧起東平行省侯摯遣霆率兵討之降石花五夏全餘黨二萬人老幼五萬口充權海州經略副使紅襖賊于忙兒寇海州霆擊走之二年宋高太尉兵三萬駐朐山霆軍乏糧采野菜麥苗雜食之宋兵柵朐山下隔湖港霆作港中暗橋遣萬戶胡仲圭副統劉贇率死士由暗橋登山霆率兵四千人趨山下約以昏時舉火為期上下夾擊宋兵大敗墜澗溺水死者不可勝計斬高太尉彭元帥于陳餘衆潰去遷安化軍節度使經略副使如故以其子為符寶典書逾月宋兵復至霆逆戰駐兵城外夜半宋人乘虛踰城而入經略使阿不罕奴失剌率兵戰都統溫迪罕五兒副統蒲察永成蒲察只魯身先士卒殺二百餘人城賴以完詔五兒等各遷兩階四年改集慶軍節度使兼同知歸德府事五年改定國軍節度使兼同知京兆府事擢其子為護衛元光元年陝西行省白撒奏京兆南山密邇宋境官民遷避其間者無慮百萬人可遣官鎮撫庶幾不生他變宣宗以為然十月霆以本官為安撫使守同知歸德府惟宏大司農丞郭皓為副使分護百姓之遷南山者元光二年卒烏古論長壽臨洮府第五將突門族人也本姓包氏襲父永本族都管泰和伐宋充緋翮翅軍千戶取川寨及祐州宕昌辛城子以功進官二階貞祐初夏人攻會州統軍使署征行萬戶升副統與夏人戰於窄土峽先登陷陳賞銀五十兩戰東關堡以功署都統兼充安定定西保川西寧軍馬都彈壓詔録前後功遙授同知隴州防禦事世襲本族都巡檢三年賜今姓攻蘭州程陳僧為先鋒都統夏人圍臨洮扼渭源堡內外不通統軍司募人偵候臨洮消息長壽應募馘二人擒一人問得臨洮及夏兵事勢以勞遷宣武將軍遙授通遠軍節度副使招降諸蕃族及熟羊寨秦州逋亡者復遷懷遠大將軍升提控興定元年夏人大入隴西長壽拒戰遷平涼府治中兼節度副使充宣差鞏州規措官頃之遙授同知鳳翔府事兼同知通遠軍節度事提控如故興定二年遷同知臨洮府事與提控洮州刺史納蘭記僧分兵伐宋長壽由鹽川鎮進兵宋人守戍者走保馬頭山合諸部族兵來拒長壽擊敗之復破其援兵四千於荔川寨即趨宕昌縣破宋兵二千于八斜谷拔宕昌縣進攻西和州先敗其州兵明日木波兵三千與宋兵合依川為陳長壽奮擊宋兵入保城堅壁不復出長壽乃還凡斬馘八千獲馬二百餘牛羊三萬器械軍實甚多納蘭記僧出洮州鐵城堡屢敗宋人完軍而還詔賞鳳翔秦鞏伐宋將士長壽遙授隴安軍節度使同知通遠軍提控如故頃之長壽升總領都提控改通遠軍節度使夏人攻定西是時弟世顯已降夏人夏人執世顯至定西城下謂長壽曰若不速降即殺汝弟長壽不顧奮戰夏兵退加榮祿大夫賜金二十五兩重幣三端世顯既降二子公政重壽當緣坐宣宗嘉長壽守定西功釋公政兄弟有司廩給之詔長壽曰汝久在戎行盡忠國事世顯之降必不得已汝永念國恩益思自效未幾夏人復攻會州行元帥府事石盞合喜發兵救未至夏人移兵臨洮長壽伏精兵五千于定西險要間敗夏兵三萬騎殺千餘人獲馬數百夏人已破西寧乃犯定西長壽擊却之斬首三百級既而三萬騎復至攻城甚急長壽乘城拒戰矢石如雨夏兵死者數千被創者衆乃解去是歲卒完顏佐本姓梁氏初為武清縣巡檢完顏咬住本姓李氏為柳口鎮巡檢久之以佐為都統咬住副之戍直沽寨貞祐二年辭軍遣張暉等三人來招佐佐執之翌日劉永昌率衆二十人持文書來署其年曰天賜佐擲之麾衆執永昌及暉等並斬之宣宗嘉其功遷佐奉國上將軍遙授德州防禦使咬住鎮國上將軍遙授同知河間府事皆賜姓完顏氏詔曰自今有忠義如是者並一體遷授贊曰古者天子胙土命氏漢以來乃有賜姓宣宗假以賞一時之功郭仲元郭阿鄰以功皆賜國姓女奚烈資祿烏古論長壽皆封疆之臣而賜以他姓貞祐以後賜姓有格夫以名使人用之貴則貴用之賤則賤使人計功而得國姓則以其貴者反賤矣完顏霆完顏佐皆賜國姓者並附于此石抹仲溫本名老斡懿州胡土虎猛安人充護衛十人長太子僕正除同知武寧軍節度使事宿直將軍器物局使坐前在武寧造馬鞍虧直章宗原之改左衛將軍遷左副點檢坐征契丹逗遛降蔡州防禦使復召為左副點檢遷知臨洮府事泰和伐宋青宜可內附進爵二級賜銀二百五十兩重幣十端詔曰青宜可之來乃汝管內與有勞焉比與青宜可相合其間諸事量宜而行頃之諸道進兵仲溫以隴右步騎五千出鹽川八年罷兵改知河中府崇慶初遷陝西統軍使貞祐二年宋人攻秦州仲溫率兵敗之尋充本路安撫使改鎮南軍節度使致仕興定三年卒烏古論禮本名六斤益都猛安人充習騎纍擢近侍局直長轉本局副使左衛副將軍坐受沁南軍節度使袞王永成名馬玉帶杖一百削官解職起為蒲速碗羣牧副使改武庫署令宿直將軍復為左衛副將軍順州刺史纍遷武寧軍節度泰和伐宋為山東路兵馬都統副使兼副統軍安化軍節度八年宋人請盟罷兵馬都統官仍以節度兼副統軍大安三年改知歸德府兼河南副統軍歷知河南府至寧初改知太原府事貞祐二年兼河東北路安撫使三年充本路宣撫使頃之兼左副元帥四年太原被圍未幾圍解進官二階興定三年卒蒲察阿里興州路人以廕補官充護衛十人長武器署令轉宿直將軍遷右衛副將軍宋兵犯分道鋪馳驛赴邊伺其入以伏兵掩之改提點器物局泰和伐宋從右副元帥匡為副統攻宜城縣取之八年以功遷武衛軍副都指揮使大安元年同知南京留守事徙壽州防禦使遷興平軍節度使崇慶初遷元帥右都監明年轉左都監時都城被圍道路梗塞阿里由太原至真定率師赴援抵中山不克進貞祐二年移駐大名徵河南鎮防軍圖再舉衆既憚于行而阿里遇之有厚薄軍變遇害衆因逃散宣宗詔元帥左都監完顏弼安集其軍赦首惡以下河南統軍司更加撫諭奧屯襄本名添壽上京路人大定十年襲猛安丞相襄舉通練邊事授崇義軍節度副使改烏古里辭詳穩召為都水少監石州刺史未幾為平南蕩江將軍以功升壽州防禦使遷河南路副統軍兼同知歸德府事昌武軍節度使仍兼副統軍崇慶改元為元帥左都監救西京至墨谷口一軍盡殪襄僅以身免坐是除名明年授上京兵馬使宣宗即位擢遼東路宣撫副使未幾改速頻路節度使兼同知上京留守事二年二月為元帥右都監行元帥府事于北京五月改留守兼前職俄遷宣撫使兼留守十一月詔諭襄及遼東路宣撫使蒲鮮萬奴宣差蒲察五斤曰上京遼東國家重地以卿等纍效忠勤故委腹心意其協力盡公以徇國家之急及詳來奏乃大不然朕將何賴自今每事同心並力備禦機會一失悔之何及且師克在和善鈞從衆尚懲前過以圖後功三年正月襄為北京宣差提控完顏習烈所害未幾習烈復為其下所殺詔曲赦北京完顏蒲剌都西南路按出灰必剌罕猛安人充護衛除泰定軍節度副使以憂去官起復唐古部族節度副使徙安國軍移辭詳穩纍官原州刺史坐買部內馬虧直奪官一階降北京兵馬都指揮使寧遠軍刺史歷同知臨洮府西京留守事崇慶元年遷震武軍節度備禦有功遷一官貞祐初置東西面經略司就充西面經略使上言管內大和嶺諸隘屯兵控制邊要行元帥府輒分臣兵萬二千戍真定餘衆不足守禦近日復簡精鋭二千七百人以往今見兵不滿萬老羸者十七八臣死固不足惜顧國家之事不可不慮新設經略移文西京太原河東取軍馬大數並稱非臣所統詔真定元帥府還其精鋭二千七百人西京太原嵐州有警急約為應援州郡皆不欲屬經略司遂罷經略官入為簽樞密院事改左副點檢四年遷兵部尚書興定元年致仕四年卒夾谷石里哥上京路猛安人明昌五年進士泰州防禦判官補尚書省令史歷臨潢婆速路都總管判官纍除刑部主事改薊州副提控駐軍大名俄遷翰林待制為宿州提控與山東宣撫完顏弼攻大沫堌賊衆千餘逆戰石里哥以騎兵擊之盡殪提控沒烈入自北門遂擒劉二祖以功遷武衛軍副都指揮使坐前在宿州掠良人為生口當死特詔決杖八十徙洺州防禦使山東路副統軍坐不時進兵往宿遷取妻子解職起為東平行軍提控興定元年破宋兵于宿州以功遙授安化軍節度使移定海軍卒术甲臣嘉北京路猛安人襲父謀克泰和伐宋隸陝西完顏綱麾下歷通州海州同知軍州事貞祐二年除武器署丞救集寧有功遷河南統軍判官拱衛直副都指揮使河南治中遙領綏州刺史兼延安治中就遷同知府事改同知河間府事興定元年行樞密院于壽州由壽泗渡淮伐宋二年二月破宋兵三千於漸湖灘斬三百級有詔蹂踐宋境上毋深入臣嘉駐霍丘楂岡村縱輕騎鈔掠焚毀積聚獲宋諜者張聰知宋兵二千屯高柳橋老幼甚衆其寨兩城環之以水臣嘉遣張聰持牒招之不從先令水軍徑渡攻之軍士牛青操戈刺門卒皆披靡散去遂登陴大軍繼之夷其寨而還遇宋兵數千於梅景村臣嘉伏兵林間以步卒誘致之伏發宋兵潰追奔十餘里生擒其將阮世安等五人獲器仗甚衆七月賞征南功升職一等遷元帥右都監充陝西行省參議官四年兼金安軍節度使五年改知延安府事轉左都監駐兵京兆元光元年卒紇石烈桓端西南路忽論宋割猛安人襲兄銀术可謀克泰和伐宋充行軍萬戶破宋兵二千於蔡州加宣武將軍自壽州渡淮敗宋步騎一萬五千于鷂子嶺遂克安豐軍軍還除同知懷遠軍節度事權木典辭詳穩大安三年西京行省選充合扎萬戶遙授同知清州防禦事改興平軍節度副使遙授顯德軍節度副使徙遼東路宣撫司都統敗移剌留哥萬五千衆于御河寨奪車數千兩降萬餘人加驃騎衛上將軍遙授同知順天軍節度事貞祐二年為宣差副提控同知婆速路兵馬都總管行府事貞祐三年蒲鮮萬奴取咸平東京瀋澄諸州及猛安謀克人亦多從之者三月萬奴步騎九千侵婆速近境桓端遣都統溫迪罕怕哥輦擊却之四月復掠上京城遣都統兀顏鉢轄拒戰萬奴別遣五千人攻望雲驛都統奧屯馬和尚擊之都統夾谷合打破其衆數千于三叉里五月都統溫迪罕福壽攻萬奴之衆于大寧鎮拔其壘其衆殲焉九月萬奴衆九千人出宜風及湯池桓端率兵與戰其衆潰去因招唵吉斡都麻渾賓哥出臺答愛顏哥不灰活拙按出孛德烈鄰十一猛安復來附擇其丁男補軍攻城邑之未下者貞祐四年桓端遣王汝弼由海道奏事宣宗嘉其功桓端遷遼海軍節度使同知行府事宣差提控如故婆速路溫甲海世襲猛安權同知府事溫迪罕哥不靄遷顯德軍節度使兼婆速府治中權判官前修起居注裴滿按帶遷兩階升二等王汝弼遷四階升四等餘將士有功者詔遼東宣撫承制遷賞是歲改邳州刺史充徐州界都提控紅襖賊數萬攻邳州桓端破之于黃山賊復來桓端薄其營走保北山追擊敗之溺沂水死者甚衆賊數萬圍沂州同知防禦事僕散撒合突圍出求救桓端率兵赴之撒合還入沂州與桓端內外夾擊之殺萬餘人賊乃去樞密副使僕散安貞上其功因奏曰桓端天資忠實深有計畫曉習軍事撒合勇而有謀皆得軍民心乞加擢用桓端進金紫光祿大夫兼同知武寧軍節度事提控如故召為勸農副使充都提控屯陳州興定元年自新息渡淮伐宋破中渡店至定城以少擊衆戰不留行未幾充宣差參議官復渡淮連破宋兵獲其將沈俊遷武衛軍副都指揮使宋人城守不出分兵攻其山寨水堡殺獲甚衆興定二年遷鎮南軍節度使權元帥右都監數月改武衛軍都指揮使仍權右都監行元帥府于息州徐州行樞密院石盞女魯歡剛愎自用詔桓端以本官權簽樞密院事往代之四年冬上言竊聞宋人與李全將並力來攻當預為之防樞密院奏可召桓端與朝臣面議尋有疾賜太醫御藥五年正月召至京師疾病不能入見力疾草奏大略以南北皆用兵當豫防其患及防河數策無何卒年四十五敕有司給喪事完顏阿里不孫字彥成曷懶路泰申必剌猛安人明昌五年進士調易州欣州軍事判官安豐縣令補尚書省令史除興平軍節度副使應奉翰林文字轉修撰充元帥左監軍紇石烈執中經歷官執中圍楚州縱兵大掠坐不諫正決杖五十大安初改戶部員外郎鈞州刺史執中行樞密院於西京復以為經歷官改威州刺史貞祐初纍遷國子祭酒歷越王濮王傅改同知平陽府事兼本路宣撫副使召為兵部侍郎遷翰林侍講學士改陝西路宣撫副使遷元帥左都監改河平軍節度使河北西路宣撫副使改御史中丞遼東宣撫副使再閲月權右副元帥參知政事遼東路行尚書省事賜御衣馬安山甲上京行省蒲察五斤奏其功賜金百兩絹百匹興定元年真拜參知政事權右副元帥行尚書省元帥府于婆速路承制除拜刺史以下不協是時蒲鮮萬奴據遼東侵掠婆速之境高麗畏其強助糧八萬石上京行省蒲察五斤入朝遼東兵勢愈弱五斤留江山守肇州江山亦頗懷去就及上京宣撫使蒲察移剌都改陝西行省參議官而伯德胡土遂有異志宣撫使海奴不迎制使坐而受詔阿里不孫械繫之頃之阿里不孫輒矯制大赦諸道衆乃稍安而請罪于朝初留哥據廣寧知廣寧府事溫迪罕青狗居蓋州妻子留廣寧與伯德胡土約為兄弟青狗兵隸阿里不孫內猜忌不協蒲察移剌都嘗奏青狗無隸阿里不孫宣宗乃召青狗青狗不受詔阿里不孫殺之胡土乃怨阿里不孫既而胡土率衆伐高麗乃以兵戕殺阿里不孫權左都監納坦裕與監軍溫迪罕哥不靄遙授東平判官參議軍事郭澍謀誅胡土未敢發會上京留守蒲察五斤遣副留守夾谷愛答左右司員外郎抹撚獨魯詣裕計事裕以謀告二人二人許諾遂召胡土至帳中殺之阿里不孫已死朝廷始得矯赦奏疏詔有司奬諭未幾聞阿里不孫死于亂詔贈平章政事芮國公納合裕真授左都監哥不靄進一階愛答獨魯郭澍遷官升職有差阿里不孫寬厚愛人敏於吏事能治劇要識者以為用之未盡云完顏鐵哥性淳直體貌雄偉粗通書年二十四襲父速頻路曷懶合打猛安授廣威將軍御下惠愛察廉除臨海軍節度副使改底剌辭詳穩丞相襄行省于北京鐵哥為先鋒萬戶有功丁母憂服除遷同知武勝軍節度使事充右副元帥完顏匡副統號平南蕩江將軍攻光化軍王統制以步騎出東門逆戰鐵哥擊却之拔鹿角奪門以入遂克之進攻襄陽為前驅獲生口知江渡可涉處陰植標以識之大軍至鐵哥導之濟屢戰皆捷以勞進官兩階匡圍德安鐵哥總領攻城築壘于德安南鳳凰臺並城作甬道立鵝車對樓攻之擊走張統制兵時暑還屯鄧州兵罷進官兩階遷同知臨潢府事改西南路副招討宿州防禦使貞祐二年樞密使徒單度移剌以鐵哥充都統入衛中都遷東北路招討使兼德昌軍節度使蒲鮮萬奴在咸平忌鐵哥兵強牒取所部騎兵二千又召泰州軍三千及戶口遷咸平鐵哥察其有異志不遣宣撫使承充召鐵哥赴上京命伐蒲與路既還適萬奴代承充為宣撫使托前不發軍罪下獄被害諡勇毅納蘭胡魯剌大名路怕魯歡猛安人性淳直寡言笑好讀書博通今古承安二年進士第一除應奉翰林文字被詔括牛于臨潢上京等路丞相襄有田在肇州家奴匿牛不以實聞即械繫正其罪而盡括之於是豪民皆懼無敢匿者使還襄稱其能居父喪盡禮御史舉其清節服除轉修撰平章政事僕散端舉廉能有文采遷同知順天軍節度使事從伐宋以勞加朝請大夫改禮部員外郎曹州刺史豪民僕散掃合立私渡於定陶間逃兵盜劫皆籍為囊橐纍政莫敢問胡魯剌捕治之窮竟其黨闔郡肅然改沃州改南京路按察副使貞祐二年改泗州防禦使召為吏部侍郎遷絳陽軍節度使權河東南路宣撫副使是時兵興胡魯剌完城郭繕器械料丁壯為鄉兵延問耆老招致儒士咨以備禦之策鹽米儲偫勸富民出粟郡賴以完賜詔褒諭加資善大夫官其次子吾申改權經略使被召以疾不能行卒于絳州贊曰泰和貞祐其間相去五年耳故將遺老往往在焉高琪得君宿將皆斥外矣高汝礪任職舊臣皆守藩矣假以重任其實疏之故石抹仲溫以下以見當時之將校焉
