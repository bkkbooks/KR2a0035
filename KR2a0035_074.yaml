body:
  text: 金史卷七十四列傳第十二宗翰本名粘罕子斜哥宗望本名斡離不子齊京文宗翰本名粘沒喝漢語訛為粘罕國相撒改之長子也年十七軍中服其勇及議伐遼宗翰與太祖意合太祖敗遼師于境上獲耶律謝十撒改使宗翰及完顏希尹來賀捷即稱帝為賀及太宗以下宗室羣臣皆勸進太祖猶謙讓宗翰與阿離合悶蒲家奴等進曰若不以時建號無以繫天下心太祖意乃決遼都統耶律訛里𩽆以二十餘萬戍邊太祖逆擊之宗翰為右軍大敗遼人于達魯古城天輔五年四月宗翰奏曰遼主失德中外離心我朝興師大業既定而根本弗除後必為患今乘其釁可襲取之天時人事不可失也太祖然之即命諸路戒備軍事五月戊戌射柳宴羣臣上顧謂宗翰曰今議西征汝前後計議多合朕意宗室中雖有長於汝者若謀元帥無以易汝汝當治兵以俟師期上親酌酒飲之且命之釂解御衣以衣之羣臣言時方暑月乃止無何為移賚勃極烈副蒲家奴西襲遼帝不果行十一月宗翰復請曰諸軍久駐人思自奮馬亦壯健宜乘此時進取中京羣臣言時方寒太祖不聽竟用宗翰策於是忽魯勃極烈杲都統內外諸軍蒲家奴宗翰宗幹宗磐副之宗峻領合扎猛安皆受金牌余睹為鄉導取中京實北京既克中京宗翰率偏師趨北安州與婁室徒單綽里合兵大敗奚王霞末北安遂降宗翰駐軍北安遣希尹經略近地獲遼護衛耶律習泥烈乃知遼主獵于鴛鴦濼殺其子晉王敖魯斡衆益離心西北西南兩路兵馬皆羸弱不可用宗翰使耨碗溫都移剌保報都統杲曰遼主窮迫於山西猶事畋獵不恤危亡自殺其子臣民失望攻取之策幸速見諭若有異議此當以偏師討之杲使奔睹與移剌保同來報曰頃奉詔旨不令便趨山西當審詳徐議當時宗翰使人報杲即整衆俟兵期及奔睹至知杲無意進取宗翰恐待杲約或失機會即決策進兵使移剌保復往報都統曰初受命雖未令便取山西亦許便宜從事遼人可取其勢已見一失機會後難圖矣今已進兵當與大軍會于何地幸以見報宗幹勸杲當如宗翰策杲意乃決約以奚王嶺會議宗翰至奚王嶺與都統杲會杲軍出青嶺宗翰軍出瓢嶺期于羊城濼會軍宗翰以精兵六千襲遼主聞遼主自五院司來拒戰宗翰倍道兼行一宿而至遼主遁去乃使希尹等追之西京復叛耿守忠以兵五千來救至城東四十里蒲察烏烈谷先擊之斬首千餘宗翰宗雄宗幹宗峻繼至宗翰率麾下自其中衝擊之使餘兵去馬從旁射之守忠敗走其衆殲焉宗翰弟扎保迪沒于陳天眷中贈扎保迪特進云宗翰已撫定西路州縣部族謁上于行在所遂從上取燕京燕京平賜宗翰希尹撻懶耶律余睹金器有差太祖既以燕京與宋人還軍次鴛鴦濼不豫將歸京師以宗翰為都統昃勃極烈昱迭勃極烈斡魯副之駐軍雲中太宗即位詔宗翰曰寄爾以方面當遷官資者以便宜除授因以空名宣頭百道給之宋人來請割諸城宗翰報以武朔二州宗翰請曰宋人不歸我叛亡阻絶燕山往來道路後必敗盟請勿割山西郡縣太宗曰先皇帝嘗許之矣當與之諸將獲耶律馬哥宗翰歸之京師詔以馬七百匹給宗翰軍以田種千石米七千石賑新附之民詔曰新附之民比及農時度地以居之宗翰請分宗望撻懶石古乃精兵討諸部詔曰宗望軍不可分別以精鋭五千給之宗翰朝太祖陵入見上奏曰先皇帝時山西南京諸部漢官軍帥皆得承制除授今南京皆循舊制惟山西優以朝命詔曰一用先皇帝燕京所降詔敕從事卿等度其勤力而遷授之宗翰復奏曰先皇帝征遼之初圖宋協力夾攻故許以燕地宋人既盟之後請加幣以求山西諸鎮先皇帝辭其加幣盟書曰無容匿逋逃誘擾邊民今宋數路招納叛亡厚以恩賞纍疏叛人姓名索之童貫嘗期以月日約以誓書一無所致盟未期年今已如此萬世守約其可望乎且西鄙未寧割付山西諸郡則諸軍失屯據之所將有經略或難持久請姑置勿割上悉如所請上以宗翰破遼經略夏國奉表稱藩深嘉其功以馬十匹使宗翰自擇二匹餘賜羣帥及斡魯奏宋不遣歲幣戶口事且將渝盟不可不備太宗命宗翰取諸路戶籍按籍索之而闍母再奏宋敗盟有狀宗翰宗望俱請伐宋於是諳班勃極烈杲領都元帥居京師宗翰為左副元帥自太原路伐宋宗翰發自河陰遂降朔州克代州圍太原府宋河東陝西軍四萬救太原敗于汾河之北殺萬餘人宗望自河北趨汴久不聞問遂留銀术可等圍太原宗翰率師而南天會四年降定諸縣及威勝軍下隆德府實潞州軍至澤州宋使至軍中始知割三鎮講和事路允迪以宋割太原詔書來太原人不受詔宗翰取文水及盂縣復留銀术可圍太原宗翰乃還山西宋少帝誘蕭仲恭貽書余睹以興復遼社稷以動之蕭仲恭獻其書詔復伐宋八月宗翰發自西京九月丙寅宗翰克太原執宋經略使張孝純等鶻沙虎取平遙降靈石介休孝義諸縣十一月甲子宗翰自太原趨汴降威勝軍克隆德府遂取澤州撒剌答等先已破天井關進逼河陽破宋兵萬人降其城宗翰攻懷州克之丁亥渡河閏月宗翰至汴與宗望會兵宋約畫河為界復請修好不克和丙辰銀术可等克汴州辛酉宋少帝詣軍前舍青城十二月癸亥少帝奏表降詔元帥府曰將帥士卒立功者第其功之高下遷賞之其殞身行陳沒於王事者厚恤其家賜贈官爵務從優厚使勗就軍中勞賜宗翰宗望使皆執其手以勞之五年四月以宋二主及其宗族四百七十餘人及圭璋寶印袞冕車輅祭器大樂靈臺圖書與大軍北還七月賜宗翰鐵券除反逆外餘皆不問賜與甚厚宗翰奏河北河東府鎮州縣請擇前資官良能者任之以安新民上遣耶律暉等從宗翰行詔黃龍府路南路東京路於所部各選如耶律暉者遣之宗翰遂趨洛陽宋董植以兵至鄭州鄭州人復叛宗翰使諸將擊董植軍復取鄭州遂遷洛陽襄陽潁昌汝鄭均房唐鄧陳蔡之民於河北而遣婁室平陝西州郡是時河東寇盜尚多宗翰乃分留將士夾河屯守而還師山西昏德公致書請立趙氏奉職修貢民心必喜萬世利也宗翰受其書而不答康王遣王師正奉表密以書招誘契丹漢人獲其書奏之太宗下詔伐康王河北諸將欲罷陝西兵併力南伐河東諸將不可曰陝西與西夏為鄰事重體大兵不可罷宗翰曰初與夏約夾攻宋人而夏人弗應而耶律大石在西北交通西夏吾舍陝西而會師河北彼必謂我有急難河北不足虞宜先事陝西略定五路既弱西夏然後取宋宗翰蓋有意于夏人也議久不決奏請于上上曰康王構當窮其所往而追之俟平宋當立藩輔如張邦昌者陝右之地亦未可置而不取於是婁室蒲察帥師繩果婆盧火監戰平陝西銀术可守太原耶律余睹留西京宗翰會東軍于黎陽津遂會睿宗于濮進兵至東平宋知府權邦彥棄家宵遁降其城駐軍東平東南五十里復取徐州先是宋人運江淮金幣皆在徐州官庫盡得之分給諸軍襲慶府來降宋知濟南府劉豫以城降于撻懶乃遣拔離速烏林答泰欲馬五襲康王于揚州未至百五十里馬五以五百騎先馳至揚州城下康王聞兵來已於前一夕渡江矣於是康王以書請存趙氏社稷先是康王嘗致書元帥府稱大宋皇帝構致書大金元帥帳前至是乃貶去大號自稱宋康王趙構謹致書元帥閣下其四月七月兩書皆然元帥府答其書招之使降於是撻懶宗弼拔離速馬五等分道南伐宗弼之軍渡江取建康入于杭州康王入海阿里蒲盧渾等自明州行海三百里追之弗及宗弼乃還其後宗翰欲用徐文策伐江南睿宗宗弼議不合乃止語在劉豫傳歸德叛都統大辭里平之初太宗以斜也為諳班勃極烈天會八年斜也薨久虛此位而熙宗宗峻子太祖嫡孫宗幹等不以言太宗而太宗亦無立熙宗意宗翰朝京師謂宗幹曰儲嗣虛位頗久合剌先帝嫡孫當立不早定之恐授非其人宗翰日夜未嘗忘此遂與宗幹希尹定議入言於太宗請之再三太宗以宗翰等皆大臣義不可奪乃從之遂立熙宗為諳班勃極烈於是宗翰為國論右勃極烈兼都元帥熙宗即位拜太保尚書令領三省事封晉國王乞致仕詔不許天會十四年薨年五十八追封周宋國王正隆二年例封金源郡王大定間改贈秦王諡桓忠配享太祖廟廷孫秉德斜哥秉德別有傳斜哥纍官同知曷蘇館節度使事大定初除刑部侍郎充都統與副統完顏布輝自東京先赴中都輒署置官吏私用官中財物世宗至中都事覺斜哥當死布輝當除名詔寬減斜哥除名布輝削兩階解職二年起為大宗正丞除祁州刺史坐贓枉法當死詔杖一百五十除名遣左衛將軍夾谷查剌諭斜哥曰卿何面目至鄉中與宗族相見今徙鄜州以家人自隨俟汝身死聽家人從便久之起同知興中尹遷唐括部族節度使歷開遠順義軍斜哥前在雲內受贓御史臺劾奏上謂宰臣曰斜哥今三犯矣蓋其資質鄙惡如此令強幹吏鞫之獄成法當死上曰斜哥祖父秦王宗翰有大功特免死杖一百五十除名久之復起為勸農副使贊曰宗翰內能謀國外能謀敵決策制勝有古名將之風臨潢既捷諸將皆有怠忽之心而請伐不已越千里以襲遼主諸將皆有畏顧之心而請期不已觀其欲置江淮專事陝服當時無有能識其意者甫釋干戈斂袵歸朝以定熙宗之位精誠之發孰可掩哉宗望本名斡魯補又作斡離不太祖第二子也每從太祖征伐常在左右都統杲已克中京宗翰在北安州獲遼護衛習泥烈知遼主在鴛鴦濼宗翰請襲之杲出青嶺遼兵三百餘掠降人家資宗望曰若生致此輩可審得遼主所在虛實遂與宗弼率百騎進騎多罷乏獨與馬和尚逐越盧孛古野里斯等留一騎趣後軍即馳擊敗之生擒五人因審遼主尚在鴛鴦濼未去無疑也於是進兵宗翰倍道兼行追遼主于五院司不及婁室等追之至白水濼遼主走陰山遼秦晉國王捏里自立于燕京新降州部人心不固杲使宗望請太祖臨軍宗望至京師百官入賀上曰宗望與十餘騎經涉兵寇數千里可嘉也上宴羣臣歡甚宗望奏曰今雲中新定諸路遼兵尚數萬遼主尚在陰山天德之間而捏里自立于燕京新降之民其心未固是以諸將望陛下幸軍中也上曰懸軍遠伐授以成算豈能盡合機事朕以六月朔啓行既次大濼西南杲使希尹奏請徙西南招討司諸部于內地上顧謂羣臣曰徙諸部人當出何路宗望對曰中京殘弊芻糧不給由上京為宜然新降之人遽爾騷動未降者必皆疑懼勞師害人所失多矣上京謂臨潢府也上乃下其議命軍帥度宜行之上聞遼主在大魚濼自將精兵萬人襲之蒲家奴宗望率兵四千為前鋒晝夜兼行馬多乏追及遼主于石輦驛軍士至者才千人遼軍餘二萬五千方治營壘蒲家奴與諸將議余睹曰我軍未集人馬疲劇未可戰宗望曰今追及遼主而不亟戰日入而遁則無及遂戰短兵接遼兵圍之數重士皆殊死戰遼主謂宗望兵少必敗遂與嬪御皆自高阜下平地觀戰余睹示諸將曰此遼主麾蓋也若萃而薄之可以得志騎兵馳赴之遼主望見大驚即遁去遼兵遂潰宗望等還上曰遼主去不遠亟追之宗望以騎兵千餘追之蒲家奴為後繼太祖已定燕京斡魯為都統宗望副之襲遼主于陰山青冢之間宗望婁室銀术可以三千軍分路襲之將至青冢遇泥濘衆不能進宗望與當海四騎以繩繫遼都統林牙大石使為鄉導直至遼主營時遼主往應州其嬪御諸女見敵兵奄至驚駭欲奔命騎下執之有頃後軍至遼太叔胡盧瓦妃國王捏里次妃遼漢夫人並其子秦王許王女骨欲餘里衍斡里衍大奧野次奧野趙王妃斡里衍招討迪六詳穩六斤節度使孛迭赤狗兒皆降得車萬餘乘惟梁王雅里及其長女乘軍亂亡去婁室銀术可獲其左右輿帳進至掃里門為書以招遼主遼主自金城來知其族屬皆見俘率兵五千餘決戰宗望以千兵擊敗之遼主相去百步遁去獲其子趙王習泥烈及傳國璽追二十餘里盡得其從馬而照里特末胡巴魯背答別獲牧馬萬四千匹車八千乘及獻傳國璽于行在太祖曰此羣臣之功也遂置璽于懷中東面恭謝天地乃大録諸帥功加賞焉遼主乃使謀盧瓦持兔鈕金印請降宗望受之視其文乃元帥燕國王之印也宗望復以書招之諭以石晉北遷事遂使使諭夏國示以和好所以沮疑其救遼之心也宗望趨天德遼耶律慎思降及候人吳十回皆言夏國迎護遼主度大河矣宗望乃傳檄夏國曰果欲附我當如前諭執送遼主若猶疑二恐有後悔及遼秦王等以俘見太祖太祖嘉宗望功以遼蜀國公主餘里衍賜之闍母與張覺戰大敗於兔耳山上使宗望問狀就以闍母軍討張覺降瀕海郡縣遂與覺戰于南京城東覺敗宵遁奔宋語在覺傳城中人執覺父及其二子來獻宗望殺之使以詔書宣諭城中張敦固等出降使使與敦固俱入城收兵仗城中人殺使者立敦固為都統草疏府庫掠居民乘城拒守太宗賞破張覺功及有功將士各有差初張覺奔宋入于燕京宗望責宋人納叛人且徵軍糧久不聞問宗望欲移書督之請空名宣頭千道增信牌安撫新降之民詔以新附長吏職員仍舊已命諸路轉輸軍糧勿督於宋給銀牌十空名宣頭五十道及遷潤來隰四州人徙于瀋州者俟畢農各復其業乃詔咸州輸粟宗望軍張敦固以兵八千分四隊出戰大敗宗望再三開諭敦固等曰屢嘗拒戰不敢遽降宗望許其望闕遙拜敦固乃開其一門宗望使闍母奏其事乃下詔赦南京官民大小罪皆釋之官職如舊別敕有司輕徭賦勸稼穡疆埸之事一決於宗望又曰議索張覺及逋亡戶口於宋聞比歲不登若如舊徵斂恐民匱乏度其糧數賦之射糧軍願為民者使復田里小大之事關白軍帥無得專達朝廷詔宗望曰選勳賢及有民望者為南京留守及諸闕員仍具姓名官階以聞是時遷潤來隰四州之民保山寨者甚衆宗望乞選良吏招撫上從之上召宗望赴闕而闍母克南京兵執偽都統張敦固殺之南京平赴京師於是宗翰請無割山西地與宋斡魯亦言之闍母論奏宋渝盟有驗不可不備及宗望還軍上曰徵歲幣於宋以銀二十萬兩絹三十萬匹分賜爾軍及六部東京諸軍宗望至軍宋兵三千自海道來破九寨殺馬城縣戍將節度使度盧斡取其銀牌兵仗及馬而去宗望索戶口宋人弗遣且聞童貫郭藥師治軍燕山宗望奏請伐宋曰苟不先之恐為後患宗翰亦以為言故伐宋之策宗望實啓之宗望為南京路都統闍母副之自燕山路伐宋宗望奏曰闍母於臣為叔父請以闍母為都統臣監戰事上從之以宗望監闍母劉彥宗兩軍戰事宗望至三河破郭藥師兵四萬五千于白河蒲莧敗宋兵三千于古北口郭藥師降遂取燕山府盡收其軍實馬萬匹甲胄五萬兵七萬州縣悉平宋中山戍將王彥劉璧率兵二千來降蒲察繩果以三百騎遇中山三萬人於厄隘之地力戰死之术烈速活里改軍繼至殺二萬餘人宗望破宋真定兵五千人遂克信德府次邯鄲宋李鄴請修舊好宗望留軍中不遣自郭藥師降益知宋之虛實宗望請以為燕京留守及董才降益知宋之地里宗望請任以軍事太宗俱賜姓完顏氏皆給以金牌四年正月己巳諸軍渡河取滑州使吳孝民入汴以詔書問納平州張覺事令執送童貫談稹詹度以黃河為界納質奉貢癸酉諸軍圍汴宋少帝請為伯姪國效質納地增歲幣請和遂割太原中山河間三鎮書用伯姪禮以康王構太宰張邦昌為質沈晦以誓書三鎮地圖至軍中歲幣割地一依定約語在宋事中二月丁酉朔與宋平退軍孟陽是夜姚平仲兵四十萬來襲候騎覺之分遣諸將迎擊大破平仲軍復進攻汴城問舉兵之狀少帝大恐使宇文虛中來辨曰初不知其事且將加罪其人宗望輟弗攻改肅王樞為質康王構遣歸師還河北兩鎮不下遂分兵討之宗望罷常勝軍給還燕人田業命將士分屯安肅雄霸廣信之境宗望還山西未幾為右副元帥有功將士遷賞有差頃之宋少帝以書誘余睹蕭仲恭獻其書詔復伐宋八月宗望會諸將發自保州耶律鐸破敵兵三萬于雄州殺萬餘人那野敗宋軍七千於中山高六董才破宋兵三千於廣信宋种師閔軍四萬人駐井陘宗望大破之遂取天威軍東還遂克真定殺知府李邈得戶三萬降五縣遂自真定趨汴十一月戊辰宗望至河上降魏縣諸軍渡河留諸將分出大名之境降臨河縣至大名縣德清軍開德府皆克之阿里刮以騎兵三千先趨汴破宋軍六千于路取胙城抵汴城下覆宋兵千人擒數將宗望至汴分遣諸將遏宋援兵奔睹那野賽剌臺實連破宋援兵閏月壬辰朔宋兵一萬出自汴城來戰宗望選徑勇五千使當海忽魯雛鶻失擊敗之癸巳宗翰自太原會軍于汴丙辰克汴州辛酉宋少帝詣軍前十二月癸亥宋帝奉表降上使勗就軍中勞賜宗翰宗望使皆執其手以勞之五年四月以宋二主及其宗族四百七十餘人及圭璋寶印袞冕車輅祭器大樂靈臺圖書與大軍北還宗望乃分諸將鎮守河北董才降廣信軍及旁近縣鎮宗望乃西上涼陘詔宗望曰自河之北今既分畫重念其民見城邑有被殘者遂阻命堅守其申諭招輯安全之儻堅執不移自當致討若諸軍敢利於俘掠輒肆毀蕩者當底於罰是月宗望薨天會十三年封魏王皇統三年進許國王又徙封晉國王天德二年贈太師加遼燕國王配享太宗廟廷正隆二年例降封大定三年改封宋王諡桓肅子齊京文初遼帝之奔陰山也遼節度使和尚與林牙馬哥男慎思俱被擒都統杲使阿鄰護送得里底和尚雅里斯等入京師得里底道亡太祖誅阿鄰和尚弟道溫為興中尹太祖使謾都本以兵千人與和尚往招之和尚欲亡去不克至興中城下以矢繫書射城中教道溫毋降事泄謾都本責之曰汝何反覆如此對曰以忠報國何反覆之有雖死不恨乃殺之既而宗望軍遇遼都統孛迭等道溫在其中相與隔水而語宗望承制招之孛迭唯諾無降意宗望謂道溫曰汝兄和尚因戰而獲未嘗加罪後以叛誅能無痛悼道溫曰吾兄辱於見獲榮於死國宗望顧馬和尚曰能為我取此乎對曰能遂以所部渡水擊敗其衆直趨道溫射中其臂獲而殺之齊本名受速長身美髯天眷三年以宗室子授鎮國上將軍皇統元年遷光祿大夫正隆六年遷銀青榮祿大夫大定初遷特進加安武軍節度使留京師奉朝請齊以近屬上所寵遇而性庸滯無材能大定三年罷節度官給隨朝三品俸纍官特進卒弟京弟文皆以謀反誅世宗盡以其家財産與齊之子咬住詔齊妻曰汝等皆當緣坐有至大辟及流竄者朕念宋王故置而不問且以其家産賜汝子宜悉朕意十五年上召英王爽謂曰卿於諸公主女子中為咬住擇婚其禮幣命有司給之俄襲叔父京山東西路徒毋堅猛安京本名忽魯以宗室子纍遷特進天德二年除翰林學士承旨兼修國史加開府儀同三司遷工部尚書改禮部兵部判大宗正事封曹王除河間尹正隆二年例封瀋國公北京留守以喪去官起復益都尹六年坐違制立春日與徒單貞飲酒降灤州刺史未幾改絳陽軍節度使海陵遣護衛忽魯往絳州殺之京由間道走入汾州境得免世宗即位來見于桃花塢復判大宗正事封壽王二年正月戊辰朔日食伐鼓用幣上不視朝減膳徹樂詔京代拜行禮世宗懲創海陵疏忌宗室加禮京兄弟情若同生謂京等曰朕每見天象變異輒思政事之闕寤寐自責不遑凡事必審思而後行猶懼獨見未能盡善每令羣臣集議庶幾無過舉也是時伐宋未罷兵用度不足百官未給全俸京家人數百口財用少上聞之賜金一百五十兩重綵百端絹五百匹改西京留守賜佩刀馬京到西京京妻嘗召日者孫邦榮推京祿命邦榮言留守官至太師爵封王京問此上更無否邦榮曰止於此京曰若止於此所官何為邦榮察其意乃詐為圖讖作詩中有鶻魯為之語以獻於京京曰後誠如此乎遂受其詩再使卜之邦榮稱所得卦有獨權之兆京復使邦榮推世宗當生年月家人孫小哥妄作謠言誑惑京如邦榮指京信之京妻公壽具知其事大定五年三月孫邦榮上變詔刑部侍郎高德基戶部員外郎完顏兀古出往鞫之京等皆款伏獄成還奏上曰海陵無道使光英在朕亦保全之況京等哉於是京夫婦特免死杖一百除名嵐州樓煩縣安置以奴婢百口自隨官給上田遣兀古出劉珫宣諭京詔曰朕與汝皆太祖之孫海陵失道翦滅宗支朕念兄弟無幾於汝尤為親愛汝亦自知之何為而懷此心朕念骨肉不忍盡法汝若尚不思過朕雖不加誅天地豈能容汝也十年四月詔于樓煩縣為京作第一區月給節度釰俸十二年兄德州防禦使文謀反上問皇太子趙王允中及宰臣曰京謀不軌朕特免死今復當緣坐何如宰臣或言京圖逆今不除之恐為後患上曰天下大器歸於有德海陵失道朕乃得之但務修德餘何足慮太子曰誠如聖訓乃遣使宣諭京詔曰卿兄文舊封國公不任職事朕進封王爵委以大藩頃在大名以贓得罪止削左遷不知恩幸乃蓄怨心謀不軌罪及兄弟朕念宋王皆免緣坐文之家産應沒入者盡與卿兄子咬住卿宜悉此意二十年十一月上問宰臣曰京之罪始於其妻妄卜休咎太祖諸孫存者無幾朕欲召置左右不使任職但廪給之卿等以為何如皆曰置之近密臣等以為非宜上曰朕若修德何必豫懷疑忌久之上復欲召京宰臣曰京不赦之罪也赦之以為至幸矣豈可復上默良久乃止文本名胡剌皇統間授世襲謀克加奉國上將軍居中京海陵篡立賜錢二萬貫是時左淵為中京轉運使市中有穢術敲仙者文與淵皆與之遊海陵還中京聞召敲仙詰問窮竟本末既而殺之于市責讓文淵貞元元年除祕書坐與靈壽縣主阿里虎有姦杖二百除名俄復為祕書監封王正隆例封鄖國公以喪去官起復翰林學士承旨同判大宗正事昌武軍節度使大定初改武定軍留京師奉朝請三年賜上常御絛服佩刀而遣之謂文曰朕無兄弟見卿往外郡惻然傷懷卿頗自放宜加檢束除廣寧尹召為判大宗正事封英王是時弟京得罪上謂文曰朕待京不薄乃包藏禍心圖不軌不忍刑及骨肉遂從輕典卿亦驕縱無度宋王有社稷功武靈封太祖諸孫為王卿獨不封朕即位封卿兄弟為王自今懲咎悔過赤心事朕無患朕不知也除真定尹賜以衣帶改大名尹徙封荊王文到大名多取猛安謀克良馬或以駑馬易之買民物與價不盡其直尋常占役弓手四十餘人詭納稅草十六萬束公用闕取民錢一萬九千餘貫坐是奪爵降德州防禦使僚佐皆坐不矯正解職監察御史董師中按文事失糾察已除尚書省都事降沁南軍節度副使詔曰自今長官不法僚佐不矯正又不言上並嚴行懲斷文既失職居常怏怏日與家奴石抹合住忽里者為怨言合住揣知其意因言南京路猛安阿古合住謀克頗里銀术可與大王厚善果欲舉大事彼皆願從文信其言乃召日者康洪占休咎密以謀告洪洪言來歲甚吉文厚謝洪使家僮剛哥等往南京以書幣遺阿古等剛哥問合住何以知阿古等必從合住曰阿古等與大王善以此意其必從耳剛哥到南京見阿古等不言其本來之事及還紿文曰阿古從大王矣文乃造兵仗使家奴斡敵畫陳圖家奴重喜詣河北東路上變府遣總管判官孛特馳往德州捕文孛特至德州日已晚會文出獵召防禦判官酬越謀就獵所執之酬越言文兵衛甚衆且暮夜明日文生日可就會上執之孛特乃止是夜文知本府使至意其事覺乃與合住忽里者等俱亡去河間府使奏文事詔遣右司郎中紇石烈哲典翰林修撰阿不罕訛里也往德州鞫問上聞文亡命謂宰臣曰海陵翦滅宗室殆盡朕念太祖孫存者無幾人曲為寬假而文曾不知幸尚懷異圖何狂悖如此上恐文久不獲詿誤者多督所在捕之詔募獲文者遷官五階賜錢三千貫文以大定十二年九月事覺亡命凡四月至十二月被獲伏誅康洪論死餘皆坐如律詔釋其妻术實懶孛特酬越不即捕致文亡去孛特杖二百除名酬越杖一百削兩階詔曰德州防禦使文北京曹貴鄜州李方皆因術士妄談祿命陷于大戮凡術士多務苟得肆為異説自今宗室宗女有屬籍者及官職三品者除占問嫁娶修造葬事不得推算相命違者徒二年重者從重上以文家財産賜其故兄特進齊之子咬住並以西京留守京沒入家産賜之贊曰宗望啓行平州戰勝白河席卷而南風行電舉兵無留難再閲月而汴京圍矣所謂敵不能與校者耶既取信德留兵守之以為後距此豈輕者耶管子曰徑於絶地攻於恃固獨出獨入而莫之能止其宗望之謂乎
