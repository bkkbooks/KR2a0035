body:
  text: 金史卷七十二列傳第十婁室活女謀衍仲本名石古乃海里銀术可彀英本名撻懶麻吉子沃側拔離速習古乃婁室字斡里衍完顏部人年二十一代父白答為七水諸部長太祖克寧江州使婁室招諭係遼籍女直遂降移燉益海路太彎照撒等敗遼兵于婆剌趕山復敗遼兵擒兩將軍既而益改捺末懶兩路皆降進兵咸州克之諸部相繼來降獲遼北女直係籍之戶遼都統耶律訛里𩽆以二十餘萬衆來戍邊太祖趨達魯古城次寧江州西召婁室婁室見上于軍中上見婁室馬多疲乏以三百給之使隸右翼宗翰軍與銀术可縱兵衝其中堅凡九陷陳皆力戰而出復與銀术可戍邊及九百奚營等部來降則與銀术可攻黃龍府上使完顏渾黜婆盧火石古乃以兵四千助之敗遼兵萬餘于白馬濼宗雄等下金山縣使婁室分兵二千招沿山逃散之人耶律捏里軍蒺藜山斡魯古婁室等破之遂取顯州太祖取黃龍府婁室請曰黃龍一都會且僻遠苟有變則鄰郡相扇而起請以所部屯守太祖然之仍合諸路謀克命婁室為萬戶守黃龍府進都統從杲取中京與希尹等襲走迪六和尚雅里斯等敗奚王霞末降奚部西節度訛里剌遼主自鴛鴦濼西走婁室等追至白水濼獲其內庫寶物婁室遂與闍母攻破西京復與闍母至天德雲內寧邊東勝其官吏皆降獲阿疏夏人救遼兵次天德婁室使突撚補以騎二百為候兵夏人敗之幾盡阿土罕復以二百騎往遇伏兵獨阿土罕脫歸時久雨諸將欲且休息婁室曰彼再破吾騎兵我若不復往彼將以我怯即來攻我矣乃選千騎與習失拔離速往斡魯壯其言從之婁室遲明出陵野嶺留拔離速以兵二百據險守之獲生口問之其帥李良輔也將至野谷登高望之夏人恃衆而不整方濟水為陳乃使人報斡魯婁室分軍為二迭出迭入進退轉戰三十里過宜水斡魯軍亦至合擊敗之遼都統大石犯奉聖州壁龍門東二十五里婁室照里馬和尚等以兵取之生獲大石其衆遂降遼闢里剌守奉聖州棄城遁去後與宗望追遼帝婁室蒲察以二十騎候敵敗其軍三千人于三山有千人將趨奉聖州蒲察復敗之擒其主帥而還夏人屯兵於可敦館宗翰遣婁室戍朔州築城於霸德山西南二十里遂破朔州西山兵二萬擒其帥趙公直其後復襲遼帝于余都谷獲之賜鐵券惟死罪乃笞之餘罪不問銀术可圍太原宋統制劉臻救太原率衆十萬出壽陽婁室擊破之繼敗宋兵數千於榆次宋張灝軍出汾州拔離速擊走之灝復營文水婁室與突葛速拔離速與戰灝大敗宗翰定太原婁室取汾石二州及其屬縣溫泉方山離石蒲察降壽陽取平定軍及樂平復招降遼州及榆社遼山和順諸縣宗翰趨汴州使婁室等自平陽道先趨河南曰若至澤州與賽里婆盧火習失遇當與俱進習失之前軍三謀克敗宋兵三千于襄垣遇伏兵二千又敗之撒剌答破天井關復破步兵於孔子廟南遂降河陽婁室軍至既渡河遂薄西京城中兵來拒戰習失逆擊敗之西京降婁室取偃師永安軍鞏縣降撒剌答敗宋兵於汜水於是滎陽滎澤鄭州中牟相次皆降宗翰已與宗望會軍于汴使婁室率師趨陝津攻河東郡縣之未下者阿離土罕敗敵于河上撒按敗敵于陝城下鶻沙虎降虢州守陴卒三百人遂克陝府習古乃桑袞破陝之散卒于平陸西北活女別破敵於平陸婁室破蒲解之軍二萬盡覆之安邑解州皆降遂克河中府降絳慈隰石等州宗翰往洛陽使婁室取陝西敗宋將范致虛軍下同華二州克京兆府獲宋制置使傅亮遂克鳳翔阿鄰等破宋大兵於河中斡魯破宋劉光烈軍於馮翊訛特剌桑袞敗敵於渭水遂取下邽宗翰會宗輔伐康王命婁室蒲察專事陝西以婆盧火繩果監戰繩果等遇敵於蒲城及同州皆破之婁室蒲察克丹州破臨真進克延安府遂降綏德軍及靜邊懷遠等城寨十六復破青澗城宋安撫使折可求以麟府豐三州及堡寨九降于婁室晉寧所部九寨皆降而晉寧軍久不下婁室欲去之賽里不可曰此與夏鄰且生他變城中無井日取河水以為飲乃決渠于東泄其水城中遂困李位石乙啓郭門降諸將率兵入城守將徐徽言據子城戰三日衆潰徽言出奔獲之使之拜不聽臨之以兵不為動縶之軍中使先降者諭之使降徽言大罵與統制孫昂皆不屈乃並殺之遂降定安堡渭平寨及鄜坊二州於是婁室婆盧火守延安折可求屯綏德蒲察還守蒲州延安鄜坊州皆殘破人民存者無幾婁室置官府輯安之別將斡論降建昌軍京兆府叛婁室復討平之遂與阿盧補謀里也至三原訛哥金阿骨欲擊淳化兵敗之婁室攻乾州已築甬道列炮具而州降遂進兵克邠州軍于京兆陝西城邑已降定者輒復叛於是睿宗以右副元帥總陝西征伐時婁室已有疾睿宗與張浚戰于富平宗弼左翼軍已却婁室以右翼力戰軍勢復振張浚軍遂敗睿宗曰力疾鏖戰以徇王事遂破巨敵雖古名將何以加也以所用犀玉金銀器及甲胄並馬七匹與之天會八年薨十三年贈泰寧軍節度使兼侍中加太子太師皇統元年贈開府儀同三司追封莘王以正隆例改贈金源郡王配享太宗廟廷諡壯義子活女謀衍石古乃活女年十七從攻寧江州力戰創甚扶出陳間太祖憑高望見問之知是婁室子親撫慰賜藥歎曰此兒他日必為名將其攻濟州敗敵八千與敵遇于信州移剌本陷于陳活女力戰出之敵遂北敗耶律佛頂等兵于瀋州及宗翰以兵襲奚王霞末活女以兵三百敗敵二千從攻乙室部敗之破其二營迭剌部族叛率二謀克突入大破之活女常從婁室圍太原宋將种師中以兵十萬來援活女擊敗之大軍至河無船不得渡婁室遣活女循水上下活女率軍三百自孟津而下度其可渡遂引軍以濟大軍於是皆繼之宋將郭京出兵數萬趨婁室營活女從旁奮擊敵亂遂破之師還破敵於平陸渡得其船以濟又以兵破敵於張店原時屯留太平翼城皆有重敵並破之又分兵取陝西蒲州降留活女鎮之攻鳳翔活女先登睿宗定陝西活女為都統進攻涇州敗其兵王開山以兵拒歸路邀戰再擊再敗之遂降京兆鳳翔諸縣婁室薨襲合扎猛安代為黃龍府路萬戶天眷三年為元帥右都監遷左監軍元帥府罷改安化軍節度使歷京兆尹封廣平郡王以正隆例改封代國公進封隋國公諡貞濟卒年六十一謀衍勇力過人善用長矛突戰天眷間充牌印祗候授顯武將軍擢符寶郎皇統四年其兄活女襲濟州路萬戶以親管奧吉猛安讓謀衍朝廷從之權濟州路萬戶八年為元帥右都監天德三年為順天軍節度使歷河間臨潢尹數月改婆速路兵馬都總管撒八反謀衍往討之是時世宗為東京留守自將討括里還遇謀衍于常安縣盡以甲士付之世宗還東京完顏福壽高忠建率所部南征軍亡歸東京謀衍亦率其軍來附即以臣禮上謁遂殺高存福李彥隆等謀衍福壽忠建及諸將吏民勸進世宗即位拜右副元帥都統白彥敬副統紇石烈志寧在北京拒不受命謀衍伐之遇其衆于建州之境皆不肯戰彥敬志寧遂降二年正月謀衍率諸軍討窩斡會兵於濟州合甲士萬三千人過泰州至术虎崖乃捨輜重持數日糧輕騎追之是時窩斡新敗于泰州將走濟州謀衍兵至長濼南獲其諜者知敵將由別路邀糧運遂分軍往迎之敵吏辭者來降謀衍用其計因夜亟往邀敵輜重忽大風不能燧火路暗莫相辨比曉才行三十餘里將至敵營將士少憩謀衍率善射者數十騎往覘之而都統志寧克寧等已敗敵衆二萬餘於長濼追殺甚衆敵遂西遁志寧軍先追及於霿河急擊敗之而謀衍貪鹵掠不復追以故敵得縱去遂涉懿州界陷靈山同昌惠和等縣窺取北京西攻三韓縣惟克寧軍追躡謀衍託馬弱引還懿州上聞之下詔切責謀衍以僕散忠義為右副元帥代之紇石烈志寧為右監軍代完顏福壽而謀衍子斜哥暴橫軍中詔勒歸本貫謀衍至京師以為同判大宗正事世宗責之曰朕以汝為將汝不追賊當正汝罪以汝父婁室有大功特免汝死汝雖非宗室而授此職汝其勉之未幾速頻路軍士术里古告斜哥寄書與謀衍謀反有司並上其書世宗察其誣詔鞫告者术里古款伏遂誅之召謀衍謂之曰人有告卿子為反謀者朕知卿必不為此今告者果自服罪宜悉此意初窩斡方熾上使溫迪罕阿魯帶守古北口及窩斡敗于陷泉入于奚中率諸奚攻古北口阿魯帶因其妻生日輒離軍六十里賊衆聞之來襲殺傷士卒甚衆阿魯帶坐除名詔謀衍蒲察烏里雅蒲察通以兵三千會舊屯兵擊之擒賊黨猛安合住未幾窩斡平乃還七年出為北京留守上御便殿賜食及御服衣帶佩刀謂之曰以卿故老欲以均勞逸故授此職卿其勉之改東京留守封榮國公大定十一年薨年六十四謀衍性忠厚善擊毬射獵時論以為雖智略不及其父而勇敢肖之云仲本名石古乃體貌魁偉通女直契丹漢字其兄斡魯為統軍愛仲才欲使通吏事每視事常在左右遇事輒問之應對如響斡魯嘆曰此子必為令器皇統初充護衛授世襲謀克天德元年攝其兄活女濟州萬戶部內稱治除濱州刺史以母憂去官起復知積石軍事轉同知河南尹正隆六年伐宋為神勇軍副都總管與大軍北還除同知大興尹將兵二千益遵化屯軍備契丹遷西南路招討使兼天德軍節度使政尚忠信決獄公平蕃部不敢寇邊召為左副都點檢宿衛嚴謹每事有規矩後來者守其法莫能易也世宗常謂侍臣曰石古乃入直朕寢益安五年宋人請和為姪國不稱臣仲為報問使仲請與宋主相見禮儀世宗曰宋主親起立接書則授之及至宋一一如禮正隆用兵宋人執商州刺史完顏守能以歸至是仲取守能與俱還上嘉之轉都點檢兼侍衛親軍都指揮使遷河南路統軍使上曰卿在禁近小心畏慎河南控制江淮為國重地卿益勉之賜馬金帶玉吐鶻後有罪解職久之起為西北路招討使改北京留守卒海里婁室族子體貌豐偉善用矟婁室為黃龍府萬戶海里從徙於孰吉訛母從婁室追及遼主於朔州阿敦山遼主從數十騎逸去婁室遣海里及术得往見遼主諭之使降遼主已窮蹙待於阿敦山之東婁室因獲之賞海里金五十兩銀五百兩幣帛二百匹綿三百兩睿宗經略陝西海里戰却吳玠軍於涇邠之南尋遣修棧道宋人恐棧道成以兵來拒破其兵賞銀百五十兩奴婢十人天眷元年擢宿直將軍與定宗磐宗雋之亂再遷廣威將軍除都水使者改西北路招討都監歷復州灤州刺史耶盧碗羣牧使迭剌部族節度使同知大興尹兼中都路兵馬都總管改武寧軍節度使廣寧尹卒年六十二銀术可宗室子太祖嗣位使蒲家奴如遼取阿踈事久不決乃使習古乃銀术可繼往當是時遼主荒于政上下解體銀术可等還具以遼政事人情告太祖且言遼國可伐之狀太祖決意伐遼蓋自銀术可等發之太祖與耶律訛里𩽆戰于達魯古城遼兵二十餘萬銀术可婁室率衆衝其中堅凡九陷陳輒戰而出大敗遼軍銀术可為謀克遂與婁室戍邊復與婁室渾黜婆盧火石古乃等攻黃龍府敗遼兵萬餘于白馬濼太祖拒遼兵銀术可守達魯古城收國二年分鴨撻阿懶所遷謀克二千戶以銀术可為謀克屯寧江州遼大冊使習泥烈遣回約以七月半至而盡九月習泥烈未來上使諸軍過江屯駐遼曳剌麻答十三人兵士八人縱火於渾河以絶芻牧銀术可獲之乃知遼邊吏乙薛使之太祖命釋之從都統杲克中京銀术可與習古乃蒲察胡巴魯率兵三千擊奚王霞末于京西七十里霞末棄兵遁遼主西奔天德銀术可以兵絶其後遼主遂見獲後從宗翰伐宋圍太原宗翰進兵至澤州及宗翰還西京太原未下皆命銀术可留兵圍之招討都監馬五破宋兵於文水節度使耿守忠等敗宋黃迪兵於西都谷所殺不可勝計宋樊夔施詵高豐等軍來救太原分據近部銀术可與習失杯魯完速大破之索里乙室破宋兵於太谷宋兵據太谷祁縣阿鶻懶拔離速復取之种師中出井陘據榆次救太原銀术可使斡論擊之破其軍活女斬師中於殺熊嶺進攻宋制置使姚古軍于隆州谷大敗之撒里土敗宋軍於回馬口郭企忠殲宋軍於五臺及宗翰定太原與宗望會兵于汴銀术可等攻汴城克之師還銀术可降岢嵐寧化等軍攻嵐州拔之招降火山軍與希尹同賜鐵券宗翰趨洛陽賽里取汝州銀术可取鄧州殺其將李操等薩謀魯入襄陽拔離速入均州馬五取房州擒轉運使劉吉鄧州通判王彬拔離速破唐蔡陳三州克潁昌府沙古質別克舊潁昌宗翰會伐康王銀术可守太原天會十年為燕京留守天會十三年致仕加保大軍節度使同中書門下平章事遷中書令封蜀王天眷三年薨年六十八以正隆例贈金源郡王配饗太宗廟廷大定十五年諡武襄改配享太祖廟廷子彀英彀英本名撻懶幼警敏有志膽初角太祖見而奇之年十六父銀术可授以甲使從伐遼常為先鋒授世襲謀克宗翰自太原還西京銀术可圍守之彀英在行間屢有功宋兵數萬救太原至南關銀术可與弟拔離速完顏婁室等擊之當隘巷間一卒揮刀向拔離速彀英以刀斷其腕一卒復從旁以槍刺之彀英斷其槍追殺之拔太原下河東諸州攻汴京皆有功與都統馬五徇地漢上至上蔡以先鋒破孔家軍睿宗攻開州彀英先登流矢中其口睿宗親視之創未愈強起之攻大名府第功宗弼第一彀英次之攻東平彀英居最拔離速襲宋康王于揚州彀英為先鋒拔離速追宋孟后於江南彀英前行趨潭州宋大兵在常武彀英以選兵薄其城敗千餘人明日城中出兵來戰彀英以五百騎敗之獲馬二百匹遂攻常武拔離速以諸軍為大陳居其後彀英以五百騎為小陳當前行即麾兵馳宋軍宋軍亂遂大敗之拔離速觀其周旋嘆賞之其後河東郡縣多叛彀英以先鋒攻絳州克之復攻沁州飛炮擊其右脅舁歸營中諸軍攻沁州三日不能下別將骨強起彀英指麾士卒遂克之攝河東路都統從左監軍移剌余睹招西北諸部彀英將騎三千五百平其九部獲生口三千馬牛羊十五萬以先鋒破宋吳山軍再戰再勝遂衄宋兵于隘死者不可勝計宋兵遁去宗弼再取和尚原彀英以本部破宋五萬人遂奪新叉口宗弼留兵守之是夜大雪道路皆冰和尚原宋兵勢重不可徑取宗弼用彀英策入自傍近高山叢薄翳薈間出其不意遂取和尚原彀英請速入大散關自以本部為殿以備伏兵宗弼至仙人關彀英先攻之宗弼止之彀英不止宗弼以刀背擊其兜鍪使之退彀英曰敵氣巳沮不乘此而取之後必悔之已而果然宗弼嘆曰既往不咎乃班師彀英殿且戰且却遂達秦中齊國初廢元帥右監軍撒離喝馳驛撫治諸郡至同州故齊觀察使李世輔出迎陽墜馬稱折臂舁歸撒離喝入城世輔詐使通判獻甲以壯士十人被甲上廳事世輔自壁後突出執撒離喝彀英方索馬于外變起倉卒不得入城門已閉皆有兵衛至東門合答雅領騎三十餘與彀英遇遂斬門者出而世輔擁衆自西門出彀英與合答雅襲之一進一退以綴世輔使不得速世輔慮救兵至乃要撒離喝與之盟勿使追之留撒離喝於道側彀英識其聲與騎而歸除安遠大將軍攝太原尹四境咸治兼攝河東南北兩路兵馬都總管朝廷以河南陝西與宋已而復取之師至耀州宋人每旦出城張旗閲隊抵暮而還道隘騎不得逞彀英請兵五百薄暮先使五十人趨山巔令之曰旦日視敵出舉幟指其所向乃以餘兵伏山谷間明日城中人出閲如前山巔旗舉伏兵發宋兵爭馳入城彀英麾軍登城拔宋幟立金軍旗幟宋兵後者望見之不敢入遂降城中人亦降宋吳玠擁重兵據涇州涇原以西多應之元帥撒離喝欲退守京兆俟河南河東軍彀英曰我退守吳玠必取鳳翔京兆同華據潼關吾屬無類矣撒離喝曰計將安出彀英曰事危矣不如速戰我軍陳涇之南原宋兵必自西原來彀英與斜補出各以選騎五百摧其兩翼元帥當其中擊之可以得志監軍拔離速曰二子當其左右拔離速願當其中元帥據岡阜多張旗幟為疑兵可以得志撒離喝從之吳玠兵果自西原來彀英斜補出擊其左右自旦至午吳玠左右軍少退拔離速當其前衝擊之遂敗玠軍僵尸枕藉大澗皆滿自此蜀人喪氣不敢復出關陝遂定歷行臺吏部工部侍郎從宗弼巡邊遷刑部尚書轉元帥左都監天德二年遷右監軍元帥府罷改山西路統軍使領西南西北兩路招討兵馬坐無功降臨海軍節度使歷平陽太原尹正隆末為中都留守兼西北面都統討契丹撒八駐軍歸化州世宗即位於遼陽使彀英姪阿魯瓦持詔往歸化命彀英為左副元帥就遣使召陝西統軍徒單合喜宣大定改元詔赦于西南西北招討司河東河北山東諸路州鎮調猛安軍屯京畿阿魯瓦見彀英彀英猶豫未決士卒皆欲歸世宗彀英不得已乃受詔以元帥令下諸路亟泥馬槽二萬具諸路聞之以為大軍且至然後遣人宣赦所至皆聽命大定元年十一月彀英以軍至中都同知留守璋請至府議事彀英疑璋有謀乃陽許諾排節仗若將往者遂率騎從出施仁門駐兵通州見世宗于三河詔彀英以便宜規措河南陝西山東邊事二年正月至南京遂復汝潁嵩等州縣授世襲猛安入拜平章政事罷為東京留守未行改濟南尹初彀英宿將恃功在南京頗瀆貨不恤軍民詔使問以邊事彀英不答謂詔使曰爾解何事待我到闕奏陳及召入竟無一語及邊事者在相位多自專己所欲輒自奏行之除留守輒忿忿不接賓客雖近臣往亦不見上怒遂改濟南上數之曰朕念卿父有大功于國卿舊將亦有功故改授此職卿宜知之若復不悛非但不保官爵身亦不能保也彀英頓首謝久之改平陽尹致仕起為西京留守以母憂去官尋以本官起復俄復為東京歷上京詔曰上京王業所起風俗日趨詭薄宗室聚居號為難治卿元老大臣衆所聽服當正風俗檢制宗室持以大體十五年致仕久之史臣上太宗睿宗實録上曰當時舊人親見者惟彀英在詔修撰溫迪罕締達往北京就其家問之多更定焉十九年薨年七十四最前後以功被賞者十有一金為兩二百五十銀為兩六千五百絹為匹八百綿為兩二千馬三百十有四牛羊六千五百奴婢百三十人麻吉銀术可之母弟也年十五隸軍中從破高麗兵下寧江州平係遼女直克黃龍府皆身先力戰以功為謀克繼領猛安破奚兵千餘自斡魯古攻下咸信瀋州及東京諸城麻吉皆有功都統杲取中京與稍合胡拾答別降楚里迪部屯兵高州以兵援蒙刮勃堇大破敵兵復敗恩州兵五萬人討平遼人聚中京山谷者降三千餘人戰于高州境上伏矢射之中目遂卒麻吉大小三十餘戰所至皆捷皇統中贈銀青光祿大夫諡毅敏子沃側沃側年十七隸軍中從拔離速擊遼將馬五敗之麻吉死領其職宗望伐宋至河上宋兵屯于河外以二舟來伺我師乃遣沃側率勇士數輩以一舟往迎之盡俘以還襲康王於江淮間沃側皆與焉師還駐東平及廢齊屯兵河北招降旁近諸營多獲畜産兵仗軍帥嘉之賞以甲馬從攻陝西為右翼都統攻城破敵皆與有功師還正授謀克遷華州防禦使屬關中歲飢盜賊充斥沃側募兵討平之部以無事郡人列狀丐留不報未幾除迪列部族節度使改迭剌部用廉入為都水使者秩滿同知燕京留守事為西北路招討使撒八秩滿已數月冒其俸祿不即解去沃側發其事撒八反沃側遇害拔離速銀术可弟天輔六年宗翰在北安州將會斜也于奚王嶺遼兵奄至古北口使婆盧火渾黜各領兵二百擊之渾黜請濟師宗翰欲自往希尹婁室曰此易與耳請以千人為公破之渾黜以騎士三十人前行至古北口遇其游兵逐入山谷遼人以步騎萬餘迫戰亡騎五人渾黜退據關口希尹婁室至拔離速訛謀罕胡實海推鋒奮擊大破之斬馘甚衆盡獲甲胄輜重希尹與撒里古獨裴滿突撚敗其伏兵殺千餘人獲馬百餘匹婁室拒夏人出陵野嶺留拔離速以兵二百據險守之銀术可圍太原近縣先已降宋軍來救太原者復據太谷祁縣拔離速阿鶻懶復取之宋姚古軍隆州谷拔離速敗之張灝兵出汾州又擊走之天會四年克太原拔離速為管勾太原府路兵馬事復與婁室敗宋兵于文水遂從宗翰圍汴與銀术可略地襄鄧入均州還攻唐蔡陳三州皆破之克潁昌府遂與泰欲馬五襲宋康王于揚州康王渡江入于建康天會十五年遷元帥左都監宗弼再定河南撒離喝經略陝西至涇州拔離速大破宋軍于渭州渭州德順軍皆降陝西平遷元帥左監軍加金吾衛上將軍卒諡敏定習古乃亦書作實古乃嘗與銀术可俱往遼國取阿疏還言遼人可取之狀太祖始決意伐遼矣婆盧火取居庸關蕭妃自古北口出奔太祖使習古乃追之不及後為臨潢府軍帥討平迭剌其羣官率衆降者請使就領諸部太宗賜以空名宣頭及銀牌使以便宜授之獲遼許王莎邏駙馬都尉蕭乙辛遼梁王雅里在紇里水自立不知果在何處至是始知之於是徙遼降人於泰州時暑未可徙習古乃請姑處之嶺西及習古乃築新城於契丹周特城詔置會平州烏虎里部人迪烈劃沙率部族降朝廷以撻僕野為本部節度使烏虎為都監習古乃封還撻僕野等宣誥以便宜加撻僕野散官填空名告身授之及録上降附有勞故官八百九十三人朝廷從之於是迪烈加防禦使為本部節度使劃沙加諸司使為節度副使知迪烈底部事撻離答加左金吾衛上將軍節度副使知突鞠部事阿枲加觀察使為本部節度使其餘遷授有差以厖葛城地分賜烏虎里迪烈底二部及契丹人其未墾者聽任力占射久之領咸州烟火事天會六年完顏慎思所部及其餘未置猛安謀克戶口命習古乃通閲具籍以上天會十年改南京路軍帥司為東南路都統司習古乃為都統移治東京鎮高麗贊曰金啓疆土斡魯斡魯古方面功最先著婆盧火婁室最先封泰州之邊圉黃龍之衝要寄亦重矣若闍母之勤勞南路婁室之經營陝西銀术可之圍守太原勞亦至矣斡魯古之不治闍母之敗譴罰之亟諸將懾焉夫能以弱小終制強大其效驗與銀术可習古乃觀人之國而知其可伐古語云國有八觀善矣夫
