body:
  text: 金史卷八十七列傳第二十五紇石烈志寧僕散忠義徒單合喜紇石烈志寧本名撒曷輦上京胡塔安人自五代祖太尉韓赤以來與國家世為甥舅父撒八海陵時賜名懷忠為泰州路顏河世襲謀克轉猛安嘗為東平尹開遠軍節度使志寧沉毅有大略娶梁王宗弼女永安縣主宗弼於諸壻中最愛之皇統間為護衛海陵以為右宣徽使出為汾陽軍節度使入為兵部尚書改左宣徽使都點檢遷樞密副使開封尹契丹撒八反樞密使僕散忽土北京留守蕭賾西京留守蕭懷忠皆以征討無功坐誅於是志寧為北面副統與都統白彥敬以北京臨潢泰州三路軍討之志寧至北京而海陵伐宋已渡淮彥敬志寧聞世宗有異志乃陰結會寧尹完顏蒲速賚利涉軍節度使獨吉義將攻之而世宗已即位使石抹移迭移剌曷補來招彥敬志寧殺其使者九人世宗使完顏謀衍來伐衆不肯戰乃與彥敬俱降世宗問曰正隆暴虐人望既絶朕以太祖之孫即大位汝殺我使者又不能為正隆死節恐為人所圖然後來降朕今殺汝等將何辭彥敬未有以對志寧前奏曰臣等受正隆厚恩所以不降罪當萬死上曰汝輩初心亦可謂忠於所事自今事朕宜勉忠節世宗使扎八招窩斡扎八乃勸之遂稱帝世宗使右副元帥完顏謀衍征之志寧以臨海節度使都統右翼軍窩斡敗于長濼西走志寧追及于霿河賊已先渡依岸為陳毀橋岸以為阻志寧與賊夾河為疑兵與萬戶夾谷清臣徒單海羅於下流涉渡已渡前有支港岸斗絶其中泥濘乃束柳填藉士卒畢濟行數里得平地將士方食賊奄至賊據南岡三馳下志寧陳陳堅力戰流矢中左臂戰自若賊據上風縱火乘煙勢馳擊志寧步軍繼至轉戰十餘合火益熾風煙突人不可當會雨作風煙乃熄遂奮擊大破之於是元帥謀衍右監軍福壽不急擊賊久無功右丞僕散忠義請自討賊而志寧擊賊有功上以忠義代謀衍志寧代福壽封定國公使蒲察通至軍中宣諭之賊略懿州界陷靈山同昌惠和三縣睥睨北京會土河水漲賊不得渡乃西趨三韓縣志寧方追躡之元帥忠義與賊遇于花道軍頗失利賊見志寧踵其後不敢乘勝遂西走是時大軍馬瘦弱不堪追襲諸將欲止軍勿追志寧獲賊候人知賊自選精鋭與老小輜重分道期山後會集可擊其輜重忠義以為然遂過移馬嶺進及裊嶺西陷泉賊見左翼據南岡為陳不敢犯右翼萬戶烏延查剌擊賊少却志寧與夾谷清臣等擊之賊衆大敗涉水走窩斡母徐輦舉營由落括岡西去志寧追及之盡獲其輜重俘五萬餘人雜畜不可勝計僞節度使六及其部族皆降窩斡走奚中至七渡河志寧復敗之賊過渾嶺入于奚中志寧獲賊將稍合住釋弗殺許以官賞縱之歸約以捕窩斡自效稍合住既去見窩斡祕不言見獲事乃反間奚人于窩斡曰陷泉失利奚人有二志不可不察當是時窩斡屢敗其下亦各有心稍合住乃與賊帥神獨斡執窩斡詣右都監完顏思敬降志寧與萬戶清臣宗寧速哥等追捕餘黨至燕子城盡得所畜善馬因至抹拔里達之地悉獲之逆黨既平入朝為左副元帥賜以玉帶經略宋事駐軍睢陽都元帥忠義居南京節制諸軍宋將黃觀察據蔡州楊思據潁昌志寧使完顏王祥復取蔡州黃觀察遁去完顏襄攻潁州拔之獲楊思乃移牒宋樞密使張浚使依皇統以來舊式浚復書曰謹遣使者至麾下議之是時宋得窩斡黨人括里扎八用其謀攻靈璧虹縣都統奚撻不也叛入于宋遂陷宿州括里等謀曰北人恃騎射戰勝攻取今夏月久雨膠解弓不可用故李世輔與之來攻宿州歸德尹术甲撒速宿州防禦使烏林答剌撒萬戶溫迪罕速可裴滿婁室不守約束不肯堅壁俟大軍輒出與戰由是軍敗城陷剌撒嘗遣人入宋界貿易交通李世輔受其賂遺久之事覺伏誅謀克賽一坐故知不舉除名撻不也母斡里懶緣坐當死上曰撻不也背國棄母殺之何益朕閔其老遂原其死詔撒速剌撒速可婁室各杖有差撒速剌撒仍解職世輔自以為得志日與括里扎八置酒高會志寧以精兵萬人發自睢陽趨宿州中使來督軍志寧附奏曰此役不煩聖慮臣但恐世輔遁去耳世輔聞志寧軍止萬人甚易之曰當令十人執一人也括里等問候人所見上將旗幟知是志寧謂世輔曰此撒合輦監軍也軍至萬人慎毋輕之大定三年五月二十日志寧將至宿州乃令從軍盡執旗幟駐州西為疑兵三猛安兵駐州南志寧自以大軍駐州東南厄其歸路世輔望見州西兵旌旗蔽野果謂大軍在州西而謂東南兵少不足慮先擊之以步騎數萬皆執盾背城為陳外以行馬捍之使別將將兵三千出自東門欲自陳後攻志寧軍萬戶蒲查擊敗之右翼萬戶夾谷清臣為前行撤毀行馬短兵接戰世輔軍亂諸將乘之追殺至城下是夕世輔盡按敗將將斬之其統制吉懼而來奔盡得城中虛實明日世輔悉兵出戰騎兵居前志寧使夾谷清臣當之世輔別將以五六千騎為一隊與清臣遇清臣踵擊之宋將不能反斾志寧麾諸軍力戰世輔復大敗走者自相蹈藉僵尸相枕爭城門而入門填塞人人自阻遂緣城而上我軍自濠外射之往往墮死於隍間殺騎士萬五千步卒三萬餘人世輔乘夜脫走明日夾谷清臣張師忠追及世輔斬首四千餘赴水死者不可勝計獲甲三萬他兵仗甚衆上以御服金線袍玉吐鶻賓鐵佩刀使移剌道就軍中賜之凡有功將士猛安謀克並如陝西遷賞蒲輦進官三階重綵三端絹六匹旗鼓笛手吏人各賜錢十貫詔志寧曰卿雖年少前征契丹戰功居最今復破大敵朕甚嘉之宋人議和不能決都元帥僕散忠義移軍泰和志寧移軍臨渙遂渡淮徒單克寧取盱眙濠廬和滁等州宋人懼乃決意請和使者六七往反議遂定宋世為姪國約歲幣二十萬兩匹魏嵵奉誓書入見復通好志寧還軍睢陽上以御服玉佩刀通犀御帶賜之詔曰靈璧虹縣宿州兵士死者朕實閔焉宜歸葬鄉里官為齎送人賻錢三十貫鳳翔尹孛术魯定方以下猛安謀克官為致祭定方賻銀五百兩重綵二十端猛安三百貫謀克二百貫蒲里衍一百貫權猛安二百貫權謀克一百五十貫權蒲里衍七十貫五年三月忠義朝京師志寧駐軍南京五月志寧召至京師拜平章政事左副元帥如故志寧復還軍賜玉束帶上曰卿壯年能立功如此朕甚嘉之南服雖定日月尚淺須卿一往規畫六年二月志寧還京師拜樞密使七年十一月八日皇太子生日宴羣臣於東宮志寧奉觴上壽上悅顧謂太子曰天下無事吾父子今日相樂皆此人力也使太子取御前玉大杓酌酒上手飲志寧即以玉杓及黃金五百兩賜之以第十四女下嫁志寧子諸神奴八年十月進幣宴百官于慶和殿皇女以婦禮謁見志寧夫婦坐而受之歡飲終日夜久乃罷九年拜右丞相十一年代宗北征既還遣使者迎勞賜以弓矢玉吐鶻入見上慰勞良久是日封廣平郡王復遣使就第慰勞之皇太子生日宴羣臣於東宮以玉帶賜志寧上曰此梁王宗弼所服者故以賜卿郊祀覃恩從征護衛皆有賜進封金源郡王十二年志寧有疾中使看問日三四輩疾亟賜金丹三十粒詔曰此丹未嘗以賜人也使者至志寧已不能言但稽首而已是歲薨上輟朝臨其喪行哭而入哀動左右將葬上致祭見陳甲柩前復慟哭之賻銀千五百兩重綵五十端絹五百匹葬事祠堂皆從官給諡武定十五年圖像衍慶宮志寧妻永安縣主妬甚嘗殺孕妾及志寧薨後諸神奴兄弟皆病亡世宗甚惜之遣使諭永安縣主曰丞相有大功三先朝舊臣惟秦宋二王功大餘不及也今養其孽子當如親子視之二十二年上問宰臣僕散忠義紇石烈志寧孰愈尚書左丞襄奏曰忠義兵權精緻此其所長也上曰不然志寧臨敵身先士卒勇敢之氣自太師梁王未有如此人者也明昌五年配享世宗廟廷僕散忠義本名烏者上京拔盧古河人宣獻皇后姪元妃之兄也高祖斡魯補曾祖班覩祖胡闌父背魯國初世襲謀克婆速路統軍使致仕忠義魁偉長髯喜談兵有大略年十六領本謀克兵從宗輔定陝西行間射中宋大將宋兵遂潰由是知名帥府録其功承制署為謀克宗弼再取河南表薦忠義為猛安攻冀州先登攻大名府以本部兵力戰破其軍十餘萬賞以奴婢馬牛金銀重綵從宗弼渡淮攻壽廬等州宗弼稱之曰此子勇略過人將帥之器也賞馬五匹牛一百五十頭羊五百口領親軍萬戶超寧遠大將軍承其父世襲謀克皇統四年除博州防禦使公餘學女直字及古算法閲月盡能通之在郡不事田獵燕游以職業為務郡中翕然稱治忽一夕陰晦囚徒謀為反獄倉猝間將校皆惶駭失措忠義從容但使守更吏撾鼓鳴角囚徒以為天且曉不敢出自就桎梏及考郡民詣闕願留詔從之八年改同知真定尹兼河北西路兵馬都總管遷西北路招討使入為兵部尚書僕散忽土嘗與海陵篡立恃勢陵傲同列忠義因會飲衆辱之海陵不悅出為震武軍節度使火山賊李鐵槍乘暑來攻忠義單衣從一騎迎擊之射殺數人賊乃退改臨洮尹兼熙秦路兵馬都總管海陵召至京師謂之曰洮河地接吐蕃木波異時剽害良民州縣不能制汝宿將故以命汝賜絛服玉具佩刀閲再考徙平陽尹再徙濟南尹以本官為漢南路行營副統制伐宋克通化軍世宗立海陵死揚州罷兵入朝京師拜尚書右丞移剌窩斡僭號兵久不決右副元帥完顏謀衍既敗之于霿河乃擁衆貪鹵掠不追討而縱其子斜哥暴橫軍中士卒不用命賊得水草善地官軍踵其遺餘水草乏馬益弱賊軼出山西久無功忠義請曰契丹小寇不時殄滅致煩聖慮臣聞主憂臣辱願效死力除之世宗大悅即召還謀衍勒歸斜哥本貫拜忠義平章政事兼右副元帥封榮國公賜以御府貂裘賓鐵吐鶻弓矢大刀具裝對馬及安山鐵甲金牌詔曰軍中將士有犯連職之外並以軍法從事有功者依格遷賞詔諸將士曰兵久駐邊陲蠹費財用百姓不得休息今以右丞忠義為平章政事右副元帥宜同心戮力無或弛慢忠義至軍賊陷靈山同昌惠和等縣陳而西行忠義追之及于花道宗亨為左翼宗為右翼與賊夾河而陳賊渡河先攻左翼偏敗右翼救之賊引去窩斡乃以精鋭自隨以羸兵護其母妻輜重由別道西走期於山後會集追復及于裊嶺西陷泉與賊遇時昏霧四塞跬步莫覩物色忠義禱曰狂寇肆暴殺戮無辜天不助惡當為開霽奠已昏霧廓然及戰忠義左據南岡為偃月陳右迤而北大敗之獲其弟裊俘生口三十萬獲雜畜十餘萬車帳金珍以巨萬計悉分諸軍賊走趨奚地遣將追躡至七渡河又敗之既踰渾嶺復進軍襲之望風奔潰遁入奚中降者相屬於路詔忠義曰卿材能素著果能大破賊衆朕甚嘉之今遣勞卿如朕親往賜卿御衣及骨睹犀具佩刀通犀帶等就以俘獲均散軍士窩斡既敗遂入于奚中高忠建敗奚于栲栳山移剌道取抹白諸奚之家抹白奚乃降窩斡勢益弱紇石烈志寧獲賊將稍合住縱之使歸約以捕窩斡自贖仍許以官賞稍合住與其黨執窩斡詣完顏思敬降契丹平忠義朝京師拜尚書右丞相改封沂國公以玉帶賜之自海陵遇弒大軍北還而窩斡鴟張命將徂征及窩斡敗其黨括里扎八奔入于宋宋人用其謀侵掠邊鄙攻取泗壽唐海州於是宋主傳位于宗室子是為宋孝宗雖嘗遣使來而欲用敵國禮世宗以紇石烈志寧經略宋事制詔忠義以丞相總戎事居南京節制諸將時大定二年也忠義將行陛辭上諭之曰彼若歸侵疆貢禮如故則可罷兵既至南京簡閲士卒分屯要害戒諸將嚴守備使左副元帥志寧移牒宋樞密使張浚其略曰可還所侵本朝內地各守自來畫定疆界凡事一依皇統以來舊約帥府亦當解嚴如必欲抗衡請會兵相見宋宣撫使張浚復書志寧曰疆埸之一彼一此兵家之或勝或負何常之有當置勿道謹遣官僚敬造麾下議之是時已復泗壽鄧州請隳其城遷其民于宿亳蔡州上曰三州本吾土也得之則已忠義使將士擇善水草休息且牧馬俟來歲取淮南初世宗詔諸將由泗壽唐鄧三道進發宋人聞之即自方城葉縣以來田野皆燒夷之使無所芻牧忠義命唐鄧道軍芻牧許汝間三年忠義入奏事遂以丞相兼都元帥無何還軍中忠義與宋相持日久慮夏久雨弓力易減宋或乘時見攻豫選徑弓萬張於別庫及自汴赴闕議事次濬州宋將李世輔果掩取靈璧虹縣遂陷宿州忠義使人還汴發所貯徑弓給志寧軍與宋人戰遂大捷竟復宿州忠義還以書責宋宋同知樞密院事洪遵計議官盧仲賢遣使二輩持與志寧書及手狀歸海泗唐鄧州所侵地約為叔姪國報書期十一月使入境宋又使人來言禮物未備請俟十二月行成忠義以其事馳奏請定書式且言宋書如式則許其入界如其不然勢須遣還本國復禀其主若是往復動經七八十日恐誤軍馬進取世宗以詔諭之曰若宋人歸疆歲幣如昔可免奉表稱臣許世為姪國忠義乃貽書宋人前後凡七宋人他託未從忠義移大軍壓淮境遣志寧率偏師渡淮取盱眙濠廬和滁等州宋人懼而世宗意天下厭苦兵革思與百姓休息詔忠義度宜以行四年正月忠義使右監軍宗入奏將近暑月乞俟秋涼進發詔從之宋使胡昉以右僕射湯思退書來宋稱姪國不肯加世字忠義執昉留軍中答其書使使以聞詔曰行人何罪遣胡昉還國邊事從宜措畫八月詔忠義曰前請俟秋涼進發今已八月復俟何時先是忠義乞增金銀牌上曰太師梁王兼數職未嘗增也至是增都元帥金牌一銀牌二十左右副元帥金牌各一銀牌各十左右監軍金牌各一銀牌各六左右都監金牌各一銀牌各四三路都統府銀牌各二乃定南界官員百姓歸附遷賞格元帥府獲宋諜人符忠忠前嘗至中都大興府官詰問忠執文據及與泗州防禦判官張德亨知識由是獲免厚謝德亨德亨受之忠具款服乃奏其事于朝於是大興少尹王全解職德亨除名和議始于張浚中更洪遵湯思退及徒單克寧敗宋魏勝于十八里莊取楚州世宗下詔進師於是宋知樞密院周葵同知樞密院事王之望書一一如約和議始定宋遣試禮部尚書魏嵵崇信軍承宣使康湑充通問國信使取到宋主國書式並國書副本宋世為姪國約歲幣為二十萬兩匹國書仍書名再拜不稱大字大定五年正月魏嵵康湑入見其書曰姪宋皇帝謹再拜致書于叔大金聖明仁孝皇帝闕下魏嵵還復書叔大金皇帝不名不書謹再拜但曰致書于姪宋皇帝不用尊號不稱闕下和好已定罷兵詔天下以左副都點檢完顏仲為報問國信使太子詹事楊伯雄副之忠義奏官軍一十七萬三千三百餘人留馬步軍一十一萬六千二百屯戍上曰今已許宋講好而屯戍尚多可除舊軍外選馬一萬二千阿里喜稱是步軍虞候司軍共選一萬五千及簽軍一萬與舊軍通留六萬富強丁多者摘留貧難者阿里喜官給富者就用其奴其存留馬步軍於河北東西大名府速頻胡里改會寧咸平府濟州東京曷速館等路軍內約量揀取其西南西北招討司臨潢府泰州北京婆速曷懶山東東西路並行放還詔近侍局使裴滿子寧佩金牌護衛醜底符寶祗候回海佩銀牌諭諸路將帥以宋國進到歲幣銀絹二十萬兩匹盡數給與見存留及放散軍充賞曾過界者人給絹二匹銀二兩不曾過界者銀二兩絹一匹阿里喜絹一匹謀克倍軍人猛安倍謀克押軍猛安謀克年老有勞績者量與除授又詔曰其令一路全罷者先發遣之賜忠義玉束帶三月詔曰如大軍已放還丞相忠義宜先還左副元帥志寧右監軍宗留駐南京餘官非急用者並勒還任忠義朝京師上勞之曰宋國請和偃兵息民皆卿力也拜左丞相兼都元帥大定初事多權制詔有司刪定上謂宰臣曰凡已奏之事朕嘗再閲卿等毋懷懼朕於大臣豈有不相信者但軍國事不敢輕易恐或有誤也忠義對曰臣等豈敢竊意陛下但智力不及耳陛下留神萬幾天下之福也大定六年正月忠義有疾上遣太醫診視賜以御用藥物中使撫問相繼於道二月薨上親臨哭之慟輟朝奠祭賻銀千五百兩重綵五十端絹五百匹世宗將幸西京復臨奠焉命參知政事唐括安禮護喪事凡葬祭從優厚官為給之大宗正丞竟充敕祭使中都轉運副使王震充敕葬使百官送葬具一品儀物建大將旗鼓送至墳域諡武莊忠義動由禮義謙以接下敬儒士與人極和易侃侃如也善御將士能得其死力及為宰輔知無不言自漢唐以來外家多緣恩戚以致富貴又多不克其終未有兼任將相功名始終如忠義者十一年詔曰故左丞相忠義族人及昭德皇后親族人材可用者左副點檢烏古論元忠體察以聞二十一年上思忠義功勒銘墓碑泰和元年圖像衍慶宮配享世宗廟廷子揆別有傳徒單合喜上京速蘇海水人也父蒲世襲猛安合喜魁偉膂力過人一經聞見終身不忘天輔間從金源郡王婁室為扎也甚愛之天會六年以功為謀克尋領婁室親管猛安元帥府聞其才命權左翼軍事皇統二年為隴州防禦使以兵十五人敗宋兵二百於高陵以兵五百人敗宋兵二千於秦州以兵八百人敗宋兵三千五百於鳳翔以二謀克拒饒風關宋兵二千來奪其關口奮擊敗之諸軍乃得過險遷平涼尹再徙臨洮延安尹是時關陝以西初去兵革百姓多失業合喜守之以靜民多還歸者天德二年為元帥左都監陝西統軍使貞元二年以本官兼河中尹正隆六年為西蜀道兵馬都統世宗即位以手詔賜合喜曰岐國失道殺其母后橫虐兄弟流毒兆庶朕惟太祖創業之艱難勉膺大位卿之子弟皆自軍中來歸卿國家舊臣豈不知天道人事卿軍不多未宜深入當領軍屯境上陝右重地非卿無能措畫者俟兵革既定即當召卿宜自勉之大定二年復為陝西路統軍使未幾改元帥右都監表陳伐宋方略詔許以便宜從事轉左都監破宋兵于華州是時宋吳璘侵古鎮分據散關和尚原神叉口玉女潭大蟲嶺石壁寨寶雞縣兵十餘萬陷河州鎮戎軍合喜乞濟師詔以河南兵萬人益之合喜遣丹州刺史赤盞胡速魯改以兵四千守德順吳璘以二十萬人圍之統軍都監石抹迭勒將兵萬人破宋兵于河州還過德順駐兵平涼求益兵于合喜以解德順之圍合喜遣萬戶完顏習尼列大良順寧州刺史顏盞門都各將本部兵合二萬人以順義軍節度使烏延蒲離黑統押之與迭勒會吳璘聞之使偏將將兵五千人來迎前鋒特里失烏也奚王和尚擊敗之追至德順城南小溪邊璘自將大軍蔽岡阜而出烏也等馳擊之迭勒蒲離黑繼至並力戰日已暮兩軍不相辨乃解已而璘報云宋主遣使至兩國講和請各罷兵璘遂遁去蒲離黑亦引軍還自宋兵圍城至是凡四十餘日乃解初德順在圍中押軍猛安溫敦蒲里海身先士卒力戰未嘗少挫及救兵至圍解蒲里海之功為多頃之吳璘復來犯陝西州郡兵十餘萬詔以兵七千益合喜兵號二萬人慶陽尹烏延蒲轄奴延安尹高景山分領之彰化軍節度使璋通遠軍節度使烏延吾里補寧州刺史移刺高山奴京兆少尹宗室泥河恩州刺史完顏謀良虎皆備軍前任使宋人驅率商虢及華山南山之民五萬人來圍華州押軍萬戶裴滿挼剌欲堅壁守之猛安移剌沙里剌曰宋兵雖多半是居民不習戰不如擊之於是挼剌以騎兵千人敗宋前鋒追至其大軍亦敗之斬首五千餘級已而璋敗宋姚良輔軍于原州宋戍軍自寶雞以西至于大蟲嶺皆自散關遁去頃之吳璘聞赤盞胡速魯改烏延蒲里黑軍已去德順率兵號二十萬復據德順陷鞏州臨洮府臨洮少尹紇石烈騷洽死之詔贈官一階賜錢五百貫合喜以璋權都統習尼列權副統將兵二萬攻之連戰宋兵雖敗璘恃其衆不肯去分其兵之半守秦州合喜乃自行駐水洛城東自六盤山西抵石山頭分兵守之當德順秦州之兩間斷其餉道璘乃引去都統璋副統習尼列邀擊宋經略使荊臯自上八節至甘谷城殺數千人習尼列擒宋將朱永以下將校十二人宋張安撫守德順亦棄城遁胡速魯改邀擊之所殺過半擒將校十餘人遂復德順州宋之守秦州者亦自退高景山定商虢宗室泥河取環州於是臨洮鞏秦河隴蘭會原洮積石鎮戎德順商虢環華等州府一十六盡復之陝西平詔書奬諭賜以玉帶詔陝西將士猛安階昭毅以下遷兩資昭武以上遷一資謀克階六品以下遷兩資五品以上遷一資押軍猛安階昭武以上者遷一資昭毅以下武義以上遷兩資昭信以下女直人遷宣武餘人遷奉信無官者女直人授敦信餘人授忠武押軍謀克武功以下忠顯以上遷兩資忠勇以下女直人遷昭信餘人遷忠顯無官者女直人授忠顯餘人授忠翊正軍有官者遷一資無官者授兩資猛安賞銀五十兩重綵五端絹十匹權正同之正軍人給錢三十貫阿里喜十貫戰沒軍官軍士長行贈官賜錢有差五年置陝西路統軍使兼京兆尹元帥府移治河中府統軍使璋朝辭上曰合喜年老以陝西軍事委卿凡鎮防利害可訪問合喜也七年入為樞密副使改東京留守賜以衣帶佩刀詔曰卿年老以此職優佚宜勉之九年入為平章政事奏睿宗收復陝西功數事上喜納之藏之祕府封定國公十一年薨上方擊毬聞訃遂罷有司致祭備禮以葬賻銀一千二百五十兩及重綵幣帛二十一年上念其功遷其孫三合武功將軍授世襲本猛安曷懶若窟申謀克泰和元年配享世宗廟廷贊曰大定之初兵連於江淮難作於契丹謀衍挾功窩斡橫噬有弗戢之畏焉世宗獨斷召還謀衍僕散忠義受任責成矣故曰兵主於將將賢則士勇其此之謂邪紇石烈志寧有言受詔征伐則不敢辭為宰相則誠不能如知為相之難固所謂賢也秦隴之兵殆哉岌岌乎徒單合喜料敵應變若此之審亦難矣哉
