body:
  text: 金史卷七十五列傳第十三盧彥倫子璣孫亨嗣毛子廉李三錫孔敬宗李師夔沈璋左企弓虞仲文曹勇義康公弼附左泌弟淵姪光慶盧彥倫臨潢人遼天慶初蕭貞一留守上京置為吏以材幹稱是時臨潢之境多盜而城中兵無統屬者府以彥倫為材薦之於朝即授殿直勾當兵馬公事遼兵敗於出河店還至臨潢散居民家令給養之而軍士縱恣侵擾無所不至百姓殊厭苦之留守耶律赤狗兒不能禁戢乃召軍民諭之曰契丹漢人久為一家今邊方有警國用不足致使兵士久溷父老間有侵擾亦當相容衆皆無敢言者彥倫獨曰兵興以來民間財力困竭今復使之養士以國家多故義固不敢辭而此輦恣為強暴人不能堪且番漢之民皆赤子也奪此與彼謂何初取臨潢軍中有辛訛特剌者舊為臨潢驛吏與彥倫善使往招諭彥倫殺之遼授彥倫團練使勾當留守司公事天輔四年彥倫從留守撻不野出降授夏州觀察使權發遣上京留守事師還撻不野以城叛彥倫乃率所部逐撻不野盡殺城中契丹遣使來報未幾遼將耶律馬哥以兵取臨潢彥倫拒守者七月會援兵至敵解圍去因赴闕天會二年知新城事城邑初建彥倫為經畫民居公宇皆有法改靜江軍節度留後知咸州煙火事未幾遷靜江軍節度使天眷初行少府監兼都水使者充提點京城大內所改利涉軍節度使未閲月還復為提點大內所彥倫性機巧能迎合悼后意由是頗見寵用歲餘遷侍衛親軍馬步軍都指揮使為宋國歲元使改禮部尚書加特進封郇國公天德二年出為大名尹明年詔彥倫營造燕京宮室以疾卒年六十九子璣璣字正甫以蔭補閣門祗候纍遷客省使兼東上閣門使改提點太醫教坊司天充大定十五年宋主生日副使遷同知宣徽院事丁母憂起復太府監改開遠軍節度使入為右宣徽使章宗即位轉左宣徽使致仕明昌四年起復左宣徽使改定武軍節度使復為左宣徽使是時璣年已七十詔許朝參得坐於廊下復致仕泰和初詔璣天壽節預宴二年元妃李氏生皇子滿三月章宗以璣老而康強命以所策杖為洗兒禮物章宗幸玉泉山詔璣與致仕宰相俱會食許策杖給扶後預天壽節上命璣與大臣握槊戲璣獲勝焉從上秋山賜名馬上曰酬卿博直其眷遇如此泰和六年卒年八十子亨嗣亨嗣字繼祖以廕補閣門祗候內供奉調同監平涼府醋務改同監天山鹽場丁母憂服闋監萊州酒課纍調監豐州任丘汲縣東平酒務課最遷白登縣令明昌四年行六部差規措軍前糧料入為典給直長改西京戶籍判官歷官西京中都太倉使中都戶籍判官尚醞署丞丁父憂大安初復為典給署丞兼太子家令崇慶元年遷同知順天軍節度使事是時兵興徵調煩急亨嗣以辦最遷定遠大將軍入為戶部員外郎貞祐二年遷莒州刺史三年山東宣撫司討楊安兒亨嗣行六部兵罷還州興定二年卒年六十一亨嗣與弟亨益盡友愛之道亨嗣初以祖廕得官大定十六年父璣為同知宣徽院事當廕子亨嗣以讓弟亨益亨益早卒子兟兟幼稚亨嗣盡以舊業田宅奴畜財物與之毛子廉本名八十臨潢長泰人材勇善射遼季羣盜起募勇士子廉應募遼主召見賜甲仗率百人會所在官兵捕盜以功授東頭供奉官賜良馬天輔四年遣謀克辛斡特剌移剌窟斜招諭臨潢子廉率戶二千六百來歸令就領其衆佩銀牌招未降軍民盧彥倫怒子廉先降殺子廉妻及二子使騎兵二千伺取子廉子廉與窟斜經險阻中騎兵圍之兩騎突出直犯子廉子廉引弓斃其一人其一人挺槍幾中子廉腋子廉避其槍與搏戰生擒之乃彥倫健將孫延壽也餘衆潰去天會三年除上京副留守久之兼鹽鐵事天眷中除燕京麴院都監遼王宗幹問宰相曰子廉有功何為下遷宰相以例對宗幹曰盧彥倫何不除此職子廉之功十倍彥倫在臨潢十餘年吏民畏愛如一日誰能及此是時盧彥倫已以少府監除節度使故宗幹引以為比除寧昌軍節度使海陵弒熙宗子廉聞之歎曰曾不念國王定策之功耶乃致仕大定二年卒李三錫字懷邦錦州安昌人以資得官遼季盜攻錦州州人推三錫主兵事設機應變城賴以完録功授左承制遼主走天德劉彥宗辟三錫將兵保白雲山金兵次來州三錫以其衆降攝臨海軍節度副使參預元帥府軍事改知嚴州宗望伐宋三錫領行軍猛安敗郭藥師軍於白河進官安州防禦使再克汴京三錫從闍母護宋二主北歸復知嚴州改歸德軍節度副使詔廢齊國擇吏三十人與俱行三錫在選中還為慶州刺史三遷武勝軍節度使察廉第一遷三階改安國軍節度使除河北西路轉運使致仕三錫政事強明所至稱治世宗舊聞其名大定初起為北京路都轉運使制下而三錫已卒孔敬宗字仲先其先東垣人石晉末徙遼陽遼季敬宗為寧昌劉宏幕官斡魯古兵至境上敬宗勸劉宏迎降遂以敬宗為鄉導拔顯州以功補順安令天輔二年詔敬宗與劉宏率懿州民徙內地授世襲猛安知安州事將兵千人從宗望伐宋汴京平宗望命敬宗守汴嘗自汴馳驛至河北還至河上會日暮無舟敬宗策馬亂流遂達南岸遷靜江軍節度使歷石辰信磁四州刺史階光祿大夫海陵問張浩曰卿識孔敬宗否何階高職下也浩對曰國初敬宗勸劉宏以懿州效順其後從軍積勞有司不知故一概常調耳明日除寧昌軍節度使徙歸德軍致仕大定二年卒李師夔字賢佐奉聖永興人少倜儻有大志以廕入仕為本州麴監天輔六年太祖襲遼主于鴛鴦濼郡守委城遁去衆無所屬相與叩門請師夔主郡事師夔許之乃搜卒治兵迪古乃兵至奉聖州師夔與其故人沈璋密謀出降曰一城之命懸於此舉璋曰君言是矣如軍民不從奈何師夔即率親信十數輩詰旦出城見余睹與之約曰今已服從願無以兵入城及俘掠境內余睹許諾詔以師夔領節度以璋佐之賜師夔駿馬二俾招未附者許以便宜從事明年加左監門衛大將軍劇賊張勝以萬人逼城師夔度衆寡不敵乃僞與之和日致饋給勝信之師夔乘其不備使人刺勝殺之以其首徇曰汝輩皆良民脅從至此今元惡已誅可棄兵歸復其所賊衆大驚皆散去別賊焦望天尹智穆率兵數千來寇師夔以兵臨之設伏歸路使人反間之智穆果疑望天先引去智穆勢孤亦還遇伏而敗遂執斬之是後賊衆不敢入境以勞遷靜江軍節度留後纍遷武平軍節度使改東京路轉運使徙陝西東路轉運使致仕封任國公卒年八十五沈璋字之達奉聖州永興人也學進士業迪古乃軍至上谷璋與李師夔謀開門迎降明日擇可為守者衆皆推璋璋固稱李師夔於是授師夔武定軍節度使以璋副之授太常少卿遷鴻臚卿丁母憂起復山西路都轉運副使加衛尉卿從伐宋汴京平衆爭趨資貨璋獨無所取惟載書數千卷而還太行賊陷潞州殺其守姚璠官軍討平之命璋權知州事璋至招復逋逃賑養困餓收其橫尸葬之未幾民頗安輯初賊黨據城潞之軍卒當緣坐者七百人帥府牒璋盡誅之璋不從帥府聞之大怒召璋呵責且欲殺璋左右震恐璋顏色不動從容對曰招亡撫存璋之職也此輩初無叛心蓋為賊所脅有不得已者故招之復來今欲殺之是殺降也苟利於衆璋死何憾少頃怒解因召潞軍曰吾始命戮汝今汝使君活爾矣皆感泣而去朝廷聞而嘉之拜左諫議大夫知潞州事百姓為之立祠移知欣州改同知太原尹加尚書禮部侍郎時介休人張覺聚黨亡命山谷鈔掠邑縣招之不肯降曰前嘗有降者皆殺之今以好言誘我是欲殺我耳獨得侍郎沈公一言我乃無疑於是命璋往招之覺即日降轉尚書吏部侍郎西京副留守同知平陽尹遷利涉軍節度使為東京路都轉運使改鎮西軍節度使天德元年以病致仕卒年六十子宜中天德三年賜楊建中榜及第贊曰危難之際兩軍方爭專城之將國家之輕重繫焉李師夔非有君命為衆所推又能全活其人猶有說也盧彥倫之降雖云城潰初志不確何尤乎毛子廉至如子廉不仕海陵沈璋以片言降張覺一善足稱何可掩也左企弓字君材八世祖皓後唐棣州刺史以行軍司馬戍燕遼取燕使守薊因家焉企弓讀書通左氏春秋中進士再遷來州觀察判官蕭英弼賊昭懷太子窮治黨與多連引企弓辨析其寃免者甚衆自御史知雜事出為中京副留守按刑遼陽有獄本輕而入之重者已奏待報企弓釋之以聞纍遷知三司使事天慶末拜廣陵軍節度使同中書門下平章事知樞密院事金兵已拔上京北樞密院恐忤旨不以時奏遼故事軍政皆關決北樞密院然後奏御企弓以聞遼主曰兵事無乃非卿職邪對曰國勢如此豈敢循例為自容計因陳守備之策拜中書侍郎平章事監修國史時遼主聞金已克中京將西幸以避之企弓諫不聽遼主自鴛鴦濼亡保陰山秦晉國王耶律捏里自立于燕廢遼主為湘陰王改元德興企弓守司徒封燕國公虞仲文參知政事領西京留守同中書門下平章事內外諸軍都統曹勇義中書侍郎平章事樞密使燕國公康公弼參知政事簽樞密院事賜號忠烈翊聖功臣德妃攝政企弓加侍中宋兵襲燕奄至城中已而敗走或疑有內應者欲根株之企弓爭之乃止太祖至居庸關蕭妃自古北口遁去都監高六等送款于太祖太祖徑至城下高六等開門待之太祖入城受降企弓等猶不知太祖駐蹕燕京城南企弓等奉表降太祖俾復舊職皆受金牌企弓守太傅中書令仲文樞密使侍中秦國公勇義以舊官守司空公弼同中書門下平章事樞密副使權知院事簽中書省封陳國公遼致仕宰相張琳進上降表詔曰燕京應琳田宅財物並給還之琳年高不能入見止令其子弟來太祖既定燕從初約以與宋人企弓獻詩略曰君王莫聽捐燕議一寸山河一寸金太祖不聽是時置樞密院于廣寧府企弓等將赴廣寧張覺在平州有異志太祖欲以兵送之企弓等辭兵曰如此是促之亂也及過平州舍于栗林下張覺使人殺之企弓年七十三諡恭烈天會七年贈守太師遣使致奠正隆二年改贈特進濟國公虞仲文字質夫武州寧遠人也七歲知作詩十歲能屬文日記千言刻苦學問第進士纍仕州縣以廉能稱舉賢良方正對策優等擢起居郎史館修撰三遷至太常少卿宰相有左降仲文獨出餞之或指以為黨仲文乃求養親久之召復前職宰相薦文行第一權知制誥除中書舍人討平白霫拜樞密直學士權翰林學士為翰林侍講學士年五十五卒諡文正天會七年贈兼中書令正隆二年改贈特進濮國公曹勇義廣寧人第進士除長春令樞府辟令史上書陳時政纍擢館閣遷樞密副都承旨權燕京三司使加給事中召為樞密副使加太子少保與大公鼎虞仲文龔誼友善與虞仲文同在樞密羣小擠之復出為三司使加宣政殿大學士卒諡文莊天會七年贈守太保正隆二年改贈特進定國公康公弼字伯迪其先應州人曾祖胤遼保寧間以戰功授誓券家于燕之宛平公弼好學年二十三中進士除著作郎武州軍事判官辟樞府令史求外補出為寧遠令縣中隕霜殺禾稼漕司督賦急繫之獄公弼上書朝廷乃釋之因免縣中租賦縣人為立生祠監平州錢帛庫調役糧于川州大盜侯概陷川州使護送公弼出境曰良吏也權乾州節度使卒諡忠肅天會七年贈侍中正隆二年改贈特進道國公企弓子泌瀛淵泌字長源企弓長子也仕遼官至棣州刺史太祖平燕泌從企弓歸朝既而東遷至平州企弓為張覺所害泌復還燕是時以燕與宋宣撫司遣至汴泌以平州仇人在是乃間道奔還朝廷嘉之擢西上閣門使從宋王宗望南伐破真定有功知祁州歷刺澤隰等州貞元初為濬州防禦使遷陝西路轉運使封戴國公泌性夷淡好讀莊老年六十一即請致仕親友或以為早泌嘆曰豫年三十秉旄鉞侵尋仕路又三十年名遂身退可矣時人高之卒年七十四淵纍官燕京副留守中京路都轉運使歷河北東路中都路都轉運使淵貪鄙三任漕事務以錢穀自營在中都凡八年不求遷與李通許霖交關賄賂詭納漕司諸物規取財利世宗即位淵使其子貽慶詣東京上表特賜貽慶任忠傑榜第三甲進士授從仕郎貽慶還中都世宗詔淵曰凡殿位張設悉依舊毋增益不得役使一夫以擾百姓謹宮禁出入而已大定二年改沁南軍節度使世宗素知其為人戒之曰卿宰相子練習朝政前為漕司朕甚鄙之毋或刻削百姓若復敢爾勿思再用淵到懷州未幾坐前為中都轉運嘗盜用官材木除名子光慶光慶字君錫幼頴悟沉厚少言淵嘗謂所親曰世吾家者此子也以廕補閣門祗候遷西上閣門副使丁父憂起復東上閣門副使再轉西上東上閣門使兼太廟署令光慶好古讀書識大義喜為詩善篆隸尤工大字世宗行郊禮受尊號及受命寶皆光慶篆凡宮廟榜署經光慶書者人稱其有法典領原廟坤厚陵壽安宮工役不為苛峻使勞逸相均身兼數職勤慎周密未嘗自伐世宗獨察之初御史大夫璋請製大金受命寶有司以秦璽文進上命以大金受命萬世之寶為文徑四寸八分厚一寸四分蟠龍紐高厚各四寸六分有半禮部尚書張景仁少府監張僅言典領工事詔光慶篆之遷同知宣徽院事改少府監丁母憂起復右宣徽使世宗幸上京光慶往上京治儀仗制度時人以為得宜二十五年卒年五十一上遣使致祭賻銀三百兩重綵十端絹百匹平時喜為善言蓄善藥號善善道人晚信浮屠法自作真贊語皆任達云贊曰左企弓虞仲文曹勇義康公弼四子者皆有才識之士其事遼主數有論建及其受爵僭位委質二君隕身逆黨三者胥失之哀哉
