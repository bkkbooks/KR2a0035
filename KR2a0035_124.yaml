body:
  text: 金史卷一百二十四列傳第六十二忠義四馬慶祥商衡术甲脫魯灰楊達夫馮延登烏古孫仲端烏古孫奴申蒲察琦蔡八兒溫敦昌孫完顏絳山畢資倫郭蝦馬慶祥字瑞寧本名習禮吉思先世自西域入居臨洮狄道以馬為氏後徙家淨州天山泰和中試補尚書省譯史大安初衛王始通問大元選使副上曰習禮吉思智辨通六國語往必無辱也使還授開封府判官內城之役充應辦使不擾而事集未幾大元兵出陝右朝廷命完顏仲元為鳳翔元帥舉慶祥為副上曰此朕志也且築城有勞即拜鳳翔府路兵馬都總管判官元光元年冬十一月聞大將萌古不花將攻鳳翔行省檄慶祥與治中胥謙分道清野將行命畫工肖其貌付其家人或曰君方壯何乃為此不祥慶祥曰非汝所知也明日遂行遇先鋒于澮水戰不利且行且戰將及城會大兵邀其歸路度不能脫令其騎曰吾屬荷國厚恩竭力效死乃其職也諸騎皆曰諾人殊死戰良久矢盡大兵圍數匝欲降之軍擁以行語言往復竟不屈而死年四十有六元帥郭仲元輿其尸以歸葬鳳翔普門寺之東事聞詔贈輔國上將軍州刺史諡忠愍胥謙及其子嗣亨亦不屈死謙贈輔國上將軍彰化軍節度使嗣亨贈威遠將軍鳳翔府判官楨州金勝堡提控僕散胡沙亦死贈銀青榮祿大夫正大二年哀宗詔褒死節士若馬習禮吉思王清田榮李貴王斌馮萬奴張德威高行中程濟姬玘張山等十有三人為立褒忠廟仍録其孤二人者逸其名餘亦無所考商衡字平叔曹州人至寧元年特恩第一人授鄜州洛郊主簿以廉能換郿縣尋辟威戎令興定三年歲飢民無所於糴衡白行省得開倉賑貸全活者甚衆後因地震城圮夏人乘釁入侵衡率蕃部土豪守禦應敵保以無虞秩滿縣人為立生祠再辟原武令未幾入為尚書省令史轉戶部主事兩月拜監察御史哀宗姨郕國夫人不時出入宮闈干預政事聲迹甚惡衡上章極言自是郕國被召乃敢進見內族慶山奴將兵守盱眙與李全戰敗朝廷置而不問衡上言自古敗軍之將必正典刑不爾則無以謝天下詔降慶山奴為定國軍節度使戶部侍郎權尚書曹溫之女在掖庭親舊干預權利其家人填委諸司貪墨彰露臺臣無敢言者衡歷數其罪詔罷溫戶部改太后府衛尉再上章言溫果可罪當貶逐無罪則臣為妄言豈有是非不別而兩可之理哀宗為之動容乃出溫為汝州防禦使未幾為右司都事改同知河平軍節度使未赴改樞密院經歷官遙領昌武軍同知節度使事丞相完顏賽不領陝西行省奏衡為左右司員外郎密院表留有旨行省地重急於得人可從丞相奏明年召還行省再奏留之正大八年以母喪還京師十月起復為秦藍總帥府經歷官天興元年二月關陝行省徒單兀典等敗於鐵嶺衡未知諸帥存歿招集潰軍以須其至遂為兵士所得欲降之不為屈監至長水縣東嶽祠前誘之使招洛陽衡曰我洛陽識何人為汝招之耶兵知不可誘欲捽其巾衡瞋目大呼曰汝欲脅從我耶終不肯降望闕瞻拜曰主將無狀亡兵失利臣之罪責亦無所逃但以一死報國耳遂引佩刀自剄年四十有六正大初河間許古詣闕拜章言八座率非其材省寺小臣有可任宰相者不大升黜之則無以致中興章奏詔古赴都堂問孰為可相者古以衡對則衡之材可知矣术甲脫魯灰上京人世為北京路部長其先有開國功授北京路宋阿答阿猛安脫魯灰自幼襲爵貞祐二年宣宗遷汴率本部兵赴中都扈從上喜特授御前馬步軍都總領宋人略南鄙命同簽樞密院事時全將大軍南伐脫魯灰率本部屢摧宋兵破城寨以功遙授昌武軍節度使元帥右都監行蔡息等路元帥府事既而宋人有因畜牧越境者邏卒擒之法當械送朝廷脫魯灰曰國家自遷都以來境土日蹙民力雕耗幸邊無事人稍得息若戮此曹則邊釁復生兵連禍結矣不如釋之以絶兵端哀宗即位授鎮南軍節度使蔡州管內觀察使行戶工部尚書時大元兵入陝西乃上章曰宋人與我為讎敵頃以力屈自保非其本心今陝西被兵河南出師轉戰連年不絶兵死于陳民疲于役國力竭矣壽泗一帶南接盱楚紅襖賊李全巢穴也萬一宋人諜知與全乘虛而入腹背受敵非計之得者也臣已令所部沿邊警斥以備非常宜敕壽泗帥臣謹斥候嚴烽燧常若敵至此兵法所謂無恃其不來恃吾有以待之之道也上是而行之正大二年秋傳言宋人將入侵農司令民先期刈禾脫魯灰曰夫民所恃以仰事俯育及供億國家者秋成而已今使秋無所獲國何以仰民何以給遂遣軍巡邏聽民待熟而刈宋人卒不入寇諜者又報光州汪太尉將以八月發兵來取真陽議者請籍丁男以備脫魯灰曰汪太尉恇怯人耳寧敢為此必姦人聲言來寇欲使吾民廢務也不可信已而果然叛人焦風子者沿河南北屢為反覆朝廷授以提控之職令將三千人戍遂平四年春風子謀率其衆入宋脫魯灰策之以兵數千伏鄱陽道賊果夜出此途伏發殪之七年大元兵攻藍關至八渡倉退舉朝皆賀以為無事脫魯灰獨言曰潼關險隘兵精足用然商洛以南瀕於宋境大山重復宋人不知守國家亦不能逾宋境屯戍大兵若由散關入興元下金房繞出襄漢北入鄧鄙則大事去矣宜與宋人釋怨諭以輔車之勢唇亡齒寒彼必見從據其險要以備不然必敗是秋改授小關子元帥屯商州大吉口九年春從行省參政徒單吾典將潼關兵入援至商山遇雪大兵邀擊之士卒飢凍不能戰而潰脫魯灰被執不屈拔佩刀自殺楊達夫字晉卿耀州三原人泰和三年進士有才幹所至可紀召補省掾草奏章坐字誤降平涼府判官嘗主鄠縣簿事一從簡吏民樂之達夫亦愛其山水之勝因家焉日以詩酒自娛了無宦情會有詔徙民東入關達夫與衆行及韶避兵于州北之橫嶺為遊騎所執將褫衣害之達夫挺然直立馬首略無所懼稍侵辱之即大言曰我金國臣子既為汝所執不過一死忍裸袒以黷天日耶遂見殺兩山潛伏之民竊觀之者皆相告曰若此好官異日祠之當作我橫嶺之神馮延登字子俊吉州吉鄉人世業醫延登幼頴悟既長事舉業承安二年登詞賦進士第調臨真簿德順州軍事判官泰和元年轉寧邊令大安元年秋七月霜害稼民艱于食延登發粟賑貸全活甚衆貞祐二年補尚書省令史尋授河中府判官兼行尚書省左右司員外郎興定五年入為國史院編修官改太常博士元光二年知登聞鼓院兼翰林修撰奉使夏國就充接送伴使正大七年十二月遷國子祭酒假翰林學士承旨充國信使以八年春奉國書朝見於虢縣御營有旨問汝識鳳翔帥否對曰識之又問何如人曰敏於事者也又問汝能招之使降即貰汝死不則殺汝矣曰臣奉書請和招降豈使職乎招降亦死還朝亦死不若今日即死為愈也明日復問汝曾思之不對如前問至再三執義不回又明日乃喻旨云汝罪應死但古無殺使者理汝愛汝須髯猶汝命也叱左右以刀截去之延登岸然不動乃監之豐州二年後放還哀宗撫慰久之復以為祭酒歷禮吏二部侍郎權刑部尚書明年大元兵圍汴京倉猝逃難為騎兵所得欲擁而北行延登辭情慷慨義不受辱遂躍城旁井中年五十八烏古孫仲端本名卜吉字子正承安二年策論進士宣宗時纍官禮部侍郎與翰林待制安延珍奉使乞和于大元謁見太師國王木華黎於是安延珍留止仲端獨往並大夏涉流沙踰嶺至西域進見太祖皇帝致其使事乃還自興定四年七月啓行明年十二月還至朝廷嘉其有奉使勞進官兩階延珍進一階歷裕州刺史正大元年召為御史中丞奉詔安撫陝西及歸權參知政事正大五年十二月知開封府事完顏麻斤出吏部郎中楊居仁以奉使不職尚書省具獄有旨釋之備再使仲端言曰麻斤出等辱君命失臣節大不敬宜償禮幣誅之奏上麻斤出等免死除名會議降大軍事及諍太后奉佛涉亡家敗國之語上怒貶同州節度使哀宗將遷歸德召為翰林學士承旨兼同簽大睦親府事留守汴京及大元兵圍汴日久食盡諸將不相統一仲端自度汴中事變不測一日與同年汝州防禦裴滿思忠小飲談太學同舍事以為笑樂因數言人死亦易事耳思忠曰吾兄何故頻出此語仲端因寫一詩示之其詩大概謂人生大似巢燕或在華屋杏梁或在村居茅茨及秋社甫臨皆當逝去人生雖有富貴貧賤不同要之終有一死耳書畢連飲數杯送思忠出門曰此別終天矣思忠去仲端即自縊其妻亦從死明日崔立變仲端為人樂易寬厚知大體奉公好善獨得士譽一子名愛實嘗為護衛奉御以誅官奴功授節度世襲千戶思忠名正之本名蒲剌篤亦承安二年進士烏古孫奴申字道遠由譯史入官性伉特敢為有直氣嘗為監察御史時中丞完顏百家以酷烈聞奴申以事糾罷朝士聳然後為左司郎中近侍局使皆有名哀宗東遷為諫議大夫近侍局使行省左右司郎中兼知宮省事留汴京居守崔立變之明日同御史大夫裴滿阿虎帶自縊死於臺中是日戶部尚書完顏珠顆亦自縊阿虎帶字仲寧珠顆字仲平皆女直進士時不辱而死者奉御完顏忙哥大睦親府事烏古孫仲端大理裴滿德輝右副點檢完顏阿撒參政完顏奴申之子麻因可知者數人餘各有傳蒲察琦本名阿憐字仁卿棣州陽信人試補刑部掾兄世襲謀克兄死琦承襲正大六年秦藍總帥府辟琦為安平都尉粘葛合典下都統兼知事其冬小關破事勢已迫琦常在合典左右合典令避矢石琦不去曰業已從公死生當共之尚安所避耶哀宗遷歸德汴京立講議所受陳言文字其官則御史大夫納合寧以下十七人皆朝臣之選而琦以有論議預焉時左司都事元好問領講議兼看讀陳言文字與琦甚相得崔立變後令改易巾髻琦謂好問曰今日易巾髻在京人皆可獨琦不可琦一刑部譯史襲先兄世爵安忍作此今以一死付公然死則即死付公一言亦剩矣因泣涕而別琦既至其家母氏方晝寢驚而寤琦問阿母何為母曰適夢三人潛伏梁間故驚寤仁卿跪曰梁上人鬼也兒意在懸梁阿母夢先見耳家人輩泣勸曰君不念老母歟母止之曰勿勸兒所處是矣即自縊時年四十餘琦性沉靜好讀書知古今事其母完顏氏以孝謹稱蔡八兒不知其所始趫捷有勇性純質可任時為忠孝軍元帥天興二年自息州入援會大將奔盞遣數百騎駐城東令人大呼曰城中速降當免殺戮不然無噍類矣於是上登城遣八兒率挽強兵百餘潛出暗門渡汝水左右交射之自是兵不復薄城築長壘為久困計上令分軍防守四城以殿前都點檢兀林答胡土守西面八兒副之已而哀宗度蔡城不守傳位承麟羣臣入賀班定八兒不拜謂所親曰事至於此有死而已安能更事一君乎遂戰死毛佺者恩州人貞祐中為盜宣宗南渡率衆歸國署為義軍招撫哀宗遷蔡以佺為都尉圍城之戰佺力居多城破自縊其子先佺戰歿時死事者則有閻忠郝乙王阿驢樊喬焉忠滑州人衛王時開州刺史賽哥叛忠單騎入城縛賽哥以出由是漸被擢用乙磁州人同日戰死哀宗贈官阿驢樊喬皆河中人初為炮軍萬戶鳳翔破北降從軍攻汴司炮如故即紿主者曰炮利於短不利於長信之使截其木數尺綆十餘握由是機雖起伏所擊無力即日二人皆捐家走城是時女直人無死事者長公主言於哀宗曰近來立功效命多諸色人無事時則自家人爭強有事則他人盡力焉得不怨上默然餘各有傳溫敦昌孫皇太后之姪衛尉七十五之子為人短小精悍性復愷弟纍遷諸局分官上幸蔡授殿前左副點檢圍城中數引軍潛出巡邏時尚食須魚汝河魚甚美上以水多浮尸惡之城西有積水曰練江魚大且多往捕必軍衛乃可昌孫常自領兵以往所得動千餘斤分賜將士後知其出左右設伏伺而邀之力戰而死蔡城破前監察御史納坦胡失打聞之慟哭投水而死完顏絳山哀宗之奉御也系出始祖天興二年十月蔡城被圍城中飢民萬餘訴於有司求出有司難之民大呼於道上聞之遣近侍官分監四門門日出千人必老稚羸疾者聽其出絳山時在北門憫人之飢出過其數命杖之四十然出者多泄城中虛實尋止之三年正月己酉蔡城破哀宗傳位承麟即自縊于幽蘭軒權點檢內族斜烈矯制召承御石盞氏近侍局大使焦春和內侍局殿頭宋圭赴上前曉以名分大義及侍從官巴良弼阿勒根文卿皆從死斜烈將死遺言絳山使焚幽蘭軒火方熾子城破大兵突入近侍左右皆走避獨絳山留不去為兵所執問曰汝為誰絳山曰吾奉御絳山也兵曰衆皆散走而獨後何也曰吾君終于是吾候火滅灰寒收瘞其骨耳兵笑曰若狂者耶汝命且不能保能瘞而君耶絳山曰人各事其君吾君有天下十餘年功業弗終身死社稷忍使暴露遺骸與士卒等耶吾逆知君輩必不遺吾吾是以留果瘞吾君之後雖寸斬吾不恨矣兵以告其帥奔盞曰此奇男子也許之絳山乃掇其餘燼裹以弊衾瘞于汝水之旁再拜號哭將赴汝水死軍士救之得免後不知所終畢資倫縉山人也泰和南征以傭雇從軍軍還例授進義副尉崇慶元年改縉山為鎮州术虎高琪為防禦使行元帥府事于是州選資倫為防城軍千戶至寧元年秋大元兵至鎮州高琪棄城遁資倫行及昌平收避遷民兵轉戰有功擢授都統軍軍數千與軍中將領沈思忠子都輩同隸一府屯鄭州及衛州時號沈畢軍積功至都總領思忠為副都尉僕散阿海南征軍次梅林關不得過阿海問諸將誰能取此關者資倫首出應命問須軍士幾何曰止用資倫所統足矣不煩餘軍明日遲明出宋軍不意引兵薄之萬衆崩遂取梅林關阿海軍得南行留提控王祿軍萬人守關不數日宋兵奪關守之阿海以梅林歸途為敵據計無所出復問誰能取梅林者以帥職賞之資倫復出應命以本軍再奪梅林阿海破蘄黃按軍而還論功資倫第一授遙領同知昌武軍節度使宣差總領都提控既而樞密院以資倫思忠不相能恐敗事以資倫統本軍屯泗州興定五年正月戊戌提控王祿湯餅會軍中宴飲宋龜山統制時青乘隙襲破泗州西城資倫知失計墮南城求死為宋軍所執以見時青青説之曰畢宣差我知爾好男子亦宜相時達變金國勢已衰弱爾肯降我宋亦不負爾若不從見劉大帥即死矣資倫極口罵曰時青逆賊聽我言我出身至貧賤結柳器為生自征南始得一官今職居三品不幸失國家城池甘分一死尚不能報肯從汝反賊求生耶青知無降意下盱眙獄時臨淮令李某者亦被執後得歸為泗州從宜移剌羊哥言其事羊哥以資倫惡語罵時青必被殺即以死不屈節聞于朝時資倫子牛兒年十二居宿州收充皇后位奉閣舍人宋人亦賞資倫忠憤不撓欲全活之鈐以鐵繩囚于鎮江府土獄略給衣食使不至寒餓脅誘百方時一引出問云汝降否資倫或罵或不語如是十四年及盱眙將士降宋宋使總帥納合買住已下北望哭拜謂之辭故主驅資倫在旁觀之資倫見買住罵曰納合買住國家未嘗負汝何所求死不可乃作如此觜鼻耶買住俯首不敢仰視及蔡州破哀宗自縊宋人以告資倫資倫歎曰吾無所望矣容我一祭吾君乃降耳宋人信之為屠牛羊設祭鎮江南岸資倫祭畢伏地大哭乘其不防投江水而死宋人義之宣示四方仍議為立祠鎮江之囚有方士者親嘗見之以告元好問及言泗州城陷資倫被執事且曰資倫長身面赤色顴頰微高髯疏而黃資稟質直重然諾故其堅忍守節卓卓如此宣宗實録載資倫為亂兵所殺當時傳聞不得其實云郭蝦會州人世為保甲射生手與兄祿大俱以善射應募興定初祿大以功遷遙授同知平涼府事兼會州刺史進官一階賜姓顏盞夏人攻會州祿大遙見其主兵者人馬皆衣金出入陳中約二百餘步一發中其吭殪之又射一人矢貫兩手於樹敵大駭城破祿大蝦俱被禽夏人憐其技囚之兄弟皆誓死不屈朝廷聞之議加優奬而未知存沒乃特遷祿大子伴牛官一階授巡尉職以旌其忠其後兄弟謀奔會自拔其鬚事覺祿大竟為所殺蝦獨拔歸上思祿大之忠命復遷伴牛官一階遙授會州軍事判官蝦遙授鞏州鈐轄會言者乞奬用祿大弟遂遷蝦官兩階授同知蘭州軍州事興定五年冬夏人萬餘侵定西蝦敗之斬首七百獲馬五十匹以功遷同知臨洮府事元光二年夏人步騎數十萬攻鳳翔甚急元帥赤盞合喜以蝦總領軍事從巡城濠外一人坐胡牀以箭力不及氣貌若蔑視城守者合喜指似蝦云汝能射此人否蝦測量遠近曰可蝦平時發矢伺腋下甲不掩處射之無不中即持弓矢伺坐者舉肘一發而斃兵退升遙授靜難軍節度使尋改通遠軍節度使授山東西路斡可必剌謀克仍遣使賞賚遍諭諸郡焉是年冬蝦與鞏州元帥田瑞攻取會州蝦率騎兵五百皆被赭衲蔽州之南山而下夏人猝望之以為神城上有舉手於懸風版者蝦射之手與版俱貫凡射死數百人夏人震恐乃出降蓋會州為夏人所據近四年至是復焉正大初田瑞據鞏州叛詔陝西兩行省並力擊之蝦率衆先登瑞開門突出為其弟濟所殺斬首五千餘級以功遷遙授知鳳翔府事本路兵馬都總管元帥左都監兼行蘭會洮河元帥府事六年九月蝦進西馬二匹詔曰卿武藝超絶此馬可充戰用朕乘此豈能盡其力既入進即尚物也就以賜卿仍賜金鼎一玉兔鶻一並所遣郭倫哥等物有差天興二年哀宗遷蔡州慮孤城不能保擬遷鞏昌以粘葛完展為鞏昌行省三年春正月完展聞蔡已破欲安衆心城守以待嗣立者乃遣人稱使者至自蔡有旨宣諭綏德州帥汪世顯者亦知蔡凶問且嫉完展制己欲發矯詔事因以兵圖之然懼蝦威望乃遣使約蝦並力破鞏昌使者至蝦謂之曰粘葛公奉詔為行省號令孰敢不從今主上受圍於蔡擬遷鞏昌國家危急之際我輩既不能致死赴援又不能叶衆奉迎乃欲攻粘葛公先廢遷幸之地上至何所歸乎汝帥若欲背國家任自為之何及於我世顯即攻鞏昌破之劫殺完展送款於大元復遣使者二十餘輩諭蝦以禍福不從甲午春金國已亡西州無不歸順者獨蝦堅守孤城丙申歲冬十月大兵並力攻之蝦度不能支集州中所有金銀銅鐵雜鑄為炮以擊攻者殺牛馬以食戰士又自焚廬舍積聚曰無至資兵日與血戰而大兵亦不能卒拔及軍士死傷者衆乃命積薪於州廨呼集家人及城中將校妻女閉諸一室將自焚之蝦之妾欲有所訴立斬以徇火既熾率將士於火前持滿以待城破兵填委以入鏖戰既久士卒有弓盡矢絶者挺身入火中蝦獨上大草積以門扉自蔽發二三百矢無不中者矢盡投弓劍于火自焚城中無一人肯降者蝦死時年四十五土人為立祠完展字世昌泰和三年策論進士初為行省以蠟丸為詔期以天興二年九月集大軍與上會於饒峯關出宋不意取興元既而不果云
