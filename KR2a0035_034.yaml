body:
  text: 金史卷三十四志第十五禮七社稷風雨雷師嶽鎮海瀆貞元元年閏十二月有司奏建社稷壇于上京大定七年七月又奏建壇于中都社為制其外四周為垣南向開一神門門三間內又四周為垣東西南北各開一神門門三間各列二十四戟四隅連飾罘罳無屋於中稍南為壇位令三方廣闊一級四陛以五色土各飾其方中央覆以黃土其廣五丈高五尺其主用白石下廣二尺剡其上形如鐘埋其半壇南栽栗以表之近西為稷壇如社壇之制而無石主四壝門各五間兩孰三門門列十二戟壝有角樓樓之面皆隨方色飾之饌幔四楹在北壝門西北向神在西壝門外南向廨在南圍牆內東西向有望祭堂三楹在其北雨則於是堂望拜堂之南北各為屋二楹三獻及司徒致齊幕次也堂下南北相向有齊舍二十楹外門止一間不施鴟尾祭用春秋二仲月上戊日樂用登歌遣官行事太尉一司徒一已上奏差亞獻太常卿一終獻光祿卿一省差太常卿一光祿卿一郊社令一學士院官一請御署祝版大樂令一太官令二監祭御史二太常博士二廩犧令一奉禮郎一協律郎二司尊罍二奉爵酒官一太祝七祝史四盥洗官二爵洗官二執巾篚官四齊郎四十八贊者一禮直官十已上部差守衛十二人各衣其方色其服官給舉瘞四衣皂軍人內差其衣自備前三日質明行事官受誓戒於尚書省御史臺太常寺引衆官就位禮直官贊揖對揖訖太尉誓曰某月某日上戊祭于太社各揚爾職不恭其事國有常刑讀訖對拜訖退凡與祭官散齊二日致齊一日已齊而闕者通攝行事仍習禮於社宮諸衛令率其屬各以其方器服守衛社宮門大樂工人俱清齊一宿前三日陳設局設祭官公卿已下次於齊房之內及設饌幔四於社宮西神門之外門南西向前二日郊社令率其屬掃除壇之上下大樂令設樂於壇上郊社令為瘞坎二於壬地方深取足容物南出陛又設望瘞位於坎之北南向前一日奉禮郎帥禮直官設祭官公卿已下褥位於西神門之內道南執事官於道北每等異位俱重行東向南上設御史位二於壇下一在太社東北西向一在太稷西北東向博士各在其北設奉禮郎位於稷壇上西北贊者一在北東向設協律郎位二於壇上東北隅俱西向設大樂令位於兩壇之間南向設獻官褥位於逐壇上神座前設省牲位於西神門外設牲榜於當門黝牲二居前又黝牲二少退三牲皆用黝北上設廩犧令位於牲東北南向設諸太祝位於牲西各當牲後祝史陪其後俱東向設太常卿省牲位於前近南北向又設御史位於太常卿之東北向太常卿帥其屬設酒樽之位太樽二著樽二犧樽二山罍二在壇上北隅南向象樽二壺樽二山罍二在壇下北陛之西南向后土氏象樽二著樽二山罍二在太社酒樽之西俱東南上設太稷后稷酒樽於壇之上下如太社后土之儀設洗位二於社壇西北南向罍在洗東篚在洗西北肆司樽罍篚者各位於其後設玉帛之篚於壇上樽坫之所設四座各籩十豆十簠二簋二鉶三槃一俎三坫四內籩一豆一簠一簋一俎三各設於饌幔內光祿卿率其屬入實籩之實魚鱐乾棗形鹽鹿脯榛實乾桃菱芡栗以序為次豆之實芹菹笋菹葵菹菁菹韭菹魚醢兔醢豚拍鹿臡醓醢以序為次鉶實以羹加芼滑簠實以稻粱簋實以黍稷粱在稻前稷在黍前太官令入實樽罍以酒各一樽實以玄酒祭日未明五刻郊社令升設太社太稷神座各於壇上近南北向設后土氏神座於太社神座之左后稷氏神座於太稷神座之左俱東向席皆以莞加裍褥如幣之色神位版各於座首前一日諸衛之屬禁斷行人郊社令與其屬以樽坫罍洗篚入設於位司樽罍奉禮郎及執事者升自太社壇西陛以俟其省牲器視滌溉並如郊廟儀祭日未明十刻太官令率宰人以鸞刀割牲祝史以豆取毛血各置於饌所以盤取血置神座前遂烹牲未明三刻諸祭官各服其服郊社令太官令入實玉幣樽罍太官令帥進饌者實諸籩豆簠簋未明一刻奉禮郎贊者先入就位禮直官引光祿卿御史博士諸太祝祝史司樽罍篚者入自西門當太社壇北重行南向東上立定奉禮曰再拜贊者承傳御史以下皆再拜訖司樽罍篚者皆就位奉盤血祝史與太祝由西陛升壇各於樽所立祝史以俟瘞血大祝以俟取玉幣大樂令帥工人入禮直官各引祭官入就位立定奉禮曰衆官再拜贊者曰在位者皆再拜其先拜者不拜禮直官進太尉之左曰有司謹具請行事退復位禮直官引光祿卿就瘞血所又引祝史奉盤血降自西陛至瘞位光祿卿瘞血訖復位祝史以盤還饌幔以俟奉毛血豆奉禮曰衆官再拜在位者皆再拜諸太祝取玉幣於篚各立於尊所禮直官引太尉詣盥洗位協律郎跪俯伏舉麾樂作太簇宮正寧之曲後盥洗同至洗位南向立樂止搢笏盥手帨手訖詣太社壇樂作應鍾宮嘉寧之曲後升壇同升自北陛樂止南向立太祝以玉帛西向授太尉太尉受玉帛禮神之玉奠於神前瘞玉加於幣配位不用玉玉用兩圭有邸盛以匣瘞玉以玉石為之帛用黑繒長一丈八尺樂作太簇宮嘉寧之曲太稷同禮直官引太尉進南向跪奠於太社座前俯伏興引太尉少退詣褥位南向再拜太祝以幣授太尉太尉受幣西向跪奠於后土神座前俯伏興禮直官引太尉少退西向再拜訖樂止禮直官引太尉降自北陛詣太稷壇盥洗升奠玉幣如太社后土之儀祝史奉毛血入各由其陛升毛血豆係別置一豆諸太祝迎取於壇上俱進奠於神座前祝史退立於樽所太尉既升奠玉幣太官令出帥進饌者奉饌陳於西門外禮直官引司徒出詣饌所司徒奉太社之俎諸太祝既奠毛血禮直官太官令引太社太稷之饌入自正門配座之饌入自左闥饌初入門樂作太簇宮正寧之曲饌至陛樂止祝史俱進徹毛血豆降自西陛以出太社太稷之饌升自北陛配座之饌升自西陛諸太祝迎引於壇上各於神座前設訖禮直官引司徒已下降自西陛樂作復位樂止諸太祝還樽所禮直官引太尉詣罍洗位樂作至位樂止盥手洗爵訖禮直官引太尉詣太社壇升自北陛樂作至太社酒樽所樂止執樽者舉執事者以爵授太尉太尉執爵太官令酌酒訖樂作太簇宮阜寧之曲太稷同太尉以爵授執事者禮直官引太尉詣太社神座前執事者以爵授太尉南向跪奠爵訖以爵授執事者俯伏興太尉少退樂止讀祝官與捧祝官進於神座前右西向跪讀祝讀訖讀祝官就一拜各還樽所太尉拜訖詣配位酒樽所執事者舉執事者以爵授太尉太尉執爵太官令酌酒訖樂作太簇宮昭寧之曲太尉以爵授執事者禮直官引太尉進后土神座前執事者以爵授太尉西向跪奠爵訖以爵授執事者俯伏興太尉少退樂止讀祝如上儀太尉再拜訖禮直官引太尉降自北陛樂作至罍洗位樂止盥手洗爵訖禮直官引太尉詣太稷壇升自北陛並如太社后土之儀樂曲同訖禮直官引太尉還本位亞終獻盥洗升獻並如太尉之儀禮直官引終獻降復位樂止太祝各進徹豆樂作應鍾宮娛寧之曲還樽所樂止徹者籩豆各一少移於故處奉禮曰賜胙贊者曰衆官再拜在位者皆再拜禮直官進太尉之右請就望瘞位御史博士從南向立於衆官將拜之前太祝執篚進於神座前取玉幣齊郎以俎載牲體稷黍飯爵酒體謂牲之左髀各由其陛降壇以玉幣饌物置於坎訖奉禮曰可瘞坎東西各二人置土半坎訖禮直官進太尉之左曰禮畢遂引太尉出祭官以下以次出禮直官引御史博士以下俱復執事位立定奉禮曰再拜御史以下皆再拜訖出工人以次出祝版燔於齊坊光祿卿以胙奉進御史就位展視光祿卿望闕再拜乃退其州郡祭享一遵唐宋舊儀風雨雷師明昌五年禮官言國之大事莫重於祭王者奉神靈祈福祐皆為民也我國家自祖廟禘祫五享外惟社稷嶽鎮海瀆定為常祀而天地日月風雨雷師其禮尚闕宜詔有司講定儀注以聞尚書省奏天地日月或親祀或令有司攝事若風雨雷師乃中祀合令有司攝之且又州縣之所通祀者也合先舉行制可乃為壇於景豐門外東南闕之巽地歲以立春後丑日以祀風師牲幣進熟如中祀儀又為壇於端禮門外西南闕之坤地以立夏後申日以祀雨師其儀如中祀羊豕各一是日祭雷師於位下禮同小祀一獻羊一無豕其祝稱天子謹遣臣某云嶽鎮海瀆大定四年禮官言嶽鎮海瀆當以五郊迎氣日祭之詔依典禮以四立土王日就本廟致祭其在他界者遙祀立春祭東嶽于泰安州東鎮于益都府東海于萊州東瀆大淮于唐州立夏望祭南嶽衡山南鎮會稽山于河南府南海南瀆大江于萊州季夏土王日祭中嶽于河南府中鎮霍山于平陽府立秋祭西嶽華山于華州西鎮吳山于隴州望祭西海西瀆于河中府立冬祭北嶽山于定州北鎮醫巫閭山于廣寧府望祭北海北瀆大濟于孟州其封爵並仍唐宋之舊明昌間從沂山道士楊道全請封沂山為東安王吳山為成德王霍山為應靈王會稽山為永興王醫巫閭山為廣寧王淮為長源王江為會源王河為顯聖靈源王濟為清源王每歲遣使奉御署祝版奩薌乘馹詣所在率郡邑長二官行事禮用三獻讀祝官一捧祝官二盥洗官二爵洗官二奉爵官一司尊彝一禮直官四以州府司吏充前三日應行事執事官散齊二日治事如故宿於正寢如常儀前二日有司設行事執事官次於廟門外掌廟者掃除廟之內外前一日有司牽牲詣祠所享官以下常服閲饌物視牲充腯享日丑前五刻執事者設祝版於神位之右置於坫及以血豆設於饌所次設祭器皆藉以席掌饌者實之左十籩為三行以右為上實以乾乾棗形鹽魚鱐鹿脯榛實乾桃菱芡栗右十豆為三行以左為上實以芹菹筍菹韭菹葵菹菁菹魚醢兔醢豚拍鹿臡醓醢左簠二實以粱稻右簋二實以稷黍俎二實以牲體次設犧樽二象樽二在堂上東南隅北向西上犧樽在前實以法酒犧樽初獻官酌象樽亞終獻酌又設太樽一山樽一在神位前設而不酌有司設燭於神位前洗二在東階之下直東霤北向罍在洗東加勺篚在洗西南肆實以巾執罍篚者位於其後又設揖位於廟門外初獻在西東向亞終及祝在東南向北上開瘞坎於廟內廷之壬地享日丑前五刻執事官各就次掌饌者帥其屬實饌具畢凡祭官各服其服與執事官行止皆贊者引點視陳設訖退就次引初獻以下詣廟南門外揖位立定贊禮者贊揖次引祝升堂就位立次引初獻詣盥洗位北向立搢笏盥手帨手執笏詣爵洗位北向立搢笏洗爵以爵授執事者執笏升堂詣酌樽所西向立執事者以爵授初獻初獻搢笏執爵執樽者舉執事者酌酒初獻以爵授執事者執笏詣神位前北向立搢笏跪執事者以爵授初獻初獻執爵三祭酒奠爵訖執笏俯伏興少立次引祝詣神位前東向立搢笏跪讀祝訖執笏興退復位初獻再拜贊禮者引初獻復位次引亞獻酌獻並如初獻之儀次引終獻並如亞獻之儀贊者引初獻官詣神位前北向立執事者以爵酌清酒進初獻之右初獻跪祭酒啐酒奠爵執事者以俎進減神座前胙肉前腳第二節共置一俎上以授初獻初獻以授執事者初獻取爵遂飲卒爵執事者進受爵復於坫初獻興再拜贊者引初獻復位贊者曰再拜已飲福受胙者不拜亞獻官以下皆再拜拜訖次引初獻已下就望瘞位以饌物置於坎東西廂各二人贊者曰可瘞置土半坎又曰禮畢遂引初獻官已下出祝與執樽罍篚者俱復位立定贊者曰再拜再拜訖遂出祝版燔於齊所
