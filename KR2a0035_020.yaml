body:
  text: 金史卷二十志第一天文日薄食輝珥雲氣月五星凌犯及星變自伏羲仰觀俯察黃帝迎日推策重黎序天地堯曆象日月星辰舜齊七政周武王訪箕子陳洪範協五紀而觀天之道備矣易曰天垂象見吉凶聖人象之故孔子因魯史作春秋於日星風雨霜雹雷霆皆書變而不書常所以明天道驗人事也秦漢而下治日患少陰陽愆違天象錯忤無代無之金百有十九年而日食四十二星辰風雨霜雹雷霆之變不知其幾金九主莫賢於世宗二十九年之間猶日食者十有一日珥虹貫者四五然終金之世慶雲環日者三皆見於世宗之世羲和之後漢有司馬唐有袁李皆世掌天官故其說詳且六合為一推步之術不見異同金宋角立兩國置曆法有差殊而日官之選亦有精粗之異今奉詔作金史於志天文各因其舊特以春秋為準云日薄食輝珥雲氣太祖天輔三年夏四月丙子朔日食四年冬十月戊辰朔日食六年春二月庚寅朔日食七年秋八月辛巳朔日食太宗天會七年三月己卯朔日中有黑子九月丙午朔日食十三年正月丙午朔日食熙宗天會十四年十一月丙寅日中有黑子斜角交行天眷三年七月癸卯朔日食皇統三年十二月癸未朔日食四年六月辛巳朔日食五年六月乙亥朔日食八年四月戊子朔日食九年三月癸未朔日食海陵庶人天德二年正月甲辰日有暈珥白虹貫之十一月丙戌白虹貫日十二月乙卯慶雲見狀如鸞鳳五彩三年正月丁酉白虹貫日貞元二年五月癸丑朔日食三年四月丁丑朔昏霧四塞日無光凡十有七日乃霽五月丁未朔日食正隆三年三月辛酉朔司天奏日食候之不見海陵敕自今日食皆面奏不須頒告中外五年八月丙午朔日食庚午日中有黑子狀如人六年二月甲辰朔日有暈珥戴背十月丙午慶雲見世宗大定二年正月戊辰朔日食伐鼓用幣命壽王京代拜行禮為制凡遇日月虧食禁酒樂屠宰一日三年六月庚申朔日食上不視朝命官代拜有司不治務過時乃罷後為常四年六月甲寅朔日食七年四月戊辰朔日食上避正殿減膳伐鼓應天門內百官各於本司庭立明復乃止閏七月己卯午刻慶雲環日八月辛亥午刻慶雲環日九年八月甲申朔有司奏日當食以雨不見為近奉安太社乃伐鼓于社用幣于應天門內十三年五月壬辰朔日食十四年十一月甲申朔日食十六年三月丙午朔日食七年九月丁酉朔日食二十三年十月己未慶雲見於日側十一月壬戌朔日食二十八年八月甲子朔日食二十九年正月乙卯巳初日有暈左右有珥上有背氣兩重其色青赤而厚復有白虹貫之亙天其東有戟氣長四尺餘五刻而散丁巳巳初日有兩珥上有背氣兩重其色青赤而淡頃之背氣於日上為冠已而俱散二月辛酉朔日食甲子辰刻日上有重暈兩珥抱而復背背而復抱凡二三次乙丑日暈兩珥有負氣承氣而白虹亙天左右有戟氣章宗明昌三年十二月丙辰北方微有赤氣四年九月癸未日上有抱氣二戴氣一俱相連左右有珥其色鮮明六年三月丙戌朔日食承安三年正月己亥朔日食陰雲不見五年十一月癸丑日食宋史作六月乙酉朔泰和二年五月甲辰朔日食三年十月戊戌日將沒色赤如赭甲辰申酉間天色赤夜將旦復然四年三月丁卯日昏無光五年九月戊子戌時西北方黑雲間有赤氣如火次及西南正南東南方皆赤中有白氣貫徹乍隱乍見既而為雨隨作風至二更初黑雲間赤氣復起於西北方及正西正東東北往來遊曳內有白氣數道時復出沒其赤氣又滿中天約四更皆散六年正月北京申龍山縣西見有雲結成車牛行帳之狀或如前後摧損之勢晡時乃散二月壬子朔日食七月癸巳申刻日上有背氣一內赤外青須臾散九月乙酉夜將曙北方有赤白氣數道歷王良下徐行至北斗開陽搖光之東而散八年四月癸卯巳刻日暈二重內黃外赤移時而散衛紹王大安元年四月壬申北方有黑氣如大道東西竟天至五更散十二月辛酉朔日食三年三月辛酉辰刻北方有黑氣如堤內有白氣三似龍虎之狀十月己卯東北西北每至初更如月將出之狀明至夜半而滅經月乃已宣宗貞祐元年十月丙午夜有白氣三衝紫微而不貫十一月丙申白氣東西竟天移時散二年九月壬戌朔日食大星皆見三年正月壬戌日有左右珥上有冠氣移刻散二月丁巳日初出赤如血將沒復然六月戊申夜有黑氣廣如大路自東南至于西北其長竟天四年二月甲申朔日食閏七月壬午朔日食興定元年七月丙子朔日食二年七月庚午朔日食三年七月庚申五色雲見十月乙丑平涼府慶雲見遣官驗實以告太廟詔國中五年正月山東行省蒙古綱奏慶雲見命圖以進四月丙子日正午有黃暈四匝其色鮮明五月甲申朔日食六月戊寅日將出有氣如大道經丑未歷虛危東西不見首尾移時沒十二月己巳北方有白氣廣三尺餘東西亙天元光元年十一月丁未東北有赤雲如火二年五月辛未日暈不匝而有背氣九月庚子朔日食哀宗正大二年正月甲申有黃黑祲三年三月庚午省前有氣微黃自東北亙西南其狀如虹中有白物十餘往來飛翔又有光見如二星移時方滅四年十一月乙未日上有虹背而向外者二約長丈餘兩旁俱有白虹貫之是年六月丙辰有白氣經天或云太白入井五年十二月庚子朔日食八年三月庚戌酉正日忽白而失色乍明乍暗左右有氣似日而無光與日相凌而日光四出搖蕩至沒天興元年正月壬午朔日有兩珥三年正月己酉日大赤無光京索之間雨血十餘里是日蔡城陷金亡月五星凌犯及星變太宗天會七年十一月甲寅天旗明河鼓直十年閏四月丙申熒惑入氐八月辛亥彗星出於文昌十一年五月乙丑月忽失行而南頃之復故七月己巳昏有大星隕于東南如散火十二月丙戌月食昴熙宗天會十三年十一月乙酉月食命有司用幣以救著為令十四年正月辛巳太白晝見凡四十餘日伏壬辰熒惑入月三月丁酉夜中星搖九月癸未有星大如缶起西南流于正西十一月己巳狼星搖十五年正月戊辰歲星犯積尸氣天眷二年三月辛巳朔歲星留逆在太微五月戊子太白晝見八月丁丑太白晝見九月辛巳犯軒轅左星乙巳犯左執法十一月戊寅入氐三年七月壬戌月犯畢十二月壬午月掩東井東轅南第一星皇統元年二月甲戌月掩畢大星二年十一月己酉月犯軒轅大星甲寅月犯氐東北星三年正月己丑熒惑逆犯軒轅次北一星二月乙丑月犯畢大星閏四月癸巳月掩軒轅左角星八月丙申老人星見九月丁丑月犯軒轅大星四年八月癸未熒惑入輿鬼五年四月丙申彗星見於西北長丈餘至五月壬戌始滅六月甲辰熒惑犯左執法六年九月戊寅熒惑犯西垣上將己丑月犯軒轅第二星七年正月辛未彗星出東方長丈餘凡十五日滅丁亥太白經天七月己巳太白經天庚辰熒惑犯房第二星十一月壬戌歲星逆犯井東扇第二星八年閏八月丙子熒惑入太微垣十月甲申太白晝見十一月壬辰經天十二月丙寅太白晝見九年二月癸亥月掩軒轅第二星七月甲辰太白辰星歲星合于張丁未熒惑犯南斗第四星八月壬子又歷南斗第三星海陵天德元年十二月甲子土犯東井東星二年正月乙酉月犯昴壬辰犯木乙未犯角二月丙寅犯心大星九月乙亥太白晝見至明年正月辛卯後不見丁酉月犯軒轅左角十月乙丑犯太微上將十二月癸丑犯昴三年二月丙辰月食十月丁亥月犯軒轅左角四年正月癸卯太白經天二月乙亥月掩鬼犯鎮星五月己亥太白經天丁巳又經天六月癸巳太白犯井東第二星八月辛未太白犯軒轅大星十一月甲辰熒惑犯鈎鈐丙午月犯井北第一星十二月乙卯朔太白經天丙子月食閏月己亥太白經天貞元元年正月辛丑月犯井東第一星四月戊寅有星如杯自氐入於天市其光燭地十二月乙卯太白經天庚午月食閏月乙酉太白經天二年正月庚申太白經天是夜月掩昴二月辛丑犯心前星三月辛巳食七月癸丑太白晝見凡三十有三日伏八月戊戌熒惑入井凡十一日而出十一月甲子月食三年八月乙酉月犯牛九月辛亥犯建星十一月戊午掩井金戊星正隆二年正月庚辰太白晝見凡六十七日伏三年正月丁亥有流星如杯長二丈餘其光燭地出太微沒於梗河之北二月乙卯熒惑入鬼辛巳月食甲午月掩歲星六月丁酉犯氐九月己未太白經天至明年正月二十一日不見十二月戊申月入氐四年九月壬寅月掩軒轅右角十一月壬辰入畢犯大星十二月太白晝見凡七日五年正月海陵問司天提點馬貴中曰朕欲自將伐宋天道如何貴中對曰去年十月甲戌熒惑順入太微至屏星留退西出占書熒惑常以十月入太微庭受制出伺無道之國又去年十二月太白晝見經天占為兵喪為不臣為更主又主有兵兵罷無兵兵起甲午月食二月丁卯太白晝見四月甲戌復見凡百六十有九日乃伏六年七月乙酉月食九月丙申太白晝見先是海陵問司天馬貴中曰近日天道何如貴中曰前年八月二十九日太白入太微右掖門九月二日至端門九日至左掖門出並歷左右執法太微為天子南宮太白兵將之象其占兵入天子之庭海陵曰今將征伐而兵將出入太微正其事也貴中又言當端門而出其占為受制歷左右執法為受事此當有出使者或為兵或為賊海陵曰兵興之際小賊固不能無也是歲海陵南伐遇弒世宗大定元年十月丙午熒惑入太微垣在上將東丁巳月犯井西扇北第二星二年正月癸巳太白晝見閏二月戊寅月掩軒轅大星三月戊申掩太微東藩南第一星八月乙酉犯井西扇北第二星九月庚戌犯畢距星十月戊辰有大星如太白起室壁間沒於羽林軍尾跡長丈餘三年正月庚子太白晝見凡百有十日乃伏五月辛丑月入氐七月庚戌太白晝見百二十有七日乃伏八月丁未月犯井距星丙寅太白晝見經天十月庚辰月犯太微垣西上將星十一月庚寅太白晝見經天歲星入氐凡二十四日伏壬子月入氐四年正月戊子熒惑歲星同居氐己丑熒惑出氐二月壬午歲星退入氐凡二十九日九月丙午月犯軒轅大星北次星十一月丙申月食既十二月辛卯太白晝見經天癸卯月掩房北第一星五年正月癸亥月掩軒轅大星北次星八月丁酉犯井東扇第一星十一月癸丑熒惑入氐凡二十一日六年二月丙申月犯南斗東南第二星三月己未入氐四月辛丑太白晝見八十有八日伏六月辛巳太白晝見經天九月壬子太白晝見百有三日乃伏丙辰經天十月壬辰復晝見經天十一月辛亥金入氐凡七日庚申太白晝見經天十二月戊子復見經天癸巳月犯房北第二星七年十月乙巳火入氐凡四日十一月壬申太白晝見九十有一日伏丁丑歲星晝見二日八年正月癸未月掩心大星三月庚午掩軒轅大星北一星己丑太白晝見百五十有八日乃伏五月丁卯歲星晝見八月甲午太白犯軒轅大星十月庚子月掩熒惑十一月庚午犯昴九年正月戊寅月掩心後星四月庚子掩心前星八月癸卯掩昴十二月丙戌犯土丁酉太白晝見十有六日伏十年正月丙寅月掩軒轅大星七月庚子犯五車東南星八月戊申朔木星掩熒惑在參畢間十一年二月壬戌熒惑犯井東扇北第一星八月癸卯太白晝見十二年五月辛巳月犯心後星八月癸卯犯心大星辛亥熒惑掩井東扇北第二星九月丁亥太白晝見在日前九十有八日伏十月己酉熒惑掩鬼西北星歲星晝見在日後四十有七日伏十三年閏正月辛酉太白晝見四十有九日伏二月己丑熒惑犯鬼西北星三月癸巳朔入鬼次日犯積尸氣六月辛未月犯心前星十月乙丑歲星晝見於日後五十有三日伏十四年三月辛丑太白歲星晝見十有八日伏丙辰二星經天凡二日六月己未太白晝見三十有九日八月己卯晝見又百三十二日乃伏庚辰熒惑犯積尸氣十月丙寅歲星晝見六日十五年十一月甲子太白晝見八十有六日伏十二月乙丑月掩井西扇北第一星十六年三月庚申月食五月甲寅太白晝見五十有四日伏庚午月掩太白七月丁未犯角宿距星甲子掩畢宿距星八月丙子太白犯軒轅大星九月丁巳月食十月丁丑熒惑入太微十一月甲寅月掩畢距星戊辰熒惑犯太微上將十二月己丑月掩太微左執法十七年春正月丙寅熒惑犯太微西藩上相九月庚戌歲星熒惑太白聚於尾十二月己巳太白晝見四十有四日伏十八年七月庚辰土星犯井東扇北第二星九月己丑熒惑犯左執法十二月甲午鎮星掩井西扇北第一星凡十日十九年正月甲戌月食既三月甲戌熒惑犯氐距星四月丁巳歲星晝見凡七日七月丙子太白晝見四十有五日伏八月癸卯犯軒轅御女辛亥熒惑掩南斗杓第二星九月壬申月掩畢大星十一月辛未熒惑掩歲星十二月丁亥月犯歲星二十年二月己丑月掩畢大星三月丙辰掩畢西第二星二十一年二月戊子月犯鎮星戊戌太白晝見三月甲子太白晝見四月壬申熒惑掩斗魁第二星十有四日六月甲戌客星見于華蓋凡百五十有六日滅七月乙亥朔熒惑順入斗魁中五日以下史闕二十二年五月甲申太白晝見六十有四日伏七月戊子歲星晝見二日八月戊辰太白晝見百二十有八日其經天者六十四日十一月辛未熒惑行氐中乙亥太白入氐辛巳夜月食既癸未熒惑太白皆出氐中十二月戊戌熒惑犯鈎鈐二十三年五月己卯月食既九月甲申歲星晝見五十有五日伏十月辛酉太白晝見百四十有九日乃伏十一月丁卯歲星晝見三十有三日伏閏十一月庚申歲星晝見九十日伏二十四年四月己未朔太白晝見百四十有五日乃伏甲申月掩太白九月庚子歲星犯軒轅大星甲辰晝見凡五十二日伏十月壬申太白辰星同度二十五年三月乙酉太白與月相犯九月丁亥月在斗魁中犯西第五星十一月庚辰朔歲星晝見在日後凡七十四日壬午太白晝見在日後百十有一日乃伏十二月己未月犯熒惑甲子太白晝見經天二十六年三月丙戌熒惑入井鎮星犯太微東藩上相壬辰月食四月丁丑熒惑犯鬼西南星七月丙申月掩心前星八月乙亥朔日月五星會于軫十二月乙未月掩心前大星又犯於後星二十七年五月壬子月犯心大星六月庚辰太白晝見百七十有三日乃伏癸巳月掩昴七月丙午犯房南第一星是日太白晝見經天十月己丑太白入氐十二月丁丑月掩昴二十八年正月己未歲星留於房甲子守房北第一星十一月丙申鎮星入氐庚子太白晝見在日前四十有九日伏十二月壬申月掩昴二十九年正月丁酉土星留氐中三十有七日逆行後七十九日出氐五月庚寅朔太白晝見在日後六月丙辰月犯太白月北星南同在柳宿十一月己未熒惑守軒轅至戊辰退行其色稍怒十二月辛丑月食既章宗明昌元年二月丁亥太白晝見六月丁酉月食既十二月乙未月食二年六月壬辰月食十一月乙丑金木二星見在日前十三日方伏而順行危宿在羽林軍上壘壁陳下光芒明大十二月戊子木金相犯有光芒三年三月戊戌熒惑順行犯太微西藩上將四月丁巳月食己未熒惑掩右執法色怒而稍赤四年正月丙子月有暈白虹貫其中八月己亥卯初三刻歲星見未正二刻太白見俱在午位其夜歲星留胃十三度守天廪十月戊申月食五年十月癸卯月食十一月癸丑太白晝見在日前三十有三日伏六年正月庚寅太白晝見在日前百有二日乃伏六月庚辰復晝見在日後百六十七日唯是日經天承安元年四月司天奏河津星象事上諭宰相曰天道不測當預防之八月壬戌月食九月壬午太白晝見在日前百有七日乃伏二年二月丁巳太白晝見在日後百九十有五日乃伏己未經天是夜月食既三年正月甲寅月食七月庚戌月食五年五月庚午月食六月庚戌月掩太白泰和元年十一月辛酉月食二年五月己未月食三年三月癸未月食六月戊戌太白晝見在日後百有十日乃伏四年九月乙亥月食五年三月壬申月食閏八月己巳月食六年五月甲申太白晝見在日前七十有六日庚戌經天六月辛未歲星晝見在日後七月戊申經天八月癸卯月暈圍太白熒惑二星辛亥歲星辰見至夜五更與東井距星相去七寸內癸丑夜半有流星如太白其色赤起於婁宿己未卯正初刻太白晝見在日前其夜五更熒惑與輿鬼積尸氣相犯在七寸內庚申卯正初刻太白晝見在日後其夜五更初熒惑在輿鬼積尸氣中壬申太白晝見經天在日後十月丙午歲星犯東井距星十一月壬午太白入氐七年正月丙戌初更月有暈圍歲鎮二星在參畢間辛卯月食三月癸丑月掩軒轅大星七月戊子月食九月己卯初更月在南斗魁中旦歲星在輿鬼中八年正月丙戌月食七月戊戌朔太白晝見在日後八月壬戌太白歲星光芒相及同在張一度十一月庚子未刻有流星如太白者二光芒如炬幾一丈起東北沒東南衛紹王大安元年正月辛丑有飛星如火起天市垣尾跡如赤龍之狀移刻散二月乙丑朔太白晝見經天六月丁丑月食十月乙丑月食熒惑丙寅歲星犯左執法二年正月庚戌朔日中有流星出大如盆其色碧西行漸如車輪尾長數丈沒于濁中至地復起光散如火移刻滅二月客星入紫微中其光散如赤龍之狀三年正月乙酉熒惑入氐中凡十有一日乃出二月熒惑犯房閏月犯鍵閉星十月癸巳犯壘壁陳崇慶元年春三月日正午日月太白皆相去咫尺宣宗貞祐元年十一月丙子熒惑入壘壁陳二年二月庚戌月食八月丁未月食九月丁亥太白晝見於軫十一月庚辰鎮星犯太微東垣上相辛巳熒惑犯房鈎鈐三年七月庚申有流星如太白其色青白有尾出紫微垣北極之旁入貫索中己卯月入畢至戊夜犯畢大星八月辛丑月食既十二月庚寅太白晝見於危八十有五日伏四年正月乙卯夜中天有流星大如十色赤長丈餘墜於西南其聲如雷二月己亥月食四月丁酉太白晝見於奎百九十有六日乃伏六月丙申歲星晝見於奎百有一日乃伏閏七月乙未月食辛丑犯畢十一月丙戌月暈歲星歲在奎月在壁己丑犯畢大星十二月戊午復犯畢大星興定元年正月乙酉月犯畢左股第二星四月戊辰太白晝見於井百六十有二日乃伏八月戊申歲星晝見於昴六十有七日伏九月癸巳月犯東井西扇第二星十月癸丑夜有流星大如杯尾長丈餘自軒轅起貫太微沒於角宿之上十一月癸未月暈歲星熒惑二星木在胃火在昴丙戌太白晝見十二月戊午月食二年六月乙卯月食八月壬戌有流星大如杯尾長丈餘其光燭地起建星沒尾中一云自東北至西北而墜其光如塔狀先有聲如風後若雷者三窗紙皆震十月庚申月犯軒轅左角之少民星十二月壬子月食既三年五月庚戌月食既壬子太白晝見於參三十有六日經天又百八十四日乃伏七月壬寅初昏有星自西南來其光燭地狀如月而稍不圓色青白有小星千百環之若迸火然墜於東北少頃有聲如鼓八月丁卯歲星犯輿鬼東南星己巳歲星晝見於柳百有九日乃伏十一月乙巳月食癸丑白虹二夾月尋復貫之四年正月庚子月犯東井三月甲寅歲星犯鬼積尸氣五月甲辰月食六月戊辰犯鎮星己巳太白晝見於張百八十有四日乃伏十一月壬辰歲星晝見于翼六十有七日夜又犯靈臺北第一星五年正月辛丑太白晝見於牛二百三十有二日乃伏司天夾谷德玉等奏以為臣強之象請致祭以禳之宣宗曰斗牛吳分蓋宋境也他國有災吾禳之可乎九月庚戌歲星犯左執法閏十二月戊子熒惑犯軒轅甲午月犯熒惑戊戌鎮星晝見于軫己亥太白晝見於室六年正月辛酉月犯熒惑壬戌犯軒轅三月壬子月食太白癸亥月食丙寅歲星犯太微左執法七月乙亥太白經天與日爭光八月己卯彗星出於亢宿右攝提周鼎之間指大角太史奏除舊布新之象宜改元修政以消天變於是改是年為元光元年九月丁未滅壬申月食歲星元光二年八月乙亥熒惑入輿鬼掩積尸氣十月壬午犯靈臺十一月又犯心大星哀宗正大元年正月丙午月犯昴三月癸丑犯熒惑是月熒惑逆行犯左執法四月癸酉熒惑犯右執法乙未太白辰星相犯三年十一月丙辰月掩熒惑丁巳熒惑犯歲星庚申犯壘壁陳癸酉五星並見於西南十二月熒惑入月四年正月壬戌熒惑犯太白六月丙辰太白入井七月丁亥熒惑犯斗從西第二星五年五月乙酉月掩心大星七年十月己巳月暈至五更復有大連環貫之絡北斗內有戟氣十二月庚寅有星出天津下大如鎮星而色不明初犯輦道二日見於東北在織女南乙未入天市垣戊申方出癸丑歷房北復東南行入積薪凡二十五日而滅天興元年七月乙巳太白歲星熒惑太陰俱會於軫翼司天武亢極言天變上惟歎息竟亦不之罪也八月甲戌太白歲星交閏九月己酉彗星見東方色白長丈餘彎曲如象牙出角軫南行至十二日長二丈十六日月燭不見二十七日五更復出東南約長四丈餘至十月一日始滅凡四十有八日司天奏其咎在北哀宗曰我亦北人今日之事我當滅也何乃不先不後適丁此乎
