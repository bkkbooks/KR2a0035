body:
  text: 金史卷三十七志第十八禮十册皇后儀册皇太后儀册皇太子儀皇太子正旦生日受賀儀皇太子與百官相見儀册皇后儀天德二年十月九日册妃徒單氏為皇后前一日儀鸞司設座勤政殿南向設羣臣次於朝堂大樂令展宮縣於殿庭設協律郎舉麾位於樂縣西北東向閣門設百官班位於庭並如常朝之儀又設典儀位於班位之東北贊者二人在南少却俱西向設册使副位於殿門外之東又設册使副受命位於百官班前又設册寶幄次二於殿後東廂俱南向其日諸衛勒所部略列黃麾細仗於庭符寶郎奉八寶置於左右吏部侍郎奉册禮部侍郎奉寶匣皆置於床訖出就門外班大樂令協律郎樂工典儀贊者各入就位羣官等依時刻集朝堂俱就次各服朝服侍中約刻板奏請中嚴通事舍人引羣官入就庭東西相向立以北為上又引册使副立於東偏門西向門下侍郎引主節奉節立於殿下東廊橫街北中書令中書侍郎帥舉捧册官奉册床立於節南侍中門下侍郎帥舉捧寶官奉寶床立於册床之南俱西面侍中版奏外辦殿上索扇協律郎舉麾宮縣作皇帝服通天冠絳紗袍出自東房曲直華蓋警蹕侍衛如常儀即座南向坐簾捲樂止通事舍人引册使副入宮縣作使副就受命位侍中中書令門下侍郎中書侍郎舉捧官依舊西面立羣臣合班橫行北面如常朝之儀立定典儀曰再拜贊者承傳班首已下羣官在位者皆再拜班首問起居又再拜閣門官引攝侍中出班承制降詣使副東北西向稱有制使副稍前鞠躬再拜攝侍中宣制曰命公等持節授后册寶宣制訖又俱再拜侍中還班門下侍郎引主節詣册使所主節以節授門下侍郎門下侍郎執節西向授太尉太尉受付主節主節立於使副之左右門下侍郎退還班位中書侍郎引册床門下侍郎引寶床立於册使東北西向以次授與太尉太尉皆捧受册床置於北寶床置於南侍中中書令禮儀使舉捧册寶官及舁床者退於東西磚道之左右相向立門下侍郎中書侍郎退還班位典儀曰再拜贊者承傳羣官在位者皆再拜訖分班東西相向立舉捧舁册寶床者進册床先行讀册官次之寶床次行讀寶官次之舉舁官各分左右通事舍人引册使隨之以行持節者前導太尉初行宮縣樂作出殿門樂止攝侍中出班升殿奏侍中臣言禮畢殿上索扇簾降宮縣作降座入自東房樂止通事舍人引羣官在位者以次出俟太尉司徒復命禮畢還內先是有司預設太尉司徒本品革車鹵簿於門外至殿門左右排列俟使副出鼓吹振作禮儀使舉捧官執節者並撎舁人以册寶少駐於泰和門太尉司徒及讀册寶官暫歸幕次內侍閣門引入泰和殿俟至殿下位鼓吹止有司預供張泰和殿設皇后座於扆前殿上垂簾又設東西房於座之左右稍北又設受册位於殿庭西階之南東向又設內命婦次於殿之左右大樂令設宮縣於庭協律郎設舉麾位於殿上又設册寶次於門外又設行事官次於門左右又設外命婦次於門之內其日諸衛於殿門外略設黃麾細仗有司設二步障於殿之西階簾前設扇左右各十紅傘一在西階欄干外又設舉册寶案位於使副之前北向又設宣徽使位於北廂南向司贊設內外命婦以下陪列位於殿庭磚道之左右每等重行異位北向內命婦在後又設司贊位於東階東南贊者二人在南少退俱西向質明執事官大樂令等各就位皇后常服乘龍飾肩輿至泰和殿後閣近仗導衛如常儀宣徽使奏中嚴册使副入門宮縣作俟册使庭中立樂止册在北寶在南使副立於床後禮儀使帥持節者立於前舉捧册寶官立於册寶床左右讀册寶官各立於其後宣徽使奏外辦內侍閣門官引后出後閣宮縣作簾捲皇后降自西階左右步障傘扇從至階下望勤政殿御閣所在立樂止册使進立於右宣曰有制閣門使內侍贊再拜册使宣曰制遣太尉臣某司徒臣某恭授后册寶閣門使內侍贊再拜册使少退中書令侍中及舉捧官率撎舁人奉册寶以次進於前宮縣作册寶床自東階升並置於殿之前楹間册床在北寶床在南中留讀册寶官立位並去帕及蓋撎舁人執之退立於西𩽆殿舉撎官分左右相向立讀册寶官各立於床之東西向立既定樂止閣門使內侍贊再拜捧謝表官以表授左立內侍內侍以授后受訖以付右立內侍內侍持表立於右閣門使贊再拜訖册使退宮縣作持表內侍以表付閣門官隨册使行册使副至門鼓吹振作如來儀入西偏門鼓吹止册使副至御閣所在俯伏跪奏太尉臣某司徒臣某奉制授册寶禮畢俯伏興退持表閣門官進表近侍接入進讀訖退初册使退及門樂止閣門內侍引后自西階升殿宮縣作傘扇止於簾外退於左右𩽆殿前步障止於階下卷之后於座前南向立樂止中書令詣册床南立北向稱中書令臣某謹讀册讀畢降自東階立於欄外第一墀上西向次侍中詣寶床南立北向揖稱侍中臣某讀寶讀畢降階立於中書令之北西向內侍閣門引升座宮縣作坐定樂止舉捧官以次招撎舁人持帕蓋覆匣床奉置殿之左右册床在東寶床在西置訖舉捧官以次降階立於中書令侍中之後立定合班北向閣門贊再拜拜訖降東階退出殿門其撎舁人置册寶床於東西訖各由𩽆殿下階於侍中等班後直出殿門以俟復入撎舁入宮受册表謝訖內侍跪奏禮畢閣門引內外命婦陪列者以次進就北向位班首初行宮縣作至位樂止閣門曰再拜命婦皆再拜閣門引班首自西階升樂作至階樂止進當座前北向躬致稱賀訖降自西階樂作至位樂止閣門曰再拜舍人承傳命婦等皆再拜閣門使前承令降自西階詣命婦前西北東向稱有教旨命婦等皆拜閣門使宣曰祗奉聖恩授以册寶榮幸之至競厲增深所賀知舍人曰再拜命婦皆再拜訖內侍引內命婦還宮班首初行樂作出門樂止內侍引外命婦出次宣徽使奏稱禮畢降座宮縣作入東房樂止歸閣宮縣作至閣樂止更常服內侍承教旨宣外命婦入會並如常儀會畢閣門引外命婦降階橫班北向舍人曰再拜訖以次出還宮如來儀中書門下侍郎復以引進司帥撎舁人進册寶入內付與都點檢司退別日會羣官會妃主宗室等賜酒設食簪花教坊作樂如內宴之儀十一日朝永壽永寧兩宮皇后既受册越二日內侍設座於所御殿南向其日夙興宣徽使版奏中嚴質明諸侍衛宮人俱詣寢殿奉迎宣徽使版奏外辦后首飾褘衣御車內侍前導降自西階以出侍衛如常儀至太后之𩹉門外降車障扇侍衛如常儀入立於西廂東向將至宣徽使版奏請中嚴既降車宣徽使版奏外辦太后常服宣徽使引升座南向宣徽使引后進升自西階北面再拜進跪致謝詞存撫賜酒食並如家人之儀禮畢宣徽使贊再拜訖宣徽使引降自西階以出出門宣徽使奏禮畢降座入宮奉册皇太后儀天德二年正月詔有司擇日奉册唐殷國妃岐國太妃仍別建宮名合行典禮禮官檢詳條具以聞其日質明有司各具傘扇侍衛如儀及兵部約量差軍兵並文武百官詣兩宮迎請引導皇太后入內並赴受册殿入御幄侍衛如式次奉册太尉等俱以册置於案奉寶司徒等俱以寶置於案皆盛以匣覆以帕詣別殿門外幄次教坊提點率教坊入侍衛官各就列皇帝常服乘輿至別殿後幄次通事舍人引宣徽使版奏中嚴復位少頃又奏外辦幄簾卷教坊樂作扇合兩宮皇太后出自後幄並即御座南向扇開樂止分左右少退通事舍人引文武百僚班左入依品重行西向立定通事舍人喝起居班依常朝例起居七拜訖引文武百僚班分東西相向立通事舍人太常博士贊引太常卿前導押册官押册而行奉册太尉讀册中書令舉册官等以次從之次押寶官押寶而行奉寶司徒讀寶侍中舉寶官等以次從之俱自正門入教坊樂作至殿庭西階下少東北向於褥位少置樂止册北寶南通事舍人太常博士贊引太常卿前導押册官押册升樂作奉册太尉等從之進至兩宮皇太后座前褥位樂止兩宮册寶齊上齊讀舉册官夾侍奉册太尉各搢笏北向跪俯伏興退立讀册中書令俱進向册前跪奏稱攝中書令具官臣某謹讀册舉册官單跪對舉中書令各搢笏讀訖執笏俯伏興搢笏捧册興於位東回册函北向並進跪置於御座前褥位中書令舉册官俱降還位奉册太尉並降階東向以俟押寶官押寶升樂作奉寶司徒等從之進至兩宮皇太后座前褥位樂止舉寶官夾侍奉寶司徒各搢笏北向跪俯伏興退立讀寶侍中俱進當寶前跪奏稱攝侍中具官臣某謹讀寶舉寶官單跪對舉侍中各搢笏讀訖執笏俯伏興搢笏捧寶興於位東回寶函北向並進跪置於御座前褥位册之南通事舍人太常博士贊引太尉司徒以次應行事官俱降自西階復本班序立宣徽使一員詣皇帝御幄前俯伏跪奏臣某謹請皇帝詣兩宮皇太后前行稱賀之禮俯伏興贊引皇帝再拜又奏請北向跪皇帝賀曰嗣皇帝臣某言云云俯伏興又再拜訖又奏請皇帝少立內侍承旨退西向稱兩宮皇太后旨云云皇帝再拜宣徽使前引皇帝歸幄常服乘輿還內侍衛如來儀應階下文武百僚重行立定通事舍人喝拜在位皆再拜通事舍人引太師詣西階升俯伏跪奏稱文武百僚具官臣某等稽首言皇太后殿下顯對册儀永安帝養仰祈福壽與天同休俯伏興降自西階復位立定通事舍人贊在位官皆再拜舞蹈三稱萬歲又再拜宣徽使升自東階取旨退臨階西向稱兩宮皇太后旨通事舍人贊在位官皆再拜畢宣曰公等忠敬盡心推崇協力膺茲令典感愧良深宣訖還位通事舍人贊謝宣諭拜在位官皆再拜舞蹈三稱萬歲又再拜通事舍人分引應北向官各分班東西立宣徽使升自東階奏稱具官臣等言禮畢降還位扇合皇太后並興教坊樂作降座還殿後幄次扇開樂止通事舍人引宣徽使奏解嚴中書侍郎等各帥捧册床官升殿跪捧册並置於床次門下侍郎等各帥捧寶床官升殿跪捧寶並置於床訖通事舍人引詣東上閣門投進所司文武百僚以次出皇太后常服乘輿各還本宮引導如來儀文武百僚詣東上閣門拜表賀皇帝退禮畢各赴本宮受內外命婦稱賀所司預於殿內設皇太后御座司賓引內外命婦於殿庭北向依序立尚儀奏請皇太后常服即座司贊曰再拜命婦皆再拜司賓引班首詣西階升跪賀稱妾某氏等言伏惟皇太后殿下天資聖善昭受鴻名凡在照臨不勝欣抃興降階復位司贊曰再拜內外命婦皆再拜尚宮承旨降自西階於命婦之北東向立司贊曰再拜在位者皆再拜尚宮乃宣答曰膺茲典禮感愧良深司贊曰再拜在位者皆再拜退赴別殿賀皇帝亦如賀皇太后之儀惟不致詞不宣答册皇太子儀大定八年正月册皇太子禮官擬奏皇太子乘輿至翔龍門東宮官導從不乘馬册皇太子前三日遣使同日奏告天地宗廟册前一日宣徽院帥儀鸞司設御座於大安殿當中南向設皇太子次於門外之東西向又設文武百僚應行事官東宮官等次於門外之東西廊又設册寶幄次於殿後東廂俱南向又設受册位於殿庭橫階之南工部官與監造册寶官公服自製造所導引册寶床由宣華門入約宣徽院同進呈畢赴幄次安置大樂令帥其屬展樂縣於庭其日兵部帥其屬設黃麾仗於大安殿門之內外其日質明文武百僚應行事官並朝服入次東宮官各朝服自東宮乘馬導從至左翔龍門外下馬入就次通事舍人分引百官入立班東西相向次引侍中中書令門下侍郎中書侍郎及捧舁册寶官詣殿後幄次前立少頃奉册寶出幄次由大安殿東降至庭中褥位權置訖奉引册寶官立於其後皇太子服遠遊冠朱明衣出次執圭三師三少已下導從立於門外侍中奏中嚴符寶郎奉八寶由東西偏門分入升置御座之左右侍中奏外辦內侍承旨索扇扇合皇帝服通天冠絳紗袍以出曲直華蓋侍衛如常儀鳴鞭宮縣樂作皇帝出自東序即御座爐煙升扇開簾捲樂止典贊儀引皇太子入門宮縣樂作至位樂止師少已下從入立於皇太子位東南西向典儀贊皇太子再拜搢圭舞蹈又再拜奏聖躬萬福又再拜引近東西向立師少已下並奉引册寶官等各赴百官東班樂作至位樂止通事舍人引百官俱橫班北向典儀贊拜在位官皆再拜搢笏舞蹈又再拜起居又再拜畢百官各還東西班師少已下並行事官各還立位典贊儀引皇太子復受册位樂作至位樂止侍中承旨稱有制皇太子已下應在位官皆再拜躬身侍中宣制曰册某王為皇太子又再拜通事舍人太常博士引中書令詣讀册位中書侍郎引册匣置於前捧册官西向跪捧皇太子跪讀畢俯伏興皇太子再拜中書令詣捧册位奉册授皇太子搢圭跪受册以授右庶子右庶子跪受皇太子俯伏興右庶子以册興置於床中書令已下退復本班次通事舍人太常博士引侍中詣奉寶位門下侍郎引寶盝立於其右侍中奉寶授皇太子搢圭跪受以授左庶子左庶子跪受皇太子俯伏興左庶子以寶興置於床侍中已下退復本班典儀贊再拜畢引皇太子退初行樂作左右庶子帥其屬舁册寶床匣以出出門樂止侍中奏禮畢內侍承旨索扇扇合簾降鳴鞭樂作皇帝降座入自西序還後閣侍衛如來儀扇開樂止侍中奏解嚴所司承旨放仗衛以次出皇太子入次改服公服還東宮導從如來儀册後二日兵部設黃麾仗於仁政殿門之內外陳設並如大安殿之儀百官服朝服皇太子公服至次改服遠遊冠朱明衣通事舍人引百官入至階下立班東西相向典贊儀引皇太子執圭出次立於門外侍中奏中嚴少頃又奏外辦皇帝出自東序即座簾捲通事舍人引百官俱橫班北向典儀贊拜在位官皆再拜搢笏舞蹈又再拜起居又再拜訖分班皇太子捧表入至拜表位立俟閣門使將至單跪捧表閣門使接表皇太子俯伏興典儀贊再拜搢圭舞蹈又再拜俟讀表畢侍中承旨退稱有制典儀贊再拜興躬身侍中宣訖典儀贊再拜搢圭舞蹈又再拜引皇太子退侍中奏禮畢扇合鳴鞭入西序還後閣侍衛如來儀侍中奏解嚴放仗百官以次出後二日百官奉表稱賀如常儀正旦生日皇太子受賀儀大定二年世宗命有司議親王百官及妃主命婦見皇太子禮有司按唐宋舊儀擬親王宗室賀皇太子依册畢受賀禮然唐禮元正復有降階見伯叔答羣官再拜之文又無妃主命婦見太子之禮稽諸令文應致恭之官相見或貴賤殊隔或長幼親戚任從私禮自今若在東宮候皇太子便服則當從私禮接見若三師以下遇皇太子誕日在御前則候皇太子先進酒畢百官望皇太子再拜班首跪進酒又再拜若賜酒即當殿跪飲畢又再拜以為定制命班行之十二月晦皇太子奏狀曰按禮文親王並一品宗室皆北面拜伏臣但答揖而已雖曰尊宗子而在長幼惇之間誠所未安當時遽蒙頒降未獲謙讓明日元正有司將舉此禮伏望聖慈許臣答拜庶敦親親友愛之義上從其請命尚書省頒下所司若皇太子生日則公服左上露臺欄子外先再拜二閣使齊揖入欄子內拜跪祝畢就拜興復位再拜又再拜接臺進酒退跪候飲畢接盞復位轉臺與執事者再拜宣徽使以酒進皇帝親賜酒接盞稍退跪飲畢宣徽使接盞復位再拜復揖入欄子內跪搢笏受賜物畢出笏興復位再拜退更衣入殿稍東西向立皇妃等進勸生日酒皇太子跪皇妃等亦跪飲畢各再拜羣官致賀則其日質明皆公服集於門外少詹事奏請內嚴又奏外備典儀引升座文武宮臣入就庭下重行北向立典儀曰再拜在位官皆再拜班首少前跪奏元正首祚生日則云慶誕令辰伏惟皇太子殿下福壽千秋賀畢復位典儀曰再拜宮臣皆再拜坐受分東西序立次引東宮三師於殿上三少於殿柱外北向東上立皇太子詣南向褥位典儀曰再拜師少皆再拜班首同前稱賀復位執事者酌酒一卮班首奉進樂作飲訖樂止回勸師少畢各復位典儀贊師少再拜皇太子答拜師少出皇太子就坐次引親王入欄子內一品宗室於欄子外餘宗室序班庭下拜致賀進酒如上儀皇太子答拜畢就坐復引隨朝三師三公宰執於殿上三品以上職事官於露階上四品以下於庭下北向每等重行以東為上立皇太子詣褥位典儀曰再拜上下皆再拜畢班首少前致賀復位執事者酌酒一卮班首奉進樂作飲畢樂止如有進獻如常儀回勸三師三公餘殿上羣官則令執事者以盤行酒飲畢典儀曰再拜上下皆再拜乃答拜引羣官以次出少詹事跪奏禮畢自是歲賀為定制皇太子與百官相見儀三師三公欄子內北向躬揖班首稍前問候皇太子離位稍前正南立答揖宰執及一品職事官扣欄子北向躬揖答揖同前二品職事官欄子外稍南躬揖皇太子起揖三品職事官露階稍南躬揖皇太子坐揖四品以下職事官庭下躬揖跪問候皇太子坐受太子太師太傅太保與隨朝三師同東宮三少與隨朝二品同詹事已下並在庭下面北每品重行以東為上再拜班首稍前問候又再拜皇太子坐受大定二年所定也七年定制皇太子赴朝許與親王宰執相見餘官宗室並回避後亦許與樞密使副御史大夫判宗正東宮三師相見九年定制凡皇太子出於都門三里外設褥位三公宰執以下公服重行立皇太子便服三公宰執以下鞠躬班首致辭云青宮萬福再拜皇太子答拜退迎送皆同
