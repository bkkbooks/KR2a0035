body:
  text: 金史卷三十一志第十二禮四奏告儀皇帝恭謝儀皇后恭謝儀皇太子恭謝儀薦新功臣配享陳設寶玉雜儀奏告儀皇帝即位加元服受尊號納后冊命巡狩征伐封祀請諡營修廟寢凡國有大事皆告或一室或遍告及原廟並一獻禮用祝幣皇統以後凡皇帝受尊號冊皇后太子禘祫升祔奉安奉遷等事皆告郊祀則告配帝之室大定十四年三月十七日詔更御名命左丞相良弼告天地平章守道告太廟左丞石琚告昭德皇后廟禮部尚書張景仁告社稷及遣官祭告五嶽前期二日太廟令掃除廟內外設告官以下次所前一日行事官赴祀所清齋告日前三刻禮直官引太廟令帥其屬入殿開室戶掃除鋪筵設几於北墉下如時享儀禮直官帥祀祭官陳幣篚於室戶之左陳祝版於室戶之右案上及設香案祭器皆藉以席每位各左一籩實以鹿脯右一豆實以鹿臡犧尊一置於坫加勺在殿上室戶之左北向實以酒每位一瓶設燭於神位前又設盥爵洗位橫街之南稍東設告官褥位於殿下東階之南西向餘官在其後稍南又設望燎位於西神門外之北告日未明禮直官引太廟令太祝宮闈令入當階間北面西上立定奉禮贊再拜訖升自西階太祝宮闈令各入室出神主設於座如常儀次引告官入就位禮直官稍前贊有司謹具請行事又贊再拜在位者拜訖禮直官引告官就盥洗位盥手訖詣神位前搢笏跪三上香執事者以幣授奉禮郎西向授告官告官受幣奠訖執笏俛伏興退就戶外位再拜詣次位行禮如上儀訖降復位少頃引告官再詣爵洗位讀祝舉祝官後從至位北向立搢笏洗拭爵訖授執事者執笏升詣酒尊所西向立執爵執尊者舉酌酒告官以授執事者詣神位前北向搢笏跪執爵三祭酒執笏俛伏興退就戶外位北向立俟讀祝文訖再拜詣次位行禮如上儀訖與讀祝官皆復位禮直官贊曰再拜在位者皆再拜次引告官以下詣望燎位執事者取幣帛祝版置於燎禮直官曰可燎半柴禮直官贊禮畢告官以下退署令闔廟門瘞祝于坎貞元四年正月上尊號前三日遣使奏告天地於常武殿拜天臺設褥位昊天上帝居中皇地祇居西少却行一獻禮大定七年正月十三日上尊號前三日命皇子判大興尹許王告天地判宗正英王文告太廟於自來拜天處設昊天上帝位當中南向皇地祇位次西少却並用坐褥位牌及香酒脯臡等祝版三學士院撰告祝文書寫訖進請御署訖以付禮部移文宣徽院幷差控鶴官用案舁覆以黃羅帕隨所差告官詣祀所前一日告官等就局所致齋一日告日質明宣徽院太常寺鋪設供具如儀閤門舍人一員太常博士一員引告官各服其服以次就位禮直官舍人稍前贊有司謹具請行事贊者曰拜在位者皆再拜禮直官先引執事官各就位舍人博士次引告官詣盥洗爵洗位北向立搢笏盥手帨手洗爵拭爵執笏詣酒尊所搢笏執爵司尊者舉酌酒告官以爵授奉爵酒官執笏詣昊天上帝皇地祇神位前再拜每位三上香跪奠酒訖以爵授奉爵官執笏俛伏興舉祝官跪舉讀訖俛伏興告官再拜告畢引告官以下降復位再拜訖詣望燎位燔祝版再拜半燎告官已下皆退皇帝恭謝儀大定七年正月世宗受尊號禮畢恭謝前三日太廟令帥其屬洒掃廟庭之內外及陳設尚舍於廟南門之西設饌幔一十一室殿中監帥尚舍視大次殿又設皇帝版位於始祖神位前北向又設飲福位於版位西南少却又設隨室奠拜褥位於神座前大樂令設登歌於殿上宮縣於殿下又設皇太子位於阼階東南又設親王位於其南稍東宗室王使相位於其後又設太尉司徒以下行事官位於殿西階之西東向每等異位又設文武羣官位於橫階之南東西向又設御洗位於阼階之東又設太尉洗位於西階下橫階之南又設齋郎位於東班羣官之後又設盥洗等官幷奉禮贊者大司樂協律郎大樂令等位各如祫享之儀又設尊彝祭器等於殿之上下如時享之儀前一日禮官御史帥其屬省牲視濯滌如常儀其日質明禮官御史帥太廟官太祝官宮闈令出神主如時享儀有司列黃麾仗二千人於應天門外尚輦進金輅於應天門內午後三刻宣徽院奏請皇帝赴齋宿殿文武羣官並齋宿於所司謝日質明俟諸衞各勒所部屯門列仗導駕官分左右侍立於殿階下並朝服通事舍人引侍中詣齋殿俛伏跪稱臣某言請中嚴俛伏興凡侍中奏請准此皇帝服通天冠絳紗袍少頃侍中奏外辦皇帝出齋殿即御座羣官起居訖侍中奏請升輦皇帝升輦以出侍衞警蹕如常儀導駕官前導至應天門侍中奏請降輦升輅皇帝升輅門下侍郎俛伏跪奏請車駕進發俛伏興凡門下侍郎奏請准此車駕動警蹕如常儀至應天門外門下侍郎奏請車駕少駐勅侍臣上馬侍中前承旨退稱曰制可門下侍郎退傳制稱侍臣上馬通事舍人承傳勅侍臣上馬導駕官分左右前導門下侍郎奏請車駕進發車駕動稱警蹕不鳴鼓吹典贊儀引皇太子常服乘馬至廟中幕次更服遠遊冠朱明衣執圭通事舍人文武羣官並朝服於廟門外班迎車駕至廟門侍中於輅前奏請降輅導駕官步入廟門稍東侍中奏請升輦皇帝升輦傘扇侍衞如常儀至大次侍中奏請降輦入就大次皇帝入大次通事舍人分引文武羣官由南神東西偏門入廟庭東西相向立禮直官引太尉以下行事官詣橫街北向再拜訖禮直官引太尉詣盥洗位搢笏盥手帨手執笏詣爵洗位北向立搢笏洗瓚拭瓚以瓚授執事者執笏由西階升殿詣始祖尊彝所西向立執事者以瓚奉太尉太尉搢笏執瓚酌鬯詣神位前以鬯祼地訖以虛瓚授執事者執笏俛伏興出戶外北向再拜訖次詣隨室並如上儀禮畢降自西階復位禮直官引司徒出詣饌所引薦俎齋郎奉俎幷薦籩豆簠簋官奉籩豆簠簋及太官令以序入自正門宮縣樂作至大階樂止諸太祝迎於階上各設於神座前先廌牛次薦羊次薦豕訖禮直官引司徒已下降階復位典贊儀引皇太子通事舍人引親王由南神東偏門入詣褥位禮直官引中書侍郎舉冊官等升自西階詣始祖室前東西立通事舍人引侍中詣大次前奏請中嚴皇帝服袞冕少頃侍中奏外辦侍中詣廟庭本位立皇帝將出大次禮儀使與太常卿贊導凡禮儀使與太常卿贊導並博士前引俛伏跪稱臣某贊導皇帝行禮俛伏興前導至東神門撤傘扇近侍者從入殿中監跪進鎮圭禮儀使奏請執圭皇帝執圭宮縣樂作奏請詣罍洗位至位樂止內侍跪取匜興沃水又內侍跪取槃承水時寒預備溫水禮儀使奏請搢鎮圭皇帝搢鎮圭盥手內侍跪取巾於篚興進皇帝帨手訖奉爵官以爵跪進皇帝受爵內侍捧匜沃水又內侍跪捧槃承水皇帝洗爵訖內侍跪奉巾以進皇帝拭爵訖內侍奠槃匜又奠巾於篚奉爵官受爵禮儀使奏請執鎮圭前導皇帝升殿左右侍從量人數升宮縣樂作皇帝至阼階下樂止皇帝升自阼階登歌樂作禮儀使前導皇帝至版位樂止奏請再拜奉禮郎贊皇太子已下在位羣官皆再拜贊者承傳皆再拜禮儀使前導皇帝詣始祖尊彝所樂作至尊所樂止奉爵官以爵涖尊執尊者舉侍中跪酌犧尊之泛齊訖禮儀使導皇帝至版位再拜訖禮儀使奏請詣始祖神位前褥位登歌樂作禮儀使奏請搢圭跪奉爵官以爵授奉爵酒官以進禮儀使奏請執爵皇帝執爵三奠酒訖以虛爵授奉爵酒官禮儀使奏請執圭興樂止奉爵酒官以爵授奉爵官禮儀使奏請詣隨室並如上儀禮直官先引司徒升自西階立於飲福位之側酌獻將畢奉胙酌福酒太祝從司徒立於其側酌獻畢侍中亦立於其側禮儀使奏請皇帝詣版位北向立登歌樂作至位樂止中書侍郎跪讀冊訖舉冊官奠訖禮儀使奏請皇帝再拜拜訖禮儀使奏請詣飲福位登歌樂作至位太祝酌福酒於爵時寒預備溫酒以奉侍中侍中受爵奉以立禮儀使奏請搢圭跪侍中以爵北向跪以進禮儀使奏請執爵三祭酒禮儀使奏請飲福飲福訖以虛爵授侍中禮儀使奏請受胙司徒跪以黍稷飯籩進皇帝受以授左右司徒又跪以胙肉進皇帝受以授左右禮儀使奏請執圭興再拜訖樂止禮儀使前導皇帝還版位登歌樂作至位樂止太祝各進徹籩豆登歌樂作卒徹樂止奉禮曰賜胙贊皇太子已下在位羣官皆再拜贊者承傳皆再拜宮縣作一成止禮儀使奏請皇帝再拜奉禮郎贊皇太子已下在位官皆再拜拜訖禮儀使奏禮畢前導皇帝降阼階登歌樂作至階下樂止宮縣作前導皇帝出東神門樂止傘扇侍衞如常儀禮儀使奏請釋圭殿中監跪受鎮圭至大次轉仗衞於還途如來儀禮官御史帥其屬納神主藏冊如儀少頃通事舍人引侍中奏請中嚴皇帝服通天冠絳紗袍少頃侍中奏外辦俟尚輦進輦侍中奏請降座升輦皇帝升輦傘扇侍衞如常儀至南神門稍東侍中奏請降輦步出廟門皇帝步出廟門至輅侍中奏請升輅皇帝升輅門下侍郎奏請車駕少駐勅侍臣上馬侍中前承旨退稱曰制可門下侍郎退傳制稱侍臣上馬通事舍人承傳勅侍臣上馬車駕還內鼓吹振作至應天門外百官班迎起居宮縣奏采茨之曲入應天門內侍中奏請降輅乘輦皇帝降輅乘輦以入傘扇侍衞警蹕如常儀皇帝入宮至致齋殿侍中奏解嚴通事舍人承旨勅羣臣各還次將士各還本所皇后恭謝儀皇后既受冊前一日齋戒於別殿內命婦應從入廟者俱齋戒一日其日未明二刻有司陳設儀仗於后車之左右以次排列外命婦先自太廟後門入內命婦妃嬪已下俱詣殿庭起居訖宣徽使版奏中嚴少頃又奏外辦首飾褘衣御肩輿取便路至車所內侍奏請降輿升車既升車奏請進發車出元德東偏門內命婦妃嬪已下自殿門外上車由左掖門出從至太廟門外儀仗止於門外回車南向內侍奏請降車升輿后降車升輿就東神門外幄次下簾內命婦妃嬪已下降車入就陪列位內侍引外命婦詣幄次前起居訖並赴殿庭陪列位少頃宣徽使詣幄次贊行朝謁之禮簾卷宣徽使前導詣殿庭階下西向褥位立宣徽使贊再拜內外命婦皆再拜宣徽使前導升東階詣始祖皇帝神位香案前褥位宣徽使奏請三上香又奏再拜拜訖宣徽使前導次詣獻祖已下十室並如上儀宣徽使奏禮畢導歸幄次宣徽使奏請解嚴內外命婦還幕次少頃轉仗還內如來儀外命婦退內侍奏請御輿出至車所奏請升車既升車奏請進發內命婦上車至元德東偏門內侍奏請降車升輿后御輿取便路還內內命婦從入冊禮畢百官上表稱賀幷以牋賀中宮皇太子恭謝儀其日質明東宮應從官各服朝服所司陳鹵簿金輅於左掖門外皇太子服遠游冠朱明衣升輿以出至金輅所降輿升輅左庶子已下夾侍三師三少乘馬導從餘官亦皆乘馬以從東行由太廟西階轉至廟不鳴鐃吹至廟西偏門外降輅步進由東偏門入幄次改服袞冕出次執圭自南神東偏門入宮官幷太常寺官皆從皇太子入詣殿庭東階之東西向立典儀贊再拜訖升自西階詣始祖神位前北向再拜訖以次詣逐室行禮並如上儀訖降自西階復西向位俟典儀稱禮畢出東神北偏門謁別廟如上儀訖歸幄次改服遠游冠朱明衣出次止至廟門外升輅過廟門鳴鐃而行至左掖門外降輅升輿以入將士各還本所後一日於東宮受羣官賀如元正受賀之儀薦新天德二年命有司議薦新禮依典禮合用時物令太常卿行禮正月鮪明昌間用牛魚無則鯉代二月雁三月韭以卵以葑四月薦冰五月荀蒲羞以含桃六月彘肉小麥仁七月嘗雛雞以黍羞以瓜八月羞以芡以菱以栗九月嘗粟與稷羞以棗以梨十月嘗麻與稻羞以兔十一月羞以麕十二月羞以魚從之大定三年有司言每歲太廟五享若復薦新似涉繁數擬遇時享之月以所薦物附於籩豆薦之以合