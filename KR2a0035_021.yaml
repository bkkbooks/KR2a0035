body:
  text: 金史卷二十一志第二曆上步氣朔步卦候步日躔步晷漏昔者聖人因天道以授人時釐百工以熙庶政步推之法其來尚矣自漢太初迄于前宋治曆者奚啻七十餘家大概或百年或數十年率一易焉蓋日月五星盈縮進退與夫天運至不齊也人方製器以求之以俾其齊積寡至多不能無爽故爾金有天下百餘年曆惟一易天會五年司天楊級始造大明曆十五年春正月朔始頒行之其法以三億八千三百七十六萬八千六百五十七為曆元五千二百三十為日法然其所本不能詳究或曰因宋紀元曆而增損之也正隆戊寅三月辛酉朔司天言日當食而不食大定癸巳五月壬辰朔日食甲午十一月甲申朔日食加時皆先天丁酉九月丁酉朔食乃後天由是占候漸差乃命司天監趙知微重修大明曆十一年曆成時翰林應奉耶律履亦造乙未曆二十一年十一月望太陰虧食遂命尚書省委禮部員外郎任忠傑與司天曆官驗所食時刻分秒比校知微履及見行曆之親疏以知微曆為親遂用之明昌初司天又改進新曆禮部郎中張行簡言請俟他日月食覆校無差然後用之事遂寢是以終金之世惟用知微曆我朝初亦用之後始改授時曆焉今其書存乎太史采而録之以為曆志步氣朔第一演紀上元甲子距今大定庚子八千八百六十三萬九千六百五十六年日法五千二百三十分歲實一百九十一萬二百二十四分通餘二萬七千四百二十四分朔實一十五萬四千四百四十五分通閏五萬六千八百八十四分歲策三百六十五日餘一千二百七十四分朔策二十九日餘二千七百七十五分氣策一十五日餘一千一百四十二分六十秒望策一十四日餘四千二分四十五秒象策七日餘二千一分二十二秒半沒限四千八十七分三十秒朔虛分二千四百五十五分旬周三十一萬三千八百分紀法六十秒母九十求天正冬至置上元甲子以來積年歲實乘之為通積分滿旬周去之不盡以日法約之為日不盈為餘命甲子算外即所求天正冬至日大小餘求次氣置天正冬至大小餘以氣策纍加之秒盈秒母從分分滿日法從日即得次氣日及餘秒求天正經朔以朔實去通積分不盡為閏餘以減通積分為朔積分滿旬周去之不盡如日法而一為日不盈為餘即所求天正經朔大小餘也求弦望及次朔置天正經朔大小餘以象策纍加之即各得弦望及次朔經日及餘秒也求沒日置有沒之氣小餘如沒限以上為有沒之氣以秒母乘之內其秒用減四十七萬七千五百五十六餘滿六千八百五十六而一所得並氣大餘命為沒日求滅日置有滅之朔小餘經朔小餘不滿朔虛分者六因之如四百九十一而一所得並經朔大餘命為滅日步卦候第二候策五餘三百八十秒八十卦策六餘四百五十七秒六貞策三餘二百二十八秒四十八秒母九十辰法二千六百一十五半辰法一千三百七半刻法三百一十三秒八十辰刻八一百四分秒六十半辰刻四五十二分秒三十秒母一百求七十二候置中氣大小餘命之為初候以候策纍加之即次候及末候也求六十四卦置中氣大小餘命之為公卦以卦策纍加之得辟卦又加之得侯內卦以貞策加之得節氣之初為侯外卦又以貞策加之得大夫卦又以卦策加之為卿卦求土王用事以貞策減四季中氣大小餘即土王用事日也求發斂置小餘以六因之如辰法而一為辰如不盡以刻法除之為刻命子正算外即得加時所在辰刻及分如加半辰法即命子刻初二十四氣卦候氣月中節初候次候末候始卦中卦終卦四正卦冬至十一月中蚯蚓結麋角解水泉動公中孚辟復侯屯內坎初六小寒十二月節雁北鄉鵲始巢野雞始雊侯屯外大夫謙卿睽坎九二大寒十二月中雞始乳鷙鳥厲疾水澤腹堅公升辟臨侯小過內坎六三立春正月節東風解凍蟄蟲始振魚上冰侯小過外大夫蒙卿益坎六四雨水正月中獺祭魚鴻雁來草木萌動公漸辟泰侯需內坎九五驚蟄二月節桃始華倉庚鳴鷹化為鳩侯需外大夫隨卿晉坎上六春分二月中玄鳥至雷乃發聲始電公解辟大壯侯豫內震初九清明三月節桐始華田鼠化為虹始見侯豫外大夫訟卿蠱震六二鴽穀雨三月中萍始生鳴鳩拂其戴勝降于公革辟夬侯旅內震六三羽桑立夏四月節螻蟈鳴蚯蚓出王瓜生侯旅外大夫師卿比震九四小滿四月中苦菜秀靡草死小暑至公小畜辟乾侯大有內震六五芒種五月節螳螂生鵙始鳴反舌無聲侯大有外大夫家人卿井震上六夏至五月中鹿角解蜩始鳴半夏生公咸辟姤侯鼎內離初九小暑六月節溫風至蟋蟀居壁鷹乃學習侯鼎外大夫豐卿渙離六二大暑六月中腐草化為土潤溽暑大雨時行公履辟遁侯內離九三螢立秋七月節涼風至白露降寒蟬鳴侯外大夫節卿同人離九四處暑七月中鷹乃祭鳥天地始肅禾乃登公損辟否侯巽內離六五白露八月節鴻雁來玄鳥歸羣鳥養羞侯巽外大夫萃卿大畜離上九秋分八月中雷乃收聲蟄蟲坯戶水始涸公賁辟觀侯歸妹內兌初九寒露九月節鴻雁來賓雀入大水鞠有黃華侯歸妹外大夫無妄卿明夷兌九二化為蛤霜降九月中豺乃祭獸草木黃落蟄蟲咸俯公困辟剝侯艮內兌六三立冬十月節水始氷地始凍野雞入水侯艮外大夫既濟卿噬嗑兌九四化為蜃小雪十月中虹藏不見天氣上升閉塞而成公大過辟坤侯未濟內兌九五地氣下降冬大雪十一月節鶡鳥不鳴虎始交荔挺出侯未濟外大夫蹇卿頤兌上六步日躔第三周天分一百九十一萬二百九十三分五百三十秒歲差六十九五百三十秒秒母一萬周天度三百六十五度二十五分六十八秒象限九十一三十一分九秒二十四氣日積度及盈縮氣日積度分損益率初末率日差盈縮積秒冬至空益七千五十九初四百九十八八十六十五四九