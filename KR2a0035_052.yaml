body:
  text: 金史卷五十二志第三十三選舉二文武選金制文武選皆吏部統之自從九品至從七品職事官部擬正七品以上呈省以聽制授凡進士則授文散官謂之文資官自餘皆武散官謂之右職又謂之右選文資則進士為優右職則軍功為優皆循資有升降定式而不可越凡銓注必取求仕官解由撮所陳行績資歷之要為銓頭以定其能否其有犯公私罪贓樜者謂之犯選格則雖遇恩而不得與舊制犯追一官以至追四官皆解任周年而復仕之承安二年定制每追一官則殿一年凡罷職會赦當者及降殿當除者皆具罪以聞而後仕之凡增課升至六品者任回復降既廉升而再任覆察不同者任回亦降自進士舉人勞效廕襲恩例之外入仕之途尚多而所定之時不一若牌印護衛令史之出職則皇統時所定者也檢法知法國史院書寫則海陵庶人所置者也若宗室將軍宮中諸局承應人宰相書表太子護衛妃護衛王府祗候郎君內侍及宰相之子並譯史通事省祗候郎君親軍驍騎諸格則定於世宗之時及章宗所置之太常檢討內侍寄祿官皆仕進之門戶也凡官資以三十月為考職事官每任以三十月為滿羣牧使及管課官以三周歲為滿防禦使以四十月三品以上官則以五十月轉運則以六十月為滿司天太醫內侍官皆至四品止凡外任循資官謂之常調選為朝官謂之隨朝隨朝則每考升職事一等若以廉察而升者為廉升授東北沿邊州郡而升者為邊升凡院務監當差使則皆同從九品凡品官任都事典事主事知事及尚書省令史覆實架閣司管勾直省直院局長副檢法知法院務監當差使及諸令史譯史掌書書史書吏譯書譯人通事並諸局分承應有出身者皆為流外職凡此之屬或以尚書省差遣或自本司判補其出職或正班雜班則莫不有當歷之名職既仕則必循升降之定式雖或前後略有損益之殊而定制則莫能渝焉凡門廕之制天眷中一品至八品皆不限所廕之人貞元二年定廕法一品至七品皆限以數而削八品用廕之制世宗大定四年五月詔皇家袒免以上親就廕者依格引試中選者勿令當儤使五年十月制亡宋官當廕子孫者並同亡遼官用廕又曰教坊出身人若任流內職者與文武同用廕自餘有勤勞者賞賜而已昔正隆時常使教坊輩典城牧民朕甚不取又更定冒廕及取廕官罪賞格七年五月命司天臺官四品以上官改授文武資者並聽如太醫例廕其制凡正班廕亦正班雜班廕雜班明昌元年以上封事者乞六品官添廕吏部言天眷中八品用廕不限所廕之人貞元中七品用廕方限以數當是時文始於將仕武始於進義以上至七品儒林忠顯各七階許廕一名至六品承直昭信計九階許廕二人自大定十四年文武官從下各增二階其七品視舊為九階亦廕一名至五品凡十七階方廕二人其五品至三品並無間越唯六品不用廕乞依舊格五品以上增廕一名六品廕子孫弟兄二人七品仍舊為格時又以舊格雖有己子許廕兄弟姪蓋所以崇孝悌也而新格禁之遂聽讓廕舊制司天太醫內侍長行雖至四品如非特恩換授文武官資者不許用廕以本人見充承應難使係班故也泰和二年定制以年老六十以上退與患疾及身故者雖至止官擬令係班除存習本業者聽廕一名止一子者則不須習即廕凡諸色出身文武官一品廕子孫至曾孫及弟兄姪孫六人因門廕則五人二品則子孫至曾孫及弟兄姪五人因門廕則四人三品子孫兄弟姪四人因門廕則三人四品五品三人因門廕則二人六品二人七品子孫兄弟一人因門廕則六品七品子孫兄弟一人舊格門廕惟七品一人餘皆加一人明昌格自五品而上皆增一人凡進納官舊格正班三品廕四人雜班三人正班武略子孫兄弟一人雜班明威一人懷遠以上二人鎮國以上三人司天太醫遷至四品詔換文武官者廕一人凡進士所歷之階及所循注之職貞元元年制南選初除軍判丞簿從八品次除防判録事正八品三除下令從七品四中令推官節察判正七品五六皆上令從六品北選初軍判簿尉二下令三中令四上令已後並上令通注節察判推官正隆元年格上甲者初上簿軍判丞簿尉中甲者初中簿軍判丞簿尉下甲者初下簿軍判丞簿尉第二任皆中簿軍判丞簿尉三四五六七任皆縣令回呈省大定二年詔文資官不得除縣尉八年格歷五任令即呈省十三年制第二任權注下令舊制狀元授承德郎以十四年官制文武官皆從下添兩重命狀元更授承務郎次舊授儒林郎更為承事郎第二甲以下舊授從仕郎更為將仕郎十五年敕狀元除應奉兩考依例授六品十八年敕狀元行不顧名者與外除十九年命本貫察其行止美惡二十一年復命第三任注縣令二十二年敕進士受章服後再試時務策一道所謂策試者也內才識可取者籍其名歷任後察其政若言行相副則升擢任使是年九月復詔今後及第人策試中者初任即升之二十三年格進士上甲初録事防判二下令三中令中甲初中簿二上簿三下令下甲初下簿二中簿三下令試中策者上甲初録事防判二中令三上令中甲初上簿二下令三中令下甲初中簿二録事防判三中令又詔今後狀元授應奉一年後所撰文字無過人者與外除二十六年格以相次合為令者減一資歷二十六年格三降兩降免一降文資右職外官減最後上令一任通五任回呈省遂定格上甲初録事防判二中令三四五上令中甲初中簿二下令三中令四五上令策試進士初録事防判二三四五上令其次初上簿二中令三四五上令又次初中簿二下令三中令四五上令下甲初下簿二下令三中令四五上令二十七年制進士階至中大夫呈省明昌二年罷勘會狀元行止之制七年格縣令守闕各依舊格注授泰和格諸進士及第合授資任須歷遍乃呈省雖未盡歷官已至中大夫亦呈省又諸詞賦經義進士及第後策試中選合授資任歷遍呈省仍每任升本等首銓選貞祐三年狀元授奉直大夫上甲儒林郎中甲以下授徵事郎經義進士皇統八年就燕京擬注六年與詞賦第一人皆擬縣令第二人當除察判以無闕遂擬軍判第二第三甲隨各人住貫擬為軍判丞簿舊制五經及第未及十年與關內差使已十年者與關外差使四十年除下令正隆三年不授差使至三十年則除縣令大定二十八年始復設是科每舉專主一經女直進士大定十三年皆除教授二十二年上甲第二第三人初除上簿中甲則除中簿下甲則除下簿大定二十五年上甲甲首遷四重餘各遷兩重第二第三甲授隨路教授三十月為一任第二任注九品第三第四任注録事軍防判第五任下令尋復令第四任注縣令二十六年減一資歷注縣令二十八年添試論後皆依漢人格宏詞上等遷兩官次等遷一官時取旨授之恩榜章宗大定二十九年敕今後凡五次御簾進士可一試而不黜落止以文之高下定其次謂之恩榜女直人遷將仕漢人登仕初任教授三十月任滿依本格從九品注授明昌元年敕四舉終場亦同五舉恩例直赴御試明昌五年敕神童三次終場同進士恩榜遷轉兩次終場全免差使第六任與縣令依本格遷官如一次終場初入仕則一除一差其餘並依本門戶仍使應三舉然後入仕每舉放四十人凡恩例補廕同進士者謂大禮補致仕遺表陳亡等恩澤補承襲録用並與國王並宗室女為婚者正隆二年格初下簿二中簿三上簿四下令五中令六七上令回呈省凡特賜同進士者謂進粟出使回歿於王事之類皆同雜班補廕亦以雜班正隆元年格初授下簿二中簿三縣丞四軍判五六防判七八下令九中令十上令尋復更初注下等軍判丞簿尉次注中等軍判丞簿尉第三注上等軍判丞簿尉四下令五中令六上令律科經童正隆元年格初授將仕郎皆任司候十年以上並一除一差十年外則初任主簿第二任司候第三主簿四主簿五警判六市丞七諸縣丞八次赤丞九赤縣丞十下縣令十一中縣令五任上縣令呈省三年制律科及第及七年者與關內差使七年外者與關外差諸經及第人未十年者關內差已十年關外差律科四十年除下令經童及第人視餘人復展十年然後理算月日大定十四年以從下新增官階遂定制律科及第者授將仕佐郎十六年特旨以四十年除下令太遠其以三十二年不犯贓罪者授下令十七年敕諸科人仕至下令者免差二十年省擬無贓罪及廉察無惡者減作二十九年注下令經童亦同此二十六年省擬以相次當為縣令者減一資歷選注敕命諸科人纍任之餘月日至四十二月准一除一差又敕舊格六任縣令呈省遂減為五任二十八年減赤縣丞一任明昌五年制仕二十六年之上者如該廉升則注縣令六年減諸縣丞赤縣丞兩任後吏格十年內擬注差使十年外一除一差若歷八任或任至三十二年注下令則免差須遍歷而後呈省所歷之制初二下簿三四中簿五六七上簿犯選格者又歷上簿兩任八九則注下令十中令十一十二上令凡武舉泰和三年格上甲第一名遷忠勇校尉第二第三名遷忠翊校尉中等遷修武校尉收充親軍不拘有無廕視舊格減一百月出職下等遷敦武校尉亦收充親軍減五十月出職承安元年格第一名所歷之職初都巡副將二下令三中令四五上令第二第三名初巡尉部將二上簿三下令四中令五六上令餘人初副巡軍轄二中簿三下令四中令五六上令凡軍功有六一曰川野見陳最出當先殺退敵軍二曰攻打抗拒州縣山寨奪得敵樓三曰爭取船橋越險先登四曰遠探捕得喉舌五曰險難之間遠處報事情成功六曰謀事得濟越衆立功皇統八年格凡帶官一命昭信校尉正七品以上者初除主簿及諸司副使正九品二主簿及諸司使正八品三下令從七品四中令正七品五上令或通注鎮軍都指揮使正七品及正將其官不至昭信及無官者自初至三任通注丞簿四下令五中令六上令及知城寨從七品章宗大定二十九年遷至鎮國者取旨升除後吏格之所定女直人昭信校尉以上者初下簿二下令三中令四五上令女直一命遷至昭信校尉餘人至昭信已上者初下簿二中簿三下令四中令五六上令凡至宣武將軍以上者初下令二中令三四上令凡勞效謂年老千戶謀克也大定五年制河南陝西統軍司千戶四十年以上擬從七品三十年千戶四十年以上之謀克從八品二十年以上千戶三十年以上謀克從九品二十年以上謀克與正班與差使十年以上賞銀絹皆以所歷千戶謀克蒲輦月日通算二十年制以先曾充軍管押千戶謀克蒲輦二十年以上六十五歲放罷者視其強健者與差除令係班不則量加遷賞後更定吏格若一命遷宣武將軍以上當授從七品職事者初下令二中令三四上令官不至宣武初授八品者授録事二赤劇丞三下令四中令五六上令初授九品官者初下簿二中簿三上簿四下令五中令六七上令大定九年格三虞候順德軍千戶四十年以上者與從八品三十年千戶四十年以上謀克從九品二十年以上千戶三十年以上謀克與正班以下賞銀絹大定十四年定隨路軍官出職以新制從下創添兩重舊遷忠武校尉者今遷忠勇校尉中都永固軍指揮使及隨路掃兵指揮使出職舊遷敦武校尉者今遷進義校尉武衛軍大定十七年定制其猛安曰都將謀克曰中尉蒲輦曰隊正都將三十月遷一官至昭信注九品職事以隊正升中尉中尉升都將省令史選取之門有四曰文資曰女直進士曰右職曰宰執子其出仕之制各異文資者舊惟聽左司官舉用至熙宗皇統八年省臣謂若止循舊例舉勾久則善惡不分而多僥幸遂奏定制自天眷二年及第榜次姓名從上次第勾年至五十已上官資自承直郎從六品至奉德大夫從五品無公私過者一闕勾二人試驗可則收補若皆可即籍名令還職待補官至承直郎以上一考者除正七品以上從六品以下職事兩考者除從六品以上從五品以下奉直大夫從六品以上一考者除從六品以上從五品以下兩考者除從五品以上正五品以下節運同正隆元年罷是制止於密院臺及六部吏人令史內選充大定元年世宗以胥吏既貪墨委之外路幹事又不知大體徒多擾動至二年罷吏人而復皇統選進士之制承直郎以上者一考正七品除運判節察判軍刺同知兩考者從六品除京運判總府判防禦同知奉直大夫已上一考者從六品除同前兩考從五品除節運副京總管府留守司判官七年以散階官至五品亦勾充不願者聽十一年以進士官至承直者衆遂不論官資但以榜次勾補二十七年以外多闕官論者以為資考所拘難以升進乃命不論官資凡一考者與六品次任降除正七品第三任與六品第四任升為從五品兩考者與從五品次任降除六品第三四任皆與從五品五任升正五品承安二年以習學知除刑房知案及兵興時邊關令史三十月除隨朝闕泰和八年以習學知除十五月以上選充正知除一考後理算資考大安三年以從榜次則各人所歷月日不齊遂以吏部等差其所歷歲月多寡為次收補知除考滿則授隨朝職貞祐五年進士未歷任者亦得充補一考者除上縣令再任上縣令升正七品如已歷一任丞簿者舊制除六品乃更為正七品一任回降從七品再任正七品升六品如歷兩任丞簿者一考舊除六品乃更為正七品一任回免降復免正七一任即升六品曾歷令一任者依舊格六品再任降除七品還升從五品興定二年敕初任未滿及未歷任者考滿升二等為從七品初任未滿者兩任未歷任者四任回升正七品兩任正七皆免回降凡不依榜次勾取者同隨朝升除俟榜次所及日聽再就補興定五年定進士令史與右職令史同格考滿未應得從七者與正七品回降從七一任所勾諸府令史不及三考出職者除從七品回降除八品若一任應得從七品者除六品回降正七品若一任應得正七品者免降女直進士令史二十七年格一考注正七品兩考注正六品二十八年敕樞密院等處轉省者並用進士明昌元年敕至三考者與漢人兩考者同除明昌三年罷契丹令史其闕內增女直令史五人五年以與進士令史辛苦既同資考難異遂定與漢進士一考與從六品兩考與從五品宰執子弟省令史大定十二年制凡承廕者呈省引見除特恩任用外並內奉班收仍於國史院署書寫太常署檢討祕書監置校勘尚書省准備差使每三十月遷一重百五十月出職如承應一考以上許試補省令譯史則以百二十月出職其已歷月日皆不紐折如係終場舉人即聽尚書省試補十七年定制以三品職事官之子試補樞密院令史遂命吏部定制宰執之子並在省宗室郎君如願就試令譯史每年一就試令譯史考試院試補外緦麻袒免宗室郎君密院收補大定二十八年制以宗室第二從親並宰相之子出職與六品外宗室第三從親並執政之子出職與正七品其出職皆以百五十月若見已轉省之餘人則至兩考止與正七品二十九年四從親亦許試補
