body:
  text: 金史卷三十三志第十四禮六原廟朝謁儀朝拜儀別廟太宗天會二年立大聖皇帝廟于西京熙宗天眷二年九月又以上京慶元宮為太祖皇帝原廟皇統七年有司奏慶元宮門舊曰景暉殿曰辰居似非廟中之名今宜改殿名曰世德是歲東京御容殿成世宗大定二年十二月詔以會寧府國家興王之地宜就慶元宮址建正殿九間仍其舊號以時薦享海陵天德四年有司言燕京興建太廟復立原廟三代以前無原廟制至漢惠帝始置廟於長安渭北薦以時果其後又置於豐沛不聞享薦之禮今兩都告享宜止於燕京所建原廟行事於是名其宮曰衍慶殿曰聖武門曰崇聖大定二年以睿宗御容奉遷衍慶宮五年會寧府太祖廟成有司言宜以御容安置先是衍慶宮藏太祖御容十有二法服一立容一戎衣一佩弓矢一坐容二巾服一舊在會寧府安置半身容二春衣容一巾而衣紅者二舊在中都御容殿安置今皆在此詔以便服容一遣官奉安擇日啓行前一日夙興告廟用酒饌差奏告官一員以所差使充進請御署祝板其日質明有司設龍車於衍慶宮門外少西東向宰執率百官公服詣本宮殿下班立再拜班首升殿跪上香奠酒教坊樂作少退再拜班首降階復位陪位官皆再拜奉送使副率太祝捧御容匣出宰執以下分左右前導出衍慶宮門外俟御容匣升車百官上馬後從旗幟甲馬錦衣人等分左右導香輿扇等前行至都門郊外俟御容車少駐導從官下馬車前立班再拜奉送使副側侍不拜班首詣香輿跪上香俯伏興還班再拜辭訖退使副遂行每程到館或廨舍內安駐其道路儀衛紅羅傘一龍車一其制以青布為亭子狀安車上駕以牛又用駝五旗鼓共五十舁香輿一十人導從六十人執扇八人兵士百人護衛二十人以宗室猛安謀克子孫充所過州縣官屬公服出郭香果奉迎再拜班首上香奠酒又再拜送至郊外再拜乃退至會寧府官屬備香輿奉迎如上儀乘馬從至廟門外下馬分左右導引使副率太祝四員捧御容入廟於中門外東壁幄次內奉置定再拜訖退擇日奉安至日質明差去官與本府官及建廟官等並公服詣幄次前排立先再拜跪上香樂作奠酒訖又再拜太祝捧御容衆官前導引至殿下排立御容升殿奉安訖再拜班首升殿跪上香讀祝奠酒樂作少退再拜訖班首降階復位同執事官再拜訖退十五年二月有司言東京開覺寺藏睿宗皇帝皂衣展裹真容敕遷本京祖廟奉祀仍易袍色明年四月詔依奉安睿宗禮奉安世祖御容於衍慶宮前期有司備香案酒果教坊樂至日質明親王宰執率百官公服迎引至衍慶宮凡用甲騎百人傘二人扇十二人香輿八人綵輿十六人從者二十四人執事官二人弩手控鶴各五十人贊者二人禮直官二人六品以下官三十員公服乘馬前導奉安訖百官再拜禮畢退立宮門之外迎駕朝謁十六年正月有司奏奉敕議世祖皇帝御容當於何處安置臣等參詳衍慶宮即漢之原廟每遇太祖皇帝忌辰百官朝拜今世祖皇帝擇地修建殿位庶可副嚴奉之意從之乃敕於聖武殿東西興建世祖太宗睿宗殿位既而復欲擇地建太宗殿于歸仁館有司言山陵太祖太宗睿宗共一兆域太廟世祖太祖太宗睿宗亦同堂異室今於歸仁館興建太宗殿位似與山陵太廟之制不同詔從前議止於衍慶宮各建殿七間閣五間三門五間乃定世祖殿曰廣德閣曰燕昌太宗殿曰丕承閣曰光昭睿宗殿曰天興閣曰景福十九年五月六日奏告七日奉安執事禮官二人每位香案一祭器席一拜褥二盥洗一大勺篚巾全前一日太廟令率其屬掃除宮內外又各設神座於殿上又設親王宰執以下百官拜位於殿庭又設盥洗位于東階下執罍篚者位于其後又於神位前各設北向拜褥位並各設香案香爐匙合香酒花果器皿物等依前來例又於聖武殿上設香案爐匙合香等又於殿下各設腰輿一舁士一十六人傘子各二人執扇各十二人導從弩手各三十人前一日清齋親王於本府百官於其第行禮官執事人等習儀就祠所清齋其日質明禮官率太廟署官等詣崇聖閣奉世祖御容每匣用內侍二人太祝一員禮官署官前導置於聖武殿神座禮直官引親王宰執百官公服於殿庭班立七品以下班于殿門之外贊者曰拜在位官皆再拜禮直官引班首詣罍洗盥手訖升殿詣神座前跪上香訖少退再拜禮直官引班首降殿復位贊者曰拜在位官皆再拜訖禮直官導世祖御容升腰輿儀衛依次序導從至廣德殿百官後從至庭下班位立禮官率太廟署官就腰輿內捧御容於殿上正面奉安訖百官於階下六品已下官於殿門外立班贊者曰再拜在位官皆再拜禮直官引班首詣盥洗盥手訖升殿執事官等從升詣御容前跪上香奠酒教坊樂作少退再拜訖樂止禮直官引班首降殿復位贊者曰拜在位官皆再拜訖禮官率太廟署官詣崇聖閣太祝內侍捧太宗御容禮官導太宗御容置於聖武殿行禮畢以次奉安於丕承殿行禮並如上儀次睿宗御容奉安於天興殿禮亦如之俟奉安禮畢百官退二十一年閏三月奉旨昭祖景祖奉安燕昌閣上肅宗穆宗康宗奉安閣下明肅皇帝奉安崇聖閣下每位設黃羅幕一黃羅明金柱衣二紫羅地褥一龍牀一踏牀二衣全前期奏告四月一日奉安五日親祀是年五月遷聖安寺睿宗皇帝御容于衍慶宮皇太子親王宰執奉迎安置朝謁儀大定十六年四月十九日奉安世祖御容行朝謁之禮皇帝前一日齋於內殿皇太子齋於本宮親王齋於本府百官齋於其第太廟令率其屬於衍慶宮內外掃除設親王百官拜位於殿庭又設皇太子拜褥於親王百官位前宣徽院率其屬於聖武門外之東設西向御幄靈星門東設皇太子幄次其日有司列仗衛于應天門俟奉安御容訖有司於殿上並神御前設北向拜褥位安置香爐香案並香酒器物等皇太子比至車駕進發已前公服乘馬本宮官屬導從至衍慶宮門西下馬步入幄次親王百官於衍慶宮門外西向立班俟車駕將至典贊儀引皇太子出幄次於親王百官班前奉迎導駕官五品六品七品職官內差四十員於應天門外道南立班以俟皇帝服靴袍乘輦從官傘扇侍衛如常儀敕旨用大安輦儀仗一千人出應天門閣門通喝導駕官再拜訖閣門傳敕導駕官上馬分左右前導至廟門外西偏下馬車駕至衍慶宮門外稍西降輦左右宣徽使前導皇帝步入御幄簾降閣門先引親王宰執四品已上執事官由東西偏門入至殿庭分東西班相向立典贊儀引皇太子入立於褥位之西東向進香進酒等執事官並升階於殿上分東西向以次立宣徽使跪奏請皇帝行朝謁之禮簾捲皇帝出幄宣徽使前導至殿上褥位北向立典贊儀引皇太子就褥位閣門引親王宰執四品已上職事官回班並北向立令中間歇空不礙奏樂五品以下聖武門外八品以下宮門外陪拜奏請並宣徽使皇帝再拜教坊樂作皇太子已下羣官皆再拜請皇帝詣神御前褥位北向立又請皇帝再拜皇太子已下羣官皆再拜請皇帝跪三上香三奠酒俯伏興又請皇帝再拜皇太子已下羣官皆再拜訖皇帝復位又請皇帝再拜皇太子已下羣官皆再拜宣徽使奏禮畢已上擬八拜宣徽院奏過依舊例十二拜典贊儀引皇太子復立於褥位之西東向閣門引親王宰執以下羣官東西相向立先引五品已下官出宣徽使前導皇帝還御幄簾降典贊儀引皇太子閣門分引殿庭百官以次出宣徽使跪奏請皇帝還宮簾捲止出廟門外升輦還宮如來儀十九年奉安禮同朝拜儀初太祖忌辰皇帝至褥位立再拜稍東西向詣香案前又再拜上香訖復位又再拜進食奠茶辭神皆再拜而退大定二十一年五月十二日睿宗忌辰有司更定儀禮前一日宣徽院設御幄于天興殿門外稍西至日質明皇太子親王百官具公服于衍慶宮門外立班奉迎皇帝乘馬至衍慶宮門外下馬二宣徽前導步入宮門稍東皇帝乘輦傘扇侍衛如常儀至天興殿門外稍西皇帝降輦入幄次簾降典贊儀引皇太子閣門引親王宰執四品已上官由偏門入至于殿庭左右分班立定二宣徽使導皇帝由天興門正門入自東階升殿詣褥位立定皇太子已下官合班五品以下班于殿門外宣徽使奏請皇帝先再拜請詣侍神位立俟有司置香案酒卓訖請詣褥位又再拜三上香奠酒復位再拜已上皇太子已下皆陪拜再奏請詣稍東侍神位立典贊儀引皇太子升殿赴褥位先兩拜奠酒再兩拜降復褥位次閣門引終獻官趙王上殿行禮宣徽使奏請皇帝詣褥位再兩拜皇太子已下官皆再拜禮畢百官依前分班立皇帝出殿門外入幄次簾降更衣次引皇太子已下官出宮門外立班皇帝乘輦至宮門稍東降輦步出宮門外上馬還宮導從侍衛如來儀皇太子已下官俟車駕行然後退大定五年奉旨太祖忌辰衍慶宮薦享止用素食諸京凡御容所在皆同又朔望皆行朝拜禮六年有司奏太祖皇帝忌辰車駕親奠百官陪拜今車駕巡幸合以宰臣為班首率百官詣衍慶宮行禮從之十六年奉旨世祖太宗忌辰一體奉奠十八年八月太祖忌辰世祖太宗同在一處致祭有司言歷代無一聖忌列聖預祭之典擬議間敕遣太子一位行禮並就祭功臣二十六年以內外祖廟不同定擬太廟每歲五享山陵朔望忌辰及節辰祭奠並依前代典故外衍慶宮自來車駕行幸遇祖宗忌辰百官行禮並諸京祖廟節辰忌辰朔望拜奠雖無典故參酌恐合依舊以盡崇奉之意從之別廟大定二年有司擬奏閔宗無嗣合別立廟有司以時祭享不稱宗以武靈為廟號又奏唐立別廟不必專在太廟垣內今武靈皇帝既不稱宗又不與祫享其廟擬於太廟東墉外隙地建立從之十四年廟成以武靈後諡孝成又謂之孝成廟十五年三月戊申奉安武靈皇帝及悼皇后前期一日奉告太廟十一室及昭德皇后廟餘如昭德過廟之儀四月十七日夏享太廟同時行禮命判宗正英王爽攝太尉充初獻官兵部尚書讓攝司徒差大理卿天錫攝太常卿充亞獻大興少尹高居中攝光祿卿充終獻自是歲常五享十七年十月祫享太廟檢討唐禮孝敬皇帝廟時享用廟舞宮縣登歌讓皇帝廟至禘祫月一祭只用登歌其禮制損益不同今武靈皇帝廟庭與太廟地步不同難以容設宮縣樂舞並樂器亦是闕少看詳恐合依唐讓皇帝祫享典故樂用登歌所有牲牢樽俎同太廟一室行禮及契勘得自來祫享遇親祠每室一犢攝官行禮共用三犢今添武靈皇帝別廟行禮合無依已奏定共用三犢或增添牛數奏奉敕旨太廟別廟共用三犢武靈皇帝廟樂用登歌差官奏告並準奏大定十九年四月升祔太廟其舊廟遂毀昭德皇后廟大定二年有司援唐典昭德皇后合立別廟擬於太廟內垣東北起建從之三年十月七日太廟祫享升附睿宗皇帝並昭德皇后神主同時制造題寫奉詣殿庭謁畢祔於祖姑欽仁皇后之左享祀畢奉主還本廟十二月二十一日臘享禮官言唐禮別廟薦享皆準太廟一室之儀伏恐今廟享畢已過質明請別差官攝祭制可後以殿制小又於太廟之東別建一位十二年八月廟成正殿三間東西各空半間以兩間為室從西一間西壁上安置祏室廟置一便門與太廟相通仍以舊殿為册寶殿祏室奏毀十三年六月二十一日奏告太廟祭告別廟二十三日奉安用前祫享過廟儀有司言當用鹵簿以廟相去不遠參酌擬用清道二人次團扇二人次職掌八人次衙官二十六人為十三重供奉官充次腰輿輿士一十六人傘子二人次團扇十四為七重方扇四次排列職掌六人燭籠十對輦官並錦襖盤裹仍令皇太子率百官行禮前一日行事執事官就祠所清齋一宿仍習儀執事者醴饌太廟令帥其屬掃除廟之內外禮直官設皇太子西向位執事官位皇太子後近南西向各依品從立監祭殿西階下東向立及親王百官位於廟庭北向西上又設祝案於神位之右設尊彝之位於左各加勺坫又設祭器皆藉以席左一籩實以鹿脯左一豆實以鹿臡又設盥洗爵洗位于橫街之南稍東罍在洗東加勺篚在洗西南肆實以巾執罍篚者位于其後太廟令又設神位於室內北墉下當戶南向設直几一黼扆一莞席一繅席一次席二紫綾厚褥一紫綾蒙褥一並幄帳等諸物並如舊廟之儀又設望燎位于西神門外之北設燎柴于位之北預掘瘞坎于燎所所司陳儀衛於舊廟門之外奉安日未明二刻所司座方扇燭籠於舊廟殿門外設腰輿一傘一於殿階之下南向質明皇太子公服乘馬本宮官屬導從至廟門外下馬步入廟門至幕次引親王百官常服由廟門入於殿庭北向西上重行立定次引皇太子於百官前絶席位立贊者曰再拜皆再拜宮闈令升殿捧昭德皇后神主置于座贊者曰再拜皆再拜次引內常侍北向俯伏跪奏請昭德皇后神主奉安于新廟降殿升輿奏訖俯伏興捧几內侍先捧几匱跪置於輿又宮闈令接神主內侍前引跪置于輿上几後覆以紅羅帕內常侍已下分左右前引皇太子步自舊廟先從行親王次之百官分左右後從儀衛導從至別廟殿下北向內常侍於腰輿前俯伏興跪奏請降輿升殿內侍捧几匱前宮闈令捧接神主升殿置于座禮直官引皇太子以下親王百官入殿庭北向西上重行立皇太子在絶席立禮直官贊曰再拜皆再拜又贊曰行事官各就位禮直官引皇太子西向位立定禮直官少前贊曰有司謹具請行事即引皇太子就盥洗位北向搢笏盥手帨手執笏詣爵洗位北向立搢笏洗爵拭爵以授執事者執笏升詣酒尊所西向立執事者以爵授皇太子搢笏執爵執事者舉酌酒皇太子以爵授執事者詣神位前北向搢笏跪執事者以爵授皇太子執爵三祭酒反爵于坫執笏俯伏興少立次引太祝舉祝官詣讀祝位東北向舉祝官跪舉祝版太祝跪讀祝訖置祝于案俯伏興舉祝官皆却立北向贊者曰再拜皇太子就兩拜降階復位舉祝讀祝官後從復本位禮直官曰再拜在位者皆再拜宮闈令納神主于室贊者曰再拜皆再拜禮畢退署令闔廟門瘞祝于坎儀物各還所司十一年郊祀前一日朝享與太廟同日用登歌樂行三獻禮有司攝事二十六年敕別建昭德皇后影廟于太廟內有司言宜建殿三間南面一屋三門垣周以甓外垣置靈星門一神及西房各三間然禮無廟中別建影廟之例今皇后廟西有隙地廣三十四步袤五十四步可以興建制可仍於正南別創正門門以坤儀為名仍留舊有便門遇禘祫祔享由之每歲五享並影廟行禮於正南門出入又於廟外起齋廊房二十三間宣孝太子廟大定二十五年七月有司奏依唐典故太子置廟設官屬奉祀擬於法物庫東建殿三間南垣及外垣皆一屋三門東西垣各一屋一門門設九戟齋房神席地之宜又奉旨太子廟既安神主宜別建影殿有司定擬制度於見建廟稍西中間限以磚墉內建影殿三間南面一屋三門垣周以甓無闕角及東西門外垣正南建三門一左右翼廊二十間神齋室各二屋三間是歲十月廟成十一日奉安神主十四日奉遷畫像神主用栗依唐制諸侯用一尺刻諡于背省部遣官於本廟西南隅面北設幄次監視製造於行禮前一日製造訖其日晚奉神主官奉承以箱覆以帕捧詣題神主幄中次日丑前五刻題神主官與典儀並禮官詣幄次前題神主官詣罍洗位盥手帨手訖奉神主官先以香湯奉沐拭以羅巾題神主官就褥位題諡號於背云宣孝太子神主墨書用光漆模訖授奉神主官承以箱覆以梅紅羅帕藉以素羅帕詣座置於匱乃下簾帷侍衛如式俟典儀俯伏跪請備腰輿傘扇詣神位導引侍衛皆減昭德廟儀祭儀有司言當隨祖廟四時祭享初獻於皇孫皇族亞獻於皇族或五品以下差樂用登歌今量減用二十五人其接神用無射宮升降徹豆則歌夾鍾牲羊豕各一籩豆各八簠簋各二登鉶各一其餘祭食亦量減之二十六年十一月一日奏神主廟牲牢樂縣官給影廟皇孫奉祀
