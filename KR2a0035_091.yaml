body:
  text: 金史卷九十一列傳第二十九完顏撒改龐迪溫迪罕移室悶神土悶移剌成石抹卞楊仲武蒲察世傑本名阿撒蕭懷忠移剌按答孛术魯阿魯罕趙興祥石抹榮敬嗣暉完顏撒改上京納魯渾河人也其先居於兀冷窟河身長多力善用槍王師南征睿宗為右副元帥置之麾下佩以金牌使督軍事天眷元年授本班祗候郎君詳穩其後從軍泰州路軍帥以撒改為萬戶領銀术可等猛安戍北邊數有戰功天德二年正月海陵庶人遣使夏國諭以即位事因令伺彼之意既還稱旨為尚書兵部郎中改同知會寧尹遷迭剌部族節度使改甌里本羣牧使為曷懶路都總管海陵伐宋授衛州防禦使為武震軍都總管世宗即位遣使召撒改既至除昌武軍節度使已而為山東路元帥副都統改安化軍節度使兼副都統如故四年徙鎮安武仍兼副統領山東大名東平三路軍八萬餘渡淮會大軍伐宋進至楚州宋遣使奉歲幣還邳州卒龐迪字仲由延安人少倜儻喜讀兵書習騎射學推步孤虛之術無所效用應募隸涇原路第三副將破賊有功授保義郎嘗從百餘騎經行山谷遇夏人數千衆皆駭懼請避迪遂躍馬犯陳敵皆披靡身被重創神色自若完軍以還自是知名擢為正將權發遣涇原路兵馬都監齊國建涇原路經略使張中孚舉迪權知懷德軍兼沿邊安撫使夏人合軍五萬薄懷德城迪開門待之夏人不敢入因以數千騎分門突出遂破之斬首五百級獲軍資羊馬甚衆復破關師古兵擢知涇州未到官改知鎮戎軍沿邊安撫使已而權淮南東路馬步軍副總管總制沂密淮陽兼權知沂州丁父憂去官尋起復為環慶路兵馬都鈐轄權知邠州齊國廢改華州防禦使頃之軍變被執入山已而賊衆悔曰公為政素善豈宜劫辱遂縱之還復領州事天眷元年除永興軍路兵馬都總管兼知京兆府徙臨洮尹兼熙秦路兵馬都總管陝右大飢流亡四集迪開渠溉田流民利其食居民藉其力各得其所郡人立碑紀其政績官制行吏部以武功大夫博州團練使特授定遠大將軍七年除慶陽尹歷三考不易以治最聞詔書褒美西人榮之正隆元年遷鳳翔尹屢上章求退不許海陵南伐徵斂煩急官吏因緣為姦富者用賄以免貧者破産益困迪悉召民使共議增減不加威督而役力均人情大悅五年徙汾陽軍節度使大定初復為臨洮尹遷南京路都轉運使以省事惜費安靜為政河南稱之徙絳陽軍節度使卒官年七十迪性純孝父病醫藥弗效迪仰天泣禱刲股作羹由是獲安昆弟析家財迪盡以與之一無所取官爵之廕率先諸姪疾革沐浴朝服而逝溫迪罕移室悶速頻屯悶歡春人徙上京忽論失懶兄术輦國初有功授世襲謀克移室悶性忠正強毅善騎射膂力過人皇統初襲其兄謀克積戰功為洮州刺史謂人曰謀克兄職也兄子斡魯古今已長矣遂以謀克讓還兄子宗弼聞而嘉之曰能讓世襲可謂難矣除貴德州刺史改移典辭詳穩遷烏古里部族節度使改德昌軍正隆四年大徵兵南伐泰州猛安定遠阿補以所部叛還移室悶以七謀克執定遠阿補勒其衆付大軍契丹反敗會寧六猛安於締母嶺屯於信韓二州之境移室悶率數千人殺賊萬餘于伊改河以功遷臨潢尹世宗即位賜手詔曰南征諸路將士及卿子姪安遠斡魯古斜普兄弟具甲仗悉來推戴朕勉即大位卿纍世有功耆舊之臣緣邊事未寧臨潢劇任姑仍舊職聞樞密副使白彥敬南京留守紇石烈志寧來討契丹今已遣人往招之其家皆在南京恐或遁去兼起異謀若至則已若不至卿當以計執而獻之兩次遣人招誘招討都監老和尚去人不知彼之所在久而不還兼老和尚不知朕已即位卿可使人諭以朕意如來降悉令復舊邊關之事可設耳目是時窩斡已反領兵數萬來攻臨潢諸路軍未至窩斡勢益大移室悶領城中軍士六百人邀擊窩斡凡數接戰剿殺甚衆所乘馬中流矢而仆為賊所執賊使移室悶招城中人曰爾生死在頃刻能使城中出降官爵如故不然殺汝矣移室悶怒罵賊曰我受國家爵祿肯從汝叛賊乎賊執之至城下迫脅之使招城中其妻子官屬將士皆登城臨望移室悶厲聲曰我恨軍少不能滅賊人生會有一死耳汝輩慎勿降賊一旦開門納賊城中百姓皆被殺掠毋以我故敗國家事賊無能為也賊怒殺之城中人皆為之感激推官麻圭益繕完城郭右監軍神土悶輔國上將軍阿思悶乘城固守賊不克攻遂引衆東行神土悶本諸宗室贈銀青光祿大夫胡速魯改子也年十五事太宗為左奉宸皇統二年充護衛除武器署丞纍官肇州防禦使大定初除元帥右都監與咸平尹吾扎忽率泰州兵及曷懶路兵千五百人會臨潢尹移室悶討契丹契丹犯臨潢移室悶死攻之不能克乃引衆東行神土悶表乞濟師十二月甲辰世宗次海濱縣得奏上曰神土悶吾扎忽軍不少可以從長攻襲矣會右副元帥謀衍以大軍至神土悶改曷速館節度使隸右翼與紇石烈志寧敗賊於長濼戰霿河皆有功改婆速路兵馬都總管卒移剌成本名落兀其先遼橫帳人也勇有謀通契丹漢字天會間隸撻懶下為行軍猛安與宋人戰於楚泗之間成以所部先登大破宋軍功最諸將劉麟約會天長軍議進止成與夾古查合你俱為撻懶前鋒得宋生口為鄉導遂達天長睿宗嘉之後從宗弼將兵廢齊國及再伐宋攻濠州每戰輒先登多所摧破宗弼再取河南成及蕭懷忠等八猛安先渡河南平第功授宣武將軍除威州刺史用廉擢同知延安尹再遷昭義軍節度使正隆南伐為武毅軍都總管撒八反海陵以事誅契丹名將成以本軍守磁即遣妻子還汴海陵用是不疑時人高其有識改神武軍都總管與孛术魯定方為浙東道先鋒使由淮陰進兵以所部護糧赴揚州敵兵乘夜來攻成整兵奮擊斬刈甚衆會海陵庶人死軍還復鎮昭義大定二年以廉在優等改河中尹再除臨洮尹招降喬家等族首領結什角遷南京留守召拜樞密副使封任國公改北京留守卒訃聞上悼惜之授其子順思阿不武功將軍世襲咸平路鈔赤鄰猛安下查不魯謀克結什角者西番既衰其苗裔曰堇氈其子曰巴氈角始附宋賜姓趙改名順忠順忠子永吉永吉子世昌皆受宋官為左武大夫遙領萊州防禦使襲把羊族長朝廷定陝西世昌換忠翊校尉既而鬼蘆族長京臧殺世昌朝廷遣兵執京臧斬之臨洮市以世昌子鐵哥為把羊族都管大定四年宋人破洮州鐵哥弟結什角與其母走入喬家族避之喬家族首領播逋與鄰族木波隴逋厖拜丙離四族耆老大僧等立結什角為木波四族長號曰王子其地北接洮州積石軍其南隴逋族南限大山八百餘里不通人行東南與疊州羌接其西丙離族西與盧甘羌接其北厖拜族與西夏容魯族接地高寒無絲枲五穀惟産青稞與野菜合酥酪食之其疆境共八千里合四萬餘戶其居隨水草畜牧遷徙不常結什角念朝廷為其父報讎欲棄四族歸朝四族不許成至臨洮使人招結什角乃率四族來附進馬百匹仍請每年貢馬詔曰遠人慕義朕甚嘉之其遣能吏往撫其衆厚其賞賜初天會中詔以舊積石地與夏人夏人謂之祈安城有莊浪四族一曰吹折門二曰密臧門三曰隴逋門四曰厖拜門雖屬夏國叛服不常大定六年夏人破滅吹折密臧二門其隴逋厖拜二門與喬家族相鄰遂歸結什角夏國遣使來告莊浪族違命作亂欲興兵剪除朝廷不知隴逋厖拜二門舊屬夏國報以將檢會其地舊所隸屬毋擅出兵結什角之母居于莊浪族中大定九年結什角往省其母夏人伺知之遂出兵圍結什角招之使降結什角不從率所部力戰潰圍出夏人斫斷其臂虜其母去部兵亦多亡者結什角尋亦死遺言請命朝廷復立喬家族首領陝西奏聞知夏國王李仁孝與其臣任得敬中分其國發兵四萬役夫三萬築祈安城殺喬家等族首領結什角屢獲宋諜人言宋欲結夏國謀犯邊境詔遣大理卿李昌圖左司員外郎粘割斡特剌往按之且止夏人毋築祈安城及處置喬家等族別立首領夏國報云祈安本積石舊城久廢邊臣請設戍兵鎮撫莊浪族所以備盜非有他也結什角以兵入境以是殺之不知為喬家族首領也李昌圖等按視殺結什角之地本在夏境築祈安城已畢工皆罷歸不得宋夏交通之狀乃於熙秦迫近宋夏衝要量添戍兵及問喬家等族民戶願以結什角姪趙師古為首領於是詔以趙師古為木波喬家丙離隴逋厖拜四族都鈐轄加宣武將軍石抹卞本名阿魯古列五代祖王五遼駙馬都尉父五斤為羣牧使從睿宗秋山卞年十三已能射連獲二鹿睿宗奇之賜以良馬及金吐鶻天會末宗弼為右監軍召卞隸帳下丁父憂是時宗磐為太師撻懶為左副元帥人爭附之使人召卞卞不往宗磐撻懶皆以罪誅人多其有識宗弼復取河南與宋人戰於潁州漢軍少却卞身被七創率勇士十餘騎奮擊敗之及宋稱臣宗弼選嘗有勞者與俱入朝授卞忠勇校尉遷宣武將軍除河間少尹察廉升遂州刺史改壽州再改唐州丁母憂去官起復唐州刺史海陵伐宋卞為武毅軍都總管由別道進兵遇宋伏兵數百人以三十騎擊敗之遂下信陽軍及羅山縣至蔣州宋守將棄城遁因取其城頃之軍士皆欲逃歸闌子山猛安結漢軍三猛安謀克劫卞還舍於奬水之曲卞乃陰約漢軍將吏乘夜掩殺闌子山猛安復將其軍大定二年除鄭州防禦使以本官領行軍萬戶伐宋遷武勝軍節度使宋人請和明年有水牛數百頭自淮南走入州境僚佐欲收之充官用卞不聽復驅過淮還之遷河南尹轉西南路招討使改大名尹大名多盜而城郭不完卞請修大名城奏可城完葺盜賊不得發徙臨洮尹卒官年六十三楊仲武字德威保安人父遇以勇聞關西為宥州團練使宋末仲武謁經略使王庶求自效遂用為先鋒婁室入關仲武與鄜延路兵馬都監鄭建充俱降為安塞堡環慶路兵馬都監皇統初復陝西將兵戍鳳翔屢却宋軍除知寧州關中荐飢境內盜賊縱橫仲武悉平之改坊州刺史復知寧州遷同知臨洮尹改同知河中府海陵營繕南京典浮橋工役臨洮地接西羌與木波雜居邊將貪暴木波苦之遂相率為寇掠仲武前治臨洮及從數騎入其營諭之曰此皆將校侵漁汝等以至此爾今懲治此輩不復擾害汝也並以禍福曉之羌人喜悅寇掠遂息至是木波復掠熙河熙河主帥使人諭之不肯去曰楊總管來我乃解去熙河具奏詔復遣仲武當是時木波謂仲武不能復來及仲武至與其酋帥相見責以負約對曰邊將苦我今之來求訴於上官耳今幸見公願終身不復犯塞乃舉酒酹天折箭為誓仲武因以巵酒飲之曰當更為汝請若復背約必用兵矣羌人羅拜而去及伐宋以仲武為威定軍都總管駐兵歸德大定三年除武勝軍節度使改陝西西路轉運使卒蒲察世傑本名阿撒曷速館斡篤河人徙遼陽初在梁王宗弼軍中為人多力每與武士角力賭羊輒勝之能以拳擊四歲牛折脅死之有糧車陷淖中七牛挽不能出世傑手挽出之宗敏為東京留守召置左右海陵篡立即以為護衛海陵謂世傑曰汝勇力絶倫今我兄弟有異志者期以十日除之則有非常之賞仍盡以各人家産賜汝世傑受詔而不肯為已過十日海陵怒面責之世傑曰臣自誓不以非道害物雖死不敢奉詔海陵愛其勇不之罪也正隆四年調諸路兵伐宋年二十以上五十以下皆籍之他使者唯恐不如詔書得數多世傑往曷懶路得數少海陵怪問之對曰曷懶地接高麗今若多籍其丁即有緩急何以為備海陵喜曰他人用心不能及也除同知安國軍節度使事賜銀二百五十兩絹綵六百匹馬二匹是時徵發不已民不堪命犯法者衆邢久無長吏獄囚積四百餘人世傑到官月餘決遣略盡入為宿直將軍以事往胡里改路還奏契丹部族大抵皆叛百姓驚擾不安今舉國南伐賊若乘虛入據東土根本之地雖得江淮無益也宜先討平契丹南伐未晚海陵不悅曰詔令已出矣今以三萬兵選將屯中都以北足以鎮壓世傑又曰若東土大族附於賊恐三萬衆未易當也海陵不聽及發汴京授鄭州防禦使領武捷軍副總管大軍渡淮世傑以軍三千護糧餫東下敗宋兵數千人奪其戰船甚衆至和州境擊宋兵五萬人走之明日使其子兀迭領二百八十騎為應兵自領八百騎前戰連射六十餘人皆應弦而斃宋兵遂奔潰海陵欲觀水戰使世傑領水軍百人試之宋人舟大而多世傑舟小乃急進至中流取勝而還大定初世傑復取陝州敗宋兵石壕鎮復敗宋援兵三千人遂圍陝州宋兵二千自潼關來世傑以兵二百四十迎擊之射殺十餘人宋兵敗走復敗之於土壕山生擒一將復以兵三百至斗門城遇宋兵萬餘宋將三人挺槍來刺世傑世傑以刀斷其鎗宋兵乃退復以四謀克軍敗宋兵於土華復圍陝州世傑嘗擐甲佩刀腰箭百隻持鎗躍馬往來軍中敵人見而異之曰真神將也親率選卒二百餘人穴地以入城遂拔再破宋軍三萬人復虢州未幾為衛州防禦使改河南路統軍都監召赴闕上慰勞良久除西北路副統賜馬弓矢佩刀從僕散忠義討契丹賊平改華州防禦使與徒單合喜經略隴右合喜復德順至東山堡宋兵捍絶樵路世傑擊走之追至城下城中出兵約二萬餘敗之殺傷甚衆宋經略使荊臯棄德順走世傑與左都監璋追破其軍改亳州防禦使四遷通遠軍節度使宋人輒入鞏州境糶米麵有司執之世傑署案作歸附人縱遣之譯吏蔡松壽誣府主謀叛坐斬十八年起為弘州刺史母憂去職纍遷亳州防禦使卒世傑少貧然疏財尚氣每臨陳敵衆既敗必戒士卒毋縱殺掠平居非忠孝不言親賢樂善甚獲當世之譽云蕭懷忠本名好胡奚人也為西北路招討使蕭裕等謀立遼後使蕭招折往西北路結懷忠並結節度使耶律朗為助懷忠與朗有隙遂執招折並執朗遣使上變裕等既誅懷忠為樞密副使賜今名復為西北路招討使西京留守封王改南京留守契丹撒八反復以懷忠為西京留守西南面兵馬都統與樞密使僕散思恭北京留守蕭賾右衛將軍蕭禿剌護衛十人長斡盧保往討之蕭禿剌戰無功大軍追撒八不及而海陵意謂懷忠與蕭裕皆契丹人本同謀逾年乃執招折上變而撒八亦契丹部族恐其合以師恭與太后密語而禿剌無功懷忠賾師恭逸賊既殺師恭族滅其家使使即軍中殺賾懷忠皆族之斡盧保禿剌初為罪首但誅之而已大定三年追復賾懷忠禿剌斡盧保官爵頤弟安州刺史賾求襲賾之謀克上不許謀克而以賾家産付之移剌按答遼橫帳人也父留斡與耶律余睹俱來降西京下復叛留斡遇害按答以死事之子授左奉宸熙宗初充護衛除安州刺史纍官東京副留守參知政事完顏守道經略北方攝咸平路屯軍都統入為兵部侍郎徙西北西南兩路舊設堡戍迫近內地者于極邊安置仍與泰州臨潢邊堡相接除武定軍節度使以招徠邊部功遷東北路招討使改臨潢尹卒按答騎射絶倫善相馬嘗論及善射者世宗曰能如卿乎閲馬于市見良馬雖羸瘦輒與善價取之他日果良馬也孛术魯阿魯罕隆州琶離葛山人年八歲選習契丹字再選習女直字既壯為黃龍府路萬戶令史貞元二年試外路胥吏三百人補隨朝阿魯罕在第一補宗正府令史纍擢尚書省令史僕散忠義討窩斡辟置幕府掌邊關文字甚見信任窩斡既平阿魯罕招集散亡復業者數萬人復從忠義伐宋屢入奏事論列可否上謂宰相曰阿魯罕所言可行者即行之宋人請和忠義使阿魯罕往和議定阿魯罕入奏賜銀百兩重綵十端忠義薦阿魯罕有才幹可任尚書省都事詔以為大理司直未幾授尚書省都事除同知順天軍節度事紇石烈志寧北巡阿魯罕攝左右司郎中還朝除刑部員外郎再遷侍御史上問紇石烈良弼曰阿魯罕何如人也對曰有幹材持心忠正出言不阿順數日遷勸農副使兼同修國史侍御史如故改右司郎中奏請徙河南戍軍屯營城中者於十里外從之遷吏部侍郎除山東統軍都監徙置河南八猛安遷武勝軍節度使入為吏部尚書改西南路招討使有司督本路猛安人戶所貸官粟阿魯罕乞俟豐年從之軍人有以甲葉貿易諸物天德榷場及界外歲采銅礦或因私挾兵鐵與之市易皆一切禁絶之上番軍不許用親戚奴婢及傭雇者營塹損圮以時葺治不與所部猛安謀克會宴故兵民皆畏愛之上謂太尉守道曰阿魯罕及上京留守完顏烏里也皆起身胥吏阿魯罕為人厚其賢過之改陝西路統軍使兼京兆尹陝西軍籍有闕舊例用子弟補充而材多不堪用阿魯罕於阿里喜旗鼓手內選補軍人以春牧馬經夏不收飼瘠弱多死阿魯罕命以時收秣之故死損者少仍春秋督閲軍士騎射以嚴武備終南采漆者節其期限檢其出入以防姦細上謂宰相曰阿魯罕所至稱治陝西政迹尤著用之雖遲亦可得數年力也召為參知政事命條上天德陝西行事上稱善以疾乞致仕除北京留守卒贊曰記曰君子聽磬聲則思死封疆之臣傳曰疆埸之事慎守其一而備其不虞故守戍邊圉之臣不可以不論焉趙興祥平州盧龍人六世祖思溫遼燕京留守封天水郡王父瑾遼靜江軍節度使興祥以父任閣門祗候謁告省親于白霫會遼季土賊據郡作亂興祥攜母及弟妹奔燕京不能進乃自柳城涉砂磧夜視星斗而行僅達遼軍而不知遼主所向遂還柳城及婁室獲遼主興祥乃歸國從宗望伐宋為六宅使天眷初纍官同知宣徽院事母憂去官熙宗素聞興祥孝行及英悼太子受册以本官起復護視太子轉右宣徽使天德初改左宣徽使海陵嘗問興祥欲使子弟為官當自言興祥辭謝海陵善之賜以玉帶詔曰汝官雖未至一品可佩此侍立為濟南尹賜車馬金幣金銀器皿改絳陽軍節度使召為太子少保封廣平郡王改封巨鹿正隆初例奪王爵遷太子少傅封申國公起為定武軍節度使海陵伐宋興祥二子從軍世宗即位海陵尚在淮南二子未得還興祥來見於平州世宗嘉其誠款以為祕書監復為左宣徽使上曰尚食庖人猥多徒費廩祿朕在藩邸時家務皆委執事者自即位以來事皆留心俸祿出於百姓不可妄費庖人可約量損減近臣獻琵琶世宗却之謂興祥曰朕憂勞天下未嘗以聲伎為心自今勿復有獻宜悉諭朕意有司奏南北邊事未息恐財用未給乞罷修神龍殿涼位工役上即日使興祥傳詔罷之久之以其孫珣為閣門祗候十五年上幸安州春水召興祥赴萬春節上謁于良鄉賜銀五百兩感風眩賜醫藥未幾卒官石抹榮字昌祖七世祖仕遼封順國王遼主奔天德榮父惕益挺身赴之是時榮方六歲母忽土特滿攜之流離道路宗室谷神得之納為次室榮就養於谷神家惕益既見遼主委以軍事軍敗被執將殺之金源郡王銀术可曰彼忠於所事殺之何以勸後遂釋之後從伐宋卒於軍中榮年長事秦王宗翰居幕府天眷二年充護衛熙宗宴飲命胙王元與榮角力榮勝之連仆力士六七人熙宗親飲之酒賜以金幣遷宿直將軍天德初除開遠軍節度使入謝不覺泣下海陵問其故對曰老母在谷神家違去膝下是以感泣乃詔其母與之俱行仍賜錢萬貫改天德尹徙泰寧軍再除延安東平尹海陵南征為神果軍都總管留駐泗州以遏逋卒大定初還鎮東平與戶部尚書梁銶按治山東盜賊二年以本官充山東東西大名等路都統有疾改太原尹徙益都尹丁母憂起復召為簽書樞密院事北京東京留守陝西路統軍使南京西京留守榮與河南尹婁室陝州防禦使石抹靳家奴皆坐高賈賣私物抑賈買民物得罪靳家奴前為單州刺史廉察官行郡乃劫制民使作虛譽用是得遷同知太原尹復多取民利及為陝州尚書省奏其事法當解職削階上以靳家奴鼓虛聲以誑朝廷不可恕特詔除名榮與婁室削兩階解職久之榮除臨潢尹改臨洮尹卒年六十三敬嗣暉字唐臣易州人登天眷二年進士第調懷安丞遷弘政令補尚書省令史有才辨海陵為宰相愛之及篡立擢起居注歷諫議大夫吏部侍郎左宣徽使貞元三年八月尚食烹飪失宜庖官各杖二百嗣暉與同知宣徽院事烏居仁各杖有差久之拜參知政事正隆六年伐宋留張浩及嗣暉于南京治尚書省事世宗即位惡嗣暉巧佞御史大夫完顏元宜劾奏蕭玉嗣暉許霖等六人不可用嗣暉降通議大夫放歸田里嗣暉練習朝儀進止應對間雅由是起為丹州刺史戒諭之曰卿為正隆執政阿順取容朕甚鄙之今當竭力奉職以洗前日之咎苟或不悛必罰無赦未幾丁母憂起復為左宣徽使世宗頗好道術謂嗣暉曰尚食官毋於禁中殺羊豕朔望上七日有司毋奏刑名大定七年蒲察通除肇州防禦使上責其飾詐因顧嗣暉曰如卿不可謂無才但純實不足耳久之有榜匿名書于通衢者稱海陵舊臣不得用者有怨望心將圖不軌上曰豈有是哉謂嗣暉曰正隆時卿為執政今指卿以為怨望朕極知其不然卿性明達能辨但頗自衒釣衆人之譽所以致此媒糵後當改之十年將有事南郊廷議嗣暉在海陵時凡宗廟禘祫輒行太常事復拜參知政事詔以執政冠服攝太常禮成薨贊曰趙興祥石抹榮自拔流離艱厄中而克有所樹立固其識之過人亦其所遭際致然也迹世宗之却聲伎減庖人仁愛若是而其下孰不興起哉
