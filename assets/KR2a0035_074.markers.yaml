  - {type: variant, offset: 8247, length: 0, content: '', krp: 京本名呼嚕以宗室子累遷特進天德二年除翰林學士承㫖無修國史加開府儀同三司遷工部尚書改禮部兵部判大宗正亊封曹王除河間尹正隆二年例封瀋國公北京留守以䘮去官起復益都尹六年坐違制立春日與圖克坦貞飲酒降灤州刺史俄改綘陽軍節度使海陵遣䕶衛呼嚕往綘州殺之京由間道走入汾州境得免世宗即位來見于桃花塢復判大宗正事封壽王二年正月戊辰朔日食伐鼓用幣上不視朝減膳撤樂詔京代拜行禮世宗懲創海陵疎忌宗室加禮京兄弟情若同生謂京等曰朕每見天象變異輙思政事之闕寤寐自貴不遑凡事必審思而後行猶懼獨見未能盡善每令羣臣集議庶幾無過舉也是時伐宋未罷兵用度不足百官未給全俸京家人數百口財用少上聞之賜金一百五十兩重綵百端絹五百匹改西京留守賜佩刀廐馬京到西京京妻嘗召日者孫邦榮推京禄命邦榮言留守官至太師爵封王京問此上更無否邦榮曰止於此京曰若止於此所官何為而邦榮察其意乃詐為圖䜟作詩中有呼嚕為之語以獻於京京曰後誠如此乎遂受其詩再使卜之邦榮稱所得卦有獨權之兆京復使邦榮推世宗當生年月家人孫小哥妄作謡言狂惑京如邦榮指京信之京妻公尋具知其事大定五年三月孫邦榮上變詔刑部侍郎高德基户部員外郎完顔烏肯徹往鞫之京等皆欵伏獄成還奏上曰海陵無道使光英在朕亦保全之况京等哉於是京夫婦特免死杖一百除名嵐州樓煩縣安置以奴婢百口自隨官給上田遣烏肯微劉珫宣諭京詔曰朕與汝皆太祖之孫海陵失道翦滅宗支朕念兄弟無幾於汝尤為親愛汝亦自知之何為而懷此心朕念骨肉不忍盡法汝若尚不思過朕雖不加誅天地豈能容汝也十年四月詔于樓煩縣為京作第一區月給節度廪俸十二年兄德州防禦使文謀反上問皇太子趙王永中及宰臣曰京謀不軌朕特免死今復當縁生如何宰臣或言京圖逆今不除之恐為後患上曰天下大器歸於有德海陵失道朕乃得之但務修德餘何足慮太子曰誠如聖訓乃遣使宣諭京詔曰卿兄文舊封國公不任職事朕進封王爵委以大藩頃在大名以贓得罪止削左遷不知恩幸乃蓄怨心謀不軌罪及兄弟朕念宋王皆免縁坐文之家産應沒入者盡與卿兄子耀珠卿宜悉此意二十年十一月上問宰臣曰京之罪始於其妻妾卜休咎太祖諸孫存者無幾朕欲召置左右不使任職但廪給之卿等以為何如皆曰置之近宻臣等以為非宜上曰朕若修德何必豫懷疑忌久之上復欲召京宰臣曰京不赦之罪也赦之已為至幸矣豈可復上黙良乆乃止}
