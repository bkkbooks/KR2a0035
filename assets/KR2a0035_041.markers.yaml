  - {type: variant, offset: 9492, length: 0, content: '', WYG: 金史卷四十一金史卷四十一考證儀衛志上苣紋旗案苣紋宋史儀衛志作苣文宣和間又改為祥光刀盾三十六銀褐抹額寳相花衫案寳相花衫原本作寳花衫考金之儀衛一視宋制志志麾仗所服諸繡文皆各有取義如千牛以犀六軍以孔雀樂工以鸞之類其無可取者義皆服寳相花志中所載不一而足此處獨作寳花相顯有脱簡謹増哥舒二十四案哥舒原本作柯舒考柯舒黑漆棒也制同車輻以金銅釘飾載宋史儀衛志此作柯誤也謹改槍二十五人案槍原本作鎗考鎗乃酒器原本誤也謹改金史卷四十一考證}
