  - {type: variant, offset: 799, length: 440, content: 同執事官再拜訖退十五年二月有司言東京開覺寺藏睿宗皇帝皁衣展裹真容勅遷本京祖廟奉祀仍易袍色明年四月詔依奉安睿宗禮奉安世祖御容於衍慶宮前期有司備香案酒果教坊樂至日質明親王宰執率百官公服迎引至衍慶宮凡用甲騎百人傘二人扇十二人香輿八人綵輿十六人從者二十四人執事官二人弩手控鶴各五十人贊者二人禮直官二人六品以下官三十員公服乘馬前導奉安訖百官再拜禮畢退立宮門之外迎駕朝謁十六年正月有司奏奉勅議世祖皇帝御容當於何處安置臣等參詳衍慶宮即漢之原廟每遇太祖皇帝忌辰百官朝拜今世祖皇帝擇地修建殿位庶可副嚴奉之意從之乃勅於聖武殿東西興建世祖太宗睿宗殿位既而復欲擇地建太宗殿于歸仁館有司言山陵太祖太宗睿宗共一兆域太廟世祖太祖太宗睿宗亦同堂異室今於歸仁館興建太宗殿位似與山陵太廟之制不同詔從前議止於衍慶宮各建殿七間閤五間三門五間乃定世祖殿曰廣德閤曰燕昌太宗殿曰丕承閤曰光昭睿宗殿曰天興閤曰景福十九年五月六日奏告七日奉安執事禮官二人每位香案一祭器席一拜褥二盥洗一大勺篚巾全前一日太廟令率其屬掃除宮內外又各設神座, WYG: 闕}
