  - {type: variant, offset: 1201, length: 675, content: 氣月中節初候次候末候始卦中卦終卦四正卦冬至十一月中蚯蚓結麋角解水泉動公中孚辟復侯屯內坎初六小寒十二月節雁北鄉鵲始巢野雞始雊侯屯外大夫謙卿睽坎九二大寒十二月中雞始乳鷙鳥厲疾水澤腹堅公升辟臨侯小過內坎六三立春正月節東風解凍蟄蟲始振魚上冰侯小過外大夫蒙卿益坎六四雨水正月中獺祭魚鴻雁來草木萌動公漸辟泰侯需內坎九五驚蟄二月節桃始華倉庚鳴鷹化為鳩侯需外大夫隨卿晉坎上六春分二月中玄鳥至雷乃發聲始電公解辟大壯侯豫內震初九清明三月節桐始華田鼠化為虹始見侯豫外大夫訟卿蠱震六二鴽穀雨三月中萍始生鳴鳩拂其戴勝降于公革辟夬侯旅內震六三羽桑立夏四月節螻蟈鳴蚯蚓出王瓜生侯旅外大夫師卿比震九四小滿四月中苦菜秀靡草死小暑至公小畜辟乾侯大有內震六五芒種五月節螳螂生鵙始鳴反舌無聲侯大有外大夫家人卿井震上六夏至五月中鹿角解蜩始鳴半夏生公咸辟姤侯鼎內離初九小暑六月節溫風至蟋蟀居壁鷹乃學習侯鼎外大夫豐卿渙離六二大暑六月中腐草化為土潤溽暑大雨時行公履辟遁侯內離九三螢立秋七月節涼風至白露降寒蟬鳴侯外大夫節卿同人離九四處暑七月中鷹乃祭鳥天地始肅禾乃登公損辟否侯巽內離六五白露八月節鴻雁來玄鳥歸羣鳥養羞侯巽外大夫萃卿大畜離上九秋分八月中雷乃收聲蟄蟲坯戶水始涸公賁辟觀侯歸妹內兌初九寒露九月節鴻雁來賓雀入大水鞠有黃華侯歸妹外大夫無妄卿明夷兌九二化為蛤霜降九月中豺乃祭獸草木黃落蟄蟲咸俯公困辟剝侯艮內兌六三立冬十月節水始氷地始凍野雞入水侯艮外大夫既濟卿噬嗑兌九四化為蜃小雪十月中虹藏不見天氣上升閉塞而成公大過辟坤侯未濟內兌九五地氣下降冬大雪十一月節鶡鳥不鳴虎始交荔挺出侯未濟外大夫蹇卿頤兌上六, WYG: ''}
