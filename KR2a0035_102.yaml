body:
  text: 金史卷一百二列傳第四十僕散安貞田琢完顏弼蒙古綱必蘭阿魯帶僕散安貞本名阿海以大臣子充奉御父揆尚韓國公主鄭王永蹈同母妹也永蹈誅安貞罷歸召為符寶祗候復為奉御尚邢國長公主加駙馬都尉襲胡土愛割蠻猛安歷尚衣直長御院通進尚藥副使丁母憂起復轉符寶郎除同知定海軍節度使事歷邳淄涿州刺史拱衛直都指揮使貞祐初改右副點檢兼侍衛親軍副都指揮使遷元帥左都監二年中都解嚴河北州郡未破者惟真定大名東平清沃徐邳海州而已朝廷遣安貞與兵部尚書裴滿子仁刑部尚書武都分道宣撫於是除安貞山東路統軍安撫等使初益都縣人楊安國自少無賴以鬻鞍材為業市人呼為楊鞍兒遂自名楊安兒泰和伐宋山東無賴往往相聚剽掠詔州郡招捕之安兒降隸諸軍纍官刺史防禦使大安三年招鐵瓦敢戰軍得千餘人以唐括合打為都統安兒為副統戍邊至雞鳴山不進衛紹王驛召問狀安兒乃曰平章參政軍數十萬在前無可慮者屯駐雞鳴山所以備間道透漏者耳朝廷信其言安兒乃亡歸山東與張汝楫聚黨攻劫州縣殺略官吏山東大擾安貞至益都敗安兒于城東安兒奔萊陽萊州徐汝賢以城降安兒賊勢復振登州刺史耿格開門納偽鄒都統以州印付之郊迎安兒發帑藏以勞賊安兒遂僭號置官屬改元天順凡符印詔表儀式皆格草定遂陷寧海攻濰州偽元帥方郭三據密州略沂海李全略臨朐扼穆陵關欲取益都安貞以沂州防禦使僕散留家為左翼安化軍節度使完顏訛論為右翼七月庚辰安貞軍昌邑東徐汝賢等以三州之衆十萬來拒戰自午抵暮轉戰三十里殺賊數萬獲器械不可勝計壬午賊棘七率衆四萬陳于辛河安貞令留家由上流膠西濟繼以大兵殺獲甚衆甲申安貞軍至萊州偽寧海州刺史史潑立以二十萬陳于城東留家先以輕兵薄賊諸將繼之賊大敗殺獲且半以重賞招之不應安貞遣萊州黥卒曹全張德田貴宋福詐降于徐汝賢以為內應全與賊西南隅戍卒姚雲相結約納官軍丁亥夜全縋城出潛告留家留家募勇敢士三十人從全入城姚雲納之大軍畢登遂復萊州斬徐汝賢及諸賊將以徇安兒脫身走訛論以兵追之耿格史潑立皆降留家略定膠西諸縣宣差伯德玩襲殺方郭三復密州餘賊在諸州者皆潰去安兒嘗遣梁居實黃縣甘泉鎮監酒石抹充浮海赴遼東構留哥已具舟皆捕斬之十一月戊辰曲赦山東除楊安兒耿格及諸故官家作過驅奴不赦外劉二祖張汝楫李思溫及應脅誘從賊並在本路自為寇盜罪無輕重並與赦免獲楊安兒者官職俱授三品賞錢十萬貫十二月辛亥耿格伏誅妻子皆遠徙諸軍方攻大沫堌赦至宣撫副使知東平府事烏林答與即引軍還賊衆乘之復出為患詔以陝西統軍使完顏弼知東平府事權宣撫副使其後楊安兒與汲政等乘舟入海欲走岠嵎山舟人曲成等擊之墜水死三年二月安貞遣提控紇石烈牙吾塔破巨蒙等四堌及破馬耳山殺劉二祖賊四千餘人降餘黨八千擒偽宣差程寬招軍大使程福招降脅從百姓三萬餘人安貞遣兵會宿州提控夾谷石里哥同攻大沫堌賊千餘逆戰石里哥以騎兵擊之盡殪提控沒烈奪其北門以入別軍取賊水寨諸軍繼進殺賊五千餘人劉二祖被創獲之及偽參謀官崔天祐楊安兒偽太師李思溫餘衆保大小峻角子山前後追擊殺獲以萬計斬劉二祖詔遷賞沒烈等有差詔尚書省曰山東東西路賊黨猶嘯聚作過者詔書到日並與免罪各令復業在處官司盡心招撫優加存恤無令失所十月安貞遷樞密副使行院于徐州四年二月楊安兒餘黨復擾山東詔安貞與蒙古綱完顏弼以近詔招之五月安貞遣兵討郝定連戰皆克殺九萬人降者三萬餘郝定僅以身免獲偽金銀牌器械甚衆來歸且萬人皆安慰復業自楊安兒劉二祖敗後河北殘破干戈相尋其黨往往復相團結所在寇掠皆衣紅納襖以相識別號紅襖賊官軍雖討之不能除也大概皆李全國用安時青之徒焉興定元年十月詔安貞曰防河卒多老幼疲軟不勝執役之人其令速易之二年十二月開封治中呂子羽等以國書議和于宋宋人不受以安貞為左副元帥權參知政事行尚書省元帥府及唐息壽泗行元帥府分道各將兵三萬安貞總之畫定期日下詔伐宋安貞至安豐宋兵七千拒戰權都事完顏胡魯剌衝擊敗之追至淝水死者二千餘人安貞至大江乃班師三年閏月安貞至自軍中入見于仁安殿胡魯剌進一階久之安貞燕見奏曰淝水之捷胡魯剌功第一臣之兵事皆咨此人功厚賞薄乞加賞以勸來者尚書省奏凡行省行院帥府參議左右司經歷官都事以下皆遷一官所以絶求請之路塞姦幸之門也安貞之請不可從遂止五年復伐宋二月安貞出息州軍于七里鎮宋兵據淨居山遣兵擊敗之宋兵保山寺縱火焚寺乘勝追至洪門山宋兵方浚濠立柵安貞軍亟戰奪其柵宋黃統制團兵五千保黃土關關絶險素有備堅壁不出安貞遣輕兵分為左右軍潛登別以兵三千直逼關門翼日左右軍會于山顛俯瞰關內宋人守關者望之駭不能立中軍急攻宋兵潰遂奪黃土關遂入梅林關拔麻城縣抵大江至黃州克之進克蘄州前後殺略不可勝計獲宋宗室男女七十餘口獻之師還安貞每獲宋壯士輒釋不殺無慮數萬因用其策輒有功宣宗謂宰臣曰阿海將略固善矣此輩得無思歸乎南京密邇宋境此輩既不可盡殺安所置之朕欲驅之境上遣之歸如何宰臣不對六月甲寅朔尚書省奏安貞謀叛宣宗謂平章政事英王守純曰朕觀此奏皆飾詞不實其令覆案之戊寅並其二子殺之以祖忠義父揆有大功免兄弟緣坐詔曰銀青榮祿大夫左副元帥兼樞密副使駙馬都尉僕散阿海早藉世姻寖馳仕軌屬當軍旅之事益厚朝廷之恩爰自帥藩擢居樞府頃者南伐時乃奏言是俾行鱗介之誅而盡露梟獍之狀二城雖得多罪稔彰念勝負之靡常肯刑章之輕用如自畫因糧之計乃更嚴橫斂之期督促計司雕弊民力信其私意或失防秋顧利害之實深尚優容而弗問頃因近侍悉露姦謀蓋虞前後罪之上聞乃以金玉帶而夜獻審事情之詭祕命信臣而鞫推逮致款詞乃詳實狀自以積愆之著必非公憲所容欲結近臣之歡心俾伺內庭之指意如釁端之少露得先事而易圖因其方握兵權得以謀危廟祏事或不濟計即外奔前日之俘隨時誅戮獨於宋族曲活全門示其悖德于敵讎豫冀全身而納用初安貞破蘄州獲宋宗室不殺而獻之遂以為罪安貞憂讒以賄近侍局乃以質成其誣安貞典兵征伐嘗曰三世為將道家所忌自忠義揆至安貞凡三世大將焉初安貞破蘄州所得金帛分給將士南京都轉運使行六部事李特立金安軍節度副使紇石烈蒲剌都大名路總管判官銀术可因而欺隱事覺特立當死蒲剌都銀术可當杖一百除名詔薄其罪特立奪三官降三等蒲剌都銀术可奪兩官降二等云田琢字器之蔚州定安人中明昌五年進士調寧邊茌平主簿潞州觀察判官中都商稅副使丁父憂起復懷安令補尚書省令史貞祐二年中都被圍琢請由間道往山西招集義勇以為宣差兵馬提控同知忠順軍節度使事經略山西琢與弘州刺史魏用有隙琢自飛狐還蔚州用伏甲於路將邀而殺之琢知其謀自別道入定安用入蔚州殺觀察判官李宜録事判官馬士成永興縣令張福劫府庫倉釰以兵攻琢於定安琢與戰敗之用脫身走易州刺史蒲察縛送中都元帥府殺之是時勸農副使侯摯提控紫荊等關隘朝廷聞蔚州亂欲以摯就代琢守蔚州令軍中推可為管押者即以魏用金牌佩之以安其衆丞相承暉奏田琢實得軍民心諳練山西利害魏用將士本無勞效以用弄兵死禍遽爾任用恐開幸門詔從之琢至蔚州誅與用同惡數人募兵旬日得二萬人十月琢兵敗僅以身免招集散亡得三萬餘入中山界屯駐而遣沈思忠招集西京蕩析百姓得萬餘人皆願徙河南琢上書此輩與河南鎮防往往鄉舊若令南渡擇壯健為兵自然和協且可以招集其餘也從之加沈思忠同知深州軍州事琢復遣沈思忠宮楫招弘州蔚州百姓得五萬餘人可充軍者萬五千人分屯蔚州諸隘皆願得沈思忠為將詔加思忠順天軍節度副使提控弘蔚州軍馬宮楫副之頃之西山諸隘皆不能守琢移軍沃州沃州刺史完顏僧家奴奏田琢軍二千五百人官釰不足發民窖粟猶不能贍其中多女直人均為一軍不可復有厚薄可令於衛輝大名就食制可加琢河北西路宣撫副使遙授濬州防禦使屯濬州琢欲陂西山諸水以衛濬州貞祐三年十一月河北行省侯摯入見奏河北兵食少請令琢汰遣老弱就食歸德琢奏此輩嶺外失業父子兄弟合為一軍若離而分之定生他變乞以全軍南渡或徙衛州防河詔盡徙屯陝琢復奏臣幸徙安地然濬乃河北要郡今見糧可支數月乞俟來春乃行數日琢復奏濬不可守惟當遷之宰臣劾琢前後奏陳不一請逮鞫問宣宗不許琢至陝上書曰河北失業之民僑居河南陝西蓋不可以數計百司用度三軍調發一人耕之百人食之其能贍乎春種不廣收成失望軍民俱困實繫安危臣聞古之名將雖在征行必須屯田趙充國諸葛亮是也古之良吏必課農桑以足民黃霸虞詡是也方今曠土多遊民衆乞明敕有司無蹈虛文嚴升降之法選能吏勸課公私皆得耕墾富者備牛出種貧者傭力服勤若又不足則教之區種期于盡闢而後已官司圉牧勢家兼並亦籍其數而授之農民寬其負算省其徭役使盡力南畝則蓄積歲增家給人足富國強兵之道也宣宗深然之陝西元帥府請益兵詔以琢衆與之興定元年朝廷易置諸將遷山東西路轉運使二年改山東東路轉運使權知益都府事行六部尚書宣差便宜招撫使李旺據膠西琢遣益都治中張林討之生擒李旺八月萊州經略使术虎山壽襲破李旺黨偽鄒元帥于小堌獲其前鋒于水等三十人追擊偽陳萬戶斬首八百級明日復破之于朱寒寨膠西高密官軍亦屢破之于諸村及海島間是月棣州裨將張聚殺防禦使斜卯重興遂據棣州襲濱州其衆數千人琢遣提控紇石烈醜漢會兵討之聚棄濱專保棣州諸軍趣棣聚出戰敗之斬首百級生擒偽都統王仙等十三人餘衆奔潰追及于別寨攻拔之聚僅以身免遂復二州李全據安丘琢遣總領提控王政王庭玉討之宣差提控太府少監伯德玩率政兵攻安丘敗焉提控王顯死之琢奏伯德玩本相視山東山堌水寨未嘗遍行獨留密州輒為此舉乞治其罪詔遣官鞫玩會赦而止既而昌樂縣令术虎桓都臨朐縣令兀顏吾丁福山縣令烏林答石家奴壽光縣巡檢紇石烈醜漢破李全于日照縣琢承制各遷官一階進職一等詔許之三年沂州注子堌王公喜構宋兵據沂州防禦使徒單福定徒跣脫走百姓潰散琢奏去歲顧王二嘗據沂州邳州總領提控納合六哥前為同知沂州防禦事招集餘衆攻取之百姓歸心可用六哥取州今方在行省侯摯麾下乞發還取便道進討制可既而莒州提控燕寧復沂州王公喜復保注子堌琢奏沂州須知兵者守之徒單福定已衰老納合六哥善治兵識沂形勢詔福定專治州事以六哥為沂州總領琢奏濰州刺史致仕獨吉世顯能招集猛安餘衆及義軍却李全保濰州六哥破灰山堌沂境以安守兗州觀察判官梁昱嘗攝淄州刺史率軍民力田徵科有度饋餉不乏保全淄州土賊不敢發前猗氏主簿張亞夫嘗權行部官主餉密州委曲購得糧二萬斛兵儲乃足行至高密徵他州兵拒李全詔世顯升職從四品遙授同知海州事六哥遷一官升一等充沂州宣差都提控梁昱遷一官同知淄州事張亞夫遷兩官密州觀察判官初張林本益都府卒有復立府事之功遂為治中而凶險不逞恥出琢下琢在山東徵求過當頗失衆心林欲因衆以去琢未有間也會于海牟佐據萊州琢遣林分兵討之林既得兵伺琢出即率衆譟入府中琢倉猝入營領兵與林戰不勝欲就外縣兵且戰且行至章丘兵變求救於鄰道不時至東平行省蒙古綱以狀聞宣宗度不能制林而欲馴致之乃遣人召琢還行至壽張疽發背卒完顏弼本名達吉不蓋州猛安人充護衛轉十人長從丞相襄戍邊功最除同知德州防禦使事武衛軍鈐轄轉宿直將軍深州刺史泰和六年從左副元帥完顏匡攻襄陽破雷太尉兵積功加平南蕩江將軍丁母憂起復八年除南京副留守壽州防禦使大安二年入為武衛軍副都指揮使三年以本官領兵駐宣德會河之敗弼被創馬中流矢押軍千戶夾谷王家奴以馬授弼遂得免遷右副都點檢至寧元年東京不守弼為元帥左監軍扞禦遼東請自募二萬人為一軍萬一京師有急亦可以回戈自救今驅市人以應大敵往則敗矣衛紹王怒曰我以東北路為憂卿言京師有急何邪就如卿言我自有策以卿皇后連姻故相委寄乃不體朕意也弼曰陛下勿謂皇后親姻俱可恃也時提點近侍局駙馬都尉徒單沒烈侍側弼意竊譏之衛紹王怒甚顧謂沒烈曰何不叱去沒烈乃引起付有司論以奏對無人臣禮詔免死杖一百責為雲內州防禦使貞祐初宣宗驛召弼赴中都是時雲內已受兵弼善馬矟與數騎突出由太原出澤潞將從清滄赴闕會有詔除定武軍節度使尋為元帥左都監駐真定弼奏賞罰所以勸善懲惡有功必賞有罪必罰而后人可使兵可強今外兵日增軍無鬬志亦有逃歸而以戰潰自陳者有司從而存恤之見聞習熟相效成風又曰村寨城邑兵退之後有心力勇敢可使者乞招用之又曰河朔郡縣皆以拘文不相應救由此殘破乞敕州府凡有告急徵兵即須赴救違者坐之又曰河北軍器乞權宜弛禁仍令團結堡寨以備外兵又曰今雖議和萬一輕騎復來則吾民重困矣願速講防禦之策及勸遷都南京阻長淮拒大河潼關以自固宣宗將遷汴弼兼河北西路兵馬都總管宣宗次真定弼言皇太子不可留中都蓋軍少則難守軍多則難養又奏將帥以閫外為威今生殺之權皆從中覆又奏瑞州軍頗狡左丞盡忠多疑乞付他將宣宗頗采用其言大名軍變殺蒲察阿里詔弼鎮撫之未幾改陝西路統軍使京兆兵馬都總管宣撫副使烏古論兗州置秦州榷場弼以擅置移文問之兗州曰近日入見許山外從宜行事秦州自宋兵焚蕩榷場幾一年矣今既安帖復宜開設彼此獲利歲收以十萬計對境天水軍移文來請如俟報可實慮後時弼奏其事宰臣以兗州雖擅舉而無違失苟利於民專之亦可宣宗曰朕固嘗許其從宜也三年改知東平府事山東西路宣撫副使是時劉二祖餘黨孫邦佐張汝楫保濟南勤子堌弼遣人招之得邦佐書云我輩自軍興屢立戰功主將見忌陰圖陷害竄伏山林以至今日實畏死耳如蒙湔洗便當釋險面縛餘賊未降者保盡招之弼奏方今多故此賊果定亦一事畢也乞明以官賞示之詔曰孫邦佐果受招各遷五官職於是邦佐汝楫皆降邦佐遙授濰州刺史汝楫遙授淄州刺史皆加明威將軍頃之弼薦邦佐汝楫改過用命招降甚衆稍收其兵仗放歸田里詔邦佐遙授同知益都府事汝楫遙授同知東平府事皆加懷遠大將軍梁聚寬遙授泰定軍節度副使加宣武將軍四年弼遷宣撫使已而汝楫復謀作亂邦佐密告弼弼饗汝楫伏甲廡下酒數行鍾鳴伏發殺汝楫並其黨與手詔褒諭封密國公其後邦佐屢立功元光末纍官知東平府事山東西路兵馬都總管充宣差招撫使弼上書曰山東河北河東數鎮僅能自守恐長河之險有不足恃者河南嘗招戰士率皆遊惰市人不間訓練若選簽驅丁監戶數千別為一軍立功者全戶為良必將爭先效命以取勝矣武衛軍家屬嘗苦于兵人人懷憤若擇驍悍千餘加以爵賞亦可得其死力又曰老病之官例許致仕居河北者嫌于避難居河南者苟于尸祿職事曠廢乞遍諭核實其精力可用者仍舊年高昏聵不事事者罷之又曰賦役頻煩河南百姓新強舊乏諸路豪民行販市易侵土人之利未有定籍一無庸調乞權宜均定如知而輒避事過復來者許諸人捕告以軍興法治之詔下尚書省議惟老病官從所言餘皆不允大元兵圍東平弼百計應戰久之乃解圍去宣宗賜詔奬諭將士賞賚有差是歲五月疽發于腦詔太醫診視賜御藥俄卒弼平生無所好惟喜讀書間暇延引儒士歌詠投壺以為常所辟如承裔陀滿胡土門紇石烈牙吾塔皆立方面功治東平愛民省費井邑之間軍民無相訟有古良將之風焉蒙古綱本名胡里綱咸平府猛安人承安五年進士纍調補尚書省令史除國子助教貞祐初自請招集西山兵民進官一階賜錢二百萬遷都水監丞尋加遙授永定軍節度副使招捕有功遷太子左諭德除順州刺史遷同知大興府事三年知河間府事權河北東路宣撫使屯冀州軍食不足徙濟南綱欲徙河南行至徐州未渡河尚書省奏東平宣撫使完顏弼行事多不盡乃以綱權山東宣撫副使改山東路統軍使兼知益都府事權元帥右都監宣撫如故四年十月行元帥府事綱奏山東兵後楊安兒黨內有故淄王習顯故留守术羅等家奴不在赦原據險作亂至今未息民多歸之乞普賜恩宥宣宗即命赦之仍贖為良興定元年徙知東平府事遷元帥右監軍久之拜右副元帥權參知政事行尚書省先是東平治中沒烈坐事削降殿年詔仍從軍有功復用綱遣沒烈討花帽賊于曹濟間捷報沒烈乃復前職興定二年詔曰卿以忠貞為國捍難保完城邑朕甚嘉之可進官二階賜金帶一重幣十端興定三年奏曰濟南介山東兩路之間最為衝要被兵日久雖與東平鄰接不用相屬緩急不相應乞權隸本路且差近於益都詔從之綱奏恩州武城縣艾家凹水濼清河縣澗口河濼其深一丈廣數十里險固可恃因其地形少加浚治足以保禦請遷州民其中多募義軍以實之綱以山東恃東平為重鎮兵卒少守城且不足況欲分部出戰是安坐以待困也乃上奏曰伏見貞祐三年古里甲石倫招義軍設置長校各立等差都統授正七品職副統正八品萬戶正九品千戶正班任使謀克雜班仍三十人為一謀克五謀克為一千戶四千戶為一萬戶四萬戶為一副統兩副統為一都統設一總領提控今乞依此格募選以益兵威制可是歲益都桃林寨總領張林號張大刀據險為亂自稱安化軍節度使綱奏林勢甚張乞遣河南馬軍千人單州經略司以衆接應左司郎中李蹊請令綱約燕寧同力殄滅單州經略使完顏仲元分兵三千人同往宰相以糧運不給益都以東嘯聚不止一張林宜令綱設備禦俟來春議之四年張林侵掠東平綱遣元帥右監軍行樞密院事王庭玉討之至舊縣遇張林衆萬餘人據嶺為陳庭玉督兵踰嶺搏戰林衆少却且欲東走庭玉踵擊大破之殺數千人生擒張林獲雜畜兵仗萬計招降虎窟諸寨悉令歸業詔賜空名宣敕聽綱第功遷賞遣樞密院令史劉顒涖殺張林于東平張林乞貰死自效請曰臣兄演在宋為統制有衆三千駐即墨萊陽之境請以書招之使轉致諸賊之款密者相為表𩹉然後以檄招益都張林不從則合擊之山東不足平也所謂益都張林即據府事逐田琢者也事見琢傳綱以林策請于朝樞密院請羈縻使之制可以為萊州兵馬鈐轄久之山東不能守林乃降于宋云初東平提控鄭倜生擒宋將李資綱奏賞倜宰臣謂李資自稱宋將無所憑據請詳究其實綱奏臣自按問俱獲宋將統制十餘人皆以資為將無異辭此輩力屈就擒豈肯虛稱偽將以重獲者之功今多故之際賞功後時將士且解體凡行賞必求形迹過為逗遛甚未可也詔即賞之綱奏遼東渡海必由恩博二州之間乞置經略司鎮撫從之興定五年二月東平解圍宣宗曲赦境內凡東平府試諸科中選人嘗被任使已逾省試期日特免省試惟經童律科即為及第似涉太優別日試之皆從綱所請也詔以綱王庭玉東莒公燕寧保全東平各遷一階是歲燕寧戰死綱奏寧所居天勝寨乃益都險要之地寧嘗招降羣盜胡七胡八用為牙校委以腹心羣盜皆有歸志及寧死復懷顧望胡七胡八亦反側不安臣以提控孫邦佐世居泰安衆心所屬遂署招撫使以提控黃摑兀也充總領副之此當先奏可顧事勢危迫故輒授之燕寧死而綱勢孤矣綱奏請移軍於河南詔百官議御史大夫紇石烈胡失門以下皆曰金城湯池非粟不守東平孤城四無應援萬一失之則官吏兵民俱盡宜徙之河南以助防秋翰林待制抹撚阿虎德奏曰車駕南遷恃大河以為險大河以東平為藩籬今乃棄之則大河不足恃矣兵以將為主將以心為主蒙古綱既欲棄之決不可使之守矣宜就選將士之願守者擢用之別遣官為行省付以兵馬鎧仗從宜規畫軍食樞密院請用胡失門議焚其樓櫓廨舍而徙之宣宗曰此事朕不能決擇衆議可者行之樞密院頗采阿虎德議許綱內徙率所部女直契丹漢軍五千人行省邳州元帥左監軍王庭玉將餘軍屯黃陵岡行元帥府事於是綱改兼靜難軍節度使行省邳州自此山東事勢去矣是歲六月以歸德邳宿徐泗乏軍食詔綱率所部就食睢州綱奏宿州連年飢饉加之重斂百姓離散鎮防軍遽徵逋課窘迫陵辱有甚于官衆不勝其酷皆懷報復之心近日高羊哥等苦其佃戶佃戶憤怒執羊哥等投之井中武夫不識緩急乃至于此乞一切所負並令停止俟夏秋收成徵還軍人量增釰給可也詔議行之元光二年三月以邳州經略司隸綱令募勇敢收復山東初碭山首領數人以減罷懷忿怨誘脅餘衆作亂引水環城以自固構浮橋於河上結紅襖賊為援同簽樞密院事徒單牙剌哥會諸道兵討之綱云碭山北近大河南近汴堤東西二百里大河分派其間乾灘泥淖步騎俱不可行惟宜輕舟往來可選鋭卒數千與水軍掃兵以舟二百艘由便道斷浮梁絶紅襖之援募膽勇有口辨者持牒密諭之以離間其黨與臣已遣三人入賊中復分兵屯要害別以三百人巡邏乞賜空名告身從便遷賞樞密院奏已委監軍王庭玉駐歸德寧陵備之矣仍令牙剌哥水陸並進先行招誘不從乃合擊之其空名告身宜從所請以責成功無何碭山賊夜襲永城縣行軍副總領高琬萬戶麻吉擊走之殺傷及溺死者甚衆奪其所俘掠而還詔綱並力討之綱遣降人陳松持牒招李全全縛松將斬之已而但黥其面遣還綱奏全有歸國意嚴實張林亦可招之此謂益都張林也詔擬實一品官職封國公仍世襲全階正三品職正二品林山東西路宣撫使兼知益都府事與全皆賜田百頃受命往招者先授正七品官職賜銀二十五兩事成遷五品會綱遇害而止綱御下嚴信賞必罰邳州軍不樂屬綱八月辛未朔邳州從宜經略使納合六哥都統金山顏俊率沂州軍士百餘人晨入行省殺綱及僚屬于省署遂據州反樞密院奏請出空名宣敕設重賞招誘丞相高汝礪曰懸重賞募死士必有能取之者宣宗不得已下詔罪綱以撫諭六哥六哥遣人送綱尸及虎符牌印終不肯出乃升經略司為元帥府加六哥泗州防禦使權元帥左監軍副使烏古論老漢加邳州刺史權右監軍頃之邳州卒逃歸詣總帥牙吾塔言六哥已結李全為助遣總領孛术魯留住等毀其橋梁攻破承安青陽寨留兵戍守六哥惶懼乃言待李全兵入邳州誘而殺之以圖報效宣宗曰李全豈無心者六哥能誘而殺之殆詐耳十月壬辰牙吾塔圍邳州急攻之紅襖賊高顯等殺六哥函首以獻詔加顯三品官職授世襲謀克侯進四品陳榮邢進邊全魏興孫仲皆五品賞銀有差必蘭阿魯帶貞祐初纍官寧化州刺史二年同知真定府事權河北大名宣撫副使三年保全贊皇加遙授安武軍節度使改昭義軍節度使充宣撫副使閲月權元帥左都監行元帥府事節度宣撫如故遣都統奧屯喜哥復取威州及獲鹿縣既而詔擇義軍為三等阿魯帶奏自去歲初置帥府已按閲本軍去其冗食部分既定上下既親故能所向成功此皆血戰屢試而可者父子兄弟自相救援各顧其家心一力齊勢不可離今必析之將互易其處不相諳委矣國家糧儲常患不繼豈容僥冒其間但本府之兵不至是耳事勢方殷分別如此彼居中下將氣挫心懈而不可用且義軍率皆農民已散歸田畝趨時力作徵集旬日農事廢而歲計失矣乞本府所定無輕變易詔許之阿魯帶繕完州縣之可守者其不可守者遷徙其民依險為柵以備緩急澤州舊隸昭義軍近年改隸孟州阿魯帶奏澤州城郭堅完器械具備若屯兵數千臣能保守之今聞議遷于青蓮寺山寨距州既遠地形狹隘所容無幾一旦有急所保者少所遺者多徒棄名城以失太行之險則沁南昭義不通問矣詔澤州復隸昭義軍是歲潼關失守阿魯帶趨備藍田商州乃陳河北利害略曰今欣代撤戍太原帥府衆才數千平陽行省兵亦不多河東河北之勢全恃潞州潞州兵強則國家基本漸可復立臣已將兵離境乞復置潞州帥府阿魯帶行次澠池右副元帥蒲察阿里不孫敗績逃匿不知所在阿魯帶亦被創收集潰卒臥澠池詔還潞州興定元年改簽樞密院事數月以元帥左監軍兼山東路統軍使知益都府事未幾權參知政事行尚書省于益都阿魯帶復立潞州最有功識遼州刺史郭文振舉以為將既而去潞州張開代領其衆與郭文振不相得文振漸不能守矣贊曰貞祐之時僕散安貞定山東僕散端鎮陝西胥鼎控制河東侯摯經營趙魏其措注施設有可觀者故田琢撫青齊完顏弼保東平必蘭阿魯帶守上黨皆嚮用有功焉高琪忌功汝礪固位西啓夏釁南挑宋兵宣宗道謀是用煦煦以為慈皎皎以為明孑孑以為強既而潼關破毀崤澠喪敗汴州城門不啓連月高琪方且增陴浚隍為自守計繕御寨以祈逃死然後田琢走益都而青齊裂蒙古綱去東平而兗魯蹙僕散安貞死而南伐無功雖曰天道亦由人事自是以往無足言者矣
