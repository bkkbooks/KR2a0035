body:
  text: 金史卷四十四志第二十五兵兵制禁軍養兵之法金興用兵如神戰勝攻取無敵當世曾未十年遂定大業原其成功之速俗本鷙徑人多沉雄兄弟子姓才皆良將部落保伍技皆鋭兵加之地狹産薄無事苦耕可給衣食有事苦戰可致俘獲勞其筋骨以能寒暑徵發調遣事同一家是故將勇而志一兵精而力齊一旦奮起變弱為強以寡制衆用是道也及其得志中國自顧其宗族國人尚少乃割土地崇位號以假漢人使為之效力而守之猛安謀克雜厠漢地聽與契丹漢人昏因以相固結逮夫國勢寖盛則歸土地削位號罷遼東渤海漢人之襲猛安謀克者漸以兵柄歸其內族然樞府簽軍募軍兼采漢制伐宋之役參用漢軍及諸部族而統以國人非不知制勝長策在於以志一之將用力齊之兵也第以土宇既廣豈得盡任其所親哉馴致極盛乃自患其宗族國人之多積其猜疑卒自戕賊遂致強本刊落醇風鍥薄將帥離兵士驕惰迄其亡也忠孝等軍構難于內辭軍雜人召禍于外向之所謂志一而力齊者不見可恃之勢焉豈非自壞其家法而致是歟抑是道也可用於新造之邦不可以保長久之天下歟金以兵得國奉詔作金史故於金之兵志考其興亡得失之迹特著於斯兵制馬政養兵等法載諸舊史者昈列于篇金之初年諸部之民無它徭役壯者皆兵平居則聽以佃漁射獵習為勞事有警則下令部內及遣使詣諸孛堇徵兵凡步騎之仗糗皆取備焉其部長曰孛堇行兵則稱曰猛安謀克從其多寡以為號猛安者千夫長也謀克者百夫長也謀克之副曰蒲里衍士卒之副從曰阿里喜部卒之數初無定制至太祖即位之二年既以二千五百破耶律謝十始命以三百戶為謀克謀克十為猛安繼而諸部來降率用猛安謀克之名以授其首領而部伍其人出河之戰兵始滿萬而遼莫敵矣及來流鴨水鐵驪鱉古之民皆附東京既平山西繼定內收遼漢之降卒外籍部族之健士嘗用遼人訛里野以北部百三十戶為一謀克漢人王六兒以諸州漢人六十五戶為一謀克王伯龍及高從祐等並領所部為一猛安至天會二年平州既平宗望恐風俗揉雜民情弗便乃罷是制諸部降人但置長吏以下從漢官之號四年伐宋之役調燕山雲中中京上京東京遼東平州遼西長春八路民兵隸諸萬戶其間萬戶亦有專統漢軍者熙宗皇統五年又罷遼東漢人渤海猛安謀克承襲之制浸移兵柄於其國人乃分猛安謀克為上中下三等宗室為上餘次之至海陵庶人天德二年省並中京東京臨潢咸平泰州等路節鎮及猛安謀克削上中下之名但稱為諸猛安謀克循舊制間年一徵發以補老疾死亡之數貞元遷都遂徙上京路太祖遼王宗幹秦王宗翰之猛安並為合扎猛安及右諫議烏里補猛安太師勗宗正宗敏之族處之中都斡論和尚胡剌三國公太保昂詹事烏里野輔國勃魯骨定遠許烈故杲國公勃迭八猛安處之山東阿魯之族處之北京按達族屬處之河間正隆二年命兵部尚書蕭恭等與舊軍皆分隸諸總管府節度使授田牛使之耕食以蕃衛京國六年南伐立三道都統制府及左右領軍大都督將三十二軍以神策神威神捷神鋭神毅神翼神勇神果神略神鋒武勝武定武威武安武捷武平武成武毅武鋭武揚武翼武震威定威信威勝威捷威烈威毅威震威略威果威勇為名軍置都總管副總管及巡察使副各一員而沿邊契丹恐妻孥被鄰寇鈔掠不可盡行遂皆背叛而大名續授甲之士還迎立世宗于東京及大定之初窩斡既平及散契丹隸諸猛安謀克至三年詔河北山東等路所簽軍有父兄俱已充甲軍子弟又為阿里喜恐其家更無丁男有誤農種興免一丁以驅丁充阿里喜無驅丁者於本猛安謀克內驗富強有驅丁者簽充十三年徙東北等戍邊漢軍於內地十五年十月遣吏部郎中蒲察兀虎等十人分行天下再定猛安謀克戶每謀克戶不過三百七謀克至十謀克置一猛安十七年又以西南西北招討司契丹餘黨心素狠戾復恐生事它時或有邊隙不為我用令遷之於烏古里石壘部及上京之地上謂宰臣曰北邊番戍之人歲冒寒暑往來千里甚為勞苦縱有一二馬牛一往則無還理且奪其農時不得耕種故嘗命卿等議以何術得罷其役使安于田里不知卿議何如也左丞相良弼對曰北邊之地不堪耕種不能長戍故須番戍耳上曰朕一日萬幾安能遍及卿等既為宰相以此急務反以為末事竟無一言甚勞朕慮往者參政宗屢為朕言若以貧戶永屯邊境使之耕種官給糧廩則貧者得濟富戶免於更代之勞使之得勤農務若宗者可謂盡心為國矣朕嘗思之宜以兩路招討司及烏古里石壘部族臨潢府泰州等路分定保戍具數以聞朕親覽焉十八年合部族辭分番守邊二十年以祖宗平定天下以來所建立猛安謀克因循既久其間有戶口繁簡地里遠近不同又自正隆之後所授無度及大定間亦有功多未酬者遂更定以詔天下復命新授者並令就封其謀克人內有六品以下職及諸局承應人皆為遷之三從以上族人願從行者猛安不得過十戶謀克不得過六戶詔戍邊軍士年五十五以上許以其子及同居弟姪承替以奴代者罪之二十一年三月詔遣大興尹完顏迪古速遷河北東路兩猛安上曰朕始令移此欲令與女直戶相錯安置久則自相姻親不生異意此長久之利也今者移馬河猛安相錯以居甚符朕意而遙落河猛安不如此可再遣兵部尚書張那也按視其地以雜居之二十二年以山東屯田戶鄰之於邊鄙命聚之一處俾協力蠶種右丞相烏古論元忠曰彼方之人以所得之地為家雖兄弟不同處故貧者衆參政粘割斡特剌曰舊時兄弟雖析猶相聚種今則不然宜令約束之又以猛安謀克舊籍不明遇簽軍與諸差役及賑濟增減不以實命括其口以實籍之二十三年遣刑部尚書移剌慥遷山東東路八謀克處之河間其棄地以山東東路忒黑河猛安下蘸答謀克移里閔斡魯渾猛安下翕浦謀克什母溫山謀克九村人戶徙於劉僧安和二謀克之舊地其未徙者之地皆薄惡且鄰寇遣使詢願徙者相可居之地圖以進上嘗以速頻胡里改人驍勇可用海陵嘗欲徙之而未能二十四年以上京率胡剌溫之地廣而腴遂遣刑部尚書烏里也出府庫錢以濟行資牛畜遷速頻一猛安胡里改二猛安二十四謀克以實之蓋欲上京兵多它日可為緩急之備也當是時多易置河北山東所屯之舊括民地而為之業戶頒牛而使之耕畜甲兵而為之備乃大重其權授諸王以猛安之號或新置者特賜之名制其奢靡禁其飲酒習其騎射儲其糧糒其備至嚴也是時宗室戶百七十猛安二百二謀克千八百七十八戶六十一萬五千六百二十四東北路部族辭軍曰迭剌部承安三年改為土魯渾札石合節度使曰唐古部承安三年改為部魯火札石合節度使二部五辭戶五千五百八十五其它若助魯部族烏魯古部族石壘部族萌骨部族計魯部族孛特本部族數皆稱是西北西南二路之辭軍十曰蘇謨典辭曰耶剌都辭曰骨典辭唐古辭霞馬辭木典辭萌骨辭咩辭胡都辭凡九其諸路曰曷懶曰蒲與曰婆速曰恤頻曰胡里改曰移懶移懶後廢皆在上京之鄙或置總管府或置節度使至章宗明昌間欲國人兼知文武令猛安謀克舉進士試以策論及射以定其科甲高下承安四年上謂宰臣曰人有以八陳圖來上者其圖果何如朕嘗觀宋白所集武經具載攻守之法亦多難行右丞相清臣曰兵書一定之法難以應變本朝行兵惟用正奇二軍臨敵制變以正為奇以奇為正故無往不克上曰自古用兵亦不出奇正二法耳且學古兵法如學奕棋未能自得於心欲用舊陳勢以接敵疏矣敵所應與舊勢異則必不可支然武經所述雖難遵行然知之猶愈不知泰和間又制武舉其制具在選舉志所謂渤海軍則渤海八猛安之兵也所謂奚軍者奚人遙輦昭古牙九猛安之兵也奚軍初徙于山西後分遷河東其漢軍中都永固軍大定所置者也所謂鎮防軍則諸軍中取以更代戍邊者也在西北邊則有分番屯戍軍及永屯軍驅軍之別驅軍則國初所免遼人之奴婢使屯守于泰州者也邊鋪軍則河南陝西居守邊界者河東三虞候順德軍及章宗所置諸路效節軍京府節鎮設三十人防刺設二十人掌同弓手者也諸路所募射糧軍五年一籍三十以下十七以上強壯者皆刺其所以兼充雜役者也京師防城軍世宗大定十七年三月改為武衛軍則掌京師巡捕者也其曰牢城軍則嘗為盜竊者以充防築之役曰土兵則以司警捕之事凡漢軍有事則簽取於民事已則或亦放免初天會間郭藥師降有曰長勝軍者皆遼水側人也以鄉土歸金皆愁怨思歸宗望及令罷還正隆間又嘗罷諸路漢軍而所存者猶有威勇威烈威捷順德及韓常之軍之號凡邊境置兵之州三十八鳳翔延安鄧鞏熙泗潁蔡隴秦河海壽唐商洮蘭會積石鎮戎保安綏德保德環葭隩寧邊東勝淨慶來遠桓昌曷懶婆速蒲與恤品胡里改置於要州者十一南京東京益都京兆太原臨洮臨潢豐泰撫蓋及宣宗南遷辭軍潰去兵勢益弱遂盡擁猛安戶之老稚渡河僑置諸總管府以統之器械既缺糧糒不給朘民膏血而不足乃行括糧之法一人從征舉家待哺又謂無以堅戰士之心乃令其家盡入京師不數年至無以為食乃聽其出而國亦屈矣然初南渡時盡以河朔戰兵三十萬分隸河南行樞密及帥府往往蔽匿強壯驅羸弱使戰不能取勝後乃至以二十五人為謀克四謀克為猛安每謀克除旗鼓司火頭五人任戰者止十八人不足成隊伍但務存其名而已故混源劉祁謂金之兵制最弊每有征伐及邊釁輒下令簽軍使遠近騷動民家丁男若皆強壯或盡取無遺號泣動乎鄰里嗟怨盈於道路驅此使戰欲其勝敵難矣初貞祐時下令簽軍會一時任子為監當者春赴吏部選宰執命取為監官軍皆憤慍哀號交訴臺省至衝宰相鹵簿以告丞相僕散七斤大怒趣左右取弓矢射去已而上知其不可用命免之元光末備潼關黃河又簽軍諸使者歷縣邑自見居官外無文武小大職事官皆充軍至許州前侍御史劉元規年幾六十亦選為千戶至陳州以祁父從益以前監察御史亦為千戶餘不可悉紀既立部伍必以軍律相臨物議紛然後亦罷之哀宗正大二年議選諸路精兵直隸密院先設總領六員分路揀閲因相合並每總領司率數萬人軍勢既張乃易總領之名為都尉班在隨朝四品之列曰建威曰虎威曰破虜振威鷹揚虎賁振武折衝蕩寇殄寇必以先嘗秉帥權者居是職雖帥府行院亦不敢以貴重臨之天興初元有十五都尉先六人升授在京建威奧屯斡里卜許州折衝夾谷澤本姓樊陳州振武溫撒辛本姓李蔡州蕩寇蒲察打吉卜申裕安平完顏斜列嵩汝振武唐括韓僧續封金昌府虎威紇石烈乞兒宣權歸德果毅完顏豬兒南京殄寇完顏阿拍宣權潼關都尉三虎賁完顏陳兒鷹揚內族大婁室全節復取河朔諸路歸正人不問鞍馬有無譯語能否悉送密院增月給三倍它軍授以官馬得千餘人歲時犒燕名曰忠孝軍以石抹燕山奴蒲察定住統之加以正大已後諸路所虜臨陳所獲皆放歸鄉土同忠孝軍給其犒賞使河朔俘係知之故此軍迄于天興至七千千戶以上將帥尚不預焉又以歸正人過多乃係於忠孝籍中別為一軍減忠孝所給之半不能射者令閲習一再月然後試補忠孝軍是所謂合里合軍也又以親衛馬軍舊時所選未精必加閲試直取武藝如忠孝軍者得五千人餘罷歸為步軍凡進征忠孝居前馬軍次之自正大改立馬軍隊伍鞍勒兵甲一切更新將相舊人自謂國家全盛之際馬數則有之至於軍士精鋭器仗堅整較之今日有不侔者中興之期為有望矣一日布列曹門內教場忠孝軍七千馬軍五千京師所屯建威都尉軍萬人內族九住所統親衛軍三千及阿排所統四千皆哀宗控制樞密院時所選教場地約三十頃尚不能容餘都尉十三四軍猶不在是數此外招集義軍名曰忠義要皆燕趙亡命雖獲近用終不可制異時擅殺北使唐慶以速金亡者即此曹也禁軍之制本於合扎謀克合扎者言親軍也以近親所領故以名焉貞元遷都更以太祖遼王宗幹秦王宗翰之軍為合扎猛安謂之侍衛親軍故立侍衛親軍司以統之舊常選諸軍之材武者為護駕軍海陵又名上京龍翔軍為神勇軍正隆二年將南伐乃罷歸使就僉調復於侍衛親軍四猛安舊止曰太祖遼王秦王猛安凡三今曰四猛安未詳豈太祖兩猛安耶內選三十以下千六百人騎兵曰龍翔步兵曰虎步以備宿衛五年罷親軍司以所掌付大興府置左右驍騎所謂從駕軍也置都副指揮使隸點檢司步軍都副指揮使隸宣徽院大定初親軍置四千人二十二年省為三千五百上京亦設守衛軍是年尚書省奏上京既設皇城提舉官亦當設軍守衛上曰可設四百五十馬一百二十分三番更代異時朕至上京即作兩番巡警限以半年交替人日給錢五十米一升半馬給芻粟猛安謀克官可差年四十上下者軍士並取三十以上者充章宗承安四年增為五千又增至六千又有威捷軍承安增簽弩手千人凡選弩手之制先以營造尺度杖其長六尺立之謂之等杖取身與杖等能踏弩至三石鋪弦解索登踏間習射六箭皆上𣛀內二箭中貼者又選親軍取身長五尺五寸善騎射者猛安謀克以名上兵部移點檢司宣徽院試補之又設護衛二百人近侍之執兵仗者也取五品至七品官子孫及宗室並親軍諸局分承應人身長五尺六寸者選試補之又設控鶴二百人皆以備出入者也大將府治之稱號收國元年十二月始置咸州軍帥司以經略遼地討高永昌置南路都統司且以討張覺天輔五年襲遼主始有內外諸軍都統之名時以奚未平又置奚路都統司後改為六部路都統司以遙輦九營為九猛安隸焉與上京及泰州凡六處置每司統五六萬人又以渤海軍為八猛安凡猛安之上置軍帥軍帥之上置萬戶萬戶之上置都統然時亦稱軍帥為猛安而猛安則稱親管猛安者燕山既下循遼制立樞密院于廣寧府以總漢軍太宗天會元年以襲遼主所立西南都統府為西南西北兩路都統府三年以伐宋更為元帥府置元帥及左右副及左右監軍左右都監金制都元帥必以諳版孛極烈為之居守而不出六年詔還二帥以鎮方面諸路各設兵馬都總管府州鎮置節度使沿邊州則置防禦使凡州府所募射糧軍牢城軍每五百人為一指揮使司設使分為四都都設左右什將及承局押官其軍數若有餘或不足則與近者合置不可合者以三百人或二百人亦設指揮使若百人則止設軍使百人以上立為都不及百人止設什將及承局管押官各一員十年改南京路都統司為東南路都統司治東京以鎮高麗後又置統軍司于大名府及海陵天德二年八月改諸京兵馬都部署司為本路都總管府九月罷大名統軍司而置統軍司于山西河南陝西三路以元帥府都監監軍為使分統天下之兵又改烏古迪烈路統軍司為招討司以婆速路統軍司為總管府三年以元帥府為樞密院罷萬戶之官詔曰太祖開創因時制宜材堪統衆授之萬戶其次千戶及謀克當時官賞未定城郭未下設此職許以世襲乃權宜之制非經久之利今子孫相繼專攬威權其戶不下數萬與留守總管無異而世權過之可罷是官若舊無千戶之職者續思增置國初時賜以國姓若為子孫者皆令復舊正隆末復升陝西統軍司為都統府大定五年復罷府降為統軍司尋又設兩招討司與前凡三以鎮邊陲東北路者初置烏古迪烈部後置于泰州泰和間以去邊尚三百里宗浩乃命分司于金山西北路者置於應州西南路者置於桓州以重臣知兵者為使列城堡濠牆戍守為永制樞密院每行兵則更為元帥府罷則復為院宣宗貞祐三年徵代州戍兵五千從胥鼎言留代以屏平陽興定二年選募河南陝西弩手軍二千人為一軍賜號威勇及南遷河北封九公因其兵假以便宜從事沿河諸城置行樞密院元帥府大者有便宜之號小者有從宜之名元光間時招義軍以三十人為謀克五謀克為一千戶四千戶為一萬戶四萬戶為一副統兩副統為一都統此復國初之名也然又外設一總領提控故時皆稱元帥為總領云金初因遼諸抹而置羣牧抹之為言無蚊蚋美水草之地也天德間置迪河斡𩽆斡里保保亦作本蒲速斡燕恩兀者五羣牧所皆仍遼舊名各設官以治之又於諸色人內選家富丁多及品官家子猛安謀克蒲輦軍與司吏家餘丁及奴使之司牧謂之羣子分牧馬駝牛羊為之立蕃息衰耗之刑賞後稍增其數為九契丹之亂遂亡其五四所之所存者馬千餘牛二百八十餘羊八百六十駝九十而已世宗置所七曰特滿忒滿在撫州斡覩只蒲速碗蒲速碗本斡覩只之地大定七年分其地置之承安三年改為板底因烏魯古甌里本承安三年改為烏鮮烏魯古烏魯古者言滋息也合魯碗耶盧碗在武平縣臨潢泰州之境大定二十年三月更定羣牧官詳穩脫𩽆知把羣牧人滋息損耗賞罰格二十一年敕諸所馬三歲者付女直人牧之牛或以借民耕或又令民畜羊或以賑貧戶時遣使閲實其數缺則杖其官而令牧人償之匿其實者監察舉覺之二十八年蕃息之久馬至四十七萬牛十三萬羊八十七萬駝四千明昌五年散騬馬令中都西京河北東西路驗民物力分畜之又令它路民養馬者死則於前四路所養者給換若欲用則悉以送官此金之馬政也然每有大役必括於民及取羣官之餘騎以供戰士焉宣宗興定元年定民間收潰軍亡馬之法及以馬送官酬直之格上等馬一匹銀五十兩中下遞減十兩不願酬直者上等二匹補一官雜班任使中等三匹下等四匹如之令下十日陳首限外匿及殺並絞又遣官括市民馬立賞格以示勸五百匹以上鈔千貫千匹以上一官二千匹以上兩官養兵之法熙宗天眷三年正月詔歲給遼東戍卒紬絹有差正隆四年命河南陝西統軍司並虞候司順德軍官兵並增廩給六年將南征以絹萬匹于京城易衣襖穿膝一萬以給軍世宗大定三年南征軍士每歲可支一千萬貫官府止有二百萬貫外可取於官民戶此軍須錢之所由起也時言事者以山東河南陝西等路循宋齊舊例州縣司吏弓手於民間驗物力均敷顧錢名曰免役請以是錢贍軍至是省具數以聞詔罷弓手錢其司吏錢仍舊四年六月奏元帥府乞降軍須錢上曰帥府支費無度例皆科取於民甚非朕意仰會計軍須支用不盡之數及諸路轉運司見在如實缺用則別具以聞十年四月命德順州建營屋以處屯軍十七年七月歲以羊皮三萬賜西北路戍兵承安三年以軍須所費甚大乞驗天下物力均徵擬依黃河夫錢例徵軍須錢驗各路新籍物力每貫徵錢四貫西京北京遼東路每貫徵錢二貫臨潢全州則免徵周年三限送納恐期遠遂定制作半年三限輸納凡河南陝西山東放老千戶謀克蒲輦正軍阿里喜等給賞之例舊軍千戶十年以上賞銀五十兩絹三十匹不及十年比附十年以上謀克支謀克十年以上銀四十兩絹二十五匹不及十年銀三十兩絹二十匹蒲輦十年以上銀三十兩絹二十匹不及十年銀二十兩絹一十五匹馬步正軍阿里喜等勾當不拘年分放老正軍銀一十五兩絹一十匹阿里喜旗鼓吹笛本司火頭人等同銀八兩絹五匹三虞候千戶十年以上銀四十兩絹二十五匹不及十年銀三十兩絹二十匹謀克二十年以上銀五十兩絹三十匹十年以上銀三十兩絹二十匹不及十年銀一十兩絹一十五匹蒲輦十年以上銀二十兩絹一十五匹不及十年銀一十五兩絹一十匹正軍阿里喜勾當不拘年分放老正軍銀一十兩絹七匹阿里喜旗鼓吹笛本司火頭人等同銀五兩絹四匹北邊萬戶千戶謀克等歷過軍功及年老放罷給賞之例遷官同從吏部格正千戶管押萬戶勾當過一十五年遷兩官與從五品不及一十五年年老放罷遷一官與正六品若十年以下遷一官賞銀絹六十兩匹正謀克管押萬戶勾當一十五年遷兩官與正六品不及一十五年年老放罷遷一官與正七品若十年以下遷一官賞銀絹五十兩匹正千戶管押千戶勾當過二十年遷一官與正六品不及二十年年老放罷遷一官與正七品若十年以下遷一官賞銀絹四十兩匹正謀克管押千戶以下依河南陝西體例凡鎮防軍每年試射射若有出衆上等賞銀四兩特異衆者賞十兩銀馬盂簽充武衛軍挈家赴京者人日給六口糧馬四匹芻藁諸招軍月給例物邊鋪軍錢五十貫絹十匹軍匠上中等錢五十貫絹五匹下等錢四十貫絹四匹黃河掃兵錢三十貫絹五匹射糧軍及溝渠等處掃兵水手錢二十貫絹二匹土兵錢十貫絹一匹凡射糧軍指揮使及黃沁掃兵指揮使錢粟七貫石絹六匹軍使錢粟六貫石絹同上什將錢二貫粟三石春衣錢五貫秋衣錢十貫承局押官錢一貫五百文粟二石春衣錢五貫秋衣錢七貫牢城並土兵錢八百文粟二石春衣錢四貫秋衣錢六貫邊鋪軍請給與射糧軍同河南陝西山東路統軍司鎮防甲軍馬軍猛安錢八貫米五石二斗絹八匹六馬芻粟謀克錢六貫米二石八斗絹六匹五馬芻粟蒲輦錢四貫米石七斗絹五匹四馬芻粟正軍錢二貫米石五斗絹四匹綿十五兩兩馬芻粟阿里喜錢一貫五百文米七斗絹三匹綿十兩步軍猛安馬二匹謀克馬一匹芻粟每馬給芻一束粟五升歲仲春野有青草馬可牧養則止惟每猛安當差馬七十二匹四時皆給又定制河南山東河東歲給五月陝西六月鎮防軍補買馬錢河南路正軍五百文阿里喜隨色人三百文陝西山東路正軍三百文阿里喜隨色人二百文諸屯田被差及緣邊駐扎捉殺軍猛安月給錢六貫米一石八斗五馬芻粟謀克錢四貫米一石二斗三馬芻粟蒲輦錢二貫米六斗二馬芻粟正軍錢一貫五百文米四斗一馬芻粟阿里喜隨色人錢一貫米四斗一馬芻粟德順軍指揮使錢六貫米二石八斗絹六匹三馬芻粟軍使什將錢四貫米一石七斗絹五匹給兩馬料長行錢二貫米一石五斗絹四匹綿十五兩給一馬料奚軍謀克錢一貫五百文米一石五斗紬絹春秋各一匹給三馬料蒲輦錢一貫米二石七斗紬絹同上給二馬料長行錢一貫米一石八斗紬絹同上飼一馬北邊臨潢等處永屯駐軍千戶錢八貫米五石二斗絹八匹飼馬六匹步軍飼兩馬地五頃謀克錢六貫米二石八斗絹六匹飼五馬地四頃蒲輦錢四貫米一石七斗絹五匹飼四馬地三頃正軍錢二貫米一石四斗五升絹四匹綿十五兩飼兩馬地二頃阿里喜錢一貫五百文米七斗絹三匹綿十兩地一頃旗鼓司人與阿里喜同交替軍錢二貫米四斗阿里喜錢一貫五百文米四斗上番漢軍千戶月給錢三貫糧四石絹八匹飼四馬謀克錢二貫五百文糧一石絹六匹飼二馬正軍錢二貫米九斗五升絹四匹上京路永屯駐軍所除授千戶月給錢粟十五貫石絹十匹綿二十兩飼三馬謀克錢六貫米二石八斗絹六匹飼二馬正軍月支錢二貫五百文米一石二斗絹四匹綿十五兩飼一馬阿里喜隨色人錢二貫米一石二斗絹四匹綿十五兩諸北邊永駐軍月給補買馬錢四百文隨色人三百文貞祐三年軍前委差及掌軍官規圖糧料冒占職役皆無實員又見職及遙授者已有俸給又與無職事者同支券糧故時議欲省員減所給之數俟征行則全給之及興定二年彰化軍節度使張行信言一軍充役舉家給蓋欲感悅士心使為國盡力耳至於無軍之家復無丁男而其妻女猶受給何謂耶五年京南行三司官石抹斡魯言京南東西三路見屯軍戶老幼四十萬口歲費糧百四十餘萬石皆坐食民租甚非善計語在田制諸屯田軍人如差防送日給錢一百五十文看管孝寧宮人月各給米五斗柴一車春秋衣粗布一段秋絹二匹綿一十五兩諸黃院子年滿者以元請錢糧三分內給一貫石養老
