body:
  text: 金史卷三本紀第三太宗太宗體元應運世德昭功哲惠仁聖文烈皇帝諱晟本諱吳乞買世祖第四子母曰翼簡皇后拏懶氏太祖母弟也遼太康元年乙卯歲生初為穆宗養子收國元年七月命為諳班勃極烈太祖征伐常居守天輔五年賜詔曰汝惟朕之母弟義均一體是用汝貳我國政凡軍事違者閱實其罪從宜處之其餘事無大小一依本朝舊制天輔七年六月太祖次鴛鴦濼有疾至斡獨山驛召赴行在詔曰今遼主盡喪其師奔于夏國遼官特列遙設等劫其子雅里而立之已留宗翰等措畫朕親巡已久功亦大就所獲州部政須綏撫是用還都八月中旬可至春州汝率內戚迎我若至豹子崖尤善八月乙未會于渾河北戊申太祖崩九月乙卯葬太祖于宮城西國論勃極烈杲鄆王昂宗峻宗幹率宗親百官請正帝位不許固請亦不許宗幹率諸弟以赭袍被體置璽懷中丙辰即皇帝位己未告祀天地丙寅大赦中外改天輔七年為天會元年癸酉發春州粟賑降人之徙于上京者戊寅詔諸猛安賦米給戶口在內地匱乏者南路軍帥闍母敗張覺于樓峯口十月壬辰詔以空名宣頭百道給西南西北兩路都統宗翰曰今寄爾以方面如當遷授必待奏請恐致稽滯其以便宜從事己亥上京慶元寺僧獻佛骨却之闍母及張覺戰于耳山闍母敗績十一月壬子命宗望問闍母罪以其兵討張覺壬戌復以空名宣頭及銀牌給上京路軍帥實古廼婆盧火等癸亥宗望以闍母軍發廣寧下瀕海諸郡縣詔諭南京割武朔二州入于宋婁室破朔州西山擒其帥趙公直勃菫斡魯別及勃剌速破走乙室白答於歸化己巳徙遷潤來隰四州之民于瀋州庚午宗望及張覺戰于南京東大敗之張覺奔宋城中人執其父及二子以獻戮之軍中壬申張忠嗣張敦固以南京降遣使與張敦固入諭城中復殺其使者以叛己卯詔女直人先有附於遼今復虜獲者悉從其所欲居而復之其奴婢部曲昔雖逃背今能復歸者並聽為民十二月辛巳蠲民間貸息詔以咸州以南蘇復州以北年穀不登其應輸南京軍糧免之甲午詔曰比聞民間乏食至有鬻其子者其聽以丁力等者贖之是日以國論勃極烈杲為諳班勃極烈宗幹為國論勃極烈遣勃菫李靖如宋告哀二年春正月庚戌朔以謾都訶為阿捨勃極烈參議國政壬子命賞宗望及將士克南京之功赦闍母罪甲寅以空名宣頭五十銀牌十給宗望戊午詔孛菫完顏阿實賚曰先帝以同姓之人有自鬻及典質其身者命官為贖今聞尚有未復者其悉閱贖之癸亥以東京比歲不登詔減田租市租之半甲戌西南西北兩路都統宗翰宗望請勿割山西郡縣與宋上曰是違先帝之命也其速與之夏國奉表稱藩以下寨以北陰山以南乙室耶剌部吐祿濼西之地與之丙子貽宋書索俘虜叛亡丁丑始自京師至南京每五十里置驛二月詔有盜發遼諸陵者罪死庚寅詔命給宗翰馬七百疋田種千石米七千石以賑新附之民丁酉命徙移懶路都勃菫完顏忠于蘇瀕水乙巳詔諭南京官僚小大之事必關白軍帥無得專達朝廷丙午宗翰乞濟師詔有司選精兵五千給之丁未命宗望凡南京留守及諸闕員可選勳賢有人望者就注擬之具姓名官階以聞三月己酉朔命宗望以宋歲幣銀絹分賜將士之有功者庚戌叛人活孛帶降詔釋之宗望請選良吏招撫遷潤來隰之民保山砦者從之己未宗望以南京反覆凡攻取之計乞與知樞密院事劉彥宗裁決之劉公冑王永福棄家踰城來降以公冑為廣寧尹永福為奉先軍節度使辛未夏國王李乾順遣使上誓表閏月戊寅朔賜夏國誓詔辛巳命置驛上京春泰之間己丑烏虎里迪烈底兩部來降丙午既許割山西諸鎮與宋以宗翰言罷之是月斜野襲遙輦昭古牙走之獲其妻孥羣從及豪族勃菫渾啜等破奚七巖而撫其民人四月己酉以宗翰經略西夏及破遼功賜以十馬使自擇其二餘以分諸帥賑上京路西北路降者及新徙嶺東之人戊午以實古廼所築上京新城名會平州乙亥詔贖上京路新遷寧江州戶口賣身者六百餘人宋遣使來弔喪以高术僕古等充遺留國信使高興輔劉興嗣等充告即位國信使如宋五月丁丑朔上京軍帥實古廼以所獲印綬二十二及銀牌來上癸未詔曰新降之民訴訟者衆今方農時或失田業可俟農隙聽決丁亥婆速路猛安僕盧古以贓罷以謀克習泥烈代之乙巳曷懶路軍帥完顏忽剌古等言往者歲捕海狗海東青鴉鶻於高麗之境近以二舟往彼乃以戰艦十四要而擊之盡殺二舟之人奪其兵仗上曰以小故起戰爭甚非所宜今後非奉命毋輒往闍母克南京殺都統張敦固七月壬午皇子宗峻薨丙戌禁外方使介冗從多者壬辰鶻實答言高麗納吾叛亡增其邊備必有異圖詔曰納我叛亡而弗歸其曲在彼凡有通問毋違常式或來侵略整爾行列與之從事敢先犯彼雖捷必罰乙未以烏虎部及諸營叛以勃極烈昱等討平之八月乙巳朔以孛菫烏爪乃等為賀宋生辰使丁巳撒离改部猛安雛思以贓罷以奚金家奴代之六部都統撻懶擊走昭古牙殺其隊將曷魯燥白撒曷等又破降駱駝山金源興中諸軍詔增給銀牌十十月甲辰朔夏國遣使謝誓詔戊午天清節宋夏遣使來賀甲子詔發寧江州粟賑泰州民被秋潦者遙輦昭古牙率衆來降興中府降丙寅詔有司運米五萬石于廣寧以給南京潤州戍卒命南路軍帥闍母以甲士千人益合蘇館路孛菫完顏阿實賚以備高麗戊辰西南西北兩路權都統斡魯言遼詳穩撻不野來奔言耶律大石自稱為王置南北官屬有戰馬萬疋遼主從者不過四千戶有步騎萬餘欲趨天德駐余都谷詔曰追襲遼主必酌事宜其討大石則俟報下十一月癸未闍母下宜州拔杈枒山殺節度使韓慶民癸卯詔以米五萬石給撻懶實古廼十二月戊申以孛菫高居慶等為賀宋正旦使三年正月癸酉朔宋夏遣使來賀戊子同知宣徽院事韓資正加尚書左僕射為諸宮都部署乙未夏國遣使奠幣及賀即位宋遣使賀即位二月壬戌婁室獲遼主于余睹谷丁卯以厖葛城地分授所徙烏虎里烈底二部及契丹民三月乙亥阿捨勃極烈謾都訶薨丙子賑奚契丹新附之民辛巳建乾元殿斡魯獻傳國寶以謀葛失來附請授印綬是日賜完顏婁室鐵券四月壬寅朔詔以遼主赴京師丁巳南路軍帥察剌以罪罷五月己丑蕭八斤獲遼玉寶來獻六月庚申以獲遼主遣李用和等充告慶使如宋七月壬申禁內外官宗室毋私役百姓己卯南京帥以錦州野蠶成繭奉其絲綿來獻命賞其長吏詔權勢之家毋買貧民為奴其脅買者一人償十五人詐買者一人償二人皆杖一百甲申詔南京括官豪牧馬以等第取之分給諸軍以耶律固等為宋報謝使八月癸卯斡魯以遼主至京師甲辰告于太祖廟丙午遼主延禧入見降封海濱王壬子詔有司揀閱善射勇健之士以備宋九月壬午廣寧府獻嘉禾癸巳保州路都孛菫加古撒曷有罪伏誅以孛菫徒單烏烈代之十月甲辰詔諸將伐宋以諳班勃極烈杲兼領都元帥移賚勃極烈宗翰兼左副元帥先鋒經略使完顏希尹為元帥右監軍左金吾上將軍耶律余睹為元帥右都監自西京入太原六部路軍帥撻懶為六部路都統斜也副之宗望為南京路都統闍母副之知樞密院事劉彥宗兼領漢軍都統自南京入燕山詔建太祖廟于西京召耶魯赴京師教授女直字戊申有司言權南路軍帥鶻實荅官吏貪縱詔鞫之壬子天清節宋夏遣使來賀丁巳以闍母為南京路都統埽喝副之宗望為闍母劉彥宗兩軍監戰壬戌詔曰今大有年無儲蓄則何以備饑饉其令牛一具賦粟一石每謀克為一釰貯之宋易州戍將韓民毅以軍降處之蔚州十一月庚辰以降封遼主為海濱王詔中外辛卯南路軍帥司請禁契丹奚漢人挾兵器詔勿禁以張忠嗣權簽南京中書樞密院事十二月庚子宗翰下朔州甲辰宗望諸軍及宋郭藥師張企徽劉舜仁戰於白河大破之蒲莧敗宋兵于古北口丙午郭藥師降燕山州縣悉平戊申宗翰克代州乙卯中山降丙辰宗望破宋兵五千于真定戊午宗翰圍太原耶律余睹破宋河東陝西援兵于汾河北甲子宗望克信德府四年春正月丁卯朔始朝日降臣郭藥師董才皆賜姓完顏氏戊辰宗弼取湯陰大攻下濬州迪古補取黎陽己巳諸軍渡河庚午取滑州宗望使吳孝民等入汴問宋取首謀平山者童貫譚稹詹度及張覺等宋太上皇帝出奔癸酉諸軍圍汴甲戌宋使李梲來謝罪且請修好宗望許宋修好約質割三鎮地增歲幣載書稱伯姪戊寅宋以康王構少宰張邦昌為質辛巳宋上誓書地圖稱姪大宋皇帝伯大金皇帝癸未諸軍解圍二月丁酉朔夜宋將姚平仲兵四十萬來襲宗望營敗之己亥復進師圍汴宋使宇文虛中以書來改以肅王樞為質遣康王構歸師還壬子以滑濬二州與宋宗翰定威勝軍攻下隆德府丁巳次澤州海濱王家奴誣其主欲亡去詔誅其首惡餘並杖之三月癸未銀术可圍太原宗翰還西京四月癸卯宗望使宗弼來奏捷乙丑耿守忠等大敗宋兵于西都谷五月辛未宋种師中以兵出井陘癸酉完顏活女敗之于殺熊嶺斬師中於陣是日拔离速敗宋姚古軍於隆州谷六月丙申朔高麗國王王楷奉表稱藩庚戌宗望獻所獲三象庚申以宗望為右副元帥七月丙寅遣高伯淑等宣諭高麗壬申出金牌命孛菫大以所領渤海軍八猛安為萬戶戊子以鐵勒部長奪离剌不從其兄夔里本叛賜馬十一豕百錢五百萬蕭仲恭使宋還以所持宋帝與耶律余睹蠟書自陳八月庚子詔左副元帥宗翰右副元帥宗望伐宋宋張灝率兵出汾州拔离速擊走之劉臻以兵出壽陽婁室破之庚戌宗翰發西京辛亥婁室等破宋張灝軍于文水癸丑宗望發保州是日耶律鐸破宋兵于雄州那野等敗宋兵于中山甲寅新城縣進白烏庚申突撚取新樂九月丙寅宗翰克太原執經略使張孝純鶻沙虎取平遙靈石孝義介休諸縣己巳復以南京為平州辛未宗望破宋种師閔軍於井陘取天威軍克真定殺其守李邈十月婁室克汾州石州降蒲察克平定軍遼州降丁未天清節高麗夏遣使來賀中京進嘉禾十一月甲子宗翰自太原趨汴丙寅宗望自真定趨汴戊辰宗翰下威勝軍癸酉撒剌荅破天井關乙亥宗翰克隆德府活女渡盟津西京永安軍鄭州皆降庚辰宗翰克澤州宗望諸軍渡河臨河大名二縣德清軍開德府皆下丙戌克懷州是日宗望至汴閏月壬辰朔宋出兵拒戰宗望等擊敗之癸巳宗翰至汴丙辰克汴城庚申以高隨充高麗生日使辛酉宋主桓出居青城十二月癸亥宋主桓降是日歸于汴城庚辰詔曰朕惟國家四境雖遠而兵革未息田野雖廣而畎畝未闢百工略備而祿秩未均方貢僅修而賓館未贍是皆出乎民力苟不務本業而抑游手欲上下皆足其可得乎其令所在長吏敦勸農功五年正月辛卯朔高麗夏遣使來賀癸巳宗翰宗望使使以宋降表來上乙未知樞密院事劉彥宗上表請復立趙氏不聽丁巳回鶻喝里可汗遣使入貢二月丙寅詔降宋二帝為庶人三月丁酉立宋太宰張邦昌為大楚皇帝割地賜夏國四月乙酉克陝府取虢州丙戌以六部路都統撻懶為元帥左監軍南京路都統闍母為元帥左都監宗翰宗望以宋二帝歸己丑詔曰合蘇館諸部與新附人民其在降附之後同姓為婚者離之五月庚寅朔宋康王構即位於歸德宋殺張邦昌婁室降解絳慈隰石河中岢嵐寧化保德火山諸城撻懶徇地山東下密州迪虎下單州廣信軍降六月庚申詔曰自河之北今既分畫重念其民或見城邑有被殘者不無疑懼遂命堅守若即討伐生靈可愍其申諭以理招輯安全之儻執不移自當致討若諸軍敢利於俘掠輒肆蕩毀者底于罰庚辰右副元帥宗望薨漢國王宗傑繼薨七月甲午賜宗翰券書除反逆外咸貰勿論以石州戍將烏虎棄城喪師杖之削其官八月戊寅以宋捷遣耶律居謹等充宣慶使使高麗丙戌以宗輔為右副元帥詔曰河北河東郡縣職員多闕宜開貢舉取士以安新民其南北進士各以所業試之九月丁未詔曰內地諸路每耕牛一具賦粟五斗以備歉歲辛亥賜元帥右監軍完顏希尹萬戶銀术可券書除赦所不原餘並勿論闍母取河間大敗宋兵于莫州雄州降撻懶克祁州永寧軍保州順安軍皆降冬十月丁卯沙州回鶻活剌散可汗遣使入貢辛未天清節高麗夏遣使來賀宋二帝自燕徙居于中京十二月丙寅右副元帥宗輔伐宋徇地淄青烏林荅泰欲敗宋將李成于淄州趙州降阿里刮徇地濬州敗敵兵遂取滑州乙亥西南路都統斡魯薨己卯賽里下汝州六年正月丙戌朔高麗夏遣使來賀宗弼破宋鄭宗孟軍于青州銀术可取鄧州薩謀魯入襄陽拔离速入均州馬五取房州癸巳克青州癸卯闍母克濰州丁未迪古補敗宋將趙子昉兵撒离喝敗宋兵于河上甲寅宋將馬括兵次樂安宗輔擊敗之聞宋主在維揚以農時還師宗弼敗宋兵于河上二月乙卯朔拔离速取唐州癸亥取蔡州己巳移剌古敗宋將臺宗雋等兵于大名庚午再破其軍獲臺宗雋及宋忠甲戌拔离速取陳州癸未克穎昌府鄭州叛入于宋復取鄭州遷洛陽襄陽穎昌汝鄭均房唐鄧陳蔡之民于河北宗翰復遣婁室攻下同華京兆鳳翔擒宋經制使傅亮阿隣破河中斡魯入馮翊三月壬辰命南路軍帥實古廼籍節度使完顏慎思所領諸部及未置猛安謀克戶來上己酉撻懶下恩州五月戊戌移沙土古思以本部來附六月己未詔求祖宗遺事撻懶遣兵徇下磁州信德府真定賊自稱元帥秦王撒离喝討平之七月乙巳宋主遣使奉表請和詔進兵伐之以宋二庶人赴上京八月乙卯婁室敗宋兵于華州訛特剌破敵于渭水遂取下邽丁丑以宋二庶人素服見太祖廟遂入見于乾元殿封其父昏德公子重昏侯是日告于太祖廟以州郡職員名稱及俸給因革詔中外九月辛丑繩果等敗宋兵于蒲城甲申又破敵於同州乙丑取丹州十月丙寅天清節高麗夏遣使來賀癸酉知樞密院事劉彥宗薨丁丑蒲察婁室敗宋兵于臨真戊寅徙昏德公重昏侯于韓州庚辰宗翰宗輔會于濮伐宋十一月庚寅蒲察婁室取延安府壬辰賑移懶路乙未取濮州綏德軍降婁室再攻晉寧軍其守徐徽言固守不能克十二月丙辰宗弼取開德府丁卯宗輔克大名府鶻沙虎敗宋兵于鞏七年正月庚辰朔高麗夏遣使來賀辛巳吳國王闍母薨甲午以西京留守韓企先同中書門下平章事知樞密院事二月戊辰宋麟府路安撫使折可求以麟府豐三州降己巳婁室塞里鶻沙虎等破晉寧軍其守徐徽言據子城拒戰庚午率衆潰圍走擒之使之拜不拜臨之以兵不動命降將折可求諭之降指可求大罵出不遜語遂殺之其統制孫昂及士卒皆不屈盡殺之甲戌詔禁醫巫閭山遼代山陵樵採三月己卯朔日中有黑子壬寅詔軍興以來良人被略為驅者聽其父母夫妻子贖之尚書左僕射高楨罷四月蒲察婁室取鄜坊二州五月乙卯拔离速等襲宋主于揚州九月丙午朔日有食之庚午宗弼敗宋兵于睢陽辛未降其城是月曹州降十月丙子朔京兆府降丁丑鞏州降庚寅天清節高麗夏遣使來賀丁酉阿里當海大破敵于壽春己亥安撫使馬世元以城降甲辰廬州降十一月庚戌徙曷蘇舘都統司治寧州乙卯高麗遣使來貢丙辰宗弼取和州壬戌宗弼渡江敗宋副元帥杜充軍于江寧丁卯守臣陳邦光以城降十二月丙戌宗弼取湖州丁亥克杭州阿里蒲盧渾追宋主于明州越州降大敗宋樞密使周望于秀州又敗宋兵于杭州東北戊戌阿里蒲盧渾敗宋兵于東關遂濟曹娥江壬寅敗宋兵于高橋宋主入于海八年正月甲辰朔高麗夏遣使來賀丁巳以同中書門下平章事韓企先為尚書左僕射兼侍中己未阿里蒲盧渾克明州執其守臣趙伯諤庚申詔曰避役之民以微直鬻身權貴之家者悉出還本貫阿魯補斜里也下太平順昌及濠州是月宋副元帥杜充以其衆降二月乙亥宗弼還自杭州庚寅取秀州戊戌取平江汴京亂三月丁卯大迪里復取之宗弼及宋韓世忠戰于鎮江不利四月丙申復戰于江寧敗之諸軍渡江是日阿魯補戰于拓己亥周企戰于壽春辛丑婁室戰于淳化皆勝之醴州降遂克邠州五月癸卯禁私度僧尼及繼父繼母之男女無相嫁娶戊申詔曰河北河東簽軍其家屬流寓河南被俘掠為奴婢者官為贖之俾復其業六月壬申詔遣遼統軍使耶律曷禮質節度使蕭別离剌等十人分治新附州鎮癸酉詔以昏德公六女為宗婦七月辛亥詔給泰州都統婆盧火所部諸謀克甲冑各五十先遣婁室經略陝西所下城邑叛服不常其監戰阿盧補請益兵帥府會諸將議曰兵威非不足綏懷之道有所未盡誠得位望隆重恩威兼濟者以往可指日而定若以皇子右副元帥宗輔往為宜以聞詔曰婁室往者所向輒克今使專征陝西淹延未定豈倦于兵而自愛耶關陝重地卿等其戮力焉丁卯上如東京溫湯徙昏德公重昏侯于鶻里改路九月戊申立劉豫為大齊皇帝世修子禮都大名府辛酉諳班勃極烈都元帥杲薨癸亥宗輔等敗宋張浚軍于富平耀州降乙丑鳳翔府降十月乙亥上至自東京齊帝劉豫遣使謝封冊甲申天清節齊高麗夏遣使來賀以鐵驪突离剌同中書門下平章事詔遼宋官上本國誥命等第換授十一月甲辰宗輔下涇州丁未渭州降敗宋劉倪軍于瓦亭戊申原州降宋涇原路統制張中孚知鎮戎軍李彥琦以衆降馬五等擊宋吳玠軍于隴州庚戌以遙鎮節度使烏克壽等為齊劉豫生日使癸亥宗輔以陝西事狀聞詔奬諭之十二月丁丑完顏婁室薨乙酉宗輔敗宋劉維輔軍壬辰熙州降九年正月己亥朔齊高麗夏遣使來賀戊申命以徒門水以西渾疃星顯僝蠢三水以北閑田給曷懶路諸謀克辛亥蒲察鶻拔魯完顏忒里討張萬敵于白馬湖陷于敵癸丑以同中書門下平章事時立愛為侍中知樞密院張忠嗣為宣政殿大學士知三司使事宗弼阿盧補撫定鞏洮河樂西寧蘭廓積石等州涇原熙河兩路皆平四月己卯詔新徙戍邊戶匱于衣食有典質其親屬奴婢者官為贖之戶計其口而有二三者以官奴婢益之使戶為四口又乏耕牛者給以官牛別委官勸督田作戍戶及邊軍資糧不繼糴粟于民而與賑卹其續遷戍戶在中路者姑止之即其地種藝俟畢穫而行及來春農時以至戍所五月丙午分遣使者諸路勸農六月壬辰賜昏德公重昏侯時服各兩襲八月辛巳回鶻隈欲遣使來貢九月己酉和州回鶻執耶律大石之黨撒八迪里突迭來獻十月戊寅天清節齊高麗夏遣使來賀撒离喝攻下慶陽慕洧以環州降宗弼與宋吳玠戰于和尚原敗績十一月己未遷趙氏疎屬于上京以陝西地賜齊十年正月癸巳朔齊高麗夏遣使來賀己酉齊表謝賜地壬子詔曰昔遼人分士庶之族賦役皆有等差其悉均之二月庚午賑上京路戍邊猛安民四月丁卯詔諸良人知情嫁奴者聽如故為妻其不知而嫁者去住悉從所欲移賚勃極烈左副元帥宗翰朝京師庚午以太祖孫亶為諳班勃極烈皇子宗磐為國論忽魯勃極烈國論勃極烈宗幹為國論左勃極烈移賚勃極烈左副元帥宗翰為國論右勃極烈兼都元帥右副元帥宗輔為左副元帥庚寅聞鴨淥混同江暴漲命賑徙戍邊戶在混同江者閏月辛卯詔分遣鶻沙虎等十三人閱諸路丁壯調赴軍七月甲午賑泰州路戍邊戶上如中京九月元帥右都監耶律余睹謀反出奔其黨燕京統軍使蕭高六伏誅蔚州節度使蕭特謀葛自殺十月壬寅天清節大赦齊高麗夏遣使來賀上如興中府齊使使來告母喪十一月癸亥以武良謨為齊弔祭使癸未撒离喝請取劍外十三州從之部族節度使土古厮捕斬余睹及其諸子函其首來獻十二月庚子撒离喝克金州上至自興中府十一年正月丁巳朔齊高麗夏遣使來賀丁卯撒离喝敗吳玠于饒峰關戊辰取洋州甲戌入興元府二月己亥元帥府言承詔賑軍士臣恐有司錢幣將不繼請自元帥以下有祿者出錢助給之詔曰官有府庫而取於臣下此何理耶其悉從官給八月甲申黃龍府置錢帛司戊子趙㮙誣告其父昏德公謀反㮙及其壻劉文彥伏誅戊戌詔曰比以軍旅未定嘗命帥府自擇人授官今並從朝廷選注十月丙申天清節齊高麗夏遣使來賀十一月丙寅賑移懶路宗弼克和尚原十二月癸未賑曷懶路十二年正月辛亥朔齊高麗夏遣使來賀甲子初改定制度詔中外丙寅如東京二月丁酉撒离喝敗宋吳玠軍于固鎮四月至自東京六月甲午以阿盧補為元帥右都監十月庚寅天清節齊高麗夏遣使來賀十三年正月丙午朔日有食之己巳上崩于明德宮年六十一庚午諳班勃極烈即皇帝位于柩前三月庚辰上尊諡曰文烈皇帝廟號太宗乙酉葬和陵皇統四年改號恭陵五年增上尊諡曰體元應運世德昭功哲惠仁聖文烈皇帝貞元三年十一月戊申改葬于大房山仍號恭陵贊曰天輔草創未遑禮樂之事太宗以斜也宗幹知國政以宗翰宗望總戎事既滅遼舉宋即議禮制度治曆明時纘以武功述以文事經國規摹至是始定在位十三年宮室苑無所增益末聽大臣計傳位熙宗使太祖世嗣不失正緒可謂行其所甚難矣
