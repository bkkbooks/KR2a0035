body:
  text: 金史卷二十五志第六地理中南京路河北東路河北西路山東東路山東西路南京路國初曰汴京貞元元年更號南京府三領節鎮三防禦八刺史郡八縣一百五都城門十四曰開陽曰宣仁曰安利曰平化曰通遠曰宜照曰利川曰崇德曰迎秋曰廣澤曰順義曰迎朔曰順常曰廣智宮城門南外門曰南薰南薰北新城門曰豐宜橋曰龍津橋北門曰丹鳳其門三丹鳳北曰舟橋橋少北曰文武樓遵御路而北橫街也東曰太廟西曰郊社正北曰承天門其門五雙闕前引東曰登聞檢院西曰登聞鼓院檢院東曰左掖門門南曰待漏院鼓院西曰右掖門門南曰都堂直承天門北曰大慶門門東曰日精門又東曰左昇平門大慶門西曰月華門又西曰右昇平門正殿曰大慶殿前有龍墀又南有丹墀又南曰沙墀東廡曰嘉福樓西廡曰嘉瑞樓大慶後曰德儀殿殿東曰左昇龍門西曰右昇龍門正門曰隆德內有隆德殿有蕭牆有丹墀隆德殿左曰東上閤門右曰西上閤門皆南向鼓樓在東鐘樓在西隆德之次曰仁安門仁安殿東則內侍局又東曰近侍局又東則嚴祗門宮中則稱曰撒合門少南曰東樓則授除樓也西曰西樓仁安之次曰純和殿正寢也純和西曰雪香亭亭北則后妃位也有樓樓西曰瓊香亭亭西曰涼位有樓樓北少西曰玉清殿純和之次曰福寧殿殿後曰苑門內曰仁智殿有二太湖石左曰敷錫神運萬歲峰右曰玉京獨秀太平巖殿曰山莊其西南曰翠微閤苑門東曰僊韶院院北曰翠峯峯之洞曰大滌湧翠東連長生殿又東曰湧金殿又東曰蓬萊殿長生西曰浮玉殿又西曰瀛洲殿長生殿南曰閱武殿又南曰內藏庫嚴祗門東曰尚食局又東曰宣徽院院北曰御藥院又北右藏庫東則左藏庫宣徽院東曰點檢司司北曰祕書監又北曰學士院又北曰諫院又北曰武器署點檢司南曰儀鸞局又南曰尚輦局宣徽院南曰拱衞司又南曰尚衣局其南為繁禧門又南曰安泰門門與左昇龍門相直東則壽聖宮兩宮太后位也本明俊殿試進士之所宮北曰徽音院又北曰燕壽殿殿垣後少西曰振肅衞司東曰中衞尉司儀鸞局東曰小東華門更漏在焉中衞尉司東曰祗肅門少東南曰將軍司徽音壽聖東曰太后苑苑殿曰慶春與燕壽殿並小東華與正東華門對東華門內正北尚廄局其西北曰臨武殿左掖門北尚食局南曰宮苑司其西北尚醞局湯藥局侍儀司少西曰符寶局器物局又西則撒合門也嘉瑞樓西曰三廟正殿曰德昌東曰文昭西曰光興德昌後宣宗廟也宮西門曰西華與東華相直北門曰安貞開封府上留守司留守帶本府尹兼本路兵馬都總管天德二年罷行臺尚書省置轉運司提刑司天德二年置統軍司有藥市四榷場產蜜蠟香茶心紅朱紅地龍黃栢天德四年戶二十三萬五千八百九十泰和末戶百七十四萬六千二百一十縣十五鎮十五開封東附郭有古通津臨蔡關汴河鎮一延嘉祥符西附郭有岳臺浚水沙臺崇臺夷門山蔡河金水河廣濟河寒泉河鎮三陳橋八角郭橋陽武有沙池黑陽山黃河汴河白溝河通許宋名咸平大定二十九年以與咸平府重更有牛首城裘亭泰康有魯溝蔡河渦河鎮一崔橋中牟有汴河鄭河中牟臺鎮四圃田陽武萬勝白沙鎮嵵宋雍丘縣嵵國也正隆後更今名鎮一圉城鄢陵有洧水潩水太丘城鎮一馬欄橋尉氏有惠民河長明溝鎮二朱家曲宋樓扶溝有祁耶山洧水白亭鎮二建雄義店舊有赤倉鎮陳留有皇栢山狼丘汴河延津貞祐三年七月升為延州有土山黃河洧川貞祐二年置惠民倉興定二年四月以尉氏縣之宋樓鎮陞長垣封丘睢州下刺史宋拱州保慶軍國初猶稱拱州天德三年更戶四萬六千三百六十縣三鎮一襄邑古襄牛地有汴河睢水渙水承匡城鎮一重華考城宋隸東京正隆前隸曹州後來屬有葵丘黃河黃陵岡元光二年改為通安堡柘城古株林首止地在焉有渙水泡水泓水歸德府散中宣武軍故宋州宋南京應天府河南郡歸德軍國初置宣武軍戶七萬六千三百八十九縣六鎮四睢陽宋名宋城承安五年更名有鷹鷺池汴水睢水渙水鎮一葛驛寧陵大定二十二年徙於汴河堤南古城有汴水睢水渙水下邑有汴水黃水鎮一會亭虞城有孟諸藪穀熟有汴水穀水鎮二營城洛場又有舊高辛鎮楚丘國初隸曹州海陵後來屬興定元年以限河不便改隸單州有景山京岡單州中刺史宋碭郡貞祐四年二月升為防禦興定五年二月置招撫司以安集河北遺黎戶六萬五千五百四十五縣四單父有棲霞山泡溝成武有堂溝魚臺有泗水涓溝五丈溝碭山興定元年以限河不便改隸歸德府有芒碭山古汴渠午溝壽州下刺史宋隸壽春府貞元元年來屬泰和六年六月升為防禦戶八千六百七十七縣二鎮一下蔡有硤石山潁水淮水蒙城宋隸𩗗州國初來屬有狼山渦水鎮一蒙館陝州下防禦宋陝郡保平軍節度皇統二年降為防禦貞祐二年七月陞為節鎮戶四萬一千一十縣四鎮七陝倚有虢山峴頭山三崤山底柱山黃河橐水鎮一石壕靈寶有夸父山黃河稠桑澤古函谷關鎮二乾壕關東湖城有荊山鑄鼎原鳳林泉鼎湖鎮二三門集津閿鄉有太華山黃河玉澗水潼關太谷關鎮二張店故鎮舊又有曹張鎮恐誤鄧州武勝軍節度使宋南陽郡嘗置榷場戶二萬四千九百八十九縣三鎮六穰城倚有五壟山覆釜山湍水朝水鎮四順陽新野穰東板橋南陽有豫山百重山豐山梅溪水白水清泠水鎮一張村內鄉有高前山熊耳山黃水菊水淅水富水鎮一峽口唐州中刺史宋淮安郡嘗置榷場戶一萬一千三十一縣四鎮四泌陽倚有泌水醴水鎮一胡陽比陽有大明湖中陽山比水鎮一羊棚湖陽貞祐元年廢鎮一羅渠桐栢大定十年始置正官興定五年六月廢有桐栢山淮水柘河鎮一許封大定二十八年命規措界壕於唐鄧間裕州本方城縣泰和八年正月陞置以方城縣為倚郭割汝州葉縣許州舞陽隸焉戶八千三百縣三鎮四方城倚有方城山衡山堵水鎮一青臺葉本隸汝州泰和八年來屬有方城山石塘河灃水鎮一臨墳舞陽本隸許州泰和八年來屬有伏牛山馬鞍山舞水汝水渫水滍水鎮二吳城北舞河南府散中宋西京河南府雒陽郡初置德昌軍興定元年八月升為中京府曰金昌戶五萬五千六百三十五縣九正隆郡志有壽安縣紀錄皆無鎮四洛陽倚有北邙山正隆六年更名太平山稱舊名者以違制論有伊洛澗金水銅駝街金粟山金谷鎮一龍門澠池有天壇山廣陽山黃河澠河登封有太室山箕山陽城山少室山宣宗置御寨其上舊有潁陽鎮後廢孟津貞祐三年七月升為陶州十二月復為縣鎮一長泉舊有河清鎮後廢芝田宋名永安貞元元年更有轘轅山青龍山新安有闕門山長石山金水穀水陂水偃師有北邙山緱氏山半石山景山黃河洛水鎮一緱氏宜陽有錦屏山鹿蹄山憩鶴山女几山洛水昌水少水鞏有侯山九山黃河洛水鎮一洛口嵩州中刺史舊名順州天德三年更戶二萬六千六百四十九縣四鎮四伊陽宋隸河南府有三塗山陸渾山鼓鐘山伊水淯陽水鎮一鳴臯舊有伊闕鎮後廢永寧宋隸河南府正隆六年以前寄治於府後即鎮為縣有三肴山熊耳山嶕嶢山天柱山黃河杜陽水鎮一府店福昌宋隸河南府有女几山金門山鎮二韓城三鄉長水宋隸河南府有壇山松陽山洛水松陽水汝州上刺史宋臨汝郡陸海軍節度國初為刺郡貞祐三年八月升為防禦戶三萬五千二百五十四縣四鎮二梁有霍陽山崆峒山紫邏山汝水廣潤河正隆六年勅環汝州百五十里內州縣商賈赴溫湯置市郟城宋隸許州有汝水扈澗河鎮一黃道魯山有堯山滍水鴉河寶豐有豢龍城鎮一汝南許州下昌武軍節度使宋潁昌府許昌郡忠武軍戶四萬五千五百八十七縣五鎮七長社倚有潩水潁水鎮二許田椹澗郾城有長沙河五溝水鎮二駝口新寨長葛有小陘洧水臨潁鎮二合流繁城襄城本隸汝州泰和七年來屬鎮一潁橋鈞州中刺史舊陽翟縣偽齊升為潁順軍大定二十二年升為州仍名潁順二十四年更今名戶一萬八千五百一十縣二鎮一陽翟倚有具茨山三封山荊山潁水新鄭宋隸鄭州有溱洧潩三水鎮一郭店𩗗州上防禦使宋譙郡集慶軍隸揚州貞祐三年升為節鎮軍名集慶戶六萬五百三十五縣六鎮五舊有福寧馬頭二鎮譙倚有渦水泡水鎮一雙溝鹿邑有渦水明水鎮一鄲城衞真有洵水沙水鎮一谷陽城父有渦水淝水父水酇有睢水汴河白龍潭鎮一酇陽永城興定五年十二月升為永州以下邑碭山酇縣隸焉有芒山汴河鎮一保安陳州下防禦使宋淮寧府淮陽郡鎮安軍戶二萬六千一百四十五縣五鎮二宛丘有蔡河潁水洧水項城有潁水百尺堰南頓鎮一殄寇商水本水宋避宣祖諱改有商水潁水西華有宜陽山蔡河潁水鎮一長平蔡州中防禦使宋汝南郡淮康軍泰和八年升為節度軍曰鎮南嘗置榷場戶三萬六千九十三縣六鎮二汝陽有溱水澺水鎮一保城遂平有吳房山吳城山龍泉水瀙水上蔡西平有九頭山水鄧艾陂確山有確山渂水溱水鎮一毛宗平輿息州本新息縣泰和八年陞為息州以新息為倚郭割真陽襃信新蔡隸焉為蔡州支郡戶九千六百八十五縣四鎮一新息倚鎮一王務真陽本隸蔡州泰和八年來屬有淮水汝水石塘陂襃信本隸蔡州泰和八年來屬有汝水葛陂新蔡本隸蔡州泰和八年來屬有汝水鄭州中防禦宋滎陽郡奉寧軍節度戶四萬五千六百五十七縣七鎮三管城倚貞祐四年更名故市有圃田澤滎陽有鴻溝京索二水密有大騩山溱水洧水鎮二大騩宀元攵水河陰原武鎮一陳橋氾水有虎牢關滎澤有廣武澗舊有許橋賈谷二鎮在鄭境潁州下防禦宋順昌府汝陰郡嘗置榷場正隆四年罷榷場戶一萬六千七百一十四縣四鎮十一舊有萬善鎮後廢汝陰倚有潁水淮水淝水汝水潁上元光二年十一月改隸壽州有潁水淮水鎮十永寧漕口王家市櫟頭永清椒陂正陽江陂界溝斤溝泰和有潁水沈丘有武丘鎮一永安宿州中防禦宋符離郡保靜軍節度隸揚州國初隸山東西路大定六年來屬貞祐三年陞為節鎮軍曰保靜戶五萬五千五十八縣四鎮八舊有荊山鎮符離倚有諸陽山汴河睢水陴湖鎮三曲溝符離黃團臨渙有嵇山汴河肥水鎮三柳子蘄澤桐墟靈璧宋元祐元年置鎮一西固蘄有渙水渦水蘄水鎮一靜安泗州中防禦使宋臨淮郡正隆四年正月罷鳳翔府唐鄧潁蔡鞏洮等州幷膠西縣諸榷場但置榷場於泗州先隸山東西路大定六年來屬戶八千九十二縣四鎮六淮平舊盱眙縣明昌六年以宋有盱眙軍故更虹有朱山汴河淮水廣濟渠鎮二千仙通海臨淮鎮四安河吳城青陽翟家灣睢寧興定二年四月以宿遷縣之古城置又有淮濱興定二年四月以桃園置元光二年四月廢邊戍皇統元年十月都元帥宗弼與宋約以淮水中流為界西自鄧州南四十里西南四十里為界泰和八年設沿淮巡檢使及朐山縣完瀆村創立巡路置巡檢河北東路天會七年析河北為東西路各置本路兵馬都總管府一領節鎮二防禦一刺郡五縣三十鎮三十五河間府中總管府瀛海軍宋河間郡瀛海軍天會七年置總管府正隆間升為次府置瀛州瀛海軍節度使兼總管置轉運司後復置總管府河北東西大名等路提刑司產無縫綿滄鹽藺席馬藺花香附子錢鰕蟹乾魚戶三萬一千六百九十一縣二鎮三河間倚有滹沱河君子館鎮三束城永寧北林肅寧蠡州下刺史宋永寧軍國初因之天會七年陞為寧州博野郡軍天德三年更為蠡州戶二萬九千七百九十七縣一鎮一博野倚有沙河唐河鎮一新橋莫州下刺史宋文安郡軍防禦治任