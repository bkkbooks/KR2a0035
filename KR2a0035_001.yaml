body:
  text: 金史卷一本紀第一世紀金之先出靺鞨氏靺鞨本號勿吉勿吉古肅慎地也元魏時勿吉有七部曰粟末部曰伯咄部曰安車骨部曰拂涅部曰號室部曰黑水部曰白山部隋稱靺鞨而七部並同唐初有黑水靺鞨粟末靺鞨其五部無聞粟末靺鞨始附高麗姓大氏李績破高麗粟末靺鞨保東牟山後為渤海稱王傳十餘世有文字禮樂官府制度有五京十五府六十二州黑水靺鞨居肅慎地東瀕海南接高麗亦附于高麗嘗以兵十五萬衆助高麗拒唐太宗敗于安市開元中來朝置黑水府以部長為都督刺史置長史監之賜都督姓李氏名獻誠領黑水經略使其後渤海盛強黑水役屬之朝貢遂絶五代時契丹盡取渤海地而黑水靺鞨附屬于契丹其在南者籍契丹號熟女直其在北者不在契丹籍號生女直生女直地有混同江長白山混同江亦號黑龍江所謂白山黑水是也金之始祖諱函普初從高麗來年已六十餘矣兄阿古乃好佛留高麗不肯從曰後世子孫必有能相聚者吾不能去也獨與弟保活里俱始祖居完顏部僕幹水之涯保活里居耶懶其後胡十門以曷蘇館歸太祖自言其祖兄弟三人相別而去蓋自謂阿古乃之後石土門迪古乃保活里之裔也及太祖敗遼兵于境上獲耶律謝十乃使梁福斡答刺招諭渤海人曰女直渤海本同一家蓋其初皆勿吉之七部也始祖至完顏部居久之其部人嘗殺它族之人由是兩族交惡鬨鬬不能解完顏部人謂始祖曰若能為部人解此怨使兩族不相殺部有賢女年六十而未嫁當以相配仍為同部始祖曰諾乃自往諭之曰殺一人而鬬不解損傷益多曷若止誅首亂者一人部內以物納償汝可以無鬬而且獲利焉怨家從之乃為約曰凡有殺傷人者徵其家人口一馬十偶牸牛十黃金六兩與所殺傷之家即兩解不得私鬬曰謹如約女直之俗殺人償馬牛三十自此始既備償如約部衆信服之謝以青牛一並許歸六十之婦始祖乃以青牛為聘禮而納之並得其資産後生二男長曰烏魯次曰斡魯一女曰注思板遂為完顏部人天會十四年追諡景元皇帝廟號始祖皇統四年號其藏曰光陵五年增諡始祖懿憲景元皇帝子德帝諱烏魯天會十四年追諡德皇帝皇統四年號其藏曰熙陵五年增諡淵穆玄德皇帝子安帝諱跋海天會十四年追諡安皇帝皇統四年號其藏建陵五年增諡和靖慶安皇帝子獻祖諱綏可黑水舊俗無室廬負山水坎地梁木其上覆以土夏則出隨水草以居冬則入處其中遷徙不常獻祖乃徙居海古水耕墾樹藝始築室有棟宇之制人呼其地為納葛里納葛里者漢語居室也自此遂定居于安出虎水之側矣天會十四年追諡定昭皇帝廟號獻祖皇統四年號其藏曰輝陵五年增諡獻祖純烈定昭皇帝子昭祖諱石魯剛毅質直生女直無書契無約束不可檢制昭祖欲稍立條教諸父部人皆不悅欲坑殺之已被執叔父謝里忽知部衆將殺昭祖曰吾兄子賢人也必能承家安輯部衆此輩奈何輒欲坑殺之亟往彎弓注矢射於衆中劫執者皆散走昭祖乃得免昭祖稍以條教為治部落寖強遼以惕隱官之諸部猶以舊俗不肯用條教昭祖耀武至于青嶺白山順者撫之不從者討伐之入于蘇濱耶懶之地所至克捷還經僕燕水僕燕漢語惡瘡也昭祖惡其地名雖已困憊不肯止行至姑里甸得疾逮夜寢于村舍有盜至遂中夜啓行至逼剌紀村止焉是夕卒載柩而行遇賊於路奪柩去部衆追賊與戰復得柩加古部人蒲虎復來襲之垂及蒲虎問諸路人曰石魯柩去此幾何其人曰遠矣追之不及也蒲虎遂止於是乃得歸葬焉生女直之俗至昭祖時稍用條教民頗聽從尚未有文字無官府不知歲月晦朔是以年壽修短莫得而考焉天會十五年追諡成襄皇帝廟號昭祖皇統四年藏號安陵五年增諡昭祖武惠成襄皇帝子景祖諱烏古乃遼太平元年辛酉歲生自始祖至此已六世矣景祖稍役屬諸部自白山耶悔統門耶懶土骨論之屬以至五國之長皆聽命是時遼之邊民有逃而歸者及遼以兵徙鐵勒烏惹之民鐵勒烏惹多不肯徙亦逃而來歸遼使曷魯林牙將兵來索逋逃之民景祖恐遼兵深入盡得山川道路險易或將圖之乃以計止之曰兵若深入諸部必驚擾變生不測逋戶亦不可得非計也曷魯以為然遂止其軍與曷魯自行索之是時鄰部雖稍從孩懶水烏林答部石顯尚拒阻不服攻之不克景祖以計告於遼主遼主遣使責讓石顯石顯乃遣其子婆諸刊入朝遼主厚賜遣還其後石顯與婆諸刊入見遼主於春搜遼主乃留石顯於邊地而遣婆諸刊還所部景祖之謀也既而五國蒲聶部節度使拔乙門畔遼鷹路不通遼人將討之先遣同幹來諭旨景祖曰可以計取若用兵彼將走保險阻非歲月可平也遼人從之蓋景祖終畏遼兵之入其境也故自以為功於是景祖陽與拔乙門為好而以妻子為質襲而擒之獻於遼主遼主召見于寢殿燕賜加等以為生女直部族節度使遼人呼節度使為太師金人稱都太師者自此始遼主將刻印與之景祖不肯繫遼籍辭曰請俟他日遼主終欲與之遣使來景祖詭使部人揚言曰主公若受印繫籍部人必殺之用是以拒之遼使乃還既為節度使有官屬紀綱漸立矣生女直舊無鐵鄰國有以甲胄來鬻者傾資厚賈以與貿易亦令昆弟族人皆售之得鐵既多因之以修弓矢備器械兵勢稍振前後願附者衆斡泯水蒲察部泰神忒保水完顏部統門水溫迪痕部神隱水完顏部皆相繼來附景祖為人寬恕能容物平生不見喜慍推財與人分食解衣無所吝惜人或忤之亦不念先時有畔去者遣人諭誘之畔者曰汝主活羅也活羅吾能獲之吾豈能為活羅屈哉活羅漢語慈烏也北方有之狀如大雞善啄物見馬牛橐駝脊間有瘡啄其脊間食之馬牛輒死若飢不得食雖砂石亦食之景祖嗜酒好色飲啖過人時人呼曰活羅故彼以此訕之亦不以介意其後訕者力屈來降厚賜遣還曷懶水有率衆降者録其歲月姓名即遣去俾復其故人以此益信服之遼咸雍八年五國沒撚部謝野勃堇畔遼鷹路不通景祖伐之謝野來禦景祖被重鎧率衆力戰謝野兵敗走拔里邁濼時方十月冰忽解謝野不能軍衆皆潰去乃旋師道中遇逋亡要遮險阻晝夜拒戰比至部已憊即往見遼邊將達魯骨自陳敗謝野功行次來流水未見達魯骨疾作而復卒于家年五十四天會十四年追諡惠桓皇帝廟號景祖皇統四年藏號定陵五年增諡景祖英烈惠桓皇帝第二子襲節度使是為世祖諱劾里鉢生女直之俗生子年長即異居景祖九子元配唐括氏生劾者次世祖次劾孫次肅宗次穆宗及當異居景祖曰劾者柔和可治家務劾里鉢有器量智識何事不成劾孫亦柔善人耳乃命劾者與世祖同居劾孫與肅宗同居景祖卒世祖繼之世祖卒肅宗繼之肅宗卒穆宗繼之穆宗復傳世祖之子至於太祖竟登大位焉世祖遼重熙八年己卯歲生遼咸雍十年襲節度使景祖異母弟跋黑有異志世祖慮其為變加意事之不使將兵但為部長跋黑遂誘桓散達烏春窩謀罕為亂及間諸部使二于世祖世祖猶欲撫慰之語在跋黑桓等傳中世祖嘗買加古部鍛工烏不屯被甲九十烏春欲託此以為兵端世祖還其甲語在烏春傳部中有流言曰欲生則附於跋黑欲死則附於劾里鉢頗剌淑世祖聞之疑焉無以察之乃佯為具裝欲有所往者陰遣人揚言曰寇至部衆聞者莫知虛實有保於跋黑之室者有保於世祖之室者世祖乃盡得兄弟部屬向背彼此之情矣間數年烏春來攻世祖拒之時十月已半大雨纍晝夜冰澌覆地烏春不能進既而悔曰此天也乃引兵去烏春舍於阿里矮村滓不乃家而以兵圍其弟勝昆於胡不村兵退勝昆執其兄滓不乃而請涖殺于世祖且請免其孥戮從之桓散達亦舉兵遣肅宗拒之當是時烏春兵在北桓兵在南其勢甚盛戒之曰可和則與之和否則決戰肅宗兵敗會烏春以久雨解去世祖乃以偏師涉舍很水經貼割水覆桓散達之家明日大霧晦冥失道至婆多吐水乃覺即還至舍很貼割之間升高阜望之見六騎來大呼馳擊之世祖射一人斃生獲五人問之乃知卜灰撒骨出使助桓散達者也世祖至桓散達所居焚蕩其室家殺百許人舊將主保亦死之比世祖還與肅宗會肅宗兵又敗矣世祖讓肅宗失利之狀遣人議和桓散達曰以爾盈歌之大赤馬辭不失之紫騮馬與我我則和二馬皆女直名馬不許桓散達大會諸部來攻過裴滿部以其附於世祖也縱火焚之蒲察部沙秪勃堇胡補答勃堇使阿喜來告難世祖使之詭從以自全曰戰則以旗鼓自別世祖往禦桓之衆將行有報者曰跋黑食於愛妾之父家肉張咽死矣乃遣肅宗求援於遼遂率衆出使辭不失取海姑兄弟兵已而乃知海姑兄弟二於桓矣欲併取其衆徑至海姑偵者報曰敵已至將戰世祖戒辭不失曰汝先陳於脫豁改原待吾三揚旗三鳴鼓即棄旗決戰死生惟在今日命不足惜使裴滿胡喜牽大紫騮馬以為二馬馳至陳時桓散達盛強世祖軍吏未戰而懼皆植立無人色世祖陽陽如平常亦無責讓之言但令士卒解甲少憩以水沃面調水飲之有頃訓勵之軍勢復振乃避衆獨引穆宗執其手密與之言曰今日之事若勝則已萬一有不勝吾必無生汝今介馬遙觀勿預戰事若我死汝勿收吾骨勿顧戀親戚亟馳馬奔告汝兄頗剌淑于遼繫籍受印乞師以報此讎語畢袒袖不被甲以縕袍垂襴護前後心韔弓提劍三揚旗三鳴鼓棄旗搏戰身為軍鋒突入敵陳衆從之辭不失從後奮擊大敗之乘勝逐之自阿不彎至于北隘甸死者如仆麻破多吐水水為之赤棄車甲馬牛軍實盡獲之世祖曰今日之捷非天不能及此亦可以知足矣雖縱之去敗軍之氣沒世不振乃引軍還世祖視其戰地馳突成大路闊且三十隴手殺九人自相重積人皆異之桓散達自此不能復聚未幾各以其屬來降遼大安七年也初桓兄弟之變不术魯部卜灰蒲察部撒骨出助之至是招之不肯和卜灰之黨石魯遂殺卜灰來降撒骨出追躡亡者道傍人潛射之中口而死自是舊部悉歸景祖時斡勒部人杯乃來屬及是有他志會其家失火因以縱火誣歡都世祖徵償如約杯乃不自安遂結烏春窩謀罕舉兵使肅宗與戰敗之獲杯乃世祖獻之於遼臘醅麻産侵掠野居女直略來流水牧馬世祖擊之中四創久之疾愈臘醅等復略穆宗牧馬交結諸部世祖復伐之臘醅等紿降乃旋臘醅得姑里甸兵百十有七人據暮稜水守險石顯子婆諸刊亦在其中世祖圍而克之盡獲姑里甸兵麻産遁去遂擒臘醅及婆諸刊皆獻之遼既已復請之遼人與之並以前後所獻罪人歸之歡都大破烏春等於斜堆故石拔石皆就擒世祖自將與歡都合兵嶺東諸軍皆至是時烏春已前死窩謀罕請于遼願和解既與和復來襲乃進軍圍之窩謀罕棄城遁去破其城盡俘獲之以功差次分賜諸軍城始破議渠長生殺衆皆長跪遼使者在坐忽一人佩長刀突前咫尺謂世祖曰勿殺我遼使及左右皆走匿世祖色不少動執其人之手語之曰吾不殺汝也於是罰左右匿者曰汝等何敢失次耶罰既已乃徐使執突前者殺之其膽勇鎮物如此師還寢疾遂篤元娶拏懶氏哭不止世祖曰汝勿哭汝惟後我一歲耳肅宗請後事曰汝惟後我三年肅宗出謂人曰吾兄至此亦不與我好言乃叩地而哭俄呼穆宗謂曰烏雅束柔善若辦集契丹事阿骨打能之遼大安八年五月十五日卒襲位十九年年五十四明年拏懶氏卒又明年肅宗卒肅宗病篤歎曰我兄真多智哉世祖天性嚴重有智識一見必識暫聞不忘凝寒不縮栗動止不回顧每戰未嘗被甲先以夢兆候其勝負嘗乘醉騎驢入室中明日見驢足跡問而知之自是不復飲酒襲位之初內外潰叛締交為寇世祖乃因敗為功變弱為強既破桓散達烏春窩謀罕基業自此大矣天會十五年追諡聖肅皇帝廟號世祖皇統四年號其藏曰永陵五年增諡世祖神武聖肅皇帝母弟頗剌淑襲節度使景祖第四子也是為肅宗遼重熙十一年壬午歲生在父兄時號國相國相之稱不知始何時初雅達為國相雅達者桓散達之父也景祖以幣馬求之於雅達而命肅宗為之肅宗自幼機敏善辨當其兄時身居國相盡心匡輔是時叔父跋黑有異志及桓散達烏春窩謀罕石顯父子臘醅麻産作難用兵之際肅宗屢當一面尤能知遼人國政人情凡有遼事一切委之肅宗專心焉凡白事於遼官皆令遠跪陳辭譯者傳致之往往為譯者錯亂肅宗欲得自前委曲言之故先不以實告譯者譯者惑之不得已引之前使自言乃以草木瓦石為籌枚數其事而陳之官吏聽者皆愕然問其故則為卑辭以對曰鄙陋無文故如此官吏以為實然不復疑之是以所訴無不如意桓散達之戰部人賽罕死之其弟活羅陰懷忿怨一日忽以劍脊置肅宗項上曰吾兄為汝輩死矣剄汝以償則如之何久之因其兄柩至遂怒而攻習不出習不出走避之攻肅宗于家矢注次室之裙著于門扉復攻歡都歡都衷甲拒于室中既不能入持其門旃而去往附杯乃杯乃誘烏春兵度嶺世祖與遇于蘇素海甸世祖曰豫昔有異夢今不可親戰若左軍中有力戰者則大功成矣命肅宗及斜列辭不失與之戰肅宗下馬名呼世祖復自呼其名而言曰若天助我當為衆部長則今日之事神祇監之語畢再拜遂炷火束縕頃之大風自後起火益熾是時八月並青草皆焚之煙焰漲天我軍隨煙衝擊大敗之遂獲杯乃囚而獻諸遼並獲活羅肅宗釋其罪左右任使之後竟得其力焉大安八年自國相襲位是時麻産尚據直屋鎧水繕完營堡誘納亡命招之不聽遣康宗伐之太祖別軍取麻産家屬錡釜無遺既獲麻産殺之獻馘于遼陶溫水民來附二年癸酉遣太祖以偏師伐泥厖古部帥水抹離海村跋黑播立開平之自是寇賊皆息三年八月肅宗卒天會十五年追諡穆憲皇帝皇統四年藏號泰陵五年增諡肅宗明睿穆憲皇帝母弟穆宗諱盈歌字烏魯完景祖第五子也南人稱揚割太師又曰揚割追諡孝平皇帝號穆宗又曰揚割號仁祖金代無號仁祖者穆宗諱盈歌諡孝平盈近揚歌近割南北音訛遼人呼節度使為太師自景祖至太祖皆有是稱凡叢言松漠記張棣金志等書皆無足取穆宗遼重熙二十二年癸巳歲生肅宗時擒麻産遼命穆宗為詳穩大安十年甲戌襲節度使年四十二以兄劾者子撒改為國相三年丙子唐括部跋葛勃堇與溫都部人跋忒有舊跋葛以事往跋忒殺跋葛使太祖率師伐跋忒跋忒亡去追及殺之星顯水紇石烈部阿踈毛睹祿阻兵為難穆宗自將伐阿踈撒改以偏師攻鈍恩城拔之阿踈初聞來伐乃自訴于遼遂留劾者守阿踈城穆宗乃還會陶溫水徒籠古水紇石烈部阿閣版及石魯阻五國鷹路執殺遼捕鷹使者遼詔穆宗討之阿閣版等據險立柵方大寒乃募善射者操徑弓利矢攻之數日入其城出遼使存者數人俾之歸統門渾蠢水之交烏古論部留可詐都與蘇濱水烏古論敵庫德起兵于米里迷石罕城納根涅之子鈍恩亦亡去於是兩黨作難八月撒改為都統辭不失阿里合悶斡帶副之以伐留可詐都塢塔等謾都訶石土門伐敵庫德撒改欲先平邊地城堡或欲先取留可莫能決乃命太祖往鈍恩將援留可乘謾都訶兵未集而攻之石土門軍既與謾都訶會迎擊鈍恩大敗之降米里迷石罕城獲鈍恩敵庫德釋弗殺太祖度盆搦嶺與撒改會攻破留可城留可已先往遼矣盡殺其城中渠長還圍塢塔城塢塔先已亡在外城降於軍詐都亦降於蒲家奴於是撫寧諸路如舊時太祖因致穆宗教統門渾蠢耶悔星顯四路及嶺東諸部自今勿復稱都部長命勝管醜阿等撫定乙離骨嶺注阿門水之西諸部居民又命斡帶及偏裨悉平二涅囊虎二蠢出等路寇盜而還七年庚辰劾者尚守阿踈城毛睹祿來降阿踈猶在遼遼使使來罷兵未到穆宗使烏林答石魯往佐劾者戒之曰遼使來罷兵但換我軍衣服旗幟與阿踈城中無辨勿令遼使知之因戒劾者曰遼使可以計却勿聽其言遽罷兵也遼使果來罷兵穆宗使蒲察部胡魯勃堇邈遜孛堇與俱至阿踈城劾者見遼使詭謂胡魯邈遜曰我部族自相攻擊干汝等何事誰識汝之太師乃援創刺殺胡魯邈遜所乘馬遼使驚駭遽走不敢回顧徑歸居數日破其城狄故保還自遼在城中執而殺之阿踈復訴於遼遼遣奚節度使乙烈來穆宗至來流水興和村見乙烈問阿踈城事命穆宗曰凡攻城所獲存者復與之不存者備償且徵馬數百匹穆宗與僚佐謀曰若償阿踈則諸部不復可號令任使也乃令主隈禿答兩水之民陽為阻絶鷹路復使鱉故德部節度使言于遼曰欲開鷹路非生女直節度使不可遼不知其為穆宗謀也信之命穆宗討阻絶鷹路者而阿踈城事遂止穆宗聲言平鷹路畋於土溫水而歸是歲留可來降八年辛巳遼使使持賜物來賞平鷹路之有功者九年壬午使蒲家奴以遼賜給主隈禿答之民且修鷹路而歸冬蕭海里叛入于係案女直阿典部遣其族人斡達剌來結和曰願與太師為友同往伐遼穆宗執斡達剌會遼命穆宗捕討海里穆宗送斡達剌于遼募軍得甲千餘女直甲兵之數始見于此蓋未嘗滿千也軍次混同水蕭海里再使人來復執之既而與海里遇海里遙問曰我使者安在對曰與後人偕來海里不信是時遼追海里兵數千人攻之不能克穆宗謂遼將曰退爾軍我當獨取海里遼將許之太祖策馬突戰流矢中海里首海里墮馬下執而殺之大破其軍使阿離合悶獻馘于遼金人自此知遼兵之易與也是役也康宗最先登於是以先登並有功者為前行次以諸軍護俘獲歸所部穆宗朝遼主于漁所大被嘉賞授以使相錫豫加等十年癸未二月穆宗還遼使使授從破海里者官賞高麗始來通好十月二十九日穆宗卒年五十有一初諸部各有信牌穆宗用太祖議擅置牌號者置于法自是號令乃一民聽不疑矣自景祖以來兩世四主志業相因卒定離析一切治以本部法令東南至于乙離骨曷懶耶懶土骨論東北至于五國主隈禿答金蓋盛于此天會十五年追諡孝平皇帝廟號穆宗皇統四年號其藏曰獻陵五年增諡章順孝平皇帝兄子康宗諱烏雅束字毛路完世祖長子也遼清寧七年辛丑歲生乾統三年癸未襲節度使年四十三穆宗末年阿踈使達紀誘扇邊民曷懶甸人執送之穆宗使石適歡撫納曷懶甸未行穆宗卒至是遣焉先是高麗通好既而頗有隙高麗使來請議事使者至高麗拒而不納五水之民附于高麗執團練使十四人語在高麗傳中二年甲申高麗再來伐石適歡再破之高麗復請和前所執團練十四人皆遣歸石適歡撫定邊民而還蘇濱水民不聽命使斡帶等至活羅海川召諸官僚告諭之含國部蘇濱水居斡豁勃堇不至斡准部職德部既至復亡去塢塔遇二部於馬紀嶺執之而來遂伐斡豁克之斡帶進至北琴海攻拔泓忒城乃還四年丙戌高麗遣黑歡方石來賀襲位遣杯魯報之高麗約還諸亡在彼者乃使阿聒勝昆往受之高麗背約殺二使築九城於曷懶甸以兵數萬來攻斡賽敗之斡魯亦築九城與高麗九城相對高麗復來攻斡賽復敗之高麗約以還逋逃之人退九城之軍復所侵故地九月乃罷兵七年己丑歲不登減盜賊徵償振貧乏者十一年癸巳康宗卒年五十三天會十五年追諡恭簡皇帝皇統四年號其藏曰喬陵五年增諡康宗獻敏恭簡皇帝贊曰金之厥初兄弟三人亦微矣熙宗追帝祖宗定著始祖景祖世祖廟世世不祧始祖娶六十之婦而生二男一女豈非天耶景祖不受遼籍遼印取雅達國相以與其子世祖既破桓散達遼政日衰而以太祖屬之穆宗其思慮豈不深遠矣夫
