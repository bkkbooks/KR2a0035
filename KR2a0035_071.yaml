body:
  text: 金史卷七十一列傳第九斡魯斡魯古勃堇婆盧火吾扎忽闍母宗本名德壽斡魯韓國公劾者第三子康宗初蘇濱水含國部斡豁勃堇及斡準職德二部有異志斡帶治之斡賽斡魯為之佐遂伐斡豁拔其城以歸高麗築九城於曷懶甸斡賽母疾病斡魯代將其兵者數月斡魯亦對築九城與高麗抗出則戰入則守斡賽用之卒城高麗收國二年四月詔斡魯統諸軍與闍母蒲察迪古乃合咸州路都統斡魯古等伐高永昌詔曰永昌誘脅戍卒竊據一方直投其隙而取之耳此非有遠大計其亡可立而待也東京渤海人德我舊矣易為招懷如其不從即議進討無事多殺高永昌渤海人在遼為裨將以兵三千屯東京八甔口永昌見遼政日敗太祖起兵遼人不能支遂覬覦非常是時東京漢人與渤海人有怨而多殺渤海人永昌乃誘諸渤海并其戍卒入據東京旬月之間遠近響應有兵八千人遂僭稱帝改元隆基遼人討之久不能克永昌使撻不野杓合以幣求救於太祖且曰願併力以取遼太祖使胡沙補往諭之曰同力取遼固可東京近地汝輒據之以僭大號可乎若能歸款當處以王爵仍遣係遼籍女直胡突古來高永昌使撻不野與胡沙補胡突古偕來而永昌表辭不遜且請還所俘渤海人太祖留胡突古不遣遣大藥師奴與撻不野往招諭之斡魯方趨東京遼兵六萬來攻照散城阿徒罕勃堇烏論石準與戰於益褪之地大破之五月斡魯與遼軍遇於瀋州敗之進攻瀋州取之永昌聞取瀋州大懼使家奴鐸剌以金印一銀牌五十來願去名號稱藩斡魯使胡沙補撒八往報之會渤海高楨降言永昌非真降者特以緩師耳斡魯進兵永昌遂殺胡沙補等率衆來拒遇于沃里活水我軍既軍既濟永昌之軍不戰而却逐北至東京城下明日永昌盡率其衆來戰復大敗之遂以五千騎奔長松島初太祖下寧江州獲東京渤海人皆釋之往往中道亡去諸將請殺之太祖曰既以克敵下城何為多殺昔先太師嘗破敵獲百餘人釋之皆亡去既而往往招其部人來降今此輩亡後日當有效用者至是東京人恩勝奴仙哥等執永昌妻子以城降即寧江州所釋東京渤海人也先太師蓋謂世祖云未幾撻不野執永昌及鐸剌以獻皆殺之於是遼之南路係籍女直及東京州縣盡降以斡魯為南路都統迭勃極烈留烏蠢知東京事詔除遼法省賦稅置猛安謀克一如本朝之制九月斡魯上謁于婆魯買水上慰勞之辛亥幸斡魯第張宴官屬皆預賜賚有差燭偎水部實里古達殺酬斡僕忽得斡魯分胡剌古烏蠢之兵討之酬斡宗室子魁偉善戰年十五隸軍中多見任用以兵五百敗室韋獲其民衆及招降燭偎水部以功為謀克僕忽得初事撒改從討蕭海里降燭偎水部領行軍千戶從破黃龍府戰達魯古城皆有功其破寧江州渤海乙塞補叛去僕忽得追復之至是與酬斡同被害斡魯至石里罕河實里古達遁去追及于合撻剌山誅其首惡四人撫定餘衆詔曰汝討平叛亂不勞師衆朕甚嘉之酬斡等死於國事聞其尸棄于河俟冰釋必求以葬其民可三百戶為一謀克以衆所推服者領之仍以其子弟等為質斡魯乃還天眷中酬斡贈奉國上將軍僕忽得贈昭義大將軍斡魯從都統襲遼主遼主西走西京已降復叛敵據城西浮圖下射攻城者斡魯與鶻巴魯攻浮圖奪之復以精鋭乘浮圖下射城中遂破西京夏國王使李良輔將兵三萬來救遼次于天德之境婁室與斡魯合軍擊敗之追至野谷殺數千人夏人渡澗水水暴至漂溺者不可勝計遼主在陰山青冢之間斡魯為西南路都統往襲之使勃剌淑撒曷悶以兵二百襲遼權六院司喝離質於白水濼獲之遼主留輜重於青冢領兵一萬往應州遣照里背答各率兵邀之宗望奄至遼主營盡俘其妻子宗族得其傳國璽斡魯使使奏捷曰賴陛下威靈屢敗敵兵遼主無歸勢必來降已嚴戒鄰境毋納宋人合饋軍糧令銀术可往代州受之詔遍諭有功將士俟朕至彼當次第推賞遼主戚屬勿去其輿帳善撫存之遼主伶俜去國懷悲負恥恐隕其命孽雖自作而嘗居大位深所不忍如招之肯來以其宗族付之已遣楊璞徵糧於宋銀术可不須往矣遼趙王習泥烈及諸官吏並釋其罪且撫慰之太祖還京師宗翰為西北西南兩路都統斡魯及蒲家奴副之宗翰朝京師詔以夏人言宋侵略新割地以便宜決之斡魯奏曰夏人不盡歸戶口資帑又以宋人侵賜地求援兵宋之邊臣將取所賜夏人疆土蓋有異圖詔曰夏人屢求援兵者或不欲歸我戶口沮吾追襲遼主事也宋人敢言自取疆土于夏誠有異圖宜謹守備盡索在夏戶口通聞兩國事審處之斡魯復請弗割山西與宋則遼主不能與宋郭藥師交通復詔曰宗翰請毋與宋山西地卿復及此疆埸之事當慎毋忽及宗翰等伐宋斡魯行西南西北兩路都統事天會五年薨皇統五年追封鄭國王天德二年配享太祖廟廷子撒八銀青光祿大夫子賽里斡魯古勃堇宗室子也太祖伐遼使斡魯古阿魯撫諭斡忽急賽兩路係遼女直與遼節度使撻不也戰敗之斬撻不也酷輦嶺阿魯臺罕等十四太彎皆降斡忽急賽兩路亦降與遼都統實婁戰于咸州西敗之斬實婁于陳與婁室克咸州滿忽吐以所部降于斡魯古鄰部戶七千亦來歸遂與遼將喝補戰破其軍數萬人太祖嘉之以為咸州軍帥斡魯伐高永昌于東京斡魯古以咸州軍佐之遼秦晉國王耶律捏里來伐迪古乃婁室婆盧火等將二萬衆合斡魯古咸州兵往擊之胡突古嘗叛入于遼居于東京高永昌據東京太祖索之以歸斡魯古伐永昌以便宜署胡突古為千戶散都魯訛魯補皆無功亦以便宜除官及以便宜解權謀克斛拔魯黃哥達及保等職皆非其罪太祖聞之盡復斛拔魯等謀克胡突古等皆罷去太祖聞斡魯古軍中往往闕馬而官馬多匿於私家遂檢括之耶律捏里佛頂遺斡魯古書請和斡魯古以捏里書並所答書來上且請曰復有書問宜如何報之詔曰若彼再來請和汝當以阿疏等叛亡索而不獲至於交兵我行人賽剌亦不遣還若歸賽剌及送阿疏等則和好之議方敢奏聞仍恐議和非實無失備禦耶律捏里軍蒺藜山斡魯古以兵一萬戍東京太祖使迪古乃婁室復以兵一萬益之詔曰遼主失道肆命徂征惟爾將士當體朕意拒命者討之服者撫安之毋貪俘掠毋肆殺戮所賜捏里詔書可傳致也詔捏里曰汝等誠欲請和當廢黜昏主擇立賢者副朕弔伐之意然後可議和約不然當盡並爾國其審圖之捏里復書斡魯古云降去人痕孛見還則當送阿疏等上曰痕孛等乃交兵之後來降阿疏則平日以罪亡去其事特異復詔捏里令此月十三日送阿疏至顯州各遣重臣議疆埸事斡魯古等攻顯州知東京事完顏斡論以兵來會即以兵三千先渡遼水得降戶千餘遂薄顯州郭藥師乘來襲斡論擊走之斡魯古等遂與捏里等戰于蒺藜山大敗遼兵追北至阿里真陂獲佛頂家屬遂圍顯州攻其城西南軍士神篤踰城先入燒其佛寺煙焰撲人守陴者不能立諸軍乘之遂拔顯州於是乾懿豪徽成川惠等州皆降乾州後為閭陽縣遼諸陵多在此禁無所犯徙成川州人于同銀二州居之捏里再以書來請和斡魯古承前詔以阿疏為言答之駐軍顯州以聽命賜斡魯古等馬十匹詔曰汝等力摧大敵攻下諸城朕甚嘉之遼主未獲人心易搖不可恃戰勝而失備禦遼雙州節度使張崇降斡魯古以便宜命復其職仍令世襲斡魯古久在咸州多立功亦多自恣劾里保雙古等告斡魯古不法事遼帝在中京可追襲而不追襲咸州糧草豐足而奏數不以實攻顯州獲生口財畜多自取捏里孛剌束等亦告孛堇瞢葛麻吉窩論赤閏阿剌本乙剌等多取生口財畜遂以闍哥代為咸州路都統闍哥亦宗室子也既代斡魯古治咸州初迪古乃婁室奏攻顯州新降附之民可遷其富者于咸州路其貧者徙內地於是詔使闍哥擇其才可幹事者授之謀克其豪右誠心歸附者擬為猛安録其姓名以聞飢貧之民官賑給之而使闍母為其副統云久之遼通祺雙遼四州之民八百餘家詣咸州都統降上曰遼人賦斂無度民不堪命相率求生不可使失望分置諸部擇善地以處之太祖召斡魯古自問之斡魯古引伏闍哥鞫窩論等詔降斡魯古為謀克而禁錮窩論等天輔六年討賊于牛心山道病卒天眷中贈特進天德二年配享太祖廟廷大定十五年諡莊翼婆盧火安帝五代孫太祖伐遼使婆盧火徵迪古乃兵失期杖之後與渾黜以四千人往助婁室銀术哥攻黃龍府辭勒罕轍孛得兄弟直里部人嘗寇耶懶路穆宗遣婆盧火討之至阿里門河辭勒罕偽降遂略馬畜三百而去復掠兀勒部二十五寨太祖復使婆盧火討之婆盧火渡蘇袞河招降旁近諸部因籍丁壯為軍至特滕吳水轍孛得偽降復叛去執而殺之婆盧火至特鄰城圍之辭勒罕遁去婆盧火破其城執其妻子辭勒罕遂降曰我之馬牛財貨盡矣何以為生婆盧火與之馬十匹直里部産良馬太祖使紇石烈阿習罕掌其畜牧婆盧火及子婆速俱為謀克天輔五年摘取諸路猛安中萬餘家屯田于泰州婆盧火為都統賜耕牛五十婆盧火舊居按出虎水自是徙居泰州而遣拾得查端阿里徒歡奚撻罕等俱徙焉唯族子撒剌喝嘗為世祖養子獨得不徙太祖取燕京婆盧火為右翼兵出居庸關大敗遼兵遂取居庸蕭妃遁去都監高六等來送款乞降習古乃追蕭妃至古北口蕭妃已過三日不及而還上令婆盧火胡實賚率輕騎追之蕭妃已遠去獲其從官統軍察剌宣徽查剌並其家族及銀牌二印十有一及迭剌叛婆盧火石古乃討平之其羣官率衆降者就使領其所部太宗以空名宣頭及銀牌給之同時有婆盧火者婁室平陝西婆盧火繩果監戰後為平陽尹西南路招討使終於慶陽尹泰州婆盧火守邊屢有功太宗賜衣一襲並賜其子剖叔八年以甲胄賜所部諸謀克天會十三年加同中書門下平章事天眷元年駐烏骨迪烈地薨贈開府儀同三司諡剛毅子剖叔襲猛安天眷二年為泰州副都統子斡帶廣威將軍婆速官特進子吾扎忽吾扎忽善騎射年二十以本班祗候郎君都管從征伐有功授修武校尉皇統二年權領泰州軍平陝西至涇州大破宋兵於馬西鎮超遷寧遠大將軍襲猛安復以本部軍從宗弼權都統正隆末從海陵伐宋契丹反與德昌軍節度使移室悶同討契丹許以便宜從事大定初除咸平尹駐軍泰州俄改臨潢尹攝元帥左都監與廣寧尹僕散渾坦俱從元帥右都監神土悶解臨潢之圍契丹引衆東行吾扎忽追及于窊歷山押軍猛安契丹忽剌叔以所部助敵攻官軍官軍失利泰州節度使烏里雅來救未至臨潢與敵遇烏里雅敗僅以數騎脫歸敵攻泰州其勢大振城中震駭將士不敢出戰敵四面登城押軍猛安烏古孫阿里補率軍士數人持刀循城應敵力戰斫刈甚衆敵乃退泰州得完吾扎忽乃使謀克蒲盧渾徙百姓旁邑及險厄之地以俟大軍明年聚甲士萬三千於濟州會元帥謀衍敗窩斡於長濼戰霿河戰陷泉皆有功改胡里改節度使卒吾扎忽性聰敏有才智善用軍常出敵之不意故能以寡敵衆而所往無不克號為鶻軍云闍母世祖第十一子太祖異母弟也高永昌據東京斡魯往伐之闍母等為之佐已克瀋州城中出奔者闍母邀擊殆盡與永昌隔沃里活水衆遇淖不敢進闍母以所部先濟諸軍畢濟軍東京城下城中人出城來戰闍母破之于首山殲其衆獲馬五百匹及斡魯古以罪去咸州闍母代之於是闍母為咸州路副統遼議和久不成太祖進兵詔咸州路都統司令斜葛留兵一千鎮守闍母以餘兵會于渾河太祖攻上京實臨潢府諭之不下遼人恃儲蓄自固上親臨陳闍母以衆先登克其外城留守撻不野率衆出降都統杲兵至中京闍母自城西沿土河以進城中兵尚餘三千皆不能守遂克之宗翰等攻西京闍母婁室等於城東為木洞以捍蔽矢石於北隅以芻茭塞其隍城中出兵萬餘將燒之溫迪罕蒲匣率衆力戰執旗者被創蒲匣自執旗奮擊却之又為四輪革車高出於堞闍母與麾下乘車先登諸軍繼之遂克西京與遼步騎五千戰于朔州之境斬首三百級復敗遼騎三百于河陰遼兵五千屯于馬邑縣南復擊破之隳其營壘盡得其車馬器械遼兵三萬列營于西京之西闍母以三千擊之闍母使士卒皆去馬陳於溝塹之間曰以一擊十不致之死地不可使戰也謂衆曰若不勝敵不可以求生於是人皆殊死戰遼兵遂敗追至其營而止明日復敗其兵七百餘人興中府宜州復叛闍母討之並下詔招諭詔闍母曰遼之土地皆為我有彼雖復叛終皆吾民可縱其耕稼毋得侵掠勃堇蒙刮斜鉢吾撻等獲契丹九斤興中平闍母為南路都統討回離保詔曰回離保以烏合之衆保據險阻其勢必將自斃若彼不出掠毋庸攻討耶律奧古哲等殺回離保于景薊之間其衆遂潰張覺據平州叛入于宋闍母自錦州往討之覺將以兵脅遷來潤隰四州之民闍母至潤州擊走張覺軍逐北至榆關遣俘持書招之復敗覺兵於營州東北欲乘勝進取南京時方暑雨退屯海壖逐水草休息使僕虺蒙刮兩猛安屯潤州制未降州縣不得與覺交通九月闍母破覺將王孝古於新安敗覺軍於樓峯口復與覺戰於兔耳山闍母大敗太宗使宗望問闍母敗軍之狀宗望遂以闍母軍討覺及宗望破張覺太宗乃赦闍母召宗望赴闕闍母連破偽都統張敦固遂克南京執敦固殺之上遣使迎勞之詔曰聞下南京撫定兵民甚善諸軍之賞卿差等以給之又詔曰南京疆埸如舊屯兵以鎮之命有司運米五萬石于廣寧給南京潤州戍卒遂下宜州拔叉牙山殺其節度使韓慶民得糧五千石詔以南路歲飢許田獵其後宋童貫郭藥師治兵闍母輒因降人知之即具奏語在宋事中而宗翰宗望皆請伐宋於是闍母副宗望伐宋宗望以闍母屬尊先皇帝任使有功請以為都統己監戰事於是闍母為都統掃喝副之敗郭藥師兵于白河遂降燕山以先鋒渡河圍汴宋人請盟將士分屯于安肅雄霸廣信之境宗望還山西闍母與劉彥宗留燕京節制諸軍八月復伐宋大軍克汴州諸軍屯于城上城中諸軍潰而西出者十三萬人闍母撻懶分擊大敗之師還闍母為元帥左都監攻河間下之大破敵兵萬餘於莫州宗輔為右副元帥徇地淄青闍母與宗弼分兵破山谷諸屯宋李成兵圍淄州烏林答泰欲破之闍母克濰州迪古補术烈速連破趙子昉等兵至于河上烏林答泰欲破敵于靈城鎮及議伐康王闍母欲先定河北然後進討太宗乃酌取羣議之中使婁室取陝西宗翰宗輔南伐天會七年薨年四十熙宗時追封吳國王天德二年配享太祖廟廷正隆改封談王大定二年徙封魯王諡莊襄子宗宗本名德壽闍母第四子也奇偉有大志喜談兵天德二年充護衛授武義將軍明年授世襲謀克擢御院通進遷翰林待制兼修起居注轉國子司業兼左補闕正隆初轉符寶郎在宮職凡五年皆帶劍押領宿衛遷大宗正丞以母憂去官以本官起復未幾遷侍衛親軍馬軍都指揮使改左驍騎都指揮使明年海陵幸南京宗至汴契丹撒八反宗為咸平尹兼本路兵馬都總管以甲仗四千付之許以便宜宗出松亭關取牛遞于廣寧聞世宗即位將歸之廣寧尹按答海弟燕京勸宗乃還興中白彥敬紇石烈志寧使宗奉表降宗見世宗於梁魚務授寧昌軍節度使明年二月契丹攻寧昌宗止有女直渤海騎兵三十漢兵百二十人自將擊之遇賊千餘騎漢兵皆散走宗與女直渤海三十騎盡鋭力戰身被二創所乘馬中箭而仆遂為所執居百餘日會賊中有臨潢民移剌阿塔等盜馬授之得脫歸宗陷賊久盡得其虛實見元帥完顏謀衍平章政事完顏元宜謂之曰賊衆烏合無紀律破之易耳於是帥府欲授軍職宗見謀衍貪鹵掠失事機欲歸白上不肯受職曰我有機密須面奏是夕乃遁去至廣寧矯取驛馬馳至京師而帥府先事以聞上遣中使詰之曰汝為節度不度衆寡戰敗被獲幸得脫歸乃拒帥府命輒自乘傳赴都朕姑置汝罪可速還軍併力破賊宗附奏曰臣非辭難者事須面奏不得不來遂召入乃條奏賊中虛實及諸軍進退不合事機狀詔大臣議皆以其言為然是時已詔僕散忠義代謀衍為元帥進討於是拜宗為兵部尚書以本職領右翼都統率宗寧烏延查剌烏林答剌撒兵各千人號三萬佐忠義軍至花道遇賊與戰左翼都統宗亨先敗走忠義亦引却宗勒本部遮擊之麾帳下士三百捨馬步戰賊不得逞大軍整列復至合勢擊之賊遂敗去而元帥右監軍紇石烈志寧率軍至追及窩斡於陷泉大破之復與志寧及徒單克寧追至七渡河復大敗之元帥忠義遂留宗自從賊平入為右宣徽使宋兵據海州將謀深入詔以宗為元帥右監軍往禦之宗駐山東分兵據守要害敵不得西尋奉詔與左副元帥紇石烈志寧參議軍事四年宗入朝奏曰暑月在近頓兵邊陲飛挽頗艱乞俟秋涼進發上從其請及還軍授以成算賜襲衣弓矢九月渡淮宗出唐鄧比至襄陽屢戰皆捷明年宋人請和軍還除河南路統軍使河決李固渡分流曹單之間詔遣都水監梁肅視河決宗言河道填淤不受水故有決溢之患今欲河復故道卒難成功幸而可塞它日不免決溢山東非曹單比也沿河數州驟興大役人心動搖恐宋人乘間扇誘構為邊患梁肅亦請聽兩河分流以殺水勢遂止不塞十年召至京師拜參知政事上曰卿奏黃河利害甚合朕意朕念百姓差調官吏為姦率斂星火所費倍蓰委積經年腐朽不可復用若此等類百孔千瘡百姓何以堪之卿參朝政擇利而行以副朕心及與上論南邊事宗曰南人遣諜來多得我事情我遣諜人多不得其實蓋彼以厚賞故也上曰彼以厚利資諜人徒費其財何能為也十一年奉詔巡邊六月至軍中將戰有疾詔以右丞相紇石烈志寧代宗還七月病甚遺表朝政得失及邊防利害力疾使其子上之薨年四十六上見其遺表傷悼不已輟朝遣宣徽使敬嗣暉致祭賻銀千兩綵四十端絹四百匹上謂宰臣曰宗勤勞國家他人不能及也初宗嘗請募貧民戍邊屯田給以廩粟既貧者無艱食之患而富家免更代之勞得專農業上善其言而未行也十七年上謂宰臣曰戍邊之卒歲冒寒暑往來番休以馬牛往戍往往皆死且奪其農時敗其生業朕甚閔之朕欲使百姓安于田里而邊圉強固卿等何術可以致此左丞相良弼曰邊地不堪耕種不能久戍所以番代耳上曰卿等以此急務為末事耶往歲參政宗嘗為朕言此事若宗可謂盡心於國者矣今以兩路招討司烏古里石壘部族臨潢泰州等路分置堡戍詳定以聞朕將親覽上追念宗敘聞其子孫家用不給詔賜錢三千貫明昌五年配享世宗廟廷
