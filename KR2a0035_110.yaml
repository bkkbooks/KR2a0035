body:
  text: 金史卷一百十列傳第四十八楊雲翼趙秉文韓玉馮璧李獻甫雷淵程震楊雲翼字之美其先贊皇檀山人六代祖忠客平定之樂平縣遂家焉曾祖青祖郁考皆贈官于朝雲翼天資穎悟初學語輒畫地作字日誦數千言登明昌五年進士第一詞賦亦中乙科特授承務郎應奉翰林文字承安四年出為陝西東路兵馬都總管判官泰和元年召為太學博士遷太常寺丞兼翰林修撰七年簽上京東京等路按察司事因召見章宗咨以當世之務稱旨大安元年翰林承旨張行簡薦其材且精術數召授提點司天臺兼翰林修撰俄兼禮部郎中崇慶元年以病歸貞祐二年有司上官簿宣宗閱之記其姓名起授前職兼吏部郎中三年轉禮部侍郎兼提點司天臺四年大元及西夏兵入鄜延潼關失守朝議以兵部尚書蒲察阿里不孫為副元帥以禦之雲翼言其人言浮於實必誤大事不聽後果敗興定元年六月遷翰林侍講學士兼修國史知集賢院事兼前職詔曰官制入三品者例外除以卿遇事敢言議論忠讜故特留之時右丞相高琪當國人有請榷油者高琪主之甚力詔集百官議戶部尚書高夔等二十六人同聲曰可雲翼獨與趙秉文時戩等數人以為不可議遂格高琪後以事譴之雲翼不卹也二年拜禮部尚書兼職如故三年築京師子城役兵民數萬夏秋之交病者相籍雲翼提舉醫藥躬自調護多所全濟四年改吏部尚書凡軍興以來入粟補官及以戰功遷授者事定之後有司苛為程式或小有不合輒罷去雲翼奏曰賞罰國之大信此輩宜從寬錄以勸將來是年九月上召雲翼及戶部尚書夔翰林學士秉文於內殿皆賜坐問以講和之策或以力戰為言上俯首不樂雲翼徐以孟子事大事小之說解之且曰今日奚計哉使生靈息肩則社稷之福也上色乃和十一月改御史中丞宗室承立權參知政事行尚書省事於京兆大臣言其不法詔雲翼就鞫之獄成廷奏曰承立所坐皆細事不足問向大兵掠平涼以西數州皆破承立坐擁強兵瞻望不進鄜延帥臣完顏合達以孤城當兵衝屢立戰績其功如此而承立之罪如彼願陛下明其功罪以誅賞之則天下知所勸懲矣自餘小失何足追咎承立由是免官合達遂掌機務哀宗即位首命雲翼攝太常卿尋拜翰林學士正大二年二月復為禮部尚書兼侍讀詔集百官議省費雲翼曰省費事小戶部司農足以辦之樞密專制軍政蔑視尚書尚書出政之地政無大小皆當總領今軍旅大事社稷繫焉宰相乃不得預聞欲使利病兩不相蔽得乎上嘉納之明年設益政院雲翼為選首每召見賜坐而不名時講尚書雲翼為言帝王之學不必如經生分章析句但知為國大綱足矣因舉任賢去邪與治同道與亂同事有言逆於汝心有言遜於汝志等數條一皆本於正心誠意敷繹詳明上聽忘倦尋進龜鑑萬年錄聖學聖孝之類凡二十篇當時朝士廷議之際多不盡言顧望依違寖以成俗一日經筵畢因言人臣有事君之禮有事君之義禮不敢齒君之路馬蹴其芻者有罰入君門則趨見君之几杖則起君命召不俟駕而行受命不宿於家是皆事君之禮人臣所當盡者也然國家之利害生民之休戚一一陳之則向所謂禮者特虛器耳君曰可而有否者獻其否君曰否而有可者獻其可言有不從雖引裾折檻斷鞅軔輪有不恤焉者當是時也姑徇事君之虛禮而不知事君之大義國家何賴焉上變色曰非卿朕不聞此言雲翼嘗患風痺至是稍愈上親問愈之之方對曰但治心耳心和則邪氣不干治國亦然人君先正其心則朝廷百官莫不一於正矣上矍然知其為醫諫也夏人既通好遣其徽猷閣學士李弁來議互市往返不能決朝廷以雲翼往議乃定五年卒年五十有九諡文獻雲翼天性雅重自律甚嚴其待人則寬與人交分一定死生禍福不少變其於國家之事知無不言貞祐中主兵者不能外禦而欲取償於宋故頻歲南伐有言之者不謂之與宋為地則疑與之有謀至於宰執他事無不言者獨南伐則一語不敢及雲翼乃建言曰國家之慮不在於未得淮南之前而在於既得淮南之後蓋淮南平則江之北盡為戰地進而爭利於舟楫之間恐勁弓良馬有不得騁者矣彼若扼江為屯潛師於淮以斷饟道或決水以瀦淮南之地則我軍何以善其後乎及時全倡議南伐宣宗以問朝臣雲翼曰朝臣率皆諛辭天下有治有亂國勢有弱有強今但言治而不言亂言強而不言弱言勝而不言負此議論所以偏也臣請兩言之夫將有事於宋者非貪其土地也第恐西北有警而南又綴之則我三面受敵矣故欲我師乘勢先動以阻其進借使宋人失淮且不敢來此戰勝之利也就如所料其利猶未可必然彼江之南其地尚廣雖無淮南豈不能集數萬之衆伺我有警而出師耶戰而勝且如此如不勝害將若何且我以騎當彼之步理宜萬全臣猶恐其有不敢恃者蓋今之事勢與泰和不同泰和以冬征今我以夏往此天時之不同也冬則水涸而陸多夏則水潦而塗淖此地利之不同也泰和舉天下全力驅辤軍以為前鋒今能之乎此人事之不同也議者徒見泰和之易而不知今日之難請以夏人觀之向日弓箭手之在西邊者一遇敵則搏而戰袒而射彼已奔北之不暇今乃陷吾城而虜守臣敗吾軍而禽主將曩則畏我如彼今則侮我如此夫以夏人既非前日奈何以宋人獨如前日哉願陛下思其勝之之利又思敗之之害無悅甘言無貽後悔章奏不報時全果大敗於淮上一軍全沒宣宗責諸將曰當使我何面目見楊雲翼耶河朔民十有一人為游騎所迫泅河而南有司論罪當死雲翼曰法所重私渡者防姦偽也今平民為兵所迫奔入於河為逭死之計耳今使不死於敵而死於法後惟從敵而已宣宗悟盡釋之哀宗以河南旱詔遣官理寃獄而不及陝西雲翼言天地人通為一體今人一支受病則四體為之不寧豈可專治受病之處而置其餘哉朝廷是之司天有以太乙新歷上進者尚書省檄雲翼參訂摘其不合者二十餘條曆家稱焉所著文集若干卷校大金禮儀若干卷續通鑑若干卷周禮辨一篇左氏莊列賦各一篇五星聚井辨一篇縣象賦一篇勾股機要象數雜說等著藏于家趙秉文字周臣磁州滏陽人也幼頴悟讀書若夙習登大定二十五年進士第調安塞簿以課最遷邯鄲令再遷唐山丁父憂用薦者起復南京路轉運司都勾判官明昌六年入為應奉翰林文字同知制誥上書論宰相胥持國當罷宗室守貞可大用章宗召問言頗差異於是命知大興府事內族等鞫之秉文初不肯言詰其僕歷數交游者秉文乃曰初欲上言嘗與修撰王庭筠御史周昂省令史潘鄭贊道高坦等私議庭筠等皆下獄決罰有差有司論秉文上書狂妄法當追解上不欲以言罪人遂特免焉當時為之語曰古有朱雲今有秉文朱雲攀檻秉文攀人士大夫莫不恥之坐是久廢後起為同知岢嵐軍州事轉北京路轉運司支度判官承安五年冬十月陰晦連日宰相張萬公入對上顧謂萬公曰卿言天日晦冥亦猶人君用人邪正不分極有理若趙秉文曩以言事降授聞其人有才藻工書翰又且敢言朕非棄不用以北邊軍事方興姑試之耳泰和二年召為戶部主事遷翰林修撰十月出為寧邊州刺史三年改平定州前政苛於用刑每聞赦將至先掊賊死乃拜赦而盜愈繁秉文為政一從寬簡旬月盜悉屏跡歲飢出祿粟倡豪民以賑全活者甚衆大安初北兵南嚮召秉文與待制趙資道論備邊策秉文言今我軍聚於宣德城小列營其外涉暑雨器械弛敗人且病俟秋敵至將不利矣可遣臨潢一軍擣其虛則山西之圍可解兵法所謂出其不意攻其必救者也衞王不能用其秋宣德果以敗聞尋為兵部郎中兼翰林修撰俄轉翰林直學士貞祐初建言時事可行者三一遷都二導河三封建朝廷略施行之明年上書願為國家守殘破一州以宣布朝廷恤民之意且曰陛下勿謂書生不知兵顏真卿張巡許遠輩以身許國亦書生也又曰使臣死而有益於國猶勝坐縻釰祿為無用之人上曰秉文志固可尚然方今翰苑尤難其人卿宿儒當在左右不許四年拜翰林侍講學士言寶券滯塞蓋朝廷初議更張市肆已妄傳其不用因之抑遏漸至廢絕臣愚以為宜立回易務令近上職官通市道者掌之給以銀鈔粟麥縑帛之類權其低昂而出納詔有司議行之興定元年轉侍讀學士拜禮部尚書兼侍讀學士同修國史知集賢院事又明年知貢舉坐取進士盧亞重用韻削兩階因請致仕金自泰和大安以來科舉之文其弊益甚蓋有司惟守格法所取之文卑陋陳腐苟合程度而已稍涉奇峭即遭絀落於是文風大衰貞祐初秉文為省試得李獻能賦雖格律稍疏而詞藻頗麗擢為第一舉人遂大喧噪愬於臺省以為趙公大壞文格且作詩謗之久之方息俄而獻能復中宏詞入翰林而秉文竟以是得罪五年復為禮部尚書入謝上曰卿春秋高以文章故須復用卿秉文以身受厚恩無以自效願開忠言廣聖慮每進見從容為上言人主當儉勤慎兵刑所以祈天永命者上嘉納焉哀宗即位再乞致仕不許改翰林學士同修國史兼益政院說書官以上嗣德在初當日親經史以自裨益進無逸直解貞觀政要申鑒各一通正大九年正月汴京戒嚴上命秉文為赦文以布宣悔悟哀痛之意秉文指事陳義辭情俱盡及兵退大臣欲稱賀且命為表秉文曰春秋新宮火三日哭今園陵如此酌之以禮當慰不當賀遂已時年已老日以時事為憂雖食息頃不能忘每聞一事可便民一士可擢用大則拜章小則為當路者言殷勤鄭重不能自已三月草開興改元詔閭巷閒皆能傳誦洛陽人拜詔畢舉城痛哭其感人如此是年五月壬辰卒年七十四積官至資善大夫上護軍天水郡侯正大間同楊雲翼作龜鑑萬年錄上之又因進講與雲翼共集自古治術號君臣政要為一編以進焉秉文自幼至老未嘗一日廢書著易叢說十卷中庸說一卷揚子發微一卷太玄箋贊六卷文中子類說一卷南華略釋一卷列子補注一卷刪集論語孟子解各一十卷資暇錄一十五卷所著文章號滏水集者三十卷秉文之文長於辨析極所欲言而止不以繩墨自拘七言長詩筆勢縱放不拘一律律詩壯麗小詩精絕多以近體為之至五言古詩則沈鬱頓挫字畫則草書尤遒勁朝使至自河湟者多言夏人問秉文及王庭筠起居狀其為四方所重如此為人至誠樂易與人交不立崖岸未嘗以大名自居仕五朝官六卿自奉養如寒士楊雲翼嘗與秉文代掌文柄時人號楊趙然晚年頗以禪語自污人亦以為秉文之恨云贊曰楊雲翼趙秉文金士巨擘其文墨論議以及政事皆有足傳雲翼諫伐宋一疏宣宗雖不見聽此心何愧景略庭筠之累秉文所為茲事大愧高允韓玉字溫甫其先相人曾祖錫仕金以濟南尹致仕玉明昌五年經義辭賦兩科進士入翰林為應奉應制一日百篇文不加點又作元勳傳稱旨章宗嘆曰勳臣何幸得此家作傳耶泰和中建言開通州潞水漕渠船運至都陞兩階授同知陝西東路轉運使事大安三年都城受圍夏人連陷邠涇陝西安撫司檄玉以鳳翔總管判官為都統府募軍旬日得萬人與夏人戰敗之獲牛馬千餘時夏兵五萬方圍平涼又戰于北原夏人疑大軍至是夜解去當路者忌其功驛奏玉與夏寇有謀朝廷疑之使使者授玉河平軍節度副使且覘其軍先是華州李公直以都城隔絕謀舉兵入援而玉恃其軍為可用亦欲為勤王之舉乃傳檄州郡云事推其本禍有所基始自賊臣貪容姦賂繼緣二帥貪固威權又云裹糧坐費盡膏血於生民棄甲復來竭資儲於國計要權力而望形勢連歲月而守妻孥又云人誰無死有臣子之當然事至于今忍君親之弗顧勿謂百年身後虛名一聽史臣只如今日目前何顏以居人世公直一軍行有日矣將有違約國朝人有不從者輒以軍法從事京兆統軍便謂公直據華州反遣都統楊珪襲取之遂置極刑公直曾為書約玉玉不預知其書乃為安撫所得及使者覘玉軍且疑預公直之謀即實其罪玉道出華州被囚死於郡學臨終書二詩壁間士論寃之子不疑字居之以父死非罪誓不祿仕藏其父臨終時手書云此去冥路吾心皓然剛直之氣必不下沈兒可無慮世亂時艱努力自護幽明雖異寧不見爾讀者惻然馮璧字叔獻真定縣人幼頴悟不凡弱冠補太學生承安二年經義進士制策復優等調莒州軍事判官宰相奏留校祕書未幾調遼濱主簿縣有和糴粟未給價者餘十萬斛散貯民居以富人掌之有腐敗則責償於民民殊苦之璧白漕司即日罷之民大悅泰和四年調鄜州錄事明年伐蜀行部檄充軍前檢察帥府以書檄委之章宗欲招降吳曦詔先以文告曉之然後用兵蜀人守散關不下金兵殺獲甚衆璧言彼軍拒守而幷禍其民無乃與詔旨相戾乎主帥憾之以璧招兩當潰卒璧即日率鳳州已降官屬淡剛李果偕行道逢軍士所得子女金帛牛馬皆奪付剛使歸其家軍士則以違制決遣之比到兩當軍民三萬餘衆鼓舞迎勞璧以朝旨慰遣之及還主帥嘉其能奏遷一官五年自東阿丞召補尚書省令史用宗室承暉薦授應奉翰林文字兼韓王府記室參軍俄轉太學博士至寧初忽沙虎弒逆遂去官宣宗南遷璧時避兵東方由單父渡河詣汴梁時相奏復前職貞祐三年遷翰林修撰時山東河朔軍六十餘萬口仰給縣官率不逞輩竄名其間詔璧攝監察御史汰逐之總領撒合問冒券四百餘口劾案以聞詔杖殺之故所至爭自首減幾及於半復進一官初監察御史本溫被命汰宗室從坦軍於孟州軍士欲謀變本溫懼不知所為尋有旨北軍沈思忠以下四將屯衞州餘衆果叛入太行於是密院奏以璧代本溫竟其事璧馳至衞召四將喻以上意思忠等挾叛者請還奏之璧責以大義將士慚服不日就汰者三千人六月改大理丞與臺官行關中劾奏姦贓之尤者商州防禦使宗室重福等十數人自是權貴側目興定四年以宋人拒使者於淮上遣兵南伐詔京東總帥紇石烈牙吾塔攻盱眙牙吾塔不從命乃率精騎由滁州略宣化縱兵大掠故兵所至原野蕭條絕無所資宋人堅壁不戰乃無功而歸行省奏牙吾塔故違節制詔璧佩金符鞫之璧馳入牙吾塔軍奪其金符易以他帥攝牙吾塔入獄兵士譁譟以吾帥無罪為言璧怒責牙吾塔曰元帥欲以兵抗制使耶待罪之禮恐不如此使者還奏獄能竟乎牙吾塔伏地請死璧曰兵法進退自專有失機會以致覆敗者斬即擬以聞時議壯之十月改禮部員外郎權右司諫治書侍御史詔問時務所當先者璧上六事大略言減冗食備選鋒緩疑似以慎刑擇公廉以檢吏屯戍革朘削之弊權貴嚴請託之科又條自治之策四謂別賢佞信賞罰聽覽以通下情貶損以謹天戒詔以東方飢饉盜賊並起以御史中丞完顏伯嘉為宣慰使監察御史道遠從行道遠發永城令簿姦贓伯嘉與令有違付令有司釋簿不問燕語之際又許參佐克忠等臺職璧皆劾之伯嘉竟得罪去初諜者告歸德行樞密院言河朔叛軍有竊謀南渡者行院事胡土門都水監使毛花輦易其人不為備一日紅衲數百聯筏南渡殘下邑而去命璧鞫之璧以二將託疾營私聞寇弛備且來不戰去不追在法皆當斬或以為言二將皆寵臣而都水者貲累巨萬若求援禁近必從輕典君徒結怨權貴果何益耶璧嘆曰睢陽行闕東藩重兵所宿門廷之寇且不能禦有大於此者復何望乎即具所擬聞四年遷刑部郎中關中旱詔璧與吏部侍郎畏忻審理寃獄時河中帥阿虎帶及僚屬十數人皆以棄城罪當死繫同州獄待報同州官僚承望風旨問璧何以處之璧曰河中今日重地朝議擬為駐蹕之所若失此則河南陝西有唇亡之憂以彼宗室勳貴故使鎮之平居無事竭民膏血為浚築計一旦有警乃遽焚蕩而去此而不誅三尺法無用矣竟以無寃上之冬十月出為歸德治中未幾改同知保靜軍節度使又改同知集慶軍節度使到官即上章乞骸骨進一官致仕正大九年河南破北歸又數年卒年七十有九李獻甫字欽用獻能從弟也博通書傳尤精左氏及地理學為人有幹局心所到則絕人遠甚故時人稱其精神滿腹興定五年登進士第歷咸陽簿辟行臺令史正大初夏使來請和朝廷以翰林待制馮延登往議時獻甫為書表官從行夏使有口辯延登不能折往復數日不定至以歲幣為言獻甫不能平從旁進曰夏國與我和好百年今雖易君臣之名為兄弟之國使兄輸幣寧有據耶使者曰兄弟且不論宋歲輸吾國幣二十五萬疋典故具在君獨不知耶金朝必欲修舊好非此例不可獻甫作色曰使者尚忍言耶宋以歲幣餌君家而賜之姓岸然以君父自居夏國君臣無一悟者誠謂使者當以為諱乃今公言之使者果能主此議以從賜姓之例弊邑雖歲捐五十萬獻甫請以身任之夏使語塞和議乃定後朝廷錄其功授慶陽總帥府經歷官尋辟長安令京兆行臺所在供億甚繁獻甫處之常若有餘縣民賴之以安入為尚書省令史天興元年充行六部員外郎守備之策時相倚任之以功遷鎮南軍節度副使兼右警巡使死於蔡州之難年四十所著文章號天倪集留汴京獻甫死其家亦破同年華陰王元禮購得之傳于世雷淵字希顏一字季默應州渾源人父思名進士仕至同知北京轉運使註易行于世淵庶出年最幼諸兄不齒父歿不能安於家乃發憤入太學衣弊履穿坐榻無席自以跣露兀坐讀書不迎送賓客人皆以為倨其友商衡每為辯之且賙卹焉後從李之純游遂知名登至寧元年詞賦進士甲科調涇州錄事坐高庭玉獄幾死後改東平河朔重兵所在驕將悍卒倚外敵為重自行臺以下皆摩撫之淵出入軍中偃然不為屈不數月閭巷間多畫淵像雖大將不敢以新進書生遇之尋遷東阿令轉徐州觀察判官興定末召為英王府文學兼記室參軍轉應奉翰林文字拜監察御史言五事稱旨又彈劾不避權貴出巡郡邑所至有威譽奸豪不法者立箠殺之至蔡州杖殺五百人時號曰雷半千坐此為人所訟罷去久之用宰相侯摯薦起為太學博士南京轉運司戶籍判官遷翰林修撰一夕暴卒年四十八正大庚寅倒廻谷之役淵嘗上書破朝臣孤注之論引援深切灼然易見主兵者沮之策竟不行為人軀幹雄偉髯張口哆顏渥丹眼如望洋遇不平則疾惡之氣見於顏間或嚼齒大罵不休雖痛自懲創然亦不能變也為文章詩喜新奇善結交凡當塗貴要與布衣名士無不往來居京師賓客踵門未嘗去舍家無餘貲及待賓客甚豐腆莅官喜立名初登第攝遂平縣事年少氣銳擊豪右發姦伏一邑大震稱為神明嘗擅笞州魁吏州檄召之不應罷去後凡居一職輒震耀亦坐此不達程震字威卿東勝人與其兄鼎俱擢第震入仕有能聲興定初詔百官舉縣令震得陳留治為河南第一召拜監察御史彈劾無所撓時皇子荊王為宰相家僮輩席勢侵民震以法劾之奏曰荊王以陛下之子任天下之重不能上贊君父同濟艱難顧乃專恃權勢蔑棄典禮開納貨賂進退官吏縱令奴隸侵漁細民名為和市其實脅取諸所不法不可枚舉陛下不能正家而欲正天下難矣於是上責荊王出內府銀以償物直杖大奴尤不法者數人未幾坐為故吏所訟罷官歲餘嘔血卒震為人剛直有材幹忘身徇國不少私與及為御史臺綱大振以故小人側目者衆不能久留於朝士論惜之贊曰韓玉馮璧李獻甫雷淵皆金季豪傑之士也邠涇之變玉募兵旬日而得萬人牙吾塔之凶暴璧以王度繩之卒不敢動夏人援宋例以邀歲幣獻甫以宋賜夏姓一事折之夏使語塞而和議定淵為御史權貴歛避古之國士何加焉玉以疑見寃璧淵疾惡太甚議者以酷譏之瑕豈可以掩瑜哉程震劾荊抵罪比蹤馮雷然亦以羣小齟齬而死直士之不容於世也久矣吁
