body:
  text: 金史卷四十八志第二十九食貨三錢幣錢幣金初用遼宋舊錢天會末雖劉豫阜昌元寶阜昌重寶亦用之海陵庶人貞元二年遷都之後戶部尚書蔡松年復鈔引法遂製交鈔與錢並用正隆二年歷四十餘歲始議鼓鑄冬十月初禁銅越外界懸罪賞格括民間銅鍮器陝西南京者輸京兆他路悉輸中都三年二月中都置錢監二東曰寶源西曰寶豐京兆置監一曰利用三監鑄錢文曰正隆通寶輕重如宋小平錢而肉好字文峻整過之與舊錢通用世宗大定元年用吏部尚書張中彥言命陝西路參用宋舊鐵錢四年浸不行詔陝西行戶部並兩路通檢官詳究其事皆言民間用錢名與鐵錢兼用其實不為準數公私不便遂罷之八年民有犯銅禁者上曰銷錢作銅舊有禁令然民間猶有鑄鏡者非銷錢而何遂併禁之十年上諭戶部臣曰官錢積而不散則民間錢重貿易必艱宜令市金銀及諸物其諸路酤榷之貨亦令以物平折輸之十月上責戶部官曰先以官錢率多恐民間不得流通令諸處貿易金銀絲帛以圖流轉今知乃有以抑配反害百姓者前許院務得折納輕仭之物以便民是皆朕思而後行者也此尚出朕安用若為又隨處時有賑濟往往近地無糧取於它處往返既遠人愈難之何為不隨處起倉年豐則多糴以備賑贍設有緩急亦豈不易辦乎而徒使錢充府庫將安用之天下之大朕豈能一一遍知凡此數事汝等何為而使至此且戶部與它部不同當從宜為計若但務因循以守其職則戶部官誰不能為十一年二月禁私鑄銅鏡舊有銅器悉送官給其直之半惟神佛像鐘磬鈸鈷腰束帶魚袋之屬則存之十二年正月以銅少命尚書省遣使諸路規措銅貸能指坑冶得實者賞上與宰臣議鼓鑄之術宰臣曰有言所在有金銀坑冶皆可採以鑄錢臣竊謂工費過於所得數倍恐不可行上曰金銀山澤之利當以與民惟錢不當私鑄今國家財用豐盈若流布四方與在官何異所費雖多但在民間而新錢日增爾其遣能吏經營之左丞石琚進曰臣聞天子之富藏在天下錢貨如泉正欲流通上復問琚曰古亦有民自鑄錢者乎琚對曰民若自鑄則小人圖利錢益薄惡此古所以禁也十三年命非屯兵之州府以錢市易金帛運致京師使錢幣流通以濟民用十五年十一月上謂宰臣曰或言鑄錢無益所得不償所費朕謂不然天下如一家何公私之間公家之費私家得之但新幣日增公私俱便也十六年三月遣使分路訪察銅礦苗脉十八年代州立監鑄錢命震武軍節度使李天吉知保德軍事高季孫往監之而所鑄斑駁黑澀不可用詔削天吉季孫等官兩階解職仍杖季孫八十更命工部郎中張大節吏部員外郎麻圭監鑄其錢文曰大定通寶字文肉好又勝正隆之制世傳其錢料微用銀云十九年始鑄至萬六千餘貫二十年詔先以五千進呈而後命與舊錢並用初新錢之未行也以宋大觀錢作當五用之二月上聞上京修內所市民物不即與直又用短錢責宰臣曰如此小事朕豈能悉知卿等何為不察也時民間以八十為陌謂之短錢官用足陌謂之長錢大名男子斡魯補者上言謂官私所用錢皆當以八十為陌遂為定制二十年十一月名代州監曰阜通設監一員正五品以州節度兼領副監一員正六品以州同知兼領丞一員正七品以觀察判官兼領設勾當官二員從八品給銀牌命副監及丞更馳驛經理二十二年十月以參知政事粘割斡特剌提控代州阜通監二十三年上以阜通監鼓鑄歲久而錢不加多蓋以代州長二廳幕兼領而奪於州務不得專意綜理故也遂設副監監丞為正員而以節度領監事二十六年上曰中外皆言錢難朕嘗計之京師積錢五百萬貫亦不為多外路雖有終亦無用諸路官錢非屯兵處可盡運至京師太尉丞相克寧曰民間錢固已艱得若盡歸京師民益艱得矣不若起其半至都餘半變折輕齎則中外皆便十一月上諭宰臣曰國家銅禁久矣尚聞民私造腰帶及鏡託為舊物公然市之宜加禁約二十七年二月曲陽縣鑄錢別為一監以利通為名設副監監丞給驛更出經營銅事二十八年上謂宰臣曰今者外路見錢其數甚多聞有六千餘萬貫皆在僻處積貯既不流散公私無益與無等爾今中都歲費三百萬貫支用不繼若致之京師不過少有挽運之費縱所費多亦惟散在民爾章宗大定二十九年十二月雁門五臺民劉完等訴自立監鑄錢以來有銅礦之地雖曰官運其顧直不足則令民共償乞與本州司縣均為差配遂命甄官署丞丁用楫往審其利病還言所運銅礦民以物力科差濟之非所願也其顧直既低又有刻剝之弊而相視苗脉工匠妄指人之坦屋及寺觀謂當開採因以取賄又隨冶夫匠日辦淨銅四兩多不及數復銷銅器及舊錢送官以足之今阜通利通兩監歲鑄錢十四萬餘貫而歲所費乃至八十餘萬貫病民而多費未見其利便也宰臣以聞遂罷代州曲陽二監初貞元間既行鈔引法遂設印造鈔引庫及交鈔庫皆設使副判各一員都監二員而交鈔庫副則專主書押搭印合同之事印一貫二貫三貫五貫十貫五等謂之大鈔一百二百三百五百七百五等謂之小鈔與錢並行以七年為限納舊易新猶循宋張詠四川交子之法而紓其期爾蓋亦以銅少權制之法也時有欲罷之者至是二監既罷有司言交鈔舊同見錢商旅利於致遠往往以錢買鈔蓋公私俱便之事豈可罷去止因有釐革年限不能無疑乞削七年釐革之法令民得常用若歲久字文磨滅許於所在官庫納舊換新或聽便支錢遂罷七年釐革之限交鈔字昏方換法自此始而收斂無術出多入少民寖輕之厥後其法屢更而不能革弊亦始於此焉交鈔之制外為闌作花紋其上衡書貫例左曰某字料右曰某字號料號外篆書曰僞造交鈔者斬告捕者賞錢三百貫料號衡闌下曰中都交鈔庫准尚書戶部符承都堂劄付戶部覆點勘令史姓名押字又曰聖旨印造逐路交鈔於某處庫納錢換鈔更許於某處庫納鈔換錢官私同見錢流轉其鈔不限年月行用如字文故暗鈔紙擦磨許於所屬庫司納舊換新若到庫支錢或倒換新鈔每貫剋工墨錢若干文庫掐攢司庫副副使使各押字年月日印造鈔引庫庫子庫司副使各押字上至尚書戶部官亦押字其搭印支錢處合同餘用印依常例初大定間定制民間應許存留銅鍮器物若申賣入官每斤給錢二百文其歨藏應禁器物首納者每斤給錢百文非器物銅貨一百五十文不及斤者計給之在都官局及外路造賣銅器價令運司佐二檢校鏡每斤三百十四文鍍金御仙花腰帶十七貫六百七十一文五子荔支腰帶十七貫九百七十一文撎鈒羅文束帶八貫五百六十文魚袋二貫三百九文鈸鈷鐃磬每斤一貫九百二文鈴杵坐銅者二貫七百六十九文鍮石者三貫六百四十六文明昌二年十月敕減賣鏡價防私鑄銷錢也舊嘗以夫匠逾天山北界外採銅明昌三年監察御史李炳言頃聞有司奏在官銅數可支十年若復每歲令夫匠過界遠採不惟多費復恐或生邊釁若支用將盡之日止可於界內採煉上是其言遂不許出界五月敕尚書省曰民間流轉交鈔當限其數毋令多於見錢也四年上諭宰臣曰隨處有無用官物可為計置如鐵錢之類是也或有言鐵錢有破損當令所司以銅錢償之者參知政事胥持國不可上曰令償之尚壞不償將盡壞矣若果無用曷別為計持國曰如江南用銅錢江北淮南用鐵錢蓋以隔閡銅錢不令過界爾如陝西市易亦有用銀布薑麻若舊有鐵錢宜姑收貯以備緩急遂令有司籍鐵錢及諸無用之物貯於庫八月提刑司言所降陝西交鈔多於見錢使民艱於流轉宰臣以聞遂令本路榷稅及諸名色錢折交鈔官兵俸許錢絹銀鈔各半之若錢銀數少即全給交鈔五年三月宰臣奏民間錢所以艱得以官豪家多積故也在唐元和間嘗限富家錢過五千貫者死王公重貶沒入以五之一賞告者上令參酌定制令官民之家以品從物力限見錢多不過二萬貫猛安謀克則以牛具為差不得過萬貫凡有所餘盡令易諸物收貯之有能告數外留錢者奴婢免為良傭者出離以十之一為賞餘皆沒入又諭旨有司凡使高麗還者所得銅器令盡買之承安二年十月宰臣奏舊立交鈔法凡以舊易新者每貫取工墨錢十五文至大定二十三年不拘貫例每張收八文既無益於官亦妨鈔法宜從舊制便若以鈔買鹽引每貫權作一貫五十文庶得多售上曰工墨錢貫可令收十二文買鹽引者每貫可權作一貫一百文時交鈔所出數多民間成貫例者艱於流轉詔以西北二京遼東路從宜給小鈔且許於官庫換錢與它路通行十二月尚書省議謂時所給官兵俸及邊戍軍須皆以銀鈔相兼舊例銀每鋌五十兩其直百貫民間或有截鑿之者其價亦隨低昂遂改鑄銀名承安寶貨一兩至十兩分五等每兩折錢二貫公私同見錢用仍定銷鑄及接受稽留罪賞格承安三年正月省奏隨處榷場若許見錢越境雖非銷毀即與銷毀無異遂立制以錢與外方人使及與交易者徒五年三斤以上死駔儈同罪捕告人之賞官先為代給錢五百貫其逮及與接引館伴先排通引書表等以次坐罪仍令均償時交鈔稍滯命西京北京臨潢遼東等路一貫以上俱用銀鈔寶貨不許用錢一貫以下聽民便時既行限錢法人多不遵上曰已定條約不為不重其令御史臺及提刑司察之九月以民間鈔滯盡以一貫以下交鈔易錢用之遂復減元限之數更定官民存留錢法三分為率親王公主品官許留一分餘皆半之其贏餘之數期五十日內盡易諸物違者以違制論以錢賞告者於兩行部各置回易務以綿絹物段易銀鈔亦許本務納銀鈔赴榷貨出鹽引納鈔於山東河北河東等路從便易錢各降補官及德號空敕三百度牒一千從兩行部指定處限四月進納補換又更造一百例小鈔並許官庫易錢一貫二貫例並支小鈔三貫例則支銀一兩小鈔一貫若五貫十貫例則四分支小鈔六分支銀欲得寶貨者聽有阻滯及輒減價者罪之四年三月又以銀鈔阻滯乃權止山東諸路以銀鈔與綿絹鹽引從便易錢之制令院務諸科名錢除京師河南陝西銀鈔從便餘路並許收銀鈔各半仍於鈔四分之一許納其本路隨路所收交鈔除本路者不復支發餘通行者並循環用之榷貨所鬻鹽引收納寶貨與鈔相半銀每兩止折鈔兩貫省許人依舊詣庫納鈔隨路漕司所收除額外羡餘者亦如之所支官錢亦以銀鈔相兼銀已零截者令交鈔庫不復支若寶貨數少可浸增鑄銀鈔既通則物價自平雖有禁法亦安所施遂除阻滯銀鈔罪制四年以戶部言命在都官錢榷貨務鹽引並聽收寶貨附近鹽司貼錢數亦許帶納民間寶貨有所歸自然通行不至銷毀先是設四庫印小鈔以代鈔本令人便仭小鈔赴庫換錢即與支見錢無異今更不須印造俟其換盡可罷四庫但以大鈔驗錢數支易見錢時私鑄承安寶貨者多雜以銅錫寖不能行京師閉肆五年十二月宰臣奏比以軍儲調發支出交鈔數多遂鑄寶貨與錢兼用以代鈔本蓋權時之制非經久之法遂罷承安寶貨泰和元年六月通州刺史盧構言民間鈔固已流行獨銀價未平官之所定每鋌以十萬為準而市肆才直八萬蓋出多入少故也若令諸稅以錢銀鈔三分均納庶革其弊下省議宰臣謂軍興以來全賴交鈔佐用以出多遂滯頃令院務收鈔七分亦漸流通若與銀均納則彼增此減理必偏勝至礙鈔法必欲銀價之平宜令諸名若鋪馬軍須等錢許納銀半無者聽便先是嘗行三合同交鈔至泰和二年止行於民間而官不收斂朝廷慮其病民遂令諸稅各帶納一分雖止係本路者亦許不限路分通納戶部見徵纍年鋪馬錢亦聽收其半閏十二月上以交鈔事召戶部尚書孫鐸侍郎張復亨議於內殿復亨以三合同鈔可行鐸請廢不用既而復亨言竟詘自是而後國虛民貧經用不足專以交鈔愚百姓而法又不常世宗之業衰焉以至泰和三年其弊彌甚乃謂宰臣曰大定間錢至足今民間錢少而又不在官何耶其集問百官必有能知之者四年七月罷限錢法從戶部尚書上官瑜所請也四年欲增鑄錢命百官議所以足銅之術中丞孟鑄謂銷錢作銅及盜用出境者不止宜罪其官及鄰太府監梁𤨠等言鑄錢甚費率費十錢可得一錢識者謂費雖多猶增一錢也乞採銅拘器以鑄宰臣謂鼓鑄未可速行其銅冶聽民煎煉官為買之凡寺觀不及十人不許畜法器民間鍮銅器期以兩月送官給價匿者以私法坐限外人告者以知而不糾坐其官寺觀許童行告者賞俟銅多別具以聞八月定從便易錢法聽人輸納於京師而於山東河北大名河東等路依數支取後鑄大錢一直十篆文曰泰和重寶與鈔參行五年上欲罷交鈔工墨錢復以印時常費遂命貫止收六文六年四月陝西交鈔不行以見錢十萬貫為鈔本與鈔相易復以小鈔十萬貫相參用之六年十一月復許諸路各行小鈔中都路則於中都及保州南京路則於南京歸德河南府山東東路則於益都濟南府山東西路則於東平大名府河北東路則於河間府冀州河北西路則於真定彰德府河東南路則於平陽河東北路則於太原汾州遼東則於上京咸平西京則於西京撫州北京則於臨潢府官庫易錢令戶部印小鈔五等附各路同見錢用七年正月敕在官毋得支出大鈔在民者令赴庫以多寡制數易小鈔及見錢院務商稅及諸名錢三分須納大鈔一分惟遼東從便時民以貨幣屢變往往怨嗟聚語於市上知之諭旨於御史臺曰自今都市敢有相聚論鈔法難行者許人捕告賞錢三百貫五月以戶部尚書高汝礪議立鈔法條約添印大小鈔以鈔庫至急切增副使一員汝礪又與中都路轉運使孫鐸言錢幣上命中丞孟鑄禮部侍郎喬宇國子司業劉昂等十人議月餘不決七月上召議于泰和殿且諭汝礪曰今後毋謂鈔多不加重而輒易之重之加於錢可也明日敕民間之交易典質一貫以上並用交鈔毋得用錢須立契者三分之一用諸物六盤山西遼河東以五分之一用鈔東鄙屯田戶以六分之一用鈔不須立契者惟遼東錢鈔從便犯者徒二年告者賞有差監臨犯者杖且解職縣官能奉行流通者升除否者降罰集衆沮法者以違制論工墨錢每張止收二錢商旅仭見錢不得過十貫所司籍辨鈔人以防僞冒品官及民家存留見錢比舊減其數若舊有見錢多者許送官易鈔十貫以上不得出京又定制按察司以鈔法流通為稱職而河北按察使斜不出巡按所給券應得鈔一貫以難支用命取見錢御史以沮壞鈔法劾之上曰糾察之官乃先壞法情不可恕杖之七十削官一階解職戶部尚書高汝礪言鈔法務在必行府州縣鎮宜各籍辨鈔人給以條印聽與人辨驗隨貫量給二錢貫例雖多六錢即止每朝官出使則令體究通滯以聞民間舊有宋會子亦令同見錢用十貫以上不許持行榷鹽許用銀絹餘市易及俸並用交鈔其奇數以小鈔足之應支銀絹而不足者亦以鈔給之上遣近侍諭旨尚書省今既以按察司鈔法通快為稱職否則為不稱職仍於州府司縣官給由內明書所犯之數但犯鈔法者雖監察御史舉其能幹亦不准用十月楊序言交鈔料號不明年月故暗雖令赴庫易新然外路無設定庫司欲易無所遠者直須赴都上以問汝礪對曰隨處州府庫內各有辨鈔庫子鈔雖弊不僞亦可收納去都遠之城邑既有設置合同換錢客旅經之皆可相易更慮無合同之地難以易者令官庫凡納昏鈔者受而不支於鈔背印記官吏姓名積半歲赴都易新鈔如此則昏鈔有所歸而無滯矣十一月上諭戶部官曰今鈔法雖行卿等亦宜審察少有壅滯即當以聞勿謂已行而憚改汝礪對曰今諸處置庫多在公廨內小民出入頗難雖有商賈易之然患鈔本不豐比者河北西路轉運司言一富民首其當存留錢外見錢十四萬貫它路臆或有如此者臣等謂宜令州縣委官及庫典於市肆要處置庫支換以出首之錢為鈔本十萬戶以上州府給三萬貫以次為差易鈔者人不得過二貫以所得工墨錢充庫典食直仍令州府佐二及轉運司官一員提控上是之遂命移庫於市肆之會令民以鈔易錢是月敕捕獲僞造交鈔者皆以交鈔為賞時復議更鈔法上從高汝礪言命在官大鈔更不許出聽民以五貫十貫例者赴庫易小鈔欲得錢者五貫內與一緡十貫內與兩緡惟遼東從便河南陝西山東及它行鈔諸路院務諸稅及諸科名錢並以三分為率一分納十貫例者二分五貫例者餘並收見錢八年正月以京師鈔滯定所司賞罰格時新制按察司及州縣官例以鈔通滯為升降遂命監察御史賞罰同外道按察司大興府警巡院官同外路州縣官是月收毀大鈔行小鈔八月從遼東按察司楊雲翼言以咸平東京兩路商旅所集遂從都南例一貫以上皆用交鈔不得用錢十月孫鐸又言民間鈔多正宜收斂院務稅諸名錢可盡收鈔秋夏稅納本色外亦令收鈔不拘貫例農民知之則漸重鈔可以流通比來州縣抑配市肆買鈔徒增騷擾可罷諸處創設鈔局止令赴省庫換易今小鈔各限路分亦甚未便可令通用上命亟行之十二月宰臣奏舊制內外官兵俸皆給鈔其必用錢以足數者可以十分為率軍兵給三分官員承應人給二分多不過十貫凡前所收大鈔俟至通行當復計造其終須當精緻以圖經久民間舊鈔故暗者乞許於所在庫易新若官吏勢要之家有賤買交鈔而於院務換錢興販者以違制論復遣官分路巡察其限錢過數雖許奴婢以告乃有所屬默令其主藏匿不以實首者可令按察司察之若舊限已滿當更展五十日許再令變易鈔引諸物是制既行之後章宗尋崩衛紹王繼立大安三年會河之役至以八十四車為軍賞兵衄國殘不遑救弊交鈔之輕幾於不能市易矣至宣宗貞祐二年二月思有以重之乃更作二十貫至百貫例交鈔又造二百貫至千貫例者然自泰和以來凡更交鈔初雖重不數年則輕而不行至是則愈更而愈滯矣南遷之後國蹙民困軍旅不息供億無度輕又甚焉三年四月河東宣撫使胥鼎上言曰今之物重其弊在於鈔窒有出而無入也雖院務稅增收數倍而所納皆十貫例大鈔此何益哉今十貫例者民間甚多以無所歸故市易多用見錢而鈔每貫僅直一錢曾不及工墨之費臣愚謂宜權禁見錢且令計司以軍須為名量民力徵斂則泉貨流通而物價平矣自是錢貨不用富家內困藏鏹之限外弊交鈔屢變皆至窘敗謂之坐化商人往往舟運貿易于江淮錢多入于宋矣宋人以為喜而金人不禁也識者惜其既不能重無用之楮而又棄自古流行之寶焉五月權西安軍節度使烏林達與言關陝軍多供億不足所仰交鈔則取於京師徒成煩費乞降板就造便又言懷州舊鐵錢巨萬今既無用願貫為甲以給戰士時有司輕罪議罰率以鐵贖而當罪不平遂命贖銅計贓皆以銀價為準六月敕議交鈔利便七月改交鈔名為貞祐寶券仍立沮阻罪九月御史臺言自多故以來全藉交鈔以助軍需然所入不及所出則其價浸減卒無法以禁此必然之理也近用貞祐寶券以革其弊又慮既多而民輕與舊鈔無異也乃令民間市易悉從時估嚴立罪賞期於必行遂使商旅不行四方之物不敢入夫京師百萬之衆日費不資物價寧不日貴耶且時估月再定之而民間價旦暮不一今有司強之而市肆盡閉復議搜括隱匿必令如估鬻之則京師之物指日盡而百姓重困矣臣等謂惟官和買計贓之類可用時估餘宜從便制可十二月上聞近京郡縣多糴於京師穀價翔踴令尚書省集戶部講議所開封府轉運司議所以制之者戶部及講議所言以五斗出城者可闌糴其半轉運司謂宜悉禁其出上從開封府議謂寶券初行時民甚重之但以河北陝西諸路所支既多人遂輕之商賈爭收入京以市金銀銀價昂穀亦隨之若令寶券路各殊制則不可復入河南則河南金銀賤而穀自輕若直閉京城粟不出則外亦自守不復入京穀當益貴宜諭郡縣小民毋妄增價官為定制務從其便四年正月監察御史田䄄秀言國家調度皆資寶券行才數月又復壅滯非約束不嚴奉行不謹也夫錢幣欲流通必輕重相權散斂有術而後可今之患在出太多入太少爾若隨時裁損所支而增其所收庶乎或可也因條五事一曰省冗官吏二曰損酒使司三曰節兵俸四曰罷寄治官五曰酒稅及納粟補官皆當用寶券詔酒稅從大定之舊餘皆不從尋又更定捕獲僞造寶券官賞三月翰林侍講學士趙秉文言比者寶券滯塞蓋朝廷將議更張已而妄傳不用因之抑遏漸至廢絶此乃權歸小民也自遷汴以來廢回易務臣愚謂當復置令職官通市道者掌之給銀鈔粟麥縑帛之類權其低昂而出納之仍自選良監當官營為之若半年無過及券法通流則聽所指任便差遣詔議行之四月河東行省胥鼎言交鈔貴乎流通今諸路所造不充所出不以術收之不無缺誤宜量民力徵斂以裨軍用河中宣撫司亦以寶券多出民不之貴乞驗民貧富徵之雖為陝西若一體徵收則彼中所有日湊于河東與不斂何異又河北寶券以不許行于河南由是愈滯宰臣謂昨以河北寶券商旅仭販繼踵南渡遂致物價翔踴乃權宜限以路分今鼎既以本路用度繁殷欲徵軍須錢宜從所請若陝西可徵與否詔令行省議定而後行五月上以河北州府官錢散失多在民間命尚書省經畫之八月平章高琪奏軍興以來用度不資惟賴寶券然所入不敷所出是以浸輕今千錢之券僅直數錢隨造隨盡工物日增不有以救之弊將滋甚宜更造新券與舊券權為子母而兼行之庶工物俱省而用不乏濮王守純以下皆憚改奏曰自古軍旅之費皆取於民向朝廷以小鈔殊輕權更寶券而復禁用錢小民淺慮謂楮幣易壞不若錢可久於是得錢則珍藏而券則亟用之惟恐破裂而至於廢也今朝廷知支而不知收所以錢日貴而券日輕然則券之輕非民輕之國家致之然也不若量其所支復斂于民出入循環則彼知為必用之物而知愛重矣今徒患輕而即欲更造不惟信令不行且恐新券之輕復同舊券也既而隴州防禦使完顏𧜛及陝西行省令史惠吉繼言券法之弊𧜛請姑罷印造以見在者流通之若滯塞則驗丁口之多寡物力之高下而徵之吉言券者所以救弊一時非可通流與見錢比必欲通之不過多斂少支爾然斂多則傷民支少則用不足二者皆不可為今日計莫若更造以貞祐通寶為名自百至三千等之為十聽各路轉運司印造仍不得過五千貫與舊券參用庶乎可也詔集百官議戶部侍郎奧屯阿虎禮部侍郎楊雲翼郎中蘭芝刑部侍郎馮鶚皆主更造戶部侍郎高夔員外郎張師魯兵部侍郎徒單歐里白皆請徵斂惟戶部尚書蕭貢謂止當如舊而工部尚書李元輔謂二者可並行太子少保張行信亦言不宜更造但嚴立不行之罪足矣侍御史趙伯成曰更造之法陰奪民利其弊甚於徵徵之為法特徵於農民則不可若徵於市肆商賈之家是亦敦本抑末之一端刑部主事王壽寧曰不然今之重錢輕券者皆農爾其斂必先於民而後可轉運使王擴曰凡論事當究其本今歲支軍士家口糧四萬餘石如使斯人地著少寬民力然後徵之則行之不難榷貨司楊貞亦欲節無名之費罷間冗之官或有請鑄大錢以當百別造小鈔以省費或謂縣官當擇人者獨吏部尚書溫迪罕思敬上書言國家立法莫不備具但有司不克奉之而已誠使臣得便宜從事凡外路四品以下官皆許杖決三品以上奏聞仍付監察二人馳驛往來法不必變民不必徵一號令之可使上下無不奉法如其不然請就重刑上以示宰臣曰彼自許如此試委之可乎宰臣未有以處而監察御史陳規完顏素蘭交諍以為事有難行聖哲猶病之思敬何為者徒害人爾上以衆議紛紛月餘不決厭之乃詔如舊紓其徵斂之期焉未幾竟用惠吉言造貞祐通寶興定元年二月始詔行之凡一貫當千貫增重僞造沮阻罪及捕獲之賞五月以鈔法屢變隨出而隨壞製紙之桑皮故紙皆取于民至是又甚艱得遂令計價但徵寶券通寶名曰桑皮故紙錢謂可以免民輸挽之勞而省工物之費也高汝礪言河南調發繁重所徵租稅三倍於舊僅可供億如此其重也而今年五月省部以歲收通寶不充所用乃於民間斂桑皮故紙鈔七千萬貫以補之又太甚矣而近又以通寶稍滯又增兩倍河南人戶農居三之二今年租稅徵尚未足而復令出此民若不糶當納之租則賣所食之粟舍此將何得焉今所急而難得者芻糧也出於民而有限可緩而易為者交鈔也出於國而可變以國家之所自行者而強求之民將若之何向者大鈔滯則更為小鈔小鈔弊則改為寶券寶券不行則易為通寶變制在我尚何煩民哉民既悉力以奉軍而不足又計口計稅計物計生殖之業而加徵若是其剝彼不能給則有亡而已矣民逃田穢兵食不給是軍儲鈔法兩廢矣臣非於鈔法不加意非故與省部相違也但以鈔滯物貴之害輕民去軍飢之害重爾時不能用三年十月省臣奏向以物重錢輕犯贓者計錢論罪則太重於是以銀為則每兩為錢二貫有犯通寶之贓者直以通寶論如因軍興調發受通寶及三十貫者已得死刑準以金銀價才為錢四百有奇則當杖輕重之間懸絶如此遂命准犯時銀價論罪四年三月參知政事李復亨言近制犯通寶之贓者並以物價折銀定罪每兩為錢二貫而法當贖銅者止納通寶見錢亦乞令依上輸銀既足以懲惡又有補於官詔省臣議遂命犯公錯過誤者止徵通寶見錢贓污故犯者輸銀十二月鎮南軍節度使溫迪罕思敬上書言錢之為泉也貴流通而不可塞積於官而不散則病民散於民而不斂則闕用必多寡輕重與物相權而後可大定之世民間錢多而鈔少故貴而易行軍興以來在官殊少民亦無幾軍旅調度悉仰于鈔日之所出動以萬計至于填委市肆能無輕乎不若弛限錢之禁許民自採銅鑄錢而官製模範薄惡不如法者令民不得用則錢必日多鈔可少出少出則貴而易行矣今日出益衆民日益輕有司欲重之而不得其法至乃計官吏之俸驗百姓之物力以斂之而卒不能增重曾不知錢少之弊也臣謂宜令民鑄錢而當斂鈔者亦聽輸銀民因以銀鑄錢為數等文曰興定元寶定直以備軍賞亦救弊之一法也朝廷不從五年閏十二月宰臣奏向者寶券既弊乃造貞祐通寶以救之迄今五年其弊又復如寶券之末初通寶四貫為銀一兩今八百餘貫矣宜復更造興定寶泉子母相權與通寶兼行每貫當通寶四百貫以二貫為銀一兩隨處置庫許人以通寶易之縣官能使民流通者進官一階升職一等其或姑息以致壅滯則亦追降的決為差州府官以所屬司縣定罪賞命監察御史及諸路行部官察之定撓法失糾舉法失舉則御史降決行部官降罰集衆妄議難行者徒二年告捕者賞錢三百貫元光元年二月始詔行之二年五月更造每貫當通寶五十又以綾印製元光珍貨同銀鈔及餘鈔行之行之未久銀價日貴寶泉日賤民但以銀論價至元光二年寶泉幾於不用乃定法銀一兩不得過寶泉三百貫凡物可直銀三兩以下者不許用銀以上者三分為率一分用銀二分用寶泉及珍貨重寶京師及州郡置平準務以寶泉銀相易其私易及違法而能告者罪賞有差是令既下市肆晝閉商旅不行朝廷患之乃除市易用銀及銀寶泉私相易之法然上有限用之名而下無從令之實有司雖知莫能制矣義宗正大間民間但以銀市易天興二年十月印天興寶會于蔡州自一錢至四錢四等同見銀流轉不數月國亡
