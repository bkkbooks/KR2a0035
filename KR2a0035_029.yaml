body:
  text: 金史卷二十九志第十禮二方丘儀朝日夕月儀高禖方丘儀齋戒祭前三日質明有司設三獻以下行事官位於尚書省初獻南面監祭御史位於西東向監禮博士位於東西向俱北上司徒亞終獻位於南北向次光祿卿太常卿次第一等分獻官司天監次第二等分獻官光祿丞郊社令大樂令良醞令廪犧令司尊彝次內壝內外分獻官太祝官奉禮郎協律郎諸執事官就位立定次禮直官引初獻就位初獻讀誓曰今年五月幾日夏至祭皇地祇於方丘所有攝官各揚其職其或不敬國有常刑讀畢禮直官贊七品以下官先退餘官對拜訖退散齋二日宿於正寢治事如故齋禁並如郊祀守壝門兵衛與大樂工人俱清齋一宿行禮官前期習儀於祠所陳設祭前三日所司設三獻官以下行事執事官次於外壝東門之外道南北向西上隨地之宜又設饌幕於內壝東門之外道北南向祭前二日所司設兵衛各服其服守衛壝門每門二人大樂令帥其屬設登歌之樂於壇上如郊祀郊社令帥其屬掃除壇之上下為瘞坎在內壝外之壬地祭前一日司天監郊社令各服其服帥其屬升設皇地祇神座於壇上北方南向席以藁秸又設配位神座於東方西向席以蒲越又設神州地祇神座於壇之第一等東南方席以藁秸又設五神五官嶽鎮海瀆二十九座於第二等階之間各依方位又設崑崙山林川澤二十一座於內壝之內又設丘陵墳衍原隰三十座於內壝外席皆以莞又設神位版各於座首子陛之西水神玄冥北嶽北鎮北海北瀆於壇之第二等北山北林北川北澤於內壝內北丘北陵北墳北衍北原北隰於內壝外皆各為一列以東為上卯陛之北木神勾芒東嶽長白山東鎮東海東瀆於壇之第二等東山東林東川東澤於內壝內東丘東陵東墳東衍東原東隰於內壝外皆各為一列以南為上午陛之東神州地祇於壇之第一等火神祝融南嶽南鎮南海南瀆於壇之第二等南山南林南川南澤於內壝內南丘南陵南墳南衍南原南隰於內壝外皆各為一列以西為上午陛之西土神后土中嶽中鎮於壇之第二等中山中林中川中澤於內壝內中丘中陵中墳中衍中原中隰於內壝外皆各為一列以南為上酉陛之南金神蓐收西嶽西鎮西海西瀆於壇之第二等崑崙西山西林西川西澤於內壝內西丘西陵西墳西衍西原西隰於內壝外皆各為一列以北為上其皇地祇及配位神州地祇之座並禮神之玉設訖俟告潔畢權徹祭日早重設其第二等以下神座設定不收奉禮郎禮直官又設三獻官位於卯陛之東稍北西向司徒位於卯陛之東道南西向太常卿光祿卿位次之第一等分獻官司天監位於其東光祿丞郊社令太官令廪犧令位又在其東每等異位重行俱西向北上又設太祝奉禮郎及諸執事位於內壝東門外道南每等異位重行俱西向北上設監祭御史二位一於壇下午陛之西南一於子陛之西北俱東向設監禮博士二位一於壇下午陛之東南一於子陛之東北俱西向奉禮郎位於壇之東南西向協律郎位於樂簴西北東向大樂令位於樂簴之間西向司尊彝位於酌尊所俱北向設望瘞位坎之南北向又設牲榜位於內壝東門之外西向太祝祝史各位於牲後俱西向設省饌位於牲西太常卿光祿卿太官令位於牲北南向西上監祭監禮位在太常卿之西稍却西上廪犧令位於牲西南北向又陳禮饌於內壝東門之外道北南向設省饌位於禮饌之南太常卿光祿卿太官令位在東西向監祭監禮位在西東向俱北上設祝版於神位之右司尊及奉禮郎帥其屬設玉幣篚於酌尊所次及籩豆之位正配位各左有十一籩右有十一豆俱為三行登三在籩豆間鉶三在登前簠一簋一各在鉶前又設尊罍之位皇地祇太尊二著尊二犧尊二山罍二在壇上東南隅配位著尊二犧尊二象尊二山罍二在正位酒尊之東俱北向西上皆有坫加勺為酌尊所又設皇地祇位象尊二壺尊二山罍四在壇下午陛之西北向西上配位犧尊二壺尊二山罍四在酉陛之北東向北上皆有坫加設而不酌神州地祇位左八籩右八豆登一在籩豆間簠一簋一在登前爵坫一在神座前又設第二等諸神位每位籩二豆二簠一簋一俎一爵坫一內壝之內外諸神每位籩一豆一簠一簋一俎一爵坫一陳列皆與上同又設神州地祇太尊二著尊二皆有坫第二等諸神每方山尊二內壝內每方蜃尊二內壝外每方概尊二皆加勺又設正配位籩一豆一簠一簋一俎三及毛血豆一並神州地祇位俎一各於饌幕內又設二洗於壇下卯陛之東北向盥洗在東爵洗在西並有罍加勺篚在洗西南肆實以巾爵洗之篚實以匏爵加坫又設第一等分獻官盥洗爵洗位第二等以下分獻官盥洗位各於其方道之左罍在洗左篚在洗右俱內向執罍篚者各於其後祭日丑前五刻司天監郊社令帥其屬升設皇地祇及配位神座於壇上設神州地祇座於第一等又設玉幣皇地祇玉以黃琮神州地祇玉以兩圭有邸皆置於匣正配位幣並以黃色神州地祇幣以玄色五神五官嶽鎮海瀆之幣各從其方色皆陳於篚太祝取瘞玉加於幣於禮神之玉各置於神座前光祿卿帥其屬入實正配位籩豆籩三行以右為上豆三行以左為上其實並如郊祀登實以大羹鉶實以和羹又設從祭第一等神州地祇之饌籩三行以右為上豆三行以左為上其實並如郊祀登實以大羹簠實以稷簋實以黍第二等每位左二籩栗在前鹿脯次之右二豆菁菹在前鹿臡次之簠實以稷簋實以黍俎一羊一豕內壝內外每位左籩一鹿脯右豆一鹿臡簠稷簋黍俎以羊良醞令帥其屬入實酒尊皇地祇太尊為上實以泛齊著尊次之實以醴齊犧尊次之實以盎齊象尊次之實以醍齊壺尊次之實以沈齊山罍為下實以三酒配位著尊為上實以泛齊犧尊次之實以醴齊象尊次之實以盎齊壺尊次之實以醍齊山罍為下實以三酒皆左實明水右實玄酒皆尚醞代次實從祭第一等神州地祇酒尊太尊為上實以泛齊著尊次之實以醴齊第二等山尊實以醍齊內壝內蜃尊實以泛齊內壝外概尊實以三酒以上尊皆左以明水右以玄酒皆尚醞代之太常卿設燭於神座前省牲器祭前一日午後八刻去壇二百步禁止行者未後二刻郊社令帥其屬掃除壇之上下司尊與奉禮郎帥執事者以祭器入設於位郊社令陳玉幣於篚未後三刻廪犧令與諸太祝祝史以牲就省位禮直官贊者分引太常卿光祿卿丞監禮祭太官令等詣內壝東門外省牲位其視滌濯告潔省牲饌並同郊祀俱畢廪犧令諸太祝祝史以次牽牲詣授太官令次引光祿卿以下詣省鼎鑊視滌溉乃還齋所晡後一刻太官令帥宰人以鸞刀割牲祝史各取毛血實以豆置於饌幔遂烹牲又祝史取瘞血貯於盤奠玉幣祭日丑前五刻獻官以下行事官各服其服有司設神位版陳玉幣實籩豆簠簋尊罍俟監祭監禮按視壇之上下乃徹去蓋大樂令帥工人及奉禮郎贊者先入禮直官贊者分引分獻官以下監祭監禮諸大祝祝史齋郎與執事者入自南壝東門當壇南重行北向西上立定奉禮郎贊拜獻官以下皆再拜訖以次分引各就壇陛上下位次引監祭監禮按視壇之上下訖退復位禮直官分引三獻官以下行事官俱入就位行禮官皆自南壝東門入禮直官進立初獻之左白曰有司謹具請行事退復位協律郎高舉笏執麾者舉麾俯伏興工鼓柷樂作坤寧之曲八成偃麾戞敔樂止俟太常卿瘞血訖奉禮郎贊拜在位者皆再拜又贊諸執事者各就位禮直官引諸執事各就其位俟太祝跪取玉幣於篚立於尊所諸位太祝亦各取玉幣立於尊所禮直官引初獻詣盥洗位樂作肅寧之曲至位北向立樂止搢笏盥手帨手執笏詣壇樂作肅寧之曲凡初獻升降皆作肅寧之曲升自卯階至壇樂止詣皇地祇神座前北向立樂作靜寧之曲搢笏跪太祝加玉於幣西向跪以授初獻初獻受玉幣奠訖執笏俯伏興再拜訖樂止次詣配位神座前東向立樂作億寧之曲奠幣如上儀樂止降自卯陛樂作復位樂止初獻將奠配位之幣贊者引第一等分獻官詣盥洗位搢笏盥手帨手執笏由卯陛詣神州地祇神座前搢笏跪太祝以玉幣授分獻官分獻官受玉幣奠訖執笏俯伏興再拜訖退初第一分獻官將升贊者引第二分獻官詣盥洗位盥手帨手執笏各由其陛升唯不由午陛詣於首位神座前奠幣如上儀餘以次祝史齋郎助奠訖各引還位初獻奠幣將畢祝史奉毛血豆各由午陛升諸太祝迎於壇上進奠於正配位神座前太祝與祝史俱退立於尊所進熟初獻既升奠玉幣有司先陳牛鼎二羊鼎二豕鼎二於神各在鑊右太官帥進饌者詣以匕升牛羊豕自鑊實於各鼎牛羊豕各肩臂臑肫胳正脊一橫脊一長脅一短脅一代脅一皆二骨以並之祝史以扃各對舉鼎有司執匕以從陳於饌幔內從祀之俎實以羊更陳於饌幔內光祿卿實以籩豆簠簋籩實以粉餈豆實以糝食簠實以稷簋實以黍實訖去鼎之扃匕加於鼎太官令以匕升牛羊豕載於俎肩臂臑在上端肫胳在下端脊脅在中俟初獻還位樂止禮直官引司徒出詣饌所同薦籩豆簠簋俎齋郎各奉皇地祇配位之饌升自卯陛諸太祝各迎於壇上司徒詣皇地祇神座前搢笏奉籩豆簠簋次奉俎北向跪奠訖執笏俯伏興設籩於糗餌之前豆於醓醢之前簠簋在登前俎在籩前次於卯陛奉配位之饌東向跪奠於神座前並如上儀各降自卯陛還位太官令又同齋郎奉神州地祇之饌升自卯陛太祝迎於壇陛之道間奠於神座前在籩前訖樂止太官令進饌者降自卯陛還位禮直官引初獻官詣盥洗位樂作至位樂止北向立搢笏盥手帨手執笏詣爵洗位至位北向立搢笏洗爵拭爵以授執事者執笏詣壇樂作升自卯陛至壇上樂止詣皇地祇酌尊所西向立執事者以爵授初獻初獻搢笏執爵司尊舉良醞令跪酌太尊之泛齊酌訖初獻以爵授執事者執笏詣皇地祇神座前北向立搢笏跪執事者以爵授初獻初獻執爵三祭酒於茅苴奠爵三獻奠爵皆執事者受以興執笏俯伏興少退跪樂止舉祝官跪對舉祝版讀祝太祝東向跪讀祝訖俯伏興舉祝奠版於案再拜興次詣配位酌尊所執事者以爵授初獻初獻搢笏執爵司尊舉良醞令跪酌著尊之泛齊樂作太簇宮保寧之曲初獻以爵授執事者執笏詣配位神座前東向立搢笏跪執事者以爵授初獻初獻執爵三奠酒於茅苴奠爵執笏俯伏興少退跪樂止讀祝訖樂作就拜興拜興降自卯陛讀祝舉祝官俱從樂作復位樂止次引亞獻詣盥洗位北向立搢笏盥手帨手執笏詣爵洗位北向立搢笏洗爵拭爵授執事者執笏升自卯陛詣皇地祇酌尊所西向立執事者以爵授亞獻亞獻搢笏執爵司尊舉良醞令酌著尊之醴齊酌訖以爵授執事者執笏詣皇地祇神座前北向立搢笏跪執事以爵授亞獻亞獻執爵三祭酒於茅苴奠爵執笏俯伏興少退再拜次詣配位酌獻如上儀唯酌犧尊為異樂止降復位次引終獻詣盥洗位盥手帨手洗爵拭爵以爵授執事者升壇正位酌犧尊之盎齊配位酌象尊之醴齊奠獻並如亞獻之儀禮畢降復位初終獻將升贊者引第一等分獻官詣盥洗位搢笏盥手帨手洗爵拭爵以爵授執事者執笏詣神州地祇酌尊所搢笏執事者以爵授獻官獻官執爵執事者酌太尊之泛齊酌訖以爵授執事者進詣神座前搢笏跪執事者以爵授獻官獻官執爵三祭酒於茅苴奠爵俯伏興少退跪再拜訖還位初第一等分獻官將升贊者分引第二等分獻官詣盥洗位搢笏盥手帨手執笏詣酌尊所執事以爵授分獻官酌以授執事者進詣首位神座前奠獻並如上儀祝史齋郎以次助奠訖各引還位諸獻俱畢諸太祝進徹籩豆籩豆各一少移故處樂作豐